\n", "alignment": "left", "unique_id": "8bbb8eb250d1887d4d14fd145c9e7292", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "yc827@cs.rutgers.edu, zz124@scarletmail.rutgers.edu"}], "lineHeight": 0}}, "target": {"markdown": "yc827@cs.rutgers.edu，zz124@scarletmail.rutgers.edu", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "e7e0ec22ceea688c6dd73c61c2c90b64", "index": 5, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Abstract—NVIDIA's software does not offer translation of assembly code to binary for their GPUs, since the specifications are closed-source. This work fills that gap. We develop a systematic method of decoding the Instruction Set Architectures (ISAs) of NVIDIA's GPUs, and generating assemblers for different generations of GPUs. Our framework enables cross-architecture binary analysis and transformation. Making the ISA accessible in this manner opens up a world of opportunities for developers and researchers, enabling numerous optimizations and explorations that are unachievable at the source-code level. Our infrastructure has already benefited and been adopted in important applications including performance tuning, binary instrumentation, resource allocation, and memory protection.  \n\n", "text": "Abstract—NVIDIA's software does not offer translation of assembly code to binary for their GPUs, since the specifications are closed-source. This work fills that gap. We develop a systematic method of decoding the Instruction Set Architectures (ISAs) of NVIDIA's GPUs, and generating assemblers for different generations of GPUs. Our framework enables cross-architecture binary analysis and transformation. Making the ISA accessible in this manner opens up a world of opportunities for developers and researchers, enabling numerous optimizations and explorations that are unachievable at the source-code level. Our infrastructure has already benefited and been adopted in important applications including performance tuning, binary instrumentation, resource allocation, and memory protection.\n", "alignment": "left", "unique_id": "e7e0ec22ceea688c6dd73c61c2c90b64", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract—NVIDIA's software does not offer translation of assembly code to binary for their GPUs, since the specifications are closed-source. This work fills that gap. We develop a systematic method of decoding the Instruction Set Architectures (ISAs) of NVIDIA's GPUs, and generating assemblers for different generations of GPUs. Our framework enables cross-architecture binary analysis and transformation. Making the ISA accessible in this manner opens up a world of opportunities for developers and researchers, enabling numerous optimizations and explorations that are unachievable at the source-code level. Our infrastructure has already benefited and been adopted in important applications including performance tuning, binary instrumentation, resource allocation, and memory protection."}], "lineHeight": 0}}, "target": {"markdown": "由于规格说明不公开，NVIDIA 的软件并不提供针对其 GPU 的汇编代码到二进制的翻译。本文填补了这一空白。我们开发了一种系统化的方法，用于解码 NVIDIA GPU 的指令集架构（ISA），并为不同代际的 GPU 生成汇编器。我们的框架支持跨架构的二进制分析与转换。以这种方式使 ISA 变得易于使用，为开发者和研究人员打开了一扇机遇之门，能够完成众多在源代码层面无法实现的优化与探索。我们的基础设施已经在性能调优、二进制插桩、资源分配以及内存保护等重要应用中得到了应用并被采纳。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "e447f72b66c0b919fdf7037b5ed7d32e", "index": 6, "aliyun_index": 7, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Index Terms—CUDÀ, GPU, Code Generation, Code Translation and Transformation, Instruction Set Architecture (ISA)  \n\n", "text": "Index Terms—CUDÀ, GPU, Code Generation, Code Translation and Transformation, Instruction Set Architecture (ISA)\n", "alignment": "left", "unique_id": "e447f72b66c0b919fdf7037b5ed7d32e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Index Terms—CUDÀ, GPU, Code Generation, Code Translation and Transformation, Instruction Set Architecture (ISA)"}], "lineHeight": 0}}, "target": {"markdown": "索引术语—CUDA、GPU、代码生成、代码翻译与转换、指令集架构（ISA）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "6c86d4ad31850d3033de921c2afaf9c4", "index": 7, "aliyun_index": 8, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "# I. INTRODUCTION  \n\n", "text": "I. INTRODUCTION\n", "alignment": "left", "unique_id": "6c86d4ad31850d3033de921c2afaf9c4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "I. INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "## I. 引言", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "4bde787e3d56f8861650a6bb8e64a4d8", "index": 8, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "The CUDA parallel computing platform developed by NVIDIA has benefited greatly from the popularity of their powerful GPU hardware, seeing widespread use. But the proprietary, closed-source nature of this platform makes research more difficult and limited. Although NVIDIA provides documentation of the intermediate language, they provide very little information about the hardware-specific instruction sets.  \n\n", "text": "The CUDA parallel computing platform developed by NVIDIA has benefited greatly from the popularity of their powerful GPU hardware, seeing widespread use. But the proprietary, closed-source nature of this platform makes research more difficult and limited. Although NVIDIA provides documentation of the intermediate language, they provide very little information about the hardware-specific instruction sets.\n", "alignment": "left", "unique_id": "4bde787e3d56f8861650a6bb8e64a4d8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The CUDA parallel computing platform developed by NVIDIA has benefited greatly from the popularity of their powerful GPU hardware, seeing widespread use. But the proprietary, closed-source nature of this platform makes research more difficult and limited. Although NVIDIA provides documentation of the intermediate language, they provide very little information about the hardware-specific instruction sets."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA 开发的 CUDA 并行计算平台得益于其强大的 GPU 硬件的普及，得到了广泛的应用。然而，该平台专有且闭源的特性使研究变得更加困难和受限。尽管 NVIDIA 提供了中间语言的文档，但他们对硬件相关指令集提供的信息却非常有限。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "f220f870c8829cd9c19cea8d191918b5", "index": 9, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Open-sourcing of software and hardware has two-fold benefits. The level of documentation that open-sourcing permits allows for better tuning of specific software. It also allows the community to spot errors and security flaws that can be corrected before they become more widespread.  \n\n", "text": "Open-sourcing of software and hardware has two-fold benefits. The level of documentation that open-sourcing permits allows for better tuning of specific software. It also allows the community to spot errors and security flaws that can be corrected before they become more widespread.\n", "alignment": "left", "unique_id": "f220f870c8829cd9c19cea8d191918b5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Open-sourcing of software and hardware has two-fold benefits. The level of documentation that open-sourcing permits allows for better tuning of specific software. It also allows the community to spot errors and security flaws that can be corrected before they become more widespread."}], "lineHeight": 0}}, "target": {"markdown": "开源软硬件具有双重裨益。开源所能提供的文档水平，有助于针对特定软件进行更好的优化；同时，它也使社区能够在错误和安全漏洞广泛扩散之前将其发现并予以修正。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "ff24beb9c704925cf32529e8bd8394c1", "index": 10, "aliyun_index": 11, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Openness of an instruction set architecture (ISA), in particular, allows the development of more effective compilation techniques. The proprietary compiler is not guaranteed to be optimal when generating executable code. Indeed, it is usually the case that code can be further tuned to improve its efficiency. For example, by using known instruction encoding to tune allocation and scheduling, several works  $ [1] $   $ [2] $   $ [3] $   $ [4] $  are able to achieve performance beyond that of what NVIDIA's compiler, nvcc, can produce on its own. Furthermore, several other works  $ [5] $   $ [6] $   $ [7] $   $ [8] $   $ [9] $   $ [10] $  demonstrate that modifications to the binary code can allow for useful techniques that are impossible for a programmer to fully implement in source or intermediate language.  \n\n", "text": "Openness of an instruction set architecture (ISA), in particular, allows the development of more effective compilation techniques. The proprietary compiler is not guaranteed to be optimal when generating executable code. Indeed, it is usually the case that code can be further tuned to improve its efficiency. For example, by using known instruction encoding to tune allocation and scheduling, several works  $ [1] $   $ [2] $   $ [3] $   $ [4] $  are able to achieve performance beyond that of what NVIDIA's compiler, nvcc, can produce on its own. Furthermore, several other works  $ [5] $   $ [6] $   $ [7] $   $ [8] $   $ [9] $   $ [10] $  demonstrate that modifications to the binary code can allow for useful techniques that are impossible for a programmer to fully implement in source or intermediate language.\n", "alignment": "left", "unique_id": "ff24beb9c704925cf32529e8bd8394c1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Openness of an instruction set architecture (ISA), in particular, allows the development of more effective compilation techniques. The proprietary compiler is not guaranteed to be optimal when generating executable code. Indeed, it is usually the case that code can be further tuned to improve its efficiency. For example, by using known instruction encoding to tune allocation and scheduling, several works  $ [1] $   $ [2] $   $ [3] $   $ [4] $  are able to achieve performance beyond that of what NVIDIA's compiler, nvcc, can produce on its own. Furthermore, several other works  $ [5] $   $ [6] $   $ [7] $   $ [8] $   $ [9] $   $ [10] $  demonstrate that modifications to the binary code can allow for useful techniques that are impossible for a programmer to fully implement in source or intermediate language."}], "lineHeight": 0}}, "target": {"markdown": "指令集架构（ISA）的开放性，尤其有助于开发更高效的编译技术。专有的编译器在生成可执行代码时并不保证是最优的。事实上，代码通常可以被进一步调优以提高其效率。例如，通过利用已知的指令编码来调整分配和调度，已有若干研究工作 $[1]$ $[2]$ $[3]$ $[4]$ 能够实现超越 NVIDIA 自家编译器 nvcc 所能达到的性能。此外，其他若干研究工作 $[5]$ $[6]$ $[7]$ $[8]$ $[9]$ $[10]$ 表明，对二进制代码进行修改可以实现一些有用的技术，而这些技术是程序员无法在源代码或中间语言层面完全实现的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "5e8d2fecabe78007395b426208ad33a0", "index": 11, "aliyun_index": 12, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "An instruction set architecture (ISA) acts as the interface between software and hardware. The ISA allows independent development of software and hardware. The details the ISA describes, such as binary instruction encoding and data types, are vital to the development of compilers. An open ISA helps research in GPU micro-architecture. There is a large number  \n\n", "text": "An instruction set architecture (ISA) acts as the interface between software and hardware. The ISA allows independent development of software and hardware. The details the ISA describes, such as binary instruction encoding and data types, are vital to the development of compilers. An open ISA helps research in GPU micro-architecture. There is a large number\n", "alignment": "left", "unique_id": "5e8d2fecabe78007395b426208ad33a0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "An instruction set architecture (ISA) acts as the interface between software and hardware. The ISA allows independent development of software and hardware. The details the ISA describes, such as binary instruction encoding and data types, are vital to the development of compilers. An open ISA helps research in GPU micro-architecture. There is a large number"}], "lineHeight": 0}}, "target": {"markdown": "指令集架构（ISA）是软硬件之间的接口。借助 ISA，软件和硬件可以独立开发。ISA 所描述的细节（例如二进制指令编码和数据类型）对编译器的开发至关重要。开放的 ISA 有助于 GPU 微架构的研究。已有大量", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "a8759dd7bd05613816e3221c3ef7cb3b", "index": 12, "aliyun_index": 13, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "of GPU works that rely on GPUGPU-Sim [11]. However, the\ncycle-level GPU simulator is unable to run the binary code\nused by actual NVIDIA devices, thus reducing its accuracy\n- as well as the accuracy of any works which make use of\nit. Further, an open ISA may help enhance GPU security: the\nwork by Hayes and others [10] showed that understanding\nthe ISA details is a necessity when tracking and protecting\nsensitive data across the whole system.  \n\n", "text": "of GPU works that rely on GPUGPU-Sim [11]. However, the\ncycle-level GPU simulator is unable to run the binary code\nused by actual NVIDIA devices, thus reducing its accuracy\n- as well as the accuracy of any works which make use of\nit. Further, an open ISA may help enhance GPU security: the\nwork by Hayes and others [10] showed that understanding\nthe ISA details is a necessity when tracking and protecting\nsensitive data across the whole system.\n", "alignment": "left", "unique_id": "a8759dd7bd05613816e3221c3ef7cb3b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of GPU works that rely on GPUGPU-Sim [11]. However, the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cycle-level GPU simulator is unable to run the binary code"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "used by actual NVIDIA devices, thus reducing its accuracy"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "- as well as the accuracy of any works which make use of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "it. Further, an open ISA may help enhance GPU security: the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "work by Hayes and others [10] showed that understanding"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the ISA details is a necessity when tracking and protecting"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "sensitive data across the whole system."}], "lineHeight": -212}}, "target": {"markdown": "GPU 相关研究工作依赖于 GPGPU-Sim [11]。然而，由于该周期级 GPU 仿真器无法运行实际 NVIDIA 设备所使用的二进制代码，因此其准确性较低——使用它的任何工作的准确性也同样受到影响。此外，开放的 ISA 或许有助于增强 GPU 安全性：Hayes 等人的研究 [10] 表明，在跨整个系统跟踪和保护敏感数据时，掌握 ISA 的细节是必不可少的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_ der": 13}, {"source": {"block_id": "1ff78cf47944f9e4f085cb2d49b7c52d", "index": 14, "aliyun_index": 15, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "In particular, we make the following contributions:  \n\n", "text": "In particular, we make the following contributions:\n", "alignment": "left", "unique_id": "1ff78cf47944f9e4f085cb2d49b7c52d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In particular, we make the following contributions:"}], "lineHeight": 0}}, "target": {"markdown": "具体而言，我们做出了以下贡献：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "97def4a41f055de58015f26a46b7446f", "index": 15, "aliyun_index": 16, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• We design a method which largely automates the creation of a GPU assembler. $^{1}$ The method first analyzes binary code and then generates a translator for converting assembly code to binary code. This automation allows researchers to quickly add support for new ISAs.  \n\n", "text": "• We design a method which largely automates the creation of a GPU assembler. $^{1}$ The method first analyzes binary code and then generates a translator for converting assembly code to binary code. This automation allows researchers to quickly add support for new ISAs.\n", "alignment": "left", "unique_id": "97def4a41f055de58015f26a46b7446f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We design a method which largely automates the creation of a GPU assembler. $^{1}$ The method first analyzes binary code and then generates a translator for converting assembly code to binary code. This automation allows researchers to quickly add support for new ISAs."}], "lineHeight": 0}}, "target": {"markdown": "• 我们设计了一种能够大幅自动化生成 GPU 汇编器的方法。$^{1}$ 该方法首先分析二进制代码，然后生成一个用于将汇编代码转换为二进制代码的翻译器。这种自动化使研究人员能够快速增加对新 ISA 的支持。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "305c6833b19b0ad2633b4ad77b57d5f0", "index": 16, "aliyun_index": 17, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• We provide the binary encoding for multiple existing GPU architectures, including how operands and opcodes are mapped to 0s and 1s, and how instruction dependence is handled. We have made our findings freely available on Zenodo, with opcodes at [13], and operands at [14].  \n\n", "text": "• We provide the binary encoding for multiple existing GPU architectures, including how operands and opcodes are mapped to 0s and 1s, and how instruction dependence is handled. We have made our findings freely available on Zenodo, with opcodes at [13], and operands at [14].\n", "alignment": "left", "unique_id": "305c6833b19b0ad2633b4ad77b57d5f0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We provide the binary encoding for multiple existing GPU architectures, including how operands and opcodes are mapped to 0s and 1s, and how instruction dependence is handled. We have made our findings freely available on Zenodo, with opcodes at [13], and operands at [14]."}], "lineHeight": 0}}, "target": {"markdown": "• 我们提供了多种现有 GPU 架构的二进制编码，包括操作数和操作码如何映射为 0 和 1，以及指令依赖关系是如何处理的。我们已将研究成果在 Zenodo 上免费公开，操作码详见 [13]，操作数详见 [14]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "b39a126f3c3301d5a64789b4d173588b", "index": 17, "aliyun_index": 18, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• We provide the GPU ELF file format in Zenodo [15], which is necessary for complete editing of executable.  \n\n", "text": "• We provide the GPU ELF file format in Zenodo [15], which is necessary for complete editing of executable.\n", "alignment": "left", "unique_id": "b39a126f3c3301d5a64789b4d173588b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We provide the GPU ELF file format in Zenodo [15], which is necessary for complete editing of executable."}], "lineHeight": 0}}, "target": {"markdown": "• 我们在 Zenodo [15] 上提供了 GPU ELF 文件格式，这对于完整编辑可执行文件是必需的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "b622236886070766c42372e338c05884", "index": 18, "aliyun_index": 19, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• Our techniques and framework have demonstrated compatibility with at least four consecutive major versions of NVIDIA devices: Compute Capability 2.x (Fermi), Compute Capability 3.x (Kepler), Compute Capability 5.x (Maxwell) and Compute Capability 6.x (Pascal).  \n\n", "text": "• Our techniques and framework have demonstrated compatibility with at least four consecutive major versions of NVIDIA devices: Compute Capability 2.x (Fermi), Compute Capability 3.x (Kepler), Compute Capability 5.x (Maxwell) and Compute Capability 6.x (Pascal).\n", "alignment": "left", "unique_id": "b622236886070766c42372e338c05884", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontN ://github.com/decodecudabinary/Decoding-CUDA-Binary."}], "lineHeight": 0}}, "target": {"markdown": "• 我们开发了一个可扩展的框架，用于支持对汇编代码进行分析和转换，以便与 GPU 汇编器配合使用，该框架已被多项研究工作所采用 [6] [7] [10] [12]。我们的框架已在 GitHub 上开源，地址为 https://github.com/decodecudabinary/Decoding-CUDA-Binary。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "968f67b1c2460626a06bda3bf2eded7f", "index": 20, "aliyun_index": 21, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Prior studies have been trying to understand the hidden\nworkings of NVIDIA's devices. The work by Wong et al.\n[16] focuses on micro-architecture details such as cache design\nand memory latency. There have also been efforts at decoding\nbinary instructions: Hou et al. [17] created an assembler for\nCompute Capability 2.x, Zhang et al. [4] decoded Compute\nCapability 3.x instructions used in an SGEMM implementation, Gray [3] developed an assembler for Compute Capability  \n\n", "text": "Prior studies have been trying to understand the hidden\nworkings of NVIDIA's devices. The work by Wong et al.\n[16] focuses on micro-architecture details such as cache design\nand memory latency. There have also been efforts at decoding\nbinary instructions: Hou et al. [17] created an assembler for\nCompute Capability 2.x, Zhang et al. [4] decoded Compute\nCapability 3.x instructions used in an SGEMM implementation, Gray [3] developed an assembler for Compute Capability\n", "alignment": "left", "unique_id": "968f67b1c2460626a06bda3bf2eded7f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Prior studies have been trying to understand the hidden"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "workings of NVIDIA's devices. The work by Wong et al."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[16] focuses on micro-architecture details such as cache design"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and memory latency. There have also been efforts at decoding"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "binary instructions: Hou et al. [17] created an assembler for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compute Capability 2.x, Zhang et al. [4] decoded Compute"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Capability 3.x instructions used in an SGEMM implementation, Gray [3] developed an assembler for Compute Capability"}], "lineHeight": -212}}, "target": {"markdown": "先前的研究一直试图揭示 NVIDIA 设备的内部工作机制。Wong 等人的研究 [16] 聚焦于微架构层面的细节，例如缓存设计和内存延迟。此外，也有一些工作致力于解码二进制指令：Hou 等人 [17] 为计算能力 2.x 开发了一个汇编器；Zhang 等人 [4] 对 SGEMM 实现中使用的计算能力 3.x 指令进行了解码；Gray [3] 为计算能力", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "2fc9b4cfb51bf99035ac888c1fa81e10", "index": 21, "aliyun_index": 22, "page_num": 0, "type": "corner_note", "sub_type": "none", "markdown": ">$ ^{1} $  Artifact available at: https://doi.org/10.5281/zenodo.2337060  \n\n", "text": "$ ^{1} $  Artifact available ehensive and cross-architecture framework that is useful for general-purpose and future-proof applications."}], "lineHeight": 0}}, "target": {"markdown": "5.x 开发了一个汇编器；Jia 等人 [18] 对计算能力 7.x 指令进行了解码。这些已有工作均仅限于特定的架构代际，在某些情况下甚至仅限于特定的应用场景。而我们的工作则是一个全面的、跨架构的框架，可用于通用且面向未来应用的需求。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "23e61a3c8c4c99936e64f23c800dca41", "index": 23, "aliyun_index": 1, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The rest of the paper is organized as follows. In Section II, we provide an overview of our framework. We compare CPU ISA with GPU ISA in Section II-B. Section III describes our automatic decoding method. Section IV summarizes our findings for different generations of NVIDIA GPUs. Section V outlines applications of our framework. We discuss related works in Section VI.  \n\n", "text": "The rest of the paper is organized as follows. In Section II, we provide an overview of our framework. We compare CPU ISA with GPU ISA in Section II-B. Section III describes our automatic decoding method. Section IV summarizes our findings for different generations of NVIDIA GPUs. Section V outlines applications of our framework. We discuss related works in Section VI.\n", "alignment": "left", "unique_id": "23e61a3c8c4c99936e64f23c800dca41", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The rest of the paper is organized as follows. In Section II, we provide an overview of our framework. We compare CPU ISA with GPU ISA in Section II-B. Section III describes our automatic decoding method. Section IV summarizes our findings for different generations of NVIDIA GPUs. Section V outlines applications of our framework. We discuss related works in Section VI."}], "lineHeight": 0}}, "target": {"markdown": "本文的其余部分组织如下。在第二节中，我们概述了我们的框架。在第 II-B 节中，我们将 CPU ISA 与 GPU ISA 进行比较。第三节描述了我们的自动解码方法。第四节概括了我们对不同代际 NVIDIA GPU 的研究发现。第五节阐述了我们的框架的应用。第六节讨论了相关工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "aab69533ea233f66fd32cedca46f25e7", "index": 24, "aliyun_index": 2, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# II. OVERVIEW AND BACKGROUND  \n\n", "text": "II. OVERVIEW AND BACKGROUND\n", "alignment": "left", "unique_id": "aab69533ea233f66fd32cedca46f25e7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "II. OVERVIEW AND BACKGROUND"}], "lineHeight": 0}}, "target": {"markdown": "# II. OVERVIEW AND BACKGROUND\n\n## A. Framework Overview", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "771b0ba0399c605662c6ebc7b58903d1", "index": 25, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The assembly code used for NVIDIA devices is known as \"SASS\", which corresponds exactly to the actual binary code. Most details of SASS are kept secret. In addition to the closed-source compiler, nvcc, NVIDIA provides a closed-source disassembler called cuobjdump, which can translate the binary into SASS assembly code. However, NVIDIA offers no means of translating the SASS to binary, leaving researchers unable to make use of the assembly code. Our work fills this gap.  \n\n", "text": "The assembly code used for NVIDIA devices is known as \"SASS\", which corresponds exactly to the actual binary code. Most details of SASS are kept secret. In addition to the closed-source compiler, nvcc, NVIDIA provides a closed-source disassembler called cuobjdump, which can translate the binary into SASS assembly code. However, NVIDIA offers no means of translating the SASS to binary, leaving researchers unable to make use of the assembly code. Our work fills this gap.\n", "alignment": "left", "unique_id": "771b0ba0399c605662c6ebc7b58903d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The assembly code used for NVIDIA devices is known as \"SASS\", which corresponds exactly to the actual binary code. Most details of SASS are kept secret. In addition to the closed-source compiler, nvcc, NVIDIA provides a closed-source disassembler called cuobjdump, which can translate the binary into SASS assembly code. However, NVIDIA offers no means of translating the SASS to binary, leaving researchers unable to make use of the assembly code. Our work fills this gap."}], "lineHeight": 0}}, "target": {"markdown": "用于 NVIDIA 设备的汇编代码被称为 \"SASS\"，它与实际的二进制代码完全对应。SASS 的大部分细节都被保密。除了闭源的编译器 nvcc 之外，NVIDIA 还提供了一个名为 cuobjdump 的闭源反汇编器，它可以将二进制代码翻译为 SASS 汇编代码。然而，NVIDIA 并没有提供将 SASS 翻译为二进制代码的方法，使研究人员无法直接使用这些汇编代码。我们的工作填补了这一空白。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "e309efb98e57e628c1844b8777c11535", "index": 26, "aliyun_index": 4, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# A. Assembler Generating Framework  \n\n", "text": "A. Assembler Generating Framework\n", "alignment": "left", "unique_id": "e309efb98e57e628c1844b8777c11535", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Assembler Generating Framework"}], "lineHeight": 0}}, "target": {"markdown": "# A. Assembler Generating Framework", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "fd86395daa644b30797e90e9b060f3a0", "index": 27, "aliyun_index": 5, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![fd86395daa644b30797e90e9b060f3a0.jpeg](figures/fd86395daa644b30797e90e9b060f3a0_ebd9297d.png)  \n\n", "text": "以下是根据您提供的流程图提取并整理的合法 Markdown 格式内容，准确保留所有步骤、组件和连接关系：\n\n---\n\n# 指令流处理与代码生成流程图\n\n## 输入源\n\n- **Instruction stream**: (assembly, binary) pairs  \n  → 指向 `ISA Analyzer`\n\n- **source code**  \n  → 指向 `nvcc (closed-source)`\n\n---\n\n## 处理模块（按数据流顺序）\n\n### 1. ISA Analyzer\n- 接收：`Instruction stream: (assembly, binary) pairs`\n- 输出：→ `Assembler Generator`\n\n### 2. Assembler Generator\n- 接收：来自 `ISA Analyzer`\n- 输出：→ `Assembler`\n\n### 3. Assembler\n- 接收：\n  - 来自 `Assembler Generator`\n  - 来自外部输入的 `assembly code`\n- 输出：\n  - → `binary code`\n  - → `cuobjdump (closed-source)` （用于反馈循环）\n\n### 4. cuobjdump (closed-source)\n- 接收：\n  - 来自 `Assembler` 的 `binary code`\n- 输出：\n  - → 返回至 `Instruction stream: (assembly, binary) pairs` （形成闭环）\n  - → 同时输出 `assembly code` 至 `Assembler` （作为另一路输入）\n\n> 注：此模块构成一个反馈回路，将二进制代码反汇编为汇编代码，再送回 assembler 进行验证或迭代。\n\n### 5. nvcc (closed-source)\n- 接收：`source code`\n- 输出：\n  - → `binary code` （直接输出最终目标码）\n  - → 可能间接参与其他路径？图中未明确显示与其他模块的直接连接，仅独立输出 binary code。\n\n---\n\n## 数据流向总结\n\n```mermaid\ngraph TD\n    A[\"Instruction stream:<br>(assembly, binary) pairs\"] --> B[ISA Analyzer]\n    B --> C[Assembler Generator]\n    C --> D[Assembler]\n    E[\"assembly code\"] --> D\n    D --> F[binary code]\n    F --> G[cuobjdump<br>(closed-source)]\n    G --> A\n    G --> E\n    H[source code] --> I[nvcc<br>(closed-source)]\n    I --> F\n```\n\n> 注：上述 Mermaid 图仅为可视化辅助，实际 Markdown 中可省略图形部分，仅保留文字描述。若需嵌入图表，请确保渲染环境支持 Mermaid。\n\n---\n\n## 关键说明\n\n- 所有标有 `(closed-source)` 的模块表示其内部实现不公开。\n- 存在一个**闭环反馈机制**：`binary code` → `cuobjdump` → `(assembly, binary) pairs` → 重新进入分析流程。\n- `nvcc` 是独立编译器，直接从源码生成二进制码，不参与主反馈环。\n- `Assembler` 接收两种输入：由上游生成的汇编代码 + 外部提供的汇编代码（可能用于测试/对比）。\n\n---\n\n✅ 此文档完整还原了原始流程图中的所有元素、箭头方向、标签及逻辑结构，符合信息抽取专家标准。", "alignment": "left", "unique_id": "fd86395daa644b30797e90e9b060f3a0", "edited": false, "extra": {}}, "target": {"markdown": "![fd86395daa644b30797e90e9b060f3a0.jpeg](figures/fd86395daa644b30797e90e9b060f3a0_ebd9297d.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "eda27b74ba2ce490eba575eb720513f1", "index": 28, "aliyun_index": 6, "page_num": 1, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 1. Our assembler generation framework. Our work is highlighted with black background, and the existing tools are in white background.  \n\n", "text": "Fig. 1. Our assembler generation framework. Our work is highlighted with black background, and the existing tools are in white background.\n", "alignment": "left", "unique_id": "eda27b74ba2ce490eba575eb720513f1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 1. Our assembler generation framework. Our work is highlighted with black background, and the existing tools are in white background."}], "lineHeight": 0}}, "target": {"markdown": "> 图 1. 我们的汇编器生成框架。其中，我们的工作以黑色背景突出显示，已有工具则以白色背景表示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "02b5321095691fa6df063f725c07a19f", "index": 29, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "We show our assembler generating framework in Fig. 1. We first use nvcc to generate binary code from source programs, and then we use cuobjdump to retrieve the SASS assembly, as well as the mapping between the assembly and binary. Our ISA Analyzer will automatically generate variants of given {assembly, binary} pairs to enrich the data set for analysis.  \n\n", "text": "We show our assembler generating framework in Fig. 1. We first use nvcc to generate binary code from source programs, and then we use cuobjdump to retrieve the SASS assembly, as well as the mapping between the assembly and binary. Our ISA Analyzer will automatically generate variants of given {assembly, binary} pairs to enrich the data set for analysis.\n", "alignment": "left", "unique_id": "02b5321095691fa6df063f725c07a19f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We show our assembler generating framework in Fig. 1. We first use nvcc to generate binary code from source programs, and then we use cuobjdump to retrieve the SASS assembly, as well as the mapping between the assembly and binary. Our ISA Analyzer will automatically generate variants of given {assembly, binary} pairs to enrich the data set for analysis."}], "lineHeight": 0}}, "target": {"markdown": "我们在图 1 中展示了我们的汇编器生成框架。我们首先使用 nvcc 从源程序生成二进制代码，然后使用 cuobjdump 检索 SASS 汇编代码以及汇编与二进制之间的映射关系。我们的 ISA 分析器会自动为给定的 {汇编, 二进制} 数据对生成变体，以丰富用于分析的数据集。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "168e1031cf697eb58a2f86189049c927", "index": 30, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Next, our ISA Analyzer starts analyzing the binary encoding of different components of each type of instructions, for instance, which bits correspond to opcode, operands, modifiers, etc. The ISA Analyzer yields a list of recorded operations, that is, the set of decoded assembly/binary instructions. An example of the recorded IADD instruction for computing capability 3.5 is shown in Fig. 2.  \n\n", "text": "Next, our ISA Analyzer starts analyzing the binary encoding of different components of each type of instructions, for instance, which bits correspond to opcode, operands, modifiers, etc. The ISA Analyzer yields a list of recorded operations, that is, the set of decoded assembly/binary instructions. An example of the recorded IADD instruction for computing capability 3.5 is shown in Fig. 2.\n", "alignment": "left", "unique_id": "168e1031cf697eb58a2f86189049c927", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Next, our ISA Analyzer starts analyzing the binary encoding of different components of each type of instructions, for instance, which bits correspond to opcode, operands, modifiers, etc. The ISA Analyzer yields a list of recorded operations, that is, the set of decoded assembly/binary instructions. An example of the recorded IADD instruction for computing capability 3.5 is shown in Fig. 2."}], "lineHeight": 0}}, "target": {"markdown": "接下来，我们的 ISA 分析器开始分析每种类型指令中不同组成部分的二进制编码方式，例如哪些位对应操作码、操作数、修饰符等。ISA 分析器会生成一份已记录的操作列表，即解码后的汇编/二进制指令集合。图 2 展示了计算能力 3.5 下已记录的 IADD 指令的一个示例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "a72d78b1481b569351ab10dd1e8459f9", "index": 31, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Our ISA analyzer e  false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our Assembler Generator takes as input the binary encoding"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "information generated by our ISA Analyzer, and outputs an"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Assembler. The generated assembler can convert assembly"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "code to binary code with respect to the underlying GPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "architecture. This corresponds to the conversion from assembly"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to binary in the compilation process shown in Fig. 1."}], "lineHeight": -160}}, "target": {"markdown": "我们的汇编器生成器以 ISA 分析器生成的二进制编码信息作为输入，并输出一个汇编器。生成的汇编器能够根据底层 GPU 架构将汇编代码转换为二进制代码。这对应于图 1 中编译过程中从汇编到二进制的转换。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "4388f091d95e01a314bfc1684c95d1a1", "index": 37, "aliyun_index": 15, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Performing the decoding analysis manually is a slow and arduous process, especially considering the frequency with which the GPU ISA changes - usually once per GPU generation. The framework we developed is important as it can automatically decode the ISA and generate assemblers.  \n\n", "text": "Performing the decoding analysis manually is a slow and arduous process, especially considering the frequency with which the GPU ISA changes - usually once per GPU generation. The framework we developed is important as it can automatically decode the ISA and generate assemblers.\n", "alignment": "left", "unique_id": "4388f091d95e01a314bfc1684c95d1a1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Performing the decoding analysis manually is a slow and arduous process, especially considering the frequency with which the GPU ISA changes - usually once per GPU generation. The framework we developed is important as it can automatically decode the ISA and generate assemblers."}], "lineHeight": 0}}, "target": {"markdown": "手动执行解码分析是一项缓慢且艰巨的工作，尤其是考虑到 GPU ISA 经常发生变化——通常每一代 GPU 都会更新一次。我们所开发的框架具有重要意义，因为它能够自动解码 ISA 并生成汇编器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "87e29ec17984e504c249a49256bd5420", "index": 38, "aliyun_index": 16, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Furthermore, we incorporated our assemblers into a larger\nframework that permits analysis and transformation of as-\nsembly code for multiple GPU architectures, enabling several\napplications which we will discuss in Section V.  \n\n", "text": "Furthermore, we incorporated our assemblers into a larger\nframework that permits analysis and transformation of as-\nsembly code for multiple GPU architectures, enabling several\napplications which we will discuss in Section V.\n", "alignment": "left", "unique_id": "87e29ec17984e504c249a49256bd5420", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Furthermore, we incorporated our assemblers into a larger"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "framework that permits analysis and transformation of as-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "sembly code for multiple GPU architectures, enabling several"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "applications which we will discuss in Section V."}], "lineHeight": -107}}, "target": {"markdown": "此外，我们将生成的汇编器集成到一个更大的框架中，该框架支持针对多种 GPU 架构的汇编代码分析与转换，并支持我们将在第 V 节中讨论的若干应用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "ffabd36dda8ea4941fcbec7bfea9e6bb", "index": 39, "aliyun_index": 17, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# B. Unique CUDA Binary Instructions & Behavior  \n\n", "text": "B. Unique CUDA Binary Instructions & Behavior\n", "alignment": "left", "unique_id": "ffabd36dda8ea4941fcbec7bfea9e6bb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Unique CUDA Binary Instructions & Behavior"}], "lineHeight": 0}}, "target": {"markdown": "## B. 唯一 CUDA 二进制指令与行为", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "e9ddf2d866aad3ebc07afcdd83c1231d", "index": 40, "aliyun_index": 18, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In this section we describe the unique features of GPU\nISA compared with CPU ISA. We summarize the differences\nfrom the following aspects: memory instruction, control flow,\ndependence handling, register shuffling, barrier setup, and\ncompile-time instruction scheduling.  \n\n", "text": "In this section we describe the unique features of GPU\nISA compared with CPU ISA. We summarize the differences\nfrom the following aspects: memory instruction, control flow,\ndependence handling, register shuffling, barrier setup, and\ncompile-time instruction scheduling.\n", "alignment": "left", "unique_id": "e9ddf2d866aad3ebc07afcdd83c1231d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section we describe the unique features of GPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ISA compared with CPU ISA. We summarize the differences"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from the following aspects: memory instruction, control flow,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "dependence handling, register shuffling, barrier setup, and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compile-time instruction scheduling."}], "lineHeight": -133}}, "target": {"markdown": "在本节中，我们描述 GPU ISA 相比于 CPU ISA 所具有的独特特性。我们将从以下几个方面总结它们的差异：内存指令、控制流、依赖关系处理、寄存器洗牌（shuffle）、屏障设置以及编译期指令调度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "f5138e8533e2ecad80b097b133811189", "index": 41, "aliyun_index": 19, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Memory Instructions: There are different types of memory on the GPU, each associated with a type of assembly/binary instructions, as shown in Table I. Global memory can be accessed by all threads. Local memory is a range of thread-private memory in GDDR memory. Shared memory is an on-chip memory that is private to each thread block.  \n\n", "text": "Memory Instructions: There are different types of memory on the GPU, each associated with a type of assembly/binary instructions, as shown in Table I. Global memory can be accessed by all threads. Local memory is a range of thread-private memory in GDDR memory. Shared memory is an on-chip memory that is private to each thread block.\n", "alignment": "left", "unique_id": "f5138e8533e2ecad80b097b133811189", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Memory Instructions: There are different types of memory on the GPU, each associated with a type of assembly/binary instructions, as shown in Table I. Global memory can be accessed by all threads. Local memory is a range of thread-private memory in GDDR memory. Shared memory is an on-chip memory that is private to each thread block."}], "lineHeight": 0}}, "target": {"markdown": "内存指令：GPU 上存在多种不同类型的内存，每种类型都对应一种汇编/二进制指令，如表 I 所示。全局内存可被所有线程访问。本地内存是 GDDR 内存中属于线程私有的一段内存空间。共享内存是一种片上内存，每个线程块各自独享一份。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M  "aliyun_index": 4, "page_num": 2, "type": "figure_note", "sub_type": "none", "markdown": ">Fig. 4. A simple example of thread-warp divergence. (a) is the source and assembly code, (b) is the control flow graph.  \n\n", "text": "Fig. 4. A simple example of thread-warp divergence. (a) is the source and assembly code, (b) is the control flow graph.\n", "alignment": "left", "unique_id": "394c3df169814768cffb4d80bb349152", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 4. A simple example of thread-warp divergence. (a) is the source and assembly code, (b) is the control flow graph."}], "lineHeight": 0}}, "target": {"markdown": "> 图 4. 一个线程束（warp）分化的简单示例。(a) 为源代码与汇编代码，(b) 为控制流图。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "d1f262c7f45aa31b1017ab861c10224e", "index": 49, "aliyun_index": 5, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Constant memory is a type of read-only memory that is split into logical banks. Texture memory is another type of read-only memory, but is only accessed through texture instructions.  \n\n", "text": "Constant memory is a type of read-only memory that is split into logical banks. Texture memory is another type of read-only memory, but is only accessed through texture instructions.\n", "alignment": "left", "unique_id": "d1f262c7f45aa31b1017ab861c10224e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Constant memory is a type of read-only memory that is split into logical banks. Texture memory is another type of read-only memory, but is only accessed through texture instructions."}], "lineHeight": 0}}, "target": {"markdown": "常量内存是一种只读内存，被划分为若干逻辑存储体。纹理内存是另一种类型的只读内存，但只能通过纹理指令进行访问。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "d42bdbca911f0d53282c4b23bd112bc1", "index": 50, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Divergence and Re-convergence: GPU threads are organized into thread-warps, threads within a warp run the same instruction at one time. When threads inside a warp need to diverge on the execution path, the program uses the SSY instruction to signal the hardware to prepare and specify the address for re-convergence. Threads that take different execution paths will be serialized instead of running in parallel. When every thread in the warp has reached a re-convergence command - either a .S modifier or a SYNC instruction, depending on the architecture - it will wait until the thread warp reaches the instruction whose address is specified by the SSY instruction, and then return to running in lock-step.  \n\n", "text": "Divergence and Re-convergence: GPU threads are organized into thread-warps, threads within a warp run the same instruction at one time. When threads inside a warp need to diverge on the execution path, the program uses the SSY instruction to signal the hardware to prepare and specify the address for re-convergence. Threads that take different execution paths will be serialized instead of running in parallel. When every thread in the warp has reached a re-convergence command - either a .S modifier or a SYNC instruction, depending on the architecture - it will wait until the thread warp reaches the instruction whose address is specified by the SSY instruction, and then return to running in lock-step.\n", "alignment": "left", "unique_id": "d42bdbca911f0d53282c4b23bd112bc1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Divergence and Re-convergence: GPU threads are organized into thread-warps, threads within a warp run the same instruction at one time. When threads inside a warp need to diverge on the execution path, the program uses the SSY instruction to signal the hardware to prepare and specify the address for re-convergence. Threads that take different execution paths will be serialized instead of running in parallel. When every thread in the warp has reached a re-convergence command - either a .S modifier or a SYNC instruction, depending on the architecture - it will wait until the thread warp reaches the instruction whose address is specified by the SSY instruction, and then return to running in lock-step."}], "lineHeight": 0}}, "target": {"markdown": "分化与重汇聚：GPU 线程被组织为线程束（warp），同一线程束内的线程在同一时刻执行相同的指令。当线程束内的线程需要沿执行路径发生分化时，程序会使用 SSY 指令通知硬件做好准备并指定用于重汇聚的地址。沿不同执行路径执行的线程将被串行化，而不是并行运行。当线程束内的每个线程都到达重汇聚指令时——该指令根据架构不同，可以是 .S 修饰符或 SYNC 指令——它将等待线程束到达 SSY 指令所指定的地址处的指令，然后恢复同步执行（lock-step）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "3e0a5d25e15d0e8e4db0af858dd1dd02", "index": 51, "aliyun_index": 7, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We show an example of divergence and re-convergence handling in Fig. 4. The source code and assembly code is on the left, organized into basic blocks. The control flow graph is on the right, showing the paths the thread-warp may be split across. The SSY instruction in basic block BB1 indicates that threads may take different paths (diverge), and the instruction with 0x238 (BB6) is where they will re-converge. The conditional SYNC instruction causes some threads to immediately prepare for
