体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 10. An example of how we extract the scheduling information for each group of three instructions on Maxwell and Pascal GPUs. The first and second values indicates dispatch behavior. The third and fourth indicate which barriers to set. The fifth indicates which barriers to wait for."}], "lineHeight": 0}}, "target": {"markdown": "> 图 10. 示例展示了我们如何在 Maxwell 和 Pascal GPU 上为每组三条指令提取调度信息。第一和第二个值表示分派行为。第三和第四个值表示要设置哪些屏障。第五个值表示要等待哪些屏障。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "946a6eb45ac20b253638e7c375054c09", "index": 141, "aliyun_index": 13, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Maxwell and Pascal, they have been extended to control\nbarriers and the register cache. Every fourth instruction on\nthese architectures is a SCHI, so they each affect the following\nthree real instructions. Different from previous ISAs, the\nbinary for a SCHI instruction no longer has any bits dedicated\nto its opcode, and is therefore identified purely by its position\nin the code.  \n\n", "text": "Maxwell and Pascal, they have been extended to control\nbarriers and the register cache. Every fourth instruction on\nthese architectures is a SCHI, so they each affect the following\nthree real instructions. Different from previous ISAs, the\nbinary for a SCHI instruction no longer has any bits dedicated\nto its opcode, and is therefore identified purely by its position\nin the code.\n", "alignment": "left", "unique_id": "946a6eb45ac20b253638e7c375054c09", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Maxwell and Pascal, they have been extended to control"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "barriers and the register cache. Every fourth instruction on"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "these architectures is a SCHI, so they each affect the following"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "three real instructions. Different from previous ISAs, the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "binary for a SCHI instruction no longer has any bits dedicated"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to its opcode, and is therefore identified purely by its position"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in the code."}], "lineHeight": -184}}, "target": {"markdown": "Maxwell 和 Pascal 上，它们已被扩展用于控制屏障和寄存器缓存。在这些架构上，每四条指令中有一条是 SCHI，因此它们各自会影响后续的三条真实指令。与之前的 ISA 不同，SCHI 指令的二进制不再包含专用于其操作码的任何位，因此完全通过其在代码中的位置来识别。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "b4e134d35414353996b2666f5801dd1c", "index": 142, "aliyun_index": 14, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "As with the previous generation, NVIDIA's disassembler\noutputs each instruction group's SCHI data only as a single,  \n\n", "text": "As with the previous generation, NVIDIA's disassembler\noutputs each instruction group's SCHI data only as a single,\n", "alignment": "left", "unique_id": "b4e134d35414353996b2666f5801dd1c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As with the previous generation, NVIDIA's disassembler"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "outputs each instruction group's SCHI data only as a single,"}], "lineHeight": -54}}, "target": {"markdown": "与上一代相同，NVIDIA 的反汇编器仅将每个指令组的 SCHI 数据作为单个", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "a2260f0ef697a6e16e1cd332b13f25d8", "index": 143, "aliyun_index": 0, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "combined hexadecimal value. As such, we again break up the SCHI data, in-lining values with individual instructions so that the code can be easily understood and edited. Fig. 10 shows how we extract the separate values, and how they line up with the following three instructions. The 21 SCHI bits associated with each instruction are distributed as follows. Bits 0 through 3 are the minimum number of cycles to wait before dispatching the next instruction. According to [3], bit 4 is a \"yield hint flag\", which encourages the GPU to switch to another thread. Higher dispatch values in the lowest bits will fail without the yield hint. Bits 5 through 7 and 8 through 11 each indicate a barrier to set after the instruction, or have value 7 when no barrier needs to be set. Bits 12 through 17 indicate which combination of the six barriers the thread must wait for before dispatching the associated instruction. We skip the remaining four bits, which the disassembler already in-lines as cache \"reuse\" modifiers attached to register operands.  \n\n", "text": "combined hexadecimal value. As such, we again break up the SCHI data, in-lining values with individual instructions so that the code can be easily understood and edited. Fig. 10 shows how we extract the separate values, and how they line up with the following three instructions. The 21 SCHI bits associated with each instruction are distributed as follows. Bits 0 through 3 are the minimum number of cycles to wait before dispatching the next instruction. According to [3], bit 4 is a \"yield hint flag\", which encourages the GPU to switch to another thread. Higher dispatch values in the lowest bits will fail without the yield hint. Bits 5 through 7 and 8 through 11 each indicate a barrier to set after the instruction, or have value 7 when no barrier needs to be set. Bits 12 through 17 indicate which combination of the six barriers the thread must wait for before dispatching the associated instruction. We skip the remaining four bits, which the disassembler already in-lines as cache \"reuse\" modifiers attached to register operands.\n", "alignment": "left", "unique_id": "a2260f0ef697a6e16e1cd332b13f25d8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "combined hexadecimal value. As such, we again break up the SCHI data, in-lining values with individual instructions so that the code can be easily understood and edited. Fig. 10 shows how we extract the separate values, and how they line up with the following three instructions. The 21 SCHI bits associated with each instruction are distributed as follows. Bits 0 through 3 are the minimum number of cycles to wait before dispatching the next instruction. According to [3], bit 4 is a \"yield hint flag\", which encourages the GPU to switch to another thread. Higher dispatch values in the lowest bits will fail without the yield hint. Bits 5 through 7 and 8 through 11 each indicate a barrier to set after the instruction, or have value 7 when no barrier needs to be set. Bits 12 through 17 indicate which combination of the six barriers the thread must wait for before dispatching the associated instruction. We skip the remaining four bits, which the disassembler already in-lines as cache \"reuse\" modifiers attached to register operands."}], "lineHeight": 0}}, "target": {"markdown": "组合的十六进制值输出。因此，我们再次拆分 SCHI 数据，将值与各个指令内联在一起，以便代码易于理解和编辑。图 10 展示了我们如何提取各个单独的值，以及它们如何与后续三条指令相对应。与每条指令关联的 21 个 SCHI 位的分布如下。第 0 至 3 位是在分派下一条指令之前需等待的最少周期数。根据文献 [3]，第 4 位是一个\"让步提示标志\"，用于鼓励 GPU 切换到其他线程。若最低位中的分派值较高，则在无让步提示的情况下将分派失败。第 5 至 7 位和第 8 至 11 位各自表示在该指令之后要设置的屏障，若无需设置屏障则取值为 7。第 12 至 17 位表示在分派相关指令之前线程必须等待的六个屏障的组合。我们跳过剩余的 4 位，这些位已被反汇编器作为缓存\"复用\"修饰符内联到寄存器操作数中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "d83d438e86b3592ea9a875c216fbca72", "index": 144, "aliyun_index": 1, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Although this architecture allows instructions to set two barriers, trying to set an unexpected barrier can cause erroneous behavior. The first barrier slot is used to handle true dependencies, for variable-latency instructions that have a destination register (e.g. loads); the second barrier slot is used to handle anti-dependencies, for variable-latency instructions that have source registers (e.g. stores). If an instruction depends on a barrier, the thread will wait for every instruction that set that barrier.  \n\n", "text": "Although this architecture allows instructions to set two barriers, trying to set an unexpected barrier can cause erroneous behavior. The first barrier slot is used to handle true dependencies, for variable-latency instructions that have a destination register (e.g. loads); the second barrier slot is used to handle anti-dependencies, for variable-latency instructions that have source registers (e.g. stores). If an instruction depends on a barrier, the thread will wait for every instruction that set that barrier.\n", "alignment": "left", "unique_id": "d83d438e86b3592ea9a875c216fbca72", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although this architecture allows instructions to set two barriers, trying to set an unexpected barrier can cause erroneous behavior. The first barrier slot is used to handle true dependencies, for variable-latency instructions that have a destination register (e.g. loads); the second barrier slot is used to handle anti-dependencies, for variable-latency instructions that have source registers (e.g. stores). If an instruction depends on a barrier, the thread will wait for every instruction that set that barrier."}], "lineHeight": 0}}, "target": {"markdown": "尽管该架构允许指令设置两个屏障，但尝试设置非预期屏障可能会导致错误行为。第一个屏障槽用于处理真相关，即处理具有目标寄存器的可变延迟指令（例如加载指令）；第二个屏障槽用于处理反相关，即处理具有源寄存器的可变延迟指令（例如存储指令）。如果一条指令依赖于某个屏障，线程将等待设置该屏障的每条指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "0fc7d2aef6b214475eb08a4bbcf496f0", "index": 145, "aliyun_index": 2, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "In the case of Fig. 10, the thread must wait at least 3 cycles after the first instruction. Upon dispatching the second instruction, it sets write barrier #1, and then must wait at least 13 cycles. Since the lowest two bits are set for the barrier wait bit-field, the thread waits for both barrier #0 and barrier #1 to be released before dispatching the third instruction, and after dispatch it waits at least 6 cycles.  \n\n", "text": "In the case of Fig. 10, the thread must wait at least 3 cycles after the first instruction. Upon dispatching the second instruction, it sets write barrier #1, and then must wait at least 13 cycles. Since the lowest two bits are set for the barrier wait bit-field, the thread waits for both barrier #0 and barrier #1 to be released before dispatching the third instruction, and after dispatch it waits at least 6 cycles.\n", "alignment": "left", "unique_id": "0fc7d2aef6b214475eb08a4bbcf496f0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the case of Fig. 10, the thread must wait at least 3 cycles after the first instruction. Upon dispatching the second instruction, it sets write barrier #1, and then must wait at least 13 cycles. Since the lowest two bits are set for the barrier wait bit-field, the thread waits for both barrier #0 and barrier #1 to be released before dispatching the third instruction, and after dispatch it waits at least 6 cycles."}], "lineHeight": 0}}, "target": {"markdown": "在图 10 的情况下，线程在第一条指令之后必须至少等待 3 个周期。在分派第二条指令时，它设置写屏障 #1，然后必须至少等待 13 个周期。由于屏障等待位字段的最低两位被设置，线程在分派第三条指令之前会等待屏障 #0 和屏障 #1 都被释放，并且在分派之后至少等待 6 个周期。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "5291910f47dbfd2c7bc8ec9b41df8945", "index": 146, "aliyun_index": 3, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Compute Capability 7.x: The \"Volta\" generation, which includes Compute Capabilities 7.0 and 7.2, has another new ISA. In this generation, instructions have been expanded to 16 bytes in size, with scheduling information embedded into each individual instruction. We have not completely decoded this ISA yet, but it is in progress, and can be decoded with similar methods to the previous architectures.  \n\n", "text": "Compute Capability 7.x: The \"Volta\" generation, which includes Compute Capabilities 7.0 and 7.2, has another new ISA. In this generation, instructions have been expanded to 16 bytes in size, with scheduling information embedded into each individual instruction. We have not completely decoded this ISA yet, but it is in progress, and can be decoded with similar methods to the previous architectures.\n", "alignment": "left", "unique_id": "5291910f47dbfd2c7bc8ec9b41df8945", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compute Capability 7.x: The \"Volta\" generation, which includes Compute Capabilities 7.0 and 7.2, has another new ISA. In this generation, instructions have been expanded to 16 bytes in size, with scheduling information embedded into each individual instruction. We have not completely decoded this ISA yet, but it is in progress, and can be decoded with similar methods to the previous architectures."}], "lineHeight": 0}}, "target": {"markdown": "计算能力 7.x：\"Volta\" 代，包括计算能力 7.0 和 7.2，具有另一种新的 ISA。在这一代中，指令已扩展为 16 字节大小，调度信息嵌入到每条单独的指令中。我们尚未完全解码此 ISA，但该工作正在进行中，并且可以使用与先前架构类似的方法进行解码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "910d474237c831851a0797917b67627c", "index": 147, "aliyun_index": 4, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "# V. APPLICATIONS  \n\n", "text": "V. APPLICATIONS\n", "alignment": "left", "unique_id": "910d474237c831851a0797917b67627c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": { bold": false, "italic": false}, "text": "in which the precise version of the ISA is largely irrelevant."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Applications can directly make use of our framework as a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "front-end and back-end, operating on this IR. For example,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "if an application needs to convert local memory operations"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to shared memory operations, it can simply scan the IR for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "local memory instructions, change each one's memory type,"}], "lineHeight": -214}}, "target": {"markdown": "我们的框架使用 Flex [22] 和 Bison [23] 来解析汇编代码，并生成一种中间表示（IR），在该中间表示中 ISA 的具体版本在很大程度上无关紧要。应用程序可以直接将我们的框架用作前端和后端，在此 IR 上运行。例如，如果某个应用程序需要将本地内存操作转换为共享内存操作，它可以简单地扫描 IR 中的本地内存指令，并更改每条指令的内存类型，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "c80a0344c51a8bbecec58442c3c39501", "index": 150, "aliyun_index": 7, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![c80a0344c51a8bbecec58442c3c39501.jpeg](figures/c80a0344c51a8bbecec58442c3c39501_6c88f108.png)  \n\n", "text": "64c03c00089c0006\n7aa00000001c040a\n74000000041fc00a\n7aa00000021c040e\n86400000109c000e\ne0800000019c0812\n7a200000001c040a\n\n---\n\n### (c) modified assembly\n\n\n> 注：`STS` 和 `LDS` 指令在修改版中被加粗（原图中以粗体显示），此处用 Markdown 的 `**bold**` 表示强调。但为保持原始语义一致性，若需完全还原视觉样式，可如下处理：\n\n\n---\n\n### (d) new binary\n\n\n\n64c03c00089c0006\n7ae00000001ffc0a\n74000000041fc00a\n7ae00000021ffc0e\n86400000109c000e\ne0800000019c0812\n7a600000001ffc0a\n```\n\n---\n\n✅ 所有十六进制机器码、汇编指令、寄存器名、内存偏移量、特殊寄存器（如 `SR_TID.X`, `RZ`）均按原图精确转录。\n\n📌 注意：\n- 原始二进制与新生成二进制在第2、4、7行不同，对应于汇编中 `STL` → `STS` 和 `LDL` → `LDS` 的替换。\n- 汇编中的 `[R1]`、`[R1+0x4]` 被替换为 `[RZ]`、`[0x4]`，反映寻址方式变化。\n- `RZ` 是零寄存器（通常恒为0），用于替代间接寻址基址寄存器 `R1`。\n\n--- \n\n此 Markdown 结构清晰区分四个部分，保留原始数据完整性，适合技术文档或逆向工程分析使用。", "alignment": "left", "unique_id": "c80a0344c51a8bbecec58442c3c39501", "edited": false, "extra": {}}, "target": {"markdown": "![c80a0344c51a8bbecec58442c3c39501.jpeg](figures/c80a0344c51a8bbecec58442c3c39501_6c88f108.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "63865ee93f6bda0992a024fb26b18758", "index": 151, "aliyun_index": 8, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 11. Example of converting local memory instructions to shared memory instructions.  \n\n", "text": "Fig. 11. Example of converting local memory instructions to shared memory instructions.\n", "alignment": "left", "unique_id": "63865ee93f6bda0992a024fb26b18758", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 11. Example of converting local memory instructions to shared memory instructions."}], "lineHeight": 0}}, "target": {"markdown": "> 图 11. 将本地内存指令转换为共享内存指令的示例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "cc59d36f7b455b4253fe9de78426ff54", "index": 152, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "and change their memory addresses as necessary, as shown in\nFig. 11.  \n\n", "text": "and change their memory addresses as necessary, as shown in\nFig. 11.\n", "alignment": "left", "unique_id": "cc59d36f7b455b4253fe9de78426ff54", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and change their memory addresses as necessary, as shown in"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 11."}], "lineHeight": -51}}, "target": {"markdown": "并根据需要更改其内存地址，如图 11 所示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 152}, {"source": {"block_id": "c0b1daed5fa54819a8e9a753ff8b1723", "index": 153, "aliyun_index": 10, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "In Fig. 11, (a) shows Compute Capability 3.x binary code in hexadecimal format, (b) shows the corresponding assembly code extracted with our front-end, (c) shows the result of modifying the memory instructions, and finally (d) shows the new binary generated by our assembler. Our framework already performs each of these steps except the transformation from (b) to (c).  \n\n", "text": "In Fig. 11, (a) shows Compute Capability 3.x binary code in hexadecimal format, (b) shows the corresponding assembly code extracted with our front-end, (c) shows the result of modifying the memory instructions, and finally (d) shows the new binary generated by our assembler. Our framework already performs each of these steps except the transformation from (b) to (c).\n", "alignment": "left", "unique_id": "c0b1daed5fa54819a8e9a753ff8b1723", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In Fig. 11, (a) shows Compute Capability 3.x binary code in hexadecimal format, (b) shows the corresponding assembly code extracted with our front-end, (c) shows the result of modifying the memory instructions, and finally (d) shows the new binary generated by our assembler. Our framework already performs each of these steps except the transformation from (b) to (c)."}], "lineHeight": 0}}, "target": {"markdown": "在图 11 中，(a) 显示了以十六进制格式表示的计算能力 3.x 二进制代码，(b) 显示了使用我们的前端提取的相应汇编代码，(c) 显示了修改内存指令后的结果，最后 (d) 显示了由我们的汇编器生成的新二进制代码。我们的框架已经执行了除从 (b) 到 (c) 的转换之外的每一步。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 153}, {"source": {"block_id": "9c891a2e13b3c21b5e2f448c38ed061b", "index": 154, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Our framework can serve as an architecture-independent infrastructure for various applications described below. Unlike existing assemblers, it can provide them compatibility with multiple generations of GPUs. Our framework is available at https://github.com/decodecudabinary/Decoding-CUDA-Binary.  \n\n", "text": "Our framework can serve as an architecture-independent infrastructure for various applications described below. Unlike existing assemblers, it can provide them compatibility with multiple generations of GPUs. Our framework is available at https://github.com/decodecudabinary/Decoding-CUDA-Binary.\n", "alignment": "left", "unique_id": "9c891a2e13b3c21b5e2f448c38ed061b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our framework can serve as an architecture-independent infrastructure for various applications described below. Unlike existing assemblers, it can provide them compatibility with multiple generations of GPUs. Our framework is available at https://github.com/decodecudabinary/Decoding-CUDA-Binary."}], "lineHeight": 0}}, "target": {"markdown": "我们的框架可作为下文所述各种应用的架构无关基础设施。与现有的汇编器不同，它能为这些应用提供对多代 GPU 的兼容性。我们的框架可在 https://github.com/decodecudabinary/Decoding-CUDA-Binary 获取。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 154}, {"source": {"block_id": "6ce951bc410c0a112c92bde9146edce7", "index": 155, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Compilation CUDA developers are currently reliant on NVIDIA's closed-source software for compilation. With access to the instruction encoding, however, the development of an open-source GPU compiler is possible. This would allow researchers to easily explore various compiler optimizations, such as new algorithms for GPU register allocation.  \n\n", "text": "Compilation CUDA developers are currently reliant on NVIDIA's closed-source software for compilation. With access to the instruction encoding, however, the development of an open-source GPU compiler is possible. This would allow researchers to easily explore various compiler optimizations, such as new algorithms for GPU register allocation.\n", "alignment": "left", "unique_id": "6ce951bc410c0a112c92bde9146edce7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compilation CUDA developers are currently reliant on NVIDIA's closed-source software for compilation. With access to the instruction encoding, however, the development of an open-source GPU compiler is possible. This would allow researchers to easily explore various compiler optimizations, such as new algorithms for GPU register allocation."}], "lineHeight": 0}}, "target": {"markdown": "编译 目前，CUDA 开发人员在编译时仍需依赖 NVIDIA 的闭源软件。然而，一旦能够访问指令编码，开发开源的 GPU 编译器便成为可能。这将使研究人员能够轻松探索各种编译器优化，例如用于 GPU 寄存器分配的新算法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 155}, {"source": {"block_id": "153f8a50eccda5f5c8a964b9c499bffa", "index": 156, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**IR Generation** Our framework enables versatile control flow analysis by leveraging our intermediate representation. When we parse the assembly into its IR, we organize the instructions into basic blocks. We convert branch targets from literal offsets to pointers, and break up instruction-scheduling values into their associated instructions. This organization of the code results in human-readable assembly, allowing developers to better understand a program, and facilitates techniques such as binary instrumentation.  \n\n", "text": "**IR Generation** Our framework enables versatile control flow analysis by leveraging our intermediate representation. When we parse the assembly into its IR, we organize the instructions into basic blocks. We convert branch targets from literal offsets to pointers, and break up instruction-scheduling values into their associated instructions. This organization of the code results in human-readable assembly, allowing developers to better understand a program, and facilitates techniques such as binary instrumentation.\n", "alignment": "left", "unique_id": "153f8a50eccda5f5c8a964b9c499bffa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**IR Generation** Our framework enables versatile control flow analysis by leveraging our intermediate representation. When we parse the assembly into its IR, we organize the instructions into basic blocks. We convert branch targets from literal offsets to pointers, and break up instruction-scheduling values into their associated instructions. This organization of the code results in human-readable assembly, allowing developers to better understand a program, and facilitates techniques such as binary instrumentation."}], "lineHeight": 0}}, "target": {"markdown": "**IR 生成** 我们的框架通过利用其中间表示，能够实现灵活的控制流分析。当我们将汇编代码解析为其 IR 时，会将指令组织成基本块。我们将分支目标从字面偏移量转换为指针，并将指令调度值拆分到其关联的指令中。这种代码的组织方式产生了人类可读的汇编代码，使开发人员能够更好地理解程序，并有助于诸如二进制插桩（binary instrumentation）等技术。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "ab094206050aff0724d3c64f0bbcdbb1", "index": 157, "aliyun_index": 0, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![ab094206050aff0724d3c64f0bbcdbb1.jpeg](figures/ab094206050aff0724d3c64f0bbcdbb1_2a5d918c.png)  \n\n", "text": "---\n\n### (b) human-readable assembly\n\n#### Version 1: With labels and branches only\n\n\n#### Version 2: Expanded with MOV instructions at label4\n\n\nassembly\nlabel2:\n    CAL label5;\nlabel3:\n    DSETP.LT.AND P0, PT, R10, R12, PT;\n    @P0 BRA label2;\nlabel4:\n    MOV R10, RZ;\n    MOV R12, RZ;\n    EXIT;\nlabel5:\n    ISETP.LE.U32.AND P0, PT, R14, R0, PT;\n    @!P0 BRA label7;\n```\n\n---\n\n> **注**：  \n> - `RZ` 通常表示零寄存器（zero register），用于将寄存器清零。  \n> - `@P0` 和 `@!P0` 是条件分支前缀，分别表示“当谓词 P0 为真时”和“当谓词 P0 为假时”。  \n> - `BRA` 是无条件或条件跳转指令。  \n> - `CAL` 是调用子程序指令。  \n> - `DSETP` / `ISETP` 是设置谓词的比较指令，后缀 `.LT` 表示小于，`.LE.U32` 表示无符号32位小于等于。  \n> - `.AND` 表示该操作同时更新谓词寄存器（如 P0）并与当前谓词状态进行逻辑与运算。\n\n--- \n\n此 Markdown 输出严格遵循原始图像中的文本顺序、缩进风格及语义分组，未添加任何解释性文字至代码块内，仅在外部以注释形式说明关键术语含义，符合“准确保留所有步骤和细节”的要求。", "alignment": "left", "unique_id": "ab094206050aff0724d3c64f0bbcdbb1", "edited": false, "extra": {}}, "target": {"markdown": "![ab094206050aff0724d3c64f0bbcdbb1.jpeg](figures/ab094206050aff0724d3c64f0bbcdbb1_2a5d918c.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "a32a3aeb9facc155264ba659e6af5082", "index": 158, "aliyun_index": 1, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">(c) instrumented assembly  \n\n", "text": "(c) instrumented assembly\n", "alignment": "left", "unique_id": "a32a3aeb9facc155264ba659e6af5082", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(c) instrumented assembly"}], "lineHeight": 0}}, "target": {"markdown": ">(c) 已插桩的汇编代码", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "be80a7ac6594c089c18645869f808fa3", "index": 159, "aliyun_index": 2, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 12. Example of instrumenting the code to clear some registers before exit.  \n\n", "text": "Fig. 12. Example of instrumenting the code to clear some registers before exit.\n", "alignment": "left", "unique_id": "be80a7ac6594c089c18645869f808fa3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 12. Example of instrumenting the code to clear some registers before exit."}], "lineHeight": 0}}, "target": {"markdown": "> 图 12. 在退出前清除部分寄存器的代码插桩示例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "366375533acec4c4ea300f16e0392f5f", "index": 160, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Binary Instrumentation** Once we organize the assembly into basic blocks, code can easily be inserted or deleted, with scheduling data placed automatically. In [10] our framework was used to perform GPU binary instrumentation, in order to protect otherwise vulnerable regions of memory. In Fig. 12, we show a simple example: (a) is a snippet of raw assembly code, (b) is human-readable assembly generated by our framework, and (c) is modified assembly that has been instrumented to clear some registers before exiting the kernel.  \n\n", "text": "**Binary Instrumentation** Once we organize the assembly into basic blocks, code can easily be inserted or deleted, with scheduling data placed automatically. In [10] our framework was used to perform GPU binary instrumentation, in order to protect otherwise vulnerable regions of memory. In Fig. 12, we show a simple example: (a) is a snippet of raw assembly code, (b) is human-readable assembly generated by our framework, and (c) is modified assembly that has been instrumented to clear some registers before exiting the kernel.\n", "alignment": "left", "unique_id": "366375533acec4c4ea300f16e0392f5f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Binary Instrumentation** Once we organize the assembly into basic blocks, code can easily be inserted or deleted, with scheduling data placed automatically. In [10] our framework was used to perform GPU binary instrumentation, in order to protect otherwise vulnerable regions of memory. In Fig. 12, we show a simple example: (a) is a snippet of raw assembly code, (b) is human-readable assembly generated by our framework, and (c) is modified assembly that has been instrumented to clear some registers before exiting the kernel."}], "lineHeight": 0}}, "target": {"markdown": "**二进制插桩** 一旦我们将汇编代码组织成基本块，就可以轻松地插入或删除代码，并且调度数据会自动放置。在文献 [10] 中，我们的框架被用于执行 GPU 二进制插桩，以保护原本易受攻击的内存区域。在图 12 中，我们展示了一个简单的示例：(a) 是一段原始汇编代码片段，(b) 是由我们的框架生成的人类可读的汇编代码，(c) 是经过修改的汇编代码，已被插桩以在内核退出前清除部分寄存器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "1eeca2804cf3d75c0a6eb3a12f743329", "index": 161, "aliyun_index": 4, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Binary instrumentation can be done even without access to\na program's source code. Furthermore, since our IR is not\ntied to a single version of the ISA, changes to the code can  \n\n", "text": "Binary instrumentation can be done even without access to\na program's source code. Furthermore, since our IR is not\ntied to a single version of the ISA, changes to the code can\n", "alignment": "left", "unique_id": "1eeca2804cf3d75c0a6eb3a12f743329", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Binary instrumentation can be done even without access to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a program's source code. Furthermore, since our IR is not"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tied to a single version of the ISA, changes to the code can"}], "lineHeight": -81}}, "target": {"markdown": "二进制插桩即使在无法访问程序源代码的情况下也可以完成。此外，由于我们的 IR 并不绑定到某一特定版本的 ISA，因此即使目标 GPU 采用了与插桩时代不同的 ISA，也可以对代码进行修改", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "5c4296ee81b805a1ac17e5ab8ca080e2", "index": 162, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "be compatible with many architectures, using our generated\nassemblers to target different devices as needed.  \n\n", "text": "be compatible with many architectures, using our generated\nassemblers to target different devices as needed.\n", "alignment": "left", "unique_id": "5c4296ee81b805a1ac17e5ab8ca080e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "be compatible with many architectures, using our generated"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "assemblers to target different devices as needed."}], "lineHeight": -53}}, "target": {"markdown": "并兼容多种架构，同时可使用我们生成的汇编器根据需要针对不同设备进行编译。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "1755f47a1adb7cc5360c3e4905a7e02e", "index": 163, "aliyun_index": 6, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# VI. Related Work  \n\n", "text": "VI. Related Work\n", "alignment": "left", "unique_id": "1755f47a1adb7cc5360c3e4905a7e02e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VI. Related Work"}], "lineHeight": 0}}, "target": {"markdown": "# VI. 相关工作", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "586c45c00ffeed1c435463c2e9629bd6", "index": 164, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "There are several works which interact with the binary code, but are limited to specific architectures, and so could benefit from our framework in order to support additional devices. In GPES [5], the authors transform the binary to enable workload partitioning to be performed in a manner totally transparent to applications - though they state that more sophisticated binary analysis is still needed to support complex kernels. [8] proposes a synchronization scheme which uses binary-level instructions to achieve greater efficiency than other lock-based approaches. In [9], the KernelGen framework employs several instructions that exist only in the binary ISA, modifying the code and other parts of the ELF.  \n\n", "text": "There are several works which interact with the binary code, but are limited to specific architectures, and so could benefit from our framework in order to support additional devices. In GPES [5], the authors transform the binary to enable workload partitioning to be performed in a manner totally transparent to applications - though they state that more sophisticated binary analysis is still needed to support complex kernels. [8] proposes a synchronization scheme which uses binary-level instructions to achieve greater efficiency than other lock-based approaches. In [9], the KernelGen framework employs several instructions that exist only in the binary ISA, modifying the code and other parts of the ELF.\n", "alignment": "left", "unique_id": "586c45c00ffeed1c435463c2e9629bd6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There are several works which interact with the binary code, but are limited to specific architectures, and so could benefit from our framework in order to support additional devices. In GPES [5], the authors transform the binary to enable workload partitioning to be performed in a manner totally transparent to applications - though they state that more sophisticated binary analysis is still needed to support complex kernels. [8] proposes a synchronization scheme which uses binary-level instructions to achieve greater efficiency than other lock-based approaches. In [9], the KernelGen framework employs several instructions that exist only in the binary ISA, modifying the code and other parts of the ELF."}], "lineHeight": 0}}, "target": {"markdown": "已有若干与二进制代码交互的研究工作，但它们仅限于特定的架构，因此可以通过我们的框架来支持更多设备。在 GPES [5] 中，作者对二进制进行转换，以使工作负载划分能够以对应用完全透明的方式执行——不过他们也指出，仍需要更复杂的二进制分析来支持复杂的内核。文献 [8] 提出了一种同步方案，该方案利用二进制级指令实现比其他基于锁的方法更高的效率。在文献 [9] 中，KernelGen 框架采用了若干仅存在于二进制 ISA 中的指令，对代码以及 ELF 文件的其他部分进行了修改。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "5c0282a33d6e25f87a6148854aa1cc11", "index": 165, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In [17], the Fermi generation (Compute Capability 2.x) was examined. In [4], the late Kepler generation (Compute Capability 3.x) was explored to optimize the SGEMM application. [3] reverse-engineered Maxas (Compute Capability 5.x), and [18] looked at Volta (Compute Capability 7.x). But to the best of our knowledge, ours is the first work that strives to provide assembler generating framework in order to support as many NVIDIA architectures as possible.  \n\n", "text": "In [17], the Fermi generation (Compute Capability 2.x) was examined. In [4], the late Kepler generation (Compute Capability 3.x) was explored to optimize the SGEMM application. [3] reverse-engineered Maxas (Compute Capability 5.x), and [18] looked at Volta (Compute Capability 7.x). But to the best of our knowledge, ours is the first work that strives to provide assembler generating framework in order to support as many NVIDIA architectures as possible.\n", "alignment": "left", "unique_id": "5c0282a33d6e25f87a6148854aa1cc11", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In [17], the Fermi generation (Compute Capability 2.x) was examined. In [4], the late Kepler generation (Compute Capability 3.x) was explored to optimize the SGEMM application. [3] reverse-engineered Maxas (Compute Capability 5.x), and [18] looked at Volta (Compute Capability 7.x). But to the best of our knowledge, ours is the first work that strives to provide assembler generating framework in order to support as many NVIDIA architectures as possible."}], "lineHeight": 0}}, "target": {"markdown": "在文献 [17] 中，研究了 Fermi 架构（计算能力 2.x）。文献 [4] 探讨了较晚的 Kepler 架构（计算能力 3.x），以优化 SGEMM 应用。文献 [3] 对 Maxas（计算能力 5.x）进行了逆向工程，而文献 [18] 则研究了 Volta（计算能力 7.x）。但据我们所知，我们的工作是首个致力于提供汇编器生成框架以支持尽可能多的 NVIDIA 架构的研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "b414a8aebe7a5cacb9f35e1832b953bf", "index": 166, "aliyun_index": 9, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# VII. Conclusion  \n\n", "text": "VII. Conclusion\n", "alignment": "left", "unique_id": "b414a8aebe7a5cacb9f35e1832b953bf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VII. Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "# VII. 结论", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "ef79ac1c4f15a86f4b7c890eb5cfadb8", "index": 167, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The closed-source nature of NVIDIA's ISA restricts the capabilities of developers and researchers. Sufficient knowledge of the ISA enables better optimization and security, as well as allowing various applications including register allocation and binary instrumentation. The assembler generation technique we developed permits rapid decoding of the machine code for various GPU generations. Furthermore, the framework we built makes these assemblers easy to use for architecture-independent applications. Authors of several works [6] [7] [10] [12] have utilized our framework.  \n\n", "text": "The closed-source nature of NVIDIA's ISA restricts the capabilities of developers and researchers. Sufficient knowledge of the ISA enables better optimization and security, as well as allowing various applications including register allocation and binary instrumentation. The assembler generation technique we developed permits rapid decoding of the machine code for various GPU generations. Furthermore, the framework we built makes these assemblers easy to use for architecture-independent applications. Authors of several works [6] [7] [10] [12] have utilized our framework.\n", "alignment": "left", "unique_id": "ef79ac1c4f15a86f4b7c890eb5cfadb8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The closed-source nature of NVIDIA's ISA restricts the capabilities of developers and researchers. Sufficient knowledge of the ISA enables better optimization and security, as well as allowing various applications including register allocation and binary instrumentation. The assembler generation technique we developed permits rapid decoding of the machine code for various GPU generations. Furthermore, the framework we built makes these assemblers easy to use for architecture-independent applications. Authors of several works [6] [7] [10] [12] have utilized our framework."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA ISA 的闭源特性限制了开发人员和研究人员的能力。对 ISA 的充分了解有助于实现更好的优化与安全性，并支持包括寄存器分配和二进制插桩在内的各种应用。我们所开发的汇编器生成技术能够对各个 GPU 架构的机器码进行快速解码。此外，我们构建的框架使这些汇编器易于用于与架构无关的应用程序。若干文献的作者 [6] [7] [10] [12] 已采用了我们的框架。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "d8e668e925c060ff305055d836f83bd3", "index": 168, "aliyun_index": 11, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# APPENDIX A ARTIFACT APPENDIX  \n\n", "text": "APPENDIX A ARTIFACT APPENDIX\n", "alignment": "left", "unique_id": "d8e668e925c060ff305055d836f83bd3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "APPENDIX A"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ARTIFACT APPENDIX"}], "lineHeight": -50}}, "target": {"markdown": "## 附录 A 制品附录", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"sou  to target Compute Capability 3.x, 5.x, and/or 6.x devices only."}], "lineHeight": 0}}, "target": {"markdown": "我们制品副本中的汇编生成器要求基准测试仅针对 Compute Capability 3.x、5.x 和/或 6.x 设备。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 188}, {"source": {"block_id": "577c02afd3eab37055bb6fa11a44724d", "index": 189, "aliyun_index": 17, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# D. Installation  \n\n", "text": "D. Installation\n", "alignment": "left", "unique_id": "577c02afd3eab37055bb6fa11a44724d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "D. Installation"}], "lineHeight": 0}}, "target": {"markdown": "## D. 安装", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 189}, {"source": {"block_id": "d1e9e2f4610cc1d55621b072d12902da", "index": 190, "aliyun_index": 18, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Our Assembler Generator and each of the benchmarks is\naccompanied by a Makefile. To build each of them, run make\ninside each of their directories. For the provided subset of\nbenchmarks, we include a Bash script that will compile all of\nthem and place their executable into a single directory.  \n\n", "text": "Our Assembler Generator and each of the benchmarks is\naccompanied by a Makefile. To build each of them, run make\ninside each of their directories. For the provided subset of\nbenchmarks, we include a Bash script that will compile all of\nthem and place their executable into a single directory.\n", "alignment": "left", "unique_id": "d1e9e2f4610cc1d55621b072d12902da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our Assembler Generator and each of the benchmarks is"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "accompanied by a Makefile. To build each of them, run make"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "inside each of their directories. For the provided subset of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "benchmarks, we include a Bash script that will compile all of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "them and place their executable into a single directory."}], "lineHeight": -131}}, "target": {"markdown": "我们的汇编生成器以及每个基准测试都附带一个 Makefile。要构建它们中的每一个，请在各自的目录内运行 make。对于所提供的基准测试子集，我们提供了一个 Bash 脚本，可编译所有基准测试并将它们的可执行文件放入单一目录中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 190}, {"source": {"block_id": "e9dddd48cde01c28940f3f7baccb70ef", "index": 191, "aliyun_index": 19, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# E. Experiment Workflow  \n\n", "text": "E. Experiment Workflow\n", "alignment": "left", "unique_id": "e9dddd48cde01c28940f3f7baccb70ef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "E. Experiment Workflow"}], "lineHeight": 0}}, "target": {"markdown": "## E. 实验工作流", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 191}, {"source": {"block_id": "26cea8ed5a372af961192c6786f4cc52", "index": 192, "aliyun_index": 20, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "GPU kernel functions are extracted from compiled benchmarks and fed into the Assembler Generator one-at-a-time  \n\n", "text": "GPU kernel functions are extracted from compiled benchmarks and fed into the Assembler Generator one-at-a-time\n", "alignment": "left", "unique_id": "26cea8ed5a372af961192c6786f4cc52", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU kernel functions are extracted from compiled benchmarks and fed into the Assembler Generator one-at-a-time"}], "lineHeight": 0}}, "target": {"markdown": "GPU 内核函数从已编译的基准测试中提取，并逐个送入汇编生成器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 192}, {"source": {"block_id": "4b24c65fdfbbd31d53d1fe537974d398", "index": 193, "aliyun_index": 21, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "for analysis; persistent data from analysis is passed through standard in and standard out. After processing each of the kernel functions, the Assembler Generator is used to perform one or more rounds of bit flipping in order to improve its results: bit-flipped binary code is written into an executable, and then re-extracted with its assembly and analyzed. Finally, the Assembler Generator is invoked once more to prepare CUDA SASS assemblers (written in C++). These new assemblers can be tested on one or more of the benchmarks to confirm it produces the same code as the original.  \n\n", "text": "for analysis; persistent data from analysis is passed through standard in and standard out. After processing each of the kernel functions, the Assembler Generator is used to perform one or more rounds of bit flipping in order to improve its results: bit-flipped binary code is written into an executable, and then re-extracted with its assembly and analyzed. Finally, the Assembler Generator is invoked once more to prepare CUDA SASS assemblers (written in C++). These new assemblers can be tested on one or more of the benchmarks to confirm it produces the same code as the original.\n", "alignment": "left", "unique_id": "4b24c65fdfbbd31d53d1fe537974d398", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "for analysis; persistent data from analysis is passed through standard in and standard out. After processing each of the kernel functions, the Assembler Generator is used to perform one or more rounds of bit flipping in order to improve its results: bit-flipped binary code is written into an executable, and then re-extracted with its assembly and analyzed. Finally, the Assembler Generator is invoked once more to prepare CUDA SASS assemblers (written in C++). These new assemblers can be tested on one or more of the benchmarks to confirm it produces the same code as the original."}], "lineHeight": 0}}, "target": {"markdown": "供分析使用；分析过程中的持久化数据通过标准输入和标准输出进行传递。在处理完每个内核函数后，将使用汇编生成器执行一轮或多轮比特翻转以改进其结果：比特翻转后的二进制代码被写入可执行文件，然后重新提取其汇编代码并进行分析。最后，再次调用汇编生成器以准备 CUDA SASS 汇编器（用 C++ 编写）。这些新汇编器可在其中一个或多个基准测试上进行测试，以确认其生成代码与原始代码一致。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 193}, {"source": {"block_id": "4994b02cd171a0a592db9367082e8277", "index": 194, "aliyun_index": 22, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In other words, the basic experiment workflow steps are as follows: prepare benchmarks, extract kernel functions, analyze kernel functions, generate bit-flipped code, inject bit-flipped code into executable, extract bit-flipped kernel function, analyze bit-flipped kernel function, generate assembler code, assemble code into benchmarks, verify that benchmarks have not changed.  \n\n", "text": "In other words, the basic experiment workflow steps are as follows: prepare benchmarks, extract kernel functions, analyze kernel functions, generate bit-flipped code, inject bit-flipped code into executable, extract bit-flipped kernel function, analyze bit-flipped kernel function, generate assembler code, assemble code into benchmarks, verify that benchmarks have not changed.\n", "alignment": "left", "unique_id": "4994b02cd171a0a592db9367082e8277", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In other words, the basic experiment workflow steps are as follows: prepare benchmarks, extract kernel functions, analyze kernel functions, generate bit-flipped code, inject bit-flipped code into executable, extract bit-flipped kernel function, analyze bit-flipped kernel function, generate assembler code, assemble code into benchmarks, verify that benchmarks have not changed."}], "lineHeight": 0}}, "target": {"markdown": "换言之，基本的实验工作流步骤如下：准备基准测试，提取内核函数，分析内核函数，生成比特翻转后的代码，将比特翻转后的代码注入可执行文件，提取比特翻转后的内核函数，分析比特翻转后的内核函数，生成汇编器代码，将汇编代码汇编到基准测试中，验证基准测试未发生变化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 194}, {"source": {"block_id": "4d650923e1ef39bea5806086a29bd155", "index": 195, "aliyun_index": 23, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# F. Evaluation and Expected Result  \n\n", "text": "F. Evaluation and Expected Result\n", "alignment": "left", "unique_id": "4d650923e1ef39bea5806086a29bd155", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "F. Evaluation and Expected Result"}], "lineHeight": 0}}, "target": {"markdown": "## F. 评估与预期结果", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 195}, {"source": {"block_id": "efe667f7f18a715a8c4c1368d7617815", "index": 196, "aliyun_index": 24, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "We provide a Bash script, with filename procExes.sh, which performs all of the above Experimental Workflow steps except for preparing the benchmarks (the CUDA executables used as input). Before running the script, all input executables should be placed in the **exes** subdirectory.  \n\n", "text": "We provide a Bash script, with filename procExes.sh, which performs all of the above Experimental Workflow steps except for preparing the benchmarks (the CUDA executables used as input). Before running the script, all input executables should be placed in the **exes** subdirectory.\n", "alignment": "left", "unique_id": "efe667f7f18a715a8c4c1368d7617815", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We provide a Bash script, with filename procExes.sh, which performs all of the above Experimental Workflow steps except for preparing the benchmarks (the CUDA executables used as input). Before running the script, all input executables should be placed in the **exes** subdirectory."}], "lineHeight": 0}}, "target": {"markdown": "我们提供了一个名为 procExes.sh 的 Bash 脚本，该脚本可执行上述实验工作流中的所有步骤，但不包括准备基准测试（即用作输入的 CUDA 可执行文件）。在运行该脚本之前，所有输入可执行文件应放置在 **exes** 子目录中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 196}, {"source": {"block_id": "307a586a745072916dcffaaee91313cd", "index": 197, "aliyun_index": 25, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "The script places generated assemblers' code into files named generatedAssemblerXX.txt, where XX is the version number of the target architecture. If a Compute Capability 3.5 assembler is generated, it is placed into the source code for our included asm2bin tool, and tested on each Compute Capability 3.5 benchmark to confirm its correctness.  \n\n", "text": "The script places generated assemblers' code into files named generatedAssemblerXX.txt, where XX is the version number of the target architecture. If a Compute Capability 3.5 assembler is generated, it is placed into the source code for our included asm2bin tool, and tested on each Compute Capability 3.5 benchmark to confirm its correctness.\n", "alignment": "left", "unique_id": "307a586a745072916dcffaaee91313cd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The script places generated assemblers' code into files named generatedAssemblerXX.txt, where XX is the version number of the target architecture. If a Compute Capability 3.5 assembler is generated, it is placed into the source code for our included asm2bin tool, and tested on each Compute Capability 3.5 benchmark to confirm its correctness."}], "lineHeight": 0}}, "target": {"markdown": "该脚本将生成的汇编器代码放入名为 generatedAssemblerXX.txt 的文件中，其中 XX 是目标架构的版本号。如果生成了 Compute Capability 3.5 汇编器，则会将其放入我们随附的 asm2bin 工具的源代码中，并在每个 Co harScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "H. Notes"}], "lineHeight": 0}}, "target": {"markdown": "## H. 注意事项", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 201}, {"source": {"block_id": "b02e811ad6bdbd0d41a8c16a89720752", "index": 202, "aliyun_index": 30, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "When injecting assembled or bit-flipped binary code into an\nexecutable, our program modifies the GPU ELF according to\nthe specifications we have made available on Zenodo [15].  \n\n", "text": "When injecting assembled or bit-flipped binary code into an\nexecutable, our program modifies the GPU ELF according to\nthe specifications we have made available on Zenodo [15].\n", "alignment": "left", "unique_id": "b02e811ad6bdbd0d41a8c16a89720752", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When injecting assembled or bit-flipped binary code into an"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "executable, our program modifies the GPU ELF according to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the specifications we have made available on Zenodo [15]."}], "lineHeight": -77}}, "target": {"markdown": "当将已汇编或比特翻转后的二进制代码注入可执行文件时，我们的程序会根据我们已在 Zenodo [15] 上发布的规范修改 GPU ELF。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 202}, {"source": {"block_id": "af28d0bbd1585d6f86b538a59e2eefc5", "index": 203, "aliyun_index": 31, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "When generating bit-flipped code, our Assembler Generator outputs it as a list of BINCODE instructions. BINCODE is not a real opcode used by NVIDIA, but rather a phony opcode we use in our own tools to indicate that the instruction contains only binary code.  \n\n", "text": "When generating bit-flipped code, our Assembler Generator outputs it as a list of BINCODE instructions. BINCODE is not a real opcode used by NVIDIA, but rather a phony opcode we use in our own tools to indicate that the instruction contains only binary code.\n", "alignment": "left", "unique_id": "af28d0bbd1585d6f86b538a59e2eefc5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When generating bit-flipped code, our Assembler Generator outputs it as a list of BINCODE instructions. BINCODE is not a real opcode used by NVIDIA, but rather a phony opcode we use in our own tools to indicate that the instruction contains only binary code."}], "lineHeight": 0}}, "target": {"markdown": "在生成比特翻转后的代码时，我们的汇编生成器会将其作为 BINCODE 指令列表输出。BINCODE 并不是 NVIDIA 实际使用的操作码，而是我们在自己的工具中使用的一个虚拟操作码，用于指示该指令仅包含二进制代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 203}, {"source": {"block_id": "043b2296bf76bbb14c7aa667898c7258", "index": 204, "aliyun_index": 32, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "A more complete and well-documented copy of our As-sembler Generator and related tools is available at https://github.com/decodecodabinary/Decoding-CUDA-Binary.  \n\n", "text": "A more complete and well-documented copy of our As-sembler Generator and related tools is available
