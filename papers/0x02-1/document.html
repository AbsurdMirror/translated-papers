xecute basic block BB2 instead. In BB2, the already divergent threads hit the next SSY, preparing for another potential divergence; some take the conditional branch to BB4, whereas others execute BB3 instead. At the end of BB3 and BB4, these doubly-divergent threads re-"}], "lineHeight": 0}}, "target": {"markdown": "我们在图 4 中展示了一个分化与重汇聚处理的示例。左侧为源代码与汇编代码，按基本块组织；右侧为控制流图，展示了线程束可能被拆分执行的不同路径。基本块 BB1 中的 SSY 指令表明线程可能沿不同路径执行（分化），而地址为 0x238（BB6）的指令则是它们重汇聚的位置。条件 SYNC 指令会使一部分线程立即为重汇聚做好准备，而同一线程束中的其他线程则转而执行基本块 BB2。在 BB2 中，已经分化的线程遇到下一条 SSY 指令，为另一次可能的分化做准备；其中一部分线程通过条件分支跳转到 BB4，而其余线程则继续执行 BB3。在 BB3 与 BB4 末尾，这些发生双重分化的线程重新——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "aa788416d815eec0db23c54403f060ac", "index": 52, "aliyun_index": 8, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "converge in BB5. At the end of BB5, they finally re-converge\nin BB6 with the threads that only executed the first SYNC\nfrom BB1.  \n\n", "text": "converge in BB5. At the end of BB5, they finally re-converge\nin BB6 with the threads that only executed the first SYNC\nfrom BB1.\n", "alignment": "left", "unique_id": "aa788416d815eec0db23c54403f060ac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "converge in BB5. At the end of BB5, they finally re-converge"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in BB6 with the threads that only executed the first SYNC"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from BB1."}], "lineHeight": -76}}, "target": {"markdown": "在 BB5 中重汇聚。在 BB5 末尾，它们最终与仅执行了 BB1 中第一条 SYNC 指令的线程一起在 BB6 中完成重汇聚。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "a23bbf6676772efb85a4f4c46d62718c", "index": 53, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Warp-Register Shuffling: Thread-warps are allocated consecutive physical registers, aligned to hardware-specified boundaries. Compute Capability 3.0 introduced the SHFL instruction, which can read registers from another thread in the same thread-warp. This permits a thread-warp to perform internal communication far faster than would otherwise be possible, thanks to the low latency of the register file as compared to other memory types.  \n\n", "text": "Warp-Register Shuffling: Thread-warps are allocated consecutive physical registers, aligned to hardware-specified boundaries. Compute Capability 3.0 introduced the SHFL instruction, which can read registers from another thread in the same thread-warp. This permits a thread-warp to perform internal communication far faster than would otherwise be possible, thanks to the low latency of the register file as compared to other memory types.\n", "alignment": "left", "unique_id": "a23bbf6676772efb85a4f4c46d62718c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Warp-Register Shuffling: Thread-warps are allocated consecutive physical registers, aligned to hardware-specified boundaries. Compute Capability 3.0 introduced the SHFL instruction, which can read registers from another thread in the same thread-warp. This permits a thread-warp to perform internal communication far faster than would otherwise be possible, thanks to the low latency of the register file as compared to other memory types."}], "lineHeight": 0}}, "target": {"markdown": "线程束寄存器混洗（Thread-warp Register Shuffling）：线程束被分配连续的物理寄存器，并按硬件规定的边界进行对齐。计算能力 3.0 引入了 SHFL 指令，该指令可以从同一线程束内的另一线程读取寄存器。由于寄存器文件的延迟远低于其他类型的内存，这使得线程束能够以远高于常规方式的速度进行内部通信。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "1ed3764f60ad681a36f3ad149ca3c40f", "index": 54, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Barrier Instructions: The BAR instruction is be used for synchronization, halting the thread until every other live thread in the same thread-block has reached its position. In Compute Capability 3.0 the TEXDEPBAR instruction was introduced, which halts the thread until specified texture operations are completely resolved; texture dependences are thus handled by the compiler, rather than determined by the device.  \n\n", "text": "Barrier Instructions: The BAR instruction is be used for synchronization, halting the thread until every other live thread in the same thread-block has reached its position. In Compute Capability 3.0 the TEXDEPBAR instruction was introduced, which halts the thread until specified texture operations are completely resolved; texture dependences are thus handled by the compiler, rather than determined by the device.\n", "alignment": "left", "unique_id": "1ed3764f60ad681a36f3ad149ca3c40f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Barrier Instructions: The BAR instruction is be used for synchronization, halting the thread until every other live thread in the same thread-block has reached its position. In Compute Capability 3.0 the TEXDEPBAR instruction was introduced, which halts the thread until specified texture operations are completely resolved; texture dependences are thus handled by the compiler, rather than determined by the device."}], "lineHeight": 0}}, "target": {"markdown": "屏障指令：BAR 指令用于同步，它会暂停当前线程的执行，直至同一线程块内所有其他活跃线程都到达各自的位置。计算能力 3.0 引入了 TEXDEPBAR 指令，该指令会暂停当前线程，直至指定的纹理操作完全解析完成；因此，纹理依赖关系由编译器处理，而非由设备自行确定。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "a61f4667387411e025e9f464d93e4395", "index": 55, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Compile-Time Scheduling: As of Compute Capability 3.0, instruction scheduling is handled by the compiler rather than by the hardware. On this architecture every 8-th instruction, rather than being a real instruction, is a set of scheduling codes inserted by the compiler. These scheduling codes dictate the minimum number of cycles that the thread must wait between every two consecutive instructions in the following seven instructions in order to satisfy dependence constraints.  \n\n", "text": "Compile-Time Scheduling: As of Compute Capability 3.0, instruction scheduling is handled by the compiler rather than by the hardware. On this architecture every 8-th instruction, rather than being a real instruction, is a set of scheduling codes inserted by the compiler. These scheduling codes dictate the minimum number of cycles that the thread must wait between every two consecutive instructions in the following seven instructions in order to satisfy dependence constraints.\n", "alignment": "left", "unique_id": "a61f4667387411e025e9f464d93e4395", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compile-Time Scheduling: As of Compute Capability 3.0, instruction scheduling is handled by the compiler rather than by the hardware. On this architecture every 8-th instruction, rather than being a real instruction, is a set of scheduling codes inserted by the compiler. These scheduling codes dictate the minimum number of cycles that the thread must wait between every two consecutive instructions in the following seven instructions in order to satisfy dependence constraints."}], "lineHeight": 0}}, "target": {"markdown": "编译期调度：从计算能力 3.0 开始，指令调度由编译器而非硬件负责。在该架构上，每 8 条指令中就有 1 条不是真正的指令，而是由编译器插入的一组调度码。这些调度码规定了线程在其后两条相邻指令之间所必须等待的最少周期数，以满足依赖约束。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "4804b32347c3e0baf457b0306064948f", "index": 56, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Starting with Compute Capability 5.0, NVIDIA moved even more control logic away from the hardware, saving power and space. Thus instruction-level barrier has been added to the scheduling codes generated by the compiler. The scheduling codes on Compute Capabilities 5.x and 6.x occur in place of every fourth instruction. As of Compute Capability 7.0, they are embedded into each individual instruction, rather than controlling larger blocks of instructions.  \n\n", "text": "Starting with Compute Capability 5.0, NVIDIA moved even more control logic away from the hardware, saving power and space. Thus instruction-level barrier has been added to the scheduling codes generated by the compiler. The scheduling codes on Compute Capabilities 5.x and 6.x occur in place of every fourth instruction. As of Compute Capability 7.0, they are embedded into each individual instruction, rather than controlling larger blocks of instructions.\n", "alignment": "left", "unique_id": "4804b32347c3e0baf457b0306064948f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Starting with Compute Capability 5.0, NVIDIA moved even more control logic away from the hardware, saving power and space. Thus instruction-level barrier has been added to the scheduling codes generated by the compiler. The scheduling codes on Compute Capabilities 5.x and 6.x occur in place of every fourth instruction. As of Compute Capability 7.0, they are embedded into each individual instruction, rather than controlling larger blocks of instructions."}], "lineHeight": 0}}, "target": {"markdown": "从计算能力 5.0 开始，NVIDIA 将更多的控制逻辑从硬件中移出，从而节省了功耗与芯片面积。因此，指令级屏障被加入到了编译器生成的调度码中。计算能力 5.x 与 6.x 上的调度码每 4 条指令出现一次，取代该位置上的真实指令。从计算能力 7.0 开始，调度码被嵌入到每一条单独的指令之中，而不是以块为单位控制多条指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "8272d50c4af77a941ed16cb5b0938659", "index": 57, "aliyun_index": 13, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "# III. ASSEMBLER GENERATION  \n\n", "text": "III. ASSEMBLER GENERATION\n", "alignment": "left", "unique_id": "8272d50c4af77a941ed16cb5b0938659", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "III. ASSEMBLER GENERATION"}], "lineHeight": 0}}, "target": {"markdown": "## III. 汇编器生成", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "9f5a9c1dd349f8c4894de130d7a4aa73", "index": 58, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The ISA for NVIDIA GPUs changes in almost every major version. Prior works [17] [4] [3] [18] have analyzed the ISA, but only for a particular architecture. To ensure forward compatibility as the ISA continues to change across generations, we develop a generic method for decoding the instruction set and create a system which can generate GPU assemblers for newer architectures in a partially automated manner. As a result, we can quickly add compatibility for additional architectures to support open-source research work.  \n\n", "text": "The ISA for NVIDIA GPUs changes in almost every major version. Prior works [17] [4] [3] [18] have analyzed the ISA, but only for a particular architecture. To ensure forward compatibility as the ISA continues to change across generations, we develop a generic method for decoding the instruction set and create a system which can generate GPU assemblers for newer architectures in a partially automated manner. As a result, we can quickly add compatibility for additional architectures to support open-source research work.\n", "alignment": "left", "unique_id": "9f5a9c1dd349f8c4894de130d7a4aa73", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The ISA for NVIDIA GPUs changes in almost every major version. Prior works [17] [4] [3] [18] have analyzed the ISA, but only for a particular architecture. To ensure forward compatibility as the ISA continues to change across generations, we develop a generic method for decoding the instruction set and create a system which can generate GPU assemblers for newer architectures in a partially automated manner. As a result, we can quickly add compatibility for additional architectures to support open-source research work."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA GPU 的 ISA 在几乎每一个主要版本中都会发生变化。先前的研究 [17] [4] [3] [18] 也对 ISA 进行过分析，但都仅限于某一特定架构。为确保在 ISA 持续跨代演进的情况下保持前向兼容性，我们提出了一种用于解码指令集的通用方法，并构建了一个能够以半自动方式为新架构生成 GPU 汇编器的系统。借助该系统，我们能够快速为更多架构添加兼容性，以支持开源研究工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "0c6cde8ff934182f3b0f322f2b120dee", "index": 59, "aliyun_index": 15, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Our Assembler Generator makes use of our ISA Analyzer, shown in black background in Fig. 1. The ISA Analyzer takes in a list of binary and SASS assembly instruction pairs from NVIDIA's cuobjdump tool, and determines which bits in the binary instruction correspond to which components in the assembly instruction. To ensure we have enough input, we use bit flipping to prepare additional {assembly, binary} pairs for further analysis, as described below in Section III-B. Finally, the Assembler Generator component outputs C++ code capable of converting SASS assembly to binary.  \n\n", "text": "Our Assembler Generator makes use of our ISA Analyzer, shown in black background in Fig. 1. The ISA Analyzer takes in a list of binary and SASS assembly instruction pairs from NVIDIA's cuobjdump tool, and determines which bits in the binary instruction correspond to which components in the assembly instruction. To ensure we have enough input, we use bit flipping to prepare additional {assembly, binary} pairs for further analysis, as described below in Section III-B. Finally, the Assembler Generator component outputs C++ code capable of converting SASS assembly to binary.\n", "alignment": "left", "unique_id": "0c6cde8ff934182f3b0f322f2b120dee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our Assembler Generator makes use of our ISA Analyzer, shown in black background in Fig. 1. The ISA Analyzer takes in a list of binary and SASS assembly instruction pairs from NVIDIA's cuobjdump tool, and determines which bits in the binary instruction correspond to which components in the assembly instruction. To ensure we have enough input, we use bit flipping to prepare additional {assembly, binary} pairs for further analysis, as described below in Section III-B. Finally, the Assembler Generator component outputs C++ code capable of converting SASS assembly to binary."}], "lineHeight": 0}}, "target": {"markdown": "我们的汇编器生成器使用了 ISA 分析器，该分析器在图 1 中以黑色背景显示。ISA 分析器接收来自 NVIDIA 的 cuobjdump 工具所生成的二进制与 SASS 汇编指令对列表，并确定二进制指令中的各个位对应于汇编指令中的哪些组成部分。为了确保拥有足够的输入样本，我们采用比特翻转（bit flipping）方法生成额外的{汇编, 二进制}指令对以供进一步分析，具体方法将在下文第 III-B 节中介绍。最后，汇编器生成器组件输出能够将 SASS 汇编转换为二进制的 C++ 代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "0ef91026af64b2bbd8c5004f8294e1d4", "index": 60, "aliyun_index": 0, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "# A. Structure of an Instruction  \n\n", "text": "A. Structure of an Instruction\n", "alignment": "left", "unique_id": "0ef91026af64b2bbd8c5004f8294e1d4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Structure of an Instruction"}], "lineHeight": 0}}, "target": {"markdown": "## A. 指令结构", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "3c471d06e003f279d7943306996012ed", "index": 61, "aliyun_index": 1, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "When decoding an instruction, it is vital to gather and maintain information about every component of the instruction that affects the binary encoding. The first component is the opcode. We treat bits which indicate the expected operand types as part of the opcode. For example, if two instructions are both named IADD, but one of them adds two registers whereas the other adds a register to an integer literal, then we treat them as two distinct operations due to the different encoding.  \n\n", "text": "When decoding an instruction, it is vital to gather and maintain information about every component of the instruction that affects the binary encoding. The first component is the opcode. We treat bits which indicate the expected operand types as part of the opcode. For example, if two instructions are both named IADD, but one of them adds two registers whereas the other adds a register to an integer literal, then we treat them as two distinct operations due to the different encoding.\n", "alignment": "left", "unique_id": "3c471d06e003f279d7943306996012ed", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When decoding an instruction, it is vital to gather and maintain information about every component of the instruction that affects the binary encoding. The first component is the opcode. We treat bits which indicate the expected operand types as part of the opcode. For example, if two instructions are both named IADD, but one of them adds two registers whereas the other adds a register to an integer literal, then we treat them as two distinct operations due to the different encoding."}], "lineHeight": 0}}, "target": {"markdown": "在解码一条指令时，收集并维护指令中每一个影响二进制编码的组成部分的信息至关重要。第一个组成部分是操作码。我们将那些用于指示预期操作数类型的位视作操作码的一部分。例如，若两条指令均名为 IADD，但其中一条将两个寄存器相加，而另一条将一个寄存器与一个整数字面量相加，那么由于编码方式不同，我们将其视作两种不同的操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "dc862c9303ca45a1be352e23b97b3c8f", "index": 62, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The second component of the instruction is operands. CUDA operands can be one of the following types such as literal value, register, predicate register, special register, bit-field, memory, constant memory, texture shape, texture channel, and etc. Most of these are encoded with a single value, but memory operands may be represented by up to two values (register and offset), and constant memory by up to three (bank, register, and offset). Many instructions allow for one or more optional unary operations to be attached to their operands: arithmetic-negation, bitwise-complement, absolute value, and logical-negation, each of which is typically encoded as a single bit.  \n\n", "text": "The second component of the instruction is operands. CUDA operands can be one of the following types such as literal value, register, predicate register, special register, bit-field, memory, constant memory, texture shape, texture channel, and etc. Most of these are encoded with a single value, but memory operands may be represented by up to two values (register and offset), and constant memory by up to three (bank, register, and offset). Many instructions allow for one or more optional unary operations to be attached to their operands: arithmetic-negation, bitwise-complement, absolute value, and logical-negation, each of which is typically encoded as a single bit.\n", "alignment": "left", "unique_id": "dc862c9303ca45a1be352e23b97b3c8f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The second component of the instruction is operands. CUDA operands can be one of the following types such as literal value, register, predicate register, special register, bit-field, memory, constant memory, texture shape, texture channel, and etc. Most of these are encoded with a single value, but memory operands may be represented by up to two values (register and offset), and constant memory by up to three (bank, register, and offset). Many instructions allow for one or more optional unary operations to be attached to their operands: arithmetic-negation, bitwise-complement, absolute value, and logical-negation, each of which is typically encoded as a single bit."}], "lineHeight": 0}}, "target": {"markdown": "指令的第二个组成部分是操作数。CUDA 操作数可以是以下类型之一：字面量值、寄存器、谓词寄存器、特殊寄存器、位域、内存、常量内存、纹理形状、纹理通道等。其中大多数由单个值编码，而内存操作数可由最多两个值（寄存器和偏移量）表示，常量内存则可由最多三个值（存储体、寄存器和偏移量）表示。许多指令允许在其操作数上附加一个或多个可选的一元运算：算术取反、按位取反、绝对值以及逻辑取反，每种运算通常由单个位编码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "2769bec5e556b7ab340c78b642b7a97a", "index": 63, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Hexadecimal (integer literal) operands need to be handled specially during analysis, because they are encoded differently depending on the type of instruction. For control flow instructions the assembly will typically use absolute addresses whereas the binary encoding will use relative offsets. Furthermore, a negative value might be handled by directly encoding a negative value, or by simply enabling a unary arithmetic-negation bit.  \n\n", "text": "Hexadecimal (integer literal) operands need to be handled specially during analysis, because they are encoded differently depending on the type of instruction. For control flow instructions the assembly will typically use absolute addresses whereas the binary encoding will use relative offsets. Furthermore, a negative value might be handled by directly encoding a negative value, or by simply enabling a unary arithmetic-negation bit.\n", "alignment": "left", "unique_id": "2769bec5e556b7ab340c78b642b7a97a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Hexadecimal (integer literal) operands need to be handled specially during analysis, because they are encoded differently depending on the type of instruction. For control flow instructions the assembly will typically use absolute addresses whereas the binary encoding will use relative offsets. Furthermore, a negative value might be handled by directly encoding a negative value, or by simply enabling a unary arithmetic-negation bit."}], "lineHeight": 0}}, "target": {"markdown": "十六进制（整数字面量）操作数在分析过程中需要特殊处理，因为其编码方式会随指令类型的不同而变化。对于控制流指令，汇编代码通常使用绝对地址，而二进制编码则使用相对偏移量。此外，对于负值，可能直接以负值形式编码，也可能仅通过启用一元算术取反位来处理。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "7979a5cf1df61ce22b517031acbc46f4", "index": 64, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Another important component of the instruction is its optional modifiers. Most modifiers are attached to the opcode in the assembly, though there are exceptions, in which one or more of them are instead attached to operands. Some modifiers act as simple boolean values that flip a single bit, but many instructions have more complicated modifiers with a range of possible values. For example, several instructions make use of a two-bit logic modifier, which can be \".AND\" if the operation will perform a logical and, \".OR\" if the operation will perform a logical or, or \".XOR\" if the operation will perform a logical exclusive-or. The GPU does not have separate instructions dedicated to each of these logical operations, so an understanding of these modifiers is valuable.  \n\n", "text": "Another important component of the instruction is its optional modifiers. 或时取 \".XOR\"。GPU 并没有为这些逻辑运算分别设置专用指令，因此理解这些修饰符具有重要意义。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "c7cea1b4d935688f05f325213ffe4626", "index": 65, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Certain instructions expect multiple modifiers of the same type, in which case their order has important meaning. For example, the PSETP (predicate set-predicate) instruction uses two logic steps to reduce three predicate registers into a single value. PSETP.AND.OR will apply **and** and then **or**, whereas PSETP.OR.AND will do the opposite and has a different encoding. This is why it is necessary to know the type of these modifiers. Another example is the format modifiers which can appear twice in cast instructions, such as the F2F instruction, which casts a numeric value from one floating-point format to another floating-point format. Using our knowledge of the types of each modifier, our Assembler Generator is able to  \n\n", "text": "Certain instructions expect multiple modifiers of the same type, in which case their order has important meaning. For example, the PSETP (predicate set-predicate) instruction uses two logic steps to reduce three predicate registers into a single value. PSETP.AND.OR will apply **and** and then **or**, whereas PSETP.OR.AND will do the opposite and has a different encoding. This is why it is necessary to know the type of these modifiers. Another example is the format modifiers which can appear twice in cast instructions, such as the F2F instruction, which casts a numeric value from one floating-point format to another floating-point format. Using our knowledge of the types of each modifier, our Assembler Generator is able to\n", "alignment": "left", "unique_id": "c7cea1b4d935688f05f325213ffe4626", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": { ated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "d0627b87ce1eddeb6657bdd711e5f5c5", "index": 68, "aliyun_index": 8, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "# B. Analyzing the ISA  \n\n", "text": "B. Analyzing the ISA\n", "alignment": "left", "unique_id": "d0627b87ce1eddeb6657bdd711e5f5c5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Analyzing the ISA"}], "lineHeight": 0}}, "target": {"markdown": "## B. 分析 ISA", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "c3f98a2196a61f29d74ad6d7db85ab9c", "index": 69, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The first task before analyzing the ISA is to gather enough instruction {assembly, binary} pairs as input. This is vital, since with little data, it is impossible to determine precisely which bits correspond to which parts of the instruction and which encoding rules are used. We start by gathering multiple executable from real source programs, extracting the assembly and binary mapping with cuobjdump, and giving them to our ISA Analyzer's parser. We gathered executable from the CUDA SDK [19] and Rodinia benchmark suite [20]. After processing all of the input samples, we expand our data set via our bit flipper module.  \n\n", "text": "The first task before analyzing the ISA is to gather enough instruction {assembly, binary} pairs as input. This is vital, since with little data, it is impossible to determine precisely which bits correspond to which parts of the instruction and which encoding rules are used. We start by gathering multiple executable from real source programs, extracting the assembly and binary mapping with cuobjdump, and giving them to our ISA Analyzer's parser. We gathered executable from the CUDA SDK [19] and Rodinia benchmark suite [20]. After processing all of the input samples, we expand our data set via our bit flipper module.\n", "alignment": "left", "unique_id": "c3f98a2196a61f29d74ad6d7db85ab9c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The first task before analyzing the ISA is to gather enough instruction {assembly, binary} pairs as input. This is vital, since with little data, it is impossible to determine precisely which bits correspond to which parts of the instruction and which encoding rules are used. We start by gathering multiple executable from real source programs, extracting the assembly and binary mapping with cuobjdump, and giving them to our ISA Analyzer's parser. We gathered executable from the CUDA SDK [19] and Rodinia benchmark suite [20]. After processing all of the input samples, we expand our data set via our bit flipper module."}], "lineHeight": 0}}, "target": {"markdown": "在分析 ISA 之前，首要任务是收集足够数量的指令{汇编, 二进制}对作为输入。这一点至关重要，因为如果数据过少，就无法精确判定哪些位对应指令的哪些部分，也无法明确所采用的编码规则。我们首先从真实的源程序中收集多个可执行文件，利用 cuobjdump 提取汇编与二进制的映射关系，并将其交给 ISA 分析器的解析器。我们从 CUDA SDK [19] 和 Rodinia 基准测试套件 [20] 中收集可执行文件。在处理完所有输入样本后，我们通过比特翻转（bit flipper）模块进一步扩充数据集。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "d13f9fcbcc260e0d797771d7b628964a", "index": 70, "aliyun_index": 10, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Our bit flipper takes the binary instruction of every known operation as input, and outputs variants of each one, which we can inject into an executable in order to extract more assembly code. This is similar to a technique used in [4]. Each variant generated by the bit flipper is identical to the instruction it is based on, except that a single distinct bit has been flipped. These flipped instructions will permit the analyzer to infer how different parts of the instruction are affected by each precise bit. Depending on which bits are changed, a new operation might be generated instead; in this case, we resume bit flipping, repeating the process until the results converge.  \n\n", "text": "Our bit flipper takes the binary instruction of every known operation as input, and outputs variants of each one, which we can inject into an executable in order to extract more assembly code. This is similar to a technique used in [4]. Each variant generated by the bit flipper is identical to the instruction it is based on, except that a single distinct bit has been flipped. These flipped instructions will permit the analyzer to infer how different parts of the instruction are affected by each precise bit. Depending on which bits are changed, a new operation might be generated instead; in this case, we resume bit flipping, repeating the process until the results converge.\n", "alignment": "left", "unique_id": "d13f9fcbcc260e0d797771d7b628964a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our bit flipper takes the binary instruction of every known operation as input, and outputs variants of each one, which we can inject into an executable in order to extract more assembly code. This is similar to a technique used in [4]. Each variant generated by the bit flipper is identical to the instruction it is based on, except that a single distinct bit has been flipped. These flipped instructions will permit the analyzer to infer how different parts of the instruction are affected by each precise bit. Depending on which bits are changed, a new operation might be generated instead; in this case, we resume bit flipping, repeating the process until the results converge."}], "lineHeight": 0}}, "target": {"markdown": "我们的比特翻转模块以每条已知操作的二进制指令作为输入，并输出每条指令的若干变体，随后将这些变体注入可执行文件以提取更多的汇编代码。这与文献 [4] 中所采用的方法类似。比特翻转模块生成的每个变体都与其对应的原始指令完全一致，唯一区别在于变体中翻转了某一个特定的位。这些翻转后的指令将使分析器能够推断出每一位究竟如何影响指令的不同组成部分。根据被翻转的位不同，有时会生成一条新的操作；此时，我们便继续执行比特翻转过程，重复该操作直至结果收敛。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "61e63d058fe5e797646f6fe79f073887", "index": 71, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "An important consideration for the bit flipper is that the disassembler may crash without producing output upon encountering unexpected instructions. Our solution is to narrow the range of bits that are flipped - skipping over most of the opcode bits. An alternate solution would be to disassemble flipped instructions one at a time, so that the disassembler's crashes do not prevent retrieval of any valid instructions. This alternate solution may lead to more complete data set, but in practice we find that this is unnecessary; our faster implementation is sufficient to prepare an assembler which can reproduce every program we have tried.  \n\n", "text": "An important consideration for the bit flipper is that the disassembler may crash without producing output upon encountering unexpected instructions. Our solution is to narrow the range of bits that are flipped - skipping over most of the opcode bits. An alternate solution would be to disassemble flipped instructions one at a time, so that the disassembler's crashes do not prevent retrieval of any valid instructions. This alternate solution may lead to more complete data set, but in practice we find that this is unnecessary; our faster implementation is sufficient to prepare an assembler which can reproduce every program we have tried.\n", "alignment": "left", "unique_id": "61e63d058fe5e797646f6fe79f073887", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "An important consideration for the bit flipper is that the disassembler may crash without producing output upon encountering unexpected instructions. Our solution is to narrow the range of bits that are flipped - skipping over most of the opcode bits. An alternate solution would be to disassemble flipped instructions one at a time, so that the disassembler's crashes do not prevent retrieval of any valid instructions. This alternate solution may lead to more complete data set, but in practice we find that this is unnecessary; our faster implementation is sufficient to prepare an assembler which can reproduce every program we have tried."}], "lineHeight": 0}}, "target": {"markdown": "比特翻转模块的一个重要考虑因素是，反汇编器在遇到意外指令时可能会崩溃而不产生任何输出。我们的解决方案是缩小被翻转位的范围——跳过大多数操作码位。另一种方案是逐条反汇编被翻转的指令，这样即使反汇编器发生崩溃，也不会妨碍其他有效指令的获取。该替代方案或许能生成更为完整的数据集，但在实践中我们发现并无必要；我们更快的实现方式已足以构建出一个汇编器，使其能够复现我们尝试过的每一个程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "96e18d4dfd937062358da0d82079cb6e", "index": 72, "aliyun_index": 12, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The first time the analyzer encounters an operation, it makes the broadest possible assumptions. For the opcode, each modifier, and each unary operation, it assumes that every bit in the binary instruction is important to the encoding (setting every value to True inside a boolean array), and records the current values. For each operand, it searches for every subset bits of the instruction which matches each possible interpretation of each of the operand's values, recording the maximum possible matching bit-sequence(s). Upon encountering another instance of a known operation, it is compared to the recorded data, narrowing down which bits are actually important to each part of the instruction.  \n\n", "text": "The first time the analyzer encounters an operation, it makes the broadest possible assumptions. For the opcode, each modifier, and each unary operation, it assumes that every bit in the binary instruction is important to the encoding (setting every value to True inside a boolean array), and records the current values. For each operand, it searches for every subset bits of the instruction which matches each possible interpretation of each of the operand's values, recording the maximum possible matching bit-sequence(s). Upon encountering another instance of a known operation, it is compared to the recorded data, narrowing down which bits are actually important to each part of the instruction.\n", "alignment": "left", "unique_id": "96e18d4dfd937062358da0d82079cb6e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The first time the analyzer encounters an operation, it makes the broadest possible assumptions. For the opcode, each modifier, and each unary operation, it assumes that every bit in the binary instruction is important to the encoding (setting every value to True inside a boolean array), and records the current values. For each operand, it searches for every subset bits of the instruction which matches each possible interpretation of each of the operand's values, recording the maximum possible matching bit-sequence(s). Upon encountering another instance of a known operation, it is compared to the recorded data, narrowing down which bits are a ual component are present.\n", "alignment": "left", "unique_id": "f3f9a2005714a180f355728758cbb437", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Algorithms 1 and 2 describe the ISA analyzer. At a high level, the goal of these functions is to analyze every individual component of the instruction's assembly, by updating and comparing the instruction's binary value when these individual component are present."}], "lineHeight": 0}}, "target": {"markdown": "算法 1 与算法 2 描述了 ISA 分析器。从高层来看，这些函数的目标是分析指令汇编中的每一个独立组件，其方法是在这些独立组件出现时，更新并比较指令的二进制值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "43493839a8ee1d0bd04b7c0b8b92ea34", "index": 87, "aliyun_index": 2, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Algorithm 1 takes an instruction in its assembly format and its binary format. It identifies the corresponding operation in the list of known encodings (by looking up the opcode), or generates a new one with default values if the given assembly instruction is not yet a known operation. It then performs the analysis: examining the instruction's opcode bits, the predicate guard, and its modifiers, updating the operation's encoding record accordingly. The helper function in Algorithm 2 is used to analyze each of the instruction's operands, identifying the bits associated with their modifiers, unary operators, and the components of their values (up to three). An example of the search for the value-components was shown in Fig. 5, with register operands that have only a single component (the register ID).  \n\n", "text": "Algorithm 1 takes an instruction in its assembly format and its binary format. It identifies the corresponding operation in the list y 3.x. We have provided a complete table of opcodes for all decoded instructions in Zenodo [13].\n", "alignment": "left", "unique_id": "2e46b2294a7162541c07e55360c17003", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table II shows a set of common instructions used in GPU, and their effects. We use 'regX' to refer to 32-bit general registers, 'pX' to refer to 1-bit predicate registers, and 'composite' to refer to operands with multiple possible types. The mapping between the bit-sequence and the operand/opcode/modifier in the assembly instruction is shown in Fig. 8, for instance, reg1 bits are 2 to 9 in computing capability 3.x. We have provided a complete table of opcodes for all decoded instructions in Zenodo [13]."}], "lineHeight": 0}}, "target": {"markdown": "表 II 展示了 GPU 中常用的一组指令及其效果。我们使用 `regX` 表示 32 位通用寄存器，`pX` 表示 1 位谓词寄存器，`composite` 表示具有多种可能类型的操作数。位序列与汇编指令中操作数/操作码/修饰符之间的映射关系如图 8 所示，例如，在计算能力 3.x 中，`reg1` 的位为 2 到 9。我们已在 Zenodo [13] 中提供了所有已解码指令的完整操作码表。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 102}, {"source": {"block_id": "8b0ea94bb6fd4265caf81ec774d01d90", "index": 103, "aliyun_index": 6, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "# A. Operands  \n\n", "text": "A. Operands\n", "alignment": "left", "unique_id": "8b0ea94bb6fd4265caf81ec774d01d90", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Operands"}], "lineHeight": 0}}, "target": {"markdown": "## A. 操作数", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edite gister ID, and the highest bit is used for logical negation. The predicate register with ID 7 is the null predicate, which always holds a value of true, and is written as PT in the assembly code.  \n\n", "text": "Predicate registers hold boolean values, and are encoded as three bits. Additionally, predicates can be used as conditional **guards** for most instructions, allowing individual threads to selectively skip execution of instructions. The conditional guard's binary is in a different location for each distinct ISA, but is always four bits: the lower three bits are the predicate register ID, and the highest bit is used for logical negation. The predicate register with ID 7 is the null predicate, which always holds a value of true, and is written as PT in the assembly code.\n", "alignment": "left", "unique_id": "5d27ccd99676b6af5fffa27281b46906", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Predicate registers hold boolean values, and are encoded as three bits. Additionally, predicates can be used as conditional **guards** for most instructions, allowing individual threads to selectively skip execution of instructions. The conditional guard's binary is in a different location for each distinct ISA, but is always four bits: the lower three bits are the predicate register ID, and the highest bit is used for logical negation. The predicate register with ID 7 is the null predicate, which always holds a value of true, and is written as PT in the assembly code."}], "lineHeight": 0}}, "target": {"markdown": "谓词寄存器保存布尔值，并被编码为 3 位。此外，谓词可用作大多数指令的条件**守卫**，从而允许各个线程有选择地跳过指令的执行。条件守卫的二进制位在每种不同的 ISA 中位置不同，但始终为 4 位：低 3 位是谓词寄存器 ID，最高一位用于逻辑取反。ID 为 7 的谓词寄存器是空谓词，其值始终为真，在汇编代码中写作 PT。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false},  "Special registers are only used in the S2R instruction, and are encoded with eight bits. In the assembly code they can be written as SRx for some value x, but are more commonly used with the English name of the associated value. For example, the special register \"SR_CLOCKLO\" can be used to retrieve the lowest 32-bits of the clock value, and the special register \"SR_TID_Y\" can be used to retrieve the current thread's ID along the thread block's y-dimension. Table III shows common special registers and their encoded values. The encodings for most special registers remain the same across GPU generations, though additional special registers are added over time. We have provided a more complete list of special registers in Zenodo [21]."}], "lineHeight": 0}}, "target": {"markdown": "特殊寄存器仅用于 S2R 指令中，并使用 8 位编码。在汇编代码中，它们可以写作 `SRx`（其中 x 为某个值），但更常见的是使用其相关值的英文名称。例如，特殊寄存器 `\"SR_CLOCKLO\"` 可用于获取时钟值的低 32 位，特殊寄存器 `\"SR_TID_Y\"` 可用于获取当前线程在线程块 y 维度上的 ID。表 III 展示了常用的特殊寄存器及其编码值。大多数特殊寄存器的编码在不同的 GPU 代次之间保持不变，但随着时间的推移会添加新的特殊寄存器。我们在 Zenodo [21] 中提供了更完整的特殊寄存器列表。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "7236b9c9086c61fbf7a8105d8e1afe07", "index": 109, "aliyun_index": 12, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Memory operands have a register and a literal offset, regardless of whether they are used for global memory, local memory, or shared memory. The literal offset is usually either 24 bits or 32 bits, depending on the instruction.  \n\n", "text": "Memory operands have a register and a literal offset, regardless of whether they are used for global memory, local memory, or shared memory. The literal offset is usually either 24 bits or 32 bits, depending on the instruction.\n", "alignment": "left", "unique_id": "7236b9c9086c61fbf7a8105d8e1afe07", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Memory operands have a register and a literal offset, regardless of whether they are used for global memory, local memory, or shared memory. The literal offset is usually either 24 bits or 32 bits, depending on the instruction."}], "lineHeight": 0}}, "target": {"markdown": "内存操作数包含一个寄存器和一个字面量偏移量，无论它们是用于全局内存、局部内存还是共享内存。字面量偏移量通常为 24 位或 32 位，具体取决于指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "71d137dc198737c39a934d146fb8305f", "index": 110, "aliyun_index": 13, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Constant memory operands point to a type of read-only memory. There is a dedicated load-constant-memory (LDC) instruction, but constant memory operands are also usable in other instructions. They have up to three components: a memory bank, a register, and a literal offset. The bank and offset use a combined 19, 20, or 21 bits for their encoding, depending on the ISA and the instruction. When using 19 or 21 bits, the highest 5 are the bank, and the rest are the offset. When it uses 20 bits, the lowest 16 are the offset, and the highest four and lowest one are the bank. The register component, which is added to the offset, is only used in the LDC instruction and some control-flow instructions.  \n\n", "text": "Constant memory operands point to a type of read-only memory. There is a dedicated load-constant-memory (LDC) instruction, but constant memory operands are also usable in other instructions. They have up to three components: a memory bank, a register, and a literal offset. The bank and offset use a combined 19, 20, or 21 bits for their encoding, depending on the ISA and the instruction. When using 19 or 21 bits, the highest 5 are the bank, and the rest are the offset. When it uses 20 bits, the lowest 16 are the offset, and the highest four and lowest one are the bank. The register component, which is added to the offset, is only used in the LDC instruction and some control-flow instructions.\n", "alignment": "left", "unique_id": "71d137dc198737c39a934d146fb8305f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Constant memory operands point to a type of read-only memory. There is a dedicated load-constant-memory (LDC) instruction, but constant memory operands are also usable in other instructions. They have up to three components: a memory bank, a register, and a literal offset. The bank and offset use a combined 19, 20, or 21 bits for their encoding, depending on the ISA and the instruction. When using 19 or 21 bits, the highest 5 are the bank, and the rest are the offset. When it uses 20 bits, the lowest 16 are the offset, and the highest four and lowest one are the bank. The register component, which is added to the offset, is only used in the LDC instruction and some control-flow instructions."}], "lineHeight": 0}}, "target": {"markdown": "常量内存操作数指向一种只读内存类型。有一个专用的加载常量内存（LDC）指令，但常量内存操作数也可用于其他指令。它们最多包含三个组成部分：一个内存存储体、一个寄存器和一个字面量偏移量。存储体和偏移量根据 ISA 和指令的不同，共同使用 19、20 或 21 位进行编码。当使用 19 位或 21 位时，高 5 位表示存储体，其余位表示偏移量。当使用 20 位时，低 16 位为偏移量，高 4 位和最低 1 位为存储体。寄存器组成部分将被加到偏移量上，仅在 LDC 指令和一些控制流指令中使用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "a85c10e2f43b27240ab5ba1376b4e5eb", "index": 111, "aliyun_index": 14, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Texture operations have a texture operand, whose value is a shape such as 1D, 2D-Array, CUBE, etc, and is encoded as three bits. On some architectures, texture operations also have a channel operand with some combination of \"R\", \"G\", \"B\", and \"A\", encoded with up to four bits.  \n\n", "text": "Texture operations have a texture operand, whose value is a shape such as 1D, 2D-Array, CUBE, etc, and is encoded as three bits. On some architectures, texture operations also have a channel operand with some combination of \"R\", \"G\", \"B\", and \"A\", encoded with up to four bits.\n", "alignment": "left", "unique_id": "a85c10e2f43b27240ab5ba1376b4e5eb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Texture operations have a texture operand, whose value is a shape such as 1D, 2D-Array, CUBE, etc, and is encoded as three bits. On some architectures, texture operations also have a channel operand with some combination of \"R\", \"G\", \"B\", and \"A\", encoded with up to four bits."}], "lineHeight": 0}}, "target": {"markdown": "纹理操作具有一个纹理操作数，其值是一个形状，例如 1D、2D-Array、CUBE 等，并使用 3 位编码。在某些架构上，纹理操作还具有一个通道操作数，由 \"R\"、\"G\"、\"B\" 和 \"A\" 的某种组合组成，使用最多 4 位编码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "34f7de5079c45b1fa06d03b1416dde77", "index": 112, "aliyun_index": 0, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Barrier operations may use an SB operand (written as SBx for some integer x) and a bitfield operand (written as a set of bit indices).  \n\n", "text": "Barrier operations may use an SB operand (written as SBx for some integer x) and a bitfield operand (written as a set of bit indices).\n", "alignment": "left", "unique_id": "34f7de5079c45b1fa06d03b1416dde77", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, ontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Finally, instructions may use literal, numeric values of various sizes. In assembly code these are usually written as hexadecimal values, though in floating-point operations they may be written in decimal instead. Notably, the encoding for floating-point literals does not quite match the IEEE Standard, due to lack of enough bits - for example, in some instructions 19 bits may be used to try to hold a 64-bit double-precision floating point value. These floating point values are handled by discarding the lowest bits until the remaining portion fits in the available space."}], "lineHeight": 0}}, "target": {"markdown": "最后，指令可以使用各种大小的字面量数值。在汇编代码中，这些数值通常以十六进制形式书写，但在浮点操作中它们也可能以十进制形式书写。值得注意的是，由于位数不足，浮点字面量的编码与 IEEE 标准并不完全匹配——例如，在某些指令中可能会使用 19 位来尝试表示一个 64 位双精度浮点值。这些浮点值的处理方式是丢弃最低位，直到剩余部分能够容纳在可用空间中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "b215953c522084bb79a4bfd8bbb18a7c", "index": 114, "aliyun_index": 2, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We use the term 'composite' to refer to a single operand that has multiple possible types. On Compute Capabilities 2.x and 3.0, the most common composite operand is 20 bits; it can either hold a 20-bit literal, a 6-bit register ID, or 20-bit constant memory location without a register component. We have also seen 16-bit composites that can either hold a literal or a register.  \n\n", "text": "We use the term 'composite' to refer to a single operand that has multiple possible types. On Compute Capabilities 2.x and 3.0, the most common composite operand is 20 bits; it can either hold a 20-bit literal, a 6-bit register ID, or 20-bit constant memory location without a register component. We have also seen 16-bit composites that can either hold a literal or a register.\n", "alignment": "left", "unique_id": "b215953c522084bb79a4bfd8bbb18a7c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use the term 'composite' to refer to a single operand that has multiple possible types. On Compute Capabilities 2.x and 3.0, the most common composite operand is 20 bits; it can either hold a 20-bit literal, a 6-bit register ID, or 20-bit constant memory location without a register component. We have also seen 16-bit composites that can either hold a literal or a register."}], "lineHeight": 0}}, "target": {"markdown": "我们使用\"复合\"这一术语来指代具有多种可能类型的单一操作数。在计算能力 2.x 和 3.0 上，最常见的复合操作数为 20 位；它可以容纳一个 20 位的字面量、一个 6 位的寄存器 ID，或者一个不带寄存器组成部分的 20 位常量内存位置。我们也见过 16 位的复合操作数，它可以容纳一个字面量或一个寄存器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "bb68c7ae8fedeea54091d62c74918c7c", "index": 115, "aliyun_index": 3, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "On $\\tilde{\\mathcal{C}}$ compute Capabilities 3.x through 6.x, the most common composite is 19 bits; it can either hold a 19-bit literal, an 8-bit register, or a 19-bit constant memory location without a register component. We have also seen 24-bit and 32-bit composites which can hold either a literal of that size or a 21-bit constant memory location without the register component.  \n\n", "text": "On $\\tilde{\\mathcal{C}}$ compute Capabilities 3.x through 6.x, the most common composite is 19 bits; it can either hold a 19-bit literal, an 8-bit register, or a 19-bit constant memory location without a register component. We have also seen 24-bit and 32-bit composites which can hold either a literal of that size or a 21-bit constant memory location without the register component.\n", "alignment": "left", "unique_id": "bb68c7ae8fedeea54091d62c74918c7c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On $\\tilde{\\mathcal{C}}$ compute Capabilities 3.x through 6.x, the most common composite is 19 bits; it can either hold a 19-bit literal, an 8-bit register, or a 19-bit constant memory location without a register component. We have also seen 24-bit and 32-bit composites which can hold either a literal of that size or a 21-bit constant memory location without the register component."}], "lineHeight": 0}}, "target": {"markdown": "在计算能力 3.x 到 6.x 上，最常见的复合操作数为 19 位；它可以容纳一个 19 位的字面量、一个 8 位的寄存器，或者一个不带寄存器组成部分的 19 位常量内存位置。我们也见过 24 位和 32 位的复合操作数，它们可以容纳该大小的字面量或不带寄存器组成部分的 21 位常量内存位置。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "4bd4df794c837fd62a1498c260ae84cf", "index": 116, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "In Fig. 8, we show common locations and sizes for different operands in each of the architectures that we have studied. In Zenodo [14] we have provided the operands for specific instructions that have been decoded. In Table II, we show a subset of this data, with several common instructions for version 3.x of the ISA. We refer to general registers as regX and predicate registers as pX with integer values x, and texture shapes as tex.  \n\n", "text": "In Fig. 8, we show common locations and sizes for different operands in each of the architectures that we have studied. In Zenodo [14] we have provided the operands for specific instructions that have been decoded. In Table II, we show a subset of this data, with several common instructions for v n (including the first one) is"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "not a real instruction, but instead contains the instruction"}], "lineHeight": -133}}, "target": {"markdown": "该架构的 ISA 与之前版本的主要区别在于，部分指令调度从硬件转移到了编译器。对于 Kepler 设备，每隔七条指令（包括第一条在内）不是一条真正的指令，而是包含该指令", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "c2c65c265f64ad9cad4d270046cae389", "index": 121, "aliyun_index": 9, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "scheduling information for GPU. [17] developed an assembler\nfor Compute Capability 2.x, but also explored this architecture\ndue to its similar ISA. The aforementioned latency instructions\nhave no official name of which we are aware, but Asfermi used\nthe name **SCHI** to represent them, which we also use in this\nwork.  \n\n", "text": "scheduling information for GPU. [17] developed an assembler\nfor Compute Capability 2.x, but also explored this architecture\ndue to its similar ISA. The aforementioned latency instructions\nhave no official name of which we are aware, but Asfermi used\nthe name **SCHI** to represent them, which we also use in this\nwork.\n", "alignment": "left", "unique_id": "c2c65c265f64ad9cad4d270046cae389", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "scheduling information for GPU. [17] developed an assembler"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "for Compute Capability 2.x, but also explored this architecture"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "due to its similar ISA. The aforementioned latency instructions"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "have no official name of which we are aware, but Asfermi used"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the name **SCHI** to represent them, which we also use in this"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "work."}], "lineHeight": -155}}, "target": {"markdown": "GPU 的调度信息。[17] 为计算能力 2.x 开发了一个汇编器，但由于其 ISA 相似，也探索了该架构。上述延迟指令在我们所知的范围内没有官方名称，但 Asfermi 使用 **SCHI** 来表示它们，在本文中我们也使用这一名称。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "0b16e7bea303d59d6e3294f4b7b5b692", "index": 122, "aliyun_index": 10, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We refer to the least significant bit as bit 0, and the most significant bit as bit 63. Bits 0-3 of the SCHI instruction contain the value 7. Bits 4-11 control the minimum number of cycles that the GPU must wait between dispatching the first following instruction and the second. Bits 12-19 control the minimum cycles between the second following instruction and the third. This continues for the next five groups of eight bits. Finally, bits 60-63 hold the value 2. The seven dispatch values can hold a value of 0x4 when the associated instruction is able to be dispatched in the same cycle as the next, or a value between 0x20 and 0x3f to mean the minimum number of cycles between them is the value minus 15.  \n\n", "text": "We refer to the least significant bit as bit 0, and the most significant bit as bit 63. Bits 0-3 of the SCHI instruction contain the value 7. Bits 4-11 control the minimum number of cycles that the GPU must wait between dispatching the first following instruction and the second. Bits 12-19 control the minimum cycles between the second following instruction and the third. This continues for the next five groups of eight bits. Finally, bits 60-63 hold the value 2. The seven dispatch values can hold a value of 0x4 when the associated instruction is able to be dispatched in the same cycle as the next, or a value between 0x20 and 0x3f to mean the minimum number of cycles between them is the value minus 15.\n", "alignment": "left", "unique_id": "0b16e7bea303d59d6e3294f4b7b5b692", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We refer to the least significant bit as bit 0, and the most significant bit as bit 63. Bits 0-3 of the SCHI instruction contain the value 7. Bits 4-11 control the minimum number of cycles that the GPU must wait between dispatching the first following instruction and the second. Bits 12-19 control the minimum cycles between the second following instruction and the third. This continues for the next five groups of eight bits. Finally, bits 60-63 hold the value 2. The seven dispatch values can hold a value of 0x4 when the associated instruction is able to be dispatched in the same cycle as the next, or a value between 0x20 and 0x3f to mean the minimum number of cycles between them is the value minus 15."}], "lineHeight": 0}}, "target": {"markdown": "我们将最低有效位称为第 0 位，将最高有效位称为第 63 位。SCHI 指令的第 0-3 位包含值 7。第 4-11 位控制 GPU 在分派第一条后续指令与第二条后续指令之间必须等待的最少周期数。第 12-19 位控制第二条后续指令与第三条后续指令之间的最少周期数。接下来的五个八位组以此类推。最后，第 60-63 位包含值 2。当关联指令能够与下一条指令在同一周期内被分派时，相应的七个分派值可以取 0x4；若取值在 0x20 到 0x3f 之间，则表示它们之间的最少周期数为该值减去 15。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "deffc015aaa0fe1e37f75cc520c25fc5", "index": 123, "aliyun_index": 11, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Compute Capability 3.x: The remainder of the Kepler generation comprises Compute Capabilities 3.2, 3.5, and 3.7. Unlike the earlier Kepler devices, these GPUs allow threads to use up to 256 registers instead of 64, so the six bits which the previous ISA's instructions used to indicate the register are insufficient. Therefore, although the assembly code looks much like that of the previous generation, every instruction has a new encoding. A SCHI instruction now holds the value 0 in its two least significant bits and the value 2 in six most significant bits - the seven dispatch intervals have been shifted two bits, but are otherwise unchanged.  \n\n", "text": "Compute Capability 3.x: The remainder of the Kepler generation comprises Compute Capabilities 3.2, 3.5, and 3.7. Unlike the earlier Kepler devices, these GPUs allow threads to use up to 256 registers instead of 64, so the six bits which the previous ISA's instructions used to indicate the register are insufficient. Therefore, although the assembly code looks much like that of the previous generation, every instruction has a new encoding. A SCHI instruction now holds the value 0 in its two least significant bits and the value 2 in six most significant bits - the seven dispatch intervals have been shifted two bits, but are otherwise unchanged.\n", "alignment": "left", "unique_id": "deffc015aaa0fe1e37f75cc520c25fc5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compute Capability 3.x: The remainder of the Kepler generation comprises Compute Capabilities 3.2, 3.5, and 3.7. Unlike the earlier Kepler devices, these GPUs allow threads to use up to 256 registers instead of 64, so the six bits which the previous ISA's instructions used to indicate the register are insufficient. Therefore, although the assembly code looks much like that of the previous generation, every instruction has a new encoding. A SCHI instruction now holds the value 0 in its two least significant bits and the value 2 in six most significant bits - the seven dispatch intervals have been shifted two bits, but are otherwise unchanged."}], "lineHeight": 0}}, "target": {"markdown": "计算能力 3.x：Kepler 代的其余部分包括计算能力 3.2、3.5 和 3.7。与早期的 Kepler 设备不同，这些 GPU 允许线程使用多达 256 个寄存器，而非 64 个，因此先前 ISA 的指令中用于表示寄存器的六位已不再足够。因此，尽管汇编代码看起来与上一代非常相似，但每条指令都采用了新的编码方式。SCHI 指令现在在其最低两位中包含值 0，在最高六位中包含值 2——七个分派间隔已移位两位，但其他方面保持不变。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "cf25c50eec95de0850d70fcab134487d", "index": 124, "aliyun_index": 12, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "The manner in which the disassembler presents SCHI instructions on Kepler is not conducive to analysis or editing. It provides the 64-bit binary value of the entire SCHI, but offers no indication of its meaning. Furthermore, since the SCHI describes a group of consecutive instructions, addition, deletion, or reordering of instructions becomes more complicated. To solve these issues, we use our framework to split up each SCHI, and place their values in-line with the assembly instructions, as described below.  \n\n", "text": "The manner in which the disassembler presents SCHI instructions on Kepler is not conducive to analysis or editing. It provides the 64-bit binary value of the entire SCHI, but offers no indication of its meaning. Furthermore, since the SCHI describes a group of consecutive instructions, addition, deletion, or reordering of instructions becomes more complicated. To solve these issues, we use our framework to split up each SCHI, and place their values in-line with the assembly instructions, as described below.\n", "alignment": "left", "unique_id": "cf25c50eec95de0850d70fcab134487d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The manner in which the disassembler presents SCHI instructions on Kepler is not conducive to analysis or editing. It provides the 64-bit binary value of the entire SCHI, but offers no indication of its meaning. Furthermore, since the SCHI describes a group of consecutive instructions, addition, deletion, or reordering of instructions becomes more complicated. To solve these issues, we use our framework to split up each SCHI, and place their values in-line with the assembly instructions, as described below."}], "lineHeight": 0}}, "target": {"markdown": "Kepler 上反汇编器呈现 SCHI 指令的方式不利于分析或编辑。它提供了整个 SCHI 的 64 位二进制值，但并未给出其含义的任何提示。此外，由于 SCHI 描述的是一组连续的指令，对指令进行添加、删除或重排会更加复杂。为了解决这些问题，我们使用我们的框架将每个 SCHI 拆分，并将其值内联放置在汇编指令中，如下文所述。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "e2901e403a14a56ee22d0fa9594d300b", "index": 125, "aliyun_index": 13, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Fig. 9 shows how we extract the separate SCHI values on Compute Capability 3.x, associating them with individual instructions. In this example, the scheduling codes indicate that the thread waits at least 0x2f minus 0x1f cycles (16) after dispatching the first instruction, 0 cycles after dispatching the second instruction, 0x23 minus 0x1f cycles (4) after each  "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "62bd559b7dbc84a26722ee7024d09eb7", "index": 131, "aliyun_index": 3, "page_num": 8, "type": "figure", "sub_type": "none", "markdown": "![62bd559b7dbc84a26722ee7024d09eb7.jpeg](figures/62bd559b7dbc84a26722ee7024d09eb7_f82512d2.png)  \n\n", "text": "Bit Position:   0    2     5      10       18        23         47        55\n                |----|-----|------|--------|---------|----------|---------|\nBinary Pattern: 00 00000000 00000000 1110 0 000000000000000000000000 00000000000000000000000000000000000000000000000000000000\n                |p1 | p2  | reg1 | reg2   | guard   | reg3     | ...     | ...     |\n                |    |     |      |        |         | special reg |       |         |\n                |    |     |      |        |         | composite   |       |         |\n                |    |     |      |        |         | const/lit composite |       |         |\n                |    |     |      |        |         | 32-bit literal    |       |         |\n                |    |     |      |        |         | 24-bit literal    |       |         |\n                |    |     |      |        |         | 6-bit lit         |       |         |\n                |    |     |      |        |         | 4-bit lit         |       |         |\n                |    |     |      |        |         | tex               |       |         |\n                |    |     |      |        |         | 5-bit lit         |       |         |\n                |    |     |      |        |         | p4                |       |         |\n                |    |     |      |        |         | p5                |       |         |\n                |    |     |      |        |         | reg4              |       |         |\n                |    |     |      |        |         |                   | p6      |         |\n                |    |     |      |        |         |                   | 11-bit literal |\n                |    |     |      |        |         |                   | 5-bit lit.     |\n\n[reg3 (6)] [p4 (4)] [tex (4)] [p5 (5)] [reg4 (5)] = 24 bits\n\n[24-bit composite (23–46)] + [p6 (47–54)] = 32 bits\n\nBits:    0  2  5  10  18  23  47  55\n         |  |  |   |   |   |   |   |\nValue:   00 00000000 00000000 1110 0 000000000000000000000000 00000000000000000000000000000000000000000000000000000000\nFields:  p1 p2 reg1 reg2 guard reg3...p6...5-bit lit.\n\n\n\nIn this case:\n- All predicates and registers are zero except `guard` = `11100`₂ = 28₁₀\n- Rest are zero → likely a NOP or default state.\n\n---\n\n## Conclusion\n\nThis instruction format supports flexible operand encoding via:\n\n- Multiple small predicates (`p1`, `p2`, `p4`, `p5`, `p6`)\n- Up to four register operands (`reg1`–`reg4`)\n- Guarded execution (`guard`)\n- Texture operations (`tex`)\n- Large immediates via composites (24-bit or 32-bit literals)\n- Small immediates (5-bit, 6-bit, etc.)\n\nDesigned for GPU compute shaders (Compute Capability 3.x), allowing dense packing of controls and data within a 64-bit instruction word.\n\n--- \n\n✅ This Markdown document fully captures the structure, labeling, bit widths, and semantic groupings from the provided diagram without omission or distortion.", "alignment": "left", "unique_id": "62bd559b7dbc84a26722ee7024d09eb7", "edited": false, "extra": {}}, "target": {"markdown": "![62bd559b7dbc84a26722ee7024d09eb7.jpeg](figures/62bd559b7dbc84a26722ee7024d09eb7_f82512d2.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "d461619a50c4542d6d382472d1334267", "index": 132, "aliyun_index": 4, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "# Compute Capabilities 5.x an 4` 上方）\n    - `4-bit lit.`：另一个 4 位立即数（紧邻 `3-bit tex`）\n- **值示例**：`0000000000000000000`（全零）\n\n> 📌 注意：“const/lit composite” 虚线框覆盖此区域，表明这是一个常量/立即数组成的复合体。\n\n### 5. 位 39–43：`p5 / 5-bit lit. / 13-bit literal`\n- **起始位**：39\n- **长度**：5 位（到 43）\n- **字段**：\n  - `p5`：标志位或参数位\n  - `5-bit lit.`：5 位立即数（与 `p5` 同属一段）\n  - 下方标注 “13-bit literal” —— 实际应跨越更多位（见下一节）\n\n> ⚠️ 此处存在视觉歧义：虽然 `p5` 和 `5-bit lit.` 占据 5 位（39–43），但 “13-bit literal” 的虚线框向下延伸，暗示它实际从 39 开始延续到 51（即 13 位）。需结合后续字段确认。\n\n### 6. 位 44–51：`reg5 / p6 / p7 / channel`\n- **起始位**：44\n- **长度**：8 位（到 51）\n- **组成**：\n  - `reg5`：主寄存器（占据主要部分）\n  - `p6`：位于 44 之后某处\n  - `p7`：紧随 `p6`\n  - `channel`：通道选择字段（可能是低几位）\n- **值示例**：`00000000`\n\n> 📌 “large const/lit composite” 虚线框从 20 延伸至 51，涵盖 `reg3`, `reg4`, `reg5` 及相关立即数字段，总长 32 位（20–51 = 32 bits），对应 “32-bit literal”。\n\n### 7. 位 52–?：`p8 / 5-bit lit. / p9`\n- **起始位**：52\n- **长度**：至少 10 位（因有 `5-bit lit.` + `p8` + `p9`）\n- **组成**：\n  - `p8`：第一个标志位\n  - `5-bit lit.`：5 位立即数\n  - `p9`：最后一个标志位\n- **值示例**：`0000000000...`（继续补零）\n\n---\n\n## 复合字段汇总（由虚线框定义）\n\n| 名称                     | 起始位 | 结束位 | 长度 | 包含字段                          |\n|--------------------------|--------|--------|------|-----------------------------------|\n| `const/lit composite`    | 20     | 38     | 19   | reg3, p4, 3-bit tex, 4-bit lit., 5-bit lit. (part of reg4?) |\n| `large const/lit composite` | 20     | 51     | 32   | 上述 + reg5, p5, p6, p7, channel, 13-bit literal |\n| `32-bit literal`         | 20     | 51     | 32   | 同上                              |\n| `13-bit literal`         | 39     | 51     | 13   | p5, 5-bit lit., reg5, p6, p7, channel? （需进一步澄清） |\n\n> 💡 关键观察：\n> - “13-bit literal” 很可能是指从位 39 到 51 的连续 13 位，尽管图中将其画在 `p5` 下方。\n> - “reg4” 被标注在 `5-bit lit.` 下方，可能意味着 `reg4` 是一个 5 位寄存器，位于 34–38 位之间（但图中未明确标出起始位）。\n> - “guard” 字段是固定的 `1110`，可能作为同步头或有效性标记。\n\n---\n\n## 位索引参考表（关键断点）\n\n| 位号 | 含义                 |\n|------|----------------------|\n| 0    | p1                   |\n| 1    | p2                   |\n| 8    |
