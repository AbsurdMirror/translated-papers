"sub_type": "none", "markdown": "• Figure 4 is an example of a graphical representation of multiple recorded time marks, which in this case, it has been employed for discovering the issue policy of warps as explained in section 5.1.2.  \n\n", "text": "• Figure 4 is an example of a graphical representation of multiple recorded time marks, which in this case, it has been employed for discovering the issue policy of warps as explained in section 5.1.2.\n", "alignment": "left", "unique_id": "9394d5511ecffdcfce77a6be8129c9a7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Figure 4 is an example of a graphical representation of multiple recorded time marks, which in this case, it has been employed for discovering the issue policy of warps as explained in section 5.1.2."}], "lineHeight": 0}}, "target": {"markdown": "• 图 4 是对多条记录时刻进行可视化表示的一个例子，在此例中，该方法被用于发现 warp 的发射策略，相关内容见 5.1.2 节。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "0e6cd92d063603796a1b66540ae72d99", "index": 42, "aliyun_index": 3, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![0e6cd92d063603796a1b66540ae72d99.jpeg](figures/0e6cd92d063603796a1b66540ae72d99_c4d08ddb.png)  \n\n", "text": "CLOCK  \nNOP  \nFFMA R11, R10, R12, R14  \nFFMA R13, R16, R_X, R_Y  \nNOP  \nCLOCK\n\n\n\n说明：\n- 每一行指令按原顺序列出。\n- 保留原始大小写（如 `CLOCK`, `NOP`, `FFMA`）。\n- 寄存器名称（如 `R11`, `R_X`）保持原样。\n- 无额外注释或解释，仅忠实还原图像中的文本内容。", "alignment": "left", "unique_id": "0e6cd92d063603796a1b66540ae72d99", "edited": false, "extra": {}}, "target": {"markdown": "![0e6cd92d063603796a1b66540ae72d99.jpeg](figures/0e6cd92d063603796a1b66540ae72d99_c4d08ddb.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "fb8e34fbd813f65d1b2954d4c9a8e802", "index": 43, "aliyun_index": 4, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 1: Code used to check Register File read conflicts.  \n\n", "text": "Listing 1: Code used to check Register File read conflicts.\n", "alignment": "left", "unique_id": "fb8e34fbd813f65d1b2954d4c9a8e802", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 1: Code used to check Register File read conflicts."}], "lineHeight": 0}}, "target": {"markdown": ">清单 1：用于检测寄存器文件读冲突的代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "a5e5aac75be73dd7c186ea6665c7e34d", "index": 44, "aliyun_index": 5, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Although NVIDIA has no official tool to write SASS code (NVIDIA assembly language) directly, various third-party tools allow programmers to rearrange and modify assembly instructions (including control bits). These tools are used, for example, to optimize performance in critical kernels when the compiler generated code is not optimal. MaxAS [36] was the first tool for modifying SASS binaries. Later on, other tools such as KeplerAS [93, 94] were developed for Kepler architecture. Then, TuringAS [90] and CUAssembler [29] appeared to support more recent architectures. We have decided to use CUAssembler due to its flexibility, extensibility, and support for the latest hardware.  \n\n", "text": "Although NVIDIA has no official tool to write SASS code (NVIDIA assembly language) directly, various third-party tools allow programmers to rearrange and modify assembly instructions (including control bits). These tools are used, for example, to optimize performance in critical kernels when the compiler generated code is not optimal. MaxAS [36] was the first tool for modifying SASS binaries. Later on, other tools such as KeplerAS [93, 94] were developed for Kepler architecture. Then, TuringAS [90] and CUAssembler [29] appeared to support more recent architectures. We have decided to use CUAssembler due to its flexibility, extensibility, and support for the latest hardware.\n", "alignment": "left", "unique_id": "a5e5aac75be73dd7c186ea6665c7e34d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although NVIDIA has no official tool to write SASS code (NVIDIA assembly language) directly, various third-party tools allow programmers to rearrange and modify assembly instructions (including control bits). These tools are used, for example, to optimize performance in critical kernels when the compiler generated code is not optimal. MaxAS [36] was the first tool for modifying SASS binaries. Later on, other tools such as KeplerAS [93, 94] were developed for Kepler architecture. Then, TuringAS [90] and CUAssembler [29] appeared to support more recent architectures. We have decided to use CUAssembler due to its flexibility, extensibility, and support for the latest hardware."}], "lineHeight": 0}}, "target": {"markdown": "虽然 NVIDIA 并没有提供用于直接编写 SASS 代码（NVIDIA 汇编语言）的官方工具，但有多种第三方工具允许程序员重新组织并修改汇编指令（包括控制位）。例如，当编译器生成的代码并非最优时，这些工具可被用于对关键内核进行性能优化。MaxAS [36] 是第一个用于修改 SASS 二进制文件的工具。此后，又陆续出现了其他工具，例如面向 Kepler 架构的 KeplerAS [93, 94]。随后，TuringAS [90] 和 CUAssembler [29] 相继出现，以支持更新的硬件架构。综合考虑灵活性、可扩展性以及对最新硬件的支持，我们最终选用了 CUAssembler。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "2ce206a24a559271000849f3af5fcb66", "index": 45, "aliyun_index": 6, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## 4 Control Bits in Modern NVIDIA GPU Architectures\n", "text": "4 Control Bits in Modern NVIDIA GPU Architectures\n", "alignment": "left", "unique_id": "2ce206a24a559271000849f3af5fcb66", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4 Control Bits in Modern NVIDIA GPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Architectures"}], "lineHeight": -58}}, "target": {"markdown": "## 4 现代 NVIDIA GPU 架构中的控制位\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "d77e4ab3566921b2849262e1bd962b5e", "index": 46, "aliyun_index": 7, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The ISA of modern NVIDIA GPU architectures contains control bits and information that the compiler provides to maintain correctness. Unlike GPU architectures in previous works that check data dependence by tracking register reads and writes at run time (see section 2), these GPU architectures rely on the compiler to handle register data dependencies [62]. For this purpose, all assembly instructions include some control bits to properly manage dependencies in addition to improving performance and energy consumption.  \n\n", "text": "The ISA of modern NVIDIA GPU architectures contains control bits and information that the compiler provides to maintain correctness. Unlike GPU architectures in previous works that check data dependence by tracking register reads and writes at run time (see section 2), these GPU architectures rely on the compiler to handle register data dependencies [62]. For this purpose, all assembly instructions include some control bits to properly manage dependencies in addition to improving performance and energy consumption.\n", "alignment": "left", "unique_id": "d77e4ab3566921b2849262e1bd962b5e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The ISA of modern NVIDIA GPU architectures contains control bits and information that the compiler provides to maintain correctness. Unlike GPU architectures in previous works that check data dependence by tracking register reads and writes at run time (see section 2), these GPU architectures rely on the compiler to handle register data dependencies [62]. For this purpose, all assembly instructions include some control bits to properly manage dependencies in addition to improving performance and energy consumption."}], "lineHeight": 0}}, "target": {"markdown": "现代 NVIDIA GPU 架构的 ISA 包含了编译器为保证正确性而提供的控制位与相关信息。与早期 GPU 架构在运行时通过追踪寄存器的读写来检查数据依赖关系（参见第 2 节）不同，这些 GPU 架构依赖编译器来处理寄存器数据依赖关系 [62]。为此，所有汇编指令除了用于提升性能和降低能耗之外，还包含一些控制位以正确管理依赖关系。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "6283ce0156dbea5fae593f43cba38fd6", "index": 47, "aliyun_index": 8, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Below, we describe the behavior of these control bits included in every instruction. The explanation is based on some documents [29, 36, 43, 44], but these documents are often ambiguous or incomplete, so we use the methodology described in section 3 to uncover the semantics of these control bits and verify that they act as described below.  \n\n", "text": "Below, we describe the behavior of these control bits included in every instruction. The explanation is based on some documents [29, 36, 43, 44], but these documents are often ambiguous or incomplete, so we use the methodology described in section 3 to uncover the semantics of these control bits and verify that they act as described below.\n", "alignment": "left", "unique_id": "6283ce0156dbea5fae593f43cba38fd6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Below, we describe the behavior of these control bits included in every instruction. The explanation is based on some documents [29, 36, 43, 44], but these documents are often ambiguous or incomplete, so we use the methodology described in section 3 to uncover the semantics of these control bits and verify that they act as described below."}], "lineHeight": 0}}, "target": {"markdown": "下文将描述每条指令中所包含的这些控制位的具体行为。该说明基于部分已有文献 [29, 36, 43, 44]，但这些文档往往存在表述模糊或内容不全的问题。因此，我们采用第 3 节中所述的方法来揭示这些控制位的语义，并验证其行为是否与下文描述一致。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "6d5d26e3e7424308e66b4d7dde2bfd30", "index": 48, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Sub-cores can issue a single instruction per cycle. By default, the Issue Scheduler tries to issue instructions of the same warp if the oldest instruction in the program order of that warp is ready. The compiler indicates when an instruction will be ready for issue using the control bits. If the oldest instruction of the warp that issued an instruction in the previous cycle is not ready, the issue logic selects an instruction from another warp, following the policy described in subsection 5.1.  \n\n", "text": "Sub-cores can issue a single instruction per cycle. By default, the Issue Scheduler tries to issue instructions of the same warp if the oldest instruction in the program order of that warp is ready. The compiler indicates when an instruction will be ready for issue using the control bits. If the oldest instruction of the warp that issued an instruction in the previous cycle is not ready, the issue logic selects an instruction from another warp, following the policy described in subsection 5.1.\n", "alignment": "left", "unique_id": "6d5d26e3e7424308e66b4d7dde2bfd30", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sub-cores can issue a single instruction per cycle. By default, the Issue Scheduler tries to issue instructions of the same warp if the oldest instruction in the program order of that warp is ready. The compiler indicates when an instruction will be ready for issue using the control bits. If the oldest instruction of the warp that issued an instruction in the previous cycle is not ready, the issue logic selects an instruction from another warp, following the policy described in subsection 5.1."}], "lineHeight": 0}}, "target": {"markdown": "子核每个周期只能发射一条指令。默认情况下，发射调度器（Issue Scheduler）会尝试从同一 warp 中发射指令，前提是该 warp 程序顺序中最旧的那条指令已就绪。编译器通过控制位来指明某条指令何时准备好可以发射。如果上一周期已发射指令的 warp 中最旧的指令尚未就绪，则发射逻辑会按照 5.1 小节中所述的策略，从其他 warp 中选取一条指令进行发射。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "28be9e1e9bb52375a3c5e36f720c7d1f", "index": 49, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "To handle producer-consumer dependencies of fixed-latency instructions, each warp has a counter that is referred to as **Stall counter**. If this counter is not zero, this warp is not candidate to issue instructions. The compiler sets this counter with the latency  \n\n", "text": "To handle producer-consumer dependencies of fixed-latency instructions, each warp has a counter that is referred to as **Stall counter**. If this counter is not zero, this warp is not candidate to issue instructions. The compiler sets this counter with the latency\n", "alignment": "left", "unique_id": "28be9e1e9bb52375a3c5e36f720c7d1f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To handle producer-consumer dependencies of fixed-latency instructions, each warp has a counter that is referred to as **Stall counter**. If this counter is not zero, this warp is not candidate to issue instructions. The compiler sets this counter with the latency"}], "lineHeight": 0}}, "target": {"markdown": "为了处理具有固定延迟指令的生产者-消费者依赖关系，每个 warp 都拥有一个计数器，称为 **停顿计数器（Stall counter）**。当该计数器不为零时，该 warp 便不具备发射指令的资格。编译器会根据延迟使用控制位设置该计数器：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "c9501b422a00e1da940fe8dbbe492799", "index": 50, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "of the producing instruction minus the number of instructions\nbetween the producer and the first consumer. All these per-warp\nStall counters are decreased by one every cycle until they reach 0.\nThe issue logic will simply check this counter and will not consider\nissuing another instruction of the same warp until its value is zero.  \n\n", "text": "of the producing instruction minus the number of instructions\nbetween the producer and the first consumer. All these per-warp\nStall counters are decreased by one every cycle until they reach 0.\nThe issue logic will simply check this counter and will not consider\nissuing another instruction of the same warp until its value is zero.\n", "alignment": "left", "unique_id": "c9501b422a00e1da940fe8dbbe492799", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of the producing instruction minus the number of instructions"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "between the producer and the first consumer. All these per-warp"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Stall counters are decreased by one every cycle until they reach 0."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The issue logic will simply check this counter and will not consider"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "issuing another instruction of the same warp until its value is zero."}], "lineHeight": -130}}, "target": {"markdown": "通过控制位为该计数器设置如下值：产生指令的延迟减去生产者与第一个消费者之间的指令数。所有这些每 warp 停顿计数器在每个周期都会递减 1，直到减至 0。发射逻辑只需判断该计数器的值，在其归零之前不会考虑从同一 warp 发射其他指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "4015eea1d669d12a92e593106cecc484", "index": 51, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "For example, an addition whose latency is four cycles and its first consumer is the following instruction encodes a four in the Stall counter. Using the methodology explained in section 3, we have verified that if the Stall counter is not properly set, the result of the program is incorrect since the hardware does not check for RAW hazards, and simply relies on these compiler-set counters. In addition, this mechanism has benefits in terms of area and energy wiring. Keep in mind that wires from fixed-latency units to the dependence handling components are not needed, in contrast to a traditional scoreboard approach where they are required.  \n\n", "text": "For example, an addition whose latency is four cycles and its first consumer is the following instruction encodes a four in the Stall counter. Using the methodology explained in section 3, we have verified that if the Stall counter is not properly set, the result of the program is incorrect since the hardware does not check for RAW hazards, and simply relies on these compiler-set counters. In addition, this mechanism has benefits in terms of area and energy wiring. Keep in mind that wires from fixed-latency units to the dependence handling components are not needed, in contrast to a traditional scoreboard approach where they are required.\n", "alignment": "left", "unique_id": "4015eea1d669d12a92e593106cecc484", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For example, an addition whose latency is four cycles and its first consumer is the following instruction encodes a four in the Stall counter. Using the methodology explained in section 3, we have verified that if the Stall counter is not properly set, the result of the program is incorrect since the hardware does not check for RAW hazards, and simply relies on these compiler-set counters. In addition, this mechanism has benefits in terms of area and energy wiring. Keep in mind that wires from fixed-latency units to the dependence handling components are not needed, in contrast to a traditional scoreboard approach where they are required."}], "lineHeight": 0}}, "target": {"markdown": "例如，一条延迟为四个周期的加法指令，且其第一个消费者为紧随其后的下一条指令，则在该停顿计数器中编码值 4。通过第 3 节所述的方法，我们已验证：若停顿计数器设置不当，程序运行结果将是错误的，因为硬件本身并不检查 RAW（读后写）冒险，而是单纯依赖编译器所设置的这些计数器。此外，该机制在芯片面积和布线能耗方面也具有优势。需要注意的是，与传统的记分板（scoreboard）方法需要将信号线从固定延迟单元连接到依赖关系处理部件不同，此机制无需这些连线。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "e0a2c2eeabc6999df52b4a05da7b6f88", "index": 52, "aliyun_index": 13, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Another control bit is called **Yield**, and is used to indicate the hardware that in the next cycle it should not issue and instruction of the same warp. If the rest of the warps of the sub-core are not ready in the next cycle, no instruction is issued.  \n\n", "text": "Another control bit is called **Yield**, and is used to indicate the hardware that in the next cycle it should not issue and instruction of the same warp. If the rest of the warps of the sub-core are not ready in the next cycle, no instruction is issued.\n", "alignment": "left", "unique_id": "e0a2c2eeabc6999df52b4a05da7b6f88", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Another control bit is called **Yield**, and is used to indicate the hardware that in the next cycle it should not issue and instruction of the same warp. If the rest of the warps of the sub-core are not ready in the next cycle, no instruction is issued."}], "lineHeight": 0}}, "target": {"markdown": "另一个控制位称为 **Yield（让出）**，用于向硬件指示在下一个周期不应再发射同一 warp 的指令。如果该子核中其余 warp 在下一周期均未就绪，则不会发射任何指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "9b6727d671f6d997365d2dd0dd05d2d3", "index": 53, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Each instruction sets the Stall counter and the Yield bit. If the Stall counter is greater than one, the warp will stall for at least one cycle, so in this case, no matter whether Yield is set or not.  \n\n", "text": "Each instruction sets the Stall counter and the Yield bit. If the Stall counter is greater than one, the warp will stall for at least one cycle, so in this case, no matter whether Yield is set or not.\n", "alignment": "left", "unique_id": "9b6727d671f6d997365d2dd0dd05d2d3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Each instruction sets the Stall counter and the Yield bit. If the Stall counter is greater than one, the warp will stall for at least one cycle, so in this case, no matter whether Yield is set or not."}], "lineHeight": 0}}, "target": {"markdown": "每条指令都会设置停顿计数器和 Yield 位。如果停顿计数器大于 1，则该 warp 至少会停顿一个周期，因此在这种情况下，无论 Yield 是否被设置，行为都是一致的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "69a8ad943d9482b10302997640f352c6", "index": 54, "aliyun_index": 15, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "On the other hand, some instructions (e.g., memory, special functions) have variable latency, and the compiler does not know their execution time. Therefore, the compiler cannot handle these hazards through the Stall counter. These hazards are resolved through Dependence counters bits. Each warp has six special registers to store these counters, which are referred to as SBx with x taking a value in the range [0 - 5]. Each of these counters can count up to 63.  \n\n", "text": "On the other hand, some instructions (e.g., memory, special functions) have variable latency, and the compiler does not know their execution time. Therefore, the compiler cannot handle these hazards through the Stall counter. These hazards are resolved through Dependence counters bits. Each warp has six special registers to store these counters, which are referred to as SBx with x taking a value in the range [0 - 5]. Each of these counters can count up to 63.\n", "alignment": "left", "unique_id": "69a8ad943d9482b10302997640f352c6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On the other hand, some instructions (e.g., memory, special functions) have variable latency, and the compiler does not know their execution time. Therefore, the compiler cannot handle these hazards through the Stall counter. These hazards are resolved through Dependence counters bits. Each warp has six special registers to store these counters, which are referred to as SBx with x taking a value in the range [0 - 5]. Each of these counters can count up to 63."}], "lineHeight": 0}}, "target": {"markdown": "另一方面，某些指令（例如访存指令、特殊函数指令）具有可变的执行延迟，编译器无法预知其执行时间。因此，编译器无法仅通过停顿计数器来处理这些冒险。这类冒险通过依赖计数器（Dependence counters）位来解决。每个 warp 都拥有六个用于存储这些计数器的特殊寄存器，记作 SBx，其中 x 的取值范围为 [0 - 5]。每个计数器最多可计数至 63。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "1435b1008f9da99db2770787e4368f70", "index": 55, "aliyun_index": 16, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "These counters are initialized to zero when a warp starts. To\nhandle a producer-consumer dependence, the producer increases a\nparticular counter after issue, and decreases it at write-back. The\nconsumer instruction is instructed to stall until this counter is zero.  \n\n", "text": "These counters are initialized to zero when a warp starts. To\nhandle a producer-consumer dependence, the producer increases a\nparticular counter after issue, and decreases it at write-back. The\nconsumer instruction is instructed to stall until this counter is zero.\n", "alignment": "left", "unique_id": "1435b1008f9da99db2770787e4368f70", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "These counters are initialized to zero when a warp starts. To"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "handle a producer-consumer dependence, the producer increases a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "particular counter after issue, and decreases it at write-back. The"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "consumer instruction is instructed to stall until this counter is zero."}], "lineHeight": -105}}, "target": {"markdown": "这些计数器在 warp 启动时被初始化为零。为了处理生产者-消费者依赖关系，生产者指令在发射后会使某个特定计数器递增，并在写回时将其递减。消费者指令则被指示在该计数器归零之前一直停顿等待。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "c07249fa9bd790e426ae84f7d0a5a449", "index": 56, "aliyun_index": 17, "page_num": 2, "type": "text", " ds its source operands, instead of decreasing the counter at write-back."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In each instruction, there are some control bits to indicate up to two counters that are increased at issue. One of these counters will be decreased at write-back (to handle RAW and WAW dependencies) and the other at register read (to handle WAR dependencies). For this purpose, every instruction has two fields of 3 bits each to indicate these two counters. Besides, every instruction has a mask of 6 bits to indicate which dependence counters it has to check to determine if it is ready for issue. Note that an instruction can check up to all six counters."}], "lineHeight": -319}}, "target": {"markdown": "对于 WAR 冒险，该机制与之类似，唯一的区别在于计数器是在指令读取其源操作数之后递减的，而不是在写回时递减。每条指令中都包含若干控制位，用于指明最多两个在发射时递增的计数器。其中一个计数器将在写回时递减（用于处理 RAW 和 WAW 依赖关系），另一个则将在寄存器读取时递减（用于处理 WAR 依赖关系）。为此，每条指令各有两个 3 位的字段，用以指明这两个计数器。此外，每条指令还包含一个 6 位的掩码，用于指明需要检查哪些依赖计数器以判断该指令是否已准备好发射。需要注意的是，一条指令最多可以同时检查全部六个计数器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "a95c30618a781337935a857c11ed20a2", "index": 57, "aliyun_index": 18, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Consider that if an instruction has multiple source operands whose producers have variable latency, the same *Dependency counter* can be used by all these producers without losing any parallelism. It is important to note that this mechanism may encounter limits of parallelism in scenarios where there are more than six consumer instructions with different variable-latency producers. In such cases, the compiler must choose between two alternatives to manage the situation: 1) group more instructions under the same *Dependency counter*, or 2) reorder the instructions differently.  \n\n", "text": "Consider that if an instruction has multiple source operands whose producers have variable latency, the same *Dependency counter* can be used by all these producers without losing any parallelism. It is important to note that this mechanism may encounter limits of parallelism in scenarios where there are more than six consumer instructions with different variable-latency producers. In such cases, the compiler must choose between two alternatives to manage the situation: 1) group more instructions under the same *Dependency counter*, or 2) reorder the instructions differently.\n", "alignment": "left", "unique_id": "a95c30618a781337935a857c11ed20a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Consider that if an instruction has multiple source operands whose producers have variable latency, the same *Dependency counter* can be used by all these producers without losing any parallelism. It is important to note that this mechanism may encounter limits of parallelism in scenarios where there are more than six consumer instructions with different variable-latency producers. In such cases, the compiler must choose between two alternatives to manage the situation: 1) group more instructions under the same *Dependency counter*, or 2) reorder the instructions differently."}], "lineHeight": 0}}, "target": {"markdown": "值得注意的是，如果一条指令拥有多个源操作数，而这些操作数的生产者均具有可变延迟，那么所有这些生产者可以共用同一个*依赖计数器*，而不会损失任何并行性。需要指出的是，当出现多于六个消费者指令各自对应不同可变延迟生产者的情况时，该机制可能会受到并行性方面的限制。在这种情况下，编译器必须在两种方案中进行选择：1) 将更多指令归入同一个*依赖计数器*之下，或者 2) 以不同的方式对指令进行重排序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "a9e9c299ef72e72f94ff7b2517240830", "index": 58, "aliyun_index": 19, "  2, to avoid issuing the consumer instruction the following cycle."}], "lineHeight": 0}}, "target": {"markdown": "一个周期之后才生效。因此，如果消费者指令紧随其后作为下一条指令，则生产者必须将停顿计数器设置为 2，以避免在下一周期发射该消费者指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "e06baf4d543430cdb31f44d3246cf153", "index": 60, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "An example of handling dependencies with variable-latency producers can be found in Figure 2. This code shows a sequence of four instructions (three loads and one addition) with its associated encoding. As the addition has dependencies with the loads (variable-latency instructions), *Dependency counters* are used to prevent data hazards. The instruction at PC 0x80 has RAW dependencies with instructions at 0x50 and 0x60. Thus, SB3 is incremented by instructions 0x50 and 0x60 at issue and decremented at write-back. On the other hand, the addition has WAR dependencies with instructions at 0x60 and 0x70. In consequence, SB0 is increased by instructions 0x60 and 0x70 at issue and decreased after reading their respective register source operands. Finally, the *Dependency counters mask* of the addition encodes that before being issued, SB0 and SB3 must be 0. Note that instruction 0x70 also uses SB4 to control RAW/WAR hazards with future instructions, but instruction 0x80 does not wait for this *Dependency counter* since it does not have any dependence with that load. Clearing WAR dependencies after reading the source operands is an important optimization, since source operands are sometimes read much earlier than the result is produced, especially for memory instructions. For instance, in this example, instruction 0x80 waits until instruction 0x70 reads R2 for clearing this WAR dependence, instead of waiting until instruction 0x70 performs its write-back, which may happen hundreds of cycles later.  \n\n", "text": "An example of handling dependencies with variable-latency producers can be found in Figure 2. This code shows a sequence of four instructions (three loads and one addition) with its associated encoding. As the addition has dependencies with the loads (variable-latency instructions), *Dependency counters* are used to prevent data hazards. The instruction at PC 0x80 has RAW dependencies with instructions at 0x50 and 0x60. Thus, SB3 is incremented by instructions 0x50 and 0x60 at issue and decremented at write-back. On the other hand, the addition has WAR dependencies with instructions at 0x60 and 0x70. In consequence, SB0 is increased by instructions 0x60 and 0x70 at issue and decreased after reading their respective register source operands. Finally, the *Dependency counters mask* of the addition encodes that before being issued, SB0 and SB3 must be 0. Note that instruction 0x70 also uses SB4 to control RAW/WAR hazards with future instructions, but instruction 0x80 does not wait for this *Dependency counter* since it does not have any dependence with that load. Clearing WAR dependencies after reading the source operands is an important optimization, since source operands are sometimes read much earlier than the result is produced, especially for memory instructions. For instance, in this example, instruction 0x80 waits until instruction 0x70 reads R2 for clearing this WAR dependence, instead of waiting until instruction 0x70 performs its write-back, which may happen hundreds of cycles later.\n", "alignment": "left", "unique_id": "e06baf4d543430cdb31f44d3246cf153", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "An example of handling dependencies with variable-latency producers can be found in Figure 2. This code shows a sequence of four instructions (three loads and one addition) with its associated encoding. As the addition has dependencies with the loads (variable-latency instructions), *Dependency counters* are used to prevent data hazards. The instruction at PC 0x80 has RAW dependencies with instructions at 0x50 and 0x60. Thus, SB3 is incremented by instructions 0x50 and 0x60 at issue and decremented at write-back. On the other hand, the addition has WAR dependencies with instructions at 0x60 and 0x70. In consequence, SB0 is increased by instructions 0x60 and 0x70 at issue and decreased after reading their respective register source operands. Finally, the *Dependency counters mask* of the addition encodes that before being issued, SB0 and SB3 must be 0. Note that instruction 0x70 also uses SB4 to control RAW/WAR hazards with future instructions, but instruction 0x80 does not wait for this *Dependency counter* since it does not have any dependence with that load. Clearing WAR dependencies after reading the source operands is an important optimization, since source operands are sometimes read much earlier than the result is produced, especially for memory instructions. For instance, in this example, instruction 0x80 waits until instruction 0x70 reads R2 for clearing this WAR dependence, instead of waiting until instruction 0x70 performs its write-back, which may happen hundreds of cycles later."}], "lineHeight": 0}}, "target": {"markdown": "使用具有可变延迟的生产者处理依赖关系的示例可参见图 2。该代码展示了一段由四条指令（三个 load 指令和一个加法指令）组成的指令序列及其对应的编码。由于加法指令与 load 指令（即可变延迟指令）之间存在依赖关系，因此使用*依赖计数器*来防止数据冒险。位于 PC 0x80 处的指令与位于 0x50 和 0x60 处的指令之间存在 RAW 依赖关系。因此，SB3 在 0x50 和 0x60 处的指令发射时递增，并在写回时递减。另一方面，该加法指令与 0x60 和 0x70 处的指令之间存在 WAR 依赖关系。因此，SB0 在 0x60 和 0x70 处的指令发射时递增，并在读取各自寄存器源操作数之后递减。最后，该加法指令的*依赖计数器掩码*对以下信息进行了编码：在该指令被发射之前，SB0 和 SB3 必须为 0。需要注意的是，0x70 处的指令也使用 SB4 来控制与未来指令之间的 RAW/WAR 冒险，但 0x80 处的指令并不会等待该*依赖计数器*，因为它与该 load 指令之间并不存在任何依赖关系。在读取源操作数之后清除 WAR 依赖关系是一项重要的优化，因为源操作数有时会比结果产生的时间早得多被读取，这对于访存指令而言尤其如此。例如，在本例中，0x80 处的指令仅等待 0x70 处的指令读取 R2 即可清除该 WAR 依赖关系，而不是等待 0x70 处的指令执行其写回（该写回可能在数百个周期之后才会发生）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "0e9b1d140c3fadf2c85257b95a987af6", "index": 61, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "An alternative way of checking the readiness of these counters is through the DEPBAR.LE instruction. As an example, DEPBAR.LE SB1, 0x3, {4, 3, 2}, requires the Dependence counter SB1 to have a value less or equal to 3 to continue with the execution. The last argument ([, {4, 3, 2}]) is optional, and if used, the instruction cannot be issued until the values of the Dependence counters specified by those IDs (4, 3, 2 in this example) are equal to 0.  \n\n", "text": "An alternative way of checking the readiness of these counters is through the DEPBAR.LE instruction. As an example, DEPBAR.LE SB1, 0x3, {4, 3, 2}, requires the Dependence counter SB1 to have a value less or equal to 3 to continue with the execution. The last argument ([, {4, 3, 2}]) is optional, and if used, the instruction cannot be issued until the values of the Dependence counters specified by those IDs (4, 3, 2 in this example) are equal to 0.\n", "alignment": "left", "unique_id": "0e9b1d140c3fadf2c85257b95a987af6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "An alternative way of checking the readiness of these counters is through the DEPBAR.LE instruction. As an example, DEPBAR.LE SB1, 0x3, {4, 3, 2}, requires the Dependence counter SB1 to have a value less or equal to 3 to continue with the execution. The last argument ([, {4, 3, 2}]) is optional, and if used, the instruction cannot be issued until the values of the Dependence counters specified by those IDs (4, 3, 2 in this example) are equal to 0."}], "lineHeight": 0}}, "target": {"markdown": "另一种检查这些计数器就绪状态的方式是通过 `DEPBAR.LE` 指令。例如，`DEPBAR.LE SB1, 0x3, {4, 3, 2}` 要求依赖计数器 SB1 的值小于或等于 3 才能继续执行。最后一个参数（`{4, 3, 2}`）是可选的；若使用该参数，则在所指定 ID（在本例中为 4、3、2）的依赖计数器值全部归零之前，该指令不能被发射。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "8db53e244d0009d572a119498464f59b", "index": 62, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "DEPBAR.LE can be especially useful in some particular scenarios. For instance, it allows the use of the same *Dependency counter* for a sequence of $N$ variable-latency instructions that perform their write-back in order (e.g., memory instructions with the STRONG.SM modifier) when a consumer needs to wait for the first $M$ instructions. Using a DEPBAR.LE with its argument equal to $N - M$ makes this instruction wait for the $M$ first instructions of the sequence. Another example is to reuse the same *Dependency counter* to protect RAW/WAW and WAR hazards. If an instruction uses the same *Dependency counter* for both types of hazards, as WAR hazards are resolved earlier than RAW/WAW, a following DEPBAR.LE SBX, $\\emptyset$x1 will wait until the WAR is solved and allow the warp to continue its execution. A later instruction that consumes its result needs to wait until this *Dependency counter* becomes zero, which means that the results have been written.  \n\n", "text": "DEPBAR.LE can be especially useful in some particular scenarios. For instance, it allows the use of the same *Dependency counter* for a sequence of $N$ variable-latency instructions that perform their write-back in order (e.g., memory instructions with the STRONG.SM modifier) when a consumer needs to wait for the first $M$ instructions. Using a DEPBAR.LE with its argument equal to $N - M$ makes this instruction wait for the $M$ first instructions of the sequence. Another example is to reuse the same *Dependency counter* to protect RAW/WAW and WAR hazards. If an instruction uses the same *Dependency counter* for both types of hazards, as WAR hazards are resolved earlier than RAW/WAW, a following DEPBAR.LE SBX, $\\emptyset$x1 will wait until the WAR is solved and allow the warp to continue its execution. A later instruction that consumes its result needs to wait until this *Dependency counter* becomes zero, which means that the results have been written.\n", "alignment": "left", "unique_id": "8db53e244d0009d572a119498464f59b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DEPBAR.LE can be especially useful in some particular scenarios. For instance, it allows the use of the same *Dependency counter* for a sequence of $N$ variable-latency instructions that perform their write-back in order (e.g., memory instructions with the STRONG.SM modifier) when a consumer needs to wait for the first $M$ instructions. Using a DEPBAR.LE with its argument equal to $N - M$ makes this instruction wait for the $M$ first instructions of the sequence. Another example is to reuse the same *Dependency counter* to protect RAW/WAW and WAR hazards. If an instruction uses the same *Dependency counter* for both types of hazards, as WAR hazards are resolved earlier than RAW/WAW, a following DEPBAR.LE SBX, $\\emptyset$x1 will wait until the WAR is solved and allow the warp to continue its execution. A later instruction that consumes its result needs to wait until this *Dependency counter* becomes zero, which means that the results have been written."}], "lineHeight": 0}}, "target": {"markdown": "`DEPBAR.LE` 指令在某些特定场景下尤为有用。例如，当某个消费者需要等待一组按序执行的 $N$ 条可变延迟指令（例如带有 `STRONG.SM` 修饰符的访存指令）序列中的前 $M$ 条指令时，它允许为该指令序列复用同一个*依赖计数器*。使用参数等于 $N - M$ 的 `DEPBAR.LE`，即可使该指令等待该序列中最先的 $M$ 条指令完成。另一个示例是利用同一个*依赖计数器*同时保护 RAW/WAW 冒险和 WAR 冒险。若某条指令将同一个*依赖计数器*用于这两类冒险，由于 WAR 冒险的解除时间早于 RAW/WAW，紧随其后的一条 `DEPBAR.LE SBX, 0x1` 将等待直至 WAR 冒险解除，从而使该 warp 能够继续执行。之后一条消费其结果的指令则需要等待该*依赖计数器*归零，这表明相关结果已被写回。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "516610cc42acd08a16bbfe9be0480663", "index": 63, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Additionally, GPUs have a register file cache used to save energy and reduce contention in the register file read ports. This structure is software-managed by adding a control bit to each source operand, the *reuse* bit, which indicates the hardware whether to cache or not the content of the register. More details about the organization of register file cache are explained in section 5.3.1.  \n\n", "text": "Additionally, GPUs have a register file cache used to save energy and reduce contention in the register file read ports. This structure is software-managed by adding a control bit to each source operand, the *reuse* bit, which indicates the hardware whether to cache or not the content of the register. More details about the organization of register file cache are explained in section 5.3.1.\n", "alignment": "left", "unique_id": "516610cc42acd08a16bbfe9be0480663", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Additionally, GPUs have a register file cache used to save energy and reduce contention in the register file read ports. This structure is software-managed by adding a control bit to each source operand, the *reuse* bit, which indicates the hardware whether to cache or not the content of the register. More details about the organization of register file cache are explained in section 5.3.1."}], "lineHeight": 0}}, "target": {"markdown": "此外，GPU 还配备了一个寄存器文件缓存，用于节省能耗并减少寄存器文件读端口的竞争。该结构由软件通过向每个源操作数添加一个控制位（即 *reuse* 位）来管理，该位向硬件指示是否缓存该寄存器的内容。关于寄存器文件缓存组织的更多细节将在第 5.3.1 节中加以说明。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "8ac1e9902c57d3b71a1c93bdfd0a9da0", "index": 64, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Finally, although this paper focuses on NVIDIA architectures, exploring AMD GPU ISAs documentation [6-15] reveals that AMD  \n\n", "text": "Finally, although this paper focuses on NVIDIA architectures, exploring AMD GPU ISAs documentation [6-15] reveals that AMD\n", "alignment": "left", "unique_id": "8ac1e9902c57d3b71a1c93bdfd0a9da0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Finally, although this paper focuses on NVIDIA architectures, exploring AMD GPU ISAs documentation [6-15] reveals that AMD"}], "lineHeight": 0}}, "target": {"markdown": "最后，尽管本文重点讨论的是 NVIDIA 架构，但在查阅 AMD GPU ISA 相关资料 [6-15] 后可以发现，AMD", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "e08fc13c8b4b017d04b069c2db9957da", "index": 65, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "also relies on a hardware-software codesign to manage dependencies and boost performance. Similar to NVIDIA's DEPBAR. LE instruction, AMD employs a waitcnt instruction; depending on the architecture, each wavefront (warp) has three or four counters, with each counter dedicated to specific instruction types and its use required to protect data hazards created by those instructions. AMD does not allow regular instructions to wait for a counter to reach zero using control bits, requiring an explicit waitcnt instruction instead, which increases the number of instructions. This design reduces the decoding overhead, yet increases the overall instruction count. In contrast, NVIDIA's alternative enables more concurrent dependence chains even within the same instruction type, as it has up to two counters more per warp, and the counters are not tied to any instruction type. Although AMD does not need software or compiler intervention to avoid data hazards with ALU instructions, it introduced the DELAY_ALU instruction in RDNA 3/3.5 architectures [13, 15] to mitigate pipeline stalls caused by dependencies. Conversely, NVIDIA depends on the compiler to correctly handle data dependencies by setting the Stall counter for fixed-latency producers, resulting in a lower instruction count but higher decoding overhead.  \n\n", "text": "also relies on a hardware-software codesign to manage dependencies and boost performance. Similar to NVIDIA's DEPBAR. LE instruction, AMD employs a waitcnt instruction; depending on the architecture, each wavefront (warp) has three or four counters, with each counter dedicated to specific instruction types and its use required to protect data hazards created by those instructions. AMD does not allow regular instructions to wait for a counter to reach zero using control bits, requiring an explicit waitcnt instruction instead, which increases the number of instructions. This design reduces the decoding overhead, yet increases the overall instruction count. In contrast, NVIDIA's alternative enables more concurrent dependence chains even within the same instruction type, as it has up to two counters more per warp, and the counters are not tied to any instruction type. Although AMD does not need software or compiler intervention to avoid data hazards with ALU instructions, it introduced the DELAY_ALU instruction in RDNA 3/3.5 architectures [13, 15] to mitigate pipeline stalls caused by dependencies. Conversely, NVIDIA depends on the compiler to correctly handle data dependencies by setting the Stall counter for fixed-latency producers, resulting in a lower instruction count but higher decoding overhead.\n", "alignment": "left", "unique_id": "e08fc13c8b4b017d04b069c2db9957da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "also relies on a hardware-software codesign to manage dependencies and boost performance. Similar to NVIDIA's DEPBAR. LE instruction, AMD employs a waitcnt instruction; depending on the architecture, each wavefront (warp) has three or four counters, with each counter dedicated to specific instruction types and its use required to protect data hazards created by those instructions. AMD does not allow regular instructions to wait for a counter to reach zero using control bits, requiring an explicit waitcnt instruction instead, which increases the number of instructions. This design reduces the decoding overhead, yet increases the overall instruction count. In contrast, NVIDIA's alternative enables more concurrent dependence chains even within the same instruction type, as it has up to two counters more per warp, and the counters are not tied to any instruction type. Although AMD does not need software or compiler intervention to avoid data hazards with ALU instructions, it introduced the DELAY_ALU instruction in RDNA 3/3.5 architectures [13, 15] to mitigate pipeline stalls caused by dependencies. Conversely, NVIDIA depends on the compiler to correctly handle data dependencies by setting the Stall counter for fixed-latency producers, resulting in a lower instruction count but higher decoding overhead."}], "lineHeight": 0}}, "target": {"markdown": "同样依赖软硬件协同设计来管理依赖关系并提升性能。与 NVIDIA 的 `DEPBAR.LE` 指令类似，AMD 采用的是 `waitcnt` 指令；根据具体架构，每个 wavefront（即 warp）拥有三个或四个计数器，每个计数器专用于特定的指令类型，并且必须使用相应的计数器来保护由这些指令所产生的数据冒险。AMD 不允许普通指令通过控制位来等待计数器归零，而必须显式使用 `waitcnt` 指令，这无疑增加了指令数量。该设计降低了译码开销，却提高了整体指令数。相比之下，NVIDIA 的方案允许即使在同一指令类型内部也能启用更多的并发依赖链，因为它为每个 warp 多提供了最多两个计数器，并且这些计数器并不与任何特定的指令类型绑定。尽管 AMD 无需软件或编译器的介入即可避免 ALU 指令之间的数据冒险，但其在 RDNA 3/3.5 架构 [13, 15] 中引入了 `DELAY_ALU` 指令以缓解由依赖关系引起的流水线停顿。反观 NVIDIA，则依赖编译器通过对定延迟生产者设置停顿计数器来正确处理数据依赖，从而在获得更低指令数量的同时付出更高的译码开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "ed61b90e6e91121cba995de8327e8b87", "index": 66, "aliyun_index": 8, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "## 5 GPU cores Microarchitecture\n", "text": "5 GPU cores Microarchitecture\n", "alignment": "left", "unique_id": "ed61b90e6e91121cba995de8327e8b87", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5 GPU cores Microarchitecture"}], "lineHeight": 0}}, "target": {"markdown": "## 5 GPU 核心微架构\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "da0fd02f2a8382867550467f04a037b6", "index": 67, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "In this section, we describe our findings regarding the microarchitecture of GPU cores of modern commercial NVIDIA GPUs, using the methodology explained in section 3. Figure 3 shows the main components of the GPU cores' microarchitecture. Below, we describe in detail the microarchitecture of the issue scheduler, the front-end, the register file, and the memory pipeline.  \n\n", "text": "In this section, we describe our findings regarding the microarchitecture of GPU cores of modern commercial NVIDIA GPUs, using the methodology explained in section 3. Figure 3 shows the main components of the GPU cores' microarchitecture. Below, we describe in detail the microarchitecture of the issue scheduler, the front-end, the register file, and the memory pipeline.\n", "alignment": "left", "unique_id": "da0fd02f2a8382867550467f04a037b6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section, we describe our findings regarding the microarchitecture of GPU cores of modern commercial NVIDIA GPUs, using the methodology explained in section 3. Figure 3 shows the main components of the GPU cores' microarchitecture. Below, we describe in detail the microarchitecture of the issue scheduler, the front-end, the register file, and the memory pipeline."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们将基于第 3 节所介绍的方法，详细阐述我们关于现代商用 NVIDIA GPU 核心微架构的研究发现。图 3 展示了 GPU 核心微架构的主要组成部分。接下来，我们将分别对发射调度器、前端、寄存器文件以及访存流水线的微架构进行详细说明。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "7ee8fa7265dbf54c22227143741e540f", "index": 68, "aliyun_index": 10, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### 5.1 Issue Scheduler\n", "text": "5.1 Issue Scheduler\n", "alignment": "left", "unique_id": "7ee8fa7265dbf54c22227143741e540f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1 Issue Scheduler"}], "lineHeight": 0}}, "target": {"markdown": "### 5.1 发射调度器\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "97552f7c4789f764710e645d3c46ac05", "index": 69, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "In this subsection we dissect the Issue Scheduler of modern NVIDIA GPUs. First, we describe which warps are considered candidates for issue every cycle in subsubsection 5.1.1. Then, we present the Selection policy in subsubsection 5.1.2.  \n\n", "text": "In this subsection we dissect the Issue Scheduler of modern NVIDIA GPUs. First, we describe which warps are considered candidates for issue every cycle in subsubsection 5.1.1. Then, we present the Selection policy in subsubsection 5.1.2.\n", "alignment": "left", "unique_id": "97552f7c4789f764710e645d3c46ac05", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this subsection we dissect the Issue Scheduler of modern NVIDIA GPUs. First, we describe which warps are considered candidates for issue every cycle in subsubsection 5.1.1. Then, we present the Selection policy in subsubsection 5.1.2."}], "lineHeight": 0}}, "target": {"markdown": "在本小节中，我们将深入剖析现代 NVIDIA GPU 的发射调度器。首先，我们将在第 5.1.1 子小节中描述每个周期中将哪些 warp 作为发射候选。然后，我们将在第 5.1.2 子小节中介绍所采用的选取策略。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "32cbc11f25e896cdaa254f6df2d40294", "index": 70, "aliyun_index": 12, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "5.1.1 Warp Readiness. A warp is considered a candidate for issuing its oldest instruction in a given cycle if some conditions are met. Some of these conditions depend on previous instructions of the same warp, while others rely on the global state of the core.  \n\n", "text": "5.1.1 Warp Readiness. A warp is considered a candidate for issuing its oldest instruction in a given cycle if some conditions are met. Some of these conditions depend on previous instructions of the same warp, while others rely on the global state of the core.\n", "alignment": "left", "unique_id": "32cbc11f25e896cdaa254f6df2d40294", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1.1 Warp Readiness. A warp is considered a candidate for issuing its oldest instruction in a given cycle if some conditions are met. Some of these conditions depend on previous instructions of the same warp, while others rely on the global state of the core."}], "lineHeight": 0}}, "target": {"markdown": "5.1.1 发射条件可执行性（Warp Readiness）。在某个周期中，只有当满足一定条件时，一个 warp 才会被视为发射其最早一条指令的候选。这些条件中，一部分取决于同一 warp 中先前执行的指令，而另一部分则依赖于该核心的全局状态。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "0b97c37bffc7e21a14a0e96455d41981", "index": 71, "aliyun_index": 13, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "An obvious condition is having a valid instruction in the Instruction Buffer. Another condition is that the oldest instruction of the warp must not have any data dependence hazard with older instructions of the same warp not yet completed. Dependencies among instructions are handled through software support by means of the control bits described above in section 4.  \n\n", "text": "An obvious condition is having a valid instruction in the Instruction Buffer. Another condition is that the oldest instruction of the warp must not have any data dependence hazard with older instructions of the same warp not yet completed. Dependencies among instructions a se}, "text": "Besides, for fixed-latency instructions, a warp is candidate to issue its oldest instruction in a given cycle only if it can be guaranteed that all needed resources for its execution will be available once issued."}], "lineHeight": 0}}, "target": {"markdown": "此外，对于定延迟指令而言，仅当能够保证一旦发射后该指令执行所需的全部资源均可用时，该 warp 才会在相应周期中成为发射其最早一条指令的候选。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "d0d7b0b2daa7a5ac7787364fe7876cb4", "index": 73, "aliyun_index": 15, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "One of these resources is the execution unit. Execution units have an input latch that must be free when the instruction reaches the execution stage. This latch is occupied for two cycles if the width of the execution unit is just half warp, and for one cycle if its width is a full warp.  \n\n", "text": "One of these resources is the execution unit. Execution units have an input latch that must be free when the instruction reaches the execution stage. This latch is occupied for two cycles if the width of the execution unit is just half warp, and for one cycle if its width is a full warp.\n", "alignment": "left", "unique_id": "d0d7b0b2daa7a5ac7787364fe7876cb4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One of these resources is the execution unit. Execution units have an input latch that must be free when the instruction reaches the execution stage. This latch is occupied for two cycles if the width of the execution unit is just half warp, and for one cycle if its width is a full warp."}], "lineHeight": 0}}, "target": {"markdown": "这些资源之一便是执行单元。执行单元带有一个输入锁存器，只有当指令到达执行阶段时该锁存器必须处于空闲状态。当执行单元的宽度仅为半个 warp 时，该锁存器需被占用两个周期；而当执行单元宽度为整个 warp
