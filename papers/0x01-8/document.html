arScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "details later). Our experiments showed that all the fixed-latency"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions spend three cycles for reading source operands, even"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "if some of these cycles the instruction is idle (for instance when"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "there are only two source operands) because FADD and FMUL have"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the same latency as the FFMA despite having one operand less, and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "FFMA always has the same latency regardless of whether its three"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "operands are in the same bank or not. If the instruction in the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "allocate stage realizes that it cannot read all its operands in the next"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "three cycles, it is held in this stage (stalling the pipeline upwards)"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and generates bubbles until it can reserve all ports needed to read"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the source operands in the next three cycles."}], "lineHeight": -530}}, "target": {"markdown": "气泡的产生取决于指令的类型以及指令中每个操作数所承担的角色。我们发现，在我们测试过的几乎所有实验中，最佳近似方案是一种在指令发射与固定延迟指令操作数读取之间设置两个中间阶段的方案，我们将这两个阶段分别称为 **控制（Control）** 和 **分配（Allocate）**。前者已在 5.1.1 节中说明。后者负责预留寄存器文件的读端口。寄存器文件的每个 bank 都有一个 1024 位的读端口，并且通过使用寄存器文件缓存（register file cache）来缓解读端口冲突（更多细节将在后文给出）。我们的实验表明，所有固定延迟指令在读取源操作数时都需要耗费三个周期，即使在这些周期中指令可能处于空闲状态（例如只有两个源操作数时也是如此），这是因为 FADD 和 FMUL 虽然比 FFMA 少一个操作数，却具有与 FFMA 相同的延迟；并且无论 FFMA 的三个操作数是否位于同一 bank，其延迟始终相同。若处于分配阶段的指令发现它在接下来的三个周期内无法读取其全部操作数，则该指令会被停留在该阶段（使流水线向上游停顿），并持续产生气泡，直到它能够预留读取全部源操作数所需的全部端口为止。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "1d49c9e213e9e7faac675325ad7417e0", "index": 115, "aliyun_index": 13, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "5.3.1 Register file cache. The use of a Register file cache (RFC) in GPUs has been investigated for relieving contention in the Register File ports and saving energy [2, 30, 32, 33, 78].  \n\n", "text": "5.3.1 Register file cache. The use of a Register file cache (RFC) in GPUs has been investigated for relieving contention in the Register File ports and saving energy [2, 30, 32, 33, 78].\n", "alignment": "left", "unique_id": "1d49c9e213e9e7faac675325ad7417e0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.3.1 Register file cache. The use of a Register file cache (RFC) in GPUs has been investigated for relieving contention in the Register File ports and saving energy [2, 30, 32, 33, 78]."}], "lineHeight": 0}}, "target": {"markdown": "5.3.1 寄存器文件缓存。GPU 中使用寄存器文件缓存（Register file cache, RFC）已被研究用于缓解寄存器文件端口的争用并节省能耗 [2, 30, 32, 33, 78]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "323254dbc59ba09f8fe3363298f4225c", "index": 116, "aliyun_index": 14, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Through our experiments, we observed that the NVIDIA design is similar to the work of Gebhart et al. [33]. In line with that design, the RFC is controlled by the compiler and is only used by instructions that have operands in the Regular Register File. Regarding the Last Result File structure, what we call the result queue behaves similarly. However, unlike the above-cited paper, a two-level issue scheduler is not used, as explained above in subsubsection 5.1.2.  \n\n", "text": "Through our experiments, we observed that the NVIDIA design is similar to the work of Gebhart et al. [33]. In line with that design, the RFC is controlled by the compiler and is only used by instructions that have operands in the Regular Register File. Regarding the Last Result File structure, what we call the result queue behaves similarly. However, unlike the above-cited paper, a two-level issue scheduler is not used, as explained above in subsubsection 5.1.2.\n", "alignment": "left", "unique_id": "323254dbc59ba09f8fe3363298f4225c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Through our experiments, we observed that the NVIDIA design is similar to the work of Gebhart et al. [33]. In line with that design, the RFC is controlled by the compiler and is only used by instructions that have operands in the Regular Register File. Regarding the Last Result File structure, what we call the result queue behaves similarly. However, unlike the above-cited paper, a two-level issue scheduler is not used, as explained above in subsubsection 5.1.2."}], "lineHeight": 0}}, "target": {"markdown": "通过我们的实验，我们观察到 NVIDIA 的设计与 Gebhart 等人 [33] 的工作类似。与该设计一致，RFC 由编译器控制，并且仅由那些操作数位于常规寄存器文件（Regular Register File）中的指令使用。关于上一结果文件（Last Result File）结构，我们所称的结果队列（result queue）其行为方式也与之类似。然而，与上述论文不同的是，如 5.1.2 小节所述，本设计中并未采用两级发射调度器（two-level issue scheduler）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "d0fb9ae1b88add7e5619159931b7f0d1", "index": 117, "aliyun_index": 15, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Regarding the organization of the RFC, our experiments showed that it has one entry for each of the two register file banks in each sub-core. Each entry stores three 1024-bit values, each corresponding to one of the three regular register source operands that instructions may have. Overall, the RFC's total capacity is six 1024-bit operand values (sub-entries). Note that there are instructions that have some operands that require two consecutive registers (e.g., tensor core instructions). In this case, each of these two registers come from a different bank, and are cached in their corresponding entries.  \n\n", "text": "Regarding the organization of the RFC, our experiments showed that it has one entry for each of the two register file banks in each sub-core. Each entry stores three 1024-bit values, each corresponding to one of the three regular register source operands that instructions may have. Overall, the RFC's total capacity is six 1024-bit operand values (sub-entries). Note that there are instructions that have some operands that require two consecutive registers (e.g., tensor core instructions). In this case, each of these two registers come from a different bank, and are cached in their corresponding entries.\n", "alignment": "left", "unique_id": "d0fb9ae1b88add7e5619159931b7f0d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding the organization of the RFC, our experiments showed that it has one entry for each of the two register file banks in each sub-core. Each entry stores three 1024-bit values, each corresponding to one of the three regular register source operands that instructions may have. Overall, the RFC's total capacity is six 1024-bit operand values (sub-entries). Note that there are instructions that have some operands that require two consecutive registers (e.g., tensor core instructions). In this case, each of these two registers come from a different bank, and are cached in their corresponding entries."}], "lineHeight": 0}}, "target": {"markdown": "关于 RFC 的组织结构，我们的实验表明，每个子核心（sub-core）中的两个寄存器文件 bank 各对应 RFC 中的一项（entry）。每个 entry 存储三个 1024 位的值，每个值对应指令可能具有的三个常规寄存器源操作数之一。总体而言，RFC 的总容量为六个 1024 位的操作数值（即六个子项，sub-entries）。需要注意的是，某些指令会包含需要两个连续寄存器（例如张量核心指令）的源操作数。在这种情况下，这两个寄存器来自不同的 bank，并被缓存在它们各自对应的 entry 中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "03990c80e0f9c5efaf9c24161317e4ca", "index": 118, "aliyun_index": 16, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The compiler manages the allocation policy. When an instruction is issued and reads its operands, each operand is stored in the RFC if the compiler has set its reuse bit for that operand. A subsequent instruction will obtain its register source operand from the RFC if the instruction is from the same warp, the register ID coincides with the one stored in the RFC, and the operand position in the instruction is the same as in the instruction that has triggered the caching. A cached value is unavailable after a read request arrives to the same bank and operand position, regardless of whether it hits in the RFC. This is illustrated in example 2 of Listing 2; to allow the third instruction to find R2 in the cache, the second instruction must set the reuse bit of R2 in spite of R2 being already in the cache for the second instruction. Listing 2 shows three other examples to illustrate the RFC behavior.  \n\n", "text": "The compiler manages the allocation policy. When an instruction is issued and reads its operands, each operand is stored in the RFC if the compiler has set its reuse bit for that operand. A subsequent instruction will obtain its register source operand from the RFC if the instruction is from the same warp, the register ID coincides with the one stored in the RFC, and the operand position in the instruction is the same as in the instruction that has triggered the caching. A cached value is unavailable after a read request arrives to the same bank and operand position, regardless of whether it hits in the RFC. This is illustrated in example 2 of Listing 2; to allow the third instruction to find R2 in the cache, the second instruction must set the reuse bit of R2 in spite of R2 being already in the cache for the second instruction. Listing 2 shows three other examples to illustrate the RFC behavior.\n", "alignment": "left", "unique_id": "03990c80e0f9c5efaf9c24161317e4ca", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The compiler manages the allocation policy. When an instruction is issued and reads its operands, each operand is stored in the RFC if the compiler has set its reuse bit for that operand. A subsequent instruction will obtain its register source operand from the RFC if the instruction is from the same warp, the register ID coincides with the one stored in the RFC, and the operand position in the instruction is the same as in the instruction that has triggered the caching. A cached value is unavailable after a read request arrives to the same bank and operand position, regardless of whether it hits in the RFC. This is illustrated in example 2 of Listing 2; to allow the third instruction to find R2 in the cache, the second instruction must set the reuse bit of R2 in spite of R2 being already in the cache for the second instruction. Listing 2 shows three other examples to illustrate the RFC behavior."}], "lineHeight": 0}}, "target": {"markdown": "编译器负责管理分配策略。当一条指令被发射并读取其操作数时，如果编译器已为该操作数设置了重用位（reuse bit），则该操作数会被存入 RFC。对于后续指令而言，若该指令来自同一个 warp，其寄存器 ID 与 RFC 中所存储的 ID 一致，并且该操作数在指令中的位置与触发缓存的那条指令中的位置相同，则可以从 RFC 中获取其寄存器源操作数。一旦对同一 bank 和同一操作数位置的读请求到达，无论是否在 RFC 中命中，该缓存值都将变为不可用。Listing 2 中的示例 2 说明了这一点：为了让第三条指令能够在缓存中找到 R2，第二条指令必须为 R2 设置重用位，即使 R2 在第二条指令中已经存在于缓存中。Listing 2 还给出了另外三个示例，用以说明 RFC 的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "5dda12320b7b1a022839b6f137c9e60d", "index": 119, "aliyun_index": 17, "page_num": 6, "type": "corner_note", "sub_type": "none", "markdown": ">1 Ampere allows the execution of FP32 operations into the FP32 and INT32 execution units [67]. Therefore, there are no bubbles between two consecutive FP32 instructions due to execution unit conflicts.  \n\n", "text": "1 Ampere allows the execution of FP32 operations into the FP32 and INT32 execution units [67]. Therefore, there are no bubbles between two consecutive FP32 instructions due to execution unit conflicts.\n", "alignment": "left", "unique_id": "5dda12320b7b1a022839b6f137c9e60d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1 Ampere allows the execution of FP32 operations into the FP32 and INT32 execution units [67]. Therefore, there are no bubbles between two consecutive FP32 instructions due to execution unit conflicts."}], "lineHeight": 0}}, "target": {"markdown": ">1 Ampere 允许将 FP32 运算调度到 FP32 和 INT32 执行单元上执行 [67]。因此，在两条连续的 FP32 指令之间，不会由于执行单元冲突而产生气泡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "0f9306ecca849a5556e9b3e2b132534d", "index": 120, "aliyun_index": 18, "page_num": 6, "type": "corner_note", "sub_type": "none", "markdown": "># Example 1\nIADD3 R1, R2.reuse, R3, R4 # Allocates R2\nFFMA R5, R2, R7, R8 # R2 hits and becomes unavailable  \n\n", "text": "# Example 1\nIADD3 R1, R2.reuse, R3, R4 # Allocates R2\nFFMA R5, R2, R7, R8 # R2 hits and becomes unavailable\n", "alignment": "left", "unique_id": "0f9306ecca849a5556e9b3e2b132534d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "# Example 1"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "IADD3 R1, R2.reuse, R3, R4 # Allocates R2"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "FFMA R5, R2, R7, R8 # R2 hits and becomes unavailable"}], "lineHeight": -46}}, "target": {"markdown": "# 示例 1\nIADD3 R1, R2.reuse, R3, R4 # 为 R2 分配缓存项\nFFMA R5, R2, R7, R8 # R2 命中并变为不可用", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "ee15cb21f52d680823a36c1de4e34196", "index": 121, "aliyun_index": 1, "page_num": 7, "type": "figure", "sub_type": "none", "markdown": "![ee15cb21f52d680823a36c1de4e34196.jpeg](figures/ee15cb21f52d680823a36c1de4e34196_011aa579.png)  \n\n", "text": "IADD3 R10, R2, R12, R13 # R2 misses\n\n# Example 2\nIADD3 R1, R2.reuse, R3, R4 # Allocates R2  \nFFMA R5, R2.reuse, R7, R8 # R2 hits and is retained  \nIADD3 R10, R2, R12, R13 # R2 hits  \n\n# Example 3. R2 misses in the second instruction since it is  \n# cached in another slot. R2 remains available in the first  \n# slot since R7 uses a different bank  \nIADD3 R1, R2.reuse, R3, R4 # Allocates R2  \nFFMA R5, R7, R2, R8 # R2 misses  \nIADD3 R10, R2, R12, R13 # R2 hits  \n\n# Example 4. R2 misses in the third instruction since the  \n# second instruction uses a different register that goes to  \n# the same bank in the same operand slot  \nIADD3 R1, R2.reuse, R3, R4 # Allocates R2  \nFFMA R5, R4, R7, R8 # R4 misses and R2 becomes unavailable  \nIADD3 R10, R2, R12, R13 # R2 misses\n\n", "alignment": "left", "unique_id": "ee15cb21f52d680823a36c1de4e34196", "edited": false, "extra": {}}, "target": {"markdown": "![ee15cb21f52d680823a36c1de4e34196.jpeg](figures/ee15cb21f52d680823a36c1de4e34196_011aa579.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "be543d720a5d98ccfbf87c453bd9060e", "index": 122, "aliyun_index": 2, "page_num": 7, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 2: Register file cache behavior.  \n\n", "text": "Listing 2: Register file cache behavior.\n", "alignment": "left", "unique_id": "be543d720a5d98ccfbf87c453bd9060e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 2: Register file cache behavior."}], "lineHeight": 0}}, "target": {"markdown": ">Listing 2：寄存器文件缓存的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "d9c6b203e04b45f8a944301737f519ea", "index": 123, "aliyun_index": 3, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "### 5.4 Memory Pipeline\n", "text": "5.4 Memory Pipeline\n", "alignment": "left", "unique_id": "d9c6b203e04b45f8a944301737f519ea", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.4 Memory Pipeline"}], "lineHeight": 0}}, "target": {"markdown": "### 5.4 存储流水线\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "607b08af3dc3f2b29788d819422aa10c", "index": 124, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "The memory pipeline in modern NVIDIA GPUs has some initial stages local to each sub-core, whereas the last stages that perform the memory access are shared by the four sub-cores since the data cache and the shared memory are shared by them [20, 28]. In this section, we discover the size of the load/store queues in each sub-core, the rate at which each sub-core can send requests to the shared memory structures, and the latency of the different memory instructions.  \n\n", "text": "The memory pipeline in modern NVIDIA GPUs has some initial stages local to each sub-core, whereas the last stages that perform the memory access are shared by the four sub-cores since the data cache and the shared memory are shared by them [20, 28]. In this section, we discover the size of the load/store queues in each sub-core, the rate at which each sub-core can send requests to the shared memory structures, and the latency of the different memory instructions.\n", "alignment": "left", "unique_id": "607b08af3dc3f2b29788d819422aa10c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The memory pipeline in modern NVIDIA GPUs has some initial stages local to each sub-core, whereas the last stages that perform the memory access are shared by the four sub-cores since the data cache and the shared memory are shared by them [20, 28]. In this section, we discover the size of the load/store queues in each sub-core, the rate at which each sub-core can send requests to the shared memory structures, and the latency of the different memory instructions."}], "lineHeight": 0}}, "target": {"markdown": "现代 NVIDIA GPU 中的存储流水线包含若干初始阶段，这些阶段是每个子核心（sub-core）本地的；而执行访存操作的最后阶段则由四个子核心共享，因为数据缓存和共享内存是由它们共同使用的 [20, 28]。在本节中，我们将探究每个子核心中加载/存储队列（load/store queues）的大小、每个子核心向共享内存结构发送请求的速率，以及不同访存指令的延迟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "67a576124fe6f4a6dd7bf48d98f45d80", "index": 125, "aliyun_index": 5, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Note that there are two main types of memory accesses, those that go to shared memory (the SM local memory shared among all threads in a block) and those that go to the global memory (the GPU main memory).  \n\n", "text": "Note that there are two main types of memory accesses, those that go to shared memory (the SM local memory shared among all threads in a block) and those that go to the global memory (the GPU main memory).\n", "alignment": "left", "unique_id": "67a576124fe6f4a6dd7bf48d98f45d80", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Note that there are two main types of memory accesses, those that go to shared memory (the SM local memory shared among all threads in a block) and those that go to the global memory (the GPU main memory)."}], "lineHeight": 0}}, "target": {"markdown": "需要注意的是，访存操作主要分为两类：一类是访问共享内存（shared memory，即同一 block 内所有线程共享的 SM 本地内存）的操作，另一类是访问全局内存（global memory，即 GPU 主内存）的操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "1a3211d615a36e1447a3d32a341c5563", "index": 126, "aliyun_index": 6, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "To discover the size of the queues and the memory bandwidth, we run a set of experiments in which each sub-core either executes a warp or is idle. Each warp executes a sequence of independent loads or stores that always hit in the data cache or shared memory and use regular registers. Table 1 shows the results of these experiments. The first column shows the instruction number in the code, and the next four columns show in which cycle this instruction is issued in each of the cores for four different scenarios that differ in the number of active cores.  \n\n", "text": "To discover the size of the queues and the memory bandwidth, we run a set of experiments in which each sub-core either executes a warp or is idle. Each warp executes a sequence of independent loads or stores that always el_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "7f53d0b124eeec5222359d65d43d5f6d", "index": 131, "aliyun_index": 11, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "shared-structures only allow one instruction every two cycles as\nits maximum throughput.  \n\n", "text": "shared-structures only allow one instruction every two cycles as\nits maximum throughput.\n", "alignment": "left", "unique_id": "7f53d0b124eeec5222359d65d43d5f6d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "shared-structures only allow one instruction every two cycles as"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "its maximum throughput."}], "lineHeight": -52}}, "target": {"markdown": "共享结构每两个周期最多只能处理一条指令，因此每个子核心只能每 8 个周期发射一条指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "0250c296e81ee5f89c72bf7570b3a607", "index": 132, "aliyun_index": 12, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Regarding the size of the memory queue in each sub-core, we estimate that it has a size of four even though each sub-core can buffer five consecutive instructions. The instruction reserves the slot when it arrives at the unit and frees it when it leaves the unit.  \n\n", "text": "Regarding the size of the memory queue in each sub-core, we estimate that it has a size of four even though each sub-core can buffer five consecutive instructions. The instruction reserves the slot when it arrives at the unit and frees it when it leaves the unit.\n", "alignment": "left", "unique_id": "0250c296e81ee5f89c72bf7570b3a607", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding the size of the memory queue in each sub-core, we estimate that it has a size of four even though each sub-core can buffer five consecutive instructions. The instruction reserves the slot when it arrives at the unit and frees it when it leaves the unit."}], "lineHeight": 0}}, "target": {"markdown": "关于每个子核心中存储队列的大小，我们估计其大小为 4，尽管每个子核心最多可以缓冲连续 5 条指令。这是因为指令在到达该单元时占用槽位，离开该单元时才释放。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "93f702cb8398292115b893be79c18ed5", "index": 133, "aliyun_index": 13, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "As regards latencies, we measured two different latencies for each instruction type when the instruction hits in the cache and there is a single thread in execution. The first latency is the elapsed time since a load is issued until the earliest time that a consumer or an instruction that overwrites the same destination register can issue. We refer to this as RAW/WAW latency (note that stores cannot generate register RAW/WAW dependencies). The second one is the elapsed time since a load or store is issued until the earliest time that an instruction that writes in a source register of the load/store can be issued. We refer to this time as WAR latency. The results are shown in Table 2.  \n\n", "text": "As regards latencies, we measured two different latencies for each instruction type when the instruction hits in the cache and there is a single thread in execution. The first latency is the elapsed time since a load is issued until the earliest time that a consumer or an instruction that overwrites the same destination register can issue. We refer to this as RAW/WAW latency (note that stores cannot generate register RAW/WAW dependencies). The second one is the elapsed time since a load or store is issued until the earliest time that an instruction that writes in a source register of the load/store can be issued. We refer to this time as WAR latency. The results are shown in Table 2.\n", "alignment": "left", "unique_id": "93f702cb8398292115b893be79c18ed5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As regards latencies, we measured two different latencies for each instruction type when the instruction hits in the cache and there is a single thread in execution. The first latency is the elapsed time since a load is issued until the earliest time that a consumer or an instruction that overwrites the same destination register can issue. We refer to this as RAW/WAW latency (note that stores cannot generate register RAW/WAW dependencies). The second one is the elapsed time since a load or store is issued until the earliest time that an instruction that writes in a source register of the load/store can be issued. We refer to this time as WAR latency. The results are shown in Table 2."}], "lineHeight": 0}}, "target": {"markdown": "关于延迟，我们针对每种指令类型在缓存命中且只有单个线程执行的情况下测量了两种不同的延迟。第一种延迟是指从一条 load 指令发射开始，到最早能够发射使用其目标寄存器的消费者指令或覆盖同一目标寄存器的指令所经过的时间。我们将此称为 RAW/WAW 延迟（注意，store 指令不会产生寄存器之间的 RAW/WAW 依赖）。第二种延迟是指从一条 load 或 store 指令发射开始，到最早能够发射写入该 load/store 源寄存器的指令所经过的时间。我们将此时间称为 WAR 延迟。测量结果如表 2 所示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "47f7b9cb9b2e1b4daf14e3819fd6ef37", "index": 134, "aliyun_index": 14, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We can see that global memory accesses are faster if instructions use uniform registers for computing their addresses rather than regular registers. This difference is due to a faster address calculation. When using uniform registers, all threads in a warp share the same register, and thus, a single memory address needs to be computed. On the other hand, when using regular registers, each thread needs to compute a potentially different memory address.  \n\n", "text": "We can see that global memory accesses are faster if instructions use uniform registers for computing their addresses rather than regular registers. This difference is due to a faster address calculation. When using uniform registers, all threads in a warp share the same register, and thus, a single memory address needs to be computed. On the other hand, when using regular registers, each thread needs to compute a potentially different memory address.\n", "alignment": "left", "unique_id": "47f7b9cb9b2e1b4daf14e3819fd6ef37", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We can see that global memory accesses are faster if instructions use uniform registers for computing their addresses rather than regular registers. This difference is due to a faster address calculation. When using uniform registers, all threads in a warp share the same register, and thus, a single memory address needs to be computed. On the other hand, when using regular registers, each thread needs to compute a potentially different memory address."}], "lineHeight": 0}}, "target": {"markdown": "我们可以看到，如果指令使用 uniform 寄存器来计算地址，则全局内存访问速度更快，而使用常规寄存器时则较慢。这一差异源于地址计算速度的不同。使用 uniform 寄存器时，warp 中的所有线程共享同一个寄存器，因此只需计算一个内存地址；而使用常规寄存器时，每个线程需要分别计算各自可能不同的内存地址。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "db161a6aa32bbc205bbab65b8bd7cdb4", "index": 135, "aliyun_index": 15, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We can also observe that the latency of shared memory loads is lower than that of global memory. We can also observe that their WAR latency is the same for regular and uniform registers, whereas their RAW/WAW latency is one cycle lower for uniform registers. The fact that WAR latencies are equal for regular and uniform registers suggests that the address calculation for shared memory is done in the shared-structures, rather than in the local sub-core structures, so the WAR dependence is released once the source registers are read.  \n\n", "text": "We can also observe that the latency of shared memory loads is lower than that of global memory. We can also observe that their WAR latency is the same for regular and uniform registers, whereas their RAW/WAW latency is one cycle lower for uniform registers. The fact that WAR latencies are equal for regular and uniform registers suggests that the address calculation for shared memory is done in the shared-structures, rather than in the local sub-core structures, so the WAR dependence is released once the source registers are read.\n", "alignment": "left", "unique_id": "db161a6aa32bbc205bbab65b8bd7cdb4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We can also observe that the latency of shared memory loads is lower than that of global memory. We can also observe that their WAR latency is the same for regular and uniform registers, whereas their RAW/WAW latency is one cycle lower for uniform registers. The fact that WAR latencies are equal for regular and uniform registers suggests that the address calculation for shared memory is done in the shared-structures, rather than in the local sub-core structures, so the WAR dependence is released once the source registers are read."}], "lineHeight": 0}}, "target": {"markdown": "我们还可以观察到，共享内存 load 的延迟低于全局内存。我们还可以观察到，二者的 WAR 延迟在使用常规寄存器和 uniform 寄存器时相同，而 RAW/WAW 延迟在使用 uniform 寄存器时则低 1 个周期。WAR 延迟在常规寄存器和 uniform 寄存器下相同这一事实表明，共享内存的地址计算是在共享结构中完成的，而非在各子核心的本地结构中完成的，因此一旦源寄存器被读取，WAR 依赖关系即被解除。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "6b05a09a977df37b11b0f980d760aab6", "index": 136, "aliyun_index": 16, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "As expected, latencies also depend on the size of the read/written values. For WAR dependencies, the latency of loads does not change since the source operands are only for address calculation and thus, they are always the same size no matter the size of the loaded value. For store instructions, WAR latencies increase with the size of the written value to memory since this value is a source operand that also needs to be read from the register file. For RAW/WAW dependencies (only apply to loads), latencies increase as we increase the size of the read value, since more data needs to be transferred  \n\n", "text": "As expected, latencies also depend on the size of the read/written values. For WAR dependencies, the latency of loads does not change since the source operands are only for address calculation and thus, they are always the same size no matter the size of the loaded value. For store instructions, WAR latencies increase with the size of the written value to memory since this value is a source operand that also needs to be read from the register file. For RAW/WAW dependencies (only apply to loads), latencies increase as we increase the size of the read value, since more data needs to be transferred\n", "alignment": "left", "unique_id": "6b05a09a977df37b11b0f980d760aab6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As expected, latencies also depend on the size of the read/written values. For WAR dependencies, the latency of loads does not change since the source operands are only for address calculation and thus, they are always the same size no matter the size of the loaded value. For store instructions, WAR latencies increase with the size of the written value to memory since this value is a source operand that also needs to be read from the register file. For RAW/WAW dependencies (only apply to loads), latencies increase as we increase the size of the read value, since more data needs to be transferred"}], "lineHeight": 0}}, "target": {"markdown": "正如预期的那样，延迟也取决于读/写值的大小。对于 WAR 依赖关系而言，load 指令的延迟不会发生变化，因为源操作数仅用于地址计算，因此无论所加载值的大小如何，其大小始终相同。对于 store 指令而言，WAR 延迟会随着写入内存的值的大小增加而增加，因为该值作为源操作数同样需要从寄存器文件中读取。对于 RAW/WAW 依赖关系（仅适用于 load 指令）而言，随着读取值大小的增加，延迟也会增加，因为需要传输更多的数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "a114f08e706077dcc229c38c8497ccc2", "index": 137, "aliyun_index": 1, "page_num": 8, "type": "table", "sub_type": "none", "markdown": "| Instruction | Memory address register type | Dependency type latencies | Dependency type latencies |\n| --- | --- | --- | --- |\n| Instruction | Memory address register type | WAR | RAW/WAW |\n| Load Global 32 bit | Uniform | 9 | 29 |\n| Load Global 64 bit | Uniform | 9 | 31 |\n| Load Global 128 bit | Uniform | 9 | 35 |\n| Load Global 32 bit | Regular | 11 | 32 |\n| Load Global 64 bit | Regular | 11 | 34 |\n| Load Global 128 bit | Regular | 11 | 38 |\n| Store Global 32 bit | Uniform | 10 | - |\n| Store Global 64 bit | Uniform | 12* | - |\n| Store Global 128 bit | Uniform ixed-latency instruction using the same constant memory address and measured that the issue was delayed 79 cycles, which corresponds to a miss, instead of causing no delay, which would correspond to a hit. Therefore, fixed-latency instructions accessing the constant address space use the L0 FL (fixed latency) constant cache, while accesses made through LDC instructions utilize the L0 VL (variable latency) constant cache.  \n\n", "text": "In addition, we can observe that the constant cache's WAR latency is significantly greater than loads to the global memory, whereas RAW/WAW latencies are a bit lower. We could not confirm any hypothesis that explains this observation. However, we discovered that accesses to the constant memory done by fixed-latency instructions go to a different cache level than load constant instructions. We confirmed this by preloading a given address into the constant cache through an LDC instruction and waiting for the instruction until it is complete. Then, we issued a fixed-latency instruction using the same constant memory address and measured that the issue was delayed 79 cycles, which corresponds to a miss, instead of causing no delay, which would correspond to a hit. Therefore, fixed-latency instructions accessing the constant address space use the L0 FL (fixed latency) constant cache, while accesses made through LDC instructions utilize the L0 VL (variable latency) constant cache.\n", "alignment": "left", "unique_id": "0cc84b3fc833264b8fd3aa1ba8452b78", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In addition, we can observe that the constant cache's WAR latency is significantly greater than loads to the global memory, whereas RAW/WAW latencies are a bit lower. We could not confirm any hypothesis that explains this observation. However, we discovered that accesse , "unique_id": "be2e7a7b021ef24bbf632f9e7c6b76a5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the instruction. WAR dependencies have the same latency for all granularities since they are released when the address is computed. The RAW/WAR dependency is released when the instruction's read step has finished, regardless of the instruction's granularity."}], "lineHeight": 0}}, "target": {"markdown": "指令的 WAR 依赖关系具有相同的延迟，因为它们在地址计算完成时即被解除。RAW/WAW 依赖关系则在指令的读取阶段完成时被解除，与指令的粒度无关。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "c66b72ab432d486e29fde5beb88e2be5", "index": 143, "aliyun_index": 7, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "## 6 Modeling\n", "text": "6 Modeling\n", "alignment": "left", "unique_id": "c66b72ab432d486e29fde5beb88e2be5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6 Modeling"}], "lineHeight": 0}}, "target": {"markdown": "## 6 建模\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "1c7a7261cffa0fb207b4efdd302fd706", "index": 144, "aliyun_index": 8, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "We have designed from scratch the SM/core model of the Accel-sim\nframework simulator [49] by modifying the pipeline to implement\nall the details explained in section 4, section 5 and depicted in Fig-\nure 3. The main new components are outlined below.  \n\n", "text": "We have designed from scratch the SM/core model of the Accel-sim\nframework simulator [49] by modifying the pipeline to implement\nall the details explained in section 4, section 5 and depicted in Fig-\nure 3. The main new components are outlined below.\n", "alignment": "left", "unique_id": "1c7a7261cffa0fb207b4efdd302fd706", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We have designed from scratch the SM/core model of the Accel-sim"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "framework simulator [49] by modifying the pipeline to implement"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "all the details explained in section 4, section 5 and depicted in Fig-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ure 3. The main new components are outlined below."}], "lineHeight": -106}}, "target": {"markdown": "我们从零开始设计了 Accel-sim 框架模拟器 [49] 的 SM/core 模型，通过修改流水线以实现第 4 节、第 5 节中所阐述的全部细节，并在图 3 中予以展示。主要的新组件概述如下。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "fbb2c35fb0b2a695d437fad554186459", "index": 145, "aliyun_index": 9, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "First, we have added an L0 instruction cache with a stream buffer prefetcher for each sub-core. L0 instruction and constant caches are connected with a parameterized latency to an L1 instruction/-constant cache. We have chosen the size of caches, hierarchy, and latencies according to previous measurements done or the Ampere architecture described by Jia et al [45].  \n\n", "text": "First, we have added an L0 instruction cache with a stream buffer prefetcher for each sub-core. L0 instruction and constant caches are connected with a parameterized latency to an L1 instruction/-constant cache. We have chosen the size of caches, hierarchy, and latencies according to previous measurements done or the Ampere architecture described by Jia et al [45].\n", "alignment": "left", "unique_id": "fbb2c35fb0b2a695d437fad554186459", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "First, we have added an L0 instruction cache with a stream buffer prefetcher for each sub-core. L0 instruction and constant caches are connected with a parameterized latency to an L1 instruction/-constant cache. We have chosen the size of caches, hierarchy, and latencies according to previous measurements done or the Ampere architecture described by Jia et al [45]."}], "lineHeight": 0}}, "target": {"markdown": "首先，我们为每个子核心添加了一个配备流缓冲区预取器的 L0 指令缓存。L0 指令缓存和常量缓存通过参数化的延迟与 L1 指令/常量缓存相连。我们根据此前进行的测量结果以及 Jia 等人 [45] 所描述的 Ampere 架构来确定缓存的大小、层级结构和延迟参数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "846c2de11449c5f687af5e24a034d485", "index": 146, "aliyun_index": 10, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "We have modified the Issue stage to support the control bits, the tag look-up to the newly added L0 constant caches for fixed-latency instructions, and the new CGGTY issue scheduler. We included the control stage, in which instructions increase the dependence counters, and the Allocate stage, in which fixed-latency instructions check for conflicts in the access to the register file and the register file cache.  \n\n", "text": "We have modified the Issue stage to support the control bits, the tag look-up to the newly added L0 constant caches for fixed-latency instructions, and the new CGGTY issue scheduler. We included the control stage, in which instructions increase the dependence counters, and the Allocate stage, in which fixed-latency instructions check for conflicts in the access to the register file and the register file cache.\n", "alignment": "left", "unique_id": "846c2de11449c5f687af5e24a034d485", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We have modified the Issue stage to support the control bits, the tag look-up to the newly added L0 constant caches for fixed-latency instructions, and the new CGGTY issue scheduler. We included the control stage, in which instructions increase the dependence counters, and the Allocate stage, in which fixed-latency instructions check for conflicts in the access to the register file and the register file cache."}], "lineHeight": 0}}, "target": {"markdown": "我们对 Issue 阶段进行了修改，以支持控制位、对新增 L0 常量缓存（用于固定延迟指令）的标签查找，以及新的 CGGTY 发射调度器。我们引入了控制阶段（control stage），在该阶段指令会增加依赖计数器；以及分配阶段（Allocate stage），在该阶段固定延迟指令会检查对寄存器文件和寄存器文件缓存的访问是否存在冲突。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "ba1014d41e80f8637c3f9bdf28a1deef", "index": 147, "aliyun_index": 11, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Regarding memory instructions, we have modeled a new unit per sub-core and a unit shared among sub-cores, with the latencies presented in the previous section.  \n\n", "text": "Regarding memory instructions, we have modeled a new unit per sub-core and a unit shared among sub-cores, with the latencies presented in the previous section.\n", "alignment": "left", "unique_id": "ba1014d41e80f8637c3f9bdf28a1deef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding memory instructions, we have modeled a new unit per sub-core and a unit shared among sub-cores, with the latencies presented in the previous section."}], "lineHeight": 0}}, "target": {"markdown": "关于访存指令，我们为每个子核心建模了一个新单元，并为子核心之间共享了一个单元，其延迟采用上一节中所给出的数值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "2405ab4ac552c41d07862261548d4001", "index": 148, "aliyun_index": 12, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Additionally, as Abdelkhalik et al. [3] have demonstrated that the latency of a tensor core instruction depends on its operand's numeric types and sizes, so we have adapted the model to use the correct latency for each operand type and size.  \n\n", "text": "Additionally, as Abdelkhalik et al. [3] have demonstrated that the latency of a tensor core instruction depends on its operand's numeric types and sizes, so we have adapted the model to use the correct latency for each operand type and size.\n", "alignment": "left", "unique_id": "2405ab4ac552c41d07862261548d4001", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Additionally, as Abdelkhalik et al. [3] have demonstrated that the latency of a tensor core instruction depends on its operand's numeric types and sizes, so we have adapted the model to use the correct latency for each operand type and size."}], "lineHeight": 0}}, "target": {"markdown": "此外，由于 Abdelkhalik 等人 [3] 已证明张量核心指令的延迟取决于其操作数的数值类型与大小，我们对模型进行了适配，以便针对每种操作数类型和大小使用正确的延迟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "8141383bc4423caad392338bf6eacdc1", "index": 149, "aliyun_index": 13, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Other details that we have modeled are the execution pipeline shared by all sub-cores for double precision instructions in architectures without dedicated double precision execution units in each sub-core. Moreover, we accurately model the timing for reading/writing operands that use multiple registers, which was previously approximated by using just one register per operand. Furthermore, we fixed some inaccuracies in instruction addresses reported in a previous work [40].  \n\n", "text": "Other details that we have modeled are the execution pipeline shared by all sub-cores for double precision instructions in architectures without dedicated double precision execution units in each sub-core. Moreover, we accurately model the timing for reading/writing operands that use multiple registers, which was previously approximated by using just one register per operand. Furthermore, we fixed some inaccuracies in instruction addresses reported in a previous work [40].\n", "alignment": "left", "unique_id": "8141383bc4423caad392338bf6eacdc1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Other details that we have modeled are the execution pipeline shared by all sub-cores for double precision instructions in architectures without dedicated double precision execution units in each sub-core. Moreover, we accurately model the timing for reading/writing operands that use multiple registers, which was previously approximated by using just one register per operand. Furthermore, we fixed some inaccuracies in instruction addresses reported in a previous work [40]."}], "lineHeight": 0}}, "target": {"markdown": "我们建模的其他细节包括：在每个子核心没有专用双精度执行单元的架构中，所有子核心共享的双精度指令执行流水线。此外，我们对使用多个寄存器的操作数的读写时序进行了精确建模，而此前的工作仅以每个操作数对应一个寄存器进行近似处理。此外，我们还修正了先前工作 [40] 中指令地址报告方面的一些不准确之处。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "6f891391d813274985e4cde00b9c9678", "index": 150, "aliyun_index": 14, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Apart from implementing the new SM/core model in the simulator, we have extended the tracer tool. The tool has been extended to dump the ID of all types of operands (regular registers, uniform registers, predication registers, immediate, etc.). Another important extension is the capability to obtain the control bits of all instructions since NVBit does not provide access to them. This is done by obtaining the SASS through the CUDA binary utilities [70] at compile time. This implies modifying the compilation of the applications to generate microarchitecture-dependent code at compile time instead of using a just-in-time compilation approach. Unfortunately, for a few kernels (all of them belonging to Deepbench), NVIDIA tools do not provide the SASS code, which prevents obtaining the control bits for these instructions. To simulate these applications, we use a hybrid mode for dependencies where traditional scoreboards are employed in kernels that do not have the SASS code; otherwise, control bits are used.  \n\n", "text": "Apart from implementing the new SM/core model in the simulator, we have extended the tracer tool. The tool has been extended to dump the ID of all types of operands (regular registers, uniform registers, predication registers, immediate, etc.). Another important extension is the capability to obtain the control bits of all instructions since NVBit does not provide access to them. This is done by obtaining the SASS through the CUDA binary utilities [70] at compile time. This implies modifying the compilation of the applications to generate microarchitecture-dependent code at compile time instead of using a just-in-time compilation approach. Unfortunately, for a few kernels (all of them belonging to Deepbench), NVIDIA tools do not provide the SASS code, which prevents obtaining the control bits for these instructions. To simulate these applications, we use a hybrid mode for dependencies where traditional scoreboards are employed in kernels that do not have the SASS code; otherwise, control bits are used.\n", "alignment": "left", "unique_id": "6f891391d813274985e4cde00b9c9678", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Apart from implementing the new SM/core model in the simulator, we have extended the tracer tool. The tool has been extended to dump the ID of all types of operands (regular registers, uniform registers, predication registers, immediate, etc.). Another important extension is the capability to obtain the control bits of all instructions since NVBit does not provide access to them. This is done by obtaining the SASS through the CUDA binary utilities [70] at compile time. This implies modifying the compilation of the applications to generate microarchitecture-dependent code at compile time instead of using a just-in-time compilation approach. Unfortunately, for a few kernels (all of them belonging to Deepbench), NVIDIA tools do not provide the SASS code, which prevents obtaining the control bits for these instructions. To simulate these applications, we use a hybrid mode for dependencies where traditional scoreboards are employed in kernels that do not have the SASS code; otherwise, control bits are used."}], "lineHeight": 0}}, "target": {"markdown": "除了在模拟器中实现新的 SM/core 模型外，我们还扩展了追踪器工具（tracer tool）。该工具经过扩展后能够转储所有类型操作数的 ID（常规寄存器、uniform 寄存器、谓词寄存器、立即数等）。另一个重要的扩展是获取所有指令控制位的能力，因为 NVBit 并不提供对这些控制位的访问。这一功能是通过在编译时利用 CUDA 二进制工具 [70] 获取 SASS 来实现的。这意味着需要修改应用程序的编译流程，以在编译时生成依赖于微架构的代码，而不是采用即时编译的方式。不幸的是，对于少数内核（它们全部属于 Deepbench），NVIDIA 工具无法提供其 SASS 代码，从而阻碍了获取这些指令的控制位。为了模拟这些应用程序，我们针对依赖关系采用了一种混合模式：对于不含 SASS 代码的内核使用传统的记分板（scoreboard），其余情况下则使用控制位。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "3b7f8108e9df8c0cbd120adea062185f", "index": 151, "aliyun_index": 15, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "We have extended the tool to capture memory accesses to the constant cache or global memory through descriptors. Despite the latter  \n\n", "text": "We have extended the tool to capture memory accesses to the constant cache or global memory through descriptors. Despite the latter\n", "alignment": "left", "unique_id": "3b7f8108e9df8c0cbd120adea062185f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We have extended the tool to capture memory accesses to the constant cache or global memory through descriptors. Despite the latter"}], "lineHeight": 0}}, "target": {"markdown": "我们扩展了该工具，以通过描述符捕获对常量缓存或全局内存的访问。尽管后者", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "ff7db5ccd256633f1076bfcba9adb8d6", "index": 152, "aliyun_index": 1, "page_num": 9, "type": "table", "sub_type": "none", "markd
