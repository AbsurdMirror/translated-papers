ignment": "left", "cellId": 18, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "14.87%"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "14.87%\n", "alignment": "left", "type": "text", "pageNum": [11], "uniqueId": "d1bb9b7c3fea3acae46da109c57685a0"}], "pageNum": [11]}, {"yec": 4, "xec": 3, "ysc": 4, "xsc": 3, "type": "text", "alignment": "left", "cellId": 19, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "14.87%"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "14.87%\n", "alignment": "left", "type": "text", "pageNum": [11], "uniqueId": "d1bb9b7c3fea3acae46da109c57685a0"}], "pageNum": [11]}], "numRow": 5}}, "target": {"markdown": "|  | Scoreboarding with different number of maximum consumers | Scoreboarding with different number of maximum consumers |\n| --- | --- | --- |\n|  | 控制位 | 63 | 无限制 |\n| 加速比 | 1 | 0.97x | 0.97x |\n| 面积开销 | 0.09% | 5.32% | - |\n| MAPE | 13.98% | 14.87% | 14.87% |", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 185}, {"source": {"block_id": "d790f3f737d1f2ec45027da763ffe933", "index": 186, "aliyun_index": 2, "page_num": 11, "type": "table_name", "sub_type": "none", "markdown": ">Table 7: Speed-up, area overhead and MAPE of different dependence management mechanisms.  \n\n", "text": "Table 7: Speed-up, area overhead and MAPE of different dependence management mechanisms.\n", "alignment": "left", "unique_id": "d790f3f737d1f2ec45027da763ffe933", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 7: Speed-up, area overhead and MAPE of different dependence management mechanisms."}], "lineHeight": 0}}, "target": {"markdown": ">表 7：不同依赖管理机制的加速比、面积开销和 MAPE。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 186}, {"source": {"block_id": "834469068fbda547f5738a955aa5c5a4", "index": 187, "aliyun_index": 3, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "A mechanism based on the traditional scoreboard requires as many entries as registers that can be written, that is, 332 entries per warp (255 for the regular registers, 63 for the uniform registers, 7 for the predicate registers, and 7 for the uniform predicate registers). Additionally, two scoreboards are needed: one for WAW/RAW hazards and another for WAR hazards [57], because even though issue is in-order, the read-write of operands may occur out-of-order due to variable-latency instructions. WAR hazards may occur because variable-latency instructions, such as memory instructions, are queued after being issued and may read their source operands after a younger arithmetic instruction writes its result. While the first scoreboard requires only a single bit per entry, the second one requires more hardware as the number of consumers per entry increases. Assuming support for up to 63 consumers per entry, a single warp would require 2324 bits ($332 + 332 \\times \\log2(63 + 1)$) for dependency handling. For the entire SM, this translates to 111,552 bits, which is 5.32% of the register file size.  \n\n", "text": "A mechanism based on the traditional scoreboard requires as many entries as registers that can be written, that is, 332 entries per warp (255 for the regular registers, 63 for the uniform registers, 7 for the predicate registers, and 7 for the uniform predicate registers). Additionally, two scoreboards are needed: one for WAW/RAW hazards and another for WAR hazards [57], because even though issue is in-order, the read-write of operands may occur out-of-order due to variable-latency instructions. WAR hazards may occur because variable-latency instructions, such as memory instructions, are queued after being issued and may read their source operands after a younger arithmetic instruction writes its result. While the first scoreboard requires only a single bit per entry, the second one requires more hardware as the number of consumers per entry increases. Assuming support for up to 63 consumers per entry, a single warp would require 2324 bits ($332 + 332 \\times \\log2(63 + 1)$) for dependency handling. For the entire SM, this translates to 111,552 bits, which is 5.32% of the register file size.\n", "alignment": "left", "unique_id": "834469068fbda547f5738a955aa5c5a4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A mechanism based on the traditional scoreboard requires as many entries as registers that can be written, that is, 332 entries per warp (255 for the regular registers, 63 for the uniform registers, 7 for the predicate registers, and 7 for the uniform predicate registers). Additionally, two scoreboards are needed: one for WAW/RAW hazards and another for WAR hazards [57], because even though issue is in-order, the read-write of operands may occur out-of-order due to variable-latency instructions. WAR hazards may occur because variable-latency instructions, such as memory instructions, are queued after being issued and may read their source operands after a younger arithmetic instruction writes its result. While the first scoreboard requires only a single bit per entry, the second one requires more hardware as the number of consumers per entry increases. Assuming support for up to 63 consumers per entry, a single warp would require 2324 bits ($332 + 332 \\times \\log2(63 + 1)$) for dependency handling. For the entire SM, this translates to 111,552 bits, which is 5.32% of the register file size."}], "lineHeight": 0}}, "target": {"markdown": "基于传统记分板的机制需要与可写寄存器数量相等的条目数，即每个 warp 需要 332 个条目（普通寄存器 255 个，uniform 寄存器 63 个，谓词寄存器 7 个，以及 uniform 谓词寄存器 7 个）。此外，还需要两个记分板：一个用于处理 WAW/RAW 冒险，另一个用于处理 WAR 冒险 [57]，因为尽管发射是按顺序进行的，但由于指令延迟可变，操作数的读写可能乱序发生。WAR 冒险之所以会发生，是因为诸如内存指令之类的可变延迟指令在发射后会被放入队列中，并可能在一条更晚发射的算术指令写回其结果之后才读取其源操作数。虽然第一个记分板每个条目仅需要 1 bit，但第二个记分板由于每个条目的消费者数量增加，需要更多的硬件。假设每个条目最多支持 63 个消费者，则单个 warp 需要 2324 bit（$332 + 332 \\times \\log2(63 + 1)$）用于依赖关系处理。对于整个 SM 而言，这相当于 111,552 bit，占寄存器文件大小的 5.32%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 187}, {"source": {"block_id": "02f48e9b6413c02f411d42f087437088", "index": 188, "aliyun_index": 4, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In contrast, the software-hardware mechanism presented in this paper requires six *Dependence Counters* of six bits each, a *Stall Counter* of four bits, and a yield bit. This amounts to just 41 bits per warp or 1968 bits per SM. In terms of overhead, this is only 0.09% of the register file size, which is much less than the scoreboard alternative.  \n\n", "text": "In contrast, the software-hardware mechanism presented in this paper requires six *Dependence Counters* of six bits each, a *Stall Counter* of four bits, and a yield bit. This amounts to just 41 bits per warp or 1968 bits per SM. In terms of overhead, this is only 0.09% of the register file size, which is much less than the scoreboard alternative.\n", "alignment": "left", "unique_id": "02f48e9b6413c02f411d42f087437088", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In contrast, the software-hardware mechanism presented in this paper requires six *Dependence Counters* of six bits each, a *Stall Counter* of four bits, and a yield bit. This amounts to just 41 bits per warp or 1968 bits per SM. In terms of overhead, this is only 0.09% of the register file size, which is much less than the scoreboard alternative."}], "lineHeight": 0}}, "target": {"markdown": "相比之下，本文提出的软硬件机制仅需要六个各为 6 bit 的 *依赖计数器*（*Dependence Counters*）、一个 4 bit 的 *停顿计数器*（*Stall Counter*）以及一个 yield 位。每 warp 仅需 41 bit，每个 SM 仅需 1968 bit。就开销而言，仅占寄存器文件大小的 0.09%，远低于记分板方案。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 188}, {"source": {"block_id": "d28d91a4049287f4ce645f923fcf6c07", "index": 189, "aliyun_index": 5, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In summary, the software-hardware codesign based on control bits outperforms other alternatives and it has a negligible area overhead. The difference in overhead with respect to scoreboarding becomes even more significant in GPUs that support up to 64 warps per SM, such as NVIDIA Hopper [69], which has an overhead of 0.13% for the control bits alternative and 7.09% for the scoreboard mechanism with 63 consumers. An additional insight is that using a scoreboard mechanism composed of two scoreboards (one for RAW/WAW and another one for WAR hazards with up to 63 consumers) is comparable in simulation accuracy to using control bits. Therefore, it is a valid alternative for applications that do not expose the values of control bits, such as some kernels of the Deepbench benchmark suite.  \n\n", "text": "In summary, the software-hardware codesign based on control bits outperforms other alternatives and it has a negligible area overhead. The difference in overhead with respect to scoreboarding becomes even more significant in GPUs that support up to 64 warps per SM, such as NVIDIA Hopper [69], which has an overhead of 0.13% for the control bits alternative and 7.09% for the scoreboard mechanism with 63 consumers. An additional insight is that using a scoreboard mechanism composed of two scoreboards (one for RAW/WAW and another one for WAR hazards with up to 63 consumers) is comparable in simulation accuracy to using control bits. Therefore, it is a valid alternative for applications that do not expose the values of control bits, such as some kernels of the Deepbench benchmark suite.\n", "alignment": "left", "unique_id": "d28d91a4049287f4ce645f923fcf6c07", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In summary, the software-hardware codesign based on control bits outperforms other alternatives and it has a negligible area overhead. The difference in overhead with respect to scoreboarding becomes even more significant in GPUs that support up to 64 warps per SM, such as NVIDIA Hopper [69], which has an overhead of 0.13% for the control bits alternative and 7.09% for the scoreboard mechanism with 63 consumers. An additional insight is that using a scoreboard mechanism composed of two scoreboards (one for RAW/WAW and another one for WAR hazards with up to 63 consumers) is comparable in simulation accuracy to using control bits. Therefore, it is a valid alternative for applications that do not expose the values of control bits, such as some kernels of the Deepbench benchmark suite."}], "lineHeight": 0}}, "target": {"markdown": "总之，基于控制位的软硬件协同设计在性能上优于其他方案，且面积开销可忽略不计。在支持每个 SM 最多 64 个 warp 的 GPU（如 NVIDIA Hopper [69]）上，与记分板方案相比，开销差异更加显著：控制位方案的开销仅为 0.13%，而支持 63 个消费者的记分板机制开销为 7.09%。另一个值得注意的结论是：由两个记分板（一个用于 RAW/WAW 冒险，另一个用于最多 63 个消费者的 WAR 冒险）组成的记分板机制，在模拟准确性方面与使用控制位相当。因此，对于那些不暴露控制位取值的应用（例如 Deepbench 基准测试套件中的某些 kernel），该方案是一种可行的替代选择。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 189}, {"source": {"block_id": "9ae022387e0f571df2c6e64b57ad70e2", "index": 190, "aliyun_index": 6, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "### 7.6 Portability to other NVIDIA architectures\n", "text": "7.6 Portability to other NVIDIA architectures\n", "alignment": "left", "unique_id": "9ae022387e0f571df2c6e64b57ad70e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.6 Portability to other NVIDIA architectures"}], "lineHeight": 0}}, "target": {"markdown": "### 7.6 对其他 NVIDIA 架构的可移植性\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 190}, {"source": {"block_id": "f35aee33c559a7b00852e6764a00b82c", "index": 191, "aliyun_index": 7, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In this paper, we focus on the NVIDIA Ampere architecture. However, the findings we have exposed in the paper apply to other architectures, such as Turing. In addition to reporting results for four Ampere GPUs, Table 4 presents results for a Turing GPU, showing a 6.94% MAPE improvement over Accel-sim for the NVIDIA RTX 2080 Ti .  \n\n", "text": "In this paper, we focus on the NVIDIA Ampere architecture. However, the findings we have exposed in the paper apply to other architectures, such as Turing. In addition to reporting results for four Ampere GPUs, Table 4 presents results for a Turing GPU, showing a 6.94% MAPE improvement over Accel-sim for the NVIDIA RTX 2080 Ti .\n", "alignment": "left", "unique_id": "f35aee33c559a7b00852e6764a00b82c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this paper, we focus on the NVIDIA Ampere architecture. However, the findings we have exposed in the paper apply to other architectures, such as Turing. In addition to reporting results for four Ampere GPUs, Table 4 presents results for a Turing GPU, showing a 6.94% MAPE improvement over Accel-sim for the NVIDIA RTX 2080 Ti ."}], "lineHeight": 0}}, "target": {"markdown": "在本文中，我们聚焦于 NVIDIA Ampere 架构。然而，本文所揭示的发现同样适用于其他架构，例如 Turing。除了报告四款 Ampere GPU 的结果外，表 4 还给出了针对 Turing GPU 的结果，显示相对于 Accel-sim，NVIDIA RTX 2080 Ti 的 MAPE 提升了 6.94%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 191}, {"source": {"block_id": "03e7f8b645db42702c77b2964e4f5d3c", "index": 192, "aliyun_index": 8, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Although we have validated the model on Turing and Ampere, we believe that our findings remain applicable to other NVIDIA architectures. NVIDIA's public announcements and SM diagrams indicate that significant architectural changes have been limited to enhancements in Tensor cores, ray-tracing units, and minor  \n\n", "text": "Although we have validated the model on Turing and Ampere, we believe that our findings remain applicable to other NVIDIA architectures. NVIDIA's public announcements and SM diagrams indicate that significant architectural changes have been limited to enhancements in Tensor cores, ray-tracing units, and minor\n", "alignment": "left", "unique_id": "03e7f8b645db42702c77b2964e4f5d3c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although we have validated the model on Turing and Ampere, we believe that our findings remain applicable to other NVIDIA architectures. NVIDIA's public announcements and SM diagrams indicate that significant architectural changes have been limited to enhancements in Tensor cores, ray-tracing units, and minor"}], "lineHeight": 0}}, "target": {"markdown": "尽管我们已在 Turing 和 Ampere 上验证了该模型，但我们相信我们的发现同样适用于其他 NVIDIA 架构。NVIDIA 的公开声明和 SM 结构图表明，显著的架构变化仅限于 Tensor Core 的增强、光线追踪单元以及一些较小的", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 192}, {"source": {"block_id": "b63c49b25a83a768c5d42aab317512bc", "index": 193, "aliyun_index": 9, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "features such as distributed shared memory between SMs of the\nsame TPC [69]. Nonetheless, estimating the latencies for some\ninstructions, such as memory, will be necessary to adapt the model\nto these other architectures.  \n\n", "text": "features such as distributed shared memory between SMs of the\nsame TPC [69]. Nonetheless, estimating the latencies for some\ninstructions, such as memory, will be necessary to adapt the model\nto these other architectures.\n", "alignment": "left", "unique_id": "b63c49b25a83a768c5d42aab317512bc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "features such as distributed shared memory between SMs of the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "same TPC [69]. Nonetheless, estimating the latencies for some"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions, such as memory, will be necessary to adapt the model"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to these other architectures."}], "lineHeight": -104}}, "target": {"markdown": "功能，例如同一 TPC 内各 SM 之间的分布式共享内存 [69]。尽管如此，要将该模型适配到这些其他架构，仍需对某些指令（例如内存指令）的延迟进行估算。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 193}, {"source": {"block_id": "17b3401a5966ee85d58109dacd928d7d", "index": 194, "aliyun_index": 10, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 8 Related Work\n", "text": "8 Related Work\n", "alignment": "left", "unique_id": "17b3401a5966ee85d58109dacd928d7d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8 Related Work"}], "lineHeight": 0}}, "target": {"markdown": "## 8 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 194}, {"source": {"block_id": "e778e7990e6a0a84b6aa09a2817c6474", "index": 195, "aliyun_index": 11, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Simulators are the primary tool for evaluating ideas in computer architecture in academia and industry [5] due to the low cost of assessing new designs. Moreover, they are a great tool to check if designs are close to actual hardware. GPGPUs are no exception, and a leading vendor such as NVIDIA has exposed part of the process of creating their in-house simulator, NVIDIA Architectural Simulator (NVArchSim or NVAS) [85]. In the academic sphere, there are two popular public-domain simulators. The first one is MGPUSim [83], which models the AMD GCN 3 architecture and targets multi-GPU systems supporting virtual memory. An alternative simulator is the Accel-Sim framework [49], a cycle-accurate state-of-the-art trace-driven simulator supporting CUDA applications that models NVIDIA-like modern architectures, which it is based on the former GPGPU-Sim 3 simulator [17].  \n\n", "text": "Simulators are the primary tool for evaluating ideas in computer architecture in academia and industry [5] due to the low cost of assessing new designs. Moreover, they are a great tool to check if designs are close to actual hardware. GPGPUs are no exception, and a leading vendor such as NVIDIA has exposed part of the process of creating their in-house simulator, NVIDIA Architectural Simulator (NVArchSim or NVAS) [85]. In the academic sphere, there are two popular public-domain simulators. The first one is MGPUSim [83], which models the AMD GCN 3 architecture and targets multi-GPU systems supporting virtual memory. An alternative simulator is the Accel-Sim framework [49], a cycle-accurate state-of-the-art trace-driven simulator supporting CUDA applications that models NVIDIA-like modern architectures, which it is based on the former GPGPU-Sim 3 simulator [17].\n", "alignment": "left", "unique_id": "e778e7990e6a0a84b6aa09a2817c6474", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Simulators are the primary tool for evaluating ideas in computer architecture in academia and industry [5] due to the low cost of assessing new designs. Moreover, they are a great tool to check if designs are close to actual hardware. GPGPUs are no exception, and a leading vendor such as NVIDIA has exposed part of the process of creating their in-house simulator, NVIDIA Architectural Simulator (NVArchSim or NVAS) [85]. In the academic sphere, there are two popular public-domain simulators. The first one is MGPUSim [83], which models the AMD GCN 3 architecture and targets multi-GPU systems supporting virtual memory. An alternative simulator is the Accel-Sim framework [49], a cycle-accurate state-of-the-art trace-driven simulator supporting CUDA applications that models NVIDIA-like modern architectures, which it is based on the former GPGPU-Sim 3 simulator [17]."}], "lineHeight": 0}}, "target": {"markdown": "模拟器是学术界和工业界在计算机体系结构中评估设计方案的主要工具 [5]，因为其评估新设计的成本较低。此外，模拟器也是检验设计是否接近实际硬件的得力工具。GPGPU 也不例外，作为业界领先的厂商，NVIDIA 已公开了其内部模拟器 NVIDIA Architectural Simulator（NVArchSim 或 NVAS）的部分构建过程 [85]。在学术界，有两款广泛使用的开源模拟器。第一款是 MGPUSim [83]，它对 AMD GCN 3 架构进行建模，主要面向支持虚拟内存的多 GPU 系统。另一款是 Accel-Sim 框架 [49]，它是一款周期精确的、业界领先的、基于跟踪驱动的模拟器，支持 CUDA 应用，可对类似 NVIDIA 的现代架构进行建模，其前身为 GPGPU-Sim 3 模拟器 [17]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 195}, {"source": {"block_id": "0f31f05ac635a2feacda8038b76a52bd", "index": 196, "aliyun_index": 12, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In the literature, there are different works that try to reverse engineering CPU architectural components, such as the Intel Branch Predictor [92] or Intel cache designs [41, 55] to name just a few.  \n\n", "text": "In the literature, there are different works that try to reverse engineering CPU architectural components, such as the Intel Branch Predictor [92] or Intel cache designs [41, 55] to name just a few.\n", "alignment": "left", "unique_id": "0f31f05ac635a2feacda8038b76a52bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the literature, there are different works that try to reverse engineering CPU architectural components, such as the Intel Branch Predictor [92] or Intel cache designs [41, 55] to name just a few."}], "lineHeight": 0}}, "target": {"markdown": "在已有文献中，已有若干工作尝试对 CPU 的架构组件进行逆向工程，例如 Intel 分支预测器 [92] 或 Intel 缓存设计 [41, 55] 等，此处仅列举一二。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 196}, {"source": {"block_id": "fa9ddb25c6b10e3ab061689f13646643", "index": 197, "aliyun_index": 13, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Regarding NVIDIA GPUs, several works have been pursued to unveil specific components of GPUs. Ahn et al. [4] and Jin et al. [46] target to reverse engineer the Network on Chip of the NVIDIA Volta and Ampere architectures, respectively. Lashgar et al. [50] study NVIDIA Fermi's and Kepler's capabilities for handling memory requests. Jia et al. [43, 44] present some cache features such as line size and associativity, the latency of instructions, and some details of the register file of Volta and Turing. Khairy et al. [48] explore the L1 data cache and L2 cache designs of Volta. Abdelkhalik et al. [3] establish the relation between PTX and SASS instructions of Ampere and its execution latency. Regarding tensor cores, different works [31, 43, 44, 53, 54, 72, 82, 91] have investigated their programmability and micro-architecture. TLBs of Turing and Ampere have been reverse-engineered by Zhang et al. [95] with the purpose of realizing an attack on Multi-Instance GPUs. Concerning the control flow of modern NVIDIA GPU architectures, Shoushtary et al. [79] define a plausible semantic for control flow instructions of Turing with just a 1.03% error with respect to real hardware traces. The GPU task scheduler and the interaction with an ARM CPU in the NVIDIA Jetson TX2 are studied by Amert et al. [16]. Finally, Wong et al. [88] describe many components of the early Tesla architecture, such as caches, TLB, SIMT control flow behavior, and Cooperative Thread Array (CTA) barriers.  \n\n", "text": "Regarding NVIDIA GPUs, several works have been pursued to unveil specific components of GPUs. Ahn et al. [4] and Jin et al. [46] target to reverse engineer the Network on Chip of the NVIDIA Volta and Ampere architectures, respectively. Lashgar et al. [50] study NVIDIA Fermi's and Kepler's capabilities for handling memory requests. Jia et al. [43, 44] present some cache features such as line size and associativity, the latency of instructions, and some details of the register file of Volta and Turing. Khairy et al. [48] explore the L1 data cache and L2 cache designs of Volta. Abdelkhalik et al. [3] establish the relation between PTX and SASS instructions of Ampere and its execution latency. Regarding tensor cores, different works [31, 43, 44, 53, 54, 72, 82, 91] have investigated their programmability and micro-architecture. TLBs of Turing and Ampere have been reverse-engineered by Zhang et al. [95] with the purpose of realizing an attack on Multi-Instance GPUs. Concerning the control flow of modern NVIDIA GPU architectures, Shoushtary et al. [79] define a plausible semantic for control flow instructions of Turing with just a 1.03% error with respect to real hardware traces. The GPU task scheduler and the interaction with an ARM CPU in the NVIDIA Jetson TX2 are studied by Amert et al. [16]. Finally, Wong et al. [88] describe many components of the early Tesla architecture, such as caches, TLB, SIMT control flow behavior, and Cooperative Thread Array (CTA) barriers.\n", "alignment": "left", "unique_id": "fa9ddb25c6b10e3ab061689f13646643", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding NVIDIA GPUs, several works have been pursued to unveil specific components of GPUs. Ahn et al. [4] and Jin et al. [46] target to reverse engineer the Network on Chip of the NVIDIA Volta and Ampere architectures, respectively. Lashgar et al. [50] study NVIDIA Fermi's and Kepler's capabilities for handling memory requests. Jia et al. [43, 44] present some cache features such as line size and associativity, the latency of instructions, and some details of the register file of Volta and Turing. Khairy et al. [48] explore the L1 data cache and L2 cache designs of Volta. Abdelkhalik et al. [3] establish the relation between PTX and SASS instructions of Ampere and its execution latency. Regarding tensor cores, different works [31, 43, 44, 53, 54, 72, 82, 91] have investigated their programmability and micro-architecture. TLBs of Turing and Ampere have been reverse-engineered by Zhang et al. [95] with the purpose of realizing an attack on Multi-Instance GPUs. Concerning the control flow of modern NVIDIA GPU architectures, Shoushtary et al. [79] define a plausible semantic for control flow instructions of Turing with just a 1.03% error with respect to real hardware traces. The GPU task scheduler and the interaction with an ARM CPU in the NVIDIA Jetson TX2 are studied by Amert et al. [16]. Finally, Wong et al. [88] describe many components of the early Tesla architecture, such as caches, TLB, SIMT control flow behavior, and Cooperative Thread Array (CTA) barriers."}], "lineHeight": 0}}, "target": {"markdown": "就 NVIDIA GPU 而言，已有若干研究致力于揭示 GPU 各组成部件的细节。Ahn et al. [4] 和 Jin et al. [46] 分别针对 NVIDIA Volta 和 Ampere 架构的片上网络进行逆向工程。Lashgar et al. [50] 研究了 NVIDIA Fermi 和 Kepler 架构处理内存请求的能力。Jia et al. [43, 44] 揭示了 Volta 和 Turing 架构的部分缓存特性（如行大小和相联度）、指令延迟以及寄存器文件的部分细节。Khairy et al. [48] 探索了 Volta 架构的 L1 数据缓存和 L2 缓存设计。Abdelkhalik et al. [3] 建立了 Ampere 架构的 PTX 与 SASS 指令之间的对应关系及其执行延迟。针对 Tensor Core，已有多项工作 [31, 43, 44, 53, 54, 72, 82, 91] 对其可编程性和微架构进行了研究。Zhang et al. [95] 对 Turing 和 Ampere 的 TLB 进行了逆向工程，旨在实现针对多实例 GPU（Multi-Instance GPU）的攻击。针对现代 NVIDIA GPU 架构的控制流，Shoushtary et al. [79] 为 Turing 的控制流指令定义了一种合理的语义，相对于真实硬件跟踪仅有 1.03% 的误差。Amert et al. [16] 研究了 GPU 任务调度器及其在 NVIDIA Jetson TX2 中与 ARM CPU 的交互。最后，Wong et al. [88] 描述了早期 Tesla 架构的诸多组件，例如缓存、TLB、SIMT 控制流行为以及协作线程数组（Cooperative Thread Array, CTA）屏障。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 197}, {"source": {"block_id": "16d2b0106e2cd00f18e3e1f726b0da14", "index": 198, "aliyun_index": 14, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Regarding previous works that focused on other GPU vendors, Gutierrez et al. [37] show that directly employing the AMD GPU machine ISA rather than intermediate languages is crucial for accurately assessing bottlenecks and potential solutions during simulation. Moreover, the GAP tool [42] identifies discrepancies between real AMD GPUs and their gem5 [19] simulated counterparts, which has led to improvements in gem5's AMD GPU accuracy [73, 74]. Finally, Gera et al. [34] introduce a simulation framework and characterize Intel's integrated GPUs.  \n\n", "text": "Regarding previous works that focused on other GPU vendors, Gutierrez et al. [37] show that directly employing the AMD GPU machine ISA rather than intermediate languages is crucial for accurately assessing bottlenecks and potential solutions during simulation. Moreover, the GAP tool [42] identifies discrepancies between real AMD GPUs and their gem5 [19] simulated counterparts, which has led to improvements in gem5's AMD GPU accuracy [73, 74]. Finally, Gera et al. [34] introduce a simulation framework and characterize Intel's integrated GPUs.\n", "alignment": "left", "unique_id": "16d2b0106e2cd00f18e3e1f726b0da14", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding previous works that focused on other GPU vendors, Gutierrez et al. [37] show that directly employing the AMD GPU machine ISA rather than intermediate languages is crucial for accurately assessing bottlenecks and potential solutions during simulation. Moreover, the GAP tool [42] identifies discrepancies between real AMD GPUs and their gem5 [19] simulated counterparts, which has led to improvements in gem5's AMD GPU accuracy [73, 74]. Finally, Gera et al. [34] introduce a simulation framework and characterize Intel's integrated GPUs."}], "lineHeight": 0}}, "target": {"markdown": "关于针对其他 GPU 厂商的先前工作，Gutierrez et al. [37] 指出，在模拟过程中直接采用 AMD GPU 的机器级 ISA 而非中间语言，对于准确评估瓶颈和潜在解决方案至关重要。此外，GAP 工具 [42] 揭示了真实 AMD GPU 与其 gem5 [19] 模拟对应版本之间的差异，并由此推动了 gem5 中 AMD GPU 模型精度的提升 [73, 74]。最后，Gera et al. [34] 提出了一套模拟框架，并对 Intel 集成显卡进行了特性分析。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 198}, {"source": {"block_id": "8105a961fbbad916103e6220184782a8", "index": 199, "aliyun_index": 1, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "Compiler hints (a.k.a. control bits) have been used in GPUs at least since the NVIDIA Kepler architecture [93, 94]. A description of these control bits was published by Gray et al. [36]. In Kepler, Maxwell, and Pascal architectures, one out of each 3 to 7 instructions is usually a compiler-inserted hint instruction. Jia et al. [43, 44] revealed that newer architectures such as Volta or Turing have increased the instruction bit size from 64 to 128 bits. As a result, newer architectures have shifted from having specific instructions for hints to including the hint bits in each instruction. These bits are intended not only to improve the hardware performance but also to ensure the program's correctness by preventing data hazards. CPUs have used compiler hints to help hardware make better decisions about how to use the different resources [80]. These hints have been used to support different components of the CPUs, such as data bypass, branch prediction, and caches, among others.  \n\n", "text": "Compiler hints (a.k.a. control bits) have been used in GPUs at least since the NVIDIA Kepler architecture [93, 94]. A description of these control bits was published by Gray et al. [36]. In Kepler, Maxwell, and Pascal architectures, one out of each 3 to 7 instructions is usually a compiler-inserted hint instruction. Jia et al. [43, 44] revealed that newer architectures such as Volta or Turing have increased the instruction bit size from 64 to 128 bits. As a result, newer architectures have shifted from having specific instructions for hints to including the hint bits in each instruction. These bits are intended not only to improve the hardware performance but also to ensure the program's correctness by preventing data hazards. CPUs have used compiler hints to help hardware make better decisions about how to use the different resources [80]. These hints have been used to support different components of the CPUs, such as data bypass, branch prediction, and caches, among others.\n", "alignment": "left", "unique_id": "8105a961fbbad916103e6220184782a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compiler hints (a.k.a. control bits) have been used in GPUs at least since the NVIDIA Kepler architecture [93, 94]. A description of these control bits was published by Gray et al. [36]. In Kepler, Maxwell, and Pascal architectures, one out of each 3 to 7 instructions is usually a compiler-inserted hint instruction. Jia et al. [43, 44] revealed that newer architectures such as Volta or Turing have increased the instruction bit size from 64 to 128 bits. As a result, newer architectures have shifted from having specific instructions for hints to including the hint bits in each instruction. These bits are intended not only to improve the hardware performance but also to ensure the program's correctness by preventing data hazards. CPUs have used compiler hints to help hardware make better decisions about how to use the different resources [80]. These hints have been used to support different components of the CPUs, such as data bypass, branch prediction, and caches, among others."}], "lineHeight": 0}}, "target": {"markdown": "编译提示（也称为控制位）自 NVIDIA Kepler 架构起就已用于 GPU 中 [93, 94]。Gray et al. [36] 公开了这些控制位的相关描述。在 Kepler、Maxwell 和 Pascal 架构中，每 3 到 7 条指令中通常就有 1 条是编译器插入的提示指令。Jia et al. [43, 44] 揭示出，自 Volta 和 Turing 等更新架构起，指令位宽已从 64 位扩展到 128 位。因此，更新的架构不再使用专门的提示指令，而是在每条指令中直接包含提示位。这些位不仅旨在提升硬件性能，还通过防止数据冒险来确保程序的正确性。CPU 早已利用编译提示来帮助硬件更好地决策如何使用各类资源 [80]。这些提示已被用于支持 CPU 的多个组件，例如数据旁路、分支预测以及缓存等。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 199}, {"source": {"block_id": "cfea19561ad617fa5f5c78dcc81cf957", "index": 200, "aliyun_index": 2, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "To the best of our knowledge, our work is the first one to unveil the GPU core microarchitecture of modern NVIDIA GPUs and develop an accurate microarchitecture simulation model. Some novel features discovered in our work are: a complete definition of the semantics of the control bits and the microarchitectural changes to support them, the behavior of the issue scheduler, the microarchitecture of the register file and its associated cache, and various aspects of the memory pipeline. These aspects are critical for an accurate modeling of modern NVIDIA GPUs.  \n\n", "text": "To the best of our knowledge, our work is the first one to unveil the GPU core microarchitecture of modern NVIDIA GPUs and develop an accurate microarchitecture simulation model. Some novel features discovered in our work are: a complete definition of the semantics of the control bits and the microarchitectural changes to support them, the behavior of the issue scheduler, the microarchitecture of the register file and its associated cache, and various aspects of the memory pipeline. These aspects are critical for an accurate modeling of modern NVIDIA GPUs.\n", "alignment": "left", "unique_id": "cfea19561ad617fa5f5c78dcc81cf957", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To the best of our knowledge, our work is the first one to unveil the GPU core microarchitecture of modern NVIDIA GPUs and develop an accurate microarchitecture simulation model. Some novel features discovered in our work are: a complete definition of the semantics of the control bits and the microarchitectural changes to support them, the behavior of the issue scheduler, the microarchitecture of the register file and its associated cache, and various aspects of the memory pipeline. These aspects are critical for an accurate modeling of modern NVIDIA GPUs."}], "lineHeight": 0}}, "target": {"markdown": "据我们所知，本工作是首个揭示现代 NVIDIA GPU 核心微架构并构建精确微架构模拟模型的研究。本工作所揭示的部分新特性包括：控制位语义的完整定义及其所对应的微架构变更、发射调度器的行为、寄存器文件的微架构及其关联缓存，以及内存流水线的多个方面。这些方面对于现代 NVIDIA GPU 的精确建模至关重要。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 200}, {"source": {"block_id": "4a91d0320be18da8e469721c60e977e6", "index": 201, "aliyun_index": 3, "page_num": 12, "type": "title", "sub_type": "none", "markdown": "## 9 Conclusion\n", "text": "9 Conclusion\n", "alignment": "left", "unique_id": "4a91d0320be18da8e469721c60e977e6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9 Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "## 9 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 201}, {"source": {"block_id": "a02eefa109e84eee5eabc7a0769d55bd", "index": 202, "aliyun_index": 4, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "This paper unveils the industry's modern NVIDIA GPU microarchitecture by reverse engineering it on real hardware. We dissect the issue stage logic, including analyzing warp readiness conditions and discovering that the issue scheduler among warps follows a CGGTY policy. In addition, we unveil different details of the register file, such as the number of ports and their width. Also, we reveal how the register file cache works. Moreover, this paper exhibits some important characteristics of the memory pipeline, like the size of load/store queues, contention between sub-cores, and how latencies are affected by memory instruction granularity accesses. Furthermore, we analyze the fetch stage and propose one that meets the requirements of modern NVIDIA GPUs.  \n\n", "text": "This paper unveils the industry's modern NVIDIA GPU microarchitecture by reverse engineering it on real hardware. We dissect the issue stage logic, including analyzing warp readiness conditions and discovering that the issue scheduler among warps follows a CGGTY policy. In addition, we unveil different details of the register file, such as the number of ports and their width. Also, we reveal how the register file cache works. Moreover, this paper exhibits some important characteristics of the memory pipeline, like the size of load/store queues, contention between sub-cores, and how latencies are affected by memory instruction granularity accesses. Furthermore, we analyze the fetch stage and propose one that meets the requirements of modern NVIDIA GPUs.\n", "alignment": "left", "unique_id": "a02eefa109e84eee5eabc7a0769d55bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper unveils the industry's modern NVIDIA GPU microarchitecture by reverse engineering it on real hardware. We dissect the issue stage logic, including analyzing warp readiness conditions and discovering that the issue scheduler among warps follows a CGGTY policy. In addition, we unveil different details of the register file, such as the number of ports and their width. Also, we reveal how the register file cache works. Moreover, this paper exhibits some important characteristics of the memory pipeline, like the size of load/store queues, contention between sub-cores, and how latencies are affected by memory instruction granularity accesses. Furthermore, we analyze the fetch stage and propose one that meets the requirements of modern NVIDIA GPUs."}], "lineHeight": 0}}, "target": {"markdown": "本文通过对实际硬件进行逆向工程，揭示了业界现代 NVIDIA GPU 的微架构。我们深入剖析了发射阶段的逻辑，包括对 warp 就绪条件的分析，并发现各 warp 之间的发射调度器遵循 CGGTY 策略。此外，我们还揭示了寄存器文件的多项细节，例如端口数量及其位宽。同时，我们也揭示了寄存器文件缓存的工作机制。另外，本文展示了内存流水线的一些重要特性，如加载/存储队列的大小、子核心之间的争用情况，以及内存指令粒度访问对延迟的影响。此外，我们还对取指阶段进行了分析，并提出了一种满足现代 NVIDIA GPU 需求的取指方案。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 202}, {"source": {"block_id": "9c71229e0674e39213ffd166438d5672", "index": 203, "aliyun_index": 5, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "Additionally, the paper compendiums previous public information about control bits by organizing, explaining it in detail, and extending it.  \n\n", "text": "Additionally, the paper compendiums previous public information about control bits by organizing, explaining it in detail, and extending it.\n", "alignment": "left", "unique_id": "9c71229e0674e39213ffd166438d5672", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Additionally, the paper compendiums previous public information about control bits by organizing, explaining it in detail, and extending it."}], "lineHeight": 0}}, "target": {"markdown": "此外，本文还对先前公开的关于控制位的资料进行了汇总整理、详细阐释并加以扩展。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 203}, {"source": {"block_id": "dc1bbc4ef835117df55e074c4da027d9", "index": 204, "aliyun_index": 6, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "In addition, we model all these details in a simulator and compare this new model against real hardware, demonstrating that it is closer to reality than the previous models by improving its accuracy in cycles by more than 18.24%.  \n\n", "text": "In addition, we model all these details in a simulator and compare this new model against real hardware, demonstrating that it is closer to reality than the previous models by improving its accuracy in cycles by more than 18.24%.\n", "alignment": "left", "unique_id": "dc1bbc4ef835117df55e074c4da027d9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In addition, we model all these details in a simulator and compare this new model against real hardware, demonstrating that it is closer to reality than the previous models by improving its accuracy in cycles by more than 18.24%."}], "lineHeight": 0}}, "target": {"markdown": "此外，我们将上述所有细节建模到一款模拟器中，并将该新模型与真实硬件进行了对比，结果表明相较于以往的模型，其在周期层面的精度提升了超过 18.24%，从而更贴近真实硬件的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 204}, {"source": {"block_id": "bfd4887a3fe6552d451062d8999daefc", "index": 205, "aliyun_index": 7, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "Besides, we demonstrate that instruction prefetching with a simple stream buffer in GPUs performs well in terms of simulation accuracy and performance, approaching a perfect instruction cache. Also, we show how the dependence management mechanism based on control bits used in modern NVIDIA GPUs outperforms other alternatives, such as traditional scoreboarding.  \n\n", "text": "Besides, we demonstrate that instruction prefetching with a simple stream buffer in GPUs performs well in terms of simulation accuracy and performance, approaching a perfect instruction cache. Also, we show how the dependence management mechanism based on control bits used in modern NVIDIA GPUs outperforms other alternatives, such as traditional scoreboarding.\n", "alignment": "left", "unique_id": "bfd4887a3fe6552d451062d8999daefc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Besides, we demonstrate that instruction prefetching with a simple stream buffer in GPUs performs well in terms of simulation accuracy and performance, approaching a perfect instruction cache. Also, we show how the dependence management mechanism based on control bits used in modern NVIDIA GPUs outperforms other alternatives, such as traditional scoreboarding."}], "lineHeight": 0}}, "target": {"markdown": "此外，我们证明在 GPU 中采用配备简单流缓冲区的指令预取机制即可在模拟精度和性能方面取得良好效果，接近于完美的指令缓存。同时，我们还展示了现代 NVIDIA GPU 中基于控制位的依赖管理机制相较于其他方案（如传统的记分板机制）所具有的优越性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 205}, {"source": {"block_id": "414806b1b03f87bddef786039a8575d5", "index": 206, "aliyun_index": 8, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "Finally, we investigate how the register file cache and the number\nregister file read ports affect simulation accuracy and performance.  \n\n", "text": "Finally, we investigate how the register file cache and the number\nregister file read ports affect simulation accuracy and performance.\n", "alignment": "left", "unique_id": "414806b1b03f87bddef786039a8575d5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Finally, we investigate how the register file cache and the number"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "register file read ports affect simulation accuracy and performance."}], "lineHeight": -50}}, "target": {"markdown": "最后，我们研究了寄存器文件缓存以及寄存器文件读端口数量对模拟精度和性能的影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 206}, {"source": {"block_id": "ef9e5fed18df92d5b5ae270daca4e58c", "index": 207, "aliyun_index": 9, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "Overall, we can conclude that GPUs are hardware-compiler code-sign where the compiler guides the hardware in handling dependencies and introduces hints that can improve performance and energy.  \n\n", "text": "Overall, we can conclude that GPUs are hardware-compiler code-sign where the compiler guides the hardware in handling dependencies and introduces hints that can improve performance and energy.\n", "alignment": "left", "unique_id": "ef9e5fed18df92d5b5ae270daca4e58c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Overall, we can conclude that GPUs are hardware-compiler code-sign where the compiler guides the hardware in handling dependencies and introduces hints that can improve performance and energy."}], "lineHeight": 0}}, "target": {"markdown": "总体而言，我们可以得出结论：GPU 是硬件与编译器协同设计的产物，编译器在其中引导硬件处理依赖关系，并引入能够提升性能与能效的提示信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 207}, {"source": {"block_id": "d23defa682cbf94ab06eefad6682fbbf", "index": 208, "aliyun_index": 10, "page_num": 12, "type": "title", "sub_type": "none", "markdown": "## References\n", "text": "References\n", "alignment": "left", "unique_id": "d23defa682cbf94ab06eefad6682fbbf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "References"}], "lineHeight": 0}}, "target": {"markdown": "## 参考文献\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 208}, {"source": {"block_id": "42029cdbca14a11009896b35684516ba", "index": 209, "aliyun_index": 11, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[1] Tor M. Aamodt, Wilson Wai Lun Fung, and Timothy G. Rogers. 2018. *General-purpose Graphics Processor Architectures*. Morgan & Claypool Publishers.  \n\n", "text": "[1] Tor M. Aamodt, Wilson Wai Lun Fung, and Timothy G. Rogers. 2018. *General-purpose Graphics Processor Architectures*. Morgan & Claypool Publishers.\n", "alignment": "left", "unique_id": "42029cdbca14a11009896b35684516ba", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": " function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){

function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){

    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');

    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];

        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;

      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }

      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){

    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');

}

function isSharedVisual(p){

}
function rebuildOutline(){
  DATA.outline = DATA.pairs.map((p, idx) => {
    if ((p.source.type || '') !== 'title') return null;
    const src = stripHeadingMarks(p.source.markdown);
    const tgtMd = p.target.markdown || p.source.markdown;
    const tgt = stripHeadingMarks(tgtMd);
    return {
      block_id: p.source.block_id,
      level: Math.max(1, Math.min(4, headingLevelOf(tgtMd || p.source.markdown))),
      title: tgt || src,
      source_title: src,
      pair_index: idx
    };
  }).filter(Boolean);
}
function bindPairHover(root){
  root.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-pair]');
    if (!el) return;
    const id = el.getAttribute('data-pair');
    root.querySelectorAll('[data-pair]').forEach(n => {
      n.classList.toggle('pair-hot', n.getAttribute('data-pair')===id);
    });
  });
  root.addEventListener('mouseleave', () => {
    root.querySelectorAll('.pair-hot').forEach(n => n.classList.remove('pair-hot'));
  });
}
function renderArticle(){
  const list = document.getElementById('list');
  list.className = 'content';
  const wrap = document.createElement('div');
  if (viewMode!=='compare'){
    wrap.className = 'article';
    const which = viewMode==='parse' ? 'source' : 'target';
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p, which));
      return `<div class="pair-unit${kind}"${hid} data-pair="${i}">${editBtnHtml(i)}${chunkHtml(p,i,which)}</div>`;
    }).join('');
  } else if (compareLayout==='side'){
    wrap.className = 'article compare-side';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,'target')) || unitKindClass(p, pickMd(p,'source'));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit side-pair${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  } else {
    // 豆包/沉浸式翻译式：一段原文，紧跟一段译文。相同的图/代码只显示一份。
    wrap.className = 'article compare-stack';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,a)) || unitKindClass(p, pickMd(p,b));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  }
  list.innerHTML = '';
  list.appendChild(wrap);
  bindPairHover(wrap);
}
function render(){
  document.body.classList.toggle('show-edit', showEdit);
  const c = counts();
  document.getElementById('counts').textContent =
    `translated ${c.translated} · skipped ${c.skipped} · failed ${c.failed} · pending ${c.pending} · edited ${c.edited}`;
  document.getElementById('cmp').disabled = viewMode!=='compare';
  document.getElementById('layout').disabled = viewMode!=='compare';
  renderArticle();
}
function fillTypeSelect(current){
  const sel = document.getElementById('edit-type');
  const types = BLOCK_TYPES.slice();
  if (current && types.indexOf(current)<0) types.push(current);
  sel.innerHTML = types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = current || 'text';
}
function editorStateFromForm(){
  return {
    type: document.getElementById('edit-type').value,
    isTitle: document.getElementById('edit-is-title').checked,
    level: +document.getElementById('edit-level').value || 2,
    translate: document.getElementById('edit-translate').checked,
    source: document.getElementById('edit-src').value,
    target: document.getElementById('edit-tgt').value
  };
}
function syncTitleFields(){
  const isTitle = document.getElementById('edit-is-title').checked;
  document.getElementById('edit-level-wrap').hidden = !isTitle;
  if (isTitle) document.getElementById('edit-type').value = 'title';
}
function updateEditorPreview(){
  const st = editorStateFromForm();
  const fake = {source:{type: st.isTitle ? 'title' : st.type}};
  let src = st.source, tgt = st.target;
  if (isCaptionType(fake)){
    src = captionMd(src);
    tgt = captionMd(tgt);
  }
  let srcHtml = mdToHtml(src);
  let tgtHtml = mdToHtml(tgt);
  if (isCaptionType(fake)){
    srcHtml = markCaptionLabel(srcHtml);
    tgtHtml = markCaptionLabel(tgtHtml);
  }
  document.getElementById('edit-src-preview').innerHTML = srcHtml || '<p>（空）</p>';
  document.getElementById('edit-tgt-preview').innerHTML = tgtHtml || '<p>（空）</p>';
}
function openEditor(i){
  const p = DATA.pairs[i];
  if (!p) return;
  editingIndex = i;
  const src = p.source, tgt = p.target;
  const page = (src.page_num==null) ? '-' : (src.page_num + 1);
  document.getElementById('edit-title').textContent = '编辑块 ' + (src.block_id || ('#'+i));
  document.getElementById('edit-meta').textContent =
    `第 ${page} 页 · index ${src.index} · ${esc(tgt.status)}` +
    (tgt.skip_reason ? (' · ' + tgt.skip_reason) : '');
  fillTypeSelect(src.type || 'text');
  const isTitle = (src.type || '') === 'title';
  document.getElementById('edit-is-title').checked = isTitle;
  document.getElementById('edit-level').value = String(headingLevelOf(src.markdown || tgt.markdown));
  document.getElementById('edit-translate').checked = tgt.status !== 'skipped';
  document.getElementById('edit-src').value = src.markdown || '';
  document.getElementById('edit-tgt').value = tgt.markdown || '';
  document.getElementById('edit-propose').hidden = !(corpusRepo() && paperSlug());
  syncTitleFields();
  updateEditorPreview();
  editSnapshot = JSON.stringify(editorStateFromForm());
  document.getElementById('edit-modal').hidden = false;
  document.body.classList.add('modal-open');
  document.getElementById('edit-tgt').focus();
}
function closeEditor(){
  document.getElementById('edit-modal').hidden = true;
  document.body.classList.remove('modal-open');
  editingIndex = -1;
}
function editorDirty(){
  return JSON.stringify(editorStateFromForm()) !== editSnapshot;
}
function requestCloseEditor(){
  if (editorDirty() && !confirm('放弃未保存的修改？')) return;
  closeEditor();
}
function applyEditor(){
  if (editingIndex < 0) return;
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  const prevType = p.source.type || 'text';
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  let srcMd = st.source;
  let tgtMd = st.target;
  if (type === 'title'){
    srcMd = applyHeadingLevel(srcMd, st.level);
    if (String(tgtMd).trim()) tgtMd = applyHeadingLevel(tgtMd, st.level);
  }
  const srcChanged = srcMd !== (p.source.markdown || '');
  const tgtChanged = tgtMd !== (p.target.markdown || '');
  p.source.type = type;
  p.source.markdown = srcMd;
  if (srcChanged || type !== prevType) p.source.edited = true;
  p.target.markdown = tgtMd;
  if (!st.translate){
    p.target.status = 'skipped';
    if (!p.target.skip_reason) p.target.skip_reason = 'user';
  } else {
    if (p.target.status === 'skipped'){
      p.target.skip_reason = null;
      p.target.skip_kind = null;
      p.target.status = tgtMd.trim() ? (tgtChanged ? 'edited' : 'translated') : 'pending';
    }
    if (tgtChanged){
      p.target.edited = true;
      p.target.status = 'edited';
    }
  }
  rebuildOutline();
  closeEditor();
  const y = window.scrollY;
  render();
  renderToc();
  window.scrollTo(0, y);
  showToast('已改内存中的文档，请下载 JSON/HTML 保存');
}
function corpusRepo(){ return (DATA.corpus_repo || BOOT.corpus_repo || '').trim(); }
function paperSlug(){ return (DATA.paper_slug || BOOT.paper_slug || '').trim(); }
function patchFromEditor(){
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  const source = { markdown: st.source, type: type };
  const target = { markdown: st.target };
  const patch = {
    schema: 'pdf-agent-edit/v1',
    paper: paperSlug(),
    block_id: p.source.block_id,
    pair_index: editingIndex,
    action: st.translate ? 'replace' : 'skip',
    source: source,
    target: target,
    translate: st.translate,
    heading_level: st.isTitle ? st.level : null,
    before: {
      source: { markdown: p.source.markdown || '' },
      target: { markdown: p.target.markdown || '' }
    }
  };
  return patch;
}
function proposeEditor(){
  const repo = corpusRepo();
  const slug = paperSlug();
  if (!repo || !slug){
    showToast('未绑定语料仓，请下载 JSON 或手开 Issue');
    return;
  }
  const patch = patchFromEditor();
  const title = '[edit] ' + slug + ' ' + patch.block_id;
  const yaml = [
    '---',
    'schema: pdf-agent-edit/v1',
    'paper: ' + slug,
    'block_id: ' + patch.block_id,
    'pair_index: ' + String(patch.pair_index),
    'action: ' + patch.action,
    '---',
    '',
    '```json',
    JSON.stringify(patch, null, 2),
    '```',
    ''
  ].join('\n');
  const url = 'https://github.com/' + repo + '/issues/new?' + new URLSearchParams({
    title: title,
    body: yaml,
    labels: 'edit'
  }).toString();
  if (url.length > 7000){
    download((slug + '-' + patch.block_id + '.edit.json'),
      new Blob([JSON.stringify(patch, null, 2)], {type:'application/json'}));
    showToast('补丁太长，已下载 JSON，请新建 Issue 并粘贴');
    return;
  }
  window.open(url, '_blank', 'noopener');
}
document.getElementById('list').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-edit]');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  openEditor(+btn.getAttribute('data-edit'));
});
document.getElementById('toc').addEventListener('click', ev => {
  const twist = ev.target.closest('[data-fold]');
  if (twist && !twist.classList.contains('leaf')){
    ev.preventDefault();
    const id = twist.getAttribute('data-fold');
    if (foldedIds.has(id)) foldedIds.delete(id); else foldedIds.add(id);
    const node = twist.closest('.toc-node');
    if (node){
      node.classList.toggle('folded', foldedIds.has(id));
      twist.setAttribute('aria-expanded', String(!foldedIds.has(id)));
    }
    return;
  }
  const a = ev.target.closest('a');
  if (!a) return;
  ev.preventDefault();
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.toc a').forEach(x => x.classList.toggle('active', x===a));
});
document.getElementById('nav-toggle').addEventListener('click', () => {
  setNavFolded(!document.body.classList.contains('nav-folded'));
});
document.getElementById('nav-reopen').addEventListener('click', () => setNavFolded(false));
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
document.getElementById('mode').addEventListener('change', e => { viewMode = e.target.value; render(); });
document.getElementById('cmp').addEventListener('change', e => { compareFirst = e.target.value; render(); });
document.getElementById('layout').addEventListener('change', e => { compareLayout = e.target.value; render(); });
document.getElementById('show-edit').addEventListener('change', e => {
  showEdit = e.target.checked;
  document.body.classList.toggle('show-edit', showEdit);
});
['edit-src','edit-tgt','edit-type','edit-level','edit-is-title','edit-translate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditorPreview);
  document.getElementById(id).addEventListener('change', updateEditorPreview);
});
document.getElementById('edit-type').addEventListener('change', () => {
  document.getElementById('edit-is-title').checked = document.getElementById('edit-type').value === 'title';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-is-title').addEventListener('change', () => {
  if (document.getElementById('edit-is-title').checked) document.getElementById('edit-type').value = 'title';
  else if (document.getElementById('edit-type').value === 'title') document.getElementById('edit-type').value = 'text';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-save').addEventListener('click', applyEditor);
document.getElementById('edit-propose').addEventListener('click', proposeEditor);
document.getElementById('edit-cancel').addEventListener('click', requestCloseEditor);
document.getElementById('edit-close').addEventListener('click', requestCloseEditor);
document.getElementById('edit-backdrop').addEventListener('click', requestCloseEditor);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('edit-modal').hidden) return;
  ev.preventDefault();
  requestCloseEditor();
});
document.getElementById('dl-json').addEventListener('click', () => {
  download((DATA.source_pdf_name||'document')+'.translated.json',
    new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'}));
});
document.getElementById('dl-html').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  const script = clone.querySelector('#doc-data');
  if (script) script.textContent = JSON.stringify(DATA);
  download((DATA.source_pdf_name||'document')+'.html',
    new Blob(['<!DOCTYPE html>\n'+clone.outerHTML], {type:'text/html'}));
});
(function initPdfLink(){
  const a = document.getElementById('dl-pdf');
  if (!a) return;
  if (BOOT.has_source_pdf){
    a.hidden = false;
    a.setAttribute('href', BOOT.source_pdf_href || 'source.pdf');
    a.setAttribute('download', BOOT.source_pdf_name || 'source.pdf');
  } else {
    a.remove();
  }
})();
try { if (localStorage.getItem('pat-nav-folded')==='1') setNavFolded(true); } catch (e) {}
renderToc();
render();
</script>
