alidation\n", "alignment": "left", "unique_id": "990310d362292e3ccbd74df906cdf3cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7 Validation"}], "lineHeight": 0}}, "target": {"markdown": "## 7 验证\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "fe13169882b5a39132d5d087d32b6dde", "index": 157, "aliyun_index": 6, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "In this section, we evaluate the accuracy of our proposed microarchitecture for the GPU cores. First, we describe the methodology that we have followed in subsection 7.1. Then, we validate the design in subsection 7.2. Next, we examine the impact of the register file cache and the number of register file read ports on accuracy and performance in subsection 7.4. Later, we study the impact of two different components in the design, such as the instruction prefetcher in subsection 7.3 and an analysis of the dependence checking mechanisms in subsection 7.5. Finally, we discuss how the model can be seamlessly adapted for NVIDIA architectures other than Ampere in subsection 7.6.  \n\n", "text": "In this section, we evaluate the accuracy of our proposed microarchitecture for the GPU cores. First, we describe the methodology that we have followed in subsection 7.1. Then, we validate the design in subsection 7.2. Next, we examine the impact of the register file cache and the number of register file read ports on accuracy and performance in subsection 7.4. Later, we study the impact of two different components in the design, such as the instruction prefetcher in subsection 7.3 and an analysis of the dependence checking mechanisms in subsection 7.5. Finally, we discuss how the model can be seamlessly adapted for NVIDIA architectures other than Ampere in subsection 7.6.\n", "alignment": "left", "unique_id": "fe13169882b5a39132d5d087d32b6dde", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section, we evaluate the accuracy of our proposed microarchitecture for the GPU cores. First, we describe the methodology that we have followed in subsection 7.1. Then, we validate the design in subsection 7.2. Next, we examine the impact of the register file cache and the number of register file read ports on accuracy and performance in subsection 7.4. Later, we study the impact of two different components in the design, such as the instruction prefetcher in subsection 7.3 and an analysis of the dependence checking mechanisms in subsection 7.5. Finally, we discuss how the model can be seamlessly adapted for NVIDIA architectures other than Ampere in subsection 7.6."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们对我们所提出的 GPU 核心微架构的准确性进行评估。首先，我们在第 7.1 小节中描述所遵循的方法论。然后，在第 7.2 小节中对设计进行验证。接着，在第 7.4 小节中考察寄存器文件缓存以及寄存器文件读端口数量对准确性和性能的影响。随后，我们在第 7.3 小节中研究指令预取器这一设计组件的影响，并在第 7.5 小节中分析依赖检查机制。最后，我们在第 7.6 小节中讨论该模型如何能够无缝地适配 Ampere 之外的其他 NVIDIA 架构。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "4260866db2085169acba9c66b2468956", "index": 158, "aliyun_index": 7, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "### 7.1 Methodology\n", "text": "7.1 Methodology\n", "alignment": "left", "unique_id": "4260866db2085169acba9c66b2468956", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.1 Methodology"}], "lineHeight": 0}}, "target": {"markdown": "### 7.1 方法论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "d45657f0aafcf7fc95ed323deabbe991", "index": 159, "aliyun_index": 8, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We validate the accuracy of the proposed GPU core by comparing the results of our version of the simulator against hardware counter-metrics obtained in a real GPU. We use four different Ampere [67] GPUs whose specifications are shown in Table 4. All the GPUs use CUDA 11.4 and NVBit 1.5.5. We also compare our model/simulator with the vanilla Accel-sim simulator framework, since our model is built on top of it.  \n\n", "text": "We validate the accuracy of the proposed GPU core by comparing the results of our version of the simulator against hardware counter-metrics obtained in a real GPU. We use four different Ampere [67] GPUs whose specifications are shown in Table 4. All the GPUs use CUDA 11.4 and NVBit 1.5.5. We also compare our model/simulator with the vanilla Accel-sim simulator framework, since our model is built on top of it.\n", "alignment": "left", "unique_id": "d45657f0aafcf7fc95ed323deabbe991", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We validate the accuracy of the proposed GPU core by comparing the results of our version of the simulator against hardware counter-metrics obtained in a real GPU. We use four different Ampere [67] GPUs whose specifications are shown in Table 4. All the GPUs use CUDA 11.4 and NVBit 1.5.5. We also compare our model/simulator with the vanilla Accel-sim simulator framework, since our model is built on top of it."}], "lineHeight": 0}}, "target": {"markdown": "我们通过将我们版本的模拟器所得到的结果与在实际 GPU 上获取的硬件计数器指标进行比较，从而对我们所提出的 GPU 核心的准确性进行验证。我们使用了四款不同的 Ampere [67] GPU，其规格如表 4 所示。所有这些 GPU 均使用 CUDA 11.4 和 NVBit 1.5.5。此外，由于我们的模型是基于原生（vanilla）的 Accel-sim 模拟器框架构建的，我们还将其与该框架进行了对比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "bf5852680e1e07e8fb6290cefa05ac8f", "index": 160, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We use a wide variety of benchmarks from 12 different suites. A list of the suites that have been employed and the number of applications and different input data sets can be found in Table 3. In total, we use 143 benchmarks, 83 of those being different applications, and the rest corresponding to just changing the input parameters.  \n\n", "text": "We use a wide variety of benchmarks from 12 different suites. A list of the suites that have been employed and the number of applications and different input data sets can be found in Table 3. In total, we use 143 benchmarks, 83 of those being different applications, and the rest corresponding to just changing the input parameters.\n", "alignment": "left", "unique_id": "bf5852680e1e07e8fb6290cefa05ac8f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use a wide variety of benchmarks from 12 different suites. A list of the suites that have been employed and the number of applications and different input data sets can be found in Table 3. In total, we use 143 benchmarks, 83 of those being different applications, and the rest corresponding to just changing the input parameters."}], "lineHeight": 0}}, "target": {"markdown": "我们使用了来自 12 个不同套件的大量基准测试。表 3 列出了所使用的套件清单，以及对应的应用程序数量和不同的输入数据集数量。总体而言，我们共使用了 143 个基准测试，其中 83 个对应不同的应用程序，其余仅通过更改输入参数得到。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "4d1f6739fe939877a4e3a59532be5c0b", "index": 161, "aliyun_index": 10, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "### 7.2 Performance Accuracy\n", "text": "7.2 Performance Accuracy\n", "alignment": "left", "unique_id": "4d1f6739fe939877a4e3a59532be5c0b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.2 Performance Accuracy"}], "lineHeight": 0}}, "target": {"markdown": "### 7.2 性能准确性\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "596ed5f8b9a21b7c6e4b0fb1c3e2dbe2", "index": 162, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Table 4 shows the reported mean percentage absolute error (MAPE) for both models (our model and Accel-sim) with respect to the real hardware for each of the GPUs. We can see that our model is significantly more accurate than Accel-sim in all the evaluated  \n\n", "text": "Table 4 shows the reported mean percentage absolute error (MAPE) for both models (our model and Accel-sim) with respect to the real hardware for each of the GPUs. We can see that our model is significantly more accurate than Accel-sim in all the evaluated\n", "alignment": "left", "unique_id": "596ed5f8b9a21b7c6e4b0fb1c3e2dbe2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 4 shows the reported mean percentage absolute error (MAPE) for both models (our model and Accel-sim) with respect to the real hardware for each of the GPUs. We can see that our model is significantly more accurate than Accel-sim in all the evaluated"}], "lineHeight": 0}}, "target": {"markdown": "表 4 展示了针对每一款 GPU，两个模型（我们的模型与 Accel-sim）相对于真实硬件的所报告的平均绝对百分比误差（MAPE）。我们可以看到，在所有评估项中，我们的模型均显著优于 Accel-sim", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "edcc75937e94ddaf804782988ccde5c0", "index": 163, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "GPUs, and for the biggest GPU, the NVIDIA RTX A6000, the MAPE is less than half that of Accel-sim. Regarding the correlation, both models are very similar, but our model is slightly better.  \n\n", "text": "GPUs, and for the biggest GPU, the NVIDIA RTX A6000, the MAPE is less than half that of Accel-sim. Regarding the correlation, both models are very similar, but our model is slightly better.\n", "alignment": "left", "unique_id": "edcc75937e94ddaf804782988ccde5c0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs, and for the biggest GPU, the NVIDIA RTX A6000, the MAPE is less than half that of Accel-sim. Regarding the correlation, both models are very similar, but our model is slightly better."}], "lineHeight": 0}}, "target": {"markdown": "GPU，对于最大的 GPU（即 NVIDIA RTX A6000）而言，其 MAPE 不到 Accel-sim 的一半。在相关性方面，两个模型非常相似，但我们的模型略胜一筹。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "f672a12554a5022d632cdc0962b53e6c", "index": 164, "aliyun_index": 13, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![f672a12554a5022d632cdc0962b53e6c.jpeg](figures/f672a12554a5022d632cdc0962b53e6c_2f66b943.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式描述，准确保留所有视觉元素、标签、坐标轴、图例及趋势细节：\n\n---\n\n# 图表分析：误差随工作负载变化对比\n\n## 图表类型\n折线图（Line Chart）\n\n## 坐标轴定义\n\n- **X 轴**：`Workload`  \n  - 范围：0 到 140+（刻度标记为 0, 20, 40, 60, 80, 100, 120, 140）\n  - 单位：无明确单位，应为相对或归一化工作负载值\n\n- **Y 轴**：`Error (%)`  \n  - 范围：0 到 500+（刻度标记为 0, 100, 200, 300, 400, 500）\n  - 单位：百分比（%），表示误差率\n\n## 图例（Legend）\n\n位于左上角，包含两条曲线：\n\n- **蓝色实线** → `Accel-sim`\n- **绿色实线** → `Our paper`\n\n## 曲线行为描述\n\n### Accel-sim（蓝色线）\n- 在 Workload ∈ [0, ~120] 区间内，误差缓慢上升，始终低于 50%。\n- 从 Workload ≈ 120 开始，误差加速增长。\n- 在 Workload ≈ 135 时，误差约为 100%。\n- 在 Workload ≈ 140 时，误差急剧飙升至约 200%。\n- 在 Workload > 140（接近 145）时，误差突增至超过 500%，呈现指数级爆炸式增长。\n\n### Our paper（绿色线）\n- 在整个 Workload 范围内（0–145），误差始终保持极低水平。\n- 最大误差不超过 70%（在 Workload=145 处）。\n- 增长平缓，无明显拐点或突变。\n- 与 Accel-sim 相比，在高负载下表现显著更优。\n\n## 关键观察结论\n\n1. **低负载阶段（Workload < 100）**：\n   - 两种方法误差均接近于 0%，差异不明显。\n   \n2. **中高负载阶段（Workload ∈ [100, 130]）**：\n   - Accel-sim 误差开始明显高于 “Our paper”，但仍处于可控范围（< 100%）。\n   \n3. **高负载临界点（Workload > 130）**：\n   - Accel-sim 出现严重性能退化，误差呈非线性暴增。\n   - “Our paper” 仍保持稳定，误差增长温和，鲁棒性极强。\n\n4. **极端负载（Workload ≈ 145）**：\n   - Accel-sim 误差突破 500%，可能意味着模拟失效或数值溢出。\n   - “Our paper” 误差仅约 60–70%，具备实际可用性。\n\n## 可视化建议（如需复现）\n\n```python\nimport matplotlib.pyplot as plt\nimport numpy as np\n\n# 示例数据（基于图像估算）\nworkload = np.linspace(0, 145, 100)\naccel_sim_error = np.where(workload < 120, \n                           workload * 0.3, \n                           np.exp((workload - 120) * 0.15) * 50 + 30)\nour_paper_error = workload * 0.45  # 线性近似，最大值~65 at 145\n\nplt.figure(figsize=(8, 4))\nplt.plot(workload, accel_sim_error, label='Accel-sim', color='blue')\nplt.plot(workload, our_paper_error, label='Our paper', color='green')\nplt.xlabel('Workload', fontsize=12, fontweight='bold')\nplt.ylabel('Error (%)', fontsize=12, fontweight='bold')\nplt.title('Error vs Workload Comparison', fontsize=14)\nplt.legend(loc='upper left')\nplt.grid(True, alpha=0.3)\nplt.ylim(0, 550)\nplt.xlim(0, 150)\nplt.tight_layout()\nplt.show()\n```\n\n> 注：上述代码仅为示意，真实数据需从原始实验获取。图像中“Accel-sim”在末端陡峭上升部分建议使用分段函数或插值拟合以还原其非线性特征。\n\n---\n\n✅ 此 Markdown 文档完整保留了原图中的所有关键信息，包括坐标轴标签、图例、曲线趋势、数值范围和定性比较，适用于报告、论文附录或技术文档引用。", "alignment": "left", "unique_id": "f672a12554a5022d632cdc0962b53e6c", "edited": false, "extra": {}}, "target": {"markdown": "![f672a12554a5022d632cdc0962b53e6c.jpeg](figures/f672a12554a5022d632cdc0962b53e6c_2f66b943.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "27528ee4cc1728d7ea6ee62b21439786", "index": 165, "aliyun_index": 14, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 5: NVIDIA RTX A6000 percentage absolute error for each benchmark. Benchmarks are sorted by error in ascending order in each of the configurations.  \n\n", "text": "Figure 5: NVIDIA RTX A6000 percentage absolute error for each benchmark. Benchmarks are sorted by error in ascending order in each of the configurations.\n", "alignment": "left", "unique_id": "27528ee4cc1728d7ea6ee62b21439786", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5: NVIDIA RTX A6000 percentage absolute error for each benchmark. Benchmarks are sorted by error in ascending order in each of the configurations."}], "lineHeight": 0}}, "target": {"markdown": ">图 5：NVIDIA RTX A6000 在每个基准测试上的绝对百分比误差。在每种配置中，基准测试均按误差升序排列。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "ab228ba8aa4f0de8ece486fe28d25346", "index": 166, "aliyun_index": 15, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 5 shows the APE of both models for the NVIDIA RTX A6000 and each of the 143 benchmarks sorted in increasing error for each of the models. We can see that our model consistently has less absolute percentage error than Accel-sim for all applications, and the difference is quite significant for half of the applications. Moreover, we can observe that Accel-sim has an absolute percentage error greater or equal to 100% for 10 applications, and it reaches 543% in the worst case, whereas our model never has an absolute percentage error greater than 62%. If we look at the 90th percentile as an indication of the tail accuracy, Accel-sim absolute percentage error is 82.64%, whereas it is 31.47% for our model. This proves that our model is significantly more accurate and robust than the Accel-sim model.  \n\n", "text": "Figure 5 shows the APE of both models for the NVIDIA RTX A6000 and each of the 143 benchmarks sorted in increasing error for each of the models. We can see that our model consistently has less absolute percentage error than Accel-sim for all applications, and the difference is quite significant for half of the applications. Moreover, we can observe that Accel-sim has an absolute percentage error greater or equal to 100% for 10 applications, and it reaches 543% in the worst case, whereas our model never has an absolute percentage error greater than 62%. If we look at the 90th percentile as an indication of the tail accuracy, Accel-sim absolute percentage error is 82.64%, whereas it is 31.47% for our model. This proves that our model is significantly more accurate and robust than the Accel-sim model.\n", "alignment": "left", "unique_id": "ab228ba8aa4f0de8ece486fe28d25346", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5 shows the APE of both models for the NVIDIA RTX A6000 and each of the 143 benchmarks sorted in increasing error for each of the models. We can see that our model consistently has less absolute percentage error than Accel-sim for all applications, and the difference is quite significant for half of the applications. Moreover, we can observe that Accel-sim has an absolute percentage error greater or equal to 100% for 10 applications, and it reaches 543% in the worst case, whereas our model never has an absolute percentage error greater than 62%. If we look at the 90th percentile as an indication of the tail accuracy, Accel-sim absolute percentage error is 82.64%, whereas it is 31.47% for our model. This proves that our model is significantly more accurate and robust than the Accel-sim model."}], "lineHeight": 0}}, "target": {"markdown": "图 5 展示了针对 NVIDIA RTX A6000 以及每个模型的 143 个基准测试的 APE，并对每个模型按误差升序进行排序。我们可以看到，对于所有应用程序，我们的模型的绝对百分比误差始终小于 Accel-sim，并且对于一半的应用程序而言，这种差异相当显著。此外，我们可以观察到，Accel-sim 在 10 个应用程序上的绝对百分比误差大于或等于 100%，在最坏情况下甚至达到 543%，而我们的模型的最大绝对百分比误差从未超过 62%。如果以第 90 百分位数作为尾部准确性的衡量指标，Accel-sim 的绝对百分比误差为 82.64%，而我们的模型则为 31.47%。这证明我们的模型在准确性和鲁棒性方面均显著优于 Accel-sim 模型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "ab0e15977aceb1b9772395573ea1b6c6", "index": 167, "aliyun_index": 16, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "### 7.3 Sensitivity Analysis of Instruction Prefetching\n", "text": "7.3 Sensitivity Analysis of Instruction Prefetching\n", "alignment": "left", "unique_id": "ab0e15977aceb1b9772395573ea1b6c6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.3 Sensitivity Analysis of Instruction Prefetching"}], "lineHeight": 0}}, "target": {"markdown": "### 7.3 指令预取敏感性分析\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "daf4dac40483ac20fc7dfbde04f9b323", "index": 168, "aliyun_index": 17, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "The characteristics of the stream buffer instruction prefetcher have high impact on the global model accuracy. In this section, we analyze the error of different configurations, including disabling the prefetcher, having a perfect instruction cache, and a stream buffer prefetcher with sizes 1, 2, 4, 8, 16, and 32 entries. All the configurations are based on the NVIDIA RTX A6000. The MAPE for each configuration is shown in Table 5. We can see that the best accuracy is obtained with a stream buffer of size 16.  \n\n", "text": "The characteristics of the stream buffer instruction prefetcher have high impact on the global model accuracy. In this section, we analyze the error of different configurations, including disabling the prefetcher, having a perfect instruction cache, and a stream buffer prefetcher with sizes 1, 2, 4, 8, 16, and 32 entries. All the configurations are based on the NVIDIA RTX A6000. The MAPE for each configuration is shown in Table 5. We can see that the best accuracy is obtained with a stream buffer of size 16.\n", "alignment": "left", "unique_id": "daf4dac40483ac20fc7dfbde04f9b323", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The characteristics of the stream buffer instruction prefetcher have high impact on the global model accuracy. In this section, we analyze the error of different configurations, including disabling the prefetcher, having a perfect instruction cache, and a stream buffer prefetcher with sizes 1, 2, 4, 8, 16, and 32 entries. All the configurations are based on the NVIDIA RTX A6000. The MAPE for each configuration is shown in Table 5. We can see that the best accuracy is obtained with a stream buffer of size 16."}], "lineHeight": 0}}, "target": {"markdown": "流缓冲区指令预取器的特性对全局模型的准确性具有重要影响。在本节中，我们对不同配置下的误差进行分析，包括禁用预取器、采用理想的指令缓存，以及使用大小分别为 1、2、4、8、16 和 32 项的流缓冲区预取器。所有这些配置均基于 NVIDIA RTX A6000。表 5 展示了每种配置对应的 MAPE。我们可以看到，当流缓冲区大小为 16 时，可获得最佳的准确性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "0f3eb7be88e5c72378ad34ae79f87b9a", "index": 169, "aliyun_index": 18, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We can draw an additional conclusion from the speed-up results shown in Table 5: a straightforward prefetcher, such as a stream buffer, behaves close to a perfect instruction cache in GPUs. This is because the different warps in each sub-core usually execute the same code region and the code of typical GPGPUs applications do not have a complex control flow, so prefetching $N$ subsequent lines usually performs well. Note that since GPUs do not predict branches, it is not worth implementing a Fetch Directed Instruction prefetcher [76] because it would require the addition of a branch predictor.  \n\n", "text": "We can draw an additional conclusion from the speed-up results shown in Table 5: a straightforward prefetcher, such as a stream buffer, behaves close to a perfect instruction cache in GPUs. This is because the different warps in each sub-core usually execute the same code region and the code of typical GPGPUs applications do not have a complex control flow, so prefetching $N$ subsequent lines usually performs well. Note that since GPUs do not predict branches, it is not worth implementing a Fetch Directed Instruction prefetcher [76] because it would require the addition of a branch predictor.\n", "alignment": "left", "unique_id": "0f3eb7be88e5c72378ad34ae79f87b9a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We can draw an additional conclusion from the speed-up results shown in Table 5: a straightforward prefetcher, such as a stream buffer, behaves close to a perfect instruction cache in GPUs. This is because the different warps in each sub-core usually execute the same code region and the code of typical GPGPUs applications do not have a complex control flow, so prefetching $N$ subsequent lines usually performs well. Note that since GPUs do not predict branches, it is not worth implementing a Fetch Directed Instruction prefetcher [76] because it would require the addition of a branch predictor."}], "lineHeight": 0}}, "target": {"markdown": "从表 5 所示的加速结果中，我们可以得出另一个结论：在 GPU 中，像流缓冲区这样简单的预取器，其表现与理想的指令缓存非常接近。这是因为每个子核心中不同的 warp 通常执行相同的代码区域，并且典型的 GPGPU 应用程序的代码并不具有复杂的控制流，因此预取其后 $N$ 行通常就能取得良好的效果。需要注意的是，由于 GPU 不进行分支预测，因此实现 Fetch Directed Instruction 预取器 [76] 并不值得，因为这需要额外增加一个分支预测器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "504f49880605aa22206e5ddffa79bbd1", "index": 170, "aliyun_index": 19, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Regarding simulation accuracy, we conclude that when instruction cache enhancements are not under investigation, using a perfect instruction cache usually yields comparable accuracy with faster simulation speeds. However, for benchmarks where control flow is relevant—such as dwt2d [26], lud [26], or nw [26]—employing a perfect instruction cache or omitting stream buffers results in significant inaccuracies (more than 20% difference compared to a  \n\n", "text": "Regarding simulation accuracy, we conclude that when instruction cache enhancements are not under investigation, using a perfect instruction cache usually yields comparable accuracy with faster simulation speeds. However, for benchmarks where control flow is relevant—such as dwt2d [26], lud [26], or nw [26]—employing a perfect instruction cache or omitting stream buffers results in significant inaccuracies (more than 20% difference compared to a\n", "alignment": "left", "unique_id": "504f49880605aa22206e5ddffa79bbd1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding simulation accuracy, we conclude that when instruction cache enhancements are not under investigation, using a perfect instruction cache usually yields comparable accuracy with faster simulation speeds. However, for benchmarks where control flow is relevant—such as dwt2d [26], lud [26], or nw [26]—employing a perfect instruction cache or omitting stream buffers results in significant inaccuracies (more than 20% difference compared to a"}], "lineHeight": 0}}, "target": {"markdown": "关于模拟精度，我们得出的结论是：当指令缓存增强并非研究对象时，使用理想的指令缓存通常能在保持相近精度的同时获得更快的模拟速度。然而，对于那些控制流较为关键的基准测试（例如 dwt2d [26]、lud [26] 或 nw [26]），使用理想的指令缓存或省略流缓冲区会导致显著的精度偏差（与真实硬件相比差异超过 20%）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "6fc53136b17a57762bb2b6987a5392f1", "index": 171, "aliyun_index": 1, "page_num": 10, "type": "table", "sub_type": "none", "markdown": "|  | Ampere | Ampere | Ampere | Ampere | Turing |\n| --- | --- | --- | --- | --- | --- |\n|  | RTX 3080 | RTX 3080 Ti | RTX 3090 | RTX A6000 | RTX 2080 Ti |\n| Specifications | Specifications | Specifications | Specifications | Specifi un_index": 8, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "### 7.4 Sensitivity Analysis of the Register File Architecture\n", "text": "7.4 Sensitivity Analysis of the Register File Architecture\n", "alignment": "left", "unique_id": "b12b78349ede0db9cf27eac5ac2ba741", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.4 Sensitivity Analysis of the Register File"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Architecture"}], "lineHeight": -60}}, "target": {"markdown": "### 7.4 寄存器文件架构的敏感性分析\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 178}, {"source": {"block_id": "ec439cec8aec7a115c41eca393d86314", "index": 179, "aliyun_index": 9, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Table 6 illustrates how the presence of a register file cache and an increased number of register file read ports per bank affect simulation accuracy and performance. It also shows the results for an Ideal scenario where all operands can be retrieved in a single cycle. The average performance and accuracy across all benchmarks are similar for all configurations. However, a closer examination of specific benchmarks —such as the compute-bound *MaxFlops* (Accel-sim GPU Microbenchmark) [49] and Cutlass [71] configured with the *sgemm* parameter —reveals more nuanced behavior. Both benchmarks rely heavily on fixed-latency arithmetic instructions, which are particularly sensitive to stalls caused by register file access limitations because they typically use three operands per instruction.  \n\n", "text": "Table 6 illustrates how the presence of a register file cache and an increased number of register file read ports per bank affect simulation accuracy and performance. It also shows the results for an Ideal scenario where all operands can be retrieved in a single cycle. The average performance and accuracy across all benchmarks are similar for all configurations. However, a closer examination of specific benchmarks —such as the compute-bound *MaxFlops* (Accel-sim GPU Microbenchmark) [49] and Cutlass [71] configured with the *sgemm* parameter —reveals more nuanced behavior. Both benchmarks rely heavily on fixed-latency arithmetic instructions, which are particularly sensitive to stalls caused by register file access limitations because they typically use three operands per instruction.\n", "alignment": "left", "unique_id": "ec439cec8aec7a115c41eca393d86314", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 6 illustrates how the presence of a register file cache and an increased number of register file read ports per bank affect simulation accuracy and performance. It also shows the results for an Ideal scenario where all operands can be retrieved in a single cycle. The average performance and accuracy across all benchmarks are similar for all configurations. However, a closer examination of specific benchmarks —such as the compute-bound *MaxFlops* (Accel-sim GPU Microbenchmark) [49] and Cutlass [71] configured with the *sgemm* parameter —reveals more nuanced behavior. Both benchmarks rely heavily on fixed-latency arithmetic instructions, which are particularly sensitive to stalls caused by register file access limitations because they typically use three operands per instruction."}], "lineHeight": 0}}, "target": {"markdown": "表 6 展示了寄存器文件缓存的存在以及每个 bank 寄存器文件读端口数量的增加如何影响模拟的准确性和性能。表中还给出了 Ideal 场景的结果，在该场景下所有操作数均可在单个周期内被读取。所有配置在所有基准测试上的平均性能和准确性都较为接近。然而，更仔细地观察某些特定基准测试——例如计算密集型的 *MaxFlops*（Accel-sim GPU 微基准测试）[49] 以及使用 *sgemm* 参数配置的 Cutlass [71]——可以发现更为细致的行为差异。这两个基准测试都严重依赖于固定延迟的算术指令，而这些指令对寄存器文件访问受限所导致的停顿尤为敏感，因为它们每条指令通常需要三个操作数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 179}, {"source": {"block_id": "df1ccb2052a78fb9d7a02ff55b470639", "index": 180, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "For MaxFlops, performance is identical regardless of whether the RFC is present, since only one static instruction makes use of it. Notably, performance improves dramatically by approximately 44% when two read ports per register file bank are employed. This improvement is logical given that three operands per instruction are common and four read ports (two per bank) are sufficient to meet demand. In contrast, from a simulation accuracy perspective, the configuration of the two read ports exhibits a significant deviation.  \n\n", "text": "For MaxFlops, performance is identical regardless of whether the RFC is present, since only one static instruction makes use of it. Notably, performance improves dramatically by approximately 44% when two read ports per register file bank are employed. This improvement is logical given that three operands per instruction are common and four read ports (two per bank) are sufficient to meet demand. In contrast, from a simulation accuracy perspective, the configuration of the two read ports exhibits a significant deviation.\n", "alignment": "left", "unique_id": "df1ccb2052a78fb9d7a02ff55b470639", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For MaxFlops, performance is identical regardless of whether the RFC is present, since only one static instruction makes use of it. Notably, performance improves dramatically by approximately 44% when two read ports per register file bank are employed. This improvement is logical given that three operands per instruction are common and four read ports (two per bank) are sufficient to meet demand. In contrast, from a simulation accuracy perspective, the configuration of the two read ports exhibits a significant deviation."}], "lineHeight": 0}}, "target": {"markdown": "对于 MaxFlops，无论是否存在 RFC，其性能都完全相同，因为只有一条静态指令会用到它。值得注意的是，当每个寄存器文件 bank 采用两个读端口时，性能大幅提升约 44%。这一改进是合理的，因为每条指令通常需要三个操作数，而四个读端口（每个 bank 两个）足以满足需求。相比之下，从模拟准确性的角度来看，两个读端口的配置表现出了显著的偏差。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 180}, {"source": {"block_id": "087f70defafc965028651df81b32a75c", "index": 181, "aliyun_index": 11, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In the case of Cutlass with $sgemm$, a single-port configuration without a register file cache leads to a substantial performance degradation (0.78x). This performance drop is consistent with the observation that 35.9% of the static instructions in the program make use of the register file cache in at least one of their operands. However, introducing a register file with two read ports per bank yields a 12% performance improvement, which suggests that there is room for improvement in the organization of the register file and its cache.  \n\n", "text": "In the case of Cutlass with $sgemm$, a single-port configuration without a register file cache leads to a substantial performance degradation (0.78x). This performance drop is consistent with the observation that 35.9% of the static instructions in the program make use of the register file cache in at least one of their operands. However, introducing a register file with two read ports per bank yields a 12% performance improvement, which suggests that there is room for improvement in the organization of the register file and its cache.\n", "alignment": "left", "unique_id": "087f70defafc965028651df81b32a75c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the case of Cutlass with $sgemm$, a single-port configuration without a register file cache leads to a substantial performance degradation (0.78x). This performance drop is consistent with the observation that 35.9% of the static instructions in the program make use of the register file cache in at least one of their operands. However, introducing a register file with two read ports per bank yields a 12% performance improvement, which suggests that there is room for improvement in the organization of the register file and its cache."}], "lineHeight": 0}}, "target": {"markdown": "在使用 $sgemm$ 的 Cutlass 情况下，无寄存器文件缓存的单端口配置会导致显著的性能下降（0.78x）。这一性能下降与以下观察结果一致：程序中 35.9% 的静态指令在至少一个操作数上会使用寄存器文件缓存。然而，引入每个 bank 具有两个读端口的寄存器文件可带来 12% 的性能提升，这表明寄存器文件及其缓存的组织方式仍有改进空间。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 181}, {"source": {"block_id": "fb02469ed2157d129dc595db37798614", "index": 182, "aliyun_index": 12, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In summary, the register file architecture, including its cache, has an important effect on individual benchmarks, so its accurate model is important. A single port per bank plus a simple cache performs close to a register file with an unbounded number of ports on average, but for some individual benchmarks the gap is significant, which suggests that this may be an interesting area for research.  \n\n", "text": "In summary, the register file architecture, including its cache, has an important effect on individual benchmarks, so its accurate model is important. A single port per bank plus a simple cache performs close to a register file with an unbounded number of ports on average, but for some individual benchmarks the gap is significant, which suggests that this may be an interesting area for research.\n", "alignment": "left", "unique_id": "fb02469ed2157d129dc595db37798614", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In summary, the register file architecture, including its cache, has an important effect on individual benchmarks, so its accurate model is important. A single port per bank plus a simple cache performs close to a register file with an unbounded number of ports on average, but for some individual benchmarks the gap is significant, which suggests that this may be an interesting area for research."}], "lineHeight": 0}}, "target": {"markdown": "总之，寄存器文件架构（包括其缓存）对单个基准测试有重要影响，因此对其进行准确建模非常重要。每个 bank 单个端口加上一个简单缓存的配置，在平均性能上接近于具有无限数量端口的寄存器文件，但对于某些单个基准测试而言，二者之间仍存在显著差距，这表明该领域可能值得进一步研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 182}, {"source": {"block_id": "c6301b7526fa64c99dcdd66ce0700353", "index": 183, "aliyun_index": 13, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "### 7.5 Analyzing Dependence Management Mechanisms\n", "text": "7.5 Analyzing Dependence Management Mechanisms\n", "alignment": "left", "unique_id": "c6301b7526fa64c99dcdd66ce0700353", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.5 Analyzing Dependence Management"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Mechanisms"}], "lineHeight": -60}}, "target": {"markdown": "### 7.5 依赖管理机制分析\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 183}, {"source": {"block_id": "a49b1522a0aabe97c64f5c88ed6cb973", "index": 184, "aliyun_index": 14, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In this subsection, we analyze the impact on performance and the area of the software-hardware dependence handling mechanism explained in this paper and compare them with the traditional scoreboard method used by former GPUs. Table 7 shows the results for both metrics. Area overhead is reported relative to the area of the regular register file of an SM, which is 256 KB.  \n\n", "text": "In this subsection, we analyze the impact on performance and the area of the software-hardware dependence handling mechanism explained in this paper and compare them with the traditional scoreboard method used by former GPUs. Table 7 shows the results for both metrics. Area overhead is reported relative to the area of the regular register file of an SM, which is 256 KB.\n", "alignment": "left", "unique_id": "a49b1522a0aabe97c64f5c88ed6cb973", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this subsection, we analyze the impact on performance and the area of the software-hardware dependence handling mechanism explained in this paper and compare them with the traditional scoreboard method used by former GPUs. Table 7 shows the results for both metrics. Area overhead is reported relative to the area of the regular register file of an SM, which is 256 KB."}], "lineHeight": 0}}, "target": {"markdown": "在本小节中，我们分析了本文所述软硬件依赖处理机制对性能和面积的影响，并将其与前代 GP
