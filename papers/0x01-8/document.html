d and variable latency instructions, and its duty is to increase the Dependence counters or read the value of the clock counter if needed. This causes, as corroborated by our experiments, that an instruction that increases the Dependence counter and the instruction that waits until that Dependence counter is 0 requires at least one cycle in between to make visible that increase, so two consecutive instructions cannot use Dependence counters to avoid\n", "alignment": "left", "unique_id": "11b30a3ed6f65aa26832ea0931faeeee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As for the availability of read ports in the register file, the issue scheduler is unaware of whether the evaluated instructions have enough ports for reading without stalls in the following cycles. We have reached this conclusion after observing that the conflicts in the code shown in Listing 1 do not stall the issue of the second CLOCK if we remove the NOP between the last FFMA and the last CLOCK instruction. We performed a multitude of experiments to unveil the pipeline structure between issue and execute, and we could not find a model that perfectly fits all the experiments. However, the model that we describe below is correct for almost all the cases, so it is the model that we assume. In this model, fixed-latency instructions have two intermediate stages between the Issue stage and the stage(s) for reading source operands. The first stage, which we call Control, is common for fixed and variable latency instructions, and its duty is to increase the Dependence counters or read the value of the clock counter if needed. This causes, as corroborated by our experiments, that an instruction that increases the Dependence counter and the instruction that waits until that Dependence counter is 0 requires at least one cycle in between to make visible that increase, so two consecutive instructions cannot use Dependence counters to avoid"}], "lineHeight": 0}}, "target": {"markdown": "至于寄存器文件读端口的可用性，发射调度器并不知道被评估的指令在后续周期中是否拥有足够的端口来完成读取而不会产生停顿。我们在观察到 Listing 1 所示代码中的冲突情况后得出了这一结论：如果我们移除最后一条 FFMA 与最后一条 CLOCK 指令之间的 NOP，第二个 CLOCK 的发射并不会被阻塞。我们进行了大量实验来揭示发射与执行之间的流水线结构，但仍无法找到一个能完美契合所有实验结果的模型。不过，下文所描述的模型几乎适用于所有情况，因此这也是我们所采用的模型。在该模型中，定延迟指令在 Issue 阶段与源操作数读取阶段之间存在两个中间阶段。其中第一个阶段被称为控制阶段（Control），它对定延迟和变延迟指令都是公共的，其职责是按需递增依赖计数器（Dependence counters）或读取时钟计数器的值。正如我们的实验所验证的，这会导致一条用于递增依赖计数器的指令与一条等待该依赖计数器归零的指令之间至少需要间隔一个周期，才能使该递增操作可见。因此，两条连续指令无法仅通过依赖计数器来避免", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "d15dda069a552b1931e7a09b7a4f84cd", "index": 80, "aliyun_index": 6, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "data dependence hazards unless the first instruction sets the Yield\nbit or a Stall counter bigger than one.  \n\n", "text": "data dependence hazards unless the first instruction sets the Yield\nbit or a Stall counter bigger than one.\n", "alignment": "left", "unique_id": "d15dda069a552b1931e7a09b7a4f84cd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "data dependence hazards unless the first instruction sets the Yield"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "bit or a Stall counter bigger than one."}], "lineHeight": -52}}, "target": {"markdown": "数据依赖冒险，除非第一条指令设置了 Yield 位，或者使用了一个大于 1 的 Stall 计数器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "3d21a45b76cb3a1e41b596c7e4cff05d", "index": 81, "aliyun_index": 7, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The second stage only exists for fixed-latency instructions. In this stage, the availability of register file read ports is checked, and the instruction is stalled in this stage until it is guaranteed that it can proceed without any register file port conflict. We call this stage Allocate. More details about the register file read and write pipeline and its cache are provided in subsection 5.3.  \n\n", "text": "The second stage only exists for fixed-latency instructions. In this stage, the availability of register file read ports is checked, and the instruction is stalled in this stage until it is guaranteed that it can proceed without any register file port conflict. We call this stage Allocate. More details about the register file read and write pipeline and its cache are provided in subsection 5.3.\n", "alignment": "left", "unique_id": "3d21a45b76cb3a1e41b596c7e4cff05d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The second stage only exists for fixed-latency instructions. In this stage, the availability of register file read ports is checked, and the instruction is stalled in this stage until it is guaranteed that it can proceed without any register file port conflict. We call this stage Allocate. More details about the register file read and write pipeline and its cache are provided in subsection 5.3."}], "lineHeight": 0}}, "target": {"markdown": "第二个阶段仅对定延迟指令存在。在该阶段中，会对寄存器文件读端口的可用性进行检查，并且在该阶段中指令会被阻塞，直至能够确保其能够在不发生任何寄存器文件端口冲突的情况下继续执行。我们将该阶段称为分配阶段（Allocate）。关于寄存器文件读写流水线及其缓存的更多细节将在第 5.3 节中介绍。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "af2170afcd8e8ce37f568a145275bb45", "index": 82, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Variable-latency instructions (e.g., memory instructions) are delivered directly to a queue after going through the Control stage (without going through the Allocate stage). Instructions in this queue are allowed to proceed to the register file read pipeline when they are guaranteed not to have any conflict. Fixed-latency instructions are given priority over variable-latency instructions to allocate register file ports, as they need to be completed in a fixed number of cycles after issue to guarantee the correctness of the code, since dependencies are handled by software as described above.  \n\n", "text": "Variable-latency instructions (e.g., memory instructions) are delivered directly to a queue after going through the Control stage (without going through the Allocate stage). Instructions in this queue are allowed to proceed to the register file read pipeline when they are guaranteed not to have any conflict. Fixed-latency instructions are given priority over variable-latency instructions to allocate register file ports, as they need to be completed in a fixed number of cycles after issue to guarantee the correctness of the code, since dependencies are handled by software as described above.\n", "alignment": "left", "unique_id": "af2170afcd8e8ce37f568a145275bb45", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Variable-latency instructions (e.g., memory instructions) are delivered directly to a queue after going through the Control stage (without going through the Allocate stage). Instructions in this queue are allowed to proceed to the register file read pipeline when they are guaranteed not to have any conflict. Fixed-latency instructions are given priority over variable-latency instructions to allocate register file ports, as they need to be completed in a fixed number of cycles after issue to guarantee the correctness of the code, since dependencies are handled by software as described above."}], "lineHeight": 0}}, "target": {"markdown": "变延迟指令（例如访存指令）在经过控制阶段（Control stage）后会被直接送入一个队列，而不会经过分配阶段（Allocate stage）。当该队列中的指令被确保不会发生任何冲突时，它们才会被允许进入寄存器文件读取流水线。由于依赖关系是如上文所述由软件进行处理的，为了保证代码的正确性，定延迟指令必须在发射后以固定的周期数完成执行，因此相对于变延迟指令，定延迟指令在分配寄存器文件端口时具有优先权。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "f2c50844090d5b4cdffa08aba15918dd", "index": 83, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "5.1.2 *Scheduling Policy.* To discover the policy of the issue scheduler, we developed many different test cases involving multiple warps and recorded which warp was chosen for issue in each cycle by the issue scheduler. This information was gathered through instructions that allow to save the current CLOCK cycle of the GPU. However, as the hardware does not allow issuing two of these instructions consecutively, we employed a controlled number of other instructions in between (normally NOPs). We also varied the specific values in the *Yield* and the *Stall counter* control bits.  \n\n", "text": "5.1.2 *Scheduling Policy.* To discover the policy of the issue scheduler, we developed many different test cases involving multiple warps and recorded which warp was chosen for issue in each cycle by the issue scheduler. This information was gathered through instructions that allow to save the current CLOCK cycle of the GPU. However, as the hardware does not allow issuing two of these instructions consecutively, we employed a controlled number of other instructions in between (normally NOPs). We also varied the specific values in the *Yield* and the *Stall counter* control bits.\n", "alignment": "left", "unique_id": "f2c50844090d5b4cdffa08aba15918dd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1.2 *Scheduling Policy.* To discover the policy of the issue scheduler, we developed many different test cases involving multiple warps and recorded which warp was chosen for issue in each cycle by the issue scheduler. This information was gathered through instructions that allow to save the current CLOCK cycle of the GPU. However, as the hardware does not allow issuing two of these instructions consecutively, we employed a controlled number of other instructions in between (normally NOPs). We also varied the specific values in the *Yield* and the *Stall counter* control bits."}], "lineHeight": 0}}, "target": {"markdown": "为了探究发射调度器的调度策略，我们设计了许多涉及多个 warp 的不同测试用例，并记录每个周期中发射调度器所选中的用于发射的 warp。这些信息是通过那些能够保存 GPU 当前 CLOCK 周期值的指令来收集的。然而，由于硬件不允许连续发射两条此类指令，我们在其中插入了一定数量的其他指令（通常为 NOP）作为间隔。此外，我们还改变了 *Yield* 和 *Stall counter* 控制位中的具体取值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "b43ea863bc530aa42c4973bbd3df7eab", "index": 84, "aliyun_index": 10, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Our experiments allowed us to conclude that the warp scheduler uses a greedy policy that selects an instruction from the same warp if it meets the eligibility criteria described above. When switching to a different warp, the youngest one that meets the eligibility criteria is selected.  \n\n", "text": "Our experiments allowed us to conclude that the warp scheduler uses a greedy policy that selects an instruction from the same warp if it meets the eligibility criteria described above. When switching to a different warp, the youngest one that meets the eligibility criteria is selected.\n", "alignment": "left", "unique_id": "b43ea863bc530aa42c4973bbd3df7eab", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our experiments allowed us to conclude that the warp scheduler uses a greedy policy that selects an instruction from the same warp if it meets the eligibility criteria described above. When switching to a different warp, the youngest one that meets the eligibility criteria is selected."}], "lineHeight": 0}}, "target": {"markdown": "我们的实验使我们得出结论：warp 调度器采用一种贪心策略，即如果来自同一 warp 的某条指令满足上述的资格条件，则优先选择该指令。当需要切换到其他 warp 时，则会选择满足资格条件的最年轻的那个 warp。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "70f14300236adfb1e8cea47f1fe1447d", "index": 85, "aliyun_index": 11, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "This issue scheduler policy is illustrated with some examples\nof our experiments in Figure 4. This figure depicts the issue of\ninstructions when four warps are executed in the same sub-core for\nthree different cases. Each warp executes the same code composed\nof 32 independent instructions that can be issued one per cycle.  \n\n", "text": "This issue scheduler policy is illustrated with some examples\nof our experiments in Figure 4. This figure depicts the issue of\ninstructions when four warps are executed in the same sub-core for\nthree different cases. Each warp executes the same code composed\nof 32 independent instructions that can be issued one per cycle.\n", "alignment": "left", "unique_id": "70f14300236adfb1e8cea47f1fe1447d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This issue scheduler policy is illustrated with some examples"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of our experiments in Figure 4. This figure depicts the issue of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions when four warps are executed in the same sub-core for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "three different cases. Each warp executes the same code composed"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of 32 independent instructions that can be issued one per cycle."}], "lineHeight": -132}}, "target": {"markdown": "上述发射调度器策略在图 4 中通过我们的一些实验示例进行了说明。该图描绘了当四个 warp 在同一个 sub-core 中执行时，针对三种不同情况下的指令发射情况。每个 warp 执行相同的代码，该代码由 32 条相互独立的指令组成，每个周期可以发射一条指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "fe3d6d334d89fe200d1cfde846e0ebe8", "index": 86, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "In the first case, Figure 4 $\\textcircled{a}$, all Stall counters, Dependence masks and Yield bits are set to zero. The scheduler starts issuing instructions from the youngest warp, which is W3, until it misses in the Icache. As a result of the miss, W3 does not have any valid instruction, so the scheduler switches to issue instructions from W2. W2 hits in the Icache since it reuses the instructions brought by W3, and when it reaches the point where W3 missed, the miss has already been served, and all remaining instructions are found in the Icache, so the scheduler greedily issues that warp until the end. Later, the scheduler proceeds to issue instruction from W3 (the youngest warp) until the end, since now all instructions are present in the Icache. Then, the scheduler switches to issue instructions  \n\n", "text": "In the first case, Figure 4 $\\textcircled{a}$, all Stall counters, Dependence masks and Yield bits are set to zero. The scheduler starts issuing instructions from the youngest warp, which is W3, until it misses in the Icache. As a result of the miss, W3 does not have any valid instruction, so the scheduler switches to issue instructions from W2. W2 hits in the Icache since it reuses the instructions brought by W3, and when it reaches the point where W3 missed, the miss has already been served, and all remaining instructions are found in the Icache, so the scheduler greedily issues that warp until the end. Later, the scheduler proceeds to issue instruction from W3 (the youngest warp) until the end, since now all instructions are present in the Icache. Then, the scheduler switches to issue instructions\n", "alignment": "left", "unique_id": "fe3d6d334d89fe200d1cfde846e0ebe8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the first case, Figure 4 $\\textcircled{a}$, all Stall counters, Dependence masks and Yield bits are set to zero. The scheduler starts issuing instructions from the youngest warp, which is W3, until it misses in the Icache. As a result of the miss, W3 does not have any valid instruction, so the scheduler switches to issue instructions from W2. W2 hits in the Icache since it reuses the instructions brought by W3, and when it reaches the point where W3 missed, the miss has already been served, and all remaining instructions are found in the Icache, so the scheduler greedily issues that warp until the end. Later, the scheduler proceeds to issue instruction from W3 (the youngest warp) until the end, since now all instructions are present in the Icache. Then, the scheduler switches to issue instructions"}], "lineHeight": 0}}, "target": {"markdown": "在第一种情况（即图 4 $\\textcircled{a}$）中，所有 Stall 计数器、依赖性掩码（Dependence masks）以及 Yield 位均被置零。调度器从最年轻的 warp（即 W3）开始发射指令，直至在 Icache 中发生缺失（miss）。由于该缺失，W3 不再拥有任何有效指令，因此调度器转而从 W2 发射指令。W2 在 Icache 中能够命中，因为其所使用的指令是由 W3 预先取入的；当 W2 运行到 W3 发生缺失的位置时，该缺失已处理完毕，且剩余的所有指令均可在 Icache 中找到，于是调度器贪心地持续发射该 warp 的指令直至结束。随后，调度器继续从 W3（最年轻的 warp）发射指令直至结束，因为此时所有指令都已存在于 Icache 中。之后，调度器再切换到", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "17decf57b83899ea9b685bcf362e8e1c", "index": 87, "aliyun_index": 1, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![17decf57b83899ea9b685bcf362e8e1c.jpeg](figures/17decf57b83899ea9b685bcf362e8e1c_c48e87ac.png)  \n\n", "text": "[0–16]   : Warp W3     (blue)\n[16–48]  : Warp W2     (light yellow)\n[48–64]  : Warp W3     (blue)\n[64–96]  : Warp W1     (pink)\n[96–128] : Warp W0     (green)\n[128–140]: Idle / No active warp (gray vertical lines indicate cycle markers)\n\n[0–4]    : Warp W3     (blue)\n[4–8]    : Warp W2     (light yellow)\n[8–12]   : Warp W1     (pink)\n[12–36]  : Warp W3     (blue)\n[36–64]  : Warp W2     (light yellow)\n[64–96]  : Warp W1     (pink)\n[96–100] : Warp W0     (green)\n[100–104]: Idle        (gap)\n[104–132]: Warp W0     (green)\n[132–140]: Idle / No active warp (gray vertical lines)\n\n[0–4]    : Warp W3     (blue)\n[4–8]    : Warp W2     (light yellow)\n[8–32]   : Warp W3     (blue)\n[32–64]  : Warp W2     (light yellow)\n[64–68]  : Warp W1     (pink)\n[68–72]  : Warp W0     (green)\n[72–96]  : Warp W1     (pink)\n[96–128] : Warp W0     (green)\n[128–140]: Idle / No active warp (gray vertical lines)\n\n\n\n## Cycle Axis\n\n- X-axis labeled “Cycle”, ranging from **0 to 140**, with major ticks every **4 cycles** (0, 4, 8, ..., 140).\n- Minor gridlines at each integer cycle.\n- Gray vertical lines beyond cycle 128 indicate idle or unassigned cycles for some thread groups.\n\n## Notes\n\n- Each row (@a, @b, @c) represents a different thread group or execution context.\n- Warps are scheduled non-overlappingly within each thread group — only one warp is active per cycle per group.\n- Gaps between colored blocks represent idle periods where no warp is executing in that thread group.\n- The green block (Warp W0) appears last in all three sequences, suggesting it may be dependent on prior warps or has lower priority.\n- In @b and @c, there are gaps before the final Warp W0 segment, indicating potential synchronization or resource contention delays.\n\n---\n\n✅ This Markdown representation preserves:\n- All warp assignments per cycle range\n- Color coding via legend\n- Cycle axis scale and granularity\n- Structural layout of three thread groups (@a, @b, @c)\n- Observations about idle periods and scheduling patterns\n\nNo information from the original image is omitted or altered.", "alignment": "left", "unique_id": "17decf57b83899ea9b685bcf362e8e1c", "edited": false, "extra": {}}, "target": {"markdown": "![17decf57b83899ea9b685bcf362e8e1c.jpeg](figures/17decf57b83899ea9b685bcf362e8e1c_c48e87ac.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 87}, {"source": {"block_id": "0ed79d5dced554cde2ce98eab65d4c7d", "index": 88, "aliyun_index": 2, "page_num": 5, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 4: Timelines of the issue of instructions from four different warps.  \n\n", "text": "Figure 4: Timelines of the issue of instructions from four different warps.\n", "alignment": "left", "unique_id": "0ed79d5dced554cde2ce98eab65d4c7d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 4: Timelines of the issue of instructions from four different warps."}], "lineHeight": 0}}, "target": {"markdown": ">图 4：来自四个不同 warp 的指令发射时序图。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "b3d1748c44f4d10063dde802f79c6b0c", "index": 89, "aliyun_index": 3, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "from W1 from beginning to end, and finally, it does the same for\nW0 (the oldest warp).  \n\n", "text": "from W1 from beginning to end, and finally, it does the same for\nW0 (the oldest warp).\n", "alignment": "left", "unique_id": "b3d1748c44f4d10063dde802f79c6b0c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from W1 from beginning to end, and finally, it does the same for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "W0 (the oldest warp)."}], "lineHeight": -52}}, "target": {"markdown": "从 W1 的开头至末尾发射指令，最后再对 W0（最老的 warp）执行相同的操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "f53c042923bed5c335f5ff57715f4fbc", "index": 90, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Figure 4 ⑥ shows the timeline of when instructions are issued when the second instruction of each warp sets its Stall counter to four. We can observe that the scheduler swaps from W3 to W2 after two cycles, to W1 after another two cycles, and then back to W3 after another two cycles (since W3 Stall counter has become zero). Once W3, W2, and W1 have finished, the scheduler starts issuing from W0. After issuing the second instruction of W0, the scheduler generates four bubbles because it has no other warp to hide the latency imposed by the Stall counter.  \n\n", "text": "Figure 4 ⑥ shows the timeline of when instructions are issued when the second instruction of each warp sets its Stall counter to four. We can observe that the scheduler swaps from W3 to W2 after two cycles, to W1 after another two cycles, and then back to W3 after another two cycles (since W3 Stall counter has become zero). Once W3, W2, and W1 have finished, the scheduler starts issuing from W0. After issuing the second instruction of W0, the scheduler generates four bubbles because it has no other warp to hide the latency imposed by the Stall counter.\n", "alignment": "left", "unique_id": "f53c042923bed5c335f5ff57715f4fbc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 4 ⑥ shows the timeline of when instructions are issued when the second instruction of each warp sets its Stall counter to four. We can observe that the scheduler swaps from W3 to W2 after two cycles, to W1 after another two cycles, and then back to W3 after another two cycles (since W3 Stall counter has become zero). Once W3, W2, and W1 have finished, the scheduler starts issuing from W0. After issuing the second instruction of W0, the scheduler generates four bubbles because it has no other warp to hide the latency imposed by the Stall counter."}], "lineHeight": 0}}, "target": {"markdown": "图 4 ⑥ 展示了当每个 warp 的第二条指令将其 Stall 计数器设置为 4 时的指令发射时序。我们可以观察到，调度器在经过两个周期后从 W3 切换到 W2，再经过两个周期后切换到 W1，再经过两个周期后又切回 W3（因为此时 W3 的 Stall 计数器已归零）。当 W3、W2 和 W1 都执行完毕后，调度器开始从 W0 发射指令。在发射完 W0 的第二条指令之后，由于没有其他 warp 来隐藏该 Stall 计数器所带来的延迟，调度器产生了四个气泡（bubble）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 90}, {"source": {"block_id": "c6d09148f907fc38712222843be34651", "index": 91, "aliyun_index": 5, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Figure 4 © shows the scheduler's behavior when Yield is set in the second instruction of each warp. We can see that the scheduler switches to the youngest among the rest of the warps after issuing the second instruction of each warp. For instance, W3 switches to W2, and W2 switches back to W3. We also tested a scenario where Yield is set and no more warps are available (not shown in this figure), and we observed that the scheduler generates a bubble of one cycle.  \n\n", "text": "Figure 4 © shows the scheduler's behavior when Yield is set in the second instruction of each warp. We can see that the scheduler switches to the youngest among the rest of the warps after issuing the second instruction of each warp. For instance, W3 switches to W2, and W2 switches back to W3. We also tested a scenario where Yield is set and no more warps are available (not shown in this figure), and we observed that the scheduler generates a bubble of one cycle.\n", "alignment": "left", "unique_id": "c6d09148f907fc38712222843be34651", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 4 © shows the scheduler's behavior when Yield is set in the second instruction of each warp. We can see that the scheduler switches to lse, "fontSize": 0, "bold": false, "italic": false}, "text": "by means of the control bits: Stall counter, Yield and Depencece"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "counters."}], "lineHeight": -102}}, "target": {"markdown": "我们将该发射调度器策略称为编译器引导的贪心优先最年轻策略（Compiler Guided Greedy Then Youngest, CGGTY），因为编译器通过控制位（即 Stall 计数器、Yield 以及依赖性计数器）来协助调度器进行决策。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 92}, {"source": {"block_id": "d84634364e15cb6d9dd1c61cb8af1476", "index": 93, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "However, we have only confirmed this behavior for warps within\nthe same CTA, as we have not yet devised a reliable methodology\nto analyze interactions among warps from different CTAs.  \n\n", "text": "However, we have only confirmed this behavior for warps within\nthe same CTA, as we have not yet devised a reliable methodology\nto analyze interactions among warps from different CTAs.\n", "alignment": "left", "unique_id": "d84634364e15cb6d9dd1c61cb8af1476", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "However, we have only confirmed this behavior for warps within"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the same CTA, as we have not yet devised a reliable methodology"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to analyze interactions among warps from different CTAs."}], "lineHeight": -79}}, "target": {"markdown": "然而，上述行为目前仅在同一 CTA 内部的 warp 之间得到了验证，因为我们尚未设计出一种可靠的方法来分析来自不同 CTA 的 warp 之间的交互行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 93}, {"source": {"block_id": "5176fb552f3da900a0497c0b001db644", "index": 94, "aliyun_index": 8, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "### 5.2 Front-end\n", "text": "5.2 Front-end\n", "alignment": "left", "unique_id": "5176fb552f3da900a0497c0b001db644", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.2 Front-end"}], "lineHeight": 0}}, "target": {"markdown": "### 5.2 前端（Front-end）\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 94}, {"source": {"block_id": "31beea87b9159664fc7ac9819e1e60b2", "index": 95, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "According to diagrams in multiple NVIDIA documents [20, 28, 65–69], SMs have four different sub-cores and warps are evenly distributed among sub-cores in a round robin manner (i.e., warp ID %4) [43, 44]. Each sub-core has a private L0 instruction cache that is connected to an L1 instruction cache that is shared among all four sub-cores of the SM. We assume there is an arbiter for dealing with the multiple requests of different sub-cores.  \n\n", "text": "According to diagrams in multiple NVIDIA documents [20, 28, 65–69], SMs have four different sub-cores and warps are evenly distributed among sub-cores in a round robin manner (i.e., warp ID %4) [43, 44]. Each sub-core has a private L0 instruction cache that is connected to an L1 instruction cache that is shared among all four sub-cores of the SM. We assume there is an arbiter for dealing with the multiple requests of different sub-cores.\n", "alignment": "left", "unique_id": "31beea87b9159664fc7ac9819e1e60b2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "According to diagrams in multiple NVIDIA documents [20, 28, 65–69], SMs have four different sub-cores and warps are evenly distributed among sub-cores in a round robin manner (i.e., warp ID %4) [43, 44]. Each sub-core has a private L0 instruction cache that is connected to an L1 instruction cache that is shared among all four sub-cores of the SM. We assume there is an arbiter for dealing with the multiple requests of different sub-cores."}], "lineHeight": 0}}, "target": {"markdown": "根据多份 NVIDIA 文档 [20, 28, 65–69] 中的图示可知，SM 包含四个不同的 sub-core，并且 warp 以轮询（round robin）的方式（即 warp ID %4）均匀分布在各个 sub-core 之间 [43, 44]。每个 sub-core 都拥有一个私有的 L0 指令缓存（Icache），该缓存连接到一个由该 SM 全部四个 sub-core 共享的 L1 指令缓存。我们假设存在一个仲裁器（arbiter）来处理来自不同 sub-core 的多个访问请求。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 95}, {"source": {"block_id": "3c176ed042526844c3a8fc8ce3046e3f", "index": 96, "aliyun_index": 10, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Each L0 Icache has an instruction prefetcher [60]. Our experiments corroborate previous studies by Cao et al. [24] that demonstrated that instruction prefetching is effective in GPUs. Although we have not been able to confirm the concrete design used in NVIDIA GPUs, we suspect it is a simple scheme like a stream buffer [47] that prefetches successive memory blocks when a miss occurs. We assume that the stream buffer size is 16 based on our analysis, as detailed in subsection 7.3.  \n\n", "text": "Each L0 Icache has an instruction n in the Instruction  \n\n", "text": "We could not confirm the exact instruction fetch policy with our experiments, but it has to be similar to the issue policy; otherwise, the condition of not finding a valid instruction in the Instruction\n", "alignment": "left", "unique_id": "47cf6ddab15c4648a05ba6a3119df84c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We could not confirm the exact instruction fetch policy with our experiments, but it has to be similar to the issue policy; otherwise, the condition of not finding a valid instruction in the Instruction"}], "lineHeight": 0}}, "target": {"markdown": "我们未能通过实验确认精确的指令获取（fetch）策略，但该策略必然与发射（issue）策略类似；否则，当在指令中无法找到有效指令时，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "f415e3bf35fa42adbee7ecfec27442d5", "index": 98, "aliyun_index": 12, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Buffer would happen relatively often, and we have not observed this in our experiments. Based on that, we assume that each sub-core can fetch and decode one instruction per cycle. The fetch scheduler tries to fetch an instruction from the same warp that has been issued in the previous cycle (or the latest cycle in which an instruction was issued) unless it detects that the number of instructions already in the Instruction Buffer plus its in-flight fetches are equal to the Instruction Buffer size. In this case, it switches to the youngest warp with free entries in its Instruction Buffer. We assume an Instruction Buffer with three entries per warp since this is enough to support the greedy nature given that there are two pipeline stages from fetch to issue. Were the Instruction Buffer of size two, the Greedy policy of the issue scheduler would fail. For example, assume a scenario in which the Instruction Buffer has a size of two and all the requests hit in the Icache, all warps have their Instruction Buffer full, and in cycle 1, a sub-core is issuing instructions from warp W1 and fetching from W0. In cycle 2, the second instruction of W1 will be issued, and the third instruction will be fetched. In cycle 3, W1 will have no instructions in its Instruction Buffer because instruction 3 is still in the decode. Therefore, its greedy behavior would fail, and it would have to switch to issue from another warp. Note that this would not happen in case of having three entries in the Instruction Buffer, as corroborated by our experiments. Note that most previous designs in the literature normally assume a fetch and decode width of two instructions and an Instruction Buffer of two entries per warp. In addition, those designs only fetch instructions when the Instruction Buffer is empty. Thus, the greedy warp always changes at least after two consecutive instructions, which does not match our experimental observations.  \n\n", "text": "Buffer would happen relatively often, and we have not observed this in our experiments. Based on that, we assume that each sub-core can fetch and decode one instruction per cycle. The fetch scheduler tries to fetch an instruction from the same warp that has been issued in the previous cycle (or the latest cycle in which an instruction was issued) unless it detects that the number of instructions already in the Instruction Buffer plus its in-flight fetches are equal to the Instruction Buffer size. In this case, it switches to the youngest warp with free entries in its Instruction Buffer. We assume an Instruction Buffer with three entries per warp since this is enough to support the greedy nature given that there are two pipeline stages from fetch to issue. Were the Instruction Buffer of size two, the Greedy policy of the issue scheduler would fail. For example, assume a scenario in which the Instruction Buffer has a size of two and all the requests hit in the Icache, all warps have their Instruction Buffer full, and in cycle 1, a sub-core is issuing instructions from warp W1 and fetching from W0. In cycle 2, the second instruction of W1 will be issued, and the third instruction will be fetched. In cycle 3, W1 will have no instructions in its Instruction Buffer because instruction 3 is still in the decode. Therefore, its greedy behavior would fail, and it would have to switch to issue from another warp. Note that this would not happen in case of having three entries in the Instruction Buffer, as corroborated by our experiments. Note that most previous designs in the literature normally assume a fetch and decode width of two instructions and an Instruction Buffer of two entries per warp. In addition, those designs only fetch instructions when the Instruction Buffer is empty. Thus, the greedy warp always changes at least after two consecutive instructions, which does not match our experimental observations.\n", "alignment": "left", "unique_id": "f415e3bf35fa42adbee7ecfec27442d5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Buffer would happen relatively often, and we have not observed this in our experiments. Based on that, we assume that each sub-core can fetch and decode one instruction per cycle. The fetch scheduler tries to fetch an instruction from the same warp that has been issued in the previous cycle (or the latest cycle in which an instruction was issued) unless it detects that the number of instructions already in the Instruction Buffer plus its in-flight fetches are equal to the Instruction Buffer size. In this case, it switches to the youngest warp with free entries in its Instruction Buffer. We assume an Instruction Buffer with three entries per warp since this is enough to support the greedy nature given that there are two pipeline stages from fetch to issue. Were the Instruction Buffer of size two, the Greedy policy of the issue scheduler would fail. For example, assume a scenario in which the Instruction Buffer has a size of two and all the requests hit in the Icache, all warps have their Instruction Buffer full, and in cycle 1, a sub-core is issuing instructions from warp W1 and fetching from W0. In cycle 2, the second instruction of W1 will be issued, and the third instruction will be fetched. In cycle 3, W1 will have no instructions in its Instruction Buffer because instruction 3 is still in the decode. Therefore, its greedy behavior would fail, and it would have to switch to issue from another warp. Note that this would not happen in case of having three entries in the Instruction Buffer, as corroborated by our experiments. Note that most previous designs in the literature normally assume a fetch and decode width of two instructions and an Instruction Buffer of two entries per warp. In addition, those designs only fetch instructions when the Instruction Buffer is empty. Thus, the greedy warp always changes at least after two consecutive instructions, which does not match our experimental observations."}], "lineHeight": 0}}, "target": {"markdown": "缓冲区中找不到有效指令的情况将会频繁发生，而我们在实验中并未观察到这种现象。基于此，我们假设每个 sub-core 每周期可以获取并解码一条指令。获取调度器会尝试从上一个周期（即最近一次有指令被发射的周期）所发射的那个 warp 中继续获取指令，除非它检测到该 warp 的指令缓冲区中已有的指令数加上正在获取（in-flight）中的指令数已经等于指令缓冲区的大小。在这种情况下，调度器会切换到指令缓冲区仍有空闲条目的最年轻的 warp。我们假设每个 warp 的指令缓冲区（Instruction Buffer）容量为 3 条指令，因为考虑到从获取到发射之间存在两个流水线阶段，3 条条目足以支持其贪心特性。如果指令缓冲区容量为 2 条，则发射调度器的贪心策略（Greedy policy）将会失效。例如，假设指令缓冲区容量为 2，且所有请求都命中 Icache，所有 warp 的指令缓冲区均已存满；在第 1 周期，sub-core 正在从 W1 发射指令，并从 W0 获取指令。在第 2 周期，W1 的第二条指令将被发射，第三条指令将被获取。在第 3 周期，由于第三条指令仍处于解码阶段，W1 的指令缓冲区中将没有可用指令。因此，其贪心行为将会失效，不得不切换到从其他 warp 发射指令。需要注意的是，正如我们的实验所印证的那样，如果指令缓冲区容量为 3 条，则不会出现这种情况。此外值得注意的是，文献中大多数先前的设计通常假设获取和解码宽度为 2 条指令，且每个 warp 的指令缓冲区 splay_order": 102}, {"source": {"block_id": "c45e1a36de0e3efefac76dd7a640dc23", "index": 103, "aliyun_index": 1, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "registers used per warp, the fewer warps can run parallel\nin the SM.  \n\n", "text": "registers used per warp, the fewer warps can run parallel\nin the SM.\n", "alignment": "left", "unique_id": "c45e1a36de0e3efefac76dd7a640dc23", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "registers used per warp, the fewer warps can run parallel"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in the SM."}], "lineHeight": -50}}, "target": {"markdown": "每个 warp 使用的寄存器越多，SM 中能够并行运行的 warp 数量就越少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 103}, {"source": {"block_id": "b68cc715968e106fcd8dc28479431b32", "index": 104, "aliyun_index": 2, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "• **Uniform:** Each warp has 64 private, 32-bit registers that store values shared by all the threads of the warp [43].  \n\n", "text": "• **Uniform:** Each warp has 64 private, 32-bit registers that store values shared by all the threads of the warp [43].\n", "alignment": "left", "unique_id": "b68cc715968e106fcd8dc28479431b32", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• **Uniform:** Each warp has 64 private, 32-bit registers that store values shared by all the threads of the warp [43]."}], "lineHeight": 0}}, "target": {"markdown" a06cdb632ba627e08ddefc1b", "index": 106, "aliyun_index": 4, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "• **Uniform Predicate:** Each warp has eight 1-bit registers that store a predicate shared by all the treads in the warp.  \n\n", "text": "• **Uniform Predicate:** Each warp has eight 1-bit registers that store a predicate shared by all the treads in the warp.\n", "alignment": "left", "unique_id": "f5e15fcda06cdb632ba627e08ddefc1b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• **Uniform Predicate:** Each warp has eight 1-bit registers that store a predicate shared by all the treads in the warp."}], "lineHeight": 0}}, "target": {"markdown": "• **统一预测寄存器（Uniform Predicate）：** 每个 warp 拥有 8 个 1 位寄存器，用于存储该 warp 内所有线程共享的一个谓词。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 106}, {"source": {"block_id": "a0f189d23e6cc276f88192731d09b231", "index": 107, "aliyun_index": 5, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "• **SB Registers:** As described in section 4, each warp has six registers, called *Dependence counters*, that are used to track variable-latency dependencies.  \n\n", "text": "• **SB Registers:** As described in section 4, each warp has six registers, called *Dependence counters*, that are used to track variable-latency dependencies.\n", "alignment": "left", "unique_id": "a0f189d23e6cc276f88192731d09b231", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• **SB Registers:** As described in section 4, each warp has six registers, called *Dependence counters*, that are used to track variable-latency dependencies."}], "lineHeight": 0}}, "target": {"markdown": "• **SB 寄存器（SB Registers）：** 如第 4 节所述，每个 warp 拥有 6 个寄存器，称为*依赖计数器（Dependence counters）*，用于追踪变长延迟依赖关系。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 107}, {"source": {"block_id": "61f1e1f91a02aba443c3d35a4fb30659", "index": 108, "aliyun_index": 6, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "• **B Registers:** Each warp has at least 16 B registers for managing control flow re-convergence [79].  \n\n", "text": "• **B Registers:** Each warp has at least 16 B registers for managing control flow re-convergence [79].\n", "alignment": "left", "unique_id": "61f1e1f91a02aba443c3d35a4fb30659", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• **B Registers:** Each warp has at least 16 B registers for managing control flow re-convergence [79]."}], "lineHeight": 0}}, "target": {"markdown": "• **B 寄存器（B Registers）：** 每个 warp 至少拥有 16 个 B 寄存器，用于管理控制流的再汇聚（re-convergence）[79]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "eef2e693891a9af7c0c1341103407431", "index": 109, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "• **Special Registers:** Various other registers are used to store special values, such as the thread or block IDs.  \n\n", "text": "• **Special Registers:** Various other registers are used to store special values, such as the thread or block IDs.\n", "alignment": "left", "unique_id": "eef2e693891a9af7c0c1341103407431", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• **Special Registers:** Various other registers are used to store special values, such as the thread or block IDs."}], "lineHeight": 0}}, "target": {"markdown": "• **特殊寄存器（Special Registers）：** 还有多种其他寄存器用于存储特殊值，例如线程 ID 或块 ID。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "9648e6a78c29cb3b18f4ecb53ea4736f", "index": 110, "aliyun_index": 8, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Unlike previous works [1, 18, 49] that assume the presence of an operand collector to deal with conflicts in the register file ports, modern NVIDIA GPUs do not make use of it. Operand collector units would introduce variability in the elapsed time between issue and write-back, making it impossible to have fixed-latency instructions for the NVIDIA ISA, whose latency must be known at compile time to handle dependencies correctly as explained section 4. We have confirmed the absence of operand collectors by checking the correctness of specific producer-consumer sequences of instructions when varying the number of operands that go to the same bank. We observed that regardless of the number of register file port conflicts, the value required in the *Stall counter* field of instructions to avoid data hazards and the elapsed time to execute the instruction remains constant.  \n\n", "text": "Unlike previous works [1, 18, 49] that assume the presence of an operand collector to deal with conflicts in the register file ports, modern NVIDIA GPUs do not make use of it. Operand collector units would introduce variability in the elapsed time between issue and write-back, making it impossible to have fixed-latency instructions for the NVIDIA ISA, whose latency must be known at compile time to handle dependencies correctly as explained section 4. We have confirmed the absence of operand collectors by checking the correctness of specific producer-consumer sequences of instructions when varying the number of operands that go to the same bank. We observed that regardless of the number of register file port conflicts, the value required in the *Stall counter* field of instructions to avoid data hazards and the elapsed time to execute the instruction remains constant.\n", "alignment": "left", "unique_id": "9648e6a78c29cb3b18f4ecb53ea4736f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Unlike previous works [1, 18, 49] that assume the presence of an operand collector to deal with conflicts in the register file ports, modern NVIDIA GPUs do not make use of it. Operand collector units would introduce variability in the elapsed time between issue and write-back, making it impossible to have fixed-latency instructions for the NVIDIA ISA, whose latency must be known at compile time to handle dependencies correctly as explained section 4. We have confirmed the absence of operand collectors by checking the correctness of specific producer-consumer sequences of instructions when varying the number of operands that go to the same bank. We observed that regardless of the number of register file port conflicts, the value required in the *Stall counter* field of instructions to avoid data hazards and the elapsed time to execute the instruction remains constant."}], "lineHeight": 0}}, "target": {"markdown": "与先前假设存在操作数收集器（operand collector）以处理寄存器文件端口冲突的工作 [1, 18, 49] 不同，现代 NVIDIA GPU 并不使用它。操作数收集器单元会在发射（issue）与写回（write-back）之间引入耗时的不确定性，从而无法为 NVIDIA ISA 提供固定延迟的指令；而如第 4 节所述，NVIDIA ISA 的指令延迟必须在编译时已知，以便正确处理依赖关系。我们通过在改变送往同一 bank 的操作数数量时，检查特定生产者-消费者指令序列的正确性，证实了操作数收集器的缺失。我们观察到，无论寄存器文件端口冲突的数量如何，指令中为避免数据冒险（data hazard）而在 *Stall counter* 字段所设置的值以及执行该指令所耗费的时间均保持不变。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "6ffd3a946245fb8413d591563f525184", "index": 111, "aliyun_index": 9, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Our experiments revealed that each register file bank has a dedicated write port of 1024 bits. Besides, when a load instruction and a fixed-latency instruction finish at the same cycle, the one that is delayed one cycle is the load instruction. On the other hand, when there is a conflict between two fixed latency instructions, for instance, a IADD3 followed by an IMAD that uses the same destination bank, none of them is delayed. This implies the use of a result queue like the one introduced in Fermi [61] for fixed-latency instructions. The consumers of these instructions are not delayed, which implies the use of bypassing to forward the results to the consumer before being written in the register file.  \n\n", "text": "Our experiments revealed that each register file bank has a dedicated write port of 1024 bits. Besides, when a load instruction and a fixed-latency instruction finish at the same cycle, the one that is delayed one cycle is the load instruction. On the other hand, when there is a conflict between two fixed latency instructions, for instance, a IADD3 followed by an IMAD that uses the same destination bank, none of them is delayed. This implies the use of a result queue like the one introduced in Fermi [61] for fixed-latency instructions. The consumers of these instructions are not delayed, which implies the use of bypassing to forward the results to the consumer before being written in the register file.\n", "alignment": "left", "unique_id": "6ffd3a946245fb8413d591563f525184", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our experiments revealed that each register file bank has a dedicated write port of 1024 bits. Besides, when a load instruction and a fixed-latency instruction finish at the same cycle, the one that is delayed one cycle is the load instruction. On the other hand, when there is a conflict between two fixed latency instructions, for instance, a IADD3 followed by an IMAD that uses the same destination bank, none of them is delayed. This implies the use of a result queue like the one introduced in Fermi [61] for fixed-latency instructions. The consumers of these instructions are not delayed, which implies the use of bypassing to forward the results to the consumer before being written in the register file."}], "lineHeight": 0}}, "target": {"markdown": "我们的实验表明，每个寄存器文件 bank 都配备了一个专用的 1024 位写端口。此外，当一条 load 指令与一条固定延迟指令在同一周期结束时，被延迟一个周期的是 load 指令。另一方面，当两条固定延迟指令之间发生冲突时（例如一条 IADD3 之后跟一条使用相同目标 bank 的 IMAD），两条指令都不会被延迟。这表明针对固定延迟指令使用了类似 Fermi [61] 中所引入的结果队列（result queue）。这些指令的消费者不会被延迟，这意味着采用了旁路（bypassing）机制，在结果被写入寄存器文件之前就将其转发给消费者。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "cc44a93be8fcecfe3ef6de37e62843a6", "index": 112, "aliyun_index": 10, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Regarding reads, we have observed a bandwidth of 1024 bits per bank. The measurements were obtained through various tests that recorded the elapsed time of consecutive FADD, FMUL, and FFMA instructions $^{1}$. For instance, FMUL instructions with both source operands in the same bank create a 1-cycle bubble, whereas if the two operands are in different banks, there is no bubble. FFMA instructions with all three source operands in the same bank generate a 2-cycle bubble.  \n\n", "text": "Regarding reads, we have observed a bandwidth of 1024 bits per bank. The measurements were obtained through various tests that recorded the elapsed time of consecutive FADD, FMUL, and FFMA instructions $^{1}$. For instance, FMUL instructions with both source operands in the same bank create a 1-cycle bubble, whereas if the two operands are in different banks, there is no bubble. FFMA instructions with all three source operands in the same bank generate a 2-cycle bubble.\n", "alignment": "left", "unique_id": "cc44a93be8fcecfe3ef6de37e62843a6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Regarding reads, we have observed a bandwidth of 1024 bits per bank. The measurements were obtained through various tests that recorded the elapsed time of consecutive FADD, FMUL, and FFMA instructions $^{1}$. For instance, FMUL instructions with both source operands in the same bank create a 1-cycle bubble, whereas if the two operands are in different banks, there is no bubble. FFMA instructions with all three source operands in the same bank generate a 2-cycle bubble."}], "lineHeight": 0}}, "target": {"markdown": "关于读取操作，我们观察到每个 bank 的读取带宽为 1024 位。这些测量数据是通过多种测试获得的，这些测试记录了连续 FADD、FMUL 和 FFMA 指令 $^{1}$ 的耗时。例如，当 FMUL 指令的两个源操作数位于同一 bank 时，会产生 1 个周期的气泡（bubble）；而当两个操作数位于不同 bank 时，则不会出现气泡。当 FFMA 指令的三个源操作数全部位于同一 bank 时，会产生 2 个周期的气泡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "089cc6295d8111d00e3929eeca493965", "index": 113, "aliyun_index": 11, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Unfortunately, we could not find a read policy that matches all\nthe cases we have studied, as we observed that the generation of  \n\n", "text": "Unfortunately, we could not find a read policy that matches all\nthe cases we have studied, as we observed that the generation of\n", "alignment": "left", "unique_id": "089cc6295d8111d00e3929eeca493965", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Unfortunately, we could not find a read policy that matches all"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the cases we have studied, as we observed that the generation of"}], "lineHeight": -54}}, "target": {"markdown": "遗憾的是，我们未能找到一种读取策略能够匹配我们所研究的所有情形，因为我们观察到……", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "542d02fcd9759760a7eb8cda0ddb4c18", "index": 114, "aliyun_index": 12, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "bubbles depends on the type of instructions and the task of each\noperand in the instructions. We found that the best approximation\nthat matches almost all the experiments we tested is a scheme\nwith two intermediate stages between the instruction issue and\noperand read of fixed-latency instructions, which we call Control\nand Allocate. The former has been explained in subsection 5.1.1.\nThe latter is in charge of reserving the register file read ports.\nEach bank of the register file has one read port of 1024 bits, and\nread conflicts are alleviated by using a register file cache (more\ndetails later). Our experiments showed that all the fixed-latency\ninstructions spend three cycles for reading source operands, even\nif some of these cycles the instruction is idle (for instance when\nthere are only two source operands) because FADD and FMUL have\nthe same latency as the FFMA despite having one operand less, and\nFFMA always has the same latency regardless of whether its three\noperands are in the same bank or not. If the instruction in the\nallocate stage realizes that it cannot read all its operands in the next\nthree cycles, it is held in this stage (stalling the pipeline upwards)\nand generates bubbles until it can reserve all ports needed to read\nthe source operands in the next three cycles.  \n\n", "text": "bubbles depends on the type of instructions and the task of each\noperand in the instructions. We found that the best approximation\nthat matches almost all the experiments we tested is a scheme\nwith two intermediate stages between the instruction issue and\noperand read of fixed-latency instructions, which we call Control\nand Allocate. The former has been explained in subsection 5.1.1.\nThe latter is in charge of reserving the register file read ports.\nEach bank of the register file has one read port of 1024 bits, and\nread conflicts are alleviated by using a register file cache (more\ndetails later). Our experiments showed that all the fixed-latency\ninstructions spend three cycles for reading source operands, even\nif some of these cycles the instruction is idle (for instance when\nthere are only two source operands) because FADD and FMUL have\nthe same latency as the FFMA despite having one operand less, and\nFFMA always has the same latency regardless of whether its three\noperands are in the same bank or not. If the instruction in the\nallocate stage realizes that it cannot read all its operands in the next\nthree cycles, it is held in this stage (stalling the pipeline upwards)\nand generates bubbles until it can reserve all ports needed to read\nthe source operands in the next three cycles.\n", "alignment": "left", "unique_id": "542d02fcd9759760a7eb8cda0ddb4c18", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "
