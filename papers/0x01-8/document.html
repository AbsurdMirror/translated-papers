 "unique_id": "fc1c6b698011918147b99dfd8c5ff31a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Antonio González"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Universitat Politècnica de Catalunya"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Barcelona, Spain"}], "lineHeight": -88}}, "target": {"markdown": "Antonio González\n西班牙巴塞罗那\n加泰罗尼亚理工大学", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "f9c4444f3a415cc09eee8ea3d431233c", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## Abstract\n", "text": "Abstract\n", "alignment": "left", "unique_id": "f9c4444f3a415cc09eee8ea3d431233c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "b732b79769ea00a77001901940d30bc2", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "GPUs are the most popular platform for accelerating HPC workloads, such as artificial intelligence and science simulations. However, most microarchitectural research in academia relies on GPU core pipeline designs based on architectures that are more than 15 years old.  \n\n", "text": "GPUs are the most popular platform for accelerating HPC workloads, such as artificial intelligence and science simulations. However, most microarchitectural research in academia relies on GPU core pipeline designs based on architectures that are more than 15 years old.\n", "alignment": "left", "unique_id": "b732b79769ea00a77001901940d30bc2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs are the most popular platform for accelerating HPC workloads, such as artificial intelligence and science simulations. However, most microarchitectural research in academia relies on GPU core pipeline designs based on architectures that are more than 15 years old."}], "lineHeight": 0}}, "target": {"markdown": "GPU 是加速高性能计算（HPC）工作负载（例如人工智能和科学仿真）最流行的平台。然而，学术界大多数关于微架构的研究都依赖于基于 15 年以上架构的 GPU 核心流水线设计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "a89eca59dcff3d3aa3b96729b17a6da3", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "This paper reverse engineers modern NVIDIA GPU cores, unveiling many key aspects of its design and explaining how GPUs leverage hardware-compiler techniques where the compiler guides hardware during execution. In particular, it reveals how the issue logic works including the policy of the issue scheduler, the structure of the register file and its associated cache, and multiple features of the memory pipeline. Moreover, it analyses how a simple instruction prefetcher based on a stream buffer fits well with modern NVIDIA GPUs and is likely to be used. Furthermore, we investigate the impact of the register file cache and the number of register file read ports on both simulation accuracy and performance.  \n\n", "text": "This paper reverse engineers modern NVIDIA GPU cores, unveiling many key aspects of its design and explaining how GPUs leverage hardware-compiler techniques where the compiler guides hardware during execution. In particular, it reveals how the issue logic works including the policy of the issue scheduler, the structure of the register file and its associated cache, and multiple features of the memory pipeline. Moreover, it analyses how a simple instruction prefetcher based on a stream buffer fits well with modern NVIDIA GPUs and is likely to be used. Furthermore, we investigate the impact of the register file cache and the number of register file read ports on both simulation accuracy and performance.\n", "alignment": "left", "unique_id": "a89eca59dcff3d3aa3b96729b17a6da3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper reverse engineers modern NVIDIA GPU cores, unveiling many key aspects of its design and explaining how GPUs leverage hardware-compiler techniques where the compiler guides hardware during execution. In particular, it reveals how the issue logic works including the policy of the issue scheduler, the structure of the register file and its associated cache, and multiple features of the memory pipeline. Moreover, it analyses how a simple instruction prefetcher based on a stream buffer fits well with modern NVIDIA GPUs and is likely to be used. Furthermore, we investigate the impact of the register file cache and the number of register file read ports on both simulation accuracy and performance."}], "lineHeight": 0}}, "target": {"markdown": "本文通过逆向工程分析现代 NVIDIA GPU 核心，揭示了其设计的诸多关键特性，并解释了 GPU 如何利用硬件—编译器协同技术——即由编译器在运行期间引导硬件——来实现高效执行。具体而言，本文揭示了发射逻辑的工作原理，包括发射调度器的调度策略、寄存器文件及其关联缓存的结构，以及存储流水线的多项特性。此外，本文还分析了基于流缓冲区的简单指令预取器如何与现代 NVIDIA GPU 良好契合，并很可能已被实际采用。在此基础上，我们进一步研究了寄存器文件缓存以及寄存器文件读端口数量对仿真精度和性能的影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "f23077a1f9b15eb7063140986336ef98", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "By modeling all these new discovered microarchitectural details, we achieve 18.24% lower mean absolute percentage error (MAPE) in execution cycles than previous state-of-the-art simulators, resulting in an average of 13.98% MAPE with respect to real hardware (NVIDIA RTX A6000). Also, we demonstrate that this new model stands for other NVIDIA architectures, such as Turing.  \n\n", "text": "By modeling all these new discovered microarchitectural details, we achieve 18.24% lower mean absolute percentage error (MAPE) in execution cycles than previous state-of-the-art simulators, resulting in an average of 13.98% MAPE with respect to real hardware (NVIDIA RTX A6000). Also, we demonstrate that this new model stands for other NVIDIA architectures, such as Turing.\n", "alignment": "left", "unique_id": "f23077a1f9b15eb7063140986336ef98", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "By modeling all these new discovered microarchitectural details, we achieve 18.24% lower mean absolute percentage error (MAPE) in execution cycles than previous state-of-the-art simulators, resulting in an average of 13.98% MAPE with respect to real hardware (NVIDIA RTX A6000). Also, we demonstrate that this new model stands for other NVIDIA architectures, such as Turing."}], "lineHeight": 0}}, "target": {"markdown": "通过对所有这些新发现的微架构细节进行建模，我们在执行周期数上比之前的先进仿真器降低了 18.24% 的平均绝对百分比误差（MAPE），相对于真实硬件（NVIDIA RTX A6000）达到了平均 13.98% 的 MAPE。此外，我们证明该新模型同样适用于其他 NVIDIA 架构，例如 Turing。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "83147f92d888c32ae3098680d9238864", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Finally, we show that the software-based dependence management mechanism included in modern NVIDIA GPUs outperforms a hardware mechanism based on scoreboards in terms of performance and area.  \n\n", "text": "Finally, we show that the software-based dependence management mechanism included in modern NVIDIA GPUs outperforms a hardware mechanism based on scoreboards in terms of performance and area.\n", "alignment": "left", "unique_id": "83147f92d888c32ae3098680d9238864", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Finally, we show that the software-based dependence management mechanism included in modern NVIDIA GPUs outperforms a hardware mechanism based on scoreboards in terms of performance and area."}], "lineHeight": 0}}, "target": {"markdown": "最后，本文证明现代 NVIDIA GPU 中所采用的基于软件的依赖关系管理机制在性能和面积方面均优于基于记分牌的硬件机制。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "1eeb43973d334d13b8df89c9dbae937d", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## 1 Introduction\n", "text": "1 Introduction\n", "alignment": "left", "unique_id": "1eeb43973d334d13b8df89c9dbae937d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1 Introduction"}], "lineHeight": 0}}, "target": {"markdown": "## 1 引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "de41453c8e1aba7d58b94252166489c8", "index": 12, "aliyun_index": 12, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "In recent years, GPUs have become very popular for executing general-purpose workloads  $ [21] $  in addition to graphics. GPUs' architecture provides massive parallelism that can be leveraged by many modern applications such as bioinformatics  $ [23, 59] $ , physics  $ [52, 87] $ , and chemistry  $ [39, 89] $ , to name a few. Nowadays, GPUs are the main candidates to accelerate modern machine learning workloads, which have high memory bandwidth and computation demands  $ [27] $ . Over the last years, there have been significant innovations in GPUs' microarchitecture, their interconnection technologies (NVLink  $ [63] $ ), and their communication frameworks (NCCL  $ [64] $ ). All these advances have enabled inference and training of Large Language Models, which require clusters with thousands of GPUs  $ [56] $ .  \n\n", "text": "In recent years, GPUs have become very popular for executing general-purpose workloads  $ [21] $  in addition to graphics. GPUs' architecture provides massive parallelism that can be leveraged by many modern applications such as bioinformatics  $ [23, 59] $ , physics  $ [52, 87] $ , and chemistry  $ [39, 89] $ , to name a few. Nowadays, GPUs are the main candidates to accelerate modern machine learning workloads, which have high memory bandwidth and computation demands  $ [27] $ . Over the last years, there have been significant innovations in GPUs' microarchitecture, their interconnection technologies (NVLink  $ [63] $ ), and their communication frameworks (NCCL  $ [64] $ ). All these advances have enabled inference and training of Large Language Models, which require clusters with thousands of GPUs  $ [56] $ .\n", "alignment": "left", "unique_id": "de41453c8e1aba7d58b94252166489c8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In recent years, GPUs have become very popular for executing general-purpose workloads  $ [21] $  in addition to graphics. GPUs' architecture provides massive parallelism that can be leveraged by many modern applications such as bioinformatics  $ [23, 59] $ , physics  $ [52, 87] $ , and chemistry  $ [39, 89] $ , to name a few. Nowadays, GPUs are the main candidates to accelerate modern machine learning workloads, which have high memory bandwidth and computation demands  $ [27] $ . Over the last years, there have been significant innovations in GPUs' microarchitecture, their interconnection technologies (NVLink  $ [63] $ ), and their communication frameworks (NCCL  $ [64] $ ). All these advances have enabled inference and training of Large Language Models, which require clusters with thousands of GPUs  $ [56] $ ."}], "lineHeight": 0}}, "target": {"markdown": "近年来，GPU 除了用于图形处理外，在执行通用计算工作负载 [21] 方面也变得非常流行。GPU 的架构提供了大规模并行能力，可被众多现代应用所利用，例如生物信息学 [23, 59]、物理学 [52, 87] 和化学 [39, 89] 等。如今，GPU 已成为加速现代机器学习工作负载（此类工作负载对内存带宽和算力有很高的需求）的主要候选平台 [27]。在过去几年中，GPU 微架构、互连技术（NVLink [63]）以及通信框架（NCCL [64]）均取得了重要的创新与进展。所有这些进步使得大语言模型（需要由成千上万块 GPU 组成的集群 [56]）的推理与训练成为可能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "43d80efcbe96b3c7b1f844cd9708fd70", "index": 13, "aliyun_index": 13, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "However, there is scarce information on the microarchitecture design of modern commercial GPUs, and current academic studies [17, 49] take the Tesla microarchitecture [51] as the baseline, which was launched in 2006. Today GPU architectures has undergone significant changes since Tesla, hence, a model based on that  \n\n", "text": "However, there is scarce information on the microarchitecture design of modern commercial GPUs, and current academic studies [17, 49] take the Tesla microarchitecture [51] as the baseline, which was launched in 2006. Today GPU architectures has undergone significant changes since Tesla, hence, a model based on that\n", "alignment": "left", "unique_id": "43d80efcbe96b3c7b1f844cd9708fd70", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "However, there is scarce information on the microarchitecture design of modern commercial GPUs, and current academic studies [17, 49] take the Tesla microarchitecture [51] as the baseline, which was launched in 2006. Today GPU architectures has undergone significant changes since Tesla, hence, a model based on that"}], "lineHeight": 0}}, "target": {"markdown": "然而，关于现代商用 GPU 微架构设计的公开信息十分匮乏，而当前的学术研究 [17, 49] 仍以 2006 年发布的 Tesla 微架构 [51] 作为建模基线。如今的 GPU 架构相较于 Tesla 已经发生了巨大变化，因此，基于 Tesla 的模型", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 13}, {"source": {"block_id": "bedd3f3421b430884cb43bd0336a7b2d", "index": 14, "aliyun_index": 14, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "can deviate the reported findings. This work aims to unveil different\nfeatures and details of various components that modern NVIDIA\nGPU architectures use to improve the accuracy of academic microarchitecture models. The model and details explained in this\nwork allow researchers to better identify challenges and opportuni e, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Describes a plausible operation of the fetch stage and its scheduler that coordinates with the issue stage."}], "lineHeight": 0}}, "target": {"markdown": "• 阐述了取指阶段的一种合理运行机制及其与发射阶段相协调的调度策略。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "0b4ebe7894619f219160de77c87f0995", "index": 17, "aliyun_index": 17, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• Provides important details of the register file and explains the behavior of the register file cache. Moreover, it shows that modern NVIDIA GPUs do not use an operand collection stage or collector units.  \n\n", "text": "• Provides important details of the register file and explains the behavior of the register file cache. Moreover, it shows that modern NVIDIA GPUs do not use an operand collection stage or collector units.\n", "alignment": "left", "unique_id": "0b4ebe7894619f219160de77c87f0995", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Provides important details of the register file and explains the behavior of the register file cache. Moreover, it shows that modern NVIDIA GPUs do not use an operand collection stage or collector units."}], "lineHeight": 0}}, "target": {"markdown": "• 详细描述了寄存器文件的关键细节，并解释了寄存器文件缓存的行为。此外，本文指出现代 NVIDIA GPU 并未使用操作数收集阶段（operand collection stage）或收集单元（collector unit）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "f77fc585093c9c80b1130271f108b7d9", "index": 18, "aliyun_index": 18, "page_num": 0, "type": "text", "sub_type": "none", "m s paper into the model."}], "lineHeight": -77}}, "target": {"markdown": "• 从零开始重新设计了 Accel-sim 仿真器 [49] 中所使用的 SM/core 模型，并将本文揭示的所有细节集成到该模型中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "8d25cc45743c49d35de29efebcb05828", "index": 20, "aliyun_index": 20, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• Validates the new model against real hardware and compares it against the Accel-sim simulator [49]. Our new model achieves a mean absolute percentage error (MAPE) of execution cycles against real hardware of 13.98% for the NVIDIA RTX A6000 (Ampere), which is 18.24% better than the previous simulator model.  \n\n", "text": "• Validates the new model against real hardware and compares it against the Accel-sim simulator [49]. Our new model achieves a mean absolute percentage error (MAPE) of execution cycles against real hardware of 13.98% for the NVIDIA RTX A6000 (Ampere), which is 18.24% better than the previous simulator model.\n", "alignment": "left", "unique_id": "8d25cc45743c49d35de29efebcb05828", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Validates the new model against real hardware and compares it against the Accel-sim simulator [49]. Our new model achieves a mean absolute percentage error (MAPE) of execution cycles against real hardware of 13.98% for the NVIDIA RTX A6000 (Ampere), which is 18.24% better than the previous simulator model."}], "lineHeight": 0}}, "target": {"markdown": "• 在真实硬件上对新模型进行验证，并将其与 Accel-sim 仿真器 [49] 进行比较。针对 NVIDIA RTX A6000（Ampere），本文新模型相对于真实硬件的执行周期平均绝对百分比误差（MAPE）为 13.98%，相较于原有仿真器模型提升了 18.24%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null,  "italic": false}, "text": "• Shows how the register file cache and the number of register file read ports affect simulation accuracy and performance."}], "lineHeight": 0}}, "target": {"markdown": "• 展示了寄存器文件缓存以及寄存器文件读端口数量如何影响仿真精度与性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "25e6e1f9c4001c438dc9282bf68f364c", "index": 23, "aliyun_index": 23, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• Compares the performance, area, and simulation accuracy of the dependence management system that we unveil in this paper against the traditional scoreboard. The comparison reveals that this novel software-hardware co-design is a more efficient alternative than handling dependencies with traditional scoreboards.  \n\n", "text": "• Compares the performance, area, and simulation accuracy of the dependence management system that we unveil in this paper against the traditional scoreboard. The comparison reveals that this novel software-hardware co-design is a more efficient alternative than handling dependencies with traditional scoreboards.\n", "alignment": "left", "unique_id": "25e6e1f9c4001c438dc9282bf68f364c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Compares the performance, area, and simulation accuracy of the dependence management system that we unveil in this paper against the traditional scoreboard. The comparison reveals that this novel software-hardware co-design is a more efficient alternative than handling dependencies with traditional scoreboards."}], "lineHeight": 0}}, "target": {"markdown": "• 将本文所揭示的依赖管理机制在性能、面积与仿真精度方面与传统的记分牌（scoreboard）机制进行了对比。对比结果表明，这种新颖的软硬件协同设计方案相较于采用传统记分牌处理依赖关系，是一种更为高效的替代方案。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "3603cc05f581d22ed1c0ecd393a63a4b", "index": 24, "aliyun_index": 24, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• Shows the portability of the model to other NVIDIA architectures such as Turing.  \n\n", "text": "• Shows the portability of the model to other NVIDIA architectures such as Turing.\n", "alignment": "left", "unique_id": "3603cc05f581d22ed1c0ecd393a63a4b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Shows the portability of the model to other NVIDIA architectures such as Turing."}], "lineHeight": 0}}, "target": {"markdown": "• 展示了该模型在其他 NVIDIA 架构（如 Turing）上的可移植性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "adad1717d5cb5d810aa87baf6f9f584a", "index": 25, "aliyun_index": 25, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "The rest of this paper is organized as follows. First, we introduce the background and motivation of this work in section 2. In section 3, we explain the reverse engineering methodology that we have employed. We describe the control bits in modern NVIDIA GPU architectures and their detailed behavior in section 4. Later, we present the core microarchitecture of these GPUs in section 5.  \n\n", "text": "The rest of this paper is organized as follows. First, we introduce the background and motivation of this work in section 2. In section 3, we explain the reverse engineering methodology that we have employed. We describe the control bits in modern NVIDIA GPU architectures and their detailed behavior in section 4. Later, we present the core microarchitecture of these GPUs in section 5.\n", "alignment": "left", "unique_id": "adad1717d5cb5d810aa87baf6f9f584a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The rest of this paper is organized as follows. First, we introduce the background and motivation of this work in section 2. In section 3, we explain the reverse engineering methodology that we have employed. We describe the control bits in modern NVIDIA GPU architectures and their detailed behavior in section 4. Later, we present the core microarchitecture of these GPUs in section 5."}], "lineHeight": 0}}, "target": {"markdown": "本文其余部分组织如下。首先，在第 2 节介绍本工作的背景与动机。在第 3 节中，我们阐述所采用的反向工程方法。第 4 节描述现代 NVIDIA GPU 架构中的控制位及其具体行为。随后，第 5 节将介绍这些 GPU 的核心微架构。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "54492fefffb407ed4a754748b8882169", "index": 26, "aliyun_index": 1, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Next, we describe the features we have modeled in our simulator in section 6. Section 7 evaluates the accuracy of our model against real hardware and compares it to the Accel-sim framework simulator, analyzes the impact of a stream buffer for instruction prefetching, studies the effect of the register file cache and the number of register file read ports, compares different dependence management mechanisms, and discusses how the model stands for other NVIDIA architectures. Section 8 reviews previous related work. Finally, section 9 summarizes the main lessons of this work.  \n\n", "text": "Next, we describe the features we have modeled in our simulator in section 6. Section 7 evaluates the accuracy of our model against real hardware and compares it to the Accel-sim framework simulator, analyzes the impact of a stream buffer for instruction prefetching, studies the effect of the register file cache and the number of register file read ports, compares different dependence management mechanisms, and discusses how the model stands for other NVIDIA architectures. Section 8 reviews previous related work. Finally, section 9 summarizes the main lessons of this work.\n", "alignment": "left", "unique_id": "54492fefffb407ed4a754748b8882169", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Next, we describe the features we have modeled in our simulator in section 6. Section 7 evaluates the accuracy of our model against real hardware and compares it to the Accel-sim framework simulator, analyzes the impact of a stream buffer for instruction prefetching, studies the effect of the register file cache and the number of register file read ports, compares different dependence management mechanisms, and discusses how the model stands for other NVIDIA architectures. Section 8 reviews previous related work. Finally, section 9 summarizes the main lessons of this work."}], "lineHeight": 0}}, "target": {"markdown": "接下来，第 6 节将描述我们在仿真器中所建模的特性。第 7 节对新模型的精度进行评估，将其与真实硬件及 Accel-sim 框架仿真器进行对比，分析指令预取流缓冲区的影响，研究寄存器文件缓存及寄存器文件读端口数量的作用，比较不同的依赖管理机制，并讨论该模型在其他 NVIDIA 架构上的适用性。第 8 节回顾了相关的已有工作。最后，第 9 节对本文工作的主要启示进行总结。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "e4d54a8baa6a7a40e4407aa4596a8188", "index": 27, "aliyun_index": 2, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2 Background and Motivation\n", "text": "2 Background and Motivation\n", "alignment": "left", "unique_id": "e4d54a8baa6a7a40e4407aa4596a8188", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2 Background and Motivation"}], "lineHeight": 0}}, "target": {"markdown": "## 2 背景与动机\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "490e33f1499aa6956043680b35c8a956", "index": 28, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Most GPU microarchitecture research in academia relies on the microarchitecture that GPGPU-Sim simulator employs [1, 17]. Recently, this simulator was updated to include sub-cores (Processing Blocks in NVIDIA terminology) approach that started in Volta. Figure 1 shows a block diagram of the architecture modeled in this simulator. We can observe that it comprises four sub-cores and some shared components, such as the L1 instruction cache, L1 data cache, shared memory, and texture units.  \n\n", "text": "Most GPU microarchitecture research in academia relies on the microarchitecture that GPGPU-Sim simulator employs [1, 17]. Recently, this simulator was updated to include sub-cores (Processing Blocks in NVIDIA terminology) approach that started in Volta. Figure 1 shows a block diagram of the architecture modeled in this simulator. We can observe that it comprises four sub-cores and some shared components, such as the L1 instruction cache, L1 data cache, shared memory, and texture units.\n", "alignment": "left", "unique_id": "490e33f1499aa6956043680b35c8a956", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Most GPU microarchitecture research in academia relies on the microarchitecture that GPGPU-Sim simulator employs [1, 17]. Recently, this simulator was updated to include sub-cores (Processing Blocks in NVIDIA terminology) approach that started in Volta. Figure 1 shows a block diagram of the architecture modeled in this simulator. We can observe that it comprises four sub-cores and some shared components, such as the L1 instruction cache, L1 data cache, shared memory, and texture units."}], "lineHeight": 0}}, "target": {"markdown": "学术界大多数 GPU 微架构研究都依赖于 GPGPU-Sim 仿真器所使用的微架构 [1, 17]。最近，该仿真器被更新，加入了始于 Volta 架构的子核（在 NVIDIA 术语中称为 Processing Block）方案。图 1 给出了该仿真器所建模架构的框图。可以看到，该架构包含四个子核以及若干共享组件，例如 L1 指令缓存、L1 数据缓存、共享内存和纹理单元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "594c6ca8754d41cfd9bf1183d78ab522", "index": 29, "aliyun_index": 4, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "#### Figure 1: SM/Core academia design.\n", "text": "Figure 1: SM/Core academia design.\n", "alignment": "left", "unique_id": "594c6ca8754d41cfd9bf1183d78ab522", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1: SM/Core academia design."}], "lineHeight": 0}}, "target": {"markdown": "#### 图 1：SM/Core 学术界设计方案。\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "8497ab025adee404f219a28cab93cec1", "index": 30, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In the Fetch stage of this GPU pipeline, a round robin scheduler selects a warp whose next instruction is in the L1 instruction cache and has empty slots in the Instruction Buffers. These buffers are dedicated per warp and store the consecutive instructions of a warp after they are fetched and decoded. Instructions stay in this buffer until they are ready and selected to be issued.  \n\n", "text": "In the Fetch stage of this GPU pipeline, a round robin scheduler selects a warp whose next instruction is in the L1 instruction cache and has empty slots in the Instruction Buffers. These buffers are dedicated per warp and store the consecutive instructions of a warp after they are fetched and decoded. Instructions stay in this buffer until they are ready and selected to be issued.\n", "alignment": "left", "unique_id": "8497ab025adee404f219a28cab93cec1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the Fetch stage of this GPU pipeline, a round robin scheduler selects a warp whose next instruction is in the L1 instruction cache and has empty slots in the Instruction Buffers. These buffers are dedicated per warp and store the consecutive instructions of a warp after they are fetched and decoded. Instructions stay in this buffer until they are ready and selected to be issued."}], "lineHeight": 0}}, "target": {"markdown": "在该 GPU 流水线的取指（Fetch）阶段中，一个轮询调度器会选择下一条指令已位于 L1 指令缓存中且指令缓冲区（Instruction Buffers）仍有空余槽位的 warp。这些缓冲区为每个 warp 专用，用于在指令被取出并译码之后存储该 warp 的连续指令。指令会一直保留在该缓冲区中，直至其就绪并被选中发射。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "df07deaf30e613b427482402368b6e5f", "index": 31, "aliyun_index": 6, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In the Issue stage, a Greedy Then Oldest (GTO) [77] scheduler selects a warp if it is not waiting on a barrier and its oldest instruction does not have data dependence with other in-flight instructions in the pipeline. Previous works assume that each warp has two scoreboards for checking the data dependence. The first one marks pending writes to the registers to track WAW and RAW dependencies. An instruction can be issued only when all its operands are cleared in this scoreboard. The second scoreboard counts the number of in-flight consumers of registers to prevent WAR hazards [57]. The second scoreboard is necessary because although  \n\n", "text": "In the Issue stage, a Greedy Then Oldest (GTO) [77] scheduler selects a warp if it is not waiting on a barrier and its oldest instruction does not have data dependence with other in-flight instructions in the pipeline. Previous works assume that each warp has two scoreboards for checking the data dependence. The first one marks pending writes to the registers to track WAW and RAW dependencies. An instruction can be issued only when all its operands are cleared in this scoreboard. The second scoreboard counts the number of in-flight consumers of registers to prevent WAR hazards [57]. The second scoreboard is necessary because although\n", "alignment": "left", "unique_id": "df07deaf30e613b427482402368b6e5f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the Issue stage, a Greedy Then Oldest (GTO) [77] scheduler selects a warp if it is not waiting on a barrier and its oldest instruction does not have data dependence with other in-flight instructions in the pipeline. Previous works assume that each warp has two scoreboards for checking the data dependence. The first one marks pending writes to the registers to track WAW and RAW dependencies. An instruction can be issued only when all its operands are cleared in this scoreboard. The second scoreboard counts the number of in-flight consumers of registers to prevent WAR hazards [57]. The second scoreboard is necessary because although"}], "lineHeight": 0}}, "target": {"markdown": "在发射（Issue）阶段，一个 Greedy Then Oldest（GTO）[77] 调度器会在某个 warp 未等待屏障（barrier）且其最旧的指令与流水线中其他在飞指令之间不存在数据依赖时选择该 warp。已有工作假设每个 warp 配备两个记分牌（scoreboard）用于检查数据依赖。第一个记分牌标记对寄存器的未完成写操作，以跟踪 WAW（写后写）和 RAW（读后写）依赖。只有当某条指令的所有操作数在该记分牌中均被清除后，该指令才能被发射。第二个记分牌对寄存器在飞消费者的数量进行计数，以防止 WAR（写后读）冒险 [57]。设置第二个记分牌是必要的，因为尽管", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "d953612152524cd87bc76fee0f87e809", "index": 32, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "instructions are issued in-order, their operands might be fetched\nout of order. This happens for variable-latency instructions such\nas memory instructions. These instructions are queued after being\nissued and may read its source operands after a younger arithmetic\ninstruction writes its result, causing a WAR hazard if the source\noperand of the former is the same as the destination operand of the\nlatter.  \n\n", "text": "instructions are issued in-order, their operands might be fetched\nout of order. This happens for variable-latency instructions such\nas memory instructions. These instructions are queued after being\nissued and may read its source operands after a younger arithmetic\ninstruction writes its result, causing a WAR hazard if the source\noperand of the former is the same as the destination operand of the\nlatter.\n", "alignment": "left", "unique_id": "d953612152524cd87bc76fee0f87e809", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions are issued in-order, their operands might be fetched"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "out of order. This happens for variable-latency instructions such"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "as memory instructions. These instructions are queued after being"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "issued and may read its source operands after a younger arithmetic"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instruction writes its result, causing a WAR hazard if the source"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "operand of the former is the same as the destination operand of the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "latter."}], "lineHeight": -180}}, "target": {"markdown": "指令按程序顺序发射，但其操作数可能乱序读取。这在变延迟指令（例如访存指令）中会发生。这些指令在发射后进入队列，并可能在该指令之后发射的、较早的算术指令写入其结果之后再去读取自身的源操作数；若前者的源操作数与后者的目的操作数相同，就会引发 WAR 冒险。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "af2ff17c535409623fd13e0b079196d1", "index": 33, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Once an instruction is issued, it is placed in a Collector Unit (CU) and waits until all its source register operands are retrieved. Each sub-core has a private register file with multiple banks and a few ports per bank, allowing for multiple accesses in a single cycle at a low cost. An arbiter deals with the possible conflicts among several petitions to the same bank. When all source operands of an instruction are in the CU, the instruction moves to the Dispatch stage, where it is dispatched to the proper execution unit (e.g., memory, single-precision, special function) whose latencies differ depending on the unit type and instruction. Once the instruction reaches the write-back stage, the result is written in the register file.  \n\n", "text": "Once an instruction is issued, it is placed in a Collector Unit (CU) and waits until all its source register operands are retrieved. Each sub-core has a private register file with multiple banks and a few ports per bank, allowing for multiple accesses in a single cycle at a low cost. An arbiter deals with the possible conflicts among several petitions to the same bank. When all source operands of an instruction are in the CU, the instruction moves to the Dispatch stage, where it is dispatched to the proper execution unit (e.g., memory, single-precision, special function) whose latencies differ depending on the unit type and instruction. Once the instruction reaches the write-back stage, the result is written in the register file.\n", "alignment": "left", "unique_id": "af2ff17c535409623fd13e0b079196d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Once an instruction is issued, it is placed in a Collector Unit (CU) and waits until all its source register operands are retrieved. Each sub-core has a private register file with multiple banks and a few ports per bank, allowing for multiple accesses in a single cycle at a low cost. An arbiter deals with the possible conflicts among several petitions to the same bank. When all source operands of an instruction are in the CU, the instruction moves to the Dispatch stage, where it is dispatched to the proper execution unit (e.g., memory, single-precision, special function) whose latencies differ depending on the unit type and instruction. Once the instruction reaches the write-back stage, the result is written in the register file."}], "lineHeight": 0}}, "target": {"markdown": "一旦指令被发射，便被放入采集单元（Collector Unit，CU）中，并等待其所有源寄存器操作数准备就绪。每个子核都拥有一个私有的寄存器文件，该寄存器文件包含多个存储体（bank），每个存储体配备若干端口，从而能够以较低开销在单个周期内支持多次访问。仲裁器负责处理对同一存储体的潜在访问冲突。当某条指令的全部源操作数均已就绪并位于 CU 中后，该指令将进入分派（Dispatch）阶段，并被分派到相应的执行单元（例如访存单元、单精度运算单元、特殊函数单元等），不同执行单元以及不同指令的延迟各异。当指令到达写回（write-back）阶段时，其结果被写回寄存器文件。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "66ea951f452709a23d564c0d31d89f7c", "index": 34, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This GPU microarchitecture modeled in Accel-sim [49] resembles NVIDIA GPUs based on Tesla [51], which was released in 2006, and updated with a few modern features, mainly a sub-core model and sectored caches with IPOLY [75] indexing similar to Volta [49]. However, it lacks some important components that are present in modern NVIDIA GPUs, such as the L0 instruction cache [20, 28, 65–69] and the uniform register file [20]. Moreover, some main components of sub-cores, such as the issue logic, register file, or register file caches, among others, are not updated to reflect current designs.  \n\n", "text": "This GPU microarchitecture modeled in Accel-sim [49] resembles NVIDIA GPUs based on Tesla [51], which was released in 2006, and updated with a few modern features, mainly a sub-core model and sectored caches with IPOLY [75] indexing similar to Volta [49]. However, it lacks some important components that are present in modern NVIDIA GPUs, such as the L0 instruction cache [20, 28, 65–69] and the uniform register file [20]. Moreover, some main components of sub-cores, such as the issue logic, register file, or register file caches, among others, are not updated to reflect current designs.\n", "alignment": "left", "unique_id": "66ea951f452709a23d564c0d31d89f7c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This GPU microarchitecture modeled in Accel-sim [49] resembles NVIDIA GPUs based on Tesla [51], which was released in 2006, and updated with a few modern features, mainly a sub-core model and sectored caches with IPOLY [75] indexing similar to Volta [49]. However, it lacks some important components that are present in modern NVIDIA GPUs, such as the L0 instruction cache [20, 28, 65–69] and the uniform register file [20]. Moreover, some main components of sub-cores, such as the issue logic, register file, or register file caches, among others, are not updated to reflect current designs."}], "lineHeight": 0}}, "target": {"markdown": "Accel-sim [49] 中建模的这种 GPU 微架构与 NVIDIA 基于 Tesla [49] 的 GPU 相似，后者于 2006 年发布，并在此后加入了一些现代特性，主要是子核模型以及采用 IPOLY [75] 索引方式（类似于 Volta）的分片缓存。然而，它仍缺少现代 NVIDIA GPU 中若干重要的组件，例如 L0 指令缓存 [20, 28, 65–69] 和统一寄存器文件 [20]。此外，子核的若干主要组成部分——例如发射逻辑、寄存器文件以及寄存器文件缓存等——也未更新以反映当前的设计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "7a51f94ab0cf25c5ff58896dcd8aa988", "index": 35, "aliyun_index": 10, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This work aims to reverse engineer the microarchitecture of the core in modern NVIDIA GPUs and update Accel-sim to incorporate the unveiled features. This will allow users of this updated Accel-sim simulator to make their work more relevant by starting with baselines closer to those proven successful by the industry in commercial designs.  \n\n", "text": "This work aims to reverse engineer the microarchitecture of the core in modern NVIDIA GPUs and update Accel-sim to incorporate the unveiled features. This will allow users of this updated Accel-sim simulator to make their work more relevant by starting with baselines closer to those proven successful by the industry in commercial designs.\n", "alignment": "left", "unique_id": "7a51f94ab0cf25c5ff58896dcd8aa988", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This work aims to reverse engineer the microarchitecture of the core in modern NVIDIA GPUs and update Accel-sim to incorporate the unveiled features. This will allow users of this updated Accel-sim simulator to make their work more relevant by starting with baselines closer to those proven successful by the industry in commercial designs."}], "lineHeight": 0}}, "target": {"markdown": "本文旨在对现代 NVIDIA GPU 核心的微架构进行反向工程，并更新 Accel-sim 以纳入所揭示的新特性。这将使更新后的 Accel-sim 仿真器用户能够从更接近商用设计中已被业界验证成功的基线出发，从而使他们的研究工作更具现实意义。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "cae08a1f228f92c8df095a3813bd7523", "index": 36, "aliyun_index": 11, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 3 Reverse Engineering Methodology\n", "text": "3 Reverse Engineering Methodology\n", "alignment": "left", "unique_id": "cae08a1f228f92c8df095a3813bd7523", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3 Reverse Engineering Methodology"}], "lineHeight": 0}}, "target": {"markdown": "## 3 反向工程方法\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "bad4b17bfd2c10af9c63d530cd19dc7a", "index": 37, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This section explains our research methodology for discovering the microarchitecture of the cores (SMs) in NVIDIA Ampere GPUs.  \n\n", "text": "This section explains our research methodology for discovering the microarchitecture of the cores (SMs) in NVIDIA Ampere GPUs.\n", "alignment": "left", "unique_id": "bad4b17bfd2c10af9c63d530cd19dc7a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section explains our research methodology for discovering the microarchitecture of the cores (SMs) in NVIDIA Ampere GPUs."}], "lineHeight": 0}}, "target": {"markdown": "本节介绍了用于探索 NVIDIA Ampere GPU 核心（SM）微架构的研究方法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "2d548c6851f83fc7cbbe5f3844036d70", "index": 38, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Our approach is based on writing small microbenchmarks that consist of few instructions and measure the execution time of a particular small sequence of instructions. The elapsed cycles are obtained by surrounding a region of the code with instructions that save the CLOCK counter of the GPU into a register, and store it in main memory for later post-processing. The evaluated sequence of instructions typically consists of hand-written SASS instructions (and their control bits). Depending on the test, we visualize the recorded cycles to confirm or refute a particular hypothesis about the semantics of the control bits or a particular feature in the microarchitecture. Two examples to illustrate this methodology are given below:  \n\n", "text": "Our approach is based on writing small microbenchmarks that consist of few instructions and measure the execution time of a particular small sequence of instructions. The elapsed cycles are obtained by surrounding a region of the code with instructions that save the CLOCK counter of the GPU into a register, and store it in main memory for later post-processing. The evaluated sequence of instructions typically consists of hand-written SASS instructions (and their control bits). Depending on the test, we visualize the recorded cycles to confirm or refute a particular hypothesis about the semantics of the control bits or a particular feature in the microarchitecture. Two examples to illustrate this methodology are given below:\n", "alignment": "left", "unique_id": "2d548c6851f83fc7cbbe5f3844036d70", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our approach is based on writing small microbenchmarks that consist of few instructions and measure the execution time of a particular small sequence of instructions. The elapsed cycles are obtained by surrounding a region of the code with instructions that save the CLOCK counter of the GPU into a register, and store it in main memory for later post-processing. The evaluated sequence of instructions typically consists of hand-written SASS instructions (and their control bits). Depending on the test, we visualize the recorded cycles to confirm or refute a particular hypothesis about the semantics of the control bits or a particular feature in the microarchitecture. Two examples to illustrate this methodology are given below:"}], "lineHeight": 0}}, "target": {"markdown": "我们的方法基于编写由少量指令组成的小型微基准测试程序，并测量特定小段指令序列的执行时间。代码执行所耗费的周期数通过将目标代码片段用若干指令包裹起来获得，这些指令将 GPU 的 CLOCK 计数器值保存到寄存器中，并进一步存至主存，以便后续进行后处理。所评估的指令序列通常由手工编写的 SASS 指令（及其控制位）构成。根据测试目的的不同，我们会对记录到的周期数进行可视化，以确认或反驳关于控制位语义或微架构中某一特定特性的假设。下面给出两个示例来说明该方法：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "faf6ae49b615a8e7efb2775ca5beb4fb", "index": 39, "aliyun_index": 14, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• We have used the code in Listing 1 to unveil the conflicts of the multi-banked register file (subsection 5.3). Replacing R_X and R_Y by odd numbers (e.g., R19 and R21), we get an elapsed time of five cycles (the minimum since each sub-core can issue one instruction per cycle). If we change R_X to an even number (e.g., R18) while maintaining R_Y  \n\n", "text": "• We have used the code in Listing 1 to unveil the conflicts of the multi-banked register file (subsection 5.3). Replacing R_X and R_Y by odd numbers (e.g., R19 and R21), we get an elapsed time of five cycles (the minimum since each sub-core can issue one instruction per cycle). If we change R_X to an even number (e.g., R18) while maintaining R_Y\n", "alignment": "left", "unique_id": "faf6ae49b615a8e7efb2775ca5beb4fb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We have used the code in Listing 1 to unveil the conflicts of the multi-banked register file (subsection 5.3). Replacing R_X and R_Y by odd numbers (e.g., R19 and R21), we get an elapsed time of five cycles (the minimum since each sub-core can issue one instruction per cycle). If we change R_X to an even number (e.g., R18) while maintaining R_Y"}], "lineHeight": 0}}, "target": {"markdown": "• 我们使用了清单 1 中的代码来揭示多体寄存器文件的冲突（5.3 小节）。将 R_X 和 R_Y 替换为奇数（例如 R19 和 R21），所测得的执行时间为五个周期（这是最小值，因为每个子核每个周期
