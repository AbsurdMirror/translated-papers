e": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "b017cfeee3af0593dffec536089176be", "index": 30, "aliyun_index": 10, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2 BACKGROUND AND THREAT MODEL\n", "text": "2 BACKGROUND AND THREAT MODEL\n", "alignment": "left", "unique_id": "b017cfeee3af0593dffec536089176be", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2 BACKGROUND AND THREAT MODEL"}], "lineHeight": 0}}, "target": {"markdown": "## 2 背景与威胁模型\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "22795cd1e6a99adbf4b03726f2e92d23", "index": 31, "aliyun_index": 11, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Modern GPGPUs consist of a number of programmable streaming\nmultiprocessors (SM, or SMX) that together access a shared global  \n\n", "text": "Modern GPGPUs consist of a number of programmable streaming\nmultiprocessors (SM, or SMX) that together access a shared global\n", "alignment": "left", "unique_id": "22795cd1e6a99adbf4b03726f2e92d23", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Modern GPGPUs consist of a number of programmable streaming"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "multiprocessors (SM, or SMX) that together access a shared global"}], "lineHeight": -52}}, "target": {"markdown": "现代 GPGPU 由若干可编程流式多处理器（SM 或 SMX）组成，这些多处理器共同访问一个共享的全局", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "92c9e14db8e15239b37bbcd4dcf8f338", "index": 32, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "device memory. Figure 1 presents an architecture overview of a typical GPGPU. A program (kernel) may be broken into one or more blocks that are assigned to one or more of the SMs. Each block consists of a number of threads that are grouped into warps of typically 32 threads that are scheduled together using the Single Instruction Multiple Thread (SIMT) model. The warps are assigned to one of a typically few warp schedulers on the SM. In each cycle, each warp scheduler can issue one or more instructions to the available cores. Depending on the architecture, each SM has a fixed number of different types of cores such as single precision cores, double precision cores, and special functional units. Depending on the number of available cores an instruction takes one or more cycles to issue, but the cores are heavily pipelined making it possible to continue to issue new instructions to them in different cycles. Warps assigned to the same SM compete for access to the processing cores. In addition, warps assigned to the same warp scheduler may compete for the issue bandwidth of the scheduler.  \n\n", "text": "device memory. Figure 1 presents an architecture overview of a typical GPGPU. A program (kernel) may be broken into one or more blocks that are assigned to one or more of the SMs. Each block consists of a number of threads that are grouped into warps of typically 32 threads that are scheduled together using the Single Instruction Multiple Thread (SIMT) model. The warps are assigned to one of a typically few warp schedulers on the SM. In each cycle, each warp scheduler can issue one or more instructions to the available cores. Depending on the architecture, each SM has a fixed number of different types of cores such as single precision cores, double precision cores, and special functional units. Depending on the number of available cores an instruction takes one or more cycles to issue, but the cores are heavily pipelined making it possible to continue to issue new instructions to them in different cycles. Warps assigned to the same SM compete for access to the processing cores. In addition, warps assigned to the same warp scheduler may compete for the issue bandwidth of the scheduler.\n", "alignment": "left", "unique_id": "92c9e14db8e15239b37bbcd4dcf8f338", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "device memory. Figure 1 presents an architecture overview of a typical GPGPU. A program (kernel) may be broken into one or more blocks that are assigned to one or more of the SMs. Each block consists of a number of threads that are grouped into warps of typically 32 threads that are scheduled together using the Single Instruction Multiple Thread (SIMT) model. The warps are assigned to one of a typically few warp schedulers on the SM. In each cycle, each warp scheduler can issue one or more instructions to the available cores. Depending on the architecture, each SM has a fixed number of different types of cores such as single precision cores, double precision cores, and special functional units. Depending on the number of available cores an instruction takes one or more cycles to issue, but the cores are heavily pipelined making it possible to continue to issue new instructions to them in different cycles. Warps assigned to the same SM compete for access to the processing cores. In addition, warps assigned to the same warp scheduler may compete for the issue bandwidth of the scheduler."}], "lineHeight": 0}}, "target": {"markdown": "设备内存。图 1 给出了典型 GPGPU 的架构概览。一个程序（内核）可被分解为一个或多个线程块，这些线程块被分配给一个或多个 SM。每个线程块由若干线程组成，这些线程被组织成 warp，每个 warp 通常包含 32 个线程，并通过单指令多线程（SIMT）模型统一调度。warp 被分配到 SM 上通常为数不多的某个 warp 调度器中。在每个时钟周期内，每个 warp 调度器可向可用的核心发出一条或多条指令。根据架构的不同，每个 SM 拥有固定数量的不同类型核心，例如单精度核心、双精度核心以及特殊功能单元。根据可用核心的数量，一条指令可能需要一个或多个周期才能完成发射，但这些核心深度流水线化，使其能够在不同的周期中继续向其发射新的指令。分配到同一 SM 上的 warp 会竞争对各处理核心的访问。此外，分配到同一 warp 调度器上的 warp 还可能竞争该调度器的发射带宽。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "70c792f91923a275b6691208f210f079", "index": 33, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Issue bandwidth of the scheduler.\n\nEach SM has a large register file with a fixed number of registers assigned to each thread. The SM also has a shared L1 cache, and a shared memory region that is explicitly managed by the program. The device memory is connected to the chip using several high speed channels, resulting in bandwidths of several hundred gigabytes per second, but with a high latency. The impact of the latency is hidden partially using caches, but more importantly, the large number of warps/threads ensures the availability of ready warps to take up the available processing bandwidth when other warps are stalled waiting for memory. The memory is partitioned into global memory, constant memory and texture memory that are each shared among all SMs. They are also used to transfer data between the CPU and GPU. There is a shared L2 cache to provide faster access to memory. Each SM has its own on-chip shared memory, as well as several L1 caches for the instructions, global data, constant data and texture data. As a typical example, one of our target devices, the Nvidia Tesla K40C, includes 15 SMs, each featuring 192 single-precision CUDA cores. Each SM uses four warp schedulers and eight instruction dispatch units [42]. The size of the global memory, L2 cache, constant memory and shared memory are 12 GB, 1.5 MB, 64 KB and 48 KB respectively.  \n\n", "text": "Issue bandwidth of the scheduler.\n\nEach SM has a large register file with a fixed number of registers assigned to each thread. The SM also has a shared L1 cache, and a shared memory region that is explicitly managed by the program. The device memory is connected to the chip using several high speed channels, resulting in bandwidths of several hundred gigabytes per second, but with a high latency. The impact of the latency is hidden partially using caches, but more importantly, the large number of warps/threads ensures the availability of ready warps to take up the available processing bandwidth when other warps are stalled waiting for memory. The memory is partitioned into global memory, constant memory and texture memory that are each shared among all SMs. They are also used to transfer data between the CPU and GPU. There is a shared L2 cache to provide faster access to memory. Each SM has its own on-chip shared memory, as well as several L1 caches for the instructions, global data, constant data and texture data. As a typical example, one of our target devices, the Nvidia Tesla K40C, includes 15 SMs, each featuring 192 single-precision CUDA cores. Each SM uses four warp schedulers and eight instruction dispatch units [42]. The size of the global memory, L2 cache, constant memory and shared memory are 12 GB, 1.5 MB, 64 KB and 48 KB respectively.\n", "alignment": "left", "unique_id": "70c792f91923a275b6691208f210f079", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Issue bandwidth of the scheduler."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Each SM has a large register file with a fixed number of registers assigned to each thread. The SM also has a shared L1 cache, and a shared memory region that is explicitly managed by the program. The device memory is connected to the chip using several high speed channels, resulting in bandwidths of several hundred gigabytes per second, but with a high latency. The impact of the latency is hidden partially using caches, but more importantly, the large number of warps/threads ensures the availability of ready warps to take up the available processing bandwidth when other warps are stalled waiting for memory. The memory is partitioned into global memory, constant memory and texture memory that are each shared among all SMs. They are also used to transfer data between the CPU and GPU. There is a shared L2 cache to provide faster access to memory. Each SM has its own on-chip shared memory, as well as several L1 caches for the instructions, global data, constant data and texture data. As a typical example, one of our target devices, the Nvidia Tesla K40C, includes 15 SMs, each featuring 192 single-precision CUDA cores. Each SM uses four warp schedulers and eight instruction dispatch units [42]. The size of the global memory, L2 cache, constant memory and shared memory are 12 GB, 1.5 MB, 64 KB and 48 KB respectively."}], "lineHeight": -530}}, "target": {"markdown": "调度器的发射带宽。\n\n每个 SM 都拥有一个容量较大的寄存器文件，为每个线程分配固定数量的寄存器。SM 还配备共享的 L1 缓存，以及由程序显式管理的共享内存区域。设备内存通过若干高速通道与芯片相连，可提供高达每秒数百吉字节的带宽，但访问延迟较高。延迟的影响通过缓存得到了一定程度的隐藏，但更为重要的是，大量的 warp/线程确保了当其他 warp 因等待内存而停滞时，仍有就绪 warp 可被调度以充分利用可用的处理带宽。内存被划分为全局内存、常量内存和纹理内存，所有 SM 共享这三类内存。这些内存同时也用于在 CPU 与 GPU 之间传输数据。此外还设有一个共享的 L2 缓存，以提供更快速的内存访问。每个 SM 拥有各自的片上共享内存，以及用于指令、全局数据、常量数据和纹理数据的若干个 L1 缓存。作为典型示例，我们的目标设备之一——Nvidia Tesla K40C——包含 15 个 SM，每个 SM 配备 192 个单精度 CUDA 核心。每个 SM 采用 4 个 warp 调度器和 8 个指令分派单元 [42]。其全局内存、L2 缓存、常量内存与共享内存的容量分别为 12 GB、1.5 MB、64 KB 和 48 KB。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "c75af7ae418e772f28939ac12c4545b4", "index": 34, "aliyun_index": 14, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The current generation of GPUs supports multiprogramming, or the ability to run multiple programs at the same time, through multiple streams with multi-kernel execution within the same process, or a multi-process service (MPS) [27], which allows concurrent kernels from different processes. MPS is already supported on GPUs with hardware queues such as the Hyper-Q support available on Kepler and newer microarchitecture generations from Nvidia. Multiprogramming is required for our threat model since the spy and the trojan are different programs that are trying to communicate indirectly while running concurrently on the same GPU. To provide a uniform implementation including Fermi GPUs, we utilized streams for multiprogramming on GPU. Recent research has shown that there are significant performance advantages to supporting multi-programming on GPUs [36, 41, 44]. For these reasons we believe that GPU manufacturers are moving to support multiprogramming; for example, it is supported by the Vulkan API which is intended to replace both graphics standards such as OpenGL and GPU compute standards such as CUDA [28].  \n\n", "text": "The current generation of GPUs supports multiprogramming, or the ability to run multiple programs at the same time, through multiple streams with multi-kernel execution within the same process, or a multi-process service (MPS) [27], which allows concurrent kernels from different processes. MPS is already supported on GPUs with hardware queues such as the Hyper-Q support available on Kepler and newer microarchitecture generations from Nvidia. Multiprogramming is required for our threat model since the spy and the trojan are different programs that are trying to communicate indirectly while running concurrently on the same GPU. To provide a uniform implementation including Fermi GPUs, we utilized streams for multiprogramming on GPU. Recent research has shown that there are significant performance advantages to supporting multi-programming on GPUs [36, 41, 44]. For these reasons we believe that GPU manufacturers are moving to support multiprogramming; for example, it is supported by the Vulkan API which is intended to replace both graphics standards such as OpenGL and GPU compute standards such as CUDA [28].\n", "alignment": "left", "unique_id": "c75af7ae418e772f28939ac12c4545b4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The current generation of GPUs supports multiprogramming, or the ability to run multiple programs at the same time, through multiple streams with multi-kernel execution within the same process, or a multi-process service (MPS) [27], which allows concurrent kernels from different processes. MPS is already supported on GPUs with hardware queues such as the Hyper-Q support available on Kepler and newer microarchitecture generations from Nvidia. Multiprogramming is required for our threat model since the spy and the trojan are different programs that are trying to communicate indirectly while running concurrently on the same GPU. To provide a uniform implementation including Fermi GPUs, we utilized streams for multiprogramming on GPU. Recent research has shown that there are significant performance advantages to supporting multi-programming on GPUs [36, 41, 44]. For these reasons we believe that GPU manufacturers are moving to support multiprogramming; for example, it is supported by the Vulkan API which is intended to replace both graphics standards such as OpenGL and GPU compute standards such as CUDA [28]."}], "lineHeight": 0}}, "target": {"markdown": "当代 GPU 通过多种流在同一进程内实现多内核执行，或通过多进程服务（MPS）[27] 来支持多程序运行，即同时运行多个程序的能力。MPS 允许来自不同进程的内核并发执行，已在配备硬件队列的 GPU 上得到支持，例如 Nvidia Kepler 及更新微架构所提供的 Hyper-Q。由于探针与木马是相互通信的不同程序，它们需在同一个 GPU 上并发运行，因此多程序运行是本文威胁模型的基础。为在包括 Fermi GPU 在内的平台上提供统一的实现，我们利用流（stream）在 GPU 上实现多程序运行。近期研究表明，在 GPU 上支持多程序运行具有显著的性能优势 [36, 41, 44]。基于这些原因，我们认为 GPU 制造商正逐步转向支持多程序运行；例如，旨在同时替代 OpenGL 等图形标准与 CUDA 等 GPU 计算标准的 Vulkan API 已原生支持多程序运行 [28]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "a24fc2f81a5ba212703e5b1a3ec56042", "index": 35, "aliyun_index": 15, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Our threat model consists of a standard covert communication\nscenario with a trojan and spy kernels from two different applications  \n\n", "text": "Our threat model consists of a standard covert communication\nscenario with a trojan and spy kernels from two different applications\n", "alignment": "left", "unique_id": "a24fc2f81a5ba212703e5b1a3ec56042", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our threat model consists of a standard covert communication"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "scenario with a trojan and spy kernels from two different applications"}], "lineHeight": -50}}, "target": {"markdown": "我们的威胁模型由一个标准的隐蔽通信场景构成，涉及来自两个不同应用的木马与探针内核", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "c34399618712be64e48de97604da06a0", "index": 36, "aliyun_index": 2, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![c34399618712be64e48de97604da06a0.jpg](figures/c34399618712be64e48de97604da06a0_2c7fd5a4.jpeg)  \n\n", "text": "+------------------+       +-------------------------------------+\n|                  |       |                                     |\n|   Host (CPU)     |<----->|           Device (GPU)              |\n|                  |       |                                     |\n+------------------+       +-------------------------------------+\n                           |                                     |\n                           |  +------+  +------+  ...  +------+  |\n                           |  | SMX 0|  | SMX 1|       | SMX n|  |\n                           |  +------+  +------+       +------+  |\n                           |        ↕         ↕             ↕    |\n                           |  +-------------------------------+  |\n                           |  |        Global Memory          |  |\n                           |  +-------------------------------+  |\n                           |  |        Constant Memory        |  |\n                           |  +-------------------------------+  |\n                           |  |        Texture Memory         |  |\n                           |  +-------------------------------+  |\n                           +-------------------------------------+\n\n+--------------------------------------------------+\n|                 Instruction Cache                |\n+--------------------------------------------------+\n|  Warp Scheduler   |   Warp Scheduler             |\n+-------------------+------------------------------+\n|  Dispatch Unit    |   Dispatch Unit              |\n+-------------------+------------------------------+\n|                   Register File                  |\n+--------------------------------------------------+\n| SP | SP | SP | DP | L/S | SFU                    |\n| SP | SP | SP | DP | L/S | SFU                    |\n| SP | SP | SP | DP | L/S | SFU                    |\n+--------------------------------------------------+\n|            Shared Memory / L1 Cache              |\n+--------------------------------------------------+\n\n\n\n### 组件说明：\n\n- **Instruction Cache**  \n  → 指令缓存，用于存储即将执行的指令。\n\n- **Warp Scheduler ×2**  \n  → 线程束调度器，负责调度 warp（线程束）执行。\n\n- **Dispatch Unit ×2**  \n  → 分发单元，将指令分发给执行单元。\n\n- **Register File**  \n  → 寄存器文件，供当前活跃线程快速访问局部变量。\n\n- **执行单元阵列（3行）**：\n  - `SP`：Single Precision（单精度浮点运算单元）\n  - `DP`：Double Precision（双精度浮点运算单元）\n  - `L/S`：Load/Store（加载/存储单元）\n  - `SFU`：Special Function Unit（特殊函数单元，如 sin, cos, log 等）\n\n- **Shared Memory / L1 Cache**  \n  → 共享内存兼作一级缓存，供同一 block 内线程高速共享数据。\n\n---\n\n## 图例与注释\n\n- 所有模块均以矩形框表示，颜色区分功能层级（灰色为主，绿色为调度相关）。\n- 双向箭头表示数据或控制信号的双向流动。\n- “...” 表示可扩展至任意数量的 SMX（SMX 0 ~ SMX n）。\n- 右侧放大图由左侧“SMX n”引出虚线指向，表示其为某个 SMX 的内部结构特写。\n\n---\n\n✅ 此 Markdown 文档完整还原了原图中的所有元素、布局逻辑与标注信息，适用于技术文档、教学材料或架构分析场景。", "alignment": "left", "unique_id": "c34399618712be64e48de97604da06a0", "edited": false, "extra": {}}, "target": {"markdown": "![c34399618712be64e48de97604da06a0.jpg](figures/c34399618712be64e48de97604da06a0_2c7fd5a4.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "0c28b8f60432edbd9d2bd17ffe97b227", "index": 37, "aliyun_index": 3, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 1: GPGPU architecture overview  \n\n", "text": "Figure 1: GPGPU architecture overview\n", "alignment": "left", "unique_id": "0c28b8f60432edbd9d2bd17ffe97b227", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1: GPGPU architecture overview"}], "lineHeight": 0}}, "target": {"markdown": "图 1：GPGPU 架构概览", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "ed20ed68ef9c2c3982ebf2af2319dc6e", "index": 38, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "that co-exist concurrently on the same GPU. The two kernels wish to communicate covertly. We consider a case where the trojan and the spy are the only two applications running on the GPU to characterize the bandwidth of the channels under the best case scenario. We later relax that assumption and explore approaches to prevent or tolerate noise from other applications. We assume that the two kernels can launch applications to the same GPGPU; in a cloud setting a first problem is to establish this ability. Since no standard sharing model of GPGPUs in the cloud has emerged, we do not focus on this problem [3, 8, 31, 34]. In most existing settings, the GPGPU is shared among applications on the same physical node, via I/O pass-through. In such settings, the problem boils down to achieving co-location on the same cloud node [35]. In the case of non-cloud scenarios, typically a GPGPU is also shared among applications on the same machine/device.  \n\n", "text": "that co-exist concurrently on the same GPU. The two kernels wish to communicate covertly. We consider a case where the trojan and the spy are the only two applications running on the GPU to characterize the bandwidth of the channels under the best case scenario. We later relax that assumption and explore approaches to prevent or tolerate noise from other applications. We assume that the two kernels can launch applications to the same GPGPU; in a cloud setting a first problem is to establish this ability. Since no standard sharing model of GPGPUs in the cloud has emerged, we do not focus on this problem [3, 8, 31, 34]. In most existing settings, the GPGPU is shared among applications on the same physical node, via I/O pass-through. In such settings, the problem boils down to achieving co-location on the same cloud node [35]. In the case of non-cloud scenarios, typically a GPGPU is also shared among applications on the same machine/device.\n", "alignment": "left", "unique_id": "ed20ed68ef9c2c3982ebf2af2319dc6e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "that co-exist concurrently on the same GPU. The two kernels wish to communicate covertly. We consider a case where the trojan and the spy are the only two applications running on the GPU to characterize the bandwidth of the channels under the best case scenario. We later relax that assumption and explore approaches to prevent or tolerate noise from other applications. We assume that the two kernels can launch applications to the same GPGPU; in a cloud setting a first problem is to establish this ability. Since no standard sharing model of GPGPUs in the cloud has emerged, we do not focus on this problem [3, 8, 31, 34]. In most existing settings, the GPGPU is shared among applications on the same physical node, via I/O pass-through. In such settings, the problem boils down to achieving co-location on the same cloud node [35]. In the case of non-cloud scenarios, typically a GPGPU is also shared among applications on the same machine/device."}], "lineHeight": 0}}, "target": {"markdown": "它们共存于同一 GPU 上并并发运行。两个内核希望进行隐蔽通信。我们考虑这样一种情形：木马与探针是 GPU 上唯一运行的两个应用，以便在最佳场景下刻画信道的带宽。随后，我们将放宽这一假设，并探讨防止或容忍来自其他应用噪声的方法。我们假设这两个内核能够将各自的应用启动到同一 GPGPU 上；在云环境中，首先需要具备这种能力。由于云中尚未形成标准的 GPGPU 共享模型，我们并不聚焦于该问题 [3, 8, 31, 34]。在现有的大多数场景中，GPGPU 通过 I/O 直通方式在同一物理节点上的多个应用之间共享。在此类场景中，问题便归结为如何在同一云节点上实现共驻留 [35]。在非云场景下，通常 GPGPU 同样在同一机器/设备的多个应用之间共享。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "a07f2787f76bd53b82e537ef2ff7bf69", "index": 39, "aliyun_index": 5, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## 3 ESTABLISHING CO-LOCATION\n", "text": "3 ESTABLISHING CO-LOCATION\n", "alignment": "left", "unique_id": "a07f2787f76bd53b82e537ef2ff7bf69", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3 ESTABLISHING CO-LOCATION"}], "lineHeight": 0}}, "target": {"markdown": "## 3 建立共驻留\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "9c8ff35c0925d85dda0041177c6a5a7d", "index": 40, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Our goal is to create covert channels through contention on shared hardware resources in the GPGPU. As a first step, we need to control the placement of concurrent applications –in our case, the trojan and the spy. The placement defines what resources the applications share and therefore what covert channels are available for use. In this section, we show how to establish co-location as the first step in constructing covert channels. In particular, we reverse engineer the block assignment algorithm on real GPUs and show how to exploit it to establish co-location. It is likely that future GPGPUs may use alternative placement algorithms; however, we believe that the reverse engineering approach we use can be used for not only Nvidia GPUs, but also a large class of placement algorithms that are both deterministic and do not use preemption. We support this claim by considering the scheduling algorithms for other multiprogrammed GPUs that were recently proposed in literature [41, 44].  \n\n", "text": "Our goal is to create covert channels through contention on shared hardware resources in the GPGPU. As a first step, we need to control the placement of concurrent applications –in our case, the trojan and the spy. The placement defines what resources the applications share and therefore what covert channels are available for use. In this section, we show how to establish co-location as the first step in constructing covert channels. In particular, we reverse engineer the block assignment algorithm on real GPUs and show how to exploit it to establish co-location. It is likely that future GPGPUs may use alternative placement algorithms; however, we believe that the reverse engineering approach we use can be used for not only Nvidia GPUs, but also a large class of placement algorithms that are both deterministic and do not use preemption. We support this claim by considering the scheduling algorithms for other multiprogrammed GPUs that were recently proposed in literature [41, 44].\n", "alignment": "left", "unique_id": "9c8ff35c0925d85dda0041177c6a5a7d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our goal is to create covert channels through contention on shared hardware resources in the GPGPU. As a first step, we need to control the placement of concurrent applications –in our case, the trojan and the spy. The placement defines what resources the applications share and therefore what covert channels are available for use. In this section, we show how to establish co-location as the first step in constructing covert channels. In particular, we reverse engineer the block assignment algorithm on real GPUs and show how to exploit it to establish co-location. It is likely that future GPGPUs may use alternative placement algorithms; however, we believe that the reverse engineering approach we use can be used for not only Nvidia GPUs, but also a large class of placement algorithms that are both deterministic and do not use preemption. We support this claim by considering the scheduling algorithms for other multiprogrammed GPUs that were recently proposed in literature [41, 44]."}], "lineHeight": 0}}, "target": {"markdown": "我们的目标是通过 GPGPU 中共享硬件资源上的争用构建隐蔽信道。作为第一步，我们需要控制并发应用的放置位置——在本例中即木马与探针。放置位置决定了应用之间共享哪些资源，从而决定了可供使用的隐蔽信道。本节将展示如何建立共驻留，作为构建隐蔽信道的第一步。具体而言，我们对真实 GPU 上的线程块分配算法进行逆向工程，并展示如何利用该算法建立共驻留。未来的 GPGPU 可能会采用其他放置算法；然而，我们相信本文所采用的逆向工程方法不仅适用于 Nvidia GPU，也可适用于一大类既确定又不使用抢占机制的放置算法。我们通过对近期文献中提出的其他多程序 GPU 调度算法 [41, 44] 的分析来支持这一观点。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "1b721c63e1287208c4f276021b97b99d", "index": 41, "aliyun_index": 7, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 3.1 Co-location on existing GPGPUs\n", "text": "3.1 Co-location on existing GPGPUs\n", "alignment": "left", "unique_id": "1b721c63e1287208c4f276021b97b99d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.1 Co-location on existing GPGPUs"}], "lineHeight": 0}}, "target": {"markdown": "### 3.1 现有 GPGPU 上的共驻留\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "a97123618fbc28b3c927d4d96471f547", "index": 42, "aliyun_index": 8, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The Nvidia thread block assignment and kernel co-location algorithms are unpublished; thus, it is necessary to reverse engineer the placement algorithm. First, we explore whether blocks belonging to two kernels can be co-located on the same SM. We launch two kernels on different streams. In each kernel, we read the SM ID register (smid) for each block to determine the ID of the SM on  \n\n", "text": "The Nvidia thread block assignment and kernel co-location algorithms are unpublished; thus, it is necessary to reverse engineer the placement algorithm. First, we explore whether blocks belonging to two kernels can be co-located on the same SM. We launch two kernels on different streams. In each kernel, we read the SM ID register (smid) for each block to determine the ID of the SM on\n", "alignment": "left", "unique_id": "a97123618fbc28b3c927d4d96471f547", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The Nvidia thread block assignment and kernel co-location algorithms are unpublished; thus, it is necessary to reverse engineer the placement algorithm. First, we explore whether blocks belonging to two kernels can be co-located on the same SM. We launch two kernels on different streams. In each kernel, we read the SM ID register (smid) for each block to determine the ID of the SM on"}], "lineHeight": 0}}, "target": {"markdown": "Nvidia 的线程块分配与内核共驻留算法并未公开，因此有必要对放置算法进行逆向工程。首先，我们探讨属于两个不同内核的线程块能否共驻于同一 SM 上。我们在不同的流上启动两个内核。在每个内核中，我们读取每个线程块的 SM ID 寄存器（smid），以确定该块所在 SM 的 ID，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "7e346c9138806d401d2a0a58ef65814a", "index": 43, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "which the kernel is running. In addition, we use the clock() function to measure the start time and stop time of each block. By using this information, and repeating the experiment for different numbers and configurations of blocks, we reverse engineered the placement algorithm.  \n\n", "text": "which the kernel is running. In addition, we use the clock() function to measure the start time and stop time of each block. By using this information, and repeating the experiment for different numbers and configurations of blocks, we reverse engineered the placement algorithm.\n", "alignment": "left", "unique_id": "7e346c9138806d401d2a0a58ef65814a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "which the kernel is running. In addition, we use the clock() function to measure the start time and stop time of each block. By using this information, and repeating the experiment for different numbers and configurations of blocks, we reverse engineered the placement algorithm."}], "lineHeight": 0}}, "target": {"markdown": "以确定其所在 SM 的 ID。此外，我们使用 clock() 函数测量每个线程块的开始时间与结束时间。通过利用这些信息，并对不同数量与配置的线程块重复实验，我们成功对放置算法进行了逆向工程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "f53a70b2884ad2859b2f9035cf39fc51", "index": 44, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We found that the blocks for the first kernel are assigned to different SMs in a mostly round-robin manner. If there are SMs that are idle, or that have a leftover capacity, they can be used for blocks of the second kernel, again in a mostly round-robin assignment. Otherwise, the blocks of the second kernel are queued until at least one SM is released. Therefore, if each kernel is launched with a number of blocks equal to or exceeding the number of SMs on the device, such that each block does not exhaust the resources of the SM, they achieve co-residency within an SM. This multiprogramming mechanism on current GPUs is called the Leftover policy.  \n\n", "text": "We found that the blocks for the first kernel are assigned to different SMs in a mostly round-robin manner. If there are SMs that are idle, or that have a leftover capacity, they can be used for blocks of the second kernel, again in a mostly round-robin assignment. Otherwise, the blocks of the second kernel are queued until at least one SM is released. Therefore, if each kernel is launched with a number of blocks equal to or exceeding the number of SMs on the device, such that each block does not exhaust the resources of the SM, they achieve co-residency within an SM. This multiprogramming mechanism on current GPUs is called the Leftover policy.\n", "alignment": "left", "unique_id": "f53a70b2884ad2859b2f9035cf39fc51", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We found that the blocks for the first kernel are assigned to different SMs in a mostly round-robin manner. If there are SMs that are idle, or that have a leftover capacity, they can be used for blocks of the second kernel, again in a mostly round-robin assignment. Otherwise, the blocks of the second kernel are queued until at least one SM is released. Therefore, if each kernel is launched with a number of blocks equal to or exceeding the number of SMs on the device, such that each block does not exhaust the resources of the SM, they achieve co-residency within an SM. This multiprogramming mechanism on current GPUs is called the Leftover policy."}], "lineHeight": 0}}, "target": {"markdown": "我们发现，第一个内核的线程块以大致轮询的方式被分配到各个不同的 SM 上。若存在空闲的 SM，或具有剩余容量的 SM，则可用于分配第二个内核的线程块，仍采用大致轮询的分配方式。否则，第二个内核的线程块将进入队列，直到至少有一个 SM 被释放。因此，如果每个内核启动时所分配的线程块数量不少于设备上的 SM 数量，且每个线程块不会耗尽所在 SM 的资源，那么它们即可实现同一 SM 内的共驻留。当前 GPU 上的这种多程序运行机制被称为\"剩余策略\"（Leftover policy）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "1c852afcbc4fac7bcd67b0c984d7d00f", "index": 45, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We also discovered that there is another level of sharing within the SM that impacts the contention behavior. In particular, on many GPGPUs, there are a number of warp schedulers available on each SM. Each warp is associated with one of these warp schedulers. If different warps share the same scheduler, we show that their contention behavior is different since the warps on the same scheduler compete for the issue bandwidth that is assigned to the scheduler.  \n\n", "text": "We also discovered that there is another level of sharing within the SM that impacts the contention behavior. In particular, on many GPGPUs, there are a number of warp schedulers available on each SM. Each warp is associated with one of these warp schedulers. If different warps share the same scheduler, we show that their contention behavior is different since the warps on the same scheduler compete for the issue bandwidth that is assigned to the scheduler.\n", "alignment": "left", "unique_id": "1c852afcbc4fac7bcd67b0c984d7d00f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We also discovered that there is another level of sharing within the SM that impacts the contention behavior. In particular, on many GPGPUs, there are a number of warp schedulers available on each SM. Each warp is associated with one of these warp schedulers. If different warps share the same scheduler, we show that their contention behavior is different since the warps on the same scheduler compete for the issue bandwidth that is assigned to the scheduler."}], "lineHeight": 0}}, "target": {"markdown": "我们还发现，SM 内部还存在另一种层次的共享，它会影响争用行为。具体而言，在许多 GPGPU 上，每个 SM 都配备了若干个 warp 调度器。每个 warp 与其中一个 warp 调度器相关联。如果不同的 warp 共用同一个调度器，其争用行为会有所不同，因为同一调度器上的 warp 会竞争该调度器所分得的发射带宽。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "af0101c1f2524e0ea610f1a14e33139e", "index": 46, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We experimented with the assignment algorithm of warps to warp schedulers and discovered that it is also round robin. With this knowledge, the spy and the trojan can set up their kernel parameters to achieve co-location on the same SM and if desired on the same warp scheduler. For example, on the Tesla K40C, with 15 SMs and 4 warp schedulers, if each of the spy and the trojan launch a kernel with 15 blocks each using 4 warps (i.e., 128 threads), they will each have a warp on each of the warp schedulers of each of the 15 SMs on the GPGPU.  \n\n", "text": "We experimented with the assignment algorithm of warps to warp schedulers and discovered that it is also round robin. With this knowledge, the spy and the trojan can set up their kernel parameters to achieve co-location on the same SM and if desired on the same warp scheduler. For example, on the Tesla K40C, with 15 SMs and 4 warp schedulers, if each of the spy and the trojan launch a kernel with 15 blocks each using 4 warps (i.e., 128 threads), they will each have a warp on each of the warp schedulers of each of the 15 SMs on the GPGPU.\n", "alignment": "left", "unique_id": "af0101c1f2524e0ea610f1a14e33139e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We experimented with the assignment algorithm of warps to warp schedulers and discovered that it is also round robin. With this knowledge, the spy and the trojan can set up their kernel parameters to achieve co-location on the same SM and if desired on the same warp scheduler. For example, on the Tesla K40C, with 15 SMs and 4 warp schedulers, if each of the spy and the trojan launch a kernel with 15 blocks each using 4 warps (i.e., 128 threads), they will each have a warp on each of the warp schedulers of each of the 15 SMs on the GPGPU."}], "lineHeight": 0}}, "target": {"markdown": "我们对 warp 到 warp 调度器的分配算法进行了实验，发现其同样采用轮询方式。借助这一知识，探针与木马可以设置其内核参数，以实现同一 SM 上的共驻留，并在需要时进一步实现同一 warp 调度器上的共驻留。例如，在配备 15 个 SM 和 4 个 warp 调度器的 Tesla K40C 上，若探针与木马各自启动一个包含 15 个线程块、每个块使用 4 个 warp（即 128 个线程）的内核，则它们在该 GPGPU 的 15 个 SM 中、每个 SM 的每个 warp 调度器上都将各占据一个 warp。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "5dc4ce7ee4c37fd08c6f6c5419c6541a", "index": 47, "aliyun_index": 13, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 3.2 Co-location on other GP GPUs\n", "text": "3.2 Co-location on other GP GPUs\n", "alignment": "left", "unique_id": "5dc4ce7ee4c37fd08c6f6c5419c6541a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.2 Co-location on other GP GPUs"}], "lineHeight": 0}}, "target": {"markdown": "### 3.2 其他 GPGPU 上的共驻留\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "e8a35fbf1853551006570dae06804a09", "index": 48, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The left-over policy allows co-location of kernels opportunistically. Recent papers [41, 44] improve multiprogramming on GPUs using intra-SM resource partitioning that execute multiple kernels to more effectively utilize the GPU. We believe that this approach of varying the configuration of launched kernels and observing how they are scheduled can be used to reverse engineer any deterministic and non-preemptive co-location algorithm. In this section, we consider the co-location problem relative to these proposed schedulers.  \n\n", "text": "The left-over policy allows co-location of kernels opportunistically. Recent papers [41, 44] improve multiprogramming on GPUs using intra-SM resource partitioning that execute multiple kernels to more effectively utilize the GPU. We believe that this approach of varying the configuration of launched kernels and observing how they are scheduled can be used to reverse engineer any deterministic and non-preemptive co-location algorithm. In this section, we consider the co-location problem relative to these proposed schedulers.\n", "alignment": "left", "unique_id": "e8a35fbf1853551006570dae06804a09", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The left-over policy allows co-location of kernels opportunistically. Recent papers [41, 44] improve multiprogramming on GPUs using intra-SM resource partitioning that execute multiple kernels to more effectively utilize the GPU. We believe that this approach of varying the configuration of launched kernels and observing how they are scheduled can be used to reverse engineer any deterministic and non-preemptive co-location algorithm. In this section, we consider the co-location problem relative to these proposed schedulers."}], "lineHeight": 0}}, "target": {"markdown": "\"剩余策略\"（Left-over policy）允许以机会主义方式实现内核的共驻留。近期文献 [41, 44] 通过 SM 内资源划分来改进 GPU 上的多程序执行，使得多个内核能够更高效地利用 GPU。我们相信，这种通过改变所启动内核的配置并观察其调度行为的方法，可用于对任何确定性的、非抢占式的共驻留算法进行逆向工程。本节将针对这些所提出的调度器讨论共驻留问题。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "45b44473266f56a872d94e698f47c789", "index": 49, "aliyun_index": 15, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Wang et al. [41] support a simultaneous multi-kernel by fine grained context switching at the granularity of thread block. To schedule thread blocks of the new kernel to an SM, those thread blocks of previously scheduled kernels that have the highest resource usage on the victim SM may be preempted. Thus, this scheduler makes co-location easier by allowing the spy and the trojan to reside on the same SM even if other applications are already running there. By using just one thread block for each spy and trojan on each SM, the spy and trojan will be guaranteed not to be preempted. However, the co-location of other workloads on the same SM possibly adds noise to the covert channel. We discuss this issue in Section 8.  \n\n", "text": "Wang et al. [41] support a simultaneous multi-kernel by fine grained context switching at the granularity of thread block. To schedule thread blocks of the new kernel to an SM, those thread blocks of previously scheduled kernels that have the highest resource usage on the victim SM may be preempted. Thus, this scheduler makes co-location easier by allowing the spy and the trojan to reside on the same SM even if other applications are already running there. By using just one thread block for each spy and trojan on each SM, the spy and trojan will be guaranteed not to be preempted. However, the co-location of other workloads on the same SM possibly adds noise to the covert channel. We discuss this issue in Section 8.\n", "alignment": "left", "unique_id": "45b44473266f56a872d94e698f47c789", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Wang et al. [41] support a simultaneous multi-kernel by fine grained context switching at the granularity of thread block. To schedule thread blocks of the new kernel to an SM, those thread blocks of previously scheduled kernels that have the highest resource usage on the victim SM may be preempted. Thus, this scheduler makes co-location easier by allowing the spy and the trojan to reside on the same SM even if other applications are already running there. By using just one thread block for each spy and trojan on each SM, the spy and trojan will be guaranteed not to be preempted. However, the co-location of other workloads on the same SM possibly adds noise to the covert channel. We discuss this issue in Section 8."}], "lineHeight": 0}}, "target": {"markdown": "Wang 等人 [41] 通过在线程块粒度上进行细粒度的上下文切换来支持多内核同时执行。为了将新内核的线程块调度到某个 SM 上，先前已调度内核中在该受害 SM 上资源占用最高的线程块可能会被抢占。因此，该调度器通过允许探针与木马即使在 SM 上已有其他应用运行时仍可共驻于同一 SM 上，从而使共驻留变得更加容易。通过在每个 SM 上为探针与木马各仅使用一个线程块，即可保证它们不会被抢占。然而，同一 SM 上其他工作负载的共驻留可能会给隐蔽信道引入噪声。我们将在第 8 节讨论这一问题。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "ede129cbf38556f7a23e80f5cecd8c13", "index": 50, "aliyun_index": 16, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Xu et al. [44] propose a dynamic intra-SM resource partitioning that does not use preemption. Intra-SM partitioning attempts to co-schedule kernels that are compatible in their resource usage to the same SM. Since this multiprogramming scheme does not use  \n\n", "text": "Xu et al. [44] propose a dynamic intra-SM resource partitioning that does not use preemption. Intra-SM partitioning attempts to co-schedule kernels that are compatible in their resource usage to the same SM. Since this multiprogramming scheme does not use\n", "alignment": "left", "unique_id": "ede129cbf38556f7a23e80f5cecd8c13", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Xu et al. [44] propose a dynamic intra-SM resource partitioning that does not use preemption. Intra-SM partitioning attempts to co-schedule kernels that are compatible in their resource usage to the same SM. Since this multiprogramming scheme does not use"}], "lineHeight": 0}}, "target": {"markdown": "Xu 等人 [44] 提出了一种不使用抢占机制的 SM 内动态资源划分方案。SM 内划分试图将资源使用相互兼容的内核共同调度到同一 SM 上。由于该多程序执行方案不使用", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "3c70100bedd1014542dfd0473f309afe", "index": 51, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "preemption, we can force exclusive co-location of the two kernels by\nmanipulating their initial behavior so that the scheduler finds them\ncompatible.  \n\n", "text": "preemption, we can force exclusive co-location of the two kernels by\nmanipulating their initial behavior so that the scheduler finds them\ncompatible.\n", "alignment": "left", "unique_id": "3c70100bedd1014542dfd0473f309afe", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "preemption, we can force exclusive co-location of the two kernels by"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "manipulating their initial behavior so that the scheduler finds them"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compatible."}], "lineHeight": -75}}, "target": {"markdown": "抢占机制，因此我们可以通过操纵两个内核的初始行为，使调度器判定它们彼此兼容，从而强制实现两个内核的独占共驻留。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "bdfa338f6a015250194d2fe111c87203", "index": 52, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "We also consider a case where the two kernels cannot be co-located on the same SM, for example, in cases where there is no leftover capacity on the SMs used by the first kernel. In this case, covert communication is still possible through contention on resources that are shared between all SMs such as global memory or the L2 cache. This inter-SM covert channels can also be applied to some proposed GPU multiprogramming which allows executing multiple kernels only on disjoint sets of SMs on GPUs (i.e., no intra-SM scheduling). For example, Adriaens et al. [1] use inter-SM resource partitioning. Similarly, Tanasic et al. [36] propose kernel allocation at the granularity of the whole SM to support multiprogramming. It is likely that these multiprogramming mechanisms are not as efficient as intra-SM resource partitioning, due to the limited number of SMs and large overhead of context switching on GPUs. Moreover, multiprogramming at the granularity of the full SM cannot address resource under-utilization occurring within an SM.  \n\n", "text": "We also consider a case where the two kernels cannot be co-located on the same SM, for example, in cases where there is no leftover capacity on the SMs used by the first kernel. In this case, covert communication is still possible through contention on resources that are shared between all SMs such as global memory or the L2 cache. This inter-SM covert channels can also be applied to some proposed GPU multiprogramming which allows executing multiple kernels only on disjoint sets of SMs on GPUs (i.e., no intra-SM scheduling). For example, Adriaens et al. [1] use inter-SM resource partitioning. Similarly, Tanasic et al. [36] propose kernel allocation at the granularity of the whole SM to support multiprogramming. It is likely that these multiprogramming mechanisms are not as efficient as intra-SM resource partitioning, due to the limited number of SMs and large overhead of context switching on GPUs. Moreover, multiprogramming at the granularity of the full SM cannot address resource under-utilization occurring within an SM.\n", "alignment": "left", "unique_id": "bdfa338f6a015250194d2fe111c87203", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We also consider a case where the two kernels cannot be co-located on the same SM, for example, in cases where there is no leftover capacity on the SMs used by the first kernel. In this case, covert communication is still possible through contention on resources that are shared between all SMs such as global memory or the L2 cache. This inter-SM covert channels can also be applied to some proposed GPU multiprogramming which allows executing multiple kernels only on disjoint sets of SMs on GPUs (i.e., no intra-SM scheduling). For example, Adriaens et al. [1] use inter-SM resource partitioning. Similarly, Tanasic et al. [36] propose kernel allocation at the granularity of the whole SM to support multiprogramming. It is likely that these multiprogramming mechanisms are not as efficient as intra-SM resource partitioning, due to the limited number of SMs and large overhead of context switching on GPUs. Moreover, multiprogramming at the granularity of the full SM cannot address resource under-utilization occurring within an SM."}], "lineHeight": 0}}, "target": {"markdown": "我们还考虑了两个内核无法在同一 SM 上共驻留的情形，例如在第一个内核所使用的 SM 上没有剩余容量时。在这种情况下，仍可通过在所有 SM 之间共享的资源（如全局内存或 L2 缓存）上的争用进行隐蔽通信。这种跨 SM 的隐蔽信道同样适用于一些所提出的 GPU 多程序执行方案，这些方案仅允许在内核间使用 GPU 上互不相交的 SM 集合（即不进行 SM 内调度）。例如，Adriaens 等人 [1] 即采用了跨 SM 的资源划分方法。同样，Tanasic 等人 [36] 提出以整个 SM 为粒度进行内核分配以支持多程序执行。由于 SM 数量有限，且 GPU 上上下文切换的开销较大，这些多程序执行机制很可能不如 SM 内资源划分那样高效。此外，以整个 SM 为粒度的多程序执行无法解决 SM 内部出现的资源利用不足问题。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "dfa617c36138117a5cc6d6199a25836e", "index": 53, "aliyun_index": 4, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "## 4 CACHE COVERT CHANNELS\n", "text": "4 CACHE COVERT CHANNELS\n", "alignment": "left", "unique_id": "dfa617c36138117a5cc6d6199a25836e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4 CACHE COVERT CHANNELS"}], "lineHeight": 0}}, "target": {"markdown": "## 4 缓存隐蔽信道\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "346cfe231111a9d2b1b3c6ed50b02749", "index": 54, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "In this section, we present the first of three classes of covert channels we investigate in the paper: covert channels through the caches. We illustrate the principles using constant caches, but the attack applies to other caches on the system. We selected constant memory because the size of both the L1 and L2 caches is small allowing us to create contention easily.  \n\n", "text": "In this section, we present the first of three classes of covert channels we investigate in the paper: covert channels through the caches. We illustrate the principles using constant caches, but the attack applies to other caches on the system. We selected constant memory because the size of both the L1 and L2 caches is small allowing us to create contention easily.\n", "alignment": "left", "unique_id": "346cfe231111a9d2b1b3c6ed50b02749", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section, we present the first of three classes of covert channels we investigate in the paper: covert channels through the caches. We illustrate the principles using constant caches, but the attack applies to other caches on the system. We selected constant memory because the size of both the L1 and L2 caches is small allowing us to create contention easily."}], "lineHeight": 0}}, "target": {"markdown": "本节将介绍本文所研究的三类隐蔽信道中的第一类：基于缓存的隐蔽信道。我们将以常量缓存为例阐述其原理，但该攻击同样适用于系统中的其他缓存。我们选用常量存储器作为研究对象，是因为其 L1 和 L2 缓存的容量均较小，便于构造争用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "e01c509141a9e071bfd21343c8493051", "index": 55, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The attack proceeds in two steps. First, an offline step uses the microbenchmarking approach introduced by Wong et al. [43] to infer the constant memory and cache characteristics at each level of the hierarchy. The second step is the communication step where we use contention to create the covert channel.  \n\n", "text": "The attack proceeds in two steps. First, an offline step uses the microbenchmarking approach introduced by Wong et al. [43] to infer the constant memory and cache characteristics at each level of the hierarchy. The second step is the communication step where we use contention to create the covert channel.\n", "alignment": "left", "unique_id": "e01c509141a9e071bfd21343c8493051", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The attack proceeds in two steps. First, an offline step uses the microbenchmarking approach introduced by Wong et al. [43] to infer the constant memory and cache characteristics at each level of the hierarchy. The second step is the communication step where we use contention to create the covert channel."}], "lineHeight": 0}}, "target": {"markdown": "该攻击分两个步骤进行。第一步是离线阶段，采用 Wong 等人 [43] 提出的微基准测试方法，推断各层次结构中常量存储器及缓存的特性。第二步为通信阶段，利用争用机制构建隐蔽信道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "e692d881a9c035ffab7c9cb486c3be6a", "index": 56, "aliyun_index": 7, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### 4.1 Attack Step I: Offline Characterization of Constant Memory Hierarchy\n", "text": "4.1 Attack Step I: Offline Characterization of Constant Memory Hierarchy\n", "alignment": "left", "unique_id": "e692d881a9c035ffab7c9cb486c3be6a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.1 Attack Step I: Offline Characterization of Constant Memory Hierarchy"}], "lineHeight": 0}}, "target": {"markdown": "### 4.1 攻击步骤一：常量存储器层次结构的离线特征化\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "95cfe15ebd500fb50d75bb7b9c85cdd9", "index": 57, "aliyun_index": 8, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The parameters of the constant memory hierarchy at each level of the cache hierarchy can be extracted from latency measurement of loading different size arrays from constant memory using a strided access pattern. The cache is first warmed by accessing the array, which is subsequently accessed again while timing the accesses [43]. The size of the array is increased and the access latency observed.  \n\n", "text": "The parameters of the constant memory hierarchy at each level of the cache hierarchy can be extracted from latency measurement of loading different size arrays from constant memory using a strided access pattern. The cache is first warmed by accessing the array, which is subsequently accessed again while timing the accesses [43]. The size of the array is increased and the access latency observed.\n", "alignment": "left", "unique_id": "95cfe15ebd500fb50d75bb7b9c85cdd9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The parameters of the constant memory hierarchy at each level of the cache hierarchy can be extracted from latency measurement of loading different size arrays from constant memory using a strided access pattern. The cache is first warmed by accessing the array, which is subsequently accessed again while timing the accesses [43]. The size of the array is increased and the access latency observed."}], "lineHeight": 0}}, "target": {"markdown": "可以通过使用跨步访问模式从常量存储器加载不同大小的数组并测量其延迟，从而提取缓存层次结构中每一级常量存储器层次结构的参数。首先通过访问该数组来\"预热\"缓存，随后再次访问该数组并对访问过程计时 [43]。不断增大数组的规模，并观察访问延迟的变化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "1353ce6481a0c85a517b941a30c86a27", "index": 58, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Figure 2 and Figure 3 show the latency measurements for the L1 cache and L2 cache respectively on the Kepler Tesla K40C GPU. Each point on the figure represents an experiment with the array size shown on the x-axis. While the latency remains constant, the array fits in cache. When the array spills out of the cache, the latency starts increasing. First, the spill causes misses only in one set. As we keep increasing the array size, spills in additional sets occur: the number of steps in the figure is equal to the number of cache sets. The cache line size corresponds to the width of each step. From the cache size, number of cache sets and cache line size, we can calculate the cache associativity. For example, for the Kepler (Tesla K40) and Maxwell (Quadro M4000) GPUs we find that the constant memory L1 cache is 2kB, 4-way set associative with 64 byte cache line, while the L2 cache is 32kB 8-way set associative with 256 byte cache line. In  \n\n", "text": "Figure 2 and Figure 3 show the latency measurements for the L1 cache and L2 cache respectively on the Kepler Tesla K40C GPU. Each point on the figure represents an experiment with the array size shown on the x-axis. While the latency remains constant, the array fits in cache. When the array spills out of the cache, the latency starts increasing. First, the spill causes misses only in one set. As we keep increasing the array size, spills in additional sets occur: the number of steps in the figure is equal to the number of cache sets. The cache line size corresponds to the width of each step. From the cache size, number of cache sets and cache line size, we can calculate the cache associativity. For example, for the Kepler (Tesla K40) and Maxwell (Quadro M4000) GPUs we find that the constant memory L1 cache is 2kB, 4-way set associative with 64 byte cache line, while the L2 cache is 32kB 8-way set associative with 256 byte cache line. In\n", "alignment": "left", "unique_id": "1353ce6481a0c85a517b941a30c86a27", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2 and Figure 3 show the latency measurements for the L1 cache and L2 cache respectively on the Kepler Tesla K40C GPU. Each point on the figure represents an experiment with the array size shown on the x-axis. While the latency remains constant, the array fits in cache. When the array spills out of the cache, the latency starts increasing. First, the spill causes misses only in one set. As we keep increasing the array size, spills in additional sets occur: the number of steps in the figure is equal to the number of cache sets. The cache line size corresponds to the width of each step. From the cache size, number of cache sets and cache line size, we can calculate the cache associativity. For example, for the Kepler (Tesla K40) and Maxwell (Quadro M4000) GPUs we find that the constant memory L1 cache is 2kB, 4-way set associative with 64 byte cache line, while the L2 cache is 32kB 8-way set associative with 256 byte cache line. In"}], "lineHeight": 0}}, "target": {"markdown": "图 2 和图 3 分别展示了在 Kepler Tesla K40C GPU 上针对 L1 缓存和 L2 缓存所测得的访问延迟。图中每个点对应一次实验，其横坐标表示所使用数组的大小。当访问延迟保持不变时，表明该数组仍可容纳于缓存之中；而一旦数组大小超出缓存容量，访问延迟便会开始上升。最初，溢出现象仅发生在某一个缓存组（set）中；随着数组规模的进一步增大，额外的缓存组也将发生溢出——图中阶梯状曲线的阶数即等于缓存组的数量。每个阶梯的宽度则对应于缓存行（cache line）的大小。依据缓存总容量、缓存组数以及缓存行大小，便可计算出缓存的相联度。例如，对于 Kepler（Tesla K40）和 Maxwell（Quadro M4000）两款 GPU，我们发现其常量存储器 L1 缓存大小为 2 kB，采用 4 路组相联，缓存行大小为 64 字节；而其 L2 缓存大小为 32 kB，采用 8 路组相联，缓存行大小为 256 字节。在", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "5235125d8a9e5fb6e093a67481f533b5", "index": 59, "aliyun_index": 10, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "the Fermi (Tesla C2075) GPU, constant memory L1 cache is 4kB,\n4-way set associative with 64 byte cache line and L2 cache has the\nsame parameters as in Kepler and Maxwell.  \n\n", "text": "the Fermi (
