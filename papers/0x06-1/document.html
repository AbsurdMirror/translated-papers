sts)\n\n### Functional Units Per Row (x2 rows shown)\n\n| Position | Unit Type | Count per Row | Total Shown (2 rows) |\n|----------|-----------|---------------|----------------------|\n| 1–6      | SP        | 6             | 12                   |\n| 7–8      | DP        | 2             | 4                    |\n| 9        | sfu       | 1             | 2                    |\n| 10–11    | L/S       | 2             | 4                    |\n| **Total per row** |           | **11**        | **22**               |\n\n> Note: “192 Cuda Cores” likely includes many such SMs; this diagram may show one SM with 24 cores (if 11×2=22 ≈ 24?), or scaled differently. We do not infer beyond diagram.\n\n---\n\n### Control Hierarchy (Per Row Grouping)\n\nAssuming top row represents control structure applied to both rows:\n\n```mermaid\ngraph TD\n    A[Instruction Cache] --> B[Warp Scheduler 1]\n    A --> C[Warp Scheduler 2]\n    A --> D[Warp Scheduler 3]\n\n    B --> E[Dispatch Unit 1]\n    B --> F[Dispatch Unit 2]\n    C --> G[Dispatch Unit 3]\n    C --> H[Dispatch Unit 4]\n    D --> I[Dispatch Unit 5]\n    D --> J[Dispatch Unit 6]\n\n    E --> K[SP]\n    E --> L[SP]\n    F --> M[SP]\n    F --> N[SP]\n    G --> O[SP]\n    G --> P[SP]\n    H --> Q[DP]\n    H --> R[DP]\n    I --> S[sfu]\n    J --> T[L/S]\n    J --> U[L/S]\n\n    %% Connections to memory/register file omitted for clarity in mermaid, but described above\n```\n\n*(Note: Mermaid code provided for visualization if rendered; otherwise, textual description suffices.)*\n\n---\n\n## Conclusion\n\nThis diagram illustrates the internal organization of a NVIDIA GPU Streaming Multiprocessor (SM), featuring:\n\n- Hierarchical instruction dispatch via Warp Schedulers → Dispatch Units → Execution Units.\n- Multiple execution unit types: Single Precision (SP), Double Precision (DP), Special Function Unit (sfu), Load/Store (L/S).\n- Shared resources: Register File and Shared Memory / L1 Cache accessible by all execution units.\n- Scalable design indicated by “192 Cuda Cores” and ellipsis suggesting replication across SMs.\n\nAll elements are accurately extracted and represented in structured Markdown format above.\n\n--- \n\n✅ Extraction complete. No assumptions made beyond visual evidence. All labels, connections, and annotations preserved.", "alignment": "left", "unique_id": "3d43723295f9b5de1ffef8728deab754", "edited": false, "extra": {}}, "target": {"markdown": "![3d43723295f9b5de1ffef8728deab754.jpg](figures/3d43723295f9b5de1ffef8728deab754_67109092.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 91}, {"source": {"block_id": "237cdfd13c25fbc7b183bcbe8c0b5ff4", "index": 92, "aliyun_index": 3, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 8: Kepler SM architecture overview  \n\n", "text": "Figure 8: Kepler SM architecture overview\n", "alignment": "left", "unique_id": "237cdfd13c25fbc7b183bcbe8c0b5ff4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 8: Kepler SM architecture overview"}], "lineHeight": 0}}, "target": {"markdown": "图 8：Kepler SM 架构概览", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 92}, {"source": {"block_id": "6c3288508f768b8cae7bc0b46b6b0e4a", "index": 93, "aliyun_index": 4, "page_num": 6, "type": "figure", "sub_type": "none", "markdown": "![6c3288508f768b8cae7bc0b46b6b0e4a.jpg](figures/6c3288508f768b8cae7bc0b46b6b0e4a_f802c33d.jpeg)  \n\n", "text": "+-----------------------------+\n|       Instruction Cache     |\n+-----------------------------+\n          ↓         ↓\n+-----------------+ +-----------------+\n| Tex / L1 Cache  | | Tex / L1 Cache  |\n+-----------------+ +-----------------+\n          ↓         ↓         ↓         ↓\n+----------+ +----------+ +----------+ +----------+\n| Quadrant | | Quadrant | | Quadrant | | Quadrant |\n+----------+ +----------+ +----------+ +----------+\n          ↕         ↕         ↕         ↕\n+-----------------------------+\n|        Shared Memory        |\n+-----------------------------+\n\n+----------------------------------+\n|        Instruction Buffer        |\n+----------------------------------+\n                ↓\n+----------------------------------+\n|        Warp Scheduler            |\n+----------------------------------+\n          ↓               ↓\n+------------------+ +------------------+\n|   Dispatch Unit  | |   Dispatch Unit  |\n+------------------+ +------------------+\n          ↓               ↓\n+----+ +----+ +----+ +----+ +----+\n| SP | | SP | | SP | | SFU| | L/S|\n+----+ +----+ +----+ +----+ +----+\n          ... (共 32 SP CUDA Cores) ...\n+----+ +----+ +----+ +----+ +----+\n| SP | | SP | | SP | | SFU| | L/S|\n+----+ +----+ +----+ +----+ +----+\n                ↔\n        +------------------+\n        |    Register File |\n        +------------------+\n\n\n\n> 注：\n> - “SP” = Streaming Processor（流处理器）\n> - “SFU” = Special Function Unit（特殊功能单元）\n> - “L/S” = Load/Store Unit（加载/存储单元）\n> - 总共包含 **32 个 SP CUDA Cores**（图中以两行示意，实际为连续排列）\n> - 所有执行单元（SP, SFU, L/S）均与 **Register File** 双向交互\n> - 虚线表示左右两侧系统之间的逻辑连接或数据通路\n\n---\n\n## 整体说明\n\n该图展示了一个典型的 NVIDIA GPU 微架构局部视图，分为两大主要部分：\n\n1. **左侧 — 内存层次结构**  \n   - 包含指令缓存、纹理/L1缓存、象限（Quadrant）共享内存访问单元、以及共享内存本身。\n   - 支持多线程并行数据访问，通过多个 Quadrant 实现高带宽共享内存访问。\n\n2. **右侧 — 计算调度与执行单元**  \n   - 从指令缓冲 → Warp 调度器 → 分发单元 → 执行单元（SP/SFU/L/S）→ 寄存器文件。\n   - 强调 warp-level 并行调度机制，每个 warp 由多个线程组成，被分配到不同的执行单元。\n   - 32 个 SP CUDA Cores 是基本计算单元，配合 SFU 和 L/S 单元完成复杂运算与内存操作。\n\n---\n\n✅ 此 Markdown 文档完整还原了原始图像中的组件名称、层级关系、连接方向及注释信息，适用于技术文档、教学材料或架构分析场景。", "alignment": "left", "unique_id": "6c3288508f768b8cae7bc0b46b6b0e4a", "edited": false, "extra": {}}, "target": {"markdown": "![6c3288508f768b8cae7bc0b46b6b0e4a.jpg](figures/6c3288508f768b8cae7bc0b46b6b0e4a_f802c33d.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 93}, {"source": {"block_id": "6b8c8a92e41e87e0ac48c7298328c5bd", "index": 94, "aliyun_index": 5, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 9: Maxwell SM architecture overview  \n\n", "text": "Figure 9: Maxwell SM architecture overview\n", "alignment": "left", "unique_id": "6b8c8a92e41e87e0ac48c7298328c5bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 9: Maxwell SM architecture overview"}], "lineHeight": 0}}, "target": {"markdown": ">图 9：Maxwell SM 架构概览", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 94}, {"source": {"block_id": "97f17e82238753ea19f750470faf5481", "index": 95, "aliyun_index": 6, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "cores and 8 SFUs. Each warp scheduler manages the resources for one of the quadrants. In contrast, the Fermi and Kepler GPUs (Figure 8) implement soft sharing where the warp schedulers do not have dedicated resources and instead issue instructions to a shared set of resources on the core.  \n\n", "text": "cores and 8 SFUs. Each warp scheduler manages the resources for one of the quadrants. In contrast, the Fermi and Kepler GPUs (Figure 8) implement soft sharing where the warp schedulers do not have dedicated resources and instead issue instructions to a shared set of resources on the core.\n", "alignment": "left", "unique_id": "97f17e82238753ea19f750470faf5481", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cores and 8 SFUs. Each warp scheduler manages the resources for one of the quadrants. In contrast, the Fermi and Kepler GPUs (Figure 8) implement soft sharing where the warp schedulers do not have dedicated resources and instead issue instructions to a shared set of resources on the core."}], "lineHeight": 0}}, "target": {"markdown": "核心以及 8 个 SFU。每个 warp 调度器负责管理其中一个象限的资源。相比之下，Fermi 和 Kepler GPU（图 8）则采用软共享方式，其 warp 调度器并不独享专用资源，而是向核心上共享的资源集合发射指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 95}, {"source": {"block_id": "44124ddcadf94ffbf70f8df9c2250bf9", "index": 96, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "**Main Observations:** Due to the different number of warp schedulers, the number of functional units of each type and the depth of the pipeline for each functional unit, we can see different behavior in each plot. The figures show the latency observed by warp 0 which is assigned to the first scheduler on the GPGPU. As we add warps, we see a step in latency plots, at the points where the number of operations causes contention either for scheduler issue bandwidth or for available functional units. For all experiments, the latency stays fixed as we increase the number of warps up to the point where the number of issued instructions matches the number of functional units for that operation. After that point, increasing number of warps leads to an increase in latency for the warps that are co-located on the same warp scheduler with the last added warp. *Contention is isolated to warps belonging to the same warp scheduler.* This result held even for the Kepler GPU which has soft sharing of the resources. For Kepler, the latency steps are not visible for single precision Add and Mul operations, due to the large number of available SP units. In contrast, in Maxwell the latency steps are eventually observable because the resources are split into quadrants (Figure 9).  \n\n", "text": "**Main Observations:** Due to the different number of warp schedulers, the number of functional units of each type and the depth of the pipeline for each functional unit, we can see different behavior in each plot. The figures show the latency observed by warp 0 which is assigned to the first scheduler on the GPGPU. As we add warps, we see a step in latency plots, at the points where the number of operations causes contention either for scheduler issue bandwidth or for available functional units. For all experiments, the latency stays fixed as we increase the number of warps up to the point where the number of issued instructions matches the number of functional units for that operation. After that point, increasing number of warps leads to an increase in latency for the warps that are co-located on the same warp scheduler with the last added warp. *Contention is isolated to warps belonging to the same warp scheduler.* This result held even for the Kepler GPU which has soft sharing of the resources. For Kepler, the latency steps are not visible for single precision Add and Mul operations, due to the large number of available SP units. In contrast, in Maxwell the latency steps are eventually observable because the resources are split into quadrants (Figure 9).\n", "alignment": "left", "unique_id": "44124ddcadf94ffbf70f8df9c2250bf9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Main Observations:** Due to the different number of warp schedulers, the number of functional units of each type and the depth of the pipeline for each functional unit, we can see different behavior in each plot. The figures show the latency observed by warp 0 which is assigned to the first scheduler on the GPGPU. As we add warps, we see a step in latency plots, at the points where the number of operations causes contention either for scheduler issue bandwidth or for available functional units. For all experiments, the latency stays fixed as we increase the number of warps up to the point where the number of issued instructions matches the number of functional units for that operation. After that point, increasing number of warps leads to an increase in latency for the warps that are co-located on the same warp scheduler with the last added warp. *Contention is isolated to warps belonging to the same warp scheduler.* This result held even for the Kepler GPU which has soft sharing of the resources. For Kepler, the latency steps are not visible for single precision Add and Mul operations, due to the large number of available SP units. In contrast, in Maxwell the latency steps are eventually observable because the resources are split into quadrants (Figure 9)."}], "lineHeight": 0}}, "target": {"markdown": "**主要观察结果：** 由于 warp 调度器数量、每类功能单元的数量以及各功能单元流水线深度的不同，我们在每幅图中都能观察到不同的行为特征。这些图展示了由 warp 0 所观测到的延迟，该 warp 被分配到 GPGPU 上的第一个调度器。随着我们不断增加 warp 数量，可以观察到延迟曲线出现了阶梯式跃升，其拐点出现在所发起的指令数量引发对调度器发射带宽或可用功能单元争用的位置。在所有实验中，当 warp 数量增加到所发射指令数与该操作的功能单元数相匹配之前，延迟始终保持不变。一旦超过该临界点，继续增加 warp 数量会导致与最后新增的 warp 同处一个 warp 调度器上的那些 warp 的延迟增大。*争用被局限在属于同一 warp 调度器的 warp 之间。* 即使是在采用资源软共享的 Kepler GPU 上，这一结论同样成立。对于 Kepler 而言，由于可用 SP 单元数量较多，单精度 Add 和 Mul 操作的延迟阶梯现象并不明显。相比之下，在 Maxwell GPU 中，由于资源被划分为四个象限（图 9），延迟阶梯最终变得可以观测到。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 96}, {"source": {"block_id": "03b0961e35e4077ce71903c2fabf13b0", "index": 97, "aliyun_index": 8, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "### 5.2 Step II: Constructing FU covert channels\n", "text": "5.2 Step II: Constructing FU covert channels\n", "alignment": "left", "unique_id": "03b0961e35e4077ce71903c2fabf13b0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.2 Step II: Constructing FU covert channels"}], "lineHeight": 0}}, "target": {"markdown": "### 5.2 第二步：构建 FU 隐蔽信道\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "195425073b7ce061b8e473c79eb31709", "index": 98, "aliyun_index": 9, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The trojan generates operations to the target functional unit to create contention when it desires to communicate 1, while it stays idle when it desires to communicate 0. Because of limited number of SFUs and clear jumps in latency on all three architectures, we elect to use contention on the SFUs. In particular, we take advantage of the more clear steps and lower latency of __sinf operation to create and demonstrate a covert channel through the warp schedulers and special functional units. Similar channels can be constructed using other resources.  \n\n", "text": "The trojan generates operations to the target functional unit to create contention when it desires to communicate 1, while it stays idle when it desires to communicate 0. Because of limited number of SFUs and clear jumps in latency on all three architectures, we elect to use contention on the SFUs. In particular, we take advantage of the more clear steps and lower latency of __sinf operation to create and demonstrate a covert channel through the warp schedulers and special functional units. Similar channels can be constructed using other resources.\n", "alignment": "left", "unique_id": "195425073b7ce061b8e473c79eb31709", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The trojan generates operations to the target functional unit to create contention when it desires to communicate 1, while it stays idle when it desires to communicate 0. Because of limited number of SFUs and clear jumps in latency on all three architectures, we elect to use contention on the SFUs. In particular, we take advantage of the more clear steps and lower latency of __sinf operation to create and demonstrate a covert channel through the warp schedulers and special functional units. Similar channels can be constructed using other resources."}], "lineHeight": 0}}, "target": {"markdown": "特洛伊木马在希望传递 1 时向目标功能单元发起操作以制造争用，而在希望传递 0 时则保持空闲。由于 SFU 数量有限，并且在三种架构上的延迟均存在明显的阶跃，我们选择利用 SFU 上的争用。具体而言，我们利用 `__sinf` 操作更清晰的延迟阶梯以及更低的延迟，通过 warp 调度器和特殊功能单元构建并展示一条隐蔽信道。也可以基于其他资源构建类似的信道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 98}, {"source": {"block_id": "222ecfb4c7e5381bcd71904065f61f8f", "index": 99, "aliyun_index": 10, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "We launch two concurrent kernels on different streams on GPU. To be sure that thread blocks of the two kernels can be co-located on each SM, we consider a number of blocks for each kernel equal to the number of SMs for different architectures. To be compatible with latency plots in Figure 6, we use the minimum number of required warps that will cause observable latency difference using the __sinf operation on the Spy side. This requirement translates to having each block of the spy and the trojan use 3 warps, 12 warps and 10 warps, for the Fermi, Kepler and Maxwell architectures respectively. The spy kernel does a number of __sinf operations which are executed on the SFUs. To send 0, the trojan does nothing so just 3 warps of the spy (or 12, 10, on the Kepler and Maxwell respectively) are scheduled to issue instructions and execute on SFUs. The latency in this case is about 41 clock cycles for Fermi (18 for Kepler and 15 for Maxwell) which is equal to the latency when there is no contention. For sending 1, the trojan executes a number of __sinf operations, so that its warps are scheduled to issue instructions alongside of the spy warps. In this case, there is contention on the SFUs and latency is increased to 48 clock cycles for Fermi (24 for Kepler and 20 for Maxwell). The measured covert channel bandwidth is 21 Kbps, 24 Kbps and 28 Kbps on Fermi, Kepler and Maxwell GPUs respectively.  \n\n", "text": "We launch two concurrent kernels on different streams on GPU. To be sure that thread blocks of the two kernels can be co-located on each SM, we consider a number of blocks for each kernel equal to the number of SMs for different architectures. To be compatible with latency plots in Figure 6, we use the minimum number of required warps that will cause observable latency difference using the __sinf operation on the Spy side. This requirement translates to having each block of the spy and the trojan use 3 warps, 12 warps and 10 warps, for the Fermi, Kepler and Maxwell architectures respectively. The spy kernel does a number of __sinf operations which are executed on the SFUs. To send 0, the trojan does nothing so just 3 warps of the spy (or 12, 10, on the Kepler and Maxwell respectively) are scheduled to issue instructions and execute on SFUs. The latency in this case is about 41 clock cycles for Fermi (18 for Kepler and 15 for Maxwell) which is equal to the latency when there is no contention. For sending 1, the trojan executes a number of __sinf operations, so that its warps are scheduled to issue instructions alongside of the spy warps. In this case, there is contention on the SFUs and latency is increased to 48 clock cycles for Fermi (24 for Kepler and 20 for Maxwell). The measured covert channel bandwidth is 21 Kbps, 24 Kbps and 28 Kbps on Fermi, Kepler and Maxwell GPUs respectively.\n", "alignment": "left", "unique_id": "222ecfb4c7e5381bcd71904065f61f8f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We launch two concurrent kernels on different streams on GPU. To be sure that thread blocks of the two kernels can be co-located on each SM, we consider a number of blocks for each kernel equal to the number of SMs for different architectures. To be compatible with latency plots in Figure 6, we use the minimum number of required warps that will cause observable latency difference using the __sinf operation on the Spy side. This requirement translates to having each block of the spy and the trojan use 3 warps, 12 warps and 10 warps, for the Fermi, Kepler and Maxwell architectures respectively. The spy kernel does a number of __sinf operations which are executed on the SFUs. To send 0, the trojan does nothing so just 3 warps of the spy (or 12, 10, on the Kepler and Maxwell respectively) are scheduled to issue instructions and execute on SFUs. The latency in this case is about 41 clock cycles for Fermi (18 for Kepler and 15 for Maxwell) which is equal to the latency when there is no contention. For sending 1, the trojan executes a number of __sinf operations, so that its warps are scheduled to issue instructions alongside of the spy warps. In this case, there is contention on the SFUs and latency is increased to 48 clock cycles for Fermi (24 for Kepler and 20 for Maxwell). The measured covert channel bandwidth is 21 Kbps, 24 Kbps and 28 Kbps on Fermi, Kepler and Maxwell GPUs respectively."}], "lineHeight": 0}}, "target": {"markdown": "我们在 GPU 上通过不同的流启动两个并发内核。为确保两个内核的线程块能够被协同放置在每一个 SM 上，我们让每个内核所使用的块数等于不同架构下 SM 的数量。为了与图 6 中的延迟曲线保持一致，我们在 Spy 端采用能够使用 `__sinf` 操作产生可观测延迟差异所需的最少 warp 数量。该要求具体表现为：对于 Fermi、Kepler 和 Maxwell 三种架构，spy 和 trojan 的每个块分别使用 3 个、12 个和 10 个 warp。Spy 内核会执行若干 `__sinf` 操作，这些操作将在 SFU 上执行。在传递 0 时，trojan 不执行任何操作，此时仅有 spy 的 3 个 warp（在 Kepler 和 Maxwell 上分别为 12 个和 10 个 warp）被调度发射指令并在 SFU 上执行。此情形下的延迟在 Fermi 上约为 41 个时钟周期（Kepler 上为 18 个，Maxwell 上为 15 个），这与无争用情况下的延迟一致。在传递 1 时，trojan 会执行若干 `__sinf` 操作，使其 warp 与 spy 的 warp 一同被调度发射指令。此时 SFU 上将产生争用，延迟增加到 Fermi 上的 48 个时钟周期（Kepler 上为 24 个，Maxwell 上为 20 个）。在 Fermi、Kepler 和 Maxwell GPU 上，所测得的隐蔽信道带宽分别为 21 Kbps、24 Kbps 和 28 Kbps。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 99}, {"source": {"block_id": "364d3cdd324875718313780284a0081f", "index": 100, "aliyun_index": 11, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "## 6 GLOBAL MEMORY CHANNELS\n", "text": "6 GLOBAL MEMORY CHANNELS\n", "alignment": "left", "unique_id": "364d3cdd324875718313780284a0081f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6 GLOBAL MEMORY CHANNELS"}], "lineHeight": 0}}, "target": {"markdown": "## 6 全局存储器信道\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 100}, {"source": {"block_id": "f1a2dfe0b3e5d8a5481cf812e1be2111", "index": 101, "aliyun_index": 12, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "In this section, we explore constructing covert channels through global memory, which provides an additional resource for contention when kernels are not co-located on the same SM. We also explore the impact of the access pattern on interference (coalesced vs. uncoalesced addresses). In particular, Jiang et al. [14] demonstrated a side channel attack on GPUs that times an AES encryption kernel running on the GPU from the CPU side. This attack relies on an observation that key-dependent differences in the coalescing behavior of memory accesses, lead to key-dependent encryption times which are used to infer the secret key. Thus, we wanted to explore whether the same phenomena can be exploited to produce high quality covert channels inside the GPU.  \n\n", "text": "In this section, we explore constructing covert channels through global memory, which provides an additional resource for contention when kernels are not co-located on the same SM. We also explore the impact of the access pattern on interference (coalesced vs. uncoalesced addresses). In particular, Jiang et al. [14] demonstrated a side channel attack on GPUs that times an AES encryption kernel running on the GPU from the CPU side. This attack relies on an observation that key-dependent differences in the coalescing behavior of memory accesses, lead to key-dependent encryption times which are used to infer the secret key. Thus, we wanted to explore whether the same phenomena can be exploited to produce high quality covert channels inside the GPU.\n", "alignment": "left", "unique_id": "f1a2dfe0b3e5d8a5481cf812e1be2111", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section, we explore constructing covert channels through global memory, which provides an additional resource for contention when kernels are not co-located on the same SM. We also explore the impact of the access pattern on interference (coalesced vs. uncoalesced addresses). In particular, Jiang et al. [14] demonstrated a side channel attack on GPUs that times an AES encryption kernel running on the GPU from the CPU side. This attack relies on an observation that key-dependent differences in the coalescing behavior of memory accesses, lead to key-dependent encryption times which are used to infer the secret key. Thus, we wanted to explore whether the same phenomena can be exploited to produce high quality covert channels inside the GPU."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们探索通过全局存储器构建隐蔽信道的方法。当内核未被协同放置在同一个 SM 上时，全局存储器提供了额外的资源用于制造争用。我们还将探讨访问模式（合并访问与非合并访问）对干扰的影响。具体而言，Jiang 等人 [14] 演示了一种针对 GPU 的侧信道攻击，通过在 CPU 端对运行在 GPU 上的 AES 加密内核进行计时。该攻击基于以下观察：内存访问的合并行为中存在的与密钥相关的差异会导致与密钥相关的加密时间，进而被用于推断出密钥。因此，我们希望探索是否可以利用同样的现象在 GPU 内部构建高质量的隐蔽信道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 101}, {"source": {"block_id": "0004ef9e0dd10957b7fb469d792782a2", "index": 102, "aliyun_index": 13, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Using normal load and store operations, we did not observe reliable contention in the global memory. We believe that this is due to the high memory bandwidth. In particular, to saturate the memory bandwidth, many global memory operations are required, each with high latency, significantly harming achievable bandwidth. To create contention, we focused on atomic operations. Since the atomic operations rely on atomic units that are limited in number, it is possible to cause measurable contention. At the same time, atomic operations are extremely slow, which can limit the bandwidth of  \n\n", "text": "Using normal load and store operations, we did not observe reliable contention in the global memory. We believe that this is due to the high memory bandwidth. In particular, to saturate the memory bandwidth, many global memory operations are required, each with high latency, significantly harming achievable bandwidth. To create contention, we focused on atomic operations. Since the atomic operations rely on atomic units that are limited in number, it is possible to cause measurable contention. At the same time, atomic operations are extremely slow, which can limit the bandwidth of\n", "alignment": "left", "unique_id": "0004ef9e0dd10957b7fb469d792782a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Using normal load and store operations, we did not observe reliable contention in the global memory. We believe that this is due to the high memory bandwidth. In particular, to saturate the memory bandwidth, many global memory operations are required, each with high latency, significantly harming achievable bandwidth. To create contention, we focused on atomic operations. Since the atomic operations rely on atomic units that are limited in number, it is possible to cause measurable contention. At the same time, atomic operations are extremely slow, which can limit the bandwidth of"}], "lineHeight": 0}}, "target": {"markdown": "使用普通的 load 和 store 操作，我们并未在全局存储器中观测到稳定的争用。我们认为这源于全局存储器的高带宽。具体而言，要使存储器带宽饱和，需要发起大量的全局存储器操作，而每次操作都具有很高的延迟，这会显著降低可达带宽。为了制造争用，我们转而聚焦于原子操作。由于原子操作依赖于数量有限的原子单元，因此有可能引发可度量的争用。与此同时，原子操作本身极其耗时，这可能会限制", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 102}, {"source": {"block_id": "ce9a02882f2c9c6375eca881d4680a0c", "index": 103, "aliyun_index": 2, "page_num": 7, "type": "figure_name", "sub_type": "none", "markdown": ">Table 1: Number of available resources in each SM.  \n\n", "text": "Table 1: Number of available resources in each SM.\n", "alignment": "left", "unique_id": "ce9a02882f2c9c6375eca881d4680a0c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, nificantly higher than that of the Fermi since atomic operations are supported through the L2 cache and due to the addition of more atomic units in hardware [42]. Atomic operation throughput to a common global memory access is improved by 9x to one operation per clock cycle causing the overall time to communicate a bit to decreased significantly. It is interesting to note that the coalescing behavior that benefited Jiang et al.'s attack can not be exploited to create the covert channel attack. Coalescing causes timing variability to a single kernel, benefiting an external adversary that times this kernel and has no effect on timing of a competing kernel. However, our experiments show that the coalescing behavior on GPUs improves the channel bandwidth. The poor coalescing significantly reduces the possibility of using the faster L2-level atomic operation support, significantly slowing down the covert communication across the two different kernels. We can see that scenario 3 results in the lowest achievable covert channel bandwidth.  \n\n", "text": "The bandwidth of the three scenarios for each of the three GPUs is shown in Figure 10. For each GPU, we tune the number of iterations to the minimum that will cause observable contention. On the Kepler and Maxwell GPUs the throughput of global memory atomic operation is significantly higher than that of the Fermi since atomic operations are supported through the L2 cache and due to the addition of more atomic units in hardware [42]. Atomic operation throughput to a common global memory access is improved by 9x to one operation per clock cycle causing the overall time to communicate a bit to decreased significantly. It is interesting to note that the coalescing behavior that benefited Jiang et al.'s attack can not be exploited to create the covert channel attack. Coalescing causes timing variability to a single kernel, benefiting an external adversary that times this kernel and has no effect on timing of a competing kernel. th."}], "lineHeight": 0}}, "target": {"markdown": "三种 GPU 在三种场景下的带宽如图 10 所示。对于每一种 GPU，我们将迭代次数调优为能够引发可观测争用的最小值。在 Kepler 和 Maxwell GPU 上，全局存储器原子操作的吞吐量明显高于 Fermi，这是因为原子操作得到了 L2 缓存的支持，并且硬件中增加了更多的原子单元 [42]。对同一全局存储器地址进行原子操作的吞吐量提高了 9 倍，达到每个时钟周期一次操作，从而显著缩短了传输单个比特所需的总时间。值得注意的是，Jiang 等人攻击中所利用的合并访问行为并不能被用于构建隐蔽信道攻击。合并访问会为单个内核带来时间波动，这有利于对内核进行计时的外部攻击者，而对竞争内核的计时则没有影响。然而，我们的实验表明，GPU 上的合并访问行为能够提高信道带宽。较差的合并性会显著降低使用更快速的 L2 级原子操作支持的可能性，从而显著减缓两个不同内核之间的隐蔽通信。可以看到，场景 3 所获得的隐蔽信道带宽最低。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "db7ee17a063709447d21122348f33513", "index": 110, "aliyun_index": 9, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "## 7 IMPROVING THE ATTACK\n", "text": "7 IMPROVING THE ATTACK\n", "alignment": "left", "unique_id": "db7ee17a063709447d21122348f33513", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7 IMPROVING THE ATTACK"}], "lineHeight": 0}}, "target": {"markdown": "## 7 改进攻击\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "b1f3cf12e9c40d1845974751b59c987c", "index": 111, "aliyun_index": 10, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "In this section, we explore several improvements and optimizations to increase the bandwidth and reliability of the covert channels.  \n\n", "text": "In this section, we explore several improvements and optimizations to increase the bandwidth and reliability of the covert channels.\n", "alignment": "left", "unique_id": "b1f3cf12e9c40d1845974751b59c987c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", he communication so that multiple trojans are com-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "municating to multiple spies concurrently; and (2) implementing"}], "lineHeight": -108}}, "target": {"markdown": "我们采用两种通用方法来提高单一资源上隐蔽信道的带宽：(1) 识别能够并行化通信的机会，使得多个 trojan 可以同时与多个 spy 进行通信；(2) 实现", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "76bac4cdefa81bf18e5b90d084033c97", "index": 113, "aliyun_index": 12, "page_num": 7, "type": "figure", "sub_type": "none", "markdown": "![76bac4cdefa81bf18e5b90d084033c97.jpeg](figures/76bac4cdefa81bf18e5b90d084033c97_c1084602.png)  \n\n", "text": "以下是根据您提供的柱状图内容，提取并整理为合法 Markdown 格式的完整信息：\n\n---\n\n# 带宽性能对比（单位：Kbps）\n\n## 图表说明\n\n该柱状图展示了三种不同架构（Fermi、Kepler、Maxwell）在三种内存访问模式下的带宽表现（单位：Kbps）。\n\n### 访问模式分类：\n- **One Address Access**（单地址访问）\n- **Coalesced Access**（合并访问）\n- **Un-Coalesced Access**（非合并访问）\n\n### 架构颜色标识：\n- 🟧 **Fermi** —— 橙色\n- 🟫 **Kepler** —— 棕色\n- 🟦 **Maxwell** —— 蓝色\n\n---\n\n## 数据详情（近似值，基于图表目测）\n\n| 访问模式             | Fermi (Kbps) | Kepler (Kbps) | Maxwell (Kbps) |\n|----------------------|--------------|---------------|----------------|\n| One Address Access   | ~30          | ~40           | ~41            |\n| Coalesced Access     | ~7           | ~28           | ~30            |\n| Un-Coalesced Access  | ~2.5         | ~3.5          | ~8             |\n\n> 注：数值为视觉估算，实际数据可能略有偏差。\n\n---\n\n## 观察与趋势分析\n\n1. **One Address Access**：\n   - 所有架构在此模式下带宽最高。\n   - Maxwell 略高于 Kepler，两者均显著高于 Fermi。\n\n2. **Coalesced Access**：\n   - 带宽明显下降，但 Maxwell 和 Kepler 仍保持较高水平（~28–30 Kbps）。\n   - Fermi 在此模式下性能大幅下滑至约 7 Kbps。\n\n3. **Un-Coalesced Access**：\n   - 所有架构带宽最低。\n   - Maxwell 表现相对最好（~8 Kbps），远超 Fermi 和 Kepler。\n   - Fermi 和 Kepler 在此模式下几乎无优势，分别约为 2.5 和 3.5 Kbps。\n\n---\n\n## 结论\n\n- **Maxwell 架构在所有访问模式下均表现出最优或接近最优的带宽性能**，尤其在非合并访问中优势显著。\n- **Kepler 在单地址和合并访问中表现良好，但在非合并访问中较弱**。\n- **Fermi 整体性能最弱，尤其在合并与非合并访问中差距巨大**，表明其内存子系统对访问模式敏感度高。\n\n---\n\n✅ 此 Markdown 格式可直接用于文档、报告或演示文稿，保留原始图表结构与关键洞察。  \n📌 建议结合原始图像进行精确数据校准以获得工程级精度。\n\n--- \n\n如需导出为 PDF、HTML 或添加交互式图表代码（如 Plotly / Matplotlib），可进一步提出需求。", "alignment": "left", "unique_id": "76bac4cdefa81bf18e5b90d084033c97", "edited": false, "extra": {}}, "target": {"markdown": "![76bac4cdefa81bf18e5b90d084033c97.jpeg](figures/76bac4cdefa81bf18e5b90d084033c97_c1084602.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "cd917c40022afdf6db4c72e6ee2798a4", "index": 114, "aliyun_index": 13, "page_num": 7, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 10: Global atomic covert channel bandwidth  \n\n", "text": "Figure 10: Global atomic covert channel bandwidth\n", "alignment": "left", "unique_id": "cd917c40022afdf6db4c72e6ee2798a4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 10: Global atomic covert channel bandwidth"}], "lineHeight": 0}}, "target": {"markdown": ">图 10：全局原子操作隐蔽信道带宽", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "4ead0143e295745b42deb767a0f7538a", "index": 115, "aliyun_index": 14, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "synchronization to eliminate the loss of bandwidth that results from timing drift or, alternatively, the overhead of successively launching kernels. It is also possible to use multiple resources simultaneously to increase bandwidth. As an example, we experimented with sending two bits concurrently, one through L1 constant cache and one through the SFUs, achieving 56 Kbps bandwidth for Kepler and Maxwell GPUs. This approach is orthogonal to single-resource channel optimizations, allowing us to increase the bandwidth in those cases as well. We do not report multi-resource bandwidth since it is possible to use multiple resources on the CPU as well.  \n\n", "text": "synchronization to eliminate the loss of bandwidth that results from timing drift or, alternatively, the overhead of successively launching kernels. It is also possible to use multiple resources simultaneously to increase bandwidth. As an example, we experimented with sending two bits concurrently, one through L1 constant cache and one through the SFUs, achieving 56 Kbps bandwidth for Kepler and Maxwell GPUs. This approach is orthogonal to single-resource channel optimizations, allowing us to increase the bandwidth in those cases as well. We do not report multi-resource bandwidth since it is possible to use multiple resources on the CPU as well.\n", "alignment": "left", "unique_id": "4ead0143e295745b42deb767a0f7538a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "synchronization to eliminate the loss of bandwidth that results from timing drift or, alternatively, the overhead of successively launching kernels. It is also possible to use multiple resources simultaneously to increase bandwidth. As an example, we experimented with sending two bits concurrently, one through L1 constant cache and one through the SFUs, achieving 56 Kbps bandwidth for Kepler and Maxwell GPUs. This approach is orthogonal to single-resource channel optimizations, allowing us to increase the bandwidth in those cases as well. We do not report multi-resource bandwidth since it is possible to use multiple resources on the CPU as well."}], "lineHeight": 0}}, "target": {"markdown": "通过同步来消除由时序漂移所导致的带宽损失，或避免连续启动内核所带来的开销。此外，还可以同时使用多种资源来提升带宽。作为示例，我们进行了同时发送两比特的实验，其中一比特通过 L1 常量缓存传输，另一比特通过 SFU 传输，在 Kepler 和 Maxwell GPU 上达到了 56 Kbps 的带宽。该方法与单资源信道优化是正交的，使我们能够在这些场景下进一步提升带宽。由于在 CPU 上同样可以使用多种资源，因此我们不再报告多资源的带宽数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "a1d3d8bf20839f5e6a1a57857e7106b4", "index": 116, "aliyun_index": 15, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "### 7.1 Improving the Cache Channels\n", "text": "7.1 Improving the Cache Channels\n", "alignment": "left", "unique_id": "a1d3d8bf20839f5e6a1a57857e7106b4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.1 Improving the Cache Channels"}], "lineHeight": 0}}, "target": {"markdown": "### 7.1 改进缓存信道\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "1fb1251a9ffed2057279344cc2b5c69e", "index": 117, "aliyun_index": 16, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "The implementations we discussed so far are susceptible to loss of synchronization where the trojan and spy are not in sync with each other. This can occur due to natural drift due to unpredictable pipeline dependencies, or due to interference from other workloads. To overcome this issue, the covert channels we presented so far, forces overlap between the trojan and the spy by timing the launch of the kernel, leading to significant overhead and loss of bandwidth. Moreover, in the presence of competing applications, co-location may be difficult to achieve repeatedly.  \n\n", "text": "The implementations we discussed so far are susceptible to loss of synchronization where the trojan and spy are not in sync with each other. This can occur due to natural drift due to unpredictable pipeline dependencies, or due to interference from other workloads. To overcome this issue, the covert channels we presented so far, forces overlap between the trojan and the spy by timing the launch of the kernel, leading to significant overhead and loss of bandwidth. Moreover, in the presence of competing applications, co-location may be difficult to achieve repeatedly.\n", "alignment": "left", "unique_id": "1fb1251a9ffed2057279344cc2b5c69e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The implementations we discussed so far are susceptible to loss of synchronization where the trojan and spy are not in sync with each other. This can occur due to natural drift due to unpredictable pipeline dependencies, or due to interference from other workloads. To overcome this issue, the covert channels we presented so far, forces overlap between the trojan and the spy by timing the launch of the kernel, leading to significant overhead and loss of bandwidth. Moreover, in the presence of competing applications, co-location may be difficult to achieve repeatedly."}], "lineHeight": 0}}, "target": {"markdown": "到目前为止我们所讨论的实现方案都容易受到同步丢失问题的影响，即 trojan 和 spy 之间无法保持同步。这种情况可能由于不可预测的流水线依赖所引起的自然漂移而发生，也可能由于其他工作负载的干扰而发生。为了克服这一问题，我们在前面所给出的隐蔽信道方案中通过对内核启动时刻进行计时来强制实现 trojan 与 spy 之间的重叠，但这会带来显著的开销和带宽损失。此外，在存在竞争性应用程序的情况下，重复实现共置可能会比较困难。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "0bdeca1e84433564dcc83cc478ab54b2", "index": 118, "aliyun_index": 17, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "To improve both the robustness and the bandwidth of the attack, in this section, we implement synchronization between the spy and the trojan through the covert channel. With synchronization, the two kernels are launched only once and use synchronization to communicate continuously. We illustrate the synchronization process for the L1 and L2 covert channels, but it is possible to implement synchronization for other channels as well.  \n\n", "text": "To improve both the robustness and the bandwidth of the attack, in this section, we implement synchronization between the spy and the trojan through the covert channel. With synchronization, the two kernels are launched only once and use synchronization to communicate continuously. We illustrate the synchronization process for the L1 and L2 covert channels, but it is possible to implement synchronization for other channels as well.\n", "alignment": "left", "unique_id": "0bdeca1e84433564dcc83cc478ab54b2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To improve both the robustness and the bandwidth of the attack, in this section, we implement synchronization between the spy and the trojan through the covert channel. With synchronization, the two kernels are launched only once and use synchronization to communicate continuously. We illustrate the synchronization process for the L1 and L2 covert channels, but it is possible to implement synchronization for other channels as well."}], "lineHeight": 0}}, "target": {"markdown": "为了同时提升攻击的鲁棒性和带宽，在本节中，我们通过隐蔽信道在 spy 与 trojan 之间实现同步。借助同步机制，两个内核仅需启动一次，并通过同步来持续进行通信。我们针对 L1 和 L2 隐蔽信道说明了同步过程，但该同步实现同样适用于其他信道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_ord 51c6b0d139987561e1668838a07b", "index": 127, "aliyun_index": 9, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Correspondingly, on the Spy side, for receiving each bit:  \n\n", "text": "Correspondingly, on the Spy side, for receiving each bit:\n", "alignment": "left", "unique_id": "a16951c6b0d139987561e1668838a07b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Correspondingly, on the Spy side, for receiving each bit:"}], "lineHeight": 0}}, "target": {"markdown": "相应地，在 Spy 端，对于接收的每一位比特：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "a5e8d755da36f9675e6ffe1ab42a7c75", "index": 128, "aliyun_index": 10, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "• First, the spy repeatedly checks the ready-to-send set to check if the trojan has sent the signal.  \n\n", "text": "• First, the spy repeatedly checks the ready-to-send set to check if the trojan has sent the signal.\n", "alignment": "left", "unique_id": "a5e8d755da36f9675e6ffe1ab42a7c75", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• First, the spy repeatedly checks the ready-to-send set to check if the trojan has sent the signal."}], "lineHeight": 0}}, "target": {"markdown": "• 首先，spy 反复检查\"准备发送\"集合，以确认 trojan 是否已发送该信号。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "24382ea89d1996f2a12c6bf2af6e41b3", "index": 129, "aliyun_index": 11, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "• Once it detects the ready-to-send signal (by measuring cache misses on the set), it sends the ready-to-receive signal on the corresponding set.  \n\n", "text": "• Once it detects the ready-to-send signal (by measuring cache misses on the set), it sends the ready-to-receive signal on the corresponding set.\n", "alignment": "left", "unique_id": "24382ea89d1996f2a12c6bf2af6e41b3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Once it detects the ready-to-send signal (by measuring cache misses on the set), it sends the ready-to-receive signal on the corresponding set."}], "lineHeight": 0}}, "target": {"markdown": "• 一旦检测到\"准备发送\"信号（通过测量该集合上的缓存未命中情况），它便在相应的集合上发送\"准备接收\"信号。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "9892dda93664716f1b8b2d032e046f7c", "index": 130, "aliyun_index": 12, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "• Finally, we receive the bit through checking the access time observed on the communication set.  \n\n", "text": "• Finally, we receive the bit through checking the access time observed on the communication set.\n", "alignment": "left", "unique_id": "9892dda93664716f1b8b2d032e046f7c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Finally, we receive the bit through checking the access time observed on the communication set."}], "lineHeight": 0}}, "target": {"markdown": "• 最后，我们通过检查在通信集合上观察到的访问时间来接收该比特。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "70b44752d2b80eec72a40f2aaed1d6da", "index": 131, "aliyun_index": 13, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Infrequently, due to noise or other factors loss of synchronization can occur leading to deadlock where the spy and trojan are each waiting in a different part of the communication loop. To address this situation, we changed the algorithm to time out (by bounding the number of wait iterations) when the expected signal is not received in time. In the case of a timeout at the sender or the receiver, we regain synchronization by repeating the step prior to the wait. With this modification, the communication works seamlessly. We use a three way handshake to ensure that the trojan and spy are concurrently active at the bit communication component of the program; attempting a two way handshake led to noise and frequent loss of synchronization.  \n\n", "text": "Infrequently, due to noise or other factors loss of synchronization can occur leading to deadlock where the spy and trojan are each waiting in a different part of the communication loop. To address this situation, we changed the algorithm to time out (by bounding the number of wait iterations) when the expected signal is not received in time. In the case of a timeout at the sender or the receiver, we regain synchronization by repeating the step prior to the wait. With this modification, the communication works seamlessly. We use a three way handshake to ensure that the trojan and spy are concurrently active at the bit communication component of the program; attempting a two way handshake led to noise and frequent loss of synchronization.\n", "alignment": "left", "unique_id": "70b44752d2b80eec72a40f2aaed1d6da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Infrequently, due to noise or other factors loss of synchronization can occur leading to deadlock where the spy and trojan are each waiting in a different part of the communication loop. To address this situation, we changed the algorithm to time out (by bounding the number of wait iterations) when the expected signal is not received in time. In the case of a timeout at the sender or the receiver, we regain synchronization by repeating the step prior to the wait. With this modification, the communication works seamlessly. We use a three way handshake to ensure that the trojan and spy are concurrently active at the bit communication component of the program; attempting a two way handshake led to noise and frequent loss of synchronization."}], "lineHeight": 0}}, "target": {"markdown": "偶尔，由于噪声或其他因素，丢失同步会导致死锁，此时 spy 和 trojan 各自在通信循环的不同部分等待。为了解决这种情况，我们修改了算法，当在预期时间内未收到信号时使其超时（通过限制等待迭代次数）。如果发送端或接收端发生超时，我们通过重复等待前的步骤来重新获得同步。经过此修改，通信可以无缝进行。我们采用三次握手来确保 trojan 和 spy 在程序的比特通信组件中同时处于活跃状态；尝试两次握手会导致噪声并频繁丢失同步。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "1e08810d38277025b46abaae8e128344", "index": 132, "aliyun_index": 14, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Although communication through three sets (rather than just one in the original channel) is required to fully synchronize the communication, removing the overhead of launching kernels for each bit of message increases the bandwidth to 61, 75 and 75 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively.  \n\n", "text": "Although communication through three sets (rather than just one in the original channel) is required to fully synchronize the communication, removing the overhead of launching kernels for each bit of message increases the bandwidth to 61, 75 and 75 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively.\n", "alignment": "left", "unique_id": "1e08810d38277025b46abaae8e128344", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although communication through three sets (rather than just one in the original channel) is required to fully synchronize the communication, removing the overhead of launching kernels for each bit of message increases the bandwidth to 61, 75 and 75 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively."}], "lineHeight": 0}}, "target": {"markdown": "虽然通过三个集合（而非原始信道中的仅一个集合）进行通信是实现完全同步所必需的，但消除了为每个消息比特启动内核的开销后，在 Fermi、Kepler 和 Maxwell GPU 上的带宽分别提升至 61、75 和 75 Kbps。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "49825a44b02950c5fbc70bbd89b3ecc9", "index": 133, "aliyun_index": 15, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "To further improve the synchronized channel bandwidth, we utilize SIMT execution model of GPUs to send $M$ bits through $M$ different cache sets concurrently in each round. Two cache sets are used for signaling and we use the remaining cache sets for communication, such that one bit can be communicated through each  \n\n", "text": "To further improve the synchronized channel bandwidth, we utilize SIMT execution model of GPUs to send $M$ bits through $M$ different cache sets concurrently in each round. Two cache sets are used for signaling and we use the remaining cache sets for communication, such that one bit can be communicated through each\n", "alignment": "left", "unique_id": "49825a44b02950c5fbc70bbd89b3ecc9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To further improve the synchronized channel bandwidth, we utilize SIMT execution model of GPUs to send $M$ bits through $M$ different cache sets concurrently in each round. Two cache sets are used for signaling and we use the remaining cache sets for communication, such that one bit can be communicated through each"}], "lineHeight": 0}}, "target": {"markdown": "为了进一步提高同步信道的带宽，我们利用 GPU 的 SIMT 执行模型，在每一轮中通过 $M$ 个不同的缓存集并发地发送 $M$ 比特。我们使用两个缓存集用于信令，其余的缓存集用于通信，从而使得每个缓存集可以传递一个比特", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "012db50049864dca9aacdb9af75744eb", "index": 134, "aliyun_index": 16, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "cache set by different threads in parallel. For example, in Kepler and Maxwell GPUs L1 constant cache has 8 sets, enabling transfer of 6 bits concurrently. This parallelism increases the bandwidth to 207, 285 and 285 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively. Our experiments demonstrate that by sending 2 bits, 4 bits and 6 bits concurrently, we are able to achieve 1.8x, 2.9x and 3.8x bandwidth improvement in Kepler GPU. Note that the ratio of bandwidth improvement is sublinear in the number of bits; we believe that this is due to both port contention, as well as the higher possibility of a cache miss in each kernel iteration.  \n\n", "text": "cache set by different threads in parallel. For example, in Kepler and Maxwell GPUs L1 constant cache has 8 sets, enabling transfer of 6 bits concurrently. This parallelism increases the bandwidth to 207, 285 and 285 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively. Our experiments demonstrate that by sending 2 bits, 4 bits and 6 bits concurrently, we are able to achieve 1.8x, 2.9x and 3.8x bandwidth improvement in Kepler GPU. Note that the ratio of bandwidth improvement is sublinear in the number of bits; we believe that this is due to both port contention, as well as the higher possibility of a cache miss in each kernel iteration.\n", "alignment": "left", "unique_id": "012db50049864dca9aacdb9af75744eb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cache set by different threads in parallel. For example, in Kepler and Maxwell GPUs L1 constant cache has 8 sets, enabling transfer of 6 bits concurrently. This parallelism increases the bandwidth to 207, 285 and 285 Kbps for the Fermi, Kepler and Maxwell GPUs, respectively. Our experiments demonstrate that by sending 2 bits, 4 bits and 6 bits concurrently, we are able to achieve 1.8x, 2.9x and 3.8x bandwidth improvement in Kepler GPU. Note that the ratio of bandwidth improvement is sublinear in the number of bits; we believe that this is due to both port contention, as well as the higher possibility of a cache miss in each kernel iteration."}], "lineHeight": 0}}, "target": {"markdown": "缓存集并行传输一个比特。例如，在 Kepler 和 Maxwell GPU 中，L1 常量缓存具有 8 个集合，能够并发传输 6 个比特。这种并行机制使得带宽分别提升至 Fermi、Kepler 和 Maxwell GPU 上的 207、285 和 285 Kbps。我们的实验表明，通过分别并发发送 2、4 和 6 比特，在 Kepler GPU 上能够实现 1.8 倍、2.9 倍和 3.8 倍的带宽提升。请注意，带宽提升的比率与比特数量之间呈亚线性关系；我们认为这是由于端口争用以及每次内核迭代中缓存未命中概率更高所共同导致的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "54df38eedcf176ba7564f406d5ccfe30", "index": 135, "aliyun_index": 17, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The next approach to improve the bandwidth is to exploit the inter-SM parallelism available on the GPGPU. In particular, if we manage to collocate the trojan and the spy on multiple SMs, each of these instances can communicate independently using resources on the SM. With 15 SMs available in Tesla K40C device, the trojan is able to send 15 bits simultaneously and the bandwidth of communication is increased 15 times. Table 2 shows the covert channel communication bandwidth for the baseline attack (column 1), the attack with synchronization (column 2), the attack with synchronization and sending multiple bits through different cache sets (column 3) and the attack with all three improvements (column 4). Clearly, high quality, high bandwidth covert channels are feasible on GPGPUs.  \n\n", "text": "The next approach to improve the bandwidth is to exploit the inter-SM parallelism available on the GPGPU. In particular, if we manage to collocate the trojan and the spy on multiple SMs, each of these instances can communicate independently using resources on the SM. With 15 SMs available in Tesla K40C device, the trojan is able to send 15 bits simultaneously and the bandwidth of communication is increased 15 times. Table 2 shows the covert channel communication bandwidth for the baseline attack (column 1), the attack with synchronization (column 2), the attack with synchronization and sending multiple bits through different cache sets (column 3) and the attack with all three improvements (column 4). Clearly, high quality, high bandwidth covert channels are feasible on GPGPUs.\n", "alignment": "left", "unique_id": "54df38eedcf176ba7564f406d5ccfe30", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The next approach to improve the bandwidth is to exploit the inter-SM parallelism available on the GPGPU. In particular, if we manage to collocate the trojan and the spy on multiple SMs, each of these instances can communicate independently using resources on the SM. With 15 SMs available in Tesla K40C device, the trojan is able to send 15 bits simultaneously and the bandwidth of communication is increased 15 times. Table 2 shows the covert channel communication bandwidth for the baseline attack (column 1), the attack with synchronization (column 2), the attack with synchronization and sending multiple bits through different cache sets (column 3) and the attack with all three improvements (column 4). Clearly, high quality, high bandwidth covert channels are feasible on GPGPUs."}], "lineHeight": 0}}, "target": {"markdown": "提高带宽的下一个方法是利用 GPGPU 上可用的 SM 间并行性。具体来说，如果我们能够将 trojan 和 spy 部署在多个 SM 上，那么这些实例中的每一个都可以利用各自 SM 上的资源独立地进行通信。Tesla K40C 设备具有 15 个可用的 SM，trojan 能够同时发送 15 个比特，从而使通信带宽提升 15 倍。表 2 展示了基线攻击（第 1 列）、加入同步机制的攻击（第 2 列）、加入同步机制并通过不同缓存集发送多个比特的攻击（第 3 列）以及包含全部三项改进的攻击（第 4 列）的隐蔽信道通信带宽。显然，在 GPGPU 上实现高质量、高带宽的隐蔽信道是完全可行的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "f39513b7aa085557f1d6175bab6dd840", "index": 136, "aliyun_index": 18, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "For the L2 constant cache covert channel, we can create contention in parallel, either by filling the cache in parallel or by using each thread block to communicate through one particular L2 cache set. In theory, this should enable the trojan to send 16 bits (number of L2 cache sets) simultaneously. However, we observe only an 8x improvement in the best case, which we conjecture is due to cache port contention and cache bank collisions.  \n\n", "text": "For the L2 constant cache covert channel, we can create contention in parallel, either by filling the cache in parallel or by using each thread block to communicate through one particular L2 cache set. In theory, this should enable the trojan to send 16 bits (number of L2 cache sets) simultaneously. However, we observe only an 8x improvement in the best case, which we conjecture is due to cache port contention and cache bank collisions.\n", "alignment": "left", "unique_id": "f39513b7aa085557f1d6175bab6dd840", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For the L2 constant cache covert channel, we can create contention in parallel, either by filling the cache in parallel or by using each thread block to communicate through one particular L2 cache set. In theory, this should enable the trojan to send 16 bits (number of L2 cache sets) simultaneously. However, we observe only an 8x improvement in the best case, which we conjecture is due to cache port contention and cache bank collisions."}], "lineHeight": 0}}, "target": {"markdown": "对于 L2 常量缓存隐蔽信道而言，我们可以通过并行填充缓存，或者使用每个线程块通过某一个特定的 L2 缓存集进行通信，从而并行地制造冲突。理论上，这应当使 trojan 能够同时发送 16 个比特（L2 缓存集的数量）。然而，我们观察到在最佳情况下仅有 8 倍的提升，我们推测这是由于缓存端口争用以及缓存体（bank）冲突所导致的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "ed4ad40bb8eb0d77c75a1fea47934d0a", "index": 137, "aliyun_index": 19, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "### 7.2 Improving the SFU Channel\n", "text": "7.2 Improving the SFU Channel\n", "alignment": "left", "unique_id": "ed4ad40bb8eb0d77c75a1fea47934d0a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7.2 Improving the SFU Channel"}], "lineHeight": 0}}, "target": {"markdown": "### 7.2 改进 SFU 信道\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "8cb6678e4fd4764555591fb1f8378471", "index": 138, umber of warps one by one we see latency increasing only in the warps that are assigned to the same warp scheduler. This effect is likely due to the limit on the number of"}], "lineHeight": 0}}, "target": {"markdown": "与 L1 隐蔽信道类似，通过让 spy 和 trojan 在每个 SM 上进行通信，可以获得 15 倍的带宽提升机会。然而，warp 调度器还提供了进一步提高带宽的其他机会。在第 5 节中，我们同样对 warp 分配算法进行了逆向工程，发现其采用轮询（round robin）策略。通过测量每个 warp 的延迟，我们注意到，当逐个增加 warp 数量时，只有那些被分配到同一 warp 调度器的 warp 才会出现延迟增加的现象。这种效应很可能是由于 warp 调度器所支持的 warp 数量存在限制所导致的", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "4476d139ed9eeddc7bec7f396ae774d0", "index": 139, "aliyun_index": 2, "page_num": 9, "type": "table_note", "sub_type": "none", "markdown": ">Table 2: Improved L1 Channels  \n\n", "text": "Table 2: Improved L1 Channels\n", "alignment": "left", "unique_id": "4476d139ed9eeddc7bec7f396ae774d0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 2: Improved L1 Channels"}], "lineHeight": 0}}, "target": {"markdown": ">表 2：改进后的 L1 信道", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "da2129a16f961c546f55ec01abb4c457", "index": 140, "aliyun_index": 3, "page_num": 9, "type": "table", "sub_type": "none", "markdown": "| GPU | L1 Baseline | Sync. | Sync. and multi-bits | Sync., multi-bits and parallel |\n| --- | --- | --- | --- | --- |\n| Fermi | 33 Kbps | 61 Kbps | 207 Kbps | 2.8 Mbps |\n| Kepler | 42 Kbps | 75 Kbps | 285 Kbps | 4.25 Mbps |\n| Maxwell | 42 Kbps | 75 Kbps | 285 Kbps | 3.7 Mbps |\n\n", "text": "| GPU|L1 Baseline|Sync.|Sync. and multi-bits|Sync., multi-bits and parallel|\n| ---|---|---|---|---|\n| Fe
