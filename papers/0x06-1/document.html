 warps for spy which $K$ is multiple of $N$ (the number of warp schedulers) such that the latency of $K$ warps alone is in the area of constant delay in the __sinf plots of Figure 6 for each architecture. For the trojan, we consider $M$ warps such that $M$ is also multiple of $N$ and the latency of $M+K$ is on one of the steps in the plot. Each warp of the trojan and the spy is assigned to one of the $N$ different warp schedulers. We select one warp from each scheduler from the trojan to send one bit and another corresponding warp on the spy side to receive the bit. We are successfully able to parallelize the communication in this way, leading to a bandwidth that is $N$ times more than the baseline channel. We are also able to carry out this communication independently on each of the $S$ SMs, leading to increasing the bandwidth by another factor of $S$. The Covert channel bandwidth for the baseline channel is compared to the two parallelization steps (across SMs, and across warp schedulers in each SM) in Table 3. Note that the Fermi GPU has two warp schedulers per SM while Kepler and Maxwell have four warp schedulers per SM.  \n\n", "text": "We use the observation that contention is isolated among the different warp schedulers to parallelize the covert channel attack by sending one bit through each warp scheduler concurrently. We consider $K$ warps for spy which $K$ is multiple of $N$ (the number of warp schedulers) such that the latency of $K$ warps alone is in the area of constant delay in the __sinf plots of Figure 6 for each architecture. For the trojan, we consider $M$ warps such that $M$ is also multiple of $N$ and the latency of $M+K$ is on one of the steps in the plot. Each warp of the trojan and the spy is assigned to one of the $N$ different warp schedulers. We select one warp from each scheduler from the trojan to send one bit and another corresponding warp on the spy side to receive the bit. We are successfully able to parallelize the communication in this way, leading to a bandwidth that is $N$ times more than the baseline channel. We are also able to carry out this communication independently on each of the $S$ SMs, leading to increasing the bandwidth by another factor of $S$. The Covert channel bandwidth for the baseline channel is compared to the two parallelization steps (across SMs, and across warp schedulers in each SM) in Table 3. Note that the Fermi GPU has two warp schedulers per SM while Kepler and Maxwell have four warp schedulers per SM.\n", "alignment": "left", "unique_id": "d8713fa96920f4f49afa5016fc1e62ea", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use the observation that contention is isolated among the different warp schedulers to parallelize the covert channel attack by sending one bit through each warp scheduler concurrently. We consider $K$ warps for spy which $K$ is multiple of $N$ (the number of warp schedulers) such that the latency of $K$ warps alone is in the area of constant delay in the __sinf plots of Figure 6 for each architecture. For the trojan, we consider $M$ warps such that $M$ is also multiple of $N$ and the latency of $M+K$ is on one of the steps in the plot. Each warp of the trojan and the spy is assigned to one of the $N$ different warp schedulers. We select one warp from each scheduler from the trojan to send one bit and another corresponding warp on the spy side to receive the bit. We are successfully able to parallelize the communication in this way, leading to a bandwidth that is $N$ times more than the baseline channel. We are also able to carry out this communication independently on each of the $S$ SMs, leading to increasing the bandwidth by another factor of $S$. The Covert channel bandwidth for the baseline channel is compared to the two parallelization steps (across SMs, and across warp schedulers in each SM) in Table 3. Note that the Fermi GPU has two warp schedulers per SM while Kepler and Maxwell have four warp schedulers per SM."}], "lineHeight": 0}}, "target": {"markdown": "我们利用\"争用在不同 warp 调度器之间是相互隔离的\"这一观察结果，通过让每个 warp 调度器并发地发送一个比特来实现隐蔽信道攻击的并行化。对于 spy，我们考虑 $K$ 个 warp，其中 $K$ 是 $N$（warp 调度器的数量）的倍数，从而使得仅有 $K$ 个 warp 时的延迟处于图 6 中各架构 __sinf 曲线恒定延迟的区域。对于 trojan，我们考虑 $M$ 个 warp，其中 $M$ 也是 $N$ 的倍数，且 $M+K$ 的延迟位于曲线中的某一个台阶上。trojan 和 spy 的每个 warp 被分配到 $N$ 个不同 warp 调度器中的某一个。我们从 trojan 端每个调度器中选取一个 warp 来发送一个比特，并在 spy 端选取相应的另一个 warp 来接收该比特。通过这种方式，我们成功地实现了通信的并行化，使得带宽达到基线信道的 $N$ 倍。我们还能够在 $S$ 个 SM 上各自独立地执行这种通信，从而再获得 $S$ 倍的带宽提升。表 3 对比了基线信道与经过两步并行化（跨 SM、以及每个 SM 内跨 warp 调度器）的隐蔽信道带宽。需要注意的是，Fermi GPU 每个 SM 拥有两个 warp 调度器，而 Kepler 和 Maxwell 则每个 SM 拥有四个 warp 调度器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "47a5cc6fb16e06b4e5d49506615f3eb3", "index": 145, "aliyun_index": 8, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## 8 MITIGATING NOISE\n", "text": "8 MITIGATING NOISE\n", "alignment": "left", "unique_id": "47a5cc6fb16e06b4e5d49506615f3eb3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8 MITIGATING NOISE"}], "lineHeight": 0}}, "target": {"markdown": "## 8 缓解噪声\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "b338eb10b4f0bd305e15faa7e8d673c8", "index": 146, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We consider the presence of interference from other workloads which can affect the covert channel in two ways: (1) Co-location: the other workloads may prevent the spy and trojan from being launched together, or may cause them to be assigned to different SMs preventing the high quality covert channels that are present inside an SM; and (2) Noise: even if the spy and trojan are co-located, a third application may use the resources used for covert communication adding noise or even completely disrupting communication.  \n\n", "text": "We consider the presence of interference from other workloads which can affect the covert channel in two ways: (1) Co-location: the other workloads may prevent the spy and trojan from being launched together, or may cause them to be assigned to different SMs preventing the high quality covert channels that are present inside an SM; and (2) Noise: even if the spy and trojan are co-located, a third application may use the resources used for covert communication adding noise or even completely disrupting communication.\n", "alignment": "left", "unique_id": "b338eb10b4f0bd305e15faa7e8d673c8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We consider the presence of interference from other workloads which can affect the covert channel in two ways: (1) Co-location: the other workloads may prevent the spy and trojan from being launched together, or may cause them to be assigned to different SMs preventing the high quality covert channels that are present inside an SM; and (2) Noise: even if the spy and trojan are co-located, a third application may use the resources used for covert communication adding noise or even completely disrupting communication."}], "lineHeight": 0}}, "target": {"markdown": "我们考虑了来自其他工作负载的干扰，这些干扰可能以两种方式影响隐蔽信道：(1) 共置（Co-location）：其他工作负载可能会阻止 spy 和 trojan 同时启动，或者导致它们被分配到不同的 SM，从而无法利用同一 SM 内部存在的高质量隐蔽信道；(2) 噪声：即使 spy 和 trojan 实现了共置，第三方应用也可能占用隐蔽通信所使用的资源，从而引入噪声，甚至完全破坏通信。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "97289f06cc982a0a66a8b7130e395469", "index": 147, "aliyun_index": 10, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "The high parallelism available on GPGPUs can result in high degrees of noise that challenge error detection and correction. Thus, our primary approach to manage noise is to try to prevent it completely by manipulating the block scheduler to achieve exclusive  \n\n", "text": "The high parallelism available on GPGPUs can result in high degrees of noise that challenge error detection and correction. Thus, our primary approach to manage noise is to try to prevent it completely by manipulating the block scheduler to achieve exclusive\n", "alignment": "left", "unique_id": "97289f06cc982a0a66a8b7130e395469", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The high parallelism available on GPGPUs can result in high degrees of noise that challenge error detection and correction. Thus, our primary approach to manage noise is to try to prevent it completely by manipulating the block scheduler to achieve exclusive"}], "lineHeight": 0}}, "target": {"markdown": "GPGPU 上高度可用的并行性会带来大量的噪声，从而对错误的检测与纠正构成挑战。因此，我们管理噪声的首要方法是尝试通过操纵块调度器（block scheduler）来实现独占式的资源分配，从而彻底避免噪声的产生", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "9e85a5068dbf2ff8454eae90dde36c26", "index": 148, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "co-location between the spy and trojan at the level of the SM or the full GPGPU. We take advantage of concurrency limitations on current GPUs which use leftover policy for multiprogramming. In particular, we have the trojan and spy ask for resources in a way that they can be co-located with each other but that also makes it difficult for other applications to co-locate with them. For example, the spy may ask for the maximum available amount of the shared memory (or registers, thread blocks, threads, etc.) while the trojan asks for only the leftover amount of that resource. If there are not enough registers or shared memory available per multiprocessor to process at least one block, a competing kernel will be blocked until these resources become available. In this way, once the spy and trojan are launched, they can execute on the GPU (or SM) exclusively and communicate without interference.  \n\n", "text": "co-location between the spy and trojan at the level of the SM or the full GPGPU. We take advantage of concurrency limitations on current GPUs which use leftover policy for multiprogramming. In particular, we have the trojan and spy ask for resources in a way that they can be co-located with each other but that also makes it difficult for other applications to co-locate with them. For example, the spy may ask for the maximum available amount of the shared memory (or registers, thread blocks, threads, etc.) while the trojan asks for only the leftover amount of that resource. If there are not enough registers or shared memory available per multiprocessor to process at least one block, a competing kernel will be blocked until these resources become available. In this way, once the spy and trojan are launched, they can execute on the GPU (or SM) exclusively and communicate without interference.\n", "alignment": "left", "unique_id": "9e85a5068dbf2ff8454eae90dde36c26", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "co-location between the spy and trojan at the level of the SM or the full GPGPU. We take advantage of concurrency limitations on current GPUs which use leftover policy for multiprogramming. In particular, we have the trojan and spy ask for resources in a way that they can be co-located with each other but that also makes it difficult for other applications to co-locate with them. For example, the spy may ask for the maximum available amount of the shared memory (or registers, thread blocks, threads, etc.) while the trojan asks for only the leftover amount of that resource. If there are not enough registers or shared memory available per multiprocessor to process at least one block, a competing kernel will be blocked until these resources become available. In this way, once the spy and trojan are launched, they can execute on the GPU (or SM) exclusively and communicate without interference."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "fd054358935bc9ff1268bc279f4c8fdc", "index": 149, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "In our Fermi (Tesla C2075) and Kepler (Tesla K40C) GPUs, the maximum shared memory per thread block is equal to maximum shared memory per SM (48KB). Since each of the spy and trojan needs just one thread block for communication, if the spy block asks for the maximum shared memory, it can saturate the SM in term of shared memory. In this case, the trojan block can be co-located on the same SM, if it does not use any shared memory. Any other application that uses shared memory, cannot be executed until the spy finishes and there are enough resources for thread blocks of the third application to be scheduled.  \n\n", "text": "In our Fermi (Tesla C2075) and Kepler (Tesla K40C) GPUs, the maximum shared memory per thread block is equal to maximum shared memory per SM (48KB). Since each of the spy and trojan needs just one thread block for communication, if the spy block asks for the maximum shared memory, it can saturate the SM in term of shared memory. In this case, the trojan block can be co-located on the same SM, if it does not use any shared memory. Any other application that uses shared memory, cannot be executed until the spy finishes and there are enough resources for thread blocks of the third application to be scheduled.\n", "alignment": "left", "unique_id": "fd054358935bc9ff1268bc279f4c8fdc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In our Fermi (Tesla C2075) and Kepler (Tesla K40C) GPUs, the maximum shared memory per thread block is equal to maximum shared memory per SM (48KB). Since each of the spy and trojan needs just one thread block for communication, if the spy block asks for the maximum shared memory, it can saturate the SM in term of shared memory. In this case, the trojan block can be co-located on the same SM, if it does not use any shared memory. Any other application that uses shared memory, cannot be executed until the spy finishes and there are enough resources for thread blocks of the third application to be scheduled."}], "lineHeight": 0}}, "target": {"markdown": "在我们的 Fermi（Tesla C2075）和 Kepler（Tesla K40C）GPU 上，每个线程块所能使用的最大共享内存等于每个 SM 所拥有的最大共享内存（48KB）。由于 spy 和 trojan 各自仅需要一个线程块即可进行通信，如果 spy 块申请最大共享内存，它就可以在该 SM 上独占共享内存资源。在这种情况下，只要 trojan 块不使用任何共享内存，它就可以与 spy 块共置于同一个 SM 上。任何其他使用共享内存的应用程序在 spy 执行完毕、并且有足够的资源可供第三方应用的线程块调度之前，都无法被执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "153baab7462f992be21264c9f9ae1b0c", "index": 150, "aliyun_index": 13, "page_num": 9, sm simplifies co-location of two malicious kernels on the same SM. However, it also allows other workloads to execute on the same SM, necessitating approaches for noise avoidance or tolerance. In contrast, the approach by Xu et al. [44] does not support preemption and thus allows exclusive co-location similar to current GPUs. When exclusive co-location to prevent noise is not possible, noise could be avoided or tolerated using techniques such as the following.  \n\n", "text": "As we discussed in Section 3, Wang et al.'s [41] intra-SM resource partitioning mechanism simplifies co-location of two malicious kernels on the same SM. However, it also allows other workloads to execute on the same SM, necessitating approaches for noise avoidance or tolerance. In contrast, the approach by Xu et al. [44] does not support preemption and thus allows exclusive co-location similar to current GPUs. When exclusive co-location to prevent noise is not possible, noise could be avoided or tolerated using techniques such as the following.\n", "alignment": "left", "unique_id": "3621938deb413d136fe5598dbfce00d6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As we discussed in Section 3, Wang et al.'s [41] intra-SM resource partitioning mechanism simplifies co-location of two malicious kernels on the same SM. However, it also allows other workloads to execute on the same SM, necessitating approaches for noise avoidance or tolerance. In contrast, the approach by Xu et al. [44] does not support preemption and thus allows exclusive co-location similar to current GPUs. When exclusive co-location to prevent noise is not possible, noise could be avoided or tolerated using techniques such as the following."}], "lineHeight": 0}}, "target": {"markdown": "正如我们在第 3 节中讨论的，Wang 等人 [41] 提出的 SM 内部资源划分机制简化了两个恶意内核在同一 SM 上的共置。然而，该机制也允许其他工作负载在同一 SM 上执行，因此需要采用噪声规避或噪声容忍的方法。相比之下，Xu 等人 [44] 的方法不支持抢占，因此能够像现有 GPU 那样实现独占式共置。当无法通过独占式共置来避免噪声时，可以采用诸如以下技术来规避或容忍噪声。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 154}, {"source": {"block_id": "d79a6f2262b5366798e8d586ba8268c6", "index": 155, "aliyun_index": 4, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "• Dynamically identifying idle resources: The approach is similar to whitespace communication in wireless networks where the radios opportunistically discover and use available channels without prior agreement [2], and solutions from that space can be leveraged for our problem. For example, the sender may scan through available resources (e.g. cache sets) in a pre-agreed on order until it discovers idle ones and transmits a beacon pattern on them. The receiver follows by scanning sets until it observes the beacon.  \n\n", "text": "• Dynamically identifying idle resources: The approach is similar to whitespace communication in wireless networks where the radios opportunistically discover and use available channels without prior agreement [2], and solutions from that space can be leveraged for our problem. For example, the sender may scan through available resources (e.g. cache sets) in a pre-agreed on order until it discovers idle ones and transmits a beacon pattern on them. The receiver follows by scanning sets until it observes the beacon.\n", "alignment": "left", "unique_id": "d79a6f2262b5366798e8d586ba8268c6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Dynamically identifying idle resources: The approach is similar to whitespace communication in wireless networks where the radios opportunistically discover and use available channels without prior agreement [2], and solutions from that space can be leveraged for our problem. For example, the sender may scan through available resources (e.g. cache sets) in a pre-agreed on order until it discovers idle ones and transmits a beacon pattern on them. The receiver follows by scanning sets until it observes the beacon."}], "lineHeight": 0}}, "target": {"markdown": "• 动态识别空闲资源：该方法类似于无线网络中的\"空白频谱通信\"，即无线设备机会性地发现并使用可用信道，且无需事先达成一致 [2]，我们可以借鉴该领域的解决方案来解决我们的问题。例如，发送方可以按照预先约定的顺序扫描可用资源（例如 cache 组），直至发现空闲资源，并在其上传输信标模式。随后接收方同样进行扫描，直至观察到该信标。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 155}, {"source": {"block_id": "8190040916d333b5624d210702161baa", "index": 156, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "- Error correction: transmit error correcting codes with the data (sacrificing some of the bandwidth).  \n\n", "text": "- Error correction: transmit error correcting codes with the data (sacrificing some of the bandwidth).\n", "alignment": "left", "unique_id": "8190040916d333b5624d210702161baa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "- Error correction: transmit error correcting codes with the data (sacrificing some of the bandwidth)."}], "lineHeight": 0}}, "target": {"markdown": "- 纠错：在传输数据时附带纠错码（以牺牲部分带宽为代价）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "20d192440b1099ce2c54d54e8c2d040e", "index": 157, "aliyun_index": 6, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Since we were able to establish exclusive co-location on our GPUs and achieved noise free communication, we did not pursue either of those directions.  \n\n", "text": "Since we were able to establish exclusive co-location on our GPUs and achieved noise free communication, we did not pursue either of those directions.\n", "alignment": "left", "unique_id": "20d192440b1099ce2c54d54e8c2d040e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Since we were able to establish exclusive co-location on our GPUs and achieved noise free communication, we did not pursue either of those directions."}], "lineHeight": 0}}, "target": {"markdown": "由于我们能够在我们的 GPU 上建立独占式共置并实现无噪声的通信，因此我们并未沿上述两个方向展开研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "cc57f40e32d0154a7e326f9811cc3a42", "index": 158, "aliyun_index": 7, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 9 POSSIBLE MITIGATIONS\n", "text": "9 POSSIBLE MITIGATIONS\n", "alignment": "left", "unique_id": "cc57f40e32d0154a7e326f9811cc3a42", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9 POSSIBLE MITIGATIONS"}], "lineHeight": 0}}, "target": {"markdown": "## 9 POSSIBLE MITIGATIONS\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "35665cedbf8439487deea0d344e1af3a", "index": 159, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In this section, we provide a brief discussion of possible mitigations which we hope to explore in future work. One approach is to use partitioning to ensure possibly communicating applications do not have a way to effect measurable contention to each other. Partitioning can be done spatially (e.g., partitioning the cache [9, 17, 39], or temporally (e.g., ensuring instructions from different kernels do not execute in the same time period).  \n\n", "text": "In this section, we provide a brief discussion of possible mitigations which we hope to explore in future work. One approach is to use partitioning to ensure possibly communicating applications do not have a way to effect measurable contention to each other. Partitioning can be done spatially (e.g., partitioning the cache [9, 17, 39], or temporally (e.g., ensuring instructions from different kernels do not execute in the same time period).\n", "alignment": "left", "unique_id": "35665cedbf8439487deea0d344e1af3a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section, we provide a brief discussion of possible mitigations which we hope to explore in future work. One approach is to use partitioning to ensure possibly communicating applications do not have a way to effect measurable contention to each other. Partitioning can be done spatially (e.g., partitioning the cache [9, 17, 39], or temporally (e.g., ensuring instructions from different kernels do not execute in the same time period)."}], "lineHeight": 0}}, "target": {"markdown": "本节中，我们将简要讨论未来工作中希望进一步探索的若干可能的缓解措施。一种思路是通过资源划分来确保可能相互通信的应用程序之间不会产生可被观测到的资源争用。划分既可以按空间进行（例如对缓存进行划分 [9, 17, 39]），也可以按时间进行（例如确保来自不同内核的指令不会在同一时间段内执行）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "811b75d5abe969f15af6effc98e46999", "index": 160, "aliyun_index": 9, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Specifically on GPUs, partitioning can be achieved at intra-SM\nand inter-SM level resources through scheduling of different applica-\ntion thread blocks or warps to separate them temporally or spatially.\nIn addition, it is possible to fairly partition shared hardware resources\namong multiple simultaneous kernels based on their workload and\nresource requirements and make these partitions private to each ap-\nplication to eliminate interference. Although these approaches may\nlead to performance degradation and add some hardware overhead,\nthey can prevent covert and side channel attacks which are results of\nunrestricted access to shared hardware resource from two or more\nco-located applications.  \n\n", "text": "Specifically on GPUs, partitioning can be achieved at intra-SM\nand inter-SM level resources through scheduling of different applica-\ntion thread blocks or warps to separate them temporally or spatially.\nIn addition, it is possible to fairly partition shared hardware resources\namong multiple simultaneous kernels based on their workload and\nresource requirements and make these partitions private to each ap-\nplication to eliminate interference. Although these approaches may\nlead to performance degradation and add some hardware overhead,\nthey can prevent covert and side channel attacks which are results of\nunrestricted access to shared hardware resource from two or more\nco-located applications.\n", "alignment": "left", "unique_id": "811b75d5abe969f15af6effc98e46999", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Specifically on GPUs, partitioning can be achieved at intra-SM"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and inter-SM level resources through scheduling of different applica-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tion thread blocks or warps to separate them temporally or spatially."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In addition, it is possible to fairly partition shared hardware resources"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "among multiple simultaneous kernels based on their workload and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "resource requirements and make these partitions private to each ap-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "plication to eliminate interference. Although these approaches may"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "lead to performance degradation and add some hardware overhead,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "they can prevent covert and side channel attacks which are results of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "unrestricted access to shared hardware resource from two or more"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "co-located applications."}], "lineHeight": -288}}, "target": {"markdown": "具体到 GPU 上，资源划分可以通过对不同应用程序的线程块或 warp 进行调度，将它们在时间或空间上分离，从而在 SM 内部和 SM 之间两个层面上实现资源划分。此外，还可以根据多个同时运行内核的工作负载和资源需求，对共享硬件资源进行公平划分，并将这些划分对每个应用程序设置为私有，从而彻底消除相互干扰。尽管这些方法可能会带来一定的性能下降并增加部分硬件开销，但它们能够有效防止隐蔽信道和侧信道攻击——这些攻击的产生正是源于两个或多个共置应用程序对共享硬件资源的无限制访问。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "6ec6a3ed1c1e0f9afa2456dcd30e7e10", "index": 161, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Another mitigation approach is to attempt to detect anomalous contention [6]. Given the different nature of GPGPU workloads and the degree of contention that is likely to arise naturally, a detailed  \n\n", "text": "Another mitigation approach is to attempt to detect anomalous contention [6]. Given the different nature of GPGPU workloads and the degree of contention that is likely to arise naturally, a detailed\n", "alignment": "left", "unique_id": "6ec6a3ed1c1e0f9afa2456dcd30e7e10", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Another mitigation approach is to attempt to detect anomalous contention [6]. Given the different nature of GPGPU workloads and the degree of contention that is likely to arise naturally, a detailed"}], "lineHeight": 0}}, "target": {"markdown": "另一种缓解措施是尝试检测异常的资源争用 [6]。鉴于 GPGPU 工作负载的多样性以及天然可能产生的争用程度，仍需进行详细", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "996af5a9c8ef4256c4d958d06e3bf3c7", "index": 162, "aliyun_index": 11, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "evaluation of this class of solutions is necessary to assess its effectiveness. Solutions are possible that add entropy either to the assignment of the resources [40] or to the measurement of time [20]. Finally, scheduling algorithms that interfere with co-location, accommodate preemption, or prevent exclusive co-location (to introduce noise), can significantly complicate the attack.  \n\n", "text": "evaluation of this class of solutions is necessary to assess its effectiveness. Solutions are possible that add entropy either to the assignment of the resources [40] or to the measurement of time [20]. Finally, scheduling algorithms that interfere with co-location, accommodate preemption, or prevent exclusive co-location (to introduce noise), can significantly complicate the attack.\n", "alignment": "left", "unique_id": "996af5a9c8ef4256c4d958d06e3bf3c7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "evaluation of this class of solutions is necessary to assess its effectiveness. Solutions are possible that add entropy either to the assignment of the resources [40] or to the measurement of time [20]. Finally, scheduling algorithms that interfere with co-location, accommodate preemption, or prevent exclusive co-location (to introduce noise), can significantly complicate the attack."}], "lineHeight": 0}}, "target": {"markdown": "的评估，以判断该类方案的有效性。此外，还可以采用增加资源分配随机性的方案 [40]，或者增加时间测量随机性的方案 [20]。最后，能够干扰共置、支持抢占或阻止独占式共置（从而引入噪声）的调度算法，可以显著增加攻击的难度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "e1da2d6d1fda12eb6a026c612b4205b2", "index": 163, "aliyun_index": 12, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 10 RELATED WORK\n", "text": "10 RELATED WORK\n", "alignment": "left", "unique_id": "e1da2d6d1fda12eb6a026c612b4205b2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10 RELATED WORK"}], "lineHeight": 0}}, "target": {"markdown": "## 10 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "ac91dfa452a546e422525835e312dd37", "index": 164, "aliyun_index": 13, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Olson et al [30] developed a taxonomy of vulnerabilities and security threats for accelerators based on threat types (Confidentiality, Integrity, and Availability) and risk categories (what part of the accelerator they affect). Although the paper offers no concrete attacks, it highlights that security of accelerators warrants significant attention. Olson et al. [29] also propose sandboxing accelerators when the CPU and the accelerators share the same address space (e.g., under a Heterogeneous System Architecture configuration). This type of defense does not protect against side- and covert-channel vulnerabilities.  \n\n", "text": "Olson et al [30] developed a taxonomy of vulnerabilities and security threats for accelerators based on threat types (Confidentiality, Integrity, and Availability) and risk categories (what part of the accelerator they affect). Although the paper offers no concrete attacks, it highlights that security of accelerators warrants significant attention. Olson et al. [29] also propose sandboxing accelerators when the CPU and the accelerators share the same address space (e.g., under a Heterogeneous System Architecture configuration). This type of defense does not protect against side- and covert-channel vulnerabilities.\n", "alignment": "left", "unique_id": "ac91dfa452a546e422525835e312dd37", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Olson et al [30] developed a taxonomy of vulnerabilities and security threats for accelerators based on threat types (Confidentiality, Integrity, and Availability) and risk categories (what part of the accelerator they affect). Although the paper offers no concrete attacks, it highlights that security of accelerators warrants significant attention. Olson et al. [29] also propose sandboxing accelerators when the CPU and the accelerators share the same address space (e.g., under a Heterogeneous System Architecture configuration). This type of defense does not protect against side- and covert-channel vulnerabilities."}], "lineHeight": 0}}, "target": {"markdown": "Olson 等人 [30] 针对加速器提出了一套基于威胁类型（机密性、完整性和可用性）和风险类别（加速器的受影响部分）的漏洞与安全威胁分类法。尽管该论文并未给出具体的攻击，但它强调加速器的安全性值得高度关注。Olson 等人 [29] 还提出在 CPU 与加速器共享同一地址空间（例如在异构系统架构配置下）时，对加速器进行沙箱化处理。然而，这类防御措施无法抵御侧信道和隐蔽信道漏洞。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "f511b7d8d28743b1171daddfa4349582", "index": 165, "aliyun_index": 14, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Lee et al. [16] reveal three major security threats in GPUs including: lack of initialization of newly allocated memory pages, un-erasable portion of GPU memory (e.g., constant data) and lack of prevention of threads of a kernel to access the contents stored in the local and private memories, written by threads of other kernels. When multiple users share the same GPU, there is information leakage between concurrently running processes or from processes that recently terminated. They utilize information leakage that occurs due to not clearing newly-allocated memory in the GPU to extract rearranged webpage textures of Chromium and Firefox web browsers (both use GPU-accelerated rendering) from Nvidia and AMD GPUs.  \n\n", "text": "Lee et al. [16] reveal three major security threats in GPUs including: lack of initialization of newly allocated memory pages, un-erasable portion of GPU memory (e.g., constant data) and lack of prevention of threads of a kernel to access the contents stored in the local and private memories, written by threads of other kernels. When multiple users share the same GPU, there is information leakage between concurrently running processes or from processes that recently terminated. They utilize information leakage that occurs due to not clearing newly-allocated memory in the GPU to extract rearranged webpage textures of Chromium and Firefox web browsers (both use GPU-accelerated rendering) from Nvidia and AMD GPUs.\n", "alignment": "left", "unique_id": "f511b7d8d28743b1171daddfa4349582", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Lee et al. [16] reveal three major security threats in GPUs including: lack of initialization of newly allocated memory pages, un-erasable portion of GPU memory (e.g., constant data) and lack of prevention of threads of a kernel to access the contents stored in the local and private memories, written by threads of other kernels. When multiple users share the same GPU, there is information leakage between concurrently running processes or from processes that recently terminated. They utilize information leakage that occurs due to not clearing newly-allocated memory in the GPU to extract rearranged webpage textures of Chromium and Firefox web browsers (both use GPU-accelerated rendering) from Nvidia and AMD GPUs."}], "lineHeight": 0}}, "target": {"markdown": "Lee 等人 [16] 揭示了 GPU 中三类主要的安全威胁，包括：新分配的内存页未被初始化、GPU 内存中存在无法擦除的部分（例如常量数据），以及未能阻止同一内核的线程访问由其他内核线程写入的本地内存和私有内存内容。当多个用户共享同一块 GPU 时，正在并发运行的进程之间，或与近期终止的进程之间，会发生信息泄露。他们利用 GPU 中新分配内存未清除所导致的信息泄露，分别从 Nvidia 和 AMD 的 GPU 中成功提取了 Chromium 和 Firefox 浏览器（两者均采用 GPU 加速渲染）经过重新排列的网页纹理。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "843f8d9ea3d242195f4355b4695383ce", "index": 166, "aliyun_index": 15, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Similar attacks are presented by Di Pietro et al. [33] who also exploit non-zeroed state available in shared-memory, global-memory and registers. Maurice et al. [22] show that the attacks translate to virtualized and cloud computing environments where the adversary launches a virtual machine after the victim's virtual machine using the same GPU. This class of vulnerability can be closed by clearing memory before it gets reallocated to a different application.  \n\n", "text": "Similar attacks are presented by Di Pietro et al. [33] who also exploit non-zeroed state available in shared-memory, global-memory and registers. Maurice et al. [22] show that the attacks translate to virtualized and cloud computing environments where the adversary launches a virtual machine after the victim's virtual machine using the same GPU. This class of vulnerability can be closed by clearing memory before it gets reallocated to a different application.\n", "alignment": "left", "unique_id": "843f8d9ea3d242195f4355b4695383ce", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Similar attacks are presented by Di Pietro et al. [33] who also exploit non-zeroed state available in shared-memory, global-memory and registers. Maurice et al. [22] show that the attacks translate to virtualized and cloud computing environments where the adversary launches a virtual machine after the victim's virtual machine using the same GPU. This class of vulnerability can be closed by clearing memory before it gets reallocated to a different application."}], "lineHeight": 0}}, "target": {"markdown": "Di Pietro 等人 [33] 也提出了类似的攻击，他们同样利用了共享内存、全局内存以及寄存器中未被清零的状态。Maurice 等人 [22] 则证明，这类攻击同样适用于虚拟化和云计算环境：在受害者的虚拟机运行结束之后，攻击者可以启动另一台使用同一块 GPU 的虚拟机继续实施攻击。通过在内存被重新分配给其他应用程序之前对其进行清除，可以彻底消除此类漏洞。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "6991a37b3d9cdf04c105c812fb1e30da", "index": 167, "aliyun_index": 16, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Because GPGPUs have separate physical resources, PixelVault proposes using them as secure co-processors [37]. Recent work has shown that GPGPUs are vulnerable to disclosure attacks through the driver from a privileged user on the CPU, bringing into question the security of the PixelVault model [46]. Such attacks require root access and are outside our threat model.  \n\n", "text": "Because GPGPUs have separate physical resources, PixelVault proposes using them as secure co-processors [37]. Recent work has shown that GPGPUs are vulnerable to disclosure attacks through the driver from a privileged user on the CPU, bringing into question the security of the PixelVault model [46]. Such attacks require root access and are outside our threat model.\n", "alignment": "left", "unique_id": "6991a37b3d9cdf04c105c812fb1e30da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Because GPGPUs have separate physical resources, PixelVault proposes using them as secure co-processors [37]. Recent work has shown that GPGPUs are vulnerable to disclosure attacks through the driver from a privileged user on the CPU, bringing into question the security of the PixelVault model [46]. Such attacks require root access and are outside our threat model."}], "lineHeight": 0}}, "target": {"markdown": "由于 GPGPU 拥有独立的物理资源，PixelVault 提出将它们用作安全协处理器 [37]。然而，已有近期研究表明，GPGPU 容易受到来自 CPU 端特权用户经由驱动程序实施的泄露攻击，从而对 PixelVault 模型的安全性提出了质疑 [46]。此类攻击需要 root 权限，不属于本文所考虑的威胁模型范畴。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "dd0817f560fa522d5c2129a9da55a12a", "index": 168, "aliyun_index": 17, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Covert channels have been explored by many studies in the context of CPUs (e.g., [11, 13, 18, 21, 23, 32, 38]). For an overview, an excellent recent study characterized the bandwidth of several CPU contention-based covert channels including cache based covert channels [13] in a noisy setting. They derived a theoretical upper bound on capacity of practical channels and found the L1 covert channels (216 Kbps) and memory bus (565 Kbps) to be the two of highest upper bound capacity channels in theory. However, these are theoretical bounds and no channels under realistic conditions were demonstrated. Gruss et al. [12] study covert channels under the assumption that the attacker and the victim have accessed to shared memory pages (e.g., from shared libraries). They show a Flush+Reload attack with 2.3 Mbps and 0% error rate and a Flush+Flush attack with 3.9 Mbps and 0.84% error rate. Note that these attacks do not rely  \n\n", "text": "Covert channels have been explored by many studies in the context of CPUs (e.g., [11, 13, 18, 21, 23, 32, 38]). For an overview, an excellent recent study characterized the bandwidth of several CPU contention-based covert channels including cache based covert channels [13] in a noisy setting. They derived a theoretical upper bound on capacity of practical channels and found the L1 covert channels (216 Kbps) and memory bus (565 Kbps) to be the two of highest upper bound capacity channels in theory. However, these are theoretical bounds and no channels under realistic conditions were demonstrated. Gruss et al. [12] study covert channels under the assumption that the attacker and the victim have accessed to shared memory pages (e.g., from shared libraries). They show a Flush+Reload attack with 2.3 Mbps and 0% error rate and a Flush+Flush attack with 3.9 Mbps and 0.84% error rate. Note that these attacks do not rely\n", "alignment": "left", "unique_id": "dd0817f560fa522d5c2129a9da55a12a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Covert channels have been explored by many studies in the context of CPUs (e.g., [11, 13, 18, 21, 23, 32, 38]). For an overview, an excellent recent study characterized the bandwidth of several CPU contention-based covert channels including cache based covert channels [13] in a noisy setting. They derived a theoretical upper bound on capacity of practical channels and found the L1 covert channels (216 Kbps) and memory bus (565 Kbps) to be the two of highest upper bound capacity channels in theory. However, these are theoretical bounds and no channels under realistic conditions were demonstrated. Gruss et al. [12] study covert channels under the assumption that the attacker and the victim have accessed to shared memory pages (e.g., from shared libraries). They show a Flush+Reload attack with 2.3 Mbps and 0% error rate and a Flush+Flush attack with 3.9 Mbps and 0.84% error rate. Note that these attacks do not rely"}], "lineHeight": 0}}, "target": {"markdown": "隐蔽信道已在 CPU 领域的众多研究中被广泛探讨（例如 [11, 13, 18, 21, 23, 32, 38]）。在概览方面，一项优秀的近期研究在有噪声的环境中对多种基于争用的 CPU 隐蔽信道的带宽进行了表征，其中也包括基于缓存的隐蔽信道 [13]。他们推导出了实际信道容量的理论上限，发现 L1 隐蔽信道（216 Kbps）和内存总线（565 Kbps）是理论上上限容量最高的两种信道。然而，这些仅为理论上限，在实际条件下尚未有相应的信道得到验证。Gruss 等人 [12] 在假设攻击者和受害者能够访问共享内存页（例如来自共享库）的前提下研究隐蔽信道。他们实现了一种 Flush+Reload 攻击，带宽为 2.3 Mbps，错误率为 0%，以及一种 Flush+Flush 攻击，带宽为 3.9 Mbps，错误率为 0.84%。值得注意的是，这些攻击并不依赖", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "d98dabc6e88da0fb234825e1fdd7c90d", "index": 169, "aliyun_index": 2, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "on contention and are not possible if there are no shared pages between the trojan and spy. These channels were also not tested under noisy environments, and therefore these results should be considered an upper bound on the achievable bandwidth. Maurice et al. [23] characterize noise on cache covert channels and propose an error handling protocol to build a reliable covert channel through which they can build an ssh connection. They obtained a bandwidth of 360 Kbps with 0% error rate for covert channel on Amazon EC2. The GPGPU covert channels we demonstrated obtain robust and error free communication with much higher bandwidth, by exploiting the inherent parallelism in GPGPUs, and controlling noise through exclusive co-location.  \n\n", "text": "on contention and are not possible if there are no shared pages between the trojan and spy. These channels were also not tested under noisy environments, and therefore these results should be considered an upper bound on the achievable bandwidth. Maurice et al. [23] characterize noise on cache covert channels and propose an error handling protocol to build a reliable covert channel through which they can build an ssh connection. They obtained a bandwidth of 360 Kbps with 0% error rate for covert channel on Amazon EC2. The GPGPU covert channels we demonstrated obtain robust and error free communication with much higher bandwidth, by exploiting the inherent parallelism in GPGPUs, and controlling noise through exclusive co-location.\n", "alignment": "left", "unique_id": "d98dabc6e88da0fb234825e1fdd7c90d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "on contention and are not possible if there are no shared pages between the trojan and spy. These channels were also not tested under noisy environments, and therefore these results should be considered an upper bound on the achievable bandwidth. Maurice et al. [23] characterize noise on cache covert channels and propose an error handling protocol to build a reliable covert channel through which they can build an ssh connection. They obtained a bandwidth of 360 Kbps with 0% error rate for covert channel on Amazon EC2. The GPGPU covert channels we demonstrated obtain robust and error free communication with much higher bandwidth, by exploiting the inherent parallelism in GPGPUs, and controlling noise through exclusive co-location."}], "lineHeight": 0}}, "target": {"markdown": "于资源争用，并且在特洛伊木马与间谍进程之间不存在共享内存页的情况下便无法实施。此外，这些信道也未在有噪声环境下进行测试，因此其结果应被视为可达带宽的上限。Maurice 等人 [23] 对缓存隐蔽信道中的噪声进行了表征，并提出了一种错误处理协议，用以构建一条可靠的隐蔽信道，进而通过该信道建立 SSH 连接。他们在 Amazon EC2 上实现了带宽为 360 Kbps、错误率为 0% 的隐蔽信道。而本文所展示的 GPGPU 隐蔽信道利用了 GPGPU 内在的并行性，并通过独占式共置控制噪声，实现了带宽显著更高且稳定无误码的通信。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "2e4f0df2732e2ba7e41ca712988d3661", "index": 170, "aliyun_index": 3, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "A few defenses against covert channels have appeared in the context of CPU channels. Chen et al. [6] proposed a framework to detect and mitigate timing covert channel on shared hardware resources on a CPU by monitoring conflicts. Hunger et al. propose a different approach to the detection of contention [13]. Yan et al. propose a record and replay framework that reconfigures shared resources during replay to detect unnatural contention indicative of covert channels [45].  \n\n", "text": "A few defenses against covert channels have appeared in the context of CPU channels. Chen et al. [6] proposed a framework to detect and mitigate timing covert channel on shared hardware resources on a CPU by monitoring conflicts. Hunger et al. propose a different approach to the detection of contention [13]. Yan et al. propose a record and replay framework that reconfigures shared resources during replay to detect unnatural contention indicative of covert channels [45].\n", "alignment": "left", "unique_id": "2e4f0df2732e2ba7e41ca712988d3661", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A few defenses against covert channels have appeared in the context of CPU channels. Chen et al. [6] proposed a framework to detect and mitigate timing covert channel on shared hardware resources on a CPU by monitoring conflicts. Hunger et al. propose a different approach to the detection of contention [13]. Yan et al. propose a record and replay framework that reconfigures shared resources during replay to detect unnatural contention indicative of covert channels [45]."}], "lineHeight": 0}}, "target": {"markdown": "针对 CPU 隐蔽信道，已有少量防御方案相继提出。Chen 等人 [6] 提出了一种框架，通过监控冲突来检测和缓解 CPU 上共享硬件资源的时序隐蔽信道。Hunger 等人则提出了另一种不同的资源争用检测方法 [13]。Yan 等人提出了一种记录与重放框架，在重放过程中重新配置共享资源，以检测隐蔽信道所特有的异常争用 [45]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "d12a8abeabf6a50ae8e700c08b180d57", "index": 171, "aliyun_index": 4, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Side-channel vulnerabilities are a dual of covert channel vulnerabilities where the leakage through the side channel is exploited by a spy to derive sensitive information from an executing victim; many CPU side channel attacks have been explored, including attacks on caches (e.g., [18, 32]). Several defenses and mitigations for these attacks have been proposed (e.g., [9, 17, 39, 40]). Two recent papers [14, 19] demonstrate the feasibility of side channel attacks on GPGPUs. Luo et al. [19] utilize a power-based side-channel attack on a GPU to gain secret information from an AES implementation being accelerated by the GPU.  \n\n", "text": "Side-channel vulnerabilities are a dual of covert channel vulnerabilities where the leakage through the side channel is exploited by a spy to derive sensitive information from an executing victim; many CPU side channel attacks have been explored, including attacks on caches (e.g., [18, 32]). Several defenses and mitigations for these attacks have been proposed (e.g., [9, 17, 39, 40]). Two recent papers [14, 19] demonstrate the feasibility of side channel attacks on GPGPUs. Luo et al. [19] utilize a power-based side-channel attack on a GPU to gain secret information from an AES implementation being accelerated by the GPU.\n", "alignment": "left", "unique_id": "d12a8abeabf6a50ae8e700c08b180d57", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Side-channel vulnerabilities are a dual of covert channel vulnerabilities where the leakage through the side channel is exploited by a spy to derive sensitive information from an executing victim; many CPU side channel attacks have been explored, including attacks on caches (e.g., [18, 32]). Several defenses and mitigations for these attacks have been proposed (e.g., [9, 17, 39, 40]). Two recent papers [14, 19] demonstrate the feasibility of side channel attacks on GPGPUs. Luo et al. [19] utilize a power-based side-channel attack on a GPU to gain secret information from an AES implementation being accelerated by the GPU."}], "lineHeight": 0}}, "target": {"markdown": "侧信道漏洞与隐蔽信道漏洞是一对孪生问题：在侧信道漏洞中，间谍进程利用通过侧信道泄漏的信息来推导受害进程正在执行的敏感数据；CPU 上的许多侧信道攻击已得到广泛研究，包括针对缓存的攻击（例如 [18, 32]）。针对这些攻击，研究者们也提出了若干防御与缓解措施（例如 [9, 17, 39, 40]）。最近有两篇论文 [14, 19] 证明了在 GPGPU 上实施侧信道攻击的可行性。Luo 等人 [19] 利用针对 GPU 的基于功耗的侧信道攻击，从 GPU 加速执行的 AES 实现中获取了密钥信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "6c1f3f37ba825634eeea2179fd9f5ab5", "index": 172, "aliyun_index": 5, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Jiang et al. [14] conduct the first timing attack at the architecture level on GPU. Due to inherent SIMT and memory coalescing behavior present on GPUs, they identify the correlation between execution time of a single kernel and unique cache line requests. By calculating the number of unique cache line requests for different guessed keys and observing the correlation with the measured execution time, the correct key at the last round of AES encryption is extracted. The same group [15] presented another attack on table-based AES encryption. They found correlation between execution time of one table lookup of a warp and a number of bank conflicts generated by threads. They use these key-dependent differences in timing to correlate measured execution time to the key at the last round of the AES encryption as it executes on the GPU. Unlike the channels we explore in this paper, these timing channels are measured from the CPU side, limiting their bandwidth, and requiring each kernel to be able to launch (or anticipate the launch) of the other to time it.  \n\n", "text": "Jiang et al. [14] conduct the first timing attack at the architecture level on GPU. Due to inherent SIMT and memory coalescing behavior present on GPUs, they identify the correlation between execution time of a single kernel and unique cache line requests. By calculating the number of unique cache line requests for different guessed keys and observing the correlation with the measured execution time, the correct key at the last round of AES encryption is extracted. The same group [15] presented another attack on table-based AES encryption. They found correlation between execution time of one table lookup of a warp and a number of bank conflicts generated by threads. They use these key-dependent differences in timing to correlate measured execution time to the key at the last round of the AES encryption as it executes on the GPU. Unlike the channels we explore in this paper, these timing channels are measured from the CPU side, limiting their bandwidth, and requiring each kernel to be able to launch (or anticipate the launch) of the other to time it.\n", "alignment": "left", "unique_id": "6c1f3f37ba825634eeea2179fd9f5ab5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Jiang et al. [14] conduct the first timing attack at the architecture level on GPU. Due to inherent SIMT and memory coalescing behavior present on GPUs, they identify the correlation between execution time of a single kernel and unique cache line requests. By calculating the number of unique cache line requests for different guessed keys and observing the correlation with the measured execution time, the correct key at the last round of AES encryption is extracted. The same group [15] presented another attack on table-based AES encryption. They found correlation between execution time of one table lookup of a warp and a number of bank conflicts generated by threads. They use these key-dependent differences in timing to correlate measured execution time to the key at the last round of the AES encryption as it executes on the GPU. Unlike the channels we explore in this paper, these timing channels are measured from the CPU side, limiting their bandwidth, and requiring each kernel to be able to launch (or anticipate the launch) of the other to time it."}], "lineHeight": 0}}, "target": {"markdown": "Jiang 等人 [14] 首次在架构层面对 GPU 实施了时序攻击。由于 GPU 天然具备 SIMT 执行模式和内存合并访问行为，他们识别出了单个内核执行时间与唯一缓存行请求数量之间的相关性。通过计算不同猜测密钥所对应的唯一缓存行请求数量，并将其与所测得的执行时间进行相关性分析，他们成功提取出了 AES 加密最后一轮的正确密钥。同一个研究团队 [15] 还提出了另一种针对基于查表的 AES 加密的攻击。他们发现一个 warp 的一次查表执行时间与线程所产生的存储体（bank）冲突数量之间存在相关性。利用这种与密钥相关的时序差异，他们将测得的执行时间与 GPU 上执行的 AES 加密最后一轮的密钥进行关联。与本文所探讨的信道不同，这些时序信道是从 CPU 端进行测量的，因此带宽受限，并且要求一方内核必须能够启动（或预判启动）另一方内核以便对其计时。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 172}, {"source": {"block_id": "1127efe3583240f50b1dac1d550032b5", "index": 173, "aliyun_index": 6, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "We also found that the self-contention exploited [14] cannot be used for covert communication. Although memory coalescing and shared memory bank conflicts make a large difference in the timing of one kernel, these artifacts had little measurable effect on the timing of a competing kernel.  \n\n", "text": "We also found that the self-contention exploited [14] cannot be used for covert communication. Although memory coalescing and shared memory bank conflicts make a large difference in the timing of one kernel, these artifacts had little measurable effect on the timing of a competing kernel.\n", "alignment": "left", "unique_id": "1127efe3583240f50b1dac1d550032b5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We also found that the self-contention exploited [14] cannot be used for covert communication. Although memory coalescing and shared memory bank conflicts make a large difference in the timing of one kernel, these artifacts had little measurable effect on the timing of a competing kernel."}], "lineHeight": 0}}, "target": {"markdown": "我们还发现，[14] 中所利用的自争用现象无法用于隐蔽通信。尽管内存合并访问和共享内存存储体冲突会对单个内核的时序产生显著影响，但这些效应在竞争内核的时序上几乎无法被测量出来。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 173}, {"source": {"block_id": "d1c3dffb39df1314f8624eb5c32173b6", "index": 174, "aliyun_index": 7, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 11 CONCLUDING REMARKS\n", "text": "11 CONCLUDING REMARKS\n", "alignment": "left", "unique_id": "d1c3dffb39df1314f8624eb5c32173b6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "11 CONCLUDING REMARKS"}], "lineHeight": 0}}, "target": {"markdown": "## 11 总结\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 174}, {"source": {"block_id": "3f05817cdaf77351de87c1b5106545c0", "index": 175, "aliyun_index": 8, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "This paper demonstrates the feasibility of covert channel communication on GPGPUs. We explored how the communicating kernels can  \n\n", "text": "This paper demonstrates the feasibility of covert channel communication on GPGPUs. We explored how the communicating kernels can\n", "alignment": "left", "unique_id": "3f05817cdaf77351de87c1b5106545c0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper demonstrates the feasibility of covert channel communication on GPGPUs. We explored how the communicating kernels can"}], "lineHeight": 0}}, "target": {"markdown": "本文证明了在 GPGPU 上实施隐蔽信道通信的可行性。我们探讨了通信内核如何", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 175}, {"source": {"block_id": "c44ac58b3186d5ba032896fc34c1d00f", "index": 176, "aliyun_index": 9, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "leverage the block scheduler and then warp to warp scheduler mapping to achieve co-residency. Based on their co-residency options (on the same SM or across SMs), the SM local resources or inter-SM shared resources can be used for contention. We demonstrated attacks on constant caches, functional units and global memory on three generations of Nvidia GPUs. We explored different optimizations to increase the bandwidth using synchronization and available parallelism on the GPGPU. We also demonstrated preventing interference from other workloads (Rodinia benchmark) on covert communication. Our experiments on constructing covert channels through different shared hardware resources show that high bandwidth (over 4 Mbps) and error free covert communication is feasible on GPGPUs. Our future works will include exploring the possibility of side channel attacks on GPGPUs, as well as implementation of some mitigation techniques against covert- and side-channels.  \n\n", "text": "leverage the block scheduler and then warp to warp scheduler mapping to achieve co-residency. Based on their co-residency options (on the same SM or across SMs), the SM local resources or inter-SM shared resources can be used for contention. We demonstrated attacks on constant caches, functional units and global memory on three generations of Nvidia GPUs. We explored different optimizations to increase the bandwidth using synchronization and available parallelism on the GPGPU. We also demonstrated preventing interference from other workloads (Rodinia benchmark) on covert communication. Our experiments on constructing covert channels through different shared hardware resources show that high bandwidth (over 4 Mbps) and error free covert communication is feasible on GPGPUs. Our future works will include exploring the possibility of side channel attacks on GPGPUs, as well as implementation of some mitigation techniques against covert- and side-channels.\n", "alignment": "left", "unique_id": "c44ac58b3186d5ba032896fc34c1d00f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "leverage the block scheduler and then warp to warp scheduler mapping to achieve co-residency. Based on their co-residency options (on the same SM or across SMs), the SM local resources or inter-SM shared resources can be used for contention. We demonstrated attacks on constant caches, functional units and global memory on three generations of Nvidia GPUs. We explored different optimizations to increase the bandwidth using synchronization and available parallelism on the GPGPU. We also demonstrated preventing interference from other workloads (Rodinia benchmark) on covert communication. Our experiments on constructing covert channels through different shared hardware resources show that high bandwidth (over 4 Mbps) and error free covert communication is feasible on GPGPUs. Our future works will include exploring the possibility of side channel attacks on GPGPUs, as well as implementation of some mitigation techniques against covert- and side-channels."}], "lineHeight": 0}}, "target": {"markdown": "利用块调度器以及 warp 到 warp 调度器的映射，通信内核能够实现共驻。基于其共驻选项（位于同一 SM 上或跨多个 SM），可以使用 SM 本地资源或跨 SM 共享资源进行争用。我们在三代 Nvidia GPU 上展示了对常量缓存、功能单元和全局内存的攻击。我们探讨了多种优化方法，利用 GPGPU 上的同步与可用并行性来提升带宽。我们还演示了如何阻止其他工作负载（Rodinia 基准测试）对隐蔽通信的干扰。我们针对不同共享硬件资源构建隐蔽信道的实验表明，在 GPGPU 上实现高带宽（超过 4 Mbps）且无误码的隐蔽通信是可行的。我们未来的工作将包括探索在 GPGPU 上实施侧信道攻击的可能性，以及实现针对隐蔽信道和侧信道的若干缓解技术。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 176}, {"source": {"block_id": "39977ea7de515a009769f7ba8f6c7b4f", "index": 177, "aliyun_index": 10, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 12 ACKNOWLEDGEMENT\n", "text": "12 ACKNOWLEDGEMENT\n", "alignment": "left", "unique_id": "39977ea7de515a009769f7ba8f6c7b4f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "12 ACKNOWLEDGEMENT"}], "lineHeight": 0}}, "target": {"markdown": "## 12 致谢\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 177}, {"source": {"block_id": "272a8277b10cda7260377677f9745103", "index": 178, "aliyun_index": 11, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "This material is based on research sponsored by the National Science\nFoundation grants CNS-1422401 and CNS-1619450.  \n\n", "text": "This material is based on research sponsored by the National Science\nFoundation grants CNS-1422401 and CNS-1619450.\n", "alignment": "left", "unique_id": "272a8277b10cda7260377677f9745103", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This mat <script>

function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){
  const cells = line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
  return cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()) || c.trim()==='');
}
function isPipeRow(line){ return /\|/.test(line); }
function rowCells(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
}
function tableHtml(rows){
  if (!rows.length) return '';
  let html = '<table><thead><tr>';
  for (const c of rowCells(rows[0])) html += `<th>${inlineMd(c)}</th>`;
  html += '</tr></thead><tbody>';
  const start = (rows.length>1 && isSepRow(rows[1])) ? 2 : 1;
  for (let i=start;i<rows.length;i++){
    if (isSepRow(rows[i])) continue;
    html += '<tr>';
    for (const c of rowCells(rows[i])) html += `<td>${inlineMd(c)}</td>`;
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){
  const slots = [];
  let raw = String(t||'');
  raw = raw.replace(/\$\$([\s\S]+?)\$\$/g, (_,m) => {
    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i].trim())){
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;
      }
      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*[-*•]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);
}
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  setTimeout(() => toastEl.style.display = 'none', 1600);
}
function counts(){
  const c = {translated:0,skipped:0,failed:0,pending:0,edited:0};
  for (const p of DATA.pairs){ if (c[p.target.status]!==undefined) c[p.target.status]++; else c.pending++; }
  return c;
}
function pickMd(p, which){
  if (which==='source') return p.source.markdown||'';
  return (p.target.markdown || p.source.markdown || '');
}
function headingId(blockId){ return 'sec-'+blockId; }
const foldedIds = new Set();
function outlineTree(list){
  const root = [];
  const stack = [];
  (list||[]).forEach(e => {
    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();
    if (!stack.length) root.push(node); else stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root;
}
function tocNodeHtml(node){
  const kids = node.children||[];
  const leaf = kids.length===0;
  const folded = foldedIds.has(node.block_id);
  return `<div class="toc-node lv${node.level}${folded?' folded':''}" data-bid="${esc(node.block_id)}">
    <div class="toc-row">
      <button type="button" class="toc-twist${leaf?' leaf':''}" data-fold="${esc(node.block_id)}" aria-expanded="${leaf? 'true': String(!folded)}">${leaf?'•':'▾'}</button>
      <a href="#${headingId(node.block_id)}" data-bid="${esc(node.block_id)}">${esc(node.title)}</a>
    </div>
    ${leaf?'':`<div class="toc-kids">${kids.map(tocNodeHtml).join('')}</div>`}
  </div>`;
}
function renderToc(){
  const box = document.getElementById('toc');
  const outline = DATA.outline || [];
  if (!outline.length){ box.innerHTML = '<div style="padding:8px 18px;color:#78716c">暂无目录</div>'; return; }
  box.innerHTML = outlineTree(outline).map(tocNodeHtml).join('');
}
function setNavFolded(on){
