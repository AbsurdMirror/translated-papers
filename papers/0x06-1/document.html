: "0da3a5a7cf9972c0353fb8fcad6f5a60", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Nael Abu-Ghazaleh"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "University of California, Riverside"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "nael@cs.ucr.edu"}], "lineHeight": -85}}, "target": {"markdown": "Nael Abu-Ghazaleh\n加州大学河滨分校\nnael@cs.ucr.edu", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "ef4b3449ba8add673a1bd9b28bfa46e2", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## ABSTRACT\n", "text": "ABSTRACT\n", "alignment": "left", "unique_id": "ef4b3449ba8add673a1bd9b28bfa46e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ABSTRACT"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "60710f959bc1947a4a818e1a1b412e13", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "General Purpose Graphics Processing Units (GPGPUs) are present in most modern computing platforms. They are also increasingly integrated as a computational resource on clusters, data centers, and cloud infrastructure, making them possible targets for attacks. We present a first study of covert channel attacks on GPGPUs. GPGPU attacks offer a number of attractive properties relative to CPU covert channels. These channels also have characteristics different from their counterparts on CPUs. To enable the attack, we first reverse engineer the hardware block scheduler as well as the warp to warp scheduler to characterize how co-location is established. We exploit this information to manipulate the scheduling algorithms to create co-residency between the trojan and the spy. We study contention on different resources including caches, functional units and memory, and construct operational covert channels on all these resources. We also investigate approaches to increase the bandwidth of the channel including: (1) using synchronization to reduce the communication cycle and increase robustness of the channel; (2) exploiting the available parallelism on the GPU to increase the bandwidth; and (3) exploiting the scheduling algorithms to create exclusive co-location to prevent interference from other possible applications. We demonstrate operational versions of all channels on three different Nvidia GPGPUs, obtaining error-free bandwidth of over 4 Mbps, making it the fastest known microarchitectural covert channel under realistic conditions.  \n\n", "text": "General Purpose Graphics Processing Units (GPGPUs) are present in most modern computing platforms. They are also increasingly integrated as a computational resource on clusters, data centers, and cloud infrastructure, making them possible targets for attacks. We present a first study of covert channel attacks on GPGPUs. GPGPU attacks offer a number of attractive properties relative to CPU covert channels. These channels also have characteristics different from their counterparts on CPUs. To enable the attack, we first reverse engineer the hardware block scheduler as well as the warp to warp scheduler to characterize how co-location is established. We exploit this information to manipulate the scheduling algorithms to create co-residency between the trojan and the spy. We study contention on different resources including caches, functional units and memory, and construct operational covert channels on all these resources. We also investigate approaches to increase the bandwidth of the channel including: (1) using synchronization to reduce the communication cycle and increase robustness of the channel; (2) exploiting the available parallelism on the GPU to increase the bandwidth; and (3) exploiting the scheduling algorithms to create exclusive co-location to prevent interference from other possible applications. We demonstrate operational versions of all channels on three different Nvidia GPGPUs, obtaining error-free bandwidth of over 4 Mbps, making it the fastest known microarchitectural covert channel under realistic conditions.\n", "alignment": "left", "unique_id": "60710f959bc1947a4a818e1a1b412e13", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "General Purpose Graphics Processing Units (GPGPUs) are present in most modern computing platforms. They are also increasingly integrated as a computational resource on clusters, data centers, and cloud infrastructure, making them possible targets for attacks. We present a first study of covert channel attacks on GPGPUs. GPGPU attacks offer a number of attractive properties relative to CPU covert channels. These channels also have characteristics different from their counterparts on CPUs. To enable the attack, we first reverse engineer the hardware block scheduler as well as the warp to warp scheduler to characterize how co-location is established. We exploit this information to manipulate the scheduling algorithms to create co-residency between the trojan and the spy. We study contention on different resources including caches, functional units and memory, and construct operational covert channels on all these resources. We also investigate approaches to increase the bandwidth of the channel including: (1) using synchronization to reduce the communication cycle and increase robustness of the channel; (2) exploiting the available parallelism on the GPU to increase the bandwidth; and (3) exploiting the scheduling algorithms to create exclusive co-location to prevent interference from other possible applications. We demonstrate operational versions of all channels on three different Nvidia GPGPUs, obtaining error-free bandwidth of over 4 Mbps, making it the fastest known microarchitectural covert channel under realistic conditions."}], "lineHeight": 0}}, "target": {"markdown": "通用图形处理器（GPGPU）已存在于大多数现代计算平台中。它们也越来越频繁地作为计算资源被集成到集群、数据中心和云基础设施中，从而成为可能的攻击目标。我们首次对 GPGPU 上的隐蔽信道攻击进行了研究。相对于 CPU 隐蔽信道，GPGPU 攻击具有若干吸引人的特性。这些信道也具有与其在 CPU 上的对应信道不同的特征。为了实现该攻击，我们首先逆向分析了硬件块调度器以及 warp 间调度器，以刻画共驻留是如何建立的。我们利用这些信息操纵调度算法，在特洛伊木马和探针之间建立共驻留关系。我们研究了不同资源上的争用情况，包括缓存、功能单元和内存，并在所有这些资源上构建了可运行的隐蔽信道。我们还研究了提升信道带宽的方法，包括：(1) 使用同步机制以缩短通信周期并增强信道的鲁棒性；(2) 利用 GPU 上可用的并行性来提高带宽；(3) 利用调度算法建立独占式共驻留以防止其他可能的应用程序的干扰。我们在三种不同的 Nvidia GPGPU 上演示了所有信道的可运行版本，在现实条件下获得了超过 4 Mbps 的无差错带宽，使其成为目前已知最快的微架构隐蔽信道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "30fc393d1b2b0304a786f4db54e28580", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## CCS CONCEPTS\n", "text": "CCS CONCEPTS\n", "alignment": "left", "unique_id": "30fc393d1b2b0304a786f4db54e28580", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "CCS CONCEPTS"}], "lineHeight": 0}}, "t left", "unique_id": "fd973644aeffbfed078a2c40f0f45261", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "https://doi.org/10.1145/3123939.3124538"}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "6f140c54bce6e4e7154aa66dc570da6f", "index": 13, "aliyun_index": 13, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## 1 INTRODUCTION\n", "text": "1 INTRODUCTION\n", "alignment": "left", "unique_id": "6f140c54bce6e4e7154aa66dc570da6f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1 INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "## 1 引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 13}, {"source": {"block_id": "25f1b48c6efa6bbcb0e411bfb95e522e", "index": 14, "aliyun_index": 14, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "General Purpose Graphical Processing Units (GPGPUs) are used to accelerate a range of applications including security, computer vision, computational finance, bio-informatics and many others [24]. Despite their improving performance and increasing range of applications, the security vulnerabilities of GPGPUs have not been well studied; only a few research papers have examined security vulnerabilities of GPGPUs [16, 19, 29, 30, 33, 46]. Often applications that use GPGPUs operate on sensitive data [4, 7, 25], which can be compromised by security vulnerabilities present in GPGPUs. Covert channel attacks are dangerous because they allow intentional communication of sensitive data between malicious processes that have no direct channel between them. A covert channel attack may enable a malicious application without network access to communicate data to another application to exfiltrate the data off the device. Alternatively, covert communication can be used to bypass protections that track exposure of sensitive information such as sandboxing or information flow tracking, allowing sensitive data to escape containment [10]. The presence of a covert channel can also forecast the possibility of a side-channel attack [32], although we do not pursue such attacks in this paper.  \n\n", "text": "General Purpose Graphical Processing Units (GPGPUs) are used to accelerate a range of applications including security, computer vision, computational finance, bio-informatics and many others [24]. Despite their improving performance and increasing range of applications, the security vulnerabilities of GPGPUs have not been well studied; only a few research papers have examined security vulnerabilities of GPGPUs [16, 19, 29, 30, 33, 46]. Often applications that use GPGPUs operate on sensitive data [4, 7, 25], which can be compromised by security vulnerabilities present in GPGPUs. Covert channel attacks are dangerous because they allow intentional communication of sensitive data between malicious processes that have no direct channel between them. A covert channel attack may enable a malicious application without network access to communicate data to another application to exfiltrate the data off the device. Alternatively, covert communication can be used to bypass protections that track exposure of sensitive information such as sandboxing or information flow tracking, allowing sensitive data to escape containment [10]. The presence of a covert channel can also forecast the possibility of a side-channel attack [32], although we do not pursue such attacks in this paper.\n", "alignment": "left", "unique_id": "25f1b48c6efa6bbcb0e411bfb95e522e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "General Purpose Graphical Processing Units (GPGPUs) are used to accelerate a range of applications including security, computer vision, computational finance, bio-informatics and many others [24]. Despite their improving performance and increasing range of applications, the security vulnerabilities of GPGPUs have not been well studied; only a few research papers have examined security vulnerabilities of GPGPUs [16, 19, 29, 30, 33, 46]. Often applications that use GPGPUs operate on sensitive data [4, 7, 25], which can be compromised by security vulnerabilities present in GPGPUs. Covert channel attacks are dangerous because they allow intentional communication of sensitive data between malicious processes that have no direct channel between them. A covert channel attack may enable a malicious application without network access to communicate data to another application to exfiltrate the data off the device. Alternatively, covert communication can be used to bypass protections that track exposure of sensitive information such as sandboxing or information flow tracking, allowing sensitive data to escape containment [10]. The presence of a covert channel can also forecast the possibility of a side-channel attack [32], although we do not pursue such attacks in this paper."}], "lineHeight": 0}}, "target": {"markdown": "通用图形处理器（GPGPU）被用于加速各类应用，包括安全、计算机视觉、计算金融、生物信息学以及许多其他领域 [24]。尽管它们的性能不断提升且应用范围日益广泛，但 GPGPU 的安全漏洞尚未得到充分研究；仅有少数研究论文考察过 GPGPU 的安全漏洞 [16, 19, 29, 30, 33, 46]。许多使用 GPGPU 的应用常常处理敏感数据 [4, 7, 25]，而这些数据可能被 GPGPU 中存在的安全漏洞所侵害。隐蔽信道攻击具有很大的危险性，因为它们允许彼此之间没有直接信道的恶意进程有意地传递敏感数据。隐蔽信道攻击可能使一个无法访问网络的恶意应用能够与另一个应用进行数据通信，从而将数据外泄出设备。此外，隐蔽通信还可用于绕过沙箱或信息流跟踪等用于追踪敏感信息暴露的保护机制，使敏感数据得以脱离管控 [10]。隐蔽信道的存在也预示着侧信道攻击的可能性 [32]，不过本文并不研究此类攻击。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "5abbc2b998ce01935a56be9f5fb4cc54", "index": 15, "aliyun_index": 15, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "With multiprogramming starting to be available on GPUs [41, 44], covert channel attacks between two kernels running concurrently on a GPU become possible. The attack offers a number of advantages that may make them an attractive target for attackers compared to CPU covert channels including: (1) With GPU-accelerated computing available on major cloud platforms such as Google Cloud Platform, IBM cloud, and Amazon web service [26] this threat is substantial [35]. The model of sharing GPUs on the cloud is evolving but allowing sharing of remote GPUs is a possibility [3, 8, 31, 34]. Therefore, GPU covert channels may provide the attackers with additional opportunities to co-locate, which is a pre-requisite for these types of attacks [35]; (2) GPGPUs operate as an accelerator with separate resources that do not benefit from protections offered by an Operating system. In fact, due to this property they have been proposed for use as a secure processor [37]; and (3) GPGPU channels can be of high quality (low noise) and bandwidth due to the inherent parallelism and, as we demonstrate, the ability to control noise.  \n\n", "text": "With multiprogramming starting to be available on GPUs [41, 44], covert channel attacks between two kernels running concurrently on a GPU become possible. The attack offers a number of advantages that may make them an attractive target for attackers compared to CPU covert channels including: (1) With GPU-accelerated computing available on major cloud platforms such as Google Cloud Platform, IBM cloud, and Amazon web service [26] this threat is substantial [35]. The model of sharing GPUs on the cloud is evolving but allowing sharing of remote GPUs is a possibility [3, 8, 31, 34]. Therefore, GPU covert channels may provide the attackers with additional opportunities to co-locate, which is a pre-requisite for these types of attacks [35]; (2) GPGPUs operate as an accelerator with separate resources that do not benefit from protections offered by an Operating system. In fact, due to this property they have been proposed for use as a secure processor [37]; and (3) GPGPU channels can be of high quality (low noise) and bandwidth due to the inherent parallelism and, as we demonstrate, the ability to control noise.\n", "alignment": "left", "unique_id": "5abbc2b998ce01935a56be9f5fb4cc54", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With multiprogramming starting to be available on GPUs [41, 44], covert channel attacks between two kernels running concurrently on a GPU become possible. The attack offers a number of advantages that may make them an attractive target for attackers compared to CPU covert channels including: (1) With GPU-accelerated computing available on major cloud platforms such as Google Cloud Platform, IBM cloud, and Amazon web service [26] this threat is substantial [35]. The model of sharing GPUs on the cloud is evolving but allowing sharing of remote GPUs is a possibility [3, 8, 31, 34]. Therefore, GPU covert channels may provide the attackers with additional opportunities to co-locate, which is a pre-requisite for these types of attacks [35]; (2) GPGPUs operate as an accelerator with separate resources that do not benefit from protections offered by an Operating system. In fact, due to this property they have been proposed for use as a secure processor [37]; and (3) GPGPU channels can be of high quality (low noise) and bandwidth due to the inherent parallelism and, as we demonstrate, the ability to control noise."}], "lineHeight": 0}}, "target": {"markdown": "随着多程序设计开始可用于 GPU [41, 44]，在 GPU 上并发运行的两个内核之间的隐蔽信道攻击成为可能。与 CPU 隐蔽信道相比，该攻击具有若干优势，使其成为攻击者青睐的目标，包括：(1) 在 Google Cloud Platform、IBM 云和亚马逊云服务等主要云平台上均可使用 GPU 加速计算 [26]，这一威胁十分显著 [35]。云上 GPU 的共享模式正在不断演进，但允许远程共享 GPU 是有可能实现的 [3, 8, 31, 34]。因此，GPU 隐蔽信道可能为攻击者提供额外的共驻留机会，而这正是此类攻击的前提条件 [35]；(2) GPGPU 作为加速器运行，拥有独立的资源，无法受益于操作系统所提供的保护。事实上，正是由于这一特性，它们曾被提议用作安全处理器 [37]；(3) GPGPU 信道可以具有高质量（低噪声）和高带宽，这得益于其固有的并行性，以及正如我们所展示的，对噪声的控制能力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "50ed2fb4de3a8d96c32d10b79893423e", "index": 16, "aliyun_index": 16, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "At the same time, constructing covert channels on GPGPUs introduces a number of challenges and operational characteristics different from those on CPUs. One of the new challenges is to how to establish co-location between the kernel and the spy by exploiting the hardware schedulers such that the communicating kernels can share resources. Thus, we first reverse engineer the hardware scheduling algorithms that determine where the different blocks and warps can be allocated to create contention (Section 3). A second problem is to identify which resources are most effective for communication given the throughput bound nature of GPGPUs. In particular, GPUs have substantial parallelism, which may enable high throughput covert communication, but only if effective isolated  \n\n", "text": "At the same time, constructing covert channels on GPGPUs introduces a number of challenges and operational characteristics different from those on CPUs. One of the new challenges is to how to establish co-location between the kernel and the spy by exploiting the hardware schedulers such that the communicating kernels can share resources. Thus, we first reverse engineer the hardware scheduling algorithms that determine where the different blocks and warps can be allocated to create contention (Section 3). A second problem is to identify which resources are most effective for communication given the throughput bound nature of GPGPUs. In particular, GPUs have substantial parallelism, which may enable high throughput covert communication, but only if effective isolated\n", "alignment": "left", "unique_id": "50ed2fb4de3a8d96c32d10b79893423e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "At the same time, constructing covert channels on GPGPUs introduces a number of challenges and operational characteristics different from those on CPUs. One of the new challenges is to how to establish co-location between the kernel and the spy by exploiting the hardware schedulers such that the communicating kernels can share resources. Thus, we first reverse engineer the hardware scheduling algorithms that determine where the different blocks and warps can be allocated to create contention (Section 3). A second problem is to identify which resources are most effective for communication given the throughput bound nature of GPGPUs. In particular, GPUs have substantial parallelism, which may enable high throughput covert communication, but only if effective isolated"}], "lineHeight": 0}}, "target": {"markdown": "与此同时，在 GPGPU 上构建隐蔽信道也带来了一些挑战和与 CPU 上不同的运行特征。其中一项新挑战在于如何通过利用硬件调度器来建立内核与探针之间的共驻留关系，使得进行通信的内核能够共享资源。因此，我们首先逆向分析了决定不同 block 与 warp 分配位置的硬件调度算法，以制造资源争用（第 3 节）。第二个问题在于，在 GPGPU 受吞吐上限约束的特性下，确定哪些资源最适合用于通信。尤其是，GPU 具备大量并行性，这或许能够实现高吞吐量的隐蔽通信，但前提是能够有效隔离", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "d77dcf72f137d9532867f20bef69b40b", "index": 17, "a }, "text": "© 2017 Association for Computing Machinery"}], "lineHeight": 0}}, "target": {"markdown": "© 2017 计算机协会（Association for Computing Machinery）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "71fe525baec43cd6c44b9ca723370086", "index": 20, "aliyun_index": 20, "page_num": 0, "type": "corner_note", "sub_type": "none", "markdown": ">ACM ISBN 978-1-4503-4952-9/17/10...$15.00  \n\n", "text": "ACM ISBN 978-1-4503-4952-9/17/10...$15.00\n", "alignment": "left", "unique_id": "71fe525baec43cd6c44b9ca723370086", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ACM ISBN 978-1-4503-4952-9/17/10...$15.00"}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "362ee77986de154a133c7fc7d0aa5b55", "index": 21, "aliyun_index": 21, "page_num": 0, "type": "corner_note", "sub_type": "none", "markdown": ">https://doi.org/10.1145/3123939.3124538  \n\n", "text": "https://doi.org/10.1145/3123939.3124538\n", "alignment": "left", "unique_id": "362ee77986de154a133c7fc7d0aa5b55", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "https://doi.org/10.1145/3123939.3124538"}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "adb2553ea3a4085b0df37dffafc9da2d", "index": 22, "aliyun_index": 2, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "contention domains can be found. For example, a shared resource, such as the L2 cache, may have limited capacity limiting the bandwidth of communication through it. Alternatively, a resource may have high capacity (such as the memory bandwidth), making it difficult to create measurable contention. We construct different channels using contention on caches, contention for computational units, as well as contention for memory operations in Sections 4, 5 and 6 respectively. We discover that contention on the functional units is isolated by different warp schedulers: only the warps on the same warp scheduler experience contention. Thus, to communicate, the kernels must be mapped to the same warp scheduler, and conversely, kernels on different warp schedulers can construct parallel covert channels to increase bandwidth.  \n\n", "text": "contention domains can be found. For example, a shared resource, such as the L2 cache, may have limited capacity limiting the bandwidth of communication through it. Alternatively, a resource may have high capacity (such as the memory bandwidth), making it difficult to create measurable contention. We construct different channels using contention on caches, contention for computational units, as well as contention for memory operations in Sections 4, 5 and 6 respectively. We discover that contention on the functional units is isolated by different warp schedulers: only the warps on the same warp scheduler experience contention. Thus, to communicate, the kernels must be mapped to the same warp scheduler, and conversely, kernels on different warp schedulers can construct parallel covert channels to increase bandwidth.\n", "alignment": "left", "unique_id": "adb2553ea3a4085b0df37dffafc9da2d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "contention domains can be found. For example, a shared resource, such as the L2 cache, may have limited capacity limiting the bandwidth of communication through it. Alternatively, a resource may have high capacity (such as the memory bandwidth), making it difficult to create measurable contention. We construct different channels using contention on caches, contention for computational units, as well as contention for memory operations in Sections 4, 5 and 6 respectively. We discover that contention on the functional units is isolated by different warp schedulers: only the warps on the same warp scheduler experience contention. Thus, to communicate, the kernels must be mapped to the same warp scheduler, and conversely, kernels on different warp schedulers can construct parallel covert channels to increase bandwidth."}], "lineHeight": 0}}, "target": {"markdown": "争用域。例如，共享资源（如 L2 缓存）容量有限，从而限制了通过它进行通信的带宽。又或者，某些资源容量很大（如内存带宽），这使得难以产生可度量的争用。我们在第 4、5 和 6 节中分别利用缓存争用、计算单元争用以及内存操作争用构建了不同的信道。我们发现，函数单元上的争用由不同的 warp 调度器进行隔离：只有位于同一 warp 调度器上的 warp 之间才会产生争用。因此，为了进行通信，各内核必须被映射到同一个 warp 调度器；反之，位于不同 warp 调度器上的内核可以构建并行的隐蔽信道以提升带宽。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "e23bd322d31eec3c24bb416150528d2c", "index": 23, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Having demonstrated and characterized these different channels on three different GPGPUs, we explore improvements to the channel bandwidth. We use the inherent parallelism in GPGPUs to increase the bandwidth of the channel. We also implement synchronization to increase the robustness of the communication to increase the communication efficiency in Section 7. To improve resilience to interference from other applications, we propose exploiting the hardware schedulers to block out co-location from other applications; this is a new approach to managing noise unique to GPGPUs (Section 8). We demonstrate the success of exclusive co-location on current GPGPUs which support multiprogramming based on leftover policy and discuss some scenarios to extend our attack for proposed multiprogramming schemes on future GPGPUs, such as kernel preemption and intra-SM partitioning. We discuss the potential mitigations in Section 9. Finally, Section 10 reviews related work, while Section 11 presents some concluding remarks.  \n\n", "text": "Having demonstrated and characterized these different channels on three different GPGPUs, we explore improvements to the channel bandwidth. We use the inherent parallelism in GPGPUs to increase the bandwidth of the channel. We also implement synchronization to increase the robustness of the communication to increase the communication efficiency in Section 7. To improve resilience to interference from other applications, we propose exploiting the hardware schedulers to block out co-location from other applications; this is a new approach to managing noise unique to GPGPUs (Section 8). We demonstrate the success of exclusive co-location on current GPGPUs which support multiprogramming based on leftover policy and discuss some scenarios to extend our attack for proposed multiprogramming schemes on future GPGPUs, such as kernel preemption and intra-SM partitioning. We discuss the potential mitigations in Section 9. Finally, Section 10 reviews related work, while Section 11 presents some concluding remarks.\n", "alignment": "left", "unique_id": "e23bd322d31eec3c24bb416150528d2c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Having demonstrated and characterized these different channels on three different GPGPUs, we explore improvements to the channel bandwidth. We use the inherent parallelism in GPGPUs to increase the bandwidth of the channel. We also implement synchronization to increase the robustness of the communication to increase the communication efficiency in Section 7. To improve resilience to interference from other applications, we propose exploiting the hardware schedulers to block out co-location from other applications; this is a new approach to managing noise unique to GPGPUs (Section 8). We demonstrate the success of exclusive co-location on current GPGPUs which support multiprogramming based on leftover policy and discuss some scenarios to extend our attack for proposed multiprogramming schemes on future GPGPUs, such as kernel preemption and intra-SM partitioning. We discuss the potential mitigations in Section 9. Finally, Section 10 reviews related work, while Section 11 presents some concluding remarks."}], "lineHeight": 0}}, "target": {"markdown": "在三种不同的 GPGPU 上展示并刻画这些不同的信道之后，我们探索信道带宽的改进方法。我们利用 GPGPU 固有的并行性来提升信道带宽。我们还在第 7 节中实现了同步机制，以提高通信的鲁棒性，从而提升通信效率。为了增强对其他应用干扰的抵御能力，我们提出利用硬件调度器来阻止其他应用的共驻留；这是一种针对 GPGPU 所独有的噪声管理新方法（第 8 节）。我们在当前支持基于剩余策略进行多程序设计的 GPGPU 上展示了独占式共驻留的成功实现，并讨论了若干场景，以将我们的攻击扩展到未来 GPGPU 上所提出的多程序设计方案，例如内核抢占与片上 SM 内划分。我们在第 9 节讨论了潜在的缓解措施。最后，第 10 节回顾了相关工作，第 11 节给出了一些总结性评述。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "2eee691e3a390b8d1add95119be1388e", "index": 24, "aliyun_index": 4, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The high level contribution of the paper is the first detailed exploration of covert channel attacks on GPGPUs, including the construction, characterization and optimization of different channels. In particular, the paper makes the following contributions.  \n\n", "text": "The high level contribution of the paper is the first detailed exploration of covert channel attacks on GPGPUs, including the construction, characterization and optimization of different channels. In particular, the paper makes the following contributions.\n", "alignment": "left", "unique_id": "2eee691e3a390b8d1add95119be1388e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The high level contribution of the paper is the first detailed exploration of covert channel attacks on GPGPUs, including the construction, characterization and optimization of different channels. In particular, the paper makes the following contributions."}], "lineHeight": 0}}, "target": {"markdown": "本文的高层贡献在于首次对 GPGPU 上的隐蔽信道攻击进行了详细的探索，包括不同信道的构建、刻画与优化。具体而言，本文作出了如下贡献。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "4800b7db3951aa7f2b8760e4b97fced1", "index": 25, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• Reverse engineering co-location: We develop a methodology to reverse engineer the hardware scheduling algorithms and exploit them to force colocation to enable covert communication.  \n\n", "text": "• Reverse engineering co-location: We develop a methodology to reverse engineer the hardware scheduling algorithms and exploit them to force colocation to enable covert communication.\n", "alignment": "left", "unique_id": "4800b7db3951aa7f2b8760e4b97fced1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Reverse engineering co-location: We develop a methodology to reverse engineer the hardware scheduling algorithms and exploit them to force colocation to enable covert communication."}], "lineHeight": 0}}, "target": {"ma ": "• Demonstrating practical channels on three different GPG-\nPUUs. We discuss how the attacks generalize to recent GPU\nmultiprogramming proposals.\n", "alignment": "left", "unique_id": "939beffdad3691c7607963c23f7f141c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Demonstrating practical channels on three different GPG-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "PUUs. We discuss how the attacks generalize to recent GPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "multiprogramming proposals."}], "lineHeight": -77}}, "target": {"markdown": "• 在三种不同的 GPGPU 上展示了实用的信道。我们讨论了这些攻击如何推广到近期提出的 GPU 多程序设计方案。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "f6e33fc29152116fb78c13318f4248a7", "index": 28, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• We propose techniques to force exclusive co-location of spy and trojan on current GPGPUs to prevent interference of other workloads, achieving noise-free communication.  \n\n", "text": "• We propose techniques to force exclusive co-location of spy and trojan on current GPGPUs to prevent interference of other workloads, achieving noise-free communication.\n", "alignment": "left", "unique_id": "f6e33fc29152116fb78c13318f4248a7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": fals
