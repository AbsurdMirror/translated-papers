ments": [], "display_order": 3}, {"source": {"block_id": "f1e8df9b50f41e522ad9964394089f0e", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "{mstephenson,shari,eebrahimi,djohnson,dnellans,moconnor,skeckler}@nvidia.com, yunsup@cs.berkeley.edu  \n\n", "text": "{mstephenson,shari,eebrahimi,djohnson,dnellans,moconnor,skeckler}@nvidia.com, yunsup@cs.berkeley.edu\n", "alignment": "left", "unique_id": "f1e8df9b50f41e522ad9964394089f0e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "{mstephenson,shari,eebrahimi,djohnson,dnellans,moconnor,skeckler}@nvidia.com, yunsup@cs.berkeley.edu"}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "26d69095031ab2317ad2ae96f9e7765e", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## Abstract\n", "text": "Abstract\n", "alignment": "left", "unique_id": "26d69095031ab2317ad2ae96f9e7765e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "e0e7c74e384c5df2f490a53aa0621803", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "To aid application characterization and architecture design space exploration, researchers and engineers have developed a wide range of tools for CPUs, including simulators, profilers, and binary instrumentation tools. With the advent of GPU computing, GPU manufacturers have developed similar tools leveraging hardware profiling and debugging hooks. To date, these tools are largely limited by the fixed menu of options provided by the tool developer and do not offer the user the flexibility to observe or act on events not in the menu. This paper presents SASSI (NVIDIA assembly code \"SASS\" Instrumentor), a low-level assembly-language instrumentation tool for GPUs. Like CPU binary instrumentation tools, SASSI allows a user to specify instructions at which to inject user-provided instrumentation code. These facilities allow strategic placement of counters and code into GPU assembly code to collect user-directed, fine-grained statistics at hardware speeds. SASSI instrumentation is inherently parallel, leveraging the concurrency of the underlying hardware. In addition to the details of SASSI, this paper provides four case studies that show how SASSI can be used to characterize applications and explore the architecture design space along the dimensions of instruction control flow, memory systems, value similarity, and resilience.  \n\n", "text": "To aid application characterization and architecture design space exploration, researchers and engineers have developed a wide range of tools for CPUs, including simulators, profilers, and binary instrumentation tools. With the advent of GPU computing, GPU manufacturers have developed similar tools leveraging hardware profiling and debugging hooks. To date, these tools are largely limited by the fixed menu of options provided by the tool developer and do not offer the user the flexibility to observe or act on events not in the menu. This paper presents SASSI (NVIDIA assembly code \"SASS\" Instrumentor), a low-level assembly-language instrumentation tool for GPUs. Like CPU binary instrumentation tools, SASSI allows a user to specify instructions at which to inject user-provided instrumentation code. These facilities allow strategic placement of counters and code into GPU assembly code to collect user-directed, fine-grained statistics at hardware speeds. SASSI instrumentation is inherently parallel, leveraging the concurrency of the underlying hardware. In addition to the details of SASSI, this paper provides four case studies that show how SASSI can be used to characterize applications and explore the architecture design space along the dimensions of instruction control flow, memory systems, value similarity, and resilience.\n", "alignment": "left", "unique_id": "e0e7c74e384c5df2f490a53aa0621803", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To aid application characterization and architecture design space exploration, researchers and engineers have developed a wide range of tools for CPUs, including simulators, profilers, and binary instrumentation tools. With the advent of GPU computing, GPU manufacturers have developed similar tools leveraging hardware profiling and debugging hooks. To date, these tools are largely limited by the fixed menu of options provided by the tool developer and do not offer the user the flexibility to observe or act on events not in the menu. This paper presents SASSI (NVIDIA assembly code \"SASS\" Instrumentor), a low-level assembly-language instrumentation tool for GPUs. Like CPU binary instrumentation tools, SASSI allows a user to specify instructions at which to inject user-provided instrumentation code. These facilities allow strategic placement of counters and code into GPU assembly code to collect user-directed, fine-grained statistics at hardware speeds. SASSI instrumentation is inherently parallel, leveraging the concurrency of the underlying hardware. In addition to the details of SASSI, this paper provides four case studies that show how SASSI can be used to characterize applications and explore the architecture design space along the dimensions of instruction control flow, memory systems, value similarity, and resilience."}], "lineHeight": 0}}, "target": {"markdown": "为了辅助应用特性分析和架构设计空间探索，研究人员和工程师开发了广泛的 CPU 工具，包括模拟器、性能分析器和二进制插桩工具。随着 GPU 计算的出现，GPU 制造商也利用硬件分析和调试钩子开发了类似的工具。迄今为止，这些工具在很大程度上受限于工具开发者所提供的固定选项菜单，无法为用户提供观察或对菜单之外的事件进行操作的灵活性。本文提出了 SASSI（NVIDIA 汇编代码 \"SASS\" 插桩器，NVIDIA assembly code \"SASS\" Instrumentor），一种面向 GPU 的底层汇编语言插桩工具。与 CPU 二进制插桩工具类似，SASSI 允许用户指定注入用户提供的插桩代码的指令位置。这些机制支持将计数器和代码策略性地植入 GPU 汇编代码中，以在硬件速度下收集用户定向的细粒度统计信息。SASSI 插桩天然具有并行性，能够利用底层硬件的并发性。除了 SASSI 的细节之外，本文还提供了四个案例研究，展示如何利用 SASSI 在指令控制流、存储系统、值相似性和容错性等多个维度上刻画应用程序并探索架构设计空间。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "d7e513da11e2765d4547ba42e7d5e59d", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## 1. Introduction\n", "text": "1. Introduction\n", "alignment": "left", "unique_id": "d7e513da11e2765d4547ba42e7d5e59d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1. Introduction"}], "lineHeight": 0}}, "target": {"markdown": "## 1. 引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "7ada5cffeef2a0b587672b1a7fad346f", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Computer architects have developed and employed a wide range of tools for investigating new concepts and design alternatives. In the CPU world, these tools have included simulators, profilers, binary instrumentation tools, and instruction sampling tools. These tools provide different features and capabilities to the architect and incur different design-time and runtime costs. For example, simulators provide the most control over architecture under investigation and are necessary for many types of detailed studies. On the other hand, simulators are time-consuming to develop, are slow to run, and  \n\n", "text": "Computer architects have developed and employed a wide range of tools for investigating new concepts and design alternatives. In the CPU world, these tools have included simulators, profilers, binary instrumentation tools, and instruction sampling tools. These tools provide different features and capabilities to the architect and incur different design-time and runtime costs. For example, simulators provide the most control over architecture under investigation and are necessary for many types of detailed studies. On the other hand, simulators are time-consuming to develop, are slow to run, and\n", "alignment": "left", "unique_id": "7ada5cffeef2a0b587672b1a7fad346f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Computer architects have developed and employed a wide range of tools for investigating new concepts and design alternatives. In the CPU world, these tools have included simulators, profilers, binary instrumentation tools, and instruction sampling tools. These tools provide different features and capabilities to the architect and incur different design-time and runtime costs. For example, simulators provide the most control over architecture under investigation and are necessary for many types of detailed studies. On the other hand, simulators are time-consuming to develop, are slow to run, and"}], "lineHeight": 0}}, "target": {"markdown": "计算机架构师已经开发并使用了广泛的工具来研究新概念和设计替代方案。在 CPU 领域，这些工具包括模拟器、性能分析器、二进制插桩工具和指令采样工具。这些工具为架构师提供了不同的特性和能力，并带来不同的设计时和运行时开销。例如，模拟器对待研究架构提供了最强的控制能力，并且对于许多类型的详细研究是必需的。另一方面，模拟器开发耗时，运行速度较慢，并且", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "40cabd4852dd390085421b7ea6e8df87", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "are often difficult to connect to the latest software toolchains\nand applications. Binary rewriting tools like Pin [21] allow a\nuser to instrument a program to be run on existing hardware,\nenabling an architect insight into an application's behavior and\nhow it uses the architecture. Such tools have been used in a\nwide variety of architecture investigations including, deterministic\nreplay architectures [26], memory access scheduling [25],\non-chip network architectures [24], and cache architecture\nevaluation [18]. They have even been used as the foundation\nfor multicore architecture simulators [23]. In addition, these\ntypes of tools have been used in a wide range of application\ncharacterization and software analysis research.  \n\n", "text": "are often difficult to connect to the latest software toolchains\nand applications. Binary rewriting tools like Pin [21] allow a\nuser to instrument a program to be run on existing hardware,\nenabling an architect insight into an application's behavior and\nhow it uses the architecture. Such tools have been used in a\nwide variety of architecture investigations including, deterministic\nreplay architectures [26], memory access scheduling [25],\non-chip network architectures [24], and cache architecture\nevaluation [18]. They have even been used as the foundation\nfor multicore architecture simulators [23]. In addition, these\ntypes of tools have been used in a wide range of application\ncharacterization and software analysis research.\n", "alignment": "left", "unique_id": "40cabd4852dd390085421b7ea6e8df87", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "are often difficult to connect to the latest software toolchains"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and applications. Binary rewriting tools like Pin [21] allow a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "user to instrument a program to be run on existing hardware,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "enabling an architect insight into an application's behavior and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "how it uses the architecture. Such tools have been used in a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "wide variety of architecture investigations including, deterministic"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "replay architectures [26], memory access scheduling [25],"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "on-chip network architectures [24], and cache architecture"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "evaluation [18]. They have even been used as the foundation"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "for multicore architecture simulators [23]. In addition, these"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "types of tools have been used in a wide range of application"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "characterization and software analysis research."}], "lineHeight": -344}}, "target": {"markdown": "通常难以与最新的软件工具链和应用程序相衔接。像 Pin [21] 这样的二进制重写工具允许用户对程序进行插桩，以便在现有硬件上运行，从而使架构师能够洞察应用程序的行为及其对架构的使用方式。这类工具已被广泛应用于多种架构研究，包括确定性重放架构 [26]、存储访问调度 [25]、片上网络架构 [24] 以及缓存架构评估 [18]。它们甚至被用作多核架构模拟器的基础 [23]。此外，这类工具还被广泛用于各种应用特性分析和软件分析研究中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "ae054abfa5296644a9e23b9b1b686130", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "With the advent of GPU computing, GPU manufacturers have developed profiling and debugging tools, similar in nature to their CPU counterparts. Tools such as NVIDIA's NSight or Visual Profiler use performance counters and lightweight, targeted binary instrumentation to profile various aspects of program execution [34, 35]. These tools have the advantage that they are easy to use, and run on hardware, at hardware speeds. Unfortunately for computer architects and compiler writers, the production-quality profilers are not flexible enough to perform novel studies: one must choose what aspects of program execution to measure from a menu of pre-selected metrics. They also cannot be used as a base on which to build other architecture evaluation tools.  \n\n", "text": "With the advent of GPU computing, GPU manufacturers have developed profiling and debugging tools, similar in nature to their CPU counterparts. Tools such as NVIDIA's NSight or Visual Profiler use performance counters and lightweight, targeted binary instrumentation to profile various aspects of program execution [34, 35]. These tools have the advantage that they are easy to use, and run on hardware, at hardware speeds. Unfortunately for computer architects and compiler writers, the production-quality profilers are not flexible enough to perform novel studies: one must choose what aspects of program execution to measure from a menu of pre-selected metrics. They also cannot be used as a base on which to build other architecture evaluation tools.\n", "alignment": "left", "unique_id": "ae054abfa5296644a9e23b9b1b686130", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With the advent of GPU computing, GPU manufacturers have developed profiling and debugging tools, similar in nature to their CPU counterparts. Tools such as NVIDIA's NSight or Visual Profiler use performance counters and lightweight, targeted binary instrumentation to profile various aspects of program execution [34, 35]. These tools have the advantage that they are easy to use, and run on hardware, at hardware speeds. Unfortunately for computer architects and compiler writers, the production-quality profilers are not flexible enough to perform novel studies: one must choose what aspects of program execution to measure from a menu of pre-selected metrics. They also cannot be used as a base on which to build other architecture evaluation tools."}], "lineHeight": 0}}, "target": {"markdown": "随着 GPU 计算的出现，GPU 制造商开发了与 CPU 工具性质类似的分析和调试工具。例如 NVIDIA 的 NSight 或 Visual Profiler 等工具使用性能计数器和轻量级、有针对性的二进制插桩来分析程序执行的各个方面 [34, 35]。这些工具的优点在于易于使用，并且能够在硬件上以硬件速度运行。然而，对于计算机架构师和编译器编写者来说，这些生产级的分析器缺乏足够的灵活性以进行新颖的研究：用户只能从预先选择的指标菜单中选择需要测量的程序执行方面。此外，它们也不能用作构建其他架构评估工具的基础。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "d2d735a1af58a5125d6615b4c865e3dc", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "As one solution to the shortcoming described above, the architecture community has turned toward simulators, such as GPGPU-Sim to analyze programs and guide architecture development [1]. Simulators are immensely flexible, and allow architects to measure fine-grained details of execution. The major disadvantage of simulators is their relatively slow simulation rates. This forces researchers and architects to use trimmed-down input data sets so that their experiments finish in a reasonable amount of time. Of course, application profiles can be highly input-dependent, and there is no guarantee that simulation-sized inputs are representative of real workloads.  \n\n", "text": "As one solution to the shortcoming described above, the architecture community has turned toward simulators, such as GPGPU-Sim to analyze programs and guide architecture development [1]. Simulators are immensely flexible, and allow architects to measure fine-grained details of execution. The major disadvantage of simulators is their relatively slow simulation rates. This forces researchers and architects to use trimmed-down input data sets so that their experiments finish in a reasonable amount of time. Of course, application profiles can be highly input-dependent, and there is no guarantee that simulation-sized inputs are representative of real workloads.\n", "alignment": "left", "unique_id": "d2d735a1af58a5125d6615b4c865e3dc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As one solution to the shortcoming described above, the architecture community has turned toward simulators, such as GPGPU-Sim to analyze programs and guide architecture development [1]. Simulators are immensely flexible, and allow architects to measure fine-grained details of execution. The major disadvantage of simulators is their relatively slow simulation rates. This forces researchers and architects to use trimmed-down input data sets so that their experiments finish in a reasonable amount of time. Of course, application profiles can be highly input-dependent, and there is no guarantee that simulation-sized inputs are representative of real workloads."}], "lineHeight": 0}}, "target": {"markdown": "针对上述不足的一种解决方案是，架构社区转向了诸如 GPGPU-Sim 之类的模拟器来分析程序并指导架构开发 [1]。模拟器具有极大的灵活性，能够使架构师测量执行的细粒度细节。模拟器的主要缺点在于其相对较慢的模拟速度。这迫使研究人员和架构师使用精简后的输入数据集，以便实验能在合理的时间内完成。当然，应用性能特征可能高度依赖于输入，并且无法保证模拟规模的输入能够代表真实的工作负载。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "444b092a8d0f812e9d888d5de26a6e9d", "index": 12, "aliyun_index": 12, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "This paper presents a new GPU tool called SASSI for use in\napplication characterization and architecture studies. Unlike\nthe current suite of GPU profiling tools, which are tailor-made\nfor a particular task or small set of tasks, SASSI is a versatile\ninstrumentation framework that enables software-based, selec-\ntive instrumentation of GPU applications. SASSI allows a\nuser to select specific instructions or instruction types at which\nto inject user-level instrumentation code. Because SASSI\nis built into NVIDIA's production machine-code-generating  \n\n", "text": "This paper presents a new GPU tool called SASSI for use in\napplication characterization and architecture studies. Unlike\nthe current suite of GPU profiling tools, which are tailor-made\nfor a particular task or small set of tasks, SASSI is a versatile\ninstrumentation framework that enables software-based, selec-\ntive instrumentation of GPU applications. SASSI allows a\nuser to select specific instructions or instruction types at which\nto inject user-level instrumentation code. Because SASSI\nis built into NVIDIA's production machine-code-generating\n", "alignment": "left", "unique_id": "444b092a8d0f812e9d888d5de26a6e9d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper presents a new GPU tool called SASSI for use in"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "application characterization and architecture studies. Unlike"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the current suite of GPU profiling tools, which are tailor-made"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "for a particular task or small set of tasks, SASSI is a versatile"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instrumentation framework that enables software-based, selec-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tive instrumentation of GPU applications. SASSI allows a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "user to select specific instructions or instruction types at which"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to inject user-level instrumentation code. Because SASSI"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "is built into NVIDIA's production machine-code-generating"}], "lineHeight": -259}}, "target": {"markdown": "本文提出了一种用于应用特性分析和架构研究的新型 GPU 工具 SASSI。不同于现有的 GPU 分析工具——这些工具通常针对某项特定任务或少量任务而定制——SASSI 是一个通用的插桩框架，支持对 GPU 应用程序进行基于软件的选择性插桩。SASSI 允许用户选择特定指令或指令类型，并在这些位置注入用户级插桩代码。由于 SASSI 被集成到 NVIDIA 的生产级机器代码生成", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "3864e1d3cb462bc60372fb9bc7c918b6", "index": 13, "aliyun_index": 13, "page_num": 0, "type": "corner_note", "sub_type": "none", "markdown": ">Permission to make digital or hard copies of all or part of this work for personal or classroom use is granted without fee provided that copies are not made or distributed for profit or commercial advantage, and that copies bear this notice and the full citation on the first page. To copy otherwise, to republish, to post on servers or to redistribute to lists, requires prior specific permission and/or a fee.  \n\n", "text": "Permission to make digital or hard copies of all or part of this work for personal or classroom use is granted without fee provided that copies are not made or dis
