7c6afb7d373ed03ec79da", "index": 150, "aliyun_index": 2, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 9.3. Concurrency Issues and Limitations\n", "text": "9.3. Concurrency Issues and Limitations\n", "alignment": "left", "unique_id": "b4172197ff57c6afb7d373ed03ec79da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9.3. Concurrency Issues and Limitations"}], "lineHeight": 0}}, "target": {"markdown": "## 9.3. 并发问题与局限性\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "564b37108d20e0a37818ac19c1dd6f7a", "index": 151, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Because SASSI instrumentation code is written in CUDA, it is parallel by construction. Designing instrumentation handlers for SASSI requires the user to carefully consider synchronization and data sharing. SASSI handlers can exploit most of the explicit parallel features of CUDA, including operations for voting, atomics, shuffle, and broadcast. However, not all CUDA is legal within SASSI instrumentation handlers. For example, thread barriers (syncthreads) cannot be used because the instrumentation function may be called when the threads in a warp are diverged; syncthreads executed by diverged warps precludes all threads from reaching the common barrier. Finally, SASSI instrumentation libraries that use shared resources, such as shared and constant memory, not only risk affecting occupancy, but they could also cause instrumented programs to fail. For instance, it is not uncommon for programs to use all of shared memory, leaving nothing for the instrumentation library. In practice, we have not been limited by these restrictions.  \n\n", "text": "Because SASSI instrumentation code is written in CUDA, it is parallel by construction. Designing instrumentation handlers for SASSI requires the user to carefully consider synchronization and data sharing. SASSI handlers can exploit most of the explicit parallel features of CUDA, including operations for voting, atomics, shuffle, and broadcast. However, not all CUDA is legal within SASSI instrumentation handlers. For example, thread barriers (syncthreads) cannot be used because the instrumentation function may be called when the threads in a warp are diverged; syncthreads executed by diverged warps precludes all threads from reaching the common barrier. Finally, SASSI instrumentation libraries that use shared resources, such as shared and constant memory, not only risk affecting occupancy, but they could also cause instrumented programs to fail. For instance, it is not uncommon for programs to use all of shared memory, leaving nothing for the instrumentation library. In practice, we have not been limited by these restrictions.\n", "alignment": "left", "unique_id": "564b37108d20e0a37818ac19c1dd6f7a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Because SASSI instrumentation code is written in CUDA, it is parallel by construction. Designing instrumentation handlers for SASSI requires the user to carefully consider synchronization and data sharing. SASSI handlers can exploit most of the explicit parallel features of CUDA, including operations for voting, atomics, shuffle, and broadcast. However, not all CUDA is legal within SASSI instrumentation handlers. For example, thread barriers (syncthreads) cannot be used because the instrumentation function may be called when the threads in a warp are diverged; syncthreads executed by diverged warps precludes all threads from reaching the common barrier. Finally, SASSI instrumentation libraries that use shared resources, such as shared and constant memory, not only risk affecting occupancy, but they could also cause instrumented programs to fail. For instance, it is not uncommon for programs to use all of shared memory, leaving nothing for the instrumentation library. In practice, we have not been limited by these restrictions."}], "lineHeight": 0}}, "target": {"markdown": "由于 SASSI 插桩代码采用 CUDA 编写，因此其本质上是并行的。为 SASSI 设计插桩处理函数要求用户仔细考虑同步与数据共享问题。SASSI 处理函数可以利用 CUDA 的大多数显式并行特性，包括投票（voting）、原子操作（atomics）、洗牌（shuffle）以及广播（broadcast）等操作。然而，并非所有 CUDA 操作在 SASSI 插桩处理函数中都是合法的。例如，线程屏障（`__syncthreads`）无法使用，因为插桩函数可能在 warp 内线程发生分化（diverge）时被调用；在分化的 warp 上执行 `__syncthreads` 会阻止所有线程到达公共屏障点。最后，使用共享资源（如共享内存和常量内存）的 SASSI 插桩库不仅存在影响占用率（occupancy）的风险，还可能导致插桩后的程序运行失败。例如，某些程序经常会用完全部共享内存，从而没有剩余空间供插桩库使用。在实践中，我们尚未受到这些限制的阻碍。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "4ba7dda2c22fcad890d9e4cb14ecffc0", "index": 152, "aliyun_index": 4, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 9.4. SASSI Extensions\n", "text": "9.4. SASSI Extensions\n", "alignment": "left", "unique_id": "4ba7dda2c22fcad890d9e4cb14ecffc0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9.4. SASSI Extensions"}], "lineHeight": 0}}, "target": {"markdown": "## 9.4. SASSI 扩展\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 152}, {"source": {"block_id": "23fcc9dbea4b0206b05f01284d0452a9", "index": 153, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Exploiting compile-time information:** As part of the back-end compiler, SASSI has structural and type information that cannot be easily reconstructed dynamically. For instance, unlike SASSI, binary instrumentation frameworks generally cannot identify *static* basic block headers [12]. Operand datatype  \n\n", "text": "**Exploiting compile-time information:** As part of the back-end compiler, SASSI has structural and type information that cannot be easily reconstructed dynamically. For instance, unlike SASSI, binary instrumentation frameworks generally cannot identify *static* basic block headers [12]. Operand datatype\n", "alignment": "left", "unique_id": "23fcc9dbea4b0206b05f01284d0452a9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Exploiting compile-time information:** As part of the back-end compiler, SASSI has structural and type information that cannot be easily reconstructed dynamically. For instance, unlike SASSI, binary instrumentation frameworks generally cannot identify *static* basic block headers [12]. Operand datatype"}], "lineHeight": 0}}, "target": {"markdown": "**利用编译期信息：** 作为后端编译器的一部分，SASSI 拥有那些难以在运行时动态重建的结构与类型信息。例如，与 SASSI 不同的是，二进制插桩框架通常无法识别*静态的*基本块入口 [12]。操作数数据类型", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 153}, {"source": {"block_id": "5e7a22237800cbb0343dafdd67b81582", "index": 154, "aliyun_index": 6, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "information can also be passed to SASSI handlers, information\nthat is not explicitly encoded in a program's binary code.  \n\n", "text": "information can also be passed to SASSI handlers, information\nthat is not explicitly encoded in a program's binary code.\n", "alignment": "left", "unique_id": "5e7a22237800cbb0343dafdd67b81582", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "information can also be passed to SASSI handlers, information"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "that is not explicitly encoded in a program's binary code."}], "lineHeight": -56}}, "target": {"markdown": "信息也可以传递给 SASSI 处理函数，而这些信息并未显式编码在程序的二进制代码中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 154}, {"source": {"block_id": "61fa9886a254f8f9c146231df4f6cc99", "index": 155, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Instrumenting heterogeneous applications:** SASSI can be used in conjunction with host-side instrumentation tools like Pin to enable whole-program analysis of applications. This approach requires some degree of coordination between the host- and device-side instrumentation code, particularly when used to form a unified stream of events for analysis. We have already built a prototype to examine the sharing and CPU-GPU page migration behavior in a Unified Virtual Memory system [29] by tracing the addresses touched by the CPU and GPU. A CPU-side handler processes and correlates the traces.  \n\n", "text": "**Instrumenting heterogeneous applications:** SASSI can be used in conjunction with host-side instrumentation tools like Pin to enable whole-program analysis of applications. This approach requires some degree of coordination between the host- and device-side instrumentation code, particularly when used to form a unified stream of events for analysis. We have already built a prototype to examine the sharing and CPU-GPU page migration behavior in a Unified Virtual Memory system [29] by tracing the addresses touched by the CPU and GPU. A CPU-side handler processes and correlates the traces.\n", "alignment": "left", "unique_id": "61fa9886a254f8f9c146231df4f6cc99", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Instrumenting heterogeneous applications:** SASSI can be used in conjunction with host-side instrumentation tools like Pin to enable whole-program analysis of applications. This approach requires some degree of coordination between the host- and device-side instrumentation code, particularly when used to form a unified stream of events for analysis. We have already built a prototype to examine the sharing and CPU-GPU page migration behavior in a Unified Virtual Memory system [29] by tracing the addresses touched by the CPU and GPU. A CPU-side handler processes and correlates the traces."}], "lineHeight": 0}}, "target": {"markdown": "**插桩异构应用程序：** SASSI 可以与主机端插桩工具（如 Pin）结合使用，从而实现对应用程序的全程序分析。这种方法需要在主机端与设备端插桩代码之间进行一定程度的协同，尤其是在需要形成统一事件流以供分析时。我们已经构建了一个原型，通过追踪 CPU 和 GPU 所访问的地址，来考察统一虚拟内存（Unified Virtual Memory）系统中的数据共享以及 CPU-GPU 页面迁移行为 [29]。主机端的处理函数负责对这些追踪记录进行处理与关联。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 155}, {"source": {"block_id": "78219a1136fae2af8d71e035ad201211", "index": 156, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Driving other simulators:** SASSI can collect low-level traces of device-side events, which can then be processed by separate tools. For instance, a memory trace collected by SASSI can be used to drive a memory hierarchy simulator.  \n\n", "text": "**Driving other simulators:** SASSI can collect low-level traces of device-side events, which can then be processed by separate tools. For instance, a memory trace collected by SASSI can be used to drive a memory hierarchy simulator.\n", "alignment": "left", "unique_id": "78219a1136fae2af8d71e035ad201211", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Driving other simulators:** SASSI can collect low-level traces of device-side events, which can then be processed by separate tools. For instance, a memory trace collected by SASSI can be used to drive a memory hierarchy simulator."}], "lineHeight": 0}}, "target": {"markdown": "**驱动其他模拟器：** SASSI 可以收集设备端事件的底层追踪记录，然后由其他工具进行处理。例如，由 SASSI 收集的内存追踪记录可以用于驱动内存层次结构模拟器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "799ed9570b5ffbc8f65d76ebd654c935", "index": 157, "aliyun_index": 9, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 9.5. Graphics Shaders\n", "text": "9.5. Graphics Shaders\n", "alignment": "left", "unique_id": "799ed9570b5ffbc8f65d76ebd654c935", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9.5. Graphics Shaders"}], "lineHeight": 0}}, "target": {"markdown": "## 9.5. 图形着色器\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "1f2a08bfd9420a0a5b50a781e72413c6", "index": 158, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Instrumentation of OpenGL and DirectX shaders is feasible with SASSI. Graphics shaders require SASSI to be part of the driver because they are always JIT compiled. Graphics shaders do not adhere to the CUDA ABI nor do they maintain a stack, and therefore SASSI must allocate and manage a stack from which the handler code can operate. Aside from stack management, the mechanics of setting up a CUDA ABI-compliant call from a graphics shader remain unchanged.  \n\n", "text": "Instrumentation of OpenGL and DirectX shaders is feasible with SASSI. Graphics shaders require SASSI to be part of the driver because they are always JIT compiled. Graphics shaders do not adhere to the CUDA ABI nor do they maintain a stack, and therefore SASSI must allocate and manage a stack from which the handler code can operate. Aside from stack management, the mechanics of setting up a CUDA ABI-compliant call from a graphics shader remain unchanged.\n", "alignment": "left", "unique_id": "1f2a08bfd9420a0a5b50a781e72413c6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Instrumentation of OpenGL and DirectX shaders is feasible with SASSI. Graphics shaders require SASSI to be part of the driver because they are always JIT compiled. Graphics shaders do not adhere to the CUDA ABI nor do they maintain a stack, and therefore SASSI must allocate and manage a stack from which the handler code can operate. Aside from stack management, the mechanics of setting up a CUDA ABI-compliant call from a graphics shader remain unchanged."}], "lineHeight": 0}}, "target": {"markdown": "OpenGL 和 DirectX 着色器的插桩可通过 SASSI 实现。由于图形着色器始终采用 JIT（即时编译）方式进行编译，因此对其进行插桩需要 SASSI 嵌入到驱动之中。图形着色器既不遵循 CUDA ABI，也不维护栈结构，因此 SASSI 必须自行分配并管理一个栈，供处理函数代码运行使用。除了栈管理之外，从图形着色器发起符合 CUDA ABI 调用的机制保持不变。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "faaf96ba846598c062e7b1e132ebf871", "index": 159, "aliyun_index": 0, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 10. Related Work\n", "text": "10. Related Work\n", "alignment": "left", "unique_id": "faaf96ba846598c062e7b1e132ebf871", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10. Related Work"}], "lineHeight": 0}}, "target": {"markdown": "## 10. 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "562e1f93870eac2a39ad083d259c8d10", "index": 160, "aliyun_index": 1, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "To our knowledge, this paper is the first to introduce an accurate and flexible selective instrumentation framework for GPU applications. The major contribution of this work is demonstrating a middle ground for measuring, characterizing, and analyzing GPU application performance that provides accurate hardware-rate analysis while being flexible enough to measure many interesting aspects of execution.  \n\n", "text": "To our knowledge, this paper is the first to introduce an accurate and flexible selective instrumentation framework for GPU applications. The major contribution of this work is demonstrating a middle ground for measuring, characterizing, and analyzing GPU application performance that provides accurate hardware-rate analysis while being flexible enough to measure many interesting aspects of execution.\n", "alignment": "left", "unique_id": "562e1f93870eac2a39ad083d259c8d10", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To our knowledge, this paper is the first to introduce an accurate and flexible selective instrumentation framework for GPU applications. The major contribution of this work is demonstrating a middle ground for measuring, characterizing, and analyzing GPU application performance that provides accurate hardware-rate analysis while being flexible enough to measure many interesting aspects of execution."}], "lineHeight": 0}}, "target": {"markdown": "据我们所知，本文是首个针对 GPU 应用程序提出精确且灵活的 selective 插桩框架的工作。本研究的主要贡献在于，展示了一种在测量、表征与分析 GPU 应用程序性能方面的折中方案：该方案既能提供精确的硬件级速率分析，又具备足够的灵活性，从而能够测量执行过程中诸多值得关注的不同方面。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "e5b55286877014fc018686a4e8dd91a8", "index": 161, "aliyun_index": 2, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Many profilers rely on specialized hardware support, such as NSight [34], Visual Profiler [35], and ProfileMe [11]. SASSI on the other hand, like the remainder of the related work in this section, is purely software-based. We qualitatively compare SASSI to alternative approaches, including binary instrumentation and compiler-based frameworks.  \n\n", "text": "Many profilers rely on specialized hardware support, such as NSight [34], Visual Profiler [35], and ProfileMe [11]. SASSI on the other hand, like the remainder of the related work in this section, is purely software-based. We qualitatively compare SASSI to alternative approaches, including binary instrumentation and compiler-based frameworks.\n", "alignment": "left", "unique_id": "e5b55286877014fc018686a4e8dd91a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Many profilers rely on specialized hardware support, such as NSight [34], Visual Profiler [35], and ProfileMe [11]. SASSI on the other hand, like the remainder of the related work in this section, is purely software-based. We qualitatively compare SASSI to alternative approaches, including binary instrumentation and compiler-based frameworks."}], "lineHeight": 0}}, "target": {"markdown": "许多分析器依赖于专用硬件支持，例如 NSight [34]、Visual Profiler [35] 和 ProfileMe [11]。而 SASSI 与本节中其余的相关工作一样，是纯粹基于软件的。我们对 SASSI 与其他方法（包括二进制插桩框架和基于编译器的框架）进行了定性比较。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "a90e5cfdedaa7aedb37ceadf7cfb49ab", "index": 162, "aliyun_index": 3, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 10.1. Binary Instrumentation\n", "text": "10.1. Binary Instrumentation\n", "alignment": "left", "unique_id": "a90e5cfdedaa7aedb37ceadf7cfb49ab", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10.1. Binary Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 10.1. 二进制插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "466c691107a35f20bff60ebdfba4e41f", "index": 163, "aliyun_index": 4, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Tools such as Pin [21], DynamoRIO [12], Valgrind [28], and\nAtom [38] allow for flexible binary instrumentation of pro-\ngrams. Binary instrumentation offers a major advantage over\ncompiler-based instrumentation approaches such as SASSI\nemploys: users do not need to recompile their applications to\napply instrumentation. Not only is recompilation onerous, but\nthere are cases where vendors may not be willing to relinquish\ntheir source code, making recompilation impossible.  \n\n", "text": "Tools such as Pin [21], DynamoRIO [12], Valgrind [28], and\nAtom [38] allow for flexible binary instrumentation of pro-\ngrams. Binary instrumentation offers a major advantage over\ncompiler-based instrumentation approaches such as SASSI\nemploys: users do not need to recompile their applications to\napply instrumentation. Not only is recompilation onerous, but\nthere are cases where vendors may not be willing to relinquish\ntheir source code, making recompilation impossible.\n", "alignment": "left", "unique_id": "466c691107a35f20bff60ebdfba4e41f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Tools such as Pin [21], DynamoRIO [12], Valgrind [28], and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Atom [38] allow for flexible binary instrumentation of pro-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "grams. Binary instrumentation offers a major advantage over"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compiler-based instrumentation approaches such as SASSI"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "employs: users do not need to recompile their applications to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "apply instrumentation. Not only is recompilation onerous, but"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "there are cases where vendors may not be willing to relinquish"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "their source code, making recompilation impossible."}], "lineHeight": -230}}, "target": {"markdown": "诸如 Pin [21]、DynamoRIO [12]、Valgrind [28] 和 Atom [38] 等工具允许对程序进行灵活的二进制插桩。二进制插桩相对于 SASSI 所采用的基于编译器的插桩方法而言，具有一个主要优势：用户无需重新编译应用程序即可施加插桩。重新编译不仅费时费力，而且在某些情况下，供应商可能不愿意公开其源代码，从而使得重新编译根本无法进行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "ea884c3a2616e5a3815508bb3681b2e0", "index": 164, "aliyun_index": 5, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "On the other hand, compiler-based instrumentation approaches have some tangible benefits. First, the compiler has information that is difficult, if not impossible, to reconstruct at runtime, including control-flow graph information, register liveness, and operand data-types. Second, in the context of just-in-time compiled systems (as is the case with graphics shaders and appropriately compiled compute shaders), programs are *always recompiled* before executing anyway. Finally, compiler-based instrumentation is more efficient than binary instrumentation because the compiler has the needed information to spill and refill the minimal number of registers.  \n\n", "text": "On the other hand, compiler-based instrumentation approaches have some tangible benefits. First, the compiler has information that is difficult, if not impossible, to reconstruct at runtime, including control-flow graph information, register liveness, and operand data-types. Second, in the context of just-in-time compiled systems (as is the case with graphics shaders and appropriately compiled compute shaders), programs are *always recompiled* before executing anyway. Finally, compiler-based instrumentation is more efficient than binary instrumentation because the compiler has the needed information to spill and refill the minimal number of registers.\n", "alignment": "left", "unique_id": "ea884c3a2616e5a3815508bb3681b2e0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On the other hand, compiler-based instrumentation approaches have some tangible benefits. First, the compiler has information that is difficult, if not impossible, to reconstruct at runtime, including control-flow graph information, register liveness, and operand data-types. Second, in the context of just-in-time compiled systems (as is the case with graphics shaders and appropriately compiled compute shaders), programs are *always recompiled* before executing anyway. Finally, compiler-based instrumentation is more efficient than binary instrumentation because the compiler has the needed information to spill and refill the minimal number of registers."}], "lineHeight": 0}}, "target": {"markdown": "另一方面，基于编译器的插桩方法也具有若干实实在在的优势。首先，编译器掌握着某些信息，这些信息即便不是不可能，也很难在运行时重新构建，包括控制流图信息、寄存器的活跃性以及操作数的数据类型。其次，在即时编译系统的语境下（图形着色器以及经适当编译的计算着色器即属此类），程序无论如何都*会在执行之前重新编译*。最后，基于编译器的插桩比二进制插桩更为高效，因为编译器掌握着必要的信息，从而能够仅对最少数量的寄存器进行溢出（spill）与回填（refill）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "6cc773bb9f5094ffb4fbffeba979f1fd", "index": 165, "aliyun_index": 6, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 10.2. Direct-execution Simulation\n", "text": "10.2. Direct-execution Simulation\n", "alignment": "left", "unique_id": "6cc773bb9f5094ffb4fbffeba979f1fd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10.2. Direct-execution Simulation"}], "lineHeight": 0}}, "target": {"markdown": "## 10.2. 直接执行仿真\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "f2f48d3f47848e565902e72d53745b99", "index": 166, "aliyun_index": 7, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Another approach related to compiler-based instrumentation is direct execution to accelerate functional simulators. Tools such as RPPT [9], Tango [10], Proteus [4], Shade [8], and Mambo [3] all translate some of the simulated program's instructions into the native ISA of the host machine where they execute at hardware speeds. The advantage of these approaches for architecture studies is that they are built into simulators designed to explore the design space and they naturally co-exist with simulator performance models. The disadvantage is that one has to implement the simulator and enough of the software stack to run any code at all. By running directly on native hardware, SASSI inherits the software stack and allows a user to explore only those parts of the program they care about. While we have not yet done so, one can use SASSI as a basis for an architecture performance simulator.  \n\n", "text": "Another approach related to compiler-based instrumentation is direct execution to accelerate functional simulators. Tools such as RPPT [9], Tango [10], Proteus [4], Shade [8], and Mambo [3] all translate some of the simulated program's instructions into the native ISA of the host machine where they execute at hardware speeds. The advantage of these approaches for architecture studies is that they are built into simulators designed to explore the design space and they naturally co-exist with simulator performance models. The disadvantage is that one has to implement the simulator and enough of the software stack to run any code at all. By running directly on native hardware, SASSI inherits the software stack and allows a user to explore only those parts of the program they care about. While we have not yet done so, one can use SASSI as a basis for an architecture performance simulator.\n", "alignment": "left", "unique_id": "f2f48d3f47848e565902e72d53745b99", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Another approach related to compiler-based instrumentation is direct execution to accelerate functional simulators. Tools such as RPPT [9], Tango [10], Proteus [4], Shade [8], and Mambo [3] all translate some of the simulated program's instructions into the native ISA of the host machine where they execute at hardware speeds. The advantage of these approaches for architecture studies is that they are built into simulators designed to explore the design space and they naturally co-exist with simulator performance models. The disadvantage is that one has to implement the simulator and enough of the software stack to run any code at all. By running directly on native hardware, SASSI inherits the software stack and allows a user to explore only those parts of the program they care about. While we have not yet done so, one can use SASSI as a basis for an architecture performance simulator."}], "lineHeight": 0}}, "target": {"markdown": "另一种与基于编译器的插桩相关的方法是直接执行（direct execution），以加速功能仿真器。诸如 RPPT [9]、Tango [10]、Proteus [4]、Shade [8] 和 Mambo [3] 等工具都会将部分被仿真程序的指令翻译成宿主机的原生 ISA，从而以硬件速度执行。对于架构研究而言，这些方法的优势在于它们被内置于旨在探索设计空间的仿真器中，并能自然地与仿真器性能模型共存。其不足之处在于，必须实现仿真器以及足够多的软件栈才能运行任何代码。而 SASSI 通过直接运行在原生硬件之上，天然继承了软件栈，并允许用户仅探索他们所关注的程序部分。尽管我们目前尚未这样做，但完全可以将 SASSI 用作架构性能仿真器的基础。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "3ac20abd2d97047f59f669fa748732d0", "index": 167, "aliyun_index": 8, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 10.3. Compiler-based Instrumentation\n", "text": "10.3. Compiler-based Instrumentation\n", "alignment": "left", "unique_id": "3ac20abd2d97047f59f669fa748732d0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10.3. Compiler-based Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 10.3. 基于编译器的插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "bcf43e227aebbba1f1a6af4b16e6704a", "index": 168, "aliyun_index": 9, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Ocelot is a compiler framework that operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [13], but has also been used to perform instrumentation of GPU programs [15]. While Ocelot is a useful tool, it suffers from several significant problems when used as a GPU instrumentation framework. First, because Ocelot operates at the virtual ISA (PTX) level, it is far divorced from the actual binary code emitted by the backend compiler. Consequently, Ocelot interferes with the backend compiler optimizations and is far more invasive and less precise in its ability to instrument a program. SASSI's approach to instrumentation, which allows users to write handlers in CUDA, is also more user-friendly than the C++ \"builder\" class approach employed in [15].  \n\n", "text": "Ocelot is a compiler framework that operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [13], but has also been used to perform instrumentation of GPU programs [15]. While Ocelot is a useful tool, it suffers from several significant problems when used as a GPU instrumentation framework. First, because Ocelot operates at the virtual ISA (PTX) level, it is far divorced from the actual binary code emitted by the backend compiler. Consequently, Ocelot interferes with the backend compiler optimizations and is far more invasive and less precise in its ability to instrument a program. SASSI's approach to instrumentation, which allows users to write handlers in CUDA, is also more user-friendly than the C++ \"builder\" class approach employed in [15].\n", "alignment": "left", "unique_id": "bcf43e227aebbba1f1a6af4b16e6704a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Ocelot is a compiler framework that operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [13], but has also been used to perform instrumentation of GPU programs [15]. While Ocelot is a useful tool, it suffers from several significant problems when used as a GPU instrumentation framework. First, because Ocelot operates at the virtual ISA (PTX) level, it is far divorced from the actual binary code emitted by the backend compiler. Consequently, Ocelot interferes with the backend compiler optimizations and is far more invasive and less precise in its ability to instrument a program. SASSI's approach to instrumentation, which allows users to write handlers in CUDA, is also more user-friendly than the C++ \"builder\" class approach employed in [15]."}], "lineHeight": 0}}, "target": {"markdown": "Ocelot 是一个在 PTX 代码上运行的编译器框架，它接收由前端编译器生成的 PTX，在自身的编译流程中对其进行修改，然后为 GPU 输出 PTX 代码或为 CPU 输出汇编代码。Ocelot 最初的设计目的是让 NVIDIA GPU 以外的架构能够利用 PTX 程序中的并行性 [13]，但它也被用于对 GPU 程序进行插桩 [15]。尽管 Ocelot 是一个有用的工具，但当用作 GPU 插桩框架时，它存在若干显著的缺陷。首先，由于 Ocelot 在虚拟 ISA（PTX）层面上运行，因此它与后端编译器实际生成的二进制代码相距甚远。由此导致 Ocelot 会干扰后端编译器的优化，并且在程序插桩方面侵入性更强、精确性更差。SASSI 所采用的插桩方法允许用户使用 CUDA 编写处理函数，比文献 [15] 中所使用的 C++ \"builder\" 类方法也更加易于使用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "1265398047170c07b7e5f2ffec4fff8b", "index": 169, "aliyun_index": 10, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 11. Conclusion\n", "text": "11. Conclusion\n", "alignment": "left", "unique_id": "1265398047170c07b7e5f2ffec4fff8b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "11. Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "## 11. 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "5037ff4da9d45e849a53198cc8e2880c", "index": 170, "aliyun_index": 11, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "This paper introduced SASSI, a new assembly-language instrumentation tool for GPUs. Built into the NVIDIA production-level backend compiler, SASSI enables a user to specify specific instructions or instruction types at which to inject a call to a user-provided instrumentation function. SASSI instrumentation code is written in CUDA and is inherently parallel, enabling users to explore the parallel behavior of applications and architectures. We have demonstrated that SASSI can be used for a range of architecture studies, including instruction control flow, memory systems, value similarity, and resilience. Similar to CPU binary instrumentation tools, SASSI can be used to perform a wide range of studies on GPU applications and architectures. The runtime overhead of SASSI depends in part on the frequency of instrumented instructions and the complexity of the instrumentation code. Our studies show a range of runtime slowdowns from 1–160×, depending on the experiment. While we have chosen to implement SASSI in the compiler, nothing precludes the technology from being integrated into a binary rewriting tool for GPUs. Further, we expect that the SASSI technology can be extended in the future to include graphics shaders.  \n\n", "text": "This paper introduced SASSI, a new assembly-language instrumentation tool for GPUs. Built into the NVIDIA production-level backend compiler, SASSI enables a user to specify specific instructions or instruction types at which to inject a call to a user-provided instrumentation function. SASSI instrumentation code is written in CUDA and is inherently parallel, enabling users to explore the parallel behavior of applications and architectures. We have demonstrated that SASSI can be used for a range of architecture studies, including instruction control flow, memory systems, value similarity, and resilience. Similar to CPU binary instrumentation tools, SASSI can be used to perform a wide range of studies on GPU applications and architectures. The runtime overhead of SASSI depends in part on the frequency of instrumented instructions and the complexity of the instrumentation code. Our studies show a range of runtime slowdowns from 1–160×, depending on the experiment. While we have chosen to implement SASSI in the compiler, nothing precludes the technology from being integrated into a binary rewriting tool for GPUs. Further, we expect that the SASSI technology can be extended in the future to include graphics shaders.\n", "alignment": "left", "unique_id": "5037ff4da9d45e849a53198cc8e2880c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper introduced SASSI, a new assembly-language instrumentation tool for GPUs. Built into the NVIDIA production-level backend compiler, SASSI enables a user to specify specific instructions or instruction types at which to inject a call to a user-provided instrumentation function. SASSI instrumentation code is written in CUDA and is inherently parallel, enabling users to explore the parallel behavior of applications and architectures. We have demonstrated that SASSI can be used for a range of architecture studies, including instruction control flow, memory systems, value similarity, and resilience. Similar to CPU binary instrumentation tools, SASSI can be used to perform a wide range of studies on GPU applications and architectures. The runtime overhead of SASSI depends in part on the frequency of instrumented instructions and the complexity of the instrumentation code. Our studies show a range of runtime slowdowns from 1–160×, depending on the experiment. While we have chosen to implement SASSI in the compiler, nothing precludes the technology from being integrated into a binary rewriting tool for GPUs. Further, we expect that the SASSI technology can be extended in the future to include graphics shaders."}], "lineHeight": 0}}, "target": {"markdown": "本文介绍了 SASSI，一种面向 GPU 的新型汇编语言插桩工具。SASSI 内置于 NVIDIA 生产级的后端编译器之中，允许用户指定具体的指令或指令类型，在这些位置注入对用户所提供的插桩函数的调用。SASSI 的插桩代码使用 CUDA 编写，且天然具备并行特性，使用户能够探索应用程序与架构的并行行为。我们已经证明，SASSI 可用于一系列架构研究，包括指令控制流、存储系统、值相似性以及可靠性等。与 CPU 上的二进制插桩工具类似，SASSI 也可被用于在 GPU 应用程序和架构上开展广泛的研究。SASSI 的运行时开销部分取决于被插桩指令的频率以及插桩代码的复杂度。我们的研究表明，根据实验的不同，运行时减速介于 1–160× 之间。虽然我们选择在编译器中实现 SASSI，但这并不妨碍将该技术集成到面向 GPU 的二进制重写工具中。此外，我们期望在未来能够将 SASSI 技术进一步扩展，以涵盖图形着色器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "43ca1f68da1290f324ae6a0f4cb2d213", "index": 171, "aliyun_index": 12, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 12. Acknowledgments\n", "text": "12. Acknowledgments\n", "alignment": "left", "unique_id": "43ca1f68da1290f324ae6a0f4cb2d213", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "12. Acknowledgments"}], "lineHeight": 0}}, "target": {"markdown": "## 12. 致谢\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "4de69e35f4912e1b0dd435c364c1efb7", "index": 172, "aliyun_index": 13, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "We would like to thank the numerous people at NVIDIA who provided valuable feedback and training during SASSI's development, particularly Vyas Venkataraman. We thank Jason Clemons who helped us generate figures, and Neha Agarwal who provided an interesting early use case.  \n\n", "text": "We would like to thank the numerous people at NVIDIA who provided valuable feedback and training during SASSI's development, particularly Vyas Venkataraman. We thank Jason Clemons who helped us generate figures, and Neha Agarwal who provided an interesting early use case.\n", "alignment": "left", "unique_id": "4de69e35f4912e1b0dd435c364c1efb7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We would like to thank the numerous people at NVIDIA who provided valuable feedback and training during SASSI's development, particularly Vyas Venkataraman. We thank Jason Clemons who helped us generate figures, and Neha Agarwal who provided an interesting early use case."}], "lineHeight": 0}}, "target": {"markdown": "我们要感谢 NVIDIA 的众多人士，他们在 SASSI 的开发过程中提供了宝贵意见和培训，特别是 Vyas Venkataraman。我们感谢 Jason Clemons 帮助我们生成图表，也感谢 Neha Agarwal 提供了一个有趣的早期用例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 172}, {"source": {"block_id": "337883d0604efd3e60d68f962effd48c", "index": 173, "aliyun_index": 14, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## References\n", "text": "References\n", "alignment": "left", "unique_id": "337883d0604efd3e60d68f962effd48c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "References"}], "lineHeight": 0}}, "target": {"markdown": "## 参考文献\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 173}, {"source": {"block_id": "cc80da6830ff37e3683e49959deca254", "index": 174, "aliyun_index": 15, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[1] A. B function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){
  const cells = line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
  return cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()) || c.trim()==='');
}
function isPipeRow(line){ return /\|/.test(line); }
function rowCells(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
}
function tableHtml(rows){
  if (!rows.length) return '';
  let html = '<table><thead><tr>';
  for (const c of rowCells(rows[0])) html += `<th>${inlineMd(c)}</th>`;
  html += '</tr></thead><tbody>';
  const start = (rows.length>1 && isSepRow(rows[1])) ? 2 : 1;
  for (let i=start;i<rows.length;i++){
    if (isSepRow(rows[i])) continue;
    html += '<tr>';
    for (const c of rowCells(rows[i])) html += `<td>${inlineMd(c)}</td>`;
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){
  const slots = [];
  let raw = String(t||'');
  raw = raw.replace(/\$\$([\s\S]+?)\$\$/g, (_,m) => {
    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i].trim())){
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;
      }
      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*[-*•]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);
}
function showToast(msg){

function counts(){
  const c = {translated:0,skipped:0,failed:0,pending:0,edited:0};

  return c;
}
function pickMd(p, which){
  if (which==='source') return p.source.markdown||'';
  return (p.target.markdown || p.source.markdown || '');
}
function headingId(blockId){ return 'sec-'+blockId; }
const foldedIds = new Set();
function outlineTree(list){
  const root = [];
  const stack = [];
  (list||[]).forEach(e => {
    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();
    if (!stack.length) root.push(node); else stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root;
}
function tocNodeHtml(node){
  const kids = node.children||[];
  const leaf = kids.length===0;
  const folded = foldedIds.has(node.block_id);
  return `<div class="toc-node lv${node.level}${folded?' folded':''}" data-bid="${esc(node.block_id)}">
    <div class="toc-row">
      <button type="button" class="toc-twist${leaf?' leaf':''}" data-fold="${esc(node.block_id)}" aria-expanded="${leaf? 'true': String(!folded)}">${leaf?'•':'▾'}</button>
      <a href="#${headingId(node.block_id)}" data-bid="${esc(node.block_id)}">${esc(node.title)}</a>
    </div>
    ${leaf?'':`<div class="toc-kids">${kids.map(tocNodeHtml).join('')}</div>`}
  </div>`;
}
function renderToc(){
  const box = document.getElementById('toc');
  const outline = DATA.outline || [];
  if (!outline.length){ box.innerHTML = '<div style="padding:8px 18px;color:#78716c">暂无目录</div>'; return; }

function pairRoles(){

}
function isListMd(md){
  const lines = String(md||'').split('\n').map(s => s.trim()).filter(Boolean);
  return lines.length>0 && lines.every(ln => /^[-*•]\s+/.test(ln));
}
function isCaptionType(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  return t==='figure_name' || t==='figure_note' || t==='table_name' || t==='table_note';
}
function isFigureType(p){ return ((p.source && p.source.type) || '')==='figure'; }
function isFencedCode(md){
  const lines = String(md||'').trim().split('\n');
  if (lines.length<2 || !lines[0].trim().startsWith('```')) return false;
  return lines.slice(1).some(ln => ln.trim().startsWith('```'));
}
function isImageOnlyMd(md){
  return String(md||'').replace(/!\[[^\]]*?\]\([^)]*?\)/g,'').replace(/<img\b[^>]*>/gi,'').trim()==='';
}
function isFormulaOnlyMd(md){
  const raw = String(md||'');
  const stripped = raw.replace(/\$\$[\s\S]*?\$\$/g,'').replace(/\\\[[\s\S]*?\\\]/g,'').trim();
  return raw.trim()!=='' && stripped==='';
}
function isSharedVisual(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  if (['figure','formula','equation','math','latex','code','codes'].includes(t)) return true;
  if ((p.target && p.target.status)==='skipped') return true;
  const src = ((p.source && p.source.markdown)||'').trim();
  const tgt = ((p.target && p.target.markdown)||'').trim();
  if (!tgt || src===tgt) return true;
  if (src && isImageOnlyMd(src)) return true;
  if (tgt && isImageOnlyMd(tgt)) return true;
  if (src && isFormulaOnlyMd(src)) return true;
  if (isFencedCode(src) || isFencedCode(tgt)) return true;
  return false;
}
function unitKindClass(p, md){
  if (isFigureType(p)) return ' is-figure';
  if (isCaptionType(p)) return ' is-caption';
  if (isListMd(md)) return ' is-list';

}
function captionMd(md){
  return String(md||'').replace(/^\s*>\s?/gm, '').trim();
}
function markCaptionLabel(html){
  return html.replace(
    /(<p>)((?:图|表|Fig\.?|Figure|TABLE|Table|Listing|Listings|代码清单)\s*[0-9IVXLCDM]+[.:：]?\s*)/i,
    '$1<span class="cap-label">$2</span>'
  );
}
function chunkHtml(p, i, which, shared){
  const role = shared ? 'shared-line' : (which==='source' ? 'src-line' : 'tgt-line');
  let md = pickMd(p, which);
  let extra = shared ? ' is-shared' : '';
  if (isCaptionType(p)){
    extra += ' fig-caption';
    md = captionMd(md);
  } else if (isFigureType(p)){
    extra += ' fig-image';
  }
  let inner = mdToHtml(md);
  if (isCaptionType(p)) inner = markCaptionLabel(inner);
  return `<div class="pair-chunk ${role}${extra}" data-pair="${i}">${inner}</div>`;
}

  return compareFirst==='source' ? 'source' : 'target';
}

  return `<button type="button" class="unit-edit" data-edit="${i}" title="编辑此块">编辑</button>`;
}
function headingLevelOf(md){
  const m = String(md||'').trim().match(/^(#{1,6})\s+/);
  return m ? m[1].length : 2;
}
function stripHeadingMarks(md){
  const line = String(md||'').trim().split('\n')[0] || '';
  return line.replace(/^#{1,6}\s+/, '').trim();
}
function applyHeadingLevel(md, level){
  const lv = Math.max(1, Math.min(6, +level || 2));
  const lines = String(md||'').split('\n');
  const first = (lines[0] || '').replace(/^#{1,6}\s+/, '');
  const rest = lines.slice(1).join('\n');
  return '#'.repeat(lv) + ' ' + first + (rest ? '\n' + rest : '');
}
function rebuildOutline(){
  DATA.outline = DATA.pairs.map((p, idx) => {
    if ((p.source.type || '') !== 'title') return null;
    const src = stripHeadingMarks(p.source.markdown);
    const tgtMd = p.target.markdown || p.source.markdown;
    const tgt = stripHeadingMarks(tgtMd);
    return {
      block_id: p.source.block_id,
      level: Math.max(1, Math.min(4, headingLevelOf(tgtMd || p.source.markdown))),
      title: tgt || src,
      source_title: src,
      pair_index: idx
    };
  }).filter(Boolean);
}
function bindPairHover(root){
  root.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-pair]');
    if (!el) return;
    const id = el.getAttribute('data-pair');
    root.querySelectorAll('[data-pair]').forEach(n => {
      n.classList.toggle('pair-hot', n.getAttribute('data-pair')===id);
    });
  });
  root.addEventListener('mouseleave', () => {
    root.querySelectorAll('.pair-hot').forEach(n => n.classList.remove('pair-hot'));
  });
}
function renderArticle(){
  const list = document.getElementById('list');
  list.className = 'content';
  const wrap = document.createElement('div');
  if (viewMode!=='compare'){
    wrap.className = 'article';
    const which = viewMode==='parse' ? 'source' : 'target';
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p, which));
      return `<div class="pair-unit${kind}"${hid} data-pair="${i}">${editBtnHtml(i)}${chunkHtml(p,i,which)}</div>`;
    }).join('');
  } else if (compareLayout==='side'){
    wrap.className = 'article compare-side';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,'target')) || unitKindClass(p, pickMd(p,'source'));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit side-pair${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  } else {
    // 豆包/沉浸式翻译式：一段原文，紧跟一段译文。相同的图/代码只显示一份。
    wrap.className = 'article compare-stack';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,a)) || unitKindClass(p, pickMd(p,b));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  }
  list.innerHTML = '';
  list.appendChild(wrap);
  bindPairHover(wrap);
}
function render(){
  document.body.classList.toggle('show-edit', showEdit);
  const c = counts();
  document.getElementById('counts').textContent =
    `translated ${c.translated} · skipped ${c.skipped} · failed ${c.failed} · pending ${c.pending} · edited ${c.edited}`;
  document.getElementById('cmp').disabled = viewMode!=='compare';
  document.getElementById('layout').disabled = viewMode!=='compare';
  renderArticle();
}
function fillTypeSelect(current){
  const sel = document.getElementById('edit-type');
  const types = BLOCK_TYPES.slice();
  if (current && types.indexOf(current)<0) types.push(current);
  sel.innerHTML = types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = current || 'text';
}
function editorStateFromForm(){
  return {
    type: document.getElementById('edit-type').value,
    isTitle: document.getElementById('edit-is-title').checked,
    level: +document.getElementById('edit-level').value || 2,
    translate: document.getElementById('edit-translate').checked,
    source: document.getElementById('edit-src').value,
    target: document.getElementById('edit-tgt').value
  };
}
function syncTitleFields(){
  const isTitle = document.getElementById('edit-is-title').checked;
  document.getElementById('edit-level-wrap').hidden = !isTitle;
  if (isTitle) document.getElementById('edit-type').value = 'title';
}
function updateEditorPreview(){
  const st = editorStateFromForm();
  const fake = {source:{type: st.isTitle ? 'title' : st.type}};
  let src = st.source, tgt = st.target;
  if (isCaptionType(fake)){
    src = captionMd(src);
    tgt = captionMd(tgt);
  }
  let srcHtml = mdToHtml(src);
  let tgtHtml = mdToHtml(tgt);
  if (isCaptionType(fake)){
    srcHtml = markCaptionLabel(srcHtml);
    tgtHtml = markCaptionLabel(tgtHtml);
  }
  document.getElementById('edit-src-preview').innerHTML = srcHtml || '<p>（空）</p>';
  document.getElementById('edit-tgt-preview').innerHTML = tgtHtml || '<p>（空）</p>';
}
function openEditor(i){
  const p = DATA.pairs[i];
  if (!p) return;
  editingIndex = i;
  const src = p.source, tgt = p.target;
  const page = (src.page_num==null) ? '-' : (src.page_num + 1);
  document.getElementById('edit-title').textContent = '编辑块 ' + (src.block_id || ('#'+i));
  document.getElementById('edit-meta').textContent =
    `第 ${page} 页 · index ${src.index} · ${esc(tgt.status)}` +
    (tgt.skip_reason ? (' · ' + tgt.skip_reason) : '');
  fillTypeSelect(src.type || 'text');
  const isTitle = (src.type || '') === 'title';
  document.getElementById('edit-is-title').checked = isTitle;
  document.getElementById('edit-level').value = String(headingLevelOf(src.markdown || tgt.markdown));
  document.getElementById('edit-translate').checked = tgt.status !== 'skipped';
  document.getElementById('edit-src').value = src.markdown || '';
  document.getElementById('edit-tgt').value = tgt.markdown || '';
  document.getElementById('edit-propose').hidden = !(corpusRepo() && paperSlug());
  syncTitleFields();
  updateEditorPreview();
  editSnapshot = JSON.stringify(editorStateFromForm());
  document.getElementById('edit-modal').hidden = false;
  document.body.classList.add('modal-open');
  document.getElementById('edit-tgt').focus();
}
function closeEditor(){
  document.getElementById('edit-modal').hidden = true;
  document.body.classList.remove('modal-open');
  editingIndex = -1;
}
function editorDirty(){
  return JSON.stringify(editorStateFromForm()) !== editSnapshot;
}
function requestCloseEditor(){
  if (editorDirty() && !confirm('放弃未保存的修改？')) return;
  closeEditor();
}
function applyEditor(){
  if (editingIndex < 0) return;
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  const prevType = p.source.type || 'text';
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  let srcMd = st.source;
  let tgtMd = st.target;
  if (type === 'title'){
    srcMd = applyHeadingLevel(srcMd, st.level);
    if (String(tgtMd).trim()) tgtMd = applyHeadingLevel(tgtMd, st.level);
  }
  const srcChanged = srcMd !== (p.source.markdown || '');
  const tgtChanged = tgtMd !== (p.target.markdown || '');
  p.source.type = type;
  p.source.markdown = srcMd;
  if (srcChanged || type !== prevType) p.source.edited = true;
  p.target.markdown = tgtMd;
  if (!st.translate){
    p.target.status = 'skipped';
    if (!p.target.skip_reason) p.target.skip_reason = 'user';
  } else {
    if (p.target.status === 'skipped'){
      p.target.skip_reason = null;
      p.target.skip_kind = null;
      p.target.status = tgtMd.trim() ? (tgtChanged ? 'edited' : 'translated') : 'pending';
    }
    if (tgtChanged){
      p.target.edited = true;
      p.target.status = 'edited';
    }
  }
  rebuildOutline();
  closeEditor();
  const y = window.scrollY;
  render();
  renderToc();
  window.scrollTo(0, y);
  showToast('已改内存中的文档，请下载 JSON/HTML 保存');
}
function corpusRepo(){ return (DATA.corpus_repo || BOOT.corpus_repo || '').trim(); }
function paperSlug(){ return (DATA.paper_slug || BOOT.paper_slug || '').trim(); }
function patchFromEditor(){
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  const source = { markdown: st.source, type: type };
  const target = { markdown: st.target };
  const patch = {
    schema: 'pdf-agent-edit/v1',
    paper: paperSlug(),
    block_id: p.source.block_id,
    pair_index: editingIndex,
    action: st.translate ? 'replace' : 'skip',
    source: source,
    target: target,
    translate: st.translate,
    heading_level: st.isTitle ? st.level : null,
    before: {
      source: { markdown: p.source.markdown || '' },
      target: { markdown: p.target.markdown || '' }
    }
  };
  return patch;
}
function proposeEditor(){
  const repo = corpusRepo();
  const slug = paperSlug();
  if (!repo || !slug){
    showToast('未绑定语料仓，请下载 JSON 或手开 Issue');
    return;
  }
  const patch = patchFromEditor();
  const title = '[edit] ' + slug + ' ' + patch.block_id;
  const yaml = [
    '---',
    'schema: pdf-agent-edit/v1',
    'paper: ' + slug,
    'block_id: ' + patch.block_id,
    'pair_index: ' + String(patch.pair_index),
    'action: ' + patch.action,
    '---',
    '',
    '```json',
    JSON.stringify(patch, null, 2),
    '```',
    ''
  ].join('\n');
  const url = 'https://github.com/' + repo + '/issues/new?' + new URLSearchParams({
    title: title,
    body: yaml,
    labels: 'edit'
  }).toString();
  if (url.length > 7000){
    download((slug + '-' + patch.block_id + '.edit.json'),
      new Blob([JSON.stringify(patch, null, 2)], {type:'application/json'}));
    showToast('补丁太长，已下载 JSON，请新建 Issue 并粘贴');
    return;
  }
  window.open(url, '_blank', 'noopener');
}
document.getElementById('list').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-edit]');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  openEditor(+btn.getAttribute('data-edit'));
});
document.getElementById('toc').addEventListener('click', ev => {
  const twist = ev.target.closest('[data-fold]');
  if (twist && !twist.classList.contains('leaf')){
    ev.preventDefault();
    const id = twist.getAttribute('data-fold');
    if (foldedIds.has(id)) foldedIds.delete(id); else foldedIds.add(id);
    const node = twist.closest('.toc-node');
    if (node){
      node.classList.toggle('folded', foldedIds.has(id));
      twist.setAttribute('aria-expanded', String(!foldedIds.has(id)));
    }
    return;
  }
  const a = ev.target.closest('a');
  if (!a) return;
  ev.preventDefault();
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.toc a').forEach(x => x.classList.toggle('active', x===a));
});
document.getElementById('nav-toggle').addEventListener('click', () => {
  setNavFolded(!document.body.classList.contains('nav-folded'));
});
document.getElementById('nav-reopen').addEventListener('click', () => setNavFolded(false));
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
document.getElementById('mode').addEventListener('change', e => { viewMode = e.target.value; render(); });
document.getElementById('cmp').addEventListener('change', e => { compareFirst = e.target.value; render(); });
document.getElementById('layout').addEventListener('change', e => { compareLayout = e.target.value; render(); });
document.getElementById('show-edit').addEventListener('change', e => {
  showEdit = e.target.checked;
  document.body.classList.toggle('show-edit', showEdit);
});
['edit-src','edit-tgt','edit-type','edit-level','edit-is-title','edit-translate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditorPreview);
  document.getElementById(id).addEventListener('change', updateEditorPreview);
});
document.getElementById('edit-type').addEventListener('change', () => {
  document.getElementById('edit-is-title').checked = document.getElementById('edit-type').value === 'title';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-is-title').addEventListener('change', () => {
  if (document.getElementById('edit-is-title').checked) document.getElementById('edit-type').value = 'title';
  else if (document.getElementById('edit-type').value === 'title') document.getElementById('edit-type').value = 'text';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-save').addEventListener('click', applyEditor);
document.getElementById('edit-propose').addEventListener('click', proposeEditor);
document.getElementById('edit-cancel').addEventListener('click', requestCloseEditor);
document.getElementById('edit-close').addEventListener('click', requestCloseEditor);
document.getElementById('edit-backdrop').addEventListener('click', requestCloseEditor);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('edit-modal').hidden) return;
  ev.preventDefault();
  requestCloseEditor();
});
document.getElementById('dl-json').addEventListener('click', () => {
  download((DATA.source_pdf_name||'document')+'.translated.json',
    new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'}));
});
document.getElementById('dl-html').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  const script = clone.querySelector('#doc-data');
  if (script) script.textContent = JSON.stringify(DATA);
  download((DATA.source_pdf_name||'document')+'.html',
    new Blob(['<!DOCTYPE html>\n'+clone.outerHTML], {type:'text/html'}));
});
(function initPdfLink(){
  const a = document.getElementById('dl-pdf');
  if (!a) return;
  if (BOOT.has_source_pdf){
    a.hidden = false;
    a.setAttribute('href', BOOT.source_pdf_href || 'source.pdf');
    a.setAttribute('download', BOOT.source_pdf_name || 'source.pdf');
  } else {
    a.remove();
  }
})();
try { if (localStorage.getItem('pat-nav-folded')==='1') setNavFolded(true); } catch (e) {}
renderToc();
render();
</script>
