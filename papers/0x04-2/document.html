s its last pass, injection of instrumentation\ncode does not affect compile-time code generation optimiza-\ntions. Further SASSI is highly portable and gracefully handles\nthe latest versions of CUDA, and can be extended to handle\nOpenGL and DirectX 11 shaders. The tool allows us to collect\nresults across multiple generations of NVIDIA architectures\nincluding Fermi, Kepler, and Maxwell.  \n\n", "text": "compiler, and runs as its last pass, injection of instrumentation\ncode does not affect compile-time code generation optimiza-\ntions. Further SASSI is highly portable and gracefully handles\nthe latest versions of CUDA, and can be extended to handle\nOpenGL and DirectX 11 shaders. The tool allows us to collect\nresults across multiple generations of NVIDIA architectures\nincluding Fermi, Kepler, and Maxwell.\n", "alignment": "left", "unique_id": "1830de95af9730dcfa510461e04c1656", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compiler, and runs as its last pass, injection of instrumentation"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "code does not affect compile-time code generation optimiza-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tions. Further SASSI is highly portable and gracefully handles"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the latest versions of CUDA, and can be extended to handle"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "OpenGL and DirectX 11 shaders. The tool allows us to collect"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "results across multiple generations of NVIDIA architectures"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "including Fermi, Kepler, and Maxwell."}], "lineHeight": -202}}, "target": {"markdown": "编译器中，并在其最后一遍执行时运行，因此插桩代码的注入不会影响编译时的代码生成优化。此外，SASSI 具有高度的可移植性，能够优雅地支持最新版本的 CUDA，并可扩展以处理 OpenGL 和 DirectX 11 着色器。该工具使我们能够跨多代 NVIDIA 架构（包括 Fermi、Kepler 和 Maxwell）收集结果。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "8b76f19a64bdd11e0294b0ea114411f5", "index": 18, "aliyun_index": 1, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "As with the production-quality profiling tools, selective\ninstrumentation allows hardware-rate analysis, yet, as the\ncase studies we demonstrate confirm, our approach is flexible enough to measure many interesting and novel aspects of\nexecution. Because selective instrumentation is far faster than\nsimulation, users can easily collect data based on real-world\nexecution environments and application data sets.  \n\n", "text": "As with the production-quality profiling tools, selective\ninstrumentation allows hardware-rate analysis, yet, as the\ncase studies we demonstrate confirm, our approach is flexible enough to measure many interesting and novel aspects of\nexecution. Because selective instrumentation is far faster than\nsimulation, users can easily collect data based on real-world\nexecution environments and application data sets.\n", "alignment": "left", "unique_id": "8b76f19a64bdd11e0294b0ea114411f5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As with the production-quality profiling tools, selective"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instrumentation allows hardware-rate analysis, yet, as the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "case studies we demonstrate confirm, our approach is flexible enough to measure many interesting and novel aspects of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "execution. Because selective instrumentation is far faster than"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "simulation, users can easily collect data based on real-world"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "execution environments and application data sets."}], "lineHeight": -201}}, "target": {"markdown": "与生产级分析工具一样，选择性插桩允许以硬件速度进行分析，然而，正如我们所展示的案例研究所证实的，我们的方法足够灵活，能够测量许多有趣且新颖的执行特性。由于选择性插桩比模拟快得多，用户可以轻松地基于真实世界执行环境和应用数据集来收集数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "8146d9d9d4f59dd532af3f3eab3132f4", "index": 19, "aliyun_index": 2, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Because GPU architectures follow a different programming paradigm than traditional CPU architectures, the instrumentation code that SASSI injects contains constructs and constraints that may be unfamiliar even to expert CPU programmers. Also unlike their CPU counterparts, GPU instrumentation tools must cope with staggering register requirements (combined with modest spill memory), and they must operate in a truly heterogeneous environment (i.e., the instrumented device code must work in tandem with the host system).  \n\n", "text": "Because GPU architectures follow a different programming paradigm than traditional CPU architectures, the instrumentation code that SASSI injects contains constructs and constraints that may be unfamiliar even to expert CPU programmers. Also unlike their CPU counterparts, GPU instrumentation tools must cope with staggering register requirements (combined with modest spill memory), and they must operate in a truly heterogeneous environment (i.e., the instrumented device code must work in tandem with the host system).\n", "alignment": "left", "unique_id": "8146d9d9d4f59dd532af3f3eab3132f4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Because GPU architectures follow a different programming paradigm than traditional CPU architectures, the instrumentation code that SASSI injects contains constructs and constraints that may be unfamiliar even to expert CPU programmers. Also unlike their CPU counterparts, GPU instrumentation tools must cope with staggering register requirements (combined with modest spill memory), and they must operate in a truly heterogeneous environment (i.e., the instrumented device code must work in tandem with the host system)."}], "lineHeight": 0}}, "target": {"markdown": "由于 GPU 架构遵循与传统 CPU 架构不同的编程范式，SASSI 注入的插桩代码包含即使是经验丰富的 CPU 程序员也可能不熟悉的结构和约束。此外，与 CPU 工具不同，GPU 插桩工具必须应对惊人的寄存器需求（以及适中的溢出内存），并且必须运行在真正的异构环境中（即，被插桩的设备代码必须与主机系统协同工作）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "d8a94bad2de4d0a656a1abafaf32e405", "index": 20, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In the remainder of this paper, we first discuss background information on GPU architecture and software stacks. Then we describe the details of SASSI, focusing on the key challenges inherent with GPU instrumentation, along with their solutions. Finally, we demonstrate the tool's usefulness for application profiling and architectural design space exploration by presenting four varied case studies (in Sections 5–8) that investigate control flow, memory systems, value similarity, and resilience.  \n\n", "text": "In the remainder of this paper, we first discuss background information on GPU architecture and software stacks. Then we describe the details of SASSI, focusing on the key challenges inherent with GPU instrumentation, along with their solutions. Finally, we demonstrate the tool's usefulness for application profiling and architectural design space exploration by presenting four varied case studies (in Sections 5–8) that investigate control flow, memory systems, value similarity, and resilience.\n", "alignment": "left", "unique_id": "d8a94bad2de4d0a656a1abafaf32e405", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the remainder of this paper, we first discuss background information on GPU architecture and software stacks. Then we describe the details of SASSI, focusing on the key challenges inherent with GPU instrumentation, along with their solutions. Finally, we demonstrate the tool's usefulness for application profiling and architectural design space exploration by presenting four varied case studies (in Sections 5–8) that investigate control flow, memory systems, value similarity, and resilience."}], "lineHeight": 0}}, "target": {"markdown": "在本文余下的部分中，我们首先讨论有关 GPU 架构和软件栈的背景信息。然后我们详细描述 SASSI，重点关注 GPU 插桩固有的关键挑战及其解决方案。最后，我们通过展示四个不同的案例研究（在第 5–8 节中）来证明该工具在应用性能分析以及架构设计空间探索方面的实用性，这些案例研究分别涉及控制流、存储系统、值相似性和弹性可靠性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "d7db238f6bde8725a98c0edc6d7e7823", "index": 21, "aliyun_index": 4, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2. Background\n", "text": "2. Background\n", "alignment": "left", "unique_id": "d7db238f6bde8725a98c0edc6d7e7823", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2. Background"}], "lineHeight": 0}}, "target": {"markdown": "## 2. 背景\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "fa5d111d4e7b13dfbb98e0dfb93a2840", "index": 22, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This section provides background on basic GPU architecture terminology and the NVIDIA GPU compilation flow. While SASSI is prototyped using NVIDIA's technology, the ideas presented in this paper are not specific to NVIDIA's architectures, tools, or flows, and can be similarly applied to other compiler backends and GPUs.  \n\n", "text": "This section provides background on basic GPU architecture terminology and the NVIDIA GPU compilation flow. While SASSI is prototyped using NVIDIA's technology, the ideas presented in this paper are not specific to NVIDIA's architectures, tools, or flows, and can be similarly applied to other compiler backends and GPUs.\n", "alignment": "left", "unique_id": "fa5d111d4e7b13dfbb98e0dfb93a2840", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section provides background on basic GPU architecture terminology and the NVIDIA GPU compilation flow. While SASSI is prototyped using NVIDIA's technology, the ideas presented in this paper are not specific to NVIDIA's architectures, tools, or flows, and can be similarly applied to other compiler backends and GPUs."}], "lineHeight": 0}}, "target": {"markdown": "本节介绍基本的 GPU 架构术语以及 NVIDIA GPU 编译流程的背景知识。尽管 SASSI 是基于 NVIDIA 的技术进行原型实现的，但本文所提出的思想并不特定于 NVIDIA 的架构、工具或流程，同样可以应用于其他编译器后端和 GPU。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "fb12cd9fab29ccfe58d8ec9dadf6df2b", "index": 23, "aliyun_index": 6, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2.1. GPU Architecture Terminology\n", "text": "2.1. GPU Architecture Terminology\n", "alignment": "left", "unique_id": "fb12cd9fab29ccfe58d8ec9dadf6df2b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.1. GPU Architecture Terminology"}], "lineHeight": 0}}, "target": {"markdown": "## 2.1. GPU 架构术语\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "664fef7dfef353fce43f0b6d2c59a09e", "index": 24, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "GPU programming models allow the creation of thousands of threads that each execute the same code. Threads are grouped into 32-element vectors called warps to improve efficiency. The threads in each warp execute in a SIMT (single instruction, multiple thread) fashion, all fetching from a single Program Counter (PC) in the absence of control flow. Many warps are then assigned to execute concurrently on a single GPU core, or streaming multiprocessor (SM) in NVIDIA's terminology. A GPU consists of multiple such SM building blocks along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers  \n\n", "text": "GPU programming models allow the creation of thousands of threads that each execute the same code. Threads are grouped into 32-element vectors called warps to improve efficiency. The threads in each warp execute in a SIMT (single instruction, multiple thread) fashion, all fetching from a single Program Counter (PC) in the absence of control flow. Many warps are then assigned to execute concurrently on a single GPU core, or streaming multiprocessor (SM) in NVIDIA's terminology. A GPU consists of multiple such SM building blocks along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers\n", "alignment": "left", "unique_id": "664fef7dfef353fce43f0b6d2c59a09e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU programming models allow the creation of thousands of threads that each execute the same code. Threads are grouped into 32-element vectors called warps to improve efficiency. The threads in each warp execute in a SIMT (single instruction, multiple thread) fashion, all fetching from a single Program Counter (PC) in the absence of control flow. Many warps are then assigned to execute concurrently on a single GPU core, or streaming multiprocessor (SM) in NVIDIA's terminology. A GPU consists of multiple such SM building blocks along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers"}], "lineHeight": 0}}, "target": {"markdown": "GPU 编程模型允许创建数千个线程，每个线程执行相同的代码。线程被分组为 32 元素的向量，称为 warp（线程束），以提高效率。每个 warp 中的线程以 SIMT（单指令多线程）方式执行，在不存在控制流的情况下，所有线程都从同一个程序计数器（PC）取指。然后，许多 warp 被分配到单个 GPU 核心（在 NVIDIA 的术语中称为 SM，流多处理器）上并发执行。GPU 由多个这样的 SM 构建模块以及一个存储层次结构组成，包括 SM 本地便笺存储器和 L1 缓存、一个共享的 L2 缓存以及多个存储控制器。不同的 GPU 部署了不同数量的", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "3339c08b1da16c5c22836f454adc0d10", "index": 25, "aliyun_index": 8, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![3339c08b1da16c5c22836f454adc0d10.jpg](figures/3339c08b1da16c5c22836f454adc0d10_4752f3f0.jpeg)  \n\n", "text": "- **输入文件**：`Application.cu`\n- **编译器**：`nvcc` → 生成 PTX 中间代码\n- **汇编器**：`ptxas` → 将 PTX 转换为 SASS（黑色高亮块，表示关键输出）\n- **链接器**：`nvlink` → 进行 Ahead-of-time instrumentation（提前插桩）\n- **驱动层**：`Display driver` → 接收插桩后代码\n- **执行单元**：`GPU` → 最终运行环境（含 SASS 模块，黑色高亮）\n\n> 注：从 `ptxas` 到 `Display driver` 存在一条虚线箭头，标注为 “Just-in-time instrumentation”，表示可选的即时插桩路径。\n\n---\n\n## 2. Instrumentation Handler 编译路径（Handler.cu）\n\n\n- **输入文件**：`Handler.cu`\n- **编译器**：`nvcc` → 生成 PTX\n- **汇编器**：`ptxas` → 生成 SASS\n- **优化提示框**（绿色虚线框）：\n  > Use `--maxrregs=16` to cap register usage of instrumentation handler  \n  （用于限制 instrumentation handler 的寄存器使用量，避免资源冲突）\n- **连接方式**：通过“Just-in-time instrumentation”虚线箭头连接至 `Display driver`，表明该 handler 可在运行时动态注入\n\n---\n\n## 3. 关键说明与交互关系\n\n### 插桩机制对比\n\n| 类型                  | 触发时机             | 路径                     | 目标         |\n|-----------------------|----------------------|--------------------------|--------------|\n| Ahead-of-time         | 编译期               | nvlink → Display driver  | 静态嵌入     |\n| Just-in-time          | 运行期 / 加载期      | ptxas (handler) → Display driver | 动态注入     |\n\n### 数据流总结\n\n- 主应用 (`Application.cu`) 经过完整编译链（nvcc → ptxas → nvlink），最终由 display driver 提交给 GPU。\n- Handler (`Handler.cu`) 独立编译，其 SASS 输出可通过 JIT 方式注入到 display driver，实现运行时监控或调试功能。\n- 两者共享同一 GPU 执行环境，但 handler 需控制寄存器占用（`--maxrregs=16`）以避免干扰主程序。\n\n### 图形元素含义\n\n- **黑色方块（SASS）**：代表生成的机器码阶段，是硬件直接执行的指令集。\n- **虚线箭头**：表示非强制、可选或延迟执行的路径（如 JIT instrumentation）。\n- **绿色虚线框**：提供配置建议或优化参数，不影响主流程但影响性能/兼容性。\n\n---\n\n## 4. 总体架构图（简化版）\n\n\n\nApplication.cu ─nvcc──► PTX ─ptxas──► SASS ─nvlink──► [Ahead-of-time] ──► Display driver ──► GPU\n                                                                 ↑\nHandler.cu ──nvcc──► PTX ──ptxas──► SASS ───────────────────────┘ [Just-in-time]\n                                      │\n                                      └─► [Use --maxrregs=16 to cap register usage]\n```\n\n---\n\n✅ 此 Markdown 文档完整还原了原始图中的所有组件、流向、注释和视觉强调信息，适用于技术文档、报告或教学材料。可根据需要进一步转换为 Mermaid 图表或 PDF 排版。", "alignment": "left", "unique_id": "3339c08b1da16c5c22836f454adc0d10", "edited": false, "extra": {}}, "target": {"markdown": "![3339c08b1da16c5c22836f454adc0d10.jpg](figures/3339c08b1da16c5c22836f454adc0d10_4752f3f0.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "34be8350e754bc4009300e386d5b20cb", "index": 26, "aliyun_index": 9, "page_num": 1, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 1: SASSI's instrumentation flow.  \n\n", "text": "Figure 1: SASSI's instrumentation flow.\n", "alignment": "left", "unique_id": "34be8350e754bc4009300e386d5b20cb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1: SASSI's instrumentation flow."}], "lineHeight": 0}}, "target": {"markdown": ">图 1：SASSI 的插桩流程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "3a56a0878138154956c9b9b62433da5c", "index": 27, "aliyun_index": 10, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "of SMs. Further details of GPU application execution, core,\nand memory architecture are explained in the case studies of\nSections 5–8.  \n\n", "text": "of SMs. Further details of GPU application execution, core,\nand memory architecture are explained in the case studies of\nSections 5–8.\n", "alignment": "left", "unique_id": "3a56a0878138154956c9b9b62433da5c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of SMs. Further details of GPU application execution, core,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and memory architecture are explained in the case studies of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sections 5–8."}], "lineHeight": -82}}, "target": {"markdown": "SM。具体数量因 GPU 而异。有关 GPU 应用程序执行、核心及存储器架构的更多细节，将在第 5–8 节的案例研究中进行说明。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "9a41bae4088cdeed0f0c7a827004c822", "index": 28, "aliyun_index": 11, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2.2. GPU Software Stack\n", "text": "2.2. GPU Software Stack\n", "alignment": "left", "unique_id": "9a41bae4088cdeed0f0c7a827004c822", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.2. GPU Software Stack"}], "lineHeight": 0}}, "target": {"markdown": "## 2.2. GPU 软件栈\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "0bd5be6d1004b1b66095e9ab7aa71085", "index": 29, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Historically, NVIDIA has referred to units of code that run on the GPU as *shaders*. There are several broad categories of shaders, including DirectX shaders, OpenGL shaders, and compute shaders (e.g., CUDA kernels). A *front-end* compiler can be used to simplify the task of writing a shader. For example, for compute shaders, a user can write parallel programs using high-level programming languages such as CUDA [32] or OpenCL [39], and use a front-end compiler, such as NVIDIA's NVVM, to generate intermediate code in a virtual ISA called parallel thread execution (PTX).  \n\n", "text": "Historically, NVIDIA has referred to units of code that run on the GPU as *shaders*. There are several broad categories of shaders, including DirectX shaders, OpenGL shaders, and compute shaders (e.g., CUDA kernels). A *front-end* compiler can be used to simplify the task of writing a shader. For example, for compute shaders, a user can write parallel programs using high-level programming languages such as CUDA [32] or OpenCL [39], and use a front-end compiler, such as NVIDIA's NVVM, to generate intermediate code in a virtual ISA called parallel thread execution (PTX).\n", "alignment": "left", "unique_id": "0bd5be6d1004b1b66095e9ab7aa71085", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Historically, NVIDIA has referred to units of code that run on the GPU as *shaders*. There are several broad categories of shaders, including DirectX shaders, OpenGL shaders, and compute shaders (e.g., CUDA kernels). A *front-end* compiler can be used to simplify the task of writing a shader. For example, for compute shaders, a user can write parallel programs using high-level programming languages such as CUDA [32] or OpenCL [39], and use a front-end compiler, such as NVIDIA's NVVM, to generate intermediate code in a virtual ISA called parallel thread execution (PTX)."}], "lineHeight": 0}}, "target": {"markdown": "传统上，NVIDIA 将运行在 GPU 上的代码单元称为 *shader*（着色器）。Shader 有几个大类，包括 DirectX shader、OpenGL shader 和 compute shader（例如 CUDA 内核）。可以使用 *前端* 编译器来简化编写 shader 的任务。例如，对于 compute shader，用户可以使用 CUDA [32] 或 OpenCL [39] 等高级编程语言编写并行程序，并使用前端编译器（如 NVIDIA 的 NVVM）生成一种称为并行线程执行（PTX）的虚拟 ISA 中的中间代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "797e491a45b350de9caf3751abf961fb", "index": 30, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A *backend compiler optimizes and translates PTX instructions into machine code that can run on the device. For compute shaders, the backend compiler can be invoked in two ways: (1) NVIDIA supports ahead-of-time compilation of compute kernels via a PTX assembler (ptxas), and (2) a JIT-time compiler in the *display driver* can compile a PTX representation of the kernel if it is available in the binary.  \n\n", "text": "PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A *backend compiler optimizes and translates PTX instructions into machine code that can run on the device. For compute shaders, the backend compiler can be invoked in two ways: (1) NVIDIA supports ahead-of-time compilation of compute kernels via a PTX assembler (ptxas), and (2) a JIT-time compiler in the *display driver* can compile a PTX representation of the kernel if it is available in the binary.\n", "alignment": "left", "unique_id": "797e491a45b350de9caf3751abf961fb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A *backend compiler optimizes and translates PTX instructions into machine code that can run on the device. For compute shaders, the backend compiler can be invoked in two ways: (1) NVIDIA supports ahead-of-time compilation of compute kernels via a PTX assembler (ptxas), and (2) a JIT-time compiler in the *display driver* can compile a PTX representation of the kernel if it is available in the binary."}], "lineHeight": 0}}, "target": {"markdown": "PTX 通过为通用并行编程提供稳定的编程模型和指令集，将 GPU 暴露为数据并行计算设备，但 PTX 并不能直接在 GPU 上运行。*后端* 编译器对 PTX 指令进行优化，并将其翻译为可在设备上运行的机器代码。对于 compute shader，后端编译器可以通过两种方式调用：（1）NVIDIA 支持通过 PTX 汇编器（ptxas）对计算内核进行提前编译；（2）*显示驱动程序* 中的 JIT（即时编译）编译器可以在内核的 PTX 表示可用时对其进行编译。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "53f1cf453a75eb98400d1a0e1dc3cb9f", "index": 31, "aliyun_index": 14, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Compute shaders adhere to a well-defined Application Binary Interface or ABI, which defines different properties of the interface between a caller and a callee. Examples include what registers are caller-saved vs. callee-saved, what registers are used to pass parameters, and how many can be passed in registers before resorting to passing parameters on the stack. In particular, this paper focuses on the ABI between on-device (GPU) callers and callees.  \n\n", "text": "Compute shaders adhere to a well-defined Application Binary Interface or ABI, which defines different properties of the interface between a caller and a callee. Examples include what registers are caller-saved vs. callee-saved, what registers are used to pass parameters, and how many can be passed in registers before resorting to passing parameters on the stack. In particular, this paper focuses on the ABI between on-device (GPU) callers and callees.\n", "alignment": "left", "unique_id": "53f1cf453a75eb98400d1a0e1dc3cb9f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Compute shaders adhere to a well-defined Application Binary Interface or ABI, which defines different properties of the interface between a caller and a callee. Examples include what registers are caller-saved vs. callee-saved, what registers are used to pass parameters, and how many can be passed in registers before resorting to passing parameters on the stack. In particular, this paper focuses on the ABI between on-device (GPU) callers and callees."}], "lineHeight": 0}}, "target": {"markdown": "计算着色器遵循明确定义的应用二进制接口（ABI），该接口定义了调用方与被调用方之间接口的不同属性。例如，哪些寄存器是调用方保存的，哪些是被调用方保存的，哪些寄存器用于传递参数，以及在不得不通过栈传递参数之前可以用寄存器传递多少个参数。具体而言，本文重点关注设备上（GPU）调用方与被调用方之间的 ABI。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "16f51ff35fe98ab6c328c20c90974823", "index": 32, "aliyun_index": 15, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 3. SASSI\n", "text": "3. SASSI\n", "alignment": "left", "unique_id": "16f51ff35fe98ab6c328c20c90974823", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3. SASSI"}], "lineHeight": 0}}, "target": {"markdown": "## 3. SASSI\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "10e94a35f3b98a20f55fc7bd0ce7e996", "index": 33, "aliyun_index": 16, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This section describes SASSI, our backend compiler-based\ninstrumentation tool. SASSI stands for SASS Instrumentor,\nwhere SASS is NVIDIA's name for its native ISA. We explain where SASSI sits in the compiler flow, describe SASSI\ninjection and instrumentation code, and discuss how the instrumentation interoperates with host (CPU) code.  \n\n", "text": "This section describes SASSI, our backend compiler-based\ninstrumentation tool. SASSI stands for SASS Instrumentor,\nwhere SASS is NVIDIA's name for its native ISA. We explain where SASSI sits in the compiler flow, describe SASSI\ninjection and instrumentation code, and discuss how the instrumentation interoperates with host (CPU) code.\n", "alignment": "left", "unique_id": "10e94a35f3b98a20f55fc7bd0ce7e996", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section describes SASSI, our backend compiler-based"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instrumentation tool. SASSI stands for SASS Instrumentor,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "where SASS is NVIDIA's name for its native ISA. We explain where SASSI sits in the compiler flow, describe SASSI"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "injection and instrumentation code, and discuss how the instrumentation interoperates with host (CPU) code."}], "lineHeight": -174}}, "target": {"markdown": "本节介绍 SASSI——我们基于后端编译器的插桩工具。SASSI 代表 SASS Instrumentor（SASS 插桩器），其中 SASS 是 NVIDIA 对其原生 ISA 的命名。我们将解释 SASSI 在编译器流程中的位置，描述 SASSI 注入与插桩代码，并讨论插桩如何与宿主（CPU）代码进行互操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "025006971e4432729174454f55e72a73", "index": 34, "aliyun_index": 0, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![025006971e4432729174454f55e72a73.jpeg](figures/025006971e4432729174454f55e72a73_b892e9a6.png)  \n\n", "text": "> **Note**: Basic blocks are labeled 1 through 9 on the left margin. Branch targets (`@PO`, `@IPO`) indicate conditional or indirect control flow.\n\n---\n\n## (b) C++ Class: `SASSIBeforeParams`\n\nThis class represents parameters passed to the `sassi_before_handler` function. An instance of this class is referred to as `bp`.\n\n\n> **Note**: All member functions are marked `__device__`, indicating they are intended for execution on GPU device code.\n\n---\n\n## (c) C++ Class: `SASSIMemoryParams`\n\nThis class encapsulates memory-related parameters for an instruction. An instance of this class is referred to as `mp`.\n\n\ncpp\nclass SASSIMemoryParams {\npublic:\n    const int64_t address;\n    const int32_t properties;\n    const int32_t width;\n    const int32_t domain;\n\n    __device__ int64_t GetAddress() const;\n    __device__ bool IsLoad() const;\n    __device__ bool IsStore() const;\n    __device__ bool IsAtomic() const;\n    __device__ bool IsUniform() const;\n    __device__ bool IsVolatile() const;\n    __device__ int32_t GetWidth() const;\n    __device__ SASSIMemoryDomain GetDomain() const;\n};\n```\n\n> **Note**: The type `SASSIMemoryDomain` is referenced but not defined in the provided snippet — it is assumed to be an enum or class defined elsewhere in the system.\n\n---\n\n## Summary of Relationships\n\n- The instrumented code **(a)** calls `JCAL sassi_before_handler`, which likely receives a pointer to an instance of `SASSIBeforeParams` (**b**) as its argument (`bp`).\n- Within that handler, if the instruction involves memory operations, an instance of `SASSIMemoryParams` (**c**) may be constructed or accessed via `mp` to query memory-specific attributes.\n- Both classes use `__device__` qualifiers, implying they are part of a CUDA-based instrumentation framework running on NVIDIA GPUs.\n\n---\n\n✅ This document faithfully reproduces all visible content from the image in structured Markdown format, preserving code syntax, comments, annotations, and logical grouping.\n\n---", "alignment": "left", "unique_id": "025006971e4432729174454f55e72a73", "edited": false, "extra": {}}, "target": {"markdown": "![025006971e4432729174454f55e72a73.jpeg](figures/025006971e4432729174454f55e72a73_b892e9a6.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "1dbf532b814aadbadfb7668d75c08c1d", "index": 35, "aliyun_index": 1, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 2: SASSI instrumentation. (a) The instruction at ❽ is the original store instruction. The other instructions are the code that SASSI has inserted to construct an ABI-compliant function call. The sequence does the following:❶ Stack allocates two objects, bp and mp, instances of SASSIBeforeParams and SASSIMemoryParams. The class definitions of SASSIBeforeParams and SASSIMemoryParams are shown in (b) and (c), respectively.❷ Saves live registers R0, R10, and R11 to the bp.GPRSpill array, and saves the live predicate registers to bp.PRSpill.❸Initializes member variables of bp, including instrWillExecute (which is true iff the instruction will execute), fnAddress and insOffset (which can be used to compute the instruction's PC), and insEncoding (which includes the instruction's opcode and other static properties).❹Passes a generic 64-bit pointer to bp as an argument to sassi_before_handler in registers R4 and R5 per NVIDIA's compute ABI.❺Initializes member variables of mp, including address (which contains the memory operation's effective address), width (which is the width of the data in bytes), properties (which contains static properties of the operation, e.g., whether it reads memory, writes memory, is atomic, etc.).❻Passes a generic 64-bit pointer to mp in R6 and R7 per NVIDIA's compute ABI.❼Performs the call to sassi_before_handler.❽Restores live registers, and reclaims the allocated stack space.❻Executes the original store instruction.  \n\n", "text": "Figure 2: SASSI instrumentation. (a) The instruction at ❽ is the original store instruction. The other instructions are the code that SASSI has inserted to construct an ABI-compliant function call. The sequence does the following:❶ Stack allocates two objects, bp and mp, instances of SASSIBeforeParams and SASSIMemoryParams. The class definitions of SASSIBeforeParams and SASSIMemoryParams are shown in (b) and (c), respectively.❷ Saves live registers R0, R10, and R11 to the bp.GPRSpill array, and saves the live predicate registers to bp.PRSpill.❸Initializes member variables of bp, including instrWillExecute (which is true iff the instruction will execute), fnAddress and insOffset (which can be used to compute the instruction's PC), and insEncoding (which includes the instruction's opcode and other static properties).❹Passes a generic 64-bit pointer to bp as an argument to sassi_before_handler in registers R4 and R5 per NVIDIA's compute ABI.❺Initializes member variables of mp, including address (which contains the memory operation's effective address), width (which is the width of the data in bytes), properties (which contains static properties of the operation, e.g., whether it reads memory, writes memory, is atomic, etc.).❻Passes a generic 64-bit pointer to mp in R6 and R7 per NVIDIA's compute ABI.❼Performs the call to sassi_before_handler.❽Restores live registers, and reclaims the allocated stack space.❻Executes the original store instruction.\n", "alignment": "left", "unique_id": "1dbf532b814aadbadfb7668d75c08c1d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2: SASSI instrumentation. (a) The instruction at ❽ is the original store instruction. The other instructions are the code that SASSI has inserted to construct an ABI-compliant function call. The sequence does the following:❶ Stack allocates two objects, bp and mp, instances of SASSIBeforeParams and SASSIMemoryParams. The class definitions of SASSIBeforeParams and SASSIMemoryParams are shown in (b) and (c), respectively.❷ Saves live registers R0, R10, and R11 to the bp.GPRSpill array, and saves the live predicate registers to bp.PRSpill.❸Initializes member variables of bp, including instrWillExecute (which is true iff the instruction will execute), fnAddress and insOffset (which can be used to compute the instruction's PC), and insEncoding (which includes the instruction's opcode and other static properties).❹Passes a generic 64-bit pointer to bp as an argument to sassi_before_handler in registers R4 and R5 per NVIDIA's compute ABI.❺Initializes member variables of mp, including address (which contains the memory operation's effective address), width (which is the width of the data in bytes), properties (which contains static properties of the operation, e.g., whether it reads memory, writes memory, is atomic, etc.).❻Passes a generic 64-bit pointer to mp in R6 and R7 per NVIDIA's compute ABI.❼Performs the call to sassi_before_handler.❽Restores live registers, and reclaims the allocated stack space.❻Executes the original store instruction."}], "lineHeight": 0}}, "target": {"markdown": ">图 2：SASSI 插桩。(a) ❽ 处的指令是原始的存储指令。其余指令是 SASSI 插入的用于构造符合 ABI 的函数调用的代码。该指令序列执行以下操作：❶ 在栈上分配两个对象，bp 和 mp，它们分别是 SASSIBeforeParams 和 SASSIMemoryParams 的实例。SASSIBeforeParams 和 SASSIMemoryParams 的类定义分别如 (b) 和 (c) 所示。❷ 将活跃寄存器 R0、R10 和 R11 保存到 bp.GPRSpill 数组，并将活跃谓词寄存器保存到 bp.PRSpill。❸ 初始化 bp 的成员变量，包括 instrWillExecute（仅当指令将要执行时为真）、fnAddress 和 insOffset（可用于计算指令的 PC）以及 insEncoding（包含指令的操作码及其他静态属性）。❹ 根据 NVIDIA 的 compute ABI，将一个通用的 64 位指针传递给 bp 作为参数，分别放在 R4 和 R5 寄存器中。❺ 初始化 mp 的成员变量，包括 address（包含内存操作的有效地址）、width（以字节为单位的数据宽度）、properties（包含操作的静态属性，例如是否读内存、写内存、是否为原子操作等）。❻ 根据 NVIDIA 的 compute ABI，将一个通用的 64 位指针传递给 mp，分别放在 R6 和 R7 寄存器中。❼ 执行对 sassi_before_handler 的调用。❽ 恢复活跃寄存器，并回收已分配的栈空间。❻ 执行原始的存储指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "1c6a31922a96b9b62d517e5437394877", "index": 36, "aliyun_index": 2, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## 3.1. SASSI Tool Flow\n", "text": "3.1. SASSI Tool Flow\n", "alignment": "left", "unique_id": "1c6a31922a96b9b62d517e5437394877", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.1. SASSI Tool Flow"}], "lineHeight": 0}}, "target": {"markdown": "## 3.1. SASSI 工具流程\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "5d49de713d445f7c67a9980cadb84291", "index": 37, "aliyun_index": 3, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Figure 1 shows the compiler tool flow that includes the SASSI instrumentation process. Shaders are first compiled to an intermediate representation by a front-end compiler. Before they can run on the GPU, however, the backend compiler must read the intermediate representation and generate SASS. For compute shaders, the backend compiler is in two places: in the PTX assembler ptxas, and in the driver.  \n\n", "text": "Figure 1 shows the compiler tool flow that includes the SASSI instrumentation process. Shaders are first compiled to an intermediate representation by a front-end compiler. Before they can run on the GPU, however, the backend compiler must read the intermediate representation and generate SASS. For compute shaders, the backend compiler is in two places: in the PTX assembler ptxas, and in the driver.\n", "alignment": "left", "unique_id": "5d49de713d445f7c67a9980cadb84291", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1 shows the compiler tool flow that includes the SASSI instrumentation process. Shaders are first compiled to an intermediate representation by a front-end compiler. Before they can run on the GPU, however, the backend compiler must read the intermediate representation and generate SASS. For compute shaders, the backend compiler is in two places: in the PTX assembler ptxas, and in the driver."}], "lineHeight": 0}}, "target": {"markdown": "图 1 显示了包含 SASSI 插桩过程的编译器工具流程。Shader 首先由前端编译器编译为中间表示。然而，在它们能够运行于 GPU 之前，后端编译器必须读取该中间表示并生成 SASS。对于 compute shader，后端编译器出现在两个位置：PTX 汇编器 ptxas 中，以及驱动程序中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "1ed14dd2765a5ecf9bc37afe6f582e0f", "index": 38, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "SASSI is implemented as the final compiler pass in ptxas,\nand as such it does not disrupt the perceived final instruction\nschedule or register usage. Furthermore as part of ptxas,\nSASSI is capable of instrumenting programs written in lan-\nguages that target PTX, which includes CUDA and OpenCL.\nApart from the injected instrumentation code, the original\nSASS code ordering remains unaffected. With the SASSI pro-\ntotype we use nvlink to link the instrumented applications\nwith user-level instrumentation handlers. SASSI could also be\nembedded in the driver to JIT compile PTX inputs, as shown\nby dotted lines in Figure 1.  \n\n", "text": "SASSI is implemented as the final compiler pass in ptxas,\nand as such it does not disrupt the perceived final instruction\nschedule or register usage. Furthermore as part of ptxas,\nSASSI is capable of instrumenting programs written in lan-\nguages that target PTX, which includes CUDA and OpenCL.\nApart from the injected instrumentation code, the original\nSASS code ordering remains unaffected. With the SASSI pro-\ntotype we use nvlink to link the instrumented applications\nwith user-level instrumentation handlers. SASSI could also be\nembedded in the driver to JIT compile PTX inputs, as shown\nby dotted lines in Figure 1.\n", "alignment": "left", "unique_id": "1ed14dd2765a5ecf9bc37afe6f582e0f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASSI is implemented as the final compiler pass in ptxas,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and as such it does not disrupt the perceived final instruction"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "schedule or register usage. Furthermore as part of ptxas,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASSI is capable of instrumenting programs written in lan-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "guages that target PTX, which includes CUDA and OpenCL."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Apart from the injected instrumentation code, the original"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASS code ordering remains unaffected. With the SASSI pro-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "totype we use nvlink to link the instrumented applications"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "with user-level instrumentation handlers. SASSI could also be"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "embedded in the driver to JIT compile PTX inputs, as shown"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "by dotted lines in Figure 1."}], "lineHeight": -317}}, "target": {"markdown": "SASSI 被实现为 ptxas 中的最终编译器遍（pass），因此它不会打乱所感知的最终指令调度或寄存器使用。此外，作为 ptxas 的一部分，SASSI 能够对以 PTX 为目标语言（包括 CUDA 和 OpenCL）编写的程序进行插桩。除了注入的插桩代码之外，原始 SASS 代码的顺序保持不变。在 SASSI 原型中，我们使用 nvlink 将插桩后的应用程序与用户级插桩处理函数进行链接。SASSI 也可以嵌入到驱动程序中，以便对 PTX 输入进行 JIT 编译，如图 1 中的虚线所示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "6756778e19fa080b1a67ac20b2e2b38b", "index": 39, "aliyun_index": 5, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "SASSI must be instructed where to insert instrumentation,\nand what instrumentation to insert. Currently SASSI supports  \n\n", "text": "SASSI must be instructed where to insert instrumentation,\nand what instrumentation to insert. Currently SASSI supports\n", "alignment": "left", "unique_id": "6756778e19fa080b1a67ac20b2e2b38b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASSI must be instructed where to insert instrumentation,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and what instrumentation to insert. Currently SASSI supports"}], "lineHeight": -59}}, "target": {"markdown": "SASSI 必须被指示在哪里插入插桩代码，以及插入什么样的插桩代码。目前 SASSI 支持", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "3b6665ad9f7ffa90139d936fba1741ba", "index": 40, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "inserting instrumentation before any and all SASS instructions. Certain classes of instructions can be targeted for instrumentation: control transfer instructions, memory operations, call instructions, instructions that read registers, and instructions that write registers. SASSI also supports inserting instrumentation after all instructions other than branches and jumps. Though not used in any of the examples in this paper, SASSI supports instrumenting basic block headers as well as kernel entries and exits. As a practical consideration, the where and the what to instrument are specified via ptxas command-line arguments.  \n\n", "text": "inserting instrumentation before any and all SASS instructions. Certain classes of instructions can be targeted for instrumentation: control transfer instructions, memory operations, call instructions, instructions that read registers, and instructions that write registers. SASSI also supports inserting instrumentation after all instructions other than branches and jumps. Though not used in any of the examples in this paper, SASSI supports instrumenting basic block headers as well as kernel entries and exits. As a practical consideration, the where and the what to instrument are specified via ptxas command-line arguments.\n", "alignment": "left", "unique_id": "3b6665ad9f7ffa90139d936fba1741ba", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "inserting instrumentation before any and all SASS instructions. Certain classes of instructions can be targeted for instrumentation: control transfer instructions, memory operations, call instructions, instructions that read registers, and instructions that write registers. SASSI also supports inserting instrumentation after all instructions other than branches and jumps. Though not used in any of the examples in this paper, SASSI supports instrumenting basic block headers as well as kernel entries and exits. As a practical consideration, the where and the what to instrument are specified via ptxas command-line arguments."}], "lineHeight": 0}}, "target": {"markdown": "在所有 SASS 指令之前插入插桩。可以针对特定类别的指令进行插桩：控制转移指令、内存操作指令、调用指令、读取寄存器的指令以及写入寄存器的指令。SASSI 还支持在除分支和跳转之外的所有指令之后插入插桩。尽管本文的示例中并未使用，SASSI 还支持对基本块头部以及内核入口和出口进行插桩。作为一个实际考量，插桩的位置和内容通过 ptxas 的命令行参数来指定。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "447ac3ea7ec949858e7988bd3cc8bdbe", "index": 41, "aliyun_index": 7, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## 3.2. SASSI Instrumentation\n", "text": "3.2. SASSI Instrumentation\n", "alignment": "left", "unique_id": "447ac3ea7ec949858e7988bd3cc8bdbe", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.2. SASSI Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 3.2. SASSI 插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "acba93fcf5add7180961b6e4549ca6ce", "index": 42, "aliyun_index": 8, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "For each instrumentation site, SASSI will insert a CUDA\nABI-compliant function call to a user-defined instrumentation\nhandler. However, SASSI must be told *what* information\nto pass to the instrumentation handler(s). We can currently\nextract and pass to an instrumentation handler, the following\ninformation for each site: memory addresses touched, registers\nwritten and read (including their values), conditional branch\ninformation, and register liveness information.  \n\n", "text": "For each instrumentation site, SASSI will insert a CUDA\nABI-compliant function call to a user-defined instrumentation\nhandler. However, SASSI must be told *what* information\nto pass to the instrumentation handler(s). We can currently\nextract and pass to an instrumentation handler, the following\ninformation for each site: memory addresses touched, registers\nwritten and read (including their values), conditional branch\ninformation, and register liveness information.\n", "alignment": "left", "unique_id": "acba93fcf5add7180961b6e4549ca6ce", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For each instrumentation site, SASSI will insert a CUDA"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ABI-compliant function call to a user-defined instrumentation"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "handler. However, SASSI must be told *what* information"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to pass to the instrumentation handler(s). We can currently"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "extract and pass to an instrumentation handler, the following"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "information for each site: memory addresses touched, registers"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "written and read (including their values), conditional branch"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "information, and register liveness information."}], "lineHeight": -236}}, "target": {"markdown": "对于每个插桩点，SASSI 会插入一个符合 CUDA ABI 的函数调用，以调用用户定义的插桩处理函数。然而，必须告知 SASSI 应将哪些信息传递给插桩处理函数。目前，我们可以为每个插桩点提取并向插桩处理函数传递以下信息：所访问的内存地址、被读写寄存器（包括其值）、条件分支信息以及寄存器的活跃性信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "197ebf5dbd0fea0e9a4cd09b26e9cbbd", "index": 43, "aliyun_index": 0, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "```c\nc\n/// [memory, extended memory, controlxfer, sync, ...\n/// numeric, texture, total executed]\n__device__ unsigned long long dynamic_instr_counts[7];\n\n/// SASSI can be instructed to insert calls to this handler\n/// before every SASS instruction.\n__device__ void sassBefore_handler(SASSIBeforeParams *bp,\n                                    SASSIMemoryParams *mp) {\n    if (bp->IsMem()) {\n        atomicAdd(dynamic_instr_counts + 0, 1LL);\n        if (mp->GetWidth() > 4 /*bytes*/) {\n            atomicAdd(dynamic_instr_counts + 1, 1LL);\n        }\n        if (bp->IsControlXfer()) atomicAdd(dynamic_instr_counts + 2, 1LL);\n        if (bp->IsSync()) atomicAdd(dynamic_instr_counts + 3, 1LL);\n        if (bp->IsNumeric()) atomicAdd(dynamic_instr_counts + 4, 1LL);\n        if (bp->IsTexture()) atomicAdd(dynamic_instr_counts + 5, 1LL);\n        atomicAdd(dynamic_instr_counts + 6, 1LL);\n    }\n}\n```\n", "text": "c\n/// [memory, extended memory, controlxfer, sync, ...\n/// numeric, texture, total executed]\n__device__ unsigned long long dynamic_instr_counts[7];\n\n/// SASSI can be instructed to insert calls to this handler\n/// before every SASS instruction.\n__device__ void sassBefore_handler(SASSIBeforeParams *bp,\n                                    SASSIMemoryParams *mp) {\n    if (bp->IsMem()) {\n        atomicAdd(dynamic_instr_counts + 0, 1LL);\n        if (mp->GetWidth() > 4 /*bytes*/) {\n            atomicAdd(dynamic_instr_counts + 1, 1LL);\n        }\n        if (bp->IsControlXfer()) atomicAdd(dynamic_instr_counts + 2, 1LL);\n        if (bp->IsSync()) atomicAdd(dynamic_instr_counts + 3, 1LL);\n        if (bp->IsNumeric()) atomicAdd(dynamic_instr_counts + 4, 1LL);\n        if (bp->IsTexture()) atomicAdd(dynamic_instr_counts + 5, 1LL);\n        atomicAdd(dynamic_instr_counts + 6, 1LL);\n    }\n}\n", "alignment": "left", "unique_id": "197ebf5dbd0fea0e9a4cd09b26e9cbbd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "c"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "/// [memory, extended memory, controlxfer, sync, ..."}, {"style": { , "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2(a) shows the result of one memory operation being instrumented by SASSI. The instruction at (9) is the original memory instruction, and all prior instructions are SASSI-inserted instrumentation code. In this example, the user has directed SASSI to insert instrumentation before all memory operations (the *where*), and for each instrumentation site to extract memory-specific details (such as the address touched) about the memory operation (the *what*). SASSI creates a sequence of instructions that is an ABI-compliant call to a user-defined instrumentation handler. The caption of Figure 2 provides a detailed explanation of the sequence. SASSI creates extra space on a thread's stack in this example to store parameters that will be passed to the instrumentation handler."}], "lineHeight": 0}}, "target": {"markdown": "图 2(a) 显示了 SASSI 对一条内存操作进行插桩后的结果。(9) 处的指令是原始的内存指令，其之前的所有指令都是 SASSI 插入的插桩代码。在此示例中，用户指示 SASSI 在所有内存操作之前插入插桩（即*位置*），并为每个插桩点提取关于该内存操作的内存相关细节（例如所访问的地址）（即*内容*）。SASSI 生成一段符合 ABI 的指令序列，用于调用用户定义的插桩处理函数。图 2 的说明文字对该序列进行了详细解释。在此示例中，SASSI 在线程的栈上分配额外空间，用于存储将传递给插桩处理函数的参数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "3643748f28546e80f12702275bc27820", "index": 46, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "While generating an ABI-compliant function call incurs more instruction overhead than directly in-lining the instrumentation code, maintaining the ABI has two main benefits. First, the user is able to write handlers in straight CUDA code. They do not need to understand SASS, PTX, or even details of the target architecture. Second, our approach is portable; the same handler can be used for Fermi, Kepler, and Maxwell devices, which are significantly different architectures.  \n\n", "text": "While generating an ABI-compliant function call incurs more instruction overhead than directly in-lining the instrumentation code, maintaining the ABI has two main benefits. First, the user is able to write handlers in straight CUDA code. They do not need to understand SASS, PTX, or even details of the target architecture. Second, our approach is portable; the same handler can be used for Fermi, Kepler, and Maxwell devices, which are significantly different architectures.\n", "alignment": "left", "unique_id": "3643748f28546e80f12702275bc27820", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While generating an ABI-compliant function call incurs more instruction overhead than directly in-lining the instrumentation code, maintaining the ABI has two main benefits. First, the user is able to write handlers in straight CUDA code. They do not need to understand SASS, PTX, or even details of the target architecture. Second, our approach is portable; the same handler can be used for Fermi, Kepler, and Maxwell devices, which are significantly different architectures."}], "lineHeight": 0}}, "target": {"markdown": "尽管生成一个符合 ABI 的函数调用所产生的指令开销要高于直接将插桩代码内联，但保持 ABI 具有两大主要优点。首先，用户能够使用直接的 CUDA 代码编写处理函数，无需理解 SASS、PTX，甚至无需了解目标架构的细节。其次，我们的方法具有可移植性；同一个处理函数可以用于 Fermi、Kepler 和 Maxwell 设备，而这些设备之间在架构上存在显著差异。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "9222fbc217d80de26faba6dd4db8ce4c", "index": 47, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Figure 3 shows a pedagogical instrumentation handler, sassi_before_handler, from the setup shown in Figure 2. The handler takes two parameters, pointers to instances of SASSIBeforeParams (bp) and SASSIMemoryParams (mp), respectively, and uses them to categorize instructions into six overlapping categories. Note that a single SASS instruction can simultaneously belong to more than one of these categories. As Figure 2(b) shows, the C++ object of class SASSIBeforeParams contains methods that allow a handler to query for basic properties of the instruction, including the instruction's address, whether it uses texture memory, and whether it alters control flow. This example uses several of bp's methods to categorize the instruction, and it uses CUDA's atomicAdd function to record instances of each category. Additionally, the handler uses the mp object to determine the width in bytes of a memory operation's data. We can easily  \n\n", "text": "Figure 3 shows a pedagogical instrumentation handler, sassi_before_handler, from the setup shown in Figure 2. The handler takes two parameters, pointers to instances of SASSIBeforeParams (bp) and SASSIMemoryParams (mp), respectively, and uses them to categorize instructions into six overlapping categories. Note that a single SASS instruction can simultaneously belong to more than one of these categories. As Figure 2(b) shows, the C++ object of class SASSIBeforeParams contains methods that allow a handler to query for basic properties of the instruction, including the instruction's address, whether it uses texture memory, and whether it alters control flow. This example uses several of bp's methods to categorize the instruction, and it uses CUDA's atomicAdd function to record instances of each category. Additionally, the handler uses the mp object to determine the width in bytes of a memory operation's data. We can easily\n", "alignment": "left", "unique_id": "9222fbc217d80de26faba6dd4db8ce4c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3 shows a pedagogical instrumentation handler, sassi_before_handler, from the setup shown in Figure 2. The handler takes two parameters, pointers to instances of SASSIBeforeParams (bp) and SASSIMemoryParams (mp), respectively, and uses them to categorize instructions into six overlapping categories. Note that a single SASS instruction can simultaneously belong to more than one of these categories. As Figure 2(b) shows, the C++ object of class SASSIBeforeParams contains methods that allow a handler to query for basic properties of the instruction, including the instruction's address, whether it uses texture memory, and whether it alters control flow. This example uses several of bp's methods to categorize the instruction, and it uses CUDA's atomicAdd function to record instances of each category. Additionally, the handler uses the mp object to determine the width in bytes of a memory operation's data. We can easily"}], "lineHeight": 0}}, "target": {"markdown": "图 3 显示了一个教学性质的插桩处理函数 sassi_before_handler，源自图 2 所示的设置。该处理函数接受两个参数，分别是 `SASSIBeforeParams`（bp）和 `SASSIMemoryParams`（mp）实例的指针，并利用它们将指令归入六个相互重叠的类别。需要注意的是，单条 SASS 指令可以同时属于多个类别。如图 2(b) 所示，`SASSIBeforeParams` 类的 C++ 对象提供了一些方法，允许处理函数查询指令的基本属性，包括指令的地址、是否使用纹理内存，以及是否改变控制流。此示例使用了 bp 的若干方法来对指令进行分类，并借助 CUDA 的 `atomicAdd` 函数来记录每个类别的实例次数。此外，该处理函数还使用 mp 对象来确定内存操作数据的字节宽度。我们可以方便地", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "68836d4145e08ee1589e258c4f4e0bf9", "index": 48, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "instruct SASSI to inject calls to this function before all SASS\ninstructions, the mechanics of which we describe later.  \n\n", "text": "instruct SASSI to inject calls to this function before all SASS\ninstructions, the mechanics of which we describe later.\n", "alignment": "left", "unique_id": "68836d4145e08ee1589e258c4f4e0bf9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instruct SASSI to inject calls to this function before all SASS"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions, the mechanics of which we describe later."}], "lineHeight": -58}}, "target": {"markdown": "指示 SASSI 在所有 SASS 指令之前插入对该函数的调用，其具体机制将在后文描述。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "b47be1a8441f8c79ed60abace00ef091", "index": 49, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "One challenging aspect of GPU instrumentation is the sheer number of registers that may have to be spilled and filled in the worst case to create an ABI-compliant function call. Even though the compiler knows exactly which registers to spill, there are many instrumentation sites in typical GPU programs that require spilling 32 or more registers per thread if done naively. NVIDIA's Kepler and Maxwell architectures require spilling ~128 registers per thread in the worst case. Compounding this problem, threads are executed in SIMT fashion; thus all the threads try to spill their live state to memory at the same time, creating serious bandwidth bottlenecks. To alleviate this issue, we impose a simple constraint on SASSI instrumentation handlers; handlers must use at most 16 registers, the minimum number of registers required per-thread by the CUDA ABI. This limit can trivially be enforced by using the well-known -maxregcount flag of nvcc to cap the maximum number of registers used when compiling the instrumentation handler.  \n\n", "text": "One challenging aspect of GPU instrumentation is the sheer number of registers that may have to be spilled and filled in the worst case to create an ABI-compliant function call. Even though the compiler knows exactly which registers to spill, there are many instrumentation sites in typical GPU programs that require spilling 32 or more registers per thread if done naively. NVIDIA's Kepler and Maxwell architectures require spilling ~128 registers per thread in the worst case. Compounding this problem, threads are executed in SIMT fashion; thus all the threads try to spill their live state to memory at the same time, creating serious bandwidth bottlenecks. To alleviate this issue, we impose a simple constraint on SASSI instrumentation handlers; handlers must use at most 16 registers, the minimum number of registers required per-thread by the CUDA ABI. This limit can trivially be enforced by using the well-known -maxregcount flag of nvcc to cap the maximum number of registers used when compiling the instrumentation handler.\n", "alignment": "left", "unique_id": "b47be1a8441f8c79ed60abace00ef091", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One challenging aspect of GPU instrumentation is the sheer number of registers that may have to be spilled and filled in the worst case to create an ABI-compliant function call. Even though the compiler knows exactly which registers to spill, there are many instrumentation sites in typical GPU programs that require spilling 32 or more registers per thread if done naively. NVIDIA's Kepler and Maxwell architectures require spilling ~128 registers per thread in the worst case. Compounding this problem, threads are executed in SIMT fashion; thus all the threads try to spill their live state to memory at the same time, creating serious bandwidth bottlenecks. To alleviate this issue, we impose a simple constraint on SASSI instrumentation handlers; handlers must use at most 16 registers, the minimum number of registers required per-thread by the CUDA ABI. This limit can trivially be enforced by using the well-known -maxregcount flag of nvcc to cap the maximum number of registers used when compiling the instrumentation handler."}], "lineHeight": 0}}, "target": {"markdown": "GPU 插桩的一个难点在于在最坏情况下为了生成符合 ABI 的函数调用，可能不得不溢出和重填大量的寄存器。尽管编译器清楚地知道应当溢出哪些寄存器，但在典型的 GPU 程序中，存在大量插桩点，若采用直接内联的方式，每个线程可能需要溢出 32 个甚至更多的寄存器。NVIDIA 的 Kepler 和 Maxwell 架构在最坏情况下每个线程需要溢出约 128 个寄存器。更棘手的是，线程以 SIMT 方式执行，因此所有线程会同时尝试将其活跃状态溢出到内存，从而造成严重的带宽瓶颈。为了缓解这一问题，我们对 SASSI 插桩处理函数施加了一个简单的限制：处理函数最多只能使用 16 个寄存器，这是 CUDA ABI 对每个线程所要求的最低寄存器数量。此限制可以通过使用 nvcc 中众所周知的 `-maxregcount` 标志来轻松强制执行，以在编译插桩处理函数时限制其最大寄存器使用数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "754a3927fa1605983e5155037e85b24e", "index": 50, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "It is important to note that SASSI does not change the original SASS instructions in any way during instrumentation. Furthermore, the register limit of 16 that we impose on the instrumentation handler may increase the runtime overhead of instrumentation, but it will not reduce an instrumentation handler's functional utility. With handlers for which the compiler does not find an allocation that uses 16 or fewer registers, the compiler will simply insert register spill code.  \n\n", "text": "It is important to note that SASSI does not change the original SASS instructions in any way during instrumentation. Furthermore, the register limit of 16 that we impose on the instrumentation handler may increase the runtime overhead of instrumentation, but it will not reduce an instrumentation handler's functional utility. With handlers for which the compiler does not find an allocation that uses 16 or fewer registers, the compiler will simply insert register spill code.\n", "alignment": "left", "unique_id": "754a3927fa1605983e5155037e85b24e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "It is important to note that SASSI does not change the original SASS instructions in any way during instrumentation. Furthermore, the register limit of 16 that we impose on the instrumentation handler may increase the runtime overhead of instrumentation, but it will not reduce an instrumentation handler's functional utility. With handlers for which the compiler does not find an allocation that uses 16 or fewer registers, the compiler will simply insert register spill code."}], "lineHeight": 0}}, "target": {"markdown": "需要特别指出的是，SASSI 在插桩过程中不会以任何方式修改原始的 SASS 指令。此外，我们对插桩处理函数施加的 16 个寄存器的限制可能会增加插桩的运行时开销，但不会削弱插桩处理函数的功能效用。对于编译器无法找到使用 16 个或更少寄存器的分配方案的处理函数，编译器将直接插入寄存器溢出代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "8d4180698a121e0f7023fd2efd30facd", "index": 51, "aliyun_index": 8, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "## 3.3. Initialization and Finalization\n", "text": "3.3. Initialization and Finalization\n", "alignment": "left", "unique_id": "8d4180698a121e0f7023fd2efd30facd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.3. Initialization and Finalization"}], "lineHeight": 0}}, "target": {"markdown": "## 3.3. 初始化与结束处理\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "a3c10541cbf1c3b761577e64388c77dc", "index": 52, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Unlike CPU instrumentation, GPU instrumentation must coordinate with the host machine (CPU) to both initialize instrumentation counters, and to gather their values (and perhaps log them to a file). For CUDA, SASSI leverages the CUPTI library, which allows host-side code to register for callbacks when certain important CUDA events occur, such as kernel launches and exits [33]. In all of the case studies in this paper, we use CUPTI to initialize counters on kernel launch and copy counters off the device on kernel exits. On kernel launch, our CUPTI \"kernel launch\" callback function uses cudaMemcpy to initialize the on-device counters appropriately. On kernel exits, our CUPTI \"kernel exit\" callback function uses cudaMemcpy to collect (and possibly aggregate) the counters on the host side. Furthermore, cudaMemcpy serializes kernel invocations, preventing race conditions that might occur on the counters. This approach is excessive for the cases where we do not need per-kernel statistics. If instead we only wanted to measure whole-program statistics, we could simply initialize counters after the CUDA runtime is initialized, and copy counters off the device before the program exits (taking care to register callbacks for CUDA calls that reset device memory, which would clear the device-side counters). The appropriate initialization and finalization mechanisms can be chosen by the user depending on the specific use case.  \n\n", "text": "Unlike CPU instrumentation, GPU instrumentation must coordinate with the host machine (CPU) to both initialize instrumentation counters, and to gather their values (and perhaps log them to a file). For CUDA, SASSI leverages the CUPTI library, which allows host-side code to register for callbacks when certain important CUDA events occur, such as kernel launches and exits [33]. In all of the case stu
