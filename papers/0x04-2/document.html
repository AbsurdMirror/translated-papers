s for Rodinia. For each benchmark we show the dynamic and static percentage of register bit assignments that are constant and scalar. The static metrics weigh each instruction equally, while the dynamic metrics use instruction frequency to approximate the true dynamic statistics.\n", "alignment": "left", "unique_id": "ca6028e21c59e2f8437c73be61e353f9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our instrumentation library generates a coarse summary of the scalar and bit invariance properties of the instrumented program. Table 2 summarizes the results for Parboil and Rodinia. We use the largest input data set available for Parboil, and the default inputs for Rodinia. For each benchmark we show the dynamic and static percentage of register bit assignments that are constant and scalar. The static metrics weigh each instruction equally, while the dynamic metrics use instruction frequency to approximate the true dynamic statistics."}], "lineHeight": 0}}, "target": {"markdown": "我们的插桩库会对被插桩程序的标量属性与位不变性生成一个粗粒度的汇总。表 2 总结了 Parboil 和 Rodinia 的实验结果。其中，Parboil 使用可用的最大输入数据集，Rodinia 则使用默认输入。对于每个基准测试，我们展示了寄存器位赋值中常量与标量所占的动态与静态百分比。其中，静态指标对每条指令赋予相同的权重，而动态指标则利用指令执行频率来近似真实的动态统计信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "b5a48d4f206ce2ea9dfd535092d880e5", "index": 117, "aliyun_index": 1, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "These results show that for these suites of benchmarks, the architecture is making poor use of the register file. Most benchmarks have a significant percentage of dynamic scalar operations, ranging up to 76% for b+tree. In addition, for these profile runs, most of the operands in these benchmarks require only a fraction of the 32-bit register allotted to them. With a remarkably concise amount of code, SASSI exposes interesting insights that can drive architecture studies that aim to improve register file efficiency.  \n\n", "text": "These results show that for these suites of benchmarks, the architecture is making poor use of the register file. Most benchmarks have a significant percentage of dynamic scalar operations, ranging up to 76% for b+tree. In addition, for these profile runs, most of the operands in these benchmarks require only a fraction of the 32-bit register allotted to them. With a remarkably concise amount of code, SASSI exposes interesting insights that can drive architecture studies that aim to improve register file efficiency.\n", "alignment": "left", "unique_id": "b5a48d4f206ce2ea9dfd535092d880e5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "These results show that for these suites of benchmarks, the architecture is making poor use of the register file. Most benchmarks have a significant percentage of dynamic scalar operations, ranging up to 76% for b+tree. In addition, for these profile runs, most of the operands in these benchmarks require only a fraction of the 32-bit register allotted to them. With a remarkably concise amount of code, SASSI exposes interesting insights that can drive architecture studies that aim to improve register file efficiency."}], "lineHeight": 0}}, "target": {"markdown": "这些结果表明，对于这一系列基准测试，该架构对寄存器文件的利用率较低。大多数基准测试都存在较高比例的动态标量操作，其中 b+tree 最高，达到 76%。此外，在这些剖析运行中，这些基准测试中的大多数操作数仅需要为其分配的 32 位寄存器中的一小部分。凭借相当简洁的代码，SASSI 便能揭示出富有启发性的洞察，从而推动旨在提高寄存器文件效率的架构研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "b28fe25a4ff481b5c30df2fb6ab561d9", "index": 118, "aliyun_index": 2, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "## 8. Case Study IV: Error Injection\n", "text": "8. Case Study IV: Error Injection\n", "alignment": "left", "unique_id": "b28fe25a4ff481b5c30df2fb6ab561d9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8. Case Study IV: Error Injection"}], "lineHeight": 0}}, "target": {"markdown": "## 8. 案例研究 IV：错误注入\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "8a202b46fcf54d3feb09fc8cd7351d8c", "index": 119, "aliyun_index": 3, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "This section demonstrates how SASSI can be employed to evaluate and analyze GPU application sensitivity to transient hardware errors, by injecting errors into the architecture state of a running GPU. To the best of our knowledge, the only prior research that examines GPU error vulnerability used CUDA-GDB [14, 31]. That work also performed instruction-level statistical error injection to study application vulnerability, but lacked the ability to modify predicate registers and condition codes. Furthermore, because breaking after every instruction using CUDA-GDB and transferring control to the host system is prohibitively expensive, that work required a complex and heuristic-based profiling step to select error injection sites.  \n\n", "text": "This section demonstrates how SASSI can be employed to evaluate and analyze GPU application sensitivity to transient hardware errors, by injecting errors into the architecture state of a running GPU. To the best of our knowledge, the only prior research that examines GPU error vulnerability used CUDA-GDB [14, 31]. That work also performed instruction-level statistical error injection to study application vulnerability, but lacked the ability to modify predicate registers and condition codes. Furthermore, because breaking after every instruction using CUDA-GDB and transferring control to the host system is prohibitively expensive, that work required a complex and heuristic-based profiling step to select error injection sites.\n", "alignment": "left", "unique_id": "8a202b46fcf54d3feb09fc8cd7351d8c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section demonstrates how SASSI can be employed to evaluate and analyze GPU application sensitivity to transient hardware errors, by injecting errors into the architecture state of a running GPU. To the best of our knowledge, the only prior research that examines GPU error vulnerability used CUDA-GDB [14, 31]. That work also performed instruction-level statistical error injection to study application vulnerability, but lacked the ability to modify predicate registers and condition codes. Furthermore, because breaking after every instruction using CUDA-GDB and transferring control to the host system is prohibitively expensive, that work required a complex and heuristic-based profiling step to select error injection sites."}], "lineHeight": 0}}, "target": {"markdown": "本节展示了如何利用 SASSI 通过向运行中的 GPU 架构状态注入错误，来评估和分析 GPU 应用对瞬态硬件错误的敏感性。据我们所知，此前唯一一项研究 GPU 错误脆弱性的工作使用了 CUDA-GDB [14, 31]。该工作同样执行了指令级统计错误注入以研究应用的脆弱性，但缺乏修改谓词寄存器和条件码的能力。此外，由于使用 CUDA-GDB 在每条指令后中断并将控制权转移回主机的开销过于高昂，该工作不得不借助一种复杂且基于启发式方法的剖析步骤来选择错误注入位置。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "689148e2a86278998fe68899b7a20831", "index": 120, "aliyun_index": 4, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "A SASSI-based error injection approach overcomes these two challenges as it can modify any ISA visible state, including predicate registers and condition codes. Further, the instrumented code executes on the GPU, which makes the profiling step much faster and more accurate. Performing error injections using SASSI requires three main steps: (1) profiling and identifying the error injection space; (2) statistically selecting error injection sites; and (3) injecting errors into executing applications and monitoring error behavior. Steps (1) and (3) occur on different executions using two different SASSI instrumentation handlers.  \n\n", "text": "A SASSI-based error injection approach overcomes these two challenges as it can modify any ISA visible state, including predicate registers and condition codes. Further, the instrumented code executes on the GPU, which makes the profiling step much faster and more accurate. Performing error injections using SASSI requires three main steps: (1) profiling and identifying the error injection space; (2) statistically selecting error injection sites; and (3) injecting errors into executing applications and monitoring error behavior. Steps (1) and (3) occur on different executions using two different SASSI instrumentation handlers.\n", "alignment": "left", "unique_id": "689148e2a86278998fe68899b7a20831", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A SASSI-based error injection approach overcomes these two challenges as it can modify any ISA visible state, including predicate registers and condition codes. Further, the instrumented code executes on the GPU, which makes the profiling step much faster and more accurate. Performing error injections using SASSI requires three main steps: (1) profiling and identifying the error injection space; (2) statistically selecting error injection sites; and (3) injecting errors into executing applications and monitoring error behavior. Steps (1) and (3) occur on different executions using two different SASSI instrumentation handlers."}], "lineHeight": 0}}, "target": {"markdown": "基于 SASSI 的错误注入方法能够克服上述两个挑战，因为该方法可以修改 ISA 所呈现的任何可见状态，包括谓词寄存器和条件码。此外，被插桩的代码运行在 GPU 上，这使得剖析步骤更加快速且精确。使用 SASSI 执行错误注入需要三个主要步骤：（1）对错误注入空间进行剖析与识别；（2）统计性地选取错误注入位置；（3）在应用执行过程中注入错误并监控错误行为。步骤（1）和（3）在不同的执行过程中进行，分别使用两种不同的 SASSI 插桩处理器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "eecfbcaa31545f38255bca20daca153d", "index": 121, "aliyun_index": 5, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "In this study, we define an architecture-level error as a single-bit flip in one of the destination registers of an executing instruction. If the destination register is a general purpose register (32-bit value) or a condition code (4-bit value), one bit is randomly selected for flipping. For predicate registers, we only flip a destination predicate bit that is being written by the instruction.  \n\n", "text": "In this study, we define an architecture-level error as a single-bit flip in one of the destination registers of an executing instruction. If the destination register is a general purpose register (32-bit value) or a condition code (4-bit value), one bit is randomly selected for flipping. For predicate registers, we only flip a destination predicate bit that is being written by the instruction.\n", "alignment": "left", "unique_id": "eecfbcaa31545f38255bca20daca153d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this study, we define an architecture-level error as a single-bit flip in one of the destination registers of an executing instruction. If the destination register is a general purpose register (32-bit value) or a condition code (4-bit value), one bit is randomly selected for flipping. For predicate registers, we only flip a destination predicate bit that is being written by the instruction."}], "lineHeight": 0}}, "target": {"markdown": "在本研究中，我们将架构级错误定义为正在执行的指令某个目标寄存器中发生的一位翻转。若目标寄存器是通用寄存器（32 位）或条件码（4 位），则随机选取其中一位进行翻转。对于谓词寄存器，我们只翻转指令正在写入的目标谓词位。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "dbce87a514354ba15288b890b7f21385", "index": 122, "aliyun_index": 6, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "## 8.1. SASSI Instrumentation\n", "text": "8.1. SASSI Instrumentation\n", "alignment": "left", "unique_id": "dbce87a514354ba15288b890b7f21385", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8.1. SASSI Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 8.1. SASSI 插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "4aab5813503d5d7f117d557a68d69895", "index": 123, "aliyun_index": 7, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "**Instrumentation where and what:** For the profiling step, we instrument after all instructions that either access memory or  \n\n", "text": "**Instrumentation where and what:** For the profiling step, we instrument after all instructions that either access memory or\n", "alignment": "left", "unique_id": "4aab5813503d5d7f117d557a68d69895", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Instrumentation where and what:** For the profiling step, we instrument after all instructions that either access memory or"}], "lineHeight": 0}}, "target": {"markdown": "**插桩位置与内容：** For the profiling step, we instrument after all instructions that either access memory or", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "ce105cb946a33875d98d5b695a5a6780", "index": 124, "aliyun_index": 8, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "write to a register and exclude instructions that are predicated out. We collect and pass the register and memory information for each instrumented instruction to the handler, which records the state modifications so that an off-line tool can stochastically select the error injection site. For error injections, we instrument the same set of instructions and use the handler to inject the error into the location selected by the stochastic process.  \n\n", "text": "write to a register and exclude instructions that are predicated out. We collect and pass the register and memory information for each instrumented instruction to the handler, which records the state modifications so that an off-line tool can stochastically select the error injection site. For error injections, we instrument the same set of instructions and use the handler to inject the error into the location selected by the stochastic process.\n", "alignment": "left", "unique_id": "ce105cb946a33875d98d5b695a5a6780", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "write to a register and exclude instructions that are predicated out. We collect and pass the register and memory information for each instrumented instruction to the handler, which records the state modifications so that an off-line tool can stochastically select the error injection site. For error injections, we instrument the same set of instructions and use the handler to inject the error into the location selected by the stochastic process."}], "lineHeight": 0}}, "target": {"markdown": "写入寄存器的指令之后进行插桩，并排除被谓词排除（predicated out）的指令。我们收集每条被插桩指令的寄存器与内存相关信息并传递给处理器，处理器记录状态修改，以便后续的离线工具能够随机选取错误注入位置。在错误注入阶段，我们对相同的指令集进行插桩，并利用处理器将错误注入到由随机过程所选定的位置。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "5588f9568f949edfe26e56bfcba5dd73", "index": 125, "aliyun_index": 9, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Instrumentation handler: In the profiling step, we collect the following information to identify the error injection space: (1) static kernel names, (2) the number of times each kernel executes, (3) the number of threads per kernel invocation, and (4) the number of dynamic instructions per thread that are not predicated out and either write to a register or a memory location. We use CUPTI to collect (1) and (2) and instrument the instructions using SASSI to collect (3) and (4).  \n\n", "text": "Instrumentation handler: In the profiling step, we collect the following information to identify the error injection space: (1) static kernel names, (2) the number of times each kernel executes, (3) the number of threads per kernel invocation, and (4) the number of dynamic instructions per thread that are not predicated out and either write to a register or a memory location. We use CUPTI to collect (1) and (2) and instrument the instructions using SASSI to collect (3) and (4).\n", "alignment": "left", "unique_id": "5588f9568f949edfe26e56bfcba5dd73", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Instrumentation handler: In the profiling step, we collect the following information to identify the error injection space: (1) static kernel names, (2) the number of times each kernel executes, (3) the number of threads per kernel invocation, and (4) the number of dynamic instructions per thread that are not predicated out and either write to a register or a memory location. We use CUPTI to collect (1) and (2) and instrument the instructions using SASSI to collect (3) and (4)."}], "lineHeight": 0}}, "target": {"markdown": "插桩处理器：在剖析阶段，我们收集以下信息以确定错误注入空间：（1）静态内核名称；（2）每个内核的执行次数；（3）每次内核调用中的线程数量；（4）每个线程中未被谓词排除、且会写入寄存器或存储位置的动态指令数量。我们使用 CUPTI 收集（1）和（2），并利用 SASSI 对指令进行插桩以收集（3）和（4）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "877f1a9fc7b3151897f227173b9b8d5d", "index": 126, "aliyun_index": 10, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Using this information we randomly select 1,000 error injection sites per application, which is a tuple consisting of the static kernel name, dynamic kernel invocation ID, thread ID, dynamic instruction count, seed to select a destination register, and seed to select the bit for injection. This step is performed on the host CPU.  \n\n", "text": "Using this information we randomly select 1,000 error injection sites per application, which is a tuple consisting of the static kernel name, dynamic kernel invocation ID, thread ID, dynamic instruction count, seed to select a destination register, and seed to select the bit for injection. This step is performed on the host CPU.\n", "alignment": "left", "unique_id": "877f1a9fc7b3151897f227173b9b8d5d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Using this information we randomly select 1,000 error injection sites per application, which is a tuple consisting of the static kernel name, dynamic kernel invocation ID, thread ID, dynamic instruction count, seed to select a destination register, and seed to select the bit for injection. This step is performed on the host CPU."}], "lineHeight": 0}}, "target": {"markdown": "利用这些信息，我们为每个应用随机选取 1,000 个错误注入位置，每个位置是一个由静态内核名称、动态内核调用 ID、线程 ID、动态指令计数、用于选择目标寄存器的种子以及用于选择注入位的种子所组成的元组。此步骤在主机 CPU 上执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "f82d7d5cfdd7f26d1424627ed754338a", "index": 127, "aliyun_index": 11, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "In the last and the most important step, we inject one error per application run and monitor for crashes, hangs, and output corruption. In each injection run, we check if the selected kernel and its dynamic invocation count has been reached using CUPTI. If so, we copy the remaining error site tuple into the device memory. During kernel execution, we check if the current thread is the selected thread for injection in the instrumentation handler. For the selected thread, we maintain a counter and check if the dynamic instruction that just executed is the selected instruction for injection. If it is the selected instruction, we inject the error into the bit and the register specified by the seeds in the tuple.  \n\n", "text": "In the last and the most important step, we inject one error per application run and monitor for crashes, hangs, and output corruption. In each injection run, we check if the selected kernel and its dynamic invocation count has been reached using CUPTI. If so, we copy the remaining error site tuple into the device memory. During kernel execution, we check if the current thread is the selected thread for injection in the instrumentation handler. For the selected thread, we maintain a counter and check if the dynamic instruction that just executed is the selected instruction for injection. If it is the selected instruction, we inject the error into the bit and the register specified by the seeds in the tuple.\n", "alignment": "left", "unique_id": "f82d7d5cfdd7f26d1424627ed754338a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the last and the most important step, we inject one error per application run and monitor for crashes, hangs, and output corruption. In each injection run, we check if the selected kernel and its dynamic invocation count has been reached using CUPTI. If so, we copy the remaining error site tuple into the device memory. During kernel execution, we check if the current thread is the selected thread for injection in the instrumentation handler. For the selected thread, we maintain a counter and check if the dynamic instruction that just executed is the selected instruction for injection. If it is the selected instruction, we inject the error into the bit and the register specified by the seeds in the tuple."}], "lineHeight": 0}}, "target": {"markdown": "在最后也是最关键的一步中，我们在每次应用运行中注入一个错误，并监控崩溃、死锁以及输出损坏情况。在每一次注入运行中，我们使用 CUPTI 检查所选内核及其动态调用次数是否已经达到。若已达到，则将剩余的错误位置元组复制到设备内存中。在内核执行过程中，我们在插桩处理器中检查当前线程是否就是所选的注入线程。对于所选线程，我们维护一个计数器，并检查刚刚执行的动态指令是否为所选的注入指令。如果正是所选指令，则按照元组中种子所指定的位和寄存器注入错误。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "b3b50423d140072a62c6bd952a7761a9", "index": 128, "aliyun_index": 12, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "After the handler injects the error the application continues unhindered (unless our experimental framework detects a crash or a hang). We categorize the injection outcome based on the exit status of the application, hang detection, error messages thrown during execution, and output differences from that of an error-free reference run.  \n\n", "text": "After the handler injects the error the application continues unhindered (unless our experimental framework detects a crash or a hang). We categorize the injection outcome based on the exit status of the application, hang detection, error messages thrown during execution, and output differences from that of an error-free reference run.\n", "alignment": "left", "unique_id": "b3b50423d140072a62c6bd952a7761a9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "After the handler injects the error the application continues unhindered (unless our experimental framework detects a crash or a hang). We categorize the injection outcome based on the exit status of the application, hang detection, error messages thrown during execution, and output differences from that of an error-free reference run."}], "lineHeight": 0}}, "target": {"markdown": "在处理器完成错误注入后，应用将继续不受阻碍地运行（除非我们的实验框架检测到崩溃或死锁）。我们根据应用的退出状态、死锁检测结果、执行过程中抛出的错误消息以及与无错误参考运行之间的输出差异来对注入结果进行分类。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "a03561b392359f76ec50b0f1f39cd83f", "index": 129, "aliyun_index": 13, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "## 8.2. Results\n", "text": "8.2. Results\n", "alignment": "left", "u ome application output (stdout or stderr or a program defined output file). We categorize such cases as potential silent data corrupt-\n", "alignment": "left", "unique_id": "a537e8d0b2ced70542b69469902217d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 10 shows how different applications respond to architecture-level errors. As mentioned earlier, we performed 1,000 error injection runs per application. This figure shows that approximately 79% of injected errors on average (using our error model) did not have any impact on the program output. Only 10% resulted in crashes or hangs. Approximately 4% of injections showed symptoms of failures (unsuccessful kernel execution or explicit error messages in stdout/stderr), which can be categorized as potential crashes with appropriate error monitors. The remaining injections corrupt some application output (stdout or stderr or a program defined output file). We categorize such cases as potential silent data corrupt-"}], "lineHeight": 0}}, "target": {"markdown": "图 10 展示了不同应用对架构级错误的响应情况。如前所述，我们对每个应用执行了 1,000 次错误注入运行。该图显示，在我们所采用的错误模型下，平均约有 79% 的注入错误对程序输出没有任何影响。仅 10% 会导致崩溃或死锁。约有 4% 的注入表现出故障症状（内核执行失败或在 stdout/stderr 中出现显式错误消息），可借助适当的错误监控归类为潜在的崩溃。其余的注入则会破坏某些应用输出（stdout、stderr 或程序定义的输出文件）。我们将这些情况归类为潜在的静默数据损坏", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "e3a1e70c6e16a4b68643b86fdc99cb29", "index": 131, "aliyun_index": 0, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![e3a1e70c6e16a4b68643b86fdc99cb29.jpeg](figures/e3a1e70c6e16a4b68643b86fdc99cb29_7f35cdda.png)  \n\n", "text": "[程序名]: [Masked]% | [Crashes]% | [Hangs]% | [Failure symptoms]% | [Stdout only different]% | [Output file differe ifferent         | Potential Silent Data Corruptions     |\n| 红色                 | Output file different         | Potential Silent Data Corruptions     |\n\n---\n\n✅ 此 Markdown 文档已完整还原原始图表结构、数据分布及图例含义，可用于报告、分析或进一步可视化处理。所有数值均为视觉估算，实际精确值需参考原始数据源。\n\n--- \n\n如需导出为 CSV、JSON 或生成对应代码绘图脚本（如 Python Matplotlib / Seaborn），请告知，我可继续为您转换。", "alignment": "left", "unique_id": "e3a1e70c6e16a4b68643b86fdc99cb29", "edited": false, "extra": {}}, "target": {"markdown": "![e3a1e70c6e16a4b68643b86fdc99cb29.jpeg](figures/e3a1e70c6e16a4b68643b86fdc99cb29_7f35cdda.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "31e1232223cb8ecf871337aa9e5fcb25", "index": 132, "aliyun_index": 1, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 10: Error injection outcomes of different applications.\nEach bar shows the results from 1,000 error injection runs.  \n\n", "text": "Figure 10: Error injection outcomes of different applications.\nEach bar shows the results from 1,000 error injection runs.\n", "alignment": "left", "unique_id": "31e1232223cb8ecf871337aa9e5fcb25", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 10: Error injection outcomes of different applications."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Each bar shows the results from 1,000 error injection runs."}], "lineHeight": -53}}, "target": {"markdown": ">图 10：不同应用的错误注入结果。每个柱状条展示了 1,000 次错误注入运行的结果。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [] chitecture vulnerability of GPUs. We further expect that SASSI will be a valuable tool in exploring hardware and software error mitigation schemes.  \n\n", "text": "SASSI provides the ability to explore the architecture vulnerability of GPUs. We further expect that SASSI will be a valuable tool in exploring hardware and software error mitigation schemes.\n", "alignment": "left", "unique_id": "1ef78dd870eaf1460dce643aca5cc0e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASSI provides the ability to explore the architecture vulnerability of GPUs. We further expect that SASSI will be a valuable tool in exploring hardware and software error mitigation schemes."}], "lineHeight": 0}}, "target": {"markdown": "SASSI 提供了探索 GPU 架构脆弱性的能力。我们进一步期望，SASSI 将成为探索硬件与软件错误缓解方案的重要工具。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "08d674465ea2cd1a4aa37b09364a92ce", "index": 135, "aliyun_index": 4, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## 9. Discussion\n", "text": "9. Discussion\n", "alignment": "left", "unique_id": "08d674465ea2cd1a4aa37b09364a92ce", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9. Discussion"}], "lineHeight": 0}}, "target": {"markdown": "## 9. 讨论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "90a0e554d569bb709b23fbd5aeaf6186", "index": 136, "aliyun_index": 5, "page_num": 9, "type": "text", "sub_type": "non overhead of SASSI instrumentation depends on where we insert instrumentation and what instrumentation we insert. Table 3 shows the overheads of instrumentation for each of the case studies. For each benchmark, the three columns under the \"Baseline\" heading show the wall clock runtime $t$ (in seconds), the total time spent executing kernels $k$ (in milliseconds), and the total number of kernel launches. The benchmarks in the table are sorted by the fraction of total runtime spent in the GPU kernel, from smallest to largest.  \n\n", "text": "The overhead of SASSI instrumentation depends on where we insert instrumentation and what instrumentation we insert. Table 3 shows the overheads of instrumentation for each of the case studies. For each benchmark, the three columns under the \"Baseline\" heading show the wall clock runtime $t$ (in seconds), the total time spent executing kernels $k$ (in milliseconds), and the total number of kernel launches. The benchmarks in the table are sorted by the fraction of total runtime spent in the GPU kernel, from smallest to largest.\n", "alignment": "left", "unique_id": "872e23445f866ef5c1eec83e989ba0e3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The overhead of SASSI instrumentation depends on where we insert instrumentation and what instrumentation we insert. Table 3 shows the overheads of instrumentation for each of the case studies. For each benchmark, the three columns under the \"Baseline\" heading show the wall clock runtime $t$ (in seconds), the total time spent executing kernels $k$ (in milliseconds), and the total number of kernel launches. The benchmarks in the table are sorted by the fraction of total runtime spent in the GPU kernel, from smallest to largest."}], "lineHeight": 0}}, "target": {"markdown": "SASSI 插桩的开销取决于我们在何处插入插桩以及插入何种插桩。表 3 展示了每个案例研究的插桩开销。对于每个基准，\"Baseline（基线）\"标题下的三列分别显示了挂钟时间运行时间 $t$（以秒为单位）、执行内核所花费的总时间 $k$（以毫秒为单位）以及内核启动的总次数。表中的基准按花费在 GPU 内核上的总运行时间比例从小到大排序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "3fbb64f7fb1f9d45c837d7b8d1bd8e1a", "index": 139, "aliyun_index": 8, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We use nvprof [35] to collect device-side statistics and the Linux time command to measure whole-program runtimes. All results were collected on a 3GHz Intel® Xeon® E5-2690 v2 with an NVIDIA Tesla K40m and driver version 346.41. We use the median of five runs for each experiment, compile benchmarks at the “-O3” optimization level, and invoke the applications with the largest supplied input data set.  \n\n", "text": "We use nvprof [35] to collect device-side statistics and the Linux time command to measure whole-program runtimes. All results were collected on a 3GHz Intel® Xeon® E5-2690 v2 with an NVIDIA Tesla K40m and driver version 346.41. We use the median of five runs for each experiment, compile benchmarks at the “-O3” optimization level, and invoke the applications with the largest supplied input data set.\n", "alignment": "left", "unique_id": "3fbb64f7fb1f9d45c837d7b8d1bd8e1a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use nvprof [35] to collect device-side statistics and the Linux time command to measure whole-program runtimes. All results were collected on a 3GHz Intel® Xeon® E5-2690 v2 with an NVIDIA Tesla K40m and driver version 346.41. We use the median of five runs for each experiment, compile benchmarks at the “-O3” optimization level, and invoke the applications with the largest supplied input data set."}], "lineHeight": 0}}, "target": {"markdown": "我们使用 nvprof [35] 来收集设备端的统计数据，并使用 Linux 的 time 命令来测量整个程序的运行时间。所有结果均在配备 NVIDIA Tesla K40m 和 346.41 版驱动程序的 3 GHz Intel® Xeon® E5-2690 v2 平台上采集。对于每次实验，我们取五次运行的中位数，基准测试以 \"-O3\" 优化级别进行编译，并使用所提供最大的输入数据集来调用应用程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "5545327573190e5e00f1f5a210533ffd", "index": 140, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "For each case study we measure the total wall-clock runtime $T$ and device-side runtime $K$ of instrumentation relative to the baselines $t$ and $k$, respectively. As the two instances where instrumentation leads to performance improvements indicate, these measurements contain some jitter.  \n\n", "text": "For each case study we measure the total wall-clock runtime $T$ and device-side runtime $K$ of instrumentation relative to the baselines $t$ and $k$, respectively. As the two instances where instrumentation leads to performance improvements indicate, these measurements contain some jitter.\n", "alignment": "left", "unique_id": "5545327573190e5e00f1f5a210533ffd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For each case study we measure the total wall-clock runtime $T$ and device-side runtime $K$ of instrumentation relative to the baselines $t$ and $k$, respectively. As the two instances where instrumentation leads to performance improvements indicate, these measurements contain some jitter."}], "lineHeight": 0}}, "target": {"markdown": "对于每个案例研究，我们测量插桩相对于基线 $t$ 和 $k$ 的总挂钟运行时间 $T$ 和设备端运行时间 $K$。正如插桩带来性能提升的两个实例所表明的那样，这些测量结果包含一定的抖动。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "ddc7944abf98a98c34ac8ba6c9dea951", "index": 141, "aliyun_index": 10, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "As expected, the fewer SASS instructions SASSI instruments, the lower the overhead of instrumentation. As Case Study I only instruments conditional branches, it sees relatively modest slowdowns. However, as Case Studies III and IV add instrumentation after every SASS instruction that writes a register, the slowdowns can be significant. The maximum slowdown we see is over $160\\times$ for whole-program execution.  \n\n", "text": "As expected, the fewer SASS instructions SASSI instruments, the lower the overhead of instrumentation. As Case Study I only instruments conditional branches, it sees relatively modest slowdowns. However, as Case Studies III and IV add instrumentation after every SASS instruction that writes a register, the slowdowns can be significant. The maximum slowdown we see is over $160\\times$ for whole-program execution.\n", "alignment": "left", "unique_id": "ddc7944abf98a98c34ac8ba6c9dea951", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As expected, the fewer SASS instructions SASSI instruments, the lower the overhead of instrumentation. As Case Study I only instruments conditional branches, it sees relatively modest slowdowns. However, as Case Studies III and IV add instrumentation after every SASS instruction that writes a register, the slowdowns can be significant. The maximum slowdown we see is over $160\\times$ for whole-program execution."}], "lineHeight": 0}}, "target": {"markdown": "正如预期，SASSI 所插桩的 SASS 指令越少，插桩的开销就越低。由于案例研究 I 仅对条件分支进行插桩，因此其减速相对较小。然而，随着案例研究 III 和 IV 在每条写入寄存器的 SASS 指令之后都添加插桩，减速可能会非常显著。我们观察到的最大减速是整个程序执行超过 $160\\times$。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "7c0cb45cdd91f3a191e1d616d7f6aecf", "index": 142, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "For applications with a considerable fraction of CPU and data transfer time, the whole-program overhead of instrumentation is typically negligible, whereas for GPU-bound applications, the overhead can be large. Even heavy instrumentation does not significantly disrupt many of these applications, simply because they are CPU-bound. Also of note, nvprof treats the marshalling of data between the device and host as kernel time, which reduces the apparent kernel-level impact of instrumentation on memory-bound applications such as mummergpu.  \n\n", "text": "For applications with a considerable fraction of CPU and data transfer time, the whole-program overhead of instrumentation is typically negligible, whereas for GPU-bound applications, the overhead can be large. Even heavy instrumentation does not significantly disrupt many of these applications, simply because they are CPU-bound. Also of note, nvprof treats the marshalling of data between the device and host as kernel time, which reduces the apparent kernel-level impact of instrumentation on memory-bound applications such as mummergpu.\n", "alignment": "left", "unique_id": "7c0cb45cdd91f3a191e1d616d7f6aecf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For applications with a considerable fraction of CPU and data transfer time, the whole-program overhead of instrumentation is typically negligible, whereas for GPU-bound applications, the overhead can be large. Even heavy instrumentation does not significantly disrupt many of these applications, simply because they are CPU-bound. Also of note, nvprof treats the marshalling of data between the device and host as kernel time, which reduces the apparent kernel-level impact of instrumentation on memory-bound applications such as mummergpu."}], "lineHeight": 0}}, "target": {"markdown": "对于 CPU 和数据传输时间占比较高的应用，插桩带来的整体程序开销通常可以忽略不计；而对于 GPU 密集型应用，开销则可能很大。即使是重度插桩，也不会对其中许多应用造成显著干扰，这仅仅是因为它们受限于 CPU。此外值得注意的是，nvprof 将设备与主机之间的数据编组（marshalling）视为内核时间，这降低了插桩对 mummergpu 等内存受限应用在核级别上所呈现的明显影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "6b99e3fc66a5b13a6ea0d8353e6b10d8", "index": 143, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We removed the body of the instrumentation handlers to measure the overhead of spilling and setting up ABI-compliant calls. Surprisingly the runtime overhead does not decrease dramatically when we stub out the code in the instrumentation handlers. For all case studies, the overhead of ABI-compliance and spilling live registers dominates, consuming roughly 80% of the total overhead.  \n\n", "text": "We removed the body of the instrumentation handlers to measure the overhead of spilling and setting up ABI-compliant calls. Surprisingly the runtime overhead does not decrease dramatically when we stub out the code in the instrumentation handlers. For all case studies, the overhead of ABI-compliance and spilling live registers dominates, consuming roughly 80% of the total overhead.\n", "alignment": "left", "unique_id": "6b99e3fc66a5b13a6ea0d8353e6b10d8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We removed the body of the instrumentation handlers to measure the overhead of spilling and setting up ABI-compliant calls. Surprisingly the runtime overhead does not decrease dramatically when we stub out the code in the instrumentation handlers. For all case studies, the overhead of ABI-compliance and spilling live registers dominates, consuming roughly 80% of the total overhead."}], "lineHeight": 0}}, "target": {"markdown": "我们移除了插桩处理函数的函数体，以测量溢出（spilling）以及建立符合 ABI 的调用所带来的开销。令人惊讶的是，即使我们对插桩处理函数中的代码进行了桩化（stub out），运行时开销并未出现显著下降。对于所有案例研究而言，遵循 ABI 以及溢出活跃寄存器的开销均占据主导地位，消耗了大约 80% 的总开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "97c8bb607b9c30b2aafce2ed6292544d", "index": 144, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Future work will consider optimizations to reduce the base-line overhead of instrumentation. One approach involves tracking which live variables are statically guaranteed to have been previously spilled but not yet overwritten, which will allow us to forgo re-spilling registers. In addition, while passing references to C++ objects is convenient for programmers, stack-allocating the objects is expensive; We may consider mechanisms to more efficiently pass parameters to the handlers.  \n\n", "text": "Future work will consider optimizations to reduce the base-line overhead of instrumentation. One approach involves tracking which live variables are statically guaranteed to have been previously spilled but not yet overwritten, which will allow us to forgo re-spilling registers. In addition, while passing references to C++ objects is convenient for programmers, stack-allocating the objects is expensive; We may consider mechanisms to more efficiently pass parameters to the handlers.\n", "alignment": "left", "unique_id": "97c8bb607b9c30b2aafce2ed6292544d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Future work will consider optimizations to reduce the base-line overhead of instrumentation. One approach involves tracking which live variables are statically guaranteed to have been previously spilled but not yet overwritten, which will allow us to forgo re-spilling registers. In addition, while passing references to C++ objects is convenient for programmers, stack-allocating the objects is expensive; We may consider mechanisms to more efficiently pass parameters to the handlers."}], "lineHeight": 0}}, "target": {"markdown": "未来工作将考虑通过优化来降低插桩的基线开销。一种方法是追踪哪些活跃变量在静态上保证已经被溢出但尚未被覆写，这将允许我们避免重复溢出寄存器。此外，虽然向处理函数传递 C++ 对象的引用对程序员来说很方便，但在栈上分配这些对象开销较大；我们可以考虑采用更高效的机制来向处理函数传递参数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "525484bd9a73b1cd6969a26330f3cbf9", "index": 145, "aliyun_index": 14, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Because SASSI-instrumented programs run at native hardware rates, it enables users to quickly refine their experiments, a feature not possible in the context of GPU simulation frameworks. Our worst kernel-level slowdown of $722\\times$ is much faster than simulators such as GPGPU-Sim, which are 1–10 million times slower than native execution.  \n\n", "text": "Because SASSI-instrumented programs run at native hardware rates, it enables users to quickly refine their experiments, a feature not possible in the context of GPU simulation frameworks. Our worst kernel-level slowdown of $722\\times$ is much faster than simulators such as GPGPU-Sim, which are 1–10 million times slower than native execution.\n", "alignment": "left", "unique_id": "525484bd9a73b1cd6969a26330f3cbf9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Because SASSI-instrumented programs run at native hardware rates, it enables users to quickly refine their experiments, a feature not possible in the context of GPU simulation frameworks. Our worst kernel-level slowdown of $722\\times$ is much faster than simulators such as GPGPU-Sim, which are 1–10 million times slower than native execution."}], "lineHeight": 0}}, "target": {"markdown": "由于 SASSI 插桩后的程序以原生硬件速率运行，用户可以快速迭代并完善其实验，这是 GPU 模拟框架所无法实现的特性。我们所观察到的最大核级别减速为 $722\\times$，仍远快于诸如 GPGPU-Sim 之类的模拟器——后者通常比原生执行慢 100 万到 1000 万倍。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "ed995ab77becaf3075781b63b2160200", "index": 146, "aliyun_index": 15, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## 9.2. Instrumentation Side-effects\n", "text": "9.2. Instrumentation Side-effects\n", "alignment": "left", "unique_id": "ed995ab77becaf3075781b63b2160200", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9.2. Instrumentation Side-effects"}], "lineHeight": 0}}, "target": {"markdown": "## 9.2. 插桩副作用\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "5b6fb9900e3d0991e7a60940afce1ec8", "index": 147, "aliyun_index": 16, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "While SASSI is intended to be minimally invasive, additional instructions, register pressure, and cache effects of SASSI instrumentation can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions. Even *without* instrumentation, `tpacf` in the Parboil suite produces inconsistent results across different architectures, particularly on the medium and large input sets. While we did not observe applications that exhibited non-deterministic behavior with the addition of SASSI, if an application is already susceptible to non-deterministic behavior, SASSI instrumentation will likely exacerbate this non-determinism.  \n\n", "text": "While SASSI is intended to be minimally invasive, additional instructions, register pressure, and cache effects of SASSI instrumentation can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions. Even *without* instrumentation, `tpacf` in the Parboil suite produces inconsistent results across different architectures, particularly on the medium and large input sets. While we did not observe applications that exhibited non-deterministic behavior with the addition of SASSI, if an application is already susceptible to non-deterministic behavior, SASSI instrumentation will likely exacerbate this non-determinism.\n", "alignment": "left", "unique_id": "5b6fb9900e3d0991e7a60940afce1ec8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While SASSI is intended to be minimally invasive, additional instructions, register pressure, and cache effects of SASSI instrumentation can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions. Even *without* instrumentation, `tpacf` in the Parboil suite produces inconsistent results across different architectures, particularly on the medium and large input sets. While we did not observe applications that exhibited non-deterministic behavior with the addition of SASSI, if an application is already susceptible to non-deterministic behavior, SASSI instrumentation will likely exacerbate this non-determinism."}], "lineHeight": 0}}, "target": {"markdown": "虽然 SASSI 的设计目标是尽可能保持最小侵入性，但 SASSI 插桩所带来的额外指令、寄存器压力以及缓存效应，可能会改变那些包含竞态条件或依赖于特定调度/时序假设的应用程序的行为。即使在*没有*插桩的情况下，Parboil 套件中的 `tpacf` 也会在不同架构上产生不一致的结果，尤其是在中等和大型输入集上。虽然我们尚未观察到任何应用程序在加入 SASSI 插桩后表现出非确定性行为，但如果某个应用程序本身已经容易出现非确定性行为，那么 SASSI 插桩很可能会加剧这种非确定性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "cc2241677406d1c750ca9790809ef233", "index": 148, "aliyun_index": 0, "page_num": 10, "type": "table_name", "sub_type": "none", "markdown": ">Table 3: Instrumentation overheads. The “Baseline” column shows the wall clock time t, and the time spent executing kernels k, for each of the benchmarks. The “T” column for each case study shows the total runtime of the instrumented application with respect to t, and the “K” column shows the device-side runtime with respect to k.  \n\n", "text": "Table 3: Instrumentation overheads. The “Baseline” column shows the wall clock time t, and the time spent executing kernels k, for each of the benchmarks. The “T” column for each case study shows the total runtime of the instrumented application with respect to t, and the “K” column shows the device-side runtime with respect to k.\n", "alignment": "left", "unique_id": "cc2241677406d1c750ca9790809ef233", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 3: Instrumentation overheads. The “Baseline” column shows the wall clock time t, and the time spent executing kernels k, for each of the benchmarks. The “T” column for each case study shows the total runtime of the instrumented application with respect to t, and the “K” column shows
