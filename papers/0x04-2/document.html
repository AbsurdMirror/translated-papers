l exits, our CUPTI \"kernel exit\" callback function uses cudaMemcpy to collect (and possibly aggregate) the counters on the host side. Furthermore, cudaMemcpy serializes kernel invocations, preventing race conditions that might occur on the counters. This approach is excessive for the cases where we do not need per-kernel statistics. If instead we only wanted to measure whole-program statistics, we could simply initialize counters after the CUDA runtime is initialized, and copy counters off the device before the program exits (taking care to register callbacks for CUDA calls that reset device memory, which would clear the device-side counters). The appropriate initialization and finalization mechanisms can be chosen by the user depending on the specific use case."}], "lineHeight": 0}}, "target": {"markdown": "与 CPU 插桩不同，GPU 插桩必须与主机（CPU）协调，以完成插桩计数器的初始化以及其值的收集（并可能将其记录到文件）。对于 CUDA，SASSI 利用了 CUPTI 库，该库允许主机端代码注册回调，以便在某些重要的 CUDA 事件（例如内核启动和退出）发生时得到通知 [33]。在本文的所有案例研究中，我们均使用 CUPTI 在内核启动时初始化计数器，并在内核退出时将计数器从设备复制回来。在内核启动时，我们的 CUPTI“内核启动”回调函数使用 `cudaMemcpy` 对设备上的计数器进行相应的初始化。在内核退出时，我们的 CUPTI“内核退出”回调函数使用 `cudaMemcpy` 在主机端收集（并可能汇总）这些计数器。此外，`cudaMemcpy` 会对内核调用进行串行化，从而避免计数器上可能出现的竞态条件。对于那些不需要按内核统计数据的场景而言，这种做法略显繁琐。如果我们仅希望测量整个程序的统计数据，则可以仅在 CUDA 运行时初始化之后初始化计数器，并在程序退出之前将计数器从设备复制回来（同时注意为那些会重置设备内存的 CUDA 调用注册回调，因为这些调用会清除设备端的计数器）。用户可以根据具体的使用场景选择合适的初始化与结束处理机制。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "07e39c96f6c9a7f38b0871dec4fefb3c", "index": 53, "aliyun_index": 0, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "## 4. Methodology\n", "text": "4. Methodology\n", "alignment": "left", "unique_id": "07e39c96f6c9a7f38b0871dec4fefb3c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4. Methodology"}], "lineHeight": 0}}, "target": {"markdown": "## 4. 方法\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "56b448871ff6acae18b646b1fec1c1a2", "index": 54, "aliyun_index": 1, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The case studies we present in this paper are meant to demonstrate how SASSI's capabilities can be used for different types of architecture experiments. Section 5 explores SASSI's ability to inspect application control flow behavior, which can be a critical performance limiter on modern GPUs. Section 6 leverages SASSI to perform a detailed memory analysis, which specifically characterizes an application's memory divergence. Section 7 shows how SASSI allows access to an instrumented application's register contents to enable value profiling.  \n\n", "text": "The case studies we present in this paper are meant to demonstrate how SASSI's capabilities can be used for different types of architecture experiments. Section 5 explores SASSI's ability to inspect application control flow behavior, which can be a critical performance limiter on modern GPUs. Section 6 leverages SASSI to perform a detailed memory analysis, which specifically characterizes an application's memory divergence. Section 7 shows how SASSI allows access to an instrumented application's register contents to enable value profiling.\n", "alignment": "left", "unique_id": "56b448871ff6acae18b646b1fec1c1a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The case studies we present in this paper are meant to demonstrate how SASSI's capabilities can be used for different types of architecture experiments. Section 5 explores SASSI's ability to inspect application control flow behavior, which can be a critical performance limiter on modern GPUs. Section 6 leverages SASSI to perform a detailed memory analysis, which specifically characterizes an application's memory divergence. Section 7 shows how SASSI allows access to an instrumented application's register contents to enable value profiling."}], "lineHeight": 0}}, "target": {"markdown": "本文中我们展示的案例研究旨在演示如何将 SASSI 的能力用于不同类型的架构实验。第 5 节探讨了 SASSI 检查应用程序控制流行为的能力，这在现代 GPU 上可能是关键的性能瓶颈。第 6 节利用 SASSI 进行详细的内存分析，具体刻画应用程序的内存发散性。第 7 节展示了 SASSI 如何允许访问已插桩应用程序的寄存器内容，从而实现值剖析（value profiling）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "bc27c1836bd47a6e57c1457d9cdb4790", "index": 55, "aliyun_index": 2, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "While SASSI is capable of instrumenting applications that target Fermi, Kepler, and Maxwell devices, the results we present in this paper were gathered on Kepler-based architectures. Specifically, the experiments presented in the aforementioned case studies target an NVIDIA Tesla K10 G2 with 8GB memory and display driver version 340.21. In addition, all experiments use the CUDA 6 toolkit, and we simply replace the standard ptxas with our SASSI-enabled version.  \n\n", "text": "While SASSI is capable of instrumenting applications that target Fermi, Kepler, and Maxwell devices, the results we present in this paper were gathered on Kepler-based architectures. Specifically, the experiments presented in the aforementioned case studies target an NVIDIA Tesla K10 G2 with 8GB memory and display driver version 340.21. In addition, all experiments use the CUDA 6 toolkit, and we simply replace the standard ptxas with our SASSI-enabled version.\n", "alignment": "left", "unique_id": "bc27c1836bd47a6e57c1457d9cdb4790", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While SASSI is capable of instrumenting applications that target Fermi, Kepler, and Maxwell devices, the results we present in this paper were gathered on Kepler-based architectures. Specifically, the experiments presented in the aforementioned case studies target an NVIDIA Tesla K10 G2 with 8GB memory and display driver version 340.21. In addition, all experiments use the CUDA 6 toolkit, and we simply replace the standard ptxas with our SASSI-enabled version."}], "lineHeight": 0}}, "target": {"markdown": "尽管 SASSI 能够对面向 Fermi、Kepler 和 Maxwell 设备的应用程序进行插桩，但本文中我们展示的结果均是在基于 Kepler 的架构上收集的。具体而言，上述案例研究中的实验均针对配备 8GB 内存、显示驱动版本为 340.21 的 NVIDIA Tesla K10 G2。此外，所有实验均使用 CUDA 6 工具包，我们只需将标准的 `ptxas` 替换为我们启用 SASSI 的版本即可。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "af6ecb5a9ba2caa129fd6dfc66914854", "index": 56, "aliyun_index": 3, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The final case study in Section 8, characterizes an application's sensitivity to transient errors by injecting faults into the architecturally visible state of a GPU. The experiments demonstrate how SASSI can be used to change a kernel's behavior (e.g., by altering register values and memory locations). The experimental flow targets a Tesla K20 with 5GB memory, display driver version 340.29, and uses the CUDA 6.5 toolkit.  \n\n", "text": "The final case study in Section 8, characterizes an application's sensitivity to transient errors by injecting faults into the architecturally visible state of a GPU. The experiments demonstrate how SASSI can be used to change a kernel's behavior (e.g., by altering register values and memory locations). The experimental flow targets a Tesla K20 with 5GB memory, display driver version 340.29, and uses the CUDA 6.5 toolkit.\n", "alignment": "left", "unique_id": "af6ecb5a9ba2caa129fd6dfc66914854", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The final case study in Section 8, characterizes an application's sensitivity to transient errors by injecting faults into the architecturally visible state of a GPU. The experiments demonstrate how SASSI can be used to change a kernel's behavior (e.g., by altering register values and memory locations). The experimental flow targets a Tesla K20 with 5GB memory, display driver version 340.29, and uses the CUDA 6.5 toolkit."}], "lineHeight": 0}}, "target": {"markdown": "第 8 节中的最后一个案例研究通过向 GPU 架构可见的状态中注入故障，来刻画应用程序对瞬态错误的敏感性。实验演示了如何利用 SASSI 来改变内核的行为（例如，通过修改寄存器值和内存位置）。实验流程针对配备 5GB 内存、显示驱动版本为 340.29 的 Tesla K20，并使用 CUDA 6.5 工具包。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "eb946763ae8f0792e20378fb15261138", "index": 57, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "We choose benchmarks to present in each of the case study sections that reveal interesting behavior. With the exception of NERSC's miniFE application [17, 27], all of the benchmarks come from Parboil v2.5 [40] and Rodinia v2.3 [7].  \n\n", "text": "We choose benchmarks to present in each of the case study sections that reveal interesting behavior. With the exception of NERSC's miniFE application [17, 27], all of the benchmarks come from Parboil v2.5 [40] and Rodinia v2.3 [7].\n", "alignment": "left", "unique_id": "eb946763ae8f0792e20378fb15261138", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We choose benchmarks to present in each of the case study sections that reveal interesting behavior. With the exception of NERSC's miniFE application [17, 27], all of the benchmarks come from Parboil v2.5 [40] and Rodinia v2.3 [7]."}], "lineHeight": 0}}, "target": {"markdown": "我们在每个案例研究章节中均精心挑选了能够揭示有趣行为的基准测试。除 NERSC 的 miniFE 应用程序 [17, 27] 外，所有基准测试均来自 Parboil v2.5 [40] 和 Rodinia v2.3 [7]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "c86ed03d5f47be5ab0338511e1a8f450", "index": 58, "aliyun_index": 5, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "## 5. Case Study I: Conditional Control Flow\n", "text": "5. Case Study I: Conditional Control Flow\n", "alignment": "left", "unique_id": "c86ed03d5f47be5ab0338511e1a8f450", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5. Case Study I: Conditional Control Flow"}], "lineHeight": 0}}, "target": {"markdown": "## 5. 案例研究一：条件控制流\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "695a257d1d8aa5b2d537646319875f1e", "index": 59, "aliyun_index": 6, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Our first case study discusses a tool based on SASSI for analyzing SIMT control flow behavior. Explicitly parallel Single Program Multiple Data (SPMD) languages such as CUDA and OpenCL allow programmers to encode unconstrained control flow, including gotos, nested loops, if-then-else statements, function calls, etc. For GPUs when all of the threads in a warp execute the same control flow (i.e., the threads in the warp share the same PC), they are said to be converged, and each thread in the warp is therefore active. Conditional control flow however, can cause a subset of threads to diverge. Such divergence has serious performance ramifications for GPU architectures. For NVIDIA's architectures, the hardware chooses one path to continue executing, and defers the execution of threads on the alternate paths by pushing the deferred thread IDs and their program counters onto a divergence stack [19]. At this point, only a subset of the threads actually execute, which causes warp efficiency to drop. At well-defined convergence points (which are automatically determined by the compiler), the hardware pops the deferred threads off the stack and begins executing the deferred threads.  \n\n", "text": "Our first case study discusses a tool based on SASSI for analyzing SIMT control flow behavior. Explicitly parallel Single Program Multiple Data (SPMD) languages such as CUDA and OpenCL allow programmers to encode unconstrained control flow, including gotos, nested loops, if-then-else statements, function calls, etc. For GPUs when all of the threads in a warp execute the same control flow (i.e., the threads in the warp share the same PC), they are said to be converged, and each thread in the warp is therefore active. Conditional control flow however, can cause a subset of threads to diverge. Such divergence has serious performance ramifications for GPU architectures. For NVIDIA's architectures, the hardware chooses one path to continue executing, and defers the execution of threads on the alternate paths by pushing the deferred thread IDs and their program counters onto a divergence stack [19]. At this point, only a subset of the threads actually execute, which causes warp efficiency to drop. At well-defined convergence points (which are automatically determined by the compiler), the hardware pops the deferred threads off the stack and begins executing the deferred threads.\n", "alignment": "left", "unique_id": "695a257d1d8aa5b2d537646319875f1e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our first case study discusses a tool based on SASSI for analyzing SIMT control flow behavior. Explicitly parallel Single Program Multiple Data (SPMD) languages such as CUDA and OpenCL allow programmers to encode unconstrained control flow, including gotos, nested loops, if-then-else statements, function calls, etc. For GPUs when all of the threads in a warp execute the same control flow (i.e., the threads in the warp share the same PC), they are said to be converged, and each thread in the warp is therefore active. Conditional control flow however, can cause a subset of threads to diverge. Such divergence has serious performance ramifications for GPU architectures. For NVIDIA's architectures, the hardware chooses one path to continue executing, and defers the execution of threads on the alternate paths by pushing the deferred thread IDs and their program counters onto a divergence stack [19]. At this point, only a subset of the threads actually execute, which causes warp efficiency to drop. At well-defined convergence points (which are automatically determined by the compiler), the hardware pops the deferred threads off the stack and begins executing the deferred threads."}], "lineHeight": 0}}, "target": {"markdown": "我们的第一个案例研究讨论了一种基于 SASSI 的分析 SIMT 控制流行为的工具。诸如 CUDA 和 OpenCL 这样的显式并行单程序多数据（SPMD）语言允许程序员编写不受限制的控制流，包括 goto、嵌套循环、if-then-else 语句、函数调用等。对于 GPU 而言，当一个 warp 中的所有线程执行相同的控制流（即 warp 中的线程共享相同的 PC）时，称它们处于收敛状态，因此 warp 中的每个线程都是活跃的。然而，条件控制流可能导致一部分线程发生发散。这种发散会对 GPU 架构的性能产生严重影响。对于 NVIDIA 的架构，硬件会选择一条路径继续执行，并通过将延迟线程的 ID 及其程序计数器压入发散栈 [19] 来推迟对另一路径上线程的执行。此时，只有部分线程在真正执行，从而导致 warp 效率下降。在由编译器自动确定的、明确定义的收敛点处，硬件会将延迟线程从栈中弹出，并开始执行这些被延迟的线程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "a89a08adbb38cbee52f3119bb43be6ff", "index": 60, "aliyun_index": 7, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "This case study uses SASSI to collect per-branch control\nflow statistics. Specifically, we will show an instrumentation  \n\n", "text": "This case study uses SASSI to collect per-branch control\nflow statistics. Specifically, we will show an instrumentation\n", "alignment": "left", "unique_id": "a89a08adbb38cbee52f3119bb43be6ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This case study uses SASSI to collect per-branch control"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "flow statistics. Specifically, we will show an instrumentation"}], "lineHeight": -57}}, "target": {"markdown": "本案例研究利用 SASSI 收集每个分支的控制流统计信息。具体而言，我们将展示一种插桩", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "5d00d82f991fe87a993186d917b62ce4", "index": 61, "aliyun_index": 8, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![5d00d82f991fe87a993186d917b62ce4.jpeg](figures/5d00d82f991fe87a993186d917b62ce4_6e571cb3.png)  \n\n", "text": "以下是图片中代码的合法 Markdown 格式提取，完整保留所有步骤、注释和细节：\n\n```cpp\n__device__ void sassi_before_handler(SASSIBeforeParams *bp,\n                                     SASSICondBranchParams *brp)\n{\n    // Find out thread index within the warp.\n    int threadIdxInWarp = threadIdx.x & (warpSize-1);\n\n    // Find out which way this thread is going to branch.\n    bool dir = brp->GetDirection();\n\n    // Get masks and counts of 1) active threads in this warp,\n    // 2) threads that take the branch, and\n    // 3) threads that do not take the branch.\n    int active = __ballot(1);\n    int taken = __ballot(dir == true);\n    int ntaken = __ballot(dir == false);\n    int numActive = __popc(active);\n    int numTaken = __popc(taken), numNotTaken = __popc(ntaken);\n\n    // The first active thread in each warp gets to write results.\n    if ((__ffs(active)-1) == threadIdxInWarp) {\n        // Find the instruction's counters in a hash table based on\n        // its address. Create a new entry if one does not exist.\n        struct BranchStats *stats = find(bp->GetInsAddr());\n\n        // Increment the various counters that are associated\n        // with this instruction appropriately.\n        atomicAdd(&(stats->totalBranches), 1ULL);\n        atomicAdd(&(stats->activeThreads), numActive);\n        atomicAdd(&(stats->takenThreads), numTaken);\n        atomicAdd(&(stats->takenNotThreads), numNotTaken);\n        if (numTaken != numActive && numNotTaken != numActive) {\n            // If threads go different ways, note it.\n            atomicAdd(&(stats->divergentBranches), 1ULL);\n        }\n    }\n}\n```\n\n✅ 说明：\n- 所有行号已移除（Markdown 代码块不显示行号）。\n- 原始缩进、注释、变量名、函数调用、条件判断等完全保留。\n- 使用 `cpp` 语言标识以启用语法高亮。\n- 特殊符号如 `__device__`, `__ballot`, `__popc`, `__ffs`, `atomicAdd` 等均原样保留。\n- 多行字符串/注释按原格式换行处理。\n- 逻辑结构（if 嵌套、括号配对）严格保持原文。\n\n此 Markdown 代码块可直接嵌入任何支持 GitHub Flavored Markdown 的平台（如 GitHub、GitLab、Typora、VS Code 等），并正确渲染为带语法高亮的 CUDA C++ 代码。", "alignment": "left", "unique_id": "5d00d82f991fe87a993186d917b62ce4", "edited": false, "extra": {}}, "target": {"markdown": "![5d00d82f991fe87a993186d917b62ce4.jpeg](figures/5d00d82f991fe87a993186d917b62ce4_6e571cb3.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error  to record for each branch 1) the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "total number of times the branch was executed, 2) how many"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "threads were active, 3) how many threads took the branch, 4)"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "how many threads \"fell through\", 5) and how often it caused a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "warp to split (i.e., divergent branch)."}], "lineHeight": -146}}, "target": {"markdown": "handler，它使用计数器为每个分支记录：1）该分支被执行的总次数，2）活跃线程的数量，3）选择该分支的线程数量，4）“直接穿过”（fall through）的线程数量，5）以及该分支导致 warp 分裂（即分支发散）的频率。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "5e0caeaeaea2d4e0ab29817db12e3443", "index": 64, "aliyun_index": 11, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "## 5.1. SASSI Instrumentation\n", "text": "5.1. SASSI Instrumentation\n", "alignment": "left", "unique_id": "5e0caeaeaea2d4e0ab29817db12e3443", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1. SASSI Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 5.1. SASSI 插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false} ure 4 shows the instrumentation handler we use for this case study. SASSI will insert calls to this handler before every conditional branch operation."}], "lineHeight": -232}}, "target": {"markdown": "**Instrumentation where and what:** 本分析面向程序控制流。我们指示 SASSI 在所有条件控制流指令之前进行插桩，并在每个插桩点处指示 SASSI 收集并将与条件控制流相关的信息传递给插桩处理器。\n**Instrumentation handler:** 图 4 展示了本案例研究使用的插桩处理器。SASSI 将在每个条件分支操作之前插入对该处理器的调用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "90d3ca0d260d70fcbbd725f004bf1ab9", "index": 66, "aliyun_index": 13, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The handler first determines the thread index within the warp (line 5) and the direction in which the thread is going to branch (line 8). CUDA provides several warp-wide broadcast and reduction operations that NVIDIA's architectures efficiently support. For example, all of the handlers we present in this paper use the `__ballot(predicate)` instruction, which \"evaluates predicate for all active threads of the warp and returns an integer whose $N^{th}$ bit is set if and only if predicate evaluates to non-zero for the $N^{th}$ thread of the warp and the $N^{th}$ thread is active\" [32].  \n\n", "text": "The handler first determines the thread index within the warp (line 5) and the direction in which the thread is going to branch (line 8). CUDA provides several warp-wide broadcast and reduction operations that NVIDIA's architectures efficiently support. For example, all of the handlers we present in this paper use the `__ballot(predicate)` instruction, which \"evaluates predicate for all active threads of the warp and returns an integer whose $N^{th}$ bit is set if and only if predicate evaluates to non-zero for the $N^{th}$ thread of the warp and the $N^{th}$ thread is active\" [32].\n", "alignment": "left", "unique_id": "90d3ca0d260d70fcbbd725f004bf1ab9", "edi pulation count instruction (\\_popc) to efficiently determine the number of threads in each respective category (numActive, numTaken, numNotTaken)."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "1ed34b8a5ae61acd0d6fe13967e55177", "index": 71, "aliyun_index": 3, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "On line 20 the handler elects the first active thread in the warp (using the find first set CUDA intrinsic, __ffs) to record the results. Because this handler records per-branch statistics, it uses a hash table in which to store counters. Line 23 finds the hash table entry for the instrumented branch (using a function not shown here). Lines 27-33 update the counters.  \n\n", "text": "On line 20 the handler elects the first active thread in the warp (using the find first set CUDA intrinsic, __ffs) to record the results. Because this handler records per-branch statistics, it uses a hash table in which to store counters. Line 23 finds the hash table entry for the instrumented branch (using a function not shown here). Lines 27-33 update the counters.\n", "alignment": "left", "unique_id": "1ed34b8a5ae61acd0d6fe13967e55177", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On line 20 the handler elects the first active thread in the warp (using the find first set CUDA intrinsic, __ffs) to record the results. Because this handler records per-branch statistics, it uses a hash table in which to store counters. Line 23 finds the hash table entry for the instrumented branch (using a function not shown here). Lines 27-33 update the counters."}], "lineHeight": 0}}, "target": {"markdown": "在第 20 行，处理器使用 CUDA 内建函数 `__ffs`（查找第一个置位）选出 warp 中第一个活跃线程来记录结果。由于该处理器记录的是每个分支的统计信息，因此它使用一个哈希表来存储计数器。第 23 行查找被插桩分支所对应的哈希表项（此处使用了未在图中展示的函数）。第 27–33 行更新这些计数器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "837daa899d7158e3f467f15ada6a023d", "index": 72, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "As we described in Section 3, we rely on the CUPTI library to register callbacks for kernel *launch* and *exit* events [33]. Using these callbacks, which run on the host, we can appropriately marshal data to initialize and record the values in the device-side hash table.  \n\n", "text": "As we described in Section 3, we rely on the CUPTI library to register callbacks for kernel *launch* and *exit* events [33]. Using these callbacks, which run on the host, we can appropriately marshal data to initialize and record the values in the device-side hash table.\n", "alignment": "left", "unique_id": "837daa899d7158e3f467f15ada6a023d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As we described in Section 3, we rely on the CUPTI library to register callbacks for kernel *launch* and *exit* events [33]. Using these callbacks, which run on the host, we can appropriately marshal data to initialize and record the values in the device-side hash table."}], "lineHeight": 0}}, "target": {"markdown": "正如我们在第 3 节中所描述的，我们依赖 CUPTI 库来为内核的 *launch*（启动）和 *exit*（退出）事件注册回调函数 [33]。借助这些运行在主机端的回调函数，我们可以恰当地调度数据，从而在设备端的哈希表中完成初始化并记录相应的值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "be4a484183be4bcc72262f43f8ab1e68", "index": 73, "aliyun_index": 5, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "## 5.2. Results\n", "text": "5.2. Results\n", "alignment": "left", "unique_id": "be4a484183be4bcc72262f43f8ab1e68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.2. Results"}], "lineHeight": 0}}, "target": {"markdown": "## 5.2. 结果\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "ad9a145ad513bbbf1382669c443925af", "index": 74, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Table 1 summarizes the average per-branch divergence statistics for a selected set of Parboil and Rodinia benchmarks with different input datasets. For each benchmark, we calculate the fraction of branches in the code that were divergent (“Static” column), and how often branches diverged throughout execution (“Dynamic” column) thereby reducing warp efficiency.  \n\n", "text": "Table 1 summarizes the average per-branch divergence statistics for a selected set of Parboil and Rodinia benchmarks with different input datasets. For each benchmark, we calculate the fraction of branches in the code that were divergent (“Static” column), and how often branches diverged throughout execution (“Dynamic” column) thereby reducing warp efficiency.\n", "alignment": "left", "unique_id": "ad9a145ad513bbbf1382669c443925af", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 1 summarizes the average per-branch divergence statistics for a selected set of Parboil and Rodinia benchmarks with different input datasets. For each benchmark, we calculate the fraction of branches in the code that were divergent (“Static” column), and how often branches diverged throughout execution (“Dynamic” column) thereby reducing warp efficiency."}], "lineHeight": 0}}, "target": {"markdown": "表 1 汇总了选定的若干 Parboil 与 Rodinia 基准测试在不同输入数据集下的平均单分支发散统计信息。对于每个基准测试，我们分别计算了代码中发散分支所占的比例（“静态”列），以及分支在整个执行过程中发生发散（从而降低 warp 执行效率）的频率（“动态”列）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "31979617e0eec6225754925e007b01e9", "index": 75, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Some benchmarks are completely convergent, such as sgemm and streamcluster, and do not diverge at all. Other benchmarks diverge minimally, such as gaussian and srad_v1, while, benchmarks such as tpacf and heartwall experience abundant divergence. An application's branch behavior can change with different datasets. For example, Parboil's bfs shows a spread of 4.1–14.9% dynamic branch divergence across four different input datasets. In addition, branch behavior can vary across different implementations of the same application (srad_v1 vs. srad_v2, and Parboil bfs vs. Rodinia bfs).  \n\n", "text": "Some benchmarks are completely convergent, such as sgemm and streamcluster, and do not diverge at all. Other benchmarks diverge minimally, such as gaussian and srad_v1, while, benchmarks such as tpacf and heartwall experience abundant divergence. An application's branch behavior can change with different datasets. For example, Parboil's bfs shows a spread of 4.1–14.9% dynamic branch divergence across four different input datasets. In addition, branch behavior can vary across different implementations of the same application (srad_v1 vs. srad_v2, and Parboil bfs vs. Rodinia bfs).\n", "alignment": "left", "unique_id": "31979617e0eec6225754925e007b01e9", "edited": fals ence, while with the UT dataset, there are six branches in total (including the previous two) that contribute to a 10% increase in dynamic branch divergence. SASSI simplifies the task of collecting per-\n", "alignment": "left", "unique_id": "523aa573361df4602a26e0397a61af1c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5 plots the detailed per-branch divergence statistics we can get from SASSI. For Parboil bfs with the 1M dataset, two branches are the major source of divergence, while with the UT dataset, there are six branches in total (including the previous two) that contribute to a 10% increase in dynamic branch divergence. SASSI simplifies the task of collecting per-"}], "lineHeight": 0}}, "target": {"markdown": "图 5 展示了利用 SASSI 获得的每个分支的详细发散统计数据。对于使用 1M 数据集的 Parboil bfs，两个分支是发散的主要来源；而在使用 UT 数据集时，共有六个分支（包含前述两个分支）共同作用，使得动态分支发散率增加了 10%。SASSI 简化了收集每个——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "e40debb38cfa4d8b9b90d1286f041387", "index": 77, "aliyun_index": 9, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![e40debb38cfa4d8b9b90d1286f041387.jpeg](figures/e40debb38cfa4d8b9b90d1286f041387_7055d8ef.png)  \n\n", "text": "# Parboil bfs Analysis\n\n## Parboil bfs (1M)\n\n### Runtime Branch Instruction Count\n\n| Data Point | Divergent Branches | Non-Divergent Branches |\n|------------|---------------------|-------------------------|\n| 1          | ~650K               | ~200K                   |\n| 2          | ~200K               | ~200K                   |\n| 3          | ~200K               | ~200K                   |\n| ...        | ...                 | ...                     |\n\n## Parboil bfs (UT)\n\n### Runtime Bra  "Figure 5: Per-branch divergence statistics of the Parboil bfs benchmark with different input datasets. Each bar represents an unique branch in the code. The branches are sorted in a descending order of runtime branch instruction count."}], "lineHeight": 0}}, "target": {"markdown": ">图 5：Parboil bfs 基准测试在不同输入数据集下的逐分支发散统计。每个柱状条代表代码中的一个唯一分支，这些分支按其运行时分支指令计数降序排列。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "634759ba2379bd0a724873f143e9741a", "index": 79, "aliyun_index": 11, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "branch statistics with its easy-to-customize instrumentation\nhandler, and also makes it tractable to run all input datasets\nwith its low runtime overhead.  \n\n", "text": "branch statistics with its easy-to-customize instrumentation\nhandler, and also makes it tractable to run all input datasets\nwith its low runtime overhead.\n", "alignment": "left", "unique_id": "634759ba2379bd0a724873f143e9741a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "branch statistics with its easy-to-customize instrumentation"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "handler, and also makes it tractable to run all input datasets"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "with its low runtime overhead."}], "lineHeight": -83}}, "target": {"markdown": "分支的统计信息收集工作，得益于其易于定制的插桩处理器；与此同时，较低的运行时开销也使得在不同输入数据集上运行全部实验成为可行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "3cd8549a485ade21672b72bfca8a79ea", "index": 80, "aliyun_index": 12, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "## 6. Case Study II: Memory Divergence\n", "text": "6. Case Study II: Memory Divergence\n", "alignment": "left", "unique_id": "3cd8549a485ade21672b72bfca8a79ea", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6. Case Study II: Memory Divergence"}], "lineHeight": 0}}, "target": {"markdown": "## 6. 案例研究 II：内存访问发散\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "c781ec594cba75a3b2ce4f3a29390734", "index": 81, "aliyun_index": 13, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Memory access patterns can impact performance, caching effectiveness, and DRAM bandwidth efficiency. In the SIMT execution model, warps can issue loads with up to 32 unique addresses, one per thread. Warp-wide memory access patterns determine the number of memory transactions required. To reduce total requests sent to memory, accesses to the same cacheline are combined into a single request in a process known as coalescing. Structured access patterns that touch a small number of unique cachelines are more efficiently coalesced and consume less bandwidth than irregular access patterns that touch many unique cachelines.  \n\n", "text": "Memory access patterns can impact performance, caching effectiveness, and DRAM bandwidth efficiency. In the SIMT execution model, warps can issue loads with up to 32 unique addresses, one per thread. Warp-wide memory access patterns determine the number of memory transactions required. To reduce total requests sent to memory, accesses to the same cacheline are combined into a single request in a process known as coalescing. Structured access patterns that touch a small number of unique cachelines are more efficiently coalesced and consume less bandwidth than irregular access patterns that touch many unique cachelines.\n", "alignment": "left", "unique_id": "c781ec594cba75a3b2ce4f3a29390734", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Memory access patterns can impact performance, caching effectiveness, and DRAM bandwidth efficiency. In the SIMT execution model, warps can issue loads with up to 32 unique addresses, one per thread. Warp-wide memory access patterns determine the number of memory transactions required. To reduce total requests sent to memory, accesses to the same cacheline are combined into a single request in a process known as coalescing. Structured access patterns that touch a small number of unique cachelines are more efficiently coalesced and consume less bandwidth than irregular access patterns that touch many unique cachelines."}], "lineHeight": 0}}, "target": {"markdown": "内存访问模式会影响性能、缓存效率以及 DRAM 带宽利用率。在 SIMT 执行模型中，一个 warp 最多可以发起包含 32 个不同地址的访存操作，每个线程对应一个地址。warp 级的内存访问模式决定了所需的内存事务数量。为了减少发往内存的请求总数，对同一缓存行的访问会被合并到同一个请求中，这一过程称为合并访存（coalescing）。访问少量不同缓存行的规整访问模式能够更高效地完成合并，并且相比访问大量不同缓存行的非规整访问模式消耗更少的带宽。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "66720e774a15f76edd5e25a1f4cb0657", "index": 82, "aliyun_index": 14, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Warp instructions that generate inefficient access patterns are said to be memory address diverged. Because warp instructions execute in lock-step in the SIMT model, all memory transactions for a given warp must complete before the warp can proceed. Requests may experience wide variance in latency due to many factors, including cache misses, memory scheduling, and variable DRAM access latency.  \n\n", "text": "Warp instructions that generate inefficient access patterns are said to be memory address diverged. Because warp instructions execute in lock-step in the SIMT model, all memory transactions for a given warp must complete before the warp can proceed. Requests may experience wide variance in latency due to many factors, including cache misses, memory scheduling, and variable DRAM access latency.\n", "alignment": "left", "unique_id": "66720e774a15f76edd5e25a1f4cb0657", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Warp instructions that generate inefficient access patterns are said to be memory address diverged. Because warp instructions execute in lock-step in the SIMT model, all memory transactions for a given warp must complete before the warp can proceed. Requests may experience wide variance in latency due to many factors, including cache misses, memory scheduling, and variable DRAM access latency."}], "lineHeight": 0}}, "target": {"markdown": "生成低效访存模式的 warp 指令被称为内存地址发散。由于在 SIMT 模型中 warp 指令以锁步（lock-step）方式执行，warp 中所有内存事务必须全部完成，warp 才能继续执行后续指令。由于缓存缺失、内存调度以及 DRAM 访问延迟的波动等诸多因素，各请求之间可能存在较大的延迟差异。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "2a8545d515420863018f3fe7b049ed6a", "index": 83, "aliyun_index": 15, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Architects have studied the impact of memory divergence and ways to mitigate it in simulation [6, 22, 36, 37, 42]. For this case study, we demonstrate instrumentation to provide in-depth analysis of memory address divergence. While production analysis tools provide the ability to understand broad behavior, SASSI can enable much more detailed inspection of memory access behavior, including: the frequency of address divergence; the distribution of unique cachelines touched per instruction; correlation of control divergence with address divergence; and detailed accounting of unique references generated per program counter.  \n\n", "text": "Architects have studied the impact of memory divergence and ways to mitigate it in simulation [6, 22, 36, 37, 42]. For this case study, we demonstrate instrumentation to provide in-depth analysis of memory address divergence. While production analysis tools provide the ability to understand broad behavior, SASSI can enable much more detailed inspection of memory access behavior, including: the frequency of address divergence; the distribution of unique cachelines touched per instruction; correlation of control divergence with address divergence; and detailed accounting of unique references generated per program counter.\n", "alignment": "left", "unique_id": "2a8545d515420863018f3fe7b049ed6a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Architects have studied the impact of memory divergence and ways to mitigate it in simulation [6, 22, 36, 37, 42]. For this case study, we demonstrate instrumentation to provide in-depth analysis of memory address divergence. While production analysis tools provide the ability to understand broad behavior, SASSI can enable much more detailed inspection of memory access behavior, including: the frequency of address divergence; the distribution of unique cachelines touched per instruction; correlation of control divergence with address divergence; and detailed accounting of unique references generated per program counter."}], "lineHeight": 0}}, "target": {"markdown": "架构师们已通过仿真手段研究了内存发散的影响及其缓解方法 [6, 22, 36, 37, 42]。在本案例研究中，我们展示了如何通过插桩技术对内存地址发散进行深入分析。尽管已有的生产级分析工具能够用于理解宏观行为，但 SASSI 能够支持对内存访问行为进行更为细致的检测，包括：地址发散的发生频率、每条指令所访问的不同缓存行的分布情况、控制流发散与地址发散之间的相关性，以及每个程序计数器（PC）所产生不同访存请求的详细统计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "75d3a2486285c2327a0b73ee690667aa", "index": 84, "aliyun_index": 16, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "## 6.1. SASSI Instrumentation\n", "text": "6.1. SASSI Instrumentation\n", "alignment": "left", "unique_id": "75d3a2486285c2327a0b73ee690667aa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6.1. SASSI Instrumentation"}], "lineHeight": 0}}, "target": {"markdown": "## 6.1. SASSI 插桩\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "45deb88b3c7adb3eef7fb80342769d41", "index": 85, "aliyun_index": 17, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Instrumentation where and what:** We instruct SASSI to instrument before all memory operations, and at each instrumentation site, we direct SASSI to collect and pass memory-specific information to the instrumentation handler.  \n\n", "text": "**Instrumentation where and what:** We instruct SASSI to instrument before all memory operations, and at each instrumentation site, we direct SASSI to collect and pass memory-specific information to the instrumentation handler.\n", "alignment": "left", "unique_id": "45deb88b3c7adb3eef7fb80342769d41", "edited": false, "ext equested cache line address (line 11). For this work, we use a 32B line size. Each active thread in the warp will have a *thread-local* value for the computed address in lineAddr. Lines 16-26 use reduction and broadcast operations to iteratively find the number of unique values of lineAddr across a warp.  \n\n", "text": "**Instrumentation handler:** Figure 6 shows the instrumentation handler for this case study. SASSI inserts a call to this handler before every operation that touches memory. Because NVIDIA's instruction set is predicated, this handler first filters out threads whose guarding predicate is false (line 4). This handler then selects only addresses to *global* memory (line 7).$^1$ Next, the handler computes each thread's requested cache line address (line 11). For this work, we use a 32B line size. Each active thread in the warp will have a *thread-local* value for the computed address in lineAddr. Lines 16-26 use reduction and broadcast operations to iteratively find the number of unique values of lineAddr across a warp.\n", "alignment": "left", "unique_id": "09ed9f5309ebf6f10daf4f1b183ad644", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Instrumentation handler:** Figure 6 shows the instrumentation handler for this case study. SASSI inserts a call to this handler before every operation that touches memory. Because NVIDIA's instruction set is predicated, this handler first filters out threads whose guarding predicate is false (line 4). This handler then selects only addresses to *global* memory (line 7).$^1$ Next, the handler computes each thread's requested cache line address (line 11). For this work, we use a 32B line size. Each active thread in the warp will have a *thread-local* value for the computed address in lineAddr. Lines 16-26 use reduction and broadcast operations to iteratively find the number of unique values of lineAddr across a warp."}], "lineHeight": 0}}, "target": {"markdown": "**插桩处理器：** 图 6 展示了本案例研究中的插桩处理器。SASSI 会在每条涉及内存访问的操作之前插入对该处理器的调用。由于 NVIDIA 指令集是带断言（predicated）的，处理器首先会过滤掉那些其保护断言为假的线程（第 4 行）。随后，该处理器仅筛选出针对**全局**内存的访问地址（第 7 行）。$^1$ 接下来，处理器计算每个线程所请求的缓存行地址（第 11 行）。在本文中，我们使用 32 字节的缓存行大小。warp 中每个活跃线程都会在 `lineAddr` 中保存一个**线程局部**的计算所得地址。第 16–26 行通过归约（reduction）与广播（broadcast）操作，迭代地统计出整个 warp 内 `lineAddr` 的不同值数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "33ff1ecd4035e90f30e2e9472488c6e3", "index": 89, "aliyun_index": 3, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "This handler elects a leader thread to record the statistics\n(line 32). The leader populates a $32 \\times 32$ (lower triangular)\nmatrix of values in sassi_counters[][][], where the rows\nof the matrix record the number of active threads in the warp\n(numActive) and the columns correspond to the number of\nunique line addresses found. This handler also uses CUPTI to\ninitialize and dump the statistics kept in sassi_counters.  \n\n", "text": "This handler elects a leader thread to record the statistics\n(line 32). The leader populates a $32 \\times 32$ (lower triangular)\nmatrix of values in sassi_counters[][][], where the rows\nof the matrix record the number of active threads in the warp\n(numActive) and the columns correspond to the number of\nunique line addresses found. This handler also uses CUPTI to\ninitialize and dump the statistics kept in sassi_counters.\n", "alignment": "left", "unique_id": "33ff1ecd4035e90f30e2e9472488c6e3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This handler elects a leader thread to record the statistics"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(line 32). The leader populates a $32 \\times 32$ (lower triangular)"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "matrix of values in sassi_counters[][][], where the rows"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of the matrix record the number of active threads in the warp"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(numActive) and the columns correspond to the number of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "unique line addresses found. This handler also uses CUPTI to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "initialize and dump the statistics kept in sassi_counters."}], "lineHeight": -205}}, "target": {"markdown": "该处理器通过选举出一个 leader 线程来记录统计信息（第 32 行）。leader 线程会向 `sassi_counters[][][]` 中一个 $32 \\times 32$ 的（下三角）计数器矩阵填入数据，其中矩阵的行表示 warp 中活跃线程的数量（`numActive`），列则对应所统计到的不同缓存行地址数量。此外，该处理器还借助 CUPTI 完成 `sassi_counters` 中统计信息的初始化与导出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "0e5787b9420f4b0bc49359d5e7cd2fcc", "index": 90, "aliyun_index": 4, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "## 6.2. Results\n", "text": rgence for three different datasets for bfs from the Parboil suite; each exhibits similar overall behavior, but the extent of the problem varies across datasets. Other applications such as mri-gridding, spmv, and miniFE use sparse data representations or indirection that limits dense, regular access.\n", "alignment": "left", "unique_id": "e2cd0ee3bb22ef301b2717b7729edadc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The applications shown exhibit complex data access patterns to irregularly structured data. Graph traversal operations such as bfs (breadth-first search) have unpredictable, data-dependent accesses that are frequently irregular. We can see how data-dependent behavior impacts memory divergence for three different datasets for bfs from the Parboil suite; each exhibits similar overall behavior, but the extent of the problem varies across datasets. Other applications such as mri-gridding, spmv, and miniFE use sparse data representations or indirection that limits dense, regular access."}], "lineHeight": 0}}, "target": {"markdown": "所展示的应用程序对结构不规则的数据呈现出复杂的访问模式。诸如广度优先搜索（bfs）之类的图遍历操作具有不可预测的、与数据相关的访问行为，且通常是不规则的。我们可以从 Parboil 基准测试套件中针对 bfs 的三组不同数据集，观察到数据相关行为是如何影响内存发散程度的：这三者在整体行为上较为相似，但问题的严重程度在不同数据集之间有所差异。其他应用程序，例如 mri-gridding、spmv 和 miniFE，则采用了稀疏的数据表示或间接寻址方式，因而难以实现密集且规则的内存访问。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "5b6d1c748fc1358a3bca3848bdd27ab9", "index": 98, "aliyun_index": 12, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Advanced developers structure their code to use access patterns or data formats that improve memory access regularity [2, 30]. For instance, Figure 7 shows two variants of miniFE that use different  "error": null, "edited": false}, "comments": [], "display_order": 103}, {"source": {"block_id": "4c187e37bf71a2bc5d1aa6a5da059f98", "index": 104, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "This section presents a simple profiling handler that tracks all instructions that produce register values and determines the following properties: (1) which bits of the generated values are always constant across all warps, and (2) which instructions are scalar, i.e., the instruction produces the same values for all threads within a warp. Scalar analysis has been proposed to reduce register file capacity by allowing a significant amount of sharing across threads in a warp [20]. Similarly, there have been proposals to pack multiple, narrow-bitwidth operands into a single register [41], and hardware mechanisms exist for exploiting narrow-bitwidth computations (e.g., by aggressively clock-gating unused portions of the datapath) [5]. This section's analysis provides insight into how many register file bits (a premium in GPUs) current applications are wasting. Such insight is a valuable guide to the opportunities that architecture mechanisms can provide.  \n\n", "text": "This section presents a simple profiling handler that tracks all instructions that produce register values and determines the following properties: (1) which bits of the generated values are always constant across all warps, and (2) which instructions are scalar, i.e., the instruction produces the same values for all threads within a warp. Scalar analysis has been proposed to reduce register file capacity by allowing a significant amount of sharing across threads in a warp [20]. Similarly, there have been proposals to pack multiple, narrow-bitwidth operands into a single register [41], and hardware mechanisms exist for exploiting narrow-bitwidth computations (e.g., by aggressively clock-gating unused portions of the datapath) [5]. This section's analysis provides insight into how many register file bits (a premium in GPUs) current applications are wasting. Such insight is a valuable guide to the opportunities that architecture mechanisms can provide.\n", "alignment": "left", "unique_id": "4c187e37bf71a2bc5d1aa6a5da059f98", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section presents a simple profiling handler that tracks all instructions that produce register values and determines the following properties: (1) which bits of the generated values are always constant across all warps, and (2) which instructions are scalar, i.e., the instruction produces the same values for all threads within a warp. Scalar analysis has been proposed to reduce register file capacity by allowing a significant amount of sharing across threads in a warp [20]. Similarly, there have been proposals to pack multiple, narrow-bitwidth operands into a single register [41], and hardware mechanisms exist for exploiting narrow-bitwidth computations (e.g., by aggressively clock-gating unused portions of the datapath) [5]. This section's analysis provides insight into how many register file bits (a premium in GPUs) current applications are wasting. Such insight is a valuable guide to the opportunities that architecture mechanisms can provide."}], "lineHeight": 0}}, "target": {"markdown": "本节展示了一个简单的剖析处理器，用于追踪所有产生寄存器值的指令，并确定以下两类属性：（1）所生成值的哪些比特位在所有 warp 中始终保持恒定；（2）哪些指令是标量指令，即该指令在同一个 warp 内的所有线程中产生相同的值。已有研究提出通过标量分析来减少寄存器文件的容量需求，其方法是在 warp 内的线程之间实现大量共享 [20]。类似地，也有研究提出将多个窄位宽的操作数打包到单个寄存器中 [41]，并且现有的硬件机制已能够利用窄位宽计算（例如，通过激进地对数据通路中未使用的部分进行时钟门控）[5]。本节的分析有助于理解当前应用程序究竟浪费了多少寄存器文件比特位（在 GPU 中这是一种极为珍贵的资源）。这些分析结果对于评估架构机制所能带来的优化机会具有重要的指导价值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 104}, {"sourc
