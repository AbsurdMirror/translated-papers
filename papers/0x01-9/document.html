e, "italic": false}, "text": "WORKLOAD."}], "lineHeight": -85}}, "target": {"markdown": ">表 VII\n按精度划分的张量核心吞吐量（TFLOPS）。峰值占比相对于理论峰值；B200 与 H200 之间的加速比基于相同工作负载得出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "0ba7fb2fce9a60a7aceffe77cd85df65", "index": 125, "aliyun_index": 2, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "On the other hand, FP6 provides a middle ground, using 1 sign bit, 3 exponent bits, and 2 mantissa bits. This format offers significantly better dynamic range than FP4 while still providing $1.33\\times$ memory and bandwidth savings compared to FP8. Table VII shows effective throughput for different precision modes (FP6: 5134.4 TFLOPS, 96.0% peak; FP4: 7700.2 TFLOPS, 96.2% peak).  \n\n", "text": "On the other hand, FP6 provides a middle ground, using 1 sign bit, 3 exponent bits, and 2 mantissa bits. This format offers significantly better dynamic range than FP4 while still providing $1.33\\times$ memory and bandwidth savings compared to FP8. Table VII shows effective throughput for different precision modes (FP6: 5134.4 TFLOPS, 96.0% peak; FP4: 7700.2 TFLOPS, 96.2% peak).\n", "alignment": "left", "unique_id": "0ba7fb2fce9a60a7aceffe77cd85df65", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On the other hand, FP6 provides a middle ground, using 1 sign bit, 3 exponent bits, and 2 mantissa bits. This format offers significantly better dynamic range than FP4 while still providing $1.33\\times$ memory and bandwidth savings compared to FP8. Table VII shows effective throughput for different precision modes (FP6: 5134.4 TFLOPS, 96.0% peak; FP4: 7700.2 TFLOPS, 96.2% peak)."}], "lineHeight": 0}}, "target": {"markdown": "另一方面，FP6 提供了一种折中方案，采用 1 个符号位、3 个指数位和 2 个尾数位。该格式相较于 FP4 具有显著更好的动态范围，同时相比 FP8 仍能节省 $1.33\\times$ 的内存和带宽。表 VII 给出了不同精度模式下的有效吞吐量（FP6：5134.4 TFLOPS，峰值的 96.0%；FP4：7700.2 TFLOPS，峰值的 96.2%）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "fc037bbde748d00131427f14adbcbb28", "index": 126, "aliyun_index": 3, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Our achieved throughput is consistent with architectural specifications when compared to theoretical peak (peak = #SMs × tensor_ops_per_cycle × clock_rate). At the reported matrix dimensions, we observe 3850.6 TFLOPS in FP8 mode (96.3% of theoretical peak) and 7700.2 TFLOPS in FP4 (96.2% of peak), see Table VII. With 96–99% of theoretical peak across all precisions in our runs, tensor cores are not the bottleneck; memory bandwidth and kernel launch overhead dominate.  \n\n", "text": "Our achieved throughput is consistent with architectural specifications when compared to theoretical peak (peak = #SMs × tensor_ops_per_cycle × clock_rate). At the reported matrix dimensions, we observe 3850.6 TFLOPS in FP8 mode (96.3% of theoretical peak) and 7700.2 TFLOPS in FP4 (96.2% of peak), see Table VII. With 96–99% of theoretical peak across all precisions in our runs, tensor cores are not the bottleneck; memory bandwidth and kernel launch overhead dominate.\n", "alignment": "left", "unique_id": "fc037bbde748d00131427f14adbcbb28", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our achieved throughput is consistent with architectural specifications when compared to theoretical peak (peak = #SMs × tensor_ops_per_cycle × clock_rate). At the reported matrix dimensions, we observe 3850.6 TFLOPS in FP8 mode (96.3% of theoretical peak) and 7700.2 TFLOPS in FP4 (96.2% of peak), see Table VII. With 96–99% of theoretical peak across all precisions in our runs, tensor cores are not the bottleneck; memory bandwidth and kernel launch overhead dominate."}], "lineHeight": 0}}, "target": {"markdown": "在我们所测量的矩阵维度下，FP8 模式实现吞吐量为 3850.6 TFLOPS（理论峰值的 96.3%），FP4 模式为 7700.2 TFLOPS（峰值的 96.2%），详见表 VII。在我们的所有测试中，各精度的实测吞吐量均达到理论峰值的 96%–99%，表明张量核心并非瓶颈所在；限制因素在于内存带宽和内核启动开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "178a67bf8d6d9bbf943c84819241bf68", "index": 127, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "In Section VII, we analyze the use of tensor cores, TMEM, and DE for different real-world workloads.  \n\n", "text": "In Section VII, we analyze the use of tensor cores, TMEM, and DE for different real-world workloads.\n", "alignment": "left", "unique_id": "178a67bf8d6d9bbf943c84819241bf68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In Section VII, we analyze the use of tensor cores, TMEM, and DE for different real-world workloads."}], "lineHeight": 0}}, "target": {"markdown": "在第 VII 节中，我们将分析张量核心、TMEM 和 DE 在不同实际工作负载中的使用情况。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "02a4f587a9b4e67b16689a8896bb45a1", "index": 128, "aliyun_index": 5, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "## VII. PERFORMANCE ANALYSIS & CASE STUDIES\n", "text": "VII. PERFORMANCE ANALYSIS & CASE STUDIES\n", "alignment": "left", "unique_id": "02a4f587a9b4e67b16689a8896bb45a1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VII. PERFORMANCE ANALYSIS & CASE STUDIES"}], "lineHeight": 0}}, "target": {"markdown": "## VII. 性能分析与案例研究\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "9a4e3d3b98d6b37830d486a401de52ea", "index": 129, "aliyun_index": 6, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "This section presents a comprehensive empirical evaluation of GPU performance across three critical workload categories: LLM inference, scientific computing applications, and mixed-precision neural-network training. Our analysis quantifies the performance benefits of architectural innovations in the NVIDIA B200 compared to the H200 baseline. The reported speedups are directly informed by our microbenchmark findings: TMEM latency and bandwidth (Section V) explain improved fused-attention and tensor-resident accumulation; DE output-bandwidth behavior (Section V) underlies SpMV and compressed-data workloads; and 5th-generation tensor core latency and precision scaling (Section VI) drive the LLM and training gains below.  \n\n", "text": "This section presents a comprehensive empirical evaluation of GPU performance across three critical workload categories: LLM inference, scientific computing applications, and mixed-precision neural-network training. Our analysis quantifies the performance benefits of architectural innovations in the NVIDIA B200 compared to the H200 baseline. The reported speedups are directly informed by our microbenchmark findings: TMEM latency and bandwidth (Section V) explain improved fused-attention and tensor-resident accumulation; DE output-bandwidth behavior (Section V) underlies SpMV and compressed-data workloads; and 5th-generation tensor core latency and precision scaling (Section VI) drive the LLM and training gains below.\n", "alignment": "left", "unique_id": "9a4e3d3b98d6b37830d486a401de52ea", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section presents a comprehensive empirical evaluation of GPU performance across three critical workload categories: LLM inference, scientific computing applications, and mixed-precision neural-network training. Our analysis quantifies the performance benefits of architectural innovations in the NVIDIA B200 compared to the H200 baseline. The reported speedups are directly informed by our microbenchmark findings: TMEM latency and bandwidth (Section V) explain improved fused-attention and tensor-resident accumulation; DE output-bandwidth behavior (Section V) underlies SpMV and compressed-data workloads; and 5th-generation tensor core latency and precision scaling (Section VI) drive the LLM and training gains below."}], "lineHeight": 0}}, "target": {"markdown": "本节对 GPU 在三类关键工作负载下的性能进行了全面的实证评估：大语言模型推理、科学计算应用以及混合精度神经网络训练。我们的分析量化了 NVIDIA B200 相对于 H200 基线在各项架构创新上所带来的性能收益。所报告的加速比直接基于我们的微基准测试结果：TMEM 的延迟与带宽（第 V 节）解释了融合注意力以及张量驻留累加的性能提升；DE 的输出带宽特性（第 V 节）是 SpMV 和压缩数据负载性能改进的基础；第五代张量核心的延迟与精度扩展能力（第 VI 节）则推动了下方大语言模型与训练场景的性能增益。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "91f0545a2754db999b0760a222106d59", "index": 130, "aliyun_index": 7, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "### A. Experimental Methodology\n", "text": "A. Experimental Methodology\n", "alignment": "left", "unique_id": "91f0545a2754db999b0760a222106d59", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Experimental Methodology"}], "lineHeight": 0}}, "target": {"markdown": "### A. 实验方法学\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "82a1be2587e39994964ad3ffb88d20ed", "index": 131, "aliyun_index": 8, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Each reported metric represents the average of 100 iterations following a 10-iteration warm-up period to eliminate cold-start effects. Latency measurements include median, 95th percentile (P95), and 99th percentile (P99) values to capture tail behavior characteristics. Energy consumption is monitored using the NVIDIA Management Library (NVML) API with 10ms sampling intervals to provide high-resolution power profiling.  \n\n", "text": "Each reported metric represents the average of 100 iterations following a 10-iteration warm-up period to eliminate cold-start effects. Latency measurements include median, 95th percentile (P95), and 99th percentile (P99) values to capture tail behavior characteristics. Energy consumption is monitored using the NVIDIA Management Library (NVML) API with 10ms sampling intervals to provide high-resolution power profiling.\n", "alignment": "left", "unique_id": "82a1be2587e39994964ad3ffb88d20ed", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Each reported metric represents the average of 100 iterations following a 10-iteration warm-up period to eliminate cold-start effects. Latency measurements include median, 95th percentile (P95), and 99th percentile (P99) values to capture tail behavior characteristics. Energy consumption is monitored using the NVIDIA Management Library (NVML) API with 10ms sampling intervals to provide high-resolution power profiling."}], "lineHeight": 0}}, "target": {"markdown": "每个报告的指标均取自预热阶段（10 次迭代）之后 100 次迭代的平均值，以消除冷启动效应。延迟测量包含中位数、第 95 百分位（P95）以及第 99 百分位（P99）数值，以捕捉尾延迟特性。能耗通过 NVIDIA 管理库（NVML）API 进行监测，采样间隔为 10 毫秒，以提供高分辨率的功耗分析。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "327558f09aae0f4da55fdce2e9849c48", "index": 132, "aliyun_index": 9, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Software and environment. All experiments use CUDA 12.6 (B200 and H200), cuBLAS/cuBLASLt from  \n\n", "text": "Software and environment. All experiments use CUDA 12.6 (B200 and H200), cuBLAS/cuBLASLt from\n", "alignment": "left", "unique_id": "327558f09aae0f4da55fdce2e9849c48", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Software and environment. All experiments use CUDA 12.6 (B200 and H200), cuBLAS/cuBLASLt from"}], "lineHeight": 0}}, "target": {"markdown": "软件与环境。所有实验均使用 CUDA 12.6（B200 和 H200）以及来自", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "77d8d289a0e7dcc102b1fd2910138191", "index": 133, "aliyun_index": 10, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "the same toolkit, and PyTorch 2.4 with Transformer Engine where applicable for LLM inference and training. DGEMM and STREAM runs use the same CUDA driver (560.x) and compiler (nvcc 12.6). We report L2 cache hit rates (e.g., in Section VII.B) from NVIDIA Nsight Compute memory-workload analysis; the reported 68–84% range is derived from the 12tex_throughput and global memory throughput counters over the kernel execution.  \n\n", "text": "the same toolkit, and PyTorch 2.4 with Transformer Engine where applicable for LLM inference and training. DGEMM and STREAM runs use the same CUDA driver (560.x) and compiler (nvcc 12.6). We report L2 cache hit rates (e.g., in Section VII.B) from NVIDIA Nsight Compute memory-workload analysis; the reported 68–84% range is derived from the 12tex_throughput and global memory throughput counters over the kernel execution.\n", "alignment": "left", "unique_id": "77d8d289a0e7dcc102b1fd2910138191", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the same toolkit, and PyTorch 2.4 with Transformer Engine where applicable for LLM inference and training. DGEMM and STREAM runs use the same CUDA driver (560.x) and compiler (nvcc 12.6). We report L2 cache hit rates (e.g., in Section VII.B) from NVIDIA Nsight Compute memory-workload analysis; the reported 68–84% range is derived from the 12tex_throughput and global memory throughput counters over the kernel execution."}], "lineHeight": 0}}, "target": {"markdown": "同一工具包中的 cuBLAS/cuBLASLt 版本，并在适用的大语言模型推理与训练场景中搭配 PyTorch 2.4 与 Transformer Engine 使用。DGEMM 与 STREAM 测试运行于同一 CUDA 驱动（560.x）及编译器（nvcc 12.6）下。我们所报告的 L2 缓存命中率（如第 VII.B 节所示）来源于 NVIDIA Nsight Compute 的内存工作负载分析；所给出的 68%–84% 区间由内核执行过程中 `l1tex__throughput` 与全局内存吞吐量计数器推导得出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "8d381b4957460df7982ec7f62b61b35c", "index": 134, "aliyun_index": 11, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "### B. Large Language Model Inference\n", "text": "B. Large Language Model Inference\n", "alignment": "left", "unique_id": "8d381b4957460df7982ec7f62b61b35c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Large Language Model Inference"}], "lineHeight": 0}}, "target": {"markdown": "### B. 大语言模型推理\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "96dc35f6e2719d2118eaa00db98cb107", "index": 135, "aliyun_index": 12, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "1) Precision Mode Impact: We evaluate four quantization approaches to assess their impact on inference throughput and model quality: FP16 (baseline), FP8 (E4M3 with per-tensor dynamic), and FP4 (E2M1 weight-only with NVFP4 block-16, FP8 activations). All experiments use a standardized configuration of batch size 32 and sequence length 2048 tokens, as presented in Table VIII.  \n\n", "text": "1) Precision Mode Impact: We evaluate four quantization approaches to assess their impact on inference throughput and model quality: FP16 (baseline), FP8 (E4M3 with per-tensor dynamic), and FP4 (E2M1 weight-only with NVFP4 block-16, FP8 activations). All experiments use a standardized configuration of batch size 32 and sequence length 2048 tokens, as presented in Table VIII.\n", "alignment": "left", "unique_id": "96dc35f6e2719d2118eaa00db98cb107", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) Precision Mode Impact: We evaluate four quantization approaches to assess their impact on inference throughput and model quality: FP16 (baseline), FP8 (E4M3 with per-tensor dynamic), and FP4 (E2M1 weight-only with NVFP4 block-16, FP8 activations). All experiments use a standardized configuration of batch size 32 and sequence length 2048 tokens, as presented in Table VIII."}], "lineHeight": 0}}, "target": {"markdown": "1) 精度模式的影响：我们评估了四种量化方法，以分析其对推理吞吐量和模型质量的影响：FP16（基线）、FP8（采用按张量动态缩放的 E4M3），以及 FP4（采用 NVFP4 块大小 16 的 E2M1 仅权重量化，并使用 FP8 激活）。所有实验均采用表 VIII 所示的标准化配置，即批量大小为 32、序列长度为 2048 个词元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "c8e1b427da613ce13f69fc955737c28e", "index": 136, "aliyun_index": 13, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Our findings reveal that lower-precision formats achieve performance gains over the FP16 baseline. Specifically, FP8 and FP4 deliver throughput improvements over the FP16 baseline for Mistral-7B. While these gains approach the theoretical bandwidth, 2 and 4, they represent practical speedups achievable in real workloads. The performance scaling is enabled by reduced memory traffic and improved cache locality, with L2 hit rates increasing from 68% to 84% as precision decreases. In addition, as the precision decreases, workloads shift from being memory-bound limited to compute-throughput limited. This is evidenced by bandwidth utilization decreasing from 67.3% (FP16) to 47.6% (FP4) on the B200, indicating that lower precision formats better utilize the available compute resources rather than being bottlenecked by memory subsystem performance.  \n\n", "text": "Our findings reveal that lower-precision formats achieve performance gains over the FP16 baseline. Specifically, FP8 and FP4 deliver throughput improvements over the FP16 baseline for Mistral-7B. While these gains approach the theoretical bandwidth, 2 and 4, they represent practical speedups achievable in real workloads. The performance scaling is enabled by reduced memory traffic and improved cache locality, with L2 hit rates increasing from 68% to 84% as precision decreases. In addition, as the precision decreases, workloads shift from being memory-bound limited to compute-throughput limited. This is evidenced by bandwidth utilization decreasing from 67.3% (FP16) to 47.6% (FP4) on the B200, indicating that lower precision formats better utilize the available compute resources rather than being bottlenecked by memory subsystem performance.\n", "alignment": "left", "unique_id": "c8e1b427da613ce13f69fc955737c28e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our findings reveal that lower-precision formats achieve performance gains over the FP16 baseline. Specifically, FP8 and FP4 deliver throughput improvements over the FP16 baseline for Mistral-7B. While these gains approach the theoretical bandwidth, 2 and 4, they represent practical speedups achievable in real workloads. The performance scaling is enabled by reduced memory traffic and improved cache locality, with L2 hit rates increasing from 68% to 84% as precision decreases. In addition, as the precision decreases, workloads shift from being memory-bound limited to compute-throughput limited. This is evidenced by bandwidth utilization decreasing from 67.3% (FP16) to 47.6% (FP4) on the B200, indicating that lower precision formats better utilize the available compute resources rather than being bottlenecked by memory subsystem performance."}], "lineHeight": 0}}, "target": {"markdown": "我们的研究结果显示，相较于 FP16 基线，更低精度的格式能够带来性能提升。具体而言，在 Mistral-7B 上，FP8 和 FP4 相对于 FP16 基线均实现了吞吐量的提升。尽管这些性能增益接近理论上的带宽倍数（即 2 倍和 4 倍），但它们代表了实际工作负载中可达到的有效加速。性能扩展得益于内存流量的降低以及缓存局部性的改善：随着精度降低，L2 命中率从 68% 提升至 84%。此外，随着精度的降低，工作负载的性质从受内存带宽限制转变为受计算吞吐能力限制。证据在于 B200 上的带宽利用率从 FP16 时的 67.3% 下降到 FP4 时的 47.6%，这表明更低精度的格式能够更好地利用可用计算资源，而非受限于内存子系统的性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "f75047c6d840653925e63813103e5ad7", "index": 137, "aliyun_index": 14, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Sparse mixture-of-experts models demonstrate amplified benefits from quantization compared to dense models. For FP4 quantization, Mixtral-8x7B achieves  $ 2.69\\times $  throughput improvement (76,900 tok/s vs 31,033 tok/s FP16 baseline,) compared to  $ 2.50\\times $  for the dense Mistral-7B model. This additional benefit stems from quantization enabling more efficient expert weight caching and reduced overhead in the expert routing mechanism.  \n\n", "text": "Sparse mixture-of-experts models demonstrate amplified benefits from quantization compared to dense models. For FP4 quantization, Mixtral-8x7B achieves  $ 2.69\\times $  throughput improvement (76,900 tok/s vs 31,033 tok/s FP16 baseline,) compared to  $ 2.50\\times $  for the dense Mistral-7B model. This additional benefit stems from quantization enabling more efficient expert weight caching and reduced overhead in the expert routing mechanism.\n", "alignment": "left", "unique_id": "f75047c6d840653925e63813103e5ad7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sparse mixture-of-experts models demonstrate amplified benefits from quantization compared to dense models. For FP4 quantization, Mixtral-8x7B achieves  $ 2.69\\times $  throughput improvement (76,900 tok/s vs 31,033 tok/s FP16 baseline,) compared to  $ 2.50\\times $  for the dense Mistral-7B model. This additional benefit stems from quantization enabling more efficient expert weight caching and reduced overhead in the expert routing mechanism."}], "lineHeight": 0}}, "target": {"markdown": "稀疏混合专家（MoE）模型相较于稠密模型展现出更为显著的量化收益。在 FP4 量化下，Mixtral-8x7B 实现了 2.69 倍的吞吐量提升（76,900 tok/s，相比 FP16 基线的 31,033 tok/s），而稠密的 Mistral-7B 模型仅为 2.50 倍。这一额外收益源于量化使得专家权重缓存更为高效，并降低了专家路由机制中的开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "103a46c703d6b92714a2609f13b68b46", "index": 138, "aliyun_index": 15, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "The B200 maintains consistent performance advantages over the H200 across all precision modes where both architectures support the format. For both FP16 and FP8, the B200 delivers 1.57–1.59× higher throughput than the H200 (Table VIII, Section VI). This scaling factor is consistent with combined contributions from increased SM count (1.09×), enhanced tensor core efficiency (1.27×; see Table VII), and improved effective memory bandwidth (1.23×); we have not directly measured this decomposition.  \n\n", "text": "The B200 maintains consistent performance advantages over the H200 across all precision modes where both architectures support the format. For both FP16 and FP8, the B200 delivers 1.57–1.59× higher throughput than the H200 (Table VIII, Section VI). This scaling factor is consistent with combined contributions from increased SM count (1.09×), enhanced tensor core efficiency (1.27×; see Table VII), and improved effective memory bandwidth (1.23×); we have not directly measured this decomposition.\n", "alignment": "left", "unique_id": "103a46c703d6b92714a2609f13b68b46", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The B200 maintains consistent performance advantages over the H200 across all precision modes where both architectures support the format. For both FP16 and FP8, the B200 delivers 1.57–1.59× higher throughput than the H200 (Table VIII, Section VI). This scaling factor is consistent with combined contributions from increased SM count (1.09×), enhanced tensor core efficiency (1.27×; see Table VII), and improved effective memory bandwidth (1.23×); we have not directly measured this decomposition."}], "lineHeight": 0}}, "target": {"markdown": "B200 在两种架构均支持的所有精度模式下均保持对 H200 的稳定性能优势。在 FP16 和 FP8 两种精度下，B200 的吞吐量相较于 H200 提升了 1.57–1.59 倍（见表 VIII，第 6 章）。这一缩放系数与以下各因素的综合贡献保持一致：SM 数量的增加（1.09 倍）、张量核心效率的提升（1.27 倍；见表 VII）以及有效内存带宽的改善（1.23 倍）；但我们尚未对该分解进行直接测量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "811a34965cc65f5258255d06f33bcd2f", "index": 139, "aliyun_index": 16, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Lastly, while quantization delivers substantial performance benefits, it comes with measurable but often acceptable quality degradation. FP8 incurs minimal perplexity increases (+1.9% to +2.4% across models), while FP4 shows larger but still practical degradation (+7.7% to +9.1%)  \n\n", "text": "Lastly, while quantization delivers substantial performance benefits, it comes with measurable but often acceptable quality degradation. FP8 incurs minimal perplexity increases (+1.9% to +2.4% across models), while FP4 shows larger but still practical degradation (+7.7% to +9.1%)\n", "alignment": "left", "unique_id": "811a34965cc65f5258255d06f33bcd2f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Lastly, while quantization delivers substantial performance benefits, it comes with measurable but often acceptable quality degradation. FP8 incurs minimal perplexity increases (+1.9% to +2.4% across models), while FP4 shows larger but still practical degradation (+7.7% to +9.1%)"}], "lineHeight": 0}}, "target": {"markdown": "最后，尽管量化带来了显著的性能收益，但也会引入可量化、但通常可接受的模型质量下降。FP8 所导致的困惑度增幅极小（各模型在 +1.9% 至 +2.4% 之间），而 FP4 则产生了较大但仍属可接受范围内的质量下降（+7.7% 至 +9.1%）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "a973469f2b8f6c8597edc4a147b40ab1", "index": 140, "aliyun_index": 17, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "2) Batch Size Sensitivity: To understand the relationship between batch size and inference latency, we conducted a  \n\n", "text": "2) Batch Size Sensitivity: To understand the relationship between batch size and inference latency, we conducted a\n", "alignment": "left", "unique_id": "a973469f2b8f6c8597edc4a147b40ab1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Batch Size Sensitivity: To understand the relationship between batch size and inference latency, we conducted a"}], "lineHeight": 0}}, "target": {"markdown": "2) 批量大小的敏感性：为理解批量大小与推理延迟之间的关系，我们进行了", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "4aed940c2acc181b85d73c7d8d07b109", "index": 141, "aliyun_index": 0, "page_num": 8, "type": "table", "sub_type": "none", "markdown": "| Model | Precision | B200 tok/s | H200 tok/s | Speedup | B200 BW% | H200 BW% | Perplexity | $\\Delta$PPL |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Mistral-7B | FP16 | 56,028 | 28,500 | $1.97\\times$ | 67.3 | 71.2 | 6.82 | — |\n|  | FP8 | 57,125 | 49,200 | $1.16\\times$ | 58.4 | 62.8 | 6.95 | +1.9% |\n|  | FP4 | 112,800 | N/A | N/A | 47.6 | N/A | 7.38 | +8.2% |\n| Mixtral-8x7B | FP16 | 31,033 | 18,100 | $1.71\\times$ | 72.1 | 7 text": "TABLE IX"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "LATENCY VS. BATCH SIZE (MIXTRAL-8X7B, FP8, 2048 TOKENS)"}], "lineHeight": -44}}, "target": {"markdown": ">表 IX\n延迟与批量大小的关系（MIXTRAL-8X7B、FP8、2048 个词元）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "5d0d994ed4e0737bf15d8b56f219b2ef", "index": 145, "aliyun_index": 4, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "comprehensive analysis using Mixtral-8x7B in FP8 precision\nacross varying batch sizes. The results, presented in Table IX,\nreveal distinct operational modes in the inference pipeline.  \n\n", "text": "comprehensive analysis using Mixtral-8x7B in FP8 precision\nacross varying batch sizes. The results, presented in Table IX,\nreveal distinct operational modes in the inference pipeline.\n", "alignment": "left", "unique_id": "5d0d994ed4e0737bf15d8b56f219b2ef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "comprehensive analysis using Mixtral-8x7B in FP8 precision"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "across varying batch sizes. The results, presented in Table IX,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "reveal distinct operational modes in the inference pipeline."}], "lineHeight": -86}}, "target": {"markdown": "使用 Mixtral-8x7B 在 FP8 精度下，对不同批量大小进行了全面的分析。相关结果列于表 IX 中，揭示了推理流程中不同的运行模式。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "a10dd2b76ed07ae8e5bccfd02e5c0b7a", "index": 146, "aliyun_index": 5, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The B200 achieves superior performance improvements of $1.48 - 1.52\\times$ over the H200, exceeding the $1.44\\times$ improvement observed at higher batch sizes. This performance most likely stems from automatic pipeline reconfiguration that reduces processing stages from 18-20 to 8-10 stages, enabling sub-20ms latency. When at higher batch sizes, the system optimizes for maximum throughput rather than per-request latency, stabilizing the performance ratio at $1.44\\times$. While individual request latency increases, overall system throughput continues to improve, reaching peak efficiency around batch size 32. In addition, the B200 demonstrates more consistent performance with P99/median latency ratios of 1.12-1.14 compared to 1.23-1.38 for H200. Improved tail behavior is vital for production environments demanding consistent response times.  \n\n", "text": "The B200 achieves superior performance improvements of $1.48 - 1.52\\times$ over the H200, exceeding the $1.44\\times$ improvement observed at higher batch sizes. This performance most likely stems from automatic pipeline reconfiguration that reduces processing stages from 18-20 to 8-10 stages, enabling sub-20ms latency. When at higher batch sizes, the system optimizes for maximum throughput rather than per-request latency, stabilizing the performance ratio at $1.44\\times$. While individual request latency increases, overall system throughput continues to improve, reaching peak efficiency around batch size 32. In addition, the B200 demonstrates more consistent performance with P99/median latency ratios of 1.12-1.14 compared to 1.23-1.38 for H200. Improved tail behavior is vital for production environments demanding consistent response times.\n", "alignment": "left", "unique_id": "a10dd2b76ed07ae8e5bccfd02e5c0b7a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The B200 achieves superior performance improvements of $1.48 - 1.52\\times$ over the H200, exceeding the $1.44\\times$ improvement observed at higher batch sizes. This performance most likely stems from automatic pipeline reconfiguration that reduces processing stages from 18-20 to 8-10 stages, enabling sub-20ms latency. When at higher batch sizes, the system optimizes for maximum throughput rather than per-request latency, stabilizing the performance ratio at $1.44\\times$. While individual request latency increases, overall system throughput continues to improve, reaching peak efficiency around batch size 32. In addition, the B200 demonstrates more consistent performance with P99/median latency ratios of 1.12-1.14 compared to 1.23-1.38 for H200. Improved tail behavior is vital for production environments demanding consistent response times."}], "lineHeight": 0}}, "target": {"markdown": "B200 相较于 H200 取得了 $1.48 - 1.52\\times$ 的更优性能提升，超过了在较大批量大小下观察到的 $1.44\\times$ 性能提升幅度。此项性能提升很可能源于自动化的流水线重构机制，该机制将处理阶段从 18-20 个缩减至 8-10 个，从而实现了低于 20 毫秒的延迟。在较大批量大小下，系统则针对最大吞吐量而非单请求延迟进行优化，使性能比稳定在 $1.44\\times$。尽管此时单个请求的延迟会增加，但系统的整体吞吐量仍在持续提升，并在批量大小为 32 左右达到峰值效率。此外，B200 展现出更为稳定的性能表现，其 P99 延迟与中位数延迟之比为 1.12-1.14，而 H200 的该比值为 1.23-1.38。尾延迟特性的改善对于要求响应时间稳定的生产环境至关重要。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "243194feab8e5bd0212637c309308920", "index": 147, "aliyun_index": 6, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "### C. Scientific Computing Workload\n", "text": "C. Scientific Computing Workload\n", "alignment": "left", "unique_id": "243194feab8e5bd0212637c309308920", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "C. Scientific Computing Workload"}], "lineHeight": 0}}, "target": {"markdown": "### C. 科学计算工作负载\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "5fb5d21a526afc693835f08ad2632f12", "index": 148, "aliyun_index": 7, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "1) FP64 Performance: Scientific computing applications present fundamentally different computational characteristics compared to deep learning workloads, needing high-precision arithmetic, sustainable memory bandwidth, and irregular access patterns. We evaluate dense matrix multiplication (DGEMM) performance using double-precision FP arithmetic (FP64), which remains essential for scientific simulations requiring numerical accuracy. Table XII presents our results across varying matrix dimensions. The B200 achieves 36.3 TFLOPS at large matrix size, representing 80.7% utilization of its 40 TFLOPS theoretical peak [31], compared to the H200's 18.9 TFLOPS (55.6% of 34 TFLOPS). PTX tcgen05.mma does not support FP64 (documented precisions are tf32, f16/bf16, i8/u8, and f4/f6/f8), so FP64 DGEMM uses a different execution path. The additional 45% efficiency improvement ($1.92/1.32 = 1.45\\times$) is attributed to doubled FP64 units and improved memory access coalescing.  \n\n", "text": "1) FP64 Performance: Scientific computing applications present fundamentally different computational characteristics compared to deep learning workloads, needing high-precision arithmetic, sustainable memory bandwidth, and irregular access patterns. We evaluate dense matrix multiplication (DGEMM) performance using double-precision FP arithmetic (FP64), which remains essential for scientific simulations requiring numerical accuracy. Table XII presents our results across varying matrix dimensions. The B200 achieves 36.3 TFLOPS at large matrix size, representing 80.7% utilization of its 40 TFLOPS theoretical peak [31], compared to the H200's 18.9 TFLOPS (55.6% of 34 TFLOPS). PTX tcgen05.mma does not support FP64 (documented precisions are tf32, f16/bf16, i8/u8, and f4/f6/f8), so FP64 DGEMM uses a different execution path. The additional 45% efficiency improvement ($1.92/1.32 = 1.45\\times$) is attributed to doubled FP64 units and improved memory access coalescing.\n", "alignment": "left", "unique_id": "5fb5d21a526afc693835f08ad2632f12", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) FP64 Performance: Scientific computing applications present fundamentally different computational characteristics compared to deep learning workloads, needing high-precision arithmetic, sustainable memory bandwidth, and irregular access patterns. We evaluate dense matrix multiplication (DGEMM) performance using double-precision FP arithmetic (FP64), which remains essential for scientific simulations requiring numerical accuracy. Table XII presents our results across varying matrix dimensions. The B200 achieves 36.3 TFLOPS at large matrix size, representing 80.7% utilization of its 40 TFLOPS theoretical peak [31], compared to the H200's 18.9 TFLOPS (55.6% of 34 TFLOPS). PTX tcgen05.mma does not support FP64 (documented precisions are tf32, f16/bf16, i8/u8, and f4/f6/f8), so FP64 DGEMM uses a different execution path. The additional 45% efficiency improvement ($1.92/1.32 = 1.45\\times$) is attributed to doubled FP64 units and improved memory access coalescing."}], "lineHeight": 0}}, "target": {"markdown": "1) FP64 性能：与深度学习工作负载相比，科学计算应用呈现出根本不同的计算特征，需要高精度算术运算、可持续的内存带宽以及不规则的访存模式。我们采用双精度 FP 算术（FP64）对稠密矩阵乘法（DGEMM）的性能进行了评估，而 FP64 对于需要数值精度的科学仿真而言仍然不可或缺。表 XII 给出了不同矩阵规模下的测试结果。在较大矩阵规模下，B200 达到了 36.3 TFLOPS 的性能，相对于其 40 TFLOPS 的理论峰值实现了 80.7% 的利用率 [31]；相比之下，H200 为 18.9 TFLOPS（34 TFLOPS 理论峰值的 55.6%）。PTX 指令 `tcgen05.mma` 不支持 FP64（其文档化支持的数据精度包括 tf32、f16/bf16、i8/u8 以及 f4/f6/f8），因此 FP64 DGEMM 采用了一条不同的执行路径。额外的 45% 效率提升（$1.92/1.32 = 1.45\\times$）归因于 FP64 计算单元数量翻倍以及内存访问合并（coalescing）机制的改进。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "f8a659404717e1efd3e106e267cedf50", "index": 149, "aliyun_index": 8, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "2) Sustained Memory Bandwidth: Memory-intensive scientific applications require sustained high-bandwidth data  \n\n", "text": "2) Sustained Memory Bandwidth: Memory-intensive scientific applications require sustained high-bandwidth data\n", "alignment": "left", "unique_id": "f8a659404717e1efd3e106e267cedf50", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Sustained Memory Bandwidth: Memory-intensive scientific applications require sustained high-bandwidth data"}], "lineHeight": 0}}, "target": {"markdown": "2) 持续内存带宽：内存密集型的科学应用需要持续的高带宽数据", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "60ccea2fabdd9208f695a2826ddc9cea", "index": 150, "aliyun_index": 9, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "movement capabilities. We employ the STREAM Triad benchmark to measure achievable memory bandwidth. Table XIII reports results from our B200 runs. Triad ck_id": "2d5af6267f46572883049e0711064823", "index": 169, "aliyun_index": 12, "page_num": 9, "type": "table_note", "sub_type": "none", "markdown": ">STREAM TRIAD MEMORY BANDWIDTH. MEASURED ON B200 WITH\n4 GB AND 16 GB ARRAY SIZES; PEAK 8 TB/S.  \n\n", "text": "STREAM TRIAD MEMORY BANDWIDTH. MEASURED ON B200 WITH\n4 GB AND 16 GB ARRAY SIZES; PEAK 8 TB/S.\n", "alignment": "left", "unique_id": "2d5af6267f46572883049e0711064823", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "STREAM TRIAD MEMORY BANDWIDTH. MEASURED ON B200 WITH"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4 GB AND 16 GB ARRAY SIZES; PEAK 8 TB/S."}], "lineHeight": -45}}, "target": {"markdown": ">STREAM Triad 内存带宽。在 B200 上使用 4 GB 和 16 GB 数组大小测量；峰值 8 TB/s。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "dcfe0035d7722d2aacf1791954eabc4c", "index": 170, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "1/C scaling), so DE use is most beneficial when decompressed output, not input bandwidth, is the bottleneck. (3) PTX tcgen05.mma does not support FP64; FP64 DGEMM uses a different path (e.g., doubled FP64 units), so TMEM does not directly improve FP64 scientific kernels.  \n\n", "text": "1/C scaling), so DE use is most beneficial when decompressed output, not input bandwidth, is the bottleneck. (3) PTX tcgen05.mma does not support FP64; FP64 DGEMM uses a different path (e.g., doubled FP64 units), so TMEM does not directly improve FP64 scientific kernels.\n", "alignment": "left", "unique_id": "dcfe0035d7722d2aacf1791954eabc4c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1/C scaling), so DE use is most beneficial when decompressed output, not input bandwidth, is the bottleneck. (3) PTX tcgen05.mma does not support FP64; FP64 DGEMM uses a different path (e.g., doubled FP64 units), so TMEM does not directly improve FP64 scientific kernels."}], "lineHeight": 0}}, "target": {"markdown": "1/C scaling)，因此当解压缩后的输出（而非输入带宽）成为瓶颈时，使用 DE 最为有益。(3) PTX `tcgen05.mma` 不支持 FP64；FP64 DGEMM 使用不同的路径（例如双倍 FP64 单元），因此 TMEM 并不能直接提升 FP64 科学计算内核的性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "87b0b2aa7ce8c3eeffd6255a96280c38", "index": 171, "aliyun_index": 14, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Software Ecosystem:** CUDA 13.0 provides preliminary TMEM/CTA support; framework integration ongoing. FP6 hardware support exists but lacks software tooling. FP4/FP6 require per-layer precision selection—8.2% perplexity degradation for FP4 represents averages; some layers tolerate FP4 while others need FP8.  \n\n", "text": "**Software Ecosystem:** CUDA 13.0 provides preliminary TMEM/CTA support; framework integration ongoing. FP6 hardware support exists but lacks software tooling. FP4/FP6 require per-layer precision selection—8.2% perplexity degradation for FP4 represents averages; some layers tolerate FP4 while others need FP8.\n", "alignment": "left", "unique_id": "87b0b2aa7ce8c3eeffd6255a96280c38", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Software Ecosystem:** CUDA 13.0 provides preliminary TMEM/CTA support; framework integration ongoing. FP6 hardware support exists but lacks software tooling. FP4/FP6 require per-layer precision selection—8.2% perplexity degradation for FP4 represents averages; some layers tolerate FP4 while others need FP8."}], "lineHeight": 0}}, "target": {"markdown": "**软件生态：** CUDA 13.0 提供了初步的 TMEM/CTA 支持；框架集成工作仍在进行中。FP6 硬件支持已经存在，但缺乏配套的软件工具。FP4/FP6 需要按层选择精度——FP4 造成的 8.2% 困惑度下降为平均值；某些层可以容忍 FP4，而另一些层则需要 FP8。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "9a6aff720e57ed2fa5aa3c494d13a075", "index": 172, "aliyun_index": 15, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Performance guidelines.** We consolidate actionable recommendations: (a) Use TMEM for accumulator staging and multi-stage tensor pipelines (e.g., fused attention $\\mathbf{QK}^T$ then softmax then value) when working sets exceed L1; for single-shot small matrices, minimize TMEM round-trips. (b) Scale DE usage with compression ratio: expect $\\sim$170–220 GB/s decompressed output; compressed input rate scales inversely with ratio. (c) Leverage warp-level tcgen05.mma and CTA-pair execution for GEMM and LLM inference; target $64\\times64$ tiles for TMEM. (d) For LLM inference, FP8 balances throughput and quality; FP4 yields higher throughput with  \n\n", "text": "**Performance guidelines.** We consolidate actionable recommendations: (a) Use TMEM for accumulator staging and multi-stage tensor pipelines (e.g., fused attention $\\mathbf{QK}^T$ then softmax then value) when working sets exceed L1; for single-shot small matrices, minimize TMEM round-trips. (b) Scale DE usage with compression ratio: expect $\\sim$170–220 GB/s decompressed output; compressed input rate scales inversely with ratio. (c) Leverage warp-level tcgen05.mma and CTA-pair execution for GEMM and LLM inference; target $64\\times64$ tiles for TMEM. (d) For LLM inference, FP8 balances throughput and quality; FP4 yields higher throughput with\n", "alignment": "left", "unique_id": "9a6aff720e57ed2fa5aa3c494d13a075", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Performance guidelines.** We consolidate actionable recommendations: (a) Use TMEM for accumulator staging and multi-stage tensor pipelines (e.g., fused attention $\\mathbf{QK}^T$ then softmax then value) when working sets exceed L1; for single-shot small matrices, minimize TMEM round-trips. (b) Scale DE usage with compression ratio: expect $\\sim$170–220 GB/s decompressed output; compressed input rate scales inversely with ratio. (c) Leverage warp-level tcgen05.mma and CTA-pair execution for GEMM and LLM inference; target $64\\times64$ tiles for TMEM. (d) For LLM inference, FP8 balances throughput and quality; FP4 yields higher throughput with"}], "lineHeight": 0}}, "target": {"markdown": "**性能指南。** 我们归纳了以下可操作的建议：(a) 当工作集超过 L1 容量时，应使用 TMEM 进行累加器暂存和多阶段张量流水线（例如，将融合注意力中的 $\\mathbf{QK}^T$、softmax 与 value 计算串联）；对于单次执行的小矩阵，应尽量减少 TMEM 来回往返的开销。(b) DE 的使用应随压缩比进行缩放：解压缩输出约可达 170–220 GB/s；压缩输入速率则与压缩比成反比。(c) 利用 warp 级 `tcgen05.mma` 与 CTA 对协作执行来进行 GEMM 和 LLM 推理；针对 TMEM 优选 $64\\times64$ 的 tile。(d) 对于 LLM 推理，FP8 在吞吐与质量之间提供了良好平衡；FP4 可获得更高吞吐量，但", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 172}, {"source": {"block_id": "b70be267575fd4f219145cebd5918714", "index": 173, "aliyun_index": 16, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "acceptable perplexity increase when validated per model.  \n\n", "text": "acceptable perplexity increase when validated per model.\n", "alignment": "left", "unique_id": "b70be267575fd4f219145cebd5918714", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "acceptable perplexity increase when validated per model."}], "lineHeight": 0}}, "target": {"markdown": "需要在验证后可接受一定的困惑度上升。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 173}, {"source": {"block_id": "603f553ce111c25464597ed6e51e2f65", "index": 174, "aliyun_index": 17, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Deployment:** For LLM inference, B200 provides 1.8–3.9× advantages; FP4 practical for 70B models. Training improvements (1.85× ResNet-50, 1.55× GPT-1.3B) enable larger batches. HPC gains (1.92× FP64) competitive for scientific computing.  \n\n", "text": "**Deployment:** For LLM inference, B200 provides 1.8–3.9× advantages; FP4 practical for 70B models. Training improvements (1.85× ResNet-50, 1.55× GPT-1.3B) enable larger batches. HPC gains (1.92× FP64) competitive for scientific computing.\n", "alignment": "left", "unique_id": "603f553ce111c25464597ed6e51e2f65", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Deployment:** For LLM inference, B200 provides 1.8–3.9× advantages; FP4 practical for 70B models. Training improvements (1.85× ResNet-50, 1.55× GPT-1.3B) enable larger batches. HPC gains (1.92× FP64) competitive for scientific computing."}], "lineHeight": 0}}, "target": {"markdown": "**部署：** 对于 LLM 推理，B200 提供了 1.8–3.9× 的优势；FP4 可实际应用于 70B 规模的模型。训练方面的提升（ResNet-50 1.85×、GPT-1.3B 1.55×）支持使用更大的批次规模。HPC 方面的增益（FP64 1.92×）在科学计算领域具有相当的竞争力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 174}, {"source": {"block_id": "b9ff153889c94090e3daf915888262d6", "index": 175, "aliyun_index": 18, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## IX. Conclusion\n", "text": "IX. Conclusion\n", "alignment": "left", "unique_id": "b9ff153889c94090e3daf915888262d6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "IX. Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "## IX. 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 175}, {"source": {"block_id": "2961f88717183b11aa98c0d545ba662f", "index": 176, "aliyun_index": 19, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "NVIDIA's B200 GPU marks a major shift in GPU architectures. Our work presents the first detailed microbenchmark suite-based characterization of the NVIDIA Blackwell B200 GPU. Our work offers insights into its architectural innovations and performance behavior. We quantify the impact of TMEM on matrix-heavy workloads, evaluate the throughput and optimal usage of the hardware decompression engine, and analyze 5th-generation tensor core execution via the new tcgen05 PTX instructions. Our study further assesses FP4 and FP6 precision trade-offs, benchmarks Blackwell across diverse workloads—including LLM inference, scientific kernels, and mixed-precision training—and distills actionable performance guidelines for developers targeting this next-generation architecture. Our experiments primarily exercised single-die behavior; dual-die (NV-HBI) interactions and cross-die latency remain as future work.  \n\n", "text": "NVIDIA's B200 GPU marks a major shift in GPU architectures. Our work presents the first detailed microbenchmark suite-based characterization of the NVIDIA Blackwell B200 GPU. Our work offers insights into its architectural innovations and performance behavior. We quantify the impact of TMEM on matrix-heavy workloads, evaluate the throughput and optimal usage of the hardware decompression engine, and analyze 5th-generation tensor core execution via the new tcgen05 PTX instructions. Our study further assesses FP4 and FP6 precision trade-offs, benchmarks Blackwell across diverse workloads—including LLM inference, scientific kernels, and mixed-precision training—and distills actionable performance guidelines for developers targeting this next-generation architecture. Our experiments primarily exercised single-die behavior; dual-die (NV-HBI) interactions and cross-die latency remain as future work.\n", "alignment": "left", "unique_id": "2961f88717183b11aa98c0d545ba662f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA's B200 GPU marks a major shift in GPU architectures. Our work presents the first detailed microbenchmark suite-based characterization of the NVIDIA Blackwell B200 GPU. Our work offers insights into its architectural innovations and performance behavior. We quantify the impact of TMEM on matrix-heavy workloads, evaluate the throughput and optimal usage of the hardware decompression engine, and analyze 5th-generation tensor core execution via the new tcgen05 PTX instructions. Our study further assesses FP4 and FP6 precision trade-offs, benchmarks Blackwell across diverse workloads—including LLM inference, scientific kernels, and mixed-precision training—and distills actionable performance guidelines for developers targeting this next-generation architecture. Our experiments primarily exercised single-die behavior; dual-die (NV-HBI) interactions and cross-die latency remain as future work."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA 的 B200 GPU 标志着 GPU 架构的一次重大变革。我们的工作首次基于微基准测试套件，对 NVIDIA Blackwell B200 GPU 进行了详尽的特性刻画。本文深入分析了其架构创新与性能表现，量化了 TMEM 对矩阵密集型工作负载的影响，评估了硬件解压缩引擎的吞吐能力与最佳使用方式，并通过新增的 `tcgen05` PTX 指令分析了第五代 Tensor Core 的执行情况。此外，我们的研究还考察了 FP4 与 FP6 精度之间的权衡，在多样化的负载（包括 LLM 推理、科学计算内核以及混合精度训练）上对 Blackwell 进行了基准测试，并为面向这一下一代架构的开发者提炼出切实可行的性能指南。我们的实验主要针对单芯片行为展开；双芯片（NV-HBI）交互与跨芯片延迟则留作未来工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 176}, {"source": {"block_id": "bfbea81a75214b9ac77b94e151b99e3a", "index": 177, "aliyun_index": 20, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## ACKNOWLEDGMENT\n", "text": "ACKNOWLEDGMENT\n", "alignment": "left", "unique_id": "bfbea81a75214b9ac77b94e151b99e3a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ACKNOWLEDGMENT"}], "lineHeight": 0}}, "target": {"markdown": "## 致谢\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 177}, {"source": {"block_id": "78cf0163219f9b189c274c77b1d0a75f", "index": 178, "aliyun_index": 21, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "This research used resources from the NVIDIA Brev Cloud\nCompute and the Google Cloud Provider. This material is  \n\n", "text": "This research used resources from the NVIDIA Brev Cloud\nCompute and the Google Cloud Provider. This material is\n", "alignment": "left", "unique_id": "78cf0163219f9b189c274c77b1d0a75f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This research used resources function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){
  const cells = line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
  return cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()) || c.trim()==='');
}
function isPipeRow(line){ return /\|/.test(line); }
function rowCells(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
}
function tableHtml(rows){
  if (!rows.length) return '';
  let html = '<table><thead><tr>';
  for (const c of rowCells(rows[0])) html += `<th>${inlineMd(c)}</th>`;
  html += '</tr></thead><tbody>';
  const start = (rows.length>1 && isSepRow(rows[1])) ? 2 : 1;
  for (let i=start;i<rows.length;i++){
    if (isSepRow(rows[i])) continue;
    html += '<tr>';
    for (const c of rowCells(rows[i])) html += `<td>${inlineMd(c)}</td>`;
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){
  const slots = [];
  let raw = String(t||'');
  raw = raw.replace(/\$\$([\s\S]+?)\$\$/g, (_,m) => {
    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i].trim())){
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;
      }
      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*[-*•]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);
}

const foldedIds = new Set();
function outlineTree(list){
  const root = [];
  const stack = [];
  (list||[]).forEach(e => {
    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();

}
