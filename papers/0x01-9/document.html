r": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "III. BLACKWELL ARCHITECTURE"}], "lineHeight": 0}}, "target": {"markdown": "## III. BLACKWELL 架构\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "bbf24b29164f5824e8077eaaf623ae90", "index": 31, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In this Section, we introduce the architecture of the data center NVIDIA B200 GPU, based on the NVIDIA Blackwell Architecture, and then detail the divergence from prior designs.  \n\n", "text": "In this Section, we introduce the architecture of the data center NVIDIA B200 GPU, based on the NVIDIA Blackwell Architecture, and then detail the divergence from prior designs.\n", "alignment": "left", "unique_id": "bbf24b29164f5824e8077eaaf623ae90", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this Section, we introduce the architecture of the data center NVIDIA B200 GPU, based on the NVIDIA Blackwell Architecture, and then detail the divergence from prior designs."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们将介绍基于 NVIDIA Blackwell 架构的数据中心级 NVIDIA B200 GPU 架构，并详细阐述其与先前设计之间的差异。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "f698ac885279e55709e9fdda88034e62", "index": 32, "aliyun_index": 14, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "### A. Blackwell Architecture\n", "text": "A. Blackwell Architecture\n", "alignment": "left", "unique_id": "f698ac885279e55709e9fdda88034e62", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Blackwell Architecture"}], "lineHeight": 0}}, "target": {"markdown": "### A. Blackwell 架构\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "30a5b3abf602d60d4ae32e96804315e2", "index": 33, "aliyun_index": 15, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The B200 GPU signifies a decisive progression in architectural philosophy. Previously, GPU generations from Tesla to Hopper focused on maximizing floating-point operations per second (FLOPS) for large-scale model training. In contrast, Blackwell emphasizes post-training and inference efficiency, adopting transformational changes in both memory and compute organization. One B200 GPU includes a dual-die configuration [3] where two GPU dies comprise 208 billion transistors, feature 148 SMs spread across eight GPCs, provide four L2 cache partitions (double those in Hopper), and include eight HBM3e memory stacks. Though physically partitioned, both dies are unified by the NVIDIA High-Bandwidth Interface (NV-HBI) providing a coherent and single device to software, with unified 192 GB HBM3e memory space.  \n\n", "text": "The B200 GPU signifies a decisive progression in architectural philosophy. Previously, GPU generations from Tesla to Hopper focused on maximizing floating-point operations per second (FLOPS) for large-scale model training. In contrast, Blackwell emphasizes post-training and inference efficiency, adopting transformational changes in both memory and compute organization. One B200 GPU includes a dual-die configuration [3] where two GPU dies comprise 208 billion transistors, feature 148 SMs spread across eight GPCs, provide four L2 cache partitions (double those in Hopper), and include eight HBM3e memory stacks. Though physically partitioned, both dies are unified by the NVIDIA High-Bandwidth Interface (NV-HBI) providing a coherent and single device to software, with unified 192 GB HBM3e memory space.\n", "alignment": "left", "unique_id": "30a5b3abf602d60d4ae32e96804315e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The B200 GPU signifies a decisive progression in architectural philosophy. Previously, GPU generations from Tesla to Hopper focused on maximizing floating-point operations per second (FLOPS) for large-scale model training. In contrast, Blackwell emphasizes post-training and inference efficiency, adopting transformational changes in both memory and compute organization. One B200 GPU includes a dual-die configuration [3] where two GPU dies comprise 208 billion transistors, feature 148 SMs spread across eight GPCs, provide four L2 cache partitions (double those in Hopper), and include eight HBM3e memory stacks. Though physically partitioned, both dies are unified by the NVIDIA High-Bandwidth Interface (NV-HBI) providing a coherent and single device to software, with unified 192 GB HBM3e memory space."}], "lineHeight": 0}}, "target": {"markdown": "B200 GPU 标志着架构理念的一次决定性演进。此前，从 Tesla 到 Hopper 的 GPU 世代主要聚焦于为大规模模型训练最大化每秒浮点运算次数（FLOPS）。相比之下，Blackwell 着重提升训练后及推理效率，在内存与计算组织方面均采用了变革性的设计。单颗 B200 GPU 采用双芯粒（dual-die）配置 [3]：两颗 GPU 芯片共计集成了 2080 亿晶体管，包含 148 个流式多处理器（SM），分布于 8 个图形处理集群（GPC）中，提供 4 个 L2 缓存分区（数量为 Hopper 的两倍），并配备 8 个 HBM3e 内存堆栈。尽管物理上被划分为两个芯片，但二者通过 NVIDIA 高带宽互连（NV-HBI）实现统一，对软件呈现为一个连贯的单一设备，并具备统一的 192 GB HBM3e 内存空间。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "4125f6aaed91d1d6c3abe307cfeadcd1", "index": 34, "aliyun_index": 16, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Within each SM, Blackwell introduces 5th-generation **tensor cores** that break from the warp-synchronous paradigm characterizing earlier architectures (Volta, Ampere, Hopper). Previous generations enforced that all 32 threads within a warp synchronize before executing matrix multiply-accumulate (MMA) operations via the `mma.sync` or `wgmma` instructions. This lock-step model reduced scheduling flexibility and created idle cycles, especially for dependency chains of varying lengths.  \n\n", "text": "Within each SM, Blackwell introduces 5th-generation **tensor cores** that break from the warp-synchronous paradigm characterizing earlier architectures (Volta, Ampere, Hopper). Previous generations enforced that all 32 threads within a warp synchronize before executing matrix multiply-accumulate (MMA) operations via the `mma.sync` or `wgmma` instructions. This lock-step model reduced scheduling flexibility and created idle cycles, especially for dependency chains of varying lengths.\n", "alignment": "left", "unique_id": "4125f6aaed91d1d6c3abe307cfeadcd1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Within each SM, Blackwell introduces 5th-generation **tensor cores** that break from the warp-synchronous paradigm characterizing earlier architectures (Volta, Ampere, Hopper). Previous generations enforced that all 32 threads within a warp synchronize before executing matrix multiply-accumulate (MMA) operations via the `mma.sync` or `wgmma` instructions. This lock-step model reduced scheduling flexibility and created idle cycles, especially for dependency chains of varying lengths."}], "lineHeight": 0}}, "target": {"markdown": "在每个 SM 内部，Blackwell 引入了第五代**张量核心（tensor cores）**，打破了早期架构（Volta、Ampere、Hopper）所固有的 warp 同步范式。先前各代强制要求 warp 内全部 32 个线程通过 `mma.sync` 或 `wgmma` 指令在执行矩阵乘累加（MMA）操作前进行同步。这种锁步执行模式降低了调度灵活性，并产生了空闲周期，尤其在不同长度的依赖链场景下更为明显。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "7041755f233be5c31444161ae2ae33b3", "index": 35, "aliyun_index": 17, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Blackwell replaces warp-synchronous MMA with tcgen05.mma, a single-thread instruction. Now, each thread independently issues MMA operations, removing warp-level synchronization and enabling true per-thread scheduling for tensor operations. Operands are now supplied from shared memory (SMEM) and a new memory pathway: Tensor Memory (TMEM). Per SM, the TMEM provides memory access to and from tensor cores. Allocation, data movement, and deallocation are explicitly managed in software via the tcgen PTX set of instructions, giving  \n\n", "text": "Blackwell replaces warp-synchronous MMA with tcgen05.mma, a single-thread instruction. Now, each thread independently issues MMA operations, removing warp-level synchronization and enabling true per-thread scheduling for tensor operations. Operands are now supplied from shared memory (SMEM) and a new memory pathway: Tensor Memory (TMEM). Per SM, the TMEM provides memory access to and from tensor cores. Allocation, data movement, and deallocation are explicitly managed in software via the tcgen PTX set of instructions, giving\n", "alignment": "left", "unique_id": "7041755f233be5c31444161ae2ae33b3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Blackwell replaces warp-synchronous MMA with tcgen05.mma, a single-thread instruction. Now, each thread independently issues MMA operations, removing warp-level synchronization and enabling true per-thread scheduling for tensor operations. Operands are now supplied from shared memory (SMEM) and a new memory pathway: Tensor Memory (TMEM). Per SM, the TMEM provides memory access to and from tensor cores. Allocation, data movement, and deallocation are explicitly managed in software via the tcgen PTX set of instructions, giving"}], "lineHeight": 0}}, "target": {"markdown": "Blackwell 以单线程指令 `tcgen05.mma` 取代了 warp 同步的 MMA 机制。如今，每个线程可独立发起 MMA 调用，不再需要 warp 级别的同步，从而实现了张量操作的真正逐线程调度。操作数现在由共享内存（SMEM）以及一条新的内存通路——张量内存（Tensor Memory, TMEM）共同提供。在每个 SM 内部，TMEM 为张量核心提供内存读写访问。其分配、数据搬移与释放均由软件通过 tcgen PTX 指令集显式管理，从而为", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "a0fe453b564771188a5515385eea9272", "index": 36, "aliyun_index": 0, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![a0fe453b564771188a5515385eea9272.jpg](figures/a0fe453b564771188a5515385eea9272_f59f05d6.jpeg)  \n\n", "text": "  SMEM → RF (each mma) → Tensor Cores → RF\n  \n  SMEM ─B──→ Tensor Cores ←──A── RMEM\n                ↓ D\n                RF\n  \n  SMEM ─B──→ Tensor Cores ←──A── TMEM\n                ↓ D\n                TMEM\n  \n\n\n- **组件说明**：\n  - `SMEM`：共享内存，通过路径 B 输入\n  - `TMEM`：张量内存（Tensor Memory），新型专用内存单元，既作为输入源（路径 A）也作为输出目标（路径 D）\n  - `Tensor Cores`：执行计算\n  - 无传统 RF，由 TMEM 替代部分功能\n\n> 注：此架构强调“单线程每MMA”，暗示更细粒度控制与更高并行效率；TMEM 是关键创新点。\n\n---\n\n## 总结对比表\n\n| 特性             | Volta-Ampere         | wgmma               | tcgen05.mma          |\n|------------------|----------------------|---------------------|----------------------|\n| Threads per MMA  | 8 (Volta), 1 warp    | 4 warps             | 1 thread             |\n| Input Sources    | SMEM → RF            | SMEM + RMEM         | SMEM + TMEM          |\n| Output Target    | RF                   | RF                  | TMEM                 |\n| Special Memory   | None                 | RMEM (optional?)    | TMEM (dedicated)     |\n| Architecture Focus | Warp-level           | Warp-group level    | Thread-level + TMEM  |\n\n---\n\n✅ 所有标签、箭头方向、注释文字均已完整保留并结构化呈现。  \n 图中未明确标注的缩写（如 RMEM, TMEM）按上下文合理推断其含义，并在说明中标注。\n\n--- \n\n如需进一步解析某一部分或生成可视化代码（如 Mermaid 流程图），可继续提出需求。", "alignment": "left", "unique_id": "a0fe453b564771188a5515385eea9272", "edited": false, "extra": {}}, "target": {"markdown": "![a0fe453b564771188a5515385eea9272.jpg](figures/a0fe453b564771188a5515385eea9272_f59f05d6.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "309fd25c129c53d1dfc8e5e572e14ca2", "index": 37, "aliyun_index": 1, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 2. Tensor Core instruction pipeline for tcgen05, wgmma, and Volta/\nAmpere architectures.  \n\n", "text": "Fig. 2. Tensor Core instruction pipeline for tcgen05, wgmma, and Volta/\nAmpere architectures.\n", "alignment": "left", "unique_id": "309fd25c129c53d1dfc8e5e572e14ca2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 2. Tensor Core instruction pipeline for tcgen05, wgmma, and Volta/"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Ampere architectures."}], "lineHeight": -46}}, "target": {"markdown": ">图 2. tcgen05、wgmma 以及 Volta/Ampere 架构的张量核心指令流水线。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "fb16f966c34556087e6a188479c293d6", "index": 38, "aliyun_index": 2, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "compiler toolchains precise control over tile locality and\ntraffic patterns.  \n\n", "text": "compiler toolchains precise control over tile locality and\ntraffic patterns.\n", "alignment": "left", "unique_id": "fb16f966c34556087e6a188479c293d6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compiler toolchains precise control over tile locality and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "traffic patterns."}], "lineHeight": -54}}, "target": {"markdown": "编译器工具链能够对分片局部性及数据访问模式进行精确控制。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "bc1717ddca1af715eed536090e11a0b4", "index": 39, "aliyun_index": 3, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The flexibility of independent MMA dispatch reduces idle cycles and exposes optimization opportunities for the compiler, though it also raises questions on new performance limits: instruction latency under dependency, concurrency of tensor core usage, and pipeline saturation. These remain undocumented in vendor literature and are explored in our systematic characterization.  \n\n", "text": "The flexibility of independent MMA dispatch reduces idle cycles and exposes optimization opportunities for the compiler, though it also raises questions on new performance limits: instruction latency under dependency, concurrency of tensor core usage, and pipeline saturation. These remain undocumented in vendor literature and are explored in our systematic characterization.\n", "alignment": "left", "unique_id": "bc1717ddca1af715eed536090e11a0b4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The flexibility of independent MMA dispatch reduces idle cycles and exposes optimization opportunities for the compiler, though it also raises questions on new performance limits: instruction latency under dependency, concurrency of tensor core usage, and pipeline saturation. These remain undocumented in vendor literature and are explored in our systematic characterization."}], "lineHeight": 0}}, "target": {"markdown": "独立 MMA 调度的灵活性减少了空闲周期，并为编译器带来了新的优化机会，但同时也引发了关于新性能极限的问题：依赖链下的指令延迟、张量核心使用的并发性以及流水线的饱和度。这些问题在厂商文献中尚未有相关记录，我们将在本文的系统性表征中加以探讨。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "ce59537e4bfdb5117c773b75b5ee75c3", "index": 40, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "In terms of numerical support, Blackwell's Tensor Cores introduce native **4-bit and 6-bit floating-point precision** (FP4 and FP6) for quantized inference, further improving memory and computational efficiency for AI workloads. Architectural innovations extend to the thread-block level, with **CTA pair execution**: two Cooperative Thread Arrays (CTAs) with adjacent ranks share operands, reducing redundant data movement. Each CTA pair maps to a TPC and leverages a dedicated intra-TPC communication network for efficient operand sharing.  \n\n", "text": "In terms of numerical support, Blackwell's Tensor Cores introduce native **4-bit and 6-bit floating-point precision** (FP4 and FP6) for quantized inference, further improving memory and computational efficiency for AI workloads. Architectural innovations extend to the thread-block level, with **CTA pair execution**: two Cooperative Thread Arrays (CTAs) with adjacent ranks share operands, reducing redundant data movement. Each CTA pair maps to a TPC and leverages a dedicated intra-TPC communication network for efficient operand sharing.\n", "alignment": "left", "unique_id": "ce59537e4bfdb5117c773b75b5ee75c3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In terms of numerical support, Blackwell's Tensor Cores introduce native **4-bit and 6-bit floating-point precision** (FP4 and FP6) for quantized inference, further improving memory and computational efficiency for AI workloads. Architectural innovations extend to the thread-block level, with **CTA pair execution**: two Cooperative Thread Arrays (CTAs) with adjacent ranks share operands, reducing redundant data movement. Each CTA pair maps to a TPC and leverages a dedicated intra-TPC communication network for efficient operand sharing."}], "lineHeight": 0}}, "target": {"markdown": "在数值精度方面，Blackwell 的张量核心引入了原生的**4 位与 6 位浮点精度**（FP4 与 FP6），用于量化推理，进一步提升了 AI 工作负载的内存与计算效率。架构层面的创新还延伸至线程块级别，引入了**CTA 对偶执行（CTA pair execution）**：两个相邻秩号的协作线程数组（Cooperative Thread Array, CTA）共享操作数，从而减少了冗余的数据搬移。每个 CTA 对映射到一个 TPC，并利用专用的 TPC 内部通信网络高效地共享操作数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "4f2b6b8524bf20ac0f47823bdaa0c12b", "index": 41, "aliyun_index": 5, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Further broadening the functionality, Blackwell's Tensor Cores provide native support for convolution operators with weight-stationary dataflows that use a collector buffer to cache and reuse matrix B (weight tensor) operands. Hence, optimizing for convolutional kernels that benefit from operand locality. Blackwell also addresses growing model and data sizes by introducing a hardware-based **Decompression Engine (DE)** to offload decompression tasks from general-purpose SMs. This subsystem supports various algorithms, more on that in Section V, enabling model weights and large database tables to be stored in compressed form within HBM3e and decompressed transparently during memory access [3].  \n\n", "text": "Further broadening the functionality, Blackwell's Tensor Cores provide native support for convolution operators with weight-stationary dataflows that use a collector buffer to cache and reuse matrix B (weight tensor) operands. Hence, optimizing for convolutional kernels that benefit from operand locality. Blackwell also addresses growing model and data sizes by introducing a hardware-based **Decompression Engine (DE)** to offload decompression tasks from general-purpose SMs. This subsystem supports various algorithms, more on that in Section V, enabling model weights and large database tables to be stored in compressed form within HBM3e and decompressed transparently during memory access [3].\n", "alignment": "left", "unique_id": "4f2b6b8524bf20ac0f47823bdaa0c12b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Further broadening the functionality, Blackwell's Tensor Cores provide native support for convolution operators with weight-stationary dataflows that use a collector buffer to cache and reuse matrix B (weight tensor) operands. Hence, optimizing for convolutional kernels that benefit from operand locality. Blackwell also addresses growing model and data sizes by introducing a hardware-based **Decompression Engine (DE)** to offload decompression tasks from general-purpose SMs. This subsystem supports various algorithms, more on that in Section V, enabling model weights and large database tables to be stored in compressed form within HBM3e and decompressed transparently during memory access [3]."}], "lineHeight": 0}}, "target": {"markdown": "更进一步地拓展功能，Blackwell 的张量核心还通过采用 weight-stationary 数据流（利用收集缓冲区（collector buffer）对矩阵 B，即权重张量操作数进行缓存与复用），原生支持卷积算子。这对于受益于操作数局部性的卷积核优化具有重要意义。此外，Blackwell 还通过引入基于硬件的**解压缩引擎（Decompression Engine, DE）**，将解压缩任务从通用 SM 中卸载出来，以应对不断增长的模型与数据规模。该子系统支持多种压缩算法（详见第 V 节），使得模型权重与大型数据库表能够以压缩形式存储于 HBM3e 中，并在内存访问时透明地完成解压缩 [3]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "7aa51c2b8510d23532113fdbf114602b", "index": 42, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "While some architectural details are publicly disclosed, critical microarchitectural information, such as instruction latency, pipeline depth, cache interaction, and saturation, remains unknown. Our PTX microbenchmark experiments (Sections V-VI) provide a systematic investigation to fill these knowledge gaps as they relate to AI and HPC performance.  \n\n", "text": "While some architectural details are publicly disclosed, critical microarchitectural information, such as instruction latency, pipeline depth, cache interaction, and saturation, remains unknown. Our PTX microbenchmark experiments (Sections V-VI) provide a systematic investigation to fill these knowledge gaps as they relate to AI and HPC performance.\n", "alignment": "left", "unique_id": "7aa51c2b8510d23532113fdbf114602b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While some architectural details are publicly disclosed, critical microarchitectural information, such as instruction latency, pipeline depth, cache interaction, and saturation, remains unknown. Our PTX microbenchmark experiments (Sections V-VI) provide a systematic investigation to fill these knowledge gaps as they relate to AI and HPC performance."}], "lineHeight": 0}}, "target": {"markdown": "尽管一些架构细节已经对外公开，但关键的微架构信息——例如指令延迟、流水线深度、缓存交互行为以及资源饱和度等——仍属未知。本文通过 PTX 微基准测试实验（第 V–VI 节）系统性地展开了相关研究，以填补这些与 AI 及 HPC 性能密切相关的知识空白。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "9f5f1f9636f92ad9770325dd41699aed", "index": 43, "aliyun_index": 7, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## IV. PTX-MICROBENCHMARK METHODOLOGY\n", "text": "IV. PTX-MICROBENCHMARK METHODOLOGY\n", "alignment": "left", "unique_id": "9f5f1f9636f92ad9770325dd41699aed", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "IV. PTX-MICROBENCHMARK METHODOLOGY"}], "lineHeight": 0}}, "target": {"markdown": "## IV. PTX 微基准测试方法论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "f82dbacf1df9e4f4376ffbbe4384274e", "index": 44, "aliyun_index": 8, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We employ a microbenchmarking approach based on\nNVIDIA's Parallel Thread Execution (PTX) to characterize  \n\n", "text": "We employ a microbenchmarking approach based on\nNVIDIA's Parallel Thread Execution (PTX) to characterize\n", "alignment": "left", "unique_id": "f82dbacf1df9e4f4376ffbbe4384274e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We employ a microbenchmarking approach based on"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA's Parallel Thread Execution (PTX) to characterize"}], "lineHeight": -56}}, "target": {"markdown": "我们采用基于 NVIDIA 并行线程执行（PTX）的微基准测试方法来表征", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "bd0c56c56dd876622696b819fcac2512", "index": 45, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Blackwell's microarchitectural features. While prior GPU characterization studies [4], [7], [14] established foundational PTX-level benchmarking principles, we extend these methodologies with novel techniques specifically designed to dissect Blackwell's previously characterized components, including the 5th-generation tensor cores's FP4/FP6 precision modes, the DE, and the revised cache hierarchy.  \n\n", "text": "Blackwell's microarchitectural features. While prior GPU characterization studies [4], [7], [14] established foundational PTX-level benchmarking principles, we extend these methodologies with novel techniques specifically designed to dissect Blackwell's previously characterized components, including the 5th-generation tensor cores's FP4/FP6 precision modes, the DE, and the revised cache hierarchy.\n", "alignment": "left", "unique_id": "bd0c56c56dd876622696b819fcac2512", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Blackwell's microarchitectural features. While prior GPU characterization studies [4], [7], [14] established foundational PTX-level benchmarking principles, we extend these methodologies with novel techniques specifically designed to dissect Blackwell's previously characterized components, including the 5th-generation tensor cores's FP4/FP6 precision modes, the DE, and the revised cache hierarchy."}], "lineHeight": 0}}, "target": {"markdown": "我们采用基于 NVIDIA 并行线程执行（PTX）的微基准测试方法来表征 Blackwell 的微架构特征。尽管先前的 GPU 表征研究 [4]、[7]、[14] 已奠定了 PTX 级基准测试的基本原则，我们在此基础上扩展了这些方法论，并引入了专门用于剖析 Blackwell 各组件（包括第五代张量核心的 FP4/FP6 精度模式、解压缩引擎以及改进后的缓存层次结构）的新型技术。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "c79c9c114a23ea6d6e0d81c5aed79625", "index": 46, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Our approach leverages PTX to provide explicit control over registers and memory operations specific to architectures. PTX code is compiled into Streaming Assembler (SASS) instructions. We design dependency-controlled kernels to isolate the targeted behaviors, and validate the PTX-to-SASS translation.  \n\n", "text": "Our approach leverages PTX to provide explicit control over registers and memory operations specific to architectures. PTX code is compiled into Streaming Assembler (SASS) instructions. We design dependency-controlled kernels to isolate the targeted behaviors, and validate the PTX-to-SASS translation.\n", "alignment": "left", "unique_id": "c79c9c114a23ea6d6e0d81c5aed79625", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our approach leverages PTX to provide explicit control over registers and memory operations specific to architectures. PTX code is compiled into Streaming Assembler (SASS) instructions. We design dependency-controlled kernels to isolate the targeted behaviors, and validate the PTX-to-SASS translation."}], "lineHeight": 0}}, "target": {"markdown": "Now translate this block (output this block only):", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "174b0d0fd9f155bfb6460363d65e656c", "index": 47, "aliyun_index": 11, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### A. Novel Benchmark Design for Blackwell-Specific Features\n", "text": "A. Novel Benchmark Design for Blackwell-Specific Features\n", "alignment": "left", "unique_id": "174b0d0fd9f155bfb6460363d65e656c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Novel Benchmark Design for Blackwell-Specific Features"}], "lineHeight": 0}}, "target": {"markdown": "### A. 面向 Blackwell 特有特性的新型基准测试设计\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "352a68da8c457df93b24e9a963e3c59d", "index": 48, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "1) Tensor Memory (TMEM): Unlike previous architectures where MMA operations relied exclusively on SMEM, DSMEM, and RFs, Blackwell introduces TMEM as a dedicated on-chip memory specifically for tensor operations. This necessitates new data movement paradigms and presents unexplored opportunities for performance optimization. Understanding TMEM's performance characteristics is critical for several reasons. First, traditional data movement instructions (including wmma.load, ldmatrix, ld.shared, and cp.async) which cannot interface with TMEM. Thus developers are required to adopt entirely new instruction sequences (tcgen05.ld, tcgen05.st, tcgen05.cp). Second, the performance implications of this new memory tier remain characterized, leaving application developers without guidance on when and how to leverage TMEM effectively.  \n\n", "text": "1) Tensor Memory (TMEM): Unlike previous architectures where MMA operations relied exclusively on SMEM, DSMEM, and RFs, Blackwell introduces TMEM as a dedicated on-chip memory specifically for tensor operations. This necessitates new data movement paradigms and presents unexplored opportunities for performance optimization. Understanding TMEM's performance characteristics is critical for several reasons. First, traditional data movement instructions (including wmma.load, ldmatrix, ld.shared, and cp.async) which cannot interface with TMEM. Thus developers are required to adopt entirely new instruction sequences (tcgen05.ld, tcgen05.st, tcgen05.cp). Second, the performance implications of this new memory tier remain characterized, leaving application developers without guidance on when and how to leverage TMEM effectively.\n", "alignment": "left", "unique_id": "352a68da8c457df93b24e9a963e3c59d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) Tensor Memory (TMEM): Unlike previous architectures where MMA operations relied exclusively on SMEM, DSMEM, and RFs, Blackwell introduces TMEM as a dedicated on-chip memory specifically for tensor operations. This necessitates new data movement paradigms and presents unexplored opportunities for performance optimization. Understanding TMEM's performance characteristics is critical for several reasons. First, traditional data movement instructions (including wmma.load, ldmatrix, ld.shared, and cp.async) which cannot interface with TMEM. Thus developers are required to adopt entirely new instruction sequences (tcgen05.ld, tcgen05.st, tcgen05.cp). Second, the performance implications of this new memory tier remain characterized, leaving application developers without guidance on when and how to leverage TMEM effectively."}], "lineHeight": 0}}, "target": {"markdown": "1) **张量内存（Tensor Memory, TMEM）**：与以往架构中 MMA 操作仅依赖 SMEM、DSMEM 和寄存器堆（RFs）不同，Blackwell 引入了 TMEM 作为专门用于张量操作的片上存储器。这要求采用全新的数据搬移范式，并为性能优化带来了尚待探索的机会。理解 TMEM 的性能特征至关重要，原因有以下几点。其一，传统的数据搬运指令（包括 `wmma.load`、`ldmatrix`、`ld.shared` 和 `cp.async`）均无法与 TMEM 接口。因此，开发者必须采用全新的指令序列（如 `tcgen05.ld`、`tcgen05.st`、`tcgen05.cp`）。其二，这一新内存层级的性能影响尚未得到充分表征，导致应用开发者在何时以及如何有效利用 TMEM 方面缺乏指导。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "d5055840675afb74bcef5c8ff7d5e026", "index": 49, "aliyun_index": 13, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Our work addresses this gap by providing the first comprehensive empirical analysis of TMEM performance characteristics and their impact on real-world computational kernels.  \n\n", "text": "Our work addresses this gap by providing the first comprehensive empirical analysis of TMEM performance characteristics and their impact on real-world computational kernels.\n", "alignment": "left", "unique_id": "d5055840675afb74bcef5c8ff7d5e026", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our work addresses this gap by providing the first comprehensive empirical analysis of TMEM performance characteristics and their impact on real-world computational kernels."}], "lineHeight": 0}}, "target": {"markdown": "我们的工作通过提供对 TMEM 性能特征及其对实际计算内核影响的首次全面实证分析，弥补了这一空白。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "761ab41d1b44b2a7ea3ff79d0752b05d", "index": 50, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Our methodology comprises of three evaluation strategies.  \n\n", "text": "Our methodology comprises of three evaluation strategies.\n", "alignment": "left", "unique_id": "761ab41d1b44b2a7ea3ff79d0752b05d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our methodology comprises of three evaluation strategies."}], "lineHeight": 0}}, "target": {"markdown": "我们的方法论由三种评估策略组成。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "a5506873ae9bc7430b001a1e89da4efa", "index": 51, "aliyun_index": 15, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "(a) Establish performance baselines by comparing memory access latencies between traditional shared memory and TMEM, using pointer-chase benchmarks [23]. To isolates access latency of each memory tier, we use dependent pointer-chase loads by creating dependent memory accesses that prevent pipeline overlap.  \n\n", "text": "(a) Establish performance baselines by comparing memory access latencies between traditional shared memory and TMEM, using pointer-chase benchmarks [23]. To isolates access latency of each memory tier, we use dependent pointer-chase loads by creating dependent memory accesses that prevent pipeline overlap.\n", "alignment": "left", "unique_id": "a5506873ae9bc7430b001a1e89da4efa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(a) Establish performance baselines by comparing memory access latencies between traditional shared memory and TMEM, using pointer-chase benchmarks [23]. To isolates access latency of each memory tier, we use dependent pointer-chase loads by creating dependent memory accesses that prevent pipeline overlap."}], "lineHeight": 0}}, "target": {"markdown": "(a) 通过使用指针追踪（pointer-chase）基准测试 [23]，比较传统共享内存与 TMEM 之间的内存访问延迟，从而建立性能基线。为了隔离每个内存层级的访问延迟，我们采用依赖型指针追踪加载方式，通过创建具有依赖关系的内存访问来防止流水线重叠。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "d63df1da5e8269df40c277776d800439", "index": 52, "aliyun_index": 16, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "(b) Systematically compare the new TMEM data movement instructions (tcgen05.* family) against their predecessors across varying access patterns.  \n\n", "text": "(b) Systematically compare the new TMEM data movement instructions (tcgen05.* family) against their predecessors across varying access patterns.\n", "alignment": "left", "unique_id": "d63df1da5e8269df40c277776d800439", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(b) Systematically compare the new TMEM data movement instructions (tcgen05.* family) against their predecessors across varying access patterns."}], "lineHeight": 0}}, "target": {"markdown": "(b) 系统性地将新的 TMEM 数据搬运指令（`tcgen05.*` 系列）与其前代指令在不同的访问模式下进行比较。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "44bfe3820bdba6d93f5ba658706e5a7a", "index": 53, "aliyun_index": 17, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "(c) With varying operand sizes and access strides, bandwidth saturation points are identified and per-access latency across different configurations is measured. This reveals both the capabilities and limitations of the new instruction set.  \n\n", "text": "(c) With varying operand sizes and access strides, bandwidth saturation points are identified and per-access latency across different configurations is measured. This reveals both the capabilities and limitations of the new instruction set.\n", "alignment": "left", "unique_id": "44bfe3820bdba6d93f5ba658706e5a7a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(c) With varying operand sizes and access strides, bandwidth saturation points are identified and per-access latency across different configurations is measured. This reveals both the capabilities and limitations of the new instruction set."}], "lineHeight": 0}}, "target": {"markdown": "(c) 通过改变操作数大小和访问步长，识别带宽饱和点，并测量不同配置下的每次访问延迟。这揭示了新指令集的能力与局限性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "a5a557965758de851ad07c42b07d46cd", "index": 54, "aliyun_index": 18, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "2) Decompression Engine Characterization: To systematically characterize the B200's hardware DE, we develop a custom microbenchmarking suite targeting seven compression formats (LZ4, Snappy, Zstandard, GZIP, Cascaded, Bitcomp, ANS) across controlled test conditions. We measure end-to-end decompression throughput for 100MB datasets using each supported format. Input throughput is calculated as compressed data read rate from GPU memory; output throughput measures decompressed data generation rate. Latency captures  \n\n", "text": "2) Decompression Engine Characterization: To systematically characterize the B200's hardware DE, we develop a custom microbenchmarking suite targeting seven compression formats (LZ4, Snappy, Zstandard, GZIP, Cascaded, Bitcomp, ANS) across controlled test conditions. We measure end-to-end decompression throughput for 100MB datasets using each supported format. Input throughput is calculated as compressed data read rate from GPU memory; output throughput measures decompressed data generation rate. Latency captures\n", "alignment": "left", "unique_id": "a5a557965758de851ad07c42b07d46cd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Decompression Engine Characterization: To systematically characterize the B200's hardware DE, we develop a custom microbenchmarking suite targeting seven compression formats (LZ4, Snappy, Zstandard, GZIP, Cascaded, Bitcomp, ANS) across controlled test conditions. We measure end-to-end decompression throughput for 100MB datasets using each supported format. Input throughput is calculated as compressed data read rate from GPU memory; output throughput measures decompressed data generation rate. Latency captures"}], "lineHeight": 0}}, "target": {"markdown": "2) **解压缩引擎表征**：为了系统地表征 B200 的硬件解压缩引擎（DE），我们开发了一套面向七种压缩格式（LZ4、Snappy、Zstandard、GZIP、Cascaded、Bitcomp、ANS）的定制微基准测试套件，覆盖受控的测试条件。我们使用每种受支持的格式对 100MB 数据集进行端到端的解压缩吞吐量测量。输入吞吐量按从 GPU 内存读取压缩数据的速率计算；输出吞吐量衡量解压缩数据的生成速率。延迟则反映了", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "1deb3a344a922d86d7e4f91123b3c964", "index": 55, "aliyun_index": 0, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "complete decompression time including memory transfers. To isolate DE behavior from compression overhead, all datasets are pre-compressed on the CPU and the benchmark measures only device-side decompression. Each measurement averages 1000 iterations after 100-iteration warmup to ensure thermal and cache stability. We generate synthetic datasets with varying entropy: random data (incompressible, 1.00x ratio), mixed alphanumeric (1.98x), repetitive patterns (15.02x), and zero-filled buffers (245.45x).  \n\n", "text": "complete decompression time including memory transfers. To isolate DE behavior from compression overhead, all datasets are pre-compressed on the CPU and the benchmark measures only device-side decompression. Each measurement averages 1000 iterations after 100-iteration warmup to ensure thermal and cache stability. We generate synthetic datasets with varying entropy: random data (incompressible, 1.00x ratio), mixed alphanumeric (1.98x), repetitive patterns (15.02x), and zero-filled buffers (245.45x).\n", "alignment": "left", "unique_id": "1deb3a344a922d86d7e4f91123b3c964", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "complete decompression time including memory transfers. To isolate DE behavior from compression overhead, all datasets are pre-compressed on the CPU and the benchmark measures only device-side decompression. Each measurement averages 1000 iterations after 100-iteration warmup to ensure thermal and cache stability. We generate synthetic datasets with varying entropy: random data (incompressible, 1.00x ratio), mixed alphanumeric (1.98x), repetitive patterns (15.02x), and zero-filled buffers (245.45x)."}], "lineHeight": 0}}, "target": {"markdown": "完成端到端的解压缩时间（包括内存传输）。为了将 DE 的行为与压缩开销隔离开来，所有数据集均在 CPU 上预先压缩，基准测试仅测量设备端的解压缩过程。每次测量在 100 次迭代预热之后取 1000 次迭代的平均值，以确保热稳定性与缓存稳定性。我们生成具有不同熵值的合成数据集：随机数据（不可压缩，压缩比为 1.00 倍）、混合字母数字数据（1.98 倍）、重复模式数据（15.02 倍）以及零填充缓冲区（245.45 倍）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "ba047524f05408b1243a0fa1925cbe2b", "index": 56, "aliyun_index": 1, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "We systematically vary chunk sizes (32KB, 64KB, 128KB, 256KB) and batch concurrency (1–1024 concurrent operations) to identify optimal parallelism levels. Peak throughput is measured at maximum sustainable bandwidth before efficiency degradation. Pipeline depth represents the concurrency level maintaining roughly 85% efficiency (defined as throughput per operation / peak single-operation throughput). Saturation point identifies where additional concurrency yields around 5% marginal throughput improvement. This methodology reveals hardware resource limits and memory bandwidth constraints not documented by NVIDIA.  \n\n", "text": "We systematically vary chunk sizes (32KB, 64KB, 128KB, 256KB) and batch concurrency (1–1024 concurrent operations) to identify optimal parallelism levels. Peak throughput is measured at maximum sustainable bandwidth before efficiency degradation. Pipeline depth represents the concurrency level maintaining roughly 85% efficiency (defined as throughput per operation / peak single-operation throughput). Saturation point identifies where additional concurrency yields around 5% marginal throughput improvement. This methodology reveals hardware resource limits and memory bandwidth constraints not documented by NVIDIA.\n", "alignment": "left", "unique_id": "ba047524f05408b1243a0fa1925cbe2b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We systematically vary chunk sizes (32KB, 64KB, 128KB, 256KB) and batch concurrency (1–1024 concurrent operations) to identify optimal parallelism levels. Peak throughput is measured at maximum sustainable bandwidth before efficiency degradation. Pipeline depth represents the concurrency level maintaining roughly 85% efficiency (defined as throughput per operation / peak single-operation throughput). Saturation point identifies where additional concurrency yields around 5% marginal throughput improvement. This methodology reveals hardware resource limits and memory bandwidth constraints not documented by NVIDIA."}], "lineHeight": 0}}, "target": {"markdown": "我们系统地改变分块大小（32KB、64KB、128KB、256KB）和批处理并发度（1–1024 个并发操作），以确定最佳的并行度等级。峰值吞吐量在效率下降之前的最大可持续带宽处测得。流水线深度代表维持约 85% 效率的并发度水平（其定义为每次操作的吞吐量与单次操作峰值吞吐量之比）。饱和点则用于识别额外并发度仅带来约 5% 边际吞吐量提升的位置。该方法揭示了 NVIDIA 文档中未记载的硬件资源限制和内存带宽约束。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "10cfaf41a49459cef44c4f984ff0f0bd", "index": 57, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "3) Tensor Core Characterization: We develop custom GPU kernels to execute MMA operations of the form $\\mathbf{D} = \\mathbf{A} \\times \\mathbf{B} + \\mathbf{D}$ using Blackwell's newly introduced tensor core instruction set (tcgen05).  \n\n", "text": "3) Tensor Core Characterization: We develop custom GPU kernels to execute MMA operations of the form $\\mathbf{D} = \\mathbf{A} \\times \\mathbf{B} + \\mathbf{D}$ using Blackwell's newly introduced tensor core instruction set (tcgen05).\n", "alignment": "left", "unique_id": "10cfaf41a49459cef44c4f984ff0f0bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3) Tensor Core Characterization: We develop custom GPU kernels to execute MMA operations of the form $\\mathbf{D} = \\mathbf{A} \\times \\mathbf{B} + \\mathbf{D}$ using Blackwell's newly introduced tensor core instruction set (tcgen05)."}], "lineHeight": 0}}, "target": {"markdown": "3) **张量核心表征**：我们开发了定制 GPU 内核，以使用 Blackwell 新引入的张量核心指令集（`tcgen05`）执行形式为 $\\mathbf{D} = \\mathbf{A} \\times \\mathbf{B} + \\mathbf{D}$ 的 MMA 操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "0049a5f374d4804dba1c6e7c865c8507", "index": 58, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "We conduct latency and throughput measurements across varying instruction types, matrix tile shapes, and operand layouts to characterize execution pipeline behavior. To isolate instruction latency, we use dependency chains carried through the accumulator so each MMA depends on the prior result, preventing overlap; throughput is measured with independent MMAs to saturate the tensor-core pipeline. Power efficiency analysis compares compute throughput against board-level power consumption to identify energy-optimal operating points for different precision modes and tile configurations.  \n\n", "text": "We conduct latency and throughput measurements across varying instruction types, matrix tile shapes, and operand layouts to characterize execution pipeline behavior. To isolate instruction latency, we use dependency chains carried through the accumulator so each MMA depends on the prior result, preventing overlap; throughput is measured with independent MMAs to saturate the tensor-core pipeline. Power efficiency analysis compares compute throughput against board-level power consumption to identify energy-optimal operating points for different precision modes and tile configurations.\n", "alignment": "left", "unique_id": "0049a5f374d4804dba1c6e7c865c8507", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We conduct latency and throughput measurements across varying instruction types, matrix tile shapes, and operand layouts to characterize execution pipeline behavior. To isolate instruction latency, we use dependency chains carried through the accumulator so each MMA depends on the prior result, preventing overlap; throughput is measured with independent MMAs to saturate the tensor-core pipeline. Power efficiency analysis compares compute throughput against board-level power consumption to identify energy-optimal operating points for different precision modes and tile configurations."}], "lineHeight": 0}}, "target": {"markdown": "我们针对不同的指令类型、矩阵分块形状以及操作数布局开展延迟与吞吐量测量，以表征执行流水线的行为。为了隔离指令延迟，我们采用通过累加器串联的依赖链，使每次 MMA 操作都依赖于前一次的结果，从而防止重叠；吞吐量则通过相互独立的 MMA 操作进行测量，以使张量核心流水线饱和。功耗效率分析将计算吞吐量与板级功耗进行对比，以识别不同精度模式和分块配置下的能耗最优工作点。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "eeadc716482aff8d2b406162bafaf301", "index": 59, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "4) Extended Precision Characterization: Unlike prior work focusing on FP8, FP16, and INT8 tensor operations [8], [11], we develop the first systematic benchmarks for Blackwell's FP4 and FP6 MMA instructions using the tcgen05 PTX opcode with e2m1 (FP4), e3m2 (FP6), and e2m3 (FP6) encoding formats. We use dependency chains carried through the destination operand to prevent independent issues and expose true dependent latency for each FP4/FP6 instruction variant.  \n\n", "text": "4) Extended Precision Characterization: Unlike prior work focusing on FP8, FP16, and INT8 tensor operations [8], [11], we develop the first systematic benchmarks for Blackwell's FP4 and FP6 MMA instructions using the tcgen05 PTX opcode with e2m1 (FP4), e3m2 (FP6), and e2m3 (FP6) encoding formats. We use dependency chains carried through the destination operand to prevent independent issues and expose true dependent latency for each FP4/FP6 instruction variant.\n", "alignment": "left", "unique_id": "eeadc716482aff8d2b406162bafaf301", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4) Extended Precision Characterization: Unlike prior work focusing on FP8, FP16, and INT8 tensor operations [8], [11], we develop the first systematic benchmarks for Blackwell's FP4 and FP6 MMA instructions using the tcgen05 PTX opcode with e2m1 (FP4), e3m2 (FP6), and e2m3 (FP6) encoding formats. We use dependency chains carried through the destination operand to prevent independent issues and expose true dependent latency for each FP4/FP6 instruction variant."}], "lineHeight": 0}}, "target": {"markdown": "4) **扩展精度表征**：与先前聚焦于 FP8、FP16 和 INT8 张量操作的工作 [8]、[11] 不同，我们针对 Blackwell 的 FP4 和 FP6 MMA 指令开发了首个系统性基准测试，所使用的 `tcgen05` PTX 操作码采用 e2m1（FP4）、e3m2（FP6）和 e2m3（FP6）编码格式。我们采用通过目标操作数串联的依赖链，以防止独立的发射操作，并揭示每种 FP4/FP6 指令变体的真实依赖延迟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "c09fb2ef6c330de4fa6cc115d842eac3", "index": 60, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "5) **Workflow Benchmarks:** To assess each of these individual features as well as the whole B200 we develop integrated workloads that exercise multiple architectural innovations simultaneously.  \n\n", "text": "5) **Workflow Benchmarks:** To assess each of these individual features as well as the whole B200 we develop integrated workloads that exercise multiple architectural innovations simultaneously.\n", "alignment": "left", "unique_id": "c09fb2ef6c330de4fa6cc115d842eac3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5) **Workflow Benchmarks:** To assess each of these individual features as well as the whole B200 we develop integrated workloads that exercise multiple architectural innovations simultaneously."}], "lineHeight": 0}}, "target": {"markdown": "5) **工作流基准测试**：为了评估上述各项单独功能以及整个 B200 的表现，我们开发了可同时调用多种架构创新的集成工作负载。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "0fa3377429ad3e21dc9ddc34969b4d12", "index": 61, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "First, we select the Mistral model family [24] as an LLM for several reasons: (1) Mistral-7B provides a representative dense decoder architecture with performance comparable to larger models, (2) Mixtral-8x7B's Mixture-of-Experts (MoE) architecture exercises different dataflow patterns that stress Blackwell's memory hierarchy, and (3) the Mistral family's public availability enables reproducibility. The architectural diversity spanning dense (Mistral-7B) to sparse MoE (Mixtral-  \n\n", "text": "First, we select the Mistral model family [24] as an LLM for several reasons: (1) Mistral-7B provides a representative dense decoder architecture with performance comparable to larger models, (2) Mixtral-8x7B's Mixture-of-Experts (MoE) architecture exercises different dataflow patterns that stress Blackwell's memory hierarchy, and (3) the Mistral family's public availability enables reproducibility. The architectural diversity spanning dense (Mistral-7B) to sparse MoE (Mixtral-\n", "alignment": "left", "unique_id": "0fa3377429ad3e21dc9ddc34969b4d12", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "First, we select the Mistral model family [24] as an LLM for several reasons: (1) Mistral-7B provides a representative dense decoder architecture with performance comparable to larger models, (2) Mixtral-8x7B's Mixture-of-Experts (MoE) architecture exercises different dataflow patterns that stress Blackwell's memory hierarchy, and (3) the Mistral family's public availability enables reproducibility. The architectural diversity spanning dense (Mistral-7B) to sparse MoE (Mixtral-"}], "lineHeight": 0}}, "target": {"markdown": "首先，我们选择 Mistral 模型系列 [24] 作为 LLM，基于以下几点原因：(1) Mistral-7B 提供了一个具有代表性的稠密解码器架构，其性能可与更大的模型相媲美；(2) Mixtral-8x7B 的混合专家（Mixture-of-Experts, MoE）架构会触发不同的数据流模式，从而对 Blackwell 的内存层次结构造成压力；(3) Mistral 系列模型的公开可用性使其结果具备可复现性。从稠密架构（Mistral-7B）到稀疏 MoE（Mixtral-", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "8ef525a26476ddf47752a6e33b59bdf0", "index": 62, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "8x7B, Mixtral-8x22B) provides comprehensive coverage of modern LLM deployment scenarios.  \n\n", "text": "8x7B, Mixtral-8x22B) provides comprehensive coverage of modern LLM deployment scenarios.\n", "alignment": "left", "unique_id": "8ef525a26476ddf47752a6e33b59bdf0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8x7B, Mixtral-8x22B) provides comprehensive coverage of modern LLM deployment scenarios."}], "lineHeight": 0}}, "target": {"markdown": "8x7B、Mixtral-8x22B）的架构多样性，全面覆盖了现代 LLM 的部署场景。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "2441608d46a4a0be2fc783a1d0dca86f", "index": 63, "aliyun_index": 8, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Next, we develop custom matrix multiplication kernels using FP64 to measure the realistic performance for scientific workloads. In addition, we run STREAM Triad [25] for memory bandwidth and SpMV tests with real-world data to benchmark the DE. Finally, we measure end-to-end training performance using mixed-precision training with ResNet-50 [26], and GPT-1.3B [27].  \n\n", "text": "Next, we develop custom matrix multiplication kernels using FP64 to measure the realistic performance for scientific workloads. In addition, we run STREAM Triad [25] for memory bandwidth and SpMV tests with real-world data to benchmark the DE. Finally, we measure end-to-end training performance using mixed-precision training with ResNet-50 [26], and GPT-1.3B [27].\n", "alignment": "left", "unique_id": "2441608d46a4a0be2fc783a1d0dca86f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Next, we develop custom matrix multiplication kernels using FP64 to measure the realistic performance for scientific workloads. In addition, we run STREAM Triad [25] for memory bandwidth and SpMV tests with real-world data to benchmark the DE. Finally, we measure end-to-end training performance using mixed-precision training with ResNet-50 [26], and GPT-1.3B [27]."}], "lineHeight": 0}}, "target": {"markdown": "此外，我们还开发了使用 FP64 的定制矩阵乘法内核，以测量科学工作负载的真实性能。此外，我们运行 STREAM Triad [25] 以测量内存带宽，并使用真实世界的数据运行 SpMV 测试以对解压缩引擎（DE）进行基准测试。最后，我们使用混合精度训练对 ResNet-50 [26] 和 GPT-1.3B [27] 测量端到端的训练性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "ea8910aa0d88fe0ce4886648a7b8170a", "index": 64, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Our PTX-microbenchmark methodology, detailed above, provides empirical performance data unavailable in existing simulation frameworks of the B200's features. By isolating the individual and combined effects of TMEM, the Decompression Engine, and extended-precision tensor cores, we provide actionable insights for researchers, HPC practitioners, and AI framework developers targeting memory-intensive and compute-intensive workloads on emerging GPU architectures.  \n\n", "text": "Our PTX-microbenchmark methodology, detailed above, provides empirical performance data unavailable in existing simulation frameworks of the B200's features. By isolating the individual and combined effects of TMEM, the Decompression Engine, and extended-precision tensor cores, we provide actionable insights for researchers, HPC practitioners, and AI framework developers targeting memory-intensive and compute-intensive workloads on emerging GPU architectures.\n", "alignment": "left", "unique_id": "ea8910aa0d88fe0ce4886648a7b8170a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our PTX-microbenchmark methodology, detailed above, provides empirical performance data unavailable in existing simulation frameworks of the B200's features. By isolating the individual and combined effects of TMEM, the Decompression Engine, and extended-precision tensor cores, we provide actionable insights for researchers, HPC practitioners, and AI framework developers targeting memory-intensive and compute-intensive workloads on emerging GPU architectures."}], "lineHeight": 0}}, "target": {"markdown": "上述 PTX 微基准测试方法提供了现有 B200 功能仿真框架中无法获得的实证性能数据。通过隔离 TMEM、解压缩引擎以及扩展精度张量核心各自以及组合的效果，我们为面向新兴 GPU 架构的内存密集型与计算密集型工作负载的研究人员、HPC 从业者以及 AI 框架开发者提供了切实可行的参考洞见。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "a341d2f61cccec9f86ee884ffa1a4eeb", "index": 65, "aliyun_index": 10, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "## V. MEMORY SUBSYSTEM\n", "text": "V. MEMORY SUBSYSTEM\n", "alignment": "left", "unique_id": "a341d2f61cccec9f86ee884ffa1a4eeb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "V. MEMORY SUBSYSTEM"}], "lineHeight": 0}}, "target": {"markdown": "## V. 内存子系统\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "79d5cf888df75d0031617cdb15a003b1", "index": 66, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "In this Section, we present a comparative evaluation of the memory subsystems, including TMEM and DE, through microbenchmarking methodologies that measure latency, saturation behavior, and sensitivity to access patterns. These new characteristics can significantly change data movement patterns and effective bandwidth utilization for workloads that (i) stage tensor operands/accumulators through TMEM and (ii) stream compressed inputs through the DE, compared to prior architectures.  \n\n", "text": "In this Section, we present a comparative evaluation of the memory subsystems, including TMEM and DE, through microbenchmarking methodologies that measure latency, saturation behavior, and sensitivity to access patterns. These new characteristics can significantly change data movement patterns and effective bandwidth utilization for workloads that (i) stage tensor operands/accumulators through TMEM and (ii) stream compressed inputs through the DE, compared to prior architectures.\n", "alignment": "left", "unique_id": "79d5cf888df75d0031617cdb15a003b1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this Section, we present a comparative evaluation of the memory subsystems, including TMEM and DE, through microbenchmarking methodologies that measure latency, saturation behavior, and sensitivity to access patterns. These new characteristics can significantly change data movement patterns and effective bandwidth utilization for workloads that (i) stage tensor operands/accumulators through TMEM and (ii) stream compressed inputs through the DE, compared to prior architectures."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们通过对延迟、饱和行为以及对访问模式敏感性进行微基准测试，对内存子系统（包括 TMEM 和 DE）进行比较评估。与先前架构相比，这些新特性可能会显著改变以下两类工作负载的数据移动模式和有效带宽利用率：(i) 通过 TMEM 分段暂存张量操作数/累加器；(ii) 通过 DE 流式处理压缩输入。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "812ab3c230a5161f1b4b044de502ab6d", "index": 67, "aliyun_index": 12, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### A. Tensor Memory (TMEM)\n", "text": "A. Tensor Memory (TMEM)\n", "alignment": "left", "unique_id": "812ab3c230a5161f1b4b044de502ab6d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Tensor Memory (TMEM)"}], "lineHeight": 0}}, "target": {"markdown": "### A. 张量内存（TMEM）\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "afdebfadd13e5215a8bbbe97675fa852", "index": 68, "aliyun_index": 13, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The TMEM is a dedicated 256KB on-chip memory per SM designed solely for Tensor Core operations. Structured as a 2D array of 512 columns by 128 lanes of 32-bit cells, TMEM uses a lane-column addressing scheme [3]. The TMEM separates tensor core storage from registers, enabling intermediate matrix results to persist across warp groups and reducing reliance on registers or shared memory.  \n\n", "text": "The TMEM is a dedicated 256KB on-chip memory per SM designed solely for Tensor Core operations. Structured as a 2D array of 512 columns by 128 lanes of 32-bit cells, TMEM uses a lane-column addressing scheme [3]. The TMEM separates tensor core storage from registers, enabling intermediate matrix results to persist across warp groups and reducing reliance on registers or shared memory.\n", "alignment": "left", "unique_id": "afdebfadd13e5215a8bbbe97675fa852", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The TMEM is a dedicated 256KB on-chip memory per SM designed solely for Tensor Core operations. Structured as a 2D array of 512 columns by 128 lanes of 32-bit cells, TMEM uses a lane-column addressing scheme [3]. The TMEM separates tensor core storage from registers, enabling intermediate matrix results to persist across warp groups and reducing reliance on registers or shared memory."}], "lineHeight": 0}}, "target": {"markdown": "TMEM 是每个 SM 上专用的 256KB 片上内存，仅用于张量核心（Tensor Core）操作。TMEM 被组织为一个二维结构，包含 512 列 × 128 行（lane）的 32 位单元阵列，并采用 lane-column 寻址方案 [3]。TMEM 将张量核心的存储与寄存器分离，使得中间矩阵结果能够在 warp 组之间持久保存，从而减少对寄存器或共享内存的依赖。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "f62a25f2529a97991fbd204cace63224", "index": 69, "aliyun_index": 14, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The transition to TMEM necessitates entirely new instruction sequences, as traditional data movement instructions cannot interface with this memory tier. On Hopper, the standard pipeline used cp.async.bulk.tensor.2d (or TMA) for global-to-shared tile copies, then ldmatrix or wmmload to stage operands; the wgmma instruction accepts operand A from registers or shared memory and operand B from shared memory (B is not staged into registers before MMA). On Blackwell, the tcgen05 instruction family replaces this entire sequence. The tcgen05.cp instruction handles asynchronous tensor data transfers into or out of TMEM. The tcgen05.ld and tcgen05.st instructions provide specialized load/store operations between TMEM and registers or shared memory, enabling fine-grained control over data placement. Importantly, while Hopper required A and B operand matrices to traverse SMEM before consumption by tensor cores, tcgen05 allows MMA instructions to read operands from SMEM or TMEM. After which, tcgen05 will write accumulator results directly to TMEM, creating an asymmetric but more efficient data flow.  \n\n", "text": "The transition to TMEM necessitates entirely new instruction sequences, as traditional data movement instructions cannot interface with this memory tier. On Hopper, the standard pipeline used cp.async.bulk.tensor.2d (or TMA) for global-to-shared tile copies, then ldmatrix or wmmload to stage operands; the wgmma instruction accepts operand A from registers or shared memory and operand B from shared memory (B is not staged into registers before MMA). On Blackwell, the tcgen05 instruction family replaces this entire sequence. The tcgen05.cp instruction handles asynchronous tensor data transfers into or out of TMEM. The tcgen05.ld and tcgen05.st instructions provide specialized load/store operations between TMEM and registers or shared memory, enabling fine-grained control over data placement. Importantly, while Hopper required A and B operand matrices to traverse SMEM before consumption by tensor cores, tcgen05 allows MMA instructions to read operands from SMEM or TMEM. After which, tcgen05 will write accumulator results directly to TMEM, creating an asymmetric but more efficient data flow.\n", "alignment": "left", "unique_id": "f62a25f2529a97991fbd204cace63224", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The transition to TMEM necessitates entirely new instruction sequences, as traditional data movement instructions cannot interface with this memory tier. On Hopper, the standard pipeline used cp.async.bulk.tensor.2d (or TMA) for global-to-shared tile copies, then ldmatrix or wmmload to stage operands; the wgmma instruction accepts operand A from registers or shared memory and operand B from shared memory (B is not staged into registers before MMA). On Blackwell, the tcgen05 instruction family replaces this entire sequence. The tcgen05.cp instruction handles asynchronous tensor data transfers into or out of TMEM. The tcgen05.ld and tcgen05.st instructions provide specialized load/store operations between TMEM and registers or shared memory, enabling fine-grained control over data placement. Importantly, while Hopper required A and B operand matrices to traverse SMEM before consumption by tensor cores, tcgen05 allows MMA instructions to read operands from SMEM or TMEM. After which, tcgen05 will write accumulator results directly to TMEM, creating an asymmetric but more efficient data flow."}], "lineHeight": 0}}, "target": {"markdown": "向 TMEM 的过渡需要全新的指令序列，因为传统的数据搬移指令无法与该内存层级交互。在 Hopper 上，标准流水线使用 `cp.async.bulk.tensor.2d`（或 TMA）执行全局内存到共享内存的 tile 拷贝，然后通过 `ldmatrix` 或 `wmmload` 来暂存操作数；`wgmma` 指令接受来自寄存器或共享内存的操作数 A，以及来自共享内存的操作数 B（B 在进入 MMA 之前不会暂存到寄存器中）。在 Blackwell 上，`tcgen05` 指令族取代了上述整个流程。`tcgen05.cp` 指令负责与 TMEM 之间异步的张量数据传输。`tcgen05.ld` 和 `tcgen05.st` 指令提供了 TMEM 与寄存器或共享内存之间专门的加载/存储操作，从而实现对数据布局的细粒度控制。值得注意的是，Hopper 要求操作数矩阵 A 和 B 都必须经过 SMEM 才能被张量核心消费，而 `tcgen05` 允许 MMA 指令直接从 SMEM 或 TMEM 读取操作数。此后，`tcgen05` 会将累加器结果直接写入 TMEM，从而形成一种非对称但更为高效的数据流。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "9bce301bddab8d7e58642608d2e56746", "index": 70, "aliyun_index": 0, "page_num": 4, "type": "table", "sub_type": "none", "markdown": "| formats | Compression Ratio | Input Throughput (GB/s) | Output Throughput (GB/s) | Latency (ms) | Use Case |\n| --- | --- | --- | --- | --- | --- |\n| lz4 | 1.00x | 173.23 | 172.55 | 0.608 |\n| snappy | 1.91x | 61.38 | 117.24 | 0.894 | Real-time |\n| zstd | 2.00x | 77.50 | 154.94 | 0.677 | General |\n| gzip | 2.00x | 42.00 | 83.83 | 1.251 | Legacy |\n| cascaded | N/A | N/A | 213.42 | 0.491 |\n| bitcomp | 3.00x | 154.02 | 462.37 | 0.227 | Scientific |\n| ans | N/A | N/A | 539.21 | 0.194 |\n\n", "text": "| formats|Compression Ratio|Input Throughput (GB/s)|Output Throughput (GB/s)|Latency (ms)|Use Case|\n| ---|---|---|---|---|---|\n| lz4|1.00x|173.23|172.55|0.608||\n| snappy|1.91x|61.38|117.24|0.894|Real-time|\n| zstd|2.00x|77.50|154.94|0.677|General|\n| gzip|2.00x|42.00|83.83|1.251|Legacy|\n| cascaded|N/A|N/A|213.42|0.491||\n| bitcomp|3.00x|154.02|462.37|0.227|Scientific|\n| ans|N/A|N/A|539.21|0.194||\n", "alignment": "left", "unique_id": "9bce301bddab8d7e58642608d2e56746", "edited": false, "extra": {"numCol": 6, "cells": [{"yec": 0, "xec": 0, "ysc": 0, "xsc": 0, "type": "text", "alignment": "left", "cellId": 0, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "fo
