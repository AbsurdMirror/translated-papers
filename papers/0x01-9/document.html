pt. of Computer Information Sciences\nUniversity of Delaware\nNewark, US\nschandra@udel.edu\n", "alignment": "left", "unique_id": "834a36cf2d08edfc018f07450d088567", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sunita Chandrasekaran"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "dept. of Computer Information Sciences"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "University of Delaware"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Newark, US"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "schandra@udel.edu"}], "lineHeight": -144}}, "target": {"markdown": "Sunita Chandrasekaran\n计算机信息科学系\n特拉华大学\n纽瓦克，美国\nschandra@udel.edu", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "8f59ec6775d44508a9c41ccfaab0a4ff", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## Abstract—\n", "text": "Abstract—\n", "alignment": "left", "unique_id": "8f59ec6775d44508a9c41ccfaab0a4ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract—"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要—\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "a9c35de777ad36d071e2c5f3d96d1447", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "As GPU architectures rapidly evolve to meet the overcoming demands of exascale computing and machine learning, the performance implications of architectural innovations remain poorly understood across diverse workloads. NVIDIA's Blackwell (B200) generation introduce significant architectural advances including the 5th-generation tensor cores, tensor memory (TMEM), decompression engine (DE), and dual chips; however systematic methodologies for quantifying these improvements lag behind hardware development cycles. We contribute an open-source microbenchmark suite that offers practical insights into optimizing workloads to fully utilize the rich feature sets of the modern GPU architecture. This work aims to enable application developers make informed architectural decisions and guide future GPU design directions.  \n\n", "text": "As GPU architectures rapidly evolve to meet the overcoming demands of exascale computing and machine learning, the performance implications of architectural innovations remain poorly understood across diverse workloads. NVIDIA's Blackwell (B200) generation introduce significant architectural advances including the 5th-generation tensor cores, tensor memory (TMEM), decompression engine (DE), and dual chips; however systematic methodologies for quantifying these improvements lag behind hardware development cycles. We contribute an open-source microbenchmark suite that offers practical insights into optimizing workloads to fully utilize the rich feature sets of the modern GPU architecture. This work aims to enable application developers make informed architectural decisions and guide future GPU design directions.\n", "alignment": "left", "unique_id": "a9c35de777ad36d071e2c5f3d96d1447", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As GPU architectures rapidly evolve to meet the overcoming demands of exascale computing and machine learning, the performance implications of architectural innovations remain poorly understood across diverse workloads. NVIDIA's Blackwell (B200) generation introduce significant architectural advances including the 5th-generation tensor cores, tensor memory (TMEM), decompression engine (DE), and dual chips; however systematic methodologies for quantifying these improvements lag behind hardware development cycles. We contribute an open-source microbenchmark suite that offers practical insights into optimizing workloads to fully utilize the rich feature sets of the modern GPU architecture. This work aims to enable application developers make informed architectural decisions and guide future GPU design directions."}], "lineHeight": 0}}, "target": {"markdown": "随着 GPU 架构快速发展以满足百亿亿次计算和机器学习日益增长的要求，架构创新对性能的影响在多样化工作负载下仍缺乏深入理解。NVIDIA 的 Blackwell（B200）代际引入了重大架构进步，包括第五代张量核心、张量存储器（TMEM）、解压缩引擎（DE）以及双芯片设计；然而，用于量化这些改进的系统化方法仍滞后于硬件开发周期。我们贡献了一套开源微基准测试套件，为优化工作负载以充分利用现代 GPU 架构丰富的特性集提供了实用见解。本工作旨在使应用开发者能够做出明智的架构决策，并指导未来 GPU 的设计方向。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "ee2a0417112fefeb851d694b58b3c797", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Our work studies Blackwell GPUs, compares them to H200 generation with regards to the memory subsystem, tensor core pipeline and floating-point precisions (FP32, FP16, FP8, FP6, FP4). Our systematic evaluation of dense/sparse GEMM, transformer inference, and training workloads demonstrates that B200's tensor core enhancements achieve $1.85\\times$ ResNet-50 and $1.55\\times$ GPT-1.3B mixed-precision training throughput with 32% better energy efficiency than H200.  \n\n", "text": "Our work studies Blackwell GPUs, compares them to H200 generation with regards to the memory subsystem, tensor core pipeline and floating-point precisions (FP32, FP16, FP8, FP6, FP4). Our systematic evaluation of dense/sparse GEMM, transformer inference, and training workloads demonstrates that B200's tensor core enhancements achieve $1.85\\times$ ResNet-50 and $1.55\\times$ GPT-1.3B mixed-precision training throughput with 32% better energy efficiency than H200.\n", "alignment": "left", "unique_id": "ee2a0417112fefeb851d694b58b3c797", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our work studies Blackwell GPUs, compares them to H200 generation with regards to the memory subsystem, tensor core pipeline and floating-point precisions (FP32, FP16, FP8, FP6, FP4). Our systematic evaluation of dense/sparse GEMM, transformer inference, and training workloads demonstrates that B200's tensor core enhancements achieve $1.85\\times$ ResNet-50 and $1.55\\times$ GPT-1.3B mixed-precision training throughput with 32% better energy efficiency than H200."}], "lineHeight": 0}}, "target": {"markdown": "本研究对 Blackwell GPU 进行了分析，并将其与 H200 代际在内存子系统、张量核心流水线以及浮点精度（FP32、FP16、FP8、FP6、FP4）方面进行了比较。我们对密集/稀疏 GEMM、Transformer 推理和训练工作负载的系统评估表明，B200 的张量核心增强实现了 $1.85\\times$ 的 ResNet-50 和 $1.55\\times$ 的 GPT-1.3B 混合精度训练吞吐量，同时能效比 H200 提升 32%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "cafdfd7fe2ec5d9b970814643bd930bf", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Index Terms—Blackwell, GPU, Microbenchmark, HPC  \n\n", "text": "Index Terms—Blackwell, GPU, Microbenchmark, HPC\n", "alignment": "left", "unique_id": "cafdfd7fe2ec5d9b970814643bd930bf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Index Terms—Blackwell, GPU, Microbenchmark, HPC"}], "lineHeight": 0}}, "target": {"markdown": "索引术语—Blackwell、GPU、微基准测试、HPC", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "7f9676b5a31eea0708379152c6f26da5", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## I. INTRODUCTION\n", "text": "I. INTRODUCTION\n", "alignment": "left", "unique_id": "7f9676b5a31eea0708379152c6f26da5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "I. INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "## 一、引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "7a868a27061bf6766db72ea43a2578b6", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Artificial Intelligence (AI) and high-performance computing (HPC) have evolved into data-intensive disciplines that continuously challenge hardware efficiency, scalability, and precision. Large language models (LLMs) now exceed hundreds of billions of parameters and process context windows spanning millions of tokens [1], [2], alongside multi-physics and climate simulations that demand teraflops of sustained performance, thus shifting GPU design to enable both massive parallel and architectural adaptability. At these scales, modern accelerators must balance several demands: maintaining arithmetic throughput for dense tensor workloads, minimizing on-chip and off-chip memory latency, while offering hardware primitives that effectively support mixed-precision computation.  \n\n", "text": "Artificial Intelligence (AI) and high-performance computing (HPC) have evolved into data-intensive disciplines that continuously challenge hardware efficiency, scalability, and precision. Large language models (LLMs) now exceed hundreds of billions of parameters and process context windows spanning millions of tokens [1], [2], alongside multi-physics and climate simulations that demand teraflops of sustained performance, thus shifting GPU design to enable both massive parallel and architectural adaptability. At these scales, modern accelerators must balance several demands: maintaining arithmetic throughput for dense tensor workloads, minimizing on-chip and off-chip memory latency, while offering hardware primitives that effectively support mixed-precision computation.\n", "alignment": "left", "unique_id": "7a868a27061bf6766db72ea43a2578b6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Artificial Intelligence (AI) and high-performance computing (HPC) have evolved into data-intensive disciplines that continuously challenge hardware efficiency, scalability, and precision. Large language models (LLMs) now exceed hundreds of billions of parameters and process context windows spanning millions of tokens [1], [2], alongside multi-physics and climate simulations that demand teraflops of sustained performance, thus shifting GPU design to enable both massive parallel and architectural adaptability. At these scales, modern accelerators must balance several demands: maintaining arithmetic throughput for dense tensor workloads, minimizing on-chip and off-chip memory latency, while offering hardware primitives that effectively support mixed-precision computation."}], "lineHeight": 0}}, "target": {"markdown": "人工智能（AI）和高性能计算（HPC）已演变为数据密集型学科，持续对硬件的效率、可扩展性和精度提出挑战。大语言模型（LLM）目前的参数量已突破数千亿，处理涵盖数百万标记的上下文窗口 [1]、[2]，同时多物理场和气候模拟也需要持续的千万亿次浮点运算性能，这促使 GPU 设计同时支持大规模并行性和架构适应性。在这些规模下，现代加速器必须平衡多种需求：在维持密集张量工作负载算术吞吐量的同时，最小化片上和片外内存延迟，并提供有效支持混合精度计算的硬件原语。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "b4ec0788b9434222bd7b614f3f21adda", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "The growing demands have exposed several limitations of current GPU architectures, particularly within their memory hierarchies, precision flexibility, and latency-sensitive task scheduling. As a result, sustained architectural innovation in accelerators has become essential for advancing both throughput-optimized training and time-critical inference workloads. One such architecture that is designed to address  \n\n", "text": "The growing demands have exposed several limitations of current GPU architectures, particularly within their memory hierarchies, precision flexibility, and latency-sensitive task scheduling. As a result, sustained architectural innovation in accelerators has become essential for advancing both throughput-optimized training and time-critical inference workloads. One such architecture that is designed to address\n", "alignment": "left", "unique_id": "b4ec0788b9434222bd7b614f3f21adda", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The growing demands have exposed several limitations of current GPU architectures, particularly within their memory hierarchies, precision flexibility, and latency-sensitive task scheduling. As a result, sustained architectural innovation in accelerators has become essential for advancing both throughput-optimized training and time-critical inference workloads. One such architecture that is designed to address"}], "lineHeight": 0}}, "target": {"markdown": "不断增长的需求已暴露出当前 GPU 架构的多项局限性，尤其是在内存层次结构、精度灵活性以及延迟敏感型任务调度方面。因此，加速器中持续的架构创新对于推进面向吞吐量的训练和时间关键的推理工作负载变得至关重要。为应对这些挑战而设计的架构之一", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "15cbb3f7997997c93086102af0d84df9", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "some of these challenges is NVIDIA's Blackwell architecture [3] that showcases a major generational evolution.  \n\n", "text": "some of these challenges is NVIDIA's Blackwell architecture [3] that showcases a major generational evolution.\n", "alignment": "left", "unique_id": "15cbb3f7997997c93086102af0d84df9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "some of these challenges is NVIDIA's Blackwell architecture [3] that showcases a major generational evolution."}], "lineHeight": 0}}, "target": {"markdown": "是 NVIDIA 的 Blackwell 架构 [3]，它展示了重大的代际演进。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "d6c643beb24f6a8f61e9d7c7c40d685b", "index": 12, "aliyun_index": 12, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "As the direct successor to the Hopper generation, the Blackwell architecture extends NVIDIA's GPU design in several modifications across the compute pipeline, memory hierarchy, and tensor processing subsystems. Blackwell introduces 5th-generation tensor cores capable of FP4 and FP6 precision execution, offering trade-offs between accuracy and performance for large-scale training. In addition, the introduction of the Tensor Memory (TMEM) subsystem as a dedicated on-chip memory for tensor data movement reduces reliance on shared memory (SMEM) and per SM register files (RF) during matrix-intensive operations. Next, NVIDIA included a hardware decompression engine (DE) and redesigned the instruction pipeline for access to compressed model weights. Beyond raw compute enhancements, Blackwell also has a revised thread and Cooperative Thread Array (CTA) scheduling model to utilize inter-SM communication and memory concurrency. With so many changes introduced, intended to address the escalating demands of AI, gaming and scientific computing, an analysis of the microarchitecture and new instructions is necessary, which will provide application developers and scientists to achieve the highest performance possible for modern and future GPUs.  \n\n", "text": "As the direct successor to the Hopper generation, the Blackwell architecture extends NVIDIA's GPU design in several modifications across the compute pipeline, memory hierarchy, and tensor processing subsystems. Blackwell introduces 5th-generation tensor cores capable of FP4 and FP6 precision execution, offering trade-offs between accuracy and performance for large-scale training. In addition, the introduction of the Tensor Memory (TMEM) subsystem as a dedicated on-chip memory for tensor data movement reduces reliance on shared memory (SMEM) and per SM register files (RF) during matrix-intensive operations. Next, NVIDIA included a hardware decompression engine (DE) and redesigned the instruction pipeline for access to compressed model weights. Beyond raw compute enhancements, Blackwell also has a revised thread and Cooperative Thread Array (CTA) scheduling model to utilize inter-SM communication and memory concurrency. With so many changes introduced, intended to address the escalating demands of AI, gaming and scientific computing, an analysis of the microarchitecture and new instructions is necessary, which will provide application developers and scientists to achieve the highest performance possible for modern and future GPUs.\n", "alignment": "left", "unique_id": "d6c643beb24f6a8f61e9d7c7c40d685b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As the direct successor to the Hopper generation, the Blackwell architecture extends NVIDIA's GPU design in several modifications across the compute pipeline, memory hierarchy, and tensor processing subsystems. Blackwell introduces 5th-generation tensor cores capable of FP4 and FP6 precision execution, offering trade-offs between accuracy and performance for large-scale training. In addition, the introduction of the Tensor Memory (TMEM) subsystem as a dedicated on-chip memory for tensor data movement reduces reliance on shared memory (SMEM) and per SM register files (RF) during matrix-intensive operations. Next, NVIDIA included a hardware decompression engine (DE) and redesigned the instruction pipeline for access to compressed model weights. Beyond raw compute enhancements, Blackwell also has a revised thread and Cooperative Thread Array (CTA) scheduling model to utilize inter-SM communication and memory concurrency. With so many changes introduced, intended to address the escalating demands of AI, gaming and scientific computing, an analysis of the microarchitecture and new instructions is necessary, which will provide application developers and scientists to achieve the highest performance possible for modern and future GPUs."}], "lineHeight": 0}}, "target": {"markdown": "作为 Hopper 代的直接继任者，Blackwell 架构在计算流水线、内存层次结构和张量处理子系统等多个方面对 NVIDIA 的 GPU 设计进行了扩展。Blackwell 引入了支持 FP4 和 FP6 精度执行的第五代张量核心，为大规模训练提供了精度与性能之间的权衡。此外，引入的张量存储器（TMEM）子系统作为专用的片上存储器用于张量数据移动，减少了在矩阵密集型运算中对共享内存（SMEM）和每个 SM 寄存器文件（RF）的依赖。此外，NVIDIA 还集成了一个硬件解压缩引擎（DE），并重新设计了指令流水线以支持对压缩模型权重的访问。除了原始计算能力的增强之外，Blackwell 还采用了改进的线程与协作线程数组（CTA）调度模型，以利用 SM 间通信和内存并发性。鉴于引入了如此多的变革，旨在应对 AI、游戏和科学计算日益增长的需求，有必要对微架构和新指令进行分析，这将使应用开发者和科学家能够在现代及未来 GPU 上实现尽可能高的性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "559174a75122f17156e795779a35a0e0", "index": 13, "aliyun_index": 13, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "This paper introduces a newly developed open-source microbenchmark suite (unable to share the code at this time due to double-blind), implemented in PTX and CUDA, that enables comprehensive architectural analysis of NVIDIA's Blackwell GPU. Emphasizing innovations that distinguish it from Hopper, the suite systematically evaluates performance under stress—particularly in compute-bound and memory-bound workloads—revealing implications for parallel computing applications.  \n\n", "text": "This paper introduces a newly developed open-source microbenchmark suite (unable to share the code at this time due to double-blind), implemented in PTX and CUDA, that enables comprehensive architectural analysis of NVIDIA's Blackwell GPU. Emphasizing innovations that distinguish it from Hopper, the suite systematically evaluates performance under stress—particularly in compute-bound and memory-bound workloads—revealing implications for parallel computing applications.\n", "alignment": "left", "unique_id": "559174a75122f17156e795779a35a0e0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "colo tate of the art GPU microbenchmarks. Following, Section III presents an overview of the Blackwell's B200 architecture. After which, Section IV details the microbenchmark methodology we employ to systematically characterize the Blackwell microarchitecture. While, Section V details the memory subsystem before Section VI presents the tensor core pipeline. Section VII presents performance analysis across key workloads and to conclude we discuss implications and trade-offs in Section VIII.  \n\n", "text": "The remainder of this paper is organized as follows: Section II details our contributions to the current state of the art GPU microbenchmarks. Following, Section III presents an overview of the Blackwell's B200 architecture. After which, Section IV details the microbenchmark methodology we employ to systematically characterize the Blackwell microarchitecture. While, Section V details the memory subsystem before Section VI presents the tensor core pipeline. Section VII presents performance analysis across key workloads and to conclude we discuss implications and trade-offs in Section VIII.\n", "alignment": "left", "unique_id": "466c1d858705126f0e9e3f10f98741a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The remainder of this paper is organized as follows: Section II details our contributions to the current state of the art GPU microbenchmarks. Following, Section III presents an overview of the Blackwell's B200 architecture. After which, Section IV details the microbenchmark methodology we employ to systematically characterize the Blackwell microarchitecture. While, Section V details the memory subsystem before Section VI presents the tensor core pipeline. Section VII presents performance analysis across key workloads and to conclude we discuss implications and trade-offs in Section VIII."}], "lineHeight": 0}}, "target": {"markdown": "本文其余部分的组织结构如下：第 II 节详细阐述我们相对于当前最先进 GPU 微基准测试的贡献。第 III 节概述 Blackwell B200 架构。第 IV 节详细介绍我们用于系统地表征 Blackwell 微架构的微基准测试方法。第 V 节详述内存子系统，随后第 VI 节介绍张量核心流水线。第 VII 节展示关键工作负载上的性能分析，最后在第 VIII 节讨论相关影响与权衡取舍。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "77886bfa4cf140168f73c7044e203498", "index": 23, "aliyun_index": 5, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## II. RELATED WORK\n", "text": "II. RELATED WORK\n", "alignment": "left", "unique_id": "77886bfa4cf140168f73c7044e203498", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "II. RELATED WORK"}], "lineHeight": 0}}, "target": {"markdown": "## II. 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "9dedf39f533d145b43fda8c1ab6f5e6c", "index": 24, "aliyun_index": 6, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Understanding GPU performance has long been a critical focus in HPC research. Over the years, several studies have used microbenchmarks and other methodologies to dissect architectural layers and analyze GPU microarchitectures in fine-grained detail. Early studies on Tesla and Fermi focused on memory and cache behavior [4], [5], while later work dissecting Kepler, Pascal [6], and Maxwell [7] examined warp scheduling and instruction latency. With Turing through Hopper [8]–[15], research shifted to mixed-precision and tensor core performance, introducing benchmarks formma instructions, tile sizes, and data layouts. Recent efforts also explore instruction-level parallelism [16], and pipeline dynamics under high register pressure.  \n\n", "text": "Understanding GPU performance has long been a critical focus in HPC research. Over the years, several studies have used microbenchmarks and other methodologies to dissect architectural layers and analyze GPU microarchitectures in fine-grained detail. Early studies on Tesla and Fermi focused on memory and cache behavior [4], [5], while later work dissecting Kepler, Pascal [6], and Maxwell [7] examined warp scheduling and instruction latency. With Turing through Hopper [8]–[15], research shifted to mixed-precision and tensor core performance, introducing benchmarks formma instructions, tile sizes, and data layouts. Recent efforts also explore instruction-level parallelism [16], and pipeline dynamics under high register pressure.\n", "alignment": "left", "unique_id": "9dedf39f533d145b43fda8c1ab6f5e6c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Understanding GPU performance has long been a critical focus in HPC research. Over the years, several studies have used microbenchmarks and other methodologies to dissect architectural layers and analyze GPU microarchitectures in fine-grained detail. Early studies on Tesla and Fermi focused on memory and cache behavior [4], [5], while later work dissecting Kepler, Pascal [6], and Maxwell [7] examined warp scheduling and instruction latency. With Turing through Hopper [8]–[15], research shifted to mixed-precision and tensor core performance, introducing benchmarks formma instructions, tile sizes, and data layouts. Recent efforts also explore instruction-level parallelism [16], and pipeline dynamics under high register pressure."}], "lineHeight": 0}}, "target": {"markdown": "理解 GPU 性能长期以来一直是 HPC 研究的关键焦点。多年来，许多研究使用微基准测试及其他方法来细致地剖析架构层并分析 GPU 微架构。早期针对 Tesla 和 Fermi 的研究侧重于内存与缓存行为 [4]、[5]，而后续对 Kepler、Pascal [6] 和 Maxwell [7] 的剖析工作则考察了 warp 调度与指令延迟。从 Turing 到 Hopper [8]–[15]，研究重心转向混合精度与张量核心性能，引入了针对 mma 指令、tile 大小和数据布局的基准测试。近期的工作还探索了指令级并行性 [16]，以及在高寄存器压力下的流水线动态行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "910ea320142889bdc5a75e7773c78ea7", "index": 25, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Beyond microbenchmarking, researchers built frameworks to characterize GPU performance. Application profiling  $ [17] $  gathers runtime metrics but faces overhead and limited architectural visibility. Roofline models  $ [18] $  offer throughput vs. intensity plots, yet oversimplify bottlenecks and miss dynamic memory behaviors. Cache stall prediction  $ [19] $  estimates pipeline delays from access patterns but fails to capture modern GPU complexities like cache bypassing, warp scheduling, and memory coalescing.  \n\n", "text": "Beyond microbenchmarking, researchers built frameworks to characterize GPU performance. Application profiling  $ [17] $  gathers runtime metrics but faces overhead and limited architectural visibility. Roofline models  $ [18] $  offer throughput vs. intensity plots, yet oversimplify bottlenecks and miss dynamic memory behaviors. Cache stall prediction  $ [19] $  estimates pipeline delays from access patterns but fails to capture modern GPU complexities like cache bypassing, warp scheduling, and memory coalescing.\n", "alignment": "left", "unique_id": "910ea320142889bdc5a75e7773c78ea7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Beyond microbenchmarking, researchers built frameworks to characterize GPU performance. Application profiling  $ [17] $  gathers runtime metrics but faces overhead and limited architectural visibility. Roofline models  $ [18] $  offer throughput vs. intensity plots, yet oversimplify bottlenecks and miss dynamic memory behaviors. Cache stall prediction  $ [19] $  estimates pipeline delays from access patterns but fails to capture modern GPU complexities like cache bypassing, warp scheduling, and memory coalescing."}], "lineHeight": 0}}, "target": {"markdown": "除了微基准测试之外，研究人员还构建了用于表征 GPU 性能的框架。应用性能分析 [17] 收集运行时指标，但存在开销较大且架构可见性有限的问题。Roofline 模型 [18] 提供了吞吐量与计算强度的关系图，但过度简化了瓶颈，并忽略了动态内存行为。缓存停顿预测 [19] 通过访问模式估算流水线延迟，但无法捕捉现代 GPU 的复杂性，例如缓存绕过、warp 调度和内存合并访问。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "d4006a7d6d6409a5fd01991e6e49c5ba", "index": 26, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Analytical models like Accel-Sim [20] and GCoM [21], built on Hong and Kim's work [22], offer useful GPU performance insights but neither of them model Blackwell-specific features like TMEM or the DE, as the detailed architectural information required for accurate simulation remain unknown.  \n\n", "text": "Analytical models like Accel-Sim [20] and GCoM [21], built on Hong and Kim's work [22], offer useful GPU performance insights but neither of them model Blackwell-specific features like TMEM or the DE, as the detailed architectural information required for accurate simulation remain unknown.\n", "alignment": "left", "unique_id": "d4006a7d6d6409a5fd01991e6e49c5ba", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Analytical models like Accel-Sim [20] and GCoM [21], built on Hong and Kim's work [22], offer useful GPU performance insights but neither of them model Blackwell-specific features like TMEM or the DE, as the detailed architectural information required for accurate simulation remain unknown."}], "lineHeight": 0}}, "target": {"markdown": "诸如 Accel-Sim [20] 和 GCoM [21] 等分析模型基于 Hong 与 Kim 的工作 [22] 构建，能够提供有价值的 GPU 性能洞见，但二者均未对 Blackwell 所特有的功能（如 TMEM 或解压缩引擎 DE）进行建模，因为准确仿真所需的详细架构信息尚未公开。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "518504de740211f49ba69bb7d5d13877", "index": 27, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Thus, without a systematic understanding of these components, the research community lacks critical data needed for performance modeling, workload optimization, and accurate simulation of AI reasoning workloads typically needed for datacenter deployments.  \n\n", "text": "Thus, without a systematic understanding of these components, the research community lacks critical data needed for performance modeling, workload optimization, and accurate simulation of AI reasoning workloads typically needed for datacenter deployments.\n", "alignment": "left", "unique_id": "518504de740211f49ba69bb7d5d13877", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Thus, without a systematic understanding of these components, the research community lacks critical data needed for performance modeling, workload optimization, and accurate simulation of AI reasoning workloads typically needed for datacenter deployments."}], "lineHeight": 0}}, "target": {"markdown": "因此，若缺乏对这些组件的系统性理解，研究界将缺少性能建模、工作负载优化以及准确仿真数据中心部署中典型 AI 推理工作负载所需的关键数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source":
