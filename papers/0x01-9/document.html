mes64$ element tiles (4KB for FP8 precision), aligning with the 256KB TMEM capacity per SM and fully utilizing the 1024-bit memory interface width. (PTX wgmma matrix shapes require $M\\ge64$, e.g. m64n8k16 through m64n256k16.) Tiles smaller than $32\\times32$ elements underutilize the wide memory interface in our TMEM microbenchmarks, while tiles larger than $128\\times128$ elements can trigger multi-phase transfers. These bandwidth saturation points directly inform optimal kernel design: matrix multiplication kernels should decompose computations into $64\\times64$ tiles to maximize TMEM utilization, and chained operations such as those in transformer attention mechanisms ($\\mathbf{Q}\\times\\mathbf{K}^T$ followed by softmax and value multiplication) should maintain intermediate results in TMEM to exploit the 16 TB/s read bandwidth for subsequent operations.  \n\n", "text": "Our instruction-level analysis across varying operand sizes and access strides reveals critical performance characteristics. TMEM achieves optimal efficiency at $64\\times64$ element tiles (4KB for FP8 precision), aligning with the 256KB TMEM capacity per SM and fully utilizing the 1024-bit memory interface width. (PTX wgmma matrix shapes require $M\\ge64$, e.g. m64n8k16 through m64n256k16.) Tiles smaller than $32\\times32$ elements underutilize the wide memory interface in our TMEM microbenchmarks, while tiles larger than $128\\times128$ elements can trigger multi-phase transfers. These bandwidth saturation points directly inform optimal kernel design: matrix multiplication kernels should decompose computations into $64\\times64$ tiles to maximize TMEM utilization, and chained operations such as those in transformer attention mechanisms ($\\mathbf{Q}\\times\\mathbf{K}^T$ followed by softmax and value multiplication) should maintain intermediate results in TMEM to exploit the 16 TB/s read bandwidth for subsequent operations.\n", "alignment": "left", "unique_id": "7964d94c5d838259f4e3ccd0626c085d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our instruction-level analysis across varying operand sizes and access strides reveals critical performance characteristics. TMEM achieves optimal efficiency at $64\\times64$ element tiles (4KB for FP8 precision), aligning with the 256KB TMEM capacity per SM and fully utilizing the 1024-bit memory interface width. (PTX wgmma matrix shapes require $M\\ge64$, e.g. m64n8k16 through m64n256k16.) Tiles smaller than $32\\times32$ elements underutilize the wide memory interface in our TMEM microbenchmarks, while tiles larger than $128\\times128$ elements can trigger multi-phase transfers. These bandwidth saturation points directly inform optimal kernel design: matrix multiplication kernels should decompose computations into $64\\times64$ tiles to maximize TMEM utilization, and chained operations such as those in transformer attention mechanisms ($\\mathbf{Q}\\times\\mathbf{K}^T$ followed by softmax and value multiplication) should maintain intermediate results in TMEM to exploit the 16 TB/s read bandwidth for subsequent operations."}], "lineHeight": 0}}, "target": {"markdown": "我们对不同操作数大小和访问步长进行的指令级分析揭示了关键的性能特性。TMEM 在 $64\\times64$ 元素 tile（FP8 精度下为 4KB）时达到最佳效率，这与每个 SM 的 256KB TMEM 容量相匹配，并充分利用了 1024 位的内存接口宽度。（PTX wgmma 矩阵形状要求 $M\\ge64$，例如 m64n8k16 至 m64n256k16。）在我们的 TMEM 微基准测试中，小于 $32\\times32$ 元素的 tile 无法充分利用宽内存接口，而大于 $128\\times128$ 元素的 tile 则可能触发多阶段传输。这些带宽饱和点直接为最优内核设计提供了指导：矩阵乘法内核应将计算分解为 $64\\times64$ 的 tile 以最大化 TMEM 利用率；而诸如 Transformer 注意力机制中的链式操作（$\\mathbf{Q}\\times\\mathbf{K}^T$ 随后与 softmax 和 value 相乘）应将中间结果保留在 TMEM 中，以利用 16 TB/s 的读取带宽进行后续操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "bca4e83f2ebbf9620ec7d592938cb908", "index": 74, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Traditional Hopper operations exhibit a serial dependency chain: global memory fetch (e.g. TMA or cp.async.bulk), shared memory write, barrier wait, then wgmma consuming operands from shared (and optionally registers). On Blackwell, TMEM is software-managed via tcgen05.alloc, tcgen05.cp, tcgen05.ld/tcgen05.st; software uses tcgen05.cp to copy data into TMEM from shared memory, and tcgen05.mma can then overlap with subsequent tcgen05.cp for double-buffered pipelines.  \n\n", "text": "Traditional Hopper operations exhibit a serial dependency chain: global memory fetch (e.g. TMA or cp.async.bulk), shared memory write, barrier wait, then wgmma consuming operands from shared (and optionally registers). On Blackwell, TMEM is software-managed via tcgen05.alloc, tcgen05.cp, tcgen05.ld/tcgen05.st; software uses tcgen05.cp to copy data into TMEM from shared memory, and tcgen05.mma can then overlap with subsequent tcgen05.cp for double-buffered pipelines.\n", "alignment": "left", "unique_id": "bca4e83f2ebbf9620ec7d592938cb908", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Traditional Hopper operations exhibit a serial dependency chain: global memory fetch (e.g. TMA or cp.async.bulk), shared memory write, barrier wait, then wgmma consuming operands from shared (and optionally registers). On Blackwell, TMEM is software-managed via tcgen05.alloc, tcgen05.cp, tcgen05.ld/tcgen05.st; software uses tcgen05.cp to copy data into TMEM from shared memory, and tcgen05.mma can then overlap with subsequent tcgen05.cp for double-buffered pipelines."}], "lineHeight": 0}}, "target": {"markdown": "传统的 Hopper 操作呈现串行的依赖链：全局内存取数（例如 TMA 或 `cp.async.bulk`）、写入共享内存、屏障等待，然后 `wgmma` 从共享内存（以及可选的寄存器）消费操作数。在 Blackwell 上，TMEM 由软件通过 `tcgen05.alloc`、`tcgen05.cp`、`tcgen05.ld`/`tcgen05.st` 进行管理；软件使用 `tcgen05.cp` 将数据从共享内存拷贝到 TMEM，随后 `tcgen05.mma` 可以与下一次 `tcgen05.cp` 重叠执行，从而构成双缓冲流水线。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "cc24016efb43fa70a8640ef7158bf040", "index": 75, "aliyun_index": 5, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "For chained matrix multiplications where $\\mathbf{D} = (\\mathbf{A} \\times \\mathbf{B}) \\times \\mathbf{C}$, keeping the intermediate result in TMEM eliminates a substantial amount of off-chip traffic relative to a Hopper-style design that writes intermediates back to global memory. Under bandwidth and traffic assumptions, this corresponds to an estimated $\\approx 12$ TB/s of data movement per SM that can be avoided on a fully utilized Blackwell SM.  \n\n", "text": "For chained matrix multiplications where $\\mathbf{D} = (\\mathbf{A} \\times \\mathbf{B}) \\times \\mathbf{C}$, keeping the intermediate result in TMEM eliminates a substantial amount of off-chip traffic relative to a Hopper-style design that writes intermediates back to global memory. Under bandwidth and traffic assumptions, this corresponds to an estimated $\\approx 12$ TB/s of data movement per SM that can be avoided on a fully utilized Blackwell SM.\n", "alignment": "left", "unique_id": "cc24016efb43fa70a8640ef7158bf040", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For chained matrix multiplications where $\\mathbf{D} = (\\mathbf{A} \\times \\mathbf{B}) \\times \\mathbf{C}$, keeping the intermediate result in TMEM eliminates a substantial amount of off-chip traffic relative to a Hopper-style design that writes intermediates back to global memory. Under bandwidth and traffic assumptions, this corresponds to an estimated $\\approx 12$ TB/s of data movement per SM that can be avoided on a fully utilized Blackwell SM."}], "lineHeight": 0}}, "target": {"markdown": "对于链式矩阵乘法 $\\mathbf{D} = (\\mathbf{A} \\times \\mathbf{B}) \\times \\mathbf{C}$，将中间结果保留在 TMEM 中，相较于将中间结果写回全局内存的 Hopper 式设计，可消除大量片外流量。在带宽和流量假设下，这相当于在完全利用的 Blackwell SM 上，每个 SM 估计可避免约 $\\approx 12$ TB/s 的数据搬移。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "553f21f5ac03cc4c385ee556a560caae", "index": 76, "aliyun_index": 6, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "### B. Decompression Engine (DE)\n", "text": "B. Decompression Engine (DE)\n", "alignment": "left", "unique_id": "553f21f5ac03cc4c385ee556a560caae", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Decompression Engine (DE)"}], "lineHeight": 0}}, "target": {"markdown": "### B. 解压缩引擎（DE）\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "a7c308cdae55946704e4931132fc08a8", "index": 77, "aliyun_index": 7, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The NVIDIA Blackwell B200 GPU introduces a dedicated hardware Decompression Engine (DE), marking a significant architectural advancement over the software-only decompression of its predecessor, the H100. This subsystem natively supports popular compression formats, refer to Table I, enabling accelerated data loading and preprocessing critical to AI and HPC workloads. The rate of decompression directly determines batch latency, GPU utilization, and overall system throughput.  \n\n", "text": "The NVIDIA Blackwell B200 GPU introduces a dedicated hardware Decompression Engine (DE), marking a significant architectural advancement over the software-only decompression of its predecessor, the H100. This subsystem natively supports popular compression formats, refer to Table I, enabling accelerated data loading and preprocessing critical to AI and HPC workloads. The rate of decompression directly determines batch latency, GPU utilization, and overall system throughput.\n", "alignment": "left", "unique_id": "a7c308cdae55946704e4931132fc08a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The NVIDIA Blackwell B200 GPU introduces a dedicated hardware Decompression Engine (DE), marking a significant architectural advancement over the software-only decompression of its predecessor, the H100. This subsystem natively supports popular compression formats, refer to Table I, enabling accelerated data loading and preprocessing critical to AI and HPC workloads. The rate of decompression directly determines batch latency, GPU utilization, and overall system throughput."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA Blackwell B200 GPU 引入了专用的硬件解压缩引擎（DE），标志着相对于其前代产品 H100 仅基于软件的解压缩方案的重大架构进步。该子系统原生支持主流压缩格式（参见表 I），能够加速数据加载和预处理，这对 AI 和 HPC 工作负载至关重要。解压缩的速率直接决定了批量延迟、GPU 利用率以及整体系统吞吐量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "e434286066348f0930783a5df7bb6d91", "index": 78, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "To characterize the performance of the B200's Decompression Engine, we developed a suite of microbenchmarks target-  \n\n", "text": "To characterize the performance of the B200's Decompression Engine, we developed a suite of microbenchmarks target-\n", "alignment": "left", "unique_id": "e434286066348f0930783a5df7bb6d91", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To characterize the performance of the B200's Decompression Engine, we developed a suite of microbenchmarks target-"}], "lineHeight": 0}}, "target": {"markdown": "为了表征 B200 解压缩引擎的性能，我们开发了一套针对……的微基准测试——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "de98bf730d5160311bde0555bf8fea33", "index": 79, "aliyun_index": 9, "page_num": 4, "type": "table", "sub_type": "none", "markdown": "| Data Pattern | Compression Ratio | Input (GB/s) | Output (GB/s) | Latency (ms) |\n| --- | --- | --- | --- | --- |\n| Random | 1.00x | 173.23 | 172.55 | 0.608 |\n| Mixed | 1.98x | 80.11 | 158.94 | 0.660 |\n| Repetitive | 15.02x | 14.63 | 219.80 | 0.477 |\n| Zeros | 245.45x | 0.85 | 209.83 | 0.500 |\n\n", "text": "| Data Pattern|Compression Ratio|Input (GB/s)|Output (GB/s)|Latency (ms)|\n| ---|---|---|---|---|\n| Random|1.00x|173.23|172.55|0.608|\n| Mixed|1.98x|80.11|158.94|0.660|\n| Repetitive|15.02x|14.63|219.80|0.477|\n| Zeros|245.45x|0.85|209.83|0.500|\n", "alignment": "left", "unique_id": "de98bf730d5160311bde0555bf8fea33", "edited": false, "extra": {"numCol": 5, "cells": [{"yec": 0, "xec": 0, "ysc": 0, "xsc": 0, "type": "text", "alignment": "left", "cellId": 0, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Data Pattern"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Data Pattern\n", "alignment": "left",  ratios is consistent with a decompression-throughput–bounded design for these LZ4 workloads.\n", "alignment": "left", "unique_id": "be19784f252777ca7aadfe629ccde83d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Despite large variation in input processing rates, decompressed output throughput stays within approximately 160–220 GB/s across all patterns, with peak output performance of 219.80 GB/s on repetitive data. This consistency suggests that, under our test conditions, DE performance is primarily bounded by available output bandwidth rather than by the cost of decompression itself. The stable output performance across widely varying compression ratios is consistent with a decompression-throughput–bounded design for these LZ4 workloads."}], "lineHeight": 0}}, "target": {"markdown": "尽管输入处理速率变化巨大，但所有数据模式下的解压缩输出吞吐仍维持在约 160–220 GB/s 范围内，在重复数据上达到 219.80 GB/s 的峰值输出性能。这种一致性表明，在我们的测试条件下，DE 的性能主要受可用输出带宽的限制，而非解压缩操作本身的计算开销。在压缩比差异极大的情况下输出性能依然保持稳定，这与面向这些 LZ4 工作负载的、以解压缩吞吐为瓶颈的设计理念是一致的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "73049b873b4f65ca9322f78a1d2432e3", "index": 87, "aliyun_index": 2, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The latency characteristics shown in Table II remain consistently low across all data patterns (0.477–0.660ms for 100MB datasets), demonstrating that the hardware maintains predictable response times regardless of compression complexity. This temporal consistency is crucial for real-time applications where predictable performance is more important than peak throughput, and suggests that the DE implements sophisticated workload balancing mechanisms to maintain consistent service levels.  \n\n", "text": "T  1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TABLE III"}], "lineHeight": 0}}, "target": {"markdown": ">表 III", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "dba23ad55a315f64ed95ba1bab1855fc", "index": 90, "aliyun_index": 5, "page_num": 5, "type": "table_note", "sub_type": "none", "markdown": ">PIPELINE DEPTH CHARACTERISTICS ACROSS CHUNK SIZES (32–256 KB)\nON A B200 GPU. PIPELINE DEPTH REFLECTS THE MINIMUM\nCONCURRENCY LEVEL THAT MAINTAINS APPROXIMATELY >85% OF\nPEAK THROUGHPUT. METHODOLOGY: 100 MB TOTAL PAYLOAD USING\nNVCOMP WITH THE HARDWARE DECOMPRESSION ENGINE ENABLED.  \n\n", "text": "PIPELINE DEPTH CHARACTERISTICS ACROSS CHUNK SIZES (32–256 KB)\nON A B200 GPU. PIPELINE DEPTH REFLECTS THE MINIMUM\nCONCURRENCY LEVEL THAT MAINTAINS APPROXIMATELY >85% OF\nPEAK THROUGHPUT. METHODOLOGY: 100 MB TOTAL PAYLOAD USING\nNVCOMP WITH THE HARDWARE DECOMPRESSION ENGINE ENABLED.\n", "alignment": "left", "unique_id": "dba23ad55a315f64ed95ba1bab1855fc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "PIPELINE DEPTH CHARACTERISTICS ACROSS CHUNK SIZES (32–256 KB)"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ON A B200 GPU. PIPELINE DEPTH REFLECTS THE MINIMUM"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "CONCURRENCY LEVEL THAT MAINTAINS APPROXIMATELY >85% OF"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "PEAK THROUGHPUT. METHODOLOGY: 100 MB TOTAL PAYLOAD USING"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVCOMP WITH THE HARDWARE DECOMPRESSION ENGINE ENABLED."}], "lineHeight": -109}}, "target": {"markdown": ">表 III\n跨数据块大小（32–256 KB）的流水线深度特性，基于 B200 GPU 测试。流水线深度反映了可维持峰值吞吐约 85% 以上的最低并发度。方法：使用 NVCOMP 配合硬件解压缩引擎，总负载为 100 MB。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 90}, {"source": {"block_id": "8de24b6265d839337cb206e9579f1797", "index": 91, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The pipeline depth analysis in Table III shows that, on B200 with our nvCOMP-based benchmark, small and medium chunks (32–64 KB) reach near-peak throughput with shallow pipeline depths (1–2), while larger chunks (128–256 KB) benefit from deeper concurrency (depth 8). Rather than a strictly monotonic “smaller chunk $\\Rightarrow$ higher optimal depth” pattern, these results indicate that the effective concurrency needed to saturate the DE depends on both chunk size and the implementation’s internal scheduling strategy.  \n\n", "text": "The pipeline depth analysis in Table III shows that, on B200 with our nvCOMP-based benchmark, small and medium chunks (32–64 KB) reach near-peak throughput with shallow pipeline depths (1–2), while larger chunks (128–256 KB) benefit from deeper concurrency (depth 8). Rather than a strictly monotonic “smaller chunk $\\Rightarrow$ higher optimal depth” pattern, these results indicate that the effective concurrency needed to saturate the DE depends on both chunk size and the implementation’s internal scheduling strategy.\n", "alignment": "left", "unique_id": "8de24b6265d839337cb206e9579f1797", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The pipeline depth analysis in Table III shows that, on B200 with our nvCOMP-based benchmark, small and medium chunks (32–64 KB) reach near-peak throughput with shallow pipeline depths (1–2), while larger chunks (128–256 KB) benefit from deeper concurrency (depth 8). Rather than a strictly monotonic “smaller chunk $\\Rightarrow$ higher optimal depth” pattern, these results indicate that the effective concurrency needed to saturate the DE depends on both chunk size and the implementation’s internal scheduling strategy."}], "lineHeight": 0}}, "target": {"markdown": "表 III 中的流水线深度分析表明，在基于 nvCOMP 的基准测试下，B200 上的小块和中块数据（32–64 KB）只需较浅的流水线深度（1–2）即可达到接近峰值的吞吐，而较大的数据块（128–256 KB）则受益于更深的并发（深度 8）。这些结果并未呈现出严格的单调关系，即并非\"数据块越小，最佳流水线深度越高\"，而是表明使 DE 饱和所需的有效并发度同时依赖于数据块大小以及实现内部的调度策略。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 91}, {"source": {"block_id": "5e0e537b8b5c59823f04ef89b33f25b0", "index": 92, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Peak throughput increases from 55.84 GB/s at 32 KB to 112.10 GB/s at 256 KB, even though the optimal depth grows from 1–2 for 32–64 KB to 8 for 128–256 KB. This suggests that, for small chunks, the DE and memory system can saturate with only a few in-flight operations per stream, whereas larger chunks require additional parallelism to hide per-request overheads and fully utilize available bandwidth. Maximum observed speedups relative to a single sequential request range  \n\n", "text": "Peak throughput increases from 55.84 GB/s at 32 KB to 112.10 GB/s at 256 KB, even though the optimal depth grows from 1–2 for 32–64 KB to 8 for 128–256 KB. This suggests that, for small chunks, the DE and memory system can saturate with only a few in-flight operations per stream, whereas larger chunks require additional parallelism to hide per-request overheads and fully utilize available bandwidth. Maximum observed speedups relative to a single sequential request range\n", "alignment": "left", "unique_id": "5e0e537b8b5c59823f04ef89b33f25b0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Peak throughput increases from 55.84 GB/s at 32 KB to 112.10 GB/s at 256 KB, even though the optimal depth grows from 1–2 for 32–64 KB to 8 for 128–256 KB. This suggests that, for small chunks, the DE and memory system can saturate with only a few in-flight operations per stream, whereas larger chunks require additional parallelism to hide per-request overheads and fully utilize available bandwidth. Maximum observed speedups relative to a single sequential request range"}], "lineHeight": 0}}, "target": {"markdown": "峰值吞吐从 32 KB 时的 55.84 GB/s 提升至 256 KB 时的 112.10 GB/s，尽管最佳流水线深度从 32–64 KB 的 1–2 增加到 128–256 KB 的 8。这表明，对于小块数据，仅需每个流少量处于进行中的操作即可使 DE 和内存系统达到饱和，而较大的数据块则需要更高的并行度来隐藏单次请求的开销，并充分利用可用带宽。相对于单个顺序请求所观测到的最大加速比范围", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 92}, {"source": {"block_id": "692f38f9b319ecdbccecf26977afb6d0", "index": 93, "aliyun_index": 8, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "from roughly 35.8× to 89.1×, confirming substantial benefit\nfrom batching and concurrency.  \n\n", "text": "from roughly 35.8× to 89.1×, confirming substantial benefit\nfrom batching and concurrency.\n", "alignment": "left", "unique_id": "692f38f9b319ecdbccecf26977afb6d0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from roughly 35.8× to 89.1×, confirming substantial benefit"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from batching and concurrency."}], "lineHeight": -56}}, "target": {"markdown": "约为 35.8× 至 89.1×，证实了批处理与并发带来的显著收益。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 93}, {"source": {"block_id": "9e26baadb8d1bcc4a06a333e2f16bf17", "index": 94, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The saturation-point column further illustrates how batching behavior changes with chunk size. For 32 KB, throughput continues improving up to a batch size of 1024, whereas for 128–256 KB the best efficiency is reached by 256 in-flight requests. Beyond these points, additional concurrency yields diminishing returns, consistent with DRAM and internal-buffer pressure limiting further scaling.  \n\n", "text": "The saturation-point column further illustrates how batching behavior changes with chunk size. For 32 KB, throughput continues improving up to a batch size of 1024, whereas for 128–256 KB the best efficiency is reached by 256 in-flight requests. Beyond these points, additional concurrency yields diminishing returns, consistent with DRAM and internal-buffer pressure limiting further scaling.\n", "alignment": "left", "unique_id": "9e26baadb8d1bcc4a06a333e2f16bf17", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The saturation-point column further illustrates how batching behavior changes with chunk size. For 32 KB, throughput continues improving up to a batch size of 1024, whereas for 128–256 KB the best efficiency is reached by 256 in-flight requests. Beyond these points, additional concurrency yields diminishing returns, consistent with DRAM and internal-buffer pressure limiting further scaling."}], "lineHeight": 0}}, "target": {"markdown": "饱和点列进一步说明了批处理行为如何随数据块大小而变化。对于 32 KB，吞吐在批大小达到 1024 之前持续提升；而对于 128–256 KB，在 256 个并发请求时即可达到最佳效率。超过这些点后，进一步增加并发度所产生的收益递减，这与 DRAM 和内部缓冲区压力限制进一步扩展的现象一致。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 94}, {"source": {"block_id": "ccebcd78164e7057d084573ca6b501f0", "index": 95, "aliyun_index": 10, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Single-request throughput also scales with chunk size (from 0.63 GB/s at 32 KB to 3.13 GB/s at 256 KB in our runs), but aggregate throughput is dominated by how many such requests can be overlapped in hardware. Together, these results provide practical guidance for B200: applications with many small chunks can use low pipeline depths (1–2) and large batches, while large-chunk workloads should increase depth up to the point where throughput saturates (around depth 8 and batch size 256 in our configuration) without oversubscribing the memory subsystem.  \n\n", "text": "Single-request throughput also scales with chunk size (from 0.63 GB/s at 32 KB to 3.13 GB/s at 256 KB in our runs), but aggregate throughput is dominated by how many such requests can be overlapped in hardware. Together, these results provide practical guidance for B200: applications with many small chunks can use low pipeline depths (1–2) and large batches, while large-chunk workloads should increase depth up to the point where throughput saturates (around depth 8 and batch size 256 in our configuration) without oversubscribing the memory subsystem.\n", "alignment": "left", "unique_id": "ccebcd78164e7057d084573ca6b501f0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Single-request throughput also scales with chunk size (from 0.63 GB/s at 32 KB to 3.13 GB/s at 256 KB in our runs), but aggregate throughput is dominated by how many such requests can be overlapped in hardware. Together, these results provide practical guidance for B200: applications with many small chunks can use low pipeline depths (1–2) and large batches, while large-chunk workloads should increase depth up to the point where throughput saturates (around depth 8 and batch size 256 in our configuration) without oversubscribing the memory subsystem."}], "lineHeight": 0}}, "target": {"markdown": "单请求吞吐同样随数据块大小而扩展（在我们的测试中，从 32 KB 时的 0.63 GB/s 提升至 256 KB 时的 3.13 GB/s），但聚合吞吐主要取决于硬件中可重叠执行的请求数量。综合来看，这些结果为 B200 提供了实用指导：处理大量小块数据的应用可采用较低的流水线深度（1–2）和较大的批大小，而处理大块数据的工作负载则应将流水线深度提升至吞吐饱和的临界点（在我们的配置中约为深度 8、批大小 256），同时避免对内存子系统过度订阅。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 95}, {"source": {"block_id": "90783ce02ed58329d1d71260dc6a968c", "index": 96, "aliyun_index": 11, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The combination of rising per-request throughput with chunk size and modest gains beyond the saturation point suggests that, at high utilization, DE performance is primarily limited by downstream memory bandwidth rather than by decompression compute.  \n\n", "text": "The combination of rising per-request throughput with chunk size and modest gains beyond the saturation point suggests that, at high utilization, DE performance is primarily limited by downstream memory bandwidth rather than by decompression compute.\n", "alignment": "left", "unique_id": "90783ce02ed58329d1d71260dc6a968c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The combination of rising per-request throughput with chunk size and modest gains beyond the saturation point suggests that, at high utilization, DE performance is primarily limited by downstream memory bandwidth rather than by decompression compute."}], "lineHeight": 0}}, "target": {"markdown": "单请求吞吐随数据块大小增大而提升，以及在饱和点之后仅获得有限收益，这一组合表明，在高利用率下，DE 的性能主要受下游内存带宽的限制，而非解压缩计算本身。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 96}, {"source": {"block_id": "e1233c505d764425e99249a2d66a4704", "index": 97, "aliyun_index": 12, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Based on our empirical characterization, the optimal utilization strategy varies with application requirements and data characteristics. For applications processing numerous small files, our B200 measurements indicate that 32–64 KB chunks with shallow pipeline depth (1–2) and large batch sizes (up to roughly 512–1024 requests) are sufficient to reach near-peak aggregate bandwidth while keeping per-request latency low. Large-file workloads should leverage 128–256 KB chunks with deeper concurrency (depth ≈8) and batches around 256 requests to achieve the highest observed throughput.  \n\n", "text": "Based on our empirical characterization, the optimal utilization strategy varies with application requirements and data characteristics. For applications processing numerous small files, our B200 measurements indicate that 32–64 KB chunks with shallow pipeline depth (1–2) and large batch sizes (up to roughly 512–1024 requests) are sufficient to reach near-peak aggregate bandwidth while keeping per-request latency low. Large-file workloads should leverage 128–256 KB chunks with deeper concurrency (depth ≈8) and batches around 256 requests to achieve the highest observed throughput.\n", "alignment": "left", "unique_id": "e1233c505d764425e99249a2d66a4704", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Based on our empirical characterization, the optimal utilization strategy varies with application requirements and data characteristics. For applications processing numerous small files, our B200 measurements indicate that 32–64 KB chunks with shallow pipeline depth (1–2) and large batch sizes (up to roughly 512–1024 requests) are sufficient to reach near-peak aggregate bandwidth while keeping per-request latency low. Large-file workloads should leverage 128–256 KB chunks with deeper concurrency (depth ≈8) and batches around 256 requests to achieve the highest observed throughput."}], "lineHeight": 0}}, "target": {"markdown": "基于我们的实证特征分析，最优利用策略随应用需求和数据特征的不同而有所不同。对于处理众多小文件的应用，我们在 B200 上的测试表明，采用 32–64 KB 的数据块、较浅的流水线深度（1–2）以及较大的批大小（最多约 512–1024 个请求），足以在保持较低单请求延迟的同时达到接近峰值的聚合带宽。而大文件工作负载则应利用 128–256 KB 的数据块，配合更深的并发度（深度约为 8）以及约 256 个请求的批量，以实现最高的观测吞吐。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "d062d39f46872f4e7cd26c6899609602", "index": 98, "aliyun_index": 13, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "## VI. GPU Cores Microarchitecture\n", "text": "VI. GPU Cores Microarchitecture\n", "alignment": "left", "unique_id": "d062d39f46872f4e7cd26c6899609602", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VI. GPU Cores Microarchitecture"}], "lineHeight": 0}}, "target": {"markdown": "## VI. GPU 核心微架构\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 98}, {"source": {"block_id": "50d6afde777601c6f3820fffbe27ef86", "index": 99, "aliyun_index": 14, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "In this Section, we describe our findings regarding the microarchitecture of the Blackwell GPU cores. Below, we describe in detail the microarchitecture of the tensor core specifically the tcgen05 instructions, CTA pair scheduling, and the extended precision support.  \n\n", "text": "In this Section, we describe our findings regarding the microarchitecture of the Blackwell GPU cores. Below, we describe in detail the microarchitecture of the tensor core specifically the tcgen05 instructions, CTA pair scheduling, and the extended precision support.\n", "alignment": "left", "unique_id": "50d6afde777601c6f3820fffbe27ef86", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this Section, we describe our findings regarding the microarchitecture of the Blackwell GPU cores. Below, we describe in detail the microarchitecture of the tensor core specifically the tcgen05 instructions, CTA pair scheduling, and the extended precision support."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们将介绍关于 Blackwell GPU 核心微架构的研究发现。下面我们将详细描述张量核心的微架构，特别是 tcgen05 指令、CTA 对调度以及扩展精度支持。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 99}, {"source": {"block_id": "9800739792c9d60aed261ff78961d77b", "index": 100, "aliyun_index": 15, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "### A. 5th-Generation Tensor Cores\n", "text": "A. 5th-Generation Tensor Cores\n", "alignment": "left", "unique_id": "9800739792c9d60aed261ff78961d77b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. 5th-Generation Tensor Cores"}], "lineHeight": 0}}, "target": {"markdown": "### A. 第五代张量核心\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 100}, {"source": {"block_id": "2d255e1e39d790058413a668a27156ff", "index": 101, "aliyun_index": 16, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Previous studies show that tensor core PTX instruction compiles to a set of SASS instructions (HMMMA, HGMMMA, QGMMMA, IGMMMA, or BGMMMA) depending on operand precision. In table IV, we observe the tcgen05.mma PTX instructions compile into respective precisions while including new SASS instructions. Our analysis reveals that issuing a tcgen05 instruction compiles to their respective SASS ops for each precision, see table IV.  \n\n", "text": "Previous studies show that tensor core PTX instruction compiles to a set of SASS instructions (HMMMA, HGMMMA, QGMMMA, IGMMMA, or BGMMMA) depending on operand precision. In table IV, we observe the tcgen05.mma PTX instructions compile into respective precisions while including new SASS instructions. Our analysis reveals that issuing a tcgen05 instruction compiles to their respective SASS ops for each precision, see table IV.\n", "alignment": "left", "unique_id": "2d255e1e39d790058413a668a27156ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Previous studies show that tensor core PTX instruction compiles to a set of SASS instructions (HMMMA, HGMMMA, QGMMMA, IGMMMA, or BGMMMA) depending on operand precision. In table IV, we observe the tcgen05.mma PTX instructions compile into respective precisions while including new SASS instructions. Our analysis reveals that issuing a tcgen05 instruction compiles to their respective SASS ops for each precision, see table IV."}], "lineHeight": 0}}, "target": {"markdown": "先前的研究表明，张量核心的 PTX 指令会根据操作数精度编译为一组 SASS 指令（HMMMA、HGMMMA、QGMMMA、IGMMMA 或 BGMMMA）。在表 IV 中，我们可以观察到 tcgen05.mma PTX 指令会编译为相应的精度版本，并引入了一些新的 SASS 指令。我们的分析表明，针对每种精度，发出的 tcgen05 指令都会编译为相应的 SASS 操作，详见表 IV。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 101}, {"source": {"block_id": "4d8794705e2af470500cf6e8ed6fa895", "index": 102, "aliyun_index": 17, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Blackwell introduces the tcgen05.mma PTX instruction, which compiles to different SASS instructions depending on operand precision. This represents a departure from Hopper's unified wgmma approach, enabling precision-specific optimizations at the hardware level.  \n\n", "text": "Blackwell introduces the tcgen05.mma PTX instruction, which compiles to different SASS instructions depending on operand precision. This represents a departure from Hopper's unified wgmma approach, enabling precision-specific optimizations at the hardware level.\n", "alignment": "left", "unique_id": "4d8794705e2af470500cf6e8ed6fa895", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Blackwell introduces the tcgen05.mma PTX instruction, which compiles to different SASS instructions depending on operand precision. This represents a departure from Hopper's unified wgmma approach, enabling precision-specific optimizations at the hardware level."}], "lineHeight": 0}}, "target": {"markdown": "Blackwell 引入了 tcgen05.mma PTX 指令，该指令会根据操作数精度编译为不同的 SASS 指令。这标志着其脱离了 Hopper 统一的 wgmma 方案，从而能够在硬件级实现针对特定精度的优化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 102}, {"source": {"block_id": "c1c1fd76681f191625469f75863b8d4d", "index": 103, "aliyun_index": 0, "page_num": 6, "type": "table", "sub_type": "none", "markdown": "| Precision | PTX (tcgen05.mma) | SASS | wgmma |\n| --- | --- | --- | --- |\n| FP16, BF16 | kind::f16 | HMMA | HGMMMA |\n| FP32, TF32 | kind::tf32 | HMMA | HGMMMA |\n| FP8 | kind::mxf8 / f8f6f4 | QMMA | QGMMMA |\n| FP6 | kind::mxf6 | QMMMA | N/A |\n| FP4 | kind::mxf4 / mxf4nvf4 | OMMA | N/A |\n| INT4, INT8 | kind::i8 | IMMA | IGMMMA |\n| FP64 | not supported | —* | DMMA |\n\n", "text": "| Precision|PTX (tcgen05.mma)|SASS|wgmma|\n| ---|---|---|---|\n| FP16, BF16|kind::f16|HMMA|HGMMMA|\n| FP32, TF32|kind::tf32|HMMA|HGMMMA|\n| FP8|kind::mxf8 / f8f6f4|QMMA|QGMMMA|\n| FP6|kind::mxf6|QMMMA|N/A|\n| FP4|kind::mxf4 / mxf4nvf4|OMMA|N/A|\n| INT4, INT8|kind::i8|IMMA|IGMMMA|\n| FP64|not supported|—*|DMMA|\n", "alignment": "left", "unique_id": "c1c1fd76681f191625469f75863b8d4d", "edited": false, "extra": {"numCol": 4, "cells": [{"yec": 0, "xec": 0, "ysc": 0, "xsc": 0, "type": "text", "alignment": "left", "cellId": 0, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Precision"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Precision\n", "alignment": "left", "type": "text", "pageNum": [6], "uniqueId": "132e17a696be49de98958f1063cffef4"}], "pageNum": [6]}, {"yec": 0, "xec": 1, "ysc": 0, "xsc": 1, "type": "text", "alignment": "left", "cellId": 1, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "unde "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SINGLE-INSTRUCTION LATENCY (SI-LAT) COMPARISON: HOPPER"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "WARP-GROUP WGMM4 VS. BLACKWELL WARP-LEVEL TCGEN05.MMA."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "FP16; TMEM FOR ACCUMULATORS ONLY."}], "lineHeight": -65}}, "target": {"markdown": "SINGLE-INSTRUCTION LATENCY（SI-LAT，单条指令延迟）对比：HOPPER\nWARP 组级 WGMM4 与 BLACKWELL WARP 级 TCGEN05.MMA。\nFP16；TMEM 仅用于累加器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "dc61de3522a14dff52fc1e5f199500f8", "index": 110, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "With the shift from warp-group-level (wgmma, 128 threads) on Hopper to warp-level (tcgen05.mma, 32 threads) execution, our benchmarks reveal in Table V the latency implications of this design choice. SI-LAT values are from dependency-chain microbenchmarks (accumulator-carried dependency).  \n\n", "text": "With the shift from warp-group-level (wgmma, 128 threads) on Hopper to warp-level (tcgen05.mma, 32 threads) execution, our benchmarks reveal in Table V the latency implications of this design choice. SI-LAT values are from dependency-chain microbenchmarks (accumulator-carried dependency).\n", "alignment": "left", "unique_id": "dc61de3522a14dff52fc1e5f199500f8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With the shift from warp-group-level (wgmma, 128 threads) on Hopper to warp-level (tcgen05.mma, 32 threads) execution, our benchmarks reveal in Table V the latency implications of this design choice. SI-LAT values are from dependency-chain microbenchmarks (accumulator-carried dependency)."}], "lineHeight": 0}}, "target": {"markdown": "随着执行粒度从 Hopper 上的 warp 组级（wgmma，128 线程）转变为 warp 级（tcgen05.mma，32 线程），我们的基准测试在表 V 中揭示了这一设计选择在延迟方面的影响。SI-LAT 值来自依赖链微基准测试（由累加器传递的依赖关系）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "1d935ed69a2491a1cb2a0b8bee825af6", "index": 111, "aliyun_index": 8, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The data in Table V are consistent with Blackwell achieving 2.9–11.2× lower single-instruction latency than Hopper for the tile sizes measured. Latency remains nearly constant across tile sizes (11.0–11.4 cycles), whereas Hopper scales linearly with tile width. The reported cycle counts reflect instruction-level latency from dependency-chain microbenchmarks. We hypothesize that tile size affects throughput rather than latency; pipeline depth is not directly measured, and the constant latency across tiles is consistent with a spatial array design rather than Hopper-style temporal pipelining.  \n\n", "text": "The data in Table V are consistent with Blackwell achieving 2.9–11.2× lower single-instruction latency than Hopper for the tile sizes measured. Latency remains nearly constant across tile sizes (11.0–11.4 cycles), whereas Hopper scales linearly with tile width. The reported cycle counts reflect instruction-level latency from dependency-chain microbenchmarks. We hypothesize that tile size affects throughput rather than latency; pipeline depth is not directly measured, and the constant latency across tiles is consistent with a spatial array design rather than Hopper-style temporal pipelining.\n", "alignment": "left", "unique_id": "1d935ed69a2491a1cb2a0b8bee825af6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The data in Table V are consistent with Blackwell achieving 2.9–11.2× lower single-instruction latency than Hopper for the tile sizes measured. Latency remains nearly constant across tile sizes (11.0–11.4 cycles), whereas Hopper scales linearly with tile width. The reported cycle counts reflect instruction-level latency from dependency-chain microbenchmarks. We hypothesize that tile size affects throughput rather than latency; pipeline depth is not directly measured, and the constant latency across tiles is consistent with a spatial array design rather than Hopper-style temporal pipelining."}], "lineHeight": 0}}, "target": {"markdown": "表 V 中的数据表明，在所测量的分块大小下，Blackwell 的单条指令延迟比 Hopper 低 2.9–11.2 倍。延迟在不同分块大小之间几乎保持恒定（11.0–11.4 个周期），而 Hopper 的延迟则随分块宽度线性增长。所报告的周期数反映了依赖链微基准测试所测得的指令级延迟。我们推测，分块大小影响的是吞吐量而非延迟；流水线深度并未直接测量，而在不同分块下延迟保持恒定的现象，与一种空间阵列式设计相吻合，而非 Hopper 那种时序流水线式设计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "fa953055971acfc8b72be52279d3bc13", "index": 112, "aliyun_index": 9, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "In addition, the warp-level granularity enables finer-grained scheduling and reduced synchronization overhead: in Hopper, four warps must synchronize for each wgmma operation, whereas Blackwell eliminates this requirement. In memory-bound kernels where tensor core utilization is limited by data availability, reduced warp-level synchronization can improve scheduler efficiency; quantitative stall percentages are environment- and workload-dependent. Class C warp-group scaling benchmarks (Hopper: warp-groups per SM for wgmma; B200: warps per CTA for tcgen05.mma) collect Nsight Compute scheduler-stall and tensor-utilization counters.  \n\n", "text": "In addition, the warp-level granularity enables finer-grained scheduling and reduced synchronization overhead: in Hopper, four warps must synchronize for each wgmma operation, whereas Blackwell eliminates this requirement. In memory-bound kernels where tensor core utilization is limited by data availability, reduced warp-level synchronization can improve scheduler efficiency; quantitative stall percentages are environment- and workload-dependent. Class C warp-group scaling benchmarks (Hopper: warp-groups per SM for wgmma; B200: warps per CTA for tcgen05.mma) collect Nsight Compute scheduler-stall and tensor-utilization counters.\n", "alignment": "left", "unique_id": "fa953055971acfc8b72be52279d3bc13", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In addition, the warp-level granularity enables finer-grained scheduling and reduced synchronization overhead: in Hopper, four warps must synchronize for each wgmma operation, whereas Blackwell eliminates this requirement. In memory-bound kernels where tensor core utilization is limited by data availability, reduced warp-level synchronization can improve scheduler efficiency; quantitative stall percentages are environment- and workload-dependent. Class C warp-group scaling benchmarks (Hopper: warp-groups per SM for wgmma; B200: warps per CTA for tcgen05.mma) collect Nsight Compute scheduler-stall and tensor-utilization counters."}], "lineHeight": 0}}, "target": {"markdown": "此外，warp 级的执行粒度还支持更细粒度的调度，并降低了同步开销：在 Hopper 上，每执行一次 wgmma 操作都需要四个 warp 进行同步，而 Blackwell 则消除了这一需求。在受内存带宽限制的内核中，当张量核心利用率受限于数据可用性时，warp 级同步的减少可提升调度器效率；具体的停顿百分比因环境和负载而异。C 类 warp 组扩展基准测试（Hopper：每个 SM 的 warp 组数，对应 wgmma；B200：每个 CTA 的 alse, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "COMPREHENSIVE TENSOR CORE PERFORMANCE CHARACTERIZATION"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ACROSS SUPPORTED PRECISIONS (LATENCY IN CYCLES; THROUGHPUT IN"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TFLOPS OR TOPS)."}], "lineHeight": -63}}, "target": {"markdown": "综合张量核心性能表征（涵盖所支持的精度；延迟以周期计，吞吐量以 TFLOPS 或 TOPS 计）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "8f309799efdb4a8ef5594e1fcd53d3d2", "index": 117, "aliyun_index": 14, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "sistent low-latency operation across all precisions, enabling\npredictable performance regardless of quantization level.  \n\n", "text": "sistent low-latency operation across all precisions, enabling\npredictable performance regardless of quantization level.\n", "alignment": "left", "unique_id": "8f309799efdb4a8ef5594e1fcd53d3d2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "sistent low-latency operation across all precisions, enabling"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "predictable performance regardless of quantization level."}], "lineHeight": -55}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "9f7f52e1f4247d370a340a7ce480bb33", "index": 118, "aliyun_index": 15, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Comparing FP16 inputs with FP16 vs. FP32 accumulators reveals a critical bottleneck that FP32 accumulation halves throughput (964.8 → 482.4 TFLOPS). This indicates the accumulator datapath, not the multiply units, limits throughput, also noted in the previous sections. Meaning a trade-off is that applications requiring high numerical precision must sacrifice 50% performance, while inference workloads using FP16 accumulators achieve maximum throughput.  \n\n", "text": "Comparing FP16 inputs with FP16 vs. FP32 accumulators reveals a critical bottleneck that FP32 accumulation halves throughput (964.8 → 482.4 TFLOPS). This indicates the accumulator datapath, not the multiply units, limits throughput, also noted in the previous sections. Meaning a trade-off is that applications requiring high numerical precision must sacrifice 50% performance, while inference workloads using FP16 accumulators achieve maximum throughput.\n", "alignment": "left", "unique_id": "9f7f52e1f4247d370a340a7ce480bb33", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Comparing FP16 inputs with FP16 vs. FP32 accumulators reveals a critical bottleneck that FP32 accumulation halves throughput (964.8 → 482.4 TFLOPS). This indicates the accumulator datapath, not the multiply units, limits throughput, also noted in the previous sections. Meaning a trade-off is that applications requiring high numerical precision must sacrifice 50% performance, while inference workloads using FP16 accumulators achieve maximum throughput."}], "lineHeight": 0}}, "target": {"markdown": "在 FP16 输入下比较 FP16 与 FP32 累加器，揭示了一个关键瓶颈：使用 FP32 累加会使吞吐量减半（964.8 → 482.4 TFLOPS）。这表明限制吞吐量的瓶颈在于累加器数据通路，而非乘法单元，这一点在前面的章节中也曾提及。这意味着存在一种权衡：对数值精度要求较高的应用必须牺牲 50% 的性能，而使用 FP16 累加器的推理工作负载则可获得最高的吞吐量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "fe473f01292905dce02cb7824c392c06", "index": 119, "aliyun_index": 16, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "INT8 (3928.5 TOPS) exceeds FP8 (1912.8 TFLOPS), and FP4 (3850.1 TFLOPS) outperforms FP8. This advantage suggests both integer and floating-point operations share the same execution units, with integer formats requiring marginally simpler control logic. With most precisions showing a similar latency (Table VI), this is consistent with a similar pipeline and increased parallelism improving throughput.  \n\n", "text": "INT8 (3928.5 TOPS) exceeds FP8 (1912.8 TFLOPS), and FP4 (3850.1 TFLOPS) outperforms FP8. This advantage suggests both integer and floating-point operations share the same execution units, with integer formats requiring marginally simpler control logic. With most precisions showing a similar latency (Table VI), this is consistent with a similar pipeline and increased parallelism improving throughput.\n", "alignment": "left", "unique_id": "fe473f01292905dce02cb7824c392c06", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "INT8 (3928.5 TOPS) exceeds FP8 (1912.8 TFLOPS), and FP4 (3850.1 TFLOPS) outperforms FP8. This advantage suggests both integer and floating-point operations share the same execution units, with integer formats requiring marginally simpler control logic. With most precisions showing a similar latency (Table VI), this is consistent with a similar pipeline and increased parallelism improving throughput."}], "lineHeight": 0}}, "target": {"markdown": "INT8（3928.5 TOPS）的吞吐量超过了 FP8（1912.8 TFLOPS），而 FP4（3850.1 TFLOPS）的性能也优于 FP8。这一优势表明，整数与浮点运算共享相同的执行单元，整数格式所需的控制逻辑略为简单。由于大多数精度下所呈现的延迟相近（表 VI），这与\"流水线结构相似、通过增加并行度来提升吞吐量\"的观点相一致。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "563504457c972379f3402742505967b2", "index": 120, "aliyun_index": 17, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "### B. Extended Precision Support: FP4 and FP6\n", "text": "B. Extended Precision Support: FP4 and FP6\n", "alignment": "left", "unique_id": "563504457c972379f3402742505967b2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Extended Precision Support: FP4 and FP6"}], "lineHeight": 0}}, "target": {"markdown": "### B. 扩展精度支持：FP4 与 FP6\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "12e295f80bcbab118966307f11881f81", "index": 121, "aliyun_index": 18, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "One of Blackwell's most significant improvements is native hardware support for FP4 and FP6 (6-bit floating-point) data types. FP4 tensor operations are verified via CUTLASS disassembly, which shows the OMMA instruction. FP6 is documented to map kind::mxf6 to QMMA per the PTX ISA (Table IV). Table VI shows latency (12.6 cycles for FP4/FP16, 12.3 for FP6/FP16) and throughput (3850.1 and 2567.2 TFLOPS at m64n8k16). The FP4/FP16 and FP6/FP16 configurations use FP32 accumulation (PTX .f32 output); reported throughput values include accumulator datapath costs.  \n\n", "text": "One of Blackwell's most significant improvements is native hardware support for FP4 and FP6 (6-bit floating-point) data types. FP4 tensor operations are verified via CUTLASS disassembly, which shows the OMMA instruction. FP6 is documented to map kind::mxf6 to QMMA per the PTX ISA (Table IV). Table VI shows latency (12.6 cycles for FP4/FP16, 12.3 for FP6/FP16) and throughput (3850.1 and 2567.2 TFLOPS at m64n8k16). The FP4/FP16 and FP6/FP16 configurations use FP32 accumulation (PTX .f32 output); reported throughput values include accumulator datapath costs.\n", "alignment": "left", "unique_id": "12e295f80bcbab118966307f11881f81", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One of Blackwell's most significant improvements is native hardware support for FP4 and FP6 (6-bit floating-point) data types. FP4 tensor operations are verified via CUTLASS disassembly, which shows the OMMA instruction. FP6 is documented to map kind::mxf6 to QMMA per the PTX ISA (Table IV). Table VI shows latency (12.6 cycles for FP4/FP16, 12.3 for FP6/FP16) and throughput (3850.1 and 2567.2 TFLOPS at m64n8k16). The FP4/FP16 and FP6/FP16 configurations use FP32 accumulation (PTX .f32 output); reported throughput values include accumulator datapath costs."}], "lineHeight": 0}}, "target": {"markdown": "Blackwell 最重要的改进之一是对 FP4 和 FP6（6 位浮点）数据类型提供原生硬件支持。FP4 张量操作通过 CUTLASS 反汇编得到验证，反汇编结果显示存在 OMMA 指令。根据 PTX ISA（表 IV），FP6 被记录为将 kind::mxf6 映射到 QMMA。表 VI 给出了延迟（FP4/FP16 为 12.6 个周期，FP6/FP16 为 12.3 个周期）和吞吐量（在 m64n8k16 下分别为 3850.1 和 2567.2 TFLOPS）。FP4/FP16 和 FP6/FP16 配置使用 FP32 累加（PTX 中以 .f32 输出）；所报告的吞吐量值已包含累加器数据通路的开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "b6e404585c6d8a0cf121cf6cea27c0cb", "index": 122, "aliyun_index": 19, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The FP4 format uses 1 sign bit, 2 exponent bits, and 1 mantissa bit as e2m1. Available on Blackwell are MXFP4, microscaling floating-point [28], and NVFP4, from NVIDIA. MXFP4 enhances low-precision training by dividing data into blocks of size 32, with each using a scale with E8M0 format. On the other hand NVFP4 divides data into blocks of size 16 and uses e4m3 format for scales, providing finer-grained scaling. Work by Chmiel et. al [29] provides a more indepth comparison. While this extremely limited precision might seem impractical, recent quantization research has demonstrated that for inference workloads FP4 can maintain acceptable accuracy [30]. Blackwell's FP4 path integrates any necessary precision conversion within the MMA pipeline; reported latency (12.6 cycles) and throughput (96.2% of peak) include the complete FP4 execution path. We do not measure dequantization as a standalone operation.  \n\n", "text": "The FP4 format uses 1 sign bit, 2 exponent bits, and 1 mantissa bit as e2m1. Available on Blackwell are MXFP4, microscaling floating-point [28], and NVFP4, from NVIDIA. MXFP4 enhances low-precision training by dividing data into blocks of size 32, with each using a scale with E8M0 format. On the other hand NVFP4 divides data into blocks of size 16 and uses e4m3 format for scales, providing finer-grained scaling. Work by Chmiel et. al [29] provides a more indepth comparison. While this extremely limited precision might seem impractical, recent quantization research has demonstrated that for inference workloads FP4 can maintain acceptable accuracy [30]. Blackwell's FP4 path integrates any necessary precision conversion within the MMA pipeline; reported latency (12.6 cycles) and throughput (96.2% of peak) include the complete FP4 execution path. We do not measure dequantization as a standalone operation.\n", "alignment": "left", "unique_id": "b6e404585c6d8a0cf121cf6cea27c0cb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The FP4 format uses 1 sign bit, 2 exponent bits, and 1 mantissa bit as e2m1. Available on Blackwell are MXFP4, microscaling floating-point [28], and NVFP4, from NVIDIA. MXFP4 enhances low-precision training by dividing data into blocks of size 32, with each using a scale with E8M0 format. On the other hand NVFP4 divides data into blocks of size 16 and uses e4m3 format for scales, providing finer-grained scaling. Work by Chmiel et. al [29] provides a more indepth comparison. While this extremely limited precision might seem impractical, recent quantization research has demonstrated that for inference workloads FP4 can maintain acceptable accuracy [30]. Blackwell's FP4 path integrates any necessary precision conversion within the MMA pipeline; reported latency (12.6 cycles) and throughput (96.2% of peak) include the complete FP4 execution path. We do not measure dequantization as a standalone operation."}], "lineHeight": 0}}, "target": {"markdown": "FP4 格式采用 1 个符号位、2 个指数位和 1 个尾数位，即 e2m1。在 Blackwell 上可用的格式包括 MXFP4（微缩放浮点 [28]）以及 NVIDIA 的 NVFP4。MXFP4 通过将数据划分为大小为 32 的块来增强低精度训练，每个块使用 E8M0 格式的缩放因子。而 NVFP4 则将数据划分为大小为 16 的块，并使用 e4m3 格式作为缩放因子，从而提供更细粒度的缩放。Chmiel 等人的研究 [29] 提供了更为深入的比较。尽管这种极低的精度看似不切实际，但近期的量化研究表明，对于推理工作负载而言，FP4 仍能保持可接受的精度 [30]。Blackwell 的 FP4 路径将所有必要的精度转换集成在 MMA 流水线内部；所报告的延迟（12.6 个周期）和吞吐量（峰值的 96.2%）包含了完整的 FP4 执行路径。我们并未将反量化作为独立操作进行测量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "328cf475698cb598ede7390dcad3848d", "index": 123, "aliyun_index": 0, "page_num": 7, "type": "table", "sub_type": "none", "markdown": "| Precision | B200 | % Peak | H200 | Speedup |\n| --- | --- | --- | --- | --- |\n| FP64 | 44.8 | 99.6% | 34.0 | $1.32\\times$ |\n| FP32 | 482.0 | 96.4% | 3
