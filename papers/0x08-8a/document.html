多个位；每一位对应于一个记分板寄存器 410。对于每个操作数，编译器可以设置与该操作数相关联的记分板寄存器 410 所对应的位。可以理解的是，两个或多个操作数可以与同一记分板寄存器 410 相关联。例如，编译器可以将操作数位掩码设置为 0b001101，对应于记分板寄存器 410(0)、410(2) 和 410(3)。当调度器单元 310 从特定 warp 中选择一条指令进行分派时，调度器单元检查与操作数位掩码中设置的位相对应的每个记分板寄存器 410。在一个实施例中，被检查的每个记分板寄存器 410 在调度器单元 310 将指令分派到流水线执行单元 450 之前应具有零值。因此，操作数位掩码使调度器单元 310 能够检查当前指令的依赖关系是否已通过先前分派的指令读取或写入操作数而得到解决。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 104}, {"source": {"block_id": "a5f34dbb2ed53c35b7be32fc86f1dd06", "index": 105, "aliyun_index": 10, "page_num": 14, "type": "text", "sub_type": "none", "markdown": "[0050] In another embodiment, each of the instructions may specify a specific value of a scoreboard register 410 that enable an instruction to be dispatched by the scheduler unit 310. In other words, the scheduler unit 310 may not be configured to dispatch an instruction only when the scoreboard register 410 reaches a value of zero, but rather when the scoreboard register 410 reaches a value of one or two and so forth. The compiler may be able to take advantage of the partial ordering of instructions within decoupled pipelines. Even though the decoupled pipelines execute instructions out-of-order, each instruction executed by a particular decoupled pipeline is executed in-order with respect to the other instructions dispatched to the decoupled pipeline. In other words, partial ordering can be exploited by knowing that certain events associated with a program are guaranteed to occur in order.  \n\n", "text": "[0050] In another embodiment, each of the instructions may specify a specific value of a scoreboard register 410 that enable an instruction to be dispatched by the scheduler unit 310. In other words, the scheduler unit 310 may not be configured to dispatch an instruction only when the scoreboard register 410 reaches a value of zero, but rather when the scoreboard register 410 reaches a value of one or two and so forth. The compiler may be able to take advantage of the partial ordering of instructions within decoupled pipelines. Even though the decoupled pipelines execute instructions out-of-order, each instruction executed by a particular decoupled pipeline is executed in-order with respect to the other instructions dispatched to the decoupled pipeline. In other words, partial ordering can be exploited by knowing that certain events associated with a program are guaranteed to occur in order.\n", "alignment": "left", "unique_id": "a5f34dbb2ed53c35b7be32fc86f1dd06", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0050] In another embodiment, each of the instructions may specify a specific value of a scoreboard register 410 that enable an instruction to be dispatched by the scheduler unit 310. In other words, the scheduler unit 310 may not be configured to dispatch an instruction only when the scoreboard register 410 reaches a value of zero, but rather when the scoreboard register 410 reaches a value of one or two and so forth. The compiler may be able to take advantage of the partial ordering of instructions within decoupled pipelines. Even though the decoupled pipelines execute instructions out-of-order, each instruction executed by a particular decoupled pipeline is executed in-order with respect to the other instructions dispatched to the decoupled pipeline. In other words, partial ordering can be exploited by knowing that certain events associated with a program are guaranteed to occur in order."}], "lineHeight": 0}}, "target": {"markdown": "[0050] 在另一个实施例中，每条指令可以指定记分板寄存器 410 的特定值，以使调度器单元 310 能够分派该指令。换言之，调度器单元 310 可能不是仅在记分板寄存器 410 达到零值时分派指令，而是在记分板寄存器 410 达到一或二等值时分派指令。编译器可以利用解耦流水线内指令的部分顺序。尽管解耦流水线以乱序方式执行指令，但由特定解耦流水线执行的每条指令相对于分派到该解耦流水线的其他指令是按顺序执行的。换言之，可以通过了解与程序相关联的某些事件保证按顺序发生来利用部分顺序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 105}, {"source": {"block_id": "e1e624caf5f7c236fd5cb6fb4ac1a9a5", "index": 106, "aliyun_index": 11, "page_num": 14, "type": "text", "sub_type": "none", "markdown": "[0051] For example, a program may include three texture operations. Because each of the texture operations are issued to the same decoupled pipeline (i.e., a texture unit 390), the texture operations are going to be executed in-order with respect to the other texture operations. As such, the compiler  \n\n", "text": "[0051] For example, a program may include three texture operations. Because each of the texture operations are issued to the same decoupled pipeline (i.e., a texture unit 390), the texture operations are going to be executed in-order with respect to the other texture operations. As such, the compiler\n", "alignment": "left", "unique_id": "e1e624caf5f7c236fd5cb6fb4ac1a9a5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0051] For example, a program may include three texture operations. Because each of the texture operations are issued to the same decoupled pipeline (i.e., a texture unit 390), the texture operations are going to be executed in-order with respect to the other texture operations. As such, the compiler"}], "lineHeight": 0}}, "target": {"markdown": "[0051] 例如，一个程序可以包括三个纹理操作。由于每个纹理操作都被发送到同一个解耦流水线（即纹理单元 390），因此这些纹理操作将相对于其他纹理操作按顺序执行。因此，编译器", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 106}, {"source": {"block_id": "050fec47c17983243a49dfd170f3e810", "index": 107, "aliyun_index": 3, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "knows that the source operands for a first texture operation will be read prior to the source operands for a second texture operation, which are read prior to the source operands for a third texture operation, and so forth. Similarly, the compiler knows that the result for the first texture operation will be written to a destination register prior to the result for the second texture operation being written to a destination register, which is written prior to the result for the third texture operation being written to a destination register, and so forth. There is no guarantee in ordering however between when the result of one texture operation is written to a destination register and when the source operands for a subsequently dispatched texture operation are read from the register file 320.  \n\n", "text": "knows that the source operands for a first texture operation will be read prior to the source operands for a second texture operation, which are read prior to the source operands for a third texture operation, and so forth. Similarly, the compiler knows that the result for the first texture operation will be written to a destination register prior to the result for the second texture operation being written to a destination register, which is written prior to the result for the third texture operation being written to a destination register, and so forth. There is no guarantee in ordering however between when the result of one texture operation is written to a destination register and when the source operands for a subsequently dispatched texture operation are read from the register file 320.\n", "alignment": "left", "unique_id": "050fec47c17983243a49dfd170f3e810", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "knows that the source operands for a first texture operation will be read prior to the source operands for a second texture operation, which are read prior to the source operands for a third texture operation, and so forth. Similarly, the compiler knows that the result for the first texture operation will be written to a destination register prior to the result for the second texture operation being written to a destination register, which is written prior to the result for the third texture operation being written to a destination register, and so forth. There is no guarantee in ordering however between when the result of one texture operation is written to a destination register and when the source operands for a subsequently dispatched texture operation are read from the register file 320."}], "lineHeight": 0}}, "target": {"markdown": "知道第一个纹理操作的源操作数将在第二个纹理操作的源操作数之前被读取，而第二个纹理操作的源操作数又在第三个纹理操作的源操作数之前被读取，依此类推。类似地，编译器知道第一个纹理操作的结果将在第二个纹理操作的结果被写入目标寄存器之前被写入目标寄存器，而第二个纹理操作的结果又在第三个纹理操作的结果被写入目标寄存器之前被写入目标寄存器，依此类推。然而，在一个纹理操作的结果被写入目标寄存器的时间与后续被分派的纹理操作的源操作数从寄存器文件 320 中被读取的时间之间，顺序是没有保证的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 107}, {"source": {"block_id": "972604cd38e9fb3889ff8a73c4b81c8f", "index": 108, "aliyun_index": 4, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0052] The characteristics of such partial ordering may be exploited by the compiler to reduce the number of scoreboard registers 410 that need to be produced and consumed. As discussed above, when an instruction depends on two previously issued instructions from the same decoupled pipeline, only the last of those previously issued instructions needs to generate a scoreboard in order to ensure that both of the instructions have completed execution. The one or more other previously issued instructions are implied to have completed execution because the decoupled pipeline executes all instructions received by the decoupled pipeline in-order.  \n\n", "text": "[0052] The characteristics of such partial ordering may be exploited by the compiler to reduce the number of scoreboard registers 410 that need to be produced and consumed. As discussed above, when an instruction depends on two previously issued instructions from the same decoupled pipeline, only the last of those previously issued instructions needs to generate a scoreboard in order to ensure that both of the instructions have completed execution. The one or more other previously issued instructions are implied to have completed execution because the decoupled pipeline executes all instructions received by the decoupled pipeline in-order.\n", "alignment": "left", "unique_id": "972604cd38e9fb3889ff8a73c4b81c8f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0052] The characteristics of such partial ordering may be exploited by the compiler to reduce the number of scoreboard registers 410 that need to be produced and consumed. As discussed above, when an instruction depends on two previously issued instructions from the same decoupled pipeline, only the last of those previously issued instructions needs to generate a scoreboard in order to ensure that both of the instructions have completed execution. The one or more other previously issued instructions are implied to have completed execution because the decoupled pipeline executes all instructions received by the decoupled pipeline in-order."}], "lineHeight": 0}}, "target": {"markdown": "[0052] 编译器可以利用这种部分顺序的特性来减少需要生成和消费的记分板寄存器 410 的数量。如上所述，当一条指令依赖于来自同一解耦流水线的两条先前发出的指令时，只需要这些先前发出的指令中的最后一条生成记分板即可确保两条指令都已完成执行。一条或多条其他先前发出的指令被认为已经完成执行，因为解耦流水线按顺序执行其接收的所有指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "a0e99972e8d922fed9077b2fa5d6fb05", "index": 109, "aliyun_index": 5, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0053] In addition, the compiler may specify that a particular scoreboard must only have a value less than or equal to some number before a particular instruction is dispatched by the scheduler unit 310. While a set of instructions may utilize a single scoreboard to track dependencies between instructions, some instructions in the set of instructions may be dispatched to a particular decoupled pipeline, thereby ensuring that once a scoreboard stores a value below some threshold value, then at least one of the instructions in the set of instructions has completed execution. The source operands bit mask (i.e., '&req-n') is interpreted to require that the specified scoreboard registers 410 have a value of zero before the instruction may be dispatched. However, in some cases, an instruction is only dependent on one or more instructions in the set of instructions that are associated with a particular scoreboard register 410, and the dependencies may have been resolved even when the scoreboard register 410 stores a value greater than zero. An example of a program utilizing this concept is shown in more detail below in FIG. 5.  \n\n", "text": "[0053] In addition, the compiler may specify that a particular scoreboard must only have a value less than or equal to some number before a particular instruction is dispatched by the scheduler unit 310. While a set of instructions may utilize a single scoreboard to track dependencies between instructions, some instructions in the set of instructions may be dispatched to a particular decoupled pipeline, thereby ensuring that once a scoreboard stores a value below some threshold value, then at least one of the instructions in the set of instructions has completed execution. The source operands bit mask (i.e., '&req-n') is interpreted to require that the specified scoreboard registers 410 have a value of zero before the instruction may be dispatched. However, in some cases, an instruction is only dependent on one or more instructions in the set of instructions that are associated with a particular scoreboard register 410, and the dependencies may have been resolved even when the scoreboard register 410 stores a value greater than zero. An example of a program utilizing this concept is shown in more detail below in FIG. 5.\n", "alignment": "left", "unique_id": "a0e99972e8d922fed9077b2fa5d6fb05", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0053] In addition, the compiler may specify that a particular scoreboard must only have a value less than or equal to some number before a particular instruction is dispatched by the scheduler unit 310. While a set of instructions may utilize a single scoreboard to track dependencies between instructions, some instructions in the set of instructions may be dispatched to a particular decoupled pipeline, thereby ensuring that once a scoreboard stores a value below some threshold value, then at least one of the instructions in the set of instructions has completed execution. The source operands bit mask (i.e., '&req-n') is interpreted to require that the specified scoreboard registers 410 have a value of zero before the instruction may be dispatched. However, in some cases, an instruction is only dependent on one or more instructions in the set of instructions that are associated with a particular scoreboard register 410, and the dependencies may have been resolved even when the scoreboard register 410 stores a value greater than zero. An example of a program utilizing this concept is shown in more detail below in FIG. 5."}], "lineHeight": 0}}, "target": {"markdown": "[0053] 此外，编译器可以指定，在调度器单元 310 分派某条特定指令之前，某个特定的记分板的值必须仅小于或等于某个数值。虽然一组指令可以使用单个记分板来跟踪指令之间的依赖关系，但该组指令中的某些指令可以被分派到特定的解耦流水线，从而确保一旦记分板存储的值低于某个阈值，则该组指令中至少有一条指令已完成执行。源操作数位掩码（即 '&req-n'）被解释为要求指定的记分板寄存器 410 在指令被分派之前必须具有零值。然而，在某些情况下，一条指令仅依赖于该组指令中与特定记分板寄存器 410 相关联的一条或多条指令，并且即使记分板寄存器 410 存储的值大于零，依赖关系也可能已经得到解决。利用此概念的程序示例将在下面的图 5 中更详细地示出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "79e60d92f8feb626b1a2a1b4982266ee", "index": 110, "aliyun_index": 6, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0054] FIG. 5 illustrates pseudocode 500 produced by a compiler, the pseudocode 500 including instructions that implement an explicit software-based scoreboarding mechanism, in accordance with one embodiment. As shown in FIG. 5, pseudocode 500 includes a plurality of instructions including three texture instructions (i.e., TEX), three floating-point multiply instructions (i.e., FMUL), and three dependency barrier instructions (i.e., DEPBAR). The first texture instruction takes two source operands, R2 and R3 (Rz is a special zero register holding a value of 0), and stores a value in a first destination register, R1. The second texture instruction takes two source operands, R5 and R6, and stores a value in a second destination register, R4. The third texture instruction takes two source operands, R8 and R9, and stores a value in a third destination register, R7. The three texture instructions are dispatched to a decoupled pipeline (i.e., a texture unit 390) and will be executed in-order with respect to each of the texture instructions. In addition, each of the texture instructions includes an instruction suffix ('&wr-0x1') that causes a write dependency scoreboard to be produced when the texture  \n\n", "text": "[0054] FIG. 5 illustrates pseudocode 500 produced by a compiler, the pseudocode 500 including instructions that implement an explicit software-based scoreboarding mechanism, in accordance with one embodiment. As shown in FIG. 5, pseudocode 500 includes a plurality of instructions including three texture instructions (i.e., TEX), three floating-point multiply instructions (i.e., FMUL), and three dependency barrier instructions (i.e., DEPBAR). The first texture instruction takes two source operands, R2 and R3 (Rz is a special zero register holding a value of 0), and stores a value in a first destination register, R1. The second texture instruction takes two source operands, R5 and R6, and stores a value in a second destination register, R4. The third texture instruction takes two source operands, R8 and R9, and stores a value in a third destination register, R7. The three texture instructions are dispatched to a decoupled pipeline (i.e., a texture unit 390) and will be executed in-order with respect to each of the texture instructions. In addition, each of the texture instructions includes an instruction suffix ('&wr-0x1') that causes a write dependency scoreboard to be produced when the texture\n", "alignment": "left", "unique_id": "79e60d92f8feb626b1a2a1b4982266ee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0054] FIG. 5 illustrates pseudocode 500 produced by a compiler, the pseudocode 500 including instructions that implement an explicit software-based scoreboarding mechanism, in accordance with one embodiment. As shown in FIG. 5, pseudocode 500 includes a plurality of instructions including three texture instructions (i.e., TEX), three floating-point multiply instructions (i.e., FMUL), and three dependency barrier instructions (i.e., DEPBAR). The first texture instruction takes two source operands, R2 and R3 (Rz is a special zero register holding a value of 0), and stores a value in a first destination register, R1. The second texture instruction takes two source operands, R5 and R6, and stores a value in a second destination register, R4. The third texture instruction takes two source operands, R8 and R9, and stores a value in a third destination register, R7. The three texture instructions are dispatched to a decoupled pipeline (i.e., a texture unit 390) and will be executed in-order with respect to each of the texture instructions. In addition, each of the texture instructions includes an instruction suffix ('&wr-0x1') that causes a write dependency scoreboard to be produced when the texture"}], "lineHeight": 0}}, "target": {"markdown": "[0054] 图 5 展示了由编译器生成的伪代码 500，该伪代码 500 包含实现显式基于软件的记分板机制的指令，根据一个实施例。如图 5 所示，伪代码 500 包含多条指令，包括三条纹理指令（即 TEX）、三条浮点乘法指令（即 FMUL）和三条依赖屏障指令（即 DEPBAR）。第一条纹理指令采用两个源操作数 R2 和 R3（Rz 是保存值为 0 的特殊零寄存器），并将一个值存储在第一目标寄存器 R1 中。第二条纹理指令采用两个源操作数 R5 和 R6，并将一个值存储在第二目标寄存器 R4 中。第三条纹理指令采用两个源操作数 R8 和 R9，并将一个值存储在第三目标寄存器 R7 中。这三条纹理指令被分派到一个解耦流水线（即纹理单元 390），并将相对于彼此按顺序执行。此外，每条纹理指令都包含一个指令后缀（'&wr-0x1'），该后缀会在纹理", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "4086db349ea91f52f525005160acd4eb", "index": 111, "aliyun_index": 7, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "instructions are dispatched. In other words, after each of the three texture instructions are dispatched to the texture units 390, the scheduler unit 310 increments a first scoreboard register 410(1) by one. Thus, after all three texture instructions have been dispatched to the texture units 390, the first scoreboard register 410(1) may contain a maximum value of three.  \n\n", "text": "instructions are dispatched. In other words, after each of the three texture instructions are dispatched to the texture units 390, the scheduler unit 310 increments a first scoreboard register 410(1) by one. Thus, after all three texture instructions have been dispatched to the texture units 390, the first scoreboard register 410(1) may contain a maximum value of three.\n", "alignment": "left", "unique_id": "4086db349ea91f52f525005160acd4eb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions are dispatched. In other words, after each of the three texture instructions are dispatched to the texture units 390, the scheduler unit 310 increments a first scoreboard register 410(1) by one. Thus, after all three texture instructions have been dispatched to the texture units 390, the first scoreboard register 410(1) may contain a maximum value of three."}], "lineHeight": 0}}, "target": {"markdown": "指令被分派时生成一个写依赖记分板。换言之，在三条纹理指令被分派到纹理单元 390 之后，调度器单元 310 将第一记分板寄存器 410(1) 递增一。因此，在所有三条纹理指令被分派到纹理单元 390 之后，第一记分板寄存器 410(1) 可以包含最大值三。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "4038a951db2cfb7f5a927edb6fac5973", "index": 112, "aliyun_index": 8, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0055] In contrast with including a source operands bit mask in subsequent dependent instructions, which would require the associated scoreboards to each contain a value of zero before the dependent instruction can be dispatched, a dependency barrier instruction (i.e., DEPBAR) may be included in the code that stalls the program until one or more scoreboard registers 410 have a value that is less than an immediate value included as an operand to the dependency barrier instruction. The dependency barrier instruction can exploit the partial ordering of instructions transmitted to a particular decoupled pipeline in order to manage dependencies with a reduced number of scoreboard registers 410 while also not unnecessarily slowing down the execution of the program.  \n\n", "text": "[0055] In contrast with including a source operands bit mask in subsequent dependent instructions, which would require the associated scoreboards to each contain a value of zero before the dependent instruction can be dispatched, a dependency barrier instruction (i.e., DEPBAR) may be included in the code that stalls the program until one or more scoreboard registers 410 have a value that is less than an immediate value included as an operand to the dependency barrier instruction. The dependency barrier instruction can exploit the partial ordering of instructions transmitted to a particular decoupled pipeline in order to manage dependencies with a reduced number of scoreboard registers 410 while also not unnecessarily slowing down the execution of the program.\n", "alignment": "left", "unique_id": "4038a951db2cfb7f5a927edb6fac5973", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0055] In contrast with including a source operands bit mask in subsequent dependent instructions, which would require the associated scoreboards to each contain a value of zero before the dependent instruction can be dispatched, a dependency barrier instruction (i.e., DEPBAR) may be included in the code that stalls the program until one or more scoreboard registers 410 have a value that is less than an immediate value included as an operand to the dependency barrier instruction. The dependency barrier instruction can exploit the partial ordering of instructions transmitted to a particular decoupled pipeline in order to manage dependencies with a reduced number of scoreboard registers 410 while also not unnecessarily slowing down the execution of the program."}], "lineHeight": 0}}, "target": {"markdown": "[0055] 与在后续依赖指令中包含源操作数位掩码（这要求相关联的记分板在被依赖指令分派之前各自的值为零）相比，可以在代码中包含一条依赖屏障指令（即 DEPBAR），该指令会使程序停顿，直到一个或多个记分板寄存器 410 的值小于作为操作数包含在依赖屏障指令中的立即数。依赖屏障指令可以利用传送到特定解耦流水线的指令的部分顺序，以使用更少的记分板寄存器 410 来管理依赖关系，同时不会不必要地减慢程序的执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "466232353d35c813b96a9e784d9cbc68", "index": 113, "aliyun_index": 9, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0056] As shown in FIG. 5, the first dependency barrier instruction is included after the three texture instructions and requires that the first scoreboard register 410(1) (e.g., SB1) have a value that is less than or equal to two. The first dependency barrier instruction is ordered before the first floating-point multiply instruction, which depends on the source operand stored in R1 that is written as a result of the execution of the first texture operation. At the time that the scheduler unit 310 decodes the first dependency barrier instruction, each of the three texture instructions will have been dispatched to the texture units 390. Thus, the first scoreboard register 410(1) will have been incremented three times. During the intervening time, zero or more of the texture operations may have been executed by the texture units 390, thus causing the first scoreboard register 410(1) to be decremented. If the first scoreboard register 410(1) holds a value of two, then the scheduler unit 310 knows that the first texture instruction has been executed and the output value was written to the destination register R1. Thus, the first floating-point multiply instruction can be dispatched to the floating-point multiplication unit because all dependencies for that instruction have been resolved. Using the dependency barrier instruction enables some dependent instructions to be dispatched prior to completion of all of the texture operations associated with the first scoreboard register 410(1).  \n\n", "text": "[0056] As shown in FIG. 5, the first dependency barrier instruction is included after the three texture instructions and requires that the first scoreboard register 410(1) (e.g., SB1) have a value that is less than or equal to two. The first dependency barrier instruction is ordered before the first floating-point multiply instruction, which depends on the source operand stored in R1 that is written as a result of the execution of the first texture operation. At the time that the scheduler unit 310 decodes the first dependency barrier instruction, each of the three texture instructions will have been dispatched to the texture units 390. Thus, the first scoreboard register 410(1) will have been incremented three times. During the intervening time, zero or more of the texture operations may have been executed by the texture units 390, thus causing the first scoreboard register 410(1) to be decremented. If the first scoreboard register 410(1) holds a value of two, then the scheduler unit 310 knows that the first texture instruction has been executed and the output value was written to the destination register R1. Thus, the first floating-point multiply instruction can be dispatched to the floating-point multiplication unit because all dependencies for that instruction have been resolved. Using the dependency barrier instruction enables some dependent instructions to be dispatched prior to completion of all of the texture operations associated with the first scoreboard register 410(1).\n", "alignment": "left", "unique_id": "466232353d35c813b96a9e784d9cbc68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0056] As shown in FIG. 5, the first dependency barrier instruction is included after the three texture instructions and requires that the first scoreboard register 410(1) (e.g., SB1) have a value that is less than or equal to two. The first dependency barrier instruction is ordered before the first floating-point multiply instruction, which depends on the source operand stored in R1 that is written as a result of the execution of the first texture operation. At the time that the scheduler unit 310 decodes the first dependency barrier instruction, each of the three texture instructions will have been dispatched to the texture units 390. Thus, the first scoreboard register 410(1) will have been incremented three times. During the intervening time, zero or more of the texture operations may have been executed by the texture units 390, thus causing the first scoreboard register 410(1) to be decremented. If the first scoreboard register 410(1) holds a value of two, then the scheduler unit 310 knows that the first texture instruction has been executed and the output value was written to the destination register R1. Thus, the first floating-point multiply instruction can be dispatched to the floating-point multiplication unit because all dependencies for that instruction have been resolved. Using the dependency barrier instruction enables some dependent instructions to be dispatched prior to completion of all of the texture operations associated with the first scoreboard register 410(1)."}], "lineHeight": 0}}, "target": {"markdown": "[0056] 如图 5 所示，第一条依赖屏障指令包含在三条纹理指令之后，并要求第一记分板寄存器 410(1)（例如 SB1）的值小于或等于二。第一条依赖屏障指令排在第一条浮点乘法指令之前，该乘法指令依赖于存储在 R1 中的源操作数，而该源操作数是作为第一条纹理操作执行的结果被写入的。在调度器单元 310 解码第一条依赖屏障指令时，三条纹理指令中的每一条都已经被分派到纹理单元 390。因此，第一记分板寄存器 410(1) 已被递增三次。在其间，零个或多个纹理操作可能已由纹理单元 390 执行，从而使第一记分板寄存器 410(1) 被递减。如果第一记分板寄存器 410(1) 保持的值为二，则调度器单元 310 知道第一条纹理指令已被执行，并且输出值已写入目标寄存器 R1。因此，第一条浮点乘法指令可以被分派到浮点乘法单元，因为该指令的所有依赖关系都已得到解决。使用依赖屏障指令可以使某些依赖指令在与第一记分板寄存器 410(1) 相关联的所有纹理操作完成之前被分派。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "f0adcb0a44a4b759c9b4756c799f9124", "index": 114, "aliyun_index": 10, "page_num": 15, "type": "text", "sub_type": "none", "markdown": "[0057] The pseudocode 500 further includes a second DEPBAR instruction that requires the first scoreboard register 410(1) to be less than or equal to 1 followed by a second FMUL instruction that utilizes a source operand register R4 that was written as a destination register of the second texture instruction. The pseudocode 500 also includes a third DEPBAR instruction that requires the first scoreboard register 410(1) to be equal to zero followed by a third FMUL instruction that utilizes a source operand register R7 that was written as a destination register of the third texture instruction. It will be appreciated that the third DEPBAR instruction is equivalent to utilizing a source operands bit mask identifying the first scoreboard register 410(1) in the third FMUL instruction because the DEPBAR instruction includes an immediate value of 0, which is the same value that will be checked against using the ‘&req-0x1’ instruction suffix. It will be appreciated that, in other exemplary programs, multiple  \n\n", "text": "[0057] The pseudocode 500 further includes a second DEPBAR instruction that requires the first scoreboard register 410(1) to be less than or equal to 1 followed by a second FMUL instruction that utilizes a source operand register R4 that was written as a destination register of the second texture instruction. The pseudocode 500 also includes a third DEPBAR instruction that requires the first scoreboard register 410(1) to be equal to zero followed by a third FMUL instruction that utilizes a source operand register R7 that was written as a destination register of the third texture instruction. It will be appreciated that the third DEPBAR instruction is equivalent to utilizing a source operands bit mask identifying the first scoreboard register 410(1) in the third FMUL instruction because the DEPBAR instruction includes an immediate value of 0, which is the same value that will be checked against using the ‘&req-0x1’ instruction suffix. It will be appreciated that, in other exemplary programs, multiple\n", "alignment": "left", "unique_id": "f0adcb0a44a4b759c9b4756c799f9124", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0057] The pseudocode 500 further includes a second DEPBAR instruction that requires the first scoreboard register 410(1) to be less than or equal to 1 followed by a second FMUL instruction that utilizes a source operand register R4 that was written as a destination register of the second texture instruction. The pseudocode 500 also includes a third DEPBAR instruction that requires the first scoreboard register 410(1) to be equal to zero followed by a third FMUL instruction that utilizes a source operand register R7 that was written as a destination register of the third texture instruction. It will be appreciated that the third DEPBAR instruction is equivalent to utilizing a source operands bit mask identifying the first scoreboard register 410(1) in the third FMUL instruction because the DEPBAR instruction includes an immediate value of 0, which is the same value that will be checked against using the ‘&req-0x1’ instruction suffix. It will be appreciated that, in other exemplary programs, multiple"}], "lineHeight": 0}}, "target": {"markdown": "[0057] 伪代码 500 还包括第二条 DEPBAR 指令，该指令要求第一记分板寄存器 410(1) 小于或等于 1，之后是第二条 FMUL 指令，该 FMUL 指令使用作为第二条纹理指令的目标寄存器被写入的源操作数寄存器 R4。伪代码 500 还包括第三条 DEPBAR 指令，该指令要求第一记分板寄存器 410(1) 等于零，之后是第三条 FMUL 指令，该 FMUL 指令使用作为第三条纹理指令的目标寄存器被写入的源操作数寄存器 R7。可以理解的是，第三条 DEPBAR 指令等同于在第三条 FMUL 指令中使用标识第一记分板寄存器 410(1) 的源操作数位掩码，因为 DEPBAR 指令包含的立即数为 0，这与使用 '&req-0x1' 指令后缀进行检查的值相同。可以理解的是，在其他示例性程序中，多个", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "0994f1b77357f441494fccd469b6bde2", "index": 115, "aliyun_index": 3, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "DEPBAR instructions may be associated with multiple\nscoreboard registers and, potentially, multiple different and\ndistinct decoupled pipelines.  \n\n", "text": "DEPBAR instructions may be associated with multiple\nscoreboard registers and, potentially, multiple different and\ndistinct decoupled pipelines.\n", "alignment": "left", "unique_id": "0994f1b77357f441494fccd469b6bde2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DEPBAR instructions may be associated with multiple"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "scoreboard registers and, potentially, multiple different and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "distinct decoupled pipelines."}], "lineHeight": -75}}, "target": {"markdown": "DEPBAR 指令可以与多个记分板寄存器相关联，并且可能与多个不同且独立的解耦流水线相关联。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "6a4553565e6ab41f5540fd8d94c0d3e6", "index": 116, "aliyun_index": 4, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0058] FIG. 6A illustrates a flowchart of a method 600 for determining an immediate value for a dependency barrier instruction, according to one embodiment. A compiler may be configured to insert dependency barrier instructions within the intermediate representation of code for a thread block. The dependency barrier instructions may include an immediate value and an identifier for a scoreboard register 410. Again, in one embodiment, the identifier may be, e.g., a bit mask that specifies a particular scoreboard register 410 that is associated with the dependency barrier instruction. At step 602, a compiler inserts a dependency barrier instruction in a program immediately preceding an instruction that is dependent on a previously issued instruction in the program. The previously issued instruction may be an instruction that is configured to be executed by a decoupled pipeline, such as a texture instruction or a load/store instruction. The previously issued instruction includes an instruction suffix that causes a scoreboard to be produced when the previously issued instruction is dispatched. The dependency barrier instruction should be associated with the same scoreboard register 410 as the previously issued instruction.  \n\n", "text": "[0058] FIG. 6A illustrates a flowchart of a method 600 for determining an immediate value for a dependency barrier instruction, according to one embodiment. A compiler may be configured to insert dependency barrier instructions within the intermediate representation of code for a thread block. The dependency barrier instructions may include an immediate value and an identifier for a scoreboard register 410. Again, in one embodiment, the identifier may be, e.g., a bit mask that specifies a particular scoreboard register 410 that is associated with the dependency barrier instruction. At step 602, a compiler inserts a dependency barrier instruction in a program immediately preceding an instruction that is dependent on a previously issued instruction in the program. The previously issued instruction may be an instruction that is configured to be executed by a decoupled pipeline, such as a texture instruction or a load/store instruction. The previously issued instruction includes an instruction suffix that causes a scoreboard to be produced when the previously issued instruction is dispatched. The dependency barrier instruction should be associated with the same scoreboard register 410 as the previously issued instruction.\n", "alignment": "left", "unique_id": "6a4553565e6ab41f5540fd8d94c0d3e6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0058] FIG. 6A illustrates a flowchart of a method 600 for determining an immediate value for a dependency barrier instruction, according to one embodiment. A compiler may be configured to insert dependency barrier instructions within the intermediate representation of code for a thread block. The dependency barrier instructions may include an immediate value and an identifier for a scoreboard register 410. Again, in one embodiment, the identifier may be, e.g., a bit mask that specifies a particular scoreboard register 410 that is associated with the dependency barrier instruction. At step 602, a compiler inserts a dependency barrier instruction in a program immediately preceding an instruction that is dependent on a previously issued instruction in the program. The previously issued instruction may be an instruction that is configured to be executed by a decoupled pipeline, such as a texture instruction or a load/store instruction. The previously issued instruction includes an instruction suffix that causes a scoreboard to be produced when the previously issued instruction is dispatched. The dependency barrier instruction should be associated with the same scoreboard register 410 as the previously issued instruction."}], "lineHeight": 0}}, "target": {"markdown": "[0058] 图 6A 示出了根据一个实施例的用于确定依赖屏障指令的立即数的方法 600 的流程图。编译器可以被配置为在线程块的中间表示代码中插入依赖屏障指令。依赖屏障指令可以包括一个立即数和一个记分板寄存器 410 的标识符。同样，在一个实施例中，该标识符可以是例如一个位掩码，其指定与依赖屏障指令相关联的特定记分板寄存器 410。在步骤 602 中，编译器在程序中紧接在一条依赖于先前发出的指令的指令之前插入一条依赖屏障指令。该先前发出的指令可以是被配置为由解耦流水线（例如纹理指令或加载/存储指令）执行的指令。该先前发出的指令包括一个指令后缀，该指令后缀在先前发出的指令被分派时生成一个记分板。依赖屏障指令应当与先前发出的指令相关联同一个记分板寄存器 410。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "9f4238384559264adb6547db0138ce5e", "index": 117, "aliyun_index": 5, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0059] At step 604, the compiler determines a minimum distance from a root node (i.e., the dependency barrier instruction) to a node of the program (i.e., the previously issued instruction). The distance is computed based on the number of scoreboards that are produced and consumed for a particular decoupled pipeline. One technique for computing the minimum distance of a node is described below in conjunction with FIG. 6B. At step 606, the compiler assigns the immediate value to be less than the minimum distance.  \n\n", "text": "[0059] At step 604, the compiler determines a minimum distance from a root node (i.e., the dependency barrier instruction) to a node of the program (i.e., the previously issued instruction). The distance is computed based on the number of scoreboards that are produced and consumed for a particular decoupled pipeline. One technique for computing the minimum distance of a node is described below in conjunction with FIG. 6B. At step 606, the compiler assigns the immediate value to be less than the minimum distance.\n", "alignment": "left", "unique_id": "9f4238384559264adb6547db0138ce5e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0059] At step 604, the compiler determines a minimum distance from a root node (i.e., the dependency barrier instruction) to a node of the program (i.e., the previously issued instruction). The distance is computed based on the number of scoreboards that are produced and consumed for a particular decoupled pipeline. One technique for computing the minimum distance of a node is described below in conjunction with FIG. 6B. At step 606, the compiler assigns the immediate value to be less than the minimum distance."}], "lineHeight": 0}}, "target": {"markdown": "[0059] 在步骤 604 中，编译器确定从根节点（即依赖屏障指令）到程序中的某个节点（即先前发出的指令）的最小距离。该距离根据为特定解耦流水线生成和消费的记分板数量来计算。下面结合图 6B 描述一种计算节点最小距离的技术。在步骤 606 中，编译器将立即数赋值为小于该最小距离的值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "57b7f4633aa48a6300ccd1edbae6defb", "index": 118, "aliyun_index": 6, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0060] Determining the immediate value for a dependency barrier instruction is simple if the referenced scoreboard register 410 is only associated with instructions dispatched to a single decoupled pipeline (i.e., a virtual queue) and the referenced scoreboard is only utilized for write dependencies or read dependencies, but not both. In this case, the immediate value is simply determined by counting the number of scoreboards generated between the root node and the node associated with the dependent read or the dependent write. However, the general case becomes more complicated when instructions associated with the same scoreboard register 410 may be dispatched to multiple decoupled pipelines (meaning the instructions associated with a single scoreboard register 410 may be executed out-of-order).  \n\n", "text": "[0060] Determining the immediate value for a dependency barrier instruction is simple if the referenced scoreboard register 410 is only associated with instructions dispatched to a single decoupled pipeline (i.e., a virtual queue) and the referenced scoreboard is only utilized for write dependencies or read dependencies, but not both. In this case, the immediate value is simply determined by counting the number of scoreboards generated between the root node and the node associated with the dependent read or the dependent write. However, the general case becomes more complicated when instructions associated with the same scoreboard register 410 may be dispatched to multiple decoupled pipelines (meaning the instructions associated with a single scoreboard register 410 may be executed out-of-order).\n", "alignment": "left", "unique_id": "57b7f4633aa48a6300ccd1edbae6defb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0060] Determining the immediate value for a dependency barrier instruction is simple if the referenced scoreboard register 410 is only associated with instructions dispatched to a single decoupled pipeline (i.e., a virtual queue) and the referenced scoreboard is only utilized for write dependencies or read dependencies, but not both. In this case, the immediate value is simply determined by counting the number of scoreboards generated between the root node and the node associated with the dependent read or the dependent write. However, the general case becomes more complicated when instructions associated with the same scoreboard register 410 may be dispatched to multiple decoupled pipelines (meaning the instructions associated with a single scoreboard register 410 may be executed out-of-order)."}], "lineHeight": 0}}, "target": {"markdown": "[0060] 如果所引用的记分板寄存器 410 仅与分派到单个解耦流水线（即虚拟队列）的指令相关联，并且所引用的记分板仅用于写依赖或读依赖（而非两者皆有），则确定依赖屏障指令的立即数较为简单。在这种情况下，只需通过计算根节点与依赖于读或写的节点之间所生成的记分板数量即可确定立即数。然而，当与同一记分板寄存器 410 相关联的指令可能被分派到多个解耦流水线时（这意味着与单个记分板寄存器 410 相关联的指令可能会乱序执行），一般情况会变得更加复杂。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "10ee72ce91ae4069bf1e49c3cb044ffa", "index": 119, "aliyun_index": 7, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0061] In one embodiment, a dependency barrier instruction should not be utilized in the cases where a single scoreboard is associated with multiple decoupled pipelines. However, a dependency barrier instruction can include a non-zero immediate value and also be associated with a scoreboard register 410 used for multiple decoupled pipelines when the minimum distance for the node in the first decoupled pipeline is greater than the immediate value and the total depth of any other decoupled pipeline associated with the scoreboard register 410 is less than the position of the node in the first decoupled pipeline.  \n\n", "text": "[0061] In one embodiment, a dependency barrier instruction should not be utilized in the cases where a single scoreboard is associated with multiple decoupled pipelines. However, a dependency barrier instruction can include a non-zero immediate value and also be associated with a scoreboard register 410 used for multiple decoupled pipelines when the minimum distance for the node in the first decoupled pipeline is greater than the immediate value and the total depth of any other decoupled pipeline associated with the scoreboard register 410 is less than the position of the node in the first decoupled pipeline.\n", "alignment": "left", "unique_id": "10ee72ce91ae4069bf1e49c3cb044ffa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0061] In one embodiment, a dependency barrier instruction should not be utilized in the cases where a single scoreboard is associated with multiple decoupled pipelines. However, a dependency barrier instruction can include a non-zero immediate value and also be associated with a scoreboard register 410 used for multiple decoupled pipelines when the minimum distance for the node in the first decoupled pipeline is greater than the immediate value and the total depth of any other decoupled pipeline associated with the scoreboard register 410 is less than the position of the node in the first decoupled pipeline."}], "lineHeight": 0}}, "target": {"markdown": "[0061] 在一个实施例中，在单个记分板与多个解耦流水线相关联的情况下，不应使用依赖屏障指令。然而，当第一条解耦流水线中节点的最小距离大于立即数，并且与该记分板寄存器 410 相关联的任何其他解耦流水线的总深度小于该节点在第一条解耦流水线中的位置时，依赖屏障指令可以包含非零立即数，并且还可以与用于多个解耦流水线的记分板寄存器 410 相关联。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "4c1cabd303ac3453de621f7c2a827de3", "index": 120, "aliyun_index": 8, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0062] Further, determining the minimum distance\nbecomes more complicated when read dependencies and\nwrite dependencies are combined using the same scoreboard\nregister 410. In such cases, the compiler may construct a\ndirected graph that represents all possible paths the hardware\ncan take when processing the instructions, and producing and  \n\n", "text": "[0062] Further, determining the minimum distance\nbecomes more complicated when read dependencies and\nwrite dependencies are combined using the same scoreboard\nregister 410. In such cases, the compiler may construct a\ndirected graph that represents all possible paths the hardware\ncan take when processing the instructions, and producing and\n", "alignment": "left", "unique_id": "4c1cabd303ac3453de621f7c2a827de3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0062] Further, determining the minimum distance"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, \npleted and all other operations are potentially outstanding.\n", "alignment": "left", "unique_id": "fcd251b29e7c74ea125bb7a352aa15cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "consuming scoreboards, and look for all operations that are"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "common to those paths based on a particular immediate"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "value. Such operations having a distance greater than the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "immediate value in all possible paths are considered com-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "pleted and all other operations are potentially outstanding."}], "lineHeight": -123}}, "target": {"markdown": "消费记分板，并基于特定立即数查找那些路径中共有的所有操作。所有可能路径中距离大于该立即数的此类操作被认为已完成，而所有其他操作则可能尚未完成。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "7772b80b85ab0ed4e34b9851a50b89d9", "index": 122, "aliyun_index": 10, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0063] Take two cases, a fully pipelined case where every read for the series of operations is completed and then every write for the series of operations is completed subsequent to all of the reads, and a non-pipelined case where a read followed by a write is completed for each operation in the series of operations, in-order. In the case of a write dependency, the minimum distance to a node will be given by the fully-pipelined case where all nodes are read and then all nodes are written. Therefore, counting the number of write dependency scoreboards produced between the root node and a particular node will provide the maximum immediate value that can be assigned to the dependency barrier instruction to guarantee that an instructions destination register has been written. In the case of a read dependency, the minimum distance to a node will be the minimum of the distance in the fully-pipelined case and the non-pipelined case. For a read dependency in a fully-pipelined case, the distance from the root node to the node is given by summing a count of the write dependency scoreboards produced by a series of operations dispatched to a particular decoupled pipeline, including operations ordered before as well as after the particular node, added to a count of the read dependency scoreboards produced by a series of operations dispatched between the root node and the particular node. For a read dependency in a non-pipelined case, the distance from the root node to the node is given by summing all of the read dependency scoreboards and write dependency scoreboards produced by a series of operations dispatched between the root node and the particular node.  \n\n", "text": "[0063] Take two cases, a fully pipelined case where every read for the series of operations is completed and then every write for the series of operations is completed subsequent to all of the reads, and a non-pipelined case where a read followed by a write is completed for each operation in the series of operations, in-order. In the case of a write dependency, the minimum distance to a node will be given by the fully-pipelined case where all nodes are read and then all nodes are written. Therefore, counting the number of write dependency scoreboards produced between the root node and a particular node will provide the maximum immediate value that can be assigned to the dependency barrier instruction to guarantee that an instructions destination register has been written. In the case of a read dependency, the minimum distance to a node will be the minimum of the distance in the fully-pipelined case and the non-pipelined case. For a read dependency in a fully-pipelined case, the distance from the root node to the node is given by summing a count of the write dependency scoreboards produced by a series of operations dispatched to a particular decoupled pipeline, including operations ordered before as well as after the particular node, added to a count of the read dependency scoreboards produced by a series of operations dispatched between the root node and the particular node. For a read dependency in a non-pipelined case, the distance from the root node to the node is given by summing all of the read dependency scoreboards and write dependency scoreboards produced by a series of operations dispatched between the root node and the particular node.\n", "alignment": "left", "unique_id": "7772b80b85ab0ed4e34b9851a50b89d9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0063] Take two cases, a fully pipelined case where every read for the series of operations is completed and then every write for the series of operations is completed subsequent to all of the reads, and a non-pipelined case where a read followed by a write is completed for each operation in the series of operations, in-order. In the case of a write dependency, the minimum distance to a node will be given by the fully-pipelined case where all nodes are read and then all nodes are written. Therefore, counting the number of write dependency scoreboards produced between the root node and a particular node will provide the maximum immediate value that can be assigned to the dependency barrier instruction to guarantee that an instructions destination register has been written. In the case of a read dependency, the minimum distance to a node will be the minimum of the distance in the fully-pipelined case and the non-pipelined case. For a read dependency in a fully-pipelined case, the distance from the root node to the node is given by summing a count of the write dependency scoreboards produced by a series of operations dispatched to a particular decoupled pipeline, including operations ordered before as well as after the particular node, added to a count of the read dependency scoreboards produced by a series of operations dispatched between the root node and the particular node. For a read dependency in a non-pipelined case, the distance from the root node to the node is given by summing all of the read dependency scoreboards and write dependency scoreboards produced by a series of operations dispatched between the root node and the particular node."}], "lineHeight": 0}}, "target": {"markdown": "[0063] 考虑两种情况：一种是全流水线情况，其中一系列操作的每次读取都先完成，然后在该系列操作的所有读取之后才完成每次写入；另一种是非流水线情况，其中对于该系列操作中的每个操作，按顺序完成一次读取后再完成一次写入。在写依赖的情况下，到某节点的最小距离由全流水线情况给出，在该情况下所有节点先被读取，然后所有节点再被写入。因此，计算根节点与特定节点之间所生成的写依赖记分板的数量，将提供可以分配给依赖屏障指令的最大立即数，以保证指令的目标寄存器已被写入。在读依赖的情况下，到某节点的最小距离是全流水线情况下与非流水线情况下距离的较小者。对于全流水线情况下的读依赖，从根节点到该节点的距离由以下各项相加得出：对分派到特定解耦流水线的一系列操作（包括在该特定节点之前和之后排序的操作）所生成的写依赖记分板进行计数，再加上对在根节点与该特定节点之间分派的一系列操作所生成的读依赖记分板进行计数。对于非流水线情况下的读依赖，从根节点到该节点的距离由以下各项相加得出：对在根节点与该特定节点之间分派的一系列操作所生成的所有读依赖记分板和写依赖记分板进行计数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "bc9967be54351dc328c5292eeea706bd", "index": 123, "aliyun_index": 11, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0064] FIG. 63 illustrates a flowchart of step 604 of method 600 for determining a minimum distance from a root node to a node, according to one embodiment. At step 612, the compiler determines whether the dependency barrier instruction is protecting against a RAW hazard (i.e., a dependent write) or against a WAR hazard (i.e., a dependent read). If the dependency barrier instruction is protecting against a dependent write, then, at step 614, the compiler counts a number of write dependency scoreboards corresponding to a particular scoreboard register 410 between the dependency barrier instruction and the node. However, if, at step 612, the dependency barrier instruction is protecting against a dependent read, then the method proceeds to step 616.  \n\n", "text": "[0064] FIG. 63 illustrates a flowchart of step 604 of method 600 for determining a minimum distance from a root node to a node, according to one embodiment. At step 612, the compiler determines whether the dependency barrier instruction is protecting against a RAW hazard (i.e., a dependent write) or against a WAR hazard (i.e., a dependent read). If the dependency barrier instruction is protecting against a dependent write, then, at step 614, the compiler counts a number of write dependency scoreboards corresponding to a particular scoreboard register 410 between the dependency barrier instruction and the node. However, if, at step 612, the dependency barrier instruction is protecting against a dependent read, then the method proceeds to step 616.\n", "alignment": "left", "unique_id": "bc9967be54351dc328c5292eeea706bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0064] FIG. 63 illustrates a flowchart of step 604 of method 600 for determining a minimum distance from a root node to a node, according to one embodiment. At step 612, the compiler determines whether the dependency barrier instruction is protecting against a RAW hazard (i.e., a dependent write) or against a WAR hazard (i.e., a dependent read). If the dependency barrier instruction is protecting against a dependent write, then, at step 614, the compiler counts a number of write dependency scoreboards corresponding to a particular scoreboard register 410 between the dependency barrier instruction and the node. However, if, at step 612, the dependency barrier instruction is protecting against a dependent read, then the method proceeds to step 616."}], "lineHeight": 0}}, "target": {"markdown": "[0064] 图 63 示出了根据一个实施例的用于确定从根节点到某节点的最小距离的方法 600 的步骤 604 的流程图。在步骤 612 中，编译器确定依赖屏障指令是用于防止 RAW 危险（即相关写），还是用于防止 WAR 危险（即相关读）。如果依赖屏障指令用于防止相关写，则在步骤 614 中，编译器对依赖屏障指令与该节点之间、与特定记分板寄存器 410 对应的写依赖记分板数量进行计数。然而，如果在步骤 612 中，依赖屏障指令用于防止相关读，则该方法继续执行步骤 616。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "5af814dc931cc4711ab7210fb86d23fd", "index": 124, "aliyun_index": 12, "page_num": 16, "type": "text", "sub_type": "none", "markdown": "[0065] At step 616, the compiler calculates a sum of a number of read dependency scoreboards corresponding to the particular scoreboard register 410 between the dependency barrier instruction and the node and a number of write dependency scoreboards corresponding to the particular scoreboard register 410 between the dependency barrier instruction and the node. At step 618, the compiler calculates a sum of a number of read dependency scoreboards corresponding to the particular scoreboard register 410 between the dependency barrier instruction and the node and a number of write dependency scoreboards corresponding to the particular scoreboard register 410 associated with a particular decoupled pipeline. At step 620, the compiler determines the minimum distance by taking the minimum of the sum from step 616 and the sum from step 618.  \n\n", s the write dependency scoreboard for the second texture operation, and a fourth node 658 represents the read dependency scoreboard for the third texture operation. The root node 660 represents the dependency barrier instruction. In the non-pipelined case, the order of the events follows node 652 to node 654 to node 656 to node 658 to the root node 660. In other words, the source operands for the first texture operation are read, then the destination register for the first texture operation is written (i.e., node 652), then the source operands for the second texture operation are read (i.e., node 654), then the destination register for the second texture operation is written (i.e., node 656), then the source operands for the third texture operation are read (i.e., node 658), and finally the destination register for the third texture operation is written. Conversely, in the fully-pipelined case, the order of the events follows node 654 to node 658 to node 652 to node 656 to the root node 660. In other words, the source operands for the first texture operation are read, then the source operands for the second texture operation are read (i.e., node 654), then the source operands for the third texture operation are read (i.e., node 658), then the destination register for the first texture operation is written (i.e., node 652), then the destination register for the second texture operation is written (i.e., node 656), and finally the destination register for the third texture operation is written.  \n\n", "text": "[0067] As shown in FIG. 6C, a first node 652 represents the write dependency scoreboard for the first texture operation, a second node 654 represents the read dependency scoreboard for the second texture operation, a third node 656 represents the write dependency scoreboard for the second texture operation, and a fourth node 658 represents the read dependency scoreboard for the third texture operation. The root node 660 represents the dependency barrier instruc e root node 660 represents the dependency barrier instruction. In the non-pipelined case, the order of the events follows node 652 to node 654 to node 656 to node 658 to the root node 660. In other words, the source operands for the first texture operation are read, then the destination register for the first texture operation is written (i.e., node 652), then the source operands for the second texture operation are read (i.e., node 654), then the destination register for the second texture operation is written (i.e., node 656), then the source operands for the third texture operation are read (i.e., node 658), and finally the destination register for the third texture operation is written. Conversely, in the fully-pipelined case, the order of the events follows node 654 to node 658 to node 652 to node 656 to the root node 660. In other words, the source operands for the first texture operation are read, then the source operands for the second texture operation are read (i.e., node 654), then the source operands for the third texture operation are read (i.e., node 658), then the destination register for the first texture operation is written (i.e., node 652), then the destination register for the second texture operation is written (i.e., node 656), and finally the destination register for the third texture operation is written."}], "lineHeight": 0}}, "target": {"markdown": "[0067] 如图 6C 所示，第一节点 652 表示第一次纹理操作的写依赖记分板，第二节点 654 表示第二次纹理操作的读依赖记分板，第三节点 656 表示第二次纹理操作的写依赖记分板，第四节点 658 表示第三次纹理操作的读依赖记分板。根节点 660 表示依赖屏障指令。在非流水线情况下，事件的顺序为节点 652 到节点 654 到节点 656 到节点 658，再到根节点 660。换言之，首先读取第一次纹理操作的源操作数，然后写入第一次纹理操作的目标寄存器（即节点 652），接着读取第二次纹理操作的源操作数（即节点 654），然后写入第二次纹理操作的目标寄存器（即节点 656），接着读取第三次纹理操作的源操作数（即节点 658），最后写入第三次纹理操作的目标寄存器。相反，在全流水线情况下，事件的顺序为节点 654 到节点 658 到节点 652 到节点 656，再到根节点 660。换言之，首先读取第一次纹理操作的源操作数，然后读取第二次纹理操作的源操作数（即节点 654），接着读取第三次纹理操作的源操作数（即节点 658），然后写入第一次纹理操作的目标寄存器（即节点 652），接着写入第二次纹理操作的目标寄存器（即节点 656），最后写入第三次纹理操作的目标寄存器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "85724543d2b8de3322f1ebad33e1e61a", "index": 130, "aliyun_index": 7, "page_num": 17, "type": "text", "sub_type": "none", "markdown": "[0068] In order to ensure that an operation has been completed is simply determined based on the minimum distance (in the two cases) between the root node and the node of interest. For example, the operations associated with node 658 and node 656 are only 1 step away from the root node 660, therefore, any immediate value greater than or equal to 1 does not ensure that either of these operations (i.e., the source operands for the third texture operation are read or the destination register for the second texture operation is written) have completed. In contrast, the minimum distance between the root node 660 and either nodes 654 or 652 is two, so a dependency barrier instruction having an immediate value of 1 ensures that the operations associated with these nodes will have completed.  \n\n", "text": "[0068] In order to ensure that an operation has been completed is simply determined based on the minimum distance (in the two cases) between the root node and the node of interest. For example, the operations associated with node 658 and node 656 are only 1 step away from the root node 660, therefore, any immediate value greater than or equal to 1 does not ensure that either of these operations (i.e., the source operands for the third texture operation are read or the destination register for the second texture operation is written) have completed. In contrast, the minimum distance between the root node 660 and either nodes 654 or 652 is two, so a dependency barrier instruction having an immediate value of 1 ensures that the operations associated with these nodes will have completed.\n", "alignment": "left", "unique_id": "85724543d2b8de3322f1ebad33e1e61a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0068] In order to ensure that an operation has been completed is simply determined based on the minimum distance (in the two cases) between the root node and the node of interest. For example, the operations associated with node 658 and node 656 are only 1 step away from the root node 660, therefore, any immediate value greater than or equal to 1 does not ensure that either of these operations (i.e., the source operands for the third texture operation are read or the destination register for the second texture operation is written) have completed. In contrast, the minimum distance between the root node 660 and either nodes 654 or 652 is two, so a dependency barrier instruction having an immediate value of 1 ensures that the operations associated with these nodes will have completed."}], "lineHeight": 0}}, "target": {"markdown": "[0068] 为确保某操作已完成，只需基于根节点与目标节点之间（在两种情况下）的最小距离进行判断即可。例如，与节点 658 和节点 656 相关联的操作距离根节点 660 仅 1 步，因此任何大于或等于 1 的立即数都不能确保这些操作（即读取第三次纹理操作的源操作数或写入第二次纹理操作的目标寄存器）已完成。相反，根节点 660 与节点 654 或节点 652 之间的最小距离为 2，因此具有立即数 1 的依赖屏障指令可确保与这些节点相关联的操作将已完成。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "da1f448849649e8c8ba3097117fdf745", "index": 131, "aliyun_index": 8, "page_num": 17, "type": "text", "sub_type": "none", "markdown": "[0069] It will be appreciated that the order of the operations represented by the directed graph 650 may be completed in any order represented by the arrows. In other words, all reads may be completed before any writes, or writes may be completed before each subsequent read, or some mixture of the two. In one embodiment, a compiler may be configured to generate a directed graph for a plurality of instructions preceding a dependency rkdown": "interest (i.e., a node associated with an operation that the\ndependency barrier instruction is inserted for in order to\nensure that the operation has been completed).  \n\n", "text": "interest (i.e., a node associated with an operation that the\ndependency barrier instruction is inserted for in order to\nensure that the operation has been completed).\n", "alignment": "left", "unique_id": "b88061e04f7461c64d9dec97e928f397", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "interest (i.e., a node associated with an operation that the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "dependency barrier instruction is inserted for in order to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ensure that the operation has been completed)."}], "lineHeight": -77}}, "target": {"markdown": "目标节点（即与为确保该操作已完成而插入依赖屏障指令的该操作相关联的节点）之间的最小距离。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "8f667b3794dd4161f9a55b74379c6ea0", "index": 133, "aliyun_index": 10, "page_num": 17, "type": "text", "sub_type": "none", "markdown": "[0070] FIG. 7 illustrates an exemplary system 700 in which the various architecture and/or functionality of the various previous embodiments may be implemented. As shown, a system 700 is provided including at least one central processor 701 that is connected to a communication bus 702. The communication bus 702 may be implemented using any suitable protocol, such as PCI (Peripheral Component Interconnect), PCI-Express, AGP (Accelerated Graphics Port), HyperTransport, or any other bus or point-to-point communication protocol(s). The system 700 also includes a main memory 704. Control logic (software) and data are stored in the main memory 704 which may take the form of random access memory (RAM).  \n\n", "text": "[0070] FIG. 7 illustrates an exemplary system 700 in which the various architecture and/or functionality of the various previous embodiments may be implemented. As shown, a system 700 is provided including at least one central processor 701 that is connected to a communication bus 702. The communication bus 702 may be implemented using any suitable protocol, such as PCI (Peripheral Component Interconnect), PCI-Express, AGP (Accelerated Graphics Port), HyperTransport, or any other bus or point-to-point communication protocol(s). The system 700 also includes a main memory 704. Control logic (software) and data are stored in the main memory 704 which may take the form of random access memory (RAM).\n", "alignment": "left", "unique_id": "8f667b3794dd4161f9a55b74379c6ea0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0070] FIG. 7 illustrates an exemplary system 700 in which the various architecture and/or functionality of the various previous embodiments may be implemented. As shown, a system 700 is provided including at least one central processor 701 that is connected to a communication bus 702. The communication bus 702 may be implemented using any suitable protocol, such as PCI (Peripheral Component Interconnect), PCI-Express, AGP (Accelerated Graphics Port), HyperTransport, or any other bus or point-to-point communication protocol(s). The system 700 also includes a main memory 704. Control logic (software) and data are stored in the main memory 704 which may take the form of random access memory (RAM)."}], "lineHeight": 0}}, "target": {"markdown": "[0070] 图 7 示出了可以实现前述各种实施例的各种架构和/或功能的示例性系统 700。如图所示，提供了一种系统 700，其包括至少一个中央处理器 701，该中央处理器 701 连接到通信总线 702。通信总线 702 可以使用任何合适的协议来实现，例如 PCI（外围组件互连）、PCI-Express、AGP（加速图形端口）、HyperTransport 或任何其他总线或点对点通信协议。系统 700 还包括主存储器 704。控制逻辑（软件）和数据存储在主存储器 704 中，主存储器 704 可以采用随机存取存储器（RAM）的形式。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "50a7c8a4bc2d8f3e33db13953fa6b58b", "index": 134, "aliyun_index": 11, "page_num": 17, "type": "text", "sub_type": "none", "markdown": "[0071] The system 700 also includes input devices 712, a graphics processor 706, and a display 708, i.e. a conventional CRT (cathode ray tube), LCD (liquid crystal display), LED (light emitting diode), plasma display or the like. User input may be received from the input devices 712, e.g., keyboard, mouse, touchpad, microphone, and the like. In one embodiment, the graphics processor 706 may include a plurality of shader modules, a rasterization module, etc. Each of the foregoing modules may even be situated on a single semiconductor platform to form a graphics processing unit (GPU).  \n\n", "text": "[0071] The system 700 also includes input devices 712, a graphics processor 706, and a display 708, i.e. a conventional CRT (cathode ray tube), LCD (liquid crystal display), LED (light emitting diode), plasma display or the like. User input may be received from the input devices 712, e.g., keyboard, mouse, touchpad, microphone, and the like. In one embodiment, the graphics processor 706 may include a plurality of shader modules, a rasterization module, etc. Each of the foregoing modules may even be situated on a single semiconductor platform to form a graphics processing unit (GPU).\n", "alignment": "left", "unique_id": "50a7c8a4bc2d8f3e33db13953fa6b58b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0071] The system 700 also includes input devices 712, a graphics processor 706, and a display 708, i.e. a conventional CRT (cathode ray tube), LCD (liquid crystal display), LED (light emitting diode), plasma display or the like. User input may be received from the input devices 712, e.g., keyboard, mouse, touchpad, microphone, and the like. In one embodiment, the graphics processor 706 may include a plurality of shader modules, a rasterization module, etc. Each of the foregoing modules may even be situated on a single semiconductor platform to form a graphics processing unit (GPU)."}], "lineHeight": 0}}, "target": {"markdown": "[0071] 系统 700 还包括输入设备 712、图形处理器 706 和显示器 708，例如传统的 CRT（阴极射线管）、LCD（液晶显示器）、LED（发光二极管）、等离子显示器等。用户输入可以从输入设备 712 接收，例如键盘、鼠标、触摸板、麦克风等。在一个实施例中，图形处理器 706 可以包括多个着色器模块、光栅化模块等。上述每个模块甚至可以位于单个半导体平台上，以形成图形处理单元（GPU）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "cfceda826eca07e82c0d6639ed68f3eb", "index": 135, "aliyun_index": 12, "page_num": 17, "type": "text", "sub_type": "none", "markdown": "[0072] In the present description, a single semiconductor platform may refer to a sole unitary semiconductor-based integrated circuit or chip. It should be noted that the term single semiconductor platform may also refer to multi-chip modules with increased connectivity which simulate on-chip operation, and make substantial improvements over utilizing a conventional central processing unit (CPU) and bus implementation. Of course, the various modules may also be situated separately or in various combinations of semiconductor platforms per the desires of the user.  \n\n", "text": "[0072] In the present description, a single semiconductor platform may refer to a sole unitary semi
