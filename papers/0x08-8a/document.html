 register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units.  \n\n", "text": "A system, method, and computer program product are provided for implementing a software-based scoreboarding mechanism. The method includes the steps of receiving a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register and, based on a comparison of the immediate value to the value stored in the first register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units.\n", "alignment": "left", "unique_id": "e32cb3a24082dd8e4ab6a73770998b71", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A system, method, and computer program product are provided for implementing a software-based scoreboarding mechanism. The method includes the steps of receiving a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register and, based on a comparison of the immediate value to the value stored in the first register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units."}], "lineHeight": 0}}, "target": {"markdown": "提供了一种用于实现基于软件的记分板机制的系统、方法和计算机程序产品。该方法包括以下步骤：接收一条依赖屏障指令，该指令包含一个立即数和一个对应于第一寄存器的标识符；并基于该立即数与存储在第一寄存器中的值的比较，将一条后续指令分派给两个或更多处理单元中的至少一个第一处理单元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "f71e463efd7d470f0803baac23ec38c3", "index": 15, "aliyun_index": 17, "page_num": 0, "type": "figure", "sub_type": "none", "markdown": "![f71e463efd7d470f0803baac23ec38c3.jpeg](figures/f71e463efd7d470f0803baac23ec38c3_9d0f823e.png)  \n\n", "text": "以下是根据您提供的流程图内容，提取并整理为合法 Markdown 格式的完整步骤描述，保留所有编号、判断逻辑和细节：\n\n---\n\n# 流程图：依赖屏障指令处理流程（100）\n\n## 起始节点\n- **Start**\n\n## 步骤 102：接收依赖屏障指令\n> Receive a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register  \n> （接收一个包含立即值和对应第一寄存器标识符的依赖屏障指令）\n\n↓\n\n## 步骤 104：条件判断\n> Value in the first register <= immediate value?  \n> （第一寄存器中的值 ≤ 立即值？）\n\n### 分支：\n- **No** → 返回至步骤 104 重新判断（循环等待）\n- **Yes** → 进入下一步\n\n↓\n\n## 步骤 106：分发后续指令\n> Dispatch a subsequent instruction from the thread block to a processing unit  \n> （将线程块中的后续指令分发给处理单元）\n\n↓\n\n## 结束节点\n- **End**\n\n---\n\n## 注释说明：\n- 整个流程由外部触发信号 `100` 启动。\n- 步骤 104 是一个轮询/等待机制，直到满足“第一寄存器值 ≤ 立即值”的条件才继续执行。\n- 所有步骤均标注了参考编号（102, 104, 106），便于与原始图示或专利文档对照。\n\n--- \n\n✅ 此 Markdown 格式清晰呈现了流程图的逻辑结构、判断分支、循环行为及各步骤语义，符合技术文档规范。", "alignment": "left", "unique_id": "f71e463efd7d470f0803baac23ec38c3", "edited": false, "extra": {}}, "target": {"markdown": "![f71e463efd7d470f0803baac23ec38c3.jpeg](figures/f71e463efd7d470f0803baac23ec38c3_9d0f823e.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "6a3f42f732bbdbf6d7180cfb6c9a7f84", "index": 16, "aliyun_index": 3, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![6a3f42f732bbdbf6d7180cfb6c9a7f84.jpeg](figures/6a3f42f732bbdbf6d7180cfb6c9a7f84_dc722d2f.png)  \n\n", "text": "以下是根据您提供的流程图内容，提取并整理为合法 Markdown 格式的完整步骤描述，保留所有编号、判断逻辑和细节：\n\n---\n\n# 流程图：依赖屏障指令处理流程（参考编号 100）\n\n## 起始节点\n- **Start**\n\n## 步骤 102：接收依赖屏障指令\n> Receive a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register  \n> （接收一条包含立即值和对应第一寄存器标识符的依赖屏障指令）\n\n## 步骤 104：条件判断\n> Value in the first register <= immediate value?  \n> （第一寄存器中的值 ≤ 立即值？）\n\n### 分支逻辑：\n- **No** → 返回步骤 104 重新判断（循环等待）\n- **Yes** → 进入下一步骤 106\n\n## 步骤 1 - 位于左上角\n- 与 `Host Interface Unit 210` 双向连接\n- 接收来自 `System Bus 202` 的输入（单向箭头指向 I/O Unit）\n\n### 2. Host Interface Unit 210\n- 与 `I/O Unit 205` 双向连接\n- 向下连接至 `Task Management Unit 215`（单向箭头）\n- 接收来自 `Crossbar 260` 的反馈连接（单向箭头从 Crossbar 指向 Host Interface Unit）\n\n### 3. Task Management Unit 215\n- 接收来自 `Host Interface Unit 210` 的输入\n- 向下连接至 `Work Distribution Unit 220`（单向箭头）\n\n### 4. Work Distribution Unit 220\n- 接收来自 `Task Management Unit 215` 的输入\n- 向下连接至 `SM 250(X)`（单向箭头）\n\n### 5. SM 250(X) —— Streaming Multiprocessor(s)\n- 标注为 `(X)` 表示可扩展或多个实例\n- 下方有虚线框包围，暗示可能为多单元或可配置组\n- 向上接收来自 `Work Distribution Unit 220` 的任务分发\n- 向下连接至 `Crossbar 260`（单向箭头）\n\n### 6. Crossbar 260\n- 接收来自 `SM 250(X)` 的数据/请求\n- 与 `L2 Cache 265` 双向连接\n- 向 `Host Interface Unit 210` 提供反馈路径（单向箭头）\n\n### 7. L2 Cache 265\n- 与 `Crossbar 260` 双向连接\n- 与 `Memory Interface 280(U)` 双向连接\n\n### 8. Memory Interface 280(U)\n- 标注为 `(U)` 表示可支持多个内存通道或用户定义配置\n- 下方有虚线框包围，暗示可扩展性或多实例\n- 与 `L2 Cache 265` 双向连接\n- 向下连接至 `Memory 204(U)`（单向箭头）\n\n---\n\n## 外部存储\n\n### Memory 204(U)\n- 标注为 `(U)` 表示可配置或多个内存单元\n- 下方有虚线框包围，暗示可扩展或多实例\n- 接收来自 `Memory Interface 280(U)` 的数据写入/读取请求（单向箭头）\n\n---\n\n## 连接说明总结\n\n| 源组件                  | 目标组件                | 连接类型       |\n|-------------------------|--------------------------|----------------|\n| System Bus 202          | I/O Unit 205             | 单向（输入）   |\n| I/O Unit 205            | Host Interface Unit 210  | 双向           |\n| Host Interface Unit 210 | Task Management Unit 215 | 单向           |\n| Task Management Unit 215| Work Distribution Unit 220 | 单向         |\n| Work Distribution Unit 220 | SM 250(X)              | 单向           |\n| SM 250(X)               | Crossbar 260             | 单向           |\n| Crossbar 260            | L2 Cache 265             | 双向           |\n| L2 Cache 265            | Memory Interface 280(U)  | 双向           |\n| Memory Interface 280(U) | Memory 204(U)            | 单向           |\n| Crossbar 260            | Host Interface Unit 210  | 单向（反馈）   |\n\n> 注：`(X)` 和 `(U)` 后缀通常表示该模块支持并行化、可扩展或多实例部署。\n\n---\n\n此 Markdown 文档完整还原了原始图中的所有元素、编号、流向和层级关系，适用于技术文档、专利分析或系统架构描述场景。", "alignment": "left", "unique_id": "f825508d4933a30ed0ade56eaaf1d443", "edited": false, "extra": {}}, "target": {"markdown": "![f825508d4933a30ed0ade56eaaf1d443.jpeg](figures/f825508d4933a30ed0ade56eaaf1d443_75bfd009.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "59895e6c5376f51708da88766adf6eab", "index": 19, "aliyun_index": 2, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 2  \n\n", "text": "Fig. 2\n", "alignment": "left", "unique_id": "59895e6c5376f51708da88766adf6eab", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 2"}], "lineHeight": 0}}, "target": {"markdown": ">图 2", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "2a69e6a6be6fc76dfc2fa124a440f15a", "index": 20, "aliyun_index": 3, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![2a69e6a6be6fc76dfc2fa124a440f15a.jpeg](figures/2a69e6a6be6fc76dfc2fa124a440f15a_e8505dcc.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理后的合法 Markdown 格式文档，准确保留所有组件名称、编号、层级关系和连接方向：\n\n---\n\n# SM 250 架构图\n\n## 顶层组件\n\n- **Instruction Cache 305**\n  - 与下方 `Scheduler Unit 310(K)` 双向通信（↑↓）\n\n## 调度层\n\n- **Scheduler Unit 310(K)**\n  - 包含两个子单元：\n    - `Dispatch 315`\n    - `Dispatch 315`\n  - 通过虚线框表示可扩展或多个实例\n  - 与上方 `Instruction Cache 305` 双向通信\n  - 与下方 `Register File 320` 单向通信（↓）\n\n## 寄存器文件\n\n- **Register File 320**\n  - 与上方 `Scheduler Unit 310(K)` 单向接收数据（↓）\n  - 与下方四个处理单元双向通信（↑↓）：\n    - ELD OF THE INVENTION\n", "alignment": "left", "unique_id": "ca2d0856025aa52e0a38bb6331424cd8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "FIELD OF THE INVENTION"}], "lineHeight": 0}}, "target": {"markdown": "## 本发明的领域\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "f44af68c38101d031d477003d5b28823", "index": 46, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0001] The present invention relates to processor architectures, and more particularly to mechanisms to handle register dependencies.  \n\n", "text": "[0001] The present invention relates to processor architectures, and more particularly to mechanisms to handle register dependencies.\n", "alignment": "left", "unique_id": "f44af68c38101d031d477003d5b28823", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0001] The present invention relates to processor architectures, and more particularly to mechanisms to handle register dependencies."}], "lineHeight": 0}}, "target": {"markdown": "本发明涉及处理器架构，更具体地，涉及用于处理寄存器相关性的机制。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "50f4588402a1a889e8c386490cdb9569", "index": 47, "aliyun_index": 6, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## BACKGROUND\n", "text": "BACKGROUND\n", "alignment": "left", "unique_id": "50f4588402a1a889e8c386490cdb9569", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "BACKGROUND"}], "lineHeight": 0}}, "target": {"markdown": "## 背景\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "a5be0e95ea82a954c266703a165827c2", "index": 48, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0002] Processors are designed to execute instructions and store results in registers, the results possibly being utilized as operands for subsequent instructions. Parallel processing architectures such as today's graphics processing units (GPUs) include a large number of parallel execution units configured to execute a large number of threads in parallel. The GPUs may also implement pipelined execution units that enable multiple, long-latency operations to be in flight at the same time. Many processors execute instructions in-order relative to the order of the instructions defined by the program. However, some processors allow for out-of-order execution of instructions. Due to the possibility that some instructions may depend on previously executed instructions and that strict ordering of instruction execution may not be adhered to by the processor, processors may be required to implement some form of scheduling mechanism to ensure that register dependencies are managed properly. Thus, there is a need for addressing this issue and/or other issues associated with the prior art.  \n\n", "text": "[0002] Processors are designed to execute instructions and store results in registers, the results possibly being utilized as operands for subsequent instructions. Parallel processing architectures such as today's graphics processing units (GPUs) include a large number of parallel execution units configured to execute a large number of threads in parallel. The GPUs may also implement pipelined execution units that enable multiple, long-latency operations to be in flight at the same time. Many processors execute instructions in-order relative to the order of the instructions defined by the program. However, some processors allow for out-of-order execution of instructions. Due to the possibility that some instructions may depend on previously executed instructions and that strict ordering of instruction execution may not be adhered to by the processor, processors may be required to implement some form of scheduling mechanism to ensure that register dependencies are managed properly. Thus, there is a need for addressing this issue and/or other issues associated with the prior art.\n", "alignment": "left", "unique_id": "a5be0e95ea82a954c266703a165827c2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0002] Processors are designed to execute instructions and store results in registers, the results possibly being utilized as operands for subsequent instructions. Parallel processing architectures such as today's graphics processing units (GPUs) include a large number of parallel execution units configured to execute a large number of threads in parallel. The GPUs may also implement pipelined execution units that enable multiple, long-latency operations to be in flight at the same time. Many processors execute instructions in-order relative to the order of the instructions defined by the program. However, some processors allow for out-of-order execution of instructions. Due to the possibility that some instructions may depend on previously executed instructions and that strict ordering of instruction execution may not be adhered to by the processor, processors may be required to implement some form of scheduling mechanism to ensure that register dependencies are managed properly. Thus, there is a need for addressing this issue and/or other issues associated with the prior art."}], "lineHeight": 0}}, "target": {"markdown": "[0002] 处理器被设计用于执行指令并将结果存储在寄存器中，这些结果可能被后续指令用作操作数。当前的图形处理单元（GPU）等并行处理架构包含大量并行执行单元，这些单元被配置为并行执行大量线程。GPU 还可以实现流水线化的执行单元，从而能够同时处理多个长延迟操作。许多处理器按照程序所定义的指令顺序按序执行指令。然而，某些处理器允许乱序执行指令。由于某些指令可能依赖于先前执行的指令，并且处理器可能不严格遵守指令执行的顺序，因此处理器可能需要实现某种调度机制，以确保寄存器相关性得到正确管理。因此，需要解决该问题和/或与现有技术相关的其他问题。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "0d4033975b67e4123396fa190067e49c", "index": 49, "aliyun_index": 8, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## SUMMARY\n", "text": "SUMMARY\n", "alignment": "left", "unique_id": "0d4033975b67e4123396fa190067e49c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SUMMARY"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "f32ede20e38d44d96943989fb7ef630f", "index": 50, "aliyun_index": 9, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0003] A system, method, and computer program product are provided for implementing a software-based scoreboarding mechanism. The method includes the steps of receiving a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register and, based on a comparison of the immediate value to the value stored in the first register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units.  \n\n", "text": "[0003] A system, method, and computer program product are provided for implementing a software-based scoreboarding mechanism. The method includes the steps of receiving a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register and, based on a comparison of the immediate value to the value stored in the first register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units.\n", "alignment": "left", "unique_id": "f32ede20e38d44d96943989fb7ef630f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0003] A system, method, and computer program product are provided for implementing a software-based scoreboarding mechanism. The method includes the steps of receiving a dependency barrier instruction that includes an immediate value and an identifier corresponding to a first register and, based on a comparison of the immediate value to the value stored in the first register, dispatching a subsequent instruction to at least a first processing unit of two or more processing units."}], "lineHeight": 0}}, "target": {"markdown": "[0003] 提供了一种用于实现基于软件的记分牌机制的系统、方法和计算机程序产品。该方法包括以下步骤：接收一个依赖屏障指令，其中包含一个立即数和一个与第一寄存器相对应的标识符；并基于该立即数与第一寄存器中存储的值的比较，将后续指令分派给两个或多个处理单元中的至少一个第一处理单元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "48ec3b3e10ab96a66f417a6e2796a787", "index": 51, "aliyun_index": 10, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## BRIEF DESCRIPTION OF THE DRAWINGS\n", "text": "BRIEF DESCRIPTION OF THE DRAWINGS\n", "alignment": "left", "unique_id": "48ec3b3e10ab96a66f417a6e2796a787", "edited": false, "extra": {"firs ype": "none", "markdown": "[0012] FIG. 7 illustrates an exemplary system in which the various architecture and/or functionality of the various previous embodiments may be implemented.  \n\n", "text": "[0012] FIG. 7 illustrates an exemplary system in which the various architecture and/or functionality of the various previous embodiments may be implemented.\n", "alignment": "left", "unique_id": "6c0051b13183580e6017c62c0bf64967", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0012] FIG. 7 illustrates an exemplary system in which the various architecture and/or functionality of the various previous embodiments may be implemented."}], "lineHeight": 0}}, "target": {"markdown": "[0012] 图 7 示出了用于实现前述各种实施例的各种架构和/或功能的示例性系统。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "44eb9afc9b259070a4e61a7b6ccf8640", "index": 61, "aliyun_index": 20, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## DETAILED DESCRIPTION\n", "text": "DETAILED DESCRIPTION\n", "alignment": "left", "unique_id": "44eb9afc9b259070a4e61a7b6ccf8640", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DETAILED DESCRIPTION"}], "lineHeight": 0}}, "target": {"markdown": "## 详细说明\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "eefe076ef53cc7b17658e1f6c26e775c", "index": 62, "aliyun_index": 21, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0013] Conventional processing units execute a series of instructions in-order. The order in which the instructions are executed matches the order of the instructions in the program. More recently, some processing units enable out-of-order execution, where some instructions are executed in a different order than the order of the instructions in the program. To enable the management of dependencies between instructions, various techniques may be implemented in the architecture of the processing unit.  \n\n", "text": "[0013] Conventional processing units execute a series of instructions in-order. The order in which the instructions are executed matches the order of the instructions in the program. More recently, some processing units enable out-of-order execution, where some instructions are executed in a different order than the order of the instructions in the program. To enable the management of dependencies between instructions, various techniques may be implemented in the architecture of the processing unit.\n", "alignment": "left", "unique_id": "eefe076ef53cc7b17658e1f6c26e775c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0013] Conventional processing units execute a series of instructions in-order. The order in which the instructions are executed matches the order of the instructions in the program. More recently, some processing units enable out-of-order execution, where some instructions are executed in a different order than the order of the instructions in the program. To enable the management of dependencies between instructions, various techniques may be implemented in the architecture of the processing unit."}], "lineHeight": 0}}, "target": {"markdown": "[0013] 传统的处理单元按序执行一系列指令。指令的执行顺序与程序中指令的顺序相匹配。最近，一些处理单元支持乱序执行，其中某些指令的执行顺序与程序中指令的顺序不同。为了能够管理指令之间的依赖关系，可以在处理单元的架构中实现各种技术。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "bd8e96b03f9a4b8c31ca7056cb03c8b5", "index": 63, "aliyun_index": 22, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0014] One such technique is to utilize a scoreboarding mechanism. One way to implement a scoreboarding mechanism is to increment a counter in response to a specific event and decrement the counter in response to a related event. The value of the counter can then be analyzed to indicate what events have occurred at a particular point in time. For example, a counter may be incremented when an instruction is dispatched and decremented when a result for the instruction has been written to a destination register. Consequently, an instruction that depends on the result of a previously issued instruction can be delayed until the counter reaches zero to ensure that the result is available during execution. Prior art techniques implement scoreboarding automatically within the hardware. In other words, the software does not control operation of the scoreboarding hardware. However, such techniques may be expensive in terms of circuit complexity, layout footprint, and power consumption. A software-based approach to scoreboarding is described more fully below.  \n\n", "text": "[0014] One such technique is to utilize a scoreboarding mechanism. One way to implement a scoreboarding mechanism is to increment a counter in response to a specific event and decrement the counter in response to a related event. The value of the counter can then be analyzed to indicate what events have occurred at a particular point in time. For example, a counter may be incremented when an instruction is dispatched and decremented when a result for the instruction has been written to a destination register. Consequently, an instruction that depends on the result of a previously issued instruction can be delayed until the counter reaches zero to ensure that the result is available during execution. Prior art techniques implement scoreboarding automatically within the hardware. In other words, the software does not control operation of the scoreboarding hardware. However, such techniques may be expensive in terms of circuit complexity, layout footprint, and power consumption. A software-based approach to scoreboarding is described more fully below.\n", "alignment": "left", "unique_id": "bd8e96b03f9a4b8c31ca7056cb03c8b5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0014] One such technique is to utilize a scoreboarding mechanism. One way to implement a scoreboarding mechanism is to increment a counter in response to a specific event and decrement the counter in response to a related event. The value of the counter can then be analyzed to indicate what events have occurred at a particular point in time. For example, a counter may be incremented when an instruction is dispatched and decremented when a result for the instruction has been written to a destination register. Consequently, an instruction that depends on the result of a previously issued instruction can be delayed until the counter reaches zero to ensure that the result is available during execution. Prior art techniques implement scoreboarding automatically within the hardware. In other words, the software does not control operation of the scoreboarding hardware. However, such techniques may be expensive in terms of circuit complexity, layout footprint, and power consumption. A software-based approach to scoreboarding is described more fully below."}], "lineHeight": 0}}, "target": {"markdown": "[0014] 一种这样的技术是利用记分牌机制。实现记分牌机制的一种方式是响应于特定事件对计数器进行递增，并响应于相关事件对计数器进行递减。然后可以分析计数器的值以指示在特定时间点发生了哪些事件。例如，当指令被分派时计数器递增，当指令的结果被写入目标寄存器时计数器递减。因此，依赖于先前发出的指令的结果的指令可以被延迟，直到计数器达到零，以确保结果在执行期间可用。现有技术的方法在硬件内自动实现记分牌。换句话说，软件不控制记分牌硬件的操作。然而，这些技术在电路复杂性、布局占用面积和功耗方面可能成本较高。基于软件的记分牌方法将在下文中更详细地描述。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "a4f2677cbd6a6063ec082ef731cbf106", "index": 64, "aliyun_index": 23, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "[0015] FIG. 1 illustrates a flowchart of a method 100 for implementing a software-based scoreboarding mechanism, according to one embodiment. At step 102, a dependency barrier instruction is received. The dependency barrier instruction includes an immediate value and an identifier corresponding to a first register. In one embodiment, the first register may be a special scoreboard register of a plurality of scoreboard registers implemented by a scheduler unit. Each of the scoreboard registers may implement a counter (e.g., a 6-bit counter that stores a value between 0 and 63). At step 104, a value stored in the first register is compared to the immediate value. In one embodiment, the comparison comprises a test that determines whether the value in the first register is less than or equal to the immediate value. If the test fails, then the dispatch of a subsequent instruction in the thread is stalled by the scheduler unit. However, if the test passes, then the subsequent instruction may be dispatched to a processing unit. In another embodiment, the comparison may utilize an operator different than the less than or equal to operator to perform the comparison. For example, the test may pass only if the value in the first register is equal to the immediate value, only if the value in the first register is greater than the immediate value, and so forth. At step 106, the scheduler unit dispatches the subsequent instruction to at least a first processing unit of two or more processing units.  \n\n", "text": "[0015] FIG. 1 illustrates a flowchart of a method 100 for implementing a software-based scoreboarding mechanism, according to one embodiment. At step 102, a dependency barrier instruction is received. The dependency barrier instruction includes an immediate value and an identifier corresponding to a first register. In one embodiment, the first register may be a special scoreboard register of a plurality of scoreboard registers implemented by a scheduler unit. Each of the scoreboard registers may implement a counter (e.g., a 6-bit counter that stores a value between 0 and 63). At step 104, a value stored in the first register is compared to the immediate value. In one embodiment, the comparison comprises a test that determines whether the value in the first register is less than or equal to the immediate value. If the test fails, then the dispatch of a subsequent instruction in the thread is stalled by the scheduler unit. However, if the test passes, then the subsequent instruction may be dispatched to a processing unit. In another embodiment, the comparison may utilize an operator different than the less than or equal to operator to perform the comparison. For example, the test may pass only if the value in the first register is equal to the immediate value, only if the value in the first register is greater than the immediate value, and so forth. At step 106, the scheduler unit dispatches the subsequent instruction to at least a first processing unit of two or more processing units.\n", "alignment": "left", "unique_id": "a4f2677cbd6a6063ec082ef731cbf106", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0015] FIG. 1 illustrates a flowchart of a method 100 for implementing a software-based scoreboarding mechanism, according to one embodiment. At step 102, a dependency barrier instruction is received. The dependency barrier instruction includes an immediate value and an identifier corresponding to a first register. In one embodiment, the first register may be a special scoreboard register of a plurality of scoreboard registers implemented by a scheduler unit. Each of the scoreboard registers may implement a counter (e.g., a 6-bit counter that stores a value between 0 and 63). At step 104, a value stored in the first register is compared to the immediate value. In one embodiment, the comparison comprises a test that determines whether the value in the first register is less than or equal to the immediate value. If the test fails, then the dispatch of a subsequent instruction in the thread is stalled by the scheduler unit. However, if the test passes, then the subsequent instruction may be dispatched to a processing unit. In another embodiment, the comparison may utilize an operator different than the less than or equal to operator to perform the comparison. For example, the test may pass only if the value in the first register is equal to the immediate value, only if the value in the first register is greater than the immediate value, and so forth. At step 106, the scheduler unit dispatches the subsequent instruction to at least a first processing unit of two or more processing units."}], "lineHeight": 0}}, "target": {"markdown": "[0015] 图 1 示出了根据一个实施例的用于实现基于软件的记分牌机制的方法 100 的流程图。在步骤 102 中，接收一条依赖屏障指令。该依赖屏障指令包括一个立即数和一个与第一寄存器对应的标识符。在一个实施例中，该第一寄存器可以是由调度单元实现的多个记分牌寄存器中的特殊记分牌寄存器。每个记分牌寄存器可以实现一个计数器（例如，一个存储 0 到 63 之间值的 6 位计数器）。在步骤 104 中，将存储在第一寄存器中的值与该立即数进行比较。在一个实施例中，该比较包括一个测试，用于确定第一寄存器中的值是否小于或等于该立即数。如果测试失败，则线程中后续指令的分派将被调度单元暂停。然而，如果测试通过，则该后续指令可以被分派给处理单元。在另一实施例中，该比较可以使用不同于\"小于或等于\"运算符的运算符来执行比较。例如，只有当第一寄存器中的值等于该立即数时，或者只有当第一寄存器中的值大于该立即数时，测试才可以通过，依此类推。在步骤 106 中，调度单元将该后续指令分派给两个或更多处理单元中的至少一个第一处理单元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "7cfe4 erfaces.\n", "alignment": "left", "unique_id": "2caef008f0f254201de60fbd3d02e070", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0017] FIG. 2 illustrates a parallel processing unit (PPU) 200, according to one embodiment. While a parallel processor is provided herein as an example of the PPU 200, it should be strongly noted that such processor is set forth for illustrative purposes only, and any processor may be employed to supplement and/or substitute for the same. In one embodiment, the PPU 200 is configured to execute a plurality of threads concurrently in two or more streaming multi-processors (SMs) 250. A thread (i.e., a thread of execution) is an instantiation of a set of instructions executing within a particular SM 250. Each SM 250, described below in more detail in conjunction with FIG. 3, may include, but is not limited to, one or more processing cores, one or more load/store units (LSUs), a level-one (L1) cache, shared memory, and the like. [0018] In one embodiment, the PPU 200 includes an input/output (I/O) unit 205 configured to transmit and receive communications (i.e., commands, data, etc.) from a central processing unit (CPU) (not shown) over the system bus 202. The I/O unit 205 may implement a Peripheral Component Interconnect Express (PCIe) interface for communications over a PCIe bus. In alternative embodiments, the I/O unit 205 may implement other types of well-known bus interfaces."}], "lineHeight": 0}}, "target": {"markdown": "[0017] 图 2 示出了根据一个实施例的并行处理单元（PPU）200。虽然本文以并行处理器作为 PPU 200 的示例提供，但应强烈注意的是，此类处理器仅为示例性目的而提出，任何处理器都可用于补充和/或替代之。在一个实施例中，PPU 200 被配置为在两个或更多流式多处理器（SM）250 中并发执行多个线程。线程（即执行线程）是在特定 SM 250 内执行的一组指令的实例。每个 SM 250（下面结合图 3 更详细描述）可以包括但不限于一个或多个处理核心、一个或多个加载/存储单元（LSU）、一级（L1）缓存、共享内存等。[0018] 在一个实施例中，PPU 200 包括输入/输出（I/O）单元 205，其被配置为通过系统总线 202 与中央处理单元（CPU）（未示出）传输和接收通信（即命令、数据等）。I/O 单元 205 可以实现用于通过 PCIe 总线进行通信的外围组件互连高速（PCIe）接口。在替代实施例中，I/O 单元 205 可以实现其他类型的众所周知的总线接口。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "e715d3c9846bc769cd896ee097750364", "index": 68, "aliyun_index": 5, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0019] The PPU 200 also includes a host interface unit 210 that decodes the commands and transmits the commands to the task management unit 215 or other units of the PPU 200 (e.g., memory interface 280) as the commands may specify. The host interface unit 210 is configured to route communications between and among the various logical units of the PPU 200.  \n\n", "text": "[0019] The PPU 200 also includes a host interface unit 210 that decodes the commands and transmits the commands to the task management unit 215 or other units of the PPU 200 (e.g., memory interface 280) as the commands may specify. The host interface unit 210 is configured to route communications between and among the various logical units of the PPU 200.\n", "alignment": "left", "unique_id": "e715d3c9846bc769cd896ee097750364", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0019] The PPU 200 also includes a host interface unit 210 that decodes the commands and transmits the commands to the task management unit 215 or other units of the PPU 200 (e.g., memory interface 280) as the commands may specify. The host interface unit 210 is configured to route communications between and among the various logical units of the PPU 200."}], "lineHeight": 0}}, "target": {"markdown": "[0019] PPU 200 还包括主机接口单元 210，其对命令进行解码并根据命令的指定将命令传送到任务管理单元 215 或 PPU 200 的其他单元（例如，存储器接口 280）。主机接口单元 210 被配置为在 PPU 200 的各个逻辑单元之间路由通信。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "58fde9ecb9a5253febdb8c6901d6a948", "index": 69, "aliyun_index": 6, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0020] In one embodiment, a program encoded as a command stream is written to a buffer by the CPU. The buffer is a region in memory, e.g., memory 204 or system memory, that is accessible (i.e., read/write) by both the CPU and the PPU 200. The CPU writes the command stream to the buffer and then transmits a pointer to the start of the command stream to the PPU 200. The host interface unit 210 provides the task management unit (TMU) 215 with pointers to one or more streams. The TMU 215 selects one or more streams and is configured to organize the selected streams as a pool of pending grids. The pool of pending grids may include new grids that have not yet been selected for execution and grids that have been partially executed and have been suspended.  \n\n", "text": "[0020] In one embodiment, a program encoded as a command stream is written to a buffer by the CPU. The buffer is a region in memory, e.g., memory 204 or system memory, that is accessible (i.e., read/write) by both the CPU and the PPU 200. The CPU writes the command stream to the buffer and then transmits a pointer to the start of the command stream to the PPU 200. The host interface unit 210 provides the task management unit (TMU) 215 with pointers to one or more streams. The TMU 215 selects one or more streams and is configured to organize the selected streams as a pool of pending grids. The pool of pending grids may include new grids that have not yet been selected for execution and grids that have been partially executed and have been suspended.\n", "alignment": "left", "unique_id": "58fde9ecb9a5253febdb8c6901d6a948", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0020] In one embodiment, a program encoded as a command stream is written to a buffer by the CPU. The buffer is a region in memory, e.g., memory 204 or system memory, that is accessible (i.e., read/write) by both the CPU and the PPU 200. The CPU writes the command stream to the buffer and then transmits a pointer to the start of the command stream to the PPU 200. The host interface unit 210 provides the task management unit (TMU) 215 with pointers to one or more streams. The TMU 215 selects one or more streams and is configured to organize the selected streams as a pool of pending grids. The pool of pending grids may include new grids that have not yet been selected for execution and grids that have been partially executed and have been suspended."}], "lineHeight": 0}}, "target": {"markdown": "[0020] 在一个实施例中，被编码为命令流的程序由 CPU 写入缓冲区。该缓冲区是存储器（例如存储器 204 或系统存储器）中的一个区域，可被 CPU 和 PPU 200 访问（即读/写）。CPU 将命令流写入该缓冲区，然后将指向命令流起始处的指针发送到 PPU 200。主机接口单元 210 向任务管理单元（TMU）215 提供一个或多个流的指针。TMU 215 选择一个或多个流，并被配置为将所选流组织为待处理网格池。该待处理网格池可以包括尚未被选择执行的新网格以及已被部分执行并已被挂起的网格。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "e790967d56a2ec92145634156513730f", "index": 70, "aliyun_index": 7, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0021] A work distribution unit 220 that is coupled between the TMU 215 and the SMs 250 manages a pool of active grids, selecting and dispatching active grids for execution by the SMs 250. Pending grids are transferred to the active grid pool by the TMU 215 when a pending grid is eligible to execute, i.e., has no unresolved data dependencies. An active grid is transferred to the pending pool when execution of the active grid is blocked by a dependency. When execution of a grid is completed, the grid is removed from the active grid pool by the work distribution unit 220. In addition to receiving grids from the host interface unit 210 and the work distribution unit 220, the TMU 215 also receives grids that are dynamically generated by the SMs 250 during execution of a grid. These dynamically generated grids join the other pending grids in the pending grid pool.  \n\n", "text": "[0021] A work distribution unit 220 that is coupled between the TMU 215 and the SMs 250 manages a pool of active grids, selecting and dispatching active grids for execution by the SMs 250. Pending grids are transferred to the active grid pool by the TMU 215 when a pending grid is eligible to execute, i.e., has no unresolved data dependencies. An active grid is transferred to the pending pool when execution of the active grid is blocked by a dependency. When execution of a grid is completed, the grid is removed from the active grid pool by the work distribution unit 220. In addition to receiving grids from the host interface unit 210 and the work distribution unit 220, the TMU 215 also receives grids that are dynamically generated by the SMs 250 during execution of a grid. These dynamically generated grids join the other pending grids in the pending grid pool.\n", "alignment": "left", "unique_id": "e790967d56a2ec92145634156513730f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0021] A work distribution unit 220 that is coupled between the TMU 215 and the SMs 250 manages a pool of active grids, selecting and dispatching active grids for execution by the SMs 250. Pending grids are transferred to the active grid pool by the TMU 215 when a pending grid is eligible to execute, i.e., has no unresolved data dependencies. An active grid is transferred to the pending pool when execution of the active grid is blocked by a dependency. When execution of a grid is completed, the grid is removed from the active grid pool by the work distribution unit 220. In addition to receiving grids from the host interface unit 210 and the work distribution unit 220, the TMU 215 also receives grids that are dynamically generated by the SMs 250 during execution of a grid. These dynamically generated grids join the other pending grids in the pending grid pool."}], "lineHeight": 0}}, "target": {"markdown": "[0021] 耦合在 TMU 215 和 SM 250 之间的工作分配单元 220 管理活动网格池，并选择和分派活动网格以供 SM 250 执行。当待处理网格符合执行条件（即没有未解决的数据依赖关系）时，TMU 215 将待处理网格转移到活动网格池。当活动网格的执行被依赖关系阻塞时，该活动网格被转移到待处理池。当网格的执行完成时，工作分配单元 220 将该网格从活动网格池中移除。除了从主机接口单元 210 和工作分配单元 220 接收网格之外，TMU 215 还接收由 SM 250 在网格执行期间动态生成的网格。这些动态生成的网格被加入到待处理网格池中的其他待处理网格之中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "41ef36818f15f02fbafe6cda8815957b", "index": 71, "aliyun_index": 8, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0022] In one embodiment, the CPU executes a driver kernel that implements an application programming interface (API) that enables one or more applications executing on the CPU to schedule operations for execution on the PPU 200. An  \n\n", "text": "[0022] In one embodiment, the CPU executes a driver kernel that implements an application programming interface (API) that enables one or more applications executing on the CPU to schedule operations for execution on the PPU 200. An\n", "alignment": "left", "unique_id": "41ef36818f15f02fbafe6cda8815957b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0022] In one embodiment, the CPU executes a driver kernel that implements an application programming interface (API) that enables one or more applications executing on the CPU to schedule operations for execution on the PPU 200. An"}], "lineHeight": 0}}, "target": {"markdown": "[0022] 在一个实施例中，CPU 执行一个驱动内核，该驱动内核实现一个应用程序编程接口（API），该 API 使在 CPU 上执行的一个或多个应用程序能够调度在 PPU 200 上执行的操作。一", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "d8b09190f5745a535cb32b4f8110cdc5", "index": 72, "aliyun_index": 9, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "application may include instructions (i.e., API calls) that cause the driver kernel to generate one or more grids for execution. In one embodiment, the PPU 200 implements a SIMD (Single-Instruction, Multiple-Data) architecture where each thread block (i.e., warp) in a grid is concurrently executed on a different data set by different threads in the thread block. The driver kernel defines thread blocks that are comprised of k related threads, such that threads in the same thread block may exchange data through shared memory. In one embodiment, a thread block comprises 32 related threads and a grid is an array of one or more thread blocks that execute the same stream and the different thread blocks may exchange data through global memory.  \n\n", "text": "application may include instructions (i.e., API calls) that cause the driver kernel to generate one or more grids for execution. In one embodiment, the PPU 200 implements a SIMD (Single-Instruction, Multiple-Data) architecture where each thread block (i.e., warp) in a grid is concurrently executed on a different data set by different threads in the thread block. The driver kernel defines thread blocks that are comprised of k related threads, such that threads in the same thread block may exchange data through shared memory. In one embodiment, a thread block comprises 32 related threads and a grid is an array of one or more thread blocks that execute the same stream and the different thread blocks may exchange data through global memory.\n", "alignment": "left", "unique_id": "d8b09190f5745a535cb32b4f8110cdc5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "application may include instructions (i.e., API calls) that cause the driver kernel to generate one or more grids for execution. In one embodiment, the PPU 200 implements a SIMD (Single-Instruction, Multiple-Data) architecture where each thread block (i.e., warp) in a grid is concurrently executed on a different data set by different threads in the thread block. The driver kernel defines thread blocks that are comprised of k related threads, such that threads in the same thread block may exchange data through shared memory. In one embodiment, a thread block comprises 32 related threads and a grid is an array of one or more thread blocks that execute the same stream and the different thread blocks may exchange data through global memory."}], "lineHeight": 0}}, "target": {"markdown": "应用程序可以包括指令（即 API 调用），这些指令使驱动内核生成一个或多个网格用于执行。在一个实施例中，PPU 200 实现了 SIMD（单指令多数据）架构，其中网格中的每个线程块（即 warp）由线程块中不同的线程在不同的数据集上并发执行。驱动内核定义由 k 个相关线程组成的线程块，使得同一线程块中的线程可以通过共享内存交换数据。在一个实施例中，一个线程块包括 32 个相关线程，并且网格是一个或多个线程块的数组，这些线程块执行同一流，并且不同的线程块可以通过全局内存交换数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "19442a98f6427002629dc316c87a45fd", "index": 73, "aliyun_index": 10, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0023] In one embodiment, the PPU 200 comprises X SMs 250(X). For example, the PPU 200 may include 15 distinct SMs 250. Each SM 250 is multi-threaded and configured to execute a plurality of threads (e.g., 32 threads) from a particular thread block concurrently. Each of the SMs 250 is connected to a level-two (L2) cache 265 via a crossbar 260 (or other type of interconnect network). The I.2 cache 265 is connected to one or more memory interfaces 280. Memory interfaces 280 implement 16, 32, 64, 128-bit data buses, or the like, for high-speed data transfer. In one embodiment, the PPU 200 comprises U memory interfaces 280(U), where each memory interface 280(U) is connected to a corresponding memory device 204(U). For example, PPU 200 may be connected to up to 6 memory devices 204, such as graphics double-data-rate, version 5, synchronous dynamic random access memory (GDDR5 SDRAM).  \n\n", "text": "[0023] In one embodiment, the PPU 200 comprises X SMs 250(X). For example, the PPU 200 may include 15 distinct SMs 250. Each SM 250 is multi-threaded and configured to execute a plurality of threads (e.g., 32 threads) from a particular thread block concurrently. Each of the SMs 250 is connected to a level-two (L2) cache 265 via a crossbar 260 (or other type of interconnect network). The I.2 cache 265 is connected to one or more memory interfaces 280. Memory interfaces 280 implement 16, 32, 64, 128-bit data buses, or the like, for high-speed data transfer. In one embodiment, the PPU 200 comprises U memory interfaces 280(U), where each memory interface 280(U) is connected to a corresponding memory device 204(U). For example, PPU 200 may be connected to up to 6 memory devices 204, such as graphics double-data-rate, version 5, synchronous dynamic random access memory (GDDR5 SDRAM).\n", "alignment": "left", "unique_id": "19442a98f6427002629dc316c87a45fd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0023] In one embodiment, the PPU 200 comprises X SMs 250(X). For example, the PPU 200 may include 15 distinct SMs 250. Each SM 250 is multi-threaded and configured to execute a plurality of threads (e.g., 32 threads) from a particular thread block concurrently. Each of the SMs 250 is connected to a level-two (L2) cache 265 via a crossbar 260 (or other type of interconnect network). The I.2 cache 265 is connected to one or more memory interfaces 280. Memory interfaces 280 implement 16, 32, 64, 128-bit data buses, or the like, for high-speed data transfer. In one embodiment, the PPU 200 comprises U memory interfaces 280(U), where each memory interface 280(U) is connected to a corresponding memory device 204(U). For example, PPU 200 may be connected to up to 6 memory devices 204, such as graphics double-data-rate, version 5, synchronous dynamic random access memory (GDDR5 SDRAM)."}], "lineHeight": 0}}, "target": {"markdown": "[0023] 在一个实施例中，PPU 200 包含 X 个 SM 250(X)。例如，PPU 200 可以包括 15 个不同的 SM 250。每个 SM 250 是多线程的，并被配置为并发执行来自特定线程块的多个线程（例如，32 个线程）。每个 SM 250 通过交叉开关 260（或其他类型的互连网络）连接到二级（L2）缓存 265。L2 缓存 265 连接到一个或多个存储器接口 280。存储器接口 280 实现 16、32、64、128 位数据总线或类似总线，以实现高速数据传输。在一个实施例中，PPU 200 包含 U 个存储器接口 280(U)，其中每个存储器接口 280(U) 连接到相应的存储器设备 204(U)。例如，PPU 200 可以连接到多达 6 个存储器设备 204，例如图形双倍数据速率版本 5 同步动态随机存取存储器（GDDR5 SDRAM）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "ce187147b90300dbd6120c1e4a9f4737", "index": 74, "aliyun_index": 11, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0024] In one embodiment, the PPU 200 implements a multi-level memory hierarchy. The memory 204 is located off-chip in SDRAM coupled to the PPU 200. Data from the memory 204 may be fetched and stored in the L2 cache 265, which is located on-chip and is shared between the various SMs 250. In one embodiment, each of the SMs 250 also implements an L1 cache. The L1 cache is private memory that is dedicated to a particular SM 250. Each of the L1 caches is coupled to the shared L2 cache 265. Data from the L2 cache 265 may be fetched and stored in each of the L1 caches for processing in the functional units of the SMs 250.  \n\n", "text": "[0024] In one embodiment, the PPU 200 implements a multi-level memory hierarchy. The memory 204 is located off-chip in SDRAM coupled to the PPU 200. Data from the memory 204 may be fetched and stored in the L2 cache 265, which is located on-chip and is shared between the various SMs 250. In one embodiment, each of the SMs 250 also implements an L1 cache. The L1 cache is private memory that is dedicated to a particular SM 250. Each of the L1 caches is coupled to the shared L2 cache 265. Data from the L2 cache 265 may be fetched and stored in each of the L1 caches for processing in the functional units of the SMs 250.\n", "alignment": "left", "unique_id": "ce187147b90300dbd6120c1e4a9f4737", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0024] In one embodiment, the PPU 200 implements a multi-level memory hierarchy. The memory 204 is located off-chip in SDRAM coupled to the PPU 200. Data from the memory 204 may be fetched and stored in the L2 cache 265, which is located on-chip and is shared between the various SMs 250. In one embodiment, each of the SMs 250 also implements an L1 cache. The L1 cache is private memory that is dedicated to a particular SM 250. Each of the L1 caches is coupled to the shared L2 cache 265. Data from the L2 cache 265 may be fetched and stored in each of the L1 caches for processing in the functional units of the SMs 250."}], "lineHeight": 0}}, "target": {"markdown": "[0024] 在一个实施例中，PPU 200 实现多级存储器层次结构。存储器 204 位于芯片外的 SDRAM 中，并耦合到 PPU 200。来自存储器 204 的数据可以被取出并存储在位于芯片上并在各个 SM 250 之间共享的 L2 缓存 265 中。在一个实施例中，每个 SM 250 还实现一个 L1 缓存。L1 缓存是专用于特定 SM 250 的私有存储器。每个 L1 缓存都耦合到共享的 L2 缓存 265。来自 L2 缓存 265 的数据可以被取出并存储在每个 L1 缓存中，以便在 SM 250 的功能单元中进行处理。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "42a33a34d46278e7aea4a7543d9e40c0", "index": 75, "aliyun_index": 12, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0025] In one embodiment, the PPU 200 comprises a graphics processing unit (GPU). The PPU 200 is configured to receive commands that specify shader programs for processing graphics data. Graphics data may be defined as a set of primitives such as points, lines, triangles, quads, triangle strips, and the like. Typically, a primitive includes data that specifies a number of vertices for the primitive (e.g., in a model-space coordinate system) as well as attributes associated with each vertex of the primitive. The PPU 200 can be configured to process the graphics primitives to generate a frame buffer (i.e., pixel data for each of the pixels of the display). The driver kernel implements a graphics processing pipeline, such as the graphics processing pipeline defined by the OpenGL API.  \n\n", "text": "[0025] In one embodiment, the PPU 200 comprises a graphics processing unit (GPU). The PPU 200 is configured to receive commands that specify shader programs for processing graphics data. Graphics data may be defined as a set of primitives such as points, lines, triangles, quads, triangle strips, and the like. Typically, a primitive includes data that specifies a number of vertices for the primitive (e.g., in a model-space coordinate system) as well as attributes associated with each vertex of the primitive. The PPU 200 can be configured to process the graphics primitives to generate a frame buffer (i.e., pixel data for each of the pixels of the display). The driver kernel implements a graphics processing pipeline, such as the graphics processing pipeline defined by the OpenGL API.\n", "alignment": "left", "unique_id": "42a33a34d46278e7aea4a7543d9e40c0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0025] In one embodiment, the PPU 200 comprises a graphics processing unit (GPU). The PPU 200 is configured to receive commands that specify shader programs for processing graphics data. Graphics data may be defined as a set of primitives such as points, lines, triangles, quads, triangle strips, and the like. Typically, a primitive includes data that specifies a number of vertices for the primitive (e.g., in a model-space coordinate system) as well as attributes associated with each vertex of the primitive. The PPU 200 can be configured to process the graphics primitives to generate a frame buffer (i.e., pixel data for each of the pixels of the display). The driver kernel implements a graphics processing pipeline, such as the graphics processing pipeline defined by the OpenGL API."}], "lineHeight": 0}}, "target": {"markdown": "[0025] 在一个实施例中，PPU 200 包括图形处理单元（GPU）。PPU 200 被配置为接收指定用于处理图形数据的着色器程序的命令。图形数据可以定义为一组基元，例如点、线、三角形、四边形、三角带等。通常，基元包括指定基元顶点数量的数据（例如，在模型空间坐标系中）以及与基元的每个顶点相关联的属性。PPU 200 可被配置为处理图形基元以生成帧缓冲区（即显示器每个像素的像素数据）。驱动内核实现图形处理流水线，例如由 OpenGL API 定义的图形处理流水线。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "ccd01499d05ca1a6ff592c933e32e4a2", "index": 76, "aliyun_index": 13, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[0026] An application writes model data for a scene (i.e., a collection of vertices and attributes) to memory. The model data defines each of the objects that may be visible on a display. The application then makes an API call to the driver kernel that requests the model data to be rendered and displayed. The driver kernel reads the model data and writes commands to the buffer to perform one or more operations to process the model data. The commands may encode different shader programs including one or more of a vertex shader, hull shader, geometry shader, pixel shader, etc. For example,  \n\n", "text": "[0026] An application writes model data for a scene (i.e., a collection of vertices and attributes) to memory. The model data defines each of the objects that may be visible on a display. The application then makes an API call to the driver kernel that requests the model data to be rendered and displayed. The driver kernel reads the model data and writes commands to the buffer to perform one or more operations to process the model data. The commands may encode different shader programs including one or more of a vertex shader, hull shader, geometry shader, pixel shader, etc. For example,\n", "alignment": "left", "unique_id": "ccd01499d05ca1a6ff592c933e32e4a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0026] An application writes model data for a scene (i.e., a collection of vertices and attributes) to memory. The model data defines each of the objects that may be visible on a display. The application then makes an API call to the driver kernel that requests the model data to be rendered and displayed. The driver kernel reads the model data and writes commands to the buffer to perform one or more operations to process the model data. The commands may encode different shader programs including one or more of a vertex shader, hull shader, geometry shader, pixel shader, etc. For example,"}], "lineHeight": 0}}, "target": {"markdown": "[0026] 应用程序将场景的模型数据（即顶点和属性的集合）写入存储器。该模型数据定义了可在显示器上可见的每个对象。然后应用程序向驱动内核发出 API 调用，请求对模型数据进行渲染和显示。驱动内核读取模型数据并将命令写入缓冲区，以执行一个或多个操作来处理该模型数据。这些命令可以编码不同的着色器程序，包括顶点着色器、外壳着色器、几何着色器、像素着色器等中的一个或多个。例如，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "d51e054ab0002a9db89d977506db4e7e", "index": 77, "aliyun_index": 3, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "the TMU 215 may configure one or more SMs 250 to execute a vertex shader program that processes a number of vertices defined by the model data. In one embodiment, the TMU 215 may configure different SMs 250 to execute different shader programs concurrently. For example, a first subset of SMs 250 may be configured to execute a vertex shader program while a second subset of SMs 250 may be configured to execute a pixel shader program. The first subset of SMs 250 processes vertex data to produce processed vertex data and writes the processed vertex data to the L2 cache 265 and/or the memory 204. After the processed vertex data is rasterized (i.e., transformed from three-dimensional data into two-dimensional data in screen space) to produce fragment data, the second subset of SMs 250 executes a pixel shader to produce processed fragment data, which is then blended with other processed fragment data and written to the frame buffer in memory 204. The vertex shader program and pixel shader program may execute concurrently, processing different data from the same scene in a pipelined fashion until all of the model data for the scene has been rendered to the frame buffer. Then, the contents of the frame buffer are transmitted to a display controller for display on a display device.  \n\n", "text": "the TMU 215 may configure one or more SMs 250 to execute a vertex shader program that processes a number of vertices defined by the model data. In one embodiment, the TMU 215 may configure different SMs 250 to execute different shader programs concurrently. For example, a first subset of SMs 250 may be configured to execute a vertex shader program while a second subset of SMs 250 may be configured to execute a pixel shader program. The first subset of SMs 250 processes vertex data to produce processed vertex data and writes the processed vertex data to the L2 cache 265 and/or the memory 204. After the processed vertex data is rasterized (i.e., transformed from three-dimensional data into two-dimensional data in screen space) to produce fragment data, the second subset of SMs 250 executes a pixel shader to produce processed fragment data, which is then blended with other processed fragment data and written to the frame buffer in memory 204. The vertex shader program and pixel shader program may execute concurrently, processing different data from the same scene in a pipelined fashion until all of the model data for the scene has been rendered to the frame buffer. Then, the contents of the frame buffer are transmitted to a display controller for display on a display device.\n", "alignment": "left", "unique_id": "d51e054ab0002a9db89d977506db4e7e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the TMU 215 may configure one or more SMs 250 to execute a vertex shader program that processes a number of vertices defined by the model data. In one embodiment, the TMU 215 may configure different SMs 250 to execute different shader programs concurrently. For example, a first subset of SMs 250 may be configured to execute a vertex shader program while a second subset of SMs 250 may be configured to execute a pixel shader program. The first subset of SMs 250 processes vertex data to produce processed vertex data and writes the processed vertex data to the L2 cache 265 and/or the memory 204. After the processed vertex data is rasterized (i.e., transformed from three-dimensional data into two-dimensional data in screen space) to produce fragment data, the second subset of SMs 250 executes a pixel shader to produce processed fragment data, which is then blended with other processed fragment data and written to the frame buffer in memory 204. The vertex shader program and pixel shader program may execute concurrently, processing different data from the same scene in a pipelined fashion until all of the model data for the scene has been rendered to the frame buffer. Then, the contents of the frame buffer are transmitted to a display controller for display on a display device."}], "lineHeight": 0}}, "target": {"markdown": "[0027] TMU 215 可以配置一个或多个 SM 250 来执行顶点着色器程序，该程序处理由模型数据定义的多个顶点。在一个实施例中，TMU 215 可以配置不同的 SM 250 以并发执行不同的着色器程序。例如，第一子集 SM 250 可以被配置为执行顶点着色器程序，而第二子集 SM 250 可以被配置为执行像素着色器程序。第一子集 SM 250 处理顶点数据以产生处理后的顶点数据，并将处理后的顶点数据写入 L2 缓存 265 和/或存储器 204。在处理后的顶点数据被光栅化（即，从三维数据转换为屏幕空间中的二维数据）以产生片元数据之后，第二子集 SM 250 执行像素着色器以产生处理后的片元数据，然后将其与其他处理后的片元数据混合并写入存储器 204 中的帧缓冲区。顶点着色器程序和像素着色器程序可以并发执行，以流水线方式处理来自同一场景的不同数据，直到场景的所有模型数据都已渲染到帧缓冲区为止。然后，帧缓冲区的内容被传送到显示控制器，以在显示设备上进行显示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "14d87304ec8993cb35eda274e87693a1", "index": 78, "aliyun_index": 4, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0027] ^ The PPU 200 may be included in a desktop computer, a laptop computer, a tablet computer, a smart-phone (e.g., a wireless, hand-held device), personal digital assistant (PDA), a digital camera, a hand-held electronic device, and the like. In one embodiment, the PPU 200 is embodied on a single semiconductor substrate. In another embodiment, the PPU 200 is included in a system-on-a-chip (SoC) along with one or more other logic units such as a reduced instruction set computer (RISC) CPU, a memory management unit (MMU), a digital-to-analog converter (DAC), and the like.  \n\n", "text": "[0027] ^ The PPU 200 may be included in a desktop computer, a laptop computer, a tablet computer, a smart-phone (
