udes one or more memory devices 204 such as GDDR5 SDRAM. The graphics card may be configured to interface with a PCIe slot on a motherboard of a desktop computer that includes, e.g., a northbridge chipset and a southbridge chipset. In yet another embodiment, the PPU 200 may be an integrated graphics processing unit (iGPU) included in the chipset (i.e., Northbridge) of the motherboard.  \n\n", "text": "[0028] In one embodiment, the PPU 200 may be included on a graphics card that includes one or more memory devices 204 such as GDDR5 SDRAM. The graphics card may be configured to interface with a PCIe slot on a motherboard of a desktop computer that includes, e.g., a northbridge chipset and a southbridge chipset. In yet another embodiment, the PPU 200 may be an integrated graphics processing unit (iGPU) included in the chipset (i.e., Northbridge) of the motherboard.\n", "alignment": "left", "unique_id": "341dbf28b2dfd5645ec4cd508826101b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0028] In one embodiment, the PPU 200 may be included on a graphics card that includes one or more memory devices 204 such as GDDR5 SDRAM. The graphics card may be configured to interface with a PCIe slot on a motherboard of a desktop computer that includes, e.g., a northbridge chipset and a southbridge chipset. In yet another embodiment, the PPU 200 may be an integrated graphics processing unit (iGPU) included in the chipset (i.e., Northbridge) of the motherboard."}], "lineHeight": 0}}, "target": {"markdown": "[0028] 在一个实施例中，PPU 200 可以被包括在一块图形卡上，该图形卡包括一个或多个存储器设备 204，例如 GDDR5 SDRAM。该图形卡可以被配置为与台式计算机主板上的 PCIe 插槽相接口，该台式计算机例如包括北桥芯片组和南桥芯片组。在再一实施例中，PPU 200 可以是被包括在主板芯片组（即北桥）中的集成图形处理单元（iGPU）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "2ac8d2e0eb95162b99f55a2f167dd34e", "index": 80, "aliyun_index": 6, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0029] FIG. 3 illustrates the streaming multi-processor 250 of FIG. 2, according to one embodiment. As shown in FIG. 3, the SM 250 includes an instruction cache 305, one or more scheduler units 310, a register file 320, one or more processing cores 350, one or more double precision units (DPUs) 351, one or more special function units (SFUs) 352, one or more load/store units (LSUs) 353, an interconnect network 380, a shared memory/L1 cache 370, and one or more texture units 390.  \n\n", "text": "[0029] FIG. 3 illustrates the streaming multi-processor 250 of FIG. 2, according to one embodiment. As shown in FIG. 3, the SM 250 includes an instruction cache 305, one or more scheduler units 310, a register file 320, one or more processing cores 350, one or more double precision units (DPUs) 351, one or more special function units (SFUs) 352, one or more load/store units (LSUs) 353, an interconnect network 380, a shared memory/L1 cache 370, and one or more texture units 390.\n", "alignment": "left", "unique_id": "2ac8d2e0eb95162b99f55a2f167dd34e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0029] FIG. 3 illustrates the streaming multi-processor 250 of FIG. 2, according to one embodiment. As shown in FIG. 3, the SM 250 includes an instruction cache 305, one or more scheduler units 310, a register file 320, one or more processing cores 350, one or more double precision units (DPUs) 351, one or more special function units (SFUs) 352, one or more load/store units (LSUs) 353, an interconnect network 380, a shared memory/L1 cache 370, and one or more texture units 390."}], "lineHeight": 0}}, "target": {"markdown": "[0029] 图 3 示出了根据一个实施例的图 2 的流多处理器 250。如图 3 所示，SM 250 包括指令缓存 305、一个或多个调度器单元 310、寄存器文件 320、一个或多个处理核心 350、一个或多个双精度单元（DPU）351、一个或多个特殊功能单元（SFU）352、一个或多个加载/存储单元（LSU）353、互连网络 380、共享存储器/L1 缓存 370，以及一个或多个纹理单元 390。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "654cd803eea8612b30b8df23a247900b", "index": 81, "aliyun_index": 7, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0030] As described above, the work distribution unit 220 dispatches active grids for execution on one or more SMs 250 of the PPU 200. The scheduler unit 310 receives the grids from the work distribution unit 220 and manages instruction scheduling for one or more thread blocks of each active grid. The scheduler unit 310 schedules threads for execution in groups of parallel threads, where each group is called a warp. In one embodiment, each warp includes 32 threads. The scheduler unit 310 may manage a plurality of different thread blocks, allocating the thread blocks to warps for execution and then scheduling instructions from the plurality of different warps on the various functional units (i.e., cores 350, DPU 351, SFUs 352, and LSU 353) during each clock cycle.  \n\n", "text": "[0030] As described above, the work distribution unit 220 dispatches active grids for execution on one or more SMs 250 of the PPU 200. The scheduler unit 310 receives the grids from the work distribution unit 220 and manages instruction scheduling for one or more thread blocks of each active grid. The scheduler unit 310 schedules threads for execution in groups of parallel threads, where each group is called a warp. In one embodiment, each warp includes 32 threads. The scheduler unit 310 may manage a plurality of different thread blocks, allocating the thread blocks to warps for execution and then scheduling instructions from the plurality of different warps on the various functional units (i.e., cores 350, DPU 351, SFUs 352, and LSU 353) during each clock cycle.\n", "alignment": "left", "unique_id": "654cd803eea8612b30b8df23a247900b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0030] As described above, the work distribution unit 220 dispatches active grids for execution on one or more SMs 250 of the PPU 200. The scheduler unit 310 receives the grids from the work distribution unit 220 and manages instruction scheduling for one or more thread blocks of each active grid. The scheduler unit 310 schedules threads for execution in groups of parallel threads, where each group is called a warp. In one embodiment, each warp includes 32 threads. The scheduler unit 310 may manage a plurality of different thread blocks, allocating the thread blocks to warps for execution and then scheduling instructions from the plurality of different warps on the various functional units (i.e., cores 350, DPU 351, SFUs 352, and LSU 353) during each clock cycle."}], "lineHeight": 0}}, "target": {"markdown": "[0030] 如上所述，工作分配单元 220 分派活动网格在 PPU 200 的一个或多个 SM 250 上执行。调度器单元 310 从工作分配单元 220 接收网格，并为每个活动网格的一个或多个线程块管理指令调度。调度器单元 310 以并行线程组的形式调度线程执行，其中每个组称为一个 warp。在一个实施例中，每个 warp 包括 32 个线程。调度器单元 310 可以管理多个不同的线程块，将线程块分配给 warp 以供执行，然后在每个时钟周期期间在各个功能单元（即核心 350、DPU 351、SFU 352 和 LSU 353）上调度来自多个不同 warp 的指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "558fe4526aeb0a13428dc92e003c3756", "index": 82, "aliyun_index": 8, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0031] In one embodiment, each scheduler unit 310 includes one or more instruction dispatch units 315. Each dispatch unit 315 is configured to transmit instructions to one or more of the functional units. In the embodiment shown in FIG. 3, the scheduler unit 310 includes two dispatch units 315 that enable two different instructions from the same warp to be dispatched during each clock cycle. In alternative embodiments, each scheduler unit 310 may include a single dispatch unit 315 or additional dispatch units 315.  \n\n", "text": "[0031] In one embodiment, each scheduler unit 310 includes one or more instruction dispatch units 315. Each dispatch unit 315 is configured to transmit instructions to one or more of the functional units. In the embodiment shown in FIG. 3, the scheduler unit 310 includes two dispatch units 315 that enable two different instructions from the same warp to be dispatched during each clock cycle. In alternative embodiments, each scheduler unit 310 may include a single dispatch unit 315 or additional dispatch units 315.\n", "alignment": "left", "unique_id": "558fe4526aeb0a13428dc92e003c3756", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0031] In one embodiment, each scheduler unit 310 includes one or more instruction dispatch units 315. Each dispatch unit 315 is configured to transmit instructions to one or more of the functional units. In the embodiment shown in FIG. 3, the scheduler unit 310 includes two dispatch units 315 that enable two different instructions from the same warp to be dispatched during each clock cycle. In alternative embodiments, each scheduler unit 310 may include a single dispatch unit 315 or additional dispatch units 315."}], "lineHeight": 0}}, "target": {"markdown": "[0031] 在一个实施例中，每个调度器单元 310 包括一个或多个指令分派单元 315。每个分派单元 315 被配置为将指令传输到一个或多个功能单元。在图 3 所示的实施例中，调度器单元 310 包括两个分派单元 315，其使得来自同一 warp 的两个不同指令能够在每个时钟周期被分派。在替代实施例中，每个调度器单元 310 可以包括单个分派单元 315 或附加的分派单元 315。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "b17feb7f3e019f2a4ea3666d2e83c8a3", "index": 83, "aliyun_index": 9, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0032] Each SM 250 includes a register file 320 that provides a set of registers for the functional units of the SM 250. In one embodiment, the register file 320 is divided between each of the functional units such that each functional unit is allocated a dedicated portion of the register file 320. In another embodiment, the register file 320 is divided between the different warps being executed by the SM 250. The register file 320 provides temporary storage for operands connected to the data paths of the functional units.  \n\n", "text": "[0032] Each SM 250 includes a register file 320 that provides a set of registers for the functional units of the SM 250. In one embodiment, the register file 320 is divided between each of the functional units such that each functional unit is allocated a dedicated portion of the register file 320. In another embodiment, the register file 320 is divided between the different warps being executed by the SM 250. The register file 320 provides temporary storage for operands connected to the data paths of the functional units.\n", "alignment": "left", "unique_id": "b17feb7f3e019f2a4ea3666d2e83c8a3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0032] Each SM 250 includes a register file 320 that provides a set of registers for the functional units of the SM 250. In one embodiment, the register file 320 is divided between each of the functional units such that each functional unit is allocated a dedicated portion of the register file 320. In another embodiment, the register file 320 is divided between the different warps being executed by the SM 250. The register file 320 provides temporary storage for operands connected to the data paths of the functional units."}], "lineHeight": 0}}, "target": {"markdown": "[0032] 每个 SM 250 包括一个寄存器文件 320，该寄存器文件 320 为 SM 250 的功能单元提供一组寄存器。在一个实施例中，寄存器文件 320 在每个功能单元之间划分，使得每个功能单元被分配寄存器文件 320 的专用部分。在另一个实施例中，寄存器文件 320 在由 SM 250 执行的不同的 warp 之间划分。寄存器文件 320 为连接到功能单元数据路径的操作数提供临时存储。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "3f955ce275684fbc0a9abdcf2b8fea4a", "index": 84, "aliyun_index": 10, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0033] Each SM 250 comprises L processing cores 350. In one embodiment, the SM 250 includes a large number (e.g., 192, etc.) of distinct processing cores 350. Each core 350 is a fully-pipelined, single-precision processing unit that includes a floating point arithmetic logic unit and an integer arithmetic logic unit. In one embodiment, the floating point arithmetic logic units implement the IEEE 754-2008 standard for floating point arithmetic. Each SM 250 also comprises M DPUUs 351 that implement double-precision floating point arithmetic, N SFUs 352 that perform special functions (e.g., copy rectangle, pixel blending operations, and the like), and P LSUs 353 that implement load and store operations between the shared memory/L1 cache 370 and the register file 320. In one embodiment, the SM 250 includes 64 DPUUs 351, 32 SFUs 352, and 32 LSUs 353.  \n\n", "text": "[0033] Each SM 250 comprises L processing cores 350. In one embodiment, the SM 250 includes a large number (e.g., 192, etc.) of distinct processing cores 350. Each core 350 is a fully-pipelined, single-precision processing unit that includes a floating point arithmetic logic unit and an integer arithmetic logic unit. In one embodiment, the floating point arithmetic logic units implement the IEEE 754-2008 standard for floating point arithmetic. Each SM 250 also comprises M DPUUs 351 that implement double-precision floating point arithmetic, N SFUs 352 that perform special functions (e.g., copy rectangle, pixel blending operations, and the like), and P LSUs 353 that implement load and store operations between the shared memory/L1 cache 370 and the register file 320. In one embodiment, the SM 250 includes 64 DPUUs 351, 32 SFUs 352, and 32 LSUs 353.\n", "alignment": "left", "unique_id": "3f955ce275684fbc0a9abdcf2b8fea4a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0033] Each SM 250 comprises L processing cores 350. In one embodiment, the SM 250 includes a large number (e.g., 192, etc.) of distinct processing cores 350. Each core 350 is a fully-pipelined, single-precision processing unit that includes a floating point arithmetic logic unit and an integer arithmetic logic unit. In one embodiment, the floating point arithmetic logic units implement the IEEE 754-2008 standard for floating point arithmetic. Each SM 250 also comprises M DPUUs 351 that implement double-precision floating point arithmetic, N SFUs 352 that perform special functions (e.g., copy rectangle, pixel blending operations, and the like), and P LSUs 353 that implement load and store operations between the shared memory/L1 cache 370 and the register file 320. In one embodiment, the SM 250 includes 64 DPUUs 351, 32 SFUs 352, and 32 LSUs 353."}], "lineHeight": 0}}, "target": {"markdown": "[0033] 每个 SM 250 包括 L 个处理核心 350。在一个实施例中，SM 250 包括大量（例如 192 个等）不同的处理核心 350。每个核心 350 是一个完全流水线的单精度处理单元，包括浮点算术逻辑单元和整数算术逻辑单元。在一个实施例中，浮点算术逻辑单元实现 IEEE 754-2008 浮点运算标准。每个 SM 250 还包括 M 个实现双精度浮点运算的 DPUU 351、N 个执行特殊功能（例如复制矩形、像素混合操作等）的 SFU 352，以及 P 个实现共享存储器/L1 缓存 370 与寄存器文件 320 之间加载和存储操作的 LSU 353。在一个实施例中，SM 250 包括 64 个 DPUU 351、32 个 SFU 352 和 32 个 LSU 353。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "f64ac32d23706589f433c867dee205d4", "index": 85, "aliyun_index": 11, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0034] Each SM 250 includes an interconnect network 380 that connects each of the functional units to the register file 320 and the shared memory/L1 cache 370. In one embodiment, the interconnect network 380 is a crossbar that can be configured to connect any of the functional units to any of the registers in the register file 320 or the memory locations in shared memory/L1 cache 370.  \n\n", "text": "[0034] Each SM 250 includes an interconnect network 380 that connects each of the functional units to the register file 320 and the shared memory/L1 cache 370. In one embodiment, the interconnect network 380 is a crossbar that can be configured to connect any of the functional units to any of the registers in the register file 320 or the memory locations in shared memory/L1 cache 370.\n", "alignment": "left", "unique_id": "f64ac32d23706589f433c867dee205d4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0034] Each SM 250 includes an interconnect network 380 that connects each of the functional units to the register file 320 and the shared memory/L1 cache 370. In one embodiment, the interconnect network 380 is a crossbar that can be configured to connect any of the functional units to any of the registers in the register file 320 or the memory locations in shared memory/L1 cache 370."}], "lineHeight": 0}}, "target": {"markdown": "[0034] 每个 SM 250 包括一个互连网络 380，该互连网络 380 将每个功能单元连接到寄存器文件 320 和共享存储器/L1 缓存 370。在一个实施例中，互连网络 380 是一个交叉开关，其可被配置为将任何功能单元连接到寄存器文件 320 中的任何寄存器或共享存储器/L1 缓存 370 中的任何存储器位置。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "9d2f68d51bbefcce434345e0e81cf3f9", "index": 86, "aliyun_index": 12, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0035] In one embodiment, the SM 250 is implemented within a GPU. In such an embodiment, the SM 250 comprises J texture units 390. The texture units 390 are configured to load texture maps (i.e., a 2D array of texels) from the memory 204 and sample the texture maps to produce sampled texture values for use in shader programs. The texture units 390 implement texture operations such as anti-aliasing operations using mip-maps (i.e., texture maps of varying levels of detail). In one embodiment, the SM 250 includes 16 texture units 390.  \n\n", "text": "[0035] In one embodiment, the SM 250 is implemented within a GPU. In such an embodiment, the SM 250 comprises J texture units 390. The texture units 390 are configured to load texture maps (i.e., a 2D array of texels) from the memory 204 and sample the texture maps to produce sampled texture values for use in shader programs. The texture units 390 implement texture operations such as anti-aliasing operations using mip-maps (i.e., texture maps of varying levels of detail). In one embodiment, the SM 250 includes 16 texture units 390.\n", "alignment": "left", "unique_id": "9d2f68d51bbefcce434345e0e81cf3f9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0035] In one embodiment, the SM 250 is implemented within a GPU. In such an embodiment, the SM 250 comprises J texture units 390. The texture units 390 are configured to load texture maps (i.e., a 2D array of texels) from the memory 204 and sample the texture maps to produce sampled texture values for use in shader programs. The texture units 390 implement texture operations such as anti-aliasing operations using mip-maps (i.e., texture maps of varying levels of detail). In one embodiment, the SM 250 includes 16 texture units 390."}], "lineHeight": 0}}, "target": {"markdown": "[0035] 在一个实施例中，SM 250 在 GPU 内实现。在这样的实施例中，SM 250 包括 J 个纹理单元 390。纹理单元 390 被配置为从存储器 204 加载纹理映射（即二维的纹素数组）并对纹理映射进行采样以产生用于着色器程序的采样纹理值。纹理单元 390 实现纹理操作，例如使用 mip-map（即不同细节层次的纹理映射）实现的抗锯齿操作。在一个实施例中，SM 250 包括 16 个纹理单元 390。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "78c660c9959e1fc7fa20586ea6f0a99d", "index": 87, "aliyun_index": 13, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0036] The PPU 200 described above may be configured to perform highly parallel computations much faster than conventional CPUs. Parallel computing has advantages in graphics processing, data compression, biometrics, stream processing algorithms, and the like.  \n\n", "text": "[0036] The PPU 200 described above may be configured to perform highly parallel computations much faster than conventional CPUs. Parallel computing has advantages in graphics processing, data compression, biometrics, stream processing algorithms, and the like.\n", "alignment": "left", "unique_id": "78c660c9959e1fc7fa20586ea6f0a99d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0036] The PPU 200 described above may be configured to perform highly parallel computations much faster than conventional CPUs. Parallel computing has advantages in graphics processing, data compression, biometrics, stream processing algorithms, and the like."}], "lineHeight": 0}}, "target": {"markdown": "[0036] 上述 PPU 200 可以被配置为执行高度并行的计算，其速度远快于传统 CPU。并行计算在图形处理、数据压缩、生物识别、流处理算法等方面具有优势。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 87}, {"source": {"block_id": "107043e9f5be03013c06e7cac8486106", "index": 88, "aliyun_index": 14, "page_num": 12, "type": "text", "sub_type": "none", "markdown": "[0037] FIG. 4 illustrates an implementation of a score-boarding mechanism, in accordance with one embodiment. As shown in FIG. 4, the SM 250 includes a scheduler unit 310 that implements a number of scoreboard registers 410. Each scoreboard register 410 includes a plurality of bits that encode a value (e.g., an unsigned integer). In one embodiment, a scoreboard register 410 includes 6 bits for encoding a value between 0 and 63. In other embodiments, the scoreboard register 410 may include any number of bits. In addition, the register file 320 may be divided into a number of lanes, each  \n\n", "text": "[0037] FIG. 4 illustrates an implementation of a score-boarding mechanism, in accordance with one embodiment. As shown in FIG. 4, the SM 250 includes a scheduler unit 310 that implements a number of scoreboard registers 410. Each scoreboard register 410 includes a plurality of bits that encode a value (e.g., an unsigned integer). In one embodiment, a scoreboard register 410 includes 6 bits for encoding a value between 0 and 63. In other embodiments, the scoreboard register 410 may include any number of bits. In addition, the register file 320 may be divided into a number of lanes, each\n", "alignment": "left", "unique_id": "107043e9f5be03013c06e7cac8486106", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0037] FIG. 4 illustrates an implementation of a score-boarding mechanism, in accordance with one embodiment. As shown in FIG. 4, the SM 250 includes a scheduler unit 310 that implements a number of scoreboard registers 410. Each scoreboard register 410 includes a plurality of bits that encode a value (e.g., an unsigned integer). In one embodiment, a scoreboard register 410 includes 6 bits for encoding a value between 0 and 63. In other embodiments, the scoreboard register 410 may include any number of bits. In addition, the register file 320 may be divided into a number of lanes, each"}], "lineHeight": 0}}, "target": {"markdown": "[0037] 图 4 示出了根据一个实施例的记分板（score-boarding）机制的实现方式。如图 4 所示，SM 250 包括一个调度器单元 310，该调度器单元 310 实现多个记分板寄存器 410。每个记分板寄存器 410 包含多个位，这些位编码一个值（例如无符号整数）。在一个实施例中，记分板寄存器 410 包含 6 位，用于编码 0 到 63 之间的值。在其他实施例中，记分板寄存器 410 可以包含任何数量的位。此外，寄存器文件 320 可以被划分为多个通道（lane），每个", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "4e458d6caad56543e3d7daaf28c72c5e", "index": 89, "aliyun_index": 3, "page_num": 13, "type": "text", "sub_type": "none", "markdown": "lane including a plurality of registers 420 allocated to a particular thread executed by the SM 250. In one embodiment, each thread is allocated 256 registers 420. For example, for a particular warp, the register file 320 may include 8096 registers allocated to 32 threads that are executed in parallel.  \n\n", "text": "lane including a plurality of registers 420 allocated to a particular thread executed by the SM 250. In one embodiment, each thread is allocated 256 registers 420. For example, for a particular warp, the register file 320 may include 8096 registers allocated to 32 threads that are executed in parallel.\n", "alignment": "left", "unique_id": "4e458d6caad56543e3d7daaf28c72c5e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "lane including a plurality of registers 420 allocated to a particular thread executed by the SM 250. In one embodiment, each thread is allocated 256 registers 420. For example, for a particular warp, the register file 320 may include 8096 registers allocated to 32 threads that are executed in parallel."}], "lineHeight": 0}}, "target": {"markdown": "lane 包含分配给由 SM 250 执行的特定线程的多个寄存器 420。在一个实施例中，每个线程被分配 256 个寄存器 420。例如，对于特定的 warp，寄存器文件 320 可以包括 8096 个寄存器，这些寄存器被分配给以并行方式执行的 32 个线程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "e63db946684f2a378fd2336ab9d271b1", "index": 90, "aliyun_index": 4, "page_num": 13, "type": "text", "sub_type": "none", "markdown": "[0038] As also shown in FIG. 4, each SM 250 includes a number N of pipelined execution units 450. The pipelined execution units 450 may include the cores 350, the DPU's 351, the SFU 352, or the LSU's 353 as well as any other type of execution unit, coupled or decoupled. In the context of the present disclosure, a decoupled pipeline is any execution unit that can execute instructions out-of-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register an unknown number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In contrast, a coupled pipeline is any execution unit that executes instructions in-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register a known number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In one embodiment, a decoupled pipeline may include a FIFO that temporarily stores dispatched instructions for a number of clock cycles until the corresponding pipelined execution unit 450 is available to execute the instructions. The pipelined execution units 450 are coupled to a read crossbar 451 and a write crossbar 452, which are part of the interconnect network 380. Although not shown explicitly, each of the pipelined execution units 450 may be coupled to a plurality of collectors for storing operands as input to the datapath for the pipelined execution unit 450.  \n\n", "text": "[0038] As also shown in FIG. 4, each SM 250 includes a number N of pipelined execution units 450. The pipelined execution units 450 may include the cores 350, the DPU's 351, the SFU 352, or the LSU's 353 as well as any other type of execution unit, coupled or decoupled. In the context of the present disclosure, a decoupled pipeline is any execution unit that can execute instructions out-of-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register an unknown number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In contrast, a coupled pipeline is any execution unit that executes instructions in-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register a known number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In one embodiment, a decoupled pipeline may include a FIFO that temporarily stores dispatched instructions for a number of clock cycles until the corresponding pipelined execution unit 450 is available to execute the instructions. The pipelined execution units 450 are coupled to a read crossbar 451 and a write crossbar 452, which are part of the interconnect network 380. Although not shown explicitly, each of the pipelined execution units 450 may be coupled to a plurality of collectors for storing operands as input to the datapath for the pipelined execution unit 450.\n", "alignment": "left", "unique_id": "e63db946684f2a378fd2336ab9d271b1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0038] As also shown in FIG. 4, each SM 250 includes a number N of pipelined execution units 450. The pipelined execution units 450 may include the cores 350, the DPU's 351, the SFU 352, or the LSU's 353 as well as any other type of execution unit, coupled or decoupled. In the context of the present disclosure, a decoupled pipeline is any execution unit that can execute instructions out-of-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register an unknown number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In contrast, a coupled pipeline is any execution unit that executes instructions in-order, thereby exhibiting a behavior where a result of an instruction dispatched to the execution pipeline will be written to the destination register a known number of clock cycles after the instruction has been dispatched by the scheduler unit 310. In one embodiment, a decoupled pipeline may include a FIFO that temporarily stores dispatched instructions for a number of clock cycles until the corresponding pipelined execution unit 450 is available to execute the instructions. The pipelined execution units 450 are coupled to a read crossbar 451 and a write crossbar 452, which are part of the interconnect network 380. Although not shown explicitly, each of the pipelined execution units 450 may be coupled to a plurality of collectors for storing operands as input to the datapath for the pipelined execution unit 450."}], "lineHeight": 0}}, "target": {"markdown": "[0038] 如图 4 所示，每个 SM 250 包括 N 个流水线执行单元 450。流水线执行单元 450 可以包括核心 350、DPU 351、SFU 352 或 LSU 353 以及任何其他类型的执行单元，无论是耦合的还是解耦的。在本公开的上下文中，解耦流水线是任何能够乱序执行指令的执行单元，从而表现出以下行为：被分派到执行流水线的指令的结果将在调度器单元 310 分派该指令后经过未知数量的时钟周期写入目标寄存器。相反，耦合流水线是任何按序执行指令的执行单元，从而表现出以下行为：被分派到执行流水线的指令的结果将在调度器单元 310 分派该指令后经过已知数量的时钟周期写入目标寄存器。在一个实施例中，解耦流水线可以包括一个 FIFO（先进先出队列），用于在多个时钟周期内临时存储已分派的指令，直到相应的流水线执行单元 450 可用于执行这些指令。流水线执行单元 450 耦合到读交叉开关 451 和写交叉开关 452，它们是互连网络 380 的一部分。虽然没有明确示出，但每个流水线执行单元 450 可以耦合到多个收集器，用于存储作为流水线执行单元 450 数据通路输入的操作数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 90}, {"source": {"block_id": "490fb6be2d81b064491e0b7648544754", "index": 91, "aliyun_index": 5, "page_num": 13, "type": "text", "sub_type": "none", "markdown": "[0039] In one embodiment, a scoreboard register 410 may be utilized to ensure register dependencies are managed properly by the scheduling unit 310. A particular scoreboard register 410 may be utilized for a particular type of instruction. For example, a scoreboard register 410 may be utilized for each texture instruction of a thread. Each time a texture instruction is dispatched to a texture unit 390, the scoreboard register 410 is incremented. Once the texture unit 390 has written a value for the texture operation to a destination register (i.e., one of the registers 420) specified by the instruction, the scoreboard register 410 is decremented. For any subsequent instructions that have a dependency on the destination register, the scheduler unit 310 is configured to not dispatch the subsequent instruction until the corresponding scoreboard register 410 stores a value of zero (0). However, the scoreboarding mechanism described above is expensive in terms of power and die area. For example, a scoreboard register 410 may be required for each different type of pipelined execution unit 450.  \n\n", "text": "[0039] In one embodiment, a scoreboard register 410 may be utilized to ensure register dependencies are managed properly by the scheduling unit 310. A particular scoreboard register 410 may be utilized for a particular type of instruction. For example, a scoreboard register 410 may be utilized for each texture instruction of a thread. Each time a texture instruction is dispatched to a texture unit 390, the scoreboard register 410 is incremented. Once the texture unit 390 has written a value for the texture operation to a destination register (i.e., one of the registers 420) specified by the instruction, the scoreboard register 410 is decremented. For any subsequent instructions that have a dependency on the destination register, the scheduler unit 310 is configured to not dispatch the subsequent instruction until the corresponding scoreboard register 410 stores a value of zero (0). However, the scoreboarding mechanism described above is expensive in terms of power and die area. For example, a scoreboard register 410 may be required for each different type of pipelined execution unit 450.\n", "alignment": "left", "unique_id": "490fb6be2d81b064491e0b7648544754", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0039] In one embodiment, a scoreboard register 410 may be utilized to ensure register dependencies are managed properly by the scheduling unit 310. A particular scoreboard register 410 may be utilized for a particular type of instruction. For example, a scoreboard register 410 may be utilized for each texture instruction of a thread. Each time a texture instruction is dispatched to a texture unit 390, the scoreboard register 410 is incremented. Once the texture unit 390 has written a value for the texture operation to a destination register (i.e., one of the registers 420) specified by the instruction, the scoreboard register 410 is decremented. For any subsequent instructions that have a dependency on the destination register, the scheduler unit 310 is configured to nation register for one of the source operands. When the first instruction is dispatched by the scheduler unit 310, the scoreboard registers 410 associated with the source operands of the first instruction are incremented. The scheduler unit 310 then prevents the subsequent instruction from being dispatched until the pipelined execution unit 450 has read the values from the source operands. These types of hazards exist because the decoupled pipelines may not read\n", "alignment": "left", "unique_id": "a0b0a40b3a40502b58f5ae7e12f5fc6a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0047] It will be appreciated that the scoreboard register(s) 410 associated with the source operands for an instruction protects from a WAR (Write-After-Read) hazard (also known as an anti-dependency), where a dependent, subsequent instruction attempts to write to a destination register specified as a source operand for an instruction before the pipelined execution unit 450 executing the instruction has read the value in the destination register for one of the source operands. When the first instruction is dispatched by the scheduler unit 310, the scoreboard registers 410 associated with the source operands of the first instruction are incremented. The scheduler unit 310 then prevents the subsequent instruction from being dispatched until the pipelined execution unit 450 has read the values from the source operands. These types of hazards exist because the decoupled pipelines may not read"}], "lineHeight": 0}}, "target": {"markdown": "[0047] 可以理解的是，与指令的源操作数相关联的记分板寄存器 410 可以防止 WAR（写后读）危险（也称为反依赖），即依赖的后续指令试图在执行该指令的流水线执行单元 450 从某个源操作数的目标寄存器中读取值之前，向该目标寄存器写入值。当调度器单元 310 分派第一条指令时，与第一条指令的源操作数相关联的记分板寄存器 410 递增。然后，调度器单元 310 阻止后续指令被分派，直到流水线执行单元 450 已从源操作数中读取值。由于解耦流水线可能尚未读取", "status": "translated", "skip_reason": null, "skip ciated with the operands for an instruction, both the destination register operand (to protect against WAW hazards) and the one or more source operands (to protect against RAW hazards). Unlike the write dependency bit mask and the read dependency bit mask, which may only specify a single scoreboard, the operand bit mask may specify one or more scoreboards. Each of the scoreboards associated with the operand bit mask is checked by the scheduler unit 310 prior to the instruction being dispatched for execution. In another embodiment, multiple scoreboard registers may be specified using a list of scoreboard indices. For example, nine bits may be utilized to specify up to three different scoreboards using the indices between 0 and 7.  \n\n", "text": "[0048] As described above, the write dependency bit mask and the read dependency bit mask are defined in the instruction for producing scoreboards when the instruction is dispatched. In other words, these bit masks are used to generate scoreboards and to manage dependencies of subsequently issued instructions. However, an instruction may also be a consumer of scoreboards. In one embodiment, an instruction includes an operand bit mask that is utilized to check one or more scoreboard registers 410 associated with the operands for an instruction, both the destination register operand (to protect against WAW hazards) and the one or more source operands (to protect against RAW hazards). Unlike the write dependency bit mask and the read dependency bit mask, which may only specify a single scoreboard, the operand bit mask may specify one or more scoreboards. Each of the scoreboards associated with the operand bit mask is checked by the scheduler unit 310 prior to the instruction being dispatched for execution. In another embodiment, multiple scoreboard registers may be specified using a list of scoreboard indices. For example, nine bits may be utilized to specify up to three different scoreboards using the indices between 0 and 7.\n", "alignment": "left", "unique_id": "3809bd2ab4d96d31924764a98643e5a3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "[0048] As described above, the write dependency bit mask and the read dependency bit mask are defined in the instruction for producing scoreboards when the instruction is dispatched. In other words, these bit masks are used to generate scoreboards and to manage dependencies of subsequently issued instructions. However, an instruction may also be a consumer of scoreboards. In one embodiment, an instruction includes an operand bit mask that is utilized to check one or more scoreboard registers 410 associated with the operands for an instruction, both the destination register operand (to protect against WAW hazards) and the one or more source operands (to protect against RAW hazards). Unlike the write dependency bit mask and the read dependency bit mask, which may only specify a single scoreboard, the operand bit mask may specify one or more scoreboards. Each of the scoreboards associated with the operand bit mask is checked by the scheduler unit 310 prior to the instruction being dispatched for execution. In another embodiment, multiple scoreboard registers may be specified using a list of scoreboard indices. For example, nine bits may be utilized to specify up to three different scoreboards using the indices between 0 and 7."}], "lineHeight": 0}}, "target": {"markdown": "[0048] 如上所述，写依赖位掩码和读依赖位掩码在指令中定义，用于在指令被分派时生成记分板。换言之，这些位掩码用于生成记分板并管理后续发出指令的依赖关系。然而，指令也可以是记分板的消费者。在一个实施例中，一条指令包括一个操作数位掩码，该操作数位掩码用于检查与该指令的操作数相关联的一个或多个记分板寄存器 410，包括目标寄存器操作数（以防止 WAW 危险）和一个或多个源操作数（以防止 RAW 危险）。与可能仅指定单个记分板的写依赖位掩码和读依赖位掩码不同，操作数位掩码可以指定一个或多个记分板。在指令被分派执行之前，调度器单元 310 检查与操作数位掩码相关联的每个记分板。在另一个实施例中，可以使用记分板索引列表来指定多个记分板寄存器。例如，可以使用 9 位来使用 0 到 7 之间的索引指定最多三个不同的记分板。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 103}, {"source": {"block_id": "35a90d2a1d9c4006b78f2e2eaaf275ea", "index": 104, "aliyun_index": 9, "page_num": 14, "type": "text", "sub_type": "none", "markdown": "[0049] In one embodiment, the operand bit mask may include a plurality of bits; each bit corresponding to one of the scoreboard registers 410. For each operand, the compiler may set a bit corresponding to a scoreboard register 410 associated with the operand. It will be appreciated that two or more operands may be associated with the same scoreboard register 410. For example, the compiler may set the operand bit mask as 0b001101, which corresponds to scoreboard registers 410(0), 410(2), and 410(3). When the scheduler unit 310 selects an instruction from a particular warp to be dispatched, the scheduler unit checks each scoreboard register 410 corresponding to a set bit in the operand bit mask. In one embodiment, each of the checked scoreboard registers 410 should have a value of zero prior to the scheduler unit 310 dispatching the instruction to a pipelined execution unit 450. Thus, the operand bit mask enables the scheduler unit 310 to check if dependencies for the current instruction have been resolved by either the operands being read from or written to by a previously dispatched instruction.  \n\n", "text": "[0049] In one embodiment, the operand bit mask may include a plurality of bits; each bit corresponding to one of the scoreboard registers 410. For each operand, the compiler may set a bit corresponding to a scoreboard register 410 associated with the operand. It will be appreciated that two or more operands may be associated with the same scoreboard register 410. For example, the compiler may set the operand bit mask as 0b001101, which corresponds to scoreboard registers 410(0), 410(2), and 410(3). When the scheduler unit 310 selects an instruction from a particular warp to be dispatched,
