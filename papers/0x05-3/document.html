age Table Walker）负责页表遍历。\n> - `On-chip Interconnect` 连接计算单元与内存子系统及外部接口。\n> - `L2 $` 与 `GPU Mem` 组成高速缓存+显存层次。\n> - `High-Speed Hub` 与 `Copy Engine` 协同处理数据搬运，`Copy Engine` 可回写至 PCI Express。\n> - `NVSwitch Interface` 用于多 GPU 互联（图中指向右侧 NVSwitch）。\n\n---\n\n## 右侧：Fidelity 等级标识 & NVSwitch\n\n### Fidelity 等级图例\n\n| 等级   | 颜色       |\n|--------|------------|\n| High   | 深绿色     |\n| Medium | 浅绿色     |\n| Low    | 白色/无色  |\n\n> **注**：图中 `L1 $`、`L2 $`、`SM-0`、`UM driver layer` 等使用深绿色或浅绿色填充，表示其 fidelity 等级。例如：\n> - `L1 $`、`L2 $`、`SM-0` → **High**\n> - `L1 TLB`、`L2 TLB`、`Task Engine` → **Medium**\n> - `PTW`、`Copy Engine`、`High-Speed Hub` → **Low**\n\n### NVSwitch 连接\n\n\nmermaid\ngraph LR\n    NVSwitch_Interface[\"NVSwitch Interface (from GPU-0)\"] --> NVSwitch[\"NVSwitch\"]\n```\n\n> **说明**：\n> - `NVSwitch` 是独立于单个 GPU 的高速交换网络，用于多 GPU 间直接通信。\n> - 由 `High-Speed Hub` 通过 `On-chip Interconnect` 接入。\n\n---\n\n## 整体数据流概览（橙色箭头路径）\n\n1. **CPU → GPU**  \n   `CPU Mem` → `PCI Express` → `Task Engine` → `GPC-0` → `SM-0` → `L1 $`\n\n2. **地址翻译路径**  \n   `SM-0` → `L1 TLB` ↔ `L2 TLB` ↔ `PTW`\n\n3. **内存访问路径**  \n   `GPC-0` → `On-chip Interconnect` → `L2 $` ↔ `GPU Mem`\n\n4. **数据拷贝路径**  \n   `Copy Engine` ← `High-Speed Hub` ← `On-chip Interconnect` → `PCI Express`（回传 CPU）\n\n5. **多 GPU 互联路径**  \n   `On-chip Interconnect` → `High-Speed Hub` → `NVSwitch Interface` → `NVSwitch`\n\n---\n\n## 组件颜色编码含义（基于 Fidelity 图例）\n\n- **深绿色（High）**：核心计算/缓存单元（如 SM-0, L1$, L2$）\n- **浅绿色（Medium）**：控制/调度/TLB 单元（如 Task Engine, L1 TLB, L2 TLB）\n- **白色/无色（Low）**：辅助引擎/互连模块（如 PTW, Copy Engine, High-Speed Hub）\n\n---\n\n✅ 此 Markdown 文档完整还原了原图中的所有组件、层级嵌套、双向/单向连接、颜色语义及数据流向，可用于技术文档、教学材料或系统建模参考。\n\n--- \n\n如需导出为 Mermaid 图表代码或进一步拆解某一部分，请告知。", "alignment": "left", "unique_id": "bcc56f533bc1e50a5bd198bab3679453", "edited": false, "extra": {}}, "target": {"markdown": "![bcc56f533bc1e50a5bd198bab3679453.jpeg](figures/bcc56f533bc1e50a5bd198bab3679453_68b1a8b2.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "66382d561a67679049d90eca6c660d30", "index": 38, "aliyun_index": 1, "page_num": 3, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 2: Overview of NVArcSim with all major simulator components illustrated including fidelity.  \n\n", "text": "Fig. 2: Overview of NVArcSim with all major simulator components illustrated including fidelity.\n", "alignment": "left", "unique_id": "66382d561a67679049d90eca6c660d30", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 2: Overview of NVArcSim with all major simulator components illustrated including fidelity."}], "lineHeight": 0}}, "target": {"markdown": "> 图 2：NVArchSim 总体概览，展示了所有主要的仿真器组件及其保真度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "6d3df7eda21d522de761b80a089c1b5a", "index": 39, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "All components in the entire system are interconnected using abstract channels that model adjustable bandwidth and latency. In multi-GPU scenarios each GPU can be connected to others either via PCIe, point-to-point NVLink connections, or via a unique topology of NVLink plus NVSwitch components. Users specify the number of instances, attributes of each component, and the bandwidth and latency of each channel using configuration files.  \n\n", "text": "All components in the entire system are interconnected using abstract channels that model adjustable bandwidth and latency. In multi-GPU scenarios each GPU can be connected to others either via PCIe, point-to-point NVLink connections, or via a unique topology of NVLink plus NVSwitch components. Users specify the number of instances, attributes of each component, and the bandwidth and latency of each channel using configuration files.\n", "alignment": "left", "unique_id": "6d3df7eda21d522de761b80a089c1b5a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "All components in the entire system are interconnected using abstract channels that model adjustable bandwidth and latency. In multi-GPU scenarios each GPU can be connected to others either via PCIe, point-to-point NVLink connections, or via a unique topology of NVLink plus NVSwitch components. Users specify the number of instances, attributes of each component, and the bandwidth and latency of each channel using configuration files."}], "lineHeight": 0}}, "target": {"markdown": "系统中所有组件均通过可配置带宽与时延的抽象通道相互连接。在多 GPU 场景中，各 GPU 之间可通过 PCIe、点对点 NVLink 连接，或通过由 NVLink 与 NVSwitch 组合而成的特定拓扑结构进行互连。用户可通过配置文件指定组件实例的数量、各组件的属性，以及每条通道的带宽和时延。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "bcbe57f4139801ee52d125b69677335c", "index": 40, "aliyun_index": 3, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "One unique feature of NVAS is that these individual architectural components all implement very different levels of fidelity in terms of how faithfully they model the corresponding hardware components found in production GPUs. As Figure 2 illustrates, we intentionally maintain a low level of detail in many components. The NVArchSim development approach is to add increasing detail to components *only when that detail makes a significant improvement to system-level performance accuracy, and simulation speed is not substantially affected*. For example, the SM pipelines model the right high-level architecture and throughput as controlled via simulator knobs, but not the detailed microarchitecture that determines those knobs. The caches are modeled with tags and data banks of sizes and associativity matching real hardware, with customization for atomics and other features as is needed to reflect their actual performance. On the other hand, our on-chip interconnect model is nearly trivial. Most channels are simple latency plus bandwidth models, but a few incorporate more specifics regarding packet overhead wherever that overhead is an important factor. In our experience, minimizing per-component detail also enables much faster modification and development of new architectural components and interconnects, particularly by non-expert users.  \n\n", "text": "One unique feature of NVAS is that these individual architectural components all implement very different levels of fidelity in terms of how faithfully they model the corresponding hardware components found in production GPUs. As Figure 2 illustrates, we intentionally maintain a low level of detail in many components. The NVArchSim development approach is to add increasing detail to components *only when that detail makes a significant improvement to system-level performance accuracy, and simulation speed is not substantially affected*. For example, the SM pipelines model the right high-level architecture and throughput as controlled via simulator knobs, but not the detailed microarchitecture that determines those knobs. The caches are modeled with tags and data banks of sizes and associativity matching real hardware, with customization for atomics and other features as is needed to reflect their actual performance. On the other hand, our on-chip interconnect model is nearly trivial. Most channels are simple latency plus bandwidth models, but a few incorporate more specifics regarding packet overhead wherever that overhead is an important factor. In our experience, minimizing per-component detail also enables much faster modification and development of new architectural components and interconnects, particularly by non-expert users.\n", "alignment": "left", "unique_id": "bcbe57f4139801ee52d125b69677335c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One unique feature of NVAS is that these individual architectural components all implement very different levels of fidelity in terms of how faithfully they model the corresponding hardware components found in production GPUs. As Figure 2 illustrates, we intentionally maintain a low level of detail in many components. The NVArchSim development approach is to add increasing detail to components *only when that detail makes a significant improvement to system-level performance accuracy, and simulation speed is not substantially affected*. For example, the SM pipelines model the right high-level architecture and throughput as controlled via simulator knobs, but not the detailed microarchitecture that determines those knobs. The caches are modeled with tags and data banks of sizes and associativity matching real hardware, with customization for atomics and other features as is needed to reflect their actual performance. On the other hand, our on-chip interconnect model is nearly trivial. Most channels are simple latency plus bandwidth models, but a few incorporate more specifics regarding packet overhead wherever that overhead is an important factor. In our experience, minimizing per-component detail also enables much faster modification and development of new architectural components and interconnects, particularly by non-expert users."}], "lineHeight": 0}}, "target": {"markdown": "NVAS 的一项独特之处在于，这些独立的架构组件在保真度方面差异显著——即它们对生产级 GPU 中相应硬件组件的还原程度各不相同。正如 图 2 所示，我们在许多组件中有意保持了较低的细节水平。NVArchSim 的开发方法是，*仅在该细节能够显著提升系统级性能精度且不会大幅牺牲仿真速度的前提下*，才为相应组件添加更多细节。例如，SM 流水线模型通过仿真器旋钮来呈现正确的高层架构与吞吐能力，但并不建模决定这些旋钮数值的底层微架构细节。缓存模型采用与真实硬件相匹配的标签和数据存储体大小及组相联度，并根据需要针对原子操作及其他特性进行定制，以反映其真实性能。另一方面，我们的片上互连模型则相当简化。大多数通道仅采用简单的时延加带宽建模，仅在某些开销对性能具有重要影响的位置才纳入更具体的报文开销细节。根据我们的经验，降低单组件的细节程度也使得新架构组件与互连结构的修改和开发更为迅捷，尤其便于非专业用户的使用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "cef0b7d31413ca0b13c275809dc70eeb", "index": 41, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The memory-related components in NVAS, such as caches, tend to have increased fidelity compared to most other components because well-optimized GPU workloads tend to be both memory-intensive and latency-insensitive. NVAS' SM models contain a medium level of accuracy: enough to capture the throughput and latency of each instruction, and to properly maintain instruction dependencies. Studies that require substantially more SM microarchitectural detail are typically deferred to other tools within the company. Having  \n\n", "text": "The memory-related components in NVAS, such as caches, tend to have increased fidelity compared to most other components because well-optimized GPU workloads tend to be both memory-intensive and latency-insensitive. NVAS' SM models contain a medium level of accuracy: enough to capture the throughput and latency of each instruction, and to properly maintain instruction dependencies. Studies that require substantially more SM microarchitectural detail are typically deferred to other tools within the company. Having\n", "alignment": "left", "unique_id": "cef0b7d31413ca0b13c275809dc70eeb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The memory-related components in NVAS, such as caches, tend to have increased fidelity compared to most other components because well-optimized GPU workloads tend to be both memory-intensive and latency-insensitive. NVAS' SM models contain a medium level of accuracy: enough to capture the throughput and latency of each instruction, and to properly maintain instruction dependencies. Studies that require substantially more SM microarchitectural detail are typically deferred to other tools within the company. Having"}], "lineHeight": 0}}, "target": {"markdown": "NVAS 中与内存相关的组件（如缓存）相较于大多数其他组件往往具有更高的保真度，这是因为经过良好优化的 GPU 工作负载通常兼具内存密集型与延迟不敏感的特性。NVAS 的 SM 模型具有中等精度：足以刻画每条指令的吞吐与时延，并正确维持指令间的依赖关系。对于需要更高 SM 微架构精度的研究，通常会交由公司内部的其他工具来完成。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "c6aac4295836ae96921f1020391b74ad", "index": 42, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "flexibility with the SM model allows us to, for example, easily\nmodel the impact of new instructions or in-core accelerators\nsuch as NVIDIA Tensor Cores [42] that dramatically change\ninstruction throughput.  \n\n", "text": "flexibility with the SM model allows us to, for example, easily\nmodel the impact of new instructions or in-core accelerators\nsuch as NVIDIA Tensor Cores [42] that dramatically change\ninstruction throughput.\n", "alignment": "left", "unique_id": "c6aac4295836ae96921f1020391b74ad", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "flexibility with the SM model allows us to, for example, easily"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "model the impact of new instructions or in-core accelerators"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "such as NVIDIA Tensor Cores [42] that dramatically change"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instruction throughput."}], "lineHeight": -115}}, "target": {"markdown": "SM 模型的灵活性使我们能够轻松地建模新指令或片上加速器（例如能够显著改变指令吞吐的 NVIDIA Tensor Core [42]）所带来的影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "23ad9729e2bf3ef7ffd27e61a0f533ac", "index": 43, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Components that have not yet proven to impose a significant system-level roofline effect in applications are implemented with only the minimal detail required to allow functional operation of the simulator. Implementing unnecessary detail within components not only slows down simulations due to needing to track and execute additional microarchitectural state, but it also raises the risk that a specific implementation choice unintentionally becomes a roofline that does not correspond to any real hardware (e.g., improperly sizing some low-level buffer within a component). Section V later provides several examples of fidelity, accuracy, and speed trade-offs we have explored in NVAS.  \n\n", "text": "Components that have not yet proven to impose a significant system-level roofline effect in applications are implemented with only the minimal detail required to allow functional operation of the simulator. Implementing unnecessary detail within components not only slows down simulations due to needing to track and execute additional microarchitectural state, but it also raises the risk that a specific implementation choice unintentionally becomes a roofline that does not correspond to any real hardware (e.g., improperly sizing some low-level buffer within a component). Section V later provides several examples of fidelity, accuracy, and speed trade-offs we have explored in NVAS.\n", "alignment": "left", "unique_id": "23ad9729e2bf3ef7ffd27e61a0f533ac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Components that have not yet proven to impose a significant system-level roofline effect in applications are implemented with only the minimal detail required to allow functional operation of the simulator. Implementing unnecessary detail within components not only slows down simulations due to needing to track and execute additional microarchitectural state, but it also raises the risk that a specific implementation choice unintentionally becomes a roofline that does not correspond to any real hardware (e.g., improperly sizing some low-level buffer within a component). Section V later provides several examples of fidelity, accuracy, and speed trade-offs we have explored in NVAS."}], "lineHeight": 0}}, "target": {"markdown": "对于那些在应用中尚未被证明会对系统级屋顶线（roofline）产生显著影响的组件，NVAS 仅以实现仿真器功能性运行所需的最低细节程度来实现。在组件内部实现不必要的细节，不仅会因为需要追踪和执行额外的微架构状态而拖慢仿真速度，还会带来这样一种风险——某些特定的实现选择可能无意中成为屋顶线约束，而该约束并不对应于任何真实硬件（例如，在组件内部错误地设定某个底层缓冲的容量）。第 V 节稍后将提供我们在 NVAS 中所探讨的若干保真度、精度与仿真速度之间权衡的实例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "0954928c8d53d155cb87bf0fdefc1033", "index": 44, "aliyun_index": 7, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### B. Simulation Engine\n", "text": "B. Simulation Engine\n", "alignment": "left", "unique_id": "0954928c8d53d155cb87bf0fdefc1033", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Simulation Engine"}], "lineHeight": 0}}, "target": {"markdown": "### B. 仿真引擎\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "f6bd745af0e100b78275b3facaf0d065", "index": 45, "aliyun_index": 8, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "While Figure 2 shows the high-level conceptual components in NVAS, simulations typically have thousands of hierarchically organized sub-components, plus channels interconnecting those components. Ticking these components each cycle is too expensive, so like other event-driven simulators [7] NVAS modules are only ticked on the cycles in which they have work to perform. The simulation starts with the CPU component reading the first CUDA driver API event from a trace and it naturally terminates when there are no more events to simulate. The simulator is able to restrict areas of interests to a set of CUDA driver API events or even warps, in cases where a user only cares about a specific portion of the workload.  \n\n", "text": "While Figure 2 shows the high-level conceptual components in NVAS, simulations typically have thousands of hierarchically organized sub-components, plus channels interconnecting those components. Ticking these components each cycle is too expensive, so like other event-driven simulators [7] NVAS modules are only ticked on the cycles in which they have work to perform. The simulation starts with the CPU component reading the first CUDA driver API event from a trace and it naturally terminates when there are no more events to simulate. The simulator is able to restrict areas of interests to a set of CUDA driver API events or even warps, in cases where a user only cares about a specific portion of the workload.\n", "alignment": "left", "unique_id": "f6bd745af0e100b78275b3facaf0d065", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While Figure 2 shows the high-level conceptual components in NVAS, simulations typically have thousands of hierarchically organized sub-components, plus channels interconnecting those components. Ticking these components each cycle is too expensive, so like other event-driven simulators [7] NVAS modules are only ticked on the cycles in which they have work to perform. The simulation starts with the CPU component reading the first CUDA driver API event from a trace and it naturally terminates when there are no more events to simulate. The simulator is able to restrict areas of interests to a set of CUDA driver API events or even warps, in cases where a user only cares about a specific portion of the workload."}], "lineHeight": 0}}, "target": {"markdown": "虽然图 2 展示了 NVAS 中的高层概念组件，但实际仿真中通常包含数以千计的、按层次结构组织的子组件，以及连接这些组件的通道。每周期都对所有组件进行滴答（tick）操作开销过大，因此与其他事件驱动仿真器 [7] 类似，NVAS 中的模块仅在自身存在待执行工作的周期内才会被滴答。仿真过程从 CPU 组件读取追踪文件中的第一个 CUDA 驱动 API 事件开始，并在无更多事件可供仿真时自然终止。当用户仅关注工作负载中的特定部分时，仿真器能够将感兴趣区域限定为一组 CUDA 驱动 API 事件，甚至是特定的 warp。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "e38e7583f899c70ee8dd208dd98f6471", "index": 46, "aliyun_index": 9, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "NVArchSim utilizes a single threaded, but highly optimized, event-based execution engine capable of dispatching several millions of events per second. Although recent simulators [52], [55] show that multithreading can deliver speedups in the range of 2–3×, the NVArchSim engine remains single-threaded to reduce code complexity, facilitate easy debugging, and ensure reproducible simulations. High simulation speed is achieved primarily through judicious component fidelity. Each component in a NVAS simulation enqueues events with the simulation engine to be executed some number of cycles in the future. Examples of these events may be a packet being  \n\n", "text": "NVArchSim utilizes a single threaded, but highly optimized, event-based execution engine capable of dispatching several millions of events per second. Although recent simulators [52], [55] show that multithreading can deliver speedups in the range of 2–3×, the NVArchSim engine remains single-threaded to reduce code complexity, facilitate easy debugging, and ensure reproducible simulations. High simulation speed is achieved primarily through judicious component fidelity. Each component in a NVAS simulation enqueues events with the simulation engine to be executed some number of cycles in the future. Examples of these events may be a packet being\n", "alignment": "left", "unique_id": "e38e7583f899c70ee8dd208dd98f6471", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVArchSim utilizes a single threaded, but highly optimized, event-based execution engine capable of dispatching several millions of events per second. Although recent simulators [52], [55] show that multithreading can deliver speedups in the range of 2–3×, the NVArchSim engine remains single-threaded to reduce code complexity, facilitate easy debugging, and ensure reproducible simulations. High simulation speed is achieved primarily through judicious component fidelity. Each component in a NVAS simulation enqueues events with the simulation engine to be executed some number of cycles in the future. Examples of these events may be a packet being"}], "lineHeight": 0}}, "target": {"markdown": "NVArchSim 采用单一线程但经过高度优化的事件驱动执行引擎，每秒能够派发数百万个事件。尽管近期的仿真器 [52]、[55] 已表明多线程能够带来 2–3 倍的加速，但 NVArchSim 引擎仍保持单线程设计，以降低代码复杂度、便于调试，并确保仿真结果的可复现性。高仿真速度主要通过合理地选择组件保真度加以实现。NVAS 仿真中的每个组件都会向仿真引擎中提交将在未来若干周期后执行的事件。这些事件的示例包括一个数据包的……", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "4098d8970a7f2511550bfb8ad769d203", "index": 47, "aliyun_index": 0, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "released from a channel to be received from another component, or an instruction completion based on its configuration defined static average latency.  \n\n", "text": "released from a channel to be received from another component, or an instruction completion based on its configuration defined static average latency.\n", "alignment": "left", "unique_id": "4098d8970a7f2511550bfb8ad769d203", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "released from a channel to be received from another component, or an instruction completion based on its configuration defined static average latency."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "e85ab4b6992a9e13d7308432b2ca4114", "index": 48, "aliyun_index": 1, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Dynamic system latencies are modeled using queues within virtual or physical channels. NVAS policy explicitly forbids components from having any form of \"retry logic\" that proactively queues events in the future for retry without being signaled by another component first. Allowing retry logic can result in an explosion of unnecessary simulation-slowing events, which can be avoided by requiring triggering events instead. For example, a component should not continually try to queue a packet onto a channel each cycle, only to find the channel remains full. Instead, the channel component must signal a not full condition to the enqueuing component before it is allowed to retry. Failure in queuing may still result, for instance another packet occupies that channel before the component queues its own packet, but the number of fruitless attempts (and simulation overhead) is drastically reduced.  \n\n", "text": "Dynamic system latencies are modeled using queues within virtual or physical channels. NVAS policy explicitly forbids components from having any form of \"retry logic\" that proactively queues events in the future for retry without being signaled by another component first. Allowing retry logic can result in an explosion of unnecessary simulation-slowing events, which can be avoided by requiring triggering events instead. For example, a component should not continually try to queue a packet onto a channel each cycle, only to find the channel remains full. Instead, the channel component must signal a not full condition to the enqueuing component before it is allowed to retry. Failure in queuing may still result, for instance another packet occupies that channel before the component queues its own packet, but the number of fruitless attempts (and simulation overhead) is drastically reduced.\n", "alignment": "left", "unique_id": "e85ab4b6992a9e13d7308432b2ca4114", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Dynamic system latencies are modeled using queues within virtual or physical channels. NVAS policy explicitly forbids components from having any form of \"retry logic\" that proactively queues events in the future for retry without being signaled by another component first. Allowing retry logic can result in an explosion of unnecessary simulation-slowing events, which can be avoided by requiring triggering events instead. For example, a component should not continually try to queue a packet onto a channel each cycle, only to find the channel remains full. Instead, the channel component must signal a not full condition to the enqueuing component before it is allowed to retry. Failure in queuing may still result, for instance another packet occupies that channel before the component queues its own packet, but the number of fruitless attempts (and simulation overhead) is drastically reduced."}], "lineHeight": 0}}, "target": {"markdown": "动态系统时延通过虚拟或物理通道内的队列来建模。NVAS 的策略明确禁止任何形式的\"重试逻辑\"——即组件在未被其他组件先行触发的情况下，主动将事件排入未来周期以供重试。允许重试逻辑可能导致大量拖慢仿真的冗余事件激增，而通过要求事件必须由触发事件来驱动，则可避免这种情况。例如，组件不应每周期都持续尝试将数据包排入通道，而仅仅是为了发现通道仍然处于已满状态。相反，通道组件必须先向发起排队的组件发出\"未满\"信号，组件方可重试。排队仍可能失败，例如在组件排入自身数据包之前，已有其他数据包占用了该通道，但无效尝试的次数（以及由此带来的仿真开销）将大幅减少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "80e70f00452c18b4ae6f34d2ba1d95b1", "index": 49, "aliyun_index": 2, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "### C. Tracing Infrastructure\n", "text": "C. Tracing Infrastructure\n", "alignment": "left", "unique_id": "80e70f00452c18b4ae6f34d2ba1d95b1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "C. Tracing Infrastructure"}], "lineHeight": 0}}, "target": {"markdown": "### C. 追踪基础设施\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "d552eee8b49539c4a205775e504ea9b0", "index": 50, "aliyun_index": 3, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "To achieve high simulation throughput in systems composed of thousands of SIMT pipelines we believe functional execution of all ISA instructions is infeasible for large workloads. GPU instruction set architectures are becoming increasingly complex both semantically and in the number of distinct instructions they implement as products evolve to support new workload classes. Fortunately, most GPU programs do not make complex control flow decisions based on the state of dynamically generated data. This programmatic determinism allows the vast majority of the instructions to be traced on existing GPU hardware and then \"replayed\" on the simulated architectural models by accounting for their throughput, latency, hazard dependencies, and interactions with the memory system. Thus, the NVAS application trace format mostly captures static instruction decoding information (as in the binary), a sequence of dynamically executed instructions per warp and the list of the memory addresses accessed those instructions (if any). The trace does not record instruction timestamps or other event timing information, nor does it record any architectural state not explicitly required for execution. For example, while hazard dependencies are encoded in the trace and are part of the semantics of the application, latency and throughput are architectural parameters that can be modified in the simulated target architecture.  \n\n", "text": "To achieve high simulation throughput in systems composed of thousands of SIMT pipelines we believe functional execution of all ISA instructions is infeasible for large workloads. GPU instruction set architectures are becoming increasingly complex both semantically and in the number of distinct instructions they implement as products evolve to support new workload classes. Fortunately, most GPU programs do not make complex control flow decisions based on the state of dynamically generated data. This programmatic determinism allows the vast majority of the instructions to be traced on existing GPU hardware and then \"replayed\" on the simulated architectural models by accounting for their throughput, latency, hazard dependencies, and interactions with the memory system. Thus, the NVAS application trace format mostly captures static instruction decoding information (as in the binary), a sequence of dynamically executed instructions per warp and the list of the memory addresses accessed those instructions (if any). The trace does not record instruction timestamps or other event timing information, nor does it record any architectural state not explicitly required for execution. For example, while hazard dependencies are encoded in the trace and are part of the semantics of the application, latency and throughput are architectural parameters that can be modified in the simulated target architecture.\n", "alignment": "left", "unique_id": "d552eee8b49539c4a205775e504ea9b0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To achieve high simulation throughput in systems composed of thousands of SIMT pipelines we believe functional execution of all ISA instructions is infeasible for large workloads. GPU instruction set architectures are becoming increasingly complex both semantically and in the number of distinct instructions they implement as products evolve to support new workload classes. Fortunately, most GPU programs do not make complex control flow decisions based on the state of dynamically generated data. This programmatic determinism allows the vast majority of the instructions to be traced on existing GPU hardware and then \"replayed\" on the simulated architectural models by accounting for their throughput, latency, hazard dependencies, and interactions with the memory system. Thus, the NVAS application trace format mostly captures static instruction decoding information (as in the binary), a sequence of dynamically executed instructions per warp and the list of the memory addresses accessed those instructions (if any). The trace does not record instruction timestamps or other event timing information, nor does it record any architectural state not explicitly required for execution. For example, while hazard dependencies are encoded in the trace and are part of the semantics of the application, latency and throughput are architectural parameters that can be modified in the simulated target architecture."}], "lineHeight": 0}}, "target": {"markdown": "要在由数以千计的 SIMT 流水线构成的系统上实现高仿真吞吐，我们认为对全部 ISA 指令进行功能级执行对于大型工作负载而言并不可行。随着产品演进以支持新的工作负载类别，GPU 指令集架构在语义层面以及所实现的指令数量上都日趋复杂。幸运的是，大多数 GPU 程序并不会根据动态生成的数据状态作出复杂的控制流决策。这种程序层面的确定性使得绝大部分指令能够在现有 GPU 硬件上进行追踪，然后通过在模拟的架构模型上\"重放\"，同时计入其吞吐、时延、冒险依赖以及与存储子系统的交互。因此，NVAS 的应用追踪格式主要捕获静态指令解码信息（如二进制中所含内容）、每个 warp 动态执行的指令序列，以及这些指令所访问的存储地址列表（若有）。追踪不记录指令的时间戳或其他事件时序信息，也不记录执行过程中并非显式所需的任何架构状态。例如，虽然冒险依赖被编码进追踪，并属于应用程序语义的一部分，但时延和吞吐属于可在被仿真的目标架构中进行修改的架构参数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "e804ab737f6f7eda3f80e29a65d48030", "index": 51, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Application traces are collected at the SASS (GPU assembly) level using NVTracer, a binary instrumentation tool developed on top of NVBit [57], and stored in highly compressed files as shown in Figure 3. Each trace, representing a CUDA application, contains one stream recording the high-level CUDA driver API invocations and additional streams recording the SASS execution of each logical warp in the application. A workload that executes a single kernel launch with 100 thread blocks, composed of 256 threads each, will result in a NVAS trace containing 1 CUDA driver API stream with a cudaLaunchKernel event along with the streams  \n\n", "text": "Application traces are collected at the SASS (GPU assembly) level using NVTracer, a binary instrumentation tool developed on top of NVBit [57], and stored in highly compressed files as shown in Figure 3. Each trace, representing a CUDA application, contains one stream recording the high-level CUDA driver API invocations and additional streams recording the SASS execution of each logical warp in the application. A workload that executes a single kernel launch with 100 thread blocks, composed of 256 threads each, will result in a NVAS trace containing 1 CUDA driver API stream with a cudaLaunchKernel event along with the streams\n", "alignment": "left", "unique_id": "e804ab737f6f7eda3f80e29a65d48030", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Application traces are collected at the SASS (GPU assembly) level using NVTracer, a binary instrumentation tool developed on top of NVBit [57], and stored in highly compressed files as shown in Figure 3. Each trace, representing a CUDA application, contains one stream recording the high-level CUDA driver API invocations and additional streams recording the SASS execution of each logical warp in the application. A workload that executes a single kernel launch with 100 thread blocks, composed of 256 threads each, will result in a NVAS trace containing 1 CUDA driver API stream with a cudaLaunchKernel event along with the streams"}], "lineHeight": 0}}, "target": {"markdown": "应用追踪由 NVTracer 在 SASS（GPU 汇编）级别采集得到。NVTracer 是基于 NVBit [57] 开发的二进制插桩工具，所采集的追踪数据被存储在高度压缩的文件中，如图 3 所示。每一个追踪代表一个 CUDA 应用程序，其中包含一路记录高层 CUDA 驱动 API 调用的流，以及若干路记录该应用程序中每个逻辑 warp 的 SASS 执行的附加流。对于一个执行单次内核启动、且包含 100 个线程块（每个线程块由 256 个线程组成）的工作负载，其对应的 NVAS 追踪将包含 1 路 CUDA 驱动 API 流（其中包含一个 `cudaLaunchKernel` 事件）以及相应的若干路流……", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "73f5b177378720abd9dc89a8a82e989c", "index": 52, "aliyun_index": 5, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![73f5b177378720abd9dc89a8a82e989c.jpeg](figures/73f5b177378720abd9dc89a8a82e989c_a55a5bee.png)  \n\n", "text": "GPU application  \n→ *Traced by NVTracer* →  \nGPU trace  \n→ *Simulated by NVArchSim* →  \nSimulation results\n\n\n\n### 说明：\n- 使用 `→` 表示流程方向。\n- 箭头上的标注（如 “Traced by NVTracer”）以斜体 `*...*` 形式嵌入在箭头之间，保持语义连贯。\n- 所有方框中的文本原样保留，未添加额外解释或修饰。\n- 整体结构为线性四步流程，符合原始图示逻辑。\n\n此格式可直接用于支持 Markdown 的文档、笔记或演示工具中，清晰表达从 GPU 应用到仿真结果的完整处理链路。", "alignment": "left", "unique_id": "73f5b177378720abd9dc89a8a82e989c", "edited": false, "extra": {}}, "target": {"markdown": "![73f5b177378720abd9dc89a8a82e989c.jpeg](figures/73f5b177378720abd9dc89a8a82e989c_a55a5bee.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "b9b23204e002a82cb55a5d5e3400c4ca", "index": 53, "aliyun_index": 6, "page_num": 4, "type": "table_note", "sub_type": "none", "markdown": ">Fig. 3: The baseline trace-based NVAS workflow.  \n\n", "text": "Fig. 3: The baseline trace-based NVAS workflow.\n", "alignment": "left", "unique_id": "b9b23204e002a82cb55a5d5e3400c4ca", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 3: The baseline trace-based NVAS workflow."}], "lineHeight": 0}}, "target": {"markdown": "> 图 3：基于追踪的 NVAS 基线工作流程。", "status": "translated", "
