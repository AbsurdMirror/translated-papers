alic": false}, "text": "$0.47\\times$"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "$0.47\\times$\n", "alignment": "left", "type": "text", "pageNum": [9], "uniqueId": "363ec935e3a164a84db3e41481b91294"}], "pageNum": [9]}], "numRow": 3}}, "target": {"markdown": "|  | 低保真度互连 | 高保真度互连 |\n| --- | --- | --- |\n| 平均误差 | 17% | 17% |\n| 仿真速度 | $1.00\\times$ | $0.47\\times$ |", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "27f9d82139ed5e15e0f0bb17a671b0ff", "index": 122, "aliyun_index": 11, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">Fig. 11: Simulation accuracy when moving from low to high fidelity on-chip interconnects.  \n\n", "text": "Fig. 11: Simulation accuracy when moving from low to high fidelity on-chip interconnects.\n", "alignment": "left", "unique_id": "27f9d82139ed5e15e0f0bb17a671b0ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 11: Simulation accuracy when moving from low to high fidelity on-chip interconnects."}], "lineHeight": 0}}, "target": {"markdown": ">图 11：在将片上互连从低保真度切换至高保真度时的仿真精度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "bcb9e50e978483398f89695a27ddd7bc", "index": 123, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "GPU on-chip interconnects between the SMs and the memory system. By default, NVAS implements this interconnect as a monolithic crossbar network that is parameterized to match the basic performance characteristics of the GPU (e.g., static latency, port bandwidth, and transaction overheads). Additionally, the default model emulates packet contention delay and packetization overheads without implementing the specific buffering and arbitration components in detail. To test the impact of interconnect fidelity on simulation accuracy, we replaced the default model with a fit-level, cycle-accurate network simulator based on BookSim [28]. Using this network simulator, we created a high fidelity interconnect model that matches the topology, router architecture, and arbitration algorithms employed on modern GPUs.  \n\n", "text": "GPU on-chip interconnects between the SMs and the memory system. By default, NVAS implements this interconnect as a monolithic crossbar network that is parameterized to match the basic performance characteristics of the GPU (e.g., static latency, port bandwidth, and transaction overheads). Additionally, the default model emulates packet contention delay and packetization overheads without implementing the specific buffering and arbitration components in detail. To test the impact of interconnect fidelity on simulation accuracy, we replaced the default model with a fit-level, cycle-accurate network simulator based on BookSim [28]. Using this network simulator, we created a high fidelity interconnect model that matches the topology, router architecture, and arbitration algorithms employed on modern GPUs.\n", "alignment": "left", "unique_id": "bcb9e50e978483398f89695a27ddd7bc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU on-chip interconnects between the SMs and the memory system. By default, NVAS implements this interconnect as a monolithic crossbar network that is parameterized to match the basic performance characteristics of the GPU (e.g., static latency, port bandwidth, and transaction overheads). Additionally, the default model emulates packet contention delay and packetization overheads without implementing the specific buffering and arbitration components in detail. To test the impact of interconnect fidelity on simulation accuracy, we replaced the default model with a fit-level, cycle-accurate network simulator based on BookSim [28]. Using this network simulator, we created a high fidelity interconnect model that matches the topology, router architecture, and arbitration algorithms employed on modern GPUs."}], "lineHeight": 0}}, "target": {"markdown": "GPU 片上互连（SM 与存储器系统之间）：我们探索保真度与仿真速度权衡的另一个领域是 GPU 片上互连（即 SM 与存储器系统之间的互连）。默认情况下，NVAS 将该互连实现为一种集中式的 crossbar 网络，并通过参数化配置以匹配 GPU 的基本性能特征（例如静态延迟、端口带宽和事务开销）。此外，默认模型模拟了分组竞争延迟和分组化开销，但并未详细实现具体的缓冲与仲裁组件。为了测试互连保真度对仿真精度的影响，我们用基于 BookSim [28] 的、周期精确的网络仿真器替换了默认模型，从而构建了一个与之相匹配的 fit 级网络仿真器。利用该网络仿真器，我们创建了一个高保真度互连模型，使其在拓扑结构、路由器架构以及仲裁算法等方面均与当代 GPU 所采用的方案保持一致。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "be98d8fb443fcc04cda0d16d2948d268", "index": 124, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 11 shows the comparison between the two models. Overall, the high fidelity model showed a less than 1% change in mean absolute error compared to the low fidelity default NVAS model. In workloads where the simulation ran faster than hardware, the detailed model tends to increase the simulation runtime. This is expected, as the detailed model  \n\n", "text": "Figure 11 shows the comparison between the two models. Overall, the high fidelity model showed a less than 1% change in mean absolute error compared to the low fidelity default NVAS model. In workloads where the simulation ran faster than hardware, the detailed model tends to increase the simulation runtime. This is expected, as the detailed model\n", "alignment": "left", "unique_id": "be98d8fb443fcc04cda0d16d2948d268", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 11 shows the comparison between the two models. Overall, the high fidelity model showed a less than 1% change in mean absolute error compared to the low fidelity default NVAS model. In workloads where the simulation ran faster than hardware, the detailed model tends to increase the simulation runtime. This is expected, as the detailed model"}], "lineHeight": 0}}, "target": {"markdown": "图 11 展示了这两种模型之间的对比。总体而言，相较于 NVAS 默认的低保真度模型，高保真度模型的平均绝对误差变化不到 1%。在仿真运行速度快于硬件的工作负载中，细节化的模型倾向于增加仿真运行时间。这是可以预期的，因为细节化的模型", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "4443bf42af2cd17d2c11d8d7ab8fcbd0", "index": 125, "aliyun_index": 0, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![4443bf42af2cd17d2c11d8d7ab8fcbd0.jpeg](figures/4443bf42af2cd17d2c11d8d7ab8fcbd0_1956be25.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式，准确保留所有图表标题、坐标轴标签、图例、数据趋势描述及表格信息：\n\n---\n\n# Simulated Cycles vs. Workload Number (Sorted by Low Fidelity DRAM)\n\n## Chart Title\n**Sorted by Low Fidelity DRAM (Default)**\n\n## Y-Axis Label\n**Simulated cycles (Norm. to SI)**  \nRange: 0.50 – 2.00  \nGrid lines at intervals of 0.25  \nHorizontal dotted reference line at **1.00**\n\n## X-Axis Label\n**Workload number**  \nRange: 0 – ~900 (tick marks at 0, 250, 500, 750)\n\n## Legend\n- **Low Fidelity DRAM (Default)** — represented by green dashed line (not visibly plotted in chart; likely baseline or implied)\n- **Detailed DRAM** — represented by brown/orange jagged line (actual plotted data)\n\n> Note: The chart displays only the “Detailed DRAM” trace as a noisy, upward-trending curve starting near 0.5 and rising sharply after workload ~800 to nearly 2.0. The “Low Fidelity DRAM (Default)” is referenced in title and legend but not visually rendered as a separate line — possibly it’s the normalization baseline (SI = 1.0).\n\n## Data Trend Description\nThe “Detailed DRAM” simulation cycle count (normalized to SI) starts low (~0.5 at workload 0), gradually increases with noise/fluctuations across workloads, remains relatively flat between ~0.8–1.1 until workload ~750, then rises steeply beyond workload 800, reaching almost 2.0 by the end.\n\n---\n\n## Performance Comparison Table\n\n| Metric               | Low Fidelity DRAM | High Fidelity DRAM |\n|----------------------|-------------------|--------------------|\n| Mean Avg. Error      | 17%               | 16%                |\n| Simulation Speed     | 1.00×             | 0.88×              |\n\n> Interpretation:\n> - “High Fidelity DRAM” has slightly lower mean average error (16% vs 17%) but slower simulation speed (0.88× relative to Low Fidelity’s 1.00× baseline).\n> - “Low Fidelity DRAM (Default)” serves as the performance/speed reference point.\n\n---\n\n✅ All elements from the image have been extracted and formatted into structured Markdown without repetition or omission.\n\n--- \n\n*Note: Since the green “Low Fidelity DRAM (Default)” line is not visibly plotted on the graph despite being in the legend, this may indicate that the y-axis values are normalized *to* that model (i.e., SI = Simulated Ideal or Standard Instance), making its value implicitly 1.0 across all workloads — hence the horizontal dotted line at 1.0.*", "alignment": "left", "unique_id": "4443bf42af2cd17d2c11d8d7ab8fcbd0", "edited": false, "extra": {}}, "target": {"markdown": "![4443bf42af2cd17d2c11d8d7ab8fcbd0.jpeg](figures/4443bf42af2cd17d2c11d8d7ab8fcbd0_1956be25.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "0be8639fa4f8dd1dbe10b733af05829c", "index": 126, "aliyun_index": 1, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 12: Simulation accuracy when moving from low to high fidelity off-chip DRAM model.  \n\n", "text": "Fig. 12: Simulation accuracy when moving from low to high fidelity off-chip DRAM model.\n", "alignment": "left", "unique_id": "0be8639fa4f8dd1dbe10b733af05829c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 12: Simulation accuracy when moving from low to high fidelity off-chip DRAM model."}], "lineHeight": 0}}, "target": {"markdown": ">图 12：在将片外 DRAM 模型从低保真度切换至高保真度时的仿真精度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "95e959c3340bfd92fc91006c992a2bd4", "index": 127, "aliyun_index": 2, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "can capture more interconnect contention effects such as head-\nof-line blocking and arbitration inefficiencies. These in turn\nincrease the latency of some memory transactions, leading to\nan increase in simulation cycles.  \n\n", "text": "can capture more interconnect contention effects such as head-\nof-line blocking and arbitration inefficiencies. These in turn\nincrease the latency of some memory transactions, leading to\nan increase in simulation cycles.\n", "alignment": "left", "unique_id": "95e959c3340bfd92fc91006c992a2bd4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "can capture more interconnect contention effects such as head-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of-line blocking and arbitration inefficiencies. These in turn"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "increase the latency of some memory transactions, leading to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "an increase in simulation cycles."}], "lineHeight": -117}}, "target": {"markdown": "可以捕获更多的互连竞争效应，例如队头阻塞（head-of-line blocking）以及仲裁效率低下等问题。这些效应进而会增加部分存储器事务的延迟，从而导致仿真周期数的增加。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "6b50fbae0dc7377f0073f76950e2d85a", "index": 128, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Nevertheless, the reason that the high fidelity interconnect model has such a small impact on simulation accuracy is in part due to the throughput-oriented nature of the GPU. Because GPU applications tends to be throughput-dominated and are designed to stream traffic from the memory system, GPU interconnects are generally designed to be devoid of any systematic bandwidth bottlenecks caused by either topology or router architectures. Therefore, a simpler interconnect model that adequately captures the bandwidth and average latency of the hardware is sufficiently accurate for most simulation use cases. Furthermore, the average simulation speed when employing the high fidelity model is $0.47\\times$ that of the default model. Such a large slowdown in simulation speed compared to accuracy improvement has motivated us to maintain a simpler GPU interconnect as the default model within NVAS. For studying designs that significantly alter the performance characteristics of the interconnect or in areas of known bottlenecks (e.g., GPU off-chip interconnects) NVAS users can selectively deploy the detailed model.  \n\n", "text": "Nevertheless, the reason that the high fidelity interconnect model has such a small impact on simulation accuracy is in part due to the throughput-oriented nature of the GPU. Because GPU applications tends to be throughput-dominated and are designed to stream traffic from the memory system, GPU interconnects are generally designed to be devoid of any systematic bandwidth bottlenecks caused by either topology or router architectures. Therefore, a simpler interconnect model that adequately captures the bandwidth and average latency of the hardware is sufficiently accurate for most simulation use cases. Furthermore, the average simulation speed when employing the high fidelity model is $0.47\\times$ that of the default model. Such a large slowdown in simulation speed compared to accuracy improvement has motivated us to maintain a simpler GPU interconnect as the default model within NVAS. For studying designs that significantly alter the performance characteristics of the interconnect or in areas of known bottlenecks (e.g., GPU off-chip interconnects) NVAS users can selectively deploy the detailed model.\n", "alignment": "left", "unique_id": "6b50fbae0dc7377f0073f76950e2d85a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Nevertheless, the reason that the high fidelity interconnect model has such a small impact on simulation accuracy is in part due to the throughput-oriented nature of the GPU. Because GPU applications tends to be throughput-dominated and are designed to stream traffic from the memory system, GPU interconnects are generally designed to be devoid of any systematic bandwidth bottlenecks caused by either topology or router architectures. Therefore, a simpler interconnect model that adequately captures the bandwidth and average latency of the hardware is sufficiently accurate for most simulation use cases. Furthermore, the average simulation speed when employing the high fidelity model is $0.47\\times$ that of the default model. Such a large slowdown in simulation speed compared to accuracy improvement has motivated us to maintain a simpler GPU interconnect as the default model within NVAS. For studying designs that significantly alter the performance characteristics of the interconnect or in areas of known bottlenecks (e.g., GPU off-chip interconnects) NVAS users can selectively deploy the detailed model."}], "lineHeight": 0}}, "target": {"markdown": "尽管如此，高保真度互连模型对仿真精度影响如此之小，部分原因在于 GPU 面向吞吐量的本质特性。由于 GPU 应用往往以吞吐量为导向，旨在实现来自存储器系统的流式传输流量，因此 GPU 互连在设计上通常避免任何由拓扑结构或路由器架构所导致的系统性带宽瓶颈。因此，对于大多数仿真应用场景而言，一个能够充分刻画硬件带宽与平均延迟的较简单的互连模型，其精度已经足够。此外，采用高保真度模型时的平均仿真速度仅为默认模型的 $0.47\\times$。考虑到仿真速度的大幅下降与精度提升幅度的微弱，我们倾向于在 NVAS 中维持一种较简单的 GPU 互连作为默认模型。对于那些显著改变互连性能特征的研究，或在已知瓶颈（例如 GPU 片外互连）领域的研究，NVAS 用户可以有选择地启用细节化模型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "f55f7d63ecd4abb51f8f322a75d0226e", "index": 129, "aliyun_index": 4, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Off-chip DRAM Memory System: Similar to the on-chip GPU interconnect, by default NVAS implements a very simple model for the DRAM subsystem in which memory requests have a fixed minimum latency (reflecting the empty-pipe latency) and are serviced in arrival order, while being constrained by the maximum bandwidth the memory system can sustain. With high memory bandwidth being a key driver of GPU adoption (in addition to math throughput), developers typically optimize their algorithms to saturate DRAM bandwidth whenever possible. Consequently, good memory system utilization is often the key to high overall system performance.  \n\n", "text": "Off-chip DRAM Memory System: Similar to the on-chip GPU interconnect, by default NVAS implements a very simple model for the DRAM subsystem in which memory requests have a fixed minimum latency (reflecting the empty-pipe latency) and are serviced in arrival order, while being constrained by the maximum bandwidth the memory system can sustain. With high memory bandwidth being a key driver of GPU adoption (in addition to math throughput), developers typically optimize their algorithms to saturate DRAM bandwidth whenever possible. Consequently, good memory system utilization is often the key to high overall system performance.\n", "alignment": "left", "unique_id": "f55f7d63ecd4abb51f8f322a75d0226e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Off-chip DRAM Memory System: Similar to the on-chip GPU interconnect, by default NVAS implements a very simple model for the DRAM subsystem in which memory requests have a fixed minimum latency (reflecting the empty-pipe latency) and are serviced in arrival order, while being constrained by the maximum bandwidth the memory system can sustain. With high memory bandwidth being a key driver of GPU adoption (in addition to math throughput), developers typically optimize their algorithms to saturate DRAM bandwidth whenever possible. Consequently, good memory system utilization is often the key to high overall system performance."}], "lineHeight": 0}}, "target": {"markdown": "片外 DRAM 存储系统：与片上 GPU 互连类似，默认情况下 NVAS 为 DRAM 子系统实现了一个非常简单的模型，其中存储器请求具有固定的最小延迟（反映了空管道的延迟），并按照到达顺序提供服务，同时受限于存储器系统所能维持的最大带宽。由于高存储器带宽是 GPU 被广泛采用的关键驱动因素之一（仅次于算力吞吐量），开发者通常会尽可能优化其算法以充分饱和 DRAM 带宽。因此，良好的存储器系统利用率往往是实现高整体系统性能的关键。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "0fb63cb26bd60a0a3a0fc4ed4d1bdc2a", "index": 130, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The performance of the DRAM system heavily depends on access patterns, the request scheduling algorithm, and the timing characteristics of the DRAM device. As such, we implemented several new NVAS memory system components  \n\n", "text": "The performance of the DRAM system heavily depends on access patterns, the request scheduling algorithm, and the timing characteristics of the DRAM device. As such, we implemented several new NVAS memory system components\n", "alignment": "left", "unique_id": "0fb63cb26bd60a0a3a0fc4ed4d1bdc2a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The performance of the DRAM system heavily depends on access patterns, the request scheduling algorithm, and the timing characteristics of the DRAM device. As such, we implemented several new NVAS memory system components"}], "lineHeight": 0}}, "target": {"markdown": "DRAM 系统的性能在很大程度上取决于访问模式、请求调度算法以及 DRAM 器件的时序特性。因此，我们实现了若干新的 NVAS 存储器系统组件", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "6e6aa5e697ac03b53feaee42c1a48c5f", "index": 131, "aliyun_index": 6, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "at much higher fidelity including a GPU memory controller and HBM devices similar to prior work [12], [46]. Fidelity improvements come from detailed modeling of the DRAM resources (e.g., address/command and channel bandwidth, bank and row-buffer state, command interactions) and associated timing constraints, and from modeling the memory-controller request arbitration and command scheduling policies that aim to maximize throughput while maintaining fairness and low latency. In keeping with the rest of NVAS, the detailed memory model is event-based, unlike most other standalone cycle-accurate DRAM simulators [11], [30], [33].  \n\n", "text": "at much higher fidelity including a GPU memory controller and HBM devices similar to prior work [12], [46]. Fidelity improvements come from detailed modeling of the DRAM resources (e.g., address/command and channel bandwidth, bank and row-buffer state, command interactions) and associated timing constraints, and from modeling the memory-controller request arbitration and command scheduling policies that aim to maximize throughput while maintaining fairness and low latency. In keeping with the rest of NVAS, the detailed memory model is event-based, unlike most other standalone cycle-accurate DRAM simulators [11], [30], [33].\n", "alignment": "left", "unique_id": "6e6aa5e697ac03b53feaee42c1a48c5f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "at much higher fidelity including a GPU memory controller and HBM devices similar to prior work [12], [46]. Fidelity improvements come from detailed modeling of the DRAM resources (e.g., address/command and channel bandwidth, bank and row-buffer state, command interactions) and associated timing constraints, and from modeling the memory-controller request arbitration and command scheduling policies that aim to maximize throughput while maintaining fairness and low latency. In keeping with the rest of NVAS, the detailed memory model is event-based, unlike most other standalone cycle-accurate DRAM simulators [11], [30], [33]."}], "lineHeight": 0}}, "target": {"markdown": "包括 GPU 存储器控制器以及与已有工作 [12]、[46] 相似的 HBM 器件在内的若干组件，所采用的保真度要高出许多。保真度的提升源自对 DRAM 资源的精细建模（例如地址/命令与通道带宽、Bank 与行缓冲状态、命令交互）及其相关时序约束，并源自对存储器控制器请求仲裁与命令调度策略（其目标是在保证公平性与低延迟的同时最大化吞吐量）的建模。与 NVAS 其他部分保持一致的是，细节化的存储器模型同样是基于事件的，这一点与大多数其他独立的、周期精确的 DRAM 仿真器 [11]、[30]、[33] 不同。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "e93d78b2fb9fcb5d3648ec2c7ccf7111", "index": 132, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Overall, the high fidelity NVAS DRAM model reduces simulation mean absolute error by 1.7% relative to NVAS' default simple DRAM model. As shown in Figure 12, many workloads show marked improvements, as their simulated execution time with the detailed model increases to approach the execution time measured on hardware, indicating that the simple model consistently is overestimating the achievable bandwidth in the system. Unsurprisingly, adding increased microarchitectural rooflines within the memory subsystem reduces the achieved bandwidth in these workloads. These workloads typically have two characteristics that make them sensitive to high fidelity DRAM simulations; namely, they are bandwidth-sensitive and have access patterns that cause bank conflicts leading to bandwidth under-utilization. In other words, even though these applications generate enough requests to keep the memory system busy, the controller cannot find enough row-buffer hit requests and bank-parallelism in the access stream to saturate the DRAM's bandwidth limits.  \n\n", "text": "Overall, the high fidelity NVAS DRAM model reduces simulation mean absolute error by 1.7% relative to NVAS' default simple DRAM model. As shown in Figure 12, many workloads show marked improvements, as their simulated execution time with the detailed model increases to approach the execution time measured on hardware, indicating that the simple model consistently is overestimating the achievable bandwidth in the system. Unsurprisingly, adding increased microarchitectural rooflines within the memory subsystem reduces the achieved bandwidth in these workloads. These workloads typically have two characteristics that make them sensitive to high fidelity DRAM simulations; namely, they are bandwidth-sensitive and have access patterns that cause bank conflicts leading to bandwidth under-utilization. In other words, even though these applications generate enough requests to keep the memory system busy, the controller cannot find enough row-buffer hit requests and bank-parallelism in the access stream to saturate the DRAM's bandwidth limits.\n", "alignment": "left", "unique_id": "e93d78b2fb9fcb5d3648ec2c7ccf7111", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Overall, the high fidelity NVAS DRAM model reduces simulation mean absolute error by 1.7% relative to NVAS' default simple DRAM model. As shown in Figure 12, many workloads show marked improvements, as their simulated execution time with the detailed model increases to approach the execution time measured on hardware, indicating that the simple model consistently is overestimating the achievable bandwidth in the system. Unsurprisingly, adding increased microarchitectural rooflines within the memory subsystem reduces the achieved bandwidth in these workloads. These workloads typically have two characteristics that make them sensitive to high fidelity DRAM simulations; namely, they are bandwidth-sensitive and have access patterns that cause bank conflicts leading to bandwidth under-utilization. In other words, even though these applications generate enough requests to keep the memory system busy, the controller cannot find enough row-buffer hit requests and bank-parallelism in the access stream to saturate the DRAM's bandwidth limits."}], "lineHeight": 0}}, "target": {"markdown": "总体而言，相较于 NVAS 默认的简单 DRAM 模型，高保真度的 NVAS DRAM 模型将仿真的平均绝对误差降低了 1.7%。如图 12 所示，许多工作负载均表现出显著的改进：采用细节化模型后，其仿真执行时间增加，从而趋近于硬件实测的执行时间，这表明简单模型一致地高估了系统所能达到的带宽。不出所料，在存储子系统内增加更精细的微架构上界会降低这些工作负载实际取得的带宽。这类工作负载通常具有两个特征，使其对高保真度 DRAM 仿真较为敏感：其一，它们对带宽敏感；其二，其访问模式会导致 Bank 冲突，从而造成带宽利用率不足。换言之，尽管这些应用能够生成足够多的请求以维持存储器系统处于忙碌状态，但控制器在访问流中仍难以找到足够的行缓冲命中请求和 Bank 并行度，以饱和 DRAM 的带宽上限。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "7f7972a84325367d19a0afb45b0d6c8e", "index": 133, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "While still under active development, high fidelity DRAM simulation can provide dramatic accuracy improvements to a specific class of workloads in the NVAS application library. Without this simulation fidelity we have yet to uncover an easy way to estimate the realistic DRAM bandwidth utilization of these applications, because ultimately the off-chip memory system throughput is decided by a complex interaction of the DRAM bank states, the arrival order of requests, and the address patterns. Whereas the high fidelity on-chip GPU interconnect causes simulation times to more than double, NVAS' high fidelity DRAM components increase average simulation time by just 14%. Further testing and optimization are necessary before we can decide if this slowdown is worth the accuracy improvement for all NVAS users by default.  \n\n", "text": "While still under active development, high fidelity DRAM simulation can provide dramatic accuracy improvements to a specific class of workloads in the NVAS application library. Without this simulation fidelity we have yet to uncover an easy way to estimate the realistic DRAM bandwidth utilization of these applications, because ultimately the off-chip memory system throughput is decided by a complex interaction of the DRAM bank states, the arrival order of requests, and the address patterns. Whereas the high fidelity on-chip GPU interconnect causes simulation times to more than double, NVAS' high fidelity DRAM components increase average simulation time by just 14%. Further testing and optimization are necessary before we can decide if this slowdown is worth the accuracy improvement for all NVAS users by default.\n", "alignment": "left", "unique_id": "7f7972a84325367d19a0afb45b0d6c8e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While still under active development, high fidelity DRAM simulation can provide dramatic accuracy improvements to a specific class of workloads in the NVAS application library. Without this simulation fidelity we have yet to uncover an easy way to estimate the realistic DRAM bandwidth utilization of these applications, because ultimately the off-chip memory system throughput is decided by a complex interaction of the DRAM bank states, the arrival order of requests, and the address patterns. Whereas the high fidelity on-chip GPU interconnect causes simulation times to more than double, NVAS' high fidelity DRAM components increase average simulation time by just 14%. Further testing and optimization are necessary before we can decide if this slowdown is worth the accuracy improvement for all NVAS users by default."}], "lineHeight": 0}}, "target": {"markdown": "尽管仍处于积极的开发过程中，但高保真度 DRAM 仿真能够为 NVAS 应用库中某一特定类别的工作负载带来显著的精度提升。若不采用这种仿真保真度，我们目前仍难以找到一种简便的方法来估计这些应用真实的 DRAM 带宽利用率，因为片外存储器系统的吞吐量最终是由 DRAM Bank 状态、请求的到达顺序以及地址模式之间的复杂交互所共同决定的。相比之下，高保真度的片上 GPU 互连会使仿真时间增加一倍以上，而 NVAS 的高保真度 DRAM 组件仅将平均仿真时间增加了 14%。在我们能够决定是否值得为所有 NVAS 用户默认启用此模型以换取精度提升之前，仍需进一步的测试与优化工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "119d4961703b4ca25f4596fa7a9d654e", "index": 134, "aliyun_index": 9, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## VI. Related Work and Outreach\n", "text": "VI. Related Work and Outreach\n", "alignment": "left", "unique_id": "119d4961703b4ca25f4596fa7a9d654e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VI. Related Work and Outreach"}], "lineHeight": 0}}, "target": {"markdown": "## VI. 相关工作与推广\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "519c99cf366f4961aec113751d53f03d", "index": 135, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "There has been an enormous amount of work put into simulation to help researchers to explore their new hardware designs without building the actual hardware. We acknowledge the countless researchers and developers who have contributed to CPU and GPU simulators in the past and apologize if we omit any work due to the enormity of literature.  \n\n", "text": "There has been an enormous amount of work put into simulation to help researchers to explore their new hardware designs without building the actual hardware. We acknowledge the countless researchers and developers who have contributed to CPU and GPU simulators in the past and apologize if we omit any work due to the enormity of literature.\n", "alignment": "left", "unique_id": "519c99cf366f4961aec113751d53f03d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There has been an enormous amount of work put into simulation to help researchers to explore their new hardware designs without building the actual hardware. We acknowledge the countless researchers and developers who have contributed to CPU and GPU simulators in the past and apologize if we omit any work due to the enormity of literature."}], "lineHeight": 0}}, "target": {"markdown": "长期以来，研究者在仿真方面投入了大量的工作，以便在无需实际构建硬件的情况下探索其新颖的硬件设计。我们向过去曾为 CPU 与 GPU 仿真器作出贡献的众多研究者和开发者致以敬意，并因文献数量之巨，若有所遗漏，恳请见谅。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "4e4c52685cf0a68a50073c7cbed48694", "index": 136, "aliyun_index": 11, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Numerous GPU simulators are in use in the field [3], [6], [10], [16]–[18], [20], [23], [25], [26], [29], [32], [38], [48], [58], [60], [62]. GPGPUSim is one of the more widely used examples; it is an execution-driven and cycle-level simulator that executes publicly documented NVIDIA PTX instructions.  \n\n", "text": "Numerous GPU simulators are in use in the field [3], [6], [10], [16]–[18], [20], [23], [25], [26], [29], [32], [38], [48], [58], [60], [62]. GPGPUSim is one of the more widely used examples; it is an execution-driven and cycle-level simulator that executes publicly documented NVIDIA PTX instructions.\n", "alignment": "left", "unique_id": "4e4c52685cf0a68a50073c7cbed48694", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Numerous GPU simulators are in use in the field [3], [6], [10], [16]–[18], [20], [23], [25], [26], [29], [32], [38], [48], [58], [60], [62]. GPGPUSim is one of the more widely used examples; it is an execution-driven and cycle-level simulator that executes publicly documented NVIDIA PTX instructions."}], "lineHeight": 0}}, "target": {"markdown": "在该领域中，有众多 GPU 仿真器正在被使用 [3]、[6]、[10]、[16]–[18]、[20]、[23]、[25]、[26]、[29]、[32]、[38]、[48]、[58]、[60]、[62]。GPGPUSim 是其中使用较为广泛的代表之一；它是一款执行驱动、周期级的仿真器，能够执行公开记录的 NVIDIA PTX 指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "06916dcae269371ea3de130e92ec8ddb", "index": 137, "aliyun_index": 0, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Accel-Sim adds new GPU simulation models up to NVIDIA Turing and a new trace-driven simulation mode to GPGPU Sim [29]. The added trace-driven mode relies on the SASS-level traces generated from Accel-Sim tracer, an NVBit tool, and its simulation speed more than doubles its execution-driven mode [29], [57]. For AMD GPUs, Multi2Sim supports both AMD's GCN1 ISA, while gem5-gpu and MGPU Sim are able to simulate the GCN3 ISA [21], [22], [55], [56]. All continue to improve regularly.  \n\n", "text": "Accel-Sim adds new GPU simulation models up to NVIDIA Turing and a new trace-driven simulation mode to GPGPU Sim [29]. The added trace-driven mode relies on the SASS-level traces generated from Accel-Sim tracer, an NVBit tool, and its simulation speed more than doubles its execution-driven mode [29], [57]. For AMD GPUs, Multi2Sim supports both AMD's GCN1 ISA, while gem5-gpu and MGPU Sim are able to simulate the GCN3 ISA [21], [22], [55], [56]. All continue to improve regularly.\n", "alignment": "left", "unique_id": "06916dcae269371ea3de130e92ec8ddb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Accel-Sim adds new GPU simulation models up to NVIDIA Turing and a new trace-driven simulation mode to GPGPU Sim [29]. The added trace-driven mode relies on the SASS-level traces generated from Accel-Sim tracer, an NVBit tool, and its simulation speed more than doubles its execution-driven mode [29], [57]. For AMD GPUs, Multi2Sim supports both AMD's GCN1 ISA, while gem5-gpu and MGPU Sim are able to simulate the GCN3 ISA [21], [22], [55], [56]. All continue to improve regularly."}], "lineHeight": 0}}, "target": {"markdown": "Accel-Sim 在 GPGPU-Sim [29] 的基础上新增了截至 Turing 架构的 NVIDIA GPU 仿真模型以及一种新的踪迹驱动仿真模式 [29]。其所新增的踪迹驱动模式依赖于由 Accel-Sim tracer（一种 NVBit 工具）所生成的 SASS 级踪迹，其仿真速度较其执行驱动模式提升了一倍以上 [29]、[57]。对于 AMD GPU，Multi2Sim 同时支持 AMD 的 GCN1 ISA，而 gem5-gpu 与 MGPU Sim 则能够仿真 GCN3 ISA [21]、[22]、[55]、[56]。上述仿真器均在持续不断地改进。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "7da46491e74a90187336b22923f84cd5", "index": 138, "aliyun_index": 1, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In general, CPU simulators can be categorized into many intersecting classes: application-level vs full-system, trace-driven vs execution-driven, functional execution vs timing execution [36]. Unlike GPU simulation, most CPU simulators must also account for the other components in a system besides the CPU itself, thus full-system simulation is often used [7], [47], [59]. In addition, due to the latency sensitive nature of CPU execution, CPU simulators often use the execution-driven and cycle-accurate approach for high accuracy [7], [47]. Thanks to the public PIN tool, fast instrumentation-based simulation can be used to feed the simulations as well [27], [34], [51]. To speed up simulation, parallelization, sampling, fast forwarding using virtualization, and checkpointing are often used [7], [51], [53], [59].  \n\n", "text": "In general, CPU simulators can be categorized into many intersecting classes: application-level vs full-system, trace-driven vs execution-driven, functional execution vs timing execution [36]. Unlike GPU simulation, most CPU simulators must also account for the other components in a system besides the CPU itself, thus full-system simulation is often used [7], [47], [59]. In addition, due to the latency sensitive nature of CPU execution, CPU simulators often use the execution-driven and cycle-accurate approach for high accuracy [7], [47]. Thanks to the public PIN tool, fast instrumentation-based simulation can be used to feed the simulations as well [27], [34], [51]. To speed up simulation, parallelization, sampling, fast forwarding using virtualization, and checkpointing are often used [7], [51], [53], [59].\n", "alignment": "left", "unique_id": "7da46491e74a90187336b22923f84cd5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In general, CPU simulators can be categorized into many intersecting classes: application-level vs full-system, trace-driven vs execution-driven, functional execution vs timing execution [36]. Unlike GPU simulation, most CPU simulators must also account for the other components in a system besides the CPU itself, thus full-system simulation is often used [7], [47], [59]. In addition, due to the latency sensitive nature of CPU execution, CPU simulators often use the execution-driven and cycle-accurate approach for high accuracy [7], [47]. Thanks to the public PIN tool, fast instrumentation-based simulation can be used to feed the simulations as well [27], [34], [51]. To speed up simulation, parallelization, sampling, fast forwarding using virtualization, and checkpointing are often used [7], [51], [53], [59]."}], "lineHeight": 0}}, "target": {"markdown": "一般而言，CPU 仿真器可被划分为多个相互交叉的类别：应用级与全系统级、踪迹驱动与执行驱动、功能执行与时序执行 [36]。与 GPU 仿真不同，大多数 CPU 仿真器还必须考虑系统中除 CPU 本身之外的其他组件，因此常采用全系统仿真 [7]、[47]、[59]。此外，由于 CPU 执行具有对延迟敏感的特性，CPU 仿真器通常采用执行驱动与周期精确相结合的方法以实现高精度 [7]、[47]。得益于公开的 PIN 工具，亦可采用基于插桩的快速仿真方式来为仿真器馈送负载 [27]、[34]、[51]。为了加速仿真过程，通常还会采用并行化、采样、利用虚拟化进行快速前向推进以及检查点等技术 [7]、[51]、[53]、[59]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "9cdb5c5453e254bd411104d8add977a4", "index": 139, "aliyun_index": 2, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "During the development of NVAS, we got a lot of help from and were inspired by the knowledge shared by the research community. In response, we are trying to share what we have learned back with the community by writing this paper and by collaborating with researchers building academic GPU simulators. In particular, we worked directly with the developers of Accel-Sim [29] to support them in the creation of Accel-Sim Tracer, a methodology which also uses NVBit to feed the simulator's new trace-driven execution mode.  \n\n", "text": "During the development of NVAS, we got a lot of help from and were inspired by the knowledge shared by the research community. In response, we are trying to share what we have learned back with the community by writing this paper and by collaborating with researchers building academic GPU simulators. In particular, we worked directly with the developers of Accel-Sim [29] to support them in the creation of Accel-Sim Tracer, a methodology which also uses NVBit to feed the simulator's new trace-driven execution mode.\n", "alignment": "left", "unique_id": "9cdb5c5453e254bd411104d8add977a4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "During the development of NVAS, we got a lot of help from and were inspired by the knowledge shared by the research community. In response, we are trying to share what we have learned back with the community by writing this paper and by collaborating with researchers building academic GPU simulators. In particular, we worked directly with the developers of Accel-Sim [29] to support them in the creation of Accel-Sim Tracer, a methodology which also uses NVBit to feed the simulator's new trace-driven execution mode."}], "lineHeight": 0}}, "target": {"markdown": "在 NVAS 的开发过程中，研究社区所分享的知识为我们提供了大量的帮助与启发。作为回馈，我们正尝试通过撰写本文以及与构建学术 GPU 仿真器的研究者合作等方式，将我们所获得的认识回馈给社区。具体而言，我们与 Accel-Sim [29] 的开发者们展开了直接合作，以协助其构建 Accel-Sim Tracer——一种同样利用 NVBit 来为该仿真器的新型踪迹驱动执行模式馈送负载的方法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "c4b1aa42336c52f57d41eaaaf01da1b9", "index": 140, "aliyun_index": 3, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## VII. Conclusion\n", "text": "VII. Conclusion\n", "alignment": "left", "unique_id": "c4b1aa42336c52f57d41eaaaf01da1b9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VII. Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "## VII. 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "b04f205c89bf9abfeaf1badbdc18defa", "index": 141, "aliyun_index": 4, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "In this paper, we share our experiences building a simulator that is fast enough to model large emerging (multi-)GPU workloads, while remaining accurate and trustworthy enough for the exploration of novel GPU designs within NVIDIA. NVArchSim has been successfully used for our internal GPU research across several different domains and continues to serve as our primary tool for future GPU systems research. NVAS is designed to augment, rather than to replace, more detailed simulation flows and is thus often the first tool used to explore a new idea, but rarely the last. NVArchSim remains under active development; we share our experiences thus far in the hopes that other system-level GPU simulators can learn from our observations and mistakes to further enhance the high-quality GPU research occurring in the architecture community.  \n\n", "text": "In this paper, we share our experiences building a simulator that is fast enough to model large emerging (multi-)GPU workloads, while remaining accurate and trustworthy enough for the exploration of novel GPU designs within NVIDIA. NVArchSim has been successfully used for our internal GPU research across several different domains and continues to serve as our primary tool for future GPU systems research. NVAS is designed to augment, rather than to replace, more detailed simulation flows and is thus often the first tool used to explore a new idea, but rarely the last. NVArchSim remains under active development; we share our experiences thus far in the hopes that other system-level GPU simulators can learn from our observations and mistakes to further enhance the high-quality GPU research occurring in the architecture community.\n", "alignment": "left", "unique_id": "b04f205c89bf9abfeaf1badbdc18defa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this paper, we share our experiences building a simulator that is fast enough to model large emerging (multi-)GPU workloads, while remaining accurate and trustworthy enough for the exploration of novel GPU designs within NVIDIA. NVArchSim has been successfully used for our internal GPU research across several different domains and continues to serve as our primary tool for future GPU systems research. NVAS is designed to augment, rather than to replace, more detailed simulation flows and is thus often the first tool used to explore a new idea, but rarely the last. NVArchSim remains under active development; we share our experiences thus far in the hopes that other system-level GPU simulators can learn from our observations and mistakes to further enhance the high-quality GPU research occurring in the architecture community."}], "lineHeight": 0}}, "target": {"markdown": "在本文中，我们分享了在构建一款仿真器过程中的经验：该仿真器具备足够快的速度，能够对新兴的（多）GPU 大型工作负载进行建模，同时又具备足够的准确性与可信度，能够在 NVIDIA 内部用于探索新颖的 GPU 设计。NVArchSim 已成功应用于我们在多个不同领域的内部 GPU 研究，并继续作为我们未来 GPU 系统研究的主要工具。NVAS 的设计初衷是对更为细节化的仿真流程进行补充而非取代，因此它往往是用于探索新想法的首选工具，却鲜少是最终的工具。NVArchSim 仍处于积极的开发之中；我们在此分享迄今为止的经验，希望其他系统级 GPU 仿真器能够从我们的观察与教训中有所借鉴，从而进一步推动架构社区中高质量 GPU 研究的发展。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "6d2eccbb08800c4844e082808097d2ae", "index": 142, "aliyun_index": 5, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## REFERENCES\n", "text": "REFERENCES\n", "alignment": "left", "unique_id": "6d2eccbb08800c4844e082808097d2ae", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "REFERENCES"}], "lineHeight": 0}}, "target": {"markdown": "## 参考文献\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "d0f04c30942f74158f4f53d2283c3cd9", "index": 143, "aliyun_index": 6, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "[1] N. Agarwal, D. Nellans, E. Ebrahimhi, T. F. Wenisch, J. Danskin, and S. W. Keckler, \"Selective GPU Caches to Eliminate CPU-GPU HW Cache Coherence,\" in *In function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){
  const cells = line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
  return cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()) || c.trim()==='');
}
function isPipeRow(line){ return /\|/.test(line); }
function rowCells(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
}
function tableHtml(rows){
  if (!rows.length) return '';
  let html = '<table><thead><tr>';
  for (const c of rowCells(rows[0])) html += `<th>${inlineMd(c)}</th>`;
  html += '</tr></thead><tbody>';
  const start = (rows.length>1 && isSepRow(rows[1])) ? 2 : 1;
  for (let i=start;i<rows.length;i++){
    if (isSepRow(rows[i])) continue;
    html += '<tr>';
    for (const c of rowCells(rows[i])) html += `<td>${inlineMd(c)}</td>`;
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){
  const slots = [];
  let raw = String(t||'');
  raw = raw.replace(/\$\$([\s\S]+?)\$\$/g, (_,m) => {
    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i].trim())){
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;
      }
      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*[-*•]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);
}

    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();
    if (!stack.length) root.push(node); else stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root;
}
function tocNodeHtml(node){
  const kids = node.children||[];
  const leaf = kids.length===0;
  const folded = foldedIds.has(node.block_id);
  return `<div class="toc-node lv${node.level}${folded?' folded':''}" data-bid="${esc(node.block_id)}">
    <div class="toc-row">
      <button type="button" class="toc-twist${leaf?' leaf':''}" data-fold="${esc(node.block_id)}" aria-expanded="${leaf? 'true': String(!folded)}">${leaf?'•':'▾'}</button>
      <a href="#${headingId(node.block_id)}" data-bid="${esc(node.block_id)}">${esc(node.title)}</a>
    </div>
    ${leaf?'':`<div class="toc-kids">${kids.map(tocNodeHtml).join('')}</div>`}
  </div>`;
}
function renderToc(){
  const box = document.getElementById('toc');
  const outline = DATA.outline || [];
  if (!outline.length){ box.innerHTML = '<div style="padding:8px 18px;color:#78716c">暂无目录</div>'; return; }
  box.innerHTML = outlineTree(outline).map(tocNodeHtml).join('');
}
function setNavFolded(on){
  document.body.classList.toggle('nav-folded', on);
  try { localStorage.setItem('pat-nav-folded', on ? '1' : '0'); } catch (e) {}
  const btn = document.getElementById('nav-toggle');
  if (btn) btn.title = on ? '展开目录' : '收起目录';
}
function pairRoles(){
  const first = compareFirst==='source' ? 'source' : 'target';
  return [first, first==='source' ? 'target' : 'source'];
}
function isListMd(md){
  const lines = String(md||'').split('\n').map(s => s.trim()).filter(Boolean);
  return lines.length>0 && lines.every(ln => /^[-*•]\s+/.test(ln));
}
function isCaptionType(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  return t==='figure_name' || t==='figure_note' || t==='table_name' || t==='table_note';
}
function isFigureType(p){ return ((p.source && p.source.type) || '')==='figure'; }
function isFencedCode(md){
  const lines = String(md||'').trim().split('\n');
  if (lines.length<2 || !lines[0].trim().startsWith('```')) return false;
  return lines.slice(1).some(ln => ln.trim().startsWith('```'));
}
function isImageOnlyMd(md){
  return String(md||'').replace(/!\[[^\]]*?\]\([^)]*?\)/g,'').replace(/<img\b[^>]*>/gi,'').trim()==='';
}
function isFormulaOnlyMd(md){
  const raw = String(md||'');
  const stripped = raw.replace(/\$\$[\s\S]*?\$\$/g,'').replace(/\\\[[\s\S]*?\\\]/g,'').trim();
  return raw.trim()!=='' && stripped==='';
}
function isSharedVisual(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  if (['figure','formula','equation','math','latex','code','codes'].includes(t)) return true;
  if ((p.target && p.target.status)==='skipped') return true;
  const src = ((p.source && p.source.markdown)||'').trim();
  const tgt = ((p.target && p.target.markdown)||'').trim();
  if (!tgt || src===tgt) return true;
  if (src && isImageOnlyMd(src)) return true;
  if (tgt && isImageOnlyMd(tgt)) return true;
  if (src && isFormulaOnlyMd(src)) return true;
  if (isFencedCode(src) || isFencedCode(tgt)) return true;
  return false;
}
function unitKindClass(p, md){
  if (isFigureType(p)) return ' is-figure';
  if (isCaptionType(p)) return ' is-caption';
  if (isListMd(md)) return ' is-list';
  return '';
}
function captionMd(md){
  return String(md||'').replace(/^\s*>\s?/gm, '').trim();
}
function markCaptionLabel(html){
  return html.replace(
    /(<p>)((?:图|表|Fig\.?|Figure|TABLE|Table|Listing|Listings|代码清单)\s*[0-9IVXLCDM]+[.:：]?\s*)/i,
    '$1<span class="cap-label">$2</span>'
  );
}
function chunkHtml(p, i, which, shared){
  const role = shared ? 'shared-line' : (which==='source' ? 'src-line' : 'tgt-line');
  let md = pickMd(p, which);
  let extra = shared ? ' is-shared' : '';
  if (isCaptionType(p)){
    extra += ' fig-caption';
    md = captionMd(md);
  } else if (isFigureType(p)){
    extra += ' fig-image';
  }
  let inner = mdToHtml(md);
  if (isCaptionType(p)) inner = markCaptionLabel(inner);
  return `<div class="pair-chunk ${role}${extra}" data-pair="${i}">${inner}</div>`;
}
function sharedWhich(){
  return compareFirst==='source' ? 'source' : 'target';
}
function editBtnHtml(i){
  return `<button type="button" class="unit-edit" data-edit="${i}" title="编辑此块">编辑</button>`;
}
function headingLevelOf(md){
  const m = String(md||'').trim().match(/^(#{1,6})\s+/);
  return m ? m[1].length : 2;
}
function stripHeadingMarks(md){
  const line = String(md||'').trim().split('\n')[0] || '';
  return line.replace(/^#{1,6}\s+/, '').trim();
}
function applyHeadingLevel(md, level){
  const lv = Math.max(1, Math.min(6, +level || 2));
  const lines = String(md||'').split('\n');
  const first = (lines[0] || '').replace(/^#{1,6}\s+/, '');
  const rest = lines.slice(1).join('\n');
  return '#'.repeat(lv) + ' ' + first + (rest ? '\n' + rest : '');
}
function rebuildOutline(){
  DATA.outline = DATA.pairs.map((p, idx) => {
    if ((p.source.type || '') !== 'title') return null;
    const src = stripHeadingMarks(p.source.markdown);
    const tgtMd = p.target.markdown || p.source.markdown;
    const tgt = stripHeadingMarks(tgtMd);
    return {
      block_id: p.source.block_id,
      level: Math.max(1, Math.min(4, headingLevelOf(tgtMd || p.source.markdown))),
      title: tgt || src,
      source_title: src,
      pair_index: idx
    };
  }).filter(Boolean);
}
function bindPairHover(root){
  root.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-pair]');
    if (!el) return;
    const id = el.getAttribute('data-pair');
    root.querySelectorAll('[data-pair]').forEach(n => {
      n.classList.toggle('pair-hot', n.getAttribute('data-pair')===id);
    });
  });
  root.addEventListener('mouseleave', () => {
    root.querySelectorAll('.pair-hot').forEach(n => n.classList.remove('pair-hot'));
  });
}
function renderArticle(){
  const list = document.getElementById('list');
  list.className = 'content';
  const wrap = document.createElement('div');
  if (viewMode!=='compare'){
    wrap.className = 'article';
    const which = viewMode==='parse' ? 'source' : 'target';
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p, which));
      return `<div class="pair-unit${kind}"${hid} data-pair="${i}">${editBtnHtml(i)}${chunkHtml(p,i,which)}</div>`;
    }).join('');
  } else if (compareLayout==='side'){
    wrap.className = 'article compare-side';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,'target')) || unitKindClass(p, pickMd(p,'source'));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit side-pair${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  } else {
    // 豆包/沉浸式翻译式：一段原文，紧跟一段译文。相同的图/代码只显示一份。
    wrap.className = 'article compare-stack';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,a)) || unitKindClass(p, pickMd(p,b));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  }
  list.innerHTML = '';
  list.appendChild(wrap);
  bindPairHover(wrap);
}
function render(){
  document.body.classList.toggle('show-edit', showEdit);
  const c = counts();
  document.getElementById('counts').textContent =
    `translated ${c.translated} · skipped ${c.skipped} · failed ${c.failed} · pending ${c.pending} · edited ${c.edited}`;
  document.getElementById('cmp').disabled = viewMode!=='compare';
  document.getElementById('layout').disabled = viewMode!=='compare';
  renderArticle();
}
function fillTypeSelect(current){
  const sel = document.getElementById('edit-type');
  const types = BLOCK_TYPES.slice();
  if (current && types.indexOf(current)<0) types.push(current);
  sel.innerHTML = types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = current || 'text';
}
function editorStateFromForm(){
  return {
    type: document.getElementById('edit-type').value,
    isTitle: document.getElementById('edit-is-title').checked,
    level: +document.getElementById('edit-level').value || 2,
    translate: document.getElementById('edit-translate').checked,
    source: document.getElementById('edit-src').value,
    target: document.getElementById('edit-tgt').value
  };
}
function syncTitleFields(){
  const isTitle = document.getElementById('edit-is-title').checked;
  document.getElementById('edit-level-wrap').hidden = !isTitle;
  if (isTitle) document.getElementById('edit-type').value = 'title';
}
function updateEditorPreview(){
  const st = editorStateFromForm();
  const fake = {source:{type: st.isTitle ? 'title' : st.type}};
  let src = st.source, tgt = st.target;
  if (isCaptionType(fake)){
    src = captionMd(src);
    tgt = captionMd(tgt);
  }
  let srcHtml = mdToHtml(src);
  let tgtHtml = mdToHtml(tgt);
  if (isCaptionType(fake)){
    srcHtml = markCaptionLabel(srcHtml);
    tgtHtml = markCaptionLabel(tgtHtml);
  }
  document.getElementById('edit-src-preview').innerHTML = srcHtml || '<p>（空）</p>';
  document.getElementById('edit-tgt-preview').innerHTML = tgtHtml || '<p>（空）</p>';
}
function openEditor(i){
  const p = DATA.pairs[i];
  if (!p) return;
  editingIndex = i;
  const src = p.source, tgt = p.target;
  const page = (src.page_num==null) ? '-' : (src.page_num + 1);
  document.getElementById('edit-title').textContent = '编辑块 ' + (src.block_id || ('#'+i));
  document.getElementById('edit-meta').textContent =
    `第 ${page} 页 · index ${src.index} · ${esc(tgt.status)}` +
    (tgt.skip_reason ? (' · ' + tgt.skip_reason) : '');
  fillTypeSelect(src.type || 'text');
  const isTitle = (src.type || '') === 'title';
  document.getElementById('edit-is-title').checked = isTitle;
  document.getElementById('edit-level').value = String(headingLevelOf(src.markdown || tgt.markdown));
  document.getElementById('edit-translate').checked = tgt.status !== 'skipped';
  document.getElementById('edit-src').value = src.markdown || '';
  document.getElementById('edit-tgt').value = tgt.markdown || '';
  document.getElementById('edit-propose').hidden = !(corpusRepo() && paperSlug());
  syncTitleFields();
  updateEditorPreview();
  editSnapshot = JSON.stringify(editorStateFromForm());
  document.getElementById('edit-modal').hidden = false;
  document.body.classList.add('modal-open');
  document.getElementById('edit-tgt').focus();
}
function closeEditor(){
  document.getElementById('edit-modal').hidden = true;
  document.body.classList.remove('modal-open');
  editingIndex = -1;
}
function editorDirty(){
  return JSON.stringify(editorStateFromForm()) !== editSnapshot;
}
function requestCloseEditor(){
  if (editorDirty() && !confirm('放弃未保存的修改？')) return;
  closeEditor();
}
function applyEditor(){
  if (editingIndex < 0) return;
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  const prevType = p.source.type || 'text';
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  let srcMd = st.source;
  let tgtMd = st.target;
  if (type === 'title'){
    srcMd = applyHeadingLevel(srcMd, st.level);
    if (String(tgtMd).trim()) tgtMd = applyHeadingLevel(tgtMd, st.level);
  }
  const srcChanged = srcMd !== (p.source.markdown || '');
  const tgtChanged = tgtMd !== (p.target.markdown || '');
  p.source.type = type;
  p.source.markdown = srcMd;
  if (srcChanged || type !== prevType) p.source.edited = true;
  p.target.markdown = tgtMd;
  if (!st.translate){
    p.target.status = 'skipped';
    if (!p.target.skip_reason) p.target.skip_reason = 'user';
  } else {
    if (p.target.status === 'skipped'){
      p.target.skip_reason = null;
      p.target.skip_kind = null;
      p.target.status = tgtMd.trim() ? (tgtChanged ? 'edited' : 'translated') : 'pending';
    }
    if (tgtChanged){
      p.target.edited = true;
      p.target.status = 'edited';
    }
  }
  rebuildOutline();
  closeEditor();
  const y = window.scrollY;
  render();
  renderToc();
  window.scrollTo(0, y);
  showToast('已改内存中的文档，请下载 JSON/HTML 保存');
}
function corpusRepo(){ return (DATA.corpus_repo || BOOT.corpus_repo || '').trim(); }
function paperSlug(){ return (DATA.paper_slug || BOOT.paper_slug || '').trim(); }
function patchFromEditor(){
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  const source = { markdown: st.source, type: type };
  const target = { markdown: st.target };
  const patch = {
    schema: 'pdf-agent-edit/v1',
    paper: paperSlug(),
    block_id: p.source.block_id,
    pair_index: editingIndex,
    action: st.translate ? 'replace' : 'skip',
    source: source,
    target: target,
    translate: st.translate,
    heading_level: st.isTitle ? st.level : null,
    before: {
      source: { markdown: p.source.markdown || '' },
      target: { markdown: p.target.markdown || '' }
    }
  };
  return patch;
}
function proposeEditor(){
  const repo = corpusRepo();
  const slug = paperSlug();
  if (!repo || !slug){
    showToast('未绑定语料仓，请下载 JSON 或手开 Issue');
    return;
  }
  const patch = patchFromEditor();
  const title = '[edit] ' + slug + ' ' + patch.block_id;
  const yaml = [
    '---',
    'schema: pdf-agent-edit/v1',
    'paper: ' + slug,
    'block_id: ' + patch.block_id,
    'pair_index: ' + String(patch.pair_index),
    'action: ' + patch.action,
    '---',
    '',
    '```json',
    JSON.stringify(patch, null, 2),
    '```',
    ''
  ].join('\n');
  const url = 'https://github.com/' + repo + '/issues/new?' + new URLSearchParams({
    title: title,
    body: yaml,
    labels: 'edit'
  }).toString();
  if (url.length > 7000){
    download((slug + '-' + patch.block_id + '.edit.json'),
      new Blob([JSON.stringify(patch, null, 2)], {type:'application/json'}));
    showToast('补丁太长，已下载 JSON，请新建 Issue 并粘贴');
    return;
  }
  window.open(url, '_blank', 'noopener');
}
document.getElementById('list').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-edit]');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  openEditor(+btn.getAttribute('data-edit'));
});
document.getElementById('toc').addEventListener('click', ev => {
  const twist = ev.target.closest('[data-fold]');
  if (twist && !twist.classList.contains('leaf')){
    ev.preventDefault();
    const id = twist.getAttribute('data-fold');
    if (foldedIds.has(id)) foldedIds.delete(id); else foldedIds.add(id);
    const node = twist.closest('.toc-node');
    if (node){
      node.classList.toggle('folded', foldedIds.has(id));
      twist.setAttribute('aria-expanded', String(!foldedIds.has(id)));
    }
    return;
  }
  const a = ev.target.closest('a');
  if (!a) return;
  ev.preventDefault();
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.toc a').forEach(x => x.classList.toggle('active', x===a));
});
document.getElementById('nav-toggle').addEventListener('click', () => {
  setNavFolded(!document.body.classList.contains('nav-folded'));
});
document.getElementById('nav-reopen').addEventListener('click', () => setNavFolded(false));
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
document.getElementById('mode').addEventListener('change', e => { viewMode = e.target.value; render(); });
document.getElementById('cmp').addEventListener('change', e => { compareFirst = e.target.value; render(); });
document.getElementById('layout').addEventListener('change', e => { compareLayout = e.target.value; render(); });
document.getElementById('show-edit').addEventListener('change', e => {
  showEdit = e.target.checked;
  document.body.classList.toggle('show-edit', showEdit);
});
['edit-src','edit-tgt','edit-type','edit-level','edit-is-title','edit-translate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditorPreview);
  document.getElementById(id).addEventListener('change', updateEditorPreview);
});
document.getElementById('edit-type').addEventListener('change', () => {
  document.getElementById('edit-is-title').checked = document.getElementById('edit-type').value === 'title';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-is-title').addEventListener('change', () => {
  if (document.getElementById('edit-is-title').checked) document.getElementById('edit-type').value = 'title';
  else if (document.getElementById('edit-type').value === 'title') document.getElementById('edit-type').value = 'text';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-save').addEventListener('click', applyEditor);
document.getElementById('edit-propose').addEventListener('click', proposeEditor);
document.getElementById('edit-cancel').addEventListener('click', requestCloseEditor);
document.getElementById('edit-close').addEventListener('click', requestCloseEditor);
document.getElementById('edit-backdrop').addEventListener('click', requestCloseEditor);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('edit-modal').hidden) return;
  ev.preventDefault();
  requestCloseEditor();
});
document.getElementById('dl-json').addEventListener('click', () => {
  download((DATA.source_pdf_name||'document')+'.translated.json',
    new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'}));
});
document.getElementById('dl-html').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  const script = clone.querySelector('#doc-data');
  if (script) script.textContent = JSON.stringify(DATA);
  download((DATA.source_pdf_name||'document')+'.html',
    new Blob(['<!DOCTYPE html>\n'+clone.outerHTML], {type:'text/html'}));
});
(function initPdfLink(){
  const a = document.getElementById('dl-pdf');
  if (!a) return;
  if (BOOT.has_source_pdf){
    a.hidden = false;
    a.setAttribute('href', BOOT.source_pdf_href || 'source.pdf');
    a.setAttribute('download', BOOT.source_pdf_name || 'source.pdf');
  } else {
    a.remove();
  }
})();
try { if (localStorage.getItem('pat-nav-folded')==='1') setNavFolded(true); } catch (e) {}
renderToc();
render();
</script>
