 "| 测试套件 | 总计 | 确定性 | 简单自旋循环 | 复杂自旋循环 | 其他非确定性 |\n| --- | --- | --- | --- | --- | --- |\n| Microbench | 58 | 58 | 0 | 0 | 0 |\n| Rodinia | 17 | 17 | 0 | 0 | 0 |\n| Polybench | 10 | 10 | 0 | 0 | 0 |\n| Industry HPC | 204 | 187 | 5 | 8 | 4 |\n| CUBLAS | 35 | 31 | 4 | 0 | 0 |\n| CUTLASS | 410 | 410 | 0 | 0 | 0 |\n| Deepbench | 548 | 218 | 330 | 0 | 0 |\n| MLPerf | 24 | 8 | 8 | 0 | 8 |", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "efcccafbe8695f2bdc2f72e4dad4ab1e", "index": 55, "aliyun_index": 8, "page_num": 4, "type": "table_note", "sub_type": "none", "markdown": ">TABLE I: Sources of non-determinism (“non-det.”) in our library. Workloads with more than one form of non-determinism are placed into the rightmost applicable category.  \n\n", "text": "TABLE I: Sources of non-determinism (“non-det.”) in our library. Workloads with more than one form of non-determinism are placed into the rightmost applicable category.\n", "alignment": "left", "unique_id": "efcccafbe8695f2bdc2f72e4dad4ab1e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TABLE I: Sources of non-determinism (“non-det.”) in our library. Workloads with more than one form of non-determinism are placed into the rightmost applicable category."}], "lineHeight": 0}}, "target": {"markdown": "> 表 I：本研究测试库中各类非确定性（\"非确定性\"）的来源。同时存在多种非确定性的工作负载被归入最右侧适用的类别。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "2c6c38a4db15aad25c805067a5ff362a", "index": 56, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "of SASS instructions (and virtual addresses accessed) executed\nby each of the 800 logical warps$^1$.  \n\n", "text": "of SASS instructions (and virtual addresses accessed) executed\nby each of the 800 logical warps$^1$.\n", "alignment": "left", "unique_id": "2c6c38a4db15aad25c805067a5ff362a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of SASS instructions (and virtual addresses accessed) executed"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "by each of the 800 logical warps$^1$."}], "lineHeight": -59}}, "target": {"markdown": "每个逻辑 warp 所执行的 SASS 指令（以及所访问的虚拟地址）的相应若干路流$^{1}$。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "3651f3660a063776b5da64781b62bdae", "index": 57, "aliyun_index": 10, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Several layers of compression in the format, based on similarities of executed instruction sequences and addresses (within warps and kernel invocations), combined with a brute force binary compression, enable very compact traces with a typical average size of less than 1 Byte for each warp level instruction (including all virtual memory addresses if present). On top of this, an indexing layer allows fast traversal (i.e., $O(1)$) of individual warp instruction streams, independent of other executing warps. This is necessary because while the order of instructions within a logical warp will not change during replay, the relative order in which independent warps make forward progress is based on the properties of the simulated GPU. For example, a GPU containing 100 SMs, each with 32 warp slots, will execute the stream of warps in a grossly different order than another GPU comprising a single SM with only 8 warp slots.  \n\n", "text": "Several layers of compression in the format, based on similarities of executed instruction sequences and addresses (within warps and kernel invocations), combined with a brute force binary compression, enable very compact traces with a typical average size of less than 1 Byte for each warp level instruction (including all virtual memory addresses if present). On top of this, an indexing layer allows fast traversal (i.e., $O(1)$) of individual warp instruction streams, independent of other executing warps. This is necessary because while the order of instructions within a logical warp will not change during replay, the relative order in which independent warps make forward progress is based on the properties of the simulated GPU. For example, a GPU containing 100 SMs, each with 32 warp slots, will execute the stream of warps in a grossly different order than another GPU comprising a single SM with only 8 warp slots.\n", "alignment": "left", "unique_id": "3651f3660a063776b5da64781b62bdae", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Several layers of compression in the format, based on similarities of executed instruction sequences and addresses (within warps and kernel invocations), combined with a brute force binary compression, enable very compact traces with a typical average size of less than 1 Byte for each warp level instruction (including all virtual memory addresses if present). On top of this, an indexing layer allows fast traversal (i.e., $O(1)$) of individual warp instruction streams, independent of other executing warps. This is necessary because while the order of instructions within a logical warp will not change during replay, the relative order in which independent warps make forward progress is based on the properties of the simulated GPU. For example, a GPU containing 100 SMs, each with 32 warp slots, will execute the stream of warps in a grossly different order than another GPU comprising a single SM with only 8 warp slots."}], "lineHeight": 0}}, "target": {"markdown": "该格式在多层压缩的基础上，进一步结合了暴力二进制压缩技术——压缩利用了所执行指令序列与地址之间（warp 内及内核调用间）的相似性——从而生成极为紧凑的追踪文件，warp 级指令的典型平均大小不足 1 字节（包含所有虚拟内存地址，若存在）。在此之上，还增设了一层索引机制，允许以 $O(1)$ 的时间复杂度快速遍历单个 warp 的指令流，且与其他正在执行的 warp 相互独立。这一点之所以必要，是因为虽然同一逻辑 warp 内部的指令顺序在重放过程中不会改变，但各独立 warp 推进执行的相对顺序则取决于被仿真 GPU 的硬件配置属性。例如，一个包含 100 个 SM、每个 SM 拥有 32 个 warp 槽位的 GPU，与一个仅包含单个 SM 且仅有 8 个 warp 槽位的 GPU 相比，二者在执行 warp 流时的整体顺序会有巨大差异。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "2f7aa67fdad12515a217424bd4d0733b", "index": 58, "aliyun_index": 11, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "### D. Supporting Hybrid Trace and Execution Simulation\n", "text": "D. Supporting Hybrid Trace and Execution Simulation\n", "alignment": "left", "unique_id": "2f7aa67fdad12515a217424bd4d0733b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "D. Supporting Hybrid Trace and Execution Simulation"}], "lineHeight": 0}}, "target": {"markdown": "### D. 支持追踪与执行混合仿真\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "88bdc52d8313f234b08fae1ed39ddc95", "index": 59, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "One well established issue with trace-based simulation is that non-deterministic workloads cannot be accurately modeled. There can be many reasons why non-deterministic GPU executions may differ from run to run, including (but not limited to) producer/consumer synchronization, in-memory spinloops, etc. For all these cases, capturing one particular execution of an application may not be representative of the application behavior across many executions.  \n\n", "text": "One well established issue with trace-based simulation is that non-deterministic workloads cannot be accurately modeled. There can be many reasons why non-deterministic GPU executions may differ from run to run, including (but not limited to) producer/consumer synchronization, in-memory spinloops, etc. For all these cases, capturing one particular execution of an application may not be representative of the application behavior across many executions.\n", "alignment": "left", "unique_id": "88bdc52d8313f234b08fae1ed39ddc95", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One well established issue with trace-based simulation is that non-deterministic workloads cannot be accurately modeled. There can be many reasons why non-deterministic GPU executions may differ from run to run, including (but not limited to) producer/consumer synchronization, in-memory spinloops, etc. For all these cases, capturing one particular execution of an application may not be representative of the application behavior across many executions."}], "lineHeight": 0}}, "target": {"markdown": "基于追踪的仿真中一个公认的问题是：无法对非确定性工作负载进行精确建模。GPU 执行中的非确定性可能由多种原因引起，包括（但不限于）生产者/消费者同步、内存中的自旋循环等。对于所有这些情形，捕获应用程序的某一次特定执行，可能无法代表该应用程序在多次执行中所表现出的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "347bc17577b9bbcc7a52782979c6e175", "index": 60, "aliyun_index": 13, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "*Classifying GPU Workload Non-Determinism:* Table I summarizes the causes of non-determinism we observe in our application library into several categories. While most applications remain deterministic, some application suites have a  \n\n", "text": "*Classifying GPU Workload Non-Determinism:* Table I summarizes the causes of non-determinism we observe in our application library into several categories. While most applications remain deterministic, some application suites have a\n", "alignment": "left", "unique_id": "347bc17577b9bbcc7a52782979c6e175", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "*Classifying GPU Workload Non-Determinism:* Table I summarizes the causes of non-determinism we observe in our application library into several categories. While most applications remain deterministic, some application suites have a"}], "lineHeight": 0}}, "target": {"markdown": "*对 GPU 工作负载非确定性的分类：* 表 I 将我们观测到的应用程序库中各类非确定性的成因归纳为若干类别。虽然大多数应用程序保持确定性，但部分应用程序套件具有……", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "8c16d0dae4a5a8a866116698b36ccf05", "index": 61, "aliyun_index": 14, "page_num": 4, "type": "corner_note", "sub_type": "none", "markdown": ">$^{1}$A 256-thread thread block consists of eight 32-thread warps, so 100 thread blocks contain 800 logical warps.  \n\n", "text": "$^{1}$A 256-thread thread block consists of eight 32-thread warps, so 100 thread blocks contain 800 logical warps.\n", "alignment": "left", "unique_id": "8c16d0dae4a5a8a866116698b36ccf05", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$^{1}$A 256-thread thread block consists of eight 32-thread warps, so 100 thread blocks contain 800 logical warps."}], "lineHeight": 0}}, "target": {"markdown": ">$^{1}$一个 256 线程的线程块由 8 个 32 线程的 warp 组成，因此 100 个线程块共包含 800 个逻辑 warp。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "249401ae810feecc5c557382fd32d2af", "index": 62, "aliyun_index": 0, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "large number of workloads that contain what we call \"simple\" spinloops (e.g., patterns consisting of an easily identifiable \"load, compare, branch\" sequence). A much smaller set of applications contain \"complex\" spinloops that perform extra integer or floating-point calculations within the loop. Finally, a few applications contain enough sources of non-determinism such that non-trivial portions of the application are executed differently across successive executions on real GPUs. Because applications can be composed of many kernels (of which some may be deterministic and others non-deterministic), we classify applications into each category if at least one of its invoked kernels falls in that category. For instance, MLPPerf has 8 traces that are classified as \"Other Non-Determinism\" although they primarily contain just simple spinloops.  \n\n", "text": "large number of workloads that contain what we call \"simple\" spinloops (e.g., patterns consisting of an easily identifiable \"load, compare, branch\" sequence). A much smaller set of applications contain \"complex\" spinloops that perform extra integer or floating-point calculations within the loop. Finally, a few applications contain enough sources of non-determinism such that non-trivial portions of the application are executed differently across successive executions on real GPUs. Because applications can be composed of many kernels (of which some may be deterministic and others non-deterministic), we classify applications into each category if at least one of its invoked kernels falls in that category. For instance, MLPPerf has 8 traces that are classified as \"Other Non-Determinism\" although they primarily contain just simple spinloops.\n", "alignment": "left", "unique_id": "249401ae810feecc5c557382fd32d2af", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "large number of workloads that contain what we call \"simple\" spinloops (e.g., patterns consisting of an easily identifiable \"load, compare, branch\" sequence). A much smaller set of applications contain \"complex\" spinloops that perform extra integer or floating-point calculations within the loop. Finally, a few applications contain enough sources of non-determinism such that non-trivial portions of the application are executed differently across successive executions on real GPUs. Because applications can be composed of many kernels (of which some may be deterministic and others non-deterministic), we classify applications into each category if at least one of its invoked kernels falls in that category. For instance, MLPPerf has 8 traces that are classified as \"Other Non-Determinism\" although they primarily contain just simple spinloops."}], "lineHeight": 0}}, "target": {"markdown": "大量工作负载包含我们所称的\"简单\"自旋循环（例如，由易于识别的\"加载、比较、分支\"序列构成的模式）。另有数量少得多的一组应用程序包含\"复杂\"自旋循环，这类循环在循环体内还会执行额外的整数或浮点运算。最后，少数应用程序包含足够多的非确定性来源，以至于在真实 GPU 上的多次连续执行中，应用中的相当一部分会以不同的方式执行。由于应用程序可能由多个内核构成（其中部分内核是确定性的，而其他则是非确定性的），只要其所调用的内核中至少有一个属于某一类别，我们便将该应用程序归入该类别。例如，MLPerf 中有 8 个追踪虽主要仅包含简单自旋循环，但仍被归类为\"其他非确定性\"。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "d8c9617e3b44b69d46d802bcee6254a5", "index": 63, "aliyun_index": 1, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "With an understanding of the sources of non-determinism across a wide range of GPU applications we chose to add support for simple spinloop detection and execution within NVAS as shown in Figure 4. The use of in memory spinloops is becoming more common on GPUs typically to support inter-CTA synchronization patterns, such as reductions. In addition, application suites such as LoneStarGPU [9] and HeteroSync [54] are specifically dedicated to studying more advanced forms of synchronization patterns and irregularities. As the importance of these applications grows in the marketplace, we will have to re-evaluate, extend, and perhaps alter the NVAS approach to for handling complex non-deterministic applications.  \n\n", "text": "With an understanding of the sources of non-determinism across a wide range of GPU applications we chose to add support for simple spinloop detection and execution within NVAS as shown in Figure 4. The use of in memory spinloops is becoming more common on GPUs typically to support inter-CTA synchronization patterns, such as reductions. In addition, application suites such as LoneStarGPU [9] and HeteroSync [54] are specifically dedicated to studying more advanced forms of synchronization patterns and irregularities. As the importance of these applications grows in the marketplace, we will have to re-evaluate, extend, and perhaps alter the NVAS approach to for handling complex non-deterministic applications.\n", "alignment": "left", "unique_id": "d8c9617e3b44b69d46d802bcee6254a5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With an understanding of the sources of non-determinism across a wide range of GPU applications we chose to add support for simple spinloop detection and execution within NVAS as shown in Figure 4. The use of in memory spinloops is becoming more common on GPUs typically to support inter-CTA synchronization patterns, such as reductions. In addition, application suites such as LoneStarGPU [9] and HeteroSync [54] are specifically dedicated to studying more advanced forms of synchronization patterns and irregularities. As the importance of these applications grows in the marketplace, we will have to re-evaluate, extend, and perhaps alter the NVAS approach to for handling complex non-deterministic applications."}], "lineHeight": 0}}, "target": {"markdown": "在深入理解了各类 GPU 应用程序中非确定性来源的基础上，我们决定在 NVAS 中加入对简单自旋循环的检测与执行支持，如图 4 所示。内存中的自旋循环在 GPU 上正变得越来越常见，通常用于支持诸如规约之类的跨 CTA 同步模式。此外，LoneStarGPU [9] 和 HeteroSync [54] 等应用套件则专门致力于研究更为高级的同步模式与不规则性。随着这些应用在市场上日趋重要，我们将不得不重新评估、扩展乃至改变 NVAS 处理复杂非确定性应用程序的方法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "2af37dfc760d50ac31aa7d6603ce827f", "index": 64, "aliyun_index": 2, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Functional Execution of Spinloops Within a Trace: Spinloop non-determinism can have a large impact on simulated GPU performance because of the overheads incurred during trace collection on real GPUs. Specifically, the relative number of program instructions spent executing the spinloop can increase many orders of magnitude due to a consuming thread waiting on a producer thread that is executing additional instructions, e.g., due to instrumentation overhead during the trace generation process. Consequently, we have considered two ways for NVAS to support applications containing spinloops.  \n\n", "text": "Functional Execution of Spinloops Within a Trace: Spinloop non-determinism can have a large impact on simulated GPU performance because of the overheads incurred during trace collection on real GPUs. Specifically, the relative number of program instructions spent executing the spinloop can increase many orders of magnitude due to a consuming thread waiting on a producer thread that is executing additional instructions, e.g., due to instrumentation overhead during the trace generation process. Consequently, we have considered two ways for NVAS to support applications containing spinloops.\n", "alignment": "left", "unique_id": "2af37dfc760d50ac31aa7d6603ce827f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Functional Execution of Spinloops Within a Trace: Spinloop non-determinism can have a large impact on simulated GPU performance because of the overheads incurred during trace collection on real GPUs. Specifically, the relative number of program instructions spent executing the spinloop can increase many orders of magnitude due to a consuming thread waiting on a producer thread that is executing additional instructions, e.g., due to instrumentation overhead during the trace generation process. Consequently, we have considered two ways for NVAS to support applications containing spinloops."}], "lineHeight": 0}}, "target": {"markdown": "在追踪中功能性地执行自旋循环：自旋循环带来的非确定性可能对仿真 GPU 的性能产生巨大影响，原因在于在真实 GPU 上进行追踪采集时会产生额外的开销。具体而言，由于消费线程需要等待正在执行额外指令的生产线程（例如，由于追踪生成过程中插桩所产生的开销），用于执行自旋循环的程序指令的相对数量可能会增加若干个数量级。为此，我们考虑了两种 NVAS 支持含自旋循环应用程序的方法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "0d1f5d034e1853c884f225b0b50058c0", "index": 65, "aliyun_index": 3, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The first is to simply identify and fast-forward simulations through these overly repetitive spinloop sequences. We have found this technique a useful and accurate representation of hardware execution when simulating applications where the spinloop itself is used strictly as a performance optimization, designed to align the execution phases of different warps to avoid hardware resource contention. In these cases, despite changing the trace SASS semantics, the approach is sufficiently representative from the broad application perspective.  \n\n", "text": "The first is to simply identify and fast-forward simulations through these overly repetitive spinloop sequences. We have found this technique a useful and accurate representation of hardware execution when simulating applications where the spinloop itself is used strictly as a performance optimization, designed to align the execution phases of different warps to avoid hardware resource contention. In these cases, despite changing the trace SASS semantics, the approach is sufficiently representative from the broad application perspective.\n", "alignment": "left", "unique_id": "0d1f5d034e1853c884f225b0b50058c0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The first is to simply identify and fast-forward simulations through these overly repetitive spinloop sequences. We have found this technique a useful and accurate representation of hardware execution when simulating applications where the spinloop itself is used strictly as a performance optimization, designed to align the execution phases of different warps to avoid hardware resource contention. In these cases, despite changing the trace SASS semantics, the approach is sufficiently representative from the broad application perspective."}], "lineHeight": 0}}, "target": {"markdown": "第一种方法是对这些过度重复的自旋循环序列进行简单识别，并在仿真中快速跳过。我们发现，在仿真那些纯粹将自旋循环用作性能优化（旨在对齐不同 warp 的执行阶段以避免硬件资源争用）的应用程序时，该技术能够对硬件执行进行有用且准确的近似表示。在这些情形下，尽管改变了追踪的 SASS 语义，但从宏观的应用视角来看，该方法仍然具有足够的代表性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "47da6ef0d99dcaceb4d25e0350ae56ec", "index": 66, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The second and more general-purpose approach of *partial functional execution* allows NVAS to simulate spinloops without violating functional correctness. In brief, this involves building a small GPU execution engine that can functionally execute a limited subset (less than 1%) of GPU instructions within NVAS. This approach requires two primary tasks: identifying the instructions that require simulation and supporting their execution in the simulator.  \n\n", "text": "The second and more general-purpose approach of *partial functional execution* allows NVAS to simulate spinloops without violating functional correctness. In brief, this involves building a small GPU execution engine that can functionally execute a limited subset (less than 1%) of GPU instructions within NVAS. This approach requires two primary tasks: identifying the instructions that require simulation and supporting their execution in the simulator.\n", "alignment": "left", "unique_id": "47da6ef0d99dcaceb4d25e0350ae56ec", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The second and more general-purpose approach of *partial functional execution* allows NVAS to simulate spinloops without violating functional correctness. In brief, this involves building a small GPU execution engine that can functionally execute a limited subset (less than 1%) of GPU instructions within NVAS. This approach requires two primary tasks: identifying the instructions that require simulation and supporting their execution in the simulator."}], "lineHeight": 0}}, "target": {"markdown": "第二种更为通用的方法是*部分功能性执行*，它允许 NVAS 在不违反功能正确性的前提下对自旋循环进行仿真。简而言之，该方法需要在 NVAS 内部构建一个小型 GPU 执行引擎，使其能够功能性地执行 GPU 指令的一个有限子集（不足 1%）。该方法涉及两项主要任务：识别需要进行仿真的指令，以及在仿真器中支持这些指令的执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "3cd1a8ae67d4a737b578bad34931454d", "index": 67, "aliyun_index": 5, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "To identify the set of instructions in a GPU execution that  \n\n", "text": "To identify the set of instructions in a GPU execution that\n", "alignment": "left", "unique_id": "3cd1a8ae67d4a737b578bad34931454d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To identify the set of instructions in a GPU execution that"}], "lineHeight": 0}}, "target": {"markdown": "为了识别 GPU 执行过程中的一组指令", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "23aadc4a63492d004a9e69635bfed128", "index": 68, "aliyun_index": 6, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![23aadc4a63492d004a9e69635bfed128.jpeg](figures/23aadc4a63492d004a9e69635bfed128_de1c9a2b.png)  \n\n", "text": "GPU application\n       │\n       ├─→ [Profiling] → spinloop instruction histogram\n       └─→ [Tracing]   → GPU trace\n                             │\n                             ▼\n                     Simulated by NVArchsim\n                             │\n                             ├──→ Trace replay\n                             ├──→ Functional execution (on spinloop instrs)\n                             └──→ Trace replay\n                             │\n                             ▼\n                      Simulation results\n\n\n\n---\n\n## Key Tools & Components Mentioned\n\n| Component             | Type / Role                          |\n|-----------------------|--------------------------------------|\n| NVBit                 | Binary instrumentation framework     |\n| spinloop finder       | NVBit-based profiler                 |\n| NVTracer              | Tracing tool                         |\n| NVArchsim             | Architecture simulator               |\n| spinloop instrs       | Instructions identified as part of spinloops; only their operands are functionally executed |\n| non-spinloop instrs   | Regular instructions; replayed without functional simulation |\n\n---\n\nThis workflow enables efficient yet accurate simulation of GPU applications containing spinloops by selectively applying expensive functional simulation only where necessary (i.e., on spinloop operand instructions), while replaying the rest for state consistency.\n\n--- \n\n✅ All elements from the diagram have been captured in structured Markdown format, preserving hierarchy, color-coded emphasis (via text description), and directional flow.", "alignment": "left", "unique_id": "23aadc4a63492d004a9e69635bfed128", "edited": false, "extra": {}}, "target": {"markdown": "![23aadc4a63492d004a9e69635bfed128.jpeg](figures/23aadc4a63492d004a9e69635bfed128_de1c9a2b.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "787b176917cfff58f81388b9cf50d4e1", "index": 69, "aliyun_index": 7, "page_num": 5, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 4: The NVAS partial execution workflow where operand values are recorded in the trace during non-deterministic regions, then used for functional execution during simulation.  \n\n", "text": "Fig. 4: The NVAS partial execution workflow where operand values are recorded in the trace during non-deterministic regions, then used for functional execution during simulation.\n", "alignment": "left", "unique_id": "787b176917cfff58f81388b9cf50d4e1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 4: The NVAS partial execution workflow where operand values are recorded in the trace during non-deterministic regions, then used for functional execution during simulation."}], "lineHeight": 0}}, "target": {"markdown": ">图 4：NVAS 部分执行工作流，在非确定性区域中将操作数值记录在追踪中，然后在仿真期间用于功能性执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "e5ee1056a50cd973493ad86b8b04038f", "index": 70, "aliyun_index": 8, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "need to be functionally executed, we perform the following\nsteps. First, we instrument the binary and run the applica-\ntion multiple times on real hardware and for each execution\ngenerate a histogram of the executed instructions counts per\nprogram counter. An example is shown in Figure 5 where for\neach instruction in the disassembled binary, the number of\ntimes that instruction was executed in that particular program\nexecution, is annotated on the right. If the instruction counts\nare identical across multiple executions, we consider them\ndeterministic$^2$. If there are differences in instruction count,\nthe histograms identify the subset of instructions that are\nresponsible for the workload nondeterminism.  \n\n", "text": "need to be functionally executed, we perform the following\nsteps. First, we instrument the binary and run the applica-\ntion multiple times on real hardware and for each execution\ngenerate a histogram of the executed instructions counts per\nprogram counter. An example is shown in Figure 5 where for\neach instruction in the disassembled binary, the number of\ntimes that instruction was executed in that particular program\nexecution, is annotated on the right. If the instruction counts\nare identical across multiple executions, we consider them\ndeterministic$^2$. If there are differences in instruction count,\nthe histograms identify the subset of instructions that are\nresponsible for the workload nondeterminism.\n", "alignment": "left", "unique_id": "e5ee1056a50cd973493ad86b8b04038f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "need to be functionally executed, we perform the following"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "steps. First, we instrument the binary and run the applica-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tion multiple times on real hardware and for each execution"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "generate a histogram of the executed instructions counts per"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "program counter. An example is shown in Figure 5 where for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "each instruction in the disassembled binary, the number of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "times that instruction was executed in that particular program"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "execution, is annotated on the right. If the instruction counts"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "are identical across multiple executions, we consider them"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "deterministic$^2$. If there are differences in instruction count,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the histograms identify the subset of instructions that are"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "responsible for the workload nondeterminism."}], "lineHeight": -347}}, "target": {"markdown": "需要执行功能仿真的指令，我们采用以下步骤。首先，我们对二进制文件进行插桩，并在真实硬件上多次运行该应用程序，针对每次执行生成一份按程序计数器统计的指令执行次数直方图。如图 5 所示，示例中针对反汇编二进制中的每一条指令，在其右侧标注了在该次程序执行中该指令被执行的次数。如果多次执行之间的指令次数完全一致，我们则认为这些指令是确定性的<sup>2</sup>。如果指令次数存在差异，则该直方图能够识别出导致工作负载非确定性的那一部分指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "942d0cf2fac70d3e8438e0503719c4b4", "index": 71, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "After we have identified one or more of these regions, we then perform a trace analysis to identify other instructions that access the same memory address(es) as the memory instructions contained within the spinloop(s). This is necessary to ensure that we can capture the production of the value the spinloop is waiting on, even if the producer instruction is executed a deterministic number of times. After this analysis is completed, we have identified all the instructions that need to be functional emulated. With this information in hand, we then retrace the application while also recording all register and predicate operands for the identified instructions, including the initial state of the memory locations accessed by them.  \n\n", "text": "After we have identified one or more of these regions, we then perform a trace analysis to identify other instructions that access the same memory address(es) as the memory instructions contained within the spinloop(s). This is necessary to ensure that we can capture the production of the value the spinloop is waiting on, even if the producer instruction is executed a deterministic number of times. After this analysis is completed, we have identified all the instructions that need to be functional emulated. With this information in hand, we then retrace the application while also recording all register and predicate operands for the identified instructions, including the initial state of the memory locations accessed by them.\n", "alignment": "left", "unique_id": "942d0cf2fac70d3e8438e0503719c4b4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "After we have identified one or more of these regions, we then perform a trace analysis to identify other instructions that access the same memory address(es) as the memory instructions contained within the spinloop(s). This is necessary to ensure that we can capture the production of the value the spinloop is waiting on, even if the producer instruction is executed a deterministic number of times. After this analysis is completed, we have identified all the instructions that need to be functional emulated. With this information in hand, we then retrace the application while also recording all register and predicate operands for the identified instructions, including the initial state of the memory locations accessed by them."}], "lineHeight": 0}}, "target": {"markdown": "在识别出一个或多个此类区域之后，我们进一步执行追踪分析，以识别其他访问与自旋循环内所含内存指令相同内存地址的指令。这一点很有必要，因为只有这样才能确保即使生成端指令以确定性次数执行，我们也能够捕获到自旋循环所等待的值的产生过程。在该分析完成之后，我们便已识别出所有需要进行功能性仿真的指令。在掌握这些信息之后，我们重新追踪该应用程序，同时记录所识别指令的所有寄存器操作数和谓词操作数，包括由它们所访问的内存位置的初始状态。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "0e2dcf413bf1679c870149ee1f59759b", "index": 72, "aliyun_index": 10, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "To execute the functional instructions recorded in NVAS' operand-augmented trace, we made the following changes to NVAS. First, we enhanced the SM to support the functional execution of a very limited number of instructions. Second, we extended the memory hierarchy capability to allow the passing of values contained at labeled memory locations throughout the simulated memory hierarchy. Finally, we modified the trace reading component of NVAS to detect the presence of instructions that need to be functionally simulated and to initialize the appropriate source register and predicate values based on the values listed in the augmented trace file.  \n\n", "text": "To execute the functional instructions recorded in NVAS' operand-augmented trace, we made the following changes to NVAS. First, we enhanced the SM to support the functional execution of a very limited number of instructions. Second, we extended the memory hierarchy capability to allow the passing of values contained at labeled memory locations throughout the simulated memory hierarchy. Finally, we modified the trace reading component of NVAS to detect the presence of instructions that need to be functionally simulated and to initialize the appropriate source register and predicate values based on the values listed in the augmented trace file.\n", "alignment": "left", "unique_id": "0e2dcf413bf1679c870149ee1f59759b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To execute the functional instructions recorded in NVAS' operand-augmented trace, we made the following changes to NVAS. First, we enhanced the SM to support the functional execution of a very limited number of instructions. Second, we extended the memory hierarchy capability to allow the passing of values contained at labeled memory locations throughout the simulated memory hierarchy. Finally, we modified the trace reading component of NVAS to detect the presence of instructions that need to be functionally simulated and to initialize the appropriate source register and predicate values based on the values listed in the augmented trace file."}], "lineHeight": 0}}, "target": {"markdown": "要在 NVAS 的带操作数追踪中执行所记录的功能性指令，我们对 NVAS 作出了如下修改。首先，我们对 SM 进行了增强，使其能够支持非常有限的一组指令的功能性执行。其次，我们扩展了存储层次结构的能力，使其能够在整个仿真存储层次结构中传递标注内存位置所包含的值。最后，我们修改了 NVAS 的追踪读取组件，使其能够检测出需要进行功能性仿真的指令，并根据扩充追踪文件中列出的值来初始化相应的源寄存器与谓词值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "a151cc275a595194e317924522623da6", "index": 73, "aliyun_index": 11, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "When NVAS encounters an instruc down": "We evaluate NVAS on the wide range of benchmarks shown in Table II. This suite includes commonly used academic benchmark suites such as Rodinia [13], [14] and Polybench [19], internal microbenchmarks and HPC workload traces, and modern machine learning workloads such as CUBLAS routines [40], CUTLASS [39], Deepbench [5], and MLPPerf v0.6 inference and training [35], [49]. For MLPPerf, we use the spinloop simulation technique discussed in Section III-D. As mentioned earlier, we continue to actively add increased support for other non-deterministic workloads on a case-by-case basis. We validate the results against the NVIDIA Tesla GV100 SXM2 GPU described in Table III.  \n\n", "text": "We evaluate NVAS on the wide range of benchmarks shown in Table II. This suite includes commonly used academic benchmark suites such as Rodinia [13], [14] and Polybench [19], internal microbenchmarks and HPC workload traces, and modern machine learning workloads such as CUBLAS routines [40], CUTLASS [39], Deepbench [5], and MLPPerf v0.6 inference and training [35], [49]. For MLPPerf, we use the spinloop simulation technique discussed in Section III-D. As mentioned earlier, we continue to actively add increased support for other non-deterministic workloads on a case-by-case basis. We validate the results against the NVIDIA Tesla GV100 SXM2 GPU described in Table III.\n", "alignment": "left", "unique_id": "0eb3af9c5599ca2d774cf63bc63bc58e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We evaluate NVAS on the wide range of benchmarks shown in Table II. This suite includes commonly used academic benchmark suites such as Rodinia [13], [14] and Polybench [19], internal microbenchmarks and HPC workload traces, and modern machine learning workloads such as CUBLAS routines [40], CUTLASS [39], Deepbench [5], and MLPPerf v0.6 inference and training [35], [49]. For MLPPerf, we use the spinloop simulation technique discussed in Section III-D. As mentioned earlier, we continue to actively add increased support for other non-deterministic workloads on a case-by-case basis. We validate the results against the NVIDIA Tesla GV100 SXM2 GPU described in Table III."}], "lineHeight": 0}}, "target": {"markdown": "我们在表 II 所示的各类基准测试上对 NVAS 进行了评估。该测试套件包括常用的学术基准测试套件，例如 Rodinia [13]、[14] 和 Polybench [19]，以及内部微基准测试和 HPC 工作负载追踪，还包括现代机器学习工作负载，例如 CUBLAS 例程 [40]、CUTLASS [39]、Deepbench [5] 以及 MLPPerf v0.6 的推理与训练 [35]、[49]。对于 MLPPerf，我们采用第 III-D 节中讨论的自旋循环仿真技术。如前所述，我们会持续以个案方式不断增加对其他非确定性工作负载的支持。我们将结果与表 III 中所描述的 NVIDIA Tesla GV100 SXM2 GPU 进行了验证比对。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "3fe5d8c0274e04420eba610bce087f4c", "index": 80, "aliyun_index": 5, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Our workloads range from a six-instruction \"hello, world!\" microbenchmark to large applications with tens of billions of instructions. Applications from different suites tend to produce very different SM instruction mixes, thread divergence patterns, memory access patterns (e.g., fully coalesced, gather/scatter, random access, or mixtures thereof), different memory access sizes, and so on. As such, applications from different suites tend to stress different sets of rooflines in our architecture model. The more diversity we add, the more  \n\n", "text": "Our workloads range from a six-instruction \"hello, world!\" microbenchmark to large applications with tens of billions of instructions. Applications from different suites tend to produce very different SM instruction mixes, thread divergence patterns, memory access patterns (e.g., fully coalesced, gather/scatter, random access, or mixtures thereof), different memory access sizes, and so on. As such, applications from different suites tend to stress different sets of rooflines in our architecture model. The more diversity we add, the more\n", "alignment": "left", "unique_id": "3fe5d8c0274e04420eba610bce087f4c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our workloads range from a six-instruction \"hello, world!\" microbenchmark to large applications with tens of billions of instructions. Applications from different suites tend to produce very different SM instruction mixes, thread divergence patterns, memory access patterns (e.g., fully coalesced, gather/scatter, random access, or mixtures thereof), different memory access sizes, and so on. As such, applications from different suites tend to stress different sets of rooflines in our architecture model. The more diversity we add, the more"}], "lineHeight": 0}}, "target": {"markdown": "我们的工作负载涵盖范围极广，从仅包含六条指令的 \"hello, world!\" 微基准测试，到包含数百亿条指令的大型应用程序。来自不同套件的应用程序往往会产生截然不同的 SM 指令组合、线程发散模式、内存访问模式（例如完全合并、聚集/分散、随机访问或上述模式的混合）、不同的内存访问大小等等。因此，来自不同套件的应用程序往往会对我们架构模型中不同的屋顶线集合施加压力。我们所添加的多样性越多，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "1a6e1cb67cc5db14c0aac81d27e90c4e", "index": 81, "aliyun_index": 6, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "confidence we have that our GPU model faithful represents\nall the major rooflines within a real GPU microarchitecture.\nNo small subset of the suite can easily achieve this objective.\nThis led us to conclude that establishing trust within a general-\npurpose GPU simulator indeed requires evaluating hundreds of\ndiverse workloads, rather than just a handful.  \n\n", "text": "confidence we have that our GPU model faithful represents\nall the major rooflines within a real GPU microarchitecture.\nNo small subset of the suite can easily achieve this objective.\nThis led us to conclude that establishing trust within a general-\npurpose GPU simulator indeed requires evaluating hundreds of\ndiverse workloads, rather than just a handful.\n", "alignment": "left", "unique_id": "1a6e1cb67cc5db14c0aac81d27e90c4e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "confidence we have that our GPU model faithful represents"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "all the major rooflines within a real GPU microarchitecture."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "No small subset of the suite can easily achieve this objective."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This led us to conclude that establishing trust within a general-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "purpose GPU simulator indeed requires evaluating hundreds of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "diverse workloads, rather than just a handful."}], "lineHeight": -174}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "8f33c8a1f616cf28e3b5435b473a3185", "index": 82, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "We evaluate all benchmarks end-to-end and collect the total execution time of all GPU kernels. We then compare this total to the corresponding number collected from real hardware using standard NVIDIA GPU profiling tools. Like many other simulator papers, we present mean absolute error (MAE), Pearson correlation, and simulation speed statistics. However, following that we also present some additional sensitivity studies that we used to build our own confidence in the simulator's predictive power.  \n\n", "text": "We evaluate all benchmarks end-to-end and collect the total execution time of all GPU kernels. We then compare this total to the corresponding number collected from real hardware using standard NVIDIA GPU profiling tools. Like many other simulator papers, we present mean absolute error (MAE), Pearson correlation, and simulation speed statistics. However, following that we also present some additional sensitivity studies that we used to build our own confidence in the simulator's predictive power.\n", "alignment": "left", "unique_id": "8f33c8a1f616cf28e3b5435b473a3185", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We evaluate all benchmarks end-to-end and collect the total execution time of all GPU kernels. We then compare this total to the corresponding number collected from real hardware using standard NVIDIA GPU profiling tools. Like many other simulator papers, we present mean absolute error (MAE), Pearson correlation, and simulation speed statistics. However, following that we also present some additional sensitivity studies that we used to build our own confidence in the simulator's predictive power."}], "lineHeight": 0}}, "target": {"markdown": "我们对所有基准测试进行端到端评估，并采集所有 GPU 内核的总执行时间。随后，我们将该总数与通过标准 NVIDIA GPU 剖析工具在真实硬件上采集到的相应数值进行比较。与许多其他仿真器论文类似，我们给出了平均绝对误差（MAE）、皮尔逊相关系数以及仿真速度统计。然而，在此基础上，我们还进一步展示了一些额外的敏感性研究，这些研究是我们用以建立对仿真器预测能力信心的依据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "250bd14bda2df6ca231982de5633b0a6", "index": 83, "aliyun_index": 8, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "### A. Diagnosing Sources of Simulator Inaccuracy\n", "text": "A. Diagnosing Sources of Simulator Inaccuracy\n", "alignment": "left", "unique_id": "250bd14bda2df6ca231982de5633b0a6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Diagnosing Sources of Simulator Inaccuracy"}], "lineHeight": 0}}, "target": {"markdown": "### A. 仿真器不准确性来源诊断\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "f7a5080e2964f08ac67047c45dd1ec2b", "index": 84, "aliyun_index": 9, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "One widely used metric to evaluate a hardware simulator is to compare its performance predictions to real hardware using microbenchmarks intended to stress specific microarchitectural components, such as those shown in Figure 6. While it may come as a surprise that a simulator developed with access to internal product details does not match silicon performance nearly exactly, we contend that highly correlated microbenchmarks do not necessarily lead to highly accurate simulations of large workloads and are often over emphasized during simulator development.  \n\n", "text": "One widely used metric to evaluate a hardware simulator is to compare its performance predictions to real hardware using microbenchmarks intended to stress specific microarchitectural components, such as those shown in Figure 6. While it may come as a surprise that a simulator developed with access to internal product details does not match silicon performance nearly exactly, we contend that highly correlated microbenchmarks do not necessarily lead to highly accurate simulations of large workloads and are often over emphasized during simulator development.\n", "alignment": "left", "unique_id": "f7a5080e2964f08ac67047c45dd1ec2b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "One widely used metric to evaluate a hardware simulator is to compare its performance predictions to real hardware using microbenchmarks intended to stress specific microarchitectural components, such as those shown in Figure 6. While it may come as a surprise that a simulator developed with access to internal product details does not match silicon performance nearly exactly, we contend that highly correlated microbenchmarks do not necessarily lead to highly accurate simulations of large workloads and are often over emphasized during simulator development."}], "lineHeight": 0}}, "target": {"markdown": "一种广泛使用的评估硬件仿真器的指标是，将其性能预测与真实硬件进行对比，所采用的微基准测试旨在对特定的微架构组件施加压力，如图 6 所示。尽管一款在开发过程中能够获取内部产品细节的仿真器，却无法与硅片性能近乎精确地吻合，这或许会令人感到意外；但我们认为，与微基准测试高度相关并不一定意味着对大型工作负载的仿真也具有很高的准确性，而且在仿真器开发过程中，这类指标往往被过度强调了。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "387ed8e3d2cc4c5a73dd7987526b4450", "index": 85, "aliyun_index": 10, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "For example, NVAS strongly prefers to use design specification parameters within its individual component models rather than fine-tuning simulator knobs through an empirical or black box process to improve microbenchmark correlation. While we could choose to tune simulation parameters to match silicon microbenchmarking performance nearly exactly, we have not chosen to do this. We believe that using the correct architectural parameters without change vastly improves our simulator development and debugging process. Specifically, by leaving these parameters at their nominal architectural values we ensure that knobs changes made to improve microbenchmark correlation are not merely masking flaws in other portions of the simulation model. Simulation developers must remember that the end goal of simulation tools is not to achieve high perceived accuracy for a given configuration (or generation), but instead to maximize the predictive value simulations will deliver when considering new architectural features.  \n\n", "text": "For example, NVAS strongly prefers to use design specification parameters within its individual component models rather than fine-tuning simulator knobs through an empirical or black box process to improve microbenchmark correlation. While we could choose to tune simulation parameters to match silicon microbenchmarking performance nearly exactly, we have not chosen to do this. We believe that using the correct architectural parameters without change vastly improves our simulator development and debugging process. Specifically, by leaving these parameters at their nominal architectural values we ensure that knobs changes made to improve microbenchmark correlation are not merely masking flaws in other portions of the simulation model. Simulation developers must remember that the end goal of simulation tools is not to achieve high perceived accuracy for a given configuration (or generation), but instead to maximize the predictive value simulations will deliver when considering new architectural features.\n", "alignment": "left", "unique_id": "387ed8e3d2cc4c5a73dd7987526b4450", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For example, NVAS strongly prefers to use design specification parameters within its individual component models rather than fine-tuning simulator knobs through an empirical or black box process to improve microbenchmark correlation. While we could choose to tune simulation parameters to match silicon microbenchmarking performance nearly exactly, we have not chosen to do this. We believe that using the correct architectural parameters without change vastly improves our simulator development and debugging process. Specifically, by leaving these parameters at their nominal architectural values we ensure that knobs changes made to improve microbenchmark correlation are not merely masking flaws in other portions of the simulation model. Simulation developers must remember that the end goal of simulation tools is not to achieve high perceived accuracy for a given configuration (or generation), but instead to maximize the predictive value simulations will deliver when considering new architectural features."}], "lineHeight": 0}}, "target": {"markdown": "例如，NVAS 强烈倾向于在其各个组件模型中使用设计规范参数，而不是通过经验性的或黑箱过程来微调仿真器旋钮，以提升微基准测试的相关性。虽然我们可以选择对仿真参数进行调优，使硅片微基准测试的性能近乎完全吻合，但我们并未选择这样做。我们坚信，在不做任何更改的情况下使用正确的架构参数，将极大地改善我们仿真器的开发与调试流程。具体而言，通过将这些参数保留在其标称的架构值上，我们能够确保：那些为提升微基准测试相关性而做出的旋钮调整，并非仅仅是在掩盖仿真模型其他部分的缺陷。仿真器开发者必须铭记，仿真工具的最终目标并非是在给定配置（或代次）下实现高度直观的准确性，而是要在考虑新的架构特性时，使仿真所能提供的预测价值达到最大化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "2d7af43c2dcacb57af97a296660cfa82", "index": 86, "aliyun_index": 11, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Furthermore, some minor discrepancies between NVAS microbenchmark results and silicon performance are by design. For example, NVAS chose to make little distinction between the GPU's shared memory scratchpad and L1 cache, because these structures are (for the most part) physically merged in recent GPU generations. Because of slight access path and addressing issues, microbenchmarking often will reveal subtle performance discrepancies. However we contend that fairly often these small discrepancies tend to not propagate up into notable system level effects and choosing to live with microbenchmarking miscorrelation in exchange for reduced  \n\n", "text": "Furthermore, some minor discrepancies between NVAS microbenchmark results and silicon performance are by design. For example, NVAS chose to make little distinction between the GPU's shared memory scratchpad and L1 cache, because these structures are (for the most part) physically merged in recent GPU generations. Because of slight access path and addressing issues, microbenchmarking often will reveal subtle performance discrepancies. However we contend that fairly often these small discrepancies tend to not propagate up into notable system level effects and choosing to live with microbenchmarking miscorrelation in exchange for reduced\n", "alignment": "left", "unique_id": "2d7af43c2dcacb57af97a296660cfa82", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Furthermore, some minor discrepancies between NVAS microbenchmark results and silicon performance are by design. For example, NVAS chose to make little distinction between the GPU's shared memory scratchpad and L1 cache, because these structures are (for the most part) physically merged in recent GPU generations. Because of slight access path and addressing issues, microbenchmarking often will reveal subtle performance discrepancies. However we contend that fairly often these small discrepancies tend to not propagate up into notable system level effects and choosing to live with microbenchmarking miscorrelation in exchange for reduced"}], "lineHeight": 0}}, "target": {"markdown": "此外，NVAS 微基准测试结果与硅片性能之间的某些细微差异是有意为之的。例如，NVAS 故意对 GPU 的共享内存暂存区与 L1 缓存几乎不作区分，因为在近期的 GPU 代次中，这些结构在物理上大多是融合在一起的。由于访问路径和寻址方面存在细微差别，微基准测试常常会暴露出一些微妙的性能差异。然而，我们认为相当多的情况下，这些小的差异往往不会向上传播为显著的系统级影响，因此我们选择以接受微基准测试相关性偏差为代价，换取整体", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "3d29d932bf59d42eac31147d2faac693", "index": 87, "aliyun_index": 0, "page_num": 7, "type": "table", "sub_type": "none", "markdown": "| Benchmark Set | Number of Benchmarks | Instruction Count (Min) | Instruction Count (Median) | Instruction Count (Average) | Instruction Count (Max) | Mean Absolute Error (MAE) | Pearson Correlation |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Microbenchmarks | 58 | 6 | 297,856 | 3,308,650 | 22,068,224 | 14% | 0.995 |\n| Rodinia | 17 | 324,656 | 321,775,425 | 11,221,288,859 | 78,524,397,760 | 15% | 0.996 |\n| Polybench | 10 | 6,378,048 | 416,959,760 | 1,070,392,228 | 5,438,720,000 | 12% | 0.993 |\n| Industry HPC | 187 | 260,580 | 49,182,512 | 2,439,293,716 | 54,550,132,311 | 19% | 0.935 |\n| CUBLAS | 31 | 4,334,080 | 102,914,560 | 355,912,387 | 1,695,767,040 | 10% | 0.999 |\n| CUTLASS | 410 | 50,336 | 29,077,952 | 482,594,905 | 11,618,640,000 | 19% | 0.988 |\n| Deepbench | 218 | 80,480 | 14,217,117 | 276,199,106 | 3,752,390,356 | 14% | 0.996 |\n| MLPerf | 24 | 18,176,675 | 3,909,825,077 | 11,952,352,871 | 52,202,026,615 | 13% | 0.969 |\n| All | 955 | 6 | 27,158,732 | 1,270,964,114 | 78,524,397,760 | 17% | 0.953 |\n\n", "text": "| Benchmark Set|Number of Benchmarks|Instruction Count (Min)|Instruction Count (Median)|Instruction Count (Average)|Instruction Count (Max
