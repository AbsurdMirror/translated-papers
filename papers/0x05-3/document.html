s@nvidia.com\n", "alignment": "left", "unique_id": "af49760bb140daa5ab888c457bb038a4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Evgeny Bolotin Yaosheng Fu Niladrish Chatterjee Nan Jiang David Nellans"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA NVIDIA NVIDIA NVIDIA"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ebolotin@nvidia.com yfu@nvidia.com nchatterjee@nvidia.com tedj@nvidia.com dnellans@nvidia.com"}], "lineHeight": -89}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "0d226797cc133562e8cd9dbe9532fc71", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Abstract—The demands of high-performance computing (HPC) and machine learning (ML) workloads have resulted in the rapid architectural evolution of GPUs over the last decade. The growing memory footprint and diversity of data types in these workloads has required GPUs to embrace micro-architectural heterogeneity and increased memory system sophistication to scale performance. Effective simulation of new architectural features early in the design cycle enables quick and effective exploration of design trade-offs across this increasingly diverse set of workloads. This work provides a retrospective on the design and development of NVArchSim (NVAS), an architectural simulator used within NVIDIA to design and evaluate features that are difficult to appraise using other methodologies due to workload type, size, complexity, or lack of modeling flexibility. We argue that overly precise and/or overly slow architectural models hamper an architect's ability to evaluate new features within a reasonable time frame, hurting productivity. Because of its speed, NVAS is being used to trace and evaluate hundreds of HPC and state-of-the-art ML workloads on single-GPU or multi-GPU systems. By adding component fidelity only when necessary to improve system-level modeling accuracy, NVAS delivers simulation speed orders of magnitude higher than most publicly available GPU simulators while retaining high levels of accuracy and simulation flexibility. Building trustworthy high-level simulation platforms is a difficult exercise in balance and compromise; we share our experiences to help and encourage those in academia who take on the challenge of building GPU simulation platforms.  \n\n", "text": "Abstract—The demands of high-performance computing (HPC) and machine learning (ML) workloads have resulted in the rapid architectural evolution of GPUs over the last decade. The growing memory footprint and diversity of data types in these workloads has required GPUs to embrace micro-architectural heterogeneity and increased memory system sophistication to scale performance. Effective simulation of new architectural features early in the design cycle enables quick and effective exploration of design trade-offs across this increasingly diverse set of workloads. This work provides a retrospective on the design and development of NVArchSim (NVAS), an architectural simulator used within NVIDIA to design and evaluate features that are difficult to appraise using other methodologies due to workload type, size, complexity, or lack of modeling flexibility. We argue that overly precise and/or overly slow architectural models hamper an architect's ability to evaluate new features within a reasonable time frame, hurting productivity. Because of its speed, NVAS is being used to trace and evaluate hundreds of HPC and state-of-the-art ML workloads on single-GPU or multi-GPU systems. By adding component fidelity only when necessary to improve system-level modeling accuracy, NVAS delivers simulation speed orders of magnitude higher than most publicly available GPU simulators while retaining high levels of accuracy and simulation flexibility. Building trustworthy high-level simulation platforms is a difficult exercise in balance and compromise; we share our experiences to help and encourage those in academia who take on the challenge of building GPU simulation platforms.\n", "alignment": "left", "unique_id": "0d226797cc133562e8cd9dbe9532fc71", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract—The demands of high-performance computing (HPC) and machine learning (ML) workloads have resulted in the rapid architectural evolution of GPUs over the last decade. The growing memory footprint and diversity of data types in these workloads has required GPUs to embrace micro-architectural heterogeneity and increased memory system sophistication to scale performance. Effective simulation of new architectural features early in the design cycle enables quick and effective exploration of design trade-offs across this increasingly diverse set of workloads. This work provides a retrospective on the design and development of NVArchSim (NVAS), an architectural simulator used within NVIDIA to design and evaluate features that are difficult to appraise using other methodologies due to workload type, size, complexity, or lack of modeling flexibility. We argue that overly precise and/or overly slow architectural models hamper an architect's ability to evaluate new features within a reasonable time frame, hurting productivity. Because of its speed, NVAS is being used to trace and evaluate hundreds of HPC and state-of-the-art ML workloads on single-GPU or multi-GPU systems. By adding component fidelity only when necessary to improve system-level modeling accuracy, NVAS delivers simulation speed orders of magnitude higher than most publicly available GPU simulators while retaining high levels of accuracy and simulation flexibility. Building trustworthy high-level simulation platforms is a difficult exercise in balance and compromise; we share our experiences to help and encourage those in academia who take on the challenge of building GPU simulation platforms."}], "lineHeight": 0}}, "target": {"markdown": "摘要——过去十年间，高性能计算（HPC）和机器学习（ML）工作负载的需求推动了 GPU 架构的快速演进。这些工作负载不断增长的内存占用和数据类型多样性，要求 GPU 采用微架构异构性并提升内存系统的复杂度，以实现性能的扩展。在设计周期的早期对新架构特性进行有效的仿真，能够在这一日益多样化的工作负载集合中快速且高效地探索设计权衡。本文对 NVArchSim（NVAS）的设计与开发进行了回顾总结，NVAS 是 NVIDIA 内部用于设计与评估各类特性的架构仿真器，这些特性由于工作负载类型、规模、复杂度或建模灵活性的不足，难以通过其他方法加以评估。我们指出，过度精确和/或过度缓慢的架构模型会阻碍架构师在合理的时间范围内评估新特性，从而损害生产力。得益于其运行速度，NVAS 已被用于在单 GPU 或多 GPU 系统上追踪并评估数百个 HPC 与当前最先进的 ML 工作负载。NVAS 仅在必要时增加组件级的保真度以提升系统级建模精度，在保持较高准确性与仿真灵活性的同时，仿真速度较大多数公开可用的 GPU 仿真器高出数量级。构建可信赖的高层次仿真平台是一项充满平衡与折衷的艰巨任务；我们分享相关经验，以期帮助并鼓励学术界中勇于迎接 GPU 仿真平台构建挑战的同仁们。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "5b4b6c65ad88af09f8306615c0436800", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Index Terms—GPU, Simulation, Performance Modeling, System Simulation  \n\n", "text": "Index Terms—GPU, Simulation, Performance Modeling, System Simulation\n", "alignment": "left", "unique_id": "5b4b6c65ad88af09f8306615c0436800", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Index Terms—GPU, Simulation, Performance Modeling, System Simulation"}], "lineHeight": 0}}, "target": {"markdown": "索引术语——GPU、仿真、性能建模、系统仿真", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "2004a4f2bd33d0b3e549bfe20125c828", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## I. INTRODUCTION\n", "text": "I. INTRODUCTION\n", "alignment": "left", "unique_id": "2004a4f2bd33d0b3e549bfe20125c828", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "I. INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "## I. 引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "b99a43de030df56cf15a97e74967c95d", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "GPUs are the dominant platform for most data-parallel workloads in the high-performance computing (HPC), machine learning (ML), and data analytics domains. As dataset sizes and the desire to simulate more complex systems grow, both the individual size and aggregate number of GPUs being applied to these complex problems is increasing. To continue scaling performance GPUs are embracing increased complexity in their individual processing pipelines, while also  \n\n", "text": "GPUs are the dominant platform for most data-parallel workloads in the high-performance computing (HPC), machine learning (ML), and data analytics domains. As dataset sizes and the desire to simulate more complex systems grow, both the individual size and aggregate number of GPUs being applied to these complex problems is increasing. To continue scaling performance GPUs are embracing increased complexity in their individual processing pipelines, while also\n", "alignment": "left", "unique_id": "b99a43de030df56cf15a97e74967c95d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs are the dominant platform for most data-parallel workloads in the high-performance computing (HPC), machine learning (ML), and data analytics domains. As dataset sizes and the desire to simulate more complex systems grow, both the individual size and aggregate number of GPUs being applied to these complex problems is increasing. To continue scaling performance GPUs are embracing increased complexity in their individual processing pipelines, while also"}], "lineHeight": 0}}, "target": {"markdown": "GPU 已成为高性能计算（HPC）、机器学习（ML）和数据分析领域中大多数数据并行工作负载的主导平台。随着数据集规模的不断扩大以及对模拟更复杂系统的需求增长，应用于这些复杂问题的单块 GPU 规模和总体 GPU 数量都在持续增加。为了持续扩展性能，GPU 不仅在各个处理流水线中引入了更高的复杂度，同时也在", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "07b6052efb88613bbe3bcd8e91ca0482", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "increasing heterogeneity across the chip. GPUs continue to be manufactured near the reticle limit, with academic and industry groups proposing system-level designs to allow close coupling of multi-chip modules and aggregation of discrete GPUs across the data center [1], [2], [4], [15], [37], [50], [61], [63]. GPUs are also rapidly evolving, with recent generations featuring a wide variety of architectural enhancements including new data types [44], tighter integration with CPUs and their coherence protocols [8], [24], [31], [45], data center level GPU-optimized interconnects [43], and complex data transformations [42].  \n\n", "text": "increasing heterogeneity across the chip. GPUs continue to be manufactured near the reticle limit, with academic and industry groups proposing system-level designs to allow close coupling of multi-chip modules and aggregation of discrete GPUs across the data center [1], [2], [4], [15], [37], [50], [61], [63]. GPUs are also rapidly evolving, with recent generations featuring a wide variety of architectural enhancements including new data types [44], tighter integration with CPUs and their coherence protocols [8], [24], [31], [45], data center level GPU-optimized interconnects [43], and complex data transformations [42].\n", "alignment": "left", "unique_id": "07b6052efb88613bbe3bcd8e91ca0482", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "increasing heterogeneity across the chip. GPUs continue to be manufactured near the reticle limit, with academic and industry groups proposing system-level designs to allow close coupling of multi-chip modules and aggregation of discrete GPUs across the data center [1], [2], [4], [15], [37], [50], [61], [63]. GPUs are also rapidly evolving, with recent generations featuring a wide variety of architectural enhancements including new data types [44], tighter integration with CPUs and their coherence protocols [8], [24], [31], [45], data center level GPU-optimized interconnects [43], and complex data transformations [42]."}], "lineHeight": 0}}, "target": {"markdown": "芯片层面引入更高的异构性。GPU 仍在接近光罩极限的工艺下进行制造，学术界和工业界也在不断提出系统级设计方案，以实现多芯片模组的紧耦合以及跨数据中心的独立 GPU 聚合 [1]、[2]、[4]、[15]、[50]、[61]、[63]。同时，GPU 也在快速演进，最新一代产品引入了多种架构增强特性，包括新的数据类型 [44]、与 CPU 及其一致性协议的更紧密集成 [8]、[24]、[31]、[45]、面向数据中心的 GPU 优化互连 [43]，以及复杂的数据变换 [42]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "d81d7844aa8221fcfe736aefcaa3c47f", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "To support the needs of emerging workloads, GPU architects require design tools that can quickly evaluate the impact of aggressive new features across an increasingly diverse set of applications. Quickly exploring the design space of future GPUs is necessary for fast product iteration in a rapidly moving industry. Ideally, architectural level simulators should balance three primary goals during their development. First, simulators need to be both accurate and trustworthy—two distinct properties. While accuracy can be measured in comparison to existing silicon, trustworthiness reflects the ability of the simulator to model novel ideas not yet baked into silicon. Second, simulators must be able to run a wide variety of workloads including new and emerging workloads which may require new methodologies to capture their representative behaviors. Third, simulation turnaround must be fast. If the turnaround time for simulation is too slow, architects will often turn to other (possibly less appropriate) tools to make their engineering decisions.  \n\n", "text": "To support the needs of emerging workloads, GPU architects require design tools that can quickly evaluate the impact of aggressive new features across an increasingly diverse set of applications. Quickly exploring the design space of future GPUs is necessary for fast product iteration in a rapidly moving industry. Ideally, architectural level simulators should balance three primary goals during their development. First, simulators need to be both accurate and trustworthy—two distinct properties. While accuracy can be measured in comparison to existing silicon, trustworthiness reflects the ability of the simulator to model novel ideas not yet baked into silicon. Second, simulators must be able to run a wide variety of workloads including new and emerging workloads which may require new methodologies to capture their representative behaviors. Third, simulation turnaround must be fast. If the turnaround time for simulation is too slow, architects will often turn to other (possibly less appropriate) tools to make their engineering decisions.\n", "alignment": "left", "unique_id": "d81d7844aa8221fcfe736aefcaa3c47f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To support the needs of emerging workloads, GPU architects require design tools that can quickly evaluate the impact of aggressive new features across an increasingly diverse set of applications. Quickly exploring the design space of future GPUs is necessary for fast product iteration in a rapidly moving industry. Ideally, architectural level simulators should balance three primary goals during their development. First, simulators need to be both accurate and trustworthy—two distinct properties. While accuracy can be measured in comparison to existing silicon, trustworthiness reflects the ability of the simulator to model novel ideas not yet baked into silicon. Second, simulators must be able to run a wide variety of workloads including new and emerging workloads which may require new methodologies to capture their representative behaviors. Third, simulation turnaround must be fast. If the turnaround time for simulation is too slow, architects will often turn to other (possibly less appropriate) tools to make their engineering decisions."}], "lineHeight": 0}}, "target": {"markdown": "为满足新兴工作负载的需求，GPU 架构师需要相应的设计工具，以便在日益多样化的应用集合中快速评估激进的全新特性所带来的影响。在快速变化的行业中，要实现产品的高速迭代，就必须能够快速探索未来 GPU 的设计空间。理想情况下，架构级仿真器在其开发过程中应平衡以下三个主要目标。首先，仿真器需要兼具准确性与可信赖性——这是两个不同的特性。准确性可以通过与现有硅芯片（silicon）的对比来衡量，而可信赖性则反映了仿真器对尚未在硅芯片中固化的新思路进行建模的能力。其次，仿真器必须能够运行种类繁多的工作负载，包括可能需要新方法来刻画其代表性行为的新兴工作负载。第三，仿真的周转时间必须足够快。如果仿真的周转时间过长，架构师往往会转而采用其他（可能并不那么合适的）工具来做出工程决策。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "a5098c0d18dc106bef924ce07bac5041", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "With these three goals in mind, this work presents a retrospective of the choices made when implementing the NVIDIA Architectural Simulator (NVArcSim or NVAS), our in-house hybrid trace- and execution-driven single- and multi-GPU simulator. NVAS is one of many simulation tools used within NVIDIA and has been designed to fill a niche for which existing tools are either too slow, too targeted at a specific GPU component, or too difficult to employ for system-level studies.  \n\n", "text": "With these three goals in mind, this work presents a retrospective of the choices made when implementing the NVIDIA Architectural Simulator (NVArcSim or NVAS), our in-house hybrid trace- and execution-driven single- and multi-GPU simulator. NVAS is one of many simulation tools used within NVIDIA and has been designed to fill a niche for which existing tools are either too slow, too targeted at a specific GPU component, or too difficult to employ for system-level studies.\n", "alignment": "left", "unique_id": "a5098c0d18dc106bef924ce07bac5041", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With these three goals in mind, this work presents a retrospective of the choices made when implementing the NVIDIA Architectural Simulator (NVArcSim or NVAS), our in-house hybrid trace- and execution-driven single- and multi-GPU simulator. NVAS is one of many simulation tools used within NVIDIA and has been designed to fill a niche for which existing tools are either too slow, too targeted at a specific GPU component, or too difficult to employ for system-level studies."}], "lineHeight": 0}}, "target": {"markdown": "基于上述三个目标，本文对实现 NVIDIA 架构仿真器（NVArcSim 或 NVAS）过程中所做的各项选择进行了回顾总结。NVAS 是 NVIDIA 自研的一款混合式（结合追踪驱动与执行驱动）的单 GPU 与多 GPU 仿真器，是公司内部众多仿真工具之一，旨在填补现有工具的空白——这些工具要么运行过慢，要么过于针对特定的 GPU 组件，要么难以用于系统级研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "2481daa911814f9aad17774556af8a14", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "corner_note", "sub_type": "none", "markdown": ">* These authors contribute equally.  \n\n", "text": "* These authors contribute equally.\n", "alignment": "left", "unique_id": "2481daa911814f9aad17774556af8a14", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "* These authors contribute equally."}], "lineHeight": 0}}, "target": {"markdown": ">* 这些作者贡献相同。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "e45de666d3f4ca0a2c0ff98e8eb85196", "index": 12, "aliyun_index": 0, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "No two simulation platforms provide identical answers and even within NVIDIA no single tool provides a golden answer. NVAS is often the first tool used for architectural exploration, but rarely is it the last (or only) tool used for feature evaluation. It provides a balance of high-speed execution for rapid design iteration and sufficient accuracy that feature-level studies can occur quickly before being adapted, refined, and verified in more detailed (and slower) product-specific simulations.  \n\n", "text": "No two simulation platforms provide identical answers and even within NVIDIA no single tool provides a golden answer. NVAS is often the first tool used for architectural exploration, but rarely is it the last (or only) tool used for feature evaluation. It provides a balance of high-speed execution for rapid design iteration and sufficient accuracy that feature-level studies can occur quickly before being adapted, refined, and verified in more detailed (and slower) product-specific simulations.\n", "alignment": "left", "unique_id": "e45de666d3f4ca0a2c0ff98e8eb85196", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "No two simulation platforms provide identical answers and even within NVIDIA no single tool provides a golden answer. NVAS is often the first tool used for architectural exploration, but rarely is it the last (or only) tool used for feature evaluation. It provides a balance of high-speed execution for rapid design iteration and sufficient accuracy that feature-level studies can occur quickly before being adapted, refined, and verified in more detailed (and slower) product-specific simulations."}], "lineHeight": 0}}, "target": {"markdown": "没有任何两款仿真平台能够给出完全相同的答案，即使在 NVIDIA 内部，也不存在单一的\"金标准\"工具。NVAS 通常是进行架构探索时首先使用的工具，但很少是特性评估中最后（或唯一）使用的工具。它在高速执行（以支持快速的设计迭代）与足够的精度之间取得了平衡，使特性级研究能够快速开展，随后再迁移到更精细（也更慢）的产品专用仿真中进行适配、改进与验证。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "f1f4ae9cbb0a2d3f9386ff546c6e4312", "index": 13, "aliyun_index": 1, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "NVAS was motivated by the need to capture system-level data reuse and communication patterns of applications ranging from small microbenchmarks to new large deep learning training and inference workloads containing billions of GPU warp instructions. To satisfy this need, we employ a number of strategies. 1) We employ a hybrid trace- and execution-driven simulation methodology. For GPU simulation, trace-driven execution tends to be faster than execution-driven simulation [29]. A partial execution methodology allows NVAS to overcome many of the limitations of trace-only driven simulation, such as value-dependent instruction execution, without sacrificing its speed benefits. 2) We utilize only loose cycle accuracy wherever this lack of fidelity does not substantially harm overall system-level simulation accuracy. To justify this approach, we provide three studies examining the simulation trade-offs when implementing differing levels of detail for SM instruction dependency tracking, on-chip interconnect modeling, and off-chip DRAM fidelity. 3) We emphasize the need to accurately capture trends across hundreds of GPU workloads rather than achieving ultra-high correlation for just a small handful. To demonstrate the effectiveness of this approach, we present NVAS simulation validation data for over 900 traces obtained from workloads run on single and multi-GPU systems with simulation turnaround times ranging a few seconds to up to 4 days.  \n\n", "text": "NVAS was motivated by the need to capture system-level data reuse and communication patterns of applications ranging from small microbenchmarks to new large deep learning training and inference workloads containing billions of GPU warp instructions. To satisfy this need, we employ a number of strategies. 1) We employ a hybrid trace- and execution-driven simulation methodology. For GPU simulation, trace-driven execution tends to be faster than execution-driven simulation [29]. A partial execution methodology allows NVAS to overcome many of the limitations of trace-only driven simulation, such as value-dependent instruction execution, without sacrificing its speed benefits. 2) We utilize only loose cycle accuracy wherever this lack of fidelity does not substantially harm overall system-level simulation accuracy. To justify this approach, we provide three studies examining the simulation trade-offs when implementing differing levels of detail for SM instruction dependency tracking, on-chip interconnect modeling, and off-chip DRAM fidelity. 3) We emphasize the need to accurately capture trends across hundreds of GPU workloads rather than achieving ultra-high correlation for just a small handful. To demonstrate the effectiveness of this approach, we present NVAS simulation validation data for over 900 traces obtained from workloads run on single and multi-GPU systems with simulation turnaround times ranging a few seconds to up to 4 days.\n", "alignment": "left", "unique_id": "f1f4ae9cbb0a2d3f9386ff546c6e4312", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVAS was motivated by the need to capture system-level data reuse and communication patterns of applications ranging from small microbenchmarks to new large deep learning training and inference workloads containing billions of GPU warp instructions. To satisfy this need, we employ a number of strategies. 1) We employ a hybrid trace- and execution-driven simulation methodology. For GPU simulation, trace-driven execution tends to be faster than execution-driven simulation [29]. A partial execution methodology allows NVAS to overcome many of the limitations of trace-only driven simulation, such as value-dependent instruction execution, without sacrificing its speed benefits. 2) We utilize only loose cycle accuracy wherever this lack of fidelity does not substantially harm overall system-level simulation accuracy. To justify this approach, we provide three studies examining the simulation trade-offs when implementing differing levels of detail for SM instruction dependency tracking, on-chip interconnect modeling, and off-chip DRAM fidelity. 3) We emphasize the need to accurately capture trends across hundreds of GPU workloads rather than achieving ultra-high correlation for just a small handful. To demonstrate the effectiveness of this approach, we present NVAS simulation validation data for over 900 traces obtained from workloads run on single and multi-GPU systems with simulation turnaround times ranging a few seconds to up to 4 days."}], "lineHeight": 0}}, "target": {"markdown": "NVAS 的设计动机源于捕捉系统级数据复用与通信模式的需求，这些应用涵盖从小型微基准测试到包含数十亿条 GPU warp 指令的全新大规模深度学习训练与推理工作负载。为满足这一需求，我们采用了多项策略。1) 采用混合式追踪驱动与执行驱动的仿真方法。对于 GPU 仿真而言，追踪驱动执行通常比执行驱动仿真更快 [29]。部分执行方法使 NVAS 能够克服纯追踪驱动仿真的诸多局限性（例如值相关的指令执行），同时又不牺牲其速度优势。2) 在对系统级仿真精度影响不大的环节，仅采用松散的周期级精度。为证明这一方法的合理性，我们给出了三项研究，分别考察在 SM 指令依赖追踪、片上互连建模以及片外 DRAM 保真度方面采用不同实现细节时的仿真权衡。3) 我们强调，相较于仅针对少量工作负载追求极高的相关性，更应着重在数百个 GPU 工作负载上准确捕捉整体趋势。为证明该方法的有效性，我们展示了针对从单 GPU 与多 GPU 系统上收集的超过 900 条追踪数据所进行的 NVAS 仿真验证结果，其仿真周转时间从数秒到最长 4 天不等。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 13}, {"source": {"block_id": "2b18cbed37a84352019f7764ff53e3a0", "index": 14, "aliyun_index": 2, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Simulation development is not glamorous but it is necessary. NVAS has been developed over the last 7 years including a ground up re-write to implement the current methodological approach, which supports the new and shifting priorities within NVIDIA. While it is difficult to transition, abandoning old tools for new approaches is part of the natural evolution of chip, system, and data center modeling. Developing the right tool for the job can save countless engineering hours, far exceeding the development time invested. We hope that by providing increased visibility into our own development process, use cases, and evaluation metrics, our experience can help guide the architecture community as it continues to perform high quality GPU research.  \n\n", "text": "Simulation development is not glamorous but it is necessary. NVAS has been developed over the last 7 years including a ground up re-write to implement the current methodological approach, which supports the new and shifting priorities within NVIDIA. While it is difficult to transition, abandoning old tools for new approaches is part of the natural evolution of chip, system, and data center modeling. Developing the right tool for the job can save countless engineering hours, far exceeding the development time invested. We hope that by providing increased visibility into our own development process, use cases, and evaluation metrics, our experience can help guide the architecture community as it continues to perform high quality GPU research.\n", "alignment": "left", "unique_id": "2b18cbed37a84352019f7764ff53e3a0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Simulation development is not glamorous but it is necessary. NVAS has been developed over the last 7 years including a ground up re-write to implement the current methodological approach, which supports the new and shifting priorities within NVIDIA. While it is difficult to transition, abandoning old tools for new approaches is part of the natural evolution of chip, system, and data center modeling. Developing the right tool for the job can save countless engineering hours, far exceeding the development time invested. We hope that by providing increased visibility into our own development process, use cases, and evaluation metrics, our experience can help guide the architecture community as it continues to perform high quality GPU research."}], "lineHeight": 0}}, "target": {"markdown": "仿真开发工作既不光彩也不轻松，但却是不可或缺的。NVAS 的开发历经七年，其间曾经历了一次彻底的重写以实现当前的方法论，从而能够适应 NVIDIA 内部不断变化的新需求与新重点。虽然转型过程困难重重，但舍弃旧工具、采用新方法正是芯片、系统和数据中心建模自然演进的一部分。为合适的工作开发合适的工具，可以节省无数的工程小时，远超工具开发本身所投入的时间。我们希望通过分享自身开发流程、使用场景和评估指标的更多细节，能够助力整个架构社区在 GPU 研究中持续产出高质量的成果。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "2ce06487676ef4002a77be22145918fe", "index": 15, "aliyun_index": 3, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## II. BACKGROUND AND MOTIVATION\n", "text": "II. BACKGROUND AND MOTIVATION\n", "alignment": "left", "unique_id": "2ce06487676ef4002a77be22145918fe", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "II. BACKGROUND AND MOTIVATION"}], "lineHeight": 0}}, "target": {"markdown": "## II. 背景与动机\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "0a70138aa98ab80f2b132844a5064d77", "index": 16, "aliyun_index": 4, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Simulation is the primary tool within industrial and research communities to both project the performance of new designs and root cause performance bottlenecks in existing hardware. As a result, high simulation accuracy in relation to one or more physical design points is a key metric when implementing a simulation environment. In addition to accuracy, simulation platforms need to be stress tested across parameter variation  \n\n", "text": "Simulation is the primary tool within industrial and research communities to both project the performance of new designs and root cause performance bottlenecks in existing hardware. As a result, high simulation accuracy in relation to one or more physical design points is a key metric when implementing a simulation environment. In addition to accuracy, simulation platforms need to be stress tested across parameter variation\n", "alignment": "left", "unique_id": "0a70138aa98ab80f2b132844a5064d77", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Simulation is the primary tool within industrial and research communities to both project the performance of new designs and root cause performance bottlenecks in existing hardware. As a result, high simulation accuracy in relation to one or more physical design points is a key metric when implementing a simulation environment. In addition to accuracy, simulation platforms need to be stress tested across parameter variation"}], "lineHeight": 0}}, "target": {"markdown": "仿真是工业界与研究界用于预测新设计性能以及定位现有硬件性能瓶颈的主要工具。因此，在实现仿真环境时，相对于一个或多个物理设计点的高仿真精度是一项关键指标。除精度外，仿真平台还需要在参数变化范围内进行充分的压力测试", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "ef166379160a08329a3718557fb625bd", "index": 17, "aliyun_index": 5, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![ef166379160a08329a3718557fb625bd.jpeg](figures/ef166379160a08329a3718557fb625bd_70a0c4b5.png)  \n\n", "text": "   NVArchSim < GPGPUSim-Measured < GPGPUSim-Projected\n   \n\n   即：NVArchSim 最快，GPGPUSim 最慢（尤其是投影部分）。\n\n---\n\n## 技术备注\n\n- 所有数据点均位于双对数坐标系中，便于观察幂律行为。\n- “Projected” 数据可能来自线性或非线性外推，未提供具体算法。\n- 时间单位转换基于标准日历（非闰年、每月30天简化），实际应用中应使用精确天数。\n\n---\n\n✅ 此 Markdown 文档完整还原了原始图表的所有可视元素、语义信息及隐含逻辑，可用于报告、论文或演示文稿引用。\n\n--- \n\n如需进一步导出为 CSV、JSON 或生成代码绘图脚本（如 Python + Matplotlib），请告知。", "alignment": "left", "unique_id": "ef166379160a08329a3718557fb625bd", "edited": false, "extra": {}}, "target": {"markdown": "![ef166379160a08329a3718557fb625bd.jpeg](figures/ef166379160a08329a3718557fb625bd_70a0c4b5.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "746d11060b5fd6eaed608aab604448da", "index": 18, "aliyun_index": 6, "page_num": 1, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 1: Wall clock time required to simulate 955 benchmarks on NVAS. Where possible, identical workloads were simulated on GPGPU-Sim 4.0, with the remaining times projected based on average slowdown.  \n\n", "text": "Fig. 1: Wall clock time required to simulate 955 benchmarks on NVAS. Where possible, identical workloads were simulated on GPGPU-Sim 4.0, with the remaining times projected based on average slowdown.\n", "alignment": "left", "unique_id": "746d11060b5fd6eaed608aab604448da", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 1: Wall clock time required to simulate 955 benchmarks on NVAS. Where possible, identical workloads were simulated on GPGPU-Sim 4.0, with the remaining times projected based on average slowdown."}], "lineHeight": 0}}, "target": {"markdown": ">图 1：在 NVAS 上模拟 955 个基准测试所需的实际运行时间（wall clock time）。在条件允许的情况下，相同的工作负载也在 GPGPU-Sim 4.0 上进行了模拟，其余时间则根据平均减速比进行了推算。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "1a041e44f29f7c3d3d7f3fff256a46cd", "index": 19, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "to provide confidence that the simulation is not just accurate\nbut trustworthy at projecting performance.  \n\n", "text": "to provide confidence that the simulation is not just accurate\nbut trustworthy at projecting performance.\n", "alignment": "left", "unique_id": "1a041e44f29f7c3d3d7f3fff256a46cd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to provide confidence that the simulation is not just accurate"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "but trustworthy at projecting performance."}], "lineHeight": -59}}, "target": {"markdown": "以确保仿真在预测性能时不仅准确，而且值得信赖。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "19fc5b25ba49dbe8e5b84e2842aa646c", "index": 20, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "For example, naturally skeptical engineers will consider simulation tools validated on too few workloads (but achieving high accuracy for those workloads) as likely to have little predictive value when considering new applications or invasive architectural changes. Similarly, if fudge factors that are not rooted in the architectural design are used to compensate for miscorrelation or simulator skew, the skeptical engineer will view them as obscuring real architectural bottlenecks and reducing the trustworthiness of the simulation platform. As a result, we have found that during simulator development we must be willing to accept and embrace that some degree of inaccuracy is inevitable. Focusing on achieving correct trends across hundreds of diverse workloads provides more predictive power for forward-looking studies performed on NVAS.  \n\n", "text": "For example, naturally skeptical engineers will consider simulation tools validated on too few workloads (but achieving high accuracy for those workloads) as likely to have little predictive value when considering new applications or invasive architectural changes. Similarly, if fudge factors that are not rooted in the architectural design are used to compensate for miscorrelation or simulator skew, the skeptical engineer will view them as obscuring real architectural bottlenecks and reducing the trustworthiness of the simulation platform. As a result, we have found that during simulator development we must be willing to accept and embrace that some degree of inaccuracy is inevitable. Focusing on achieving correct trends across hundreds of diverse workloads provides more predictive power for forward-looking studies performed on NVAS.\n", "alignment": "left", "unique_id": "19fc5b25ba49dbe8e5b84e2842aa646c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For example, naturally skeptical engineers will consider simulation tools validated on too few workloads (but achieving high accuracy for those workloads) as likely to have little predictive value when considering new applications or invasive architectural changes. Similarly, if fudge factors that are not rooted in the architectural design are used to compensate for miscorrelation or simulator skew, the skeptical engineer will view them as obscuring real architectural bottlenecks and reducing the trustworthiness of the simulation platform. As a result, we have found that during simulator development we must be willing to accept and embrace that some degree of inaccuracy is inevitable. Focusing on achieving correct trends across hundreds of diverse workloads provides more predictive power for forward-looking studies performed on NVAS."}], "lineHeight": 0}}, "target": {"markdown": "例如，工程师们天然持怀疑态度，他们会认为：在过少的工作负载上进行验证（即便这些工作负载上精度很高）的仿真工具，在面对新应用或侵入式的架构改动时，几乎不具备多少预测价值。同样，如果使用那些并非源自架构设计的\"凑数因子\"（fudge factors）来弥补相关性偏差或仿真器偏差，持怀疑态度的工程师会将其视为掩盖了真实的架构瓶颈，并降低仿真平台的可信赖性。因此，我们认识到在仿真器开发过程中，必须乐于接受并坦然面对一定程度的误差不可避免这一事实。聚焦于在数百个多样化工作负载上获得正确的趋势，反而能为基于 NVAS 开展的前瞻性研究提供更强的预测能力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "ce76fcf62f99428bc9faded7fce772fa", "index": 21, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Finally, simulators can be both accurate and trustworthy, but if they do not achieve high simulation speed, they are unlikely to be adopted because they cannot quickly simulate workloads of interest. Figure 1 provides an overview of the wall clock time required to simulate 955 benchmarks of interest on NVAS. Most of these workloads can be simulated in under a few hours, with only the longest requiring a multi-day simulation execution. This allows NVAS users to explore wider design spaces across a large and varied set of workloads. To illustrate the importance of simulation speed, with the help of the GPGPUSim team we were able to get a subset of identical workloads executing on GPGPUSim v4.0 [29]. Depending on application type GPGPUSim can be between 40-250× slower than NVAS while simulating identical workloads. This leads to infeasible simulation duration for many of our workloads, later shown in Table II, that would take months or even years to complete in traditional GPU simulators.  \n\n", "text": "Finally, simulators can be both accurate and trustworthy, but if they do not achieve high simulation speed, they are unlikely to be adopted because they cannot quickly simulate workloads of interest. Figure 1 provides an overview of the wall clock time required to simulate 955 benchmarks of interest on NVAS. Most of these workloads can be simulated in under a few hours, with only the longest requiring a multi-day simulation execution. This allows NVAS users to explore wider design spaces across a large and varied set of workloads. To illustrate the importance of simulation speed, with the help of the GPGPUSim team we were able to get a subset of identical workloads executing on GPGPUSim v4.0 [29]. Depending on application type GPGPUSim can be between 40-250× slower than NVAS while simulating identical workloads. This leads to infeasible simulation duration for many of our workloads, later shown in Table II, that would take months or even years to complete in traditional GPU simulators.\n", "alignment": "left", "unique_id": "ce76fcf62f99428bc9faded7fce772fa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Finally, simulators can be both accurate and trustworthy, but if they do not achieve high simulation speed, they are unlikely to be adopted because they cannot quickly simulate workloads of interest. Figure 1 provides an overview of the wall clock time required to simulate 955 benchmarks of interest on NVAS. Most of these workloads can be simulated in under a few hours, with only the longest requiring a multi-day simulation execution. This allows NVAS users to explore wider design spaces across a large and varied set of workloads. To illustrate the importance of simulation speed, with the help of the GPGPUSim team we were able to get a subset of identical workloads executing on GPGPUSim v4.0 [29]. Depending on application type GPGPUSim can be between 40-250× slower than NVAS while simulating identical workloads. This leads to infeasible simulation duration for many of our workloads, later shown in Table II, that would take months or even years to complete in traditional GPU simulators."}], "lineHeight": 0}}, "target": {"markdown": "最后，即便仿真器既精确又值得信赖，若不能实现较高的仿真速度，也难以获得实际采用，因为它们无法快速完成对目标工作负载的仿真。图 1 概览了在 NVAS 上模拟 955 个目标基准测试所需的实际运行时间。其中大多数工作负载可在数小时内完成仿真，仅有少数最长的任务需要多天的仿真执行时间。这使得 NVAS 用户能够在大量且多样化的应用负载上探索更广阔的设计空间。为了说明仿真速度的重要性，在 GPGPUSim 团队的帮助下，我们成功地在 GPGPUSim v4.0 [29] 上运行了一部分相同的工作负载。根据应用类型的不同，在模拟相同工作负载时，GPGPUSim 的速度可能比 NVAS 慢 40 至 250 倍。这将导致对于我们的许多工作负载而言，仿真周期变得不可接受——如表 II 所示，在传统 GPU 仿真器中完成这些任务可能需要数月乃至数年。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "91f7b7e63cff06eeefbdf74e1131b7eb", "index": 22, "aliyun_index": 10, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "### A. Cycle Accurate Simulation\n", "text": "A. Cycle Accurate Simulation\n", "alignment": "left", "unique_id": "91f7b7e63cff06eeefbdf74e1131b7eb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Cycle Accurate Simulation"}], "lineHeight": 0}}, "target": {"markdown": "### A. 周期精确仿真\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "1605cdd400b22591aa4305b157cef309", "index": 23, "aliyun_index": 11, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The guiding principles for what we call “loose cycle accuracy” in the development of NVAS are based on the  \n\n", "text": "The guiding principles for what we call “loose cycle accuracy” in the development of NVAS are based on the\n", "alignment": "left", "unique_id": "1605cdd400b22591aa4305b157cef309", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The guiding principles for what we call “loose cycle accuracy” in the development of NVAS are based on the"}], "lineHeight": 0}}, "target": {"markdown": "NVAS 开发中所采用的\"松散周期精度\"（loose cycle accuracy）的指导原则基于以下方面：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "49f997379ec6ea93ce8dc2cdb9dc769c", "index": 24, "aliyun_index": 0, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "observation that GPUs are throughput-oriented computing devices. CPUs are very sensitive to memory system latency and per-instruction scheduling due to high single-threaded instruction level parallelism (ILP). This makes getting exact cycle duration for events important in achieving good silicon correlation with simulation platforms. Conversely, GPUs tend to be latency tolerant thanks to their heavy use of massive multithreading. We have observed that overall GPU simulator accuracy is negligibly affected by small inaccuracies in microarchitectural latency, and thus near-cycle accuracy when implementing most GPU structures is not required. Exploiting this latency tolerance allows us to approach GPU simulation philosophically as a complex model of dynamically interacting roofline components, rather than a CPU-like system in which tracking the detailed cycle-by-cycle progression of all components is necessary.  \n\n", "text": "observation that GPUs are throughput-oriented computing devices. CPUs are very sensitive to memory system latency and per-instruction scheduling due to high single-threaded instruction level parallelism (ILP). This makes getting exact cycle duration for events important in achieving good silicon correlation with simulation platforms. Conversely, GPUs tend to be latency tolerant thanks to their heavy use of massive multithreading. We have observed that overall GPU simulator accuracy is negligibly affected by small inaccuracies in microarchitectural latency, and thus near-cycle accuracy when implementing most GPU structures is not required. Exploiting this latency tolerance allows us to approach GPU simulation philosophically as a complex model of dynamically interacting roofline components, rather than a CPU-like system in which tracking the detailed cycle-by-cycle progression of all components is necessary.\n", "alignment": "left", "unique_id": "49f997379ec6ea93ce8dc2cdb9dc769c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "observation that GPUs are throughput-oriented computing devices. CPUs are very sensitive to memory system latency and per-instruction scheduling due to high single-threaded instruction level parallelism (ILP). This makes getting exact cycle duration for events important in achieving good silicon correlation with simulation platforms. Conversely, GPUs tend to be latency tolerant thanks to their heavy use of massive multithreading. We have observed that overall GPU simulator accuracy is negligibly affected by small inaccuracies in microarchitectural latency, and thus near-cycle accuracy when implementing most GPU structures is not required. Exploiting this latency tolerance allows us to approach GPU simulation philosophically as a complex model of dynamically interacting roofline components, rather than a CPU-like system in which tracking the detailed cycle-by-cycle progression of all components is necessary."}], "lineHeight": 0}}, "target": {"markdown": "observation 表明 GPU 是一种面向吞吐量的计算设备。CPU 对内存系统延迟以及逐指令调度高度敏感，这是因为其具有较高的单线程指令级并行度（ILP）。这使得在仿真平台上获得事件精确的周期数对于实现良好的硅片相关性至关重要。相反，GPU 由于大量采用大规模多线程技术，往往具有较强的延迟容忍能力。我们观察到，对于 GPU 仿真器整体精度而言，微架构延迟上的小幅不精确几乎可以忽略不计，因此，在实现大多数 GPU 结构时，并不需要达到近乎周期级的精度。利用这种延迟容忍特性，我们得以在理念上将 GPU 仿真视为一个由众多动态交互的 roofline 组件所构成的复杂模型，而非像 CPU 系统那样需要精确追踪所有组件逐周期推进细节的系统。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "5a35eb8bedb48f1952549f0a03db191c", "index": 25, "aliyun_index": 1, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### B. GPU Computing Beyond HPC\n", "text": "B. GPU Computing Beyond HPC\n", "alignment": "left", "unique_id": "5a35eb8bedb48f1952549f0a03db191c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. GPU Computing Beyond HPC"}], "lineHeight": 0}}, "target": {"markdown": "### B. 超算之外的 GPU 计算\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "94e17832ce4b47b14553fe1876843157", "index": 26, "aliyun_index": 2, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "While GPU computing is now a mainstay of HPC, GPUs are also seeing widespread adoption for data center machine learning training and inference. New benchmarks such as Baidu's Deepbench [5] are the first step towards producing representative ML benchmarks, and ultimately architects must utilize realistic ML training that captures both inter and intra-layer reuse. MLPerf [35], [49] is the industry standard for benchmarking single and scale-out GPU configurations (or other non-GPU platforms) for machine learning performance. To successfully capture and model just a single iteration of many MLPerf workloads, GPU simulation platforms must be able to execute approximately 11 billion warp level instructions in a reasonable time, and must also capture communication and reuse patterns between kernels rather than relying on snippets plucked from individual kernels. As shown in Figure 1, this level of workload complexity and duration is likely to be intractable on highly detailed simulators.  \n\n", "text": "While GPU computing is now a mainstay of HPC, GPUs are also seeing widespread adoption for data center machine learning training and inference. New benchmarks such as Baidu's Deepbench [5] are the first step towards producing representative ML benchmarks, and ultimately architects must utilize realistic ML training that captures both inter and intra-layer reuse. MLPerf [35], [49] is the industry standard for benchmarking single and scale-out GPU configurations (or other non-GPU platforms) for machine learning performance. To successfully capture and model just a single iteration of many MLPerf workloads, GPU simulation platforms must be able to execute approximately 11 billion warp level instructions in a reasonable time, and must also capture communication and reuse patterns between kernels rather than relying on snippets plucked from individual kernels. As shown in Figure 1, this level of workload complexity and duration is likely to be intractable on highly detailed simulators.\n", "alignment": "left", "unique_id": "94e17832ce4b47b14553fe1876843157", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While GPU computing is now a mainstay of HPC, GPUs are also seeing widespread adoption for data center machine learning training and inference. New benchmarks such as Baidu's Deepbench [5] are the first step towards producing representative ML benchmarks, and ultimately architects must utilize realistic ML training that captures both inter and intra-layer reuse. MLPerf [35], [49] is the industry standard for benchmarking single and scale-out GPU configurations (or other non-GPU platforms) for machine learning performance. To successfully capture and model just a single iteration of many MLPerf workloads, GPU simulation platforms must be able to execute approximately 11 billion warp level instructions in a reasonable time, and must also capture communication and reuse patterns between kernels rather than relying on snippets plucked from individual kernels. As shown in Figure 1, this level of workload complexity and duration is likely to be intractable on highly detailed simulators."}], "lineHeight": 0}}, "target": {"markdown": "尽管 GPU 计算如今已成为高性能计算（HPC）的主流，但 GPU 同样正被广泛用于数据中心的机器学习训练与推理。百度推出的 DeepBench [5] 等新型基准测试是迈向生成具有代表性的机器学习基准的第一步；而架构师最终必须采用能够同时刻画层间与层内数据复用的真实机器学习训练流程。MLPerf [35]、[49] 是针对单机及横向扩展 GPU 配置（或其他非 GPU 平台）进行机器学习性能评估的行业标准。为了成功捕获并建模仅一次迭代的众多 MLPerf 工作负载，GPU 仿真平台必须能在合理的时间内执行大约 110 亿条 warp 级指令，并且还必须刻画核函数之间的通信与复用模式，而非仅仅依赖从单个核函数中截取的片段。如图 1 所示，这种规模和复杂度的工作负载在高度细节化的仿真器上很可能难以应对。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "10c28b603a9063e8342a73055d105110", "index": 27, "aliyun_index": 3, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Large ML workload training demands often cannot be satisfied by a single GPU and scaling performance by employing multiple GPUs is commonplace. This places data and kernel placement decisions of high-level ML frameworks on the critical path for overall application performance, making it difficult to distill out a single (or even multiple) key inner loop(s) as have historically been used to optimize HPC performance on GPUs. Going forward, scalable GPU performance is increasingly likely to depend on the co-design of software runtimes and GPU architecture to account for application features like task distribution across GPUs, memory placement and migration among GPUs, and GPU network interaction. As a result, we believe GPU simulation platforms must evolve their capabilities and speed to successfully model realistic multi-GPU workloads rather than focusing on small single GPU benchmarks which are inherently easier to simulate.  \n\n", "text": "Large ML workload training demands often cannot be satisfied by a single GPU and scaling performance by employing multiple GPUs is commonplace. This places data and kernel placement decisions of high-level ML frameworks on the critical path for overall application performance, making it difficult to distill out a single (or even multiple) key inner loop(s) as have historically been used to optimize HPC performance on GPUs. Going forward, scalable GPU performance is increasingly likely to depend on the co-design of software runtimes and GPU architecture to account for application features like task distribution across GPUs, memory placement and migration among GPUs, and GPU network interaction. As a result, we believe GPU simulation platforms must evolve their capabilities and speed to successfully model realistic multi-GPU workloads rather than focusing on small single GPU benchmarks which are inherently easier to simulate.\n", "alignment": "left", "unique_id": "10c28b603a9063e8342a73055d105110", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Large ML workload training demands often cannot be satisfied by a single GPU and scaling performance by employing multiple GPUs is commonplace. This places data and kernel placement decisions of high-level ML frameworks on the critical path for overall application performance, making it difficult to distill out a single (or even multiple) key inner loop(s) as have historically been used to optimize HPC performance on GPUs. Going forward, scalable GPU performance is increasingly likely to depend on the co-design of software runtimes and GPU architecture to account for application features like task distribution across GPUs, memory placement and migration among GPUs, and GPU network interaction. As a result, we believe GPU simulation platforms must evolve their capabilities and speed to successfully model realistic multi-GPU workloads rather than focusing on small single GPU benchmarks which are inherently easier to simulate."}], "lineHeight": 0}}, "target": {"markdown": "大型机器学习工作负载的训练需求往往无法由单块 GPU 满足，通过多块 GPU 来扩展性能已成为普遍做法。这使得高层机器学习框架中的数据与核函数放置决策被置于整体应用性能的关键路径上，从而难以像以往针对 GPU 上的 HPC 性能优化那样，提炼出单一（甚至多个）关键的内层循环。展望未来，可扩展的 GPU 性能将日益依赖于软件运行时与 GPU 架构的协同设计，以应对跨 GPU 的任务分配、GPU 间的内存放置与迁移以及 GPU 网络交互等应用特征。因此，我们认为 GPU 仿真平台必须不断演进其能力与速度，以成功建模真实的多 GPU 工作负载，而非仅仅聚焦于那些本质上更易于仿真的小型单 GPU 基准测试。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "039f63cf488b809cd6a9b6a01b7c0737", "index": 28, "aliyun_index": 4, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### C. Simulating GPU Assembly versus High-Level ISAs\n", "text": "C. Simulating GPU Assembly versus High-Level ISAs\n", "alignment": "left", "unique_id": "039f63cf488b809cd6a9b6a01b7c0737", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "C. Simulating GPU Assembly versus High-Level ISAs"}], "lineHeight": 0}}, "target": {"markdown": "### C. 模拟 GPU 汇编与高级 ISA\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "1bae8f951a444b6846ba777833725334", "index": 29, "aliyun_index": 5, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "To optimize for performance many NVIDIA mission critical\nlibraries such as cuDNN [41] and cuBLAS [40] rely on\nhighly optimized GPU assembly (SASS) rather than higher\nlevel programming languages or Parallel Thread Execution  \n\n", "text": "To optimize for performance many NVIDIA mission critical\nlibraries such as cuDNN [41] and cuBLAS [40] rely on\nhighly optimized GPU assembly (SASS) rather than higher\nlevel programming languages or Parallel Thread Execution\n", "alignment": "left", "unique_id": "1bae8f951a444b6846ba777833725334", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To optimize for performance many NVIDIA mission critical"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "libraries such as cuDNN [41] and cuBLAS [40] rely on"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "highly optimized GPU assembly (SASS) rather than higher"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "level programming languages or Parallel Thread Execution"}], "lineHeight": -115}}, "target": {"markdown": "为了追求极致性能，许多 NVIDIA 关键任务级库（如 cuDNN [41] 和 cuBLAS [40]）都依赖于高度优化的 GPU 汇编（SASS），而非更高级的编程语言或并行线程执行（PTX）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "96e7b9249eb53b8199ba34aea3c056de", "index": 30, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "ISA (PTX) based routines. These per-product tuned routines may outperform naive versions that are implemented in CUDA/C++ by as much as 50%, resulting in dramatically different hardware utilization and bottleneck analysis. It is critical that architects examine the routines that are used in production environments rather than pedagogical examples, or they risk making incorrect architectural optimizations in future products. Further, even for high-level written code prior work has also shown that HSA-level simulation is less accurate than GPU assembly-level simulation because of the layer of indirection caused by code finalization [21].  \n\n", "text": "ISA (PTX) based routines. These per-product tuned routines may outperform naive versions that are implemented in CUDA/C++ by as much as 50%, resulting in dramatically different hardware utilization and bottleneck analysis. It is critical that architects examine the routines that are used in production environments rather than pedagogical examples, or they risk making incorrect architectural optimizations in future products. Further, even for high-level written code prior work has also shown that HSA-level simulation is less accurate than GPU assembly-level simulation because of the layer of indirection caused by code finalization [21].\n", "alignment": "left", "unique_id": "96e7b9249eb53b8199ba34aea3c056de", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ISA (PTX) based routines. These per-product tuned routines may outperform naive versions that are implemented in CUDA/C++ by as much as 50%, resulting in dramatically different hardware utilization and bottleneck analysis. It is critical that architects examine the routines that are used in production environments rather than pedagogical examples, or they risk making incorrect architectural optimizations in future products. Further, even for high-level written code prior work has also shown that HSA-level simulation is less accurate than GPU assembly-level simulation because of the layer of indirection caused by code finalization [21]."}], "lineHeight": 0}}, "target": {"markdown": "ISA（PTX）例程。针对每款产品单独调优的这些例程，其性能可能比用 CUDA/C++ 实现的朴素版本高出多达 50%，从而在硬件利用率和瓶颈分析上呈现出截然不同的结果。架构师必须审视那些在生产环境中实际使用的例程，而非教学示例，否则就有在未来产品中做出错误架构优化决策的风险。此外，即便对于以高级语言编写的代码，已有研究也表明 HSA 层面的仿真精度低于 GPU 汇编层面的仿真，因为代码最终化（code finalization）所引入的间接层会带来额外的偏差 [21]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "08dba868945f16876c85fd2854cd3694", "index": 31, "aliyun_index": 7, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Despite these new challenges that are largely unique to GPUs (versus CPUs), they are not insurmountable. Focusing development effort to find solutions that overcome simulation speed, scale, and accuracy issues is difficult within an industry environment and is undoubtedly harder for those outside industry. We applaud academic research teams that do their best to make informed estimations about the behavior of propriety hardware with limited development resources. We now present specific choices made while developing NVAS to help advance the community's GPU simulation best practices and allow them to focus on the GPU architectural issues that matter most while avoiding wasted effort on those that do not.  \n\n", "text": "Despite these new challenges that are largely unique to GPUs (versus CPUs), they are not insurmountable. Focusing development effort to find solutions that overcome simulation speed, scale, and accuracy issues is difficult within an industry environment and is undoubtedly harder for those outside industry. We applaud academic research teams that do their best to make informed estimations about the behavior of propriety hardware with limited development resources. We now present specific choices made while developing NVAS to help advance the community's GPU simulation best practices and allow them to focus on the GPU architectural issues that matter most while avoiding wasted effort on those that do not.\n", "alignment": "left", "unique_id": "08dba868945f16876c85fd2854cd3694", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Despite these new challenges that are largely unique to GPUs (versus CPUs), they are not insurmountable. Focusing development effort to find solutions that overcome simulation speed, scale, and accuracy issues is difficult within an industry environment and is undoubtedly harder for those outside industry. We applaud academic research teams that do their best to make informed estimations about the behavior of propriety hardware with limited development resources. We now present specific choices made while developing NVAS to help advance the community's GPU simulation best practices and allow them to focus on the GPU architectural issues that matter most while avoiding wasted effort on those that do not."}], "lineHeight": 0}}, "target": {"markdown": "尽管这些新挑战在 GPU（相较于 CPU）上尤为突出，但并非不可克服。在工业环境中聚焦研发力量以攻克仿真速度、可扩展性与精度问题已属不易，对于学术界而言更是难上加难。我们对那些在有限开发资源条件下尽力对专有硬件行为做出合理估算的学术研究团队表示由衷的赞赏。接下来，我们将介绍在 NVAS 开发过程中所做出的若干具体选择，以期推动社区 GPU 仿真最佳实践的发展，使研究人员能够聚焦于真正重要的 GPU 架构问题，避免在无关紧要之处徒费精力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "6e0df59bd732e5f56901b051e48c5a93", "index": 32, "aliyun_index": 8, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## III. SIMULATOR DESIGN CHOICES IN NVARCHSIM\n", "text": "III. SIMULATOR DESIGN CHOICES IN NVARCHSIM\n", "alignment": "left", "unique_id": "6e0df59bd732e5f56901b051e48c5a93", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "III. SIMULATOR DESIGN CHOICES IN NVARCHSIM"}], "lineHeight": 0}}, "target": {"markdown": "## III. NVArchSim 中的仿真器设计选择\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "90d2ec0532c4beafd329ba8fd2e55249", "index": 33, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "NVArchSim is a hybrid trace- and execution-driven, loosely\ncycle accurate GPU simulator equipped with swappable com-\nponents. These design features allow NVAS to meet our\noverarching goals; namely, achieving fast simulation speed\nwithout sacrificing accuracy and trustworthiness.  \n\n", "text": "NVArchSim is a hybrid trace- and execution-driven, loosely\ncycle accurate GPU simulator equipped with swappable com-\nponents. These design features allow NVAS to meet our\noverarching goals; namely, achieving fast simulation speed\nwithout sacrificing accuracy and trustworthiness.\n", "alignment": "left", "unique_id": "90d2ec0532c4beafd329ba8fd2e55249", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVArchSim is a hybrid trace- and execution-driven, loosely"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cycle accurate GPU simulator equipped with swappable com-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ponents. These design features allow NVAS to meet our"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "overarching goals; namely, achieving fast simulation speed"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "without sacrificing accuracy and trustworthiness."}], "lineHeight": -144}}, "target": {"markdown": "NVArchSim 是一款混合式（兼具追踪驱动与执行驱动）、松散周期精度的 GPU 仿真器，并支持可替换的组件。这些设计特性使得 NVAS 能够实现我们的总体目标——即在仿真速度和精度与可信度之间取得平衡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "ce0986fa4b5f0c1f4f8c21bc533adcfa", "index": 34, "aliyun_index": 10, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### A. Architecture Model and Fidelity\n", "text": "A. Architecture Model and Fidelity\n", "alignment": "left", "unique_id": "ce0986fa4b5f0c1f4f8c21bc533adcfa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Architecture Model and Fidelity"}], "lineHeight": 0}}, "target": {"markdown": "### A. 架构模型与保真度\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "7965c6490dd94992b80d9b52712c391c", "index": 35, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "As shown in Figure 2, a NVAS simulation implements a system level model composed of one or more GPUs that are driven via a high-level CPU model. The CPU model performs three main functions: 1) It executes the flow of CUDA driver APIs. 2) It interacts with a lightweight version of the Unified Memory (UM) driver for page allocation, release, and other memory management functions, if necessary. 3) It dispatches work (typically CUDA kernel calls or DMA memory copies) to the GPU(s). Each core in the CPU model is associated with a single simulated application, and NVAS allows concurrent execution of multiple simulated applications within a system.  \n\n", "text": "As shown in Figure 2, a NVAS simulation implements a system level model composed of one or more GPUs that are driven via a high-level CPU model. The CPU model performs three main functions: 1) It executes the flow of CUDA driver APIs. 2) It interacts with a lightweight version of the Unified Memory (UM) driver for page allocation, release, and other memory management functions, if necessary. 3) It dispatches work (typically CUDA kernel calls or DMA memory copies) to the GPU(s). Each core in the CPU model is associated with a single simulated application, and NVAS allows concurrent execution of multiple simulated applications within a system.\n", "alignment": "left", "unique_id": "7965c6490dd94992b80d9b52712c391c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As shown in Figure 2, a NVAS simulation implements a system level model composed of one or more GPUs that are driven via a high-level CPU model. The CPU model performs three main functions: 1) It executes the flow of CUDA driver APIs. 2) It interacts with a lightweight version of the Unified Memory (UM) driver for page allocation, release, and other memory management functions, if necessary. 3) It dispatches work (typically CUDA kernel calls or DMA memory copies) to the GPU(s). Each core in the CPU model is associated with a single simulated application, and NVAS allows concurrent execution of multiple simulated applications within a system."}], "lineHeight": 0}}, "target": {"markdown": "如图 2 所示，NVAS 仿真实现了一个系统级模型，该模型由一个高层 CPU 模型驱动的一块或多块 GPU 组成。CPU 模型承担三项主要功能：1）执行 CUDA 驱动 API 的调用流程；2）在必要时与轻量版的统一内存（Unified Memory, UM）驱动进行交互，以完成页面分配、释放以及其他内存管理操作；3）将工作负载（通常是 CUDA 核函数调用或 DMA 内存拷贝）分派给 GPU。CPU 模型中的每个核心与一个被仿真的应用相对应，并且 NVAS 支持在单个系统内并发执行多个仿真应用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "8ebe7456175ea61f1315cd7b0c161a2b", "index": 36, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Each GPU component contains a hardware task engine that receives and processes CUDA API calls from the CPU and schedules the resulting cooperative thread arrays (CTAs) on the various streaming multiprocessors (SMs), which ultimately are responsible for executing the warp-level instructions. Each GPU contains a hierarchy of graphics processing clusters (GPCs), each of which has multiple texture processing clusters (TPCs) containing multiple SMs and L1 caches. Additionally, there is both a private and shared TLB hierarchy assisted by a hardware page table walker (PTW). Each GPC is connected via an on-chip interconnect to multiple slices of a shared physically addressed L2 cache that typically is the GPU's point of coherence for physical addresses.  \n\n", "text": "Each GPU component contains a hardware task engine that receives and processes CUDA API calls from the CPU and schedules the resulting cooperative thread arrays (CTAs) on the various streaming multiprocessors (SMs), which ultimately are responsible for executing the warp-level instructions. Each GPU contains a hierarchy of graphics processing clusters (GPCs), each of which has multiple texture processing clusters (TPCs) containing multiple SMs and L1 caches. Additionally, there is both a private and shared TLB hierarchy assisted by a hardware page table walker (PTW). Each GPC is connected via an on-chip interconnect to multiple slices of a shared physically addressed L2 cache that typically is the GPU's point of coherence for physical addresses.\n", "alignment": "left", "unique_id": "8ebe7456175ea61f1315cd7b0c161a2b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Each GPU component contains a hardware task engine that receives and processes CUDA API calls from the CPU and schedules the resulting cooperative thread arrays (CTAs) on the various streaming multiprocessors (SMs), which ultimately are responsible for executing the warp-level instructions. Each GPU contains a hierarchy of graphics processing clusters (GPCs), each of which has multiple texture processing clusters (TPCs) containing multiple SMs and L1 caches. Additionally, there is both a private and shared TLB hierarchy assisted by a hardware page table walker (PTW). Each GPC is connected via an on-chip interconnect to multiple slices of a shared physically addressed L2 cache that typically is the GPU's point of coherence for physical addresses."}], "lineHeight": 0}}, "target": {"markdown": "每个 GPU 组件都包含一个硬件任务引擎，负责接收并处理来自 CPU 的 CUDA API 调用，并将由此产生的协作线程数组（CTA）调度到各个流多处理器（SM）上，最终由 SM 负责执行 warp 级指令。每块 GPU 都包含一个图形处理簇（GPC）层次结构，其中每个 GPC 拥有多个纹理处理簇（TPC），每个 TPC 又包含多个 SM 和 L1 缓存。此外，GPU 还配备由硬件页表遍历器（PTW）支撑的私有与共享两级 TLB 层次结构。每个 GPC 通过片上互连与共享物理地址 L2 缓存的多个切片相连，该 L2 缓存通常是 GPU 物理地址的一致性节点。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "bcc56f533bc1e50a5bd198bab3679453", "index": 37, "aliyun_index": 0, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![bcc56f533bc1e50a5bd198bab3679453.jpeg](figures/bcc56f533bc1e50a5bd198bab3679453_68b1a8b2.png)  \n\n", "text": "> **说明**：\n> - “UM driver layer” 位于最上层，管理多个 CPU。\n> - 每个 CPU 关联一个“CPU Mem”。\n> - 所有 CPU 通过 “PCI Express” 与 GPU 系统通信。\n\n---\n\n## 中央：GPU-0 内部结构\n\n\n> **说明**：\n> - `Task Engine` 是 GPU-0 的入口点，接收来自 PCI Express 的任务。\n> - `GPC-0` 包含 `TPC-0` → `SM-0` → `L1 $` 的计算流水线。\n> - `L1 TLB` 和 `L2 TLB` 构成两级页表缓存，`PTW`（P
