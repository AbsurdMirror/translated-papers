       ├── libcuda   ← 运行时库（静态/动态链接）\n                          └── ...\n\nExecutable\n    ↓ (通过 PCI-E 总线)\nNVIDIA GPU ←───────────────\n             （加载并执行 cubin.bin）\n\nExecutable\n    ↓ (由 GPGPU-Sim 拦截)\nGPGPU-Sim                 ← 用户指定模拟工具\n    ↓ (模拟 GPU 行为)\nSimulated Execution       ← 不依赖真实硬件\n\n\n\n> - GPGPU-Sim 是一个周期精确的 GPU 模拟器  \n> - 可替换真实 GPU，用于性能分析、架构研究等  \n> - “User-specific tool/file” 可能指配置文件、插件或定制模块\n\n---\n\n## 组件分类汇总\n\n| 类别                  | 组件                     |\n|-----------------------|--------------------------|\n| **Tool**              | cudafe + nvopencc, ptxas, C/C++ compiler, GPGPU-Sim |\n| **File**              | .cpp, .cu, Host C code, .ptx, cubin.bin, libcuda.a, Executable, libcuda |\n| **Nvidia Toolkit**    | cudafe, nvopencc, ptxas, libcuda.a, libcuda         |\n| **GPGPU-Sim**         | GPGPU-Sim（模拟器本身）                             |\n| **User-specific**     | 可能包括自定义脚本、配置、补丁等                    |\n| **Hardware Interface**| PCI-E（连接主机与 GPU）                           |\n\n---\n\n## 关键路径总结\n\n1. **源码输入** → `.cpp` / `.cu`\n2. **CUDA 前端** → 分离主机代码 & 生成 PTX\n3. **PTX 编译** → `ptxas` → `cubin.bin`\n4. **主机编译链接** → C/C++ compiler + `libcuda.a` + `cubin.bin` → `Executable`\n5. **执行**：\n   - 真实 GPU：通过 PCI-E 加载 `cubin.bin`，由 `libcuda` 驱动\n   - 模拟器：GPGPU-Sim 拦截执行，模拟 GPU 行为\n\n---\n\n✅ 此 Markdown 结构完整保留了原始图中的所有节点、箭头流向、标签及隐含逻辑，适用于文档化、教学或自动化解析场景。", "alignment": "left", "unique_id": "8c9ce5cfa357288e3862875536872d9c", "edited": false, "extra": {}}, "target": {"markdown": "![8c9ce5cfa357288e3862875536872d9c.jpeg](figures/8c9ce5cfa357288e3862875536872d9c_4516c575.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "55d2e814812b6ae7cf4eacfeb5cd0db8", "index": 47, "aliyun_index": 1, "page_num": 3, "type": "figure_note", "sub_type": "none", "markdown": ">(a) CUDA Flow with GPU Hardware  \n\n", "text": "(a) CUDA Flow with GPU Hardware\n", "alignment": "left", "unique_id": "55d2e814812b6ae7cf4eacfeb5cd0db8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(a) CUDA Flow with GPU Hardware"}], "lineHeight": 0}}, "target": {"markdown": ">(a) GPU 硬件中的 CUDA 执行流程", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "46681145cbca67e28608014d60ba41b2", "index": 48, "aliyun_index": 2, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![46681145cbca67e28608014d60ba41b2.jpeg](figures/46681145cbca67e28608014d60ba41b2_447fdd7f.png)  \n\n", "text": "# Application\n\n- **Source code (.cpp)**\n- **Source code (.cu)**\n\n## Compilation Process\n\n1. **cuda + nvopencc**\n   - Input: Source code (.cu)\n   - Output: \n     - Host C code\n     - .ptx\n\n2. **C/C++ compiler**\n   - Inputs:\n     - Host C code\n     - Custom libcuda.a\n   - Output: Executable (with Custom libcuda)\n\n3. **ptxas**\n   - Input: .ptx\n   - Output: per thread register usage\n\n## Execution and Simulation\n\n- **Executable**\n  - Contains: Custom libcuda\n  - Function call → GPGPU-Sim\n\n- **GPGPU-Sim**\n  - Input: Function call from Executable\n  - Output: Statistics\n\n\n\n\n这个 Markdown 格式准确地保留了图片中的所有步骤和细节，包括源代码文件、编译过程、链接库、执行文件和模拟器之间的关系。", "alignment": "left", "unique_id": "46681145cbca67e28608014d60ba41b2", "edited": false, "extra": {}}, "target": {"markdown": "![46681145cbca67e28608014d60ba41b2.jpeg](figures/46681145cbca67e28608014d60ba41b2_447fdd7f.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "6c2f275000ed1ad4761bfaeeb584ea53", "index": 49, "aliyun_index": 3, "page_num": 3, "type": "figure_note", "sub_type": "none", "markdown": ">(b) GPGPU-Sim  \n\n", "text": "(b) GPGPU-Sim\n", "alignment": "left", "unique_id": "6c2f275000ed1ad4761bfaeeb584ea53", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(b) GPGPU-Sim"}], "lineHeight": 0}}, "target": {"markdown": ">(b) GPGPU-Sim", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "3e0a93c5cdaefe331e54fd4c218ae929", "index": 50, "aliyun_index": 4, "page_num": 3, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 3. Compilation Flow for GPGPU-Sim from a CUDA application in comparison to the normal CUDA compilation flow.  \n\n", "text": "Figure 3. Compilation Flow for GPGPU-Sim from a CUDA application in comparison to the normal CUDA compilation flow.\n", "alignment": "left", "unique_id": "3e0a93c5cdaefe331e54fd4c218ae929", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3. Compilation Flow for GPGPU-Sim from a CUDA application in comparison to the normal CUDA compilation flow."}], "lineHeight": 0}}, "target": {"markdown": ">图 3. GPGPU-Sim 从 CUDA 应用进行编译的流程，与正常的 CUDA 编译流程的对比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "8a4d2992f6154657e80a838f0facc92c", "index": 51, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "threads can be coalesced into fewer wide memory accesses if they all access a contiguous memory region [33]. Our baseline models similar intra-warp memory coalescing behavior (we attempt to coalesce memory accesses from all 32 threads in a warp).  \n\n", "text": "threads can be coalesced into fewer wide memory accesses if they all access a contiguous memory region [33]. Our baseline models similar intra-warp memory coalescing behavior (we attempt to coalesce memory accesses from all 32 threads in a warp).\n", "alignment": "left", "unique_id": "8a4d2992f6154657e80a838f0facc92c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "threads can be coalesced into fewer wide memory accesses if they all access a contiguous memory region [33]. Our baseline models similar intra-warp memory coalescing behavior (we attempt to coalesce memory accesses from all 32 threads in a warp)."}], "lineHeight": 0}}, "target": {"markdown": "如果它们都访问同一块连续的存储区域，则可以将这些并行存储访问合并为更少、更宽的存储访问 [33]。我们的基线模型实现了类似的 warp 内存储合并行为（我们尝试合并同一 warp 中全部 32 个线程的存储访问）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "e78c17e4b2d42cba9e13d4cae6738f8b", "index": 52, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "A related issue is that since the GPU is heavily multi-threaded a balanced design must support many outstanding memory requests at once. While microprocessors typically employ miss-status holding registers (MSHRs) [21] that use associative comparison logic merge simultaneous requests for the same cache block, the number of outstanding misses that can be supported is typically small (e.g., the original Intel Pentium 4 used four MSHRs [16]). One way to support a far greater number of outstanding memory requests is to use a FIFO for outstanding memory requests [17]. Similarly, our baseline does not attempt to eliminate multiple requests for the same block of memory on cache misses or local/global memory accesses. However, we also explore the possibility of improving performance by coalescing read memory requests from later warps that require access to data for which a memory request is already in progress due to another warp running on the same shader core. We call this inter-warp memory coalescing. We observe that inter-warp memory coalescing can significantly reduce memory traffic for applications that contain data dependent accesses to memory. The data for inter-warp merging quantifies the benefit of supporting large capacity MSHRs that can detect a secondary access to an outstanding request [45].  \n\n", "text": "A related issue is that since the GPU is heavily multi-threaded a balanced design must support many outstanding memory requests at once. While microprocessors typically employ miss-status holding registers (MSHRs) [21] that use associative comparison logic merge simultaneous requests for the same cache block, the number of outstanding misses that can be supported is typically small (e.g., the original Intel Pentium 4 used four MSHRs [16]). One way to support a far greater number of outstanding memory requests is to use a FIFO for outstanding memory requests [17]. Similarly, our baseline does not attempt to eliminate multiple requests for the same block of memory on cache misses or local/global memory accesses. However, we also explore the possibility of improving performance by coalescing read memory requests from later warps that require access to data for which a memory request is already in progress due to another warp running on the same shader core. We call this inter-warp memory coalescing. We observe that inter-warp memory coalescing can significantly reduce memory traffic for applications that contain data dependent accesses to memory. The data for inter-warp merging quantifies the benefit of supporting large capacity MSHRs that can detect a secondary access to an outstanding request [45].\n", "alignment": "left", "unique_id": "e78c17e4b2d42cba9e13d4cae6738f8b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A related issue is that since the GPU is heavily multi-threaded a balanced design must support many outstanding memory requests at once. While microprocessors typically employ miss-status holding registers (MSHRs) [21] that use associative comparison logic merge simultaneous requests for the same cache block, the number of outstanding misses that can be supported is typically small (e.g., the original Intel Pentium 4 used four MSHRs [16]). One way to support a far greater number of outstanding memory requests is to use a FIFO for outstanding memory requests [17]. Similarly, our baseline does not attempt to eliminate multiple requests for the same block of memory on cache misses or local/global memory accesses. However, we also explore the possibility of improving performance by coalescing read memory requests from later warps that require access to data for which a memory request is already in progress due to another warp running on the same shader core. We call this inter-warp memory coalescing. We observe that inter-warp memory coalescing can significantly reduce memory traffic for applications that contain data dependent accesses to memory. The data for inter-warp merging quantifies the benefit of supporting large capacity MSHRs that can detect a secondary access to an outstanding request [45]."}], "lineHeight": 0}}, "target": {"markdown": "一个与之相关的问题是，鉴于 GPU 高度多线程化，平衡的设计必须同时支持大量未完成的存储请求。虽然微处理器通常采用未命中状态保持寄存器（MSHR）[21] 来利用关联比较逻辑合并对同一缓存块的并发请求，但其所支持的未完成未命中数量通常较少（例如，最初的 Intel Pentium 4 仅使用了 4 个 MSHR [16]）。支持数量远多得多的未完成存储请求的一种方法是使用 FIFO 队列来管理未完成的存储请求 [17]。同样，我们的基线并不试图在缓存未命中或局部/全局存储访问时消除对同一存储块的多次请求。然而，我们还探索了通过合并来自后续 warp 的读存储请求来提升性能的可能性——这些后续 warp 所需访问的数据，已经因同一着色器核心上运行的其他 warp 而存在正在进行的存储请求。我们将此称为 warp 间存储合并。我们观察到，对于那些包含数据相关存储访问的应用而言，warp 间存储合并能够显著减少存储流量。warp 间合并的相关数据量化了支持大容量 MSHR（能够检测对未完成请求的二次访问）所带来的收益 [45]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "4a619b72344935977c42b6636b32c9bd", "index": 53, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "**2.2.4. Caching.** While coalescing memory requests captures spatial locality among threads, memory bandwidth requirements may be further reduced with caching if an application contains temporal locality or spatial locality within the access pattern of individual threads. We evaluate the performance impact of adding first level, per-core L1 caches for local and global memory access to the design described in Section 2.1. We also evaluate the effects of adding a shared L2 cache on the memory side of the interconnection network at the  \n\n", "text": "**2.2.4. Caching.** While coalescing memory requests captures spatial locality among threads, memory bandwidth requirements may be further reduced with caching if an application contains temporal locality or spatial locality within the access pattern of individual threads. We evaluate the performance impact of adding first level, per-core L1 caches for local and global memory access to the design described in Section 2.1. We also evaluate the effects of adding a shared L2 cache on the memory side of the interconnection network at the\n", "alignment": "left", "unique_id": "4a619b72344935977c42b6636b32c9bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**2.2.4. Caching.** While coalescing memory requests captures spatial locality among threads, memory bandwidth requirements may be further reduced with caching if an application contains temporal locality or spatial locality within the access pattern of individual threads. We evaluate the performance impact of adding first level, per-core L1 caches for local and global memory access to the design described in Section 2.1. We also evaluate the effects of adding a shared L2 cache on the memory side of the interconnection network at the"}], "lineHeight": 0}}, "target": {"markdown": "**2.2.4. 缓存。** 存储请求的合并利用了线程间的空间局部性，而如果应用中包含时间局部性或单个线程访问模式内部的空间局部性，则通过缓存可以进一步降低存储带宽需求。我们评估了为 2.1 节所述的设计添加面向局部存储和全局存储访问的每核心一级 L1 缓存对性能的影响。我们还评估了在互联网络存储一侧添加共享 L2 缓存所带来的效果，相关内容将在", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "4ba44502cef3450eeb67c9e7af7b8bf7", "index": 54, "aliyun_index": 8, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "memory controller. While threads can only read from texture\nand constant memory, they can both read and write to local\nand global memory. In our evaluation of caches for local and\nglobal memory we model non-coherent caches. (Note that\nthreads from different CTAs in the applications we study do\nnot communicate through global memory.)  \n\n", "text": "memory controller. While threads can only read from texture\nand constant memory, they can both read and write to local\nand global memory. In our evaluation of caches for local and\nglobal memory we model non-coherent caches. (Note that\nthreads from different CTAs in the applications we study do\nnot communicate through global memory.)\n", "alignment": "left", "unique_id": "4ba44502cef3450eeb67c9e7af7b8bf7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "memory controller. While threads can only read from texture"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and constant memory, they can both read and write to local"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and global memory. In our evaluation of caches for local and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "global memory we model non-coherent caches. (Note that"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "threads from different CTAs in the applications we study do"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "not communicate through global memory.)"}], "lineHeight": -175}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "e0bcee90998734ba5f557891bde4c7e8", "index": 55, "aliyun_index": 9, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "# 2.3. Extending GPGPU-Sim to Support CUDA  \n\n", "text": "2.3. Extending GPGPU-Sim to Support CUDA\n", "alignment": "left", "unique_id": "e0bcee90998734ba5f557891bde4c7e8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.3. Extending GPGPU-Sim to Support CUDA"}], "lineHeight": 0}}, "target": {"markdown": "# 2.3. 扩展 GPGPU-Sim 以支持 CUDA", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "4e9556290acea5d1f829d6af29d5dcf4", "index": 56, "aliyun_index": 10, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "We extended GPGPU-Sim, the cycle-accurate simulator we developed for our earlier work [11]. GPGPU-Sim models various aspects of a massively parallel architecture with highly programmable pipelines similar to contemporary GPU architectures. A drawback of the previous version of GPGPU-Sim was the difficult and time-consuming process of converting/parallelizing existing applications [11]. We overcome this difficulty by extending GPGPU-Sim to support the CUDA Parallel Thread Execution (PTX) [35] instruction set. This enables us to simulate the numerous existing, optimized CUDA applications on GPGPU-Sim. Our current simulator infrastructure runs CUDA applications without source code modifications on Linux based platforms, but does require access to the application's source code. To build a CUDA application for our simulator, we replace the common.mk makefile used in the CUDA SDK with a version that builds the application to run on our microarchitecture simulator (while other more complex build scenarios may require more complex makefile changes).  \n\n", "text": "We extended GPGPU-Sim, the cycle-accurate simulator we developed for our earlier work [11]. GPGPU-Sim models various aspects of a massively parallel architecture with highly programmable pipelines similar to contemporary GPU architectures. A drawback of the previous version of GPGPU-Sim was the difficult and time-consuming process of converting/parallelizing existing applications [11]. We overcome this difficulty by extending GPGPU-Sim to support the CUDA Parallel Thread Execution (PTX) [35] instruction set. This enables us to simulate the numerous existing, optimized CUDA applications on GPGPU-Sim. Our current simulator infrastructure runs CUDA applications without source code modifications on Linux based platforms, but does require access to the application's source code. To build a CUDA application for our simulator, we replace the common.mk makefile used in the CUDA SDK with a version that builds the application to run on our microarchitecture simulator (while other more complex build scenarios may require more complex makefile changes).\n", "alignment": "left", "unique_id": "4e9556290acea5d1f829d6af29d5dcf4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We extended GPGPU-Sim, the cycle-accurate simulator we developed for our earlier work [11]. GPGPU-Sim models various aspects of a massively parallel architecture with highly programmable pipelines similar to contemporary GPU architectures. A drawback of the previous version of GPGPU-Sim was the difficult and time-consuming process of converting/parallelizing existing applications [11]. We overcome this difficulty by extending GPGPU-Sim to support the CUDA Parallel Thread Execution (PTX) [35] instruction set. This enables us to simulate the numerous existing, optimized CUDA applications on GPGPU-Sim. Our current simulator infrastructure runs CUDA applications without source code modifications on Linux based platforms, but does require access to the application's source code. To build a CUDA application for our simulator, we replace the common.mk makefile used in the CUDA SDK with a version that builds the application to run on our microarchitecture simulator (while other more complex build scenarios may require more complex makefile changes)."}], "lineHeight": 0}}, "target": {"markdown": "我们扩展了 GPGPU-Sim，这是我们早期工作中开发的周期精确模拟器 [11]。GPGPU-Sim 对大规模并行架构的诸多方面进行建模，其流水线高度可编程，类似于当代 GPU 架构。早先版本的 GPGPU-Sim 存在一个缺点，即对已有应用进行转换/并行化的过程十分困难且耗时 [11]。我们通过扩展 GPGPU-Sim 以支持 CUDA 线程并行执行（PTX）[35] 指令集来克服这一困难。这使我们能够在 GPGPU-Sim 上模拟大量已有的、经优化的 CUDA 应用。我们当前的模拟器基础设施能够在基于 Linux 的平台上无需修改源代码即可运行 CUDA 应用，但需要能够访问应用的源代码。为了在我们的模拟器上构建 CUDA 应用，我们将 CUDA SDK 中通用的 common.mk makefile 替换为一个能够将应用构建为运行于我们微架构模拟器之上的版本（而其他更复杂的构建场景可能需要更复杂的 makefile 修改）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "015e0ecf645df57be829311f8903f0ed", "index": 57, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Figure 3 shows how a CUDA application can be compiled for simulation on GPGPU-Sim and compares this compilation flow to the normal CUDA compilation flow [33]. Both compilation flows use *cuda* to transform the source code of a CUDA application into host C code running on the CPU and device C code running on the GPU. The GPU C code is then compiled into PTX assembly (labeled “.ptx” in Figure 3) by *nvopenc*, an open source compiler provided by NVIDIA based on Open64 [28, 36]. The PTX assembler (*ptxas*) then assembles the PTX assembly code into the target GPU’s native  \n\n", "text": "Figure 3 shows how a CUDA application can be compiled for simulation on GPGPU-Sim and compares this compilation flow to the normal CUDA compilation flow [33]. Both compilation flows use *cuda* to transform the source code of a CUDA application into host C code running on the CPU and device C code running on the GPU. The GPU C code is then compiled into PTX assembly (labeled “.ptx” in Figure 3) by *nvopenc*, an open source compiler provided by NVIDIA based on Open64 [28, 36]. The PTX assembler (*ptxas*) then assembles the PTX assembly code into the target GPU’s native\n", "alignment": "left", "unique_id": "015e0ecf645df57be829311f8903f0ed", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3 shows how a CUDA application can be compiled for simulation on GPGPU-Sim and compares this compilation flow to the normal CUDA compilation flow [33]. Both compilation flows use *cuda* to transform the source code of a CUDA application into host C code running on the CPU and device C code running on the GPU. The GPU C code is then compiled into PTX assembly (labeled “.ptx” in Figure 3) by *nvopenc*, an open source compiler provided by NVIDIA based on Open64 [28, 36]. The PTX assembler (*ptxas*) then assembles the PTX assembly code into the target GPU’s native"}], "lineHeight": 0}}, "target": {"markdown": "图 3 展示了如何将一个 CUDA 应用编译为可在 GPGPU-Sim 上运行的形式，并将该编译流程与正常的 CUDA 编译流程进行对比 [33]。两种编译流程均使用 *cuda* 将 CUDA 应用的源代码转换为运行于 CPU 上的主机端 C 代码和运行于 GPU 上的设备端 C 代码。随后，GPU 端 C 代码由 *nvopencc* 编译为 PTX 汇编（如图 3 中标记为 \".ptx\" 的文件），*nvopencc* 是 NVIDIA 基于 Open64 提供的开源编译器 [28, 36]。随后，PTX 汇编器（*ptxas*）将 PTX 汇编代码汇编为目标 GPU 的本地", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "ac45080a7e7d846a8bde54278986dc07", "index": 58, "aliyun_index": 0, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "ISA (labeled \"cubin.bin\" in Figure 3(a)). The assembled code is then combined with the host C code and compiled into a single executable linked with the CUDA Runtime API library (labeled \"libcud.a\" in Figure 3) by a standard C compiler. In the normal CUDA compilation flow (used with NVIDIA GPU hardware), the resulting executable calls the CUDA Runtime API to set up and invoke compute kernels onto the GPU via the NVIDIA CUDA driver.  \n\n", "text": "ISA (labeled \"cubin.bin\" in Figure 3(a)). The assembled code is then combined with the host C code and compiled into a single executable linked with the CUDA Runtime API library (labeled \"libcud.a\" in Figure 3) by a standard C compiler. In the normal CUDA compilation flow (used with NVIDIA GPU hardware), the resulting executable calls the CUDA Runtime API to set up and invoke compute kernels onto the GPU via the NVIDIA CUDA driver.\n", "alignment": "left", "unique_id": "ac45080a7e7d846a8bde54278986dc07", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ISA (labeled \"cubin.bin\" in Figure 3(a)). The assembled code is then combined with the host C code and compiled into a single executable linked with the CUDA Runtime API library (labeled \"libcud.a\" in Figure 3) by a standard C compiler. In the normal CUDA compilation flow (used with NVIDIA GPU hardware), the resulting executable calls the CUDA Runtime API to set up and invoke compute kernels onto the GPU via the NVIDIA CUDA driver."}], "lineHeight": 0}}, "target": {"markdown": "ISA（在图 3(a) 中标记为 \"cubin.bin\"）。汇编后的代码随后与主机端 C 代码合并，并由标准 C 编译器链接 CUDA 运行时 API 库（在图 3 中标记为 \"libcud.a\"）编译成单一可执行文件。在正常的 CUDA 编译流程中（用于 NVIDIA GPU 硬件），最终生成的可执行文件调用 CUDA 运行时 API，通过 NVIDIA CUDA 驱动程序在 GPU 上设置并启动计算内核。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "0110f9a964d466a2c252f6a666c455b6", "index": 59, "aliyun_index": 1, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "When a CUDA application is compiled to use GPGPU-Sim, many steps remain the same. However, rather than linking against the NVIDIA supplied libcuda.a binary, we link against our own libcuda.a binary. Our libcuda.a implements \"stub\" functions for the interface defined by the header files supplied with CUDA. These stub functions set up and invoke simulation sessions of the compute kernels on GPGPU-Sim (as shown in Figure 3(b)). Before the first simulation session, GPGPU-Sim parses the text format PTX assembly code generated by nvopenc to obtain code for the compute kernels. Because the PTX assembly code has no restriction on register usage (to improve portability between different GPU architectures), nvopenc performs register allocation using far more registers than typically required to avoid spilling. To improve the realism of our performance model, we determine the register usage per thread and shared memory used per CTA using $ptxas^4$. We then use this information to limit the number of CTAs that can run concurrently on a shader core. The GPU binary (cubin.bin) produced by $ptxas$ is not used by GPGPU-Sim. After parsing the PTX assembly code, but before beginning simulation, GPGPU-Sim performs an immediate post-dominator analysis on each kernel to annotate branch instructions with reconvergence points for the stack-based SIMD control flow handling mechanism described by Fung et al. [11]. During a simulation, a PTX functional simulator executes instructions from multiple threads according to their scheduling order as specified by the performance simulator. When the simulation completes, the host CPU code is then allowed to resume execution. In our current implementation, host code runs on a normal CPU, thus our performance measurements are for the GPU code only.  \n\n", "text": "When a CUDA application is compiled to use GPGPU-Sim, many steps remain the same. However, rather than linking against the NVIDIA supplied libcuda.a binary, we link against our own libcuda.a binary. Our libcuda.a implements \"stub\" functions for the interface defined by the header files supplied with CUDA. These stub functions set up and invoke simulation sessions of the compute kernels on GPGPU-Sim (as shown in Figure 3(b)). Before the first simulation session, GPGPU-Sim parses the text format PTX assembly code generated by nvopenc to obtain code for the compute kernels. Because the PTX assembly code has no restriction on register usage (to improve portability between different GPU architectures), nvopenc performs register allocation using far more registers than typically required to avoid spilling. To improve the realism of our performance model, we determine the register usage per thread and shared memory used per CTA using $ptxas^4$. We then use this information to limit the number of CTAs that can run concurrently on a shader core. The GPU binary (cubin.bin) produced by $ptxas$ is not used by GPGPU-Sim. After parsing the PTX assembly code, but before beginning simulation, GPGPU-Sim performs an immediate post-dominator analysis on each kernel to annotate branch instructions with reconvergence points for the stack-based SIMD control flow handling mechanism described by Fung et al. [11]. During a simulation, a PTX functional simulator executes instructions from multiple threads according to their scheduling order as specified by the performance simulator. When the simulation completes, the host CPU code is then allowed to resume execution. In our current implementation, host code runs on a normal CPU, thus our performance measurements are for the GPU code only.\n", "alignment": "left", "unique_id": "0110f9a964d466a2c252f6a666c455b6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When a CUDA application is compiled to use GPGPU-Sim, many steps remain the same. However, rather than linking against the NVIDIA supplied libcuda.a binary, we link against our own libcuda.a binary. Our libcuda.a implements \"stub\" functions for the interface defined by the header files supplied with CUDA. These stub functions set up and invoke simulation sessions of the compute kernels on GPGPU-Sim (as shown in Figure 3(b)). Before the first simulation session, GPGPU-Sim parses the text format PTX assembly code generated by nvopenc to obtain code for the compute kernels. Because the PTX assembly code has no restriction on register usage (to improve portability between different GPU architectures), nvopenc performs register allocation using far more registers than typically required to avoid spilling. To improve the realism of our performance model, we determine the register usage per thread and shared memory used per CTA using $ptxas^4$. We then use this information to limit the number of CTAs that can run concurrently on a shader core. The GPU binary (cubin.bin) produced by $ptxas$ is not used by GPGPU-Sim. After parsing the PTX assembly code, but before beginning simulation, GPGPU-Sim performs an immediate post-dominator analysis on each kernel to annotate branch instructions with reconvergence points for the stack-based SIMD control flow handling mechanism described by Fung et al. [11]. During a simulation, a PTX functional simulator executes instructions from multiple threads according to their scheduling order as specified by the performance simulator. When the simulation completes, the host CPU code is then allowed to resume execution. In our current implementation, host code runs on a normal CPU, thus our performance measurements are for the GPU code only."}], "lineHeight": 0}}, "target": {"markdown": "当一个 CUDA 应用被编译以使用 GPGPU-Sim 时，许多步骤保持不变。然而，我们链接的并非 NVIDIA 提供的 libcuda.a 二进制文件，而是我们自己的 libcuda.a。我们的 libcuda.a 为 CUDA 头文件所定义的接口实现了\"桩\"（stub）函数。这些桩函数在 GPGPU-Sim 上设置并启动计算内核的模拟会话（如图 3(b) 所示）。在第一次模拟会话之前，GPGPU-Sim 会解析由 nvopencc 生成的文本格式 PTX 汇编代码，以获取计算内核的代码。由于 PTX 汇编代码对寄存器的使用没有任何限制（为了提高在不同 GPU 架构之间的可移植性），nvopencc 在执行寄存器分配时使用了远多于实际所需数量的寄存器，以避免发生寄存器溢出。为了提升我们性能模型的真实性，我们使用 $ptxas^4$ 来确定每个线程的寄存器使用量以及每个 CTA 所使用的共享内存。随后，我们利用这些信息来限制可在单个着色器核心上并发运行的 CTA 数量。由 $ptxas$ 生成的 GPU 二进制文件（cubin.bin）并不被 GPGPU-Sim 所使用。在解析完 PTX 汇编代码之后、开始模拟之前，GPGPU-Sim 会对每个内核执行立即后支配（post-dominator）分析，从而为分支指令标注重汇聚点（reconvergence point），以用于 Fung 等人所描述的基于栈的 SIMD 控制流处理机制 [11]。在模拟过程中，PTX 功能模拟器根据性能模拟器所指定的调度顺序，执行来自多个线程的指令。当模拟完成后，主机端 CPU 代码即被允许继续执行。在我们当前的实现中，主机端代码运行于普通的 CPU 之上，因此我们的性能测量结果仅针对 GPU 代码部分。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "d67e62cee57335a501f9262789b3a785", "index": 60, "aliyun_index": 2, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "# 2.4. Benchmarks  \n\n", "text": "2.4. Benchmarks\n", "alignment": "left", "unique_id": "d67e62cee57335a501f9262789b3a785", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.4. Benchmarks"}], "lineHeight": 0}}, "target": {"markdown": "# 2.4. 测试基准", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "f7024bdccc9f4cd4cc52f91dffab7d94", "index": 61, "aliyun_index": 3, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Our benchmarks are listed in Table 1 along with the main\napplication properties, such as the organization of threads into\nCTAs and grids as well as the different memory spaces on the\nGPU exploited by each application. Multiple entries separated\nby semi-colons in the grid and CTA dimensions indicate the\napplication runs multiple kernels.  \n\n", "text": "Our benchmarks are listed in Table 1 along with the main\napplication properties, such as the organization of threads into\nCTAs and grids as well as the different memory spaces on the\nGPU exploited by each application. Multiple entries separated\nby semi-colons in the grid and CTA dimensions indicate the\napplication runs multiple kernels.\n", "alignment": "left", "unique_id": "f7024bdccc9f4cd4cc52f91dffab7d94", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our benchmarks are listed in Table 1 along with the main"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "application properties, such as the organization of threads into"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "CTAs and grids as well as the different memory spaces on the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU exploited by each application. Multiple entries separated"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "by semi-colons in the grid and CTA dimensions indicate the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "application runs multiple kernels."}], "lineHeight": -173}}, "target": {"markdown": "我们的测试基准在表 1 中列出，同时列出的还有主要的应用属性，例如线程组织为 CTA 和网格的方式，以及每个应用所利用的 GPU 上的不同存储空间。在网格和 CTA 维度中由分号分隔的多个条目表示该应用运行了多个内核。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "45061ef01de9cfca9f88fd9c577dacd2", "index": 62, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "For comparison purposes we also simulated the following\nbenchmarks from NVIDIA's CUDA software development\nkit (SDK) [32]: Black-Scholes Option Pricing, Fast Walsh  \n\n", "text": "For comparison purposes we also simulated the following\nbenchmarks from NVIDIA's CUDA software development\nkit (SDK) [32]: Black-Scholes Option Pricing, Fast Walsh\n", "alignment": "left", "unique_id": "45061ef01de9cfca9f88fd9c577dacd2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For comparison purposes we also simulated the following"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "benchmarks from NVIDIA's CUDA software development"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "kit (SDK) [32]: Black-Scholes Option Pricing, Fast Walsh"}], "lineHeight": -89}}, "target": {"markdown": "为了进行对比，我们还模拟了来自 NVIDIA CUDA 软件开发套件（SDK）[32] 中的以下测试基准：Black-Scholes 期权定价、Fast Walsh", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "424114f9dadad5a5109d696ca05cc9fa", "index": 63, "aliyun_index": 5, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "4. By default, the version of ptxas in CUDA 1.1 appears to attempt to avoid spilling registers provided the number of registers per thread is less than 128 and none of the applications we studied reached this limit. Directing ptxas to further restrict the number of registers leads to an increase in local memory usage above that explicitly used in the PTX assembly, while increasing the register limit does not increase the number of registers used.  \n\n", "text": "4. By default, the version of ptxas in CUDA 1.1 appears to attempt to avoid spilling registers provided the number of registers per thread is less than 128 and none of the applications we studied reached this limit. Directing ptxas to further restrict the number of registers leads to an increase in local memory usage above that explicitly used in the PTX assembly, while increasing the register limit does not increase the number of registers used.\n", "alignment": "left", "unique_id": "424114f9dadad5a5109d696ca05cc9fa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4. By default, the version of ptxas in CUDA 1.1 appears to attempt to avoid spilling registers provided the number of registers per thread is less than 128 and none of the applications we studied reached this limit. Directing ptxas to further restrict the number of registers leads to an increase in local memory usage above that explicitly used in the PTX assembly, while increasing the register limit does not increase the number of registers used."}], "lineHeight": 0}}, "target": {"markdown": "4. 默认情况下，CUDA 1.1 中的 ptxas 版本似乎会尝试避免寄存器溢出，前提是每个线程的寄存器数量少于 128，且我们所研究的所有应用均未达到此限制。指示 ptxas 进一步限制寄存器数量会导致局部存储的使用量超过 PTX 汇编中显式使用的部分，而提高寄存器上限则不会增加实际使用的寄存器数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "26427b7091482e6e81383b89ac070a0a", "index": 64, "aliyun_index": 6, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Transform, Binomial Option Pricing, Separable Convolution, 64-bin Histogram, Matrix Multiply, Parallel Reduction, Scalar Product, Scan of Large Arrays, and Matrix Transpose. Due to space limitations, and since most of these benchmarks already perform well on GPUs, we only report details for Black-Scholes (BLK), a financial options pricing application, and Fast Walsh Transform (FWT), widely used in signal and image processing and compression. We also report the harmonic mean of all SDK applications simulated, denoted as $SDK$ in the data bar charts in Section 4.  \n\n", "text": "Transform, Binomial Option Pricing, Separable Convolution, 64-bin Histogram, Matrix Multiply, Parallel Reduction, Scalar Product, Scan of Large Arrays, and Matrix Transpose. Due to space limitations, and since most of these benchmarks already perform well on GPUs, we only report details for Black-Scholes (BLK), a financial options pricing application, and Fast Walsh Transform (FWT), widely used in signal and image processing and compression. We also report the harmonic mean of all SDK applications simulated, denoted as $SDK$ in the data bar charts in Section 4.\n", "alignment": "left", "unique_id": "26427b7091482e6e81383b89ac070a0a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Transform, Binomial Option Pricing, Separable Convolution, 64-bin Histogram, Matrix Multiply, Parallel Reduction, Scalar Product, Scan of Large Arrays, and Matrix Transpose. Due to space limitations, and since most of these benchmarks already perform well on GPUs, we only report details for Black-Scholes (BLK), a financial options pricing application, and Fast Walsh Transform (FWT), widely used in signal and image processing and compression. We also report the harmonic mean of all SDK applications simulated, denoted as $SDK$ in the data bar charts in Section 4."}], "lineHeight": 0}}, "target": {"markdown": "Transform、二项式期权定价、可分离卷积、64-bin 直方图、矩阵乘法、并行归约、标量积、大数组扫描以及矩阵转置。出于篇幅限制，并且由于这些测试基准中的大多数在 GPU 上已经具有较好的性能，我们仅详细报告 Black-Scholes（BLK）——一个金融期权定价应用，以及快速沃尔什变换（Fast Walsh Transform, FWT）——广泛应用于信号、图像处理与压缩领域。此外，我们还会报告所有被模拟 SDK 应用的调和平均值，在第 4 节的数据柱状图中以 $SDK$ 表示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "a038a2a3c84cf3f8ecf812b9576d6ae9", "index": 65, "aliyun_index": 7, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Below, we describe the CUDA applications not in the SDK\nthat we use as benchmarks in our study. These applications\nwere developed by the researchers cited below and run un-\nmodified on our simulator.  \n\n", "text": "Below, we describe the CUDA applications not in the SDK\nthat we use as benchmarks in our study. These applications\nwere developed by the researchers cited below and run un-\nmodified on our simulator.\n", "alignment": "left", "unique_id": "a038a2a3c84cf3f8ecf812b9576d6ae9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Below, we describe the CUDA applications not in the SDK"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "that we use as benchmarks in our study. These applications"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "were developed by the researchers cited below and run un-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "modified on our simulator."}], "lineHeight": -115}}, "target": {"markdown": "下文我们将描述本研究中所使用的、不属于 SDK 的 CUDA 应用。这些应用由下文所引用的研究人员开发，并在我们的模拟器上未经修改地运行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "a4861fa95c6d0a4451a96591f81ad1db", "index": 66, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**AES Encryption (AES) [24]** This application, developed by Manavski [24], implements the Advanced Encryption Standard (AES) algorithm in CUDA to encrypt and decrypt files. The application has been optimized by the developer so that constants are stored in constant memory, the expanded key stored in texture memory, and the input data processed in shared memory. We encrypt a 256KB picture using 128-bit encryption.  \n\n", "text": "**AES Encryption (AES) [24]** This application, developed by Manavski [24], implements the Advanced Encryption Standard (AES) algorithm in CUDA to encrypt and decrypt files. The application has been optimized by the developer so that constants are stored in constant memory, the expanded key stored in texture memory, and the input data processed in shared memory. We encrypt a 256KB picture using 128-bit encryption.\n", "alignment": "left", "unique_id": "a4861fa95c6d0a4451a96591f81ad1db", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**AES Encryption (AES) [24]** This application, developed by Manavski [24], implements the Advanced Encryption Standard (AES) algorithm in CUDA to encrypt and decrypt files. The application has been optimized by the developer so that constants are stored in constant memory, the expanded key stored in texture memory, and the input data processed in shared memory. We encrypt a 256KB picture using 128-bit encryption."}], "lineHeight": 0}}, "target": {"markdown": "**AES 加密（AES）[24]** 该应用由 Manavski [24] 开发，在 CUDA 中实现了高级加密标准（AES）算法，用于文件的加密与解密。开发者已对该应用进行了优化，将常量存储于常量存储中，将扩展密钥存储于纹理存储中，并将输入数据在共享存储中进行处理。我们使用 128 位加密对一个 256KB 的图片进行加密。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "92d73b228453f48bce8545d5162b927e", "index": 67, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Graph Algorithm: Breadth-First Search (BFS) [15]**\nDeveloped by Harish and Narayanan [15], this application performs breadth-first search on a graph. As each node in the graph is mapped to a different thread, the amount of parallelism in this applications scales with the size of the input graph. BFS suffers from performance loss due to heavy global memory traffic and branch divergence. We perform breadth-first search on a random graph with 65,536 nodes and an average of 6 edges per node.  \n\n", "text": "**Graph Algorithm: Breadth-First Search (BFS) [15]**\nDeveloped by Harish and Narayanan [15], this application performs breadth-first search on a graph. As each node in the graph is mapped to a different thread, the amount of parallelism in this applications scales with the size of the input graph. BFS suffers from performance loss due to heavy global memory traffic and branch divergence. We perform breadth-first search on a random graph with 65,536 nodes and an average of 6 edges per node.\n", "alignment": "left", "unique_id": "92d73b228453f48bce8545d5162b927e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Graph Algorithm: Breadth-First Search (BFS) [15]**"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Developed by Harish and Narayanan [15], this application performs breadth-first search on a graph. As each node in the graph is mapped to a different thread, the amount of parallelism in this applications scales with the size of the input graph. BFS suffers from performance loss due to heavy global memory traffic and branch divergence. We perform breadth-first search on a random graph with 65,536 nodes and an average of 6 edges per node."}], "lineHeight": -259}}, "target": {"markdown": "**图算法：广度优先搜索（BFS）[15]**", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "fdf134756fd65ec37a9c4079ccb84c00", "index": 68, "aliyun_index": 10, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Coulombic Potential (CP) [18,41]** CP is part of the Parboil Benchmark suite developed by the IMPACT research group at UIUC [18,41]. CP is useful in the field of molecular dynamics. Loops are manually unrolled to reduce loop overheads and the point charge data is stored in constant memory to take advantage of caching. CP has been heavily optimized (it has been shown to achieve a $647\\times$ speedup versus a CPU version [40]). We simulate 200 atoms on a grid size of $256\\times256$.  \n\n", "text": "**Coulombic Potential (CP) [18,41]** CP is part of the Parboil Benchmark suite developed by the IMPACT research group at UIUC [18,41]. CP is useful in the field of molecular dynamics. Loops are manually unrolled to reduce loop overheads and the point charge data is stored in constant memory to take advantage of caching. CP has been heavily optimized (it has been shown to achieve a $647\\times$ speedup versus a CPU version [40]). We simulate 200 atoms on a grid size of $256\\times256$.\n", "alignment": "left", "unique_id": "fdf134756fd65ec37a9c4079ccb84c00", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Coulombic Potential (CP) [18,41]** CP is part of the Parboil Benchmark suite developed by the IMPACT research group at UIUC [18,41]. CP is useful in the field of molecular dynamics. Loops are manually unrolled to reduce loop overheads and the point charge data is stored in constant memory to take advantage of caching. CP has been heavily optimized (it has been shown to achieve a $647\\times$ speedup versus a CPU version [40]). We simulate 200 atoms on a grid size of $256\\times256$."}], "lineHeight": 0}}, "target": {"markdown": "**库仑势能（CP）[18,41]** CP 是由 UIUC 的 IMPACT 研究组所开发的 Parboil 测试基准套件的一部分 [18,41]。CP 在分子动力学领域具有重要应用。其循环已被手动展开以减少循环开销，并且点电荷数据被存储于常量存储中以利用缓存。CP 已进行了深度优化（已有研究表明其相较 CPU 版本可获得 $647\\times$ 的加速比 [40]）。我们在 $256\\times256$ 的网格上对 200 个原子进行模拟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "7ed784ed80d12f61fce9111339a36a32", "index": 69, "aliyun_index": 11, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**gpuDG (DG)** [46] gpuDG is a discontinuous Galerkin time-domain solver, used in the field of electromagnetics to calculate radar scattering from 3D objects and analyze wave guides, particle accelerators, and EM compatibility [46]. Data is loaded into shared memory from texture memory. The inner loop consists mainly of matrix-vector products. We use the 3D version with polynomial order of N=6 and reduce time steps to 2 to reduce simulation time.  \n\n", "text": "**gpuDG (DG)** [46] gpuDG is a discontinuous Galerkin time-domain solver, used in the field of electromagnetics to calculate radar scattering from 3D objects and analyze wave guides, particle accelerators, and EM compatibility [46]. Data is loaded into shared memory from texture memory. The inner loop consists mainly of matrix-vector products. We use the 3D version with polynomial order of N=6 and reduce time steps to 2 to reduce simulation time.\n", "alignment": "left", "unique_id": "7ed784ed80d12f61fce9111339a36a32", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**gpuDG (DG)** [46] gpuDG is a discontinuous Galerkin time-domain solver, used in the field of electromagnetics to calculate radar scattering from 3D objects and analyze wave guides, particle accelerators, and EM compatibility [46]. Data is loaded into shared memory from texture memory. The inner loop consists mainly of matrix-vector products. We use the 3D version with polynomial order of N=6 and reduce time steps to 2 to reduce simulation time."}], "lineHeight": 0}}, "target": {"markdown": "**gpuDG（DG）** [46] gpuDG 是一种不连续伽辽金时域求解器，在电磁学领域用于计算三维物体的雷达散射以及分析波导、粒子加速器和电磁兼容性 [46]。数据从纹理存储器加载至共享存储器中。其内层循环主要由矩阵-向量乘积构成。我们使用多项式阶数为 N=6 的三维版本，并将时间步数缩减为 2 以减少模拟时间。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "3098a81e13ee7130dd2e83e49ac2c584", "index": 70, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**3D Laplace Solver (LPS) [12]** Laplace is a highly parallel finance application [12]. As well as using shared memory, care was taken by the application developer to ensure coalesced global memory accesses. We observe that this benchmark suffers some performance loss due to branch divergence. We run one iteration on a 100x100x100 grid.  \n\n", "text": "**3D Laplace Solver (LPS) [12]** Laplace is a highly parallel finance application [12]. As well as using shared memory, care was taken by the application developer to ensure coalesced global memory accesses. We observe that this benchmark suffers some performance loss due to branch divergence. We run one iteration on a 100x100x100 grid.\n", "alignment": "left", "unique_id": "3098a81e13ee7130dd2e83e49ac2c584", "edited": fal ant memory. We find the working set for constant memory fits inside the 8KB constant cache per shader core that we model. However, we find memory bandwidth is still a bottleneck due to a large fraction of local memory accesses. We use the default inputs, simulating 4096 paths for 15 options.\n", "alignment": "left", "unique_id": "c93f0b854988e18c6d4abb115c5c51bf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Carlo simulations based on the London Interbank Offered Rate Market Model [13]. Each thread reads a large number of variables stored in constant memory. We find the working set for constant memory fits inside the 8KB constant cache per shader core that we model. However, we find memory bandwidth is still a bottleneck due to a large fraction of local memory accesses. We use the default inputs, simulating 4096 paths for 15 options."}], "lineHeight": 0}}, "target": {"markdown": "Carlo 模拟，其基础为伦敦银行同业拆借利率市场模型 [13]。每个线程读取大量存储于常量存储器中的变量。我们发现，常量存储器的工作集可放入我们所建模的每个着色器核心所对应的 8KB 常量缓存中。然而，由于局部存储访问占比较大，存储器带宽仍是瓶颈。我们使用默认输入，对 4096 条路径上的 15 个期权进行模拟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "1bf53089f828d5b6b6854d81b1395b26", "index": 75, "aliyun_index": 3, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "MUMmerGPU (MUM) [42] MUMmerGPU is a parallel pairwise local sequence alignment program that matches query strings consisting of standard DNA nucleotides (A,C,T,G) to a reference string for purposes such as genotyping, genome resequencing, and metagenomics [42]. The reference string is stored as a suffix tree in texture memory and has been arranged to exploit the texture cache's optimization for 2D locality. Nevertheless, the sheer size of the tree means high cache miss rates, causing MUM to be memory bandwidth-bound. Since each thread performs its own query, the nature of the search algorithm makes performance also susceptible to branch divergence. We use the first 140,000 characters of the Bacillus anthracis str. Ames genome as the reference string and 50,000 25-character queries generated randomly using the complete genome as the seed.  \n\n", "text": "MUMmerGPU (MUM) [42] MUMmerGPU is a parallel pairwise local sequence alignment program that matches query strings consisting of standard DNA nucleotides (A,C,T,G) to a reference string for purposes such as genotyping, genome resequencing, and metagenomics [42]. The reference string is stored as a suffix tree in texture memory and has been arranged to exploit the texture cache's optimization for 2D locality. Nevertheless, the sheer size of the tree means high cache miss rates, causing MUM to be memory bandwidth-bound. Since each thread performs its own query, the nature of the search algorithm makes performance also susceptible to branch divergence. We use the first 140,000 characters of the Bacillus anthracis str. Ames genome as the reference string and 50,000 25-character queries generated randomly using the complete genome as the seed.\n", "alignment": "left", "unique_id": "1bf53089f828d5b6b6854d81b1395b26", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "MUMmerGPU (MUM) [42] MUMmerGPU is a parallel pairwise local sequence alignment program that matches query strings consisting of standard DNA nucleotides (A,C,T,G) to a reference string for purposes such as genotyping, genome resequencing, and metagenomics [42]. The reference string is stored as a suffix tree in texture memory and has been arranged to exploit the texture cache's optimization for 2D locality. Nevertheless, the sheer size of the tree means high cache miss rates, causing MUM to be memory bandwidth-bound. Since each thread performs its own query, the nature of the search algorithm makes performance also susceptible to branch divergence. We use the first 140,000 characters of the Bacillus anthracis str. Ames genome as the reference string and 50,000 25-character queries generated randomly using the complete genome as the seed."}], "lineHeight": 0}}, "target": {"markdown": "**MUMmerGPU（MUM）**[42] MUMmerGPU 是一个并行的成对局部序列比对程序，其功能是将由标准 DNA 核苷酸（A、C、T、G）组成的查询字符串与参考字符串进行匹配，可用于基因分型、基因组重测序和宏基因组学等用途 [42]。参考字符串以后缀树的形式存储于纹理存储器中，且其组织方式利用了纹理缓存对二维局部性的优化策略。然而，由于树的规模庞大，缓存缺失率较高，导致 MUM 受限于存储器带宽。由于每个线程独立执行其查询，搜索算法的特性也使得性能易受分支发散的影响。我们使用 Bacillus anthracis str. Ames 基因组的前 140,000 个字符作为参考字符串，并使用完整基因组作为种子随机生成 50,000 个长度为 25 的查询。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "ad09e286663659b287b6a59fc7b1ef75", "index": 76, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Neural Network (NN) [5]** Neural network uses a convolutional neural network to recognize handwritten digits [5]. Pre-determined neuron weights are loaded into global memory along with the input digits. We modified the original source code to allow recognition of multiple digits at once to increase parallelism. Nevertheless, the last two kernels utilize blocks of only a single thread each, which results in severe underutilization of the shader core pipelines. We simulate recognition of 28 digits from the Modified National Institute of Standards Technology database of handwritten digits.  \n\n", "text": "**Neural Network (NN) [5]** Neural network uses a convolutional neural network to recognize handwritten digits [5]. Pre-determined neuron weights are loaded into global memory along with the input digits. We modified the original source code to allow recognition of multiple digits at once to increase parallelism. Nevertheless, the last two kernels utilize blocks of only a single thread each, which results in severe underutilization of the shader core pipelines. We simulate recognition of 28 digits from the Modified National Institute of Standards Technology database of handwritten digits.\n", "alignment": "left", "unique_id": "ad09e286663659b287b6a59fc7b1ef75", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Neural Network (NN) [5]** Neural network uses a convolutional neural network to recognize handwritten digits [5]. Pre-determined neuron weights are loaded into global memory along with the input digits. We modified the original source code to allow recognition of multiple digits at once to increase parallelism. Nevertheless, the last two kernels utilize blocks of only a single thread each, which results in severe underutilization of the shader core pipelines. We simulate recognition of 28 digits from the Modified National Institute of Standards Technology database of handwritten digits."}], "lineHeight": 0}}, "target": {"markdown": "**神经网络（NN）[5]** 神经网络使用卷积神经网络来识别手写数字 [5]。预先确定的神经元权重与输入数字一同被加载至全局存储器中。我们对原始源代码进行了修改，以允许一次性识别多个数字，从而提高并行度。然而，最后两个核函数各自仅使用仅含单个线程的线程块，这导致着色器核心流水线的利用率严重不足。我们在修改版美国国家标准与技术研究院手写数字数据库上对 28 个数字进行识别模拟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "fe9906b18244a6af76fa4e681c0e5443", "index": 77, "aliyun_index": 5, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**N-Queens Solver** (NQU) [37] The N-Queen solver tackles a classic puzzle of placing N queens on a NxN chess board such that no queen can capture another [37]. It uses a simple backtracking algorithm to try to determine all possible solu-  \n\n", "text": "**N-Queens Solver** (NQU) [37] The N-Queen solver tackles a classic puzzle of placing N queens on a NxN chess board such that no queen can capture another [37]. It uses a simple backtracking algorithm to try to determine all possible solu-\n", "alignment": "left", "unique_id": "fe9906b18244a6af76fa4e681c0e5443", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**N-Queens Solver** (NQU) [37] The N-Queen solver tackles a classic puzzle of placing N queens on a NxN chess board such that no queen can capture another [37]. It uses a simple backtracking algorithm to try to determine all possible solu-"}], "lineHeight": 0}}, "target": {"markdown": "**N 皇后求解器（NQU）[37]** N 皇后求解器致力于解决一个经典难题，即在 N×N 的棋盘上放置 N 个皇后，使其互不攻击 [37]。它使用一种简单的回溯算法来尝试确定所有可能的解", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "78a7fed3ec9d271c31c3f97c04fb5b1d", "index": 78, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "tions. The search space implies that the execution time grows exponentially with N. Our analysis shows that most of the computation is performed by a single thread, which explains the low IPC. We simulate N=10.  \n\n", "text": "tions. The search space implies that the execution time grows exponentially with N. Our analysis shows that most of the computation is performed by a single thread, which explains the low IPC. We simulate N=10.\n", "alignment": "left", "unique_id": "78a7fed3ec9d271c31c3f97c04fb5b1d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tions. The search space implies that the execution time grows exponentially with N. Our analysis shows that most of the computation is performed by a single thread, which explains the low IPC. We simulate N=10."}], "lineHeight": 0}}, "target": {"markdown": "法。其搜索空间决定了执行时间随 N 呈指数增长。我们的分析表明，大部分计算由单个线程完成，这解释了较低的指令吞吐率（IPC）。我们模拟 N=10 的情形。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "7d0b83237f033fbe8464fcf47b9c4f75", "index": 79, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Ray Tracing (RAY)** [26] Ray-tracing is a method of rendering graphics with near photo-realism. In this implementation, each pixel rendered corresponds to a scalar thread in CUDA [26]. Up to 5 levels of reflections and shadows are taken into account, so thread behavior depends on what object the ray hits (if it hits any at all), making the kernel susceptible to branch divergence. We simulate rendering of a 256x256 image.  \n\n", "text": "**Ray Tracing (RAY)** [26] Ray-tracing is a method of rendering graphics with near photo-realism. In this implementation, each pixel rendered corresponds to a scalar thread in CUDA [26]. Up to 5 levels of reflections and shadows are taken into account, so thread behavior depends on what object the ray hits (if it hits any at all), making the kernel susceptible to branch divergence. We simulate rendering of a 256x256 image.\n", "alignment": "left", "unique_id": "7d0b83237f033fbe8464fcf47b9c4f75", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Ray Tracing (RAY)** [26] Ray-tracing is a method of rendering graphics with near photo-realism. In this implementation, each pixel rendered corresponds to a scalar thread in CUDA [26]. Up to 5 levels of reflections and shadows are taken into account, so thread behavior depends on what object the ray hits (if it hits any at all), making the kernel susceptible to branch divergence. We simulate rendering of a 256x256 image."}], "lineHeight": 0}}, "target": {"markdown": "**光线追踪（RAY）**[26] 光线追踪是一种以近乎照片级真实感渲染图形的方法。在该实现中，每个被渲染的像素对应于 CUDA 中的一个标量线程 [26]。渲染过程考虑了最多 5 级的反射与阴影，因此线程的行为取决于光线所击中的物体（若存在击中），这使得核函数易受分支发散的影响。我们模拟渲染一张 256×256 的图像。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "91f8b04b1f2fe72ba51c1912d940b5e2", "index": 80, "aliyun_index": 8, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**StoreGPU (STO) [4]** StoreGPU is a library that accelerates hashing-based primitives designed for middleware [4]. We chose to use the sliding-window implementation of the MD5 algorithm on an input file of size 192KB. The developers minimize off-chip memory traffic by using the fast shared memory. We find STO performs relatively well.  \n\n", "text": "**StoreGPU (STO) [4]** StoreGPU is a library that accelerates hashing-based primitives designed for middleware [4]. We chose to use the sliding-window implementation of the MD5 algorithm on an input file of size 192KB. The developers minimize off-chip memory traffic by using the fast shared memory. We find STO performs relatively well.\n", "alignment": "left", "unique_id": "91f8b04b1f2fe72ba51c1912d940b5e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**StoreGPU (STO) [4]** StoreGPU is a library that accelerates hashing-based primitives designed for middleware [4]. We chose to use the sliding-window implementation of the MD5 algorithm on an input file of size 192KB. The developers minimize off-chip memory traffic by using the fast shared memory. We find STO performs relatively well."}], "lineHeight": 0}}, "target": {"markdown": "**StoreGPU（STO）[4]** StoreGPU 是一个用于加速为中间件设计的基于哈希的原语库 [4]。我们选用 MD5 算法的滑动窗口实现，输入文件大小为 192KB。开发者通过使用高速共享存储器来尽量减少片外存储器访问。我们发现 STO 的性能相对较好。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "7f389c14f2cccf7ad9d243ec26cda474", "index": 81, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Weather Prediction** (WP) [27] Numerical weather prediction uses the GPU to accelerate a portion of the Weather Research and Forecast model (WRF), which can model and predict condensation, fallout of various precipitation and related thermodynamic effects of latent heat release [27]. The kernel has been optimized to reduce redundant memory transfer by storing the temporary results for each altitude level in the cell in registers. However, this requires a large amount of registers, thus limiting the maximum allowed number of threads per shader core to 192, which is not enough to cover global and local memory access latencies. We simulate the kernel using the default test sample for 10 timesteps.  \n\n", "text": "**Weather Prediction** (WP) [27] Numerical weather prediction uses the GPU to accelerate a portion of the Weather Research and Forecast model (WRF), which can model and predict condensation, fallout of various precipitation and related thermodynamic effects of latent heat release [27]. The kernel has been optimized to reduce redundant memory transfer by storing the temporary results for each altitude level in the cell in registers. However, this requires a large amount of registers, thus limiting the maximum allowed number of threads per shader core to 192, which is not enough to cover global and local memory access latencies. We simulate the kernel using the default test sample for 10 timesteps.\n", "alignment": "left", "unique_id": "7f389c14f2cccf7ad9d243ec26cda474", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Weather Prediction** (WP) [27] Numerical weather prediction uses the GPU to accelerate a portion of the Weather Research and Forecast model (WRF), which can model and predict condensation, fallout of various precipitation and related thermodynamic effects of latent heat release [27]. The kernel has been optimized to reduce redundant memory transfer by storing the temporary results for each altitude level in the cell in registers. However, this requires a large amount of registers, thus limiting the maximum allowed number of threads per shader core to 192, which is not enough to cover global and local memory access latencies. We simulate the kernel using the default test sample for 10 timesteps."}], "lineHeight": 0}}, "target": {"markdown": "**天气预报（WP）[27]** 数值天气预报利用 GPU 来加速天气研究与预报模型（WRF）的一部分，该模型可对凝结、各种降水物的沉降以及与之相关的潜热释放热力学效应进行建模与预测 [27]。该核函数已通过将单元格中每个高度层的临时结果存储于寄存器中来进行优化，以减少冗余的存储器传输。然而，这需要大量寄存器，因此将每个着色器核心所允许的最大线程数限制为 192，不足以掩盖全局与局部存储器的访问延迟。我们使用默认测试样例对该核函数进行 10 个时间步的模拟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "80d627286b58524d350425f5d931d83d", "index": 82, "aliyun_index": 10, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "# 3. Methodology  \n\n", "text": "3. Methodology\n", "alignment": "left", "unique_id": "80d627286b58524d350425f5d931d83d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic"
