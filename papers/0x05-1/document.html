rstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "{bakhoda,gyuan,wwlfung,henryw,aamodt}@ece.ubc.ca"}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "ce6b3c510d2653c6513db4189a232d8b", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "# Abstract  \n\n", "text": "Abstract\n", "alignment": "left", "unique_id": "ce6b3c510d2653c6513db4189a232d8b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "c922f84bfcc60578cf9908c581b2fe35", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Modern Graphic Processing Units (GPUs) provide sufficiently flexible programming models that understanding their performance can provide insight in designing tomorrow's manycore processors, whether those are GPUs or otherwise. The combination of multiple, multithreaded, SIMD cores makes studying these GPUs useful in understanding tradeoffs among memory, data, and thread level parallelism. While modern GPUs offer orders of magnitude more raw computing power than contemporary CPUs, many important applications, even those with abundant data level parallelism, do not achieve peak performance. This paper characterizes several non-graphics applications written in NVIDIA's CUDA programming model by running them on a novel detailed microarchitecture performance simulator that runs NVIDIA's parallel thread execution (PTX) virtual instruction set. For this study, we selected twelve non-trivial CUDA applications demonstrating varying levels of performance improvement on GPU hardware (versus a CPU-only sequential version of the application). We study the performance of these applications on our GPU performance simulator with configurations comparable to contemporary high-end graphics cards. We characterize the performance impact of several microarchitecture design choices including choice of interconnect topology, use of caches, design of memory controller, parallel workload distribution mechanisms, and memory request coalescing hardware. Two observations we make are (1) that for the applications we study, performance is more sensitive to interconnect bisection bandwidth rather than latency, and (2) that, for some applications, running fewer threads concurrently than on-chip resources might otherwise allow can improve performance by reducing contention in the memory system.  \n\n", "text": "Modern Graphic Processing Units (GPUs) provide sufficiently flexible programming models that understanding their performance can provide insight in designing tomorrow's manycore processors, whether those are GPUs or otherwise. The combination of multiple, multithreaded, SIMD cores makes studying these GPUs useful in understanding tradeoffs among memory, data, and thread level parallelism. While modern GPUs offer orders of magnitude more raw computing power than contemporary CPUs, many important applications, even those with abundant data level parallelism, do not achieve peak performance. This paper characterizes several non-graphics applications written in NVIDIA's CUDA programming model by running them on a novel detailed microarchitecture performance simulator that runs NVIDIA's parallel thread execution (PTX) virtual instruction set. For this study, we selected twelve non-trivial CUDA applications demonstrating varying levels of performance improvement on GPU hardware (versus a CPU-only sequential version of the application). We study the performance of these applications on our GPU performance simulator with configurations comparable to contemporary high-end graphics cards. We characterize the performance impact of several microarchitecture design choices including choice of interconnect topology, use of caches, design of memory controller, parallel workload distribution mechanisms, and memory request coalescing hardware. Two observations we make are (1) that for the applications we study, performance is more sensitive to interconnect bisection bandwidth rather than latency, and (2) that, for some applications, running fewer threads concurrently than on-chip resources might otherwise allow can improve performance by reducing contention in the memory system.\n", "alignment": "left", "unique_id": "c922f84bfcc60578cf9908c581b2fe35", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Modern Graphic Processing Units (GPUs) provide sufficiently flexible programming models that understanding their performance can provide insight in designing tomorrow's manycore processors, whether those are GPUs or otherwise. The combination of multiple, multithreaded, SIMD cores makes studying these GPUs useful in understanding tradeoffs among memory, data, and thread level parallelism. While modern GPUs offer orders of magnitude more raw computing power than contemporary CPUs, many important applications, even those with abundant data level parallelism, do not achieve peak performance. This paper characterizes several non-graphics applications written in NVIDIA's CUDA programming model by running them on a novel detailed microarchitecture performance simulator that runs NVIDIA's parallel thread execution (PTX) virtual instruction set. For this study, we selected twelve non-trivial CUDA applications demonstrating varying levels of performance improvement on GPU hardware (versus a CPU-only sequential version of the application). We study the performance of these applications on our GPU performance simulator with configurations comparable to contemporary high-end graphics cards. We characterize the performance impact of several microarchitecture design choices including choice of interconnect topology, use of caches, design of memory controller, parallel workload distribution mechanisms, and memory request coalescing hardware. Two observations we make are (1) that for the applications we study, performance is more sensitive to interconnect bisection bandwidth rather than latency, and (2) that, for some applications, running fewer threads concurrently than on-chip resources might otherwise allow can improve performance by reducing contention in the memory system."}], "lineHeight": 0}}, "target": {"markdown": "现代图形处理器（GPU）提供了足够灵活的编程模型，理解它们的性能有助于设计未来的众核处理器，无论这些处理器是否为 GPU。多个多线程 SIMD 核心的组合使得研究这些 GPU 有助于理解内存、数据和线程级并行性之间的权衡。尽管现代 GPU 的原始计算能力比当代 CPU 高出几个数量级，但许多重要的应用程序，即使具有丰富的数据级并行性，也无法达到峰值性能。本文通过在一个新颖的、详细的微架构性能模拟器上运行以 NVIDIA CUDA 编程模型编写的若干非图形应用程序来对其性能进行特征分析，该模拟器运行 NVIDIA 的并行线程执行（PTX）虚拟指令集。在本研究中，我们选择了十二个非平凡的 CUDA 应用程序，它们在 GPU 硬件上相对于纯 CPU 顺序版本表现出不同程度的性能提升。我们在 GPU 性能模拟器上研究这些应用程序的性能，所采用的配置可与当代高端显卡相媲美。我们对若干微架构设计选择的性能影响进行了特征分析，包括互连拓扑的选择、缓存的使用、内存控制器的设计、并行工作负载分配机制以及内存请求合并硬件。我们得出的两个观察结论是：(1) 对于我们所研究的应用程序而言，性能对互连的切分带宽比对延迟更为敏感；(2) 对于某些应用程序，相对于片上资源本可支持的并发线程数，运行更少的并发线程可以通过减少内存系统中的争用，从而提升性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "50248f2d046be75be7b5b7167afe465d", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "# 1. Introduction  \n\n", "text": "1. Introduction\n", "alignment": "left", "unique_id": "50248f2d046be75be7b5b7167afe465d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1. Introduction"}], "lineHeight": 0}}, "target": {"markdown": "## 1. 引言", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "6bd3f8d9d5a29011166b5bf4149110a8", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "While single-thread performance of commercial superscalar microprocessors is still increasing, a clear trend today is for computer manufacturers to provide multithreaded hardware that strongly encourages software developers to provide explicit parallelism when possible. One important class of parallel computer hardware is the modern *graphics processing unit* (GPU) [22,25]. With contemporary GPUs recently crossing the teraflop barrier [2,34] and specific efforts to make GPUs easier to program for non-graphics applications [1,29,33], there is  \n\n", "text": "While single-thread performance of commercial superscalar microprocessors is still increasing, a clear trend today is for computer manufacturers to provide multithreaded hardware that strongly encourages software developers to provide explicit parallelism when possible. One important class of parallel computer hardware is the modern *graphics processing unit* (GPU) [22,25]. With contemporary GPUs recently crossing the teraflop barrier [2,34] and specific efforts to make GPUs easier to program for non-graphics applications [1,29,33], there is\n", "alignment": "left", "unique_id": "6bd3f8d9d5a29011166b5bf4149110a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While single-thread performance of commercial superscalar microprocessors is still increasing, a clear trend today is for computer manufacturers to provide multithreaded hardware that strongly encourages software developers to provide explicit parallelism when possible. One important class of parallel computer hardware is the modern *graphics processing unit* (GPU) [22,25]. With contemporary GPUs recently crossing the teraflop barrier [2,34] and specific efforts to make GPUs easier to program for non-graphics applications [1,29,33], there is"}], "lineHeight": 0}}, "target": {"markdown": "尽管商用超标量微处理器的单线程性能仍在持续提升，但当前一个明显的趋势是，计算机制造商开始提供多线程硬件，并强烈鼓励软件开发者在可能的情况下显式地提供并行性。并行计算机硬件中一个重要的类别就是现代*图形处理器*（GPU）[22,25]。随着当代 GPU 近期跨越了万亿次浮点运算（teraflop）的门槛[2,34]，以及使 GPU 更易于用于非图形应用编程的各种努力[1,29,33]，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "0bd2d5f8500b3756771bf0c449247717", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "widespread interest in using GPU hardware to accelerate non-\ngraphics applications.  \n\n", "text": "widespread interest in using GPU hardware to accelerate non-\ngraphics applications.\n", "alignment": "left", "unique_id": "0bd2d5f8500b3756771bf0c449247717", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "widespread interest in using GPU hardware to accelerate non-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "graphics applications."}], "lineHeight": -54}}, "target": {"markdown": "人们普遍开始关注利用 GPU 硬件来加速非图形应用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "a4e0ec5efd82bd2e9fbed1293ef921f4", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Since its introduction by NVIDIA Corporation in February 2007, the CUDA programming model [29,33] has been used to develop many applications for GPUs. CUDA provides an easy to learn extension of the ANSI C language. The programmer specifies parallel threads, each of which runs scalar code. While short vector data types are available, their use by the programmer is not required to achieve peak performance, thus making CUDA a more attractive programming model to those less familiar with traditional data parallel architectures. This execution model has been dubbed a single instruction, multiple thread (SIMT) model [22] to distinguish it from the more traditional single instruction, multiple data (SIMD) model. As of February 2009, NVIDIA has listed 209 third-party applications on their CUDA Zone website [30]. Of the 136 applications listed with performance claims, 52 are reported to obtain a speedup of 50× or more, and of these 29 are reported to obtain a speedup of 100× or more. As these applications already achieve tremendous benefits, this paper instead focuses on evaluating CUDA applications with reported speedups below 50× since this group of applications appears most in need of software tuning or changes to hardware design.  \n\n", "text": "Since its introduction by NVIDIA Corporation in February 2007, the CUDA programming model [29,33] has been used to develop many applications for GPUs. CUDA provides an easy to learn extension of the ANSI C language. The programmer specifies parallel threads, each of which runs scalar code. While short vector data types are available, their use by the programmer is not required to achieve peak performance, thus making CUDA a more attractive programming model to those less familiar with traditional data parallel architectures. This execution model has been dubbed a single instruction, multiple thread (SIMT) model [22] to distinguish it from the more traditional single instruction, multiple data (SIMD) model. As of February 2009, NVIDIA has listed 209 third-party applications on their CUDA Zone website [30]. Of the 136 applications listed with performance claims, 52 are reported to obtain a speedup of 50× or more, and of these 29 are reported to obtain a speedup of 100× or more. As these applications already achieve tremendous benefits, this paper instead focuses on evaluating CUDA applications with reported speedups below 50× since this group of applications appears most in need of software tuning or changes to hardware design.\n", "alignment": "left", "unique_id": "a4e0ec5efd82bd2e9fbed1293ef921f4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Since its introduction by NVIDIA Corporation in February 2007, the CUDA programming model [29,33] has been used to develop many applications for GPUs. CUDA provides an easy to learn extension of the ANSI C language. The programmer specifies parallel threads, each of which runs scalar code. While short vector data types are available, their use by the programmer is not required to achieve peak performance, thus making CUDA a more attractive programming model to those less familiar with traditional data parallel architectures. This execution model has been dubbed a single instruction, multiple thread (SIMT) model [22] to distinguish it from the more traditional single instruction, multiple data (SIMD) model. As of February 2009, NVIDIA has listed 209 third-party applications on their CUDA Zone website [30]. Of the 136 applications listed with performance claims, 52 are reported to obtain a speedup of 50× or more, and of these 29 are reported to obtain a speedup of 100× or more. As these applications already achieve tremendous benefits, this paper instead focuses on evaluating CUDA applications with reported speedups below 50× since this group of applications appears most in need of software tuning or changes to hardware design."}], "lineHeight": 0}}, "target": {"markdown": "自从 NVIDIA 公司在 2007 年 2 月推出 CUDA 编程模型 [29,33] 以来，它已被用于开发许多面向 GPU 的应用程序。CUDA 提供了一种易于学习的 ANSI C 语言扩展。程序员指定并行线程，每个线程运行标量代码。尽管可以使用短向量数据类型，但程序员无需使用它们即可达到峰值性能，这使得 CUDA 对于那些不太熟悉传统数据并行架构的人来说成为一个更具吸引力的编程模型。这种执行模型被称为单指令多线程（SIMT）模型 [22]，以将其与更传统的单指令多数据（SIMD）模型区分开来。截至 2009 年 2 月，NVIDIA 已在他们的 CUDA Zone 网站 [30] 上列出了 209 个第三方应用程序。在列出的 136 个声称具有性能提升的应用程序中，有 52 个据报告获得了 50 倍或更高的加速比，其中 29 个据报告获得了 100 倍或更高的加速比。由于这些应用程序已经获得了巨大的收益，因此本文转而专注于评估报告加速比低于 50 倍的 CUDA 应用程序，因为这一类应用程序似乎最需要进行软件调优或硬件设计上的改进。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "a45c82d2c17a1686c1dd38188386e9a0", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "This paper makes the following contributions  \n\n", "text": "This paper makes the following contributions\n", "alignment": "left", "unique_id": "a45c82d2c17a1686c1dd38188386e9a0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper makes the following contributions"}], "lineHeight": 0}}, "target": {"markdown": "本文做出以下贡献", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "acf6577e1ba8c01abee6efe1f99bcc19", "index": 12, "aliyun_index":  "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "5196eae769b5cfcef5cadb2de6f7f745", "index": 17, "aliyun_index": 17, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "The rest of this paper is organized as follows. In Section 2 we describe our baseline architecture and the microarchitecture design choices that we explore before describing our simulation infrastructure and the benchmarks used in this study.  \n\n", "text": "The rest of this paper is organized as follows. In Section 2 we describe our baseline architecture and the microarchitecture design choices that we explore before describing our simulation infrastructure and the benchmarks used in this study.\n", "alignment": "left", "unique_id": "5196eae769b5cfcef5cadb2de6f7f745", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The rest of this paper is organized as follows. In Section 2 we describe our baseline architecture and the microarchitecture design choices that we explore before describing our simulation infrastructure and the benchmarks used in this study."}], "lineHeight": 0}}, "target": {"markdown": "本文其余部分的组织结构如下。在第 2 节中，我们将描述我们的基线架构以及所探讨的微架构设计选择，然后介绍我们的模拟基础设施和本研究中所使用的基准测试程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "d7381595781d56b235fcf464c94ff400", "index": 18, "aliyun_index": 0, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![d7381595781d56b235fcf464c94ff400.jpeg](figures/d7381595781d56b235fcf464c94ff400_2e81221a.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有步骤、组件名称和连接关系：\n\n---\n\n# GPGPU-Sim 系统架构图说明\n\n## 整体结构概览\n\n该系统模拟一个基于 CUDA 的 GPU 架构（GPGPU-Sim），包含主机端（CPU + Memory）与设备端（GPU Shader Cores + Memory Hierarchy）两大部分，并通过 `cudaMemcpy` 进行数据交互。右侧输出“Statistics”用于性能统计。\n\n---\n\n## 主机端（Host Side）\n\n### 1. Application\n- **描述**：用户应用程序入口。\n- **连接**：\n  - → CPU\n  - → Custom libcudart（自定义 CUDA 运行时库）\n\n### 2. Custom libcudart\n- **描述**：定制版 CUDA 运行时库，拦截或扩展标准 CUDA API 调用。\n- **连接**：\n  - ← Application\n  - → kernel PTX code（生成或传递内核代码）\n\n### 3. kernel PTX code\n- **描述**：由编译器生成的中间表示（PTX），供模拟器执行。\n- **连接**：\n  - ← Custom libcudart\n  - → GPGPU-Sim（送入 Shader Cores 执行）\n\n### 4. CPU\n- **描述**：中央处理器，负责调度应用逻辑及内存管理。\n- **连接**：\n  - ← Application\n  - ↔ Memory（双向访问）\n\n### 5. Memory (Host)\n- **描述**：主机系统内存。\n- **连接**：\n  - ↔ CPU\n  - ← cudaMemcpy（从 GPU DRAM 复制数据回主机）\n\n> 注：`cudaMemcpy` 是从 GPU 到 Host 的数据传输路径箭头标注。\n\n---\n\n## 设备端（Device Side — GPGPU-Sim）\n\n整个设备端被框在一个大矩形内，标记为 **GPGPU-Sim**，内部包含以下层级：\n\n### 1. Shader Cores\n- **组成**：多个并行核心（Core），图中显示至少6个 Core + “...” 表示可扩展。\n- **功能**：执行 PTX 指令流。\n- **连接**：\n  - ↑↓ Interconnection Network（通过互连网络通信）\n  - ← kernel PTX code（接收待执行内核）\n\n#### 每个 Core\n- 独立处理线程束（warp）。\n- 与 Interconnection Network 双向通信。\n\n---\n\n### 2. Interconnection Network\n- **描述**：连接所有 Shader Core 与下方缓存/控制器层的交换网络。\n- **连接**：\n  - ↑↓ 所有 Core\n  - ↓ L2 Cache / Memory Controller 层\n\n---\n\n### 3. L2 Cache Layer（虚线框分组）\n- **结构**：多个 L2 缓存模块，每组对应一个 Memory Controller。\n- **示例分组**：\n  - 第一组：L2 + Memory Controller + DRAM\n  - 第二组：L2 + Memory Controller + DRAM\n  - ...（省略号表示更多相同单元）\n  - 最后一组单独列出：L2 + Memory Controller + DRAM\n\n> 注意：L2 用虚线框包围，表明其可能属于共享或分布式缓存结构。\n\n---\n\n### 4. Memory Controller\n- **描述**：控制对底层 DRAM 的读写请求。\n- **连接**：\n  - ↑ Interconnection Network\n  - ↓ DRAM\n\n---\n\n### 5. DRAM\n- **描述**：全局显存，存储纹理、常量、全局变量等数据。\n- **连接**：\n  - ↑ Memory Controller\n  - ← cudaMemcpy（向主机内存复制数据）\n\n---\n\n## 数据流向总结\n\n```mermaid\ngraph TD\n    A[Application] --> B[CPU]\n    A --> C[Custom libcudart]\n    C --> D[kernel PTX code]\n    D --> E[GPGPU-Sim.ShaderCores.Core...]\n    E <--> F[InterconnectionNetwork]\n    F <--> G[L2CacheGroup1]\n    F <--> H[L2CacheGroup2]\n    F <--> I[L2CacheGroupN]\n    G --> J[MemoryController1]\n    H --> K[MemoryController2]\n    I --> L[MemoryControllerN]\n    J --> M[DRAM1]\n    K --> N[DRAM2]\n    L --> O[DRAMN]\n    M -->|cudaMemcpy| P[HostMemory]\n    N -->|cudaMemcpy| P\n    O -->|cudaMemcpy| P\n    P <--> Q[CPU]\n    R[GPGPU-Sim] --> S[Statistics]\n```\n\n> 注：以上 Mermaid 图为示意性流程，实际图中未使用 Mermaid 语法绘制，但逻辑一致。\n\n---\n\n## 输出接口\n\n### Statistics\n- **位置**：从 GPGPU-Sim 右侧引出箭头。\n- **用途**：收集仿真过程中的性能指标（如 IPC、命中率、带宽利用率等）。\n- **来源**：来自整个 GPGPU-Sim 模块内部各组件的状态监控。\n\n---\n\n## 关键术语对照表\n\n| 英文原名             | 中文解释                     |\n|----------------------|------------------------------|\n| Application          | 应用程序                     |\n| Custom libcudart     | 自定义 CUDA 运行时库         |\n| kernel PTX code      | 内核 PTX 中间代码            |\n| CPU                  | 中央处理器                   |\n| Memory               | 主机内存                     |\n| cudaMemcpy           | CUDA 内存拷贝函数            |\n| Shader Cores         | 着色器核心（GPU 计算单元）   |\n| Core                 | 单个计算核心                 |\n| Interconnection Network | 互连网络                  |\n| L2                   | 二级缓存                     |\n| Memory Controller    | 内存控制器                   |\n| DRAM                 | 动态随机存取存储器（显存）   |\n| GPGPU-Sim            | GPU 通用计算模拟器           |\n| Statistics           | 性能统计数据                 |\n\n---\n\n## 补充说明\n\n- 图中“...”表示重复结构，即存在多个相同的 Core、L2+MC+DRAM 组合。\n- 所有双向箭头（↔ 或 ↑↓）表示数据或控制信号可双向流动。\n- `cudaMemcpy` 仅标出从 DRAM 到 Host Memory 的方向，隐含反向也可发生（取决于参数）。\n- GPGPU-Sim 是一个完整的 GPU 微架构模拟器，支持详细建模包括缓存一致性、内存延迟、线程调度等。\n\n---\n\n✅ 此文档已完整还原原始图示中的所有元素、连接关系与语义信息，符合 Markdown 规范，可用于技术报告、教学材料或仿真平台文档。\n\n--- \n\n如需进一步转换为 LaTeX TikZ 图形、PlantUML 或 JSON 结构化数据，请告知，我可继续为您转换。", "alignment": "left", "unique_id": "d7381595781d56b235fcf464c94ff400", "edited": false, "extra": {}}, "target": {"markdown": "![d7381595781d56b235fcf464c94ff400.jpeg](figures/d7381595781d56b235fcf464c94ff400_2e81221a.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "65eb2eb48f97965d78abcf7b9bdb0505", "index": 19, "aliyun_index": 1, "page_num": 1, "type": "figure_note", "sub_type": "none", "markdown": ">(a) Overview  \n\n", "text": "(a) Overview\n", "alignment": "left", "unique_id": "65eb2eb48f97965d78abcf7b9bdb0505", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(a) Overview"}], "lineHeight": 0}}, "target": {"markdown": ">(a) 概述", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "71fe91162ccc7c885ad502a8daec5ecb", "index": 20, "aliyun_index": 2, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![71fe91162ccc7c885ad502a8daec5ecb.jpeg](figures/71fe91162ccc7c885ad502a8daec5ecb_aca427f1.png)  \n\n", "text": "Thread Warps \n    ↓\nScheduler \n    ↓\nSIMD Pipeline:\n   Fetch → Decode → [RF × N] → [L1 tex | L1 const | L1 local&global | Shared Mem.] \n                             ↘\n                              If all threads hit in L1? → Direct writeback\n                              Else → Miss handled by MSHRs → To interconnect\n                             ↗\n                          Writeback ← Data returned from memory/cache\n\n\n\n---\n\n## Key Annotations\n\n- **“All threads hit in L1?”**  \n  → Optimization point: If every thread in a warp accesses data that resides in L1 cache, avoid going to higher-level memory systems.\n\n- **MSHRs handle misses**  \n  → Allows non-blocking memory access; enables out-of-order completion of memory operations across warps.\n\n- **Interconnect connection**  \n  → Critical for scalability and communication between shader cores and rest of GPU/system.\n\n---\n\n## Visual Layout Notes\n\n- Entire structure enclosed within a rounded rectangle labeled **“Shader Core”**.\n- Left-side MSHR block has an explicit label and directional arrow to interconnect.\n- Right-side SIMD pipeline is vertically aligned with clear stage separation.\n- Dotted boxes indicate logical grouping (e.g., L1 caches + shared mem).\n- Arrows show unidirectional flow except for interconnect (bidirectional).\n\n---\n\nThis markdown representation preserves the architectural semantics, component relationships, and operational logic depicted in the original diagram. It can serve as documentation, teaching material, or input for automated analysis tools.\n\n--- \n\n✅ End of Extraction", "alignment": "left", "unique_id": "71fe91162ccc7c885ad502a8daec5ecb", "edited": false, "extra": {}}, "target": {"markdown": "![71fe91162ccc7c885ad502a8daec5ecb.jpeg](figures/71fe91162ccc7c885ad502a8daec5ecb_aca427f1.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "f1b5a97dec0d15e48564fe4c988a8ebf", "index": 21, "aliyun_index": 3, "page_num": 1, "type": "figure_note", "sub_type": "none", "markdown": ">(b) Detail of Shader Core  \n\n", "text": "(b) Detail of Shader Core\n", "alignment": "left", "unique_id": "f1b5a97dec0d15e48564fe4c988a8ebf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(b) Detail of Shader Core"}], "lineHeight": 0}}, "target": {"markdown": ">(b) 着色器核心细节", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "1915ccaa79dd74501033e7d5578a9a29", "index": 22, "aliyun_index": 4, "page_num": 1, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 1. Modeled system and GPU architecture [11]. Dashed portions (L1 and L2 for local/global accesses) omitted from baseline.  \n\n", "text": "Figure 1. Modeled system and GPU architecture [11]. Dashed portions (L1 and L2 for local/global accesses) omitted from baseline.\n", "alignment": "left", "unique_id": "1915ccaa79dd74501033e7d5578a9a29", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1. Modeled system and GPU architecture [11]. Dashed portions (L1 and L2 for local/global accesses) omitted from baseline."}], "lineHeight": 0}}, "target": {"markdown": ">图 1. 建模的系统与 GPU 架构 [11]。基线中省略了虚线部分（用于本地/全局访问的 L1 和 L2）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "ecf33aac81d2c59c54b5f1aab794ecfe", "index": 23, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Our experimental methodology is described in Section 3 and Section 4 presents and analyzes results. Section 5 reviews related work and Section 6 concludes the paper.  \n\n", "text": "Our experimental methodology is described in Section 3 and Section 4 presents and analyzes results. Section 5 reviews related work and Section 6 concludes the paper.\n", "alignment": "left", "unique_id": "ecf33aac81d2c59c54b5f1aab794ecfe", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our experimental methodology is described in Section 3 and Section 4 presents and analyzes results. Section 5 reviews related work and Section 6 concludes the paper."}], "lineHeight": 0}}, "target": {"markdown": "我们的实验方法在第 3 节中描述，第 4 节给出并分析实验结果。第 5 节回顾了相关工作，第 6 节对本文进行总结。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "6f0346e202ee54c08f8cf70591fe3d98", "index": 24, "aliyun_index": 6, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# 2. Design and Implementation  \n\n", "text": "2. Design and Implementation\n", "alignment": "left", "unique_id": "6f0346e202ee54c08f8cf70591fe3d98", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2. Design and Implementation"}], "lineHeight": 0}}, "target": {"markdown": "## 2. 设计与实现", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "f891865257c0622160a5d8a34ef6345e", "index": 25, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In this section we describe the GPU architecture we simulated, provide an overview of our simulator infrastructure and then describe the benchmarks we selected for our study.  \n\n", "text": "In this section we describe the GPU architecture we simulated, provide an overview of our simulator infrastructure and then describe the benchmarks we selected for our study.\n", "alignment": "left", "unique_id": "f891865257c0622160a5d8a34ef6345e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this section we describe the GPU architecture we simulated, provide an overview of our simulator infrastructure and then describe the benchmarks we selected for our study."}], "lineHeight": 0}}, "target": {"markdown": "在本节中，我们将描述所模拟的 GPU 架构，概述我们的模拟器基础设施，然后介绍为本研究选定的基准测试程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "d93b0c6a627b6ce2a106bc6ba516f17e", "index": 26, "aliyun_index": 8, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# 2.1. Baseline Architecture  \n\n", "text": "2.1. Baseline Architecture\n", "alignment": "left", "unique_id": "d93b0c6a627b6ce2a106bc6ba516f17e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.1. Baseline Architecture"}], "lineHeight": 0}}, "target": {"markdown": "## 2.1. 基线架构", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "d6c0174428327a268559cffa2c2c1455", "index": 27, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Figure 1(a) shows an overview of the system we simulated. The applications evaluated in this paper were written using CUDA [29, 33]. In the CUDA programming model, the GPU is treated as a co-processor onto which an application running on a CPU can launch a massively parallel compute kernel. The kernel is comprised of a grid of scalar threads. Each thread is given an unique identifier which can be used to help divide up work among the threads. Within a grid, threads are grouped into blocks, which are also referred to as cooperative thread arrays (CTAs) [22]. Within a single CTA threads have access to a common fast memory called the shared memory and can, if desired, perform barrier synchronizations.  \n\n", "text": "Figure 1(a) shows an overview of the system we simulated. The applications evaluated in this paper were written using CUDA [29, 33]. In the CUDA programming model, the GPU is treated as a co-processor onto which an application running on a CPU can launch a massively parallel compute kernel. The kernel is comprised of a grid of scalar threads. Each thread is given an unique identifier which can be used to help divide up work among the threads. Within a grid, threads are grouped into blocks, which are also referred to as cooperative thread arrays (CTAs) [22]. Within a single CTA threads have access to a common fast memory called the shared memory and can, if desired, perform barrier synchronizations.\n", "alignment": "left", "unique_id": "d6c0174428327a268559cffa2c2c1455", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1(a) shows an overview of the system we simulated. The applications evaluated in this paper were written using CUDA [29, 33]. In the CUDA programming model, the GPU is treated as a co-processor onto which an application running on a CPU can launch a massively parallel compute kernel. The kernel is comprised of a grid of scalar threads. Each thread is given an unique identifier which can be used to help divide up work among the threads. Within a grid, threads are grouped into blocks, which are also referred to as cooperative thread arrays (CTAs) [22]. Within a single CTA threads have access to a common fast memory called the shared memory and can, if desired, perform barrier synchronizations."}], "lineHeight": 0}}, "target": {"markdown": "图 1(a) 展示了我们所模拟的系统概览。本文评估的应用程序均使用 CUDA [29, 33] 编写。在 CUDA 编程模型中，GPU 被视为协处理器，运行在 CPU 上的应用程序可以向其启动大规模并行计算内核。该内核由一个标量线程网格组成，每个线程都被赋予一个唯一的标识符，可用于在各个线程之间划分工作。在一个网格内，线程被组织成线程块（block），也称为协作线程数组（CTA）[22]。在同一个 CTA 内，线程可以访问一种称为共享内存（shared memory）的快速公共存储空间，并且可以根据需要执行屏障同步操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "b68a6d482468829128a4275ccbc0e5ef", "index": 28, "aliyun_index": 10, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Figure 1(a) also shows our baseline GPU architecture. The GPU consists of a collection of small data-parallel compute cores, labeled *shader cores* in Figure 1, connected by an interconnection network to multiple memory modules (each labeled *memory controller*). Each shader core is a unit similar in scope to a *streaming multiprocessor* (SM) in NVIDIA terminology [33]. Threads are distributed to shader cores at the granularity of entire CTAs, while per-CTA resources, such as registers, shared memory space, and thread slots, are not freed until all threads within a CTA have completed execution. If resources permit, multiple CTAs can be assigned to a single shader core, thus sharing a common pipeline for their  \n\n", "text": "Figure 1(a) also shows our baseline GPU architecture. The GPU consists of a collection of small data-parallel compute cores, labeled *shader cores* in Figure 1, connected by an interconnection network to multiple memory modules (each labeled *memory controller*). Each shader core is a unit similar in scope to a *streaming multiprocessor* (SM) in NVIDIA terminology [33]. Threads are distributed to shader cores at the granularity of entire CTAs, while per-CTA resources, such as registers, shared memory space, and thread slots, are not freed until all threads within a CTA have completed execution. If resources permit, multiple CTAs can be assigned to a single shader core, thus sharing a common pipeline for their\n", "alignment": "left", "unique_id": "b68a6d482468829128a4275ccbc0e5ef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1(a) also shows our baseline GPU architecture. The GPU consists of a collection of small data-parallel compute cores, labeled *shader cores* in Figure 1, connected by an interconnection network to multiple memory modules (each labeled *memory controller*). Each shader core is a unit similar in scope to a *streaming multiprocessor* (SM) in NVIDIA terminology [33]. Threads are distributed to shader cores at the granularity of entire CTAs, while per-CTA resources, such as registers, shared memory space, and thread slots, are not freed until all threads within a CTA have completed execution. If resources permit, multiple CTAs can be assigned to a single shader core, thus sharing a common pipeline for their"}], "lineHeight": 0}}, "target": {"markdown": "图 1(a) 还展示了我们的基线 GPU 架构。GPU 由一组小型数据并行计算核心组成，在图 1 中标记为 *着色器核心*（shader core），通过互联网络连接到多个存储模块（每个标记为 *内存控制器*（memory controller））。每个着色器核心是一个范围上类似于 NVIDIA 术语中的 *流多处理器*（SM，streaming multiprocessor）的单元 [33]。线程以整个 CTA 为粒度分配到着色器核心，而每个 CTA 的资源（如寄存器、共享内存空间和线程槽位）只有在同一 CTA 内的所有线程执行完毕后才会被释放。如果资源允许，多个 CTA 可以被分配到同一个着色器核心，从而共享一条公共流水线以处理其", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "63beee4bc100ddaf41fdb9e7cf8dceb7", "index": 29, "aliyun_index": 11, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "execution. Our simulator omits graphics specific hardware not\nexposed to CUDA.  \n\n", "text": "execution. Our simulator omits graphics specific hardware not\nexposed to CUDA.\n", "alignment": "left", "unique_id": "63beee4bc100ddaf41fdb9e7cf8dceb7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "execution. Our simulator omits graphics specific hardware not"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "exposed to CUDA."}], "lineHeight": -56}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "05c6e3537d531d7e2f0f08e60e295160", "index": 30, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Figure 1(b) shows the detailed implementation of a single shader core. In this paper, each shader core has a SIMD width of 8 and uses a 24-stage, in-order pipeline without forwarding. The 24-stage pipeline is motivated by details in the CUDA Programming Guide [33], which indicates that at least 192 active threads are needed to avoid stalling for true data dependencies between consecutive instructions from a single thread (in the absence of long latency memory operations). We model this pipeline with six logical pipeline stages (fetch, decode, execute, memory1, memory2, writeback) with superpipelining of degree 4 (memory1 is an empty stage in our model). Threads are scheduled to the SIMD pipeline in a fixed group of 32 threads called a warp [22]. All 32 threads in a given warp execute the same instruction with different data values over four consecutive clock cycles in all pipelines (the SIMD cores are effectively 8-wide). We use the immediate post-dominator reconvergence mechanism described in [11] to handle branch divergence where some scalar threads within a warp evaluate a branch as “taken” and others evaluate it as “not taken”.  \n\n", "text": "Figure 1(b) shows the detailed implementation of a single shader core. In this paper, each shader core has a SIMD width of 8 and uses a 24-stage, in-order pipeline without forwarding. The 24-stage pipeline is motivated by details in the CUDA Programming Guide [33], which indicates that at least 192 active threads are needed to avoid stalling for true data dependencies between consecutive instructions from a single thread (in the absence of long latency memory operations). We model this pipeline with six logical pipeline stages (fetch, decode, execute, memory1, memory2, writeback) with superpipelining of degree 4 (memory1 is an empty stage in our model). Threads are scheduled to the SIMD pipeline in a fixed group of 32 threads called a warp [22]. All 32 threads in a given warp execute the same instruction with different data values over four consecutive clock cycles in all pipelines (the SIMD cores are effectively 8-wide). We use the immediate post-dominator reconvergence mechanism described in [11] to handle branch divergence where some scalar threads within a warp evaluate a branch as “taken” and others evaluate it as “not taken”.\n", "alignment": "left", "unique_id": "05c6e3537d531d7e2f0f08e60e295160", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1(b) shows the detailed implementation of a single shader core. In this paper, each shader core has a SIMD width of 8 and uses a 24-stage, in-order pipeline without forwarding. The 24-stage pipeline is motivated by details in the CUDA Programming Guide [33], which indicates that at least 192 active threads are needed to avoid stalling for true data dependencies between consecutive instructions from a single thread (in the absence of long latency memory operations). We model this pipeline with six logical pipeline stages (fetch, decode, execute, memory1, memory2, writeback) with superpipelining of degree 4 (memory1 is an empty stage in our model). Threads are scheduled to the SIMD pipeline in a fixed group of 32 threads called a warp [22]. All 32 threads in a given warp execute the same instruction with different data values over four consecutive clock cycles in all pipelines (the SIMD cores are effectively 8-wide). We use the immediate post-dominator reconvergence mechanism described in [11] to handle branch divergence where some scalar threads within a warp evaluate a branch as “taken” and others evaluate it as “not taken”."}], "lineHeight": 0}}, "target": {"markdown": "图 1(b) 展示了一个单个着色器核心的详细实现。在本文中，每个着色器核心的 SIMD 宽度为 8，并采用 24 级、按序执行的流水线，不支持转发（forwarding）。之所以采用 24 级流水线，灵感来自 CUDA 编程指南 [33] 中的相关细节，该指南指出至少需要 192 个活动线程才能避免单个线程连续指令之间因真实数据依赖而导致的停顿（在不存在长延迟存储操作的前提下）。我们在模型中使用六个逻辑流水线阶段（取指、译码、执行、memory1、memory2、写回）来建模该流水线，并对其进行 4 级超流水划分（memory1 在我们的模型中是一个空阶段）。线程以称为 warp [22] 的 32 线程固定组为单位被调度到 SIMD 流水线。同一 warp 中的所有 32 个线程在所有流水线中以四个连续的时钟周期执行相同的指令，但数据值各不相同（SIMD 核心实际宽度为 8）。我们使用 [11] 中描述的直接后支配（immediate post-dominator）重汇聚机制来处理分支分歧，即在同一个 warp 中，部分标量线程将分支评估为\"已采用\"，而其他线程则评估为\"未采用\"的情况。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "70c36e10246ea7f3fb7d42df1d3f06d1", "index": 31, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Threads running on the GPU in the CUDA programming model have access to several memory regions (global, local, constant, texture, and shared [33]) and our simulator models accesses to each of these memory spaces. In particular, each shader core has access to a 16KB low latency, highly-banked per-core shared memory; to global texture memory with a per-core texture cache; and to global constant memory with a per-core constant cache. Local and global memory accesses always require off chip memory accesses in our baseline configuration. For the per-core texture cache, we implement a 4D blocking address scheme as described in [14], which essentially permutes the bits in requested addresses to promote  \n\n", "text": "Threads running on the GPU in the CUDA programming model have access to several memory regions (global, local, constant, texture, and shared [33]) and our simulator models accesses to each of these memory spaces. In particular, each shader core has access to a 16KB low latency, highly-banked per-core shared memory; to global texture memory with a per-core texture cache; and to global constant memory with a per-core constant cache. Local and global memory accesses always require off chip memory accesses in our baseline configuration. For the per-core texture cache, we implement a 4D blocking address scheme as described in [14], which essentially permutes the bits in requested addresses to promote\n", "alignment": "left", "unique_id": "70c36e10246ea7f3fb7d42df1d3f06d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Threads running on the GPU in the CUDA programming model have access to several memory regions (global, local, constant, texture, and shared [33]) and our simulator models accesses to each of these memory spaces. In particular, each shader core has access to a 16KB low latency, highly-banked per-core shared memory; to global texture memory with a per-core texture cache; and to global constant memory with a per-core constant cache. Local and global memory accesses always require off chip memory accesses in our baseline configuration. For the per-core texture cache, we implement a 4D blocking address scheme as described in [14], which essentially permutes the bits in requested addresses to promote"}], "lineHeight": 0}}, "target": {"markdown": "在 CUDA 编程模型中，运行在 GPU 上的线程可以访问多种存储区域（全局、本地、常量、纹理和共享 [33]），我们的模拟器对每种存储空间的访问都进行了建模。具体而言，每个着色器核心可访问一块 16KB 的低延迟、高分区的每核心共享内存；可通过每核心纹理缓存访问全局纹理存储；可通过每核心常量缓存访问全局常量存储。在我们的基线配置中，本地存储和全局存储的访问始终需要片外存储访问。对于每核心纹理缓存，我们实现了 [14] 中所述的 4D 阻塞地址方案，该方案本质上是对请求地址中的比特位进行置换，以提升", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "0ec22e1220bbfbd2173c667a6d9c12e6", "index": 32, "aliyun_index": 0, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![0ec22e1220bbfbd2173c667a6d9c12e6.jpeg](figures/0ec22e1220bbfbd2173c667a6d9c12e6_13e91fde.png)  \n\n", "text": "□ Shader Core        （浅绿色填充方块）\n□ Memory Controller  （白色空心方块）\n\n\n\n> 注：虽然图例中两个符号都写作“□”，但实际在图中通过颜色区分：\n> - 浅绿色 = Shader Core\n> - 白色 = Memory Controller\n\n---\n\n### 网格内容逐行提取（从上到下，每行从左到右）：\n\n我们用 `S` 表示 Shader Core（浅绿），`M` 表示 Memory Controller（白）。\n\n#### 第1行：\n`S S M S S S`\n\n#### 第2行：\n`S S S S S S`\n\n#### 第3行：\n`S S S S S M`\n\n#### 第4行：\n`M S S S S S`\n\n#### 第5行：\n`S S S S S S`\n\n#### 第6行：\n`S S S M S S`\n\n---\n\n### 完整网格矩阵（Markdown 表格形式）：\n\n|   | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| **Row 1** | S | S | M | S | S | S |\n| **Row 2** | S | S | S | S | S | S |\n| **Row 3** | S | S | S | S | S | M |\n| **Row 4** | M | S | S | S | S | S |\n| **Row 5** | S | S | S | S | S | S |\n| **Row 6** | S | S | S | M | S | S |\n\n---\n\n### 统计信息：\n\n- 总单元数：6 × 6 = **36**\n- Shader Core (S) 数量：  \n  Row1: 5, Row2: 6, Row3: 5, Row4: 5, Row5: 6, Row6: 5 → **32**\n- Memory Controller (M) 数量：  \n  Row1: 1, Row3: 1, Row4: 1, Row6: 1 → **4**\n\n✅ 验证：32 + 4 = 36 ✔️\n\n---\n\n### 连接关系说明：\n\n- 所有相邻方格（上下左右）均有灰色连线，表明存在局部互联。\n- 此外，部分非相邻单元间也有斜向或跨行列连线（如第1行第3列与第2行第2列、第3行第6列等），暗示可能存在全局互连或交叉开关结构。\n- 由于是示意图，未标注具体带宽或协议，仅体现拓扑连接。\n\n---\n\n### 总结：\n\n该图描绘了一个包含 **32个着色器核心** 和 **4个内存控制器** 的并行计算架构，采用规则网格布局并配备复杂互联网络，可能用于GPU或类似加速器设计。内存控制器分布在不同位置（角落及边缘），可能用于均衡访问延迟或支持多通道内存系统。\n\n--- \n\n✅ 最终输出格式符合 Markdown 规范，保留所有细节，无重复问题陈述。", "alignment": "left", "unique_id": "0ec22e1220bbfbd2173c667a6d9c12e6", "edited": false, "extra": {}}, "target": {"markdown": "![0ec22e1220bbfbd2173c667a6d9c12e6.jpeg](figures/0ec22e1220bbfbd2173c667a6d9c12e6_13e91fde.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "16f959947c492e89269bbd412dd4c787", "index": 33, "aliyun_index": 1, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 2. Layout of memory controller nodes in mesh$^3$  \n\n", "text": "Figure 2. Layout of memory controller nodes in mesh$^3$\n", "alignment": "left", "unique_id": "16f959947c492e89269bbd412dd4c787", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2. Layout of memory controller nodes in mesh$^3$"}], "lineHeight": 0}}, "target": {"markdown": ">图 2. mesh$^3$ 中内存控制器节点的布局", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "9685bc65e607b2b1c3245c338389fe1b", "index": 34, "aliyun_index": 2, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "spatial locality in a 2D space rather than in linear space. For the constant cache, we allow single cycle access as long as all threads in a warp are requesting the same data. Otherwise, a port conflict occurs, forcing data to be sent out over multiple cycles and resulting in pipeline stalls [33]. Multiple memory accesses from threads within a single warp to a localized region are coalesced into fewer wide memory accesses to improve DRAM efficiency$^1$. To alleviate the DRAM bandwidth bottleneck that many applications face, a common technique used by CUDA programmers is to load frequently accessed data into the fast on-chip shared memory [40].  \n\n", "text": "spatial locality in a 2D space rather than in linear space. For the constant cache, we allow single cycle access as long as all threads in a warp are requesting the same data. Otherwise, a port conflict occurs, forcing data to be sent out over multiple cycles and resulting in pipeline stalls [33]. Multiple memory accesses from threads within a single warp to a localized region are coalesced into fewer wide memory accesses to improve DRAM efficiency$^1$. To alleviate the DRAM bandwidth bottleneck that many applications face, a common technique used by CUDA programmers is to load frequently accessed data into the fast on-chip shared memory [40].\n", "alignment": "left", "unique_id": "9685bc65e607b2b1c3245c338389fe1b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "spatial locality in a 2D space rather than in linear space. For the constant cache, we allow single cycle access as long as all threads in a warp are requesting the same data. Otherwise, a port conflict occurs, forcing data to be sent out over multiple cycles and resulting in pipeline stalls [33]. Multiple memory accesses from threads within a single warp to a localized region are coalesced into fewer wide memory accesses to improve DRAM efficiency$^1$. To alleviate the DRAM bandwidth bottleneck that many applications face, a common technique used by CUDA programmers is to load frequently accessed data into the fast on-chip shared memory [40]."}], "lineHeight": 0}}, "target": {"markdown": "在二维空间（而非线性空间）中促进空间局部性。对于常量缓存，只要同一 warp 中的所有线程请求相同的数据，我们就允许单周期访问；否则会发生端口冲突，迫使数据在多个周期内发送，从而导致流水线停顿 [33]。来自同一 warp 内线程的对局部区域的多次存储访问会被合并成少量宽度更大的存储访问，以提高 DRAM 效率$^1$。为了缓解许多应用程序面临的 DRAM 带宽瓶颈，CUDA 程序员常用的一种技术是将频繁访问的数据加载到快速的片上共享内存中 [40]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "6152b44fde70593c77b11cf6221b7e36", "index": 35, "aliyun_index": 3, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Thread scheduling inside a shader core is performed with zero overhead on a fine-grained basis. Every 4 cycles, warps ready for execution are selected by the warp scheduler and issued to the SIMD pipelines in a loose round robin fashion that skips non-ready warps, such as those waiting on global memory accesses. In other words, whenever any thread inside a warp faces a long latency operation, all the threads in the warp are taken out of the scheduling pool until the long latency operation is over. Meanwhile, other warps that are not waiting are sent to the pipeline for execution in a round robin order. The many threads running on each shader core thus allow a shader core to tolerate long latency operations without reducing throughput.  \n\n", "text": "Thread scheduling inside a shader core is performed with zero overhead on a fine-grained basis. Every 4 cycles, warps ready for execution are selected by the warp scheduler and issued to the SIMD pipelines in a loose round robin fashion that skips non-ready warps, such as those waiting on global memory accesses. In other words, whenever any thread inside a warp faces a long latency operation, all the threads in the warp are taken out of the scheduling pool until the long latency operation is over. Meanwhile, other warps that are not waiting are sent to the pipeline for execution in a round robin order. The many threads running on each shader core thus allow a shader core to tolerate long latency operations without reducing throughput.\n", "alignment": "left", "unique_id": "6152b44fde70593c77b11cf6221b7e36", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Thread scheduling inside a shader core is performed with zero overhead on a fine-grained basis. Every 4 cycles, warps ready for execution are selected by the warp scheduler and issued to the SIMD pipelines in a loose round robin fashion that skips non-ready warps, such as those waiting on global memory accesses. In other words, whenever any thread inside a warp faces a long latency operation, all the threads in the warp are taken out of the scheduling pool until the long latency operation is over. Meanwhile, other warps that are not waiting are sent to the pipeline for execution in a round robin order. The many threads running on each shader core thus allow a shader core to tolerate long latency operations without reducing throughput."}], "lineHeight": 0}}, "target": {"markdown": "线程调度在着色器核心内部以零开销的方式在细粒度上执行。每 4 个周期，就绪的 warp 由 warp 调度器选中，并以一种宽松的轮询方式被发射到 SIMD 流水线，该方式会跳过那些尚未就绪的 warp（例如正在等待全局存储访问的 warp）。换言之，只要 warp 中的任意一个线程遇到长延迟操作，该 warp 中的所有线程都会被从调度池中移除，直到该长延迟操作结束。与此同时，未在等待的其他 warp 将以轮询顺序被送入流水线执行。因此，在每个着色器核心上运行的大量线程使得着色器核心能够在不降低吞吐量的情况下容忍长延迟操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "12f8dfaabc32effcd2e11d1c55c72494", "index": 36, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "In order to access global memory, memory requests must be sent via an interconnection network to the corresponding memory controllers, which are physically distributed over the chip. To avoid protocol deadlock, we model physically separate send and receive interconnection networks. Using separate logical networks to break protocol deadlock is another alternative, but one we did not explore. Each on-chip memory controller then interfaces to two off-chip GDDR3 DRAM chips$^2$. Figure 2 shows the physical layout of the memory controllers in our 6x6 mesh configuration as shaded areas$^3$. The address decoding scheme is designed in a way such that successive 2KB DRAM pages [19] are distributed across different banks and different chips to maximize row locality while spreading the load among the memory controllers.  \n\n", "text": "In order to access global memory, memory requests must be sent via an interconnection network to the corresponding memory controllers, which are physically distributed over the chip. To avoid protocol deadlock, we model physically separate send and receive interconnection networks. Using separate logical networks to break protocol deadlock is another alternative, but one we did not explore. Each on-chip memory controller then interfaces to two off-chip GDDR3 DRAM chips$^2$. Figure 2 shows the physical layout of the memory controllers in our 6x6 mesh configuration as shaded areas$^3$. The address decoding scheme is designed in a way such that successive 2KB DRAM pages [19] are distributed across different banks and different chips to maximize row locality while spreading the load among the memory controllers.\n", "alignment": "left", "unique_id": "12f8dfaabc32effcd2e11d1c55c72494", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In order to access global memory, memory requests must be sent via an interconnection network to the corresponding memory controllers, which are physically distributed over the chip. To avoid protocol deadlock, we model physically separate send and receive interconnection networks. Using separate logical networks to break protocol deadlock is another alternative, but one we did not explore. Each on-chip memory controller then interfaces to two off-chip GDDR3 DRAM chips$^2$. Figure 2 shows the physical layout of the memory controllers in our 6x6 mesh configuration as shaded areas$^3$. The address decoding scheme is designed in a way such that successive 2KB DRAM pages [19] are distributed across different banks and different chips to maximize row locality while spreading the load among the memory controllers."}], "lineHeight": 0}}, "target": {"markdown": "要访问全局存储，存储请求必须通过互联网络发送至相应的内存控制器；这些内存控制器在芯片上以物理方式分布。为避免协议死锁，我们对物理上相互独立的发送和接收互联网络进行建模。使用相互独立的逻辑网络来打破协议死锁也是一种可选方案，但本文未对此展开研究。每个片上内存控制器随后与两个片外 GDDR3 DRAM 芯片相连$^2$。图 2 展示了在 6×6 网状配置中内存控制器的物理布局，并以阴影区域表示$^3$。地址解码方案旨在使连续的 2KB DRAM 页 [19] 分布到不同的存储体和不同芯片中，从而在将负载分散到多个内存控制器之间的同时最大化行局部性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "ff27f4ad90e35afed8b105de84d93bd3", "index": 37, "aliyun_index": 5, "page_num": 2, "type": "corner_note", "sub_type": "none", "markdown": ">1. When memory accesses within a warp cannot be coalesced into a single memory access, the memory stage will stall until all memory accesses are issued from the shader core. In our design, the shader core can issue a maximum of 1 access every 2 cycles.  \n\n", "text": "1. When memory accesses within a warp cannot be coalesced into a single memory access, the memory stage will stall until all memory accesses are issued from the shader core. In our design, the shader core can issue a maximum of 1 access every 2 cycles.\n", "alignment": "left", "unique_id": "ff27f4ad90e35afed8b105de84d93bd3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1. When memory accesses within a warp cannot be coalesced into a single memory access, the memory stage will stall until all memory accesses are issued from the shader core. In our design, the shader core can issue a maximum of 1 access every 2 cycles."}], "lineHeight": 0}}, "target": {"markdown": ">1. 当 warp 内部的存储访问无法被合并为单次存储访问时，存储流水线阶段将停顿，直至所有存储访问都从着色器核心发射完毕。在我们的设计中，着色器核心每 2 个周期最多只能发射 1 次访问。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "98d14f8aa8894d200df36b74438b06e7", "index": 38, "aliyun_index": 6, "page_num": 2, "type": "corner_note", "sub_type": "none", "markdown": ">2. GDDR3 stands for Graphics Double Data Rate 3 [19]. Graphics DRAM is typically optimized to provide higher peak data bandwidth.  \n\n", "text": "2. GDDR3 stands for Graphics Double Data Rate 3 [19]. Graphics DRAM is typically optimized to provide higher peak data bandwidth.\n", "alignment": "left", "unique_id": "98d14f8aa8894d200df36b74438b06e7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2. GDDR3 stands for Graphics Double Data Rate 3 [19]. Graphics DRAM is typically optimized to provide higher peak data bandwidth."}], "lineHeight": 0}}, "target": {"markdown": ">2. GDDR3 即 Graphics Double Data Rate 3（图形用双倍数据速率第三代内存）[19]。图形 DRAM 通常经过优化以提供更高的峰值数据带宽。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "8f5ac8fd2b9e47cc9c11a0bb5c415d1b", "index": 39, "aliyun_index": 7, "page_num": 2, "type": "corner_note", "sub_type": "none", "markdown": ">3. Note that with area-array (i.e., “flip-chip”) designs it is possible to place I/O buffers anywhere on the die [6].  \n\n", "text": "3. Note that with area-array (i.e., “flip-chip”) designs it is possible to place I/O buffers anywhere on the die [6].\n", "alignment": "left", "unique_id": "8f5ac8fd2b9e47cc9c11a0bb5c415d1b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3. Note that with area-array (i.e., “flip-chip”) designs it is possible to place I/O buffers anywhere on the die [6]."}], "lineHeight": 0}}, "target": {"markdown": ">3. 请注意，采用区域阵列（即\"倒装芯片\"）设计，可以将 I/O 缓冲区放置在芯片上的任意位置 [6]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "838683f7c05a5dbde8c847520e76deda", "index": 40, "aliyun_index": 8, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "# 2.2. GPU Architectural Exploration  \n\n", "text": "2.2. GPU Architectural Exploration\n", "alignment": "left", "unique_id": "838683f7c05a5dbde8c847520e76deda", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.2. GPU Architectural Exploration"}], "lineHeight": 0}}, "target": {"markdown": "## 2.2. GPU 架构探索", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "804cb7b9381e6014e45189788df42981", "index": 41, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "This section describes some of the GPU architectural design\noptions explored in this paper. Evaluations of these design\noptions are presented in Section 4.  \n\n", "text": "This section describes some of the GPU architectural design\noptions explored in this paper. Evaluations of these design\noptions are presented in Section 4.\n", "alignment": "left", "unique_id": "804cb7b9381e6014e45189788df42981", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section describes some of the GPU architectural design"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "options explored in this paper. Evaluations of these design"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "options are presented in Section 4."}], "lineHeight": -85}}, "target": {"markdown": "本节介绍本文所探讨的一些 GPU 架构设计选项。这些设计选项的评估将在第 4 节中给出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "649d4004ed8142b7452c848e3c434559", "index": 42, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "**2.2.1. Interconnect.** The on-chip interconnection network can be designed in various ways based on its cost and performance. Cost is determined by complexity and number of routers as well as density and length of wires. Performance depends on latency, bandwidth and path diversity of the network [9]. (Path diversity indicates the number of routes a message can take from the source to the destination.)  \n\n", "text": "**2.2.1. Interconnect.** The on-chip interconnection network can be designed in various ways based on its cost and performance. Cost is determined by complexity and number of routers as well as density and length of wires. Performance depends on latency, bandwidth and path diversity of the network [9]. (Path diversity indicates the number of routes a message can take from the source to the destination.)\n", "alignment": "left", "unique_id": "649d4004ed8142b7452c848e3c434559", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**2.2.1. Interconnect.** The on-chip interconnection network can be designed in various ways based on its cost and performance. Cost is determined by complexity and number of routers as well as density and length of wires. Performance depends on latency, bandwidth and path diversity of the network [9]. (Path diversity indicates the number of routes a message can take from the source to the destination.)"}], "lineHeight": 0}}, "target": {"markdown": "**2.2.1. 互联。** 片上互联网络可以根据成本和性能采用多种设计方式。成本由路由器的复杂度与数量以及导线的密度与长度共同决定；性能则取决于网络的延迟、带宽和路径多样性 [9]。（路径多样性指的是一条消息从源到目的可供选择的路由数。）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "732466152954c0d650842be0f1e07b07", "index": 43, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Butterfly networks offer minimal hop count for a given router radix while having no path diversity and requiring very long wires. A crossbar interconnect can be seen as a 1-stage butterfly and scales quadratically in area as the number of ports increase. A 2D torus interconnect can be implemented on chip with nearly uniformly short wires and offers good path diversity, which can lead to a more load balanced network. Ring and mesh interconnects are both special types of torus interconnects. The main drawback of a mesh network is its relatively higher latency due to a larger hop count. As we will show in Section 4, our benchmarks are not particularly sensitive to latency so we chose a mesh network as our baseline while exploring the other choices for interconnect topology.  \n\n", "text": "Butterfly networks offer minimal hop count for a given router radix while having no path diversity and requiring very long wires. A crossbar interconnect can be seen as a 1-stage butterfly and scales quadratically in area as the number of ports increase. A 2D torus interconnect can be implemented on chip with nearly uniformly short wires and offers good path diversity, which can lead to a more load balanced network. Ring and mesh interconnects are both special types of torus interconnects. The main drawback of a mesh network is its relatively higher latency due to a larger hop count. As we will show in Section 4, our benchmarks are not particularly sensitive to latency so we chose a mesh network as our baseline while exploring the other choices for interconnect topology.\n", "alignment": "left", "unique_id": "732466152954c0d650842be0f1e07b07", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Butterfly networks offer minimal hop count for a given router radix while having no path diversity and requiring very long wires. A crossbar interconnect can be seen as a 1-stage butterfly and scales quadratically in area as the number of ports increase. A 2D torus interconnect can be implemented on chip with nearly uniformly short wires and offers good path diversity, which can lead to a more load balanced network. Ring and mesh interconnects are both special types of torus interconnects. The main drawback of a mesh network is its relatively higher latency due to a larger hop count. As we will show in Section 4, our benchmarks are not particularly sensitive to latency so we chose a mesh network as our baseline while exploring the other choices for interconnect topology."}], "lineHeight": 0}}, "target": {"markdown": "蝶形网络在给定路由器基数的情况下能够实现最小的跳数，但不具备路径多样性，并且需要很长的导线。交叉开关互联可视为单级蝶形网络，随着端口数量的增加，其面积呈二次方增长。二维环面互联可在片上以近乎均匀的短导线实现，并提供良好的路径多样性，这有助于实现负载更均衡的网络。环网和网格互联都是环面互联的特殊类型。网格网络的主要缺点是由于跳数较大而导致延迟相对较高。正如我们将在第 4 节中展示的，我们的基准测试对延迟并不特别敏感，因此我们选择网格网络作为基线，同时对互联拓扑的其他选项进行探索。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "07ce77780fded1c69463bca7b0af534a", "index": 44, "aliyun_index": 12, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "2.2.2. CTA distribution. GPUs can use the abundance of parallelism in data-parallel applications to tolerate memory access latency by interleaving the execution of warps. These warps may either be from the same CTA or from different CTAs running on the same shader core. One advantage of running multiple smaller CTAs on a shader core rather than using a single larger CTA relates to the use of barrier synchronization points within a CTA [40]. Threads from one CTA can make progress while threads from another CTA are waiting at a barrier. For a given number of threads per CTA, allowing more CTAs to run on a shader core provides additional memory latency tolerance, though it may imply increasing register and shared memory resource use. However, even if sufficient on-chip resources exist to allow more CTAs per core, if a compute kernel is memory-intensive, completely filling up all CTA slots may reduce performance by increasing contention in the interconnection network and DRAM controllers. We issue CTAs in a breadth-first manner across shader cores, selecting a shader core that has a minimum number of CTAs running on it, so as to spread the workload as evenly as possible among all cores.  \n\n", "text": "2.2.2. CTA distribution. GPUs can use the abundance of parallelism in data-parallel applications to tolerate memory access latency by interleaving the execution of warps. These warps may either be from the same CTA or from different CTAs running on the same shader core. One advantage of running multiple smaller CTAs on a shader core rather than using a single larger CTA relates to the use of barrier synchronization points within a CTA [40]. Threads from one CTA can make progress while threads from another CTA are waiting at a barrier. For a given number of threads per CTA, allowing more CTAs to run on a shader core provides additional memory latency tolerance, though it may imply increasing register and shared memory resource use. However, even if sufficient on-chip resources exist to allow more CTAs per core, if a compute kernel is memory-intensive, completely filling up all CTA slots may reduce performance by increasing contention in the interconnection network and DRAM controllers. We issue CTAs in a breadth-first manner across shader cores, selecting a shader core that has a minimum number of CTAs running on it, so as to spread the workload as evenly as possible among all cores.\n", "alignment": "left", "unique_id": "07ce77780fded1c69463bca7b0af534a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.2.2. CTA distribution. GPUs can use the abundance of parallelism in data-parallel applications to tolerate memory access latency by interleaving the execution of warps. These warps may either be from the same CTA or from different CTAs running on the same shader core. One advantage of running multiple smaller CTAs on a shader core rather than using a single larger CTA relates to the use of barrier synchronization points within a CTA [40]. Threads from one CTA can make progress while threads from another CTA are waiting at a barrier. For a given number of threads per CTA, allowing more CTAs to run on a shader core provides additional memory latency tolerance, though it may imply increasing register and shared memory resource use. However, even if sufficient on-chip resources exist to allow more CTAs per core, if a compute kernel is memory-intensive, completely filling up all CTA slots may reduce performance by increasing contention in the interconnection network and DRAM controllers. We issue CTAs in a breadth-first manner across shader cores, selecting a shader core that has a minimum number of CTAs running on it, so as to spread the workload as evenly as possible among all cores."}], "lineHeight": 0}}, "target": {"markdown": "GPU 可以利用数据并行应用中丰富的并行性，通过交错执行 warp 来容忍存储访问延迟。这些 warp 可能来自同一个 CTA，也可能来自运行在同一着色器核心上的不同 CTA。在着色器核心上运行多个较小的 CTA 而不是使用单一较大的 CTA，其优点之一与 CTA 内屏障同步点的使用有关 [40]。当某个 CTA 中的线程在屏障处等待时，另一 CTA 中的线程可以继续推进。对于给定的每个 CTA 线程数，允许更多 CTA 在一个着色器核心上运行可以提供更强的存储延迟容忍能力，尽管这可能意味着寄存器和共享内存资源使用量的增加。然而，即使片上资源充足到允许每个核心承载更多 CTA，如果计算内核属于存储密集型，那么将所有 CTA 槽位全部填满反而会由于互联网络和 DRAM 控制器上的争用增加而导致性能下降。我们在着色器核心之间以广度优先的方式发放 CTA，选择当前正在运行的 CTA 数量最少的着色器核心，从而使负载尽可能均匀地分散到所有核心上。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "c1711898ff1e5f26a2b6145733d0cd68", "index": 45, "aliyun_index": 13, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "**2.2.3. Memory Access Coalescing.** The minimum granularity access for GDDR3 memory is 16 bytes and typically scalar threads in CUDA applications access 4 bytes per scalar thread [19]. To improve memory system efficiency, it thus makes sense to group accesses from multiple, concurrently-issued, scalar threads into a single access to a small, contiguous memory region. The CUDA programming guide indicates that parallel memory accesses from every half-warp of 16  \n\n", "text": "**2.2.3. Memory Access Coalescing.** The minimum granularity access for GDDR3 memory is 16 bytes and typically scalar threads in CUDA applications access 4 bytes per scalar thread [19]. To improve memory system efficiency, it thus makes sense to group accesses from multiple, concurrently-issued, scalar threads into a single access to a small, contiguous memory region. The CUDA programming guide indicates that parallel memory accesses from every half-warp of 16\n", "alignment": "left", "unique_id": "c1711898ff1e5f26a2b6145733d0cd68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**2.2.3. Memory Access Coalescing.** The minimum granularity access for GDDR3 memory is 16 bytes and typically scalar threads in CUDA applications access 4 bytes per scalar thread [19]. To improve memory system efficiency, it thus makes sense to group accesses from multiple, concurrently-issued, scalar threads into a single access to a small, contiguous memory region. The CUDA programming guide indicates that parallel memory accesses from every half-warp of 16"}], "lineHeight": 0}}, "target": {"markdown": "**2.2.3. 存储访问合并。** GDDR3 存储的最小访问粒度为 16 字节，而 CUDA 应用中的标量线程通常每次访问 4 字节 [19]。因此，为了提高存储系统效率，将来自多个并行发射的标量线程的访问合并为对一小块连续存储区域的单次访问是合理的。CUDA 编程指南指出，来自每个由 16 个线程组成的半 warp 的并行存储访问", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "8c9ce5cfa357288e3862875536872d9c", "index": 46, "aliyun_index": 0, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![8c9ce5cfa357288e3862875536872d9c.jpeg](figures/8c9ce5cfa357288e3862875536872d9c_4516c575.png)  \n\n", "text": "Application\n── Source code (.cpp)   → C/C++ 主机代码\n└── Source code (.cu)    → CUDA 设备代码\n\nSource code (.cu)\n        ↓\ncudafe + nvopencc          ← NVIDIA 编译器前端\n        ↙       ↘\nHost C code     .ptx       ← PTX 中间表示（并行线程执行）\n\n.ptx\n  ↓\nptxas                  ← PTX 汇编器（NVIDIA 工具）\n  ↓\ncubin.bin              ← GPU 可执行二进制（设备端）\n\nSource code (.cpp) ───────────────→\nHost C code (from .cu) ────────────→\nlibcuda.a ─────────────────────────→\ncubin.bin ─────────────────────────→\n                          ↓\n                   C/C++ compiler      ← 链接所有目标文件\n                          ↓\n                     Executable        ← 最终可执行程序\n
