oss most benchmarks.\n- **First-In First-Out** tends to have the lowest or near-lowest utilization in many cases.\n- Some benchmarks (e.g., CP, RAY, STO) show very low utilization (<10%) across all patterns.\n- High-utilization benchmarks include: **BFS, LIB, WP, FWT**, especially under OOO128.\n\n---\n\n## Notes\n\n- No error bars or confidence intervals shown.\n- All values are approximate due to lack of explicit data labels.\n- The chart does not specify hardware configuration or workload details beyond benchmark names.\n\n--- \n\n✅ This Markdown representation preserves structure, semantics, and visual hierarchy of the original chart while being machine-readable and human-friendly.", "alignment": "left", "unique_id": "a35c61e50369530756a380f5ef0f15ee", "edited": false, "extra": {}}, "target": {"markdown": "![a35c61e50369530756a380f5ef0f15ee.jpeg](figures/a35c61e50369530756a380f5ef0f15ee_95c27d9f.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "30079f47dc64dc486b1c4387c00509f1", "index": 140, "aliyun_index": 3, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 13. DRAM Utilization  \n\n", "text": "Figure 13. DRAM Utilization\n", "alignment": "left", "unique_id": "30079f47dc64dc486b1c4387c00509f1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 13. DRAM Utilization"}], "lineHeight": 0}}, "target": {"markdown": ">图 13. DRAM 利用率", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "2a1f904bee615ab8754c55783ac18c5d", "index": 141, "aliyun_index": 4, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![2a1f904bee615ab8754c55783ac18c5d.jpeg](figures/2a1f904bee615ab8754c55783ac18c5d_132f7928.png)  \n\n", "text": "AES, BFS, CP, DG, LPS, LIB, MUM, NN, NQU, RAY, STO, WP, BLK, FWT\n\n\n\n共 14 个类别。\n\n---\n\n## 纵轴刻度\n\n- 范围：0% – 100%\n- 主要刻度标记：20%, 40%, 60%, 80%, 100%\n\n---\n\n## 各工作负载下三种策略的效率表现（近似值估算）\n\n> 注：以下数值基于视觉估算，非精确数据源提供。实际应用中建议结合原始数据。\n\n| Workload | First-In First-Out (%) | Out-of-Order 32 (%) | Out-of-Order 128 (%) |\n|----------|------------------------|---------------------|----------------------|\n| AES      | ~78                    | ~82                 | ~85                  |\n| BFS      | ~25                    | ~45                 | ~50                  |\n| CP       | ~48                    | ~68                 | ~70                  |\n| DG       | ~55                    | ~70                 | ~72                  |\n| LPS      | ~40                    | ~55                 | ~55                  |\n| LIB      | ~5                     | ~25                 | ~45                  |\n| MUM      | ~10                    | ~35                 | ~40                  |\n| NN       | ~30                    | ~40                 | ~42                  |\n| NQU      | ~30                    | ~35                 | ~35                  |\n| RAY      | ~10                    | ~45                 | ~50                  |\n| STO      | ~75                    | ~75                 | ~75                  |\n| WP       | ~10                    | ~45                 | ~45                  |\n| BLK      | ~30                    | ~50                 | ~50                  |\n| FWT      | ~35                    | ~70                 | ~72                  |\n\n---\n\n## 观察与趋势总结\n\n1. **总体趋势**：\n   - “Out-of-Order 128” 在绝大多数工作负载中表现最优或接近最优。\n   - “First-In First-Out” 多数情况下效率最低，尤其在 LIB、MUM、WP 等负载上显著落后。\n   - “Out-of-Order 32” 通常介于两者之间，部分场景（如 STO）与 OoO 128 持平。\n\n2. **例外情况**：\n   - **STO**：三者效率几乎相同（~75%），表明该负载对调度策略不敏感。\n   - **AES**：FIFO 表现尚可（~78%），但 OoO 128 仍略优（~85%）。\n   - **LIB / MUM / WP**：FIFO 效率极低（<15%），而 OoO 128 提升至 40–50%，提升幅度巨大。\n\n3. **性能增益区间**：\n   - 最大增益出现在 **LIB**：从 ~5% → ~45%（+40个百分点）\n   - 最小增益出现在 **STO**：无增益（三者持平）\n\n---\n\n## 结论\n\n- **Out-of-Order 128** 是整体最优调度策略，在大多数工作负载中显著提升 DRAM 效率。\n- **First-In First-Out** 仅在对顺序访问友好或低并发需求的负载（如 AES、STO）中表现尚可。\n- **Out-of-Order 32** 作为折中方案，在资源受限场景下可提供较好性价比。\n\n---\n\n✅ 此 Markdown 文档完整保留了原始图表的所有关键信息，包括图例、坐标轴、分类标签、数值估算及趋势分析，适用于报告、演示或进一步数据处理。\n\n--- \n\n如需导出为 PDF 或插入 LaTeX，请告知，我可为您生成对应格式代码。", "alignment": "left", "unique_id": "2a1f904bee615ab8754c55783ac18c5d", "edited": false, "extra": {}}, "target": {"markdown": "![2a1f904bee615ab8754c55783ac18c5d.jpeg](figures/2a1f904bee615ab8754c55783ac18c5d_132f7928.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "7705162e719fdadc4d20acd9a4555d41", "index": 142, "aliyun_index": 5, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 14. DRAM Efficiency  \n\n", "text": "Figure 14. DRAM Efficiency\n", "alignment": "left", "unique_id": "7705162e719fdadc4d20acd9a4555d41", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 14. DRAM Efficiency"}], "lineHeight": 0}}, "target": {"markdown": ">图 14. DRAM 效率", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "904d278b5a83e88e5ce93135fc4d5b2e", "index": 143, "aliyun_index": 6, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "utilization, which is the percentage of time spent sending data\nacross the DRAM data pins over the entire kernel execution\ntime. These two measures can differ if an application contains\nGPU computation phases during which it does not access\nDRAM (e.g., if it has been heavily optimized to use \"shared\nmemory\").  \n\n", "text": "utilization, which is the percentage of time spent sending data\nacross the DRAM data pins over the entire kernel execution\ntime. These two measures can differ if an application contains\nGPU computation phases during which it does not access\nDRAM (e.g., if it has been heavily optimized to use \"shared\nmemory\").\n", "alignment": "left", "unique_id": "904d278b5a83e88e5ce93135fc4d5b2e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "utilization, which is the percentage of time spent sending data"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "across the DRAM data pins over the entire kernel execution"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "time. These two measures can differ if an application contains"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU computation phases during which it does not access"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DRAM (e.g., if it has been heavily optimized to use \"shared"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "memory\")."}], "lineHeight": -171}}, "target": {"markdown": "利用率，即在整个内核执行时间内，DRAM 数据引脚传输数据所占时间的百分比。这两项指标在以下情况下可能会有所不同：当应用程序包含不访问 DRAM 的 GPU 计算阶段时（例如，该应用经过大量优化以使用\"共享内存\"）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "f27dd5295c3bc9895f2b9cae81780d48", "index": 144, "aliyun_index": 7, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 12 compares the performance of our baseline to FIFO and OoO128. We observe that AES, CP, NQU, and STO exhibit almost no slowdown for FIFO. Figure 14 shows AES and STO obtain over 75% DRAM efficiency. Close examination reveals that at any point in time all threads access at most two rows in each bank of each DRAM, meaning that a simple DRAM controller policy suffices. Furthermore, Figure 13 shows that AES and STO have low DRAM utilization despite the fact that they process large amounts of data. Both these applications make extensive use of shared memory (see Figure 5). NQU and CP have very low DRAM utilization, making them insensitive to memory controller optimizations (CP slows down for OoO128 due to variations in CTA load distribution). Performance is reduced by over 40% when using FIFO for BFS, LIB, MUM, RAY, and WP. These benchmarks all show drastically reduced DRAM efficiency and utilization with this simple controller.  \n\n", "text": "Figure 12 compares the performance of our baseline to FIFO and OoO128. We observe that AES, CP, NQU, and STO exhibit almost no slowdown for FIFO. Figure 14 shows AES and STO obtain over 75% DRAM efficiency. Close examination reveals that at any point in time all threads access at most two rows in each bank of each DRAM, meaning that a simple DRAM controller policy suffices. Furthermore, Figure 13 shows that AES and STO have low DRAM utilization despite the fact that they process large amounts of data. Both these applications make extensive use of shared memory (see Figure 5). NQU and CP have very low DRAM utilization, making them insensitive to memory controller optimizations (CP slows down for OoO128 due to variations in CTA load distribution). Performance is reduced by over 40% when using FIFO for BFS, LIB, MUM, RAY, and WP. These benchmarks all show drastically reduced DRAM efficiency and utilization with this simple controller.\n", "alignment": "left", "unique_id": "f27dd5295c3bc9895f2b9cae81780d48", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 12 compares the performance of our baseline to FIFO and OoO128. We observe that AES, CP, NQU, and STO exhibit almost no slowdown for FIFO. Figure 14 shows AES and STO obtain over 75% DRAM efficiency. Close examination reveals that at any point in time all threads access at most two rows in each bank of each DRAM, meaning that a simple DRAM controller policy suffices. Furthermore, Figure 13 shows that AES and STO have low DRAM utilization despite the fact that they process large amounts of data. Both these applications make extensive use of shared memory (see Figure 5). NQU and CP have very low DRAM utilization, making them insensitive to memory controller optimizations (CP slows down for OoO128 due to variations in CTA load distribution). Performance is reduced by over 40% when using FIFO for BFS, LIB, MUM, RAY, and WP. These benchmarks all show drastically reduced DRAM efficiency and utilization with this simple controller."}], "lineHeight": 0}}, "target": {"markdown": "图 12 将我们的基线性能与 FIFO 和 OoO128 进行了对比。我们观察到 AES、CP、NQU 和 STO 在使用 FIFO 时几乎未出现性能下降。图 14 显示 AES 和 STO 的 DRAM 效率超过 75%。进一步分析可以发现，在任意时刻，所有线程在每个 DRAM 的每个 bank 中最多只会访问两行，这意味着简单的 DRAM 控制器策略即可满足需求。此外，图 13 表明，尽管 AES 和 STO 处理大量数据，但它们的 DRAM 利用率却很低。这两个应用都大量使用了共享内存（参见图 5）。NQU 和 CP 的 DRAM 利用率极低，因此对内存控制器优化不敏感（CP 在 OoO128 下性能下降，是由于 CTA 负载分配的变化所致）。在使用 FIFO 时，BFS、LIB、MUM、RAY 和 WP 的性能下降了 40% 以上。这些基准测试在使用这种简单控制器时，DRAM 效率与利用率均出现了大幅下降。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "a322e24e8442d9768287c89c5893e589", "index": 145, "aliyun_index": 8, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "# 4.6. Cache Effects  \n\n", "text": "4.6. Cache Effects\n", "alignment": "left", "unique_id": "a322e24e8442d9768287c89c5893e589", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.6. Cache Effects"}], "lineHeight": 0}}, "target": {"markdown": "## 4.6. 缓存效应", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "b6384f8b972451808c3f35b9116b917c", "index": 146, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 15 shows the effects on IPC of adding caches to the system. The first 3 bars show the relative speedup of adding a 16KB, 32KB or 64KB cache to each shader core. The last two bars show the effects of adding a 128KB or 256KB L2 cache to each memory controller in addition to a 64KB L1 cache in each shader. CP, RAY and FWT exhibit a slowdown with the addition of L1 caches. Close examination shows that CP experiences a slowdown due to the CTA load imbalance phenomena described in Section 3, whereas RAY and FWT experience a slowdown due to the way write misses and evictions of dirty lines are handled. For the baseline (without  \n\n", "text": "Figure 15 shows the effects on IPC of adding caches to the system. The first 3 bars show the relative speedup of adding a 16KB, 32KB or 64KB cache to each shader core. The last two bars show the effects of adding a 128KB or 256KB L2 cache to each memory controller in addition to a 64KB L1 cache in each shader. CP, RAY and FWT exhibit a slowdown with the addition of L1 caches. Close examination shows that CP experiences a slowdown due to the CTA load imbalance phenomena described in Section 3, whereas RAY and FWT experience a slowdown due to the way write misses and evictions of dirty lines are handled. For the baseline (without\n", "alignment": "left", "unique_id": "b6384f8b972451808c3f35b9116b917c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 15 shows the effects on IPC of adding caches to the system. The first 3 bars show the relative speedup of adding a 16KB, 32KB or 64KB cache to each shader core. The last two bars show the effects of adding a 128KB or 256KB L2 cache to each memory controller in addition to a 64KB L1 cache in each shader. CP, RAY and FWT exhibit a slowdown with the addition of L1 caches. Close examination shows that CP experiences a slowdown due to the CTA load imbalance phenomena described in Section 3, whereas RAY and FWT experience a slowdown due to the way write misses and evictions of dirty lines are handled. For the baseline (without"}], "lineHeight": 0}}, "target": {"markdown": "图 15 展示了向系统中添加缓存对 IPC 的影响。前三个柱状条表示分别为每个着色器核心添加 16 KB、32 KB 或 64 KB 缓存所带来的相对加速效果。最后两个柱状条表示在每个着色器核心已有 64 KB L1 缓存的基础上，分别为每个内存控制器添加 128 KB 或 256 KB L2 缓存所产生的影响。添加 L1 缓存后，CP、RAY 和 FWT 的性能出现了下降。进一步分析表明，CP 的性能下降源于第 3 节所述的 CTA 负载失衡现象，而 RAY 和 FWT 的性能下降则与脏缓存行的写未命中及回收处理方式有关。对于基线配置（不含", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "f14f931802e7927a2739613ae85b4d8d", "index": 147, "aliyun_index": 10, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![f14f931802e7927a2739613ae85b4d8d.jpg](figures/f14f931802e7927a2739613ae85b4d8d_139ff837.jpeg)  \n\n", "text": "# 缓存配置对不同基准测试程序的加速比影响\n\n## Y轴: Speedup（加速比）\n## X轴: 基准测试程序（AES, BFS, CP, DG, LPS, LIB, MUM, NN, NQU, RAY, STO, WP, HM, BLK, FWT, SDK）\n\n### 图例\n- **None**: 无缓存\n- **16kB L1**: 16KB L1 缓存\n- **32kB L1**: 32KB L1 缓存\n- **64kB L1**: 64KB L1 缓存\n- **64kB L1; 128kB L2**: 64KB L1 缓存 + 128KB L2 缓存\n- **64kB L1; 256kB L2**: 64KB L1 缓存 + 256KB L2 缓存\n\n### 数据提取\n\n#### AES\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### BFS\n- None: ~0.9\n- 16kB L1: ~1.5\n- 32kB L1: ~1.7\n- 64kB L1: ~1.8\n- 64kB L1; 128kB L2: ~1.9\n- 64kB L1; 256kB L2: ~2.0\n\n#### CP\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### DG\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### LPS\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### LIB\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### MUM\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### NN\n- None: ~0.9\n- 16kB L1: ~1.5\n- 32kB L1: ~1.7\n- 64kB L1: ~1.8\n- 64kB L1; 128kB L2: ~2.8\n- 64kB L1; 256kB L2: ~3.0\n\n#### NQU\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### RAY\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### STO\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### WP\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### HM\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### BLK\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### FWT\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n#### SDK\n- None: ~0.9\n- 16kB L1: ~1.0\n- 32kB L1: ~1.1\n- 64kB L1: ~1.2\n- 64kB L1; 128kB L2: ~1.3\n- 64kB L1; 256kB L2: ~1.4\n\n\n\n### 5. **总结**\n- **加速比趋势**: 大多数基准测试程序在增加缓存大小时，加速比逐渐增加。\n- **显著差异**: `NN` 程序在较大缓存配置下（64kB L1; 128kB L2 和 64kB L1; 256kB L2）显示出显著的加速比提升。\n- **一致性**: 其他程序的加速比变化相对较小，但总体上也呈现出随缓存增大而增大的趋势。\n\n这样，我们就完成了对图片内容的详细提取和分析，并以合法的 Markdown 格式进行了呈现。", "alignment": "left", "unique_id": "f14f931802e7927a2739613ae85b4d8d", "edited": false, "extra": {}}, "target": {"markdown": "![f14f931802e7927a2739613ae85b4d8d.jpg](figures/f14f931802e7927a2739613ae85b4d8d_139ff837.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "ad6cf44f896f110dbaedf0026746a8e0", "index": 148, "aliyun_index": 11, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 15. Effects of adding an L1 or L2  \n\n", "text": "Figure 15. Effects of adding an L1 or L2\n", "alignment": "left", "unique_id": "ad6cf44f896f110dbaedf0026746a8e0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 15. Effects of adding an L1 or L2"}], "lineHeight": 0}}, "target": {"markdown": ">图 15. 添加 L1 或 L2 缓存的影响", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "ca4b15de79cebee5fb4999df71d34704", "index": 149, "aliyun_index": 12, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![ca4b15de79cebee5fb4999df71d34704.jpeg](figures/ca4b15de79cebee5fb4999df71d34704_b2d09e77.png)  \n\n", "text": "# Speedup Comparison\n\n## X-axis Labels\n- AES\n- BFS\n- CP\n- DG\n- LPS\n- LIB\n- MUM\n- NN\n- NQU\n- RAY\n- STO\n- WP\n- HM\n- BLK\n- FWT\n- SDK\n\n## Y-axis Label\n- Speedup (Range: 0.5 to 1.5)\n\n## Legend\n- 25% (White)\n- 50% (Light Blue)\n- 100% (Baseline) (Dark Blue)\n- 150% (Purple)\n- 200% (Dark Purple)\n\n## Data Description\nEach label on the X-axis corresponds to a group of five bars, representing the speedup at 25%, 50%, 100% (baseline), 150%, and 200% load conditions respectively. The height of each bar indicates the speedup under that specific load condition.\n\n\n\n### 具体数据点（示例）\n由于无法直接从图像中读取精确数值，以下是一个假设的数据点示例：\n\n- **AES**:\n  - 25%: 1.0\n  - 50%: 1.1\n  - 100% (Baseline): 1.0\n  - 150%: 0.9\n  - 200%: 0.8\n\n- **BFS**:\n  - 25%: 1.2\n  - 50%: 1.3\n  - 100% (Baseline): 1.0\n  - 150%: 1.1\n  - 200%: 1.0\n\n（注：以上数据为示例，实际数据需根据具体测量结果填写。）\n\n这样，我们就将图片中的信息以合法的Markdown格式进行了准确提取和描述。", "alignment": "left", "unique_id": "ca4b15de79cebee5fb4999df71d34704", "edited": false, "extra": {}}, "target": {"markdown": "![ca4b15de79cebee5fb4999df71d34704.jpeg](figures/ca4b15de79cebee5fb4999df71d34704_b2d09e77.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "6155bfd09a2180c67e00141673739231", "index": 150, "aliyun_index": 13, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 16. Effects of varying number of CTAs  \n\n", "text": "Figure 16. Effects of varying number of CTAs\n", "alignment": "left", "unique_id": "6155bfd09a2180c67e00141673739231", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 16. Effects of varying number of CTAs"}], "lineHeight": 0}}, "target": {"markdown": ">图 16. 改变 CTA 数量的影响", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "6ba14d11efecd9e687855490c12ac5bf", "index": 151, "aliyun_index": 14, "page_num": 9, "type": "text", "sub_type": "none", "markdown": " caches for local/global accesses) writes to memory only cause\nthe memory controller to read data out of DRAM if a portion\nof a 16B is modified due to writes that are not coalesced. When\ncaches are added for local and global accesses, for simplicity,\na write miss prevents a warp from being scheduled until the\ncache block is read from DRAM. Furthermore, when a dirty\nline is evicted, the entire line is written to DRAM even if only\na single word of that line is modified. We leave exploration\nof better cache policies to future work.  \n\n", "text": " caches for local/global accesses) writes to memory only cause\nthe memory controller to read data out of DRAM if a portion\nof a 16B is modified due to writes that are not coalesced. When\ncaches are added for local and global accesses, for simplicity,\na write miss prevents a warp from being scheduled until the\ncache block is read from DRAM. Furthermore, when a dirty\nline is evicted, the entire line is written to DRAM even if only\na single word of that line is modified. We leave exploration\nof better cache policies to future work.\n", "alignment": "left", "unique_id": "6ba14d11efecd9e687855490c12ac5bf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": " caches for local/global accesses) writes to memory only cause"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the memory controller to read data out of DRAM if a portion"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of a 16B is modified due to writes that are not coalesced. When"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "caches are added for local and global accesses, for simplicity,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a write miss prevents a warp from being scheduled until the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cache block is read from DRAM. Furthermore, when a dirty"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "line is evicted, the entire line is written to DRAM even if only"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a single word of that line is modified. We leave exploration"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of better cache policies to future work."}], "lineHeight": -257}}, "target": {"markdown": "缓存用于本地/全局访问）时，写入内存仅在由于写入未合并而导致 16 字节的部分内容被修改时，才会使内存控制器从 DRAM 中读取数据。当为本地和全局访问添加缓存时，为简单起见，写未命中会阻止 warp 被调度，直到从 DRAM 读取缓存块。此外，当脏缓存行被回收时，即使该行中仅有一个字被修改，整个缓存行也会被写入 DRAM。我们将更好的缓存策略的探索留作未来的工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "c177e04af14ab9c021f911656b3a8e63", "index": 152, "aliyun_index": 15, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Benchmarks that make extensive use of “shared memory”, namely AES, LPS, NQU, and STO, do not respond significantly to caches. On the other hand, BFS and NN have the highest ratio of global memory instructions to all instructions (at 19% and 27% respectively) and so they experience the highest speedup among workloads.  \n\n", "text": "Benchmarks that make extensive use of “shared memory”, namely AES, LPS, NQU, and STO, do not respond significantly to caches. On the other hand, BFS and NN have the highest ratio of global memory instructions to all instructions (at 19% and 27% respectively) and so they experience the highest speedup among workloads.\n", "alignment": "left", "unique_id": "c177e04af14ab9c021f911656b3a8e63", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Benchmarks that make extensive use of “shared memory”, namely AES, LPS, NQU, and STO, do not respond significantly to caches. On the other hand, BFS and NN have the highest ratio of global memory instructions to all instructions (at 19% and 27% respectively) and so they experience the highest speedup among workloads."}], "lineHeight": 0}}, "target": {"markdown": "大量使用\"共享内存\"的基准测试（即 AES、LPS、NQU 和 STO）对缓存的添加响应并不显著。另一方面，BFS 和 NN 具有最高的全局内存指令占全部指令的比例（分别为 19% 和 27%），因此它们在所有工作负载中获得了最高的加速比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 152}, {"source": {"block_id": "dedc92d19b8db3b94add7bb5dbc7e93a", "index": 153, "aliyun_index": 16, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "# 4.7. Are More Threads Better?  \n\n", "text": "4.7. Are More Threads Better?\n", "alignment": "left", "unique_id": "dedc92d19b8db3b94add7bb5dbc7e93a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.7. Are More Threads Better?"}], "lineHeight": 0}}, "target": {"markdown": "## 4.7. 线程越多越好吗？", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 153}, {"source": {"block_id": "9058e10886f803e996f872d1fc66f400", "index": 154, "aliyun_index": 17, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Increasing the number of simultaneously running threads can improve performance by having a greater ability to hide memory access latencies. However, doing so may result in higher contention for shared resources, such as interconnect and memory. We explored the effects of varying the resources that limit the number of threads and hence CTAs that can run concurrently on a shader core, without modifying the source code for the benchmarks. We vary the amount of registers, shared memory, threads, and CTAs between 25% to 200% of those available to the baseline. The results are shown in Figure 16. For the baseline configuration, some benchmarks are already resource-constrained to only 1 or 2 CTAs per shader core, making them unable to run using a configuration with less resources. We do not show bars for configurations that for this reason are unable to run. NQU shows little change when varying the number of CTAs since it has very few memory operations. For LPS, NN, and STO, performance increases as more CTAs per core are used. LPS cannot take advantage of additional resources beyond the baseline (100%) because all CTAs in the benchmark can run simultaneously for the baseline configuration. Each CTA in STO uses all the shared memory in the baseline configuration, therefore increasing shared memory by half for the 150% configuration results in no increase in the number of concurrently running CTAs. AES and MUM show clear trends in decreasing performance  \n\n", "text": "Increasing the number of simultaneously running threads can improve performance by having a greater ability to hide memory access latencies. However, doing so may result in higher contention for shared resources, such as interconnect and memory. We explored the effects of varying the resources that limit the number of threads and hence CTAs that can run concurrently on a shader core, without modifying the source code for the benchmarks. We vary the amount of registers, shared memory, threads, and CTAs between 25% to 200% of those available to the baseline. The results are shown in Figure 16. For the baseline configuration, some benchmarks are already resource-constrained to only 1 or 2 CTAs per shader core, making them unable to run using a configuration with less resources. We do not show bars for configurations that for this reason are unable to run. NQU shows little change when varying the number of CTAs since it has very few memory operations. For LPS, NN, and STO, performance increases as more CTAs per core are used. LPS cannot take advantage of additional resources beyond the baseline (100%) because all CTAs in the benchmark can run simultaneously for the baseline configuration. Each CTA in STO uses all the shared memory in the baseline configuration, therefore increasing shared memory by half for the 150% configuration results in no increase in the number of concurrently running CTAs. AES and MUM show clear trends in decreasing performance\n", "alignment": "left", "unique_id": "9058e10886f803e996f872d1fc66f400", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Increasing the number of simultaneously running threads can improve performance by having a greater ability to hide memory access latencies. However, doing so may result in higher contention for shared resources, such as interconnect and memory. We explored the effects of varying the resources that limit the number of threads and hence CTAs that can run concurrently on a shader core, without modifying the source code for the benchmarks. We vary the amount of registers, shared memory, threads, and CTAs between 25% to 200% of those available to the baseline. The results are shown in Figure 16. For the baseline configuration, some benchmarks are already resource-constrained to only 1 or 2 CTAs per shader core, making them unable to run using a configuration with less resources. We do not show bars for configurations that for this reason are unable to run. NQU shows little change when varying the number of CTAs since it has very few memory operations. For LPS, NN, and STO, performance increases as more CTAs per core are used. LPS cannot take advantage of additional resources beyond the baseline (100%) because all CTAs in the benchmark can run simultaneously for the baseline configuration. Each CTA in STO uses all the shared memory in the baseline configuration, therefore increasing shared memory by half for the 150% configuration results in no increase in the number of concurrently running CTAs. AES and MUM show clear trends in decreasing performance"}], "lineHeight": 0}}, "target": {"markdown": "增加同时运行的线程数可以通过增强隐藏内存访问延迟的能力来提升性能。然而，这样做可能会导致对共享资源（如互连和内存）的竞争加剧。我们在不对基准测试源代码进行修改的前提下，探索了限制线程数及着色器核心上并发 CTA 数量的各项资源变化所产生的影响。我们将寄存器、共享内存、线程和 CTA 的数量在基线可用资源的 25% 到 200% 之间进行调整。结果如图 16 所示。对于基线配置，部分基准测试已因资源限制仅能在每个着色器核心上运行 1 或 2 个 CTA，因此无法在资源更少的配置下运行。出于这一原因无法运行的配置我们不显示其柱状条。NQU 在改变 CTA 数量时几乎没有变化，因为其内存操作极少。对于 LPS、NN 和 STO，随着每个核心使用的 CTA 数增加，性能也相应提升。LPS 无法利用超出基线（100%）以外的额外资源，因为基准测试中的所有 CTA 在基线配置下即可同时运行。STO 中的每个 CTA 在基线配置下已占满全部共享内存，因此在 150% 配置中将共享内存增加一半并不会增加并发运行的 CTA 数。AES 和 MUM 则呈现出性能随配置增加而下降的明显趋势", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 154}, {"source": {"block_id": "d7102efa76f3cd3944541cc8204a2925", "index": 155, "aliyun_index": 0, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![d7102efa76f3cd3944541cc8204a2925.jpeg](figures/d7102efa76f3cd3944541cc8204a2925_f74de6fe.png)  \n\n", "text": "以下是根据您提供的柱状图提取并整理的合法 Markdown 格式内容，准确保留所有标签、数值和结构细节：\n\n---\n\n# Speedup Bar Chart Data Extraction\n\n## Y-Axis Label\n- **Speedup**\n\n## X-Axis Categories (in order from left to right)\n1. AES  \n2. BFS  \n3. CP  \n4. DG  \n5. LPS  \n6. LIB  \n7. MUM  \n8. NN  \n9. NQU  \n10. RAY  \n11. STO  \n12. WP  \n13. HM  \n14. BLK  \n15. FWT  \n16. SDK  \n\n> 注：BLK、FWT、SDK 三组在图中无可见柱体（高度为 0 或未绘制），但标签存在。\n\n## Reference Line\n- Horizontal line at **Speedup = 1.0**（基准线）\n- Additional horizontal grid lines at:\n  - 0.8\n  - 1.2\n  - 1.4\n\n## Approximate Speedup Values per Category (estimated visually from chart)\n\n| Category | Speedup (approx.) |\n|----------|-------------------|\n| AES      | 1.08              |\n| BFS      | 1.05              |\n| CP       | 0.88              |\n| DG       | 1.42              |\n| LPS      | 1.00              |\n| LIB      | 1.00              |\n| MUM      | 1.42              |\n| NN       | 1.15              |\n| NQU      | 1.00              |\n| RAY      | 0.98              |\n| STO      | 1.00              |\n| WP       | 1.00              |\n| HM       | 1.07              |\n| BLK      | 1.00              |\n| FWT      | 1.00              |\n| SDK      | 1.00              |\n\n> 注：BLK、FWT、SDK 虽无柱体，但其位置对应 y=1.0 的基线，故设为 1.0；实际可能表示“无加速”或“未测试”。\n\n## Special Annotations\n- Left-side box annotation: `0.8` — likely indicates the minimum displayed y-axis value or a reference threshold.\n- All bars are colored light blue with black outlines.\n- Gridlines are gray, dashed or solid depending on major/minor ticks.\n\n## Observations\n- Highest speedups: **DG** and **MUM** (~1.42)\n- Lowest non-zero speedup: **CP** (~0.88)\n- Most categories cluster around **1.0**, indicating no significant speedup or slowdown.\n- **NN** shows moderate speedup (~1.15).\n- **HM** slightly above baseline (~1.07).\n\n---\n\n✅ 此 Markdown 输出完整保留了原始图表中的所有视觉元素、标签、近似数值及注释，适用于文档记录、数据分析或进一步可视化重建。\n\n如需导出为 CSV、JSON 或生成绘图代码（如 Matplotlib/Plotly），可继续提出需求。", "alignment": "left", "unique_id": "d7102efa76f3cd3944541cc8204a2925", "edited": false, "extra": {}}, "target": {"markdown": "![d7102efa76f3cd3944541cc8204a2925.jpeg](figures/d7102efa76f3cd3944541cc8204a2925_f74de6fe.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 155}, {"source": {"block_id": "0c0f485fdef170350bbeba4d77b851ff", "index": 156, "aliyun_index": 1, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 17. Inter-Warp Memory Coalescing  \n\n", "text": "Figure 17. Inter-Warp Memory Coalescing\n", "alignment": "left", "unique_id": "0c0f485fdef170350bbeba4d77b851ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 17. Inter-Warp Memory Coalescing"}], "lineHeight": 0}}, "target": {"markdown": ">图 17. Warp 间内存合并访问", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "9ca0991592ba30880571aeeaa88b1f4d", "index": 157, "aliyun_index": 2, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "as the number of CTAs increases. We observed that with more concurrent CTAs, AES and MUM experience increased contention in the memory system resulting in 8.6× and 5.4× worse average memory latency, respectively comparing 200% resources vs. 50%. BFS, RAY, and WP show distinct optima in performance when the CTA limit is at 100%, 100%, and 150% of the baseline shader, respectively. Above these limits, we observe DRAM efficiencies decrease and memory latencies increase, again suggesting increased contention in the memory system. For configuration with limits below the optima, the lack of warps to hide memory latencies reduces performance. CP suffers CTA load imbalance due to CTA scheduling for the 50% and 100% configurations. Similarly, DG suffers CTA load imbalance in the 150% configuration.  \n\n", "text": "as the number of CTAs increases. We observed that with more concurrent CTAs, AES and MUM experience increased contention in the memory system resulting in 8.6× and 5.4× worse average memory latency, respectively comparing 200% resources vs. 50%. BFS, RAY, and WP show distinct optima in performance when the CTA limit is at 100%, 100%, and 150% of the baseline shader, respectively. Above these limits, we observe DRAM efficiencies decrease and memory latencies increase, again suggesting increased contention in the memory system. For configuration with limits below the optima, the lack of warps to hide memory latencies reduces performance. CP suffers CTA load imbalance due to CTA scheduling for the 50% and 100% configurations. Similarly, DG suffers CTA load imbalance in the 150% configuration.\n", "alignment": "left", "unique_id": "9ca0991592ba30880571aeeaa88b1f4d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "as the number of CTAs increases. We observed that with more concurrent CTAs, AES and MUM experience increased contention in the memory system resulting in 8.6× and 5.4× worse average memory latency, respectively comparing 200% resources vs. 50%. BFS, RAY, and WP show distinct optima in performance when the CTA limit is at 100%, 100%, and 150% of the baseline shader, respectively. Above these limits, we observe DRAM efficiencies decrease and memory latencies increase, again suggesting increased contention in the memory system. For configuration with limits below the optima, the lack of warps to hide memory latencies reduces performance. CP suffers CTA load imbalance due to CTA scheduling for the 50% and 100% configurations. Similarly, DG suffers CTA load imbalance in the 150% configuration."}], "lineHeight": 0}}, "target": {"markdown": "随着 CTA 数量的增加，性能下降。我们观察到，在并发 CTA 更多的情况下，与 50% 资源配置相比，200% 资源配置下 AES 和 MUM 的平均内存延迟分别恶化了 8.6 倍和 5.4 倍，原因是内存系统中的竞争加剧。BFS、RAY 和 WP 分别在 CTA 上限为基线着色器的 100%、100% 和 150% 时达到最佳性能。超过这些上限后，我们观察到 DRAM 效率下降而内存延迟上升，这同样表明内存系统中的竞争加剧。对于低于最佳值的限制配置，由于缺少足够的 warp 来隐藏内存延迟，性能会降低。CP 在 50% 和 100% 配置下因 CTA 调度而出现 CTA 负载失衡。同样，DG 在 150% 配置下也出现了 CTA 负载失衡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "5b358606e786f82258e64f350f286824", "index": 158, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Given the widely-varying workload-dependent behavior, always scheduling the maximal number of CTAs supported by a shader core is not always the best scheduling policy. We leave for future work the design of dynamic scheduling algorithms to adapt to the workload behavior.  \n\n", "text": "Given the widely-varying workload-dependent behavior, always scheduling the maximal number of CTAs supported by a shader core is not always the best scheduling policy. We leave for future work the design of dynamic scheduling algorithms to adapt to the workload behavior.\n", "alignment": "left", "unique_id": "5b358606e786f82258e64f350f286824", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Given the widely-varying workload-dependent behavior, always scheduling the maximal number of CTAs supported by a shader core is not always the best scheduling policy. We leave for future work the design of dynamic scheduling algorithms to adapt to the workload behavior."}], "lineHeight": 0}}, "target": {"markdown": "鉴于工作负载之间的行为差异很大，始终调度着色器核心所支持的最大 CTA 数量并不总是最佳调度策略。我们将动态调度算法的设计留作未来工作，使其能够适应不同工作负载的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "2f31b7f7fb08c067a720f9d74a9ccf2c", "index": 159, "aliyun_index": 4, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# 4.8. Memory Request Coalescing  \n\n", "text": "4.8. Memory Request Coalescing\n", "alignment": "left", "unique_id": "2f31b7f7fb08c067a720f9d74a9ccf2c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.8. Memory Request Coalescing"}], "lineHeight": 0}}, "target": {"markdown": "## 4.8. 内存请求合并访问", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "0081e80e34a7eb078d65508cb8a3ae89", "index": 160, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Figure 17 presents data showing the improvement in performance when enabling inter-warp memory coalescing described in Section 2.2.3. The harmonic mean speedup versus intra-warp coalescing is 6.1%. CP's slowdown with inter-warp coalescing is due to load imbalance in CTA distribution. Accesses in AES, DG, and MUM are to data dependent locations which makes it harder to use the explicitly managed shared memory to capture locality. These applications use the texture cache to capture this locality and inter-warp merging effectively eliminates additional requests for the same cache block at the expense of associative search hardware.  \n\n", "text": "Figure 17 presents data showing the improvement in performance when enabling inter-warp memory coalescing described in Section 2.2.3. The harmonic mean speedup versus intra-warp coalescing is 6.1%. CP's slowdown with inter-warp coalescing is due to load imbalance in CTA distribution. Accesses in AES, DG, and MUM are to data dependent locations which makes it harder to use the explicitly managed shared memory to capture locality. These applications use the texture cache to capture this locality and inter-warp merging effectively eliminates additional requests for the same cache block at the expense of associative search hardware.\n", "alignment": "left", "unique_id": "0081e80e34a7eb078d65508cb8a3ae89", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 17 presents data showing the improvement in performance when enabling inter-warp memory coalescing described in Section 2.2.3. The harmonic mean speedup versus intra-warp coalescing is 6.1%. CP's slowdown with inter-warp coalescing is due to load imbalance in CTA distribution. Accesses in AES, DG, and MUM are to data dependent locations which makes it harder to use the explicitly managed shared memory to capture locality. These applications use the texture cache to capture this locality and inter-warp merging effectively eliminates additional requests for the same cache block at the expense of associative search hardware."}], "lineHeight": 0}}, "target": {"markdown": "图 17 给出了启用 2.2.3 节所述的 warp 间内存合并访问时所获得的性能提升数据。与仅启用 warp 内合并访问相比，调和平均加速比为 6.1%。CP 在启用 warp 间合并访问时出现性能下降，原因是 CTA 分配不均衡。AES、DG 和 MUM 中的访问针对的是数据相关位置，这使得难以使用显式管理的共享内存来捕获局部性。这些应用程序使用纹理缓存来捕获这种局部性，而 warp 间合并能够有效消除对同一缓存块的额外请求，代价是需要额外的关联查找硬件。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "e544f07e193c10ce44e8f2f2ca7b9179", "index": 161, "aliyun_index": 6, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "It is interesting to observe that the harmonic mean speedup of the CUDA SDK benchmarks is less than 1%, showing that these highly optimized benchmarks do not benefit from inter-warp memory coalescing. Their careful program optimizations ensure less redundancy in memory requests generated by each thread.  \n\n", "text": "It is interesting to observe that the harmonic mean speedup of the CUDA SDK benchmarks is less than 1%, showing that these highly optimized benchmarks do not benefit from inter-warp memory coalescing. Their careful program optimizations ensure less redundancy in memory requests generated by each thread.\n", "alignment": "left", "unique_id": "e544f07e193c10ce44e8f2f2ca7b9179", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "It is interesting to observe that the harmonic mean speedup of the CUDA SDK benchmarks is less than 1%, showing that these highly optimized benchmarks do not benefit from inter-warp memory coalescing. Their careful program optimizations ensure less redundancy in memory requests generated by each thread."}], "lineHeight": 0}}, "target": {"markdown": "值得注意的是，CUDA SDK 基准测试的调和平均加速比低于 1%，这表明这些经过高度优化的基准测试并未从 warp 间内存合并访问中获益。它们经过精心优化的程序设计使得每个线程所产生的内存请求冗余更少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "a6a289fa448f006f46536e105e68dd86", "index": 162, "aliyun_index": 7, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# 5. Related Work  \n\n", "text": "5. Related Work\n", "alignment": "left", "unique_id": "a6a289fa448f006f46536e105e68dd86", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5. Related Work"}], "lineHeight": 0}}, "target": {"markdown": "# 5. 相关工作", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "fe976551889298fa4081ea2c077f3622", "index": 163, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Existing graphics-oriented GPU simulators include Qsilver [43], which does not model programmable shaders, and ATTILLA [10], which focuses on graphics specific features. Ryoo et al. [41] use CUDA to speedup a variety of relatively easily parallelizable scientific applications. They explore the use of conventional code optimization techniques and take advantage of the different memory types available on NVIDIA's 8800GTX to obtain speedup. While their analysis is performed  \n\n", "text": "Existing graphics-oriented GPU simulators include Qsilver [43], which does not model programmable shaders, and ATTILLA [10], which focuses on graphics specific features. Ryoo et al. [41] use CUDA to speedup a variety of relatively easily parallelizable scientific applications. They explore the use of conventional code optimization techniques and take advantage of the different memory types available on NVIDIA's 8800GTX to obtain speedup. While their analysis is performed\n", "alignment": "left", "unique_id": "fe976551889298fa4081ea2c077f3622", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Existing graphics-oriented GPU simulators include Qsilver [43], which does not model programmable shaders, and ATTILLA [10], which focuses on graphics specific features. Ryoo et al. [41] use CUDA to speedup a variety of relatively easily parallelizable scientific applications. They explore the use of conventional code optimization techniques and take advantage of the different memory types available on NVIDIA's 8800GTX to obtain speedup. While their analysis is performed"}], "lineHeight": 0}}, "target": {"markdown": "现有的面向图形应用的 GPU 模拟器包括 Qsilver [43]（其未对可编程着色器进行建模）和 ATTILLA [10]（其侧重于图形特定的功能）。Ryoo 等人 [41] 使用 CUDA 加速了多种相对容易并行化的科学应用程序。他们探索了传统代码优化技术的使用，并利用 NVIDIA 8800GTX 上可用的不同存储器类型来获得加速比。虽然他们的分析是在", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "34fb5893b31d7651c7140b7135347d9b", "index": 164, "aliyun_index": 9, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "by writing and optimizing applications to run on actual CUDA\nhardware, we use our novel performance simulator to observe\nthe detailed behavior of CUDA applications upon varying\narchitectural parameters.  \n\n", "text": "by writing and optimizing applications to run on actual CUDA\nhardware, we use our novel performance simulator to observe\nthe detailed behavior of CUDA applications upon varying\narchitectural parameters.\n", "alignment": "left", "unique_id": "34fb5893b31d7651c7140b7135347d9b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "by writing and optimizing applications to run on actual CUDA"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "hardware, we use our novel performance simulator to observe"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the detailed behavior of CUDA applications upon varying"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "architectural parameters."}], "lineHeight": -115}}, "target": {"markdown": "通过编写和优化应用程序使其在实际 CUDA 硬件上运行来开展分析，而我们则使用新颖的性能模拟器来观察 CUDA 应用程序在改变架构参数时的详细行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "bd66d8e6af284a8c21f84332bbeb8f66", "index": 165, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "There have been acceleration architectures proposed besides the GPU model that we analyze in this paper. Mahesri et al. introduce a class of applications for visualization, interaction, and simulation [23]. They propose using an accelerator architecture (xPU) separate from the GPU to improve performance of their benchmark suite. The Cell processor [7, 38] is a hardware architecture that can function like a stream processor with appropriate software support. It consists of a controlling processor and a set of SIMD co-processors each with independent program counters and instruction memory. Merrimac [8] and Imagine [3] are both streaming processor architectures developed at Stanford.  \n\n", "text": "There have been acceleration architectures proposed besides the GPU model that we analyze in this paper. Mahesri et al. introduce a class of applications for visualization, interaction, and simulation [23]. They propose using an accelerator architecture (xPU) separate from the GPU to improve performance of their benchmark suite. The Cell processor [7, 38] is a hardware architecture that can function like a stream processor with appropriate software support. It consists of a controlling processor and a set of SIMD co-processors each with independent program counters and instruction memory. Merrimac [8] and Imagine [3] are both streaming processor architectures developed at Stanford.\n", "alignment": "left", "unique_id": "bd66d8e6af284a8c21f84332bbeb8f66", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There have been acceleration architectures proposed besides the GPU model that we analyze in this paper. Mahesri et al. introduce a class of applications for visualization, interaction, and simulation [23]. They propose using an accelerator architecture (xPU) separate from the GPU to improve performance of their benchmark suite. The Cell processor [7, 38] is a hardware architecture that can function like a stream processor with appropriate software support. It consists of a controlling processor and a set of SIMD co-processors each with independent program counters and instruction memory. Merrimac [8] and Imagine [3] are both streaming processor architectures developed at Stanford."}], "lineHeight": 0}}, "target": {"markdown": "除本文所分析的 GPU 模型外，已有研究者提出了其他加速架构。Mahesri 等人针对可视化、交互和仿真提出了一类应用程序 [23]，并建议使用一种与 GPU 相独立的加速器架构（xPU）来提升其基准测试套件的性能。Cell 处理器 [7, 38] 是一种硬件架构，在适当的软件支持下能够像流处理器一样工作。它由一个控制处理器和一组 SIMD 协处理器组成，每个 SIMD 协处理器具有独立的程序计数器和指令存储器。Merrimac [8] 和 Imagine [3] 都是由斯坦福大学开发的流处理器架构。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "b13a1b711422d9963221fa7c2cd20e53", "index": 166, "aliyun_index": 11, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Khailany et al. [20] explore VLSI costs and performance of a stream processor as the number of streaming clusters and ALUs per cluster scales. They use an analytical cost model. The benchmarks they use also have a high ratio of ALU operations to memory references, which is a property that eases memory requirements of streaming applications. The UltraSPARC T2 [44] microprocessor is a multithreading, multicore CPU which is a member of the SPARC family and comes in 4, 6, and 8 core variations, with each core capable of running 8 threads concurrently. They have a crossbar between the L2 and the processor cores (similar to our placement of the L2 in Figure 1(a)). Although the T1 and T2 support many concurrent threads (32 and 64, respectively) compared to other contemporary CPUs, this number is very small compared to the number on a high end contemporary GPU (e.g., the Geforce 8800 GTX supports 12,288 threads per chip).  \n\n", "text": "Khailany et al. [20] explore VLSI costs and performance of a stream processor as the number of streaming clusters and ALUs per cluster scales. They use an analytical cost model. The benchmarks they use also have a high ratio of ALU operations to memory references, which is a property that eases memory requirements of streaming applications. The UltraSPARC T2 [44] microprocessor is a multithreading, multicore CPU which is a member of the SPARC family and comes in 4, 6, and 8 core variations, with each core capable of running 8 threads concurrently. They have a crossbar between the L2 and the processor cores (similar to our placement of the L2 in Figure 1(a)). Although the T1 and T2 support many concurrent threads (32 and 64, respectively) compared to other contemporary CPUs, this number is very small compared to the number on a high end contemporary GPU (e.g., the Geforce 8800 GTX supports 12,288 threads per chip).\n", "alignment": "left", "unique_id": "b13a1b711422d9963221fa7c2cd20e53", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Khailany et al. [20] explore VLSI costs and performance of a stream processor as the number of streaming clusters and ALUs per cluster scales. They use an analytical cost model. The benchmarks they use also have a high ratio of ALU operations to memory references, which is a property that eases memory requirements of streaming applications. The UltraSPARC T2 [44] microprocessor is a multithreading, multicore CPU which is a member of the SPARC family and comes in 4, 6, and 8 core variations, with each core capable of running 8 threads concurrently. They have a crossbar between the L2 and the processor cores (similar to our placement of the L2 in Figure 1(a)). Although the T1 and T2 support many concurrent threads (32 and 64, respectively) compared to other contemporary CPUs, this number is very small compared to the number on a high end contemporary GPU (e.g., the Geforce 8800 GTX supports 12,288 threads per chip)."}], "lineHeight": 0}}, "target": {"markdown": "Khailany 等人 [20] 探索了流处理器在流集群数量和每集群 ALU 数量扩展时的 VLSI 成本与性能，他们使用了分析型成本模型。其所用基准测试同样具有较高的 ALU 操作与内存访问之比，这一特性有助于降低流应用程序对内存的需求。UltraSPARC T2 [44] 微处理器是一款支持多线程的多核 CPU，属于 SPARC 系列，提供 4 核、6 核和 8 核版本，每个核心能够同时运行 8 个线程。L2 缓存与处理器核心之间通过交叉开关互连（类似于图 1(a) 中 L2 的布置方式）。尽管与同时期的其他 CPU 相比，T1 和 T2 支持较多并发线程（分别为 32 和 64），但这一数量相较于高端当代 GPU 仍然非常少（例如，GeForce 8800 GTX 每芯片支持 12,288 个线程）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "6c37e7c99fcf5c38fa6bdc0cb1ebb015", "index": 167, "aliyun_index": 12, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "We quantified the effects of varying cache size, DRAM bandwidth and other parameters which, to our knowledge, has not been published previously. While the authors of the CUDA applications which we use as benchmarks have published work, the emphasis of their papers was not on how changes in the GPU architecture can affect their applications [4, 5, 12, 13, 15, 24, 26, 27, 37, 41, 42, 46]. In terms of streaming multiprocessor design, all of the above-mentioned works have different programming models from the CUDA programming model that we employ.  \n\n", "text": "We quantified the effects of varying cache size, DRAM bandwidth and other parameters which, to our knowledge, has not been published previously. While the authors of the CUDA applications which we use as benchmarks have published work, the emphasis of their papers was not on how changes in the GPU architecture can affect their applications [4, 5, 12, 13, 15, 24, 26, 27, 37, 41, 42, 46]. In terms of streaming multiprocessor design, all of the above-mentioned works have different programming models from the CUDA programming model that we employ.\n", "alignment": "left", "unique_id": "6c37e7c99fcf5c38fa6bdc0cb1ebb015", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We quantified the effects of varying cache size, DRAM bandwidth and other parameters which, to our knowledge, has not been published previously. While the authors of the CUDA applications which we use as benchmarks have published work, the emphasis of their papers was not on how changes in the GPU architecture can affect their applications [4, 5, 12, 13, 15, 24, 26, 27, 37, 41, 42, 46]. In terms of streaming multiprocessor design, all of the above-mentioned works have different programming models from the CUDA programming model that we employ."}], "lineHeight": 0}}, "target": {"markdown": "我们对改变缓存容量、DRAM 带宽及其他参数所带来的影响进行了量化分析，据我们所知，这些结果此前尚未发表。虽然我们用作基准测试的 CUDA 应用程序的作者们已经发表了相关工作，但他们论文的重点并不在于 GPU 架构的变更会如何影响这些应用程序 [4, 5, 12, 13, 15, 24, 26, 27, 37, 41, 42, 46]。在流多处理器设计方面，上述所有工作所采用的编程模型均与我们所采用的 CUDA 编程模型不同。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "7a34b12cc524a8e46c2dc828127a69fa", "index": 168, "aliyun_index": 13, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# 6. Conclusions  \n\n", "text": "6. Conclusions\n", "alignment": "left", "unique_id": "7a34b12cc524a8e46c2dc828127a69fa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6. Conclusions"}], "lineHeight": 0}}, "target": {"markdown": "# 6. 结论", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "85ae50adea4eea018961dc9e56df9475", "index": 169, "aliyun_index": 14, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In this paper we studied the performance of twelve contemporary CUDA applications by running them on a detailed performance simulator that simulates NVIDIA's parallel thread execution (PTX) virtual instruction set architecture. We presented performance data and detailed analysis of performance bottlenecks, which differ in type and scope from application to application. First, we found that generally performance of these applications is more sensitive to interconnection network bisection bandwidth rather than (zero load) latency: Reducing interconnect bandwidth by 50% is even more harmful than increasing the per-router latency by 5.3× from 3 cycles  \n\n", "text": "In this paper we studied the performance of twelve contemporary CUDA applications by running them on a detailed performance simulator that simulates NVIDIA's parallel thread execution (PTX) virtual instruction set architecture. We presented performance data and detailed analysis of performance bottlenecks, which differ in type and scope from application to application. First, we found that generally performance of these applications is more sensitive to interconnection network bisection bandwidth rather than (zero load) latency: Reducing interconnect bandwidth by 50% is even more harmful than increasing the per-router latency by 5.3× from 3 cycles\n", "alignment": "left", "unique_id": "85ae50adea4eea018961dc9e56df9475", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this paper we studied the performance of twelve contemporary CUDA applications by running them on a detailed performance simulator that simulates NVIDIA's parallel thread execution (PTX) virtual instruction set architecture. We presented performance data and detailed analysis of performance bottlenecks, which differ in type and scope from application to application. First, we found that generally performance of these applications is more sensitive to interconnection network bisection bandwidth rather than (zero load) latency: Reducing interconnect bandwidth by 50% is even more harmful than increasing the per-router latency by 5.3× from 3 cycles"}], "lineHeight": 0}}, "target": {"markdown": "在本文中，我们通过在一款详细的性能模拟器上运行十二个当代 CUDA 应用程序，对其性能进行了研究，该模拟器模拟了 NVIDIA 的并行线程执行（PTX）虚拟指令集架构。我们展示了性能数据并对性能瓶颈进行了详细分析，这些瓶颈在类型和范围上因应用程序而异。首先，我们发现这些应用程序的性能通常对互连网络的二分带宽比（零负载）延迟更为敏感：将互连带宽降低 50% 所带来的危害甚至比将每个路由器的延迟从 3 个周期增加 5.3 倍还要严重", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "0a96a4b298a89bf30bd4aaf0ca02769f", "index": 170, "aliyun_index": 0, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "to 19 cycles. Second, we showed that caching global and local memory accesses can cause performance degradation for benchmarks where these accesses do not exhibit temporal or spatial locality. Third, we observed that sometimes running fewer CTAs concurrently than the limit imposed by on-chip resources can improve performance by reducing contention in the memory system. Finally, aggressive inter-warp memory coalescing can improve performance in some applications by up to 41%.  \n\n", "text": "to 19 cycles. Second, we showed that caching global and local memory accesses can cause performance degradation for benchmarks where these accesses do not exhibit temporal or spatial locality. Third, we observed that sometimes running fewer CTAs concurrently than the limit imposed by on-chip resources can improve performance by reducing contention in the memory system. Finally, aggressive inter-warp memory coalescing can improve performance in some applications by up to 41%.\n", "alignment": "left", "unique_id": "0a96a4b298a89bf30bd4aaf0ca02769f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to 19 cycles. Second, we showed that caching global and local memory accesses can cause performance degradation for benchmarks where these accesses do not exhibit temporal or spatial locality. Third, we observed that sometimes running fewer CTAs concurrently than the limit imposed by on-chip resources can improve performance by reducing contention in the memory system. Finally, aggressive inter-warp memory coalescing can improve performance in some applications by up to 41%."}], "lineHeight": 0}}, "target": {"markdown": "至 19 个周期。其次，我们表明对于全局内存和局部内存访问不具备时间或空间局部性的基准测试，缓存这些访问反而会导致性能下降。第三，我们观察到有时让并发运行的 CTA 数量少于片上资源所允许的上限，可以通过减少内存系统中的争用来提升性能。最后，激进的 warp 间内存合并访问能够在某些应用程序中带来高达 41% 的性能提升。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "e3704c52bb8f04195a4dbfad0b66bbc6", "index": 171, "aliyun_index": 1, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# Acknowledgments  \n\n", "text": "Acknowledgments\n", "alignment": "left", "unique_id": "e3704c52bb8f04195a4dbfad0b66bbc6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Acknowledgments"}], "lineHeight": 0}}, "target": {"markdown": "## 致谢", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "519987d46abb10a5c10b951505acefb0", "index": 172, "aliyun_index": 2, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "We thank Kevin Skadron, Michael Shebanow, John Kim,\nAndreas Moshovos, Xi Chen, Johnny Kuan and the anonymous\nreviewers for their valuable comments on this work. This work\nwas partly supported by the Natural Sciences and Engineering\nResearch Council of Canada.  \n\n", "text": "We thank Kevin Skadron, Michael Shebanow, John Kim,\nAndreas Moshovos, Xi Chen, Johnny Kuan and the anonymous\nreviewers for their valuable comments on this work. This work\nwas partly supported by the
