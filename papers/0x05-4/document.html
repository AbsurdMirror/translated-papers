ed", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 107}, {"source": {"block_id": "9e8d7bdd6b14b06b139ed11bca960824", "index": 108, "aliyun_index": 1, "page_num": 8, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 12: CU scaling speedup - normalized to 2 CUs per sub-core  \n\n", "text": "Fig. 12: CU scaling speedup - normalized to 2 CUs per sub-core\n", "alignment": "left", "unique_id": "9e8d7bdd6b14b06b139ed11bca960824", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 12: CU scaling speedup - normalized to 2 CUs per sub-core"}], "lineHeight": 0}}, "target": {"markdown": "> 图 12：CU 扩展加速比 —— 以每子核心 2 个 CU 为基准进行归一化", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "e3f18a4fd1bfd2030cc389900ccb920e", "index": 109, "aliyun_index": 2, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "and 8 CUs per sub-core. The results in figure 12 indicate diminishing returns for scaling the number of CUs. It is critical to have enough CUs to cover bank conflicts with access requests from other warps, but the performance benefit beyond 8 CUs per sub core is only 2.5%.  \n\n", "text": "and 8 CUs per sub-core. The results in figure 12 indicate diminishing returns for scaling the number of CUs. It is critical to have enough CUs to cover bank conflicts with access requests from other warps, but the performance benefit beyond 8 CUs per sub core is only 2.5%.\n", "alignment": "left", "unique_id": "e3f18a4fd1bfd2030cc389900ccb920e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and 8 CUs per sub-core. The results in figure 12 indicate diminishing returns for scaling the number of CUs. It is critical to have enough CUs to cover bank conflicts with access requests from other warps, but the performance benefit beyond 8 CUs per sub core is only 2.5%."}], "lineHeight": 0}}, "target": {"markdown": "和 8 个 CU 之间。图 12 中的结果表明，扩展 CU 数量所带来的收益呈递减趋势。拥有足够多的 CU 来覆盖来自其他 warp 的访问请求所造成的寄存器体冲突至关重要，但当每个子核心的 CU 数量超过 8 个之后，性能提升仅为 2.5%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "9fc81e7b11aabb9eccb4f1a30a99fa3f", "index": 110, "aliyun_index": 3, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "In some applications, namely rod-lavaMD, pb-sgemm, rod-bp, rod-srad, pb-mrig, and the cuGraph applications, scaling the number of CUs provides more benefit than having access to a larger number of register banks (i.e. the fully connected SM). Such scenarios can arise when the fully connected SM exhausts its pool of shared CUs causing the warp scheduling stage to stall.  \n\n", "text": "In some applications, namely rod-lavaMD, pb-sgemm, rod-bp, rod-srad, pb-mrig, and the cuGraph applications, scaling the number of CUs provides more benefit than having access to a larger number of register banks (i.e. the fully connected SM). Such scenarios can arise when the fully connected SM exhausts its pool of shared CUs causing the warp scheduling stage to stall.\n", "alignment": "left", "unique_id": "9fc81e7b11aabb9eccb4f1a30a99fa3f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In some applications, namely rod-lavaMD, pb-sgemm, rod-bp, rod-srad, pb-mrig, and the cuGraph applications, scaling the number of CUs provides more benefit than having access to a larger number of register banks (i.e. the fully connected SM). Such scenarios can arise when the fully connected SM exhausts its pool of shared CUs causing the warp scheduling stage to stall."}], "lineHeight": 0}}, "target": {"markdown": "在某些应用程序中，即 rod-lavaMD、pb-sgemm、rod-bp、rod-srad、pb-mrig 以及 cuGraph 应用程序，扩展 CU 数量所带来的收益大于访问更多寄存器体（即全互连 SM）。当全互连 SM 耗尽其共享 CU 池从而导致 warp 调度阶段停滞时，便可能出现此类情况。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "ac12c9257bb12d2023e4afc048e2d384", "index": 111, "aliyun_index": 4, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "2) Power & Area Cost Comparison: CU scaling vs. RBA : To assess the costs of implementing the RBA design against adding CUs to each sub-core we implemented the Operand Collector and Warp Issue Scheduler (Figure 6) in RTL. The baseline design had 2 CUs per sub-core with a GTO Warp Issue Scheduler. From this baseline we either applied the changes marked in red in Figure 6 to realize the RBA scheduler or adjusted the number of CUs.  \n\n", "text": "2) Power & Area Cost Comparison: CU scaling vs. RBA : To assess the costs of implementing the RBA design against adding CUs to each sub-core we implemented the Operand Collector and Warp Issue Scheduler (Figure 6) in RTL. The baseline design had 2 CUs per sub-core with a GTO Warp Issue Scheduler. From this baseline we either applied the changes marked in red in Figure 6 to realize the RBA scheduler or adjusted the number of CUs.\n", "alignment": "left", "unique_id": "ac12c9257bb12d2023e4afc048e2d384", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Power & Area Cost Comparison: CU scaling vs. RBA : To assess the costs of implementing the RBA design against adding CUs to each sub-core we implemented the Operand Collector and Warp Issue Scheduler (Figure 6) in RTL. The baseline design had 2 CUs per sub-core with a GTO Warp Issue Scheduler. From this baseline we either applied the changes marked in red in Figure 6 to realize the RBA scheduler or adjusted the number of CUs."}], "lineHeight": 0}}, "target": {"markdown": "2) 功耗与面积成本对比：CU 扩展与 RBA：为评估实现 RBA 设计相对于向每个子核心增加 CU 的成本，我们使用 RTL 实现了操作数收集器与 Warp 发射调度器（图 6）。基线设计为每个子核心配备 2 个 CU，并采用 GTO Warp 发射调度器。在此基线之上，我们施加图 6 中红色标出的更改以实现 RBA 调度器，或是调整 CU 的数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "e7de6a12d16f9ec8690ca6f11a351ce8", "index": 112, "aliyun_index": 5, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "We synthesized the designs with a 1 GHz clock in Cadence Genus using a 45 nm process design kit [54]. The register file was built from SRAM modules generated by OpenRAM [32] with the same process design kit, and was configured according to Table II. The area and power results normalized to the baseline design are shown in Figure 13. Increasing the number of CUs to 4 increases the area of the design by 27%, and the power by 60%. Conversely, the RBA design introduces a mere 1% overhead in area and power respectively.  \n\n", "text": "We synthesized the designs with a 1 GHz clock in Cadence Genus using a 45 nm process design kit [54]. The register file was built from SRAM modules generated by OpenRAM [32] with the same process design kit, and was configured according to Table II. The area and power results normalized to the baseline design are shown in Figure 13. Increasing the number of CUs to 4 increases the area of the design by 27%, and the power by 60%. Conversely, the RBA design introduces a mere 1% overhead in area and power respectively.\n", "alignment": "left", "unique_id": "e7de6a12d16f9ec8690ca6f11a351ce8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We synthesized the designs with a 1 GHz clock in Cadence Genus using a 45 nm process design kit [54]. The register file was built from SRAM modules generated by OpenRAM [32] with the same process design kit, and was configured according to Table II. The area and power results normalized to the baseline design are shown in Figure 13. Increasing the number of CUs to 4 increases the area of the design by 27%, and the power by 60%. Conversely, the RBA design introduces a mere 1% overhead in area and power respectively."}], "lineHeight": 0}}, "target": {"markdown": "我们使用 45 nm 工艺设计套件 [54] 在 Cadence Genus 中以 1 GHz 时钟对设计进行了综合。寄存器文件由 OpenRAM [32] 使用相同工艺设计套件生成的 SRAM 模块构建，并按照表 II 进行配置。图 13 给出了相对于基线设计归一化的面积与功耗结果。将 CU 数量增加到 4 会使设计面积增加 27%，功耗增加 60%。相反，RBA 设计在面积和功耗上分别仅引入 1% 的额外开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "12757a98b5287dd75f0931c45f62c4a2", "index": 113, "aliyun_index": 6, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The RBA design is significantly cheaper than scaling the number of CUs because each operand stored in the CU is a vector of 32 values, each requiring a few thousand bits of storage. Moreover, the full crossbar connecting the vector operands is expensive to scale. In stark contrast, the RBA design (1) adds a minimal amount of storage (16 entries x 5-bit RBA score = 80 bits per sub-core) to the existing warp PC table, (2) requires minimal changes to the warp selection logic (the comparator network needs to be widened to compare 5 more bits of input) and (3) calculates the RBA score quickly (with 2 CUs and 3 operands per CU, max queue length is 6).  \n\n", "text": "The RBA design is significantly cheaper than scaling the number of CUs because each operand stored in the CU is a vector of 32 values, each requiring a few thousand bits of storage. Moreover, the full crossbar connecting the vector operands is expensive to scale. In stark contrast, the RBA design (1) adds a minimal amount of storage (16 entries x 5-bit RBA score = 80 bits per sub-core) to the existing warp PC table, (2) requires minimal changes to the warp selection logic (the comparator network needs to be widened to compare 5 more bits of input) and (3) calculates the RBA score quickly (with 2 CUs and 3 operands per CU, max queue length is 6).\n", "alignment": "left", "unique_id": "12757a98b5287dd75f0931c45f62c4a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The RBA design is significantly cheaper than scaling the number of CUs because each operand stored in the CU is a vector of 32 values, each requiring a few thousand bits of storage. Moreover, the full crossbar connecting the vector operands is expensive to scale. In stark contrast, the RBA design (1) adds a minimal amount of storage (16 entries x 5-bit RBA score = 80 bits per sub-core) to the existing warp PC table, (2) requires minimal changes to the warp selection logic (the comparator network needs to be widened to compare 5 more bits of input) and (3) calculates the RBA score quickly (with 2 CUs and 3 operands per CU, max queue length is 6)."}], "lineHeight": 0}}, "target": {"markdown": "RBA 设计在成本上显著低于扩展 CU 数量，因为存储在 CU 中的每个操作数都是一个由 32 个值组成的向量，每个向量需要数千比特的存储空间。此外，连接向量操作数的完整交叉开关在扩展时成本高昂。与之形成鲜明对比的是，RBA 设计：(1) 在现有 warp PC 表中仅增加极少量存储（每子核心 16 项 × 5 位 RBA 评分 = 80 比特）；(2) 只需对 warp 选择逻辑做极小改动（比较器网络需扩展以多比较 5 位输入）；(3) RBA 评分计算迅速（在 2 个 CU 且每 CU 3 个操作数的情况下，最大队列长度为 6）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "c53d6c267706832473852eb12b816c97", "index": 114, "aliyun_index": 7, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "3) Register Bank Aware Scheduler Results: The RBA scheduler provides the performance benefits of scaling CUs without the significant area and power overheads. Figure 14  \n\n", "text": "3) Register Bank Aware Scheduler Results: The RBA scheduler provides the performance benefits of scaling CUs without the significant area and power overheads. Figure 14\n", "alignment": "left", "unique_id": "c53d6c267706832473852eb12b816c97", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3) Register Bank Aware Scheduler Results: The RBA scheduler provides the performance benefits of scaling CUs without the significant area and power overheads. Figure 14"}], "lineHeight": 0}}, "target": {"markdown": "3) 寄存器体感知调度器结果：RBA 调度器在无需显著增加面积和功耗开销的前提下，提供了与扩展 CU 相当的性能优势。图 14", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "f22ec90d9ea1d394e8d9c900818d8f9a", "index": 115, "aliyun_index": 8, "page_num": 8, "type": "figure", "sub_type": "none", "markdown": "![f22ec90d9ea1d394e8d9c900818d8f9a.jpeg](figures/f22ec90d9ea1d394e8d9c900818d8f9a_d53221b1.png)  \n\n", "text": "以下是根据您提供的柱状图内容，提取并整理为合法 Markdown 格式的完整信息：\n\n---\n\n# 图表标题（隐含）：不同调度策略下归一化面积与功率对比\n\n## 图例说明\n\n- **浅绿色柱**：Normalized area（归一化面积）\n- **深绿色柱**：Normalized power（归一化功率）\n\n> Y轴标签：**Normalized area/power**  \n> X轴分组：按计算单元数（CU）和调度策略划分\n\n---\n\n## 数据详情（按X轴从左到右顺序）\n\n### 1. GTO scheduling — 2 CU (Baseline)\n\n| 指标             | 值   |\n|------------------|------|\n| Normalized area  | 1.00 |\n| Normalized power | 1.00 |\n\n---\n\n### 2. GTO scheduling — 4 CU\n\n| 指标             | 值   |\n|------------------|------|\n| Normalized area  | 1.27 |\n| Normalized power | 1.60 |\n\n---\n\n### 3. GTO scheduling — 8 CU\n\n| 指标             | 值   |\n|------------------|------|\n| Normalized area  | 1.74 |\n| Normalized power | 2.83 |\n\n---\n\n### 4. GTO scheduling — 16 CU\n\n| 指标             | 值   |\n|------------------|------|\n| Normalized area  | 2.78 |\n| Normalized power | 5.19 |\n\n---\n\n### 5. RBA scheduling — 2 CU\n\n| 指标             | 值   |\n|------------------|------|\n| Normalized area  | 1.01 |\n| Normalized power | 1.01 |\n\n---\n\n## 补充说明\n\n- “GTO scheduling” 包含四个子组：2 CU（基线）、4 CU、8 CU、16 CU。\n- “RBA scheduling” 仅包含一个子组：2 CU。\n- 所有数值均为归一化值，以“2 CU (Baseline)”下的 GTO 调度作为基准（即其面积和功率均设为 1.00）。\n- 随着 CU 数量增加（在 GTO 调度下），归一化面积和功率均呈上升趋势，尤其功率增长更显著。\n- RBA 调度在 2 CU 下表现接近基线，但略高（1.01 vs 1.00）。\n\n---\n\n✅ 此 Markdown 格式保留了原始图表中的所有数据点、分类结构、图例含义及相对关系，可用于文档记录或进一步分析。\n\n--- \n\n如需导出为表格形式或添加可视化建议，可继续提出。", "alignment": "left", "unique_id": "f22ec90d9ea1d394e8d9c900818d8f9a", "edited": false, "extra": {}}, "target": {"markdown": "![f22ec90d9ea1d394e8d9c900818d8f9a.jpeg](figures/f22ec90d9ea1d394e8d9c900818d8f9a_d53221b1.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "3c826bc0fdfa28298942123b94c39afd", "index": 116, "aliyun_index": 9, "page_num": 8, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 13: Area and power cost estimates of scaling the number of CUs per sub-core, compared to a RBA-based design. All designs include the warp issue scheduler, operand collector and two register file banks.  \n\n", "text": "Fig. 13: Area and power cost estimates of scaling the number of CUs per sub-core, compared to a RBA-based design. All designs include the warp issue scheduler, operand collector and two register file banks.\n", "alignment": "left", "unique_id": "3c826bc0fdfa28298942123b94c39afd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 13: Area and power cost estimates of scaling the number of CUs per sub-core, compared to a RBA-based design. All designs include the warp issue scheduler, operand collector and two register file banks."}], "lineHeight": 0}}, "target": {"markdown": "> 图 13：每个子核心扩展 CU 数量与基于 RBA 的设计之间的面积与功耗成本估算。所有设计均包含 warp 发射调度器、操作数收集器以及两个寄存器文件体。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "39a5ab9a209b87f10b1c840bd99b5d60", "index": 117, "aliyun_index": 10, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "shows the number of register reads aggregated across a single\nSM plotted for each cycle of execution for the pb-mriq\nand rod-srad benchmarks. The average number of reads/cycle\nacross the entire application is shown in red. The maximum\nbandwidth is 256 reads/cycle which would occur if all 8 banks\nwere accessed in a cycle by 8 different warps. The figure\nindicates RBA improves utilization of pb-mriq by increasing\nthe average number of reads per cycle and reducing the number\nof cycles with 85 reads or less. The fully connected SM has\na much higher average read/cycle rate. 160 reads corresponds\nto 5 register file banks being accessed in a cycle. The RBA\nscheduler is constrained to using 2 CUs and therefore has\ndifficulty smoothing bank conflicts during large bursts of\nregister file activity. In contrast, if one of the schedulers in\nthe fully connected SM reaches section of code with a burst\nof register file activity, it can make use of more than two\ncollector units at a time to help hide any bank conflict stalls.  \n\n", "text": "shows the number of register reads aggregated across a single\nSM plotted for each cycle of execution for the pb-mriq\nand rod-srad benchmarks. The average number of reads/cycle\nacross the entire application is shown in red. The maximum\nbandwidth is 256 reads/cycle which would occur if all 8 banks\nwere accessed in a cycle by 8 different warps. The figure\nindicates RBA improves utilization of pb-mriq by increasing\nthe average number of reads per cycle and reducing the number\nof cycles with 85 reads or less. The fully connected SM has\na much higher average read/cycle rate. 160 reads corresponds\nto 5 register file banks being accessed in a cycle. The RBA\nscheduler is constrained to using 2 CUs and therefore has\ndifficulty smoothing bank conflicts during large bursts of\nregister file activity. In contrast, if one of the schedulers in\nthe fully connected SM reaches section of code with a burst\nof register file activity, it can make use of more than two\ncollector units at a time to help hide any bank conflict stalls.\n", "alignment": "left", "unique_id": "39a5ab9a209b87f10b1c840bd99b5d60", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "shows the number of register reads aggregated across a single"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SM plotted for each cycle of execution for the pb-mriq"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and rod-srad benchmarks. The avera .  \n\n", "text": "The RBA scheduler improves average register file through-put beyond that of a fully connected SM in rod-srad (see fig. 14). The average register file reads per cycle across a single SM were 22.2, 27.1, and 23.4 for baseline, RBA, and fully-connected respectively. RBA outperformed the fully connected SM in rod-srad by improving the average utilization of the register file, even though the peak throughput was not improved.\n", "alignment": "left", "unique_id": "3de12c34723e9a4719319e78da34db5c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The RBA scheduler improves average register file through-put beyond that of a fully connected SM in rod-srad (see fig. 14). The average register file reads per cycle across a single SM were 22.2, 27.1, and 23.4 for baseline, RBA, and fully-connected respectively. RBA outperformed the fully connected SM in rod-srad by improving the average utilization of the register file, even though the peak throughput was not improved."}], "lineHeight": 0}}, "target": {"markdown": "RBA 调度器在 rod-srad 中将寄存器文件的平均吞吐提升到了全互连 SM 之上（见图 14）。单个 SM 上每个周期的寄存器文件平均读取次数在基线、RBA 和全互连三种方案下分别为 22.2、27.1 和 23.4。RBA 在 rod-srad 中通过提高寄存器文件的平均利用率优于全互连 SM，尽管其峰值吞吐并未得到提升。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "432ad73eab2f49551c01895e544da3b9", "index": 119, "aliyun_index": 0, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![432ad73eab2f49551c01895e544da3b9.jpeg](figures/432ad73eab2f49551c01895e544da3b9_4da71061.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有图表标题、坐标轴标签、图例及子图编号等细节：\n\n---\n\n# Register File Reads vs. Cycle Analysis for pb-mriq and rod-srad under Different Architectures\n\n## Subfigure (a): Baseline: pb-mriq\n\n- **X-axis**: Cycle (range: 0 to ~6,500,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~105)\n- **Observation**: High variability in register file reads with periodic deep drops; average stabilizes around 105.\n\n## Subfigure (b): RBA: pb-mriq\n\n- **X-axis**: Cycle (range: 0 to ~6,500,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~110)\n- **Observation**: Similar pattern to (a) but slightly higher average; fewer extreme dips.\n\n## Subfigure (c): Fully-connected: pb-mriq\n\n- **X-axis**: Cycle (range: 0 to ~6,500,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~150)\n- **Observation**: Higher baseline activity; more frequent high-read bursts; average significantly elevated compared to (a) and (b).\n\n## Subfigure (d): Baseline: rod-srad\n\n- **X-axis**: Cycle (range: 0 to ~4,000,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~25)\n- **Observation**: Dense, regular oscillations between ~20–130; low average due to consistent lower-bound behavior.\n\n## Subfigure (e): RBA: rod-srad\n\n- **X-axis**: Cycle (range: 0 to ~4,000,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~30)\n- **Observation**: Slightly increased amplitude and average compared to (d); still maintains rhythmic structure.\n\n## Subfigure (f): Fully-connected: rod-srad\n\n- **X-axis**: Cycle (range: 0 to ~4,000,000)\n- **Y-axis**: Register File Reads (range: 0 to 180)\n- **Legend**: \n  - Blue vertical bars: per-cycle register file reads\n  - Red horizontal line labeled “Average”: average register file reads over cycles (~25)\n- **Observation**: Broader distribution of read values (up to ~170), but average remains similar to baseline; occasional spikes above 160.\n\n---\n\n## Summary Table of Average Register File Reads\n\n| Subfigure | Architecture        | Benchmark   | Approx. Average Register File Reads |\n|-----------|---------------------|-------------|--------------------------------------|\n| (a)       | Baseline            | pb-mriq     | ~105                                 |\n| (b)       | RBA                 | pb-mriq     | ~110                                 |\n| (c)       | Fully-connected     | pb-mriq     | ~150                                 |\n| (d)       | Baseline            | rod-srad    | ~25                                  |\n| (e)       | RBA                 | rod-srad    | ~30                                  |\n| (f)       | Fully-connected     | rod-srad    | ~25                                  |\n\n> Note: All plots share the same Y-axis scale (0–180) and use identical legend styling (“Average” as red line). X-axis scales differ by benchmark: pb-mriq runs up to ~6.5M cycles, rod-srad up to ~4M cycles.\n\n--- \n\n✅ This Markdown representation preserves all visual elements, labels, trends, and comparative insights from the original figure set without duplication or omission.", "alignment": "left", "unique_id": "432ad73eab2f49551c01895e544da3b9", "edited": false, "extra": {}}, "target": {"markdown": "![432ad73eab2f49551c01895e544da3b9.jpeg](figures/432ad73eab2f49551c01895e544da3b9_4da71061.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "fb488fc81deeaddcb8b4d87365a4408d", "index": 120, "aliyun_index": 1, "page_num": 9, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 14: Number of 4-byte register file read accesses per cycle in two applications: pb-mriq and rod-srad. RBA improves performance beyond fully-connected in rod-srad by increasing average register file read utilization across the entire application (shown in red).  \n\n", "text": "Fig. 14: Number of 4-byte register file read accesses per cycle in two applications: pb-mriq and rod-srad. RBA improves performance beyond fully-connected in rod-srad by increasing average register file read utilization across the entire application (shown in red).\n", "alignment": "left", "unique_id": "fb488fc81deeaddcb8b4d87365a4408d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 14: Number of 4-byte register file read accesses per cycle in two applications: pb-mriq and rod-srad. RBA improves performance beyond fully-connected in rod-srad by increasing average register file read utilization across the entire application (shown in red)."}], "lineHeight": 0}}, "target": {"markdown": "> 图 14：两个应用程序（pb-mriq 和 rod-srad）中每个周期 4 字节寄存器文件读取访问次数。RBA 在 rod-srad 中通过提升整个应用程序的寄存器文件平均读取利用率（以红色标出），使其性能优于全互连方案。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "06e273095d5dca0f8bc444150e917394", "index": 121, "aliyun_index": 2, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "4) RBA Score Latency Sensitivity Study: RBA uses score values from register bank contention to make scheduling decisions. Although computing the scores is a relatively simple process, it is possible that the distance between the register file and the instruction scheduler may cause score updates to influence the critical path. In such a scenario, an RBA implementation may need to latch or pipeline the score update to avoid changing the cycle time. To quantify the effect a delay in score updates has on RBA, we evaluate RBA with score update latencies swept from 0 to 20 cycles. Across the top 15 applications where RBA shows a benefit, on average the performance decreased by < 0.1% as the latency was increased. We find that the majority of the applications tend to have stable periods of register file access, in which a slightly stale score value still provides a reasonable estimate for making scheduling decisions. Of the 15 applications in the latency study, only one, ply-2Dconv, had a performance impact of >1%. In this application the speedup of RBA decreased from 24.2% to 19.2% with a latency of 20 cycles.  \n\n", "text": "4) RBA Score Latency Sensitivity Study: RBA uses score values from register bank contention to make scheduling decisions. Although computing the scores is a relatively simple process, it is possible that the distance between the register file and the instruction scheduler may cause score updates to influence the critical path. In such a scenario, an RBA implementation may need to latch or pipeline the score update to avoid changing the cycle time. To quantify the effect a delay in score updates has on RBA, we evaluate RBA with score update latencies swept from 0 to 20 cycles. Across the top 15 applications where RBA shows a benefit, on average the performance decreased by < 0.1% as the latency was increased. We find that the majority of the applications tend to have stable periods of register file access, in which a slightly stale score value still provides a reasonable estimate for making scheduling decisions. Of the 15 applications in the latency study, only one, ply-2Dconv, had a performance impact of >1%. In this application the speedup of RBA decreased from 24.2% to 19.2% with a latency of 20 cycles.\n", "alignment": "left", "unique_id": "06e273095d5dca0f8bc444150e917394", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4) RBA Score Latency Sensitivity Study: RBA uses score values from register bank contention to make scheduling decisions. Although computing the scores is a relatively simple process, it is possible that the distance between the register file and the instruction scheduler may cause score updates to influence the critical path. In such a scenario, an RBA implementation may need to latch or pipeline the score update to avoid changing the cycle time. To quantify the effect a delay in score updates has on RBA, we evaluate RBA with score update latencies swept from 0 to 20 cycles. Across the top 15 applications where RBA shows a benefit, on average the performance decreased by < 0.1% as the latency was increased. We find that the majority of the applications tend to have stable periods of register file access, in which a slightly stale score value still provides a reasonable estimate for making scheduling decisions. Of the 15 applications in the latency study, only one, ply-2Dconv, had a performance impact of >1%. In this application the speedup of RBA decreased from 24.2% to 19.2% with a latency of 20 cycles."}], "lineHeight": 0}}, "target": {"markdown": "4) RBA 评分延迟敏感性研究：RBA 利用来自寄存器体冲突的评分值来做出调度决策。尽管计算评分的过程相对简单，但寄存器文件与指令调度器之间的距离可能会导致评分更新影响关键路径。在此情况下，RBA 实现可能需要对评分更新进行锁存或流水线化处理，以避免改变时钟周期时间。为了量化评分更新延迟对 RBA 的影响，我们将 RBA 的评分更新延迟从 0 个周期扫描到 20 个周期进行评估。在 RBA 展现出收益的前 15 个应用程序中，随着延迟的增加，平均性能下降小于 0.1%。我们发现，大多数应用程序往往具有较为稳定的寄存器文件访问周期，在此期间，稍有滞后的评分值仍能为调度决策提供合理的估计。在延迟研究的 15 个应用程序中，仅 ply-2Dconv 一个应用程序的性能受影响超过 1%。在该应用程序中，RBA 的加速比从 24.2% 降至 19.2%，对应的延迟为 20 个周期。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "b6e3ac180115959da08a0855655b0032", "index": 122, "aliyun_index": 3, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "5) RBA Bank Scaling Sensitivity Study: We found that the effectiveness of RBA is reduced (from 19.3% to 15.4% on average) when the number of banks per sub-core is doubled from 2 to 4. As the number of banks increases the read-operand stage becomes less of a bottleneck and there are fewer opportunities for RBA to improve register file utilization.  \n\n", "text": "5) RBA Bank Scaling Sensitivity Study: We found that the effectiveness of RBA is reduced (from 19.3% to 15.4% on average) when the number of banks per sub-core is doubled from 2 to 4. As the number of banks increases the read-operand stage becomes less of a bottleneck and there are fewer opportunities for RBA to improve register file utilization.\n", "alignment": "left", "unique_id": "b6e3ac180115959da08a0855655b0032", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5) RBA Bank Scaling Sensitivity Study: We found that the effectiveness of RBA is reduced (from 19.3% to 15.4% on average) when the number of banks per sub-core is doubled from 2 to 4. As the number of banks increases the read-operand stage becomes less of a bottleneck and there are fewer opportunities for RBA to improve register file utilization."}], "lineHeight": 0}}, "target": {"markdown": "5) RBA 寄存器体扩展敏感性研究：我们发现，当每个子核心的寄存器体数量从 2 个翻倍增加到 4 个时，RBA 的有效性有所下降（平均从 19.3% 降至 15.4%）。随着寄存器体数量的增加，读取操作数阶段不再那么成为瓶颈，RBA 改善寄存器文件利用率的机会也随之减少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "d19ef1560796375fb9eee004b7fe639e", "index": 123, "aliyun_index": 4, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "# C. Scheduler Issue Balancing Results  \n\n", "text": "C. Scheduler Issue Balancing Results\n", "alignment": "left", "unique_id": "d19ef1560796375fb9eee004b7fe639e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "C. Scheduler Issue Balancing Results"}], "lineHeight": 0}}, "target": {"markdown": "# C. 调度器发射均衡结果", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "3964d5313d0e25b550516f3d0920b08f", "index": 124, "aliyun_index": 5, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "TPC-H is not limited by the read operand stage and therefore benefits only a few percent from the RBA warp scheduler design. Both sub-core assignment hash functions maintain performance across balanced applications. This can be seen  \n\n", "text": "TPC-H is not limited by the read operand stage and therefore benefits only a few percent from the RBA warp scheduler design. Both sub-core assignment hash functions maintain performance across balanced applications. This can be seen\n", "alignment": "left", "unique_id": "3964d5313d0e25b550516f3d0920b08f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TPC-H is not limited by the read operand stage and therefore benefits only a few percent from the RBA warp scheduler design. Both sub-core assignment hash functions maintain performance across balanced applications. This can be seen"}], "lineHeight": 0}}, "target": {"markdown": "TPC-H 不受读取操作数阶段的限制，因此从 RBA warp 调度器设计中仅获得几个百分点的收益。两种子核心分配哈希函数在均衡应用程序中均能保持其性能。这一点可以体现", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "f89ea3276d561ded0eed0332f33aa934", "index": 125, "aliyun_index": 6, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "from the performance of Shuffle on the Parboil, Cutlass,\nCugraph, and Rodinia applications in figure 10.  \n\n", "text": "from the performance of Shuffle on the Parboil, Cutlass,\nCugraph, and Rodinia applications in figure 10.\n", "alignment": "left", "unique_id": "f89ea3276d561ded0eed0332f33aa934", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "from the performance of Shuffle on the Parboil, Cutlass,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Cugraph, and Rodinia applications in figure 10."}], "lineHeight": -60}}, "target": {"markdown": "从图 10 中 Shuffle 在 Parboil、Cutlass、Cugraph 和 Rodinia 应用程序上的性能可以看出这一点。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "995e56aecab6611768f280ea228f8004", "index": 126, "aliyun_index": 7, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figures 15 and 16 show the speedup of all designs for each query in the TPC-H benchmark suites with compressed and uncompressed databases. SRR and Shuffle had average speedups of 33.1%, 27.4% respectively on the compressed benchmark, and 17.5%, 13.9% respectively on the uncompressed benchmark. SRR performed the best in all queries because the assignment function was designed to match to the warp issue distribution of the benchmarks, i.e. one long running warp every 4th warp. However, the shuffle hash function is more broadly applicable to other imbalance patterns, and was within 5% of SRR on average.  \n\n", "text": "Figures 15 and 16 show the speedup of all designs for each query in the TPC-H benchmark suites with compressed and uncompressed databases. SRR and Shuffle had average speedups of 33.1%, 27.4% respectively on the compressed benchmark, and 17.5%, 13.9% respectively on the uncompressed benchmark. SRR performed the best in all queries because the assignment function was designed to match to the warp issue distribution of the benchmarks, i.e. one long running warp every 4th warp. However, the shuffle hash function is more broadly applicable to other imbalance patterns, and was within 5% of SRR on average.\n", "alignment": "left", "unique_id": "995e56aecab6611768f280ea228f8004", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figures 15 and 16 show the speedup of all designs for each query in the TPC-H benchmark suites with compressed and uncompressed databases. SRR and Shuffle had average speedups of 33.1%, 27.4% respectively on the compressed benchmark, and 17.5%, 13.9% respectively on the uncompressed benchmark. SRR performed the best in all queries because the assignment function was designed to match to the warp issue distribution of the benchmarks, i.e. one long running warp every 4th warp. However, the shuffle hash function is more broadly applicable to other imbalance patterns, and was within 5% of SRR on average."}], "lineHeight": 0}}, "target": {"markdown": "图 15 和图 16 展示了在压缩与未压缩数据库下，各设计在 TPC-H 基准测试套件中每个查询上的加速比。在压缩基准测试中，SRR 与 Shuffle 的平均加速比分别为 33.1% 和 27.4%；在未压缩基准测试中，二者的平均加速比分别为 17.5% 和 13.9%。SRR 在所有查询中均表现最佳，因为其分配函数是为匹配基准测试中 warp 发射分布（即每 4 个 warp 中有 1 个长时间运行的 warp）而专门设计的。然而，Shuffle 哈希函数可更广泛地适用于其他不均衡模式，并且其平均性能与 SRR 相差不到 5%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "702d2142c45b2343e6dd108229d41a8b", "index": 127, "aliyun_index": 8, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "The total number of instructions issued from each of the four schedulers provides insight into how well each design distributes work among the sub-cores. The coefficient of variation quantifies the amount of variation between the four schedulers in relation to the average number of instructions issued from each warp scheduler. A smaller value indicates better balancing across the four sub-cores in each SM. Figure 17 shows the coefficient of variation for SRR and Shuffle on the uncompressed TPC-H benchmarks and is calculated as $c_v = \\frac{\\sigma}{\\mu}$, where $\\sigma$ is the standard deviation and $\\mu$ is the mean.  \n\n", "text": "The total number of instructions issued from each of the four schedulers provides insight into how well each design distributes work among the sub-cores. The coefficient of variation quantifies the amount of variation between the four schedulers in relation to the average number of instructions issued from each warp scheduler. A smaller value indicates better balancing across the four sub-cores in each SM. Figure 17 shows the coefficient of variation for SRR and Shuffle on the uncompressed TPC-H benchmarks and is calculated as $c_v = \\frac{\\sigma}{\\mu}$, where $\\sigma$ is the standard deviation and $\\mu$ is the mean.\n", "alignment": "left", "unique_id": "702d2142c45b2343e6dd108229d41a8b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The total number of instructions issued from each of the four schedulers provides insight into how well each design distributes work among the sub-cores. The coefficient of variation quantifies the amount of variation between the four schedulers in relation to the average number of instructions issued from each warp scheduler. A smaller value indicates better balancing across the four sub-cores in each SM. Figure 17 shows the coefficient of variation for SRR and Shuffle on the uncompressed TPC-H benchmarks and is calculated as $c_v = \\frac{\\sigma}{\\mu}$, where $\\sigma$ is the standard deviation and $\\mu$ is the mean."}], "lineHeight": 0}}, "target": {"markdown": "四个调度器各自发射的指令总数有助于了解各设计在子核心间分配工作的优劣。变异系数量化了四个调度器之间的差异相对于每个 warp 调度器平均发射指令数的程度，其值越小，表明每个 SM 中四个子核心之间的均衡性越好。图 17 展示了在未压缩的 TPC-H 基准测试上 SRR 与 Shuffle 的变异系数，其计算公式为 $c_v = \\frac{\\sigma}{\\mu}$，其中 $\\sigma$ 为标准差，$\\mu$ 为均值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "b887b5ce29127267fb769fcf227cae4f", "index": 128, "aliyun_index": 9, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "The SRR hashing function reduced the coefficient of variation from .80 to .11 on average across all queries. Query 8, which had the largest baseline coefficient of variation of 1.01, experienced the largest performance improvement due to sub-core balancing with a 30.8% speedup. By improving the balance of instructions issued from each sub-core, both shuffle and SRR improved upon the baseline performance within four percent of each other. A larger reduction in sub-  \n\n", "text": "The SRR hashing function reduced the coefficient of variation from .80 to .11 on average across all queries. Query 8, which had the largest baseline coefficient of variation of 1.01, experienced the largest performance improvement due to sub-core balancing with a 30.8% speedup. By improving the balance of instructions issued from each sub-core, both shuffle and SRR improved upon the baseline performance within four percent of each other. A larger reduction in sub-\n", "alignment": "left", "unique_id": "b887b5ce29127267fb769fcf227cae4f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The SRR hashing function reduced the coefficient of variation from .80 to .11 on average across all queries. Query 8, which had the largest baseline coefficient of variation of 1.01, experienced the largest performance improvement due to sub-core balancing with a 30.8% speedup. By improving the balance of instructions issued from each sub-core, both shuffle and SRR improved upon the baseline performance within four percent of each other. A larger reduction in sub-"}], "lineHeight": 0}}, "target": {"markdown": "SRR 哈希函数将所有查询的平均变异系数从 0.80 降至 0.11。基线变异系数最大的查询 8（为 1.01），由于子核心均衡而获得了最大的性能提升，加速比达 30.8%。通过改善每个子核心发射指令的均衡性，Shuffle 与 SRR 在性能上均优于基线，且二者之间相差不超过 4%。子核心均衡降幅的进一步增大会……", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "054b69398c65b3e6b5107accc893ed55", "index": 129, "aliyun_index": 0, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![054b69398c65b3e6b5107accc893ed55.jpeg](figures/054b69398c65b3e6b5107accc893ed55_3133d0f7.png)  \n\n", "text": "# Speedup Comparison Across Queries\n\n## Axes\n- **Y-axis**: Speedup (range: 0.8 – 1.8)\n- **X-axis**: Query Number (1 to 22, plus GMN)\n\n## Legend\n| Color      | Method           |\n|------------|------------------|\n| Orange     | RBA              |\n| Yellow     | SRR              |\n| Light Green| Shuffle          |\n| Dark Green | Shuffle + RBA    |\n\n## Observations\n\n### General Trends\n- **RBA** consistently at speedup = 1.0 (baseline).\n- **SRR** and **Shuffle** show consistent improvement over RBA.\n- **Shuffle + RBA** often outperforms individual methods.\n\n### Notable Queries\n- **Q9**: \n  - SRR ≈ 1.6\n  - Shuffle + RBA ≈ 1.55\n- **Q20**:\n  - SRR ≈ 1.55\n  - Shuffle + RBA ≈ 1.5\n- **Q19**:\n  - All methods near 1.0 → minimal gain\n- **GMN**:\n  - Shuffle ≈ 1.3 (best performer)\n\n## Conclusion\n- Optimization methods (SRR, Shuffle, Shuffle+RBA) generally improve performance.\n- Combination of Shuffle + RBA yields best results in most cases.\n- Some queries (e.g., Q19) resist optimization — potential area for further investigation.\n\n\n\n---\n\n✅ 此 Markdown 输出完整保留了原始图表的所有关键信息，包括坐标轴、图例、数据趋势、特殊点和结论，符合“合法 Markdown 格式”要求，且未重复用户问题。", "alignment": "left", "unique_id": "054b69398c65b3e6b5107accc893ed55", "edited": false, "extra": {}}, "target": {"markdown": "![054b69398c65b3e6b5107accc893ed55.jpeg](figures/054b69398c65b3e6b5107accc893ed55_3133d0f7.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "b484d439bdee5e8ba0717938a22647e7", "index": 130, "aliyun_index": 1, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 15: Compressed TPCH - speedup normalized to GTO warp scheduler & RR sub-core scheduler  \n\n", "text": "Fig. 15: Compressed TPCH - speedup normalized to GTO warp scheduler & RR sub-core scheduler\n", "alignment": "left", "unique_id": "b484d439bdee5e8ba0717938a22647e7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 15: Compressed TPCH - speedup normalized to GTO warp scheduler & RR sub-core scheduler"}], "lineHeigh ffle 仍低（≈0.15）。\n  - Query 10：Shuffle 略高（≈0.35），SRR 极低（≈0.1）。\n  - Query 16：Shuffle 达到峰值（≈0.3），SRR 仍低（≈0.1）。\n  - Query 22：Shuffle 几乎为 0，SRR 也极低（≈0.1）。\n\n### AVG（平均值）列：\n- **Baseline**：平均变异系数 ≈ 0.9\n- **SRR**：平均变异系数 ≈ 0.1\n- **Shuffle**：平均变异系数 ≈ 0.15\n\n→ 表明从整体来看，**SRR 是最稳定的方法**，其次是 Shuffle，Baseline 最不稳定。\n\n## 特殊注意点\n\n- 所有柱子均为垂直条形，无误差线。\n- X 轴标签 “AVG” 位于最右侧，代表对前 22 个查询结果的算术平均。\n- Y 轴标题 “Coefficient of Variation” 垂直书写，符合学术图表规范。\n- 图例位于右上角，清晰区分三种方法。\n\n## 结论性陈述（基于可视化）\n\n> 在该实验中，**SRR 方法在所有查询中表现出最低且最一致的变异系数**，显著优于 Baseline 和 Shuffle。Shuffle 方法虽总体稳定，但在某些查询（如 Q10, Q16）出现波动。Baseline 方法始终呈现高变异性，不适合作为稳定参考方案。\n\n---\n\n✅ 此 Markdown 文档完整还原了原始图表的结构、数值趋势、颜色编码及关键洞察，可用于报告、论文或演示文稿中的图文对应描述。\n\n--- \n\n如需进一步导出为表格形式或生成代码绘图脚本（如 Python Matplotlib / Seaborn），可继续提出需求。", "alignment": "left", "unique_id": "1f2889efd0682fd6e7cd2fa97517a92d", "edited": false, "extra": {}}, "target": {"markdown": "![1f2889efd0682fd6e7cd2fa97517a92d.jpeg](figures/1f2889efd0682fd6e7cd2fa97517a92d_3187de7a.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "7b402b8e2fa1c59bf30bd49940bd01c9", "index": 134, "aliyun_index": 5, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 17: Uncompressed TPCH - coefficient of variation of total instructions issued from each sub-core  \n\n", "text": "Fig. 17: Uncompressed TPCH - coefficient of variation of total instructions issued from each sub-core\n", "alignment": "left", "unique_id": "7b402b8e2fa1c59bf30bd49940bd01c9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 17: Uncompressed TPCH - coefficient of variation of total instructions issued from each sub-core"}], "lineHeight": 0}}, "target": {  **Baseline 与 Fully-Connected 在 100 SMs 处相交**，之后 Baseline 超过 Fully-Connected。  \n✅ **RBA+Shuffle 的优势随 SM 数量增加而扩大**，表明其可扩展性更好。\n\n---\n\n## 图表坐标轴标签\n\n- **X 轴**：`# SMs` —— 取值范围：80, 84, 88, 92, 96, 100, 104, 108  \n- **Y 轴**：`Speedup` —— 取值范围：1.0 至 1.4，刻度间隔 0.1\n\n---\n\n## 可视化建议（如需复现）\n\n```python\nimport matplotlib.pyplot as plt\n\nsm_counts = [80, 84, 88, 92, 96, 100, 104, 108]\nbaseline = [1.0, 1.03, 1.07, 1.10, 1.13, 1.15, 1.18, 1.21]\nfully_connected = [1.15] * len(sm_counts)\nrba_shuffle = [1.1, 1.16, 1.19, 1.22, 1.24, 1.29, 1.31, 1.32]\n\nplt.figure(figsize=(10, 5))\nplt.plot(sm_counts, baseline, 'o-', label='Baseline', color='blue')\nplt.axhline(y=1.15, linestyle='--', color='black', label='Fully-Connected (80 SMs)')\nplt.plot(sm_counts, rba_shuffle, 'o-', label='RBA+Shuffle', color='gray')\n\nplt.xlabel('# SMs')\nplt.ylabel('Speedup')\nplt.title('GPU Acceleration Performance Comparison')\nplt.legend()\nplt.grid(True, axis='y', alpha=0.3)\nplt.xticks(sm_counts)\nplt.ylim(1.0, 1.4)\nplt.show()\n```\n\n---\n\n## 结论摘要\n\n该图展示了三种不同 GPU 计算策略在不同流多处理器数量下的加速效果。**RBA+Shuffle 方法展现出最佳性能和良好的可扩展性**，尤其在高 SM 数量下优势显著，适合用于需要高效并行计算的场景。\n\n--- \n\n如需进一步导出为 CSV、JSON 或生成高清图像，请告知具体需求。", "alignment": "left", "unique_id": "1321e45a3138379e9b1f13ec47feb046", "edited": false, "extra": {}}, "target": {"markdown": "![1321e45a3138379e9b1f13ec47feb046.jpeg](figures/1321e45a3138379e9b1f13ec47feb046_0d105c40.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "1b00a6bb89daca455396a9d3623e92b3", "index": 136, "aliyun_index": 7, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 18: Geomean performance of compute bound applications over a 4 sub-core SM baseline  \n\n", "text": "Fig. 18: Geomean performance of compute bound applications over a 4 sub-core SM baseline\n", "alignment": "left", "unique : "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a larger increase in performance. The number of instructions"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "issued is a imperfect metric for measuring warp completion"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "times because many instructions take a different amount of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cycles to execute. For example, memory instructions can"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "take hundreds of cycles more than an arithmetic instruction,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "especially if misses occur in the cache hierarchy."}], "lineHeight": -202}}, "target": {"markdown": "core 指令发射不均衡程度的进一步增大并不总是对应着更大的性能提升。发射指令数并不是衡量 warp 完成时间的理想指标，因为许多指令执行所需的周期数各不相同。例如，访存指令相较于算术指令可能多耗费数百个周期，尤其是在缓存层次结构中出现缺失时。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "c9c764ce31b914b75ec5ecd078c6edad", "index": 138, "aliyun_index": 9, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# D. SM Sensitivity Study  \n\n", "text": "D. SM Sensitivity Study\n", "alignment": "left", "unique_id": "c9c764ce31b914b75ec5ecd078c6edad", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "D. SM Sensitivity Study"}], "lineHeight": 0}}, "target": {"markdown": "# D. SM 敏感性研究", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "60c5b2827cecd67630141b651cd24914", "index": 139, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "To evaluate the trade off between having fewer fully connected SMs or more partitioned SMs, we perform a sensitivity study that scales the number of partitioned SMs in our baseline. Figure 18 plots the performance of compute-bound applications that benefit from SM scaling and demonstrates that 100 partitioned SMs perform similar to 80 fully connected SMs. Our techniques reduce this value such that only 84 partitioned SMs are needed to match the performance of 80 fully connected SMs.  \n\n", "text": "To evaluate the trade off between having fewer fully connected SMs or more partitioned SMs, we perform a sensitivity study that scales the number of partitioned SMs in our baseline. Figure 18 plots the performance of compute-bound applications that benefit from SM scaling and demonstrates that 100 partitioned SMs perform similar to 80 fully connected SMs. Our techniques reduce this value such that only 84 partitioned SMs are needed to match the performance of 80 fully connected SMs.\n", "alignment": "left", "unique_id": "60c5b2827cecd67630141b651cd24914", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To evaluate the trade off between having fewer fully connected SMs or more partitioned SMs, we perform a sensitivity study that scales the number of partitioned SMs in our baseline. Figure 18 plots the performance of compute-bound applications that benefit from SM scaling and demonstrates that 100 partitioned SMs perform similar to 80 fully connected SMs. Our techniques reduce this value such that only 84 partitioned SMs are needed to match the performance of 80 fully connected SMs."}], "lineHeight": 0}}, "target": {"markdown": "为了评估使用较少的全连接 SM 与较多的分区 SM 之间的权衡，我们开展了一项敏感性研究，对基线中分区 SM 的数量进行缩放。图 18 展示了受益于 SM 扩展的受计算限制应用程序的性能，结果表明 100 个分区 SM 的性能与 80 个全连接 SM 的性能相近。我们所提出的技术降低了这一阈值，使得仅需 84 个分区 SM 即可达到与 80 个全连接 SM 相当的性能。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "7d77320568663b0af08b43b0032eb3fb", "index": 140, "aliyun_index": 11, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "# VII. Related Work  \n\n", "text": "VII. Related Work\n", "alignment": "left", "unique_id": "7d77320568663b0af08b43b0032eb3fb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VII. Related Work"}], "lineHeight": 0}}, "target": {"markdown": "# VII. 相关工作", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "98d6c0189e2f491768bae95b069db991", "index": 141, "aliyun_index": 12, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The performance impact of bank conflicts is well known and has been studied in the context of several different micro-architectural structures. In [44] the authors propose a method to avoid DRAM bank conflicts with a novel memory controller that duplicates select lines of data into multiple banks. Similarly in [26], the authors propose duplicating architectural registers into multiple banks to avoid read-operand bank conflicts. RBA differs from both of these designs because it avoids bank conflicts through scheduling rather than the explicit duplication of data across banks.  \n\n", "text": "The performance impact of bank conflicts is well known and has been studied in the context of several different micro-architectural structures. In [44] the authors propose a method to avoid DRAM bank conflicts with a novel memory controller that duplicates select lines of data into multiple banks. Similarly in [26], the authors propose duplicating architectural registers into multiple banks to avoid read-operand bank conflicts. RBA differs from both of these designs because it avoids bank conflicts through scheduling rather than the explicit duplication of data across banks.\n", "alignment": "left", "unique_id": "98d6c0189e2f491768bae95b069db991", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The performance impact of bank conflicts is well known and has been studied in the context of several different micro-architectural structures. In [44] the authors propose a method to avoid DRAM bank conflicts with a novel memory controller that duplicates select lines of data into multiple banks. Similarly in [26], the authors propose duplicating architectural registers into multiple banks to avoid read-operand bank conflicts. RBA differs from both of these designs because it avoids bank conflicts through scheduling rather than the explicit duplication of data across banks."}], "lineHeight": 0}}, "target": {"markdown": "存储体冲突对性能的影响已广为人知，并已在多种不同的微架构结构的背景下得到研究。在文献 [44] 中，作者提出了一种方法，通过一种新颖的内存控制器将部分数据行复制到多个存储体中，以避免 DRAM 存储体冲突。类似地，在文献 [26] 中，作者提出将架构寄存器复制到多个存储体中，以避免读操作数存储体冲突。RBA 与这两种设计均不同，因为它通过调度而非显式地在各存储体之间复制数据来避免存储体冲突。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "c5a15d605cba2dbcaddbd1e364b92496", "index": 142, "aliyun_index": 13, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In [58] the under-utilization caused by allocating and releasing SM resources at a thread block granularity was examined, and a mechanism to allocate and release resources at a warp granularity was proposed. Although the design allowed more warps to be assigned at a time to an SM, it did not adjust the assignment of those warps across multiple sub-cores. Moreover, their design left thread block management of shared memory intact. Shared memory is a driving force behind the sub-core balancing problem because sub-cores have a common shared memory space. Assigning thread blocks at the sub-core granularity would therefore require partitioning the shared memory and decreasing the maximum size available, or changing the programming model.  \n\n", "text": "In [58] the under-utilization caused by allocating and releasing SM resources at a thread block granularity was examined, and a mechanism to allocate and release resources at a warp granularity was proposed. Although the design allowed more warps to be assigned at a time to an SM, it did not adjust the assignment of those warps across multiple sub-cores. Moreover, their design left thread block management of shared memory intact. Shared memory is a driving force behind the sub-core balancing problem because sub-cores have a common shared memory space. Assigning thread blocks at the sub-core granularity would therefore require partitioning the shared memory and decreasing the maximum size available, or changing the programming model.\n", "alignment": "left", "unique_id": "c5a15d605cba2dbcaddbd1e364b92496", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In [58] the under-utilization caused by allocating and releasing SM resources at a thread block granularity was examined, and a mechanism to allocate and release resources at a warp granularity was proposed. Although the design allowed more warps to be assigned at a time to an SM, it did not adjust the assignment of those warps across multiple sub-cores. Moreover, their design left thread block management of shared memory intact. Shared memory is a driving force behind the sub-core balancing problem because sub-cores have a common shared memory space. Assigning thread blocks at the sub-core granularity would therefore require partitioning the shared memory and decreasing the maximum size available, or changing the programming model."}], "lineHeight": 0}}, "target": {"markdown": "文献 [58] 研究了以线程块粒度分配和释放 SM 资源所导致的利用率不足问题，并提出了一种以 warp 粒度分配和释放资源的机制。尽管该设计允许同时为 SM 分配更多的 warp，但它并未调整这些 warp 在多个子核心之间的分配。此外，其设计保留了基于线程块的共享内存管理方式。共享内存是子核心均衡问题背后的主要驱动力，因为子核心共享同一片共享内存空间。因此，若以子核心粒度分配线程块，就需要对共享内存进行划分，从而降低可用的最大容量，或者需要修改编程模型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "98b30b960a53250c1ab3707d1b78bd90", "index": 143, "aliyun_index": 14, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The authors of [46] propose coordination between multiple warp-schedulers to minimize idle time spent at barriers from warp-level-divergence. Warp scheduling policies can be used to effectively reduce the amount of inter-warp-divergence,  \n\n", "text": "The authors of [46] propose coordination between multiple warp-schedulers to minimize idle time spent at barriers from warp-level-divergence. Warp scheduling policies can be used to effectively reduce the amount of inter-warp-divergence,\n", "alignment": "left", "unique_id": "98b30b960a53250c1ab3707d1b78bd90", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The authors of [46] propose coordination between multiple warp-schedulers to minimize idle time spent at barriers from warp-level-divergence. Warp scheduling policies can be used to effectively reduce the amount of inter-warp-divergence,"}], "lineHeight": 0}}, "target": {"markdown": "文献 [46] 的作者提出在多个 warp 调度器之间进行协调，以最小化由 warp 级分歧导致的屏障等待空闲时间。warp 调度策略可被用于有效减少 warp 间分歧的程度，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "434efda7c1c2cdeb01dd48af9ce9a6cf", "index": 144, "aliyun_index": 0, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "however they cannot address fundamental programmatic imbalances between warps and sub-cores. A work stealing hardware structure seems like an obvious solution to the sub-core issue balancing problem [21]. It is possible to design a system to transfer a warp's context from one sub-core to another dynamically to maintain balanced execution. However, any work stealing based design would be forced to transfer the the register file state of all of the threads within the migrating warp. Since the register file is partitioned across the sub-cores and each thread maintains its own private register file state, such a transfer would be prohibitively expensive. A work stealing design would have a much higher implementation overhead than the hashed sub-core assignment discussed in this work. Random interleaving has been studied as a method to improve memory bandwidth [51] but has not been used for sub-core work assignment.  \n\n", "text": "however they cannot address fundamental programmatic imbalances between warps and sub-cores. A work stealing hardware structure seems like an obvious solution to the sub-core issue balancing problem [21]. It is possible to design a system to transfer a warp's context from one sub-core to another dynamically to maintain balanced execution. However, any work stealing based design would be forced to transfer the the register file state of all of the threads within the migrating warp. Since the register file is partitioned across the sub-cores and each thread maintains its own private register file state, such a transfer would be prohibitively expensive. A work stealing design would have a much higher implementation overhead than the hashed sub-core assignment discussed in this work. Random interleaving has been studied as a method to improve memory bandwidth [51] but has not been used for sub-core work assignment.\n", "alignment": "left", "unique_id": "434efda7c1c2cdeb01dd48af9ce9a6cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "however they cannot address fundamental programmatic imbalances between warps and sub-cores. A work stealing hardware structure seems like an obvious solution to the sub-core issue balancing problem [21]. It is possible to design a system to transfer a warp's context from one sub-core to another dynamically to maintain balanced execution. However, any work stealing based design would be forced to transfer the the register file state of all of the threads within the migrating warp. Since the register file is partitioned across the sub-cores and each thread maintains its own private register file state, such a transfer would be prohibitively expensive. A work stealing design would have a much higher implementation overhead than the hashed sub-core assignment discussed in this work. Random interleaving has been studied as a method to improve memory bandwidth [51] but has not been used for sub-core work assignment."}], "lineHeight": 0}}, "target": {"markdown": "然而，它们无法解决 warp 与子核心之间根本性的程序化不均衡问题。工作窃取硬件结构似乎是子核心均衡问题的一个显而易见的解决方案 [21]。可以设计一种系统，使 warp 的上下文能够在子核心之间动态迁移，从而维持执行的均衡。然而，任何基于工作窃取的设计都不得不迁移正在迁移的 warp 内所有线程的寄存器文件状态。由于寄存器文件在各子核心之间是分区的，并且每个线程都维护其各自的私有寄存器文件状态，因此这种迁移的开销将极其高昂。工作窃取设计的实现开销将远高于本文所讨论的基于哈希的子核心分配方法。随机交错作为一种提升内存带宽的方法已被研究 [51]，但尚未被用于子核心工作分配。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "3ba0ea0b1bc4d0e49dc5c32e158fa384", "index": 145, "aliyun_index": 1, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# VIII. Conclusion  \n\n", "text": "VIII. Conclusion\n", "alignment": "left", "unique_id": "3ba0ea0b1bc4d0e49dc5c32e158fa384", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VIII. Conclusion"}], "lineHeight": 0}}, "target": {"markdown": "# VIII. 结论", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": "[WinError 5] 拒绝访问。: 'C:\\\\Users\\\\dzx25\\\\Desktop\\\\workspace\\\\pdf_agent_translator\\\\out\\\\0x05.4\\\\document.json.tmp' -> 'C:\\\\Users\\\\dzx25\\\\Desktop\\\\workspace\\\\pdf_agent_translator\\\\out\\\\0x05.4\\\\document.json'", "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "c1d46c0625388abfbab9a5c1911234b3", "index": 146, "aliyun_index": 2, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "This work identified sub-core partitioning as a source of SM underutilization in several generations of modern GPU architectures. Issue imbalance stems from the distribution of warps within a thread block to discrete scheduler and execution blocks, and therefore cannot be resolved through alternative warp or thread block scheduling algorithms. Applications with high levels of warp-level-divergence are particularly susceptible to underutilization due to sub-core imbalance, such as those used in database query processing. A hardware mechanism to reduce the likelihood of pathological imbalances with hashed sub-core scheduling was proposed.  \n\n", "text": "This work identified sub-core partitioning as a source of SM underutilization in several generations of modern GPU architectures. Issue imbalance stems from the distribution of warps within a thread block to discrete scheduler and execution blocks, and therefore cannot be resolved through alternative warp or thread block scheduling algorithms. Applications with high levels of warp-level-divergence are particularly susceptible to underutilization due to sub-core imbalance, such as those used in database query processing. A hardware mechanism to reduce the likelihood of pathological imbalances with hashed sub-core scheduling was proposed.\n", "alignment": "left", "unique_id": "c1d46c0625388abfbab9a5c1911234b3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This work identified sub-core partitioning as a source of SM underutilization in several generations of modern GPU architectures. Issue imbalance stems from the distribution of warps within a thread block to discrete scheduler and execution blocks, and therefore cannot be resolved through alternative warp or thread block scheduling algorithms. Applications with high levels of warp-level-divergence are particularly susceptible to underutilization due to sub-core imbalance, such as those used in database query processing. A hardware mechanism to reduce the likelihood of pathological imbalances with hashed sub-core scheduling was proposed."}], "lineHeight": 0}}, "target": {"markdown": "本文将子核心分区识别为多代现代 GPU 架构中 SM 利用率不足的一个根源。指令发射不均衡源于线程块内的 warp 在离散调度器和执行块之间的分配方式，因此无法通过替代的 warp 或线程块调度算法加以解决。具有较高 warp 级分歧程度的应用程序（例如数据库查询处理中所使用的那些）尤其容易因子核心不均衡而导致利用率下降。本文提出了一种基于哈希的子核心调度硬件机制，以降低出现病态不均衡的可能性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "4d8651f70f16f22372c2c090d186d727", "index": 147, "aliyun_index": 3, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Additionally, the partitioning of register file and operand\ncollector structures has created bottlenecks in the read operand\nstage of several common GPU applications. A cost benefit\nanalysis of scaling collector units to reduce bank conflicts was\npresented. A register file bank aware warp scheduling design\nwas outlined to more efficiently utilize operand collector units\nwith a constrained amount of resources, such as those found\nin partitioned SMs.  \n\n", "text": "Additionally, the partitioning of register file and operand\ncollector structures has created bottlenecks in the read operand\nstage of several common GPU applications. A cost benefit\nanalysis of scaling collector units to reduce bank conflicts was\npresented. A register file bank aware warp scheduling design\nwas outlined to more efficiently utilize operand collector units\nwith a constrained amount of resources, such as those found\nin partitioned SMs.\n", "alignment": "left", "unique_id": "4d8651f70f16f22372c2c090d186d727", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Additionally, the partitioning of register file and operand"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "collector structures has created bottlenecks in the read operand"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "stage of several common GPU applications. A cost benefit"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "analysis of scaling collector units to reduce bank conflicts was"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "presented. A register file bank aware warp scheduling design"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "was outlined to more efficiently utilize operand collector units"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "with a constrained amount of resources, such as those found"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in partitioned SMs."}], "lineHeight": -230}}, "target": {"markdown": "此外，寄存器文件和操作数收集器结构的分区已在多种常见 GPU 应用的读操作数阶段造成了瓶颈。本文针对扩展收集器单元以减少存储体冲突的成本效益进行了分析，并概述了一种寄存器文件存储体感知的 warp 调度设计，以便在资源受限（例如分区 SM 中所遇到的资源约束）的条件下更高效地利用操作数收集器单元。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "f5deacbae894c70c42026855ee04c3a2", "index": 148, "aliyun_index": 4, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "# ACKNOWLEDGMENT  \n\n", "text": "ACKNOWLEDGMENT\n", "alignment": "left", "unique_id": "f5deacbae894c70c
