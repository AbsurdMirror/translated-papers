n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "f048294532c9d732b4b402a6a9c0fcc6", "index": 38, "aliyun_index": 12, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 4: FMA microbenchmark thread block warp layout\n(red : compute, green : empty)  \n\n", "text": "Fig. 4: FMA microbenchmark thread block warp layout\n(red : compute, green : empty)\n", "alignment": "left", "unique_id": "f048294532c9d732b4b402a6a9c0fcc6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 4: FMA microbenchmark thread block warp layout"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(red : compute, green : empty)"}], "lineHeight": -60}}, "target": {"markdown": ">图 4：FMA 微基准测试的线程块 warp 布局\n（红色：计算，绿色：空）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "d2015dc0a42c9752dc2f9f2aba57f65b", "index": 39, "aliyun_index": 13, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "processing register file accesses from several warps simultaneously. By processing multiple instructions at once, the Operand Collector hides bank conflicts from a single instruction by processing register file requests for other instructions. Figure 2 shows a block diagram of a baseline Operand Collector which can process two instructions from different warps at once, similar to the Nvidia V100 model. Each Collector Unit (CU) holds state for a single warp instruction and is allocated upon warp scheduler issue. The CU maintains an operand entry for each operand necessary to execute the instruction. Each operand entry contains a ready bit, valid bit, register id, and 32 four-byte data fields (one for each thread in a warp). Upon allocation, CU source operand read requests are sent to the arbitration unit which maintains a queue of read requests for each of the banks. The arbitration unit grants one request for each bank per cycle. When all of the operand entries of a CU are ready, the CU instruction is dispatched to the appropriate SIMD execution unit. The CU is then deallocated and can be filled with a new instruction.  \n\n", "text": "processing register file accesses from several warps simultaneously. By processing multiple instructions at once, the Operand Collector hides bank conflicts from a single instruction by processing register file requests for other instructions. Figure 2 shows a block diagram of a baseline Operand Collector which can process two instructions from different warps at once, similar to the Nvidia V100 model. Each Collector Unit (CU) holds state for a single warp instruction and is allocated upon warp scheduler issue. The CU maintains an operand entry for each operand necessary to execute the instruction. Each operand entry contains a ready bit, valid bit, register id, and 32 four-byte data fields (one for each thread in a warp). Upon allocation, CU source operand read requests are sent to the arbitration unit which maintains a queue of read requests for each of the banks. The arbitration unit grants one request for each bank per cycle. When all of the operand entries of a CU are ready, the CU instruction is dispatched to the appropriate SIMD execution unit. The CU is then deallocated and can be filled with a new instruction.\n", "alignment": "left", "unique_id": "d2015dc0a42c9752dc2f9f2aba57f65b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "processing register file accesses from several warps simultaneously. By processing multiple instructions at once, the Operand Collector hides bank conflicts from a single instruction by processing register file requests for other instructions. Figure 2 shows a block diagram of a baseline Operand Collector which can process two instructions from different warps at once, similar to the Nvidia V100 model. Each Collector Unit (CU) holds state for a single warp instruction and is allocated upon warp scheduler issue. The CU maintains an operand entry for each operand necessary to execute the instruction. Each operand entry contains a ready bit, valid bit, register id, and 32 four-byte data fields (one for each thread in a warp). Upon allocation, CU source operand read requests are sent to the arbitration unit which maintains a queue of read requests for each of the banks. The arbitration unit grants one request for each bank per cycle. When all of the operand entries of a CU are ready, the CU instruction is dispatched to the appropriate SIMD execution unit. The CU is then deallocated and can be filled with a new instruction."}], "lineHeight": 0}}, "target": {"markdown": "同时处理来自多个 warp 的寄存器文件访问。通过一次处理多条指令，操作数收集器可以在处理其他指令的寄存器文件请求的同时，将单条指令的体冲突隐藏起来。图 2 展示了基线操作数收集器的框图，它能够同时处理来自不同 warp 的两条指令，类似于 Nvidia V100 模型。每个收集单元（CU）保存单条 warp 指令的状态，并在 warp 调度器发射时被分配。CU 为执行该指令所需的每个操作数维护一个操作数条目。每个操作数条目包含一个就绪位、有效位、寄存器标识以及 32 个四字节数据字段（对应 warp 中的每个线程）。在分配时，CU 的源操作数读取请求被发送到仲裁单元，仲裁单元为每个体维护一个读取请求队列。仲裁单元在每个周期内为每个体授予一个请求。当 CU 的所有操作数条目就绪后，CU 指令便被分派到相应的 SIMD 执行单元。随后，CU 被回收，可用于装载新的指令。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "2a96c45d9bd69d9f0457a4124dea5659", "index": 40, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Modern GPUs partition the SM register file into separate structures to improve power and area efficiency. These smaller register file structures typically have a small number of banks. For example, the Ampere A100 and Volta V100 have only two register file banks per sub-core, while previous fully connected architectures had four [34], [35]. Decreasing the number of banks increases the likelihood of bank conflicts. The operand collector, and its associated CUs, are also partitioned among the sub-cores which decreases its capacity to hide bank conflicts. We found several applications highly sensitive to register file throughput, and evaluated the effects of CU scaling and a novel bank-aware warp scheduler in section VI-B.  \n\n", "text": "Modern GPUs partition the SM register file into separate structures to improve power and area efficiency. These smaller register file structures typically have a small number of banks. For example, the Ampere A100 and Volta V100 have only two register file banks per sub-core, while previous fully connected architectures had four [34], [35]. Decreasing the number of banks increases the likelihood of bank conflicts. The operand collector, and its associated CUs, are also partitioned among the sub-cores which decreases its capacity to hide bank conflicts. We found several applications highly sensitive to register file throughput, and evaluated the effects of CU scaling and a novel bank-aware warp scheduler in section VI-B.\n", "alignment": "left", "unique_id": "2a96c45d9bd69d9f0457a4124dea5659", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Modern GPUs partition the SM register file into separate structures to improve power and area efficiency. These smaller register file structures typically have a small number of banks. For example, the Ampere A100 and Volta V100 have only two register file banks per sub-core, while previous fully connected architectures had four [34], [35]. Decreasing the number of banks increases the likelihood of bank conflicts. The operand collector, and its associated CUs, are also partitioned among the sub-cores which decreases its capacity to hide bank conflicts. We found several applications highly sensitive to register file throughput, and evaluated the effects of CU scaling and a novel bank-aware warp scheduler in section VI-B."}], "lineHeight": 0}}, "target": {"markdown": "现代 GPU 将 SM 寄存器文件划分为独立的结构，以提高功耗和面积效率。这些较小的寄存器文件结构通常只有少量体（bank）。例如，Ampere A100 和 Volta V100 每个子核心仅有 2 个寄存器文件体，而早期的全连接架构则有 4 个 [34]、[35]。减少体的数量会增加体冲突的可能性。操作数收集器及其关联的 CU 同样在各子核心之间进行划分，这削弱了其隐藏体冲突的能力。我们发现若干应用对寄存器文件吞吐量非常敏感，并在第 VI-B 节评估了 CU 扩展以及一种新颖的体感知 warp 调度器的影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "499b932b80cbfa58d3269584ee94bee7", "index": 41, "aliyun_index": 15, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "# B. Issue Imbalance  \n\n", "text": "B. Issue Imbalance\n", "alignment": "left", "unique_id": "499b932b80cbfa58d3269584ee94bee7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Issue Imbalance"}], "lineHeight": 0}}, "target": {"markdown": "## B. 发射不均衡", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "56d7ce8891ccb237fd86e3bbafe1db43", "index": 42, "aliyun_index": 16, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "In this work we identify two key characteristics of the sub-core warp assignment mechanism used in modern GPU hardware. First, a simple round-robin warp assignment scheme is used to assign warps to sub-cores. Second, the assignment of warps to sub-cores is static; once a warp is assigned to a sub-core it cannot be re-assigned to execute on a different sub-  \n\n", "text": "In this work we identify two key characteristics of the sub-core warp assignment mechanism used in modern GPU hardware. First, a simple round-robin warp assignment scheme is used to assign warps to sub-cores. Second, the assignment of warps to sub-cores is static; once a warp is assigned to a sub-core it cannot be re-assigned to execute on a different sub-\n", "alignment": "left", "unique_id": "56d7ce8891ccb237fd86e3bbafe1db43", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this work we identify two key characteristics of the sub-core warp assignment mechanism used in modern GPU hardware. First, a simple round-robin warp assignment scheme is used to assign warps to sub-cores. Second, the assignment of warps to sub-cores is static; once a warp is assigned to a sub-core it cannot be re-assigned to execute on a different sub-"}], "lineHeight": 0}}, "target": {"markdown": "本文中我们识别出现代 GPU 硬件中所采用的子核心 warp 分配机制的两个关键特性。首先，使用一种简单的轮询（round-robin）warp 分配方案将 warp 分配到子核心。其次，warp 到子核心的分配是静态的；一旦某个 warp 被分配到某个子核心，便不能再被重新分配到其他子核心", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "504522dba82d06f271876e9105c2daa4", "index": 43, "aliyun_index": 0, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "core. Resources allocated to a warp can only be freed once the entire thread block the warp belongs to has completed because the programming model guarantees access to a common on-chip shared memory scratch-pad for the entire thread block. Hardware underutilization occurs when a warp assigned to a sub-core has completed execution but cannot be deallocated because it belongs to a thread block still executing on other sub-cores. If all of the warps a sub-core is assigned are in such a state the entire sub-core will stall. In this manner, static assignment leads to substantial performance loss whenever warps are improperly balanced across sub-cores.  \n\n", "text": "core. Resources allocated to a warp can only be freed once the entire thread block the warp belongs to has completed because the programming model guarantees access to a common on-chip shared memory scratch-pad for the entire thread block. Hardware underutilization occurs when a warp assigned to a sub-core has completed execution but cannot be deallocated because it belongs to a thread block still executing on other sub-cores. If all of the warps a sub-core is assigned are in such a state the entire sub-core will stall. In this manner, static assignment leads to substantial performance loss whenever warps are improperly balanced across sub-cores.\n", "alignment": "left", "unique_id": "504522dba82d06f271876e9105c2daa4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "core. Resources allocated to a warp can only be freed once the entire thread block the warp belongs to has completed because the programming model guarantees access to a common on-chip shared memory scratch-pad for the entire thread block. Hardware underutilization occurs when a warp assigned to a sub-core has completed execution but cannot be deallocated because it belongs to a thread block still executing on other sub-cores. If all of the warps a sub-core is assigned are in such a state the entire sub-core will stall. In this manner, static assignment leads to substantial performance loss whenever warps are improperly balanced across sub-cores."}], "lineHeight": 0}}, "target": {"markdown": "上执行。分配给某个 warp 的资源只有在它所属的整个线程块执行完毕后才能被释放，因为编程模型保证整个线程块都能访问片上共享存储器的暂存区（scratch-pad）。当分配到某个子核心的 warp 已执行完毕，但由于其所属线程块仍在其他子核心上运行而无法被回收时，就会出现硬件利用率不足的情况。如果某个子核心所分配的所有 warp 都处于这种状态，那么整个子核心就会停顿。当 warp 在各子核心之间分配不均衡时，静态分配方式会导致显著的性能损失。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "54f7efe524ca496a687a8bac954b19b8", "index": 44, "aliyun_index": 1, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Figure 3 shows the performance loss due to sub-core imbalance of a microbenchmark run on three generations of Nvidia GPU hardware. Figure 4 shows the thread block warp layout of each of the three applications. A warp is a group of 32 threads that execute in lock-step, and $warpID = \\lfloor threadID/32 \\rfloor$. The baseline application includes 256 threads (8 warps) per thread block. Each thread performs 4096 fused multiply add (FMA) instructions on data resident in the register file then waits at a thread-block-wide barrier before exiting. The balanced and unbalanced applications also have 8 warps per thread block performing fused-multiply-add instructions in the same manner as the baseline application, however 768 \"empty\" threads (24 warps) are additionally included in the thread block. Each empty thread simply waits at the barrier and then exits, without performing any calculation. Warps from a thread block are assigned to a sub-core in sequential order using round robin scheduling, therefore each column in figure 4 will be assigned to a different sub-core on architectures with 4 subcores per SM.  \n\n", "text": "Figure 3 shows the performance loss due to sub-core imbalance of a microbenchmark run on three generations of Nvidia GPU hardware. Figure 4 shows the thread block warp layout of each of the three applications. A warp is a group of 32 threads that execute in lock-step, and $warpID = \\lfloor threadID/32 \\rfloor$. The baseline application includes 256 threads (8 warps) per thread block. Each thread performs 4096 fused multiply add (FMA) instructions on data resident in the register file then waits at a thread-block-wide barrier before exiting. The balanced and unbalanced applications also have 8 warps per thread block performing fused-multiply-add instructions in the same manner as the baseline application, however 768 \"empty\" threads (24 warps) are additionally included in the thread block. Each empty thread simply waits at the barrier and then exits, without performing any calculation. Warps from a thread block are assigned to a sub-core in sequential order using round robin scheduling, therefore each column in figure 4 will be assigned to a different sub-core on architectures with 4 subcores per SM.\n", "alignment": "left", "unique_id": "54f7efe524ca496a687a8bac954b19b8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3 shows the performance loss due to sub-core imbalance of a microbenchmark run on three generations of Nvidia GPU hardware. Figure 4 shows the thread block warp layout of each of the three applications. A warp is a group of 32 threads that execute in lock-step, and $warpID = \\lfloor threadID/32 \\rfloor$. The baseline application includes 256 threads (8 warps) per thread block. Each thread performs 4096 fused multiply add (FMA) instructions on data resident in the register file then waits at a thread-block-wide barrier before exiting. The balanced and unbalanced applications also have 8 warps per thread block performing fused-multiply-add instructions in the same manner as the baseline application, however 768 \"empty\" threads (24 warps) are additionally included in the thread block. Each empty thread simply waits at the barrier and then exits, without performing any calculation. Warps from a thread block are assigned to a sub-core in sequential order using round robin scheduling, therefore each column in figure 4 will be assigned to a different sub-core on architectures with 4 subcores per SM."}], "lineHeight": 0}}, "target": {"markdown": "图 3 展示了在三代 Nvidia GPU 硬件上运行的微基准测试中，由于子核心负载不均衡所导致的性能损失。图 4 展示了三个应用的线程块 warp 布局。warp 是以锁步（lock-step）方式执行的 32 个线程组，且 $warpID = \\lfloor threadID/32 \\rfloor$。基线应用在每个线程块中包含 256 个线程（8 个 warp）。每个线程对驻留在寄存器文件中的数据执行 4096 条融合乘加（FMA）指令，然后在整个线程块范围的屏障（barrier）处等待，最后退出。均衡与不均衡的应用同样在每个线程块中包含 8 个 warp，以与基线应用相同的方式执行融合乘加指令，但在线程块中额外加入了 768 个\"空\"线程（24 个 warp）。每个空线程仅在屏障处等待然后退出，而不执行任何计算。线程块中的 warp 使用轮询调度（round robin）按顺序分配到子核心，因此对于每个 SM 包含 4 个子核心的架构，图 4 中每一列将被分配到不同的子核心。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "a026c4d19003bcb701d217cd4bce3ee0", "index": 45, "aliyun_index": 2, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![a026c4d19003bcb701d217cd4bce3ee0.jpeg](figures/a026c4d19003bcb701d217cd4bce3ee0_214a3434.png)  \n\n", "text": "+-----------------------------------------------+\n|               Instruction Cache               |\n+-------------------+---------------------------+\n| Scheduler         | Scheduler                 |\n| Dispatch          | Dispatch                  |\n| Dispatch          | Dispatch                  |\n+-------------------+---------------------------+\n| Scheduler         | Scheduler                 |\n| Dispatch          | Dispatch                  |\n| Dispatch          | Dispatch                  |\n+-------------------+---------------------------+\n|              Register File                    |\n+-----------------------------------------------+\n|             Execution Cores                   |\n|                                               |\n|                                               |\n|                                               |\n+-----------------------------------------------+\n|              Shared Memory                    |\n+-----------------------------------------------+\n|               Data Cache                      |\n+-----------------------------------------------+\n\n+----------------------------------+\n|        L1 Instr. Cache           |\n+----------------------------------+\n|       Warp Scheduler             |\n|       Dispatch                   |\n|       Register File              |\n|       Execution Cores            |\n+----------------------------------+\n\n+----------------------------------+\n|        L1 Instr. Cache           |\n+----------------------------------+\n|       Warp Scheduler             |\n|       Dispatch                   |\n|       Register File              |\n|       Execution Cores            |\n+----------------------------------+\n\n+----------------------------------+\n|        L1 Instr. Cache           |\n+----------------------------------+\n|       Warp Scheduler             |\n|       Dispatch                   |\n|       Register File              |\n|       Execution Cores            |\n+----------------------------------+\n\n+----------------------------------+\n|        L1 Instr. Cache           |\n+----------------------------------+\n|       Warp Scheduler             |\n|       Dispatch                   |\n|       Register File              |\n|       Execution Cores            |\n+----------------------------------+\n\n+-----------------------------------------------+\n|     L1 Data Cache / Shared Memory             |\n+-----------------------------------------------+\n\n\n\n> **Note**: Each Sub-Core (0–3) is an independent processing unit with its own L1 Instruction Cache, Warp Scheduler, Dispatch, Register File, and Execution Cores. All sub-cores share a common L1 Data Cache / Shared Memory layer at the bottom.\n\n---\n\n## Structural Summary\n\n| Component              | Kepler                          | Ampere                             |\n|------------------------|----------------------------------|------------------------------------|\n| Top-level cache        | Single Instruction Cache         | Per-sub-core L1 Instr. Cache       |\n| Scheduling Units       | 4× (Scheduler + Dispatch pairs)  | 4× Warp Scheduler + Dispatch per sub-core |\n| Register File          | One global register file         | One per sub-core                   |\n| Execution Cores        | One large block                  | One per sub-core                   |\n| Shared Memory/Data     | Separate Shared Memory & Data Cache | Combined L1 Data Cache / Shared Memory |\n| Granularity            | Monolithic core design           | Modular sub-core design            |\n\n---\n\n✅ This Markdown representation preserves:\n- Hierarchical structure of each architecture\n- Component names and their grouping\n- Visual layout implications (e.g., 2x2 scheduler grid in Kepler, 4 isolated sub-cores in Ampere)\n- Shared vs. private resource distinctions\n- Labels for diagrams (a) and (b)\n\nNo information from the original image has been omitted or altered beyond formatting for Markdown compatibility.", "alignment": "left", "unique_id": "a026c4d19003bcb701d217cd4bce3ee0", "edited": false, "extra": {}}, "target": {"markdown": "![a026c4d19003bcb701d217cd4bce3ee0.jpeg](figures/a026c4d19003bcb701d217cd4bce3ee0_214a3434.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "7fdaea9e14ce8fb4d8035f6fda5930a8", "index": 46, "aliyun_index": 3, "page_num": 3, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 5: Nvidia SM architectures  \n\n", "text": "Fig. 5: Nvidia SM architectures\n", "alignment": "left", "unique_id": "7fdaea9e14ce8fb4d8035f6fda5930a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 5: Nvidia SM architectures"}], "lineHeight": 0}}, "target": {"markdown": ">图 5：Nvidia SM 架构", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "66cfca34ab44d6ad50447863a706d395", "index": 47, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The results in figure 3 are normalized to the baseline application and indicate that the A100 takes 3.9 times longer to execute when the computation is imbalanced to a single sub-core. The balanced application achieves performance equal to the baseline application which indicates the performance difference is solely due to differences in sub-core balancing. Figure 5 shows the SM block diagrams for Ampere and Kepler architectures. The Ampere SM architecture contains 4 sub-cores per SM [3] while the Kepler architecture has no partitioning [9]. Due to the lack of partitioning in the Kepler architecture no performance difference is seen across the three applications in figure 3. Hopper, Ampere, Turing,  \n\n", "text": "The results in figure 3 are normalized to the baseline application and indicate that the A100 takes 3.9 times longer to execute when the computation is imbalanced to a single sub-core. The balanced application achieves performance equal to the baseline application which indicates the performance difference is solely due to differences in sub-core balancing. Figure 5 shows the SM block diagrams for Ampere and Kepler architectures. The Ampere SM architecture contains 4 sub-cores per SM [3] while the Kepler architecture has no partitioning [9]. Due to the lack of partitioning in the Kepler architecture no performance difference is seen across the three applications in figure 3. Hopper, Ampere, Turing,\n", "alignment": "left", "unique_id": "66cfca34ab44d6ad50447863a706d395", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The results in figure 3 are normalized to the baseline application and indicate that the A100 takes 3.9 times longer to execute when the computation is imbalanced to a single sub-core. The balanced application achieves performance equal to the baseline application which indicates the performance difference is solely due to differences in sub-core balancing. Figure 5 shows the SM block diagrams for Ampere and Kepler architectures. The Ampere SM architecture contains 4 sub-cores per SM [3] while the Kepler architecture has no partitioning [9]. Due to the lack of partitioning in the Kepler architecture no performance difference is seen across the three applications in figure 3. Hopper, Ampere, Turing,"}], "lineHeight": 0}}, "target": {"markdown": "图 3 中的结果以基线应用为基准进行了归一化，表明在 A100 上，当计算任务负载集中到单个子核心时，其执行时间长达基线的 3.9 倍。均衡应用达到了与基线应用相同的性能，这表明性能差异完全源于子核心负载均衡的差异。图 5 展示了 Ampere 与 Kepler 架构的 SM 框图。Ampere SM 架构每个 SM 包含 4 个子核心 [3]，而 Kepler 架构则不存在划分 [9]。由于 Kepler 架构不存在划分，图 3 中三个应用之间没有表现出性能差异。Hopper、Ampere、Turing、", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "ad60aee4944f11aa14c83d1cbe148a37", "index": 48, "aliyun_index": 5, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![ad60aee4944f11aa14c83d1cbe148a37.jpeg](figures/ad60aee4944f11aa14c83d1cbe148a37_ca999db4.png)  \n\n", "text": "min{a[0..1]} → min{a[0..3]} → ... → min{a[0..31]}\n\n\n\nEach comparator selects the smaller of two inputs, forming a binary reduction tree.\n\n> This logic likely implements priority or scoring-based selection among warps.\n\n---\n\n## 4. Arbitration Unit (Top Left)\nHandles multiple valid/ready handshakes:\n- Inputs: `valid/ready 1`, `valid/ready 2`, ..., `valid/ready n`\n- Output: `Req. Q. Length` → feeds into **scoring logic**\n- Question bubble:  \n  > **“How many valid requests?”** → indicates dynamic counting of active warp requests.\n\n---\n\n## 5. RBA Scoring Logic ()\n- Receives `Req. Queue Lengths` from Arbitration Unit.\n- Computes `rba score` for each entry in the request queue.\n- Feeds scores into the **Warp PC Table (③)** for selection prioritization.\n- Also receives feedback from **Operand Collector (⑦)** via red arrow (possibly for stall/backpressure signaling).\n\n---\n\n## 6. Operand Collector ()\nComposed of:\n- **⑧ Arbit. Unit 0** → connects to **RF Bank 0**\n- **Arbit. Unit 1** → connects to **RF Bank 1**\n- Both RF Banks feed into an **Xbar (crossbar switch)**\n- Xbar routes operands to ** Collector Units (CUs)**\n\n### Feedback Loop:\n- CUs send back signals to Arbitration Units (via upward arrows), possibly indicating readiness or completion.\n- Label **a**: “Bank Read Requests (ready-valid handshake)” — indicates communication protocol between operand collector and register file banks.\n\n---\n\n## Data Flow Summary\n\n1. **Request Queue Entries (①)** are scored by **RBA Scoring Logic ()** using queue length info from **Arbitration Unit**.\n2. Scored entries populate **Warp PC Table (③)**.\n3. **Warp Selection Logic (④)** uses comparator tree (⑤) to select highest-priority warp.\n4. Selected warp allocates resources in **Collector Units (⑥)**.\n5. **Operand Collector (⑦)** fetches required operands via arbitration units and RF banks, routed through crossbar.\n6. Ready-valid handshakes (label **a**) coordinate data movement between banks and collectors.\n7. Feedback paths (red arrows) allow backpressure or status updates from operand collection stage to scoring/arbitration stages.\n\n---\n\n## Key Components Legend\n\n| Number | Component                     | Function |\n|--------|-------------------------------|----------|\n| ①      | Entry layout                  | Request queue entry format |\n| ②      | Warp Issue Scheduler          | Main scheduler block |\n|       | 16-entry Fully Assoc. Warp PC Table | Stores warp PCs for scheduling |\n| ④      | Warp Selection Logic          | Chooses next warp to issue |\n|       | Implementation of warp selection logic | Comparator tree for min-finding |\n| ⑥      | Collector Units (CUs)         | Collects operands for execution |\n| ⑦      | Operand Collector             | Manages operand fetching from RF |\n| ⑧      | Arbit. Unit 0 / 1             | Arbitrates access to RF banks |\n| ⑨      | RBA Scoring Logic             | Scores warps based on queue state |\n| a      | Bank Read Requests            | Ready-valid handshake with RF banks |\n| b      | How many valid requests?      | Dynamic count used for scoring |\n\n---\n\n## Notes\n\n- The architecture supports **dynamic warp scheduling** based on runtime conditions (queue lengths, operand availability).\n- Uses **fully associative table** for flexible warp mapping.\n- Employs **tree-based minimization** for efficient hardware implementation of selection logic.\n- Includes **feedback mechanisms** for flow control and resource coordination.\n\n--- \n\n✅ All elements from the diagram have been extracted and structured without omission or duplication.", "alignment": "left", "unique_id": "ad60aee4944f11aa14c83d1cbe148a37", "edited": false, "extra": {}}, "target": {"markdown": "![ad60aee4944f11aa14c83d1cbe148a37.jpeg](figures/ad60aee4944f11aa14c83d1cbe148a37_ca999db4.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "4b59570f23583a4f916d7bf84becc617", "index": 49, "aliyun_index": 6, "page_num": 3, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 6: Register bank aware (RBA) warp scheduler  \n\n", "text": "Fig. 6: Register bank aware (RBA) warp scheduler\n", "alignment": "left", "unique_id": "4b59570f23583a4f916d7bf84becc617", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 6: Register bank aware (RBA) warp scheduler"}], "lineHeight": 0}}, "target": {"markdown": ">图 6：寄存器体感知（RBA）warp 调度器", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "bc7ab42d0727f85b7b368e44995a1fae", "index": 50, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Volta, Pascal, and Maxwell architectures all feature 2 to 4 subcores per SM [3]–[8], and are therefore susceptible to sub-core imbalances. Although real GPU applications may not have empty warps to cause such a stark imbalance, computational variations between warps within a thread block can cause them to finish at significantly different times [58]. We refer to this imbalance between warp finish times within a thread block as inter-warp-divergence. Inter-warp-divergence is not to be confused with intra-warp-divergence, which refers to threads within a warp taking different control flow paths.  \n\n", "text": "Volta, Pascal, and Maxwell architectures all feature 2 to 4 subcores per SM [3]–[8], and are therefore susceptible to sub-core imbalances. Although real GPU applications may not have empty warps to cause such a stark imbalance, computational variations between warps within a thread block can cause them to finish at significantly different times [58]. We refer to this imbalance between warp finish times within a thread block as inter-warp-divergence. Inter-warp-divergence is not to be confused with intra-warp-divergence, which refers to threads within a warp taking different control flow paths.\n", "alignment": "left", "unique_id": "bc7ab42d0727f85b7b368e44995a1fae", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Volta, Pascal, and Maxwell architectures all feature 2 to 4 subcores per SM [3]–[8], and are therefore susceptible to sub-core imbalances. Although real GPU applications may not have empty warps to cause such a stark imbalance, computational variations between warps within a thread block can cause them to finish at significantly different times [58]. We refer to this imbalance between warp finish times within a thread block as inter-warp-divergence. Inter-warp-divergence is not to be confused with intra-warp-divergence, which refers to threads within a warp taking different control flow paths."}], "lineHeight": 0}}, "target": {"markdown": "Volta、Pascal 和 Maxwell 架构每个 SM 都包含 2 到 4 个子核心 [3]–[8]，因此同样容易受到子核心负载不均衡的影响。尽管真实 GPU 应用中可能不存在导致如此严重不均衡的\"空\"warp，但线程块内不同 warp 之间的计算量差异仍可能导致它们在显著不同的时间完成 [58]。我们将线程块内 warp 完成时间之间的这种不均衡称为 warp 间发散（inter-warp-divergence）。warp 间发散不应与 warp 内发散（intra-warp-divergence）混淆，后者指的是同一 warp 内的线程走不同的控制流路径。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "52aa9cfebd9c98ba41727847809048ee", "index": 51, "aliyun_index": 8, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "# IV. SCHEDULING ARCHITECTURES  \n\n", "text": "IV. SCHEDULING ARCHITECTURES\n", "alignment": "left", "unique_id": "52aa9cfebd9c98ba41727847809048ee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "IV. SCHEDULING ARCHITECTURES"}], "lineHeight": 0}}, "target": {"markdown": "## IV. 调度架构", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "8e918a0b3dafaea64ed9f56ed6d727cf", "index": 52, "aliyun_index": 9, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "# A. Register Bank Aware Warp Scheduling  \n\n", "text": "A. Register Bank Aware Warp Scheduling\n", "alignment": "left", "unique_id": "8e918a0b3dafaea64ed9f56ed6d727cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Register Bank Aware Warp Scheduling"}], "lineHeight": 0}}, "target": {"markdown": "## A. 寄存器体感知 warp 调度", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "42fb7a5bb34fe29a1aa46c7dbd1a0fcc", "index": 53, "aliyun_index": 10, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Sub-core partitioning has led to the reduction in the number of CUs and register banks available to each warp instruction [34]. These effects have increased pressure on the compiler to avoid register bank conflicts, causing some applications to become limited by the read operand stage (see section VI-B). Increasing the number of CUs is an effective way to improve effective throughput and register file utilization, but comes at a high cost of area and power. Scaling the amount of register file banking is similarly expensive for both area and power [36]. In light of these factors, we propose a Register-Bank-Aware (RBA) warp scheduler, which prioritizes warps that access register file banks with the fewest pending access requests.  \n\n", "text": "Sub-core partitioning has led to the reduction in the number of CUs and register banks available to each warp instruction [34]. These effects have increased pressure on the compiler to avoid register bank conflicts, causing some applications to become limited by the read operand stage (see section VI-B). Increasing the number of CUs is an effective way to improve effective throughput and register file utilization, but comes at a high cost of area and power. Scaling the amount of register file banking is similarly expensive for both area and power [36]. In light of these factors, we propose a Register-Bank-Aware (RBA) warp scheduler, which prioritizes warps that access register file banks with the fewest pending access requests.\n", "alignment": "left", "unique_id": "42fb7a5bb34fe29a1aa46c7dbd1a0fcc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sub-core partitioning has led to the reduction in the number of CUs and register banks available to each warp instruction [34]. These effects have increased pressure on the compiler to avoid register bank conflicts, causing some applications to become limited by the read operand stage (see section VI-B). Increasing the number of CUs is an effective way to improve effective throughput and register file utilization, but comes at a high cost of area and power. Scaling the amount of register file banking is similarly expensive for both area and power [36]. In light of these factors, we propose a Register-Bank-Aware (RBA) warp scheduler, which prioritizes warps that access register file banks with the fewest pending access requests."}], "lineHeight": 0}}, "target": {"markdown": "子核心划分导致每个 warp 指令可用的 CU 和寄存器体数量减少 [34]。这些效应给编译器带来了更大的压力，以避免寄存器体冲突，导致某些应用受到读操作数阶段的限制（见第 VI-B 节）。增加 CU 数量是提升有效吞吐量和寄存器文件利用率的有效手段，但会带来较大的面积和功耗开销。同样地，扩展寄存器文件体划分也会在面积和功耗上付出高昂代价 [36]。鉴于这些因素，我们提出了一种寄存器体感知（RBA）warp 调度器，该调度器优先调度访问寄存器体中未决访问请求最少的 warp。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "eb8d607fb9654c12ce089f40e95bc5fc", "index": 54, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Figure 6 outlines the key structures of the RBA design. The additional or modified hardware required to support RBA scheduling is shown in red. Non-red structures are part of the baseline design. For each ready warp instruction, we define its RBA score (①) as the sum of queue lengths of each of its operands. The RBA score is 5 bits wide and  \n\n", "text": "Figure 6 outlines the key structures of the RBA design. The additional or modified hardware required to support RBA scheduling is shown in red. Non-red structures are part of the baseline design. For each ready warp instruction, we define its RBA score (①) as the sum of queue lengths of each of its operands. The RBA score is 5 bits wide and\n", "alignment": "left", "unique_id": "eb8d607fb9654c12ce089f40e95bc5fc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 6 outlines the key structures of the RBA design. The additional or modified hardware required to support RBA scheduling is shown in red. Non-red structures are part of the baseline design. For each ready warp instruction, we define its RBA score (①) as the sum of queue lengths of each of its operands. The RBA score is 5 bits wide and"}], "lineHeight": 0}}, "target": {"markdown": "图 6 概述了 RBA 设计的关键结构。为支持 RBA 调度而新增或修改的硬件以红色标出，非红色结构属于基线设计。对于每个就绪的 warp 指令，我们将其 RBA 分数（①）定义为其各操作数队列长度之和。RBA 分数为 5 位宽，并且", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "c78ceb6a1aac1d80f8436d83c44cd799", "index": 55, "aliyun_index": 0, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "stored in the Warp PC Table(③). The warp scheduler (②) is responsible for arbitrating between decoded ready warps from the instruction buffer and selecting one to issue to an empty CU each cycle. Similar to numerous works studying the warp scheduler [27], [28], [36], [42], [43], [46], we modelled the Warp PC Table (③) as a fully associative table. The warp to issue is found by warp selection logic (④) implemented as a hierarchical comparator network (⑤) that selects the lowest (or highest) scoring entry by comparing a specific field of the entries.  \n\n", "text": "stored in the Warp PC Table(③). The warp scheduler (②) is responsible for arbitrating between decoded ready warps from the instruction buffer and selecting one to issue to an empty CU each cycle. Similar to numerous works studying the warp scheduler [27], [28], [36], [42], [43], [46], we modelled the Warp PC Table (③) as a fully associative table. The warp to issue is found by warp selection logic (④) implemented as a hierarchical comparator network (⑤) that selects the lowest (or highest) scoring entry by comparing a specific field of the entries.\n", "alignment": "left", "unique_id": "c78ceb6a1aac1d80f8436d83c44cd799", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "stored in the Warp PC Table(③). The warp scheduler (②) is responsible for arbitrating between decoded ready warps from the instruction buffer and selecting one to issue to an empty CU each cycle. Similar to numerous works studying the warp scheduler [27], [28], [36], [42], [43], [46], we modelled the Warp PC Table (③) as a fully associative table. The warp to issue is found by warp selection logic (④) implemented as a hierarchical comparator network (⑤) that selects the lowest (or highest) scoring entry by comparing a specific field of the entries."}], "lineHeight": 0}}, "target": {"markdown": "存储在 Warp PC 表（③）中。warp 调度器（②）负责在每个周期对指令缓冲区中已解码的就绪 warp 进行仲裁，并选择一个发送到空闲的 CU。与众多研究 warp 调度器的工作 [27]、[28]、[36]、[42]、[43]、[46] 类似，我们将 Warp PC 表（③）建模为一个全关联表。待发射的 warp 由 warp 选择逻辑（④）确定，该逻辑通过分层比较器网络（⑤）实现，通过比较各条目的特定字段来选出得分最低（或最高）的条目。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "fd5d79a089ffe2a4f2db3f58b2cd23ff", "index": 56, "aliyun_index": 1, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "In the baseline design, warps are ordered according to greedy then oldest (GTO) priority, so the warp selection logic compares entries based on their age. Our design modifies the warp selection logic such that it compares warps on the concatenated field of $\\{\\text{RBA score}, \\overline{\\text{warp age}}\\}$. Here, the overline means taking the complement of age, so older warps score lower. The warp with the lowest RBA score is selected, with older instructions selected in the case of a tie. The selected warp is then issued to an available CU (⑥) in the Operand Collector (⑦).  \n\n", "text": "In the baseline design, warps are ordered according to greedy then oldest (GTO) priority, so the warp selection logic compares entries based on their age. Our design modifies the warp selection logic such that it compares warps on the concatenated field of $\\{\\text{RBA score}, \\overline{\\text{warp age}}\\}$. Here, the overline means taking the complement of age, so older warps score lower. The warp with the lowest RBA score is selected, with older instructions selected in the case of a tie. The selected warp is then issued to an available CU (⑥) in the Operand Collector (⑦).\n", "alignment": "left", "unique_id": "fd5d79a089ffe2a4f2db3f58b2cd23ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In the baseline design, warps are ordered according to greedy then oldest (GTO) priority, so the warp selection logic compares entries based on their age. Our design modifies the warp selection logic such that it compares warps on the concatenated field of $\\{\\text{RBA score}, \\overline{\\text{warp age}}\\}$. Here, the overline means taking the complement of age, so older warps score lower. The warp with the lowest RBA score is selected, with older instructions selected in the case of a tie. The selected warp is then issued to an available CU (⑥) in the Operand Collector (⑦)."}], "lineHeight": 0}}, "target": {"markdown": "在基线设计中，warp 按照贪心然后最早（GTO）优先级进行排序，因此 warp 选择逻辑根据条目的年龄进行比较。我们的设计修改了 warp 选择逻辑，使其根据 $\\{\\text{RBA score}, \\overline{\\text{warp age}}\\}$ 的拼接字段来比较 warp。这里，上划线表示对年龄取反，因此越老的 warp 得分越低。优先选择 RBA 分数最低的 warp，在分数相同的情况下则选择更老的指令。被选中的 warp 随后被发射到操作数收集器（⑦）中可用的 CU（⑥）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "fc4d2df27f840e2ce2c78b7ffdf36bc2", "index": 57, "aliyun_index": 2, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "CUs stage warp instructions while their operands are being retrieved from the register file. Upon allocation, the CU sends bank access requests to the arbitration unit (⑧) for each of its operands. The arbitration unit maintains a separate request queue for each bank of the register file. Priority logic within the arbitration unit then grants bank accesses to CUs each cycle. The only modification necessary to the Operand Collector to support RBA is to send the number of requests in each bank's request queue to the warp scheduler. The scoring logic (⑨) then uses these request queue lengths to compute scores for each ready warp instruction and updates the results in the warp PC table. Scores are computed by summing the length of each queue for each operand of the instruction. For example, if an instruction had three operands, two stored in bank 0, and one stored in bank 1, the score would be computed as: $score = 2 \\times length(queue_0) + length(queue_1)$. Two pieces of information are necessary for this computation: the bank ID of each operand of the instruction (present in the baseline design), and the length of each bank's request queue (sent by the modified operand collector). The arbitration unit has dedicated ports per operand per collector unit, exercising a ready-valid handshake protocol (Ⓐ), hence the queue length can be conveniently found by summing the number of ports that have a valid request (Ⓑ). RBA can tolerate delays in score updates, and does not need to increase the critical path. We evaluated RBA with a 0-20 cycle score update latency and observed < 0.1% performance degradation (Section VI-B4).  \n\n", "text": "CUs stage warp instructions while their operands are being retrieved from the register file. Upon allocation, the CU sends bank access requests to the arbitration unit (⑧) for each of its operands. The arbitration unit maintains a separate request queue for each bank of the register file. Priority logic within the arbitration unit then grants bank accesses to CUs each cycle. The only modification necessary to the Operand Collector to support RBA is to send the number of requests in each bank's request queue to the warp scheduler. The scoring logic (⑨) then uses these request queue lengths to compute scores for each ready warp instruction and updates the results in the warp PC table. Scores are computed by summing the length of each queue for each operand of the instruction. For example, if an instruction had three operands, two stored in bank 0, and one stored in bank 1, the score would be computed as: $score = 2 \\times length(queue_0) + length(queue_1)$. Two pieces of information are necessary for this computation: the bank ID of each operand of the instruction (present in the baseline design), and the length of each bank's request queue (sent by the modified operand collector). The arbitration unit has dedicated ports per operand per collector unit, exercising a ready-valid handshake protocol (Ⓐ), hence the queue length can be conveniently found by summing the number of ports that have a valid request (Ⓑ). RBA can tolerate delays in score updates, and does not need to increase the critical path. We evaluated RBA with a 0-20 cycle score update latency and observed < 0.1% performance degradation (Section VI-B4).\n", "alignment": "left", "unique_id": "fc4d2df27f840e2ce2c78b7ffdf36bc2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "CUs stage warp instructions while their operands are being retrieved from the register file. Upon allocation, the CU sends bank access requests to the arbitration unit (⑧) for each of its operands. The arbitration unit maintains a separate request queue for each bank of the register file. Priority logic within the arbitration unit then grants bank accesses to CUs each cycle. The only modification necessary to the Operand Collector to support RBA is to send the number of requests in each bank's request queue to the warp scheduler. The scoring logic (⑨) then uses these request queue lengths to compute scores for each ready warp instruction and updates the results in the warp PC table. Scores are computed by summing the length of each queue for each operand of the instruction. For example, if an instruction had three operands, two stored in bank 0, and one stored in bank 1, the score would be computed as: $score = 2 \\times length(queue_0) + length(queue_1)$. Two pieces of information are necessary for this computation: the bank ID of each operand of the instruction (present in the baseline design), and the length of each bank's request queue (sent by the modified operand collector). The arbitration unit has dedicated ports per operand per collector unit, exercising a ready-valid handshake protocol (Ⓐ), hence the queue length can be conveniently found by summing the number of ports that have a valid request (Ⓑ). RBA can tolerate delays in score updates, and does not need to increase the critical path. We evaluated RBA with a 0-20 cycle score update latency and observed < 0.1% performance degradation (Section VI-B4)."}], "lineHeight": 0}}, "target": {"markdown": "CU 在从寄存器文件读取操作数期间对 warp 指令进行分阶段处理。在分配时，CU 会为其每个操作数向仲裁单元（⑧）发送寄存器体访问请求。仲裁单元为寄存器文件的每个寄存器体维护一个独立的请求队列。仲裁单元内部的优先级逻辑随后在每个周期将寄存器体访问权限授予各个 CU。为支持 RBA 而对操作数收集器所做的唯一修改，是将每个寄存器体请求队列中的请求数量发送给 warp 调度器。评分逻辑（⑨）随后利用这些请求队列长度为每个就绪的 warp 指令计算分数，并将结果更新到 warp PC 表中。分数通过将指令每个操作数对应队列的长度相加得到。例如，若一条指令有三个操作数，其中两个存储在寄存器体 0 中，一个存储在寄存器体 1 中，则分数按如下方式计算：$score = 2 \\times length(queue_0) + length(queue_1)$。该计算需要两项信息：指令各操作数的寄存器体编号（基线设计中已具备）以及每个寄存器体请求队列的长度（由修改后的操作数收集器发送）。仲裁单元为每个收集器单元的每个操作数提供专用端口，并采用 ready-valid 握手协议（Ⓐ），因此可以通过对发出有效请求的端口数量求和，便捷地获得队列长度（Ⓑ）。RBA 可以容忍评分更新带来的延迟，且不会增加关键路径的长度。我们在 0–20 周期的评分更新延迟下对 RBA 进行了评估，观察到性能下降小于 0.1%（第 VI-B4 节）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "a5fe093c3075cb7dab7fc0da22c3d907", "index": 58, "aliyun_index": 3, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "# B. Hashed Sub-Core Warp Assignment  \n\n", "text": "B. Hashed Sub-Core Warp Assignment\n", "alignment": "left", "unique_id": "a5fe093c3075cb7dab7fc0da22c3d907", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "B. Hashed Sub-Core Warp Assignment"}], "lineHeight": 0}}, "target": {"markdown": "# B. 哈希子核心 warp 分配", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "a84b6d48f5cb618e1b0917491c4c04d5", "index": 59, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "1) Hardware Support for Hashed Multiplexing: Kernels with large amounts of inter-warp-divergence are highly sensitive to sub-core imbalances. The assignment of warps to scheduler tables should be designed to mitigate any programmatic warp imbalances. To reduce the likelihood of pathological imbalances the sub-core assignment of a warp should be abstracted from its $warpID$. Replacing the round robin sub-  \n\n", "text": "1) Hardware Support for Hashed Multiplexing: Kernels with large amounts of inter-warp-divergence are highly sensitive to sub-core imbalances. The assignment of warps to scheduler tables should be designed to mitigate any programmatic warp imbalances. To reduce the likelihood of pathological imbalances the sub-core assignment of a warp should be abstracted from its $warpID$. Replacing the round robin sub-\n", "alignment": "left", "unique_id": "a84b6d48f5cb618e1b0917491c4c04d5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) Hardware Support for Hashed Multiplexing: Kernels with large amounts of inter-warp-divergence are highly sensitive to sub-core imbalances. The assignment of warps to scheduler tables should be designed to mitigate any programmatic warp imbalances. To reduce the likelihood of pathological imbalances the sub-core assignment of a warp should be abstracted from its $warpID$. Replacing the round robin sub-"}], "lineHeight": 0}}, "target": {"markdown": "1）哈希多路复用的硬件支持：具有大量 warp 间发散的内核对子核心负载不均衡高度敏感。warp 到调度器表的分配应被设计为缓解任何程序化的 warp 不均衡。为了降低出现病态不均衡的可能性，warp 的子核心分配应与其 $warpID$ 解耦。将轮询的子", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "f6c7b844917accb5cd607b8642e57b51", "index": 60, "aliyun_index": 5, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![f6c7b844917accb5cd607b8642e57b51.jpeg](figures/f6c7b844917accb5cd607b8642e57b51_cdf09c3d.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有步骤、组件编号、信号流向和细节：\n\n---\n\n# Streaming Multiprocessor (SM) 架构图解\n\n## 主要组件与连接关系\n\n### 1. TB Scheduler\n- **功能**：线程块调度器。\n- **连接**：\n  - 向下连接至 `SM Interconnect Arbiter`（标号②）。\n  - 接收来自 `Warp PC` 的反馈（通过仲裁器间接关联）。\n\n> 注：图中“Inc. every 4 warps”标注在从 TB Scheduler 到 SM Interconnect Arbiter 的路径旁，表示每4个warp递增一次计数或触发事件。\n\n---\n\n### 2. SM Interconnect Arbiter\n- **功能**：流式多处理器内部互联仲裁器。\n- **输入/输出**：\n  - 接收来自 `TB Scheduler` 的控制信号。\n  - 输出两个控制信号：\n    - “Inc. every warp” → 连接到 `2-bit binary up-counter`（标号④）。\n    - 选择信号 `SEL 0`, `SEL 1` → 分别连接到两个 `4-bit shift reg`（标号⑦）。\n  - 接收来自 `Warp PC` 的请求（通过标号③的多路复用器）。\n\n---\n\n### 3. Warp PC & Sub-core PC Tables\n- **Warp PC**：\n  - 作为程序计数器源，连接到标号③的多路复用器。\n  - 多路复用器有4个输出通道，分别连接到：\n    - Sub-core 0 PC Table\n    - Sub-core 1 PC Table\n    - Sub-core 2 PC Table\n    - Sub-core 3 PC Table\n  - 每个子核PC表独立存储对应子核的程序计数器值。\n  - 多路复用器由 `SEL 0`, `SEL 1` 控制选择哪个子核的PC表被访问（来自标号⑦的移位寄存器输出）。\n\n> 注：标号⑧指向四个Sub-core PC Table整体，可能表示它们作为一个逻辑组参与PC管理。\n\n---\n\n### 4. 2-bit Binary Up-Counter\n- **功能**：二进制递增计数器，用于生成选择信号。\n- **输入**：\n  - “Inc. every warp” 信号（来自 SM Interconnect Arbiter）。\n- **输出**：\n  - `SEL 0`, `SEL 1` → 连接到标号⑥的多路复用器（红色梯形），用于选择哈希表条目。\n  - 同时，该计数器也驱动标号⑦的两个 `4-bit shift reg` 的选择端（SEL 0, SEL 1）。\n\n> 注：此计数器可能用于轮询或循环分配资源给不同warp或子核。\n\n---\n\n### 5. 4-entry Hash Function Table\n- **结构**：\n  - 包含4个条目：`1B entry 0`, `...`, `1B entry 3`。\n  - 每个条目大小为1字节（1B）。\n  - 绿色高亮部分为“hash func. table”，表明其用途是哈希函数查找表。\n- **输入**：\n  - 来自标号的多路复用器（红色梯形），由 `SEL 0`, `SEL 1` 选择具体条目。\n- **输出**：\n  - 数据输出到标号⑥的多路复用器，再传递给后续处理单元（未明确画出，但应服务于PC计算或地址映射）。\n\n---\n\n### 6. Red Trapezoid Mux (标号)\n- **功能**：4选1多路复用器（基于2位选择信号 SEL[1:0]）。\n- **输入**：\n  - 4个来自 `4-entry hash function table` 的数据输入。\n  - 选择信号 `SEL 0`, `SEL 1` 来自 `2-bit binary up-counter`。\n- **输出**：\n  - 连接到两个 `4-bit shift reg`（标号⑦）？  \n    > 实际上，从图示看，标号⑥的输出似乎直接连向标号⑦的移位寄存器的“加载”或“选择”端，或者可能是将哈希结果送入移位寄存器进行进一步处理。需结合上下文理解——更合理的解释是：**标号⑥的输出作为偏移量或索引，配合移位寄存器生成最终PC地址**。\n\n---\n\n### 7. Two 4-bit Shift Registers (标号⑦)\n- **数量**：两个独立的4位移位寄存器。\n- **控制信号**：\n  - `SEL 0` → 控制第一个移位寄存器。\n  - `SEL 1` → 控制第二个移位寄存器。\n  - 这些选择信号来自 `SM Interconnect Arbiter`（标号②）。\n- **作用**：\n  - 可能用于动态调整PC偏移、实现跳转目标地址计算、或支持warp内线程的地址对齐。\n  - 输出连接到标号③的多路复用器的选择端（即决定哪个Sub-core PC Table被选中）。\n\n> 注意：虽然图中标号⑦的箭头指向标号③ mux 的 SEL 输入，但实际逻辑上应是移位寄存器输出作为地址偏移或索引，而非直接作为选择信号。此处可能存在绘图简化，建议理解为：**移位寄存器输出参与PC地址合成，而SEL信号仍由仲裁器提供**。\n\n---\n\n## 信号流总结（按编号顺序）\n\n| 编号 | 组件                     | 功能描述                                                                 |\n|------|--------------------------|--------------------------------------------------------------------------|\n| ①    | TB Scheduler             | 线程块调度，发出“每4 warp递增”信号                                     |\n| ②    | SM Interconnect Arbiter  | 仲裁互联，分发“每warp递增”及SEL信号                                    |\n| ③    | Warp PC + Sub-core PC Tables | 程序计数器源，经mux选择对应子核PC表                                   |\n| ④    | 2-bit Binary Up-Counter  | 根据“每warp递增”生成SEL[1:0]，用于选择哈希表条目                       |\n| ⑤    | 4-entry Hash Func. Table | 存储4个1字节哈希条目，供查表使用                                       |\n| ⑥    | Red Trapezoid Mux        | 4选1 mux，由counter输出选择哈希表条目                                  |\n| ⑦    | Two 4-bit Shift Regs     | 受arbiter SEL控制，可能用于地址偏移或PC修正                            |\n| ⑧    | Sub-core PC Tables Group | 四个子核PC表集合，共同构成PC存储池                                     |\n\n---\n\n## 关键机制说明\n\n- **Warp级调度**：“Inc. every 4 warps” 表明系统以4个warp为单位进行某种周期性操作（如计数器重置、资源轮换等）。\n- **Per-warp Increment**：“Inc. every warp” 表示每个warp执行时都会触发计数器+1，用于轮询或负载均衡。\n- **Hash-based Addressing**：使用哈希表（4 entries）结合计数器选择，可能用于快速定位共享内存、常量缓存或指令预取地址。\n- **Shift Register for PC Adjustment**：4位移位寄存器可用于实现小范围地址偏移（±15字节），适合局部跳转或对齐优化。\n- **Multi-subcore Support**：4个子核PC表允许并行维护多个执行上下文的PC，支持SIMT架构下的多线程并发。\n\n---\n\n## 图形元素备注\n\n- 所有红色框线标记关键路径或活跃模块（如shift reg, hash table, mux）。\n- 虚线框包围整个SM，表示这是一个完整的流式多处理器单元。\n- 箭头方向表示数据或控制信号流动方向。\n- “SEL 0 / SEL 1” 是2位选择信号，可编码0~3共4种状态，匹配4-entry表和4-subcore设计。\n\n---\n\n✅ 此文档完整还原了原始架构图中的所有组件、连接、信号名称、编号及隐含逻辑，符合信息抽取专家标准，无遗漏、无重复、无主观臆断。\n\n--- \n\n如需导出为PDF、添加注释层或转换为UML/Visio格式，请告知，我可继续协助。", "alignment": "left", "unique_id": "f6c7b844917accb5cd607b8642e57b51", "edited": false, "extra": {}}, "target": {"markdown": "![f6c7b844917accb5cd607b8642e57b51.jpeg](figures/f6c7b844917accb5cd607b8642e57b51_cdf09c3d.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "3f571f866fd8fbfc7e1b3aaf80a345f1", "index": 61, "aliyun_index": 6, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 7: Modifications to sub-core multiplexer to support hashed warp assignment  \n\n", "text": "Fig. 7: Modifications to sub-core multiplexer to support hashed warp assignment\n", "alignment": "left", "unique_id": "3f571f866fd8fbfc7e1b3aaf80a345f1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 7: Modifications to sub-core multiplexer to support hashed warp assignment
