": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Timothy G. Rogers"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "School of ECE"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Purdue University"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "West Lafayette, IN"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "timrogers@purdue.edu"}], "lineHeight": -152}}, "target": {"markdown": "Aaron Barnes  \n电气与计算机工程学院  \n普渡大学  \n美国印第安纳州西拉斐特  \nbarnes88@purdue.edu  \nFangjia Shen  \n电气与计算机工程学院  \n普渡大学  \n美国印第安纳州西拉斐特  \nshen449@purdue.edu  \nTimothy G. Rogers  \n电气与计算机工程学院  \n普渡大学  \n美国印第安纳州西拉斐特  \ntimrogers@purdue.edu", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 1}, {"source": {"block_id": "47ec83308a7711eada853bfef417aa36", "index": 2, "aliyun_index": 2, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Abstract—Modern GPU Streaming Multiprocessors (SMs) have several warp schedulers, execution units, and register file banks. To reduce area and energy-consumption, recent generations divide SMs into sub-cores. Each sub-core contains a distinct warp scheduler, register file, and execution units, sharing L1 memory and scratchpad resources with sub-cores in the same SM. Although partitioning the SM into sub-cores decreases the area and energy demands of larger SMs, it comes at a performance cost. Warps assigned to the SM have access to a fraction of the SM's resources, resulting in contention and imbalance issues. In this paper, we examine the effect SM sub-division has on performance and propose novel mechanisms to mitigate the negative impacts. We identify four orthogonal effects caused by sub-dividing SMs and demonstrate that two of these effects have a significant impact on performance in practice. Based on these findings, we propose register-bank-aware warp scheduling to avoid bank conflicts that arise when instruction operands are placed in the limited number of register file banks available to each sub-core, and randomly hashed sub-core assignment to mitigate imbalance issues. Our intelligent scheduling mechanisms result in an average 11.2% speedup across a diverse set of applications capturing 81% of the performance lost to SM sub-division.  \n\n", "text": "Abstract—Modern GPU Streaming Multiprocessors (SMs) have several warp schedulers, execution units, and register file banks. To reduce area and energy-consumption, recent generations divide SMs into sub-cores. Each sub-core contains a distinct warp scheduler, register file, and execution units, sharing L1 memory and scratchpad resources with sub-cores in the same SM. Although partitioning the SM into sub-cores decreases the area and energy demands of larger SMs, it comes at a performance cost. Warps assigned to the SM have access to a fraction of the SM's resources, resulting in contention and imbalance issues. In this paper, we examine the effect SM sub-division has on performance and propose novel mechanisms to mitigate the negative impacts. We identify four orthogonal effects caused by sub-dividing SMs and demonstrate that two of these effects have a significant impact on performance in practice. Based on these findings, we propose register-bank-aware warp scheduling to avoid bank conflicts that arise when instruction operands are placed in the limited number of register file banks available to each sub-core, and randomly hashed sub-core assignment to mitigate imbalance issues. Our intelligent scheduling mechanisms result in an average 11.2% speedup across a diverse set of applications capturing 81% of the performance lost to SM sub-division.\n", "alignment": "left", "unique_id": "47ec83308a7711eada853bfef417aa36", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Abstract—Modern GPU Streaming Multiprocessors (SMs) have several warp schedulers, execution units, and register file banks. To reduce area and energy-consumption, recent generations divide SMs into sub-cores. Each sub-core contains a distinct warp scheduler, register file, and execution units, sharing L1 memory and scratchpad resources with sub-cores in the same SM. Although partitioning the SM into sub-cores decreases the area and energy demands of larger SMs, it comes at a performance cost. Warps assigned to the SM have access to a fraction of the SM's resources, resulting in contention and imbalance issues. In this paper, we examine the effect SM sub-division has on performance and propose novel mechanisms to mitigate the negative impacts. We identify four orthogonal effects caused by sub-dividing SMs and demonstrate that two of these effects have a significant impact on performance in practice. Based on these findings, we propose register-bank-aware warp scheduling to avoid bank conflicts that arise when instruction operands are placed in the limited number of register file banks available to each sub-core, and randomly hashed sub-core assignment to mitigate imbalance issues. Our intelligent scheduling mechanisms result in an average 11.2% speedup across a diverse set of applications capturing 81% of the performance lost to SM sub-division."}], "lineHeight": 0}}, "target": {"markdown": "现代 GPU 流式多处理器（SM）包含多个 warp 调度器、执行单元和寄存器文件组（bank）。为降低面积与能耗，近年来将 SM 划分为若干子核心（sub-core）。每个子核心拥有独立的 warp 调度器、寄存器文件和执行单元，并与同一 SM 中的其他子核心共享 L1 存储和 scratchpad 资源。尽管将 SM 划分为子核心能够减小较大 SM 的面积与能耗开销，但也会带来性能代价。分配到该 SM 的 warp 只能访问 SM 资源的子集，从而引发资源争用和负载不均衡等问题。本文研究了 SM 子划分对性能的影响，并提出了若干新机制以缓解其负面影响。我们识别出由 SM 子划分引起的四种正交效应，并证明其中两种在实际中对性能具有显著影响。基于这些发现，我们提出了**寄存器组感知的 warp 调度**策略，以避免当指令操作数被放置在每个子核心有限的寄存器文件组中时产生的寄存器组冲突；同时提出了**随机哈希子核心分配**策略以缓解负载不均衡问题。我们的智能调度机制在多种应用上平均获得了 11.2% 的加速比，弥补了由 SM 子划分所造成的 81% 的性能损失。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 2}, {"source": {"block_id": "9d085e4bd8b635e380d7912ff86c99de", "index": 3, "aliyun_index": 3, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Index Terms—GPU, Scheduling, Register File, Bank Conflict  \n\n", "text": "Index Terms—GPU, Scheduling, Register File, Bank Conflict\n", "alignment": "left", "unique_id": "9d085e4bd8b635e380d7912ff86c99de", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Index Terms—GPU, Scheduling, Register File, Bank Conflict"}], "lineHeight": 0}}, "target": {"markdown": "索引术语—GPU、调度、寄存器文件、组（bank）冲突", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "3467fa9fcaab402b1313655cd3d7b8fc", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "# I. INTRODUCTION  \n\n", "text": "I. INTRODUCTION\n", "alignment": "left", "unique_id": "3467fa9fcaab402b1313655cd3d7b8fc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "I. INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "# I. 引言", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "1b7240bafb2be21fabe412778b781047", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "The latest GPU architectures from both Nvidia and AMD partition large cores into sub-units referred to as sub-cores [3], [23] and dual compute units [2] respectively. Each sub-core contains its own scheduler, Single Instruction Multiple Data (SIMD) execution units, operand collectors, and register file; however, sub-cores within the same SM share the same memory system. This hard-divisioning of the core can result in imbalance and contention issues that are not seen in a fully-connected monolithic SM with the same thread and compute capacity. Figure 1 shows the speedup of a of hypothetical, fully-connected Volta SM over the four sub-core SM found in contemporary machines.  \n\n", "text": "The latest GPU architectures from both Nvidia and AMD partition large cores into sub-units referred to as sub-cores [3], [23] and dual compute units [2] respectively. Each sub-core contains its own scheduler, Single Instruction Multiple Data (SIMD) execution units, operand collectors, and register file; however, sub-cores within the same SM share the same memory system. This hard-divisioning of the core can result in imbalance and contention issues that are not seen in a fully-connected monolithic SM with the same thread and compute capacity. Figure 1 shows the speedup of a of hypothetical, fully-connected Volta SM over the four sub-core SM found in contemporary machines.\n", "alignment": "left", "unique_id": "1b7240bafb2be21fabe412778b781047", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The latest GPU architectures from both Nvidia and AMD partition large cores into sub-units referred to as sub-cores [3], [23] and dual compute units [2] respectively. Each sub-core contains its own scheduler, Single Instruction Multiple Data (SIMD) execution units, operand collectors, and register file; however, sub-cores within the same SM share the same memory system. This hard-divisioning of the core can result in imbalance and contention issues that are not seen in a fully-connected monolithic SM with the same thread and compute capacity. Figure 1 shows the speedup of a of hypothetical, fully-connected Volta SM over the four sub-core SM found in contemporary machines."}], "lineHeight": 0}}, "target": {"markdown": "最新一代的 GPU 架构（来自 Nvidia 和 AMD）分别将大型核心划分为被称为子核心（sub-core）[3]、[23] 和双计算单元（dual compute units）[2] 的子单元。每个子核心拥有独立的调度器、单指令多数据（SIMD）执行单元、操作数收集器（operand collectors）和寄存器文件；然而，同一 SM 内的子核心共享同一套存储系统。这种对核心的硬性划分可能导致在具有相同线程与计算能力的全互连单片 SM 中所不会出现的负载不均衡和资源争用问题。图 1 展示了一个假想的全互连 Volta SM 相对于当代机器中所采用的四子核心 SM 所获得的加速比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "190804c65a3bfc786f6d97cb577d7fe5", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Comparing a fully-connected core to a partitioned one, four potential performance issues are observed. The first is increased register file bank conflicts. Each sub-core has access to 1/4 of the register file banks on the SM, increasing the likelihood of bank conflicts, which decreases throughput in the operand read stage. Second, each warp scheduler can only issue instructions to one sub-core, if there is an imbalance in  \n\n", "text": "Comparing a fully-connected core to a partitioned one, four potential performance issues are observed. The first is increased register file bank conflicts. Each sub-core has access to 1/4 of the register file banks on the SM, increasing the likelihood of bank conflicts, which decreases throughput in the operand read stage. Second, each warp scheduler can only issue instructions to one sub-core, if there is an imbalance in\n", "alignment": "left", "unique_id": "190804c65a3bfc786f6d97cb577d7fe5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Comparing a fully-connected core to a partitioned one, four potential performance issues are observed. The first is increased register file bank conflicts. Each sub-core has access to 1/4 of the register file banks on the SM, increasing the likelihood of bank conflicts, which decreases throughput in the operand read stage. Second, each warp scheduler can only issue instructions to one sub-core, if there is an imbalance in"}], "lineHeight": 0}}, "target": {"markdown": "通过比较全互连核心与分区核心，我们观察到四种潜在的性能问题。第一种是寄存器文件组（bank）冲突的增加。每个子核心仅能访问 SM 上 1/4 的寄存器文件组，这大大增加了发生组冲突的概率，从而降低了操作数读取阶段的吞吐率。第二种是每个 warp 调度器只能向一个子核心发射指令，如果出现", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 6}, {"source": {"block_id": "732114ade6c52cbe0794dc1081de3e2c", "index": 7, "aliyun_index": 7, "page_num": 0, "type": "figure", "sub_type": "none", "markdown": "![732114ade6c52cbe0794dc1081de3e2c.jpeg](figures/732114ade6c52cbe0794dc1081de3e2c_d32cd2a7.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式信息，准确保留所有图例、坐标轴标签、数据点标注及视觉细节：\n\n---\n\n# 应用加速比（Speedup）对比图\n\n## 图例（Legend）\n\n| 符号 | 颜色/形状       | 应用名称     |\n|------|------------------|--------------|\n| ▲    | 蓝色三角形       | Rodinia      |\n| ■    | 红色方块         | TPCH-C       |\n| ◆    | 黄色菱形         | TPCH-U       |\n| ●    | 绿色实心圆       | Cutlass      |\n| ●    | 黑色实心圆       | Polybench    |\n| ●    | 青色实心圆       | Parboil      |\n| ×    | 粉色叉号         | CuGraph      |\n| ●    | 紫色实心圆       | Deepbench    |\n\n> 注：Polybench、Parboil、Deepbench 均使用实心圆标记，但颜色不同；CuGraph 使用粉色叉号。\n\n---\n\n## 坐标轴\n\n- **X 轴**：`Applications`  \n  （表示不同的应用程序或基准测试套件，按某种顺序排列，未明确命名具体应用，仅通过数据点位置和标注体现）\n\n- **Y 轴**：`Speedup`  \n  - 范围：0.5 → 2.0  \n  - 刻度线：0.5, 1.0, 1.5, 2.0  \n  - 基准线：在 Speedup = 1.0 处有一条水平灰色参考线（表示无加速）\n\n---\n\n## 数据趋势与关键标注点\n\n图中各应用的数据点沿 X 轴从左到右排列，整体呈现“前期平缓、后期上升”的趋势。部分关键点被文字标注：\n\n### 左侧区域（Speedup ≈ 1.0）\n- 多数应用初始阶段加速比接近 1.0，包括：\n  - Rodinia（蓝三角）\n  - Polybench（黑圆）\n  - Deepbench（紫圆）\n  - CuGraph（粉叉）\n  - Parboil（青圆）等\n\n### 中间过渡区\n- `pb-sad`（浅蓝色文本标注）→ 对应 Parboil 中某个子项，位于 Speedup ≈ 1.0 附近\n- `pb-2Dconv`（浅蓝色文本标注）→ 同样属于 Parboil，略高于 1.0\n- `tpcC-q19`（红色文本标注）→ 属于 TPCH-C，开始明显上升，约在 Speedup = 1.1~1.2 区间\n- `pb-mriq`（青色文本标注）→ Parboil 子项，继续上升，约 Speedup = 1.3~1.4\n\n### 右侧高加速区\n- `tpcC-q9`（红色文本标注）→ TPCH-C 的另一个查询，达到最高加速比，接近 **1.8**\n- TPCH-C（红色方块）整体呈陡峭上升趋势，是图中加速效果最显著的应用系列\n- TPCH-U（黄色菱形）、Cutlass（绿圆）、Parboil（青圆）也随 X 轴向右逐步上升，但幅度小于 TPCH-C\n\n---\n\n## 视觉特征总结\n\n- 所有数据点以离散形式绘制，未按连续曲线连接。\n- 不同应用用不同颜色和形状的标记区分，便于识别。\n- 标注文字直接指向对应数据点或集群，字体颜色与对应标记一致（如 tpcC-q9 为红色，pb-mriq 为青色）。\n- 整体布局清晰，重点突出高加速比应用（尤其是 TPCH-C 系列）。\n\n---\n\n## 补充说明\n\n- “pb-”前缀可能代表 Parboil 基准中的特定子任务（如 pb-sad, pb-2Dconv, pb-mriq）。\n- “tpcC-”前缀代表 TPC-C 基准中的不同查询（如 q9, q19），其中 q9 加速比最高。\n- 图中未提供 X 轴上每个点的具体应用名称列表，仅通过标注和图例推断所属套件。\n\n---\n\n✅ 此 Markdown 文档完整还原了图像中的所有可视元素、结构关系与语义标注，可用于报告、演示或进一步数据分析。\n\n--- \n\n如需将此图转换为可编辑图表（如 Plotly / Matplotlib 代码），可提供额外需求。", "alignment": "left", "unique_id": "732114ade6c52cbe0794dc1081de3e2c", "edited": false, "extra": {}}, "target": {"markdown": "![732114ade6c52cbe0794dc1081de3e2c.jpeg](figures/732114ade6c52cbe0794dc1081de3e2c_d32cd2a7.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 7}, {"source": {"block_id": "5dfe213d01ec779bd65db92de2689b09", "index": 8, "aliyun_index": 8, "page_num": 0, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 1: Simulated speedup of a hypothetical fully connected SM over a four-way partitioned Volta SM for 112 Applications  \n\n", "text": "Fig. 1: Simulated speedup of a hypothetical fully connected SM over a four-way partitioned Volta SM for 112 Applications\n", "alignment": "left", "unique_id": "5dfe213d01ec779bd65db92de2689b09", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 1: Simulated speedup of a hypothetical fully connected SM over a four-way partitioned Volta SM for 112 Applications"}], "lineHeight": 0}}, "target": {"markdown": ">图 1：在 112 个应用程序上，假想的全互连 SM 相对于四分区 Volta SM 的模拟加速比", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 8}, {"source": {"block_id": "a81a3392aec98afff809db9aacad169a", "index": 9, "aliyun_index": 9, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "the work assigned to each scheduler, SIMD execution units\ncan go unused. Third, in workloads where warps assigned to\nthe same SM have diverse execution unit demands (i.e. some\nwarps makes heavy use of the tensor cores while others do\nnot), lacking access to all the core's execution units decreases\nutilization. Finally, if warps assigned to an SM have diverse\nregister-file capacity demands, which can occur when SMs\nexecute concurrent kernels, a lack of register space on one sub-\ncore may prevent others with capacity from accepting work.  \n\n", "text": "the work assigned to each scheduler, SIMD execution units\ncan go unused. Third, in workloads where warps assigned to\nthe same SM have diverse execution unit demands (i.e. some\nwarps makes heavy use of the tensor cores while others do\nnot), lacking access to all the core's execution units decreases\nutilization. Finally, if warps assigned to an SM have diverse\nregister-file capacity demands, which can occur when SMs\nexecute concurrent kernels, a lack of register space on one sub-\ncore may prevent others with capacity from accepting work.\n", "alignment": "left", "unique_id": "a81a3392aec98afff809db9aacad169a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the work assigned to each scheduler, SIMD execution units"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "can go unused. Third, in workloads where warps assigned to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the same SM have diverse execution unit demands (i.e. some"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "warps makes heavy use of the tensor cores while others do"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "not), lacking access to all the core's execution units decreases"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "utilization. Finally, if warps assigned to an SM have diverse"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "register-file capacity demands, which can occur when SMs"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "execute concurrent kernels, a lack of register space on one sub-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "core may prevent others with capacity from accepting work."}], "lineHeight": -261}}, "target": {"markdown": "分配给各调度器的负载出现不均衡，则 SIMD 执行单元可能无法被充分利用。第三种是，当分配到同一 SM 的 warp 具有多样化的执行单元需求时（例如部分 warp 大量使用张量核心，而其他 warp 则不使用），缺乏对全部核心执行单元的访问将导致利用率下降。最后，如果分配到同一 SM 的 warp 具有多样化的寄存器文件容量需求（当 SM 并发执行多个核函数时可能出现这种情况），某一子核心上寄存器空间的不足可能会阻碍其他仍有可用容量的子核心接收新的工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 9}, {"source": {"block_id": "7957f20d67f454bdd6ed878b46cba7fd", "index": 10, "aliyun_index": 10, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Although these four factors can potentially harm sub-core performance, we measured the effect of a hypothetical monolithic core on 112 workloads from 8 benchmark suites [10], [12], [13], [16], [22], [30], [55] and observe that register bank conflicts and issue imbalance are responsible for the majority of sub-core performance loss in practice. To mitigate these factors, we develop a novel warp scheduling mechanism to mitigate the effects of additional bank conflicts and propose hashed sub-core warp assignment to reduce imbalance. To the best of our knowledge, we are the first work to study the effects of the GPU sub-core, develop scheduling techniques to mitigate bank conflicts in GPUs, and examine sub-core assignment policies.  \n\n", "text": "Although these four factors can potentially harm sub-core performance, we measured the effect of a hypothetical monolithic core on 112 workloads from 8 benchmark suites [10], [12], [13], [16], [22], [30], [55] and observe that register bank conflicts and issue imbalance are responsible for the majority of sub-core performance loss in practice. To mitigate these factors, we develop a novel warp scheduling mechanism to mitigate the effects of additional bank conflicts and propose hashed sub-core warp assignment to reduce imbalance. To the best of our knowledge, we are the first work to study the effects of the GPU sub-core, develop scheduling techniques to mitigate bank conflicts in GPUs, and examine sub-core assignment policies.\n", "alignment": "left", "unique_id": "7957f20d67f454bdd6ed878b46cba7fd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although these four factors can potentially harm sub-core performance, we measured the effect of a hypothetical monolithic core on 112 workloads from 8 benchmark suites [10], [12], [13], [16], [22], [30], [55] and observe that register bank conflicts and issue imbalance are responsible for the majority of sub-core performance loss in practice. To mitigate these factors, we develop a novel warp scheduling mechanism to mitigate the effects of additional bank conflicts and propose hashed sub-core warp assignment to reduce imbalance. To the best of our knowledge, we are the first work to study the effects of the GPU sub-core, develop scheduling techniques to mitigate bank conflicts in GPUs, and examine sub-core assignment policies."}], "lineHeight": 0}}, "target": {"markdown": "尽管这四种因素都可能在一定程度上损害子核心的性能，但我们针对来自 8 个基准测试套件 [10]、[12]、[13]、[16]、[22]、[30]、[55] 的 112 个工作负载，测量了一个假想的单片核心所产生的影响，结果表明在实际中寄存器组冲突和发射不均衡是导致子核心性能损失的主要原因。为了缓解这些因素，我们提出了一种新颖的 warp 调度机制以减轻额外的组冲突所带来的后果，并提出了哈希子核心 warp 分配策略以降低不均衡程度。据我们所知，我们是首个研究 GPU 子核心影响、提出 GPU 组冲突缓解调度技术，并考察子核心分配策略的工作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 10}, {"source": {"block_id": "56b1a7d327d9dfa3f9d0134a51c76b20", "index": 11, "aliyun_index": 11, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "A major side-effect of partitioning the SM is a reduction\nin the number of register file banks available to each warp.  \n\n", "text": "A major side-effect of partitioning the SM is a reduction\nin the number of register file banks available to each warp.\n", "alignment": "left", "unique_id": "56b1a7d327d9dfa3f9d0134a51c76b20", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A major side-effect of partitioning the SM is a reduction"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in the number of register file banks available to each warp."}], "lineHeight": -56}}, "target": {"markdown": "将 SM 划分的一个主要副作用是每个 warp 可用的寄存器文件组数量减少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 11}, {"source": {"block_id": "4bf012051373c00f935bb36709e1e856", "index": 12, "aliyun_index": 0, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In Volta/Ampere for example, each SM has eight register file banks, but each sub-core has access to only two [34], [35]. Even with compiler-orchestrated register swizzling among banks, GPUs still need to make use of operand collectors [24], [47] to keep multiple warps in the operand read stage and maximize register file bandwidth. Increasing the number of warps requesting operands each cycle is a straightforward way to improve register bank utilization. However, doing so involves scaling the number of collector units in each sub-core, which adds area and energy to the SM (evaluated in Section VI-B2), decreasing the gains made by moving to a sub-core design in the first place. Instead of blindly scaling collector units, we develop a novel Register Bank Aware (RBA) warp scheduling mechanism to make better use of the limited banks and collector units available in GPU subcores. Although warp scheduling has been extensively studied for other purposes [37], [39], [42], [46], [48], [49], [52], [53], we are the first paper that uses it as a mechanism to mitigate register bank conflicts, which are exacerbated by the partitioned cores in recent GPU generations.  \n\n", "text": "In Volta/Ampere for example, each SM has eight register file banks, but each sub-core has access to only two [34], [35]. Even with compiler-orchestrated register swizzling among banks, GPUs still need to make use of operand collectors [24], [47] to keep multiple warps in the operand read stage and maximize register file bandwidth. Increasing the number of warps requesting operands each cycle is a straightforward way to improve register bank utilization. However, doing so involves scaling the number of collector units in each sub-core, which adds area and energy to the SM (evaluated in Section VI-B2), decreasing the gains made by moving to a sub-core design in the first place. Instead of blindly scaling collector units, we develop a novel Register Bank Aware (RBA) warp scheduling mechanism to make better use of the limited banks and collector units available in GPU subcores. Although warp scheduling has been extensively studied for other purposes [37], [39], [42], [46], [48], [49], [52], [53], we are the first paper that uses it as a mechanism to mitigate register bank conflicts, which are exacerbated by the partitioned cores in recent GPU generations.\n", "alignment": "left", "unique_id": "4bf012051373c00f935bb36709e1e856", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In Volta/Ampere for example, each SM has eight register file banks, but each sub-core has access to only two [34], [35]. Even with compiler-orchestrated register swizzling among banks, GPUs still need to make use of operand collectors [24], [47] to keep multiple warps in the operand read stage and maximize register file bandwidth. Increasing the number of warps requesting operands each cycle is a straightforward way to improve register bank utilization. However, doing so involves scaling the number of collector units in each sub-core, which adds area and energy to the SM (evaluated in Section VI-B2), decreasing the gains made by moving to a sub-core design in the first place. Instead of blindly scaling collector units, we develop a novel Register Bank Aware (RBA) warp scheduling mechanism to make better use of the limited banks and collector units available in GPU subcores. Although warp scheduling has been extensively studied for other purposes [37], [39], [42], [46], [48], [49], [52], [53], we are the first paper that uses it as a mechanism to mitigate register bank conflicts, which are exacerbated by the partitioned cores in recent GPU generations."}], "lineHeight": 0}}, "target": {"markdown": "以 Volta/Ampere 架构为例，每个 SM 拥有 8 个寄存器文件组（bank），但每个子核心仅能访问其中 2 个 [34]、[35]。即使编译器在各 bank 之间对寄存器进行了重新排布（swizzling），GPU 仍需借助操作数收集器（operand collectors）[24]、[47] 来维持多个 warp 同时处于操作数读取阶段，从而最大化寄存器文件带宽。每周期增加请求操作数的 warp 数量是提升寄存器组利用率的一种直接方法。然而，这样做需要按比例增加每个子核心中收集器的数量，而这会带来 SM 面积和能耗的增加（在第六节 VI-B2 中进行了评估），从而削弱最初采用子核心设计所获得的收益。因此，我们并非简单地一味扩展收集器数量，而是提出了一种新颖的**寄存器组感知（Register Bank Aware, RBA）warp 调度机制**，以更高效地利用 GPU 子核心中有限的寄存器和收集器资源。尽管 warp 调度已因其他目的被广泛研究 [37]、[39]、[42]、[46]、[48]、[49]、[52]、[53]，但本文是首个将其用作缓解寄存器组冲突机制的工作——而寄存器组冲突在最近几代 GPU 的分区核心架构下被进一步加剧。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 12}, {"source": {"block_id": "3c811487ff85492a91826b74696e07c8", "index": 13, "aliyun_index": 1, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Imbalances across the work assigned to a sub-core can lead to under-utilization and reduced performance. Through extensive microbenchmarking (see Section III-B), we have determined that contemporary Volta and Ampere GPUs assign warps to sub-cores in a simple round-robin fashion. This assignment balances the work across sub-cores, provided warps execute a similar number of instructions. However, not all workloads have well-balanced warps. In particular, highly-optimized workloads that make use of warp specialized programming [11], [14], [19], [20], [31] can exhibit severe imbalance. Warp specialized programming is a technique used to reduce the impact of control-flow divergence by grouping threads with a similar control-flow path into the same warp. Although the SIMD efficiency [27] of warp-specialized programs is high, there can be significant variations in the number of instructions executed by warps in the same thread block. This variation is easily smoothed in a monolithic core where every warp has access to all the SM's resources, but can lead to severe imbalance in sub-core based SMs.  \n\n", "text": "Imbalances across the work assigned to a sub-core can lead to under-utilization and reduced performance. Through extensive microbenchmarking (see Section III-B), we have determined that contemporary Volta and Ampere GPUs assign warps to sub-cores in a simple round-robin fashion. This assignment balances the work across sub-cores, provided warps execute a similar number of instructions. However, not all workloads have well-balanced warps. In particular, highly-optimized workloads that make use of warp specialized programming [11], [14], [19], [20], [31] can exhibit severe imbalance. Warp specialized programming is a technique used to reduce the impact of control-flow divergence by grouping threads with a similar control-flow path into the same warp. Although the SIMD efficiency [27] of warp-specialized programs is high, there can be significant variations in the number of instructions executed by warps in the same thread block. This variation is easily smoothed in a monolithic core where every warp has access to all the SM's resources, but can lead to severe imbalance in sub-core based SMs.\n", "alignment": "left", "unique_id": "3c811487ff85492a91826b74696e07c8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Imbalances across the work assigned to a sub-core can lead to under-utilization and reduced performance. Through extensive microbenchmarking (see Section III-B), we have determined that contemporary Volta and Ampere GPUs assign warps to sub-cores in a simple round-robin fashion. This assignment balances the work across sub-cores, provided warps execute a similar number of instructions. However, not all workloads have well-balanced warps. In particular, highly-optimized workloads that make use of warp specialized programming [11], [14], [19], [20], [31] can exhibit severe imbalance. Warp specialized programming is a technique used to reduce the impact of control-flow divergence by grouping threads with a similar control-flow path into the same warp. Although the SIMD efficiency [27] of warp-specialized programs is high, there can be significant variations in the number of instructions executed by warps in the same thread block. This variation is easily smoothed in a monolithic core where every warp has access to all the SM's resources, but can lead to severe imbalance in sub-core based SMs."}], "lineHeight": 0}}, "target": {"markdown": "子核心之间分配的工作负载不均衡可能导致资源利用率不足和性能下降。通过大量的微基准测试（见第三节 III-B），我们发现当代 Volta 和 Ampere GPU 以简单的轮询（round-robin）方式将 warp 分配到各子核心。这种分配方式能够在各 warp 执行指令数量相近时使子核心间的负载保持均衡。然而，并非所有工作负载都具有均衡的 warp。尤其是那些采用 **warp 专用化编程（warp specialized programming）**[11]、[14]、[19]、[20]、[31] 的高度优化工作负载，可能表现出严重的不均衡。Warp 专用化编程是一种通过将具有相似控制流路径的线程编组到同一 warp 中，从而降低控制流分歧影响的技术。尽管 warp 专用化程序的 SIMD 利用率 [27] 较高，但同一线程块中各 warp 所执行的指令数量可能存在显著差异。这种差异在单片核心中很容易被平滑掉，因为每个 warp 都可访问 SM 上的全部资源；但在基于子核心的 SM 中，则可能导致严重的负载不均衡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 13}, {"source": {"block_id": "3f2b4109ff762f35b357c7932d0a2b04", "index": 14, "aliyun_index": 2, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "The assignment of warps to sub-cores adds an additional layer to the GPU thread-scheduling hierarchy. Although these sub-cores act as independent units, thread blocks are assigned at the SM granularity. Once a thread block is assigned to an SM, each sub-core is tasked with a subset of the warps that make up the thread block. Table I contrasts the different levels of thread scheduling in a contemporary GPU.  \n\n", "text": "The assignment of warps to sub-cores adds an additional layer to the GPU thread-scheduling hierarchy. Although these sub-cores act as independent units, thread blocks are assigned at the SM granularity. Once a thread block is assigned to an SM, each sub-core is tasked with a subset of the warps that make up the thread block. Table I contrasts the different levels of thread scheduling in a contemporary GPU.\n", "alignment": "left", "unique_id": "3f2b4109ff762f35b357c7932d0a2b04", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The assignment of warps to sub-cores adds an additional layer to the GPU thread-scheduling hierarchy. Although these sub-cores act as independent units, thread blocks are assigned at the SM granularity. Once a thread block is assigned to an SM, each sub-core is tasked with a subset of the warps that make up the thread block. Table I contrasts the different levels of thread scheduling in a contemporary GPU."}], "lineHeight": 0}}, "target": {"markdown": "将 warp 分配到子核心为 GPU 线程调度层级增加了一个新的层次。尽管这些子核心充当独立的运算单元，但线程块（thread block）仍以 SM 为粒度进行分配。一旦某个线程块被分配到某个 SM 上，每个子核心便负责处理构成该线程块的一部分 warp。表 I 对比了当代 GPU 中不同层级的线程调度方式。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "30e30c638b9941a7a85a9c613bdff008", "index": 15, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Sub-core warp assignment shares similarities with warp scheduling and thread block scheduling (Table I), but its position in the hierarchy makes it fundamentally different. Sub-core scheduling operates at a warp granularity, however, the assignment of a warp to a sub-core happens only once in the lifetime of the warp and cannot be changed. As a result, decisions are made less frequently than warp scheduling and each individual decision has a greater impact. Sub-core scheduling frequency is more similar to thread block scheduling, however the granularity is different. Thread block scheduling can do  \n\n", "text": "Sub-core warp assignment shares similarities with warp scheduling and thread block scheduling (Table I), but its position in the hierarchy makes it fundamentally different. Sub-core scheduling operates at a warp granularity, however, the assignment of a warp to a sub-core happens only once in the lifetime of the warp and cannot be changed. As a result, decisions are made less frequently than warp scheduling and each individual decision has a greater impact. Sub-core scheduling frequency is more similar to thread block scheduling, however the granularity is different. Thread block scheduling can do\n", "alignment": "left", "unique_id": "30e30c638b9941a7a85a9c613bdff008", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Sub-core warp assignment shares similarities with warp scheduling and thread block scheduling (Table I), but its position in the hierarchy makes it fundamentally different. Sub-core scheduling operates at a warp granularity, however, the assignment of a warp to a sub-core happens only once in the lifetime of the warp and cannot be changed. As a result, decisions are made less frequently than warp scheduling and each individual decision has a greater impact. Sub-core scheduling frequency is more similar to thread block scheduling, however the granularity is different. Thread block scheduling can do"}], "lineHeight": 0}}, "target": {"markdown": "子核心 warp 分配与 warp 调度和线程块调度（表 I）具有一定的相似性，但它在调度层级中所处的位置使其本质上有所不同。子核心调度以 warp 为粒度进行操作，然而，将一个 warp 分配到某个子核心在该 warp 的整个生命周期中仅发生一次，且不可更改。因此，与 warp 调度相比，调度决策的频率更低，但每一个决策的影响更大。子核心调度的频率与线程块调度更为相似，但其调度粒度不同。线程块调度可以执行", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "36a7a801a36863c172412710e0609dce", "index": 16, "aliyun_index": 4, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "nothing about disparities among the warps within a thread\nblock, since it only decides which SM a thread block will be\nassigned to.  \n\n", "text": "nothing about disparities among the warps within a thread\nblock, since it only decides which SM a thread block will be\nassigned to.\n", "alignment": "left", "unique_id": "36a7a801a36863c172412710e0609dce", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": f mary sources of performance degradation: increased register file bank conflicts, and sub-core issue imbalance.\n", "alignment": "left", "unique_id": "000276665f82f82344b3e83d42927d54", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• The first study to improve GPU sub-cores' effect on performance, quantifying the two primary sources of performance degradation: increased register file bank conflicts, and sub-core issue imbalance."}], "lineHeight": 0}}, "target": {"markdown": "• 首个针对 GPU 子核心对性能影响进行改进的研究，量化了造成性能下降的两大主要根源：寄存器文件组冲突的增加以及子核心发射不均衡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "4eb3c26e2237d4226a4ac78a5bb61cc2", "index": 19, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• A novel bank-aware warp scheduler to mitigate the effects of increased bank conflicts in sub-core partitioned register files. A quantitative cost-benefit analysis of the design compared to scaling the number of collector units is presented.  \n\n", "text": "• A novel bank-aware warp scheduler to mitigate the effects of increased bank conflicts in sub-core partitioned register files. A quantitative cost-benefit analysis of the design compared to scaling the number of collector units is presented.\n", "alignment": "left", "unique_id": "4eb3c26e2237d4226a4ac78a5bb61cc2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• A novel bank-aware warp scheduler to mitigate the effects of increased bank conflicts in sub-core partitioned register files. A quantitative cost-benefit analysis of the design compared to scaling the number of collector units is presented."}], "lineHeight": 0}}, "target": {"markdown": "• 一种新颖的寄存器组感知 warp 调度器，用于缓解子核心分区寄存器文件中组冲突增加所带来的影响。文中对该设计相对于扩展收集器数量方案进行了定量化的成本-收益分析。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "0ea330be519fad35697326217d6e9f29", "index": 20, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• A hashed sub-core scheduler to eliminate pathological issue imbalances.  \n\n", "text": "• A hashed sub-core scheduler to eliminate pathological issue imbalances.\n", "alignment": "left", "unique_id": "0ea330be519fad35697326217d6e9f29", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• A hashed sub-core scheduler to eliminate pathological issue imbalances."}], "lineHeight": 0}}, "target": {"markdown": "• 一种哈希子核心调度器，用于消除极端情况下的发射不均衡。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "c05675d894a0c3f7e7586117e432c6b3", "index": 21, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• Evaluation of the novel scheduling techniques resulting in an average speedup of 11.2% across all applications and 19.3% on applications sensitive to SM partitioning.  \n\n", "text": "• Evaluation of the novel scheduling techniques resulting in an average speedup of 11.2% across all applications and 19.3% on applications sensitive to SM partitioning.\n", "alignment": "left", "unique_id": "c05675d894a0c3f7e7586117e432c6b3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Evaluation of the novel scheduling techniques resulting in an average speedup of 11.2% across all applications and 19.3% on applications sensitive to SM partitioning."}], "lineHeight": 0}}, "target": {"markdown": "• 对所提出的新颖调度技术进行了评估，结果表明在所有应用上平均获得了 11.2% 的加速比，而在对 SM 分区敏感的应用上加速比达到 19.3%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "ff6dff9a04a827bc6390605ab59285dd", "index": 22, "aliyun_index": 10, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# II. MOTIVATION AND BACKGROUND  \n\n", "text": "II. MOTIVATION AND BACKGROUND\n", "alignment": "left", "unique_id": "ff6dff9a04a827bc6390605ab59285dd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "II. MOTIVATION AND BACKGROUND"}], "lineHeight": 0}}, "target": {"markdown": "# II. 研究动机与背景", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "e182b0a46ec65c768a97da9a601ccf63", "index": 23, "aliyun_index": 11, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "# A. The Streaming Multiprocessor Sub-Core  \n\n", "text": "A. The Streaming Multiprocessor Sub-Core\n", "alignment": "left", "unique_id": "e182b0a46ec65c768a97da9a601ccf63", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. The Streaming Multiprocessor Sub-Core"}], "lineHeight": 0}}, "target": {"markdown": "## A. 流多处理器子核心", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "3ebeee9604b7b36b2f0fef7022cce0a1", "index": 24, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "There has been a trend in scaling not only the number of SMs in each new generation of GPUs, but also the capability of each SM. For example, in 2006 Nvidia introduced their first unified graphics and parallel compute architecture with the Tesla [45]. The Tesla architecture SM contained a single multi-threaded issue unit, eight Streaming Processor (SP) cores, and two Special Functional Units (SFUs). In contrast, each SM in the Ampere A100 (released in 2020) contains four warp schedulers / issue units, four tensor cores, 64 FP32 units, 64 INT32 Units, and 32 FP64 units [3]. As the number of schedulers and functional units within each SM has increased, the need to subdivide the SM to reduce area and power requirements arose. The Maxwell architecture was the first Nvidia design to partition the SM into sub-cores, and all subsequent Nvidia architectures have used a similar SM partitioning. The Maxwell architecture achieved twice the performance per watt of the previous generation, Kepler, while using the same 28 nm process [5]. Sub-core partitioning reduced the die area of each SM while also improving power efficiency. By decreasing the area per SM while providing about 90% of the performance of the Kepler SM, Nvidia was able to increase the total number of SMs from two in the Kepler GK107, to five in the Maxwell GM107, with only a 25% increase in die area.  \n\n", "text": "There has been a trend in scaling not only the number of SMs in each new generation of GPUs, but also the capability of each SM. For example, in 2006 Nvidia introduced their first unified graphics and parallel compute architecture with the Tesla [45]. The Tesla architecture SM contained a single multi-threaded issue unit, eight Streaming Processor (SP) cores, and two Special Functional Units (SFUs). In contrast, each SM in the Ampere A100 (released in 2020) contains four warp schedulers / issue units, four tensor cores, 64 FP32 units, 64 INT32 Units, and 32 FP64 units [3]. As the number of schedulers and functional units within each SM has increased, the need to subdivide the SM to reduce area and power requirements arose. The Maxwell architecture was the first Nvidia design to partition the SM into sub-cores, and all subsequent Nvidia architectures have used a similar SM partitioning. The Maxwell architecture achieved twice the performance per watt of the previous generation, Kepler, while using the same 28 nm process [5]. Sub-core partitioning reduced the die area of each SM while also improving power efficiency. By decreasing the area per SM while providing about 90% of the performance of the Kepler SM, Nvidia was able to increase the total number of SMs from two in the Kepler GK107, to five in the Maxwell GM107, with only a 25% increase in die area.\n", "alignment": "left", "unique_id": "3ebeee9604b7b36b2f0fef7022cce0a1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There has been a trend in scaling not only the number of SMs in each new generation of GPUs, but also the capability of each SM. For example, in 2006 Nvidia introduced their first unified graphics and parallel compute architecture with the Tesla [45]. The Tesla architecture SM contained a single multi-threaded issue unit, eight Streaming Processor (SP) cores, and two Special Functional Units (SFUs). In contrast, each SM in the Ampere A100 (released in 2020) contains four warp schedulers / issue units, four tensor cores, 64 FP32 units, 64 INT32 Units, and 32 FP64 units [ ipeline Architecture\n\n## Overview\nThis diagram illustrates the instruction dispatch and execution pipeline from warp scheduler to execution units, including arbitration, memory banking, crossbar switching, compute unit selection, and round-robin dispatch.\n\n---\n\n## Components & Flow\n\n### 1. **Arbitration Unit**\n- Receives issued instructions from the **Warp Scheduler** (labeled as “Issued Instruction from Warp Scheduler”).\n- Arbitrates access between two memory banks:\n  - ↔ **Bank 1**\n  - ↔ **Bank 2**\n- Sends arbitrated requests to the **Crossbar**.\n- Receives feedback loop from **Execution Units** (indicated by arrow returning to Arbitration Unit).\n\n> *Note: Bidirectional arrows indicate control/data flow in both directions between Arbitration Unit and Banks.*\n\n---\n\n### 2. **Memory Banks**\n- **Bank 1** and **Bank 2** are connected bidirectionally to:\n  - Arbitration Unit\n  - Crossbar\n\n---\n\n### 3. **Crossbar**\n- Acts as a switch fabric connecting:\n  - Input: From **Bank 1** and **Bank 2**\n  - Output: To **CU 1** and **CU 2**\n- Also receives input from **RR Dispatch** (Round-Robin Dispatch) — indicating dynamic routing or scheduling override.\n- Bidirectional connections with CU 1 and CU 2 suggest data/control exchange.\n\n---\n\n### 4. **Compute Units (CUs)**\n- **CU 1** and **CU 2**:\n  - Receive inputs from **Crossbar**\n  - Send outputs to **Mux** (Multiplexer)\n  - Have bidirectional link with each other (possibly for synchronization or shared state)\n  - Receive control signal from **RR Dispatch**\n\n---\n\n### 5. **RR Dispatch (Round-Robin Dispatch)**\n- Controls scheduling between CUs:\n  - Sends signals to **Crossbar** and **CU 1 / CU 2**\n  - Likely implements round-robin policy to alternate between CUs for fairness or load balancing.\n\n---\n\n### 6. **Mux (Multiplexer)**\n- Selects output from either **CU 1** or **CU 2**\n- Routes selected result to **Execution Units**\n\n---\n\n### 7. **Execution Units**\n- Final stage of processing\n- Receives operand/result from **Mux**\n- Feeds back status/completion signal to **Arbitration Unit** (closing the loop)\n\n---\n\n## Data/Control Flow Summary\n\n```mermaid\ngraph TD\n    A[Issued Instruction from Warp Scheduler] --> B[Arbitration Unit]\n    B <--> C[Bank 1]\n    B <--> D[Bank 2]\n    C <--> E[Crossbar]\n    D <--> E\n    E <--> F[CU 1]\n    E <--> G[CU 2]\n    F <--> G\n    H[RR Dispatch] --> E\n    H --> F\n    H --> G\n    F --> I[Mux]\n    G --> I\n    I --> J[Execution Units]\n    J --> B\n```\n\n> *Note: The above Mermaid code is provided for visualization; actual rendering depends on platform support.*\n\n---\n\n## Key Observations\n\n- **Feedback Loop**: Execution Units → Arbitration Unit suggests completion notification or resource release mechanism.\n- **Round-Robin Scheduling**: RR Dispatch implies time-sliced or fair-share allocation across CUs.\n- **Crossbar Flexibility**: Enables any bank-to-CU path, supporting parallelism and avoiding contention.\n- **Bidirectional Links**: Indicate potential for read/write operations, status updates, or handshake protocols between components.\n\n---\n\n## Labels & Annotations\n\n- All component names are preserved exactly as labeled in the diagram.\n- Arrows denote directionality of data/control flow.\n- Parenthetical note “(Issued Instruction from Warp Scheduler)” clarifies origin of initial input.\n\n---\n\n✅ This Markdown representation fully captures the structure, connectivity, and functional roles of each block in the original diagram without omission or duplication.\n\n--- \n\nLet me know if you’d like this exported as a PDF, enhanced with icons, or converted into a formal specification document.", "alignment": "left", "unique_id": "d5b037170996e9e594aead88ede3ff65", "edited": false, "extra": {}}, "target": {"markdown": "![d5b037170996e9e594aead88ede3ff65.jpeg](figures/d5b037170996e9e594aead88ede3ff65_ee9e9c0f.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:fig "text", "sub_type": "none", "markdown": "SIMD unit wavefront buffers, which can lead to a sub-core issue imbalance that cannot be remedied by modifying the wavefront scheduling algorithm.  \n\n", "text": "SIMD unit wavefront buffers, which can lead to a sub-core issue imbalance that cannot be remedied by modifying the wavefront scheduling algorithm.\n", "alignment": "left", "unique_id": "1dda9101df7702c8615857093825ab55", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SIMD unit wavefront buffers, which can lead to a sub-core issue imbalance that cannot be remedied by modifying the wavefront scheduling algorithm."}], "lineHeight": 0}}, "target": {"markdown": "SIMD 单元的波前缓冲区中，这可能导致子核心发射不均衡，而这种不均衡无法通过修改波前调度算法来消除。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "ee3fe3c46aecef2693a8529ca8955a31", "index": 33, "aliyun_index": 7, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "# III. IDENTIFYING SUB-CORE PERFORMANCE EFFECTS IN HARDWARE  \n\n", "text": "III. IDENTIFYING SUB-CORE PERFORMANCE EFFECTS IN HARDWARE\n", "alignment": "left", "unique_id": "ee3fe3c46aecef2693a8529ca8955a31", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "III. IDENTIFYING SUB-CORE PERFORMANCE EFFECTS IN"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "HARDWARE"}], "lineHeight": -54}}, "target": {"markdown": "# III. 在硬件中识别子核心性能影响", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "e4958473c6be7e29dbfb3ac6c1f7b6cf", "index": 34, "aliyun_index": 8, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "# A. Register File Bank Conflicts  \n\n", "text": "A. Register File Bank Conflicts\n", "alignment": "left", "unique_id": "e4958473c6be7e29dbfb3ac6c1f7b6cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Register File Bank Conflicts"}], "lineHeight": 0}}, "target": {"markdown": "## A. 寄存器文件体 bank 冲突", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "798725ec93b6043e9cadf81612a6f0c0", "index": 35, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "GPUs require huge register files to support the large amount of threads that can be scheduled each cycle. Such large structures have high area and power costs and it can be prohibitively expensive to add additional ports. Several techniques have been proposed to improve GPU register file throughput and reduce power and area requirements [29], [17], [41], [33], but register file banking is the simplest and most commonly used. Register file banking increases maximum bandwidth in a more efficient manner than adding ports, however bank conflicts reduce effective throughput. A bank conflict occurs if a warp instruction's operands are resident in the same bank, and therefore cannot be accessed in a single cycle. The compiler can reduce bank conflicts through carefully selected register assignment, however register access requests from other warps on the sub-core compete for register bank access, and their issue ordering is unknown at compile time.  \n\n", "text": "GPUs require huge register files to support the large amount of threads that can be scheduled each cycle. Such large structures have high area and power costs and it can be prohibitively expensive to add additional ports. Several techniques have been proposed to improve GPU register file throughput and reduce power and area requirements [29], [17], [41], [33], but register file banking is the simplest and most commonly used. Register file banking increases maximum bandwidth in a more efficient manner than adding ports, however bank conflicts reduce effective throughput. A bank conflict occurs if a warp instruction's operands are resident in the same bank, and therefore cannot be accessed in a single cycle. The compiler can reduce bank conflicts through carefully selected register assignment, however register access requests from other warps on the sub-core compete for register bank access, and their issue ordering is unknown at compile time.\n", "alignment": "left", "unique_id": "798725ec93b6043e9cadf81612a6f0c0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs require huge register files to support the large amount of threads that can be scheduled each cycle. Such large structures have high area and power costs and it can be prohibitively expensive to add additional ports. Several techniques have been proposed to improve GPU register file throughput and reduce power and area requirements [29], [17], [41], [33], but register file banking is the simplest and most commonly used. Register file banking increases maximum bandwidth in a more efficient manner than adding ports, however bank conflicts reduce effective throughput. A bank conflict occurs if a warp instruction's operands are resident in the same bank, and therefore cannot be accessed in a single cycle. The compiler can reduce bank conflicts through carefully selected register assignment, however register access requests from other warps on the sub-core compete for register bank access, and their issue ordering is unknown at compile time."}], "lineHeight": 0}}, "target": {"markdown": "GPU 需要庞大的寄存器文件以支持每个周期可调度的大量线程。这种庞大的结构会带来很高的面积和功耗开销，因此增加额外的端口可能成本过高。已有多种技术被提出以提升 GPU 寄存器文件的吞吐量，并降低功耗与面积需求 [29]、[17]、[41]、[33]，但寄存器文件分体（banking）是最简单且最常用的方法。寄存器文件分体以比增加端口更高效的方式提升最大带宽，然而体（bank）冲突会降低有效吞吐量。当一条 warp 指令的操作数位于同一体内时，就会发生体冲突，因此无法在单个周期内完成访问。编译器可以通过精心选择寄存器分配来减少体冲突，但来自子核心上其他 warp 的寄存器访问请求会竞争寄存器体访问权，并且这些请求的发射顺序在编译时是未知的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "d66721a07d97eb8d4b78c1247775f0ac", "index": 36, "aliyun_index": 10, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The Operand Collector is a GPU hardware structure described in Nvidia patents [47] [24] to reduce bank conflicts by  \n\n", "text": "The Operand Collector is a GPU hardware structure described in Nvidia patents [47] [24] to reduce bank conflicts by\n", "alignment": "left", "unique_id": "d66721a07d97eb8d4b78c1247775f0ac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The Operand Collector is a GPU hardware structure described in Nvidia patents [47] [24] to reduce bank conflicts by"}], "lineHeight": 0}}, "target": {"markdown": "操作数收集器（Operand Collector）是 Nvidia 专利 [47] [24] 中描述的一种 GPU 硬件结构，用于通过", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "78097a0d1264e78bba8aafd83cf4a154", "index": 37, "aliyun_index": 11, "page_num": 2, "ty
