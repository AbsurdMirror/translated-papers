ch thread block will be scheduled on which SM"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and sends and receives messages through the interconnect to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "communicate with each SM. Four key operations must occur"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "when a thread block is scheduled on an SM:"}], "lineHeight": -346}}, "target": {"markdown": "核心调度器替换为均衡的哈希函数即可有效实现这一目标。图 7 展示了在每个 SM 上支持哈希子核心 warp 分配所需的硬件结构。基线的轮询结构以黑色显示，支持哈希所需的额外结构以红色标记。线程块调度器（1）以线程块粒度在 SM 上分配和释放资源。它包含用于确定哪个线程块将被调度到哪个 SM 上的逻辑，并通过互连发送和接收消息以与每个 SM 通信。在线程块被调度到 SM 上时，必须执行四项关键操作：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "eebf0ed08b0c023b0aad6c76c49025e9", "index": 63, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "1) Allocate register file space  \n\n", "text": "1) Allocate register file space\n", "alignment": "left", "unique_id": "eebf0ed08b0c023b0aad6c76c49025e9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) Allocate register file space"}], "lineHeight": 0}}, "target": {"markdown": "1）分配寄存器文件空间", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "267b843f959b6b721dc6a3084502982c", "index": 64, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "2) Allocate shared memory space  \n\n", "text": "2) Allocate shared memory space\n", "alignment": "left", "unique_id": "267b843f959b6b721dc6a3084502982c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Allocate shared memory space"}], "lineHeight": 0}}, "target": {"markdown": "2）分配共享内存空间", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 64}, {"source": {"block_id": "7e340aa5761961d81b7f25f21923affc", "index": 65, "aliyun_index": 10, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "3) Write kernel arguments to constant memory  \n\n", "text": "3) Write kernel arguments to constant memory\n", "alignment": "left", "unique_id": "7e340aa5761961d81b7f25f21923affc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3) Write kernel arguments to constant memory"}], "lineHeight": 0}}, "target": {"markdown": "3) 将内核参数写入常量内存", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "149a5f8c2835df691f79b3645fcf4c93", "index": 66, "aliyun_index": 11, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "4) Load warp program counters (PCs) into warp scheduler\nPC tables  \n\n", "text": "4) Load warp program counters (PCs) into warp scheduler\nPC tables\n", "alignment": "left", "unique_id": "149a5f8c2835df691f79b3645fcf4c93", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4) Load warp program counters (PCs) into warp scheduler"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "PC tables"}], "lineHeight": -52}}, "target": {"markdown": "4) 将 warp 程序计数器（PC）加载到 warp 调度器 PC 表中", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "c635adf65bbe14579904317dba791f68", "index": 67, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "In order to perform these operations the thread block scheduling unit encodes information about the thread block (such as shared memory size, kernel arguments, number of threads, etc) and sends it over the interconnect to the SM being scheduled. Upon receiving the data, the SM Interconnect Arbiter (②) fills the corresponding storage structures within the SM. Likewise, when a thread block completes execution the SM sends a message through the interconnect to the thread block scheduling unit to notify it of the freed resources. Each sub-core has its own warp scheduler and each warp scheduler contains a warp PC table (⑧). In the baseline architecture a thread block is allocated on an SM by filling the sub-cores' warp scheduler PC table through a round robin multiplexer. The method in which the SM loads warp PCs into the warp scheduler tables forms the crux of the sub-core assignment balancing problem. The baseline round robin assignment can be implemented by a 4:1 multiplexer (③) with select lines driven by a 2-bit binary up-counter (④) that increments each time a new warp in the thread block is assigned to a sub-core.  \n\n", "text": "In order to perform these operations the thread block scheduling unit encodes information about the thread block (such as shared memory size, kernel arguments, number of threads, etc) and sends it over the interconnect to the SM being scheduled. Upon receiving the data, the SM Interconnect Arbiter (②) fills the corresponding storage structures within the SM. Likewise, when a thread block completes execution the SM sends a message through the interconnect to the thread block scheduling unit to notify it of the freed resources. Each sub-core has its own warp scheduler and each warp scheduler contains a warp PC table (⑧). In the baseline architecture a thread block is allocated on an SM by filling the sub-cores' warp scheduler PC table through a round robin multiplexer. The method in which the SM loads warp PCs into the warp scheduler tables forms the crux of the sub-core assignment balancing problem. The baseline round robin assignment can be implemented by a 4:1 multiplexer (③) with select lines driven by a 2-bit binary up-counter (④) that increments each time a new warp in the thread block is assigned to a sub-core.\n", "alignment": "left", "unique_id": "c635adf65bbe14579904317dba791f68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In order to perform these operations the thread block scheduling unit encodes information about the thread block (such as shared memory size, kernel arguments, number of threads, etc) and sends it over the interconnect to the SM being scheduled. Upon receiving the data, the SM Interconnect Arbiter (②) fills the corresponding storage structures within the SM. Likewise, when a thread block completes execution the SM sends a message through the interconnect to the thread block scheduling unit to notify it of the freed resources. Each sub-core has its own warp scheduler and each warp scheduler contains a warp PC table (⑧). In the baseline architecture a thread block is allocated on an SM by filling the sub-cores' warp scheduler PC table through a round robin multiplexer. The method in which the SM loads warp PCs into the warp scheduler tables forms the crux of the sub-core assignment balancing problem. The baseline round robin assignment can be implemented by a 4:1 multiplexer (③) with select lines driven by a 2-bit binary up-counter (④) that increments each time a new warp in the thread block is assigned to a sub-core."}], "lineHeight": 0}}, "target": {"markdown": "为了执行这些操作，线程块调度单元会编码有关线程块的信息（如共享内存大小、内核参数、线程数量等），并通过互连将其发送至被调度的 SM。SM 接收到数据后，SM 互连仲裁器（②）会填充 SM 内相应的存储结构。同样，当线程块执行完毕后，SM 会通过互连向线程块调度单元发送消息，通知其资源已释放。每个子核心都有自己的 warp 调度器，而每个 warp 调度器都包含一个 warp PC 表（⑧）。在基线架构中，线程块通过轮询多路复用器填充各子核心的 warp 调度器 PC 表，从而分配到某个 SM。SM 将 warp PC 加载至 warp 调度器表的方式，是子核心分配均衡问题的关键。基线的轮询分配可由一个 4:1 多路复用器（③）实现；其选择信号由一个 2 位二进制递增计数器（④）驱动，每当线程块中的一个新 warp 被分配到某个子核心时，该计数器便递增一次。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "060c9b071028d0de02028194cbd8d3c5", "index": 68, "aliyun_index": 13, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "To support hashed sub-core assignment we add a small 4-entry hash function table (5), an additional 4:1 multiplexer  \n\n", "text": "To support hashed sub-core assignment we add a small 4-entry hash function table (5), an additional 4:1 multiplexer\n", "alignment": "left", "unique_id": "060c9b071028d0de02028194cbd8d3c5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To support hashed sub-core assignment we add a small 4-entry hash function table (5), an additional 4:1 multiplexer"}], "lineHeight": 0}}, "target": {"markdown": "为了支持哈希子核心分配，我们新增了一个小型 4 项哈希函数表（⑤）以及一个额外的 4:1 多路复用器", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "7ee006bb1d9906f065110beac23205df", "index": 69, "aliyun_index": 0, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "(6), and two 4-bit shift registers (7). Each entry of the hash function table contains a 1 byte entry which determines the assignment of 4 consecutive warp assignments. The upper 4 bits are used to drive select line 0 of the sub-core multiplexer (3) while the bottom 4 bits are used to drive select line 1. Rather than incrementing the 2-bit counter upon each warp allocation, as is done in the baseline round-robin design, the interconnect arbiter instead shifts a bit from the hash function table into the shift register each time a new warp PC is written, while incrementing the 2-bit counter every 4th warp. In this manner, a new entry of the hash function table is selected every four warps. Note that the hash function table supports direct assignment for up to 16 warps, but a thread block may have up to 64 warps. The table simply wraps around, so the 17th warp would re-use the assignment pattern encoded in entry 0.  \n\n", "text": "(6), and two 4-bit shift registers (7). Each entry of the hash function table contains a 1 byte entry which determines the assignment of 4 consecutive warp assignments. The upper 4 bits are used to drive select line 0 of the sub-core multiplexer (3) while the bottom 4 bits are used to drive select line 1. Rather than incrementing the 2-bit counter upon each warp allocation, as is done in the baseline round-robin design, the interconnect arbiter instead shifts a bit from the hash function table into the shift register each time a new warp PC is written, while incrementing the 2-bit counter every 4th warp. In this manner, a new entry of the hash function table is selected every four warps. Note that the hash function table supports direct assignment for up to 16 warps, but a thread block may have up to 64 warps. The table simply wraps around, so the 17th warp would re-use the assignment pattern encoded in entry 0.\n", "alignment": "left", "unique_id": "7ee006bb1d9906f065110beac23205df", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(6), and two 4-bit shift registers (7). Each entry of the hash function table contains a 1 byte entry which determines the assignment of 4 consecutive warp assignments. The upper 4 bits are used to drive select line 0 of the sub-core multiplexer (3) while the bottom 4 bits are used to drive select line 1. Rather than incrementing the 2-bit counter upon each warp allocation, as is done in the baseline round-robin design, the interconnect arbiter instead shifts a bit from the hash function table into the shift register each time a new warp PC is written, while incrementing the 2-bit counter every 4th warp. In this manner, a new entry of the hash function table is selected every four warps. Note that the hash function table supports direct assignment for up to 16 warps, but a thread block may have up to 64 warps. The table simply wraps around, so the 17th warp would re-use the assignment pattern encoded in entry 0."}], "lineHeight": 0}}, "target": {"markdown": "（6）以及两个 4 位移位寄存器（⑦）。哈希函数表的每个表项包含 1 字节内容，用于确定连续 4 次 warp 分配的映射关系。其高 4 位用于驱动子核心多路复用器（③）的选择线 0，低 4 位用于驱动选择线 1。在每次 warp 分配时，互连仲裁器不再像基线轮询设计那样递增 2 位计数器，而是从哈希函数表中移出一位送入移位寄存器，并且每 4 个 warp 才将 2 位计数器递增一次。这样，每 4 个 warp 便从哈希函数表中选取一个新表项。需要注意的是，哈希函数表最多支持对 16 个 warp 进行直接分配，但一个线程块最多可包含 64 个 warp。该表仅简单地循环复用，因此第 17 个 warp 将重新使用表项 0 中编码的分配模式。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "e3a9c3bd261d8dfa83ad74aa0f9a0fa4", "index": 70, "aliyun_index": 1, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "2) Hash Function Sensitivity: While a particular sub-core assignment hashing function may be optimal for certain kernels, it may perform sub-optimally on applications with a different inter-warp-divergence distributions. We propose and evaluate two different hashing functions, Skewed Round Robin (SRR) and Random Shuffle. The SRR hashing function is shown in equation (1) below, where $N$ is the number of subcores and $W \\ge 0$ is a count of the number of warps previously allocated to this SM.  \n\n", "text": "2) Hash Function Sensitivity: While a particular sub-core assignment hashing function may be optimal for certain kernels, it may perform sub-optimally on applications with a different inter-warp-divergence distributions. We propose and evaluate two different hashing functions, Skewed Round Robin (SRR) and Random Shuffle. The SRR hashing function is shown in equation (1) below, where $N$ is the number of subcores and $W \\ge 0$ is a count of the number of warps previously allocated to this SM.\n", "alignment": "left", "unique_id": "e3a9c3bd261d8dfa83ad74aa0f9a0fa4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2) Hash Function Sensitivity: While a particular sub-core assignment hashing function may be optimal for certain kernels, it may perform sub-optimally on applications with a different inter-warp-divergence distributions. We propose and evaluate two different hashing functions, Skewed Round Robin (SRR) and Random Shuffle. The SRR hashing function is shown in equation (1) below, where $N$ is the number of subcores and $W \\ge 0$ is a count of the number of warps previously allocated to this SM."}], "lineHeight": 0}}, "target": {"markdown": "2）哈希函数敏感性：虽然特定的子核心分配哈希函数可能对某些内核是最优的，但在具有不同 warp 间发散分布的应用上，其表现可能欠佳。我们提出并评估了两种不同的哈希函数：偏置轮询（SRR）和随机置乱（Random Shuffle）。SRR 哈希函数如下方公式（1）所示，其中 $N$ 为子核心的数量，$W \\ge 0$ 为先前已分配到该 SM 的 warp 的计数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "331f44eb71b6e626b2549e3c8b7c1aa4", "index": 71, "aliyun_index": 2, "page_num": 5, "type": "formula", "sub_type": "none", "markdown": "$$ s u b c o r e I D=(W+\\lfloor{\\frac{W}{N}}\\rfloor)\\mod(N) $$  \n\n", "text": "$$ s u b c o r e I D=(W+\\lfloor{\\frac{W}{N}}\\rfloor)\\mod(N) $$\n", "alignment": "left", "unique_id": "331f44eb71b6e626b2549e3c8b7c1aa4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ s u b c o r e I D=(W+\\lfloor{\\frac{W}{N}}\\rfloor)\\mod(N) $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ s u b c o r e I D=(W+\\lfloor{\\frac{W}{N}}\\rfloor)\\mod(N) $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "fbe929539bfab42c5f3124c52c618382", "index": 72, "aliyun_index": 3, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "(1)  \n\n", "text": "(1)\n", "alignment": "left", "unique_id": "fbe929539bfab42c5f3124c52c618382", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(1)"}], "lineHeight": 0}}, "target": {"markdown": "（1）", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "14dcae21c1797d0fdf4e08e89ee0d504", "index": 73, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "We created the SRR hashing function to keep the number of warps per sub-core even, while shifting the subcoreID index by one every $N$ warps. This shifting factor was determined by examining the TPC-H benchmark and observing that most kernels exhibit a single long running warp every 4 warps. SRR was then crafted to evenly distribute the long-running warps among the sub-cores for applications that match this specific warp balance distribution.  \n\n", "text": "We created the SRR hashing function to keep the number of warps per sub-core even, while shifting the subcoreID index by one every $N$ warps. This shifting factor was determined by examining the TPC-H benchmark and observing that most kernels exhibit a single long running warp every 4 warps. SRR was then crafted to evenly distribute the long-running warps among the sub-cores for applications that match this specific warp balance distribution.\n", "alignment": "left", "unique_id": "14dcae21c1797d0fdf4e08e89ee0d504", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We created the SRR hashing function to keep the number of warps per sub-core even, while shifting the subcoreID index by one every $N$ warps. This shifting factor was determined by examining the TPC-H benchmark and observing that most kernels exhibit a single long running warp every 4 warps. SRR was then crafted to evenly distribute the long-running warps among the sub-cores for applications that match this specific warp balance distribution."}], "lineHeight": 0}}, "target": {"markdown": "我们提出 SRR 哈希函数，旨在保持每个子核心的 warp 数量均匀，同时每隔 $N$ 个 warp 将 subcoreID 索引偏移一位。这一偏移因子是通过考察 TPC-H 基准测试，并观察到多数内核每 4 个 warp 中会出现一个长时间运行的 warp 而确定的。随后针对符合该特定 warp 均衡分布特征的应用程序，SRR 被精心设计为能够将这些长运行 warp 均匀地分配到各子核心上。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "4ab61ea233ecf1607dd36e5843bba4f4", "index": 74, "aliyun_index": 5, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The Shuffle design randomly distributes incoming warps to sub-cores while ensuring that the number of warps assigned to each sub-core does not differ by more than one. Shuffle eliminates pathological imbalances but is suboptimal for highly imbalanced kernels. As the amount of inter-warp divergence of an application grows, an optimized sub-core warp assignment becomes increasingly critical. Figure 8 shows simulated performance of the unbalanced FMA application (described in Section III-B) as the amount of inter-warp divergence is scaled. Like the TPC-H benchmarks, the FMA application has one long running warp every four warps, and therefore is balanced ideally by the SRR hashing function. Note that the suboptimal assignment of Random Shuffle is increasingly detrimental as imbalance scales.  \n\n", "text": "The Shuffle design randomly distributes incoming warps to sub-cores while ensuring that the number of warps assigned to each sub-core does not differ by more than one. Shuffle eliminates pathological imbalances but is suboptimal for highly imbalanced kernels. As the amount of inter-warp divergence of an application grows, an optimized sub-core warp assignment becomes increasingly critical. Figure 8 shows simulated performance of the unbalanced FMA application (described in Section III-B) as the amount of inter-warp divergence is scaled. Like the TPC-H benchmarks, the FMA application has one long running warp every four warps, and therefore is balanced ideally by the SRR hashing function. Note that the suboptimal assignment of Random Shuffle is increasingly detrimental as imbalance scales.\n", "alignment": "left", "unique_id": "4ab61ea233ecf1607dd36e5843bba4f4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The Shuffle design randomly distributes incoming warps to sub-cores while ensuring that the number of warps assigned to each sub-core does not differ by more than one. Shuffle eliminates pathological imbalances but is suboptimal for highly imbalanced kernels. As the amount of inter-warp divergence of an application grows, an optimized sub-core warp assignment becomes increasingly critical. Figure 8 shows simulated performance of the unbalanced FMA application (described in Section III-B) as the amount of inter-warp divergence is scaled. Like the TPC-H benchmarks, the FMA application has one long running warp every four warps, and therefore is balanced ideally by the SRR hashing function. Note that the suboptimal assignment of Random Shuffle is increasingly detrimental as imbalance scales."}], "lineHeight": 0}}, "target": {"markdown": "随机置乱（Shuffle）设计将传入的 warp 随机分配到各个子核心，同时确保分配到每个子核心的 warp 数量之差不超过一个。Shuffle 消除了极端不均衡的情况，但对于高度不均衡的内核而言并非最优。随着应用程序 warp 间发散程度的增加，经过优化的子核心 warp 分配策略变得愈发关键。图 8 展示了不平衡 FMA 应用（见第 III-B 节）的模拟性能随 warp 间发散程度缩放的变化情况。与 TPC-H 基准测试类似，FMA 应用同样是每 4 个 warp 中存在一个长运行 warp，因此理想情况下可由 SRR 哈希函数实现均衡。需要注意的是，随着不均衡程度的加剧，随机置乱策略次优的分配方式所产生的不利影响也愈发显著。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "3e3af1b43eb561f92469f79aeedc57a6", "index": 75, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "3) Design Cost: The additional hardware required for hashed assignment is minimal. Each SM is augmented with a 4 byte table, an additional 4:1 multiplexer and two 4-bit shift registers. The table can be filled arbitrarily for each SM to support different assignment hashing functions. Warp sub-core assignment only occurs on kernel launch, not every cycle, and  \n\n", "text": "3) Design Cost: The additional hardware required for hashed assignment is minimal. Each SM is augmented with a 4 byte table, an additional 4:1 multiplexer and two 4-bit shift registers. The table can be filled arbitrarily for each SM to support different assignment hashing functions. Warp sub-core assignment only occurs on kernel launch, not every cycle, and\n", "alignment": "left", "unique_id": "3e3af1b43eb561f92469f79aeedc57a6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3) Design Cost: The additional hardware required for hashed assignment is minimal. Each SM is augmented with a 4 byte table, an additional 4:1 multiplexer and two 4-bit shift registers. The table can be filled arbitrarily for each SM to support different assignment hashing functions. Warp sub-core assignment only occurs on kernel launch, not every cycle, and"}], "lineHeight": 0}}, "target": {"markdown": "3）设计开销：实现哈希分配所需的额外硬件极少。每个 SM 仅需增加一个 4 字节表、一个额外的 4:1 多路复用器以及两个 4 位移位寄存器。该表可为每个 SM 任意填充，以支持不同的分配哈希函数。Warp 子核心分配仅在内核启动时执行，而无需每个周期都进行，", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "c4c1349512a0ff893c9e15c7e457baf9", "index": 76, "aliyun_index": 7, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![c4c1349512a0ff893c9e15c7e457baf9.jpeg](figures/c4c1349512a0ff893c9e15c7e457baf9_7e7a0401.png)  \n\n", "text": "以下是根据您提供的图表内容提取并整理的合法 Markdown 格式，准确保留所有步骤、细节和结构：\n\n---\n\n# 性能对比图：SRR vs Random-Shuffle\n\n## 图表说明\n\n该折线图展示了两种调度策略（**SRR** 与 **Random-Shuffle**）在不同“每非空线程 FMA 指令数”下的**归一化加速比（Normalized Speedup）**表现。\n\n---\n\n## 坐标轴定义\n\n- **X 轴（横轴）**：\n  - 标签：`# of FMA Instructions per Non-Empty Thread`\n  - 刻度值（对数尺度）：`10`, `100`, `1000`, `10000`\n\n- **Y 轴（纵轴）**：\n  - 标签：`Normalized Speedup`\n  - 刻度范围：`0` 到 `4`，步长为 `0.5`\n\n---\n\n## 数据系列\n\n### 1. SRR（蓝色方块线）\n\n| # of FMA Instructions per Non-Empty Thread | Normalized Speedup |\n|--------------------------------------------|--------------------|\n| 10                                         | ~1.0               |\n| 100                                        | ~1.8               |\n| 1000                                       | ~3.25              |\n| 10000                                      | ~3.65              |\n\n> 注：数值为目测估算，基于图中数据点位置。\n\n### 2. Random-Shuffle（橙色三角线）\n\n| # of FMA Instructions per Non-Empty Thread | Normalized Speedup |\n|--------------------------------------------|--------------------|\n| 10                                         | ~1.0               |\n| 100                                        | ~1.6               |\n| 1000                                       | ~2.25              |\n| 10000                                      | ~2.4               |\n\n> 注：数值为目测估算，基于图中数据点位置。\n\n---\n\n## 图例\n\n- **蓝色方块线 + “SRR”** → 表示 SRR 调度策略\n- **橙色三角线 + “Random-Shuffle”** → 表示 Random-Shuffle 调度策略\n\n---\n\n## 观察结论\n\n1. 在低负载（10 FMA/线程）时，两者性能几乎相同（归一化加速比 ≈ 1.0）。\n2. 随着 FMA 指令数增加，**SRR 始终优于 Random-Shuffle**。\n3. 在高负载（10000 FMA/线程）下：\n   - SRR 达到约 **3.65x** 加速\n   - Random-Shuffle 达到约 **2.4x** 加速\n4. SRR 的增益随负载增长更显著，尤其在 100→1000 区间斜率最大。\n\n---\n\n## 可视化建议（如需复现）\n\n```python\nimport matplotlib.pyplot as plt\nimport numpy as np\n\nx = [10, 100, 1000, 10000]\nsrr_y = [1.0, 1.8, 3.25, 3.65]\nrandom_shuffle_y = [1.0, 1.6, 2.25, 2.4]\n\nplt.figure(figsize=(8, 5))\nplt.plot(x, srr_y, marker='s', color='blue', label='SRR')\nplt.plot(x, random_shuffle_y, marker='^', color='orange', label='Random-Shuffle')\n\nplt.xscale('log')\nplt.xlabel('# of FMA Instructions per Non-Empty Thread')\nplt.ylabel('Normalized Speedup')\nplt.title('Performance Comparison: SRR vs Random-Shuffle')\nplt.legend()\nplt.grid(True, axis='y', linestyle='--', alpha=0.7)\nplt.xticks(x, labels=['10', '100', '1000', '10000'])\nplt.ylim(0, 4)\nplt.show()\n```\n\n---\n\n✅ 此 Markdown 文档完整保留了原始图表的所有关键信息，包括坐标轴、数据点趋势、图例、观察结论及可复现代码，适用于报告、论文或技术文档嵌入。\n\n--- \n\n如需进一步导出为 PDF、PNG 或添加误差棒等扩展功能，请告知。", "alignment": "left", "unique_id": "c4c1349512a0ff893c9e15c7e457baf9", "edited": false, "extra": {}}, "target": {"markdown": "![c4c1349512a0ff893c9e15c7e457baf9.jpeg](figures/c4c1349512a0ff893c9e15c7e457baf9_7e7a0401.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "51a12d569e32ee45382fefa7a124d9fb", "index": 77, "aliyun_index": 8, "page_num": 5, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 8: Simulated GPU microbenchmark - design performance of unbalanced FMA as imbalance scales  \n\n", "text": "Fig. 8: Simulated GPU microbenchmark - design performance of unbalanced FMA as imbalance scales\n", "alignment": "left", "unique_id": "51a12d569e32ee45382fefa7a124d9fb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 8: Simulated GPU microbenchmark - design performance of unbalanced FMA as imbalance scales"}], "lineHeight": 0}}, "target": {"markdown": "> 图 8：GPU 微基准测试仿真——不平衡 FMA 在不均衡程度变化时的设计性能", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "2968e597871c781042777d74128d1456", "index": 78, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "the additional multiplexer and shift register have a negligible\nincrease on overall assignment latency.  \n\n", "text": "the additional multiplexer and shift register have a negligible\nincrease on overall assignment latency.\n", "alignment": "left", "unique_id": "2968e597871c781042777d74128d1456", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the additional multiplexer and shift register have a negligible"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "increase on overall assignment latency."}], "lineHeight": -59}}, "target": {"markdown": "而新增的多路复用器和移位寄存器对整体分配延迟的影响可忽略不计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "c74676e3f0dac90475ac10927e544cdb", "index": 79, "aliyun_index": 10, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The V100 SM holds state for a maximum of 64 warps, and each entry encodes the assignment of 4 warps, so a 16 entry hash table is necessary to encode a unique assignment for each warp. However, a 4-entry table can be used to fully represent the SRR hashing function because the SRR pattern repeats every 16 warps. A full-sized 16-entry table enables the Random Shuffle hashing algorithm to avoid repeating permutations, but provides minimal performance benefit over a 4-entry table. We found a 16-entry table using Random Shuffle to be within 2% of the execution time of the 4-entry table across all benchmark suites studied.  \n\n", "text": "The V100 SM holds state for a maximum of 64 warps, and each entry encodes the assignment of 4 warps, so a 16 entry hash table is necessary to encode a unique assignment for each warp. However, a 4-entry table can be used to fully represent the SRR hashing function because the SRR pattern repeats every 16 warps. A full-sized 16-entry table enables the Random Shuffle hashing algorithm to avoid repeating permutations, but provides minimal performance benefit over a 4-entry table. We found a 16-entry table using Random Shuffle to be within 2% of the execution time of the 4-entry table across all benchmark suites studied.\n", "alignment": "left", "unique_id": "c74676e3f0dac90475ac10927e544cdb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The V100 SM holds state for a maximum of 64 warps, and each entry encodes the assignment of 4 warps, so a 16 entry hash table is necessary to encode a unique assignment for each warp. However, a 4-entry table can be used to fully represent the SRR hashing function because the SRR pattern repeats every 16 warps. A full-sized 16-entry table enables the Random Shuffle hashing algorithm to avoid repeating permutations, but provides minimal performance benefit over a 4-entry table. We found a 16-entry table using Random Shuffle to be within 2% of the execution time of the 4-entry table across all benchmark suites studied."}], "lineHeight": 0}}, "target": {"markdown": "V100 的 SM 最多可保存 64 个 warp 的状态，且每个表项编码 4 个 warp 的分配，因此需要使用 16 项哈希表，才能为每个 warp 编码唯一的分配关系。不过，由于 SRR 模式每 16 个 warp 重复一次，因此可使用 4 项哈希表完整表示 SRR 哈希函数。完整规模的 16 项表可使随机置乱哈希算法避免重复排列，但其相较于 4 项表带来的性能提升微乎其微。我们发现，在所研究的所有基准测试套件中，采用 16 项表和随机置乱算法的执行时间与采用 4 项表的执行时间相差不到 2%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "33449b18b59a08f3341b1f7fe21e9466", "index": 80, "aliyun_index": 11, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "# V. EXPERIMENTAL METHODOLOGY  \n\n", "text": "V. EXPERIMENTAL METHODOLOGY\n", "alignment": "left", "unique_id": "33449b18b59a08f3341b1f7fe21e9466", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "V. EXPERIMENTAL METHODOLOGY"}], "lineHeight": 0}}, "target": {"markdown": "# V. 实验方法", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "cdcdc68360960b4062e7af8c61004dba", "index": 81, "aliyun_index": 12, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "All designs were evaluated using the trace-based cycle accurate GPU simulator, Accel-Sim [38], with Nvidia Volta V100 performance models from GPGPU Sim 4.0 [18]. Accel-Sim was executed in trace-driven SASS mode such that accurate compiler register allocation and bank mappings were reflected in simulation. Each application was simulated to completion or a minimum of 5 billion instructions. The simulator was updated to accurately reflect the sub-core structures used in hardware for each stage of the pipeline. The Volta V100 model has 80 SMs per GPU, but the number of SMs was limited to 20 while evaluating the TPC-H benchmarks to more accurately model the load seen at larger scale factors. Database Management Systems (DBMS) applications typically run on databases with scale factors of 10 TB or more, but simulating queries with such a large scale factor would take prohibitively long, so a scale factor of 100 GB was used. Moreover, as the sub-core balancing problem is concerned with warp completion times, it is desirable to have the entire query simulate to completion in order to fully capture its behavior.  \n\n", "text": "All designs were evaluated using the trace-based cycle accurate GPU simulator, Accel-Sim [38], with Nvidia Volta V100 performance models from GPGPU Sim 4.0 [18]. Accel-Sim was executed in trace-driven SASS mode such that accurate compiler register allocation and bank mappings were reflected in simulation. Each application was simulated to completion or a minimum of 5 billion instructions. The simulator was updated to accurately reflect the sub-core structures used in hardware for each stage of the pipeline. The Volta V100 model has 80 SMs per GPU, but the number of SMs was limited to 20 while evaluating the TPC-H benchmarks to more accurately model the load seen at larger scale factors. Database Management Systems (DBMS) applications typically run on databases with scale factors of 10 TB or more, but simulating queries with such a large scale factor would take prohibitively long, so a scale factor of 100 GB was used. Moreover, as the sub-core balancing problem is concerned with warp completion times, it is desirable to have the entire query simulate to completion in order to fully capture its behavior.\n", "alignment": "left", "unique_id": "cdcdc68360960b4062e7af8c61004dba", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "All designs were evaluated using the trace-based cycle accurate GPU simulator, Accel-Sim [38], with Nvidia Volta V100 performance models from GPGPU Sim 4.0 [18]. Accel-Sim was executed in trace-driven SASS mode such that accurate compiler register allocation and bank mappings were reflected in simulation. Each application was simulated to completion or a minimum of 5 billion instructions. The simulator was updated to accurately reflect the sub-core structures used in hardware for each stage of the pipeline. The Volta V100 model has 80 SMs per GPU, but the number of SMs was limited to 20 while evaluating the TPC-H benchmarks to more accurately model the load seen at larger scale factors. Database Management Systems (DBMS) applications typically run on databases with scale factors of 10 TB or more, but simulating queries with such a large scale factor would take prohibitively long, so a scale factor of 100 GB was used. Moreover, as the sub-core balancing problem is concerned with warp completion times, it is desirable to have the entire query simulate to completion in order to fully capture its behavior."}], "lineHeight": 0}}, "target": {"markdown": "所有设计均通过基于跟踪的、周期精确的 GPU 仿真器 Accel-Sim [38] 进行评估，该仿真器采用来自 GPGPU Sim 4.0 [18] 的 Nvidia Volta V100 性能模型。Accel-Sim 以跟踪驱动的 SASS 模式运行，从而可在仿真中准确反映编译器的寄存器分配与存储体映射。每个应用程序均仿真至完成，或至少运行 50 亿条指令。仿真器已进行更新，以准确反映流水线各阶段硬件中所使用的子核心结构。Volta V100 模型中每个 GPU 包含 80 个 SM，但在评估 TPC-H 基准测试时，将 SM 数量限制为 20 个，以便更准确地模拟更大规模因子下的负载。数据库管理系统（DBMS）应用程序通常运行在 10 TB 或更大规模因子的数据库上，但仿真如此大规模因子的查询所需时间过长，因此采用了 100 GB 的规模因子。此外，由于子核心均衡问题关注的是 warp 的完成时间，因此有必要对整个查询进行完整的仿真，以充分捕捉其行为特征。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "2f88d9c1c91e49e5dc12557c1413361a", "index": 82, "aliyun_index": 13, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Table II shows the baseline simulator configurations used for all performance modeling in this study. In order to validate the number of collector units in each SM sub core, we constructed a set of seven microbenchmarks that stress register file bank conflicts. We correlated the cycle count for these microbenchmarks reported by Accel-Sim using 1 to 4 CUs/sub-core with  \n\n", "text": "Table II shows the baseline simulator configurations used for all performance modeling in this study. In order to validate the number of collector units in each SM sub core, we constructed a set of seven microbenchmarks that stress register file bank conflicts. We correlated the cycle count for these microbenchmarks reported by Accel-Sim using 1 to 4 CUs/sub-core with\n", "alignment": "left" ": [], "display_order": 83}, {"source": {"block_id": "c7f00fe28ea3999188f8a9ca93dd3633", "index": 84, "aliyun_index": 1, "page_num": 6, "type": "table_name", "sub_type": "none", "markdown": ">TABLE II: Baseline simulator configuration parameters  \n\n", "text": "TABLE II: Baseline simulator configuration parameters\n", "alignment": "left", "unique_id": "c7f00fe28ea3999188f8a9ca93dd3633", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TABLE II: Baseline simulator configuration parameters"}], "lineHeight": 0}}, "target": {"markdown": "> 表 II：基础仿真器配置参数", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "6f09358a9f703ce08fdaa9fc9d87c548", "index": 85, "aliyun_index": 2, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "the silicon cycles from a Volta V100. We find that 2 CUs/sub-core yields the lowest mean absolute error at 16.2%, compared to 43% for the worst performing configuration. As a result, we use 2 CUs/sub-core (8 per SM) in our baseline GPU performance, area, and power results. 112 applications from 8 diverse benchmark suites were used for evaluation in this study. Table III summarizes a few key applications from each suite that are particularly sensitive to SM core partitioning.  \n\n", "text": "the silicon cycles from a Volta V100. We find that 2 CUs/sub-core yields the lowest mean absolute error at 16.2%, compared to 43% for the worst performing configuration. As a result, we use 2 CUs/sub-core (8 per SM) in our baseline GPU performance, area, and power results. 112 applications from 8 diverse benchmark suites were used for evaluation in this study. Table III summarizes a few key applications from each suite that are particularly sensitive to SM core partitioning.\n", "alignment": "left", "unique_id": "6f09358a9f703ce08fdaa9fc9d87c548", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the silicon cycles from a Volta V100. We find that 2 CUs/sub-core yields the lowest mean absolute error at 16.2%, compared to 43% for the worst performing configuration. As a result, we use 2 CUs/sub-core (8 per SM) in our baseline GPU performance, area, and power results. 112 applications from 8 diverse benchmark suites were used for evaluation in this study. Table III summarizes a few key applications from each suite that are particularly sensitive to SM core partitioning."}], "lineHeight": 0}}, "target": {"markdown": "实际硬件测得的硅周期进行了相关性分析。我们发现，采用 2 个 CU/子核心时所得的平均绝对误差最低，仅为 16.2%，而表现最差的配置则高达 43%。因此，在 GPU 性能、面积与功耗的基础结果中，我们采用了 2 个 CU/子核心（即每个 SM 8 个）。本研究共使用来自 8 个不同基准测试套件的 112 个应用程序进行评估。表 III 总结了每个套件中若干对 SM 内核划分尤为敏感的关键应用程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "bb4c8b601d16931f40d7b63ed3d325ef", "index": 86, "aliyun_index": 3, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "TPC-H is a database benchmark standardized by the Transactional Processing Performance Council (TPC) [10]. TPC-H includes 22 SQL queries and operates on data tables generated from a set of templates. SQL queries and data tables can be directly input to Apache Spark through the SQL API. The spark-rapids plug-in [31] and Rapids C++ libraries [11] are open-source projects actively developed by Nvidia which provide GPU implementations of most Apache Spark operations and data transformations. Thus, Apache Spark applications, including SQL queries, can be executed on GPUs with no change to the application code. All of the TPC-H benchmark queries execute on a common database, however the SQL operations across queries is diverse. Therefore the characteristics and performance profile of each query can be wildly different. Two versions of the TPC-H benchmark were evaluated in this study, compressed and uncompressed. In the compressed benchmark the database has been stored in parquet files that have been compressed using Google's snappy compression algorithm [15]. The uncompressed benchmark uses database information stored in raw parquet files.  \n\n", "text": "TPC-H is a database benchmark standardized by the Transactional Processing Performance Council (TPC) [10]. TPC-H includes 22 SQL queries and operates on data tables generated from a set of templates. SQL queries and data tables can be directly input to Apache Spark through the SQL API. The spark-rapids plug-in [31] and Rapids C++ libraries [11] are open-source projects actively developed by Nvidia which provide GPU implementations of most Apache Spark operations and data transformations. Thus, Apache Spark applications, including SQL queries, can be executed on GPUs with no change to the application code. All of the TPC-H benchmark queries execute on a common database, however the SQL operations across queries is diverse. Therefore the characteristics and performance profile of each query can be wildly different. Two versions of the TPC-H benchmark were evaluated in this study, compressed and uncompressed. In the compressed benchmark the database has been stored in parquet files that have been compressed using Google's snappy compression algorithm [15]. The uncompressed benchmark uses database information stored in raw parquet files.\n", "alignment": "left", "unique_id": "bb4c8b601d16931f40d7b63ed3d325ef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TPC-H is a database benchmark standardized by the Transactional Processing Performance Council (TPC) [10]. TPC-H includes 22 SQL queries and operates on data tables generated from a set of templates. SQL queries and data tables can be directly input to Apache Spark through the SQL API. The spark-rapids plug-in [31] and Rapids C++ libraries [11] are open-source projects actively developed by Nvidia which provide GPU implementations of most Apache Spark operations and data transformations. Thus, Apache Spark applications, including SQL queries, can be executed on GPUs with no change to the application code. All of the TPC-H benchmark queries execute on a common database, however the SQL operations across queries is diverse. Therefore the characteristics and performance profile of each query can be wildly different. Two versions of the TPC-H benchmark were evaluated in this study, compressed and uncompressed. In the compressed benchmark the database has been stored in parquet files that have been compressed using Google's snappy compression algorithm [15]. The uncompressed benchmark uses database information stored in raw parquet files."}], "lineHeight": 0}}, "target": {"markdown": "TPC-H 是由事务处理性能委员会（TPC）[10] 标准化的一套数据库基准测试。TPC-H 包含 22 条 SQL 查询，并作用于由一组模板生成的数据表之上。SQL 查询和数据表可通过 SQL API 直接输入至 Apache Spark。spark-rapids 插件 [31] 与 Rapids C++ 库 [11] 是由 Nvidia 积极开发的开源项目，提供了大多数 Apache Spark 操作及数据转换的 GPU 实现。因此，包括 SQL 查询在内的 Apache Spark 应用程序可在不修改任何应用代码的情况下直接在 GPU 上运行。所有 TPC-H 基准查询均基于同一公共数据库执行，但各查询所涉及的 SQL 操作差异显著。因此，各查询的特性与性能表现可能存在极大差异。本研究对压缩与非压缩两个版本的 TPC-H 基准进行了评估。在压缩版本中，数据库存储于使用 Google 的 snappy 压缩算法 [15] 压缩后的 parquet 文件中；非压缩版本则使用以原始 parquet 文件存储的数据库信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "8d3d341cba9d3677bd043481c59a4548", "index": 87, "aliyun_index": 4, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Similar to spark-rapids, cuGraph supports applications expressed in high level languages such as Python and executes on top of optimized Nvidia Rapids C++ libraries. All benchmarks were run with input graphs containing 262,144 vertices with randomly generated edges and weights.  \n\n", "text": "Similar to spark-rapids, cuGraph supports applications expressed in high level languages such as Python and executes on top of optimized Nvidia Rapids C++ libraries. All benchmarks were run with input graphs containing 262,144 vertices with randomly generated edges and weights.\n", "alignment": "left", "unique_id": "8d3d341cba9d3677bd043481c59a4548", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Similar to spark-rapids, cuGraph supports applications expressed in high level languages such as Python and executes on top of optimized Nvidia Rapids C++ libraries. All benchmarks were run with input graphs containing 262,144 vertices with randomly generated edges and weights."}], "lineHeight": 0}}, "target": {"markdown": "与 spark-rapids 类似，cuGraph 支持使用 Python 等高级语言编写的应用程序，并运行于经过优化的 Nvidia Rapids C++ 库之上。所有基准测试均使用包含 262,144 个顶点的输入图运行，其中的边和权重均为随机生成。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 87}, {"source": {"block_id": "6ca9527e1791d5a4928ed1f111c5a29c", "index": 88, "aliyun_index": 5, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Additional benchmarks come from Rodinia [22], a benchmark suite with a broad range of parallel communication patterns, Cutlass [12], a high performance GPU matrix multiplication suite, Parboil [55], a suite of throughput computing applications, Polybench [30], a suite of benchmarks with static control flow, and Deepbench [13] a CNN/RNN deep learning suite.  \n\n", "text": "Additional benchmarks come from Rodinia [22], a benchmark suite with a broad range of parallel communication patterns, Cutlass [12], a high performance GPU matrix multiplication suite, Parboil [55], a suite of throughput computing applications, Polybench [30], a suite of benchmarks with static control flow, and Deepbench [13] a CNN/RNN deep learning suite.\n", "alignment": "left", "unique_id": "6ca9527e1791d5a4928ed1f111c5a29c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Additional benchmarks come from Rodinia [22], a benchmark suite with a broad range of parallel communication patterns, Cutlass [12], a high performance GPU matrix multiplication suite, Parboil [55], a suite of throughput computing applications, Polybench [30], a suite of benchmarks with static control flow, and Deepbench [13] a CNN/RNN deep learning suite."}], "lineHeight": 0}}, "target": {"markdown": "其他基准测试还包括：Rodinia [22]，一个涵盖多种并行通信模式的基准测试套件；Cutlass [12]，一个高性能 GPU 矩阵乘法套件；Parboil [55]，一个吞吐量计算应用程序套件；Polybench [30]，一个具有静态控制流的基准测试套件；以及 Deepbench [13]，一个面向 CNN/RNN 的深度学习套件。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "4a4cffe475977bdc20cdb86eb135bf08", "index": 89, "aliyun_index": 6, "page_num": 6, "type": "table", "sub_type": "none", "markdown": "| Abbreviation|Suite|Name|\n| ---|---|---|\n| tpcU-q8|TPC-H Uncompressed [10]|Query 8|\n| tpcC-q9|TPC-H Compressed [10]|Query 9|\n| pb-mriq|Parboil [55]|Magnetic Resonance Imaging Q|\n| pb-mrig|Parboil [55]|Magnetic Resonance Imaging Gridding|\n| pb-sad|Parboil [55]|Sum of Absolute Differences|\n| pb-sgemm|Parboil [55]|Single Precision Dense Matrix Multiply|\n| pb-cutcp|Parboil [55]|Distance-Cutoff Coulombic Potential|\n| cutlass xt": "Fig. 9: Design performance on all applications - speedup normalized to GTO warp scheduler & RR sub-core scheduler"}], "lineHeight": 0}}, "target": {"markdown": "> 图 9：所有应用程序上的设计性能 —— 加速比以 GTO warp 调度器与 RR 子核心调度器为基准进行归一化", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 92}, {"source": {"block_id": "78641d23c9db0e1393bde38777f88a89", "index": 93, "aliyun_index": 10, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "# VI. EXPERIMENTAL RESULTS  \n\n", "text": "VI. EXPERIMENTAL RESULTS\n", "alignment": "left", "unique_id": "78641d23c9db0e1393bde38777f88a89", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "VI. EXPERIMENTAL RESULTS"}], "lineHeight": 0}}, "target": {"markdown": "# VI. 实验结果", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 93}, {"source": {"block_id": "afd99f4144d14f3d54b8f594a3775cde", "index": 94, "aliyun_index": 11, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Figure 9 shows the performance of our combined design on all applications from all 8 suites. Across all applications, Shuffle+RBA had an average speedup of 10.6%, only 2.6% less than the 13.2% average speedup of the fully connected SM. Note that RBA outperforms fully connected in some applications (see section VI-A). Figure 10 summarizes the results of our designs and register bank stealing [36] on a subset of applications limited by the read operand stage or sub-core issue imbalance. The RBA warp scheduler achieved an average speedup of 11.1%. RBA performs better than doubling  \n\n", "text": "Figure 9 shows the performance of our combined design on all applications from all 8 suites. Across all applications, Shuffle+RBA had an average speedup of 10.6%, only 2.6% less than the 13.2% average speedup of the fully connected SM. Note that RBA outperforms fully connected in some applications (see section VI-A). Figure 10 summarizes the results of our designs and register bank stealing [36] on a subset of applications limited by the read operand stage or sub-core issue imbalance. The RBA warp scheduler achieved an average speedup of 11.1%. RBA performs better than doubling\n", "alignment": "left", "unique_id": "afd99f4144d14f3d54b8f594a3775cde", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 9 shows the performance of our combined design on all applications from all 8 suites. Across all applications, Shuffle+RBA had an average speedup of 10.6%, only 2.6% less than the 13.2% average speedup of the fully connected SM. Note that RBA outperforms fully connected in some applications (see section VI-A). Figure 10 summarizes the results of our designs and register bank stealing [36] on a subset of applications limited by the read operand stage or sub-core issue imbalance. The RBA warp scheduler achieved an average speedup of 11.1%. RBA performs better than doubling"}], "lineHeight": 0}}, "target": {"markdown": "图 9 展示了我们的组合设计在来自全部 8 个套件的所有应用程序上的性能。在所有应用程序中，Shuffle+RBA 的平均加速比为 10.6%，仅比全互连 SM 的平均加速比 13.2% 低 2.6%。值得注意的是，RBA 在某些应用程序上的表现优于全互连（参见第 VI-A 节）。图 10 总结了我们的设计以及寄存器体挪用（register bank stealing）[36] 在一部分受读操作数阶段或子核心发射失衡限制的应用程序上的结果。RBA warp 调度器取得了 11.1% 的平均加速比。RBA 在性能上优于将资源翻倍", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 94}, {"source": {"block_id": "3454df86a2e3098b8ed269945c556f1c", "index": 95, "aliyun_index": 0, "page_num": 7, "type": "figure", "sub_type": "none", "markdown": "![3454df86a2e3098b8ed269945c556f1c.jpeg](figures/3454df86a2e3098b8ed269945c556f1c_861e70a0.png)  \n\n", "text": "以下是根据您提供的柱状图提取并整理的合法 Markdown 格式内容，完整保留所有标签、数据系列、坐标轴信息及图例：\n\n---\n\n# Speedup Comparison Across Benchmarks\n\n## Chart Description\n\nThis bar chart compares the **speedup** (relative to baseline = 1.0) achieved by six different optimization techniques across a set of benchmark programs. The y-axis represents speedup ratio, ranging from 0.9 to 1.8. The x-axis lists individual benchmarks and a geometric mean (“Geomean”) at the far right.\n\n## Data Series (Legend)\n\nThe following optimization methods are compared:\n\n- **Baseline** — Blue bars (reference, speedup = 1.0)\n- **Shuffle** — Orange bars\n- **Bank-steal [36]** — Dark blue bars\n- **RBA** — Yellow bars\n- **Shuffle+RBA** — Light blue bars\n- **Fully-Connected** — Green bars\n\n> Note: “Bank-steal [36]” refers to a technique cited in reference [36].\n\n## Benchmarks Listed on X-Axis\n\nBenchmarks are grouped roughly by domain or origin:\n\n### IPC / SPEC-like:\n- `lpcU-lq8`\n- `lpcC-q9`\n- `rod-lavaMD`\n- `rod-hisp`\n- `rod-bp`\n- `rod-srad`\n\n### PB (Polybench?):\n- `pb-mriq`\n- `pb-mrig`\n- `pb-sad`\n- `pb-sgemm`\n- `pb-cutcp`\n- `cutlass-4096`\n\n### CG (Computer Graphics? or Conjugate Gradient?):\n- `cg-lou`\n- `cg-bfs`\n- `cg-sssp`\n- `cg-pgmk`\n- `cg-wcc`\n- `cg-katz`\n- `cg-hits`\n\n### PLY (Polygonal mesh processing?):\n- `ply-2deon`\n- `ply-3deon`\n\n### DB (Database?):\n- `db-conv-tr`\n- `db-conv-inf`\n- `db-rnn-tr`\n- `db-rnn-inf`\n\n### Summary Metric:\n- `Geomean` — Geometric mean of all benchmarks for each method\n\n## Observations (Visual Interpretation)\n\n- Most optimizations yield modest speedups (typically between 1.0x–1.2x).\n- **Fully-Connected** (green) shows the highest peak speedup (~1.8x) on `rod-lavaMD`.\n- **Shuffle** (orange) achieves ~1.5x on `lpcC-q9`.\n- **Shuffle+RBA** (light blue) reaches ~1.55x on `rod-lavaMD`.\n- **RBA** (yellow) performs well on several CG benchmarks (e.g., `cg-lou`, `cg-bfs`, etc.), often exceeding 1.15x.\n- **Bank-steal [36]** (dark blue) generally stays close to baseline (1.0), with minor improvements.\n- The **Geomean** (far right) shows that most methods achieve slight overall improvement over baseline, with **Fully-Connected** and **Shuffle+RBA** leading slightly.\n\n## Axis Labels\n\n- **Y-axis**: `Speedup` (scale: 0.9 to 1.8, gridlines every 0.1)\n- **X-axis**: Benchmark names (rotated 45° for readability)\n\n## Notes\n\n- All values are relative to Baseline (set to 1.0).\n- No error bars or confidence intervals shown.\n- Some benchmarks show negligible or no improvement under certain methods (bars near 1.0).\n- The green bar for `rod-lavaMD` is an outlier — significantly higher than others.\n\n---\n\n✅ This Markdown structure preserves all visual elements, labels, groupings, and interpretations without adding external assumptions beyond what’s visually present. It can be used for documentation, reporting, or further analysis.\n\nLet me know if you’d like this exported as a table, CSV, or annotated image description!", "alignment": "left", "unique_id": "3454df86a2e3098b8ed269945c556f1c", "edited": false, "extra": {}}, "target": {"markdown": "![3454df86a2e3098b8ed269945c556f1c.jpeg](figures/3454df86a2e3098b8ed269945c556f1c_861e70a0.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 95}, {"source": {"block_id": "34560ee57b9494ccd039e604879e0425", "index": 96, "aliyun_index": 1, "page_num": 7, "type": "figure_name", "sub_type": "none", "markdown": ">Fig. 10: Summary design performance of applications sensitive to SM subdivision - speedup normalized to GTO warp scheduler & RR sub-core scheduler  \n\n", "text": "Fig. 10: Summary design performance of applications sensitive to SM subdivision - speedup normalized to GTO warp scheduler & RR sub-core scheduler\n", "alignment": "left", "unique_id": "34560ee57b9494ccd039e604879e0425", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Fig. 10: Summary design performance of applications sensitive to SM subdivision - speedup normalized to GTO warp scheduler & RR sub-core scheduler"}], "lineHeight": 0}}, "target": {"markdown": "> 图 10：对 SM 划分敏感的应用程序的设计性能总结 —— 加速比以 GTO warp 调度器与 RR 子核心调度器为基准进行归一化", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 96}, {"source": {"block_id": "aff1098ed50b5e00f6e58bdb8929de11", "index": 97, "aliyun_index": 2, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "the number of CUs per sub-core, which we will show achieves\nan average of 4.1%, while only increasing the power and area\nof the operand collector and warp scheduler by 1%.  \n\n", "text": "the number of CUs per sub-core, which we will show achieves\nan average of 4.1%, while only increasing the power and area\nof the operand collector and warp scheduler by 1%.\n", "alignment": "left", "unique_id": "aff1098ed50b5e00f6e58bdb8929de11", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the number of CUs per sub-core, which we will show achieves"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "an average of 4.1%, while only increasing the power and area"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of the operand collector and warp scheduler by 1%."}], "lineHeight": -84}}, "target": {"markdown": "每个子核心的 CU 数量，后文将证明其平均加速比仅为 4.1%，而操作数收集器和 warp 调度器的功耗与面积仅增加 1%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "530b77f3af13a8a5d0182217285a2f8c", "index": 98, "aliyun_index": 3, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We compared the effectiveness of RBA against register bank stealing [36], and found that bank stealing provides less than 1% speedup on average due to modern GPUs having fewer register banks and CUs per scheduler than prior generations. The V100 only has 2 CUs and banks per sub-core, whereas the GPU evaluated in [36] had 10. Bank stealing relies on free CUs to allocate a candidate warp ahead of normal issue to fill unused register bank accesses. As there are only 2 CUs per sub-core, opportunities for bank-stealing rarely arise. The aim of bank stealing is to better utilize highly banked register files that are often not being accessed, conversely RBA seeks to make better use of a highly contended register file with a limited number of banks. More details of RBAs effectiveness in reducing bank conflicts is discussed in section VI-B3.  \n\n", "text": "We compared the effectiveness of RBA against register bank stealing [36], and found that bank stealing provides less than 1% speedup on average due to modern GPUs having fewer register banks and CUs per scheduler than prior generations. The V100 only has 2 CUs and banks per sub-core, whereas the GPU evaluated in [36] had 10. Bank stealing relies on free CUs to allocate a candidate warp ahead of normal issue to fill unused register bank accesses. As there are only 2 CUs per sub-core, opportunities for bank-stealing rarely arise. The aim of bank stealing is to better utilize highly banked register files that are often not being accessed, conversely RBA seeks to make better use of a highly contended register file with a limited number of banks. More details of RBAs effectiveness in reducing bank conflicts is discussed in section VI-B3.\n", "alignment": "left", "unique_id": "530b77f3af13a8a5d0182217285a2f8c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We compared the effectiveness of RBA against register bank stealing [36], and found that bank stealing provides less than 1% speedup on average due to modern GPUs having fewer register banks and CUs per scheduler than prior generations. The V100 only has 2 CUs and banks per sub-core, whereas the GPU evaluated in [36] had 10. Bank stealing relies on free CUs to allocate a candidate warp ahead of normal issue to fill unused register bank accesses. As there are only 2 CUs per sub-core, opportunities for bank-stealing rarely arise. The aim of bank stealing is to better utilize highly banked register files that are often not being accessed, conversely RBA seeks to make better use of a highly contended register file with a limited number of banks. More details of RBAs effectiveness in reducing bank conflicts is discussed in section VI-B3."}], "lineHeight": 0}}, "target": {"markdown": "我们将 RBA 与寄存器体挪用（register bank stealing）[36] 的有效性进行了对比，结果发现由于现代 GPU 每个调度器所拥有的寄存器体和 CU 数量少于前几代产品，寄存器体挪用所带来的平均加速比不足 1%。V100 每个子核心仅有 2 个 CU 和寄存器体，而 [36] 中评估的 GPU 具有 10 个。寄存器体挪用依赖于空闲的 CU，以便在常规发射之前预先为候选 warp 分配资源，从而填补未被使用的寄存器体访问。由于每个子核心仅有 2 个 CU，寄存器体挪用的机会极少出现。寄存器体挪用的目标是更充分地利用通常未被访问的高度分体寄存器文件；与之相反，RBA 旨在更好地利用分体数量有限但访问高度竞争的寄存器文件。关于 RBA 在减少寄存器体冲突方面有效性的更多细节将在第 VI-B3 节中讨论。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 98}, {"source": {"block_id": "4f132800abd217d95cb0ddf2fbf83eac", "index": 99, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "The TPC-H SQL benchmarks exhibit large amounts of sub-core issue imbalance and therefore benefit most from shuffle and SRR. The larger imbalance in the compressed query benchmark is due to the highly warp-specialized snappy [15] decompression kernel, which has an average issue imbalance on the order of 100x. In applications where sub-core issue is not imbalanced the assignment techniques do not improve or degrade performance beyond the baseline RR sub-core scheduler. Further analysis of the sub-core assignment designs is discussed in section VI-C.  \n\n", "text": "The TPC-H SQL benchmarks exhibit large amounts of sub-core issue imbalance and therefore benefit most from shuffle and SRR. The larger imbalance in the compressed query benchmark is due to the highly warp-specialized snappy [15] decompression kernel, which has an average issue imbalance on the order of 100x. In applications where sub-core issue is not imbalanced the assignment techniques do not improve or degrade performance beyond the baseline RR sub-core scheduler. Further analysis of the sub-core assignment designs is discussed in section VI-C.\n", "alignment": "left", "unique_id": "4f132800abd217d95cb0ddf2fbf83eac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The TPC-H SQL benchmarks exhibit large amounts of sub-core issue imbalance and therefore benefit most from shuffle and SRR. The larger imbalance in the compressed query benchmark is due to the highly warp-specialized snappy [15] decompression kernel, which has an average issue imbalance on the order of 100x. In applications where sub-core issue is not imbalanced the assignment techniques do not improve or degrade performance beyond the baseline RR sub-core scheduler. Further analysis of the sub-core assignment designs is discussed in section VI-C."}], "lineHeight": 0}}, "target": {"markdown": "TPC-H SQL 基准测试中存在大量的子核心发射失衡，因此从 shuffle 和 SRR 中获益最多。压缩查询基准测试中失衡更为严重，原因是其高度 warp 专用的 snappy [15] 解压缩内核存在约 100 倍量级的平均发射失衡。在子核心发射不存在失衡的应用程序中，分配技术相较于基线 RR 子核心调度器既不会提升也不会降低性能。关于子核心分配设计的进一步分析将在第 VI-C 节中讨论。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 99}, {"source": {"block_id": "33668aa6bd2ce71746728a57101d5ab3", "index": 100, "aliyun_index": 5, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "# A. Why does RBA outperform fully-connected in some apps?  \n\n", "text": "A. Why does RBA outperform fully-connected in some apps?\n", "alignment": "left", "unique_id": "33668aa6bd2ce71746728a57101d5ab3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A. Why does RBA outperform fully-connected in some apps?"}], "lineHeight": 0}}, "target": {"markdown": "# A. 为什么 RBA 在某些应用程序上的表现优于全互连？", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 100}, {"source": {"block_id": "5f08fa96a8335daf7c8b84bb17f20fb4", "index": 101, "aliyun_index": 6, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "A fully connected SM allows each thread to distribute its operands across eight banks instead of two, but unlike a partitioned SM, must share bank accesses with requests from warps issued from all four schedulers. Applications with many register file accesses can still suffer conflicts with a fully connected SM. Figure 11 shows that RBA improves performance of a fully connected SM from a geomean of 6.1% to 19.6% in applications where RBA outperforms Fully-Connected. Additionally, figure 14(d-f) shows that RBA can achieve a higher average RF bank utilization than Fully-  \n\n", "text": "A fully connected SM allows each thread to distribute its operands across eight banks instead of two, but unlike a partitioned SM, must share bank accesses with requests from warps issued from all four schedulers. Applications with many register file accesses can still suffer conflicts with a fully connected SM. Figure 11 shows that RBA improves performance of a fully connected SM from a geomean of 6.1% to 19.6% in applications where RBA outperforms Fully-Connected. Additionally, figure 14(d-f) shows that RBA can achieve a higher average RF bank utilization than Fully-\n", "alignment": "left", "unique_id": "5f08fa96a8335daf7c8b84bb17f20fb4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A fully connected SM allows each thread to distribute its operands across eight banks instead of two, but unlike a partitioned SM, must share bank accesses with requests from warps issued from all four schedulers. Applications with many register file accesses can still suffer conflicts with a fully connected SM. Figure 11 shows that RBA improves performance of a fully connected SM from a geomean of 6.1% to 19.6% in applications where RBA outperforms Fully-Connected. Additionally, figure 14(d-f) shows that RBA can achieve a higher average RF bank utilization than Fully-"}], "lineHeight": 0}}, "target": {"markdown": "全互连 SM 允许每个线程将其操作数分布在 8 个寄存器体中而非 2 个，但与分区式 SM 不同的是，它必须与来自全部 4 个调度器所发射 warp 的请求共享寄存器体访问。对于寄存器文件访问密集的应用程序，全互连 SM 仍可能遭受冲突。图 11 表明，在 RBA 优于全互连的应用程序中，RBA 将全互连 SM 的性能从几何均值 6.1% 提升至 19.6%。此外，图 14(d-f) 表明 RBA 能够实现比全互连更高的平均寄存器文件体利用率——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_orde ncreased register file banking and full crossbar available in the fully connected SM. In applications other than the cugraph suite, the RBA scheduler achieved an average speedup of 6.7%, which is equivalent to the performance of between 4  \n\n", "text": "1) CU Scaling Performance: Figure 12 shows the performance as the number of CUs per sub-core scales. The values are normalized to a baseline model with 2 CUs per sub-core. Note that these results represent scaling the number of collector units only, the number of register banks per sub-core is held constant at two. The fully connected SM has the same total number of CUs as the baseline design but without sub-core partitioning, therefore each scheduler has access to a shared pool of 8 CUs, and operands can be mapped to any of the 8 banks on the SM. CU scaling improved average performance by 4.1%, 7.1%, and 9.6% for 4, 8, and 16 CUs per sub-core respectively. As shown in figure 10, the RBA scheduler achieved an average speedup of 11.9%. In all of the cugraph applications, the RBA scheduler outperformed the fully connected SM by 15% or more. The cuGraph applications have a large proportion of register intensive instructions, and are therefore sensitive to register file bandwidth. However, the graph applications tend to access a limited number of registers repeatedly and therefore do not benefit from the increased register file banking and full crossbar available in the fully connected SM. In applications other than the cugraph suite, the RBA scheduler achieved an average speedup of 6.7%, which is equivalent to the performance of between 4\n", "alignment": "left", "unique_id": "f0bc63bcf67c123c56722255d743e70d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1) CU Scaling Performance: Figure 12 shows the performance as the number of CUs per sub-
