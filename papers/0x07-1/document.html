 colored grid corresponds to the percentage of estimated dynamic power for that particular microarchitectural component ($x$-axis) in the designed microbenchmark ($y$-axis). For example, the execution unit for the functional microbenchmark in Figure 11 consumes 72.6% of the total dynamic power, with significantly less power consumed by the register file (Reg) and pipeline (Pipe)."}], "lineHeight": 0}}, "target": {"markdown": "我们以热力图（图 11）的形式展示微基准测试程序的功耗隔离效果，该图展示了一组具有代表性的组件级功耗隔离微基准测试程序（通过施加压力于某一组件）的各组件动态功耗分布。每个彩色网格对应于所设计微基准测试程序（$y$ 轴）中特定微架构组件（$x$ 轴）的估算动态功耗百分比。例如，图 11 中功能单元微基准测试程序消耗了总动态功耗的 72.6%，而寄存器文件（Reg）和流水线（Pipe）所消耗的功耗则显著较少。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "4f73da45be76f5e27755c2e3cdc9e592", "index": 152, "aliyun_index": 7, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Achieving component power isolation for the execution units and DRAM is easier. These two components consume 72.6% and 57.4% of the total power separately in their stress testing microbenchmarks. It is almost impossible to isolate L2 cache (L2-$) power from NOC power because each L2  \n\n", "text": "Achieving component power isolation for the execution units and DRAM is easier. These two components consume 72.6% and 57.4% of the total power separately in their stress testing microbenchmarks. It is almost impossible to isolate L2 cache (L2-$) power from NOC power because each L2\n", "alignment": "left", "unique_id": "4f73da45be76f5e27755c2e3cdc9e592", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Achieving component power isolation for the execution units and DRAM is easier. These two components consume 72.6% and 57.4% of the total power separately in their stress testing microbenchmarks. It is almost impossible to isolate L2 cache (L2-$) power from NOC power because each L2"}], "lineHeight": 0}}, "target": {"markdown": "实现执行单元和 DRAM 的功耗隔离较为容易。这两个组件在其压力测试微基准测试程序中分别消耗了总功耗的 72.6% 和 57.4%。由于每个 L2", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 152}, {"source": {"block_id": "dc4246d4049bd49eef54a0c350056baf", "index": 153, "aliyun_index": 8, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "cache access involves an NOC access. We also found that L1 caches (data, constant and texture) are hard to isolate. For instance, the L1 data cache (D-$) consumes 29.1% of the total power, whereas register file and execution units still consume 23.7% and 21.8% power separately. This extra power \"overhead\" is caused to some extent by the data dependencies (Figure 5) that we intentionally insert to prevent the compiler from optimizing away the microbenchmarking code. I In summary, the functional units and DRAM microbenchmarks achieve better power isolation on targeted components, thus total power error better indicates component modeling error. However, this does not mean other components have higher modeling errors. The reason is two fold. Firstly, we designed more complex patterns to exercise these components. Secondly, these components are majorly SRAM based arrays, which have less modeling uncertainty as compared to functional units and DRAM.  \n\n", "text": "cache access involves an NOC access. We also found that L1 caches (data, constant and texture) are hard to isolate. For instance, the L1 data cache (D-$) consumes 29.1% of the total power, whereas register file and execution units still consume 23.7% and 21.8% power separately. This extra power \"overhead\" is caused to some extent by the data dependencies (Figure 5) that we intentionally insert to prevent the compiler from optimizing away the microbenchmarking code. I In summary, the functional units and DRAM microbenchmarks achieve better power isolation on targeted components, thus total power error better indicates component modeling error. However, this does not mean other components have higher modeling errors. The reason is two fold. Firstly, we designed more complex patterns to exercise these components. Secondly, these components are majorly SRAM based arrays, which have less modeling uncertainty as compared to functional units and DRAM.\n", "alignment": "left", "unique_id": "dc4246d4049bd49eef54a0c350056baf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cache access involves an NOC access. We also found that L1 caches (data, constant and texture) are hard to isolate. For instance, the L1 data cache (D-$) consumes 29.1% of the total power, whereas register file and execution units still consume 23.7% and 21.8% power separately. This extra power \"overhead\" is caused to some extent by the data dependencies (Figure 5) that we intentionally insert to prevent the compiler from optimizing away the microbenchmarking code. I In summary, the functional units and DRAM microbenchmarks achieve better power isolation on targeted components, thus total power error better indicates component modeling error. However, this does not mean other components have higher modeling errors. The reason is two fold. Firstly, we designed more complex patterns to exercise these components. Secondly, these components are majorly SRAM based arrays, which have less modeling uncertainty as compared to functional units and DRAM."}], "lineHeight": 0}}, "target": {"markdown": "cache 访问都涉及一次 NOC 访问，因此几乎不可能将 L2 缓存（L2-$）的功耗与 NOC 的功耗隔离开来。我们还发现 L1 缓存（数据、常量和纹理）难以隔离。例如，L1 数据缓存（D-$）消耗了总功耗的 29.1%，而寄存器文件和执行单元仍分别消耗 23.7% 和 21.8% 的功耗。这些额外的功耗\"开销\"在一定程度上是由我们故意插入的数据依赖关系（图 5）造成的，目的是防止编译器将微基准测试代码优化掉。综上所述，功能单元和 DRAM 微基准测试程序在目标组件上实现了更好的功耗隔离，因此总功耗误差能更好地反映组件建模误差。但这并不意味着其他组件的建模误差更高。原因有二：首先，我们设计了更为复杂的模式来对这些组件施加压力；其次，这些组件主要是基于 SRAM 的阵列，与功能单元和 DRAM 相比，其建模不确定性更小。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 153}, {"source": {"block_id": "b0f2e5d006b5a6fc8ab5e89462970cd1", "index": 154, "aliyun_index": 9, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "#### 4.3.3 Benchmark Based Validation\n", "text": "4.3.3 Benchmark Based Validation\n", "alignment": "left", "unique_id": "b0f2e5d006b5a6fc8ab5e89462970cd1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.3.3 Benchmark Based Validation"}], "lineHeight": 0}}, "target": {"markdown": "#### 4.3.3 基于基准测试的验证\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 154}, {"source": {"block_id": "927bebc7dfcc0b7b7a92b490475bcca4", "index": 155, "aliyun_index": 10, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We evaluate the power model on a set of benchmarks that are not used in the refinement process. We use 25 kernels from the 13 different benchmarks presented in Figure 12. There are 18 kernels from the RODINIA suite [7] and 3 from the ISPASS suite [4]. We also include four microbenchmarks presented in prior work [13]. MGST kernels are not shown for the Quadro FX5600 because they fail to run on the card.  \n\n", "text": "We evaluate the power model on a set of benchmarks that are not used in the refinement process. We use 25 kernels from the 13 different benchmarks presented in Figure 12. There are 18 kernels from the RODINIA suite [7] and 3 from the ISPASS suite [4]. We also include four microbenchmarks presented in prior work [13]. MGST kernels are not shown for the Quadro FX5600 because they fail to run on the card.\n", "alignment": "left", "unique_id": "927bebc7dfcc0b7b7a92b490475bcca4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We evaluate the power model on a set of benchmarks that are not used in the refinement process. We use 25 kernels from the 13 different benchmarks presented in Figure 12. There are 18 kernels from the RODINIA suite [7] and 3 from the ISPASS suite [4]. We also include four microbenchmarks presented in prior work [13]. MGST kernels are not shown for the Quadro FX5600 because they fail to run on the card."}], "lineHeight": 0}}, "target": {"markdown": "我们在未用于模型优化过程的一组基准测试程序上对功耗模型进行了评估。我们使用了图 12 中所列出的 13 个不同基准测试程序中的 25 个内核。其中，来自 RODINIA 测试套件 [7] 的内核有 18 个，来自 ISPASS 测试套件 [4] 的有 3 个。此外，我们还纳入了先前工作 [13] 中所提出的 4 个微基准测试程序。由于 MGST 内核无法在 Quadro FX5600 显卡上运行，因此未在该显卡上展示其结果。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 155}, {"source": {"block_id": "256984218f3fd79bae75aa9ab56b6e50", "index": 156, "aliyun_index": 11, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "**Average Power** Figure 12 shows the our power model accuracy compared to measured power along with component-level breakdown of power consumption for both the GPU cards. The results are sorted in order of modeling accuracy. For GTX 480, the power model achieves an average  \n\n", "text": "**Average Power** Figure 12 shows the our power model accuracy compared to measured power along with component-level breakdown of power consumption for both the GPU cards. The results are sorted in order of modeling accuracy. For GTX 480, the power model achieves an average\n", "alignment": "left", "unique_id": "256984218f3fd79bae75aa9ab56b6e50", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Average Power** Figure 12 shows the our power model accuracy compared to measured power along with component-level breakdown of power consumption for both the GPU cards. The results are sorted in order of modeling accuracy. For GTX 480, the power model achieves an average"}], "lineHeight": 0}}, "target": {"markdown": "**平均功耗** 图 12 展示了我们的功耗模型与实测功耗相比的精度，以及两款 GPU 显卡的功耗在组件级别的分解情况。图中结果按建模精度排序。对于 GTX 480，功耗模型达到了平均", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 156}, {"source": {"block_id": "7b28980d3e53a9417b39624d9670a24b", "index": 157, "aliyun_index": 0, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "error within 9.9%. Memory-intensive kernels, such as the first kernel in KMN (KMN_K1) and CFD_K4, show more error due to the mismatch in memory hierarchies between our performance model and the real hardware.  \n\n", "text": "error within 9.9%. Memory-intensive kernels, such as the first kernel in KMN (KMN_K1) and CFD_K4, show more error due to the mismatch in memory hierarchies between our performance model and the real hardware.\n", "alignment": "left", "unique_id": "7b28980d3e53a9417b39624d9670a24b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "error within 9.9%. Memory-intensive kernels, such as the first kernel in KMN (KMN_K1) and CFD_K4, show more error due to the mismatch in memory hierarchies between our performance model and the real hardware."}], "lineHeight": 0}}, "target": {"markdown": "误差在 9.9% 以内。内存密集型内核，如 KMN 中的第一个内核（KMN_K1）和 CFD_K4，由于我们的性能模型与实际硬件之间的内存层次结构不匹配，表现出更大的误差。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 157}, {"source": {"block_id": "d37895352c17157fe2f9b774fde5913e", "index": 158, "aliyun_index": 1, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "For the Quadro FX5600 card, the model obtains an average error of 13.4%. The results are weaker because GPGPU-Sim's performance correlation, in terms of execution time, is 90% for this card and 93% for the GTX 480. Moreover, the number of evaluated benchmarks for Quadro FX5600 is less than that used for GTX 480 because this card does not support the computation ability required by MGST.  \n\n", "text": "For the Quadro FX5600 card, the model obtains an average error of 13.4%. The results are weaker because GPGPU-Sim's performance correlation, in terms of execution time, is 90% for this card and 93% for the GTX 480. Moreover, the number of evaluated benchmarks for Quadro FX5600 is less than that used for GTX 480 because this card does not support the computation ability required by MGST.\n", "alignment": "left", "unique_id": "d37895352c17157fe2f9b774fde5913e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For the Quadro FX5600 card, the model obtains an average error of 13.4%. The results are weaker because GPGPU-Sim's performance correlation, in terms of execution time, is 90% for this card and 93% for the GTX 480. Moreover, the number of evaluated benchmarks for Quadro FX5600 is less than that used for GTX 480 because this card does not support the computation ability required by MGST."}], "lineHeight": 0}}, "target": {"markdown": "对于 Quadro FX5600 显卡，模型的平均误差为 13.4%。其结果略差，原因在于 GPGPU-Sim 在执行时间上的性能相关性在该显卡上为 90%，而在 GTX 480 上为 93%。此外，由于 Quadro FX5600 不支持 MGST 所需的计算能力，因此在该显卡上评估的基准测试程序数量少于 GTX 480 所使用的数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "a64ba5a6677a373f05bb2b929b7e140a", "index": 159, "aliyun_index": 2, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Comparing the performance per watt, we deduce that the GTX 480 is 3× better than Quadro FX5600. GTX 480 consumes 1.33× the total power of the latter, but it is ~4× faster in performance. The contributing factors include several changes in the GTX 480 for energy efficiency and performance, such as the presence of more functional units, increased SIMD width and the introduction of data caches. The only kernels that show a decrease in the overall performance per watt are KMN_K1, MUM_K1 and LIB_K1. They do not have enough data locality to utilize the caches effectively, and thus retrieve data more often from DRAM.  \n\n", "text": "Comparing the performance per watt, we deduce that the GTX 480 is 3× better than Quadro FX5600. GTX 480 consumes 1.33× the total power of the latter, but it is ~4× faster in performance. The contributing factors include several changes in the GTX 480 for energy efficiency and performance, such as the presence of more functional units, increased SIMD width and the introduction of data caches. The only kernels that show a decrease in the overall performance per watt are KMN_K1, MUM_K1 and LIB_K1. They do not have enough data locality to utilize the caches effectively, and thus retrieve data more often from DRAM.\n", "alignment": "left", "unique_id": "a64ba5a6677a373f05bb2b929b7e140a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Comparing the performance per watt, we deduce that the GTX 480 is 3× better than Quadro FX5600. GTX 480 consumes 1.33× the total power of the latter, but it is ~4× faster in performance. The contributing factors include several changes in the GTX 480 for energy efficiency and performance, such as the presence of more functional units, increased SIMD width and the introduction of data caches. The only kernels that show a decrease in the overall performance per watt are KMN_K1, MUM_K1 and LIB_K1. They do not have enough data locality to utilize the caches effectively, and thus retrieve data more often from DRAM."}], "lineHeight": 0}}, "target": {"markdown": "比较每瓦性能，我们推断 GTX 480 比 Quadro FX5600 好 3 倍。GTX 480 的总功耗是后者的 1.33 倍，但性能约为其 4 倍。促成这一结果的因素包括 GTX 480 为提高能源效率和性能而进行的多项改进，例如配备更多功能单元、增加 SIMD 宽度以及引入数据缓存。只有 KMN_K1、MUM_K1 和 LIB_K1 内核的整体每瓦性能有所下降。这些内核的数据局部性不足，无法有效利用缓存，因此需要更频繁地从 DRAM 读取数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "fff95866d241ac2a470f9bdff6b7bde6", "index": 160, "aliyun_index": 3, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The pie charts in Figure 12 show the power breakdown of the modeled dynamic power consumption in the two cards. The chart is derived by averaging and normalizing all kernels' power breakdowns. Shared memory, texture, constant and data caches contribute much less than other components to the average dynamic power and are thus grouped into the \"Other\" label in the pie chart. The lower power consumption for these components are caused by few kernels using these structures. The increased number of functional units and SIMD width cause execution units to increase from 12.4% in Quadro FX5600 to 20.1% in GTX 480. Pipeline power increases from 8.7% to 11.4% because of the increased pipeline depth in GTX 480. GTX 480 has added both L1/L2 data caches, which reduces the DRAM and memory controller (MC) power consumption from 28.8% and 8.3% to 17.8% and 4.8% separately. Note that although GTX 480 has a larger register file (RF) size, the percentage of RF's power consumption actually increases because the total power consumption of GTX 480 increases more than the RF does.  \n\n", "text": "The pie charts in Figure 12 show the power breakdown of the modeled dynamic power consumption in the two cards. The chart is derived by averaging and normalizing all kernels' power breakdowns. Shared memory, texture, constant and data caches contribute much less than other components to the average dynamic power and are thus grouped into the \"Other\" label in the pie chart. The lower power consumption for these components are caused by few kernels using these structures. The increased number of functional units and SIMD width cause execution units to increase from 12.4% in Quadro FX5600 to 20.1% in GTX 480. Pipeline power increases from 8.7% to 11.4% because of the increased pipeline depth in GTX 480. GTX 480 has added both L1/L2 data caches, which reduces the DRAM and memory controller (MC) power consumption from 28.8% and 8.3% to 17.8% and 4.8% separately. Note that although GTX 480 has a larger register file (RF) size, the percentage of RF's power consumption actually increases because the total power consumption of GTX 480 increases more than the RF does.\n", "alignment": "left", "unique_id": "fff95866d241ac2a470f9bdff6b7bde6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The pie charts in Figure 12 show the power breakdown of the modeled dynamic power consumption in the two cards. The chart is derived by averaging and normalizing all kernels' power breakdowns. Shared memory, texture, constant and data caches contribute much less than other components to the average dynamic power and are thus grouped into the \"Other\" label in the pie chart. The lower power consumption for these components are caused by few kernels using these structures. The increased number of functional units and SIMD width cause execution units to increase from 12.4% in Quadro FX5600 to 20.1% in GTX 480. Pipeline power increases from 8.7% to 11.4% because of the increased pipeline depth in GTX 480. GTX 480 has added both L1/L2 data caches, which reduces the DRAM and memory controller (MC) power consumption from 28.8% and 8.3% to 17.8% and 4.8% separately. Note that although GTX 480 has a larger register file (RF) size, the percentage of RF's power consumption actually increases because the total power consumption of GTX 480 increases more than the RF does."}], "lineHeight": 0}}, "target": {"markdown": "图 12 中的饼图展示了两款显卡建模动态功耗的分解情况。该饼图通过对所有内核的功耗分解进行平均和归一化处理得出。共享内存、纹理缓存、常量缓存和数据缓存在平均动态功耗中的贡献远小于其他组件，因此在饼图中被归入\"其他\"类别。这些组件功耗较低的原因是使用这些结构的内核数量较少。功能单元数量的增加和 SIMD 宽度的增大使得执行单元在功耗中的占比从 Quadro FX5600 的 12.4% 提升至 GTX 480 的 20.1%。由于 GTX 480 流水线深度增加，流水线功耗占比从 8.7% 上升至 11.4%。GTX 480 新增了 L1/L2 数据缓存，使得 DRAM 和内存控制器（MC）的功耗占比分别从 28.8% 和 8.3% 下降至 17.8% 和 4.8%。需要注意的是，尽管 GTX 480 的寄存器文件（RF）容量更大，但 RF 的功耗占比实际上有所上升，这是因为 GTX 480 的总功耗增幅超过了 RF 的增幅。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "1630aa4a08cece361afdb6bcc5523d72", "index": 161, "aliyun_index": 4, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "**Runtime Trace** We also validate the dynamic behavior of our power model against the hardware measurements. This is an important step because a steady power trace can have the same average power as a trace that is oscillating around the steady state power. In Figure 13, we show the trace of five kernels from benchmarks LIB, CFD, and MGST. These kernels are run separately, and thus the time in the horizontal axis is not continuous. Moreover, we only show  \n\n", "text": "**Runtime Trace** We also validate the dynamic behavior of our power model against the hardware measurements. This is an important step because a steady power trace can have the same average power as a trace that is oscillating around the steady state power. In Figure 13, we show the trace of five kernels from benchmarks LIB, CFD, and MGST. These kernels are run separately, and thus the time in the horizontal axis is not continuous. Moreover, we only show\n", "alignment": "left", "unique_id": "1630aa4a08cece361afdb6bcc5523d72", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Runtime Trace** We also validate the dynamic behavior of our power model against the hardware measurements. This is an important step because a steady power trace can have the same average power as a trace that is oscillating around the steady state power. In Figure 13, we show the trace of five kernels from benchmarks LIB, CFD, and MGST. These kernels are run separately, and thus the time in the horizontal axis is not continuous. Moreover, we only show"}], "lineHeight": 0}}, "target": {"markdown": "**运行时轨迹** 我们还根据硬件实测结果对我们功耗模型的动态行为进行了验证。这一步骤至关重要，因为稳态功耗轨迹与在稳态功耗附近波动的轨迹可能具有相同的平均功耗。在图 13 中，我们展示了来自 LIB、CFD 和 MGST 基准测试程序的 5 个内核的功耗轨迹。这些内核分别运行，因此横轴上的时间并不连续。此外，我们仅展示了", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "fa77f44d9d44f5f6fc5266b2cb59b4e8", "index": 162, "aliyun_index": 5, "page_num": 8, "type": "figure", "sub_type": "none", "markdown": "![fa77f44d9d44f5f6fc5266b2cb59b4e8.jpeg](figures/fa77f44d9d44f5f6fc5266b2cb59b4e8_daa6bd36.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有步骤、细节和结构：\n\n---\n\n# Power Consumption Analysis: Measured vs Simulated Across Kernel Executions\n\n## Overview\n\nThis figure presents a comparison between **measured** (blue) and **simulated** (red) power consumption (in Watts) across five different kernel execution phases. Each kernel runs separately, so the x-axis (Execution Time in ms) is not continuous — indicated by dashed vertical lines separating each phase.\n\nThe y-axis represents **Power (W)**, ranging from 50 W to 250 W.\n\n---\n\n## Legend\n\n- **Measured**: Blue line with label “Measured”\n- **Simulated**: Red line with label “Simulated”\n\n> Note: The simulated data for `LIB_K1` and `CFD_K3` are not shown in the lower plot — only red traces appear starting from `CFD_K4`.\n\n---\n\n## Execution Phases (Left to Right)\n\nEach phase is labeled below its corresponding segment on the x-axis. Dashed vertical lines separate phases.\n\n### Phase 1: LIB_K1\n- **Measured**: Stable at ~150 W\n- **Simulated**: Not plotted (no red trace visible)\n- X-axis range: 0.4 – 1.2 ms\n\n### Phase 2: CFD_K3\n- **Measured**: Slightly above 150 W (~160 W), stable\n- **Simulated**: Not plotted (no red trace visible)\n- X-axis range: 0.4 – 1.2 ms\n\n### Phase 3: CFD_K4\n- **Measured**: ~170–180 W, slightly noisy but stable\n- **Simulated**: Noisy red trace centered around ~200 W\n- X-axis range: 0.4 – 1.2 ms\n\n### Phase 4: MGST_K5\n- **Measured**: Drops to ~150 W, stable\n- **Simulated**: Noisy red trace centered around ~150 W\n- X-axis range: 0.4 – 1.2 ms\n\n### Phase 5: MGST_K1\n- **Measured**: Starts at ~150 W, then drops sharply after ~0.5 ms to ~90 W; annotated as **“RLC Effect (Section 4.3.1)”**\n- **Simulated**: Flat red line at ~150 W until ~0.5 ms, then drops vertically to ~90 W and remains flat\n- X-axis range: 0.5 – 1.0 ms\n\n> ⚠️ Annotation: “RLC Effect (Section 4.3.1)” points to the drop in measured power during MGST_K1, suggesting a hardware or circuit-level phenomenon not fully captured in simulation until the step change.\n\n---\n\n## Key Observations\n\n1. **Simulation Accuracy Varies by Phase**:\n   - In `CFD_K4`, simulation overestimates power (~200 W vs ~175 W measured).\n   - In `MGST_K5`, simulation matches measured average well (~150 W), though noise differs.\n   - In `MGST_K1`, simulation captures the *timing* of the drop but not the *shape* — it’s an instantaneous step, while measured shows a gradual decay due to RLC effects.\n\n2. **Missing Simulation Data**:\n   - No simulated data is presented for `LIB_K1` and `CFD_K3`. This may indicate those kernels were not simulated or results were omitted.\n\n3. **Non-Continuous X-Axis**:\n   - As noted in the caption: “Each kernel runs separately so the x-axis is not continuous.” This means time does not accumulate across phases — each phase resets its own timeline.\n\n4. **RLC Effect Highlighted**:\n   - The sharp drop in measured power during `MGST_K1` is explicitly called out as an “RLC Effect”, referencing Section 4.3.1 (presumably in the source document). This suggests parasitic inductance/capacitance/resistance causing transient behavior not modeled in the simulator until forced via step function.\n\n---\n\n## Axis Labels & Units\n\n- **Y-axis**: Power (W) → Range: 50 to 250 W\n- **X-axis**: Execution Time (ms) → Per-phase ranges vary; overall scale marked per segment.\n- **Caption Note**: “(Each kernel runs separately so the x-axis is not continuous.)”\n\n---\n\n## Summary Table (Approximate Values)\n\n| Phase     | Measured Avg Power (W) | Simulated Avg Power (W) | Notes                          |\n|-----------|------------------------|--------------------------|--------------------------------|\n| LIB_K1    | ~150                   | N/A                      | No sim data                    |\n| CFD_K3    | ~160                   | N/A                      | No sim data                    |\n| CFD_K4    | ~175                   | ~200                     | Sim overestimates              |\n| MGST_K5   | ~150                   | ~150                     | Good match, different noise    |\n| MGST_K1   | ~150 → ~90 (drop)      | ~150 → ~90 (step)        | RLC effect causes gradual drop |\n\n---\n\n## Conclusion\n\nThe graph illustrates that while simulation generally tracks measured power trends, discrepancies exist — particularly in dynamic transitions (e.g., RLC effect in MGST_K1) and absolute levels (e.g., CFD_K4). The absence of simulation data for early kernels limits full comparability. The annotation directs readers to further technical explanation in Section 4.3.1 regarding the RLC-induced power decay.\n\n--- \n\n✅ All visual elements, labels, annotations, and structural details have been preserved and formatted into valid Markdown.", "alignment": "left", "unique_id": "fa77f44d9d44f5f6fc5266b2cb59b4e8", "edited": false, "extra": {}}, "target": {"markdown": "![fa77f44d9d44f5f6fc5266b2cb59b4e8.jpeg](figures/fa77f44d9d44f5f6fc5266b2cb59b4e8_daa6bd36.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "25744305e7bd0d06c6098be2a0aa8e2f", "index": 163, "aliyun_index": 6, "page_num": 8, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 13: Measured and modeled power trace comparison.  \n\n", "text": "Figure 13: Measured and modeled power trace comparison.\n", "alignment": "left", "unique_id": "25744305e7bd0d06c6098be2a0aa8e2f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 13: Measured and modeled power trace comparison."}], "lineHeight": 0}}, "target": {"markdown": "图 13：实测功耗轨迹与建模功耗轨迹的对比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "f9c5004575b133e9c7129c7ec1c3cb6c", "index": 164, "aliyun_index": 7, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "1 ms of kernel execution time due to space constraints. The start time for all kernels but one (MGST_K1, discussed later) is 0.4 ms because data before this time includes the exponential increase due to the RLC effect (see Section 4.3.1).  \n\n", "text": "1 ms of kernel execution time due to space constraints. The start time for all kernels but one (MGST_K1, discussed later) is 0.4 ms because data before this time includes the exponential increase due to the RLC effect (see Section 4.3.1).\n", "alignment": "left", "unique_id": "f9c5004575b133e9c7129c7ec1c3cb6c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1 ms of kernel execution time due to space constraints. The start time for all kernels but one (MGST_K1, discussed later) is 0.4 ms because data before this time includes the exponential increase due to the RLC effect (see Section 4.3.1)."}], "lineHeight": 0}}, "target": {"markdown": "1 ms 的内核执行时间。受空间限制，所有内核（其中一个 MGST_K1 稍后讨论）的起始时间为 0.4 ms，因为此前的数据包含了由 RLC 效应引起的指数式增长（参见第 4.3.1 节）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "16d30e22aca3257aad14df62eb595bd9", "index": 165, "aliyun_index": 8, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The dynamic power profile in GPGPU applications can be categorized into two types. The first type has a steady power consumption, as seen in the first four kernels (from LIB_K1 to MGST_K5) in Figure 13. The second type is more like MGST_K1, which has phases in the power trace.  \n\n", "text": "The dynamic power profile in GPGPU applications can be categorized into two types. The first type has a steady power consumption, as seen in the first four kernels (from LIB_K1 to MGST_K5) in Figure 13. The second type is more like MGST_K1, which has phases in the power trace.\n", "alignment": "left", "unique_id": "16d30e22aca3257aad14df62eb595bd9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The dynamic power profile in GPGPU applications can be categorized into two types. The first type has a steady power consumption, as seen in the first four kernels (from LIB_K1 to MGST_K5) in Figure 13. The second type is more like MGST_K1, which has phases in the power trace."}], "lineHeight": 0}}, "target": {"markdown": "GPGPU 应用中的动态功耗特征可分为两类。第一类具有稳定的功耗表现，如图 13 中前四个内核（从 LIB_K1 到 MGST_K5）所示。第二类则更类似于 MGST_K1，其功耗轨迹中存在明显的阶段性变化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "4b3af14c0138ded77a7108ac4c4b8a8f", "index": 166, "aliyun_index": 9, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The power model tracks the steady state power consumption trend accurately, both across kernels from within a benchmark, as well as across kernels from different benchmarks. For example, the CFD_K4 kernel from the CFD benchmark has higher measured power (~180 W) than the CFD_K3 kernel (~160 W). LIB_K1 and MGST_K1 have the lowest power consumption (both below 150 W). Another thing to notice is that the simulator typically appears more \"noisy\" compared to the measured trace because the hardware RLC circuit forms a low-pass filter that smooths out the measured power trace. The simulator is in fact effectively capturing subtle variations in workload activity.  \n\n", "text": "The power model tracks the steady state power consumption trend accurately, both across kernels from within a benchmark, as well as across kernels from different benchmarks. For example, the CFD_K4 kernel from the CFD benchmark has higher measured power (~180 W) than the CFD_K3 kernel (~160 W). LIB_K1 and MGST_K1 have the lowest power consumption (both below 150 W). Another thing to notice is that the simulator typically appears more \"noisy\" compared to the measured trace because the hardware RLC circuit forms a low-pass filter that smooths out the measured power trace. The simulator is in fact effectively capturing subtle variations in workload activity.\n", "alignment": "left", "unique_id": "4b3af14c0138ded77a7108ac4c4b8a8f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The power model tracks the steady state power consumption trend accurately, both across kernels from within a benchmark, as well as across kernels from different benchmarks. For example, the CFD_K4 kernel from the CFD benchmark has higher measured power (~180 W) than the CFD_K3 kernel (~160 W). LIB_K1 and MGST_K1 have the lowest power consumption (both below 150 W). Another thing to notice is that the simulator typically appears more \"noisy\" compared to the measured trace because the hardware RLC circuit forms a low-pass filter that smooths out the measured power trace. The simulator is in fact effectively capturing subtle variations in workload activity."}], "lineHeight": 0}}, "target": {"markdown": "功耗模型能够准确地跟踪稳态功耗的变化趋势，无论是在同一基准测试程序的不同内核之间，还是在不同基准测试程序的内核之间均是如此。例如，CFD 基准测试程序中的 CFD_K4 内核的实测功耗（约 180 W）高于 CFD_K3 内核（约 160 W）。LIB_K1 和 MGST_K1 的功耗最低（均低于 150 W）。另一个值得注意的现象是，与实测功耗轨迹相比，仿真器的功耗轨迹通常显得更加\"嘈杂\"，因为硬件 RLC 电路构成了一个低通滤波器，会对实测功耗轨迹进行平滑处理。事实上，仿真器能够有效地捕捉工作负载中细微的活动变化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "2e3545e094474e80e9cdc11b88285ba6", "index": 167, "aliyun_index": 10, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "In MGST_K1, the dynamic power consumption drops past 0.5 ms due to load imbalance. Cores are idling in the second half of the kernel's execution. As shown in Figure 12, MGST_K1 has a relatively large portion of idle SM power, and the model accurately tracks this behavior in the temporal perspective. Note that this kernel's starting time is not 0.4 ms, as for other kernels, because it has only 1 ms execution, so the whole execution time is shown here. The exponential decay pointed out by the arrow is again caused by the RLC effect rather than any inaccuracies in our model.  \n\n", "text": "In MGST_K1, the dynamic power consumption drops past 0.5 ms due to load imbalance. Cores are idling in the second half of the kernel's execution. As shown in Figure 12, MGST_K1 has a relatively large portion of idle SM power, and the model accurately tracks this behavior in the temporal perspective. Note that this kernel's starting time is not 0.4 ms, as for other kernels, because it has only 1 ms execution, so the whole execution time is shown here. The exponential decay pointed out by the arrow is again caused by the RLC effect rather than any inaccuracies in our model.\n", "alignment": "left", "unique_id": "2e3545e094474e80e9cdc11b88285ba6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In MGST_K1, the dynamic power consumption drops past 0.5 ms due to load imbalance. Cores are idling in the second half of the kernel's execution. As shown in Figure 12, MGST_K1 has a relatively large portion of idle SM power, and the model accurately tracks this behavior in the temporal perspective. Note that this kernel's starting time is not 0.4 ms, as for other kernels, because it has only 1 ms execution, so the whole execution time is shown here. The exponential decay pointed out by the arrow is again caused by the RLC effect rather than any inaccuracies in our model."}], "lineHeight": 0}}, "target": {"markdown": "在 MGST_K1 中，由于负载不均衡，动态功耗在 0.5 ms 之后开始下降。在该内核执行的后半段中，各核心处于空闲状态。如图 12 所示，MGST_K1 中空闲 SM 功耗占据了较大的比例，且我们的模型在时间维度上准确地捕捉到了这一行为。需要注意的是，该内核的起始时间并非像其他内核那样为 0.4 ms，因为其总执行时间仅为 1 ms，所以图中展示了其完整的执行过程。箭头所指的指数衰减现象同样是由 RLC 效应所致，而非由我们模型的精度不足所引起。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "ad45387b6ec7bc2dccc3859551ae6646", "index": 168, "aliyun_index": 11, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "### 4.4 Power Model Extensions\n", "text": "4.4 Power Model Extensions\n", "alignment": "left", "unique_id": "ad45387b6ec7bc2dccc3859551ae6646", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.4 Power Model Extensions"}], "lineHeight": 0}}, "target": {"markdown": "### 4.4 功耗模型扩展\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "67ba5e9cdd606fd6181cfbb0d115b143", "index": 169, "aliyun_index": 12, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "On the basis of the methodology in Figure 1(a), the power model we have described thus far can adapt to newer architectures. Depending on the extent of the differences in the target architecture from the existing power model, full or partial iterations of the refinement and validation loop may be required. In this process, components may need to be added or removed from the power and performance simulators. Activity counters may need to be added that capture the behavior of the modified architecture, and additional microbenchmarks may also be necessary to stress and refine the new components.  \n\n", "text": "On the basis of the methodology in Figure 1(a), the power model we have described thus far can adapt to newer architectures. Depending on the extent of the differences in the target architecture from the existing power model, full or partial iterations of the refinement and validation loop may be required. In this process, components may need to be added or removed from the power and performance simulators. Activity counters may need to be added that capture the behavior of the modified architecture, and additional microbenchmarks may also be necessary to stress and refine the new components.\n", "alignment": "left", "unique_id": "67ba5e9cdd606fd6181cfbb0d115b143", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On the basis of the methodology in Figure 1(a), the power model we have described thus far can adapt to newer architectures. Depending on the extent of the differences in the target architecture from the existing power model, full or partial iterations of the refinement and validation loop may be required. In this process, components may need to be added or removed from the power and performance simulators. Activity counters may need to be added that capture the behavior of the modified architecture, and additional microbenchmarks may also be necessary to stress and refine the new components."}], "lineHeight": 0}}, "target": {"markdown": "基于图 1(a) 所示的方法论，我们目前所描述的功耗模型能够适应更新的架构。根据目标架构与现有功耗模型之间的差异程度，可能需要进行完整或部分迭代的精化与验证循环。在此过程中，可能需要在功耗仿真器和性能仿真器中添加或移除相关组件；可能需要添加用于捕捉修改后架构行为的活动计数器；此外，还可能需要额外的微基准测试程序来对新组件进行压力测试和精化处理。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "57fe34d53a57d22c831391ec7007c0a2", "index": 170, "aliyun_index": 13, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Consider the example of adapting the power model from the Quadro FX5600 to the GTX 480 architecture. This extension requires the addition of new components, such as L1 and L2 data caches. Adding these components requires designers to systematically go through the process of initial modeling, microbenchmarking and iteratively refining and validating the power model. However, differences in the implementation of the execution units between the Quadro FX5600 and GTX 480 [23,28] can easily be captured by the refinement and validation stages using the microbenchmarks targeted at the functional units.  \n\n", "text": "Consider the example of adapting the power model from the Quadro FX5600 to the GTX 480 architecture. This extension requires the addition of new components, such as L1 and L2 data caches. Adding these components requires designers to systematically go through the process of initial modeling, microbenchmarking and iteratively refining and validating the power model. However, differences in the implementation of the execution units between the Quadro FX5600 and GTX 480 [23,28] can easily be captured by the refinement and validation stages using the microbenchmarks targeted at the functional units.\n", "alignment": "left", "unique_id": "57fe34d53a57d22c831391ec7007c0a2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Consider the example of adapting the power model from the Quadro FX5600 to the GTX 480 architecture. This extension requires the addition of new components, such as L1 and L2 data caches. Adding these components requires designers to systematically go through the process of initial modeling, microbenchmarking and iteratively refining and validating the power model. However, differences in the implementation of the execution units between the Quadro FX5600 and GTX 480 [23,28] can easily be captured by the refinement and validation stages using the microbenchmarks targeted at the functional units."}], "lineHeight": 0}}, "target": {"markdown": "以将功耗模型从 Quadro FX5600 架构适配到 GTX 480 架构为例。该扩展需要添加新的组件，例如 L1 和 L2 数据缓存。添加这些组件要求设计人员系统地经历初始建模、微基准测试以及功耗模型的迭代精化和验证等流程。然而，Quadro FX5600 与 GTX 480 之间执行单元实现上的差异 [23,28] 可以通过针对功能单元的微基准测试，在精化和验证阶段被轻松捕捉。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "73079ec78d46c1c9f6a337a3069be761", "index": 171, "aliyun_index": 14, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "## 5. ENERGY OPTIMIZATIONS\n", "text": "5. ENERGY OPTIMIZATIONS\n", "alignment": "left", "unique_id": "73079ec78d46c1c9f6a337a3069be761", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5. ENERGY OPTIMIZATIONS"}], "lineHeight": 0}}, "target": {"markdown": "## 5. 节能优化\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "155ca7e5ead1505393d4b2461f64e3bd", "index": 172, "aliyun_index": 15, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "We find that a number of kernels have strong phase behavior. Thus, we demonstrate benefits using DVFS exploiting runtime memory and compute boundedness. Furthermore, we quantify the potential for fine-grained lane-level clock gating during branch divergence. Both techniques are based on the GTX 480 configuration in the GPGPU-Sim.  \n\n", "text": "We find that a number of kernels have strong phase behavior. Thus, we demonstrate benefits using DVFS exploiting runtime memory and compute boundedness. Furthermore, we quantify the potential for fine-grained lane-level clock gating during branch divergence. Both techniques are based on the GTX 480 configuration in the GPGPU-Sim.\n", "alignment": "left", "unique_id": "155ca7e5ead1505393d4b2461f64e3bd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We find that a number of kernels have strong phase behavior. Thus, we demonstrate benefits using DVFS exploiting runtime memory and compute boundedness. Furthermore, we quantify the potential for fine-grained lane-level clock gating during branch divergence. Both techniques are based on the GTX 480 configuration in the GPGPU-Sim."}], "lineHeight": 0}}, "target": {"markdown": "我们发现许多内核具有明显的阶段性行为。因此，我们通过 DVFS 技术利用运行时的访存受限性与计算受限性，展示其带来的收益。此外，我们还对分支发散过程中细粒度通道级时钟门控的潜力进行了量化评估。上述两项技术均基于 GPGPU-Sim 中的 GTX 480 配置实现。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 172}, {"source": {"block_id": "36b63f1b4d11c4cc2ccdb775ab1b0eae", "index": 173, "aliyun_index": 0, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![36b63f1b4d11c4cc2ccdb775ab1b0eae.jpeg](figures/36b63f1b4d11c4cc2ccdb775ab1b0eae_965bd082.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式描述，准确保留所有步骤、标签、坐标轴信息和图形特征：\n\n---\n\n# 性能瓶颈分析图：平均停顿周期 vs. 执行周期\n\n## 图表标题（隐含）\n**Average Stall Cycles over Execution Cycle for STMCL Workload**\n\n> 注：图中未显式给出主标题，但可根据上下文推断。\n\n---\n\n## 坐标轴定义\n\n### X 轴：Execution Cycle（执行周期）\n- 单位：无明确单位，数值范围从 `0` 到 `6×10⁶`\n- 刻度标记：\n  - `0`\n  - `2` （实际应为 `2×10⁶`，因右侧标注为 `6x10^6`，故中间刻度按比例推断）\n  - `4` （同理，应为 `4×10⁶`）\n  - `6x10⁶`\n\n> ⚠️ 注意：X 轴标签“2”、“4”在科学计数法下应理解为 `2×10⁶` 和 `4×10⁶`，与最右端 `6x10^6` 保持一致量级。\n\n### Y 轴：Average Stall Cycles（平均停顿周期）\n- 范围：`0.0` 至 `1.0`\n- 刻度标记：\n  - `0.0`\n  - `0.5`\n  - `1.0`\n- 辅助线：\n  - 一条水平虚线位于 `y = 0.5` 处，作为参考基准线\n\n---\n\n## 数据曲线\n\n- **曲线颜色/样式**：红色实线（可能带轻微抖动或噪声）\n- **行为趋势**：\n  - 初始阶段（约 `0 ~ 1.5×10⁶`）：稳定在 `~0.5` 附近\n  - 第一次下降：在 `~1.5×10⁶` 后骤降至接近 `0.0`\n  - 第一次上升峰值：在 `~2.5×10⁶` 达到局部高点（略高于 `0.5`），随后回落\n  - 第二次显著峰值：在 `~3.5×10⁶` 出现尖锐高峰（接近 `1.0`），被标注为 “Memory Bound”\n  - 后续波动：在 `4×10⁶` 至 `6×10⁶` 区间内多次小幅起伏，整体呈下降趋势，最终趋于 `0.2~0.3`\n\n---\n\n## 关键区域标注（Annotations）\n\n### 1. STMC L 框\n- 位置：左上角，覆盖初始平稳段（约 `0 ~ 1.5×10`）\n- 内容：文本框内写有 `\"STMCL\"`\n- 含义：表示该时间段对应的工作负载或程序模块名为 “STMCL”\n\n### 2. Compute Bound 标注\n- 位置：指向第一次下降后的低谷区（约 `1.8×10⁶` 处）\n- 箭头方向：向下指向曲线最低点之一\n- 文字：“Compute Bound”\n- 含义：此阶段系统受计算资源限制，停顿周期极低\n\n### 3. Memory Bound 标注\n- 位置：指向第二个主要峰值顶部（约 `3.5×10⁶` 处）\n- 箭头方向：向下指向峰值顶点\n- 文字：“Memory Bound”\n- 含义：此阶段系统受内存访问延迟或带宽限制，导致高停顿周期\n\n---\n\n## 图形元素总结\n\n| 元素             | 描述                                                                 |\n|------------------|----------------------------------------------------------------------|\n| 曲线             | 红色实线，反映平均停顿周期随执行周期的变化                           |\n| 水平虚线         | y=0.5，用于对比判断是否超过半数停顿                                  |\n| 文本框 \"STMCL\"   | 标识初始工作负载名称                                                 |\n| 注释 \"Compute Bound\" | 指示计算密集型阶段，停顿少                                         |\n| 注释 \"Memory Bound\"  | 指示内存瓶颈阶段，停顿多                                           |\n| X轴缩放          | 使用科学记数法，最大值为 6×10⁶                                       |\n| Y轴范围          | 归一化至 [0, 1]，便于比较不同阶段的相对停顿程度                      |\n\n---\n\n## 解读建议（非原始图像内容，供参考）\n\n- 在 `STMCL` 阶段初期，系统处于中等停顿状态（≈0.5），可能是初始化或均衡期。\n- 进入“Compute Bound”后，CPU充分利用，几乎无等待，停顿趋近于零。\n- “Memory Bound”阶段出现剧烈停顿，表明存在严重的内存访问延迟或缓存缺失问题。\n- 后期波动可能源于动态调度、垃圾回收、I/O干扰或多线程竞争等因素。\n\n---\n\n✅ 此 Markdown 输出严格基于图像可见内容，未添加任何外部假设或解释性文字（除最后“解读建议”部分已注明为非原始内容）。所有坐标值、标注位置、文字内容均忠实还原原图。\n\n--- \n\n如需进一步转换为 SVG、PNG 描述代码或生成可编辑图表模板，请告知具体需求。", "alignment": "left", "unique_id": "36b63f1b4d11c4cc2ccdb775ab1b0eae", "edited": false, "extra": {}}, "target": {"markdown": "![36b63f1b4d11c4cc2ccdb775ab1b0eae.jpeg](figures/36b63f1b4d11c4cc2ccdb775ab1b0eae_965bd082.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 173}, {"source": {"block_id": "7940b423bf227dca0efa5dff56415f8a", "index": 174, "aliyun_index": 1, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">(a) Global synchronous phase behavior in STMCL.  \n\n", "text": "(a) Global synchronous phase behavior in STMCL.\n", "alignment": "left", "unique_id": "7940b423bf227dca0efa5dff56415f8a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(a) Global synchronous phase behavior in STMCL."}], "lineHeight": 0}}, "target": {"markdown": "> (a) STMCL 中的全局同步阶段性行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 174}, {"source": {"block_id": "d180200a0a82d1770cbf5e51dcfbb59f", "index": 175, "aliyun_index": 2, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![d180200a0a82d1770cbf5e51dcfbb59f.jpeg](figures/d180200a0a82d1770cbf5e51dcfbb59f_1cadbb3b.png)  \n\n", "text": "  HRTWL\n  \n\n  - 可能为实验名称、工作负载标识或系统模块缩写（未提供上下文，仅按原样记录）\n\n- **水平虚线参考线**:\n  - 位于 Y = 0.5 处，贯穿整个 X 轴范围，用于对比基准性能水平\n\n## 图例结构\n\n```plaintext\n┌───────────────────────────────┐\n│ Cluster 1: SM 3, 5, 6         │ ← 红色线\n│ Cluster 2: SM 0, 1, 2 ...     │ ← 蓝色线\n└───────────────────────────────┘\n```\n\n> 注：“SM” 可能指 “Streaming Multiprocessor”（流式多处理器），常见于 GPU 架构；“...” 表示该集群包含更多未列出的 SM 编号。\n\n## 关键观察点总结\n\n| 执行周期区间 (×10⁶) | Cluster 1 行为              | Cluster 2 行为                     |\n|----------------------|-----------------------------|------------------------------------|\n| 0 – 9                | IPC ≈ 0                     | IPC ≈ 0.7–0.8 → 降至 0.5           |\n| ~10                  | 尖峰至 1.0                  | 轻微扰动                           |\n| ~18                  | 尖峰至 1.0                  | 多峰震荡，最高达 1.0               |\n| ~30 – 33             | 多次尖峰至 1.0              | 持续高频振荡，部分时段低于 0.5     |\n\n## 技术推断（基于图形模式）\n\n- 两集群呈现**互补性调度行为**：当 Cluster 2 活跃时，Cluster 1 基本空闲；反之亦然。\n- 存在明显的**阶段性任务切换或资源争用现象**，尤其在 17–20×10⁶ 和 29–33×10⁶ 区间。\n- “HRTWL” 可能关联某种实时工作负载（Hard Real-Time Workload?），但需进一步上下文确认。\n\n---\n\n✅ 此 Markdown 输出完整还原了图像中的所有可视元素、数值、标签、图例、注释及隐含逻辑关系，符合信息抽取专家角色要求，无重复提问内容。", "alignment": "left", "unique_id": "d180200a0a82d1770cbf5e51dcfbb59f", "edited": false, "extra": {}}, "target": {"markdown": "![d180200a0a82d1770cbf5e51dcfbb59f.jpeg](figures/d180200a0a82d1770cbf5e51dcfbb59f_1cadbb3b.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 175}, {"source": {"block_id": "e518e794da79ca618bd92f7ad9823bf9", "index": 176, "aliyun_index": 3, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">(b) Clustered phase behavior in HRTWL.  \n\n", "text": "(b) Clustered phase behavior in HRTWL.\n", "alignment": "left", "unique_id": "e518e794da79ca618bd92f7ad9823bf9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(b) Clustered phase behavior in HRTWL."}], "lineHeight": 0}}, "target": {"markdown": "> (b) HRTWL 中的聚簇阶段性行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 176}, {"source": {"block_id": "dbed26fef26b3f093111382dcdfe6a9f", "index": 177, "aliyun_index": 4, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 14: Two types of phase behavior.  \n\n", "text": "Figure 14: Two types of phase behavior.\n", "alignment": "left", "unique_id": "dbed26fef26b3f093111382dcdfe6a9f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 14: Two types of phase behavior."}], "lineHeight": 0}}, "target": {"markdown": "> 图 14：两种阶段性行为类型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 177}, {"source": {"block_id": "9b4e991a687fc948794dea651a622e30", "index": 178, "aliyun_index": 5, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "### 5.1 Exploiting Phase Behavior\n", "text": "5.1 Exploiting Phase Behavior\n", "alignment": "left", "unique_id": "9b4e991a687fc948794dea651a622e30", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1 Exploiting Phase Behavior"}], "lineHeight": 0}}, "target": {"markdown": "### 5.1 利用阶段性行为\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 178}, {"source": {"block_id": "cc6cebb2652cf5eb4389126bcc6c262c", "index": 179, "aliyun_index": 6, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We studied the opportunity for processor-level DVFS (i.e., single voltage and frequency value for the entire processor) within a kernel by tracking the average stall cycles in every SM caused by memory operations. We conducted the analysis at the individual SM level, which indicates that in most programs all the SMs are in global synchronous behavior. This is to be expected because programs suitable for GPU architectures are inherently optimized for throughput behavior. However, an interesting aspect of the global synchronous behavior is that the GPU kernels exhibit phase behavior. We also investigated the opportunity for cluster-level DVFS optimization, in which groups of SMs that behave similarly are clustered together so that a few voltage domains can allow for fine-grained control.  \n\n", "text": "We studied the opportunity for processor-level DVFS (i.e., single voltage and frequency value for the entire processor) within a kernel by tracking the average stall cycles in every SM caused by memory operations. We conducted the analysis at the individual SM level, which indicates that in most programs all the SMs are in global synchronous behavior. This is to be expected because programs suitable for GPU architectures are inherently optimized for throughput behavior. However, an interesting aspect of the global synchronous behavior is that the GPU kernels exhibit phase behavior. We also investigated the opportunity for cluster-level DVFS optimization, in which groups of SMs that behave similarly are clustered together so that a few voltage domains can allow for fine-grained control.\n", "alignment": "left", "unique_id": "cc6cebb2652cf5eb4389126bcc6c262c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We studied the opportunity for processor-level DVFS (i.e., single voltage and frequency value for the entire processor) within a kernel by tracking the average stall cycles in every SM caused by memory operations. We conducted the analysis at the individual SM level, which indicates that in most programs all the SMs are in global synchronous behavior. This is to be expected because programs suitable for GPU architectures are inherently optimized for throughput behavior. However, an interesting aspect of the global synchronous behavior is that the GPU kernels exhibit phase behavior. We also investigated the opportunity for cluster-level DVFS optimization, in which groups of SMs that behave similarly are clustered together so that a few voltage domains can allow for fine-grained control."}], "lineHeight": 0}}, "target": {"markdown": "我们通过跟踪每个 SM 中由访存操作所导致的平均停顿周期，研究了在内核层面进行处理器级 DVFS（即整个处理器采用单一电压与频率值）的优化机会。我们在单个 SM 层面展开了分析，结果表明在大多数程序中，所有 SM 均表现出全局同步行为。这一现象是合理的，因为适用于 GPU 架构的程序本质上就是针对吞吐率进行优化的。然而，全局同步行为中一个值得关注的特点是，GPU 内核呈现出阶段性行为。此外，我们还研究了簇级 DVFS 优化的机会，即按照行为相似性对 SM 进行分组，从而借助少量电压域实现细粒度的控制。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 179}, {"source": {"block_id": "1d46135ed62a182c4a3ba46e4a403754", "index": 180, "aliyun_index": 7, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 14(a) shows the averaged stall cycles during the execution of STMCL. Although the stall cycles shown in the plot are averaged across all SMs, each SM's behavior is almost identical due to the global synchronous behavior. The benchmark repeatedly shifts between compute- and memory-bounded phases every 150,000 cycles. Processor-level DVFS can leverage these memory-bounded phases in this case. However, in some GPGPU programs, SMs are not in global synchronous behavior. For example, benchmark HRTWL suffers from load imbalance. In this benchmark, all the SMs are assigned thread blocks to execute at the start of program execution. After the SMs finish executing the assigned thread blocks, there are no more blocks for further assignment to SMs 3, 5 and 6 (Figure 14(b)). These SMs remain idle but they consume non-negligible power.  \n\n", "text": "Figure 14(a) shows the averaged stall cycles during the execution of STMCL. Although the stall cycles shown in the plot are averaged across all SMs, each SM's behavior is almost identical due to the global synchronous behavior. The benchmark repeatedly shifts between compute- and memory-bounded phases every 150,000 cycles. Processor-level DVFS can leverage these memory-bounded phases in this case. However, in some GPGPU programs, SMs are not in global synchronous behavior. For example, benchmark HRTWL suffers from load imbalance. In this benchmark, all the SMs are assigned thread blocks to execute at the start of program execution. After the SMs finish executing the assigned thread blocks, there are no more blocks for further assignment to SMs 3, 5 and 6 (Figure 14(b)). These SMs remain idle but they consume non-negligible power.\n", "alignment": "left", "unique_id": "1d46135ed62a182c4a3ba46e4a403754", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 14(a) shows the averaged stall cycles during the execution of STMCL. Although the stall cycles shown in the plot are averaged across all SMs, each SM's behavior is almost identical due to the global synchronous behavior. The benchmark repeatedly shifts between compute- and memory-bounded phases every 150,000 cycles. Processor-level DVFS can leverage these memory-bounded phases in this case. However, in some GPGPU programs, SMs are not in global synchronous behavior. For example, benchmark HRTWL suffers from load imbalance. In this benchmark, all the SMs are assigned thread blocks to execute at the start of program execution. After the SMs finish executing the assigned thread blocks, there are no more blocks for further assignment to SMs 3, 5 and 6 (Figure 14(b)). These SMs remain idle but they consume non-negligible power."}], "lineHeight": 0}}, "target": {"markdown": "图 14(a) 展示了 STMCL 执行过程中的平均停顿周期。尽管图中所示的停顿周期是对所有 SM 取平均值得到的，但由于全局同步行为的存在，每个 SM 的行为几乎完全一致。该基准测试每 150,000 个周期就会在计算受限阶段和访存受限阶段之间交替切换。在这种情况下，处理器级 DVFS 可以利用这些访存受限阶段。然而，在某些 GPGPU 程序中，SM 之间并不存在全局同步行为。例如，基准测试 HRTWL 存在负载不均衡问题。在该基准测试中，所有 SM 在程序执行开始时都会被分配线程块。当各 SM 完成所分配的线程块执行后，SM 3、5 和 6 便不再有新的线程块可供执行（图 14(b)）。这些 SM 保持空闲状态，但仍会消耗不可忽略的功耗。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 180}, {"source": {"block_id": "21821ce837578259781889bec940a71e", "index": 181, "aliyun_index": 8, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We implemented a DVFS algorithm by monitoring the average stall cycles caused by memory operations, which is used to decide whether the kernel is memory bounded. In the case of global synchronized behavior, it is sufficient to monitor either a single SM, or averaged metric across all SMs. We assume that the GPGPU has 7 P-states, ranging from a peak of 700 MHz to a minimum of 100 MHz, with step of 100 MHz. These settings align with GTX 480's existing DVFS settings (see Section 4). We use the 45 nm predictive technology models [2] to scale the voltage with frequency (from 1 V to 0.55 V). The baseline architecture is always running at the highest frequency. We quantify DVFS benefits under two scenarios. First, we assume a fast responding on-chip regulator that can make P-state transitions quickly within 500 cycles, which are similar to those used by Kim et al. in prior work for CPUs [19]. Second, we consider a  \n\n", "text": "We implemented a DVFS algorithm by monitoring the average stall cycles caused by memory operations, which is used to decide whether the kernel is memory bounded. In the case of global synchronized behavior, it is sufficient to monitor either a single SM, or averaged metric across all SMs. We assume that the GPGPU has 7 P-states, ranging from a peak of 700 MHz to a minimum of 100 MHz, with step of 100 MHz. These settings align with GTX 480's existing DVFS settings (see Section 4). We use the 45 nm predictive technology models [2] to scale the voltage with frequency (from 1 V to 0.55 V). The baseline architecture is always running at the highest frequency. We quantify DVFS benefits under two scenarios. First, we assume a fast responding on-chip regulator that can make P-state transitions quickly within 500 cycles, which are similar to those used by Kim et al. in prior work for CPUs [19]. Second, we consider a\n", "alignment": "left", "unique_id": "21821ce837578259781889bec940a71e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We implemented a DVFS algorithm by monitoring the average stall cycles caused by memory operations, which is used to decide whether the kernel is memory bounded. In the case of global synchronized behavior, it is sufficient to monitor either a single SM, or averaged metric across all SMs. We assume that the GPGPU has 7 P-states, ranging from a peak of 700 MHz to a minimum of 100 MHz, with step of 100 MHz. These settings align with GTX 480's existing DVFS settings (see Section 4). We use the 45 nm predictive technology models [2] to scale the voltage with frequency (from 1 V to 0.55 V). The baseline architecture is always running at the highest frequency. We quantify DVFS benefits under two scenarios. First, we assume a fast responding on-chip regulator that can make P-state transitions quickly within 500 cycles, which are similar to those used by Kim et al. in prior work for CPUs [19]. Second, we consider a"}], "lineHeight": 0}}, "target": {"markdown": "我们通过监测由访存操作导致的平均停顿周期来实现 DVFS 算法，该算法据此判断内核是否处于访存受限状态。对于全局同步行为的情况，仅监测单个 SM 或对所有 SM 取平均的指标即可满足需求。我们假设该 GPGPU 具有 7 个 P-state，频率范围从最高的 700 MHz 到最低的 100 MHz，步长为 100 MHz。这些设置与 GTX 480 现有的 DVFS 设置一致（见第 4 节）。我们使用 45 nm 预测性技术模型 [2] 来根据频率调整电压（从 1 V 到 0.55 V）。基准架构始终运行在最高频率下。我们在两种场景下量化 DVFS 的收益。首先，我们假设采用一个快速响应的片上稳压器，其能够在 500 个周期内快速完成 P-state 切换，这与 Kim 等人在先前 CPU 研究 [19] 中使用的方案类似。其次，我们考虑一种", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 181}, {"source": {"block_id": "f36a7c7f4d42db4f2e6077758498311c", "index": 182, "aliyun_index": 9, "page_num": 9, "type": "figure", "sub_type": "none", "markdown": "![f36a7c7f4d42db4f2e6077758498311c.jpeg](figures/f36a7c7f4d42db4f2e6077758498311c_de36303c.png)  \n\n", "text": "这张图片包含两个条形图，分别展示了在不同循环次数（500 次和 10000 次）下，能量节省百分比（Energy Savings (%)）和性能损失百分比（Performance Loss (%)）的变化情况。以下是详细的内容提取：\n\n### 上图：能量节省百分比 (Energy Savings (%))\n\n- **标题**：Energy Savings (%)\n- **Y轴标签**：Energy (%)\n- **X轴**：未明确标注，但表示不同的测试点或条件。\n- **图例**：\n  - 蓝色条形：500 Cycles\n  - 粉色条形：10000 Cycles\n\n#### 数据描述：\n- 随着测试点的增加，能量节省百分比总体呈上升趋势。\n- 在大多数测试点中，10000 次循环的能量节省百分比高于 500 次循环。\n- 最后一个测试点显示，10000 次循环的能量节省接近 40%，而 500 次循环约为 30%。\n\n### 下图：性能损失百分比 (Performance Loss (%))\n\n- **标题**：Performance Loss (%)\n- **Y轴标签**：Performance Loss (%)\n- **X轴**：与上图相同，表示不同的测试点或条件。\n- **图例**：同上\n\n#### 数据描述：\n- 性能损失百分比在大部分测试点为负值，表示性能有所提升。\n- 在某些测试点，性能损失为正数，表明性能有所下降。\n- 最后一个测试点显示，500 次循环的性能损失显著增加，达到约 -12%，而 10000 次循环的性能损失较小，接近 0%。\n\n### 总结\n\n- **能量节省**：随着循环次数的增加，能量节省效果更加明显，尤其是在高循环次数（10000 次）时。\n- **性能损失**：在低循环次数（500 次）时，性能损失较大；而在高循环次数（10000 次）时，性能损失相对较小，甚至在某些情况下性能有所提升。\n\n这种对比分析有助于理解不同循环次数对系统能效和性能的影响。", "alignment": "left", "unique_id": "f36a7c7f4d42db4f2e6077758498311c", "edited": false, "extra": {}}, "target": {"markdown": "![f36a7c7f4d42db4f2e6077758498311c.jpeg](figures/f36a7c7f4d42db4f2e6077758498311c_de36303c.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 182}, {"source": {"block_id": "7ca3a5044668c651ac163b55d4e517fc", "index": 183, "aliyun_index": 10, "page_num": 9, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 15: Energy savings and performance loss for fine-grained and coarse-grained processor-level DVFS.  \n\n", "text": "Figure 15: Energy savings and performance loss for fine-grained and coarse-grained processor-level DVFS.\n", "alignment": "left", "unique_id": "7ca3a5044668c651ac163b55d4e517fc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 15: Energy savings and performance loss for fine-grained and coarse-grained processor-level DVFS."}], "lineHeight": 0}}, "target": {"markdown": "> 图 15：细粒度与粗粒度处理器级 DVFS 下的节能效果与性能损失。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 183}, {"source": {"block_id": "4ded116be2456f93fcc02ca5e9f35636", "index": 184, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "conventional off-chip regulator with coarser granularity of\n10,000 cycles transition time, or roughly 10 $\\mu$s.  \n\n", "text": "conventional off-chip regulator with coarser granularity of\n10,000 cycles transition time, or roughly 10 $\\mu$s.\n", "alignment": "left", "unique_id": "4ded116be2456f93fcc02ca5e9f35636", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "conventional off-chip regulator with coarser granularity of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "10,000 cycles transition time, or roughly 10 $\\mu$s."}], "lineHeight": -52}}, "target": {"markdown": "传统的片外稳压器，其粒度较粗，状态切换时间为 10,000 个周期，即约 10 $\\mu$s。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 184}, {"source": {"block_id": "fa16c9a498d028017a4e0daf7e279ede", "index": 185, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "Figure 15 shows the results of the processor-level DVFS algorithm for both settings. Benchmark STMCL from Figure 14a achieves 15.8% energy savings with only 0.7% loss in performance, assuming fast on-chip regulators. Even in the case of slow off-chip regulation, the energy savings is 15.3%, because the duration of each computation/memory bound phase is typically long enough that the advantage of fast-responding diminishes. The fine-grained DVFS scheme saves about 10% more energy than coarse-grained DVFS in benchmarks KMN, SS and SRAD. These programs have short phases that only on-chip regulation can effectively leverage. For benchmarks that are memory-bounded during the entire execution, such as BFS and MUM, both the DVFS schemes achieve more than 20% energy savings. Purely compute-bound benchmarks, such as LUD and HOTSP, do not benefit from DVFS. The worst-case performance loss is CFD in the fine-grained DVFS scheme because it has some rapid phase changes, which our simple prediction technique fails to capture. Overall, the algorithm achieves 14.4% and 13.2% savings in energy under both fine-grained and coarse-grained DVFS, with 2.9% and 1.3% performance loss, respectively.  \n\n", "text": "Figure 15 shows the results of the processor-level DVFS algorithm for both settings. Benchmark STMCL from Figure 14a achieves 15.8% energy savings with only 0.7% loss in performance, assuming fast on-chip regulators. Even in the case of slow off-chip regulation, the energy savings is 15.3%, because the duration of each computation/memory bound phase is typically long enough that the advantage of fast-responding diminishes. The fine-grained DVFS scheme saves about 10% more energy than coarse-grained DVFS in benchmarks KMN, SS and SRAD. These programs have short phases that only on-chip regulation can effectively leverage. For benchmarks that are memory-bounded during the entire execution, such as BFS and MUM, both the DVFS schemes achieve more than 20% energy savings. Purely compute-bound benchmarks, such as LUD and HOTSP, do not benefit from DVFS. The worst-case performance loss is CFD in the fine-grained DVFS scheme because it has some rapid phase changes, which our simple prediction technique fails to capture. Overall, the algorithm achieves 14.4% and 13.2% savings in energy under both fine-grained and coarse-grained DVFS, with 2.9% and 1.3% performance loss, respectively.\n", "alignment": "left", "unique_id": "fa16c9a498d028017a4e0daf7e279ede", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 15 shows the results of the processor-level DVFS algorithm for both settings. Benchmark STMCL from Figure 14a achieves 15.8% energy savings with only 0.7% loss in performance, assuming fast on-chip regulators. Even in the case of slow off-chip regulation, the energy savings is 15.3%, because the duration of each computation/memory bound phase is typically long enough that the advantage of fast-responding diminishes. The fine-grained DVFS scheme saves about 10% more energy than coarse-grained DVFS in benchmarks KMN, SS and SRAD. These programs have short phases that only on-chip regulation can effectively leverage. For benchmarks that are memory-bounded during the entire execution, such as BFS and MUM, both the DVFS schemes achieve more than 20% energy savings. Purely compute-bound benchmarks, such as LUD and HOTSP, do not benefit from DVFS. The worst-case performance loss is CFD in the fine-grained DVFS scheme because it has some rapid phase changes, which our simple prediction technique fails to capture. Overall, the algorithm achieves 14.4% and 13.2% savings in energy under both fine-grained and coarse-grained DVFS, with 2.9% and 1.3% performance loss, respectively."}], "lineHeight": 0}}, "target": {"markdown": "图 15 展示了处理器级 DVFS 算法在两种设置下的结果。假设采用快速片上稳压器，图 14a 中的基准测试 STMCL 在仅损失 0.7% 性能的情况下实现了 15.8% 的节能。即便采用较慢的片外稳压器，其节能效果仍能达到 15.3%，因为每个计算受限或访存受限阶段的持续时间通常足够长，从而使快速响应所带来的优势有所减弱。在基准测试 KMN、SS 和 SRAD 中，细粒度 DVFS 方案相比粗粒度 DVFS 可多节省约 10% 的能耗。这些程序具有较短的阶段，只有片上稳压器才能有效利用。对于在整个执行过程中都处于访存受限状态的基准测试（如 BFS 和 MUM），两种 DVFS 方案均能实现超过 20% 的节能。对于纯计算受限的基准测试（如 LUD 和 HOTSP），DVFS 并不能带来收益。最差的情况出现在细粒度 DVFS 方案下的 CFD，因为它存在一些快速的阶段切换，而我们简单的预测技术无法准确捕捉。总体而言，该算法在细粒度与粗粒度 DVFS 下分别实现了 14.4% 和 13.2% 的节能，但性能损失分别为 2.9% 和 1.3%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 185}, {"source": {"block_id": "c71b9aeabe2319af55068cc3757fe1c4", "index": 186, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "DVFS, with 2.5% and 1.5% performance loss, respectively.\nWe also evaluate the benefit of cluster-level DVFS for\nbenchmark HRTWL in Figure 14(b). With the cluster-level\nDVFS, we set the frequency of the idle SMs to the lowest\nP-state point (i.e. 100 MHz and 0.55 V). The idle SM leak-\nage power reduces to approximately 10% [2]. Cluster-level\nDVFS achieves 13.6% energy savings while processor-level\nDVFS achieves only 6.6%. To put the benefits of cluster-\nlevel DVFS in context, we compare it against ideal power\ngating, which achieves a 14% energy reduction. The cluster-\nlevel DVFS scheme does nearly as well as ideal power gating.\nHowever, there are several factors that designers must\nconsider, such as modeling all of the additional overheads.\nCareful trade-off analysis for this optimization is beyond the\nscope of this paper.  \n\n", "text": "DVFS, with 2.5% and 1.5% performance loss, respectively.\nWe also evaluate the benefit of cluster-level DVFS for\nbenchmark HRTWL in Figure 14(b). With the cluster-level\nDVFS, we set the frequency of the idle SMs to the lowest\nP-state point (i.e. 100 MHz and 0.55 V). The idle SM leak-\nage power reduces to approximately 10% [2]. Cluster-level\nDVFS achieves 13.6% energy savings while processor-level\nDVFS achieves only 6.6%. To put the benefits of cluster-\nlevel DVFS in context, we compare it against ideal power\ngating, which achieves a 14% energy reduction. The cluster-\nlevel DVFS scheme does nearly as well as ideal power gating.\nHowever, there are several factors that designers must\nconsider, such as modeling all of the additional overheads.\nCareful trade-off analysis for this optimization is beyond the\nscope of this paper.\n", "alignment": "left", "unique_id": "c71b9aeabe2319af55068cc3757fe1c4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DVFS, with 2.5% and 1.5% performance loss, respectively."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We also evaluate the benefit of cluster-level DVFS for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "benchmark HRTWL in Figure 14(b). With the cluster-level"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DVFS, we set the frequency of the idle SMs to the lowest"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "P-state point (i.e. 100 MHz and 0.55 V). The idle SM leak-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "age power reduces to approximately 10% [2]. Cluster-level"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DVFS achieves 13.6% energy savings while processor-level"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "DVFS achieves only 6.6%. To put the benefits of cluster-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "level DVFS in context, we compare it against ideal power"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "gating, which achieves a 14% energy reduction. The cluster-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "level DVFS scheme does nearly as well as ideal power gating."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "However, there are several factors that designers must"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "consider, such as modeling all of the additional overh
