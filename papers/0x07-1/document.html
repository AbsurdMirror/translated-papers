 "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Microbenchmark Correlation** Figure 6a shows a matrix for the correlation between any two microbenchmarks' performance counter vectors for our 80 microbenchmarks. Figure 6b shows its color key (the hotter the color is, the higher correlation two microbenchmarks have), and the histogram for correlation among all microbenchmarks. Figure 6b indicates that most microbenchmarks have a low correlation around $\\pm 0.1$, which is good because it shows that these microbenchmarks are independent and stress components differently. The only microbenchmarks that have a high correlation are the DRAM microbenchmarks that are used to develop DRAM power model. We expect this high correlation because the activity differences among these microbenchmarks are limited to DRAM reads and writes.  \n\n", "text": "**Microbenchmark Correlation** Figure 6a shows a matrix for the correlation between any two microbenchmarks' performance counter vectors for our 80 microbenchmarks. Figure 6b shows its color key (the hotter the color is, the higher correlation two microbenchmarks have), and the histogram for correlation among all microbenchmarks. Figure 6b indicates that most microbenchmarks have a low correlation around $\\pm 0.1$, which is good because it shows that these microbenchmarks are independent and stress components differently. The only microbenchmarks that have a high correlation are the DRAM microbenchmarks that are used to develop DRAM power model. We expect this high correlation because the activity differences among these microbenchmarks are limited to DRAM reads and writes.\n", "alignment": "left", "unique_id": "548f987d1e2e9df90dff2154d0293b73", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Microbenchmark Correlation** Figure 6a shows a matrix for the correlation between any two microbenchmarks' performance counter vectors for our 80 microbenchmarks. Figure 6b shows its color key (the hotter the color is, the higher correlation two microbenchmarks have), and the histogram for correlation among all microbenchmarks. Figure 6b indicates that most microbenchmarks have a low correlation around $\\pm 0.1$, which is good because it shows that these microbenchmarks are independent and stress components differently. The only microbenchmarks that have a high correlation are the DRAM microbenchmarks that are used to develop DRAM power model. We expect this high correlation because the activity differences among these microbenchmarks are limited to DRAM reads and writes."}], "lineHeight": 0}}, "target": {"markdown": "**微基准测试相关性** 图 6a 展示了我们 80 个微基准测试中任意两个微基准测试性能计数器向量之间相关性的矩阵。图 6b 给出了其颜色图例（颜色越深，表示两个微基准测试之间的相关性越高）以及所有微基准测试之间相关性的直方图。图 6b 表明，大多数微基准测试的相关性较低，约为 $\\pm 0.1$，这表明这些微基准测试相互独立且对不同组件施加了不同的压力，这是令人满意的结果。唯一具有较高相关性的微基准测试是用于开发 DRAM 功耗模型的 DRAM 微基准测试；它们之间存在较高的相关性符合我们的预期，因为这些微基准测试之间的活动差异仅限于 DRAM 的读操作与写操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 101}, {"source": {"block_id": "69fc280902adebad61aa4dbd916c374d", "index": 102, "aliyun_index": 24, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "## 4. POWER MODEL VALIDATION\n", "text": "4. POWER MODEL VALIDATION\n", "alignment": "left", "unique_id": "69fc280902adebad61aa4dbd916c374d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4. POWER MODEL VALIDATION"}], "lineHeight": 0}}, "target": {"markdown": "## 4. 功耗模型验证\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "dis : "left", "unique_id": "4119f3510099e7e9ebbbd586d7b62d64", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We validate our power model with a reference hardware"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "platform containing both the cards. We provide details here."}], "lineHeight": -54}}, "target": {"markdown": "我们在一个同时包含这两块显卡的参考硬件平台上验证我们的功耗模型。下面对此进行详细说明。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "e4f584928527a6b6b4f6a9ea2146dc1f", "index": 109, "aliyun_index": 5, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "#### 4.1.1 Power Measurement Setup\n", "text": "4.1.1 Power Measurement Setup\n", "alignment": "left", "unique_id": "e4f584928527a6b6b4f6a9ea2146dc1f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.1.1 Power Measurement Setup"}], "lineHeight": 0}}, "target": {"markdown": "#### 4.1.1 功耗测量设置\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "94a2dd2a19f5a65934d64b8413307dc6", "index": 110, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "We use both NVIDIA GTX 480 and Quadro FX5600 for validation. Both the cards are connected to the PCIe slot through a PCIe riser card and an ATX power supply. The PCIe riser card and the ATX power supply have power pins that deliver power to the GPU. For each power supply source, we measure the instantaneous current and voltage to compute power. We sense the current draw by measuring the voltage drop across a current sensing resistor. We use a NI DAQ to sample the voltage drop at a rate of 2 MS/s.  \n\n", "text": "We use both NVIDIA GTX 480 and Quadro FX5600 for validation. Both the cards are connected to the PCIe slot through a PCIe riser card and an ATX power supply. The PCIe riser card and the ATX power supply have power pins that deliver power to the GPU. For each power supply source, we measure the instantaneous current and voltage to compute power. We sense the current draw by measuring the voltage drop across a current sensing resistor. We use a NI DAQ to sample the voltage drop at a rate of 2 MS/s.\n", "alignment": "left", "unique_id": "94a2dd2a19f5a65934d64b8413307dc6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use both NVIDIA GTX 480 and Quadro FX5600 for validation. Both the cards are connected to the PCIe slot through a PCIe riser card and an ATX power supply. The PCIe riser card and the ATX power supply have power pins that deliver power to the GPU. For each power supply source, we measure the instantaneous current and voltage to compute power. We sense the current draw by measuring the voltage drop across a current sensing resistor. We use a NI DAQ to sample the voltage drop at a rate of 2 MS/s."}], "lineHeight": 0}}, "target": {"markdown": "我们使用 NVIDIA GTX 480 和 Quadro FX5600 两块显卡进行验证。两块显卡均通过 PCIe 转接卡连接至 PCIe 插槽，并由 ATX 电源供电。PCIe 转接卡和 ATX 电源均带有向 GPU 供电的电源引脚。对于每一个供电来源，我们测量瞬时电流和电压以计算功耗。我们通过测量电流采样电阻两端的电压降来获取电流消耗，并使用 NI 数据采集卡以 2 MS/s 的采样率对电压降进行采样。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "a54b3e9a373ae5b0e2705f5b67871e5c", "index": 111, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Figure 7 shows a detailed schematic of our setup. The diagram illustrates the peripheral components that we are measuring as part of the total GPU power. These peripherals include the GPU processor, DRAM modules, voltage regulator module (VRM), and other auxiliary support circuitry, as shown in Equation (6). Our power model is built to model both static leakage and dynamic power, and therefore in our experiments we separate these two parts and validate them individually.  \n\n", "text": "Figure 7 shows a detailed schematic of our setup. The diagram illustrates the peripheral components that we are measuring as part of the total GPU power. These peripherals include the GPU processor, DRAM modules, voltage regulator module (VRM), and other auxiliary support circuitry, as shown in Equation (6). Our power model is built to model both static leakage and dynamic power, and therefore in our experiments we separate these two parts and validate them individually.\n", "alignment": "left", "unique_id": "a54b3e9a373ae5b0e2705f5b67871e5c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 7 shows a detailed schematic of our setup. The diagram illustrates the peripheral components that we are measuring as part of the total GPU power. These peripherals include the GPU processor, DRAM modules, voltage regulator module (VRM), and other auxiliary support circuitry, as shown in Equation (6). Our power model is built to model both static leakage and dynamic power, and therefore in our experiments we separate these two parts and validate them individually."}], "lineHeight": 0}}, "target": {"markdown": "图 7 展示了我们测量设置的详细原理图。该图说明了作为 GPU 总功耗一部分进行测量的外围组件。如公式 (6) 所示，这些外围组件包括 GPU 处理器、DRAM 模块、电压调节模块 (VRM) 以及其他辅助支持电路。我们的功耗模型旨在同时对静态漏电功耗和动态功率进行建模，因此在实验中我们将这两部分分开，并分别对其进行验证。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "9787c3698885bde7d9826ef9874e2956", "index": 112, "aliyun_index": 8, "page_num": 5, "type": "formula", "sub_type": "none", "markdown": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}}&{=}&{\\underbrace{P_{p r o c\\_{l} e a k}+P_{m e m\\_{l} e a k}+P_{V R M}+P_{p e r i p h e r a l s}}_{P_{c o n s t}\\mathrm{~-~i n d e p e n d e n t~o f~f r e q u e n c y}}}\\\\ &{}&{\\underbrace{+P_{p r o c\\_{d} y n a m i c}+P_{m e m\\_{d} y n a m i c}}_{P_{d y n}\\mathrm{~-~s c a l e s~w i t h~f r e q u e n c y}}\\quad(6)}\\end{array} $$  \n\n", "text": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}}&{=}&{\\underbrace{P_{p r o c\\_{l} e a k}+P_{m e m\\_{l} e a k}+P_{V R M}+P_{p e r i p h e r a l s}}_{P_{c o n s t}\\mathrm{~-~i n d e p e n d e n t~o f~f r e q u e n c y}}}\\\\ &{}&{\\underbrace{+P_{p r o c\\_{d} y n a m i c}+P_{m e m\\_{d} y n a m i c}}_{P_{d y n}\\mathrm{~-~s c a l e s~w i t h~f r e q u e n c y}}\\quad(6)}\\end{array} $$\n", "alignment": "left", "unique_id": "9787c3698885bde7d9826ef9874e2956", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}}&{=}&{\\underbrace{P_{p r o c\\_{l} e a k}+P_{m e m\\_{l} e a k}+P_{V R M}+P_{p e r i p h e r a l s}}_{P_{c o n s t}\\mathrm{~-~i n d e p e n d e n t~o f~f r e q u e n c y}}}\\\\ &{}&{\\underbrace{+P_{p r o c\\_{d} y n a m i c}+P_{m e m\\_{d} y n a m i c}}_{P_{d y n}\\mathrm{~-~s c a l e s~w i t h~f r e q u e n c y}}\\quad(6)}\\end{array} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}}&{=}&{\\underbrace{P_{p r o c\\_{l} e a k}+P_{m e m\\_{l} e a k}+P_{V R M}+P_{p e r i p h e r a l s}}_{P_{c o n s t}\\mathrm{~-~i n d e p e n d e n t~o f~f r e q u e n c y}}}\\\\ &{}&{\\underbrace{+P_{p r o c\\_{d} y n a m i c}+P_{m e m\\_{d} y n a m i c}}_{P_{d y n}\\mathrm{~-~s c a l e s~w i t h~f r e q u e n c y}}\\quad(6)}\\end{array} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "9d6bfa05ea333690797bb13d70d1ff18", "index": 113, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "(6)  \n\n", "text": "(6)\n", "alignment": "left", "unique_id": "9d6bfa05ea333690797bb13d70d1ff18", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(6)"}], "lineHeight": 0}}, "target": {"markdown": "(6)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "b190cf62c3b487d84ce9541312040243", "index": 114, "aliyun_index": 10, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "#### 4.1.2 Simulator Setup\n", "text": "4.1.2 Simulator Setup\n", "alignment": "left", "unique_id": "b190cf62c3b487d84ce9541312040243", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.1.2 Simulator Setup"}], "lineHeight": 0}}, "target": {"markdown": "#### 4.1.2 模拟器设置\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "56345f9a51bfdf65ac1cbad193bc4270", "index": 115, "aliyun_index": 11, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The software power model builds on McPAT 0.8. It is integrated with GPGPU-Sim version 3.2.1. We configure the simulator to match the two GPU cards separately. We use GPGPU-Sim's PTXPlus mode to simulate the native instruction set (ISA) on the Quadro GPU (SASS). We also use the NVIDIA compute profiler [29] to ensure that the microbenchmarks' performance matches the target hardware.  \n\n", "text": "The software power model builds on McPAT 0.8. It is integrated with GPGPU-Sim version 3.2.1. We configure the simulator to match the two GPU cards separately. We use GPGPU-Sim's PTXPlus mode to simulate the native instruction set (ISA) on the Quadro GPU (SASS). We also use the NVIDIA compute profiler [29] to ensure that the microbenchmarks' performance matches the target hardware.\n", "alignment": "left", "unique_id": "56345f9a51bfdf65ac1cbad193bc4270", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The software power model builds on McPAT 0.8. It is integrated with GPGPU-Sim version 3.2.1. We configure the simulator to match the two GPU cards separately. We use GPGPU-Sim's PTXPlus mode to simulate the native instruction set (ISA) on the Quadro GPU (SASS). We also use the NVIDIA compute profiler [29] to ensure that the microbenchmarks' performance matches the target hardware."}], "lineHeight": 0}}, "target": {"markdown": "该软件功耗模型基于 McPAT 0.8 构建，并与 GPGPU-Sim 3.2.1 版本集成。我们分别对模拟器进行配置，使其与两块 GPU 显卡相匹配。我们使用 GPGPU-Sim 的 PTXPlus 模式来模拟 Quadro GPU 的原生指令集架构（ISA）SASS。同时，我们还使用 NVIDIA 计算分析器 [29]，确保这些微基准测试程序的性能与目标硬件相匹配。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "bc8704eb8a8124f7017f8f18e7ebfd64", "index": 116, "aliyun_index": 12, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "### 4.2 Constant Power Component\n", "text": "4.2 Constant Power Component\n", "alignment": "left", "unique_id": "bc8704eb8a8124f7017f8f18e7ebfd64", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.2 Constant Power Component"}], "lineHeight": 0}}, "target": {"markdown": "### 4.2 恒定功耗组件\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "463aad63b6971b9ddc2f21fdc15f5e56", "index": 117, "aliyun_index": 13, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "The measurement setup captures both dynamic and constant power. Equation (6) shows that each power source ($P_{const}$ and $P_{dyn}$) consists of different components. The first part, $P_{const}$, includes processor leakage power, main  \n\n", "text": "The measurement setup captures both dynamic and constant power. Equation (6) shows that each power source ($P_{const}$ and $P_{dyn}$) consists of different components. The first part, $P_{const}$, includes processor leakage power, main\n", "alignment": "left", "unique_id": "463aad63b6971b9ddc2f21fdc15f5e56", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The measurement setup captures both dynamic and constant power. Equation (6) shows that each power source ($P_{const}$ and $P_{dyn}$) consists of different components. The first part, $P_{const}$, includes processor leakage power, main"}], "lineHeight": 0}}, "target": {"markdown": "测量装置可同时捕获动态功耗和恒定功耗。公式 (6) 表明，每一部分功耗来源（$P_{const}$ 和 $P_{dyn}$）均由不同组件构成。第一部分 $P_{const}$ 包括处理器漏电功耗、主", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "d66138cda81ae93ee5349fdb0e0c1fcd", "index": 118, "aliyun_index": 14, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![d66138cda81ae93ee5349fdb0e0c1fcd.jpeg](figures/d66138cda81ae93ee5349fdb0e0c1fcd_05d1386c.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有步骤、组件和连接细节：\n\n---\n\n# GPU 卡功率建模与测量系统架构图\n\n## 系统组成模块\n\n### 1. GPU Card（GPU 卡）\n- **VRM**（电压调节模块）\n  - 输入：`Modeled Power`（ modeled power，虚线箭头）\n  - 输入：`Measured Power`（实测功率，实线箭头）\n  - 输出：\n    - `V_GPU` → 供给 GPU Chip\n    - `V_MEM` → 供给 DRAM 模块\n- **GPU Chip**\n  - 接收来自 VRM 的 `V_GPU`\n  - 周围环绕多个 **DRAM** 模块（图中显示上下各两个，共四个）\n  - 下方连接 **Peripherals**（外设）\n- **Peripherals**\n  - 位于 GPU Chip 下方\n  - 通过 PCIe 接口与外部通信\n\n### 2. PCIe 接口\n- 提供以下电源轨：\n  - `3.3V`（正极 +，负极 -）→ 供给 GPU Card 内部部分电路\n  - `12V`（正极 +，负极 -）→ 供给 GPU Card 内部部分电路\n- 与 NI DAQ 6133 通过探针（Probe）连接用于监测\n\n### 3. ATX Power Supply（ATX 电源）\n- 输出 `12V` 至 GPU Card\n- 串联一个 **Sense Resistor**（采样电阻）用于电流/功率 sensing\n- Sense Resistor 两端连接至 **NI DAQ 6133** 的探针（Probe），用于实时采集电压降以计算实际功耗\n\n### 4. NI DAQ 6133（数据采集设备）\n- 功能：采集实测功率数据\n- 连接方式：\n  - 探针（Probe）连接至：\n    - PCIe 接口的 `3.3V` 和 `12V` 电源轨（正负极）\n    - ATX 电源输出的 `12V` 路径上的 Sense Resistor 两端\n- 输出：`Measured Power` 信号反馈至 GPU Card 的 VRM 模块（形成闭环或对比分析）\n\n---\n\n## 数据流与信号路径\n\n```mermaid\ngraph TD\n    A[Modeled Power] -->|虚线| B(VRM)\n    C[Measured Power] -->|实线| B(VRM)\n    B --> D[V_GPU]\n    B --> E[V_MEM]\n    D --> F[GPU Chip]\n    E --> G[DRAM]\n    E --> H[DRAM]\n    E --> I[DRAM]\n    E --> J[DRAM]\n    F --> K[Peripherals]\n    K --> L[PCIe]\n    L --> M[3.3V +/-]\n    L --> N[12V +/-]\n    O[ATX Power Supply] --> P[12V]\n    P --> Q[Sense Resistor]\n    Q --> R[GPU Card]\n    S[NI DAQ 6133] -->|Probe| M\n    S -->|Probe| N\n    S -->|Probe| Q\n    S --> C[Measured Power]\n```\n\n> 注：上图 Mermaid 代码可渲染为流程图，展示完整信号流向。\n\n---\n\n## 关键标注说明\n\n- **Modeled Power**：理论或仿真计算的功率值，输入至 VRM 作为参考。\n- **Measured Power**：由 NI DAQ 6133 实际采集的功率值，反馈至 VRM 用于校准或验证模型。\n- **Sense Resistor**：用于精确测量流经 12V 线路的电流，结合电压可得瞬时功率。\n- **Probe**：物理探针，连接至 DAQ 设备进行多点电压/电流采样。\n- **VRM**：负责将输入电源转换为 GPU Chip 和 DRAM 所需的不同电压等级（如 V_GPU, V_MEM）。\n- **PCIe**：不仅提供数据传输通道，也提供辅助供电（3.3V / 12V）。\n\n---\n\n## 总结\n\n该架构实现了对 GPU 卡功耗的“建模 vs 实测”双路径监控：\n\n1. **建模路径**：从外部输入 `Modeled Power` 至 VRM，驱动内部负载。\n2. **实测路径**：通过 NI DAQ 6133 在多个关键点（PCIe 电源轨、ATX 12V 采样电阻）采集真实电压/电流，计算出 `Measured Power`，再反馈回 VRM 进行比对或控制。\n\n此设计适用于高性能计算、AI 训练等场景下的能效优化、热管理及故障诊断研究。\n\n--- \n\n✅ 所有元件、连线、标签、电压值、探针位置均已完整提取并结构化呈现。  \n📌 无重复问题陈述，仅基于图像内容进行客观抽取与格式化。", "alignment": "left", "unique_id": "d66138cda81ae93ee5349fdb0e0c1fcd", "edited": false, "extra": {}}, "target": {"markdown": "![d66138cda81ae93ee5349fdb0e0c1fcd.jpeg](figures/d66138cda81ae93ee5349fdb0e0c1fcd_05d1386c.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "ea1149826968ea2f93665add304b0bc2", "index": 119, "aliyun_index": 15, "page_num": 5, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 7: GPU power measurement schematic.  \n\n", "text": "Figure 7: GPU power measurement schematic.\n", "alignment": "left", "unique_id": "ea1149826968ea2f93665add304b0bc2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 7: GPU power measurement schematic."}], "lineHeight": 0}}, "target": {"markdown": "> 图 7：GPU 功耗测量原理图。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "a0bd602f2f881bdd645f47778060d0b8", "index": 120, "aliyun_index": 16, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "memory leakage power, VRM power, and all peripheral circuits' power. $P_{const}$ is independent of processor/memory frequency. The other part, $P_{dyn}$, comprises the dynamic power of both the processor and the main memory. $P_{dyn}$ scales linearly with processor/memory frequency. Therefore, if memory frequency scales the same as the processor's frequency, we can rewrite the measured power in Equation (6) as a linear function of only the processor frequency $f$. This is shown below in Equation (7):  \n\n", "text": "memory leakage power, VRM power, and all peripheral circuits' power. $P_{const}$ is independent of processor/memory frequency. The other part, $P_{dyn}$, comprises the dynamic power of both the processor and the main memory. $P_{dyn}$ scales linearly with processor/memory frequency. Therefore, if memory frequency scales the same as the processor's frequency, we can rewrite the measured power in Equation (6) as a linear function of only the processor frequency $f$. This is shown below in Equation (7):\n", "alignment": "left", "unique_id": "a0bd602f2f881bdd645f47778060d0b8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "memory leakage power, VRM power, and all peripheral circuits' power. $P_{const}$ is independent of processor/memory frequency. The other part, $P_{dyn}$, comprises the dynamic power of both the processor and the main memory. $P_{dyn}$ scales linearly with processor/memory frequency. Therefore, if memory frequency scales the same as the processor's frequency, we can rewrite the measured power in Equation (6) as a linear function of only the processor frequency $f$. This is shown below in Equation (7):"}], "lineHeight": 0}}, "target": {"markdown": "内存漏电功耗、VRM 功耗以及所有外围电路的功耗。$P_{const}$ 与处理器/内存频率无关。另一部分 $P_{dyn}$ 则包括处理器和主存的动态功耗。$P_{dyn}$ 与处理器/内存频率呈线性关系。因此，如果内存频率与处理器频率以相同比例缩放，我们可以将公式 (6) 中测得的功耗改写为仅关于处理器频率 $f$ 的线性函数，如公式 (7) 所示：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "c59d95a260f878526566e979edf3ff82", "index": 121, "aliyun_index": 17, "page_num": 5, "type": "formula", "sub_type": "none", "markdown": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}=k*f+P_{c o n s t}}&{{}}&{k-\\mathrm{c o n s t a n t}}\\\\ &{{}}&{f-\\mathrm{p r o c e s s o r~f r e q u e n c y}\\quad(7)}\\end{array} $$  \n\n", "text": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}=k*f+P_{c o n s t}}&{{}}&{k-\\mathrm{c o n s t a n t}}\\\\ &{{}}&{f-\\mathrm{p r o c e s s o r~f r e q u e n c y}\\quad(7)}\\end{array} $$\n", "alignment": "left", "unique_id": "c59d95a260f878526566e979edf3ff82", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}=k*f+P_{c o n s t}}&{{}}&{k-\\mathrm{c o n s t a n t}}\\\\ &{{}}&{f-\\mathrm{p r o c e s s o r~f r e q u e n c y}\\quad(7)}\\end{array} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ \\begin{array}{r l r}{P_{m e a s u r e d}=k*f+P_{c o n s t}}&{{}}&{k-\\mathrm{c o n s t a n t}}\\\\ &{{}}&{f-\\mathrm{p r o c e s s o r~f r e q u e n c y}\\quad(7)}\\end{array} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "f67e822e14f6f2d8ede88cfa1aaa918e", "index": 122, "aliyun_index": 18, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Using Equation (7) with varying frequencies $f$, we can determine the constant power component. With the aid of overclocking tools for the NVIDIA GPU card, we scale the processor and DRAM frequencies separately and measure power. With the simplified linear model in the equation, we performed a linear fit to get the constant power component.  \n\n", "text": "Using Equation (7) with varying frequencies $f$, we can determine the constant power component. With the aid of overclocking tools for the NVIDIA GPU card, we scale the processor and DRAM frequencies separately and measure power. With the simplified linear model in the equation, we performed a linear fit to get the constant power component.\n", "alignment": "left", "unique_id": "f67e822e14f6f2d8ede88cfa1aaa918e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Using Equation (7) with varying frequencies $f$, we can determine the constant power component. With the aid of overclocking tools for the NVIDIA GPU card, we scale the processor and DRAM frequencies separately and measure power. With the simplified linear model in the equation, we performed a linear fit to get the constant power component."}], "lineHeight": 0}}, "target": {"markdown": "利用公式 (7)，通过改变频率 $f$，我们可以确定恒定功耗分量。借助 NVIDIA 显卡的超频工具，我们分别调整处理器和 DRAM 的频率并测量功耗。基于公式中的简化线性模型，我们进行了线性拟合，以获得恒定功耗分量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "dc59080778abf657961003f7b9accd46", "index": 123, "aliyun_index": 19, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Subtracting the constant power numbers from the measured total power gives us the dynamic power component of the GPU processor and its main memory. We perform the above procedure on both the test cards. Figure 8 shows the experiment results for GTX 480. We use two different workloads. The first workload exercises the integer unit heavily, while the second workload exercises the floating-point unit. We choose these two computation-intensive workloads to minimize interaction with the DRAM memory subsystem. Figure 8 shows the constant power component for the GTX 480 card, which is approximately 59 W. The constant power component for the Quadro FX5600 card is 38 W.  \n\n", "text": "Subtracting the constant power numbers from the measured total power gives us the dynamic power component of the GPU processor and its main memory. We perform the above procedure on both the test cards. Figure 8 shows the experiment results for GTX 480. We use two different workloads. The first workload exercises the integer unit heavily, while the second workload exercises the floating-point unit. We choose these two computation-intensive workloads to minimize interaction with the DRAM memory subsystem. Figure 8 shows the constant power component for the GTX 480 card, which is approximately 59 W. The constant power component for the Quadro FX5600 card is 38 W.\n", "alignment": "left", "unique_id": "dc59080778abf657961003f7b9accd46", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Subtracting the constant power numbers from the measured total power gives us the dynamic power component of the GPU processor and its main memory. We perform the above procedure on both the test cards. Figure 8 shows the experiment results for GTX 480. We use two different workloads. The first workload exercises the integer unit heavily, while the second workload exercises the floating-point unit. We choose these two computation-intensive workloads to minimize interaction with the DRAM memory subsystem. Figure 8 shows the constant power component for the GTX 480 card, which is approximately 59 W. The constant power component for the Quadro FX5600 card is 38 W."}], "lineHeight": 0}}, "target": {"markdown": "从测得的总功耗中减去恒定功耗数值，即可得到 GPU 处理器及其主存的动态功耗分量。我们在两块测试显卡上均执行了上述步骤。图 8 展示了 GTX 480 的实验结果。我们使用了两种不同的工作负载：第一个工作负载大量使用整数运算单元，而第二个工作负载则大量使用浮点运算单元。我们选择这两种计算密集型工作负载，旨在最大限度地减少与 DRAM 内存子系统的交互。图 8 显示了 GTX 480 显卡的恒定功耗分量约为 59 W，而 Quadro FX5600 显卡的恒定功耗分量为 38 W。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "dce81640cb216b0912d415c0c11ff311", "index": 124, "aliyun_index": 20, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Another reason for determining the constant power component is to get the static leakage power of both GPU cards. Our model reports 41.9 W and 21.3 W leakage power for the GTX 480 and Quadro FX5600, respectively. However, we cannot validate these numbers owing to the lack of publicly available resources on GPU leakage power numbers. Nevertheless, according to Equation (6), the linearly fitted constant power serves as an upper bound, which the results reported by our power model do not violate. We do not have leakage power estimates for the GDDR5 memory, because we adopt an empirical approach to estimate its power.  \n\n", "text": "Another reason for determining the constant power component is to get the static leakage power of both GPU cards. Our model reports 41.9 W and 21.3 W leakage power for the GTX 480 and Quadro FX5600, respectively. However, we cannot validate these numbers owing to the lack of publicly available resources on GPU leakage power numbers. Nevertheless, according to Equation (6), the linearly fitted constant power serves as an upper bound, which the results reported by our power model do not violate. We do not have leakage power estimates for the GDDR5 memory, because we adopt an empirical approach to estimate its power.\n", "alignment": "left", "unique_id": "dce81640cb216b0912d415c0c11ff311", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Another reason for determining the constant power component is to get the static leakage power of both GPU cards. Our model reports 41.9 W and 21.3 W leakage power for the GTX 480 and Quadro FX5600, respectively. However, we cannot validate these numbers owing to the lack of publicly available resources on GPU leakage power numbers. Nevertheless, according to Equation (6), the linearly fitted constant power serves as an upper bound, which the results reported by our power model do not violate. We do not have leakage power estimates for the GDDR5 memory, because we adopt an empirical approach to estimate its power."}], "lineHeight": 0}}, "target": {"markdown": "确定恒定功耗分量的另一个原因，是为了获取两块 GPU 显卡的静态漏电功耗。在我们的模型中，GTX 480 和 Quadro FX5600 的漏电功耗分别为 41.9 W 和 21.3 W。然而，由于缺乏公开可用的 GPU 漏电功耗数据，我们无法对这些数值进行验证。尽管如此，根据公式 (6)，线性拟合得到的恒定功耗可作为该数值的一个上界，而我们功耗模型所报告的结果并未超出这一上界。由于我们采用经验方法来估算 GDDR5 内存的功耗，因此没有对其漏电功耗进行单独估算。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "d199ee837e409c665f090b435b562b45", "index": 125, "aliyun_index": 21, "page_num": 5, "type": "title", "sub_type": "none", "markdown": "### 4.3 Dynamic Power Validation\n", "text": "4.3 Dynamic Power Validation\n", "alignment": "left", "unique_id": "d199ee837e409c665f090b435b562b45", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.3 Dynamic Power Validation"}], "lineHeight": 0}}, "target": {"markdown": "### 4.3 动态功耗验证\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "f6825086e6aeb0592a979ad571427629", "index": 126, "aliyun_index": 22, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "We validate the power model using microbenchmarks and real programs from public benchmark suites. We compare the average power and the dynamic power behavior of several kernels against the measured hardware results. The measurement process has inherent limitations that affect the  \n\n", "text": "We validate the power model using microbenchmarks and real programs from public benchmark suites. We compare the average power and the dynamic power behavior of several kernels against the measured hardware results. The measurement process has inherent limitations that affect the\n", "alignment": "left", "unique_id": "f6825086e6aeb0592a979ad571427629", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We validate the power model using microbenchmarks and real programs from public benchmark suites. We compare the average power and the dynamic power behavior of several kernels against the measured hardware results. The measurement process has inherent limitations that affect the"}], "lineHeight": 0}}, "target": {"markdown": "我们使用微基准测试程序以及来自公开基准测试套件的真实程序对功耗模型进行验证。我们将多个内核的平均功耗和动态功耗表现与实测的硬件结果进行比较。测量过程本身存在固有的局限性，这会影响", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "17ae29bc85b0dd9faeb6e78b9cd855f4", "index": 127, "aliyun_index": 0, "page_num": 6, "type": "figure", "sub_type": "none", "markdown": "![17ae29bc85b0dd9faeb6e78b9cd855f4.jpeg](figures/17ae29bc85b0dd9faeb6e78b9cd855f4_3c178220.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有图表元素、标签、图例、坐标轴、数据系列及注释细节：\n\n---\n\n# 功率测量与模拟对比分析\n\n## 左图：Measured Power vs. Processor Frequency\n\n### 坐标轴\n- **X轴**：Processor Frequency (GHz)  \n  范围：0.0 – 1.6 GHz，刻度间隔 0.4\n- **Y轴**：Measured Power (W)  \n  范围：50 – 150 W，刻度间隔 25\n\n### 数据系列（图例）\n| 符号/颜色       | 标签         | 说明             |\n|------------------|--------------|------------------|\n| 蓝色星号 `*`     | Measured     | 实际测量值       |\n| 绿色倒三角 `▼`   | Measured     | 另一组实际测量值 |\n| 红色虚线 `---`   | Fitted       | 拟合曲线         |\n| 黑色点划线 `-·-` | Fitted Constant Power | 恒定功率拟合线 |\n\n### 注释标注\n- “Workload 1” → 指向蓝色星号数据点区域（高频段）\n- “Workload 2” → 指向绿色倒三角数据点区域（中频段）\n- “Fitted Constant Power” → 指向左下角接近原点的黑色点划线起点\n\n### 趋势描述\n- 蓝色星号数据点随频率增加呈近似线性上升趋势。\n- 绿色倒三角数据点同样随频率上升，但斜率略低于蓝色星号。\n- 红色虚线为整体拟合直线，穿过两组数据点中心趋势。\n- 黑色点划线从约 (0.0, 60) 开始，表示恒定功率基准线。\n\n---\n\n## 右图：Simulated Power vs. Measured Power\n\n### 坐标轴\n- **X轴**：Measured Power (W)  \n  范围：50 – 250 W，刻度间隔 50\n- **Y轴**：Simulated Power (W)  \n  范围：50 – 250 W，刻度间隔 50\n\n### 数据系列（图例）\n| 符号/颜色       | 标签      | 说明           |\n|------------------|-----------|----------------|\n| 红色叉号 `×`     | Functional| 功能型负载     |\n| 蓝色正三角 `▲`   | Memory    | 内存密集型负载 |\n| 绿色倒三角 `▼`   | DRAM      | DRAM相关负载   |\n| 黑色菱形 `◇`     | MIX       | 混合负载       |\n\n### 参考线\n- 红色虚线对角线：从 (50,50) 到 (250,250)，表示理想匹配线（Simulated = Measured）\n\n### 数据分布特征\n- 所有数据点大致围绕对角线分布，表明模拟值与实测值具有较好一致性。\n- “Functional”（红叉）多集中在中高功率区（100–200W），部分偏离对角线。\n- “Memory”（蓝三角）和“DRAM”（绿倒三角）主要分布在低中功率区（80–150W），较贴近对角线。\n- “MIX”（黑菱形）覆盖范围广（100–220W），部分点明显高于或低于对角线，显示较大误差。\n\n---\n\n## 总体观察\n\n- 左图展示不同工作负载下处理器功耗随频率变化的关系，通过拟合线揭示功耗模型。\n- 右图验证仿真模型在不同类型负载下的准确性，以对角线为基准评估偏差。\n- 两图共同支持功耗建模与仿真校准的研究目标。\n\n--- \n\n✅ 此 Markdown 文档完整还原了图像中的所有视觉元素、文本标签、图例、坐标轴、注释及数据趋势，适用于技术报告、论文附录或演示文稿嵌入。", "alignment": "left", "unique_id": "17ae29bc85b0dd9faeb6e78b9cd855f4", "edited": false, "extra": {}}, "target": {"markdown": "![17ae29bc85b0dd9faeb6e78b9cd855f4.jpeg](figures/17ae29bc85b0dd9faeb6e78b9cd855f4_3c178220.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "2c57812aba06421130943de8058d7283", "index": 128, "aliyun_index": 1, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 8: Linear regression\nfit to get constant power.  \n\n", "text": "Figure 8: Linear regression\nfit to get constant power.\n", "alignment": "left", "unique_id": "2c57812aba06421130943de8058d7283", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 8: Linear regression"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "fit to get constant power."}], "lineHeight": -52}}, "target": {"markdown": "> 图 8：用于获取恒定功耗的线性回归拟合。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "de0bb0949c217454c3b91dea94ea0638", "index": 129, "aliyun_index": 2, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 9: Microbenchmark\npower comparison.  \n\n", "text": "Figure 9: Microbenchmark\npower comparison.\n", "alignment": "left", "unique_id": "de0bb0949c217454c3b91dea94ea0638", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 9: Microbenchmark"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "power comparison."}], "lineHeight": -52}}, "target": {"markdown": "> 图 9：微基准测试程序的功耗对比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 129}, {"source": {"block_id": "592e8b8931f8f2e84f996c1ee6d10f9d", "index": 130, "aliyun_index": 3, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "benchmark selection and dynamic power trace comparisons,\nand this is not to be confused with simulation inaccuracies.  \n\n", "text": "benchmark selection and dynamic power trace comparisons,\nand this is not to be confused with simulation inaccuracies.\n", "alignment": "left", "unique_id": "592e8b8931f8f2e84f996c1ee6d10f9d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "benchmark selection and dynamic power trace comparisons,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "and this is not to be confused with simulation inaccuracies."}], "lineHeight": -50}}, "target": {"markdown": "基准测试的选择以及动态功耗轨迹的比较，且不应将其与仿真不准确性混为一谈。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 130}, {"source": {"block_id": "b0cee301b7c3d20934d574230a13e1d1", "index": 131, "aliyun_index": 4, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "#### 4.3.1 Hardware Measurement Issues\n", "text": "4.3.1 Hardware Measurement Issues\n", "alignment": "left", "unique_id": "b0cee301b7c3d20934d574230a13e1d1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.3.1 Hardware Measurement Issues"}], "lineHeight": 0}}, "target": {"markdown": "#### 4.3.1 硬件测量相关问题\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "d80d4b42a88fe7ff946bb40e4fd9ec6e", "index": 132, "aliyun_index": 5, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "In our measurements, we find that any large changes in power draw are accompanied by an exponential increasing or decaying curve (i.e., *RLC effect*), as well as an oscillation, as shown in Figure 10(a). The behavior is related to the power-delivery network (PDN) component characteristics and interactions (i.e., voltage regulator module and decoupling capacitance), which effectively form an RLC circuit. These effects are impossible to isolate from our power measurements because they are board-level components. We verified that the exponential power trace is not caused by workload or architectural policies, such as thread scheduling, by constructing microbenchmarks.  \n\n", "text": "In our measurements, we find that any large changes in power draw are accompanied by an exponential increasing or decaying curve (i.e., *RLC effect*), as well as an oscillation, as shown in Figure 10(a). The behavior is related to the power-delivery network (PDN) component characteristics and interactions (i.e., voltage regulator module and decoupling capacitance), which effectively form an RLC circuit. These effects are impossible to isolate from our power measurements because they are board-level components. We verified that the exponential power trace is not caused by workload or architectural policies, such as thread scheduling, by constructing microbenchmarks.\n", "alignment": "left", "unique_id": "d80d4b42a88fe7ff946bb40e4fd9ec6e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In our measurements, we find that any large changes in power draw are accompanied by an exponential increasing or decaying curve (i.e., *RLC effect*), as well as an oscillation, as shown in Figure 10(a). The behavior is related to the power-delivery network (PDN) component characteristics and interactions (i.e., voltage regulator module and decoupling capacitance), which effectively form an RLC circuit. These effects are impossible to isolate from our power measurements because they are board-level components. We verified that the exponential power trace is not caused by workload or architectural policies, such as thread scheduling, by constructing microbenchmarks."}], "lineHeight": 0}}, "target": {"markdown": "在我们的测量中，我们发现任何较大的功耗变化都伴随着指数上升或衰减曲线（即 *RLC 效应*）以及振荡现象，如图 10(a) 所示。这种行为与供电网络（PDN）组件的特性及其相互作用（即电压调节模块和去耦电容）有关，它们实际上构成了一个 RLC 电路。由于这些是板级组件，因此我们无法将其影响从功耗测量结果中分离出来。我们通过构建微基准测试程序，验证了指数形式的功耗轨迹并非由工作负载或架构策略（如线程调度）所引起。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "6ee3c8246e8a59bb1d51c2ae3dc19d8b", "index": 133, "aliyun_index": 6, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Figure 10(b) shows a snapshot of the measured and simulated power trace for MGST_K1 in which we can mimic the RLC behavior in the measured trace by transforming our simulated power trace with a derived RLC filter. This RLC filter is derived based on Figure 10(a), which is effectively the filter's step response. Analyzing Figure 10(a), the filter can be approximated as a second-order system with rise time 0.18 $\\mu$s and maximum overshoot 15%.  \n\n", "text": "Figure 10(b) shows a snapshot of the measured and simulated power trace for MGST_K1 in which we can mimic the RLC behavior in the measured trace by transforming our simulated power trace with a derived RLC filter. This RLC filter is derived based on Figure 10(a), which is effectively the filter's step response. Analyzing Figure 10(a), the filter can be approximated as a second-order system with rise time 0.18 $\\mu$s and maximum overshoot 15%.\n", "alignment": "left", "unique_id": "6ee3c8246e8a59bb1d51c2ae3dc19d8b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 10(b) shows a snapshot of the measured and simulated power trace for MGST_K1 in which we can mimic the RLC behavior in the measured trace by transforming our simulated power trace with a derived RLC filter. This RLC filter is derived based on Figure 10(a), which is effectively the filter's step response. Analyzing Figure 10(a), the filter can be approximated as a second-order system with rise time 0.18 $\\mu$s and maximum overshoot 15%."}], "lineHeight": 0}}, "target": {"markdown": "图 10(b) 展示了 MGST_K1 实测与仿真功耗轨迹的快照。通过将仿真功耗轨迹与所推导的 RLC 滤波器进行卷积变换，我们可以在仿真轨迹中模拟出与实测轨迹类似的 RLC 行为。该 RLC 滤波器基于图 10(a) 推导而来，而图 10(a) 实际上正是该滤波器的阶跃响应。通过对图 10(a) 进行分析，可将该滤波器近似为一个二阶系统，其上升时间为 0.18 $\\mu$s，最大超调量为 15%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "d5fc9e6d88f786439ba92fa0e0c84236", "index": 134, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "In our experiment, we must filter out GPU kernels with execution less than 500 $\\mu$s because the measured power trace of this type of kernel is always in the exponential increase stage due to the RLC effect. This type of kernel could have a much higher power consumption than the measured value. Thus we only trust kernels with long enough execution times (> 500 $\\mu$s) for validation purposes. For each benchmark, we use the largest available input sizes and modify parameters to increase the execution time without changing functionality. However, this execution time limitation still filters out 56 unique kernels in the ISPASS and RODINIA benchmarks suites to the 21 kernels discussed in Section 4.3.3. In addition, we study another four kernels from prior work by Hong and Kim [13]. So in all, we have 25 long-running kernels. To avoid the RLC effect, our microbenchmarks were designed with long enough (typically several seconds) execution time.  \n\n", "text": "In our experiment, we must filter out GPU kernels with execution less than 500 $\\mu$s because the measured power trace of this type of kernel is always in the exponential increase stage due to the RLC effect. This type of kernel could have a much higher power consumption than the measured value. Thus we only trust kernels with long enough execution times (> 500 $\\mu$s) for validation purposes. For each benchmark, we use the largest available input sizes and modify parameters to increase the execution time without changing functionality. However, this execution time limitation still filters out 56 unique kernels in the ISPASS and RODINIA benchmarks suites to the 21 kernels discussed in Section 4.3.3. In addition, we study another four kernels from prior work by Hong and Kim [13]. So in all, we have 25 long-running kernels. To avoid the RLC effect, our microbenchmarks were designed with long enough (typically several seconds) execution time.\n", "alignment": "left", "unique_id": "d5fc9e6d88f786439ba92fa0e0c84236", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In our experiment, we must filter out GPU kernels with execution less than 500 $\\mu$s because the measured power trace of this type of kernel is always in the exponential increase stage due to the RLC effect. This type of kernel could have a much higher power consumption than the measured value. Thus we only trust kernels with long enough execution times (> 500 $\\mu$s) for validation purposes. For each benchmark, we use the largest available input sizes and modify parameters to increase the execution time without changing functionality. However, this execution time limitation still filters out 56 unique kernels in the ISPASS and RODINIA benchmarks suites to the 21 kernels discussed in Section 4.3.3. In addition, we study another four kernels from prior work by Hong and Kim [13]. So in all, we have 25 long-running kernels. To avoid the RLC effect, our microbenchmarks were designed with long enough (typically several seconds) execution time."}], "lineHeight": 0}}, "target": {"markdown": "在我们的实验中，必须过滤掉执行时间小于 500 $\\mu$s 的 GPU 内核，因为此类内核的实测功耗轨迹始终处于由 RLC 效应引起的指数上升阶段。这类内核的实际功耗可能远高于测量值。因此，为了验证目的，我们仅信任执行时间足够长（> 500 $\\mu$s）的内核。对于每个基准测试，我们均使用最大的可用输入规模，并通过修改参数来延长执行时间，同时不改变其功能。然而，这一执行时间的限制仍将 ISPASS 和 RODINIA 基准测试套件中的 56 个独立内核筛选至第 4.3.3 节中讨论的 21 个内核。此外，我们还研究了 Hong 和 Kim [13] 先前工作中提到的另外四个内核。因此，我们总共有 25 个长时间运行的内核。为避免 RLC 效应，我们设计的微基准测试程序具有足够长的执行时间（通常为数秒）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "194ef09c33a23c3e69420c9bf49d8482", "index": 135, "aliyun_index": 8, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "#### 4.3.2 Microbenchmark based validation\n", "text": "4.3.2 Microbenchmark based validation\n", "alignment": "left", "unique_id": "194ef09c33a23c3e69420c9bf49d8482", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4.3.2 Microbenchmark based validation"}], "lineHeight": 0}}, "target": {"markdown": "#### 4.3.2 基于微基准测试程序的验证\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "9db75d0df5b55d3ee26f2a652cf7ccdf", "index": 136, "aliyun_index": 9, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Following the rigorous design methodology discussed in Section 3, we designed 80 microbenchmarks that are used to iteratively refine our power model. We present the final power model accuracy for these microbenchmarks and validate the component-level power isolation microbenchmarks by showing their simulation power distribution.  \n\n", "text": "Following the rigorous design methodology discussed in Section 3, we designed 80 microbenchmarks that are used to iteratively refine our power model. We present the final power model accuracy for these microbenchmarks and validate the component-level power isolation microbenchmarks by showing their simulation power distribution.\n", "alignment": "left", "unique_id": "9db75d0df5b55d3ee26f2a652cf7ccdf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Following the rigorous design methodology discussed in Section 3, we designed 80 microbenchmarks that are used to iteratively refine our power model. We present the final power model accuracy for these microbenchmarks and validate the component-level power isolation microbenchmarks by showing their simulation power distribution."}], "lineHeight": 0}}, "target": {"markdown": "遵循第 3 节中讨论的严谨设计方法，我们设计了 80 个微基准测试程序，用于迭代地优化我们的功耗模型。我们展示了这些微基准测试程序的最终功耗模型精度，并通过展示其仿真功耗分布来验证组件级功耗隔离微基准测试程序的有效性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "8c42bedd805325972b1675928ae8182c", "index": 137, "aliyun_index": 10, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "**Average Power** Test coverage is one purpose of our mi-  \n\n", "text": "**Average Power** Test coverage is one purpose of our mi-\n", "alignment": "left", "unique_id": "8c42bedd805325972b1675928ae8182c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Average Power** Test coverage is one purpose of our mi-"}], "lineHeight": 0}}, "target": {"markdown": "**平均功耗** 测试覆盖率是我们微基准测试程序的目的之一", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "08b8c1a25986f39ab74bc5cc32b9a719", "index": 138, "aliyun_index": 11, "page_num": 6, "type": "figure", "sub_type": "none", "markdown": "![08b8c1a25986f39ab74bc5cc32b9a719.jpeg](figures/08b8c1a25986f39ab74bc5cc32b9a719_9311f39c.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理后的合法 Markdown 格式文档，准确保留了所有标注、图例、坐标轴信息和说明文字：\n\n---\n\n# 功率随时间变化曲线分析\n\n## 图 (a)：实测轨迹（Measure Trace）\n\n- **纵轴**：Power (W)，范围 50 – 200 W\n- **横轴**：Time (ms)，范围 0.0 – 2.0 ms\n- **曲线特征**：\n  - 初始阶段：**0.4 ms 指数增长**（Exponential increase）\n    - 从约 70 W 快速上升至峰值 ~190 W\n  - 后续阶段：**>1 ms 振荡**（Oscillation）\n    - 在 150–180 W 区间内波动，持续至约 1.6 ms\n    - 之后出现陡降\n\n> 注：图中“Measure Trace”为蓝色实线，带有网格背景辅助读数。\n\n---\n\n## 图 (b)：实测与仿真对比\n\n### 上半部分：Measured Trace（实测轨迹）\n\n- **纵轴**：Power (W)，范围 40 – 160 W\n- **横轴**：Time (ms)，范围 0.0 – 0.8 ms\n- **曲线特征**：\n  - 初期：**指数增长/衰减（RLC 效应）**\n    - 曲线先缓慢上升后平缓下降，呈现典型 RLC 电路响应形态\n  - 标注箭头指向曲线不同区段，强调其动态行为\n\n### 下半部分：Simulated Trace（仿真轨迹）\n\n- **纵轴**：Power (W)，范围 40 – 160 W\n- **横轴**：Time (ms)，范围 0.0 – 0.8 ms\n- **包含三条曲线**：\n  1. **Original Simulator Output**（原始仿真输出）  \n     → 红色虚线，稳定在 ~130 W，无明显瞬态响应\n  2. **Exponential Decay (with RLC transformation)**（含 RLC 变换的指数衰减）  \n     → 绿色点划线，模拟真实系统中的衰减过程，从 ~130 W 开始下降\n  3. **阶跃输入示意**（未命名但隐含）  \n     → 红色垂直线段表示在 t=0.4 ms 处施加阶跃扰动，触发后续衰减\n\n> 注：该图用于对比原始仿真器输出与加入 RLC 动态模型后的改进效果，体现对实际物理行为的逼近能力。\n\n---\n\n## 总结关键参数与现象\n\n| 特征                  | 数值 / 描述                     |\n|-----------------------|----------------------------------|\n| 初始上升时间          | 0.4 ms（指数增长）              |\n| 振荡持续时间          | >1 ms                           |\n| 峰值功率（图 a）      | ≈190 W                          |\n| 稳态功率（图 b 仿真） | ≈130 W                          |\n| 主要动态机制          | RLC 效应导致指数增长/衰减       |\n| 仿真改进方法          | 引入 RLC 变换以匹配实测衰减行为 |\n\n---\n\n✅ 此 Markdown 文档完整还原了图像中的所有视觉元素、标注文本、坐标尺度及物理含义，适用于技术报告或论文附录使用。如需进一步导出为 PDF 或嵌入 LaTeX，请告知。", "alignment": "left", "unique_id": "08b8c1a25986f39ab74bc5cc32b9a719", "edited": false, "extra": {}}, "target": {"markdown": "![08b8c1a25986f39ab74bc5cc32b9a719.jpeg](figures/08b8c1a25986f39ab74bc5cc32b9a719_9311f39c.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "bd530ce6421b581fb4013159dac88106", "index": 139, "aliyun_index": 12, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 10: (a) RLC effect in measured trace. (b) Simulated trace with derived RLC filter to match measured trace.  \n\n", "text": "Figure 10: (a) RLC effect in measured trace. (b) Simulated trace with derived RLC filter to match measured trace.\n", "alignment": "left", "unique_id": "bd530ce6421b581fb4013159dac88106", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 10: (a) RLC effect in measured trace. (b) Simulated trace with derived RLC filter to match measured trace."}], "lineHeight": 0}}, "target": {"markdown": "> 图 10：(a) 实测轨迹中的 RLC 效应。(b) 使用所推导的 RLC 滤波器对仿真轨迹进行处理以匹配实测轨迹。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "064f5d077119636973241b2c3e84c5b7", "index": 140, "aliyun_index": 13, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "microbenchmarks. Our microbenchmark design effort results in an even distribution of measured steady-state power. Figure 9 shows the comparison between our power model and the hardware for microbenchmarks running on the GTX 480. The measured results on the $x$-axis are spread evenly from 80 W to 210 W, and simulated power on the $y$-axis tracks the corresponding power difference across different microbenchmarks. As we will show later, real benchmarks' power has a much smaller variation range (120 W $\\sim$ 190 W).  \n\n", "text": "microbenchmarks. Our microbenchmark design effort results in an even distribution of measured steady-state power. Figure 9 shows the comparison between our power model and the hardware for microbenchmarks running on the GTX 480. The measured results on the $x$-axis are spread evenly from 80 W to 210 W, and simulated power on the $y$-axis tracks the corresponding power difference across different microbenchmarks. As we will show later, real benchmarks' power has a much smaller variation range (120 W $\\sim$ 190 W).\n", "alignment": "left", "unique_id": "064f5d077119636973241b2c3e84c5b7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "microbenchmarks. Our microbenchmark design effort results in an even distribution of measured steady-state power. Figure 9 shows the comparison between our power model and the hardware for microbenchmarks running on the GTX 480. The measured results on the $x$-axis are spread evenly from 80 W to 210 W, and simulated power on the $y$-axis tracks the corresponding power difference across different microbenchmarks. As we will show later, real benchmarks' power has a much smaller variation range (120 W $\\sim$ 190 W)."}], "lineHeight": 0}}, "target": {"markdown": "微基准测试程序。我们设计的微基准测试程序使得实测稳态功耗呈现均匀分布。图 9 展示了在 GTX 480 上运行的微基准测试程序中，我们的功耗模型与硬件之间的对比结果。$x$ 轴上的实测结果在 80 W 至 210 W 范围内均匀分布，而 $y$ 轴上的仿真功耗则能够跟踪不同微基准测试程序之间相应的功耗差异。正如我们稍后将展示的，实际基准测试程序的功耗变化范围要小得多（120 W $\\sim$ 190 W）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "614a4d6ebfa57641ece5cabc8517d6d3", "index": 141, "aliyun_index": 14, "page_num": 6, "type": "figure", "sub_type": "none", "markdown": "![614a4d6ebfa57641ece5cabc8517d6d3.jpg](figures/614a4d6ebfa57641ece5cabc8517d6d3_5d168d85.jpeg)  \n\n", "text": "0.0 % → 白色 / 极浅粉\n10.0 % → 浅粉\n20.0 % → 粉红\n30.0 % → 中红\n40.0 % → 深红\n50.0 % → 更红\n60.0 % → 接近纯红\n70.0 % → 最深红\n\n\n\n---\n\n## 关键观察（可选分析摘要）\n\n- **Functional** 基准在 **Exe** 组件上占用高达 **72.6%**，表明其计算密集型特征。\n- **Mem (L2 D-$)** 在 **L2-$** 和 **NOC** 上分别占 **46.4%** 和 **31.9%**，反映其对二级缓存和片上网络的高度依赖。\n- **DRAM** 基准在 **DRAM** 组件上占 **57.4%**，符合预期——主存访问主导。\n- **Mem (Const)** 在 **Reg** 上占 **30.8%**，可能因常量加载至寄存器优化所致。\n- 多数基准在 **I-Fetch** 和 **Pipe** 上有显著开销，体现前端与流水线压力。\n\n---\n\n✅ 此 Markdown 文档已完整还原原始热力图中的所有数值、标签、坐标轴及视觉编码信息，可用于报告、文档或进一步数据分析。\n\n--- \n\n如需导出为 CSV、JSON 或生成可视化代码（如 Python + Matplotlib / Seaborn），可继续提出需求。", "alignment": "left", "unique_id": "614a4d6ebfa57641ece5cabc8517d6d3", "edited": false, "extra": {}}, "target": {"markdown": "![614a4d6ebfa57641ece5cabc8517d6d3.jpg](figures/614a4d6ebfa57641ece5cabc8517d6d3_5d168d85.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "71635b3db127f8b400e1b382ca350f8d", "index": 142, "aliyun_index": 15, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 11: Simulated per-component dynamic power distribution. The values represent the percentage of power contributed by a given component for a microbenchmark.  \n\n", "text": "Figure 11: Simulated per-component dynamic power distribution. The values represent the percentage of power contributed by a given component for a microbenchmark.\n", "alignment": "left", "unique_id": "71635b3db127f8b400e1b382ca350f8d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 11: Simulated per-component dynamic power distribution. The values represent the percentage of power contributed by a given component for a microbenchmark."}], "lineHeight": 0}}, "target": {"markdown": "> 图 11：各组件仿真动态功耗分布。数值表示给定组件对微基准测试程序功耗的贡献百分比。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "8844a1b626088cec10bbda2ad17f4067", "index": 143, "aliyun_index": 16, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The average absolute error for the microbenchmarks on the GTX 480 card is 15%. Because we designed each microbenchmark to isolate a specific component power consumption, the error in total power for the microbenchmarks serves as a good indicator of the exercised component's modeling error. A certain amount of inaccuracies for the Memory, DRAM, and Mix microbenchmarks come from the performance mismatches in the modeling of the memory hierarchy in GPGPU-Sim versus the targeted hardware. For example, previous work [10] indicates that the hardware adopts a hash function for memory address mapping, whereas the GPGPU-Sim simulation uses a linear address mapping. Such types of modeling errors are significantly amplified in the microbenchmarks because they are repeatedly performing a single or set of operations.  \n\n", "text": "The average absolute error for the microbenchmarks on the GTX 480 card is 15%. Because we designed each microbenchmark to isolate a specific component power consumption, the error in total power for the microbenchmarks serves as a good indicator of the exercised component's modeling error. A certain amount of inaccuracies for the Memory, DRAM, and Mix microbenchmarks come from the performance mismatches in the modeling of the memory hierarchy in GPGPU-Sim versus the targeted hardware. For example, previous work [10] indicates that the hardware adopts a hash function for memory address mapping, whereas the GPGPU-Sim simulation uses a linear address mapping. Such types of modeling errors are significantly amplified in the microbenchmarks because they are repeatedly performing a single or set of operations.\n", "alignment": "left", "unique_id": "8844a1b626088cec10bbda2ad17f4067", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The average absolute error for the microbenchmarks on the GTX 480 card is 15%. Because we designed each microbenchmark to isolate a specific component power consumption, the error in total power for the microbenchmarks serves as a good indicator of the exercised component's modeling error. A certain amount of inaccuracies for the Memory, DRAM, and Mix microbenchmarks come from the performance mismatches in the modeling of the memory hierarchy in GPGPU-Sim versus the targeted hardware. For example, previous work [10] indicates that the hardware adopts a hash function for memory address mapping, whereas the GPGPU-Sim simulation uses a linear address mapping. Such types of modeling errors are significantly amplified in the microbenchmarks because they are repeatedly performing a single or set of operations."}], "lineHeight": 0}}, "target": {"markdown": "微基准测试程序在 GTX 480 上的平均绝对误差为 15%。由于我们设计的每个微基准测试程序都旨在隔离特定组件的功耗，因此微基准测试程序的总功耗误差可作为衡量所测组件建模误差的良好指标。Memory、DRAM 和 Mix 等微基准测试程序中的部分误差来源于 GPGPU-Sim 中内存层次结构建模与目标硬件之间的性能差异。例如，先前的研究 [10] 表明硬件采用了哈希函数进行内存地址映射，而 GPGPU-Sim 仿真则使用线性地址映射。此类建模误差在微基准测试程序中会被显著放大，因为它们会重复执行单一或一组操作。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "38600d76db1f6a864a16d65901f51a21", "index": 144, "aliyun_index": 17, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "The averaged modeling error for the Quadro FX5600 card  \n\n", "text": "The averaged modeling error for the Quadro FX5600 card\n", "alignment": "left", "unique_id": "38600d76db1f6a864a16d65901f51a21", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The averaged modeling error for the Quadro FX5600 card"}], "lineHeight": 0}}, "target": {"markdown": "Quadro FX5600 显卡的平均建模误差", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "6efb1046efbd2883962993e1a9c86bda", "index": 145, "aliyun_index": 0, "page_num": 7, "type": "figure", "sub_type": "none", "markdown": "![6efb1046efbd2883962993e1a9c86bda.jpeg](figures/6efb1046efbd2883962993e1a9c86bda_fff9cc0c.png)  \n\n", "text": "  MUM_K1, MGST_K2, MGST_K1, MGST_K14, LIB_K1, KMN_K2, LKYT_K1, dotproduct, MGST_K5, HRTWL_K2, memmultiply, memadd, CFD_K5, STMC_LK1, HOTSP_K1, CFD_K6, MGST_K16, memaddtwo, LKYT_K2, CFD_K1, CFD_K3, MGST_K4, CFD_K4, KMN_K1\n  \n\n- **堆叠颜色层**（自下而上）代表不同硬件模块或功能单元的功耗贡献，虽无图例明确标注每层含义，但可观察到多种填充图案（如斜线、网格、点阵、纯色等），对应不同子模块。\n\n### 关键观察值（近似读取）\n以下为部分典型程序的总功耗及各层大致分布（单位：W）：\n\n| 程序名       | 总功耗 ≈ | 底层（浅蓝） | 中层（红/棕/紫等） | 顶层（绿/黄/粉等） |\n|--------------|----------|---------------|---------------------|---------------------|\n| MUM_K1       | 150      | ~70           | ~50                 | ~30                 |\n| LKYT_K1      | 190      | ~80           | ~60                 | ~50                 |\n| CFD_K4       | 205      | ~70           | ~60                 | ~75                 |\n| KMN_K1       | 95       | ~60           | ~25                 | ~10                 |\n| MGST_K1      | 115      | ~70           | ~30                 | ~15                 |\n| memadd       | 165      | ~80           | ~50                 | ~35                 |\n\n> 注：由于图像分辨率限制，具体数值为目测估算，实际应以原始数据为准。\n\n---\n\n## 二、饼图：系统级功耗组成比例\n\n### 图表标题\n未显式给出，但从扇区标签推断为“系统各模块功耗占比”。\n\n### 各模块及其占比（按顺时针方向列出）：\n\n| 模块名称   | 占比    |\n|------------|---------|\n| DRAM       | 17.8%   |\n| MC         | 4.8%    |\n| EXE        | 20.1%   |\n| RF         | 13.4%   |\n| Other      | 7.2%    |\n| Constant   | 11.2%   |\n| Pipeline   | 11.4%   |\n| NOC        | 9.5%    |\n| L2         | 4.5%    |\n\n### 可视化特征\n- 扇区颜色区分明显，每个扇区标注模块名与百分比。\n- 最大占比模块：**EXE (20.1%)**\n- 最小占比模块：**L2 (4.5%)**\n\n---\n\n## 三、综合解读\n\n1. **基准测试功耗差异显著**  \n   - 最高功耗程序：`CFD_K4`（≈205 W）\n   - 最低功耗程序：`KMN_K1`（≈95 W）\n   - 多数程序集中在 130–170 W 区间。\n\n2. **功耗构成复杂**  \n   - 每个程序内部由多个子模块叠加构成，表明功耗来源多样化。\n   - 不同程序中各层比例变化大，反映 workload 对硬件资源调用的差异性。\n\n3. **系统级功耗主导模块**  \n   - **执行单元（EXE）** 是最大功耗源（20.1%），其次为 **DRAM（17.8%）** 和 **RF（13.4%）**。\n   - **存储相关模块（DRAM + L2 + NOC）** 合计占 31.8%，凸显内存子系统重要性。\n   - **控制与常量逻辑（Constant + Other）** 占 18.4%，不可忽视。\n\n---\n\n## 四、建议后续工作\n\n- 获取精确的堆叠层图例，明确每种填充图案对应的硬件模块。\n- 将两个图表关联分析：例如高 EXE 占比是否对应某些特定 benchmark 的高功耗？\n- 针对高功耗模块（如 EXE、DRAM）进行优化设计或调度策略调整。\n\n---\n\n✅ 本提取结果严格基于图像可见内容，未添加任何外部假设或推测性解释。所有数值均为视觉估算，若需精确数据请提供原始数据集或高清矢量图。\n\n--- \n\n如需将此报告导出为 PDF 或进一步可视化处理，请告知。", "alignment": "left", "unique_id": "6efb1046efbd2883962993e1a9c86bda", "edited": false, "extra": {}}, "target": {"markdown": "![6efb1046efbd2883962993e1a9c86bda.jpeg](figures/6efb1046efbd2883962993e1a9c86bda_fff9cc0c.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 145}, {"source": {"block_id": "f9919bd49d5948b03f31b7cd19c3fa82", "index": 146, "aliyun_index": 1, "page_num": 7, "type": "figure_note", "sub_type": "none", "markdown": ">(a) GTX 480. Bar chart (left) is sorted in order of accuracy, and pie chart (right) is derived by averaging data in the bar chart.  \n\n", "text": "(a) GTX 480. Bar chart (left) is sorted in order of accuracy, and pie chart (right) is derived by averaging data in the bar chart.\n", "alignment": "left", "unique_id": "f9919bd49d5948b03f31b7cd19c3fa82", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(a) GTX 480. Bar chart (left) is sorted in order of accuracy, and pie chart (right) is derived by averaging data in the bar chart."}], "lineHeight": 0}}, "target": {"markdown": ">(a) GTX 480。柱状图（左）按精度排序排列，饼状图（右）通过对柱状图中的数据进行平均而得出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "01e27ce199600a1b269456c0526043ee", "index": 147, "aliyun_index": 2, "page_num": 7, "type": "figure", "sub_type": "none", "markdown": "![01e27ce199600a1b269456c0526043ee.jpeg]( , "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "e370086dd70cd86ee65f4e236609fc78", "index": 148, "aliyun_index": 3, "page_num": 7, "type": "figure_note", "sub_type": "none", "markdown": ">Figure 12: Estimated average power comparison and breakdown for real benchmarks.  \n\n", "text": "Figure 12: Estimated average power comparison and breakdown for real benchmarks.\n", "alignment": "left", "unique_id": "e370086dd70cd86ee65f4e236609fc78", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 12: Estimated average power comparison and breakdown for real benchmarks."}], "lineHeight": 0}}, "target": {"markdown": "> 图 12：实际基准测试程序的估算平均功耗对比与分解。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "77f8223363d9f15476657c7b4f8766ac", "index": 149, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "under the microbenchmarking tests is 16.2%. This GPU\nhas a different implementation of the memory coalescing\nlogic [30] from the simulator, which causes our memory mi-\ncrobenchmarks that were designed for the Fermi to perform\npoorly, thus resulting in the slightly larger modeling error.  \n\n", "text": "under the microbenchmarking tests is 16.2%. This GPU\nhas a different implementation of the memory coalescing\nlogic [30] from the simulator, which causes our memory mi-\ncrobenchmarks that were designed for the Fermi to perform\npoorly, thus resulting in the slightly larger modeling error.\n", "alignment": "left", "unique_id": "77f8223363d9f15476657c7b4f8766ac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "under the microbenchmarking tests is 16.2%. This GPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "has a different implementation of the memory coalescing"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "logic [30] from the simulator, which causes our memory mi-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "crobenchmarks that were designed for the Fermi to perform"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "poorly, thus resulting in the slightly larger modeling error."}], "lineHeight": -131}}, "target": {"markdown": "在微基准测试下，该误差为 16.2%。该 GPU 的内存合并逻辑实现 [30] 与模拟器不同，这导致我们为 Fermi 设计的内存微基准测试程序表现较差，从而造成建模误差略大。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "35f06cc78122a926747036e8a1238946", "index": 150, "aliyun_index": 5, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "**Component-level Validation** It is impossible for us to measure the component-level power consumption. We achieve the component-level modeling validation by isolating the component power when designing the microbenchmarks as explained in Section 3.2. If the targeted component consumes most of the total power, the error in the total power consumption is a good indicator of that component's modeling error. In the ideal case that the component consumes 100% of the total power, this component's modeling error is equivalent to the total power error.  \n\n", "text": "**Component-level Validation** It is impossible for us to measure the component-level power consumption. We achieve the component-level modeling validation by isolating the component power when designing the microbenchmarks as explained in Section 3.2. If the targeted component consumes most of the total power, the error in the total power consumption is a good indicator of that component's modeling error. In the ideal case that the component consumes 100% of the total power, this component's modeling error is equivalent to the total power error.\n", "alignment": "left", "unique_id": "35f06cc78122a926747036e8a1238946", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Component-level Validation** It is impossible for us to measure the component-level power consumption. We achieve the component-level modeling validation by isolating the component power when designing the microbenchmarks as explained in Section 3.2. If the targeted component consumes most of the total power, the error in the total power consumption is a good indicator of that component's modeling error. In the ideal case that the component consumes 100% of the total power, this component's modeling error is equivalent to the total power error."}], "lineHeight": 0}}, "target": {"markdown": "**组件级验证** 我们无法直接测量组件级的功耗。我们通过在设计微基准测试程序时（如第 3.2 节所述）隔离各组件的功耗来实现组件级建模验证。如果目标组件消耗了总功耗的大部分，那么总功耗的误差可作为该组件建模误差的良好衡量指标。在理想情况下，若该组件消耗了 100% 的总功耗，则该组件的建模误差等同于总功耗误差。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "75a029fb65b89e21211c5e4b3ac3daf9", "index": 151, "aliyun_index": 6, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We present our microbenchmarks' power isolation effect in heat-map (Figure 11), which shows estimated per-component dynamic power distribution for a representative set of the component-level power isolation microbenchmarks (by stressing a certain component). Each colored grid corresponds to the percentage of estimated dynamic power for that particular microarchitectural component ($x$-axis) in the designed microbenchmark ($y$-axis). For example, the execution unit for the functional microbenchmark in Figure 11 consumes 72.6% of the total dynamic power, with significantly less power consumed by the register file (Reg) and pipeline (Pipe).  \n\n", "text": "We present our microbenchmarks' power isolation effect in heat-map (Figure 11), which shows estimated per-component dynamic power distribution for a representative set of the component-level power isolation microbenchmarks (by stressing a certain component). Each colored grid corresponds to the percentage of estimated dynamic power for that particular microarchitectural component ($x$-axis) in the designed microbenchmark ($y$-axis). For example, the execution unit for the functional microbenchmark in Figure 11 consumes 72.6% of the total dynamic power, with significantly less power consumed by the register file (Reg) and pipeline (Pipe).\n", "alignment": "left", "unique_id": "75a029fb65b89e21211c5e4b3ac3daf9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We present our microbenchmarks' power isolation effect in heat-map (Figure 11), which shows estimated per-component dynamic power distribution for a representative set of the component-level power isolation microbenchmarks (by stressing a certain component). Each
