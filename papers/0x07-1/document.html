bank provides operands for 32 SIMT threads. We estimate the power consumption for these memory arrays using CACTI.\n", "alignment": "left", "unique_id": "eb4699239dfce5b08c9a56ca9118ab0f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "multiply-add (FMA) operation per cycle [28], which needs three input operands and one output operand from the register file. Each SM contains 32,768 32-bit registers, which are shared by all threads executed on the same SM. We model the register file as 16 dual-ported (one read and one write port) banks, each of which provides 2,048 logical 32-bit registers. Physically, these registers are accessed as 64 1,024-bit registers. Thus, each operand read from a register file bank provides operands for 32 SIMT threads. We estimate the power consumption for these memory arrays using CACTI."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "ae777db4914da48a555c97858ec2791c", "index": 50, "aliyun_index": 13, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "A crossbar interconnection network is used to transfer operands from register file banks to operand collectors. Furthermore, in the case of bank conflicts, the arbiter shown in Figure 3 is responsible for serializing the register file access, and the operand collectors are used to buffer the data already read from the register file.  \n\n", "text": "A crossbar interconnection network is used to transfer operands from register file banks to operand collectors. Furthermore, in the case of bank conflicts, the arbiter shown in Figure 3 is responsible for serializing the register file access, and the operand collectors are used to buffer the data already read from the register file.\n", "alignment": "left", "unique_id": "ae777db4914da48a555c97858ec2791c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A crossbar interconnection network is used to transfer operands from register file banks to operand collectors. Furthermore, in the case of bank conflicts, the arbiter shown in Figure 3 is responsible for serializing the register file access, and the operand collectors are used to buffer the data already read from the register file."}], "lineHeight": 0}}, "target": {"markdown": "跨开关互连网络用于将操作数从寄存器文件 bank 传送到操作数收集器。此外，当发生 bank 冲突时，图 3 中所示的仲裁器负责对寄存器文件访问进行串行化，而操作数收集器则用于缓存已从寄存器文件读取的数据。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "946efe18f877f9276f3b49cb5de6ca53", "index": 51, "aliyun_index": 14, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We include the crossbar interconnect model in our register-file power model. The crossbar network's parameters are determined by the number of register-file banks, as well as the number of operand collector units. For the Fermi architecture, we model a 16-input $\\times$ 16-output crossbar network, as shown in Figure 3. Each input and output of the crossbar is 1,024 bits wide. Consequently, the operands read from a register file bank are routed to the proper operand collector. We model each operand collector as an SRAM array bank.  \n\n", "text": "We include the crossbar interconnect model in our register-file power model. The crossbar network's parameters are determined by the number of register-file banks, as well as the number of operand collector units. For the Fermi architecture, we model a 16-input $\\times$ 16-output crossbar network, as shown in Figure 3. Each input and output of the crossbar is 1,024 bits wide. Consequently, the operands read from a register file bank are routed to the proper operand collector. We model each operand collector as an SRAM array bank.\n", "alignment": "left", "unique_id": "946efe18f877f9276f3b49cb5de6ca53", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We include the crossbar interconnect model in our register-file power model. The crossbar network's parameters are determined by the number of register-file banks, as well as the number of operand collector units. For the Fermi architecture, we model a 16-input $\\times$ 16-output crossbar network, as shown in Figure 3. Each input and output of the crossbar is 1,024 bits wide. Consequently, the operands read from a register file bank are routed to the proper operand collector. We model each operand collector as an SRAM array bank."}], "lineHeight": 0}}, "target": {"markdown": "我们将交叉开关互连模型纳入寄存器文件功耗模型中。交叉开关网络的参数由寄存器文件 bank 的数量以及操作数收集器的数量决定。针对 Fermi 架构，我们建模了一个 16 输入 × 16 输出的交叉开关网络，如图 3 所示。交叉开关的每个输入和输出宽度均为 1024 位。因此，从寄存器文件 bank 读出的操作数将被路由到相应的操作数收集器。我们将每个操作数收集器建模为一个 SRAM 阵列 bank。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "fd1b63748d8dbf1bfeff12e3ef3986f3", "index": 52, "aliyun_index": 15, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 2.3 Shared Memory\n", "text": "2.3 Shared Memory\n", "alignment": "left", "unique_id": "fd1b63748d8dbf1bfeff12e3ef3986f3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.3 Shared Memory"}], "lineHeight": 0}}, "target": {"markdown": "### 2.3 共享存储器\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 52}, {"source": {"block_id": "88ad31bdc8efbd7611d0085a134813bf", "index": 53, "aliyun_index": 16, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "NVIDIA GPUs contain shared memory per SM. It can be used for interthread communication for threads in a thread block. Because SIMD lanes can access any address concurrently, shared memory is multibanked and contains a crossbar interconnect to improve performance. That is, shared memory has a very similar structure to the register files (Section 2.2). In the case of the Fermi architecture, the number of banks is 32 and the crossbar is 32-input$\\times$32-output.  \n\n", "text": "NVIDIA GPUs contain shared memory per SM. It can be used for interthread communication for threads in a thread block. Because SIMD lanes can access any address concurrently, shared memory is multibanked and contains a crossbar interconnect to improve performance. That is, shared memory has a very similar structure to the register files (Section 2.2). In the case of the Fermi architecture, the number of banks is 32 and the crossbar is 32-input$\\times$32-output.\n", "alignment": "left", "unique_id": "88ad31bdc8efbd7611d0085a134813bf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA GPUs contain shared memory per SM. It can be used for interthread communication for threads in a thread block. Because SIMD lanes can access any address concurrently, shared memory is multibanked and contains a crossbar interconnect to improve performance. That is, shared memory has a very similar structure to the register files (Section 2.2). In the case of the Fermi architecture, the number of banks is 32 and the crossbar is 32-input$\\times$32-output."}], "lineHeight": 0}}, "target": {"markdown": "NVIDIA GPU 在每个 SM 内都包含共享存储器。它可用于同一线程块内线程之间的通信。由于 SIMD 通道可以并发地访问任意地址，共享存储器采用多体（multibanked）结构，并包含一个交叉开关互连以提升性能。也就是说，共享存储器与寄存器文件（第 2.2 节）具有非常相似的结构。在 Fermi 架构中，bank 数量为 32，交叉开关为 32 输入 × 32 输出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "281967e6a4406bb15d77bf7eb5c06193", "index": 54, "aliyun_index": 17, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 2.4 Execution Units\n", "text": "2.4 Execution Units\n", "alignment": "left", "unique_id": "281967e6a4406bb15d77bf7eb5c06193", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.4 Execution Units"}], "lineHeight": 0}}, "target": {"markdown": "### 2.4 执行单元\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 54}, {"source": {"block_id": "9b3697e1986e0f1061826d5f3c6b1ca3", "index": 55, "aliyun_index": 18, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We model the FP pipeline in the Fermi architecture using floating-point FMA units. Two lanes of FMA units can combine to execute a double-precision (DP) operation. The SFU units are also modeled as DP FMA units. Because most instructions executed on the SFU units are transcendental operations that employ iterative algorithms to compute the result, these units' power consumption depends on the latency and throughput of instructions.  \n\n", "text": "We model the FP pipeline in the Fermi architecture using floating-point FMA units. Two lanes of FMA units can combine to execute a double-precision (DP) operation. The SFU units are also modeled as DP FMA units. Because most instructions executed on the SFU units are transcendental operations that employ iterative algorithms to compute the result, these units' power consumption depends on the latency and throughput of instructions.\n", "alignment": "left", "unique_id": "9b3697e1986e0f1061826d5f3c6b1ca3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We model the FP pipeline in the Fermi architecture using floating-point FMA units. Two lanes of FMA units can combine to execute a double-precision (DP) operation. The SFU units are also modeled as DP FMA units. Because most instructions executed on the SFU units are transcendental operations that employ iterative algorithms to compute the result, these units' power consumption depends on the latency and throughput of instructions."}], "lineHeight": 0}}, "target": {"markdown": "我们使用浮点 FMA 单元对 Fermi 架构中的浮点流水线进行建模。两个 FMA 单元通道可以组合起来执行双精度（DP）运算。SFU 单元也被建模为 DP FMA 单元。由于在 SFU 单元上执行的大多数指令是采用迭代算法计算结果的超验运算，这些单元的功耗取决于指令的延迟和吞吐率。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "337887c703fb6ebecd35e37b5039bad0", "index": 56, "aliyun_index": 19, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Area and power modeling of execution units are initially estimated based upon synthesis of their Verilog descriptions. The execution units are synthesized using a 45-nm standard cell library. The synthesized netlists are annotated with  \n\n", "text": "Area and power modeling of execution units are initially estimated based upon synthesis of their Verilog descriptions. The execution units are synthesized using a 45-nm standard cell library. The synthesized netlists are annotated with\n", "alignment": "left", "unique_id": "337887c703fb6ebecd35e37b5039bad0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Area and power modeling of execution units are initially estimated based upon synthesis of their Verilog descriptions. The execution units are synthesized using a 45-nm standard cell library. The synthesized netlists are annotated with"}], "lineHeight": 0}}, "target": {"markdown": "执行单元的面积和功耗建模最初基于其 Verilog 描述的综合结果进行估算。这些执行单元使用 45 nm 标准单元库进行综合。综合得到的网表使用", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 56}, {"source": {"block_id": "8694eb6103761212d65c3be0bfa48a4d", "index": 57, "aliyun_index": 0, "page_num": 3, "type": "figure", "sub_type": "none", "markdown": "![8694eb6103761212d65c3be0bfa48a4d.jpeg](figures/8694eb6103761212d65c3be0bfa48a4d_09217a59.png)  \n\n", "text": "以下是根据您提供的图片内容提取并整理的合法 Markdown 格式文档，准确保留所有步骤、结构和细节：\n\n---\n\n# Memory Request Processing Pipeline\n\n## 1. Memory Requests\n- Input layer: Receives memory requests from threads or processing units.\n- Bidirectional arrows indicate interaction with the Pending Request Table (PRT).\n\n## 2. Pending Request Table (PRT)\nA table that holds pending memory requests before coalescing.\n\n### Structure of Each Entry:\nEach entry in the PRT contains the following fields:\n\n| Field             | Description                     |\n|-------------------|---------------------------------|\n| TID               | Thread ID                       |\n| Request Size      | Size of the memory request      |\n| Base Address      | Starting address of the request |\n| Offset Address    | Offset within the base address  |\n\n> Note: The diagram shows multiple entries (“Entry”, “Entry”, ..., “Entry”) indicating a scalable table structure.\n\n### Navigation / Indexing:\n- Horizontal arrow labeled “Entry” indicates traversal or indexing across entries.\n- Vertical lines separate individual entries.\n\n## 3. Memory Address Coalescing\n- Process stage that combines adjacent or overlapping memory requests from different threads into fewer, larger transactions to improve bandwidth efficiency.\n- Takes input from the Pending Request Table.\n- Output is directed to the Thread Masks module.\n\n## 4. Thread Masks\nOutput structure representing coalesced memory access patterns per thread.\n\n### Structure:\nContains one or more blocks, each corresponding to a thread’s coalesced access pattern.\n\n#### First Block:\n| Field                  | Description                          |\n|------------------------|--------------------------------------|\n| Pending Request Count  | Number of pending requests for this thread group |\n| Thread Mask            | Bitmask indicating which threads are involved in this coalesced request |\n\n#### Subsequent Blocks:\n- Additional “Thread Mask” blocks follow, one per coalesced group or thread subset.\n- Ellipsis (`...`) indicates variable number of such blocks depending on system load or configuration.\n\n---\n\n## Data Flow Summary\n\n```mermaid\ngraph TD\n    A[Memory Requests] --> B[Pending Request Table]\n    B --> C[Memory Address Coalescing]\n    C --> D[Thread Masks]\n\n    subgraph \"Pending Request Table\"\n        direction TB\n        E[TID] --- F[Request Size]\n        F --- G[Base Address]\n        G --- H[Offset Address]\n        I[Entry] --- J[Entry] --- K[...] --- L[Entry]\n    end\n\n    subgraph \"Thread Masks\"\n        M[Pending Request Count] --- N[Thread Mask] --- O[Thread Mask] --- P[...] --- Q[Thread Mask]\n    end\n```\n\n> **Note**: This Mermaid diagram visually represents the data flow and internal structures as shown in the original image.\n\n---\n\n## Key Observations\n\n- The architecture supports dynamic scaling via ellipses (`...`) in both the Pending Request Table and Thread Masks sections.\n- Coalescing occurs after requests are queued in the PRT, suggesting hardware-level optimization for GPU or many-core architectures.\n- Thread masks likely encode which threads’ accesses can be merged — useful for SIMD/SIMT execution models.\n\n---\n\nThis Markdown representation preserves all visual elements, labels, relationships, and implied functionality from the original diagram while structuring them for clarity and machine-readability.", "alignment": "left", "unique_id": "8694eb6103761212d65c3be0bfa48a4d", "edited": false, "extra": {}}, "target": {"markdown": "![8694eb6103761212d65c3be0bfa48a4d.jpeg](figures/8694eb6103761212d65c3be0bfa48a4d_09217a59.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 57}, {"source": {"block_id": "44b9aa3a158d8d6663a9f35282ea1a8a", "index": 58, "aliyun_index": 1, "page_num": 3, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 4: Main components of memory address coalescing.  \n\n", "text": "Figure 4: Main components of memory address coalescing.\n", "alignment": "left", "unique_id": "44b9aa3a158d8d6663a9f35282ea1a8a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 4: Main components of memory address coalescing."}], "lineHeight": 0}}, "target": {"markdown": "> 图 4：存储器地址合并的主要组件。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 58}, {"source": {"block_id": "79a68e3515e308b7319016ae6ed8d125", "index": 59, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "switching activity for random inputs. We use the Synopsys Power Compiler\\(^{\\textregistered}\\) [3] to estimate the power consumption of the designs after the annotation of switching activity. All designs assume an operating nominal \\(V_{DD}\\) of 1 V. We perform technology and voltage scaling according to ITRS projections to estimate the dynamic power consumption at the given voltage and technology node.  \n\n", "text": "switching activity for random inputs. We use the Synopsys Power Compiler\\(^{\\textregistered}\\) [3] to estimate the power consumption of the designs after the annotation of switching activity. All designs assume an operating nominal \\(V_{DD}\\) of 1 V. We perform technology and voltage scaling according to ITRS projections to estimate the dynamic power consumption at the given voltage and technology node.\n", "alignment": "left", "unique_id": "79a68e3515e308b7319016ae6ed8d125", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "switching activity for random inputs. We use the Synopsys Power Compiler\\(^{\\textregistered}\\) [3] to estimate the power consumption of the designs after the annotation of switching activity. All designs assume an operating nominal \\(V_{DD}\\) of 1 V. We perform technology and voltage scaling according to ITRS projections to estimate the dynamic power consumption at the given voltage and technology node."}], "lineHeight": 0}}, "target": {"markdown": "在随机输入下的开关活动。我们使用 Synopsys Power Compiler\\(^{\\textregistered}\\) [3] 在标注开关活动后估算各设计的功耗。所有设计均假设标称工作电压 \\(V_{DD}\\) 为 1 V。我们根据 ITRS 预测进行工艺和电压缩放，以估算在给定电压和工艺节点下的动态功耗。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 59}, {"source": {"block_id": "cb5d3cf4eea6710db169f90af8d36f09", "index": 60, "aliyun_index": 3, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### 2.5 Memory Coalescing Logic (MCL)\n", "text": "2.5 Memory Coalescing Logic (MCL)\n", "alignment": "left", "unique_id": "cb5d3cf4eea6710db169f90af8d36f09", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.5 Memory Coalescing Logic (MCL)"}], "lineHeight": 0}}, "target": {"markdown": "### 2.5 存储器合并逻辑（MCL）\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 60}, {"source": {"block_id": "8a91ad4dda09471f98de9a48cbe1b7d8", "index": 61, "aliyun_index": 4, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "GPUs' load/store units are responsible for coalescing memory accesses to reduce the bandwidth usage. Figure 4 depicts MCL's main structures. Each MCL contains a pending request table (PRT) with multiple entries. Each PRT entry stores the thread index, the base and offset addresses for the memory access, and the request sizes for all of the concurrently issued memory requests by a warp. These entries are written to the PRT whenever a memory request is issued.  \n\n", "text": "GPUs' load/store units are responsible for coalescing memory accesses to reduce the bandwidth usage. Figure 4 depicts MCL's main structures. Each MCL contains a pending request table (PRT) with multiple entries. Each PRT entry stores the thread index, the base and offset addresses for the memory access, and the request sizes for all of the concurrently issued memory requests by a warp. These entries are written to the PRT whenever a memory request is issued.\n", "alignment": "left", "unique_id": "8a91ad4dda09471f98de9a48cbe1b7d8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs' load/store units are responsible for coalescing memory accesses to reduce the bandwidth usage. Figure 4 depicts MCL's main structures. Each MCL contains a pending request table (PRT) with multiple entries. Each PRT entry stores the thread index, the base and offset addresses for the memory access, and the request sizes for all of the concurrently issued memory requests by a warp. These entries are written to the PRT whenever a memory request is issued."}], "lineHeight": 0}}, "target": {"markdown": "GPU 的加载/存储单元负责合并存储器访问以减少带宽占用。图 4 描述了 MCL 的主要结构。每个 MCL 包含一个具有多个条目的挂起请求表（PRT）。每个 PRT 条目存储线程索引、存储器访问的基地址与偏移地址，以及由一个 warp 同时发出的所有存储器请求的请求大小。每当发出存储器请求时，这些条目就会被写入 PRT。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 61}, {"source": {"block_id": "c52e8bfa264baf451386cf10c5521dd0", "index": 62, "aliyun_index": 5, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "To determine the number of coalesced memory requests that a warp must issue, MCL compares the base address of the first thread's request with the base addresses of all the remaining requests in the PRT entry. The memory request mask of all the SIMT threads with the same base address is set to zero. The process is repeated until masks have been generated for all requests in the PRT entry. These masks are stored in a separate thread mask array. Memory requests are generated for all addresses whose mask bit are set. For each PRT entry, a pending request count (PRC) is maintained, and is incremented when a request is sent to memory and decremented when a response is received. When the PRC becomes zero, requests for the warp are satisfied. We model the PRT as an SRAM array structure using CACTI.  \n\n", "text": "To determine the number of coalesced memory requests that a warp must issue, MCL compares the base address of the first thread's request with the base addresses of all the remaining requests in the PRT entry. The memory request mask of all the SIMT threads with the same base address is set to zero. The process is repeated until masks have been generated for all requests in the PRT entry. These masks are stored in a separate thread mask array. Memory requests are generated for all addresses whose mask bit are set. For each PRT entry, a pending request count (PRC) is maintained, and is incremented when a request is sent to memory and decremented when a response is received. When the PRC becomes zero, requests for the warp are satisfied. We model the PRT as an SRAM array structure using CACTI.\n", "alignment": "left", "unique_id": "c52e8bfa264baf451386cf10c5521dd0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To determine the number of coalesced memory requests that a warp must issue, MCL compares the base address of the first thread's request with the base addresses of all the remaining requests in the PRT entry. The memory request mask of all the SIMT threads with the same base address is set to zero. The process is repeated until masks have been generated for all requests in the PRT entry. These masks are stored in a separate thread mask array. Memory requests are generated for all addresses whose mask bit are set. For each PRT entry, a pending request count (PRC) is maintained, and is incremented when a request is sent to memory and decremented when a response is received. When the PRC becomes zero, requests for the warp are satisfied. We model the PRT as an SRAM array structure using CACTI."}], "lineHeight": 0}}, "target": {"markdown": "为了确定一个 warp 必须发出的合并存储器请求数量，MCL 将首线程请求的基地址与 PRT 条目中所有其余请求的基地址进行比较。所有具有相同基地址的 SIMT 线程的存储器请求掩码被置零。该过程将重复执行，直到为 PRT 条目中的所有请求生成掩码为止。这些掩码存储在一个独立的线程掩码数组中。对于所有掩码位被置 1 的地址，都会生成相应的存储器请求。对于每个 PRT 条目，维护一个挂起请求计数（PRC），当请求被发送到存储器时递增，当收到响应时递减。当 PRC 变为零时，表明该 warp 的所有请求均已满足。我们使用 CACTI 将 PRT 建模为 SRAM 阵列结构。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "16116b0825715154adb2e671fc21f157", "index": 63, "aliyun_index": 6, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### 2.6 Idle SMs\n", "text": "2.6 Idle SMs\n", "alignment": "left", "unique_id": "16116b0825715154adb2e671fc21f157", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.6 Idle SMs"}], "lineHeight": 0}}, "target": {"markdown": "### 2.6 空闲 SM\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 63}, {"source": {"block_id": "f27a93f9314cdcf58c4ee0e1d8a25a90", "index": 64, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Due to load imbalance, it is possible to have SMs that are idling during execution. In our experiments, we observe that an idle SM still consumes a noticeable amount of power that affects the accuracy of the power model. Some benchmarks, such as HRTWL and MGST, suffer from this load imbalance issue, where nearly a quarter of their SMs becomes idle after finishing their work. For the idle SM, activity factor $\\alpha_i$ in (1) is zero but the SM still consumes power. Therefore, it is important and necessary to model the idle power of individual SMs correctly.  \n\n", "text": "Due to load imbalance, it is possible to have SMs that are idling during execution. In our experiments, we observe that an idle SM still consumes a ark in which each SM can run at most one\nthread block concurrently. Then we vary the number of\nactive SMs to perform a linear regression fit to estimate  \n\n", "text": "We determine the dynamic power consumption of an idle\nSM using a microbenchmarking methodology. First, we use\na microbenchmark in which each SM can run at most one\nthread block concurrently. Then we vary the number of\nactive SMs to perform a linear regression fit to estimate\n", "alignment": "left", "unique_id": "4ccbc278e3f615497f40c37324a0a0f7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We determine the dynamic power consumption of an idle"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SM using a microbenchmarking methodology. First, we use"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a microbenchmark in which each SM can run at most one"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "thread block concurrently. Then we vary the number of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "active SMs to perform a linear regression fit to estimate"}], "lineHeight": -129}}, "target": {"markdown": "我们使用微基准测试方法来确定空闲 SM 的动态功耗。首先，我们采用一个微基准测试，其中每个 SM 最多只能同时运行一个线程块。然后，我们改变活动 SM 的数量以进行线性回归拟合，从而估算", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65 markdown": "### 2.7 Main Memory\n", "text": "2.7 Main Memory\n", "alignment": "left", "unique_id": "15bdb9502d48318efad619010c5261c1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.7 Main Memory"}], "lineHeight": 0}}, "target": {"markdown": "### 2.7 主存储器\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67}, {"source": {"block_id": "fda64ff945a6f6fe87912e18d8bd9d59", "index": 68, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Our paper focuses on modeling GPU chip power. We found no public information on GDDR3/5 power modeling and while flexible DRAM power models [35] could be incorporated into our effort, they require additional reverse engineering of the GDDR implementation, which is beyond the scope of our processor microarchitecture-centric work. Hence, we use an empirical approach based on prior work [13] to compute the effect of DRAM on our studies. The approach considers only DRAM dynamic power modeling.  \n\n", "text": "Our paper focuses on modeling GPU chip power. We found no public information on GDDR3/5 power modeling and while flexible DRAM power models [35] could be incorporated into our effort, they require additional reverse engineering of the GDDR implementation, which is beyond the scope of our processor microarchitecture-centric work. Hence, we use an empirical approach based on prior work [13] to compute the effect of DRAM on our studies. The approach considers only DRAM dynamic power modeling.\n", "alignment": "left", "unique_id": "fda64ff945a6f6fe87912e18d8bd9d59", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Our paper focuses on modeling GPU chip power. We found no public information on GDDR3/5 power modeling and while flexible DRAM power models [35] could be incorporated into our effort, they require additional reverse engineering of the GDDR implementation, which is beyond the scope of our processor microarchitecture-centric work. Hence, we use an empirical approach based on prior work [13] to compute the effect of DRAM on our studies. The approach considers only DRAM dynamic power modeling."}], "lineHeight": 0}}, "target": {"markdown": "本文聚焦于对 GPU 芯片功耗的建模。我们没有找到关于 GDDR3/5 功耗建模的公开资料，虽然灵活的 DRAM 功耗模型 [35] 可以被纳入我们的工作中，但它们需要对 GDDR 实现进行额外的逆向工程，这超出了我们以处理器微架构为核心的研究范围。因此，我们采用基于先前工作 [13] 的经验方法来计算 DRAM 对我们研究的影响。该方法仅考虑 DRAM 的动态功耗建模。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 68}, {"source": {"block_id": "82fb98230435a0d884aac05009beec8d", "index": 69, "aliyun_index": 12, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Equation (2) states the empirical DRAM dynamic power model we used. We consider its dynamic power to be composed of precharge power, row buffer activation power, read power, and write power. The precharge power is calculated as the per-operation energy ($E_{pre}$) times the number of precharge operations ($c_{pre}$) divided by the execution time. Read, write, and activation powers are calculated similarly.  \n\n", "text": "Equation (2) states the empirical DRAM dynamic power model we used. We consider its dynamic power to be composed of precharge power, row buffer activation power, read power, and write power. The precharge power is calculated as the per-operation energy ($E_{pre}$) times the number of precharge operations ($c_{pre}$) divided by the execution time. Read, write, and activation powers are calculated similarly.\n", "alignment": "left", "unique_id": "82fb98230435a0d884aac05009beec8d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Equation (2) states the empirical DRAM dynamic power model we used. We consider its dynamic power to be composed of precharge power, row buffer activation power, read power, and write power. The precharge power is calculated as the per-operation energy ($E_{pre}$) times the number of precharge operations ($c_{pre}$) divided by the execution time. Read, write, and activation powers are calculated similarly."}], "lineHeight": 0}}, "target": {"markdown": "公式 (2) 给出了我们所采用的 DRAM 动态功耗经验模型。我们将其动态功耗视为由预充电功耗、行缓冲激活功耗、读功耗和写功耗组成。预充电功耗通过单次操作能耗（$E_{pre}$）乘以预充电操作次数（$c_{pre}$）再除以执行时间来计算。读、写和激活功耗的计算方法与此类似。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "a9ebfac25a2202e4c03b01d7b210f5fd", "index": 70, "aliyun_index": 13, "page_num": 3, "type": "formula", "sub_type": "none", "markdown": "$$ P_{D R A M}=\\frac{E_{p r e}*c_{p r e}+E_{a c t}*c_{a c t}+E_{w r}*c_{w r}+E_{r d}*c_{r d}}{E x e c u t i o n T i m e} $$  \n\n", "text": "$$ P_{D R A M}=\\frac{E_{p r e}*c_{p r e}+E_{a c t}*c_{a c t}+E_{w r}*c_{w r}+E_{r d}*c_{r d}}{E x e c u t i o n T i m e} $$\n", "alignment": "left", "unique_id": "a9ebfac25a2202e4c03b01d7b210f5fd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ P_{D R A M}=\\frac{E_{p r e}*c_{p r e}+E_{a c t}*c_{a c t}+E_{w r}*c_{w r}+E_{r d}*c_{r d}}{E x e c u t i o n T i m e} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ P_{D R A M}=\\frac{E_{p r e}*c_{p r e}+E_{a c t}*c_{a c t}+E_{w r}*c_{w r}+E_{r d}*c_{r d}}{E x e c u t i o n T i m e} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "bb5511242d93a0f2a663b545c83e394f", "index": 71, "aliyun_index": 14, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "(2)  \n\n", "text": "(2)\n", "alignment": "left", "unique_id": "bb5511242d93a0f2a663b545c83e394f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(2)"}], "lineHeight": 0}}, "target": {"markdown": "(2)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "c0b25e3f53f8a44631c3eece2581570e", "index": 72, "aliyun_index": 15, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "The above DRAM power model can be lumped into Equation (1), resulting in a complete linear system with all GPU components' access rates. We treat the access energy for each DRAM operation as an unknown variable. In the next section, we explain the process of solving for the unknowns.  \n\n", "text": "The above DRAM power model can be lumped into Equation (1), resulting in a complete linear system with all GPU components' access rates. We treat the access energy for each DRAM operation as an unknown variable. In the next section, we explain the process of solving for the unknowns.\n", "alignment": "left", "unique_id": "c0b25e3f53f8a44631c3eece2581570e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The above DRAM power model can be lumped into Equation (1), resulting in a complete linear system with all GPU components' access rates. We treat the access energy for each DRAM operation as an unknown variable. In the next section, we explain the process of solving for the unknowns."}], "lineHeight": 0}}, "target": {"markdown": "上述 DRAM 功耗模型可以合并到公式 (1) 中，从而构成一个包含所有 GPU 组件访问速率的完整线性方程组。我们将每次 DRAM 操作的访问能耗视为未知变量。在下一节中，我们将介绍求解这些未知变量的过程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "fe71f085ad5ae530d7977e8a0a9b33ab", "index": 73, "aliyun_index": 16, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "## 3. MICROBENCHMARKING THE UNCER- TAINITIES\n", "text": "3. MICROBENCHMARKING THE UNCER- TAINITIES\n", "alignment": "left", "unique_id": "fe71f085ad5ae530d7977e8a0a9b33ab", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3. MICROBENCHMARKING THE UNCER-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "TAINITIES"}], "lineHeight": -65}}, "target": {"markdown": "## 3. 微基准测试不确定性\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "3004e17d6439cf961fec71c2228b41ad", "index": 74, "aliyun_index": 17, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "Microbenchmarking plays a critical role in the refinement and validation of our initial power model. We rely on microbenchmarks to address the power modeling uncertainties that arise for various reasons, such as misguided assumptions about undocumented features. The microbenchmarks also help us isolate the power consumption of key components in the GPU so that we can validate and refine the power model's component-level power breakdown. They also help us achieve good test coverage of the various components in the processor. Real benchmarks do not stress all aspects of the processor microarchitecture as the microbenchmarks.  \n\n", "text": "Microbenchmarking plays a critical role in the refinement and validation of our initial power model. We rely on microbenchmarks to address the power modeling uncertainties that arise for various reasons, such as misguided assumptions about undocumented features. The microbenchmarks also help us isolate the power consumption of key components in the GPU so that we can validate and refine the power model's component-level power breakdown. They also help us achieve good test coverage of the various components in the processor. Real benchmarks do not stress all aspects of the processor microarchitecture as the microbenchmarks.\n", "alignment": "left", "unique_id": "3004e17d6439cf961fec71c2228b41ad", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Microbenchmarking plays a critical role in the refinement and validation of our initial power model. We rely on microbenchmarks to address the power modeling uncertainties that arise for various reasons, such as misguided assumptions about undocumented features. The microbenchmarks also help us isolate the power consumption of key components in the GPU so that we can validate and refine the power model's component-level power breakdown. They also help us achieve good test coverage of the various components in the processor. Real benchmarks do not stress all aspects of the processor microarchitecture as the microbenchmarks."}], "lineHeight": 0}}, "target": {"markdown": "微基准测试在初始功耗模型的细化和验证中起着关键作用。我们依靠微基准测试来解决因各种原因（例如对未公开特性的错误假设）而产生的功耗建模不确定性问题。微基准测试还有助于我们分离 GPU 中各关键组件的功耗，从而能够验证并细化功耗模型在组件级别的功耗分解。它们同样有助于我们对处理器中各组件实现良好的测试覆盖率。与微基准测试不同，实际基准测试无法对处理器微架构的各个方面施加充分的压力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "7ff9c39437d3ae50c2670275aeb071c8", "index": 75, "aliyun_index": 18, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### 3.1 LSE Problem Formation\n", "text": "3.1 LSE Problem Formation\n", "alignment": "left", "unique_id": "7ff9c39437d3ae50c2670275aeb071c8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.1 LSE Problem Formation"}], "lineHeight": 0}}, "target": {"markdown": "### 3.1 最小二乘问题构建\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "49729de2c0778b9aec6ac31ef4128a88", "index": 76, "aliyun_index": 19, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "A major source of inaccuracies in the initial power model arises from uncertainties due to undocumented design decisions in the target architecture. Undocumented aspects of the GPUs we model include unknown sizes or configurations of components. Our first step is to ascertain these inaccuracies.  \n\n", "text": "A major source of inaccuracies in the initial power model arises from uncertainties due to undocumented design decisions in the target architecture. Undocumented aspects of the GPUs we model include unknown sizes or configurations of components. Our first step is to ascertain these inaccuracies.\n", "alignment": "left", "unique_id": "49729de2c0778b9aec6ac31ef4128a88", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A major source of inaccuracies in the initial power model arises from uncertainties due to undocumented design decisions in the target architecture. Undocumented aspects of the GPUs we model include unknown sizes or configurations of components. Our first step is to ascertain these inaccuracies."}], "lineHeight": 0}}, "target": {"markdown": "初始功耗模型误差的主要来源，在于目标架构中未公开的设计决策所导致的不确定性。我们所建模的 GPU 中未公开的方面包括未知的组件尺寸或配置。我们的首要任务是确定这些误差。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "55b85de7f2dc70d0449b5333dc07ea64", "index": 77, "aliyun_index": 20, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "We use an iterative process to continuously refine the power model based on inaccuracies that we observe between the power model and the actual hardware power measurements. As Equation (3) shows, we model the dynamic power consumption as a linear combination of access rate $\\alpha_i$ (access counts divided by time) of each microarchitectural component multiplied by its peak power $P_{max_i}$. We consider the modeling inaccuracy for a particular microarchitectural component $i$ as an unknown variable $x_i$ in Equation (4).  \n\n", "text": "We use an iterative process to continuously refine the power model based on inaccuracies that we observe between the power model and the actual hardware power measurements. As Equation (3) shows, we model the dynamic power consumption as a linear combination of access rate $\\alpha_i$ (access counts divided by time) of each microarchitectural component multiplied by its peak power $P_{max_i}$. We consider the modeling inaccuracy for a particular microarchitectural component $i$ as an unknown variable $x_i$ in Equation (4).\n", "alignment": "left", "unique_id": "55b85de7f2dc70d0449b5333dc07ea64", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use an iterative process to continuously refine the power model based on inaccuracies that we observe between the power model and the actual hardware power measurements. As Equation (3) shows, we model the dynamic power consumption as a linear combination of access rate $\\alpha_i$ (access counts divided by time) of each microarchitectural component multiplied by its peak power $P_{max_i}$. We consider the modeling inaccuracy for a particular microarchitectural component $i$ as an unknown variable $x_i$ in Equation (4)."}], "lineHeight": 0}}, "target": {"markdown": "我们使用迭代过程，基于功耗模型与实际硬件功耗测量之间观察到的误差，持续细化功耗模型。如公式 (3) 所示，我们将动态功耗建模为每个微架构组件的访问速率 $\\alpha_i$（访问次数除以时间）乘以其峰值功耗 $P_{max_i}$ 的线性组合。我们将特定微架构组件 $i$ 的建模误差视为公式 (4) 中的未知变量 $x_i$。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "9db5acc751b1bafe4951b3a59ce4a8e1", "index": 78, "aliyun_index": 0, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "```c\nvoid kernel (unsigned *A, unsigned *C){\n    unsigned tid, offset, sum=0;\n    tid = get_tid(); // thread id\n    offset = (tid%M + tid/K)*OFFSET;\n    sum += A[offset]; // manually unroll\n    sum += A[offset];\n    ...//operator(+=) creates dependency\n}\n```\n", "text": "void kernel (unsigned *A, unsigned *C){\n    unsigned tid, offset, sum=0;\n    tid = get_tid(); // thread id\n    offset = (tid%M + tid/K)*OFFSET;\n    sum += A[offset]; // manually unroll\n    sum += A[offset];\n    ...//operator(+=) creates dependency\n}\n", "alignment": "left", "unique_id": "9db5acc751b1bafe4951b3a59ce4a8e1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "void kernel (unsigned *A, unsigned *C){"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    unsigned tid, offset, sum=0;"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    tid = get_tid(); // thread id"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    offset = (tid%M + tid/K)*OFFSET;"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    sum += A[offset]; // manually unroll"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    sum += A[offset];"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    ...//operator(+=) creates dependency"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "}"}], "lineHeight": -180}}, "target": {"markdown": "```c\nvoid kernel (unsigned *A, unsigned *C){\n    unsigned tid, offset, sum=0;\n    tid = get_tid(); // 线程 id\n    offset = (tid%M + tid/K)*OFFSET;\n    sum += A[offset]; // 手动展开\n    sum += A[offset];\n    ...//运算符 (+=) 会产生依赖关系\n} \n```", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "3a868efbaca416aea3f616eaec916441", "index": 79, "aliyun_index": 1, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 5: A generic microbenchmark stressing the L1 cache.  \n\n", "text": "Figure 5: A generic microbenchmark stressing the L1 cache.\n", "alignment": "left", "unique_id": "3a868efbaca416aea3f616eaec916441", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5: A generic microbenchmark stressing the L1 cache."}], "lineHeight": 0}}, "target": {"markdown": "图 5：用于对 L1 缓存施加压力的通用微基准测试。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "28030a531fc65a20ae1c134d89dd4ca5", "index": 80, "aliyun_index": 2, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Thus, if there are $N$ access rates for the different microarchitectural components, each microbenchmark will yield a microarchitectural component access-rate vector that constitutes one linear equation. With an arbitrary number of microbenchmarks, say $M$, this will result in a $M \\times N$ linear estimation problem, as shown in Equation (5). With a sufficiently large number of equations (i.e., microbenchmarks) and hardware power measurements ($P_M$), we can effectively solve the modeling inaccuracies using the least-squares estimation (LSE).  \n\n", "text": "Thus, if there are $N$ access rates for the different microarchitectural components, each microbenchmark will yield a microarchitectural component access-rate vector that constitutes one linear equation. With an arbitrary number of microbenchmarks, say $M$, this will result in a $M \\times N$ linear estimation problem, as shown in Equation (5). With a sufficiently large number of equations (i.e., microbenchmarks) and hardware power measurements ($P_M$), we can effectively solve the modeling inaccuracies using the least-squares estimation (LSE).\n", "alignment": "left", "unique_id": "28030a531fc65a20ae1c134d89dd4ca5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Thus, if there are $N$ access rates for the different microarchitectural components, each microbenchmark will yield a microarchitectural component access-rate vector that constitutes one linear equation. With an arbitrary number of microbenchmarks, say $M$, this will result in a $M \\times N$ linear estimation problem, as shown in Equation (5). With a sufficiently large number of equations (i.e., microbenchmarks) and hardware power measurements ($P_M$), we can effectively solve the modeling inaccuracies using the least-squares estimation (LSE)."}], "lineHeight": 0}}, "target": {"markdown": "因此，如果不同微架构组件存在 $N$ 个访问速率，那么每个微基准测试将产生一个微架构组件访问速率向量，构成一个线性方程。通过任意数量的微基准测试（例如 $M$ 个），这将构成一个 $M \\times N$ 的线性估计问题，如公式 (5) 所示。在拥有足够数量的方程（即微基准测试）和硬件功耗测量值（$P_M$）的情况下，我们可以使用最小二乘估计（LSE）有效地求解这些建模误差。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "bc3c5a14dd3ae0dec87661966b78df9d", "index": 81, "aliyun_index": 3, "page_num": 4, "type": "formula", "sub_type": "none", "markdown": "$$ P_{d y n a m i c}\\quad=\\quad\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}}) $$  \n\n", "text": "$$ P_{d y n a m i c}\\quad=\\quad\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}}) $$\n", "alignment": "left", "unique_id": "bc3c5a14dd3ae0dec87661966b78df9d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ P_{d y n a m i c}\\quad=\\quad\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}}) $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ P_{d y n a m i c}\\quad=\\quad\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}}) $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "90b8d4ff6e5d75a04960473a820197e4", "index": 82, "aliyun_index": 4, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "(3)  \n\n", "text": "(3)\n", "alignment": "left", "unique_id": "90b8d4ff6e5d75a04960473a820197e4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(3)"}], "lineHeight": 0}}, "target": {"markdown": "(3)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "03e65fcc01d3cd379ff6deeba9d5a5bb", "index": 83, "aliyun_index": 5, "page_num": 4, "type": "formula", "sub_type": "none", "markdown": "$$ P_{m a x_{i}}\\quad=\\quad P_{m o d e l e d\\_{m} a x_{i}}*x_{i} $$  \n\n", "text": "$$ P_{m a x_{i}}\\quad=\\quad P_{m o d e l e d\\_{m} a x_{i}}*x_{i} $$\n", "alignment": "left", "unique_id": "03e65fcc01d3cd379ff6deeba9d5a5bb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ P_{m a x_{i}}\\quad=\\quad P_{m o d e l e d\\_{m} a x_{i}}*x_{i} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ P_{m a x_{i}}\\quad=\\quad P_{m o d e l e d\\_{m} a x_{i}}*x_{i} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "466f3b5b48ad9b7b73783a952619f3e9", "index": 84, "aliyun_index": 6, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "(4)  \n\n", "text": "(4)\n", "alignment": "left", "unique_id": "466f3b5b48ad9b7b73783a952619f3e9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(4)"}], "lineHeight": 0}}, "target": {"markdown": "(4)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "1f360eb715a237199f67ccc90496392f", "index": 85, "aliyun_index": 7, "page_num": 4, "type": "formula", "sub_type": "none", "markdown": "$$ \\mathbf{A}_{M\\times N}\\times\\mathbf{x}_{N\\times1}=\\mathbf{P}_{M\\times1} $$  \n\n", "text": "$$ \\mathbf{A}_{M\\times N}\\times\\mathbf{x}_{N\\times1}=\\mathbf{P}_{M\\times1} $$\n", "alignment": "left", "unique_id": "1f360eb715a237199f67ccc90496392f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ \\mathbf{A}_{M\\times N}\\times\\mathbf{x}_{N\\times1}=\\mathbf{P}_{M\\times1} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ \\mathbf{A}_{M\\times N}\\times\\mathbf{x}_{N\\times1}=\\mathbf{P}_{M\\times1} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "7da59e9cbc5474874021be405f5b5ff2", "index": 86, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "(5)  \n\n", "text": "(5)\n", "alignment": "left", "unique_id": "7da59e9cbc5474874021be405f5b5ff2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(5)"}], "lineHeight": 0}}, "target": {"markdown": "(5)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "fa4b8f2a0b9e54116790d3efabfba664", "index": 87, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "We iteratively refine the power model on the basis of the sources of the various inaccuracies that LSE identifies. For instance, in our infrastructure (i.e., McPAT) the power estimation for certain components is biased toward CPU implementations. We narrow the resulting inaccuracy gap for the GPU power model by fixing our initial assumptions about the implementation and then applying the scaling factors that are obtained from LSE.  \n\n", "text": "We iteratively refine the power model on the basis of the sources of the various inaccuracies that LSE identifies. For instance, in our infrastructure (i.e., McPAT) the power estimation for certain components is biased toward CPU implementations. We narrow the resulting inaccuracy gap for the GPU power model by fixing our initial assumptions about the implementation and then applying the scaling factors that are obtained from LSE.\n", "alignment": "left", "unique_id": "fa4b8f2a0b9e54116790d3efabfba664", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We iteratively refine the power model on the basis of the sources of the various inaccuracies that LSE identifies. For instance, in our infrastructure (i.e., McPAT) the power estimation for certain components is biased toward CPU implementations. We narrow the resulting inaccuracy gap for the GPU power model by fixing our initial assumptions about the implementation and then applying the scaling factors that are obtained from LSE."}], "lineHeight": 0}}, "target": {"markdown": "我们依据 LSE 所识别的各种误差来源，对功耗模型进行迭代细化。例如，在我们的基础设施（即 McPAT）中，某些组件的功耗估计偏向于 CPU 实现。我们通过修正关于该实现的初始假设，并应用从 LSE 获得的缩放因子，来缩小由此产生的 GPU 功耗模型误差差距。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 87}, {"source": {"block_id": "6a5a2db77b0aa7ff3474794a23307088", "index": 88, "aliyun_index": 10, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "### 3.2 Microbenchmarking Design Methodology\n", "text": "3.2 Microbenchmarking Design Methodology\n", "alignment": "left", "unique_id": "6a5a2db77b0aa7ff3474794a23307088", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3.2 Microbenchmarking Design Methodology"}], "lineHeight": 0}}, "target": {"markdown": "### 3.2 微基准测试设计方法\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "45d46d9aa25a2dac0ac06af7429ec3be", "index": 89, "aliyun_index": 11, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "To aid the LSE solving process, we use a systematic microbenchmarking methodology. We describe the three important microbenchmark characteristics that we identified as requirements. Then we show that our microbenchmarks satisfy these requirements.  \n\n", "text": "To aid the LSE solving process, we use a systematic microbenchmarking methodology. We describe the three important microbenchmark characteristics that we identified as requirements. Then we show that our microbenchmarks satisfy these requirements.\n", "alignment": "left", "unique_id": "45d46d9aa25a2dac0ac06af7429ec3be", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To aid the LSE solving process, we use a systematic microbenchmarking methodology. We describe the three important microbenchmark characteristics that we identified as requirements. Then we show that our microbenchmarks satisfy these requirements."}], "lineHeight": 0}}, "target": {"markdown": "为辅助 LSE 的求解过程，我们采用了系统化的微基准测试方法。我们将描述我们所确定的三个重要的微基准测试特性作为必备条件，然后展示我们的微基准测试能够满足这些要求。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "e6cdcb63f620216df5cf14df722d7370", "index": 90, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Component Stress** To solve the LSE problem formed by all microbenchmarks effectively, the performance counter vector of each microbenchmark should have as low a correlation as possible with the others [16]. We achieve this by designing some microbenchmarks to stress individual microarchitectural components. For example, we limit the number of variables in the execution unit stressing microbenchmark so that all necessary values reside in the register files with minimal access to caches or DRAM. Similarly, when designing L2 cache microbenchmarks, we disable the L1 cache both in the simulator and hardware for power isolation. We follow a similarly strict design methodology for all of the other microbenchmarks. This step is also important for enabling component-level model validation (discussed in Section 4).  \n\n", "text": "**Component Stress** To solve the LSE problem formed by all microbenchmarks effectively, the performance counter vector of each microbenchmark should have as low a correlation as possible with the others [16]. We achieve this by designing some microbenchmarks to stress individual microarchitectural components. For example, we limit the number of variables in the execution unit stressing microbenchmark so that all necessary values reside in the register files with minimal access to caches or DRAM. Similarly, when designing L2 cache microbenchmarks, we disable the L1 cache both in the simulator and hardware for power isolation. We follow a similarly strict design methodology for all of the other microbenchmarks. This step is also important for enabling component-level model validation (discussed in Section 4).\n", "alignment": "left", "unique_id": "e6cdcb63f620216df5cf14df722d7370", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Component Stress** To solve the LSE problem formed by all microbenchmarks effectively, the performance counter vector of each microbenchmark should have as low a correlation as possible with the others [16]. We achieve this by designing some microbenchmarks to stress individual microarchitectural components. For example, we limit the number of variables in the execution unit stressing microbenchmark so that all necessary values reside in the register files with minimal access to caches or DRAM. Similarly, when designing L2 cache microbenchmarks, we disable the L1 cache both in the simulator and hardware for power isolation. We follow a similarly strict design methodology for all of the other microbenchmarks. This step is also important for enabling component-level model validation (discussed in Section 4)."}], "lineHeight": 0}}, "target": {"markdown": "**组件压力测试** 为了有效求解由所有微基准测试构成的 LSE 问题，每个微基准测试的性能计数器向量与其他微基准测试的相关性应尽可能低 [16]。我们通过设计一些针对单个微架构组件施加压力的微基准测试来实现这一点。例如，在面向执行单元施加压力的微基准测试中，我们限制变量数量，使所有必要的值都驻留在寄存器文件中，从而尽可能减少对高速缓存或 DRAM 的访问。同样，在设计 L2 高速缓存微基准测试时，我们会在模拟器和硬件中同时禁用 L1 高速缓存，以实现功耗隔离。对于所有其他微基准测试，我们也遵循同样严格的设计方法。这一步骤对于实现组件级模型验证也至关重要（见第 4 节）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 90}, {"source": {"block_id": "83486ab273efea38aa3c989202d8095c", "index": 91, "aliyun_index": 13, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Access Patterns** It is important to design microbenchmarks to exercise the same microarchitectural component in different ways, because switching activity impacts dynamic power consumption. Thus, we created additional microbenchmarks with different access patterns to create more equations for LSE estimation. For example, cache microbenchmarks exercise different memory spaces, hit ratios, and coalescing patterns, using reads or writes. The kernel shown in Figure 5 is a parametrized microbenchmark de-  \n\n", "text": "**Access Patterns** It is important to design microbenchmarks to exercise the same microarchitectural component in different ways, because switching activity impacts dynamic power consumption. Thus, we created additional microbenchmarks with different access patterns to create more equations for LSE estimation. For example, cache microbenchmarks exercise different memory spaces, hit ratios, and coalescing patterns, using reads or writes. The kernel shown in Figure 5 is a parametrized microbenchmark de-\n", "alignment": "left", "unique_id": "83486ab273efea38aa3c989202d8095c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Access Patterns** It is important to design microbenchmarks to exercise the same microarchitectural component in different ways, because switching activity impacts dynamic power consumption. Thus, we created additional microbenchmarks with different access patterns to create more equations for LSE estimation. For example, cache microbenchmarks exercise different memory spaces, hit ratios, and coalescing patterns, using reads or writes. The kernel shown in Figure 5 is a parametrized microbenchmark de-"}], "lineHeight": 0}}, "target": {"markdown": "**访问模式** 设计微基准测试以不同方式访问相同的微架构组件非常重要，因为开关活动会影响动态功耗。因此，我们创建了具有不同访问模式的额外微基准测试，以便为 LSE 估计生成更多方程。例如，高速缓存微基准测试会使用读或写操作，访问不同的存储空间、命中率以及合并模式。图 5 所示的内核即是一个参数化的微基准测试——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 91}, {"source": {"block_id": "d604a584cd9b312c9357b7d03a8f7651", "index": 92, "aliyun_index": 14, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![d604a584cd9b312c9357b7d03a8f7651.jpeg](figures/d604a584cd9b312c9357b7d03a8f7651_88da54e0.png)  \n\n", "text": "这张图片是一个热力图（heatmap），标题为 “Microbenchmarks”，横轴和纵轴也都标注为 “Microbenchmarks”。图中颜色从深红到浅黄/白色，表示某种度量值的大小（通常越亮/越白表示值越大或相似度越高）。对角线上有几个明显的浅色方块，表明某些微基准测试与自身比较时具有最高值（可能是自相关、执行时间比例、性能相似性等）。\n\n由于图像中没有提供具体的数值、坐标标签、图例说明或数据来源，我们只能基于视觉内容进行结构化描述。以下是提取后的合法 Markdown 格式内容：\n\n---\n\n# Microbenchmarks Heatmap Analysis\n\n## Title\n**Microbenchmarks**\n\n## Axes Labels\n- **X-axis**: Microbenchmarks  \n- **Y-axis**: Microbenchmarks  \n\n> Note: Both axes represent the same set of microbenchmark tests, implying this is a square matrix comparing each benchmark against every other (including itself).\n\n## Visual Structure\n- The plot is a **square heatmap**, suggesting an N×N comparison matrix where N = number of microbenchmarks.\n- Color scale ranges from **dark red** (low value) to **bright yellow/whit chmarks.\n", "alignment": "left", "unique_id": "f4a6f969767f9bd795bca2c96bc33778", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 6: Correlation heat map of all 80 microbenchmarks."}], "lineHeight": 0}}, "target": {"markdown": ">图 6：全部 80 个微基准测试的相关性热图。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 96}, {"source": {"block_id": "121a308ac79958b54e491adaa5706bde", "index": 97, "aliyun_index": 19, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "signed for the L1 cache that can be configured to achieve\ndifferent hit ratios, with different coalescing patterns. The\ncross-thread instruction locality within each thread is highly\namortized by massive multithreading; hence, the hit ratio is\nmostly determined by the interthread locality, which can be\nengineered based on the K, M and OFFSET parameters.  \n\n", "text": "signed for the L1 cache that can be configured to achieve\ndifferent hit ratios, with different coalescing patterns. The\ncross-thread instruction locality within each thread is highly\namortized by massive multithreading; hence, the hit ratio is\nmostly determined by the interthread locality, which can be\nengineered based on the K, M and OFFSET parameters.\n", "alignment": "left", "unique_id": "121a308ac79958b54e491adaa5706bde", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "signed for the L1 cache that can be configured to achieve"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "different hit ratios, with different coalescing patterns. The"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cross-thread instruction locality within each thread is highly"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "amortized by massive multithreading; hence, the hit ratio is"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "mostly determined by the interthread locality, which can be"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "engineered based on the K, M and OFFSET parameters."}], "lineHeight": -153}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "0959cac53399cff2ca1f07a8c2610f68", "index": 98, "aliyun_index": 20, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Test Coverage** Real benchmarks only exercise a small portion of the processor. For example, few benchmarks use the texture or constant caches. To ensure that our refinement and validation tests all components of the processor, we rely on our microbenchmarks to achieve good test coverage. As shown in Table 3, we designed four sets of microbenchmarks. Functional microbenchmarks are designed to exercise executional units such as integer and floating point. Memory microbenchmarks access the various caches and shared memory intensively. DRAM exercises the main memory. In addition, we also create the MIX microbenchmarks that have more complex access patterns such as accessing multiple components simultaneously. These efforts result in 80 unique microbenchmarks.  \n\n", "text": "**Test Coverage** Real benchmarks only exercise a small portion of the processor. For example, few benchmarks use the texture or constant caches. To ensure that our refinement and validation tests all components of the processor, we rely on our microbenchmarks to achieve good test coverage. As shown in Table 3, we designed four sets of microbenchmarks. Functional microbenchmarks are designed to exercise executional units such as integer and floating point. Memory microbenchmarks access the various caches and shared memory intensively. DRAM exercises the main memory. In addition, we also create the MIX microbenchmarks that have more complex access patterns such as accessing multiple components simultaneously. These efforts result in 80 unique microbenchmarks.\n", "alignment": "left", "unique_id": "0959cac53399cff2ca1f07a8c2610f68", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Test Coverage** Real benchmarks only exercise a small portion of the processor. For example, few benchmarks use the texture or constant caches. To ensure that our refinement and validation tests all components of the processor, we rely on our microbenchmarks to achieve good test coverage. As shown in Table 3, we designed four sets of microbenchmarks. Functional microbenchmarks are designed to exercise executional units such as integer and floating point. Memory microbenchmarks access the various caches and shared memory intensively. DRAM exercises the main memory. In addition, we also create the MIX microbenchmarks that have more complex access patterns such as accessing multiple components simultaneously. These efforts result in 80 unique microbenchmarks."}], "lineHeight": 0}}, "target": {"markdown": "**测试覆盖率** 真实基准测试仅能覆盖处理器的一小部分。例如，很少有基准测试会用到纹理高速缓存或常量高速缓存。为确保我们的细化与验证测试能够覆盖处理器的所有组件，我们依靠微基准测试来实现良好的测试覆盖率。如表 3 所示，我们设计了四组微基准测试。功能性微基准测试旨在对执行单元进行压力测试，例如整数与浮点单元。存储微基准测试会密集地访问各类高速缓存与共享内存。DRAM 微基准测试则针对主存储器。此外，我们还创建了 MIX 微基准测试，它们具有更复杂的访问模式，例如同时访问多个组件。这些工作最终产生了 80 个独特的微基准测试。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 98}, {"source": {"block_id": "115c602d681ca4425f18245e39526b4f", "index": 99, "aliyun_index": 21, "page_num": 4, "type": "table", "sub_type": "none", "markdown": "| Name | Exercised Components | Counts | Name | Exercised Components | Counts |\n| --- | --- | --- | --- | --- | --- |\n| Func. | Integer, floating point and special function unit | 11 | Mem. | L1   & L2   & texture  & constant caches, and shared memory | 25 |\n| DRAM | DRAM | 22 | Mix | Mix of functional, DRAM and memory | 22 |\n\n", "text": "| Name|Exercised Components|Counts|Name|Exercised Components|Counts|\n| ---|---|---|---|---|---|\n| Func.|Integer, floating point and special function unit|11|Mem.|L1   & L2   & texture  & constant caches, and shared memory|25|\n| DRAM|DRAM|22|Mix|Mix of functional, DRAM and memory|22|\n", "alignment": "left", "unique_id": "115c602d681ca4425f18245e39526b4f", "edited": false, "extra": {"numCol": 6, "cells": [{"yec": 0, "xec": 0, "ysc": 0, "xsc": 0, "type": "text", "alignment": "left", "cellId": 0, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Name"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Name\n", "alignment": "left", "type": "text", "pageNum": [4], "uniqueId": "6751faae3400b9313aa4fe283eacf983"}], "pageNum": [4]}, {"yec": 0, "xec": 1, "ysc": 0, "xsc": 1, "type": "text", "alignment": "left", "cellId": 1, "layouts": [{"firstLinesChars": 0, "blocks": [{
