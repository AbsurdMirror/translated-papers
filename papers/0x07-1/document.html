eads."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Careful trade-off analysis for this optimization is beyond the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "scope of this paper."}], "lineHeight": -357}}, "target": {"markdown": "DVFS，性能损失分别为 2.5% 和 1.5%。我们还在图 14(b) 中针对基准测试 HRTWL 评估了簇级 DVFS 的收益。在簇级 DVFS 中，我们将空闲 SM 的频率设置为最低的 P-state 点（即 100 MHz 和 0.55 V）。空闲 SM 的漏电流功耗降低至约原来的 10% [2]。簇级 DVFS 实现了 13.6% 的节能，而处理器级 DVFS 仅实现了 6.6%。为了更直观地说明簇级 DVFS 的优势，我们将其与理想的电源门控进行了对比，后者可实现 14% 的能耗降低。簇级 DVFS 方案几乎与理想电源门控的效果相当。然而，设计人员还需考虑多个因素，例如对所有额外开销进行建模。对该优化进行细致的权衡分析超出了本文的范围。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 186}, {"source": {"block_id": "fc692346a15c4e91feb389a5678f936d", "index": 187, "aliyun_index": 14, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "### 5.2 Harnessing Branch Divergence\n", "text": "5.2 Harnessing Branch Divergence\n", "alignment": "left", "unique_id": "fc692346a15c4e91feb389a5678f936d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.2 Harnessing Branch Divergence"}], "lineHeight": 0}}, "target": {"markdown": "### 5.2 利用分支发散\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 187}, {"source": {"block_id": "ca5d57f119a149ef91c7ede335862473", "index": 188, "aliyun_index": 15, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "GPGPU programs suffer from branch divergence [12]. Figure 16 shows the amount of branch-divergence-related lane inactivity. The data is constructed by calculating the fraction of time when none (that is, idle), one to two, or three to four out of 32 total SIMD lanes are active, similar to [12]. For example, benchmark NN has only one or two lanes active during execution. Whenever branch divergence occurs, inactive execution lanes are idle but they still consume clocking and toggling logic dynamic power.  \n\n", "text": "GPGPU programs suffer from branch divergence [12]. Figure 16 shows the amount of branch-divergence-related lane inactivity. The data is constructed by calculating the fraction of time when none (that is, idle), one to two, or three to four out of 32 total SIMD lanes are active, similar to [12]. For example, benchmark NN has only one or two lanes active during execution. Whenever branch divergence occurs, inactive execution lanes are idle but they still consume clocking and toggling logic dynamic power.\n", "alignment": "left", "unique_id": "ca5d57f119a149ef91c7ede335862473", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPGPU programs suffer from branch divergence [12]. Figure 16 shows the amount of branch-divergence-related lane inactivity. The data is constructed by calculating the fraction of time when none (that is, idle), one to two, or three to four out of 32 total SIMD lanes are active, similar to [12]. For example, benchmark NN has only one or two lanes active during execution. Whenever branch divergence occurs, inactive execution lanes are idle but they still consume clocking and toggling logic dynamic power."}], "lineHeight": 0}}, "target": {"markdown": "GPGPU 程序存在分支发散问题 [12]。图 16 展示了与分支发散相关的 lane 失效率。数据是通过计算在 32 个 SIMD lane 中没有（即全部空闲）、一到两个、或三到四个 lane 处于活跃状态的时间比例得到的，类似于 [12] 中的方法。例如，基准测试 NN 在执行过程中仅有一个或两个 lane 处于活跃状态。每当发生分支发散时，处于非活跃状态的执行 lane 会闲置，但仍会消耗时钟和逻辑翻转所产生的动态功耗。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 188}, {"source": {"block_id": "58c7d7459a358c0fc2c8ded7c73c8294", "index": 189, "aliyun_index": 16, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "We propose to minimize the unnecessary toggling dynamic  \n\n", "text": "We propose to minimize the unnecessary toggling dynamic\n", "alignment": "left", "unique_id": "58c7d7459a358c0fc2c8ded7c73c8294", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We propose to minimize the unnecessary toggling dynamic"}], "lineHeight": 0}}, "target": {"markdown": "我们提出通过最小化不必要的翻转动态", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 189}, {"source": {"block_id": "aba4894d9f42425f6d212741b5925e58", "index": 190, "aliyun_index": 0, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![aba4894d9f42425f6d212741b5925e58.jpeg](figures/aba4894d9f42425f6d212741b5925e58_0d4d6293.png)  \n\n", "text": "这张图片是一个堆叠柱状图，展示了不同“活跃车道数”（#Active lanes）区间以及“无发散”（No divergence）和“空闲”（Idle）状态在总时间中所占的分数（Fraction of Time）。每个柱子代表一个时间点或场景，其高度为1.0，表示总时间为单位1。各颜色段从下到上堆叠，分别对应不同的类别。\n\n以下是根据图例和图表内容提取的详细信息：\n\n---\n\n### 图例说明（Legend）\n\n| 颜色/图案             | 标签                     |\n|----------------------|--------------------------|\n| 粉红色（纯色）        | Idle                     |\n| 蓝色斜线填充          | #Active lanes: 1-2       |\n| 橙色（纯色）          | #Active lanes: 3-4       |\n| 绿色交叉网格          | #Active lanes: 5-8       |\n| 红色虚线框            | #Active lanes: 9-16      |\n| 灰色点状填充          | #Active lanes: 17-31     |\n| 深蓝色（纯色）        | No divergence            |\n\n> 注意：图中实际使用的颜色与图例略有差异，例如“#Active lanes: 1-2”在图中是浅紫色斜线，“No divergence”是深蓝色，“Idle”是粉红色等。我们以图中实际视觉呈现为准进行描述。\n\n---\n\n### 图表结构分析\n\n- **Y轴**：`Fraction of Time`，范围从 0.0 到 1.0。\n- **X轴**：未标注具体数值，但有多个垂直柱子，共约18个柱子（从左到右编号为 Column 1 至 Column 18）。\n- 每个柱子由多个彩色段堆叠而成，底部为深蓝色（No divergence），向上依次叠加其他类别，顶部为粉红色（Idle）。\n- 所有柱子总高度均为1.0，表示归一化的时间分配。\n\n---\n\n### 各柱子详细分解（从左至右，Column 1 ~ 18）\n\n我们将按从下到上的顺序列出每个柱子中各部分的近似占比（基于目测估算，保留两位小数）：\n\n#### Column 1:\n- No divergence (深蓝): ~0.10\n- #Active lanes: 5-8 (绿格): ~0.05 → 累计 0.15\n- #Active lanes: 1-2 (紫斜): ~0.05 → 累计 0.20\n- Idle (粉红): ~0.80 → 总计 1.00\n\n#### Column 2:\n- No divergence: ~0.15\n- #Active lanes: 5-8: ~0.05 → 累计 0.20\n- #Active lanes: 1-2: ~0.05 → 累计 0.25\n- Idle: ~0.75 → 总计 1.00\n\n#### Column 3:\n- No divergence: ~0.10\n- #Active lanes: 5-8: ~0.05 → 累计 0.15\n- #Active lanes: 1-2: ~0.10 → 累计 0.25\n- Idle: ~0.75 → 总计 1.00\n\n#### Column 4:\n- No divergence: ~0.15\n- #Active lanes: 5-8: ~0.05 → 累计 0.20\n- #Active lanes: 1-2: ~0.05 → 累计 0.25\n- Idle: ~0.75 → 总计 1.00\n\n#### Column 5:\n- No divergence: ~0.05\n- #Active lanes: 5-8: ~0.15 → 累计 0.20\n- #Active lanes: 1-2: ~0.05 → 累计 0.25\n- Idle: ~0.75 → 总计 1.00\n\n#### Column 6:\n- No divergence: ~0.45\n- #Active lanes: 5-8: ~0.05 → 累计 0.50\n- Idle: ~0.50 → 总计 1.00  \n> 注：此柱无其他中间层，直接由深蓝+绿格+粉红组成。\n\n#### Column 7:\n- No divergence: ~0.50\n- #Active lanes: 5-8: ~0.05 → 累计 0.55\n- Idle: ~0.45 → 总计 1.00\n\n#### Column 8:\n- No divergence: ~0.65\n- #Active lanes: 5-8: ~0.05 → 累计 0.70\n- #Active lanes: 9-16 (红虚框): ~0.05 → 累计 0.75\n- Idle: ~0.25 → 总计 1.00\n\n#### Column 9:\n- No divergence: ~0.70\n- #Active lanes: 5-8: ~0.05 → 累计 0.75\n- #Active lanes: 9-16: ~0.05 → 累计 0.80\n- Idle: ~0.20 → 总计 1.00\n\n#### Column 10:\n- No divergence: ~0.80\n- #Active lanes: 5-8: ~0.05 → 累计 0.85\n- #Active lanes: 9-16: ~0.05 → 累计 0.90\n- Idle: ~0.10 → 总计 1.00\n\n#### Column 11:\n- No divergence: ~0.55\n- #Active lanes: 17-31 (灰点): ~0.20 → 累计 0.75\n- #Active lanes: 9-16: ~0.05 → 累计 0.80\n- #Active lanes: 5-8: ~0.05 → 累计 0.85\n- Idle: ~0.15 → 总计 1.00\n\n#### Column 12:\n- No divergence: ~0.35\n- #Active lanes: 17-31: ~0.25 → 累计 0.60\n- #Active lanes: 9-16: ~0.10 → 累计 0.70\n- #Active lanes: 5-8: ~0.05 → 累计 0.75\n- #Active lanes: 3-4 (橙): ~0.05 → 累计 0.80\n- Idle: ~0.20 → 总计 1.00\n\n#### Column 13:\n- No divergence: ~0.60\n- #Active lanes: 17-31: ~0.20 → 累计 0.80\n- #Active lanes: 9-16: ~0.05 → 累计 0.85\n- #Active lanes: 5-8: ~0.05 → 累计 0.90\n- Idle: ~0.10 → 总计 1.00\n\n#### Column 14:\n- No divergence: ~0.90\n- #Active lanes: 1-2 (紫斜): ~0.05 → 累计 0.95\n- Idle: ~0.05 → 总计 1.00\n\n#### Column 15:\n- No divergence: ~0.75\n- #Active lanes: 1-2: ~0.20 → 累计 0.95\n- Idle: ~0.05 → 总计 1.00\n\n#### Column 16:\n- No divergence: ~0.75\n- #Active lanes: 5-8: ~0.05 → 累计 0.80\n- #Active lanes: 1-2: ~0.15 → 累计 0.95\n- Idle: ~0.05 → 总计 1.00\n\n#### Column 17:\n- No divergence: ~0.05\n- #Active lanes: 1-2: ~0.05 → 累计 0.10\n- Idle: ~0.90 → 总计 1.00  \n> 注：此柱几乎全为 Idle，仅底部极小部分为 No divergence 和 #Active lanes: 1-2。\n\n#### Column 18:\n- No divergence: ~0.75\n- #Active lanes: 5-8: ~0.05 → 累计 0.80\n- #Active lanes: 1-2: ~0.15 → 累计 0.95\n- Idle: ~0.05 → 总计 1.00\n\n---\n\n### 观察总结\n\n1. **“No divergence”** 是多数柱子的主要组成部分，尤其在右侧柱子（如 Col 10, 13, 14, 15, 16, 18）中占比很高（>0.7）。\n2. **“Idle”** 在左侧柱子（Col 1~5）中占主导（~0.75–0.80），但在右侧逐渐减少，仅在 Col 17 中再次升高至 ~0.90。\n3. **“#Active lanes: 5-8”**（绿色网格）在大多数柱子中存在，但比例较小（通常 ≤0.05），除 Col 5、6、7 外。\n4. **“#Active lanes: 1-2”**（紫色斜线）出现在部分柱子中，尤其在 Col 14、15、16、18 中较明显。\n5. **“#Active lanes: 9-16”**（红色虚框）和 **“#Active lanes: 17-31”**（灰色点）仅在中间几列出现（Col 8~13），且比例较低。\n6. **“#Active lanes: 3-4”**（橙色）仅在 Col 12 中出现一次，占比约 0.05。\n7. 整体趋势：随着柱子向右移动，“No divergence” 占比增加，“Idle” 占比减少，表明系统趋于稳定；但在最右端（Col 17）又出现大量空闲，可能表示某种重置或低负载状态。\n\n---\n\n### 数据表格形式（可选整理）\n\n若需结构化数据，可构建如下表格（简化版，仅展示主要成分）：\n\n| Column | No div | Lanes 1-2 | Lanes 5-8 | Lanes 9-16 | Lanes 17-31 | Idle |\n|--------|--------|-----------|-----------|------------|-------------|------|\n| 1      | 0.10   | 0.05      | 0.05      | 0.00       | 0.00        | 0.80 |\n| 2      | 0.15   | 0.05      | 0.05      | 0.00       | 0.00        | 0.75 |\n| ...    | ...    | ...       | ...       | ...        | ...         | ...  |\n| 17     | 0.05   | 0.05      | 0.00      | 0.00       | 0.00        | 0.90 |\n| 18     | 0.75   | 0.15      | 0.05      | 0.00       | 0.00        | 0.05 |\n\n> 注：完整表格需逐列填写，此处仅为示例格式。\n\n---\n\n### 结论\n\n该图反映了在不同时间段或条件下，系统处于“无发散”、“不同活跃车道数区间”及“空闲”状态的时间分布。早期阶段系统多处于空闲，中期开始活跃车道增多并伴随少量高阶车道活动，后期则高度集中于“无发散”状态，最后又回归高空闲——这可能对应于系统启动、运行、稳定、再休眠的过程。\n\n--- \n\n✅ 以上即为对图像的完整信息抽取与Markdown格式化输出。", "alignment": "left", "unique_id": "aba4894d9f42425f6d212741b5925e58", "edited": false, "extra": {}}, "target": {"markdown": "![aba4894d9f42425f6d212741b5925e58.jpeg](figures/aba4894d9f42425f6d212741b5925e58_0d4d6293.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 190}, {"source": {"block_id": "afa2cc33013db597b5e55b2f566113c6", "index": 191, "aliyun_index": 1, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 16: Time distribution of active lanes.  \n\n", "text": "Figure 16: Time distribution of active lanes.\n", "alignment": "left", "unique_id": "afa2cc33013db597b5e55b2f566113c6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 16: Time distribution of active lanes."}], "lineHeight": 0}}, "target": {"markdown": "> 图 16：活跃 lane 的时间分布。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 191}, {"source": {"block_id": "3839c3eb089c74680d4d6a37f953ce5d", "index": 192, "aliyun_index": 2, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "power by applying clock gating to the unused, idle execution lanes. This technique is well-suited to exploit the short durations of branch divergence. We design microbenchmarks with different numbers of active threads to verify that neither card implements clock gating. To the best of our knowledge, there is no published literature that explores power reduction using fine-grained, lane-level clock gating for branch divergence in GPGPU architectures.  \n\n", "text": "power by applying clock gating to the unused, idle execution lanes. This technique is well-suited to exploit the short durations of branch divergence. We design microbenchmarks with different numbers of active threads to verify that neither card implements clock gating. To the best of our knowledge, there is no published literature that explores power reduction using fine-grained, lane-level clock gating for branch divergence in GPGPU architectures.\n", "alignment": "left", "unique_id": "3839c3eb089c74680d4d6a37f953ce5d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "power by applying clock gating to the unused, idle execution lanes. This technique is well-suited to exploit the short durations of branch divergence. We design microbenchmarks with different numbers of active threads to verify that neither card implements clock gating. To the best of our knowledge, there is no published literature that explores power reduction using fine-grained, lane-level clock gating for branch divergence in GPGPU architectures."}], "lineHeight": 0}}, "target": {"markdown": "功耗，方法是对未使用的、处于空闲状态的执行 lane 进行时钟门控。该技术非常适合用于利用分支发散所产生的大量短暂空闲时段。我们设计了具有不同活跃线程数量的微基准测试，以验证两款显卡均未实现时钟门控。据我们所知，目前尚无已发表的文献探讨在 GPGPU 架构中利用细粒度的 lane 级时钟门控来针对分支发散进行功耗优化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 192}, {"source": {"block_id": "efdb6dca61f8cb64f50d1bafe61c12b0", "index": 193, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "We implemented fine-grained clock gating in the power model to ensure that only SIMD lanes with active threads are active. In addition, RF reads/writes and operand collectors are also clock-gated at a fine-grained granularity. It is important to note that clock gating incurs power overhead owing to additional logic in the clock tree. We model these overheads using the approach proposed by Li et al. [21]. We assume an overall pipeline depth of 24 for the GPU architecture. Execution units, operand collectors and the crossbar network are clock gated in each SIMD lane level to prevent unnecessary switching activity, while the register files are gated in the register file bank level. For each of the 32 SIMD lanes and the 24 pipeline stages per lane, fine-grained clock gating requires an additional AND gate (to gate the clock) and an additional flip-flop to store the clock-gating control bit. The control bit ensures that the decision to clock gate a stage is available before the start of the cycle. The GPU maintains active lane masks for all warps, which can be used to determine which lanes should be clock gated.  \n\n", "text": "We implemented fine-grained clock gating in the power model to ensure that only SIMD lanes with active threads are active. In addition, RF reads/writes and operand collectors are also clock-gated at a fine-grained granularity. It is important to note that clock gating incurs power overhead owing to additional logic in the clock tree. We model these overheads using the approach proposed by Li et al. [21]. We assume an overall pipeline depth of 24 for the GPU architecture. Execution units, operand collectors and the crossbar network are clock gated in each SIMD lane level to prevent unnecessary switching activity, while the register files are gated in the register file bank level. For each of the 32 SIMD lanes and the 24 pipeline stages per lane, fine-grained clock gating requires an additional AND gate (to gate the clock) and an additional flip-flop to store the clock-gating control bit. The control bit ensures that the decision to clock gate a stage is available before the start of the cycle. The GPU maintains active lane masks for all warps, which can be used to determine which lanes should be clock gated.\n", "alignment": "left", "unique_id": "efdb6dca61f8cb64f50d1bafe61c12b0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We implemented fine-grained clock gating in the power model to ensure that only SIMD lanes with active threads are active. In addition, RF reads/writes and operand collectors are also clock-gated at a fine-grained granularity. It is important to note that clock gating incurs power overhead owing to additional logic in the clock tree. We model these overheads using the approach proposed by Li et al. [21]. We assume an overall pipeline depth of 24 for the GPU architecture. Execution units, operand collectors and the crossbar network are clock gated in each SIMD lane level to prevent unnecessary switching activity, while the register files are gated in the register file bank level. For each of the 32 SIMD lanes and the 24 pipeline stages per lane, fine-grained clock gating requires an additional AND gate (to gate the clock) and an additional flip-flop to store the clock-gating control bit. The control bit ensures that the decision to clock gate a stage is available before the start of the cycle. The GPU maintains active lane masks for all warps, which can be used to determine which lanes should be clock gated."}], "lineHeight": 0}}, "target": {"markdown": "我们在功耗模型中实现了细粒度时钟门控，以确保只有包含活跃线程的 SIMD lane 处于活跃状态。此外，寄存器文件（RF）的读写以及操作数收集器也以细粒度粒度进行时钟门控。需要指出的是，时钟门控会因时钟树中额外的逻辑而产生功耗开销。我们使用 Li 等人 [21] 提出的方法对这些开销进行建模。我们假设 GPU 架构的整体流水线深度为 24。每个 SIMD lane 级的执行单元、操作数收集器和交叉开关网络都进行时钟门控，以防止不必要的开关活动，而寄存器文件则在寄存器文件组（bank）级进行门控。对于 32 个 SIMD lane 中的每一个以及每个 lane 中的 24 个流水线阶段，细粒度时钟门控需要额外引入一个与门（用于对时钟进行门控）以及一个额外的触发器来存储时钟门控控制位。该控制位确保在周期开始之前即可获得对某一阶段进行时钟门控的决策依据。GPU 为所有 warp 维护活跃 lane 掩码，可用于确定哪些 lane 应当被时钟门控。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 193}, {"source": {"block_id": "f6095a025b778b682b7636606fd4f6c7", "index": 194, "aliyun_index": 4, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "We utilize the 45 nm TSMC technology library to estimate the power consumption of the additional flip-flops and logic gates. By our estimation, lane-level clock gating increases the GPU power consumption by 0.3 W. This power is consumed regardless of the lane-level activity. But as we will see next, this overhead is negligible relative to the net benefits.  \n\n", "text": "We utilize the 45 nm TSMC technology library to estimate the power consumption of the additional flip-flops and logic gates. By our estimation, lane-level clock gating increases the GPU power consumption by 0.3 W. This power is consumed regardless of the lane-level activity. But as we will see next, this overhead is negligible relative to the net benefits.\n", "alignment": "left", "unique_id": "f6095a025b778b682b7636606fd4f6c7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We utilize the 45 nm TSMC technology library to estimate the power consumption of the additional flip-flops and logic gates. By our estimation, lane-level clock gating increases the GPU power consumption by 0.3 W. This power is consumed regardless of the lane-level activity. But as we will see next, this overhead is negligible relative to the net benefits."}], "lineHeight": 0}}, "target": {"markdown": "我们采用 45 nm TSMC 工艺库来估算新增触发器及逻辑门的功耗。根据我们的估算，lane 级时钟门控会使 GPU 功耗增加 0.3 W。无论 lane 级活跃程度如何，该功耗都会产生。但正如后文将看到的，相对于其整体收益而言，这一开销可以忽略不计。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 194}, {"source": {"block_id": "bc6d01ef72f5e70fa5a0b8e36ac9c448", "index": 195, "aliyun_index": 5, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "In our experiment, we found the power saving of idle lane clock gating is proportional to the time of control divergence. Figure 17 shows the dynamic power saving of applying this technique. Note that we only count the dynamic processor (i.e., without leakage and DRAM power). Benchmark NN benefits the most (60.6% savings) from the clock gating, because it has only 1 or 2 lanes active for more than 90% execution time, as shown in Figure 16. Although benchmarks HOTSP and LPS both suffer severely from divergence, they only show 14.4% and 12.6% dynamic power savings, respectively, because they have more active lanes during divergence. Other benchmarks such as KMN, STO and SRAD have little or no divergence behavior, and thus show no improvement. Overall, the fine-grained technique achieves a (geometric) averaged 11.2% dynamic power savings.  \n\n", "text": "In our experiment, we found the power saving of idle lane clock gating is proportional to the time of control divergence. Figure 17 shows the dynamic power saving of applying this technique. Note that we only count the dynamic processor (i.e., without leakage and DRAM power). Benchmark NN benefits the most (60.6% savings) from the clock gating, because it has only 1 or 2 lanes active for more than 90% execution time, as shown in Figure 16. Although benchmarks HOTSP and LPS both suffer severely from divergence, they only show 14.4% and 12.6% dynamic power savings, respectively, because they have more active lanes during divergence. Other benchmarks such as KMN, STO and SRAD have little or no divergence behavior, and thus show no improvement. Overall, the fine-grained technique achieves a (geometric) averaged 11.2% dynamic power savings.\n", "alignment": "left", "unique_id": "bc6d01ef72f5e70fa5a0b8e36ac9c448", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In our experiment, we found the power saving of idle lane clock gating is proportional to the time of control divergence. Figure 17 shows the dynamic power saving of applying this technique. Note that we only count the dynamic processor (i.e., without leakage and DRAM power). Benchmark NN benefits the most (60.6% savings) from the clock gating, because it has only 1 or 2 lanes active for more than 90% execution time, as shown in Figure 16. Although benchmarks HOTSP and LPS both suffer severely from divergence, they only show 14.4% and 12.6% dynamic power savings, respectively, because they have more active lanes during divergence. Other benchmarks such as KMN, STO and SRAD have little or no divergence behavior, and thus show no improvement. Overall, the fine-grained technique achieves a (geometric) averaged 11.2% dynamic power savings."}], "lineHeight": 0}}, "target": {"markdown": "在我们的实验中，我们发现空闲 lane 时钟门控所带来的功耗节省与控制发散的时间成正比。图 17 展示了应用该技术所带来的动态功耗节省。需要注意的是，我们仅统计处理器的动态功耗（即不包含漏电流功耗和 DRAM 功耗）。基准测试 NN 从时钟门控中获益最大（节能 60.6%），这是因为其超过 90% 的执行时间内仅有一到两个 lane 处于活跃状态，如图 16 所示。尽管基准测试 HOTSP 和 LPS 都受到严重的发散影响，但它们的动态功耗节省分别仅为 14.4% 和 12.6%，原因在于在发散期间它们拥有更多的活跃 lane。其他基准测试（如 KMN、STO 和 SRAD）几乎不存在发散行为，因此并未显示出任何改善。总体而言，该细粒度技术实现了（几何平均）11.2% 的动态功耗节省。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 195}, {"source": {"block_id": "482b79e4928e0783ecadc86f2c2d1ac2", "index": 196, "aliyun_index": 6, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 6. RELATED WORK\n", "text": "6. RELATED WORK\n", "alignment": "left", "unique_id": "482b79e4928e0783ecadc86f2c2d1ac2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6. RELATED WORK"}], "lineHeight": 0}}, "target": {"markdown": "## 6. 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 196}, {"source": {"block_id": "8668bb235e16484dd96b3a43e12b0663", "index": 197, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "There have been prior works regarding building a GPGPU\npower model [8, 13, 17, 26, 36, 38]. We compare our model\nagainst these works from the perspective of the power mod-  \n\n", "text": "There have been prior works regarding building a GPGPU\npower model [8, 13, 17, 26, 36, 38]. We compare our model\nagainst these works from the perspective of the power mod-\n", "alignment": "left", "unique_id": "8668bb235e16484dd96b3a43e12b0663", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There have been prior works regarding building a GPGPU"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "power model [8, 13, 17, 26, 36, 38]. We compare our model"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "against these works from the perspective of the power mod-"}], "lineHeight": -77}}, "target": {"markdown": "已有一些关于构建 GPGPU 功耗模型的先前工作 [8, 13, 17, 26, 36, 38]。我们从功耗建模的角度将我们的模型与这些工作进行对比——", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 197}, {"source": {"block_id": "8e1371516259519ac875da5fb138feec", "index": 198, "aliyun_index": 8, "page_num": 10, "type": "figure", "sub_type": "none", "markdown": "![8e1371516259519ac875da5fb138feec.jpeg](figures/8e1371516259519ac875da5fb138feec_93ae6aaa.png)  \n\n", "text": "这张图片是一个柱状图，展示了“Baseline”（基线）和“With clock gating”（带有时钟门控）两种情况下处理器动态功耗的归一化值。以下是该图表内容的 Markdown 格式提取：\n\n---\n\n# 处理器动态功耗对比图\n\n## 图表说明\n\n- **Y轴标签**：Normalized Processor Dynamic Power（归一化处理器动态功耗）\n  - 范围：0.0 到 1.0\n  - 刻度间隔：0.2\n\n- **X轴**：未标注具体类别，但共有 16 组数据对（每组包含两个柱子）\n\n- **图例**：\n  - 🔵 **Baseline**（蓝色柱）\n  - 🟥 **With clock gating**（粉红色柱）\n\n## 数据观察（从左至右共16组）\n\n> 注：由于图像分辨率限制，以下数值为目测估算，保留一位小数。\n\n| 组号 | Baseline (蓝) | With clock gating (粉) |\n|------|---------------|------------------------|\n| 1    | 1.0           | 0.95                   |\n| 2    | 1.0           | 1.0                    |\n| 3    | 1.0           | 0.9                    |\n| 4    | 1.0           | 1.0                    |\n| 5    | 1.0           | 0.9                    |\n| 6    | 1.0           | 0.8                    |\n| 7    | 1.0           | 0.85                   |\n| 8    | 1.0           | 1.0                    |\n| 9    | 1.0           | 1.0                    |\n| 10   | 1.0           | 1.0                    |\n| 11   | 1.0           | 1.0                    |\n| 12   | 1.0           | 0.9                    |\n| 13   | 1.0           | 0.85                   |\n| 14   | 1.0           | 0.85                   |\n| 15   | 1.0           | 1.0                    |\n| 16   | 1.0           | 0.4                    |\n\n## 关键发现\n\n- 所有 “Baseline” 柱的高度均为 **1.0**，表明其作为归一化基准。\n- “With clock gating” 的功耗在大多数组中低于或等于基线，体现时钟门控技术通常能降低动态功耗。\n- 第16组例外：“With clock gating” 功耗显著下降至 **0.4**，可能代表某种极端优化场景或特殊工作负载。\n- 多数组中，“With clock gating” 功耗介于 **0.8–1.0** 之间，平均节省约 5–15% 动态功耗。\n- 少数组（如第2、8、9、10、11、15组）无功耗节省（仍为1.0），可能表示这些场景下时钟门控无效或未启用。\n\n## 结论\n\n时钟门控技术在多数测试场景中有效降低了处理器的动态功耗，但在部分场景中效果不明显甚至无影响。第16组显示出最大节能潜力（达60%），值得进一步分析其工作条件或配置。\n\n---\n\n✅ 此 Markdown 文档完整保留了原始图表的结构、数据趋势与关键洞察，适用于报告、演示或后续数据分析参考。", "alignment": "left", "unique_id": "8e1371516259519ac875da5fb138feec", "edited": false, "extra": {}}, "target": {"markdown": "![8e1371516259519ac875da5fb138feec.jpeg](figures/8e1371516259519ac875da5fb138feec_93ae6aaa.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 198}, {"source": {"block_id": "e2dcd4ef38c0d6a8acbaaa0fc1d98d50", "index": 199, "aliyun_index": 9, "page_num": 10, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 17: Dynamic power saving after clock gating.  \n\n", "text": "Figure 17: Dynamic power saving after clock gating.\n", "alignment": "left", "unique_id": "e2dcd4ef38c0d6a8acbaaa0fc1d98d50", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 17: Dynamic power saving after clock gating."}], "lineHeight": 0}}, "target": {"markdown": "> 图 17：应用时钟门控后的动态功耗节省。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 199}, {"source": {"block_id": "1e24bb70c12b16dcaf7e46bae35158ca", "index": 200, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "eling methodology and the necessary validation effort.  \n\n", "text": "eling methodology and the necessary validation effort.\n", "alignment": "left", "unique_id": "1e24bb70c12b16dcaf7e46bae35158ca", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "eling methodology and the necessary validation effort."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 200}, {"source": {"block_id": "139a36e9557666a5576276091e44720e", "index": 201, "aliyun_index": 11, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Modeling Methodology** Zhang et al. [38] showed that GPU power consumption increases linearly with the program's computation intensity, and they use this to predict the power consumption, similar to [36]. Maruyama et al. [26] use hardware performance counters to predict power. Hong and Kim [13] propose a power and performance prediction model for GPUs that predicts the GPU's execution time and power consumption using kernel and architecture characteristics. These modeling methodologies are good for program-level power prediction, but they lack our framework's *configurability* for modeling the power consumption of different GPU architectures. Moreover, although these previous works can only predict the GPU's average power consumption, our proposed model can provide *cycle-level* power trace of GPU programs, which lets us capture different execution phases within a kernel.  \n\n", "text": "**Modeling Methodology** Zhang et al. [38] showed that GPU power consumption increases linearly with the program's computation intensity, and they use this to predict the power consumption, similar to [36]. Maruyama et al. [26] use hardware performance counters to predict power. Hong and Kim [13] propose a power and performance prediction model for GPUs that predicts the GPU's execution time and power consumption using kernel and architecture characteristics. These modeling methodologies are good for program-level power prediction, but they lack our framework's *configurability* for modeling the power consumption of different GPU architectures. Moreover, although these previous works can only predict the GPU's average power consumption, our proposed model can provide *cycle-level* power trace of GPU programs, which lets us capture different execution phases within a kernel.\n", "alignment": "left", "unique_id": "139a36e9557666a5576276091e44720e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Modeling Methodology** Zhang et al. [38] showed that GPU power consumption increases linearly with the program's computation intensity, and they use this to predict the power consumption, similar to [36]. Maruyama et al. [26] use hardware performance counters to predict power. Hong and Kim [13] propose a power and performance prediction model for GPUs that predicts the GPU's execution time and power consumption using kernel and architecture characteristics. These modeling methodologies are good for program-level power prediction, but they lack our framework's *configurability* for modeling the power consumption of different GPU architectures. Moreover, although these previous works can only predict the GPU's average power consumption, our proposed model can provide *cycle-level* power trace of GPU programs, which lets us capture different execution phases within a kernel."}], "lineHeight": 0}}, "target": {"markdown": "**建模方法** Zhang 等人 [38] 表明 GPU 功耗随程序计算强度呈线性增长，并基于此来预测功耗，方法与 [36] 类似。Maruyama 等人 [26] 利用硬件性能计数器来预测功耗。Hong 和 Kim [13] 提出了一种针对 GPU 的功耗与性能预测模型，该模型利用内核和架构特征来预测 GPU 的执行时间和功耗。这些建模方法非常适合程序级的功耗预测，但它们缺乏我们框架的*可配置性*，无法对不同 GPU 架构的功耗进行建模。此外，尽管这些先前的工作只能预测 GPU 的平均功耗，但我们所提出的模型能够提供 GPU 程序的*周期级*功耗轨迹，这使得我们能够捕捉同一内核中不同的执行阶段。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 201}, {"source": {"block_id": "327104b5cfc8f41d484ea197b50fb276", "index": 202, "aliyun_index": 12, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Validation Effort** Hong and Kim [13] measure the power of the whole system for validation, whereas we isolate and measure the power that is consumed only by the processor. Additionally, by conducting the voltage and frequency scaling experiment mentioned in Section 4, we isolate the constant power component from our measured power to validate the static leakage power and dynamic power separately. We validated the dynamic power with a suite of microbenchmarks that contains 80 kernels that exercise different microarchitectural components. Moreover, with the 2 M/s sampling rate, we measured the power consumption of real benchmarks. The execution time for these benchmarks is typically around several milliseconds. We show the measured traces of real benchmarks and use those traces to validate the runtime power trace of our power model.  \n\n", "text": "**Validation Effort** Hong and Kim [13] measure the power of the whole system for validation, whereas we isolate and measure the power that is consumed only by the processor. Additionally, by conducting the voltage and frequency scaling experiment mentioned in Section 4, we isolate the constant power component from our measured power to validate the static leakage power and dynamic power separately. We validated the dynamic power with a suite of microbenchmarks that contains 80 kernels that exercise different microarchitectural components. Moreover, with the 2 M/s sampling rate, we measured the power consumption of real benchmarks. The execution time for these benchmarks is typically around several milliseconds. We show the measured traces of real benchmarks and use those traces to validate the runtime power trace of our power model.\n", "alignment": "left", "unique_id": "327104b5cfc8f41d484ea197b50fb276", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Validation Effort** Hong and Kim [13] measure the power of the whole system for validation, whereas we isolate and measure the power that is consumed only by the processor. Additionally, by conducting the voltage and frequency scaling experiment mentioned in Section 4, we isolate the constant power component from our measured power to validate the static leakage power and dynamic power separately. We validated the dynamic power with a suite of microbenchmarks that contains 80 kernels that exercise different microarchitectural components. Moreover, with the 2 M/s sampling rate, we measured the power consumption of real benchmarks. The execution time for these benchmarks is typically around several milliseconds. We show the measured traces of real benchmarks and use those traces to validate the runtime power trace of our power model."}], "lineHeight": 0}}, "target": {"markdown": "**验证工作** Hong 和 Kim [13] 对整个系统的功耗进行测量以作为验证，而我们将处理器所消耗的功耗单独隔离出来进行测量。此外，通过开展第 4 节中提到的电压与频率调节实验，我们将测量功耗中的恒定功耗分量分离出来，从而分别对静态漏电流功耗和动态功耗进行验证。我们使用一组包含 80 个内核的微基准测试套件对动态功耗进行了验证，这些内核涵盖了不同的微架构组件。此外，利用 2 M/s 的采样率，我们对实际基准测试的功耗进行了测量。这些基准测试的执行时间通常在数毫秒左右。我们展示了实际基准测试的测量功耗轨迹，并利用这些轨迹来验证我们功耗模型运行时的功耗轨迹。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 202}, {"source": {"block_id": "917145edfa2515fdb4018510ae85e6ec", "index": 203, "aliyun_index": 13, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "Prior work [14,37] leveraged memory/compute phase behavior for CPU energy optimizations. We adopt a similar methodology to conduct phase analysis at the individual SM-level, and identify both global and clustered synchronous behavior across SMs, and use that to demonstrate the benefits of processor-level DVFS. Lee et al. [20] performed the oracle study for processor-level DVFS in GPUs, but they tried to maximize throughput given a power constraint, while we try to minimize the energy consumption. Moreover, we study DVFS opportunity within kernel execution, while their study emphasizes behavior across kernels.  \n\n", "text": "Prior work [14,37] leveraged memory/compute phase behavior for CPU energy optimizations. We adopt a similar methodology to conduct phase analysis at the individual SM-level, and identify both global and clustered synchronous behavior across SMs, and use that to demonstrate the benefits of processor-level DVFS. Lee et al. [20] performed the oracle study for processor-level DVFS in GPUs, but they tried to maximize throughput given a power constraint, while we try to minimize the energy consumption. Moreover, we study DVFS opportunity within kernel execution, while their study emphasizes behavior across kernels.\n", "alignment": "left", "unique_id": "917145edfa2515fdb4018510ae85e6ec", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Prior work [14,37] leveraged memory/compute phase behavior for CPU energy optimizations. We adopt a similar methodology to conduct phase analysis at the individual SM-level, and identify both global and clustered synchronous behavior across SMs, and use that to demonstrate the benefits of processor-level DVFS. Lee et al. [20] performed the oracle study for processor-level DVFS in GPUs, but they tried to maximize throughput given a power constraint, while we try to minimize the energy consumption. Moreover, we study DVFS opportunity within kernel execution, while their study emphasizes behavior across kernels."}], "lineHeight": 0}}, "target": {"markdown": "既有工作 [14,37] 利用内存/计算阶段行为进行 CPU 能耗优化。我们采用类似方法，在单个 SM 级别进行阶段分析，识别 SM 之间的全局同步行为和聚簇同步行为，并据此证明处理器级 DVFS 的优势。Lee 等人 [20] 对 GPU 中的处理器级 DVFS 进行了理想化研究，但他们在给定功耗约束下追求吞吐率最大化，而我们则致力于最小化能耗。此外，我们研究内核执行过程中的 DVFS 机会，而他们的研究重点是不同内核之间的行为。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 203}, {"source": {"block_id": "c995888f72b2de89b4b5af4cea8a1678", "index": 204, "aliyun_index": 14, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The impact of fine-grained clock-gating on power consumption has been studied for CPUs [15] and some SIMD processors [31]. We exploit this technique to solve a GPU-specific problem (i.e., branch divergence).  \n\n", "text": "The impact of fine-grained clock-gating on power consumption has been studied for CPUs [15] and some SIMD processors [31]. We exploit this technique to solve a GPU-specific problem (i.e., branch divergence).\n", "alignment": "left", "unique_id": "c995888f72b2de89b4b5af4cea8a1678", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The impact of fine-grained clock-gating on power consumption has been studied for CPUs [15] and some SIMD processors [31]. We exploit this technique to solve a GPU-specific problem (i.e., branch divergence)."}], "lineHeight": 0}}, "target": {"markdown": "细粒度时钟门控对功耗的影响已在 CPU [15] 和部分 SIMD 处理器 [31] 中得到研究。我们利用该技术来解决一个 GPU 特有的问题（即分支发散）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 204}, {"source": {"block_id": "e788430a2af9a0d915d253f9ce23e881", "index": 205, "aliyun_index": 15, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 7. CONCLUSION\n", "text": "7. CONCLUSION\n", "alignment": "left", "unique_id": "e788430a2af9a0d915d253f9ce23e881", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7. CONCLUSION"}], "lineHeight": 0}}, "target": {"markdown": "## 7. 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 205}, {"source": {"block_id": "5536053501f232a9e8c12ef1f860fc0b", "index": 206, "aliyun_index": 16, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "The community requires a robust GPU power model. We demonstrate a configurable, cycle-level and validated power model for GPGPUs that can be used for architecture and software energy-efficiency studies. The robustness of the  \n\n", "text": "The community requires a robust GPU power model. We demonstrate a configurable, cycle-level and validated power model for GPGPUs that can be used for architecture and software energy-efficiency studies. The robustness of the\n", "alignment": "left", "unique_id": "5536053501f232a9e8c12ef1f860fc0b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The community requires a robust GPU power model. We demonstrate a configurable, cycle-level and validated power model for GPGPUs that can be used for architecture and software energy-efficiency studies. The robustness of the"}], "lineHeight": 0}}, "target": {"markdown": "社区需要一个稳健的 GPU 功耗模型。我们展示了一个可配置的、周期级的且经过验证的 GPGPU 功耗模型，可用于架构和软件的能效研究。该模型的稳健性", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 206}, {"source": {"block_id": "98e157c8b21c127ac6a00dce1130d557", "index": 207, "aliyun_index": 0, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "power model is proven against the measured power of two commercial GPUs using a complete suite of both microbenchmarks and real benchmarks. The power model achieves the averaged absolute error within 9.9% for GTX 480 card, with 13.4% for Quadro FX5600, respectively, for our evaluated benchmark suite from RODINIA and ISPASS. We developed this model on the basis of a strong power-modeling methodology that will enable us to extend the existing power model systematically to support future GPU architectures.  \n\n", "text": "power model is proven against the measured power of two commercial GPUs using a complete suite of both microbenchmarks and real benchmarks. The power model achieves the averaged absolute error within 9.9% for GTX 480 card, with 13.4% for Quadro FX5600, respectively, for our evaluated benchmark suite from RODINIA and ISPASS. We developed this model on the basis of a strong power-modeling methodology that will enable us to extend the existing power model systematically to support future GPU architectures.\n", "alignment": "left", "unique_id": "98e157c8b21c127ac6a00dce1130d557", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "power model is proven against the measured power of two commercial GPUs using a complete suite of both microbenchmarks and real benchmarks. The power model achieves the averaged absolute error within 9.9% for GTX 480 card, with 13.4% for Quadro FX5600, respectively, for our evaluated benchmark suite from RODINIA and ISPASS. We developed this model on the basis of a strong power-modeling methodology that will enable us to extend the existing power model systematically to support future GPU architectures."}], "lineHeight": 0}}, "target": {"markdown": "通过使用涵盖微基准测试和实际基准测试的完整套件，针对两款商用 GPU 的实测功耗进行对比，证明了该功耗模型的稳健性。对于我们从 RODINIA 和 ISPASS 中选取的基准测试套件，该功耗模型在 GTX 480 显卡上达到了 9.9% 以内的平均绝对误差，在 Quadro FX5600 上则为 13.4%。我们基于一种强有力的功耗建模方法开发了该模型，这使我们能够系统性地扩展现有功耗模型，以支持未来的 GPU 架构。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 207}, {"source": {"block_id": "4aa5965eb0f4b34348d5025345ceb246", "index": 208, "aliyun_index": 1, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "Using *GPUWattch*, we show that fine-grained and coarse-grained DVFS are useful for reducing dynamic power consumption in GPGPU workloads, because they exhibit phase behavior. On average, coarse-grained DVFS achieves 13.2% energy savings, while fine-grained DVFS achieves 14.4% energy savings, both with less than 3% performance loss. For kernels with short-lived phases, fine-grained DVFS achieves 7% more energy savings than coarse-grained DVFS. In addition, we explore the opportunity for SM cluster-level DVFS to address the load imbalance problem in some GPGPU workloads. This technique reduces energy consumption further by 7% for benchmark *HRTWL*. Additionally, we evaluated lane gating. By clock gating individual SIMD lanes during branch divergence, we show that in some programs with high branch divergence, such as *NN*, this technique reduces dynamic power consumption by more than 60%.  \n\n", "text": "Using *GPUWattch*, we show that fine-grained and coarse-grained DVFS are useful for reducing dynamic power consumption in GPGPU workloads, because they exhibit phase behavior. On average, coarse-grained DVFS achieves 13.2% energy savings, while fine-grained DVFS achieves 14.4% energy savings, both with less than 3% performance loss. For kernels with short-lived phases, fine-grained DVFS achieves 7% more energy savings than coarse-grained DVFS. In addition, we explore the opportunity for SM cluster-level DVFS to address the load imbalance problem in some GPGPU workloads. This technique reduces energy consumption further by 7% for benchmark *HRTWL*. Additionally, we evaluated lane gating. By clock gating individual SIMD lanes during branch divergence, we show that in some programs with high branch divergence, such as *NN*, this technique reduces dynamic power consumption by more than 60%.\n", "alignment": "left", "unique_id": "4aa5965eb0f4b34348d5025345ceb246", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Using *GPUWattch*, we show that fine-grained and coarse-grained DVFS are useful for reducing dynamic power consumption in GPGPU workloads, because they exhibit phase behavior. On average, coarse-grained DVFS achieves 13.2% energy savings, while fine-grained DVFS achieves 14.4% energy savings, both with less than 3% performance loss. For kernels with short-lived phases, fine-grained DVFS achieves 7% more energy savings than coarse-grained DVFS. In addition, we explore the opportunity for SM cluster-level DVFS to address the load imbalance problem in some GPGPU workloads. This technique reduces energy consumption further by 7% for benchmark *HRTWL*. Additionally, we evaluated lane gating. By clock gating individual SIMD lanes during branch divergence, we show that in some programs with high branch divergence, such as *NN*, this technique reduces dynamic power consumption by more than 60%."}], "lineHeight": 0}}, "target": {"markdown": "利用 *GPUWattch*，我们表明细粒度和粗粒度的 DVFS 对于降低 GPGPU 工作负载中的动态功耗非常有效，因为这些工作负载表现出阶段行为。平均而言，粗粒度 DVFS 可实现 13.2% 的能耗节省，而细粒度 DVFS 可实现 14.4% 的能耗节省，两者所带来的性能损失均不超过 3%。对于具有短生命周期阶段的内核，细粒度 DVFS 比粗粒度 DVFS 多节省 7% 的能耗。此外，我们探讨了 SM 集群级 DVFS 的机会，以解决某些 GPGPU 工作负载中的负载不均衡问题。该技术可对基准测试 *HRTWL* 进一步降低 7% 的能耗。除此之外，我们还对 Lane Gating 进行了评估。通过在分支发散期间对各个 SIMD Lane 进行时钟门控，我们发现对于某些具有高分支发散度的程序（例如 *NN*），该技术可将动态功耗降低 60% 以上。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 208}, {"source": {"block_id": "36081b905d31f9836f4e8f14954cda54", "index": 209, "aliyun_index": 2, "page_num": 11, "type": "title", "sub_type": "none", "markdown": "## 8. ACKNOWLEDGEMENTS\n", "text": "8. ACKNOWLEDGEMENTS\n", "alignment": "left", "unique_id": "36081b905d31f9836f4e8f14954cda54", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8. ACKNOWLEDGEMENTS"}], "lineHeight": 0}}, "target": {"markdown": "## 8. 致谢\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 209}, {"source": {"block_id": "5804b0e63c77c73e73c61d6dd7011cdf", "index": 210, "aliyun_index": 3, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "We are extremely grateful to several people for helping us with this research undertaking, including the reviewers. We thank Steve Keckler and John Edmondson for helpful discussions on the challenges of power modeling of GPUs.  \n\n", "text": "We are extremely grateful to several people for helping us with this research undertaking, including the reviewers. We thank Steve Keckler and John Edmondson for helpful discussions on the challenges of power modeling of GPUs.\n", "alignment": "left", "unique_id": "5804b0e63c77c73e73c61d6dd7011cdf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We are extremely grateful to several people for helping us with this research undertaking, including the reviewers. We thank Steve Keckler and John Edmondson for helpful discussions on the challenges of power modeling of GPUs."}], "lineHeight": 0}}, "target": {"markdown": "我们非常感谢多位人士在本项研究工作中给予的帮助，包括各位审稿人。我们感谢 Steve Keckler 和 John Edmondson 就 GPU 功耗建模所面临的挑战进行了富有助益的讨论。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 210}, {"source": {"block_id": "c5d287de677f5a67550904ee46e4ff1a", "index": 211, "aliyun_index": 4, "page_num": 11, "type": "text", "sub_type": "none", "markdown": "This work is supported by gifts from Intel Corporation and AMD, in addition to the support provided by the National Science Foundation grants CCF-1218474, CCF-0953603 and CNS-1217102. Any opinions, findings, conclusions, or recommendations expressed in this material are those of the authors and do not necessarily reflect the views of the NSF.  \n\n", "text": "This work is supported by gifts from Intel Corporation and AMD, in addition to the support provided by the National Science Foundation grants CCF-1218474, CCF-0953603 and CNS-1217102. Any opinions, findings, conclusions, or recommendations expressed in this material are those of the authors and do not necessarily reflect the views of the NSF.\n", "alignment": "left", "unique_id": "c5d287de677f5a67550904ee46e4ff1a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This work is supported by gifts from Intel Corporation and AMD, in addition to the support provided by the National Science Foundation grants CCF-1218474, CCF-0953603 and CNS-1217102. Any opinions, findings, conclusions, or recommendations expressed in this material are those of the authors and do not necessarily reflect the views of the NSF."}], "lineHeight": 0}}, "target": {     if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);
}
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  setTimeout(() => toastEl.style.display = 'none', 1600);
}
function counts(){
  const c = {translated:0,skipped:0,failed:0,pending:0,edited:0};
  for (const p of DATA.pairs){ if (c[p.target.status]!==undefined) c[p.target.status]++; else c.pending++; }
  return c;
}
function pickMd(p, which){
  if (which==='source') return p.source.markdown||'';
  return (p.target.markdown || p.source.markdown || '');
}
function headingId(blockId){ return 'sec-'+blockId; }
const foldedIds = new Set();
function outlineTree(list){
  const root = [];
  const stack = [];
  (list||[]).forEach(e => {
    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();
    if (!stack.length) root.push(node); else stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root;
}
function tocNodeHtml(node){
  const kids = node.children||[];
  const leaf = kids.length===0;
  const folded = foldedIds.has(node.block_id);
  return `<div class="toc-node lv${node.level}${folded?' folded':''}" data-bid="${esc(node.block_id)}">
    <div class="toc-row">
      <button type="button" class="toc-twist${leaf?' leaf':''}" data-fold="${esc(node.block_id)}" aria-expanded="${leaf? 'true': String(!folded)}">${leaf?'•':'▾'}</button>
      <a href="#${headingId(node.block_id)}" data-bid="${esc(node.block_id)}">${esc(node.title)}</a>
    </div>
    ${leaf?'':`<div class="toc-kids">${kids.map(tocNodeHtml).join('')}</div>`}
  </div>`;
}
function renderToc(){
  const box = document.getElementById('toc');
  const outline = DATA.outline || [];
  if (!outline.length){ box.innerHTML = '<div style="padding:8px 18px;color:#78716c">暂无目录</div>'; return; }
  box.innerHTML = outlineTree(outline).map(tocNodeHtml).join('');
}
function setNavFolded(on){
  document.body.classList.toggle('nav-folded', on);
  try { localStorage.setItem('pat-nav-folded', on ? '1' : '0'); } catch (e) {}
  const btn = document.getElementById('nav-toggle');
  if (btn) btn.title = on ? '展开目录' : '收起目录';
}
function pairRoles(){
  const first = compareFirst==='source' ? 'source' : 'target';
  return [first, first==='source' ? 'target' : 'source'];
}
function isListMd(md){
  const lines = String(md||'').split('\n').map(s => s.trim()).filter(Boolean);
  return lines.length>0 && lines.every(ln => /^[-*•]\s+/.test(ln));
}
function isCaptionType(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  return t==='figure_name' || t==='figure_note' || t==='table_name' || t==='table_note';
}
function isFigureType(p){ return ((p.source && p.source.type) || '')==='figure'; }
function isFencedCode(md){
  const lines = String(md||'').trim().split('\n');
  if (lines.length<2 || !lines[0].trim().startsWith('```')) return false;
  return lines.slice(1).some(ln => ln.trim().startsWith('```'));
}
function isImageOnlyMd(md){
  return String(md||'').replace(/!\[[^\]]*?\]\([^)]*?\)/g,'').replace(/<img\b[^>]*>/gi,'').trim()==='';
}
function isFormulaOnlyMd(md){
  const raw = String(md||'');
  const stripped = raw.replace(/\$\$[\s\S]*?\$\$/g,'').replace(/\\\[[\s\S]*?\\\]/g,'').trim();
  return raw.trim()!=='' && stripped==='';
}
function isSharedVisual(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  if (['figure','formula','equation','math','latex','code','codes'].includes(t)) return true;
  if ((p.target && p.target.status)==='skipped') return true;
  const src = ((p.source && p.source.markdown)||'').trim();
  const tgt = ((p.target && p.target.markdown)||'').trim();
  if (!tgt || src===tgt) return true;
  if (src && isImageOnlyMd(src)) return true;
  if (tgt && isImageOnlyMd(tgt)) return true;
  if (src && isFormulaOnlyMd(src)) return true;
  if (isFencedCode(src) || isFencedCode(tgt)) return true;
  return false;
}
function unitKindClass(p, md){
  if (isFigureType(p)) return ' is-figure';
  if (isCaptionType(p)) return ' is-caption';
  if (isListMd(md)) return ' is-list';
  return '';
}
function captionMd(md){
  return String(md||'').replace(/^\s*>\s?/gm, '').trim();
}
function markCaptionLabel(html){
  return html.replace(
    /(<p>)((?:图|表|Fig\.?|Figure|TABLE|Table|Listing|Listings|代码清单)\s*[0-9IVXLCDM]+[.:：]?\s*)/i,
    '$1<span class="cap-label">$2</span>'
  );
}
function chunkHtml(p, i, which, shared){
  const role = shared ? 'shared-line' : (which==='source' ? 'src-line' : 'tgt-line');
  let md = pickMd(p, which);
  let extra = shared ? ' is-shared' : '';
  if (isCaptionType(p)){
    extra += ' fig-caption';
    md = captionMd(md);
  } else if (isFigureType(p)){
    extra += ' fig-image';
  }
  let inner = mdToHtml(md);
  if (isCaptionType(p)) inner = markCaptionLabel(inner);
  return `<div class="pair-chunk ${role}${extra}" data-pair="${i}">${inner}</div>`;
}
function sharedWhich(){
  return compareFirst==='source' ? 'source' : 'target';
}
function editBtnHtml(i){
  return `<button type="button" class="unit-edit" data-edit="${i}" title="编辑此块">编辑</button>`;
}
function headingLevelOf(md){
  const m = String(md||'').trim().match(/^(#{1,6})\s+/);
  return m ? m[1].length : 2;
}
function stripHeadingMarks(md){
  const line = String(md||'').trim().split('\n')[0] || '';
  return line.replace(/^#{1,6}\s+/, '').trim();
}
function applyHeadingLevel(md, level){
  const lv = Math.max(1, Math.min(6, +level || 2));
  const lines = String(md||'').split('\n');
  const first = (lines[0] || '').replace(/^#{1,6}\s+/, '');
  const rest = lines.slice(1).join('\n');
  return '#'.repeat(lv) + ' ' + first + (rest ? '\n' + rest : '');
}
function rebuildOutline(){
  DATA.outline = DATA.pairs.map((p, idx) => {
    if ((p.source.type || '') !== 'title') return null;
    const src = stripHeadingMarks(p.source.markdown);
    const tgtMd = p.target.markdown || p.source.markdown;
    const tgt = stripHeadingMarks(tgtMd);
    return {
      block_id: p.source.block_id,
      level: Math.max(1, Math.min(4, headingLevelOf(tgtMd || p.source.markdown))),
      title: tgt || src,
      source_title: src,
      pair_index: idx
    };
  }).filter(Boolean);
}
function bindPairHover(root){
  root.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-pair]');
    if (!el) return;
    const id = el.getAttribute('data-pair');
    root.querySelectorAll('[data-pair]').forEach(n => {
      n.classList.toggle('pair-hot', n.getAttribute('data-pair')===id);
    });
  });
  root.addEventListener('mouseleave', () => {
    root.querySelectorAll('.pair-hot').forEach(n => n.classList.remove('pair-hot'));
  });
}
function renderArticle(){
  const list = document.getElementById('list');
  list.className = 'content';
  const wrap = document.createElement('div');
  if (viewMode!=='compare'){
    wrap.className = 'article';
    const which = viewMode==='parse' ? 'source' : 'target';
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p, which));
      return `<div class="pair-unit${kind}"${hid} data-pair="${i}">${editBtnHtml(i)}${chunkHtml(p,i,which)}</div>`;
    }).join('');
  } else if (compareLayout==='side'){
    wrap.className = 'article compare-side';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,'target')) || unitKindClass(p, pickMd(p,'source'));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit side-pair${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  } else {
    // 豆包/沉浸式翻译式：一段原文，紧跟一段译文。相同的图/代码只显示一份。
    wrap.className = 'article compare-stack';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,a)) || unitKindClass(p, pickMd(p,b));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  }
  list.innerHTML = '';
  list.appendChild(wrap);
  bindPairHover(wrap);
}
function render(){
  document.body.classList.toggle('show-edit', showEdit);
  const c = counts();
  document.getElementById('counts').textContent =
    `translated ${c.translated} · skipped ${c.skipped} · failed ${c.failed} · pending ${c.pending} · edited ${c.edited}`;
  document.getElementById('cmp').disabled = viewMode!=='compare';
  document.getElementById('layout').disabled = viewMode!=='compare';
  renderArticle();
}
function fillTypeSelect(current){
  const sel = document.getElementById('edit-type');
  const types = BLOCK_TYPES.slice();
  if (current && types.indexOf(current)<0) types.push(current);
  sel.innerHTML = types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = current || 'text';
}
function editorStateFromForm(){
  return {
    type: document.getElementById('edit-type').value,
    isTitle: document.getElementById('edit-is-title').checked,
    level: +document.getElementById('edit-level').value || 2,
    translate: document.getElementById('edit-translate').checked,
    source: document.getElementById('edit-src').value,
    target: document.getElementById('edit-tgt').value
  };
}
function syncTitleFields(){
  const isTitle = document.getElementById('edit-is-title').checked;
  document.getElementById('edit-level-wrap').hidden = !isTitle;
  if (isTitle) document.getElementById('edit-type').value = 'title';
}
function updateEditorPreview(){
  const st = editorStateFromForm();
  const fake = {source:{type: st.isTitle ? 'title' : st.type}};
  let src = st.source, tgt = st.target;
  if (isCaptionType(fake)){
    src = captionMd(src);
    tgt = captionMd(tgt);
  }
  let srcHtml = mdToHtml(src);
  let tgtHtml = mdToHtml(tgt);
  if (isCaptionType(fake)){
    srcHtml = markCaptionLabel(srcHtml);
    tgtHtml = markCaptionLabel(tgtHtml);
  }
  document.getElementById('edit-src-preview').innerHTML = srcHtml || '<p>（空）</p>';
  document.getElementById('edit-tgt-preview').innerHTML = tgtHtml || '<p>（空）</p>';
}
function openEditor(i){
  const p = DATA.pairs[i];
  if (!p) return;
  editingIndex = i;
  const src = p.source, tgt = p.target;
  const page = (src.page_num==null) ? '-' : (src.page_num + 1);
  document.getElementById('edit-title').textContent = '编辑块 ' + (src.block_id || ('#'+i));
  document.getElementById('edit-meta').textContent =
    `第 ${page} 页 · index ${src.index} · ${esc(tgt.status)}` +
    (tgt.skip_reason ? (' · ' + tgt.skip_reason) : '');
  fillTypeSelect(src.type || 'text');
  const isTitle = (src.type || '') === 'title';
  document.getElementById('edit-is-title').checked = isTitle;
  document.getElementById('edit-level').value = String(headingLevelOf(src.markdown || tgt.markdown));
  document.getElementById('edit-translate').checked = tgt.status !== 'skipped';
  document.getElementById('edit-src').value = src.markdown || '';
  document.getElementById('edit-tgt').value = tgt.markdown || '';
  document.getElementById('edit-propose').hidden = !(corpusRepo() && paperSlug());
  syncTitleFields();
  updateEditorPreview();
  editSnapshot = JSON.stringify(editorStateFromForm());
  document.getElementById('edit-modal').hidden = false;
  document.body.classList.add('modal-open');
  document.getElementById('edit-tgt').focus();
}
function closeEditor(){
  document.getElementById('edit-modal').hidden = true;
  document.body.classList.remove('modal-open');
  editingIndex = -1;
}
function editorDirty(){
  return JSON.stringify(editorStateFromForm()) !== editSnapshot;
}
function requestCloseEditor(){
  if (editorDirty() && !confirm('放弃未保存的修改？')) return;
  closeEditor();
}
function applyEditor(){
  if (editingIndex < 0) return;
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  const prevType = p.source.type || 'text';
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  let srcMd = st.source;
  let tgtMd = st.target;
  if (type === 'title'){
    srcMd = applyHeadingLevel(srcMd, st.level);
    if (String(tgtMd).trim()) tgtMd = applyHeadingLevel(tgtMd, st.level);
  }
  const srcChanged = srcMd !== (p.source.markdown || '');
  const tgtChanged = tgtMd !== (p.target.markdown || '');
  p.source.type = type;
  p.source.markdown = srcMd;
  if (srcChanged || type !== prevType) p.source.edited = true;
  p.target.markdown = tgtMd;
  if (!st.translate){
    p.target.status = 'skipped';
    if (!p.target.skip_reason) p.target.skip_reason = 'user';
  } else {
    if (p.target.status === 'skipped'){
      p.target.skip_reason = null;
      p.target.skip_kind = null;
      p.target.status = tgtMd.trim() ? (tgtChanged ? 'edited' : 'translated') : 'pending';
    }
    if (tgtChanged){
      p.target.edited = true;
      p.target.status = 'edited';
    }
  }
  rebuildOutline();
  closeEditor();
  const y = window.scrollY;
  render();
  renderToc();
  window.scrollTo(0, y);
  showToast('已改内存中的文档，请下载 JSON/HTML 保存');
}
function corpusRepo(){ return (DATA.corpus_repo || BOOT.corpus_repo || '').trim(); }
function paperSlug(){ return (DATA.paper_slug || BOOT.paper_slug || '').trim(); }
function patchFromEditor(){
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  const source = { markdown: st.source, type: type };
  const target = { markdown: st.target };
  const patch = {
    schema: 'pdf-agent-edit/v1',
    paper: paperSlug(),
    block_id: p.source.block_id,
    pair_index: editingIndex,
    action: st.translate ? 'replace' : 'skip',
    source: source,
    target: target,
    translate: st.translate,
    heading_level: st.isTitle ? st.level : null,
    before: {
      source: { markdown: p.source.markdown || '' },
      target: { markdown: p.target.markdown || '' }
    }
  };
  return patch;
}
function proposeEditor(){
  const repo = corpusRepo();
  const slug = paperSlug();
  if (!repo || !slug){
    showToast('未绑定语料仓，请下载 JSON 或手开 Issue');
    return;
  }
  const patch = patchFromEditor();
  const title = '[edit] ' + slug + ' ' + patch.block_id;
  const yaml = [
    '---',
    'schema: pdf-agent-edit/v1',
    'paper: ' + slug,
    'block_id: ' + patch.block_id,
    'pair_index: ' + String(patch.pair_index),
    'action: ' + patch.action,
    '---',
    '',
    '```json',
    JSON.stringify(patch, null, 2),
    '```',
    ''
  ].join('\n');
  const url = 'https://github.com/' + repo + '/issues/new?' + new URLSearchParams({
    title: title,
    body: yaml,
    labels: 'edit'
  }).toString();
  if (url.length > 7000){
    download((slug + '-' + patch.block_id + '.edit.json'),
      new Blob([JSON.stringify(patch, null, 2)], {type:'application/json'}));
    showToast('补丁太长，已下载 JSON，请新建 Issue 并粘贴');
    return;
  }
  window.open(url, '_blank', 'noopener');
}
document.getElementById('list').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-edit]');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  openEditor(+btn.getAttribute('data-edit'));
});
document.getElementById('toc').addEventListener('click', ev => {
  const twist = ev.target.closest('[data-fold]');
  if (twist && !twist.classList.contains('leaf')){
    ev.preventDefault();
    const id = twist.getAttribute('data-fold');
    if (foldedIds.has(id)) foldedIds.delete(id); else foldedIds.add(id);
    const node = twist.closest('.toc-node');
    if (node){
      node.classList.toggle('folded', foldedIds.has(id));
      twist.setAttribute('aria-expanded', String(!foldedIds.has(id)));
    }
    return;
  }
  const a = ev.target.closest('a');
  if (!a) return;
  ev.preventDefault();
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.toc a').forEach(x => x.classList.toggle('active', x===a));
});
document.getElementById('nav-toggle').addEventListener('click', () => {
  setNavFolded(!document.body.classList.contains('nav-folded'));
});
document.getElementById('nav-reopen').addEventListener('click', () => setNavFolded(false));
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
document.getElementById('mode').addEventListener('change', e => { viewMode = e.target.value; render(); });
document.getElementById('cmp').addEventListener('change', e => { compareFirst = e.target.value; render(); });
document.getElementById('layout').addEventListener('change', e => { compareLayout = e.target.value; render(); });
document.getElementById('show-edit').addEventListener('change', e => {
  showEdit = e.target.checked;
  document.body.classList.toggle('show-edit', showEdit);
});
['edit-src','edit-tgt','edit-type','edit-level','edit-is-title','edit-translate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditorPreview);
  document.getElementById(id).addEventListener('change', updateEditorPreview);
});
document.getElementById('edit-type').addEventListener('change', () => {
  document.getElementById('edit-is-title').checked = document.getElementById('edit-type').value === 'title';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-is-title').addEventListener('change', () => {
  if (document.getElementById('edit-is-title').checked) document.getElementById('edit-type').value = 'title';
  else if (document.getElementById('edit-type').value === 'title') document.getElementById('edit-type').value = 'text';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-save').addEventListener('click', applyEditor);
document.getElementById('edit-propose').addEventListener('click', proposeEditor);
document.getElementById('edit-cancel').addEventListener('click', requestCloseEditor);
document.getElementById('edit-close').addEventListener('click', requestCloseEditor);
document.getElementById('edit-backdrop').addEventListener('click', requestCloseEditor);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('edit-modal').hidden) return;
  ev.preventDefault();
  requestCloseEditor();
});
document.getElementById('dl-json').addEventListener('click', () => {
  download((DATA.source_pdf_name||'document')+'.translated.json',
    new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'}));
});
document.getElementById('dl-html').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  const script = clone.querySelector('#doc-data');
  if (script) script.textContent = JSON.stringify(DATA);
  download((DATA.source_pdf_name||'document')+'.html',

(function initPdfLink(){

  if (!a) return;
  if (BOOT.has_source_pdf){
    a.hidden = false;
    a.setAttribute('href', BOOT.source_pdf_href || 'source.pdf');

try { if (localStorage.getItem('pat-nav-folded')==='1') setNavFolded(true); } catch (e) {}
renderToc();
render();
