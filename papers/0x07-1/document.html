jay Janapa Reddi$^{1}$"}], "lineHeight": 0}}, "target": {"markdown": "Jingwen Leng$^{1}$、Tayler Hetherington$^{2}$、Ahmed ElTantawy$^{2}$、Syed Gilani$^{3}$、Nam Sung Kim$^{3}$、Tor M. Aamodt$^{2}$、Vijay Janapa Reddi$^{1}$", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 1}, {"source": {"block_id": "ce5e52de36ebf7507d22b29a977be73e", "index": 2, "aliyun_index": 2, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "$^{1}$ The University of Texas at Austin, $^{2}$ University of British Columbia, $^{3}$ University of Wisconsin-Madison  \n\n", "text": "$^{1}$ The University of Texas at Austin, $^{2}$ University of British Columbia, $^{3}$ University of Wisconsin-Madison\n", "alignment": "left", "unique_id": "ce5e52de36ebf7507d22b29a977be73e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$^{1}$ The University of Texas at Austin, $^{2}$ University of British Columbia, $^{3}$ University of Wisconsin-Madison"}], "lineHeight": 0}}, "target": {"markdown": "$^{1}$ 德克萨斯大学奥斯汀分校，$^{2}$ 英属哥伦比亚大学，$^{3}$ 威斯康星大学麦迪逊分校", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 2}, {"source": {"block_id": "b3b7d36e820e0d821450b144b77c129b", "index": 3, "aliyun_index": 3, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## ABSTRACT\n", "text": "ABSTRACT\n", "alignment": "left", "unique_id": "b3b7d36e820e0d821450b144b77c129b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ABSTRACT"}], "lineHeight": 0}}, "target": {"markdown": "## ABSTRACT\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "82bb34e6ed0b24e2cef05f46dbbc65e3", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "General-purpose GPUs (GPGPUs) are becoming prevalent in mainstream computing, and performance per watt has emerged as a more crucial evaluation metric than peak performance. As such, GPU architects require robust tools that will enable them to quickly explore new ways to optimize GPGPUs for energy efficiency. We propose a new GPGPU power model that is configurable, capable of cycle-level calculations, and carefully validated against real hardware measurements. To achieve configurability, we use a bottom-up methodology and abstract parameters from the microarchitectural components as the model's inputs. We developed a rigorous suite of 80 microbenchmarks that we use to bound any modeling uncertainties and inaccuracies. The power model is comprehensively validated against measurements of two commercially available GPUs, and the measured error is within 9.9% and 13.4% for the two target GPUs (GTX 480 and Quadro FX5600). The model also accurately tracks the power consumption trend over time. We integrated the power model with the cycle-level simulator GPGPU-Sim and demonstrate the energy savings by utilizing dynamic voltage and frequency scaling (DVFS) and clock gating. Traditional DVFS reduces GPU energy consumption by 14.4% by leveraging within-kernel runtime variations. More finer-grained SM cluster-level DVFS improves the energy savings from 6.6% to 13.6% for those benchmarks that show clustered execution behavior. We also show that clock gating inactive lanes during divergence reduces dynamic power by 11.2%.  \n\n", "text": "General-purpose GPUs (GPGPUs) are becoming prevalent in mainstream computing, and performance per watt has emerged as a more crucial evaluation metric than peak performance. As such, GPU architects require robust tools that will enable them to quickly explore new ways to optimize GPGPUs for energy efficiency. We propose a new GPGPU power model that is configurable, capable of cycle-level calculations, and carefully validated against real hardware measurements. To achieve configurability, we use a bottom-up methodology and abstract parameters from the microarchitectural components as the model's inputs. We developed a rigorous suite of 80 microbenchmarks that we use to bound any modeling uncertainties and inaccuracies. The power model is comprehensively validated against measurements of two commercially available GPUs, and the measured error is within 9.9% and 13.4% for the two target GPUs (GTX 480 and Quadro FX5600). The model also accurately tracks the power consumption trend over time. We integrated the power model with the cycle-level simulator GPGPU-Sim and demonstrate the energy savings by utilizing dynamic voltage and frequency scaling (DVFS) and clock gating. Traditional DVFS reduces GPU energy consumption by 14.4% by leveraging within-kernel runtime variations. More finer-grained SM cluster-level DVFS improves the energy savings from 6.6% to 13.6% for those benchmarks that show clustered execution behavior. We also show that clock gating inactive lanes during divergence reduces dynamic power by 11.2%.\n", "alignment": "left", "unique_id": "82bb34e6ed0b24e2cef05f46dbbc65e3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "General-purpose GPUs (GPGPUs) are becoming prevalent in mainstream computing, and performance per watt has emerged as a more crucial evaluation metric than peak performance. As such, GPU architects require robust tools that will enable them to quickly explore new ways to optimize GPGPUs for energy efficiency. We propose a new GPGPU power model that is configurable, capable of cycle-level calculations, and carefully validated against real hardware measurements. To achieve configurability, we use a bottom-up methodology and abstract parameters from the microarchitectural components as the model's inputs. We developed a rigorous suite of 80 microbenchmarks that we use to bound any modeling uncertainties and inaccuracies. The power model is comprehensively validated against measurements of two commercially available GPUs, and the measured error is within 9.9% and 13.4% for the two target GPUs (GTX 480 and Quadro FX5600). The model also accurately tracks the power consumption trend over time. We integrated the power model with the cycle-level simulator GPGPU-Sim and demonstrate the energy savings by utilizing dynamic voltage and frequency scaling (DVFS) and clock gating. Traditional DVFS reduces GPU energy consumption by 14.4% by leveraging within-kernel runtime variations. More finer-grained SM cluster-level DVFS improves the energy savings from 6.6% to 13.6% for those benchmarks that show clustered execution behavior. We also show that clock gating inactive lanes during divergence reduces dynamic power by 11.2%."}], "lineHeight": 0}}, "target": {"markdown": "通用图形处理器（GPGPU）正在主流计算中日益普及，每瓦性能已取代峰值性能，成为更为关键的评价指标。因此，GPU 架构师需要强有力的工具，以便能够快速探索新的方法来优化 GPGPU 的能效。我们提出了一种新的 GPGPU 功耗模型，该模型具有可配置性，支持周期级计算，并经过与真实硬件测量值的严格验证。为实现可配置性，我们采用自底向上的方法，并将微架构组件中的参数抽象出来作为模型的输入。我们开发了一套严格的 80 个微基准测试程序，用于界定建模过程中的不确定性和不准确性。该功耗模型针对两款商用 GPU 的测量结果进行了全面的验证，对两款目标 GPU（GTX 480 和 Quadro FX5600）的测量误差分别在 9.9% 和 13.4% 以内。该模型还能够准确地跟踪功耗随时间的变化趋势。我们将该功耗模型与周期级模拟器 GPGPU-Sim 进行了集成，并展示了通过利用动态电压频率调节（DVFS）和时钟门控所实现的能耗节省效果。传统的 DVFS 通过利用核内运行时变化，将 GPU 能耗降低了 14.4%。对于表现出聚簇执行行为的基准测试，更细粒度的 SM 集群级 DVFS 将能耗节省从 6.6% 提高到了 13.6%。我们还表明，在执行分歧期间对非活跃通道进行时钟门控，可将动态功耗降低 11.2%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": fa alizing performance per watt. To avoid such pitfalls and develop energy-efficient GPU architectures, we require a robust power model.  \n\n", "text": "From datacenters to power-constrained mobile devices, performance per watt has emerged as an indispensable metric for evaluating the efficiency of a GPU architecture  $ [9, 18] $ . Although GPU performance models, such as GPGPU-Sim  $ [4] $ , Multi2Sim  $ [34] $  and MacSim  $ [1] $ , have enabled performance-oriented research on branch divergence  $ [11, 12, 27] $ , memory bandwidth pressure  $ [5, 32] $ , and so forth, similar efforts to investigate and optimize GPU energy-efficiency problems have been difficult owing to the lack of a suitable power modeling infrastructure. Researchers using these tools may inadvertently be optimizing for performance while penalizing performance per watt. To avoid such pitfalls and develop energy-efficient GPU architectures, we require a robust power model.\n", "alignment": "left", "unique_id": "631db64de56c6568cf7012219343dc7f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "From datacenters to power-constrained mobile devices, performance per watt has emerged as an indispensable metric for evaluating the efficiency of a GPU architecture  $ [9, 18] $ . Although GPU performance models, such as GPGPU-Sim  $ [4] $ , Multi2Sim  $ [34] $  and MacSim  $ [1] $ , have enabled performance-oriented research on branch divergence  $ [11, 12, 27] $ , memory bandwidth pressure  $ [5, 32] $ , and so forth, similar efforts to investigate and optimize GPU energy-efficiency problems have been difficult owing to the lack of a suitable power modeling infrastructure. Researchers using these tools may inadvertently be optimizing for performance while penalizing performance per watt. To avoid such pitfalls and develop energy-efficient GPU architectures, we require a robust power model."}], "lineHeight": 0}}, "target": {"markdown": "从数据中心到功率受限的移动设备，每瓦性能已成为评估 GPU 架构效率不可或缺的指标 $ [9, 18] $ 。尽管诸如 GPGPU-Sim $ [4] $ 、Multi2Sim $ [34] $ 和 MacSim $ [1] $ 等 GPU 性能模型已使针对分支发散 $ [11, 12, 27] $ 、内存带宽压力 $ [5, 32] $ 等方面的面向性能的研究成为可能，但由于缺少合适的功耗建模基础设施，类似的针对 GPU 能效问题进行调查与优化的尝试一直困难重重。使用这些工具的研究人员可能在不经意间针对性能进行了优化，却以每瓦性能作为代价。为了避免此类缺陷并开发节能高效的 GPU 架构，我们需要一个稳健的功耗模型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "622efc3f81dbdcb050fda0b377b28f1d", "index": 17, "aliyun_index": 17, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "A robust power model must satisfy three requirements to be useful for computer architecture research. It must be (1) configurable, (2) cycle level, and (3) strongly validated against existing processor architectures using a rigorous methodology. As shown in Table 1, Watch [6] and McPAT [22] are robust CPU power models that satisfy all three requirements, and as such have enabled new research areas in energy-efficient CPU design. No such power model exists for GPU architecture research. Hong and Kim [13] were the first to propose an integrated power and performance model for GPUs. However, their power model is not configurable to different architectural parameters. Moreover, it is incapable of providing cycle-level power estimates to evaluate fine-grained power saving techniques such as clock gating.  \n\n", "text": "A robust power model must satisfy three requirements to be useful for computer architecture research. It must be (1) configurable, (2) cycle level, and (3) strongly validated against existing processor architectures using a rigorous methodology. As shown in Table 1, Watch [6] and McPAT [22] are robust CPU power models that satisfy all three requirements, and as such have enabled new research areas in energy-efficient CPU design. e compare our simulated power with the measured hardware power to identify any modeling inaccuracies. We resolve these inaccuracies using a special suite of 80 microbenchmarks that are designed to create a system of linear equations that correspond to the total power consumption. By solving for the unknowns in the system, we progressively eliminate the inaccuracies. We"}], "lineHeight": 0}}, "target": {"markdown": "在本文中，我们提出了 *GPUWattch*，一种满足上述全部要求的新型功耗模型。我们遵循图 1(a) 所示的严格流程来开发这一稳健的功耗模型。我们采用自底向上的方法构建初始模型。随后，我们将仿真功耗与实测硬件功耗进行对比，以识别建模中的不准确性。我们使用一组精心设计的 80 个微基准测试来解决这些不准确性，这些微基准用于构建一组对应于总功耗的线性方程组。通过求解该方程组中的未知数，我们逐步消除不准确性。我们", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "0e9f1a868f89e75a8768d4db8bc36a5d", "index": 19, "aliyun_index": 19, "page_num": 0, "type": "table", "sub_type": "none", "markdown": "| Work | GPU | Configurable? | Cycle-level? | Validated? |\n| --- | --- | --- | --- | --- |\n| Wattch/McPAT [6, 22] | No | Yes | Yes | Yes |\n| Hong and Kim [13] | Yes | No | No | Yes |\n| GPUWattch | Yes | Yes | Yes | Yes |\n\n", "text": "| Work|GPU|Configurable?|Cycle-level?|Validated?|\n| ---|---|---|---|---|\n| Wattch/McPAT [6, 22]|No|Yes|Yes|Yes|\n| Hong and Kim [13]|Yes|No|No|Yes|\n| GPUWattch|Yes|Yes|Yes|Yes|\n", "alignment": "left", "unique_id": "0e9f1a868f89e75a8768d4db8bc36a5d", "edited": false, "extra": {"numCol": 5, "cells": [{"yec": 0, "xec": 0, "ysc": 0, "xsc": 0, "type": "text", "alignment": "left", "cellId": 0, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Work"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Work\n", "alignment": "left", "type": "text", "pageNum": [0], "uniqueId": "d73a548fbdc92b29f9dd5eb6c7c03b18"}], "pageNum": [0]}, {"yec": 0, ], "pageNum": [0]}, {"yec": 3, "xec": 2, "ysc": 3, "xsc": 2, "type": "text", "alignment": "left", "cellId": 17, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Yes"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Yes\n", "alignment": "left", "type": "text", "pageNum": [0], "uniqueId": "e80b729496e9b6ebc184756cf9b995b7"}], "pageNum": [0]}, {"yec": 3, "xec": 3, "ysc": 3, "xsc": 3, "type": "text", "alignment": "left", "cellId": 18, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Yes"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Yes\n", "alignment": "left", "type": "text", "pageNum": [0], "uniqueId": "e80b729496e9b6ebc184756cf9b995b7"}], "pageNum": [0]}, {"yec": 3, "xec": 4, "ysc": 3, "xsc": 4, "type": "text", "alignment": "left", "cellId": 19, "layouts": [{"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Yes"}], "index": 0, "subType": "none", "lineHeight": 0, "text": "Yes\n", "alignment": "left", "type": "text", "pageNum": [0], "uniqueId": "e80b729496e9b6ebc184756cf9b995b7"}], "pageNum": [0]}], "numRow": 4}}, "target": {"markdown": "| 工作 | GPU | 可配置？ | 周期级？ | 经验证？ |\n| --- | --- | --- | --- | --- |\n| Wattch/McPAT [6, 22] | 否 | 是 | 是 | 是 |\n| Hong 和 Kim [13] | 是 | 否 | 否 | 是 |\n| GPUWattch | 是 | 是 | 是 | 是 |", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 19}, {"source": {"block_id": "0fe0be77d2bf72caded41434c6627e87", "index": 20, "aliyun_index": 20, "page_num": 0, "type": "table_name", "sub_type": "none", "markdown": ">Table 1: Robust power modeling requirements for a GPU.  \n\n", "text": "Table 1: Robust power modeling requirements for a GPU.\n", "alignment": "left", "unique_id": "0fe0be77d2bf72caded41434c6627e87", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Table 1: Robust power modeling requirements for a GPU."}], "lineHeight": 0}}, "target": {"markdown": ">表 1：GPU 稳健功耗建模的要求。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "3ca4a8fc70dad733bc15b9eaf363a97c", "index": 21, "aliyun_index": 0, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![3ca4a8fc70dad733bc15b9eaf363a97c.jpeg](figures/3ca4a8fc70dad733bc15b9eaf363a97c_2d086cda.png)  \n\n", "text": "以下是根据您提供的流程图（图 a 和图 b）提取并整理的合法 Markdown 格式内容，准确保留所有步骤、组件、判断节点和反馈机制：\n\n---\n\n## (a) Power Modeling Workflow\n\n### Initial Modeling Stage\n\n- **Start** →  \n  - **Bottom-up Modeling**\n    - *Basic structures*: Wire, Logic, SRAM, ...\n\n→  \n  - **Power Model**\n    - *Component*: RF, Caches, Exe. Units, ...\n\n→ （连接点 A）\n\n---\n\n### Validation Stage\n\n← （从 Refinement Stage 返回或初始进入）\n\n- **Microbenchmark**\n  - *Stress Components*: RF, caches, exe. units ...\n  - *Access Patterns*: Hit/miss ratio, coalesce pattern, ...\n\n→  \n  - **Validation**\n    - Profiling Tools\n    - Power Measurement\n\n→  \n  - **Decision: Good Coverage?**\n    - **Yes** → 连接点 A（返回 Power Model）\n    - **No** → 进入 Refinement Stage\n\n→  \n  - **Decision: Accuracy Achieved?**\n    - **Yes** → **Stop**\n    - **No** → 进入 Refinement Stage\n\n---\n\n### Refinement Stage\n\n← （来自 Validation Stage 的 “No” 分支）\n\n- **Refinement**\n  - *Microbenchmark Refinement*:\n    - Adjust hardware assumptions\n    - Add more microbenchmarks\n\n→  \n  - *Power model Refinement*:\n    - Identify modeling unknowns\n    - Adjust component parameters\n    - Scale estimated power\n\n→ （反馈回 Validation Stage）\n\n> 注：图中存在两个绿色圆圈标记为 “A”，表示流程中的关键汇合点，用于循环迭代。\n\n---\n\n## (b) Feedback-driven Optimization Loop\n\n### Inputs\n\n- **Config**: Micro-Architectural Component Parameters  \n  ↓  \n- **GPGPU-Sim**: Performance Counters  \n  ↓  \n\n→  \n  - **Power model + Power saving techniques**  \n    *(P/C states, clock gating)*\n\n↓  \n  - **Leakage Power**  \n  - **Dynamic Power**\n\n↺  \n  - **Feedback-driven Optimization**（虚线箭头，从输出反馈至 GPGPU-Sim 输入端）\n\n---\n\n## 整体说明\n\n该框架分为两部分：\n\n- **(a)** 是一个三阶段迭代建模流程：\n  1. **Initial Modeling**：自底向上构建基本结构与功耗模型。\n  2. **Validation**：通过微基准测试验证覆盖度与精度。\n  3. **Refinement**：若未达标，则调整硬件假设、增加测试用例、修正模型参数，再返回验证。\n\n- **(b)** 是一个闭环优化系统：\n  - 利用配置参数与模拟器性能计数器驱动功耗模型。\n  - 应用节能技术后分解为漏电功耗与动态功耗。\n  - 通过“反馈驱动优化”将结果反哺给模拟器，形成持续优化循环。\n\n---\n\n✅ 此 Markdown 结构完整保留了原图中的所有文本标签、决策逻辑、数据流向及反馈机制，适用于文档化、复现或进一步分析。", "alignment": "left", "unique_id": "3ca4a8fc70dad733bc15b9eaf363a97c", "edited": false, "extra": {}}, "target": {"markdown": "![3ca4a8fc70dad733bc15b9eaf363a97c.jpeg](figures/3ca4a8fc70dad733bc15b9eaf363a97c_2d086cda.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 21}, {"source": {"block_id": "7a006f92d96e37d299876fc38b01d71b", "index": 22, "aliyun_index": 1, "page_num": 1, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 1: (a) Steps to build a robust power model. The various stages indicate our systematic and rigorous methodology to iteratively identify and refine inaccuracies in the model. (b) Our integrated power and performance modeling framework.  \n\n", "text": "Figure 1: (a) Steps to build a robust power model. The various stages indicate our systematic and rigorous methodology to iteratively identify and refine inaccuracies in the model. (b) Our integrated power and performance modeling framework.\n", "alignment": "left", "unique_id": "7a006f92d96e37d299876fc38b01d71b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1: (a) Steps to build a robust power model. The various stages indicate our systematic and rigorous methodology to iteratively identify and refine inaccuracies in the model. (b) Our integrated power and performance modeling framework."}], "lineHeight": 0}}, "target": {"markdown": ">图 1：(a) 构建稳健功耗模型的步骤。各个阶段展示了我们的系统且严谨的方法论，用于迭代地识别并修正模型中的不准确性。(b) 我们的集成功耗与性能建模框架。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 22}, {"source": {"block_id": "d286dae6e356fd545897ca453034bace", "index": 23, "aliyun_index": 2, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "validated the simulated power model's average and runtime\nestimates against measured results using a comprehensive\nset of 25 real-world kernels that were not used to originally\ndevelop the power model. The power model achieves an average\naccuracy that is within 9.9% error of the measured\nresults for the GTX 480 and 13.4% for the Quadro FX5600.\nMoreover, it accurately tracks the trace of relative power\nconsumption over time.  \n\n", "text": "validated the simulated power model's average and runtime\nestimates against measured results using a comprehensive\nset of 25 real-world kernels that were not used to originally\ndevelop the power model. The power model achieves an average\naccuracy that is within 9.9% error of the measured\nresults for the GTX 480 and 13.4% for the Quadro FX5600.\nMoreover, it accurately tracks the trace of relative power\nconsumption over time.\n", "alignment": "left", "unique_id": "d286dae6e356fd545897ca453034bace", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "validated the simulated power model's average and runtime"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "estimates against measured results using a comprehensive"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "set of 25 real-world kernels that were not used to originally"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "develop the power model. The power model achieves an average"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "accuracy that is within 9.9% error of the measured"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "results for the GTX 480 and 13.4% for the Quadro FX5600."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Moreover, it accurately tracks the trace of relative power"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "consumption over time."}], "lineHeight": -203}}, "target": {"markdown": "我们使用一组全面的 25 个真实世界内核对功耗模型的平均估算值和运行时估算值与实测结果进行了验证，这些内核未在最初开发功耗模型时使用。该功耗模型实现了与实测结果相比的平均精度：在 GTX 480 上误差在 9.9% 以内，在 Quadro FX5600 上误差在 13.4% 以内。此外，它还能够准确跟踪功耗随时间变化的相对轨迹。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 23}, {"source": {"block_id": "1f3d4eab75fadf8843a368884791e18d", "index": 24, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "A salient feature of our power model is its longevity. Power consumption is often sensitive to the details of the specific architecture, implementation choices, and technology parameters, all of which continuously evolve from one generation to another. Therefore, the power model must be continuously adapted, refined, and validated for evolving GPU architectures and their manufacturing technology. A key distinguishing feature of our power model, as compared to other architecture-level power models, is that it is equipped with the suite of microbenchmarks and a refinement and validation methodology that can support future GPUs.  \n\n", "text": "A salient feature of our power model is its longevity. Power consumption is often sensitive to the details of the specific architecture, implementation choices, and technology parameters, all of which continuously evolve from one generation to another. Therefore, the power model must be continuously adapted, refined, and validated for evolving GPU architectures and their manufacturing technology. A key distinguishing feature of our power model, as compared to other architecture-level power models, is that it is equipped with the suite of microbenchmarks and a refinement and validation methodology that can support future GPUs.\n", "alignment": "left", "unique_id": "1f3d4eab75fadf8843a368884791e18d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "A salient feature of our power model is its longevity. Power consumption is often sensitive to the details of the specific architecture, implementation choices, and technology parameters, all of which continuously evolve from one generation to another. Therefore, the power model must be continuously adapted, refined, and validated for evolving GPU architectures and their manufacturing technology. A key distinguishing feature of our power model, as compared to other architecture-level power models, is that it is equipped with the suite of microbenchmarks and a refinement and validation methodology that can support future GPUs."}], "lineHeight": 0}}, "target": {"markdown": "我们功耗模型的一个显著特征是其持久适用性。功耗通常对特定架构的细节、实现选择以及工艺参数十分敏感，而这些方面在每一代产品之间都在不断演进。因此，功耗模型必须针对不断发展的 GPU 架构及其制造工艺持续地进行适配、修正和验证。与其他架构级功耗模型相比，我们的功耗模型的一个关键区别性特征在于，它配备了一整套微基准测试以及一套可支持未来 GPU 的修正与验证方法论。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 24}, {"source": {"block_id": "6d11ea670f080edd41458694ca8f881e", "index": 25, "aliyun_index": 4, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "We integrate the power model with GPGPU-Sim [4] for cycle-level power calculation, as shown in Figure 1(b), to establish a complete framework for exploring energy-efficient GPU architectures and power-management techniques. On the basis of this framework, we demonstrate that traditional processor-level dynamic voltage and frequency scaling (DVFS) achieves 14.4% energy savings in GPUs by leveraging the phase behavior within kernels. Average performance loss is within 3%. Furthermore, we identify new opportunities for cluster-level DVFS (i.e., grouping streaming multi-processors [SMs] in the GPU to perform DVFS separately). Cluster-level DVFS can achieve an additional 7% energy savings over conventional DVFS for benchmarks that exhibit such grouped behavior. We also evaluate fine-grained lane-level clock-gating in order to reduce processor power consumption when SIMD lanes go inactive due to branch divergence. On average, lane gating reduces dynamic power consumption by approximately 11.2%.  \n\n", "text": "We integrate the power model with GPGPU-Sim [4] for cycle-level power calculation, as shown in Figure 1(b), to establish a complete framework for exploring energy-efficient GPU architectures and power-management techniques. On the basis of this framework, we demonstrate that traditional processor-level dynamic voltage and frequency scaling (DVFS) achieves 14.4% energy savings in GPUs by leveraging the phase behavior within kernels. Average performance loss is within 3%. Furthermore, we identify new opportunities for cluster-level DVFS (i.e., grouping streaming multi-processors [SMs] in the GPU to perform DVFS separately). Cluster-level DVFS can achieve an additional 7% energy savings over conventional DVFS for benchmarks that exhibit such grouped behavior. We also evaluate fine-grained lane-level clock-gating in order to reduce processor power consumption when SIMD lanes go inactive due to branch divergence. On average, lane gating reduces dynamic power consumption by approximately 11.2%.\n", "alignment": "left", "unique_id": "6d11ea670f080edd41458694ca8f881e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We integrate the power model with GPGPU-Sim [4] for cycle-level power calculation, as shown in Figure 1(b), to establish a complete framework for exploring energy-efficient GPU architectures and power-management techniques. On the basis of this framework, we demonstrate that traditional processor-level dynamic voltage and frequency scaling (DVFS) achieves 14.4% energy savings in GPUs by leveraging the phase behavior within kernels. Average performance loss is within 3%. Furthermore, we identify new opportunities for cluster-level DVFS (i.e., grouping streaming multi-processors [SMs] in the GPU to perform DVFS separately). Cluster-level DVFS can achieve an additional 7% energy savings over conventional DVFS for benchmarks that exhibit such grouped behavior. We also evaluate fine-grained lane-level clock-gating in order to reduce processor power consumption when SIMD lanes go inactive due to branch divergence. On average, lane gating reduces dynamic power consumption by approximately 11.2%."}], "lineHeight": 0}}, "target": {"markdown": "我们将该功耗模型与 GPGPU-Sim [4] 集成以进行周期级功耗计算，如图 1(b) 所示，从而建立一个用于探索节能高效 GPU 架构与功耗管理技术的完整框架。在此框架的基础上，我们证明传统的处理器级动态电压频率调节（DVFS）通过利用内核内部的阶段性行为，可在 GPU 上实现 14.4% 的能耗节省，平均性能损失在 3% 以内。此外，我们还发现了集群级 DVFS（即对 GPU 中的流多处理器 [SM] 进行分组以分别执行 DVFS）的新机会。对于表现出此类分组行为的基准测试，集群级 DVFS 可在传统 DVFS 的基础上额外实现 7% 的能耗节省。我们还评估了细粒度的 lane 级时钟门控，以在因分支发散导致 SIMD lane 失效时降低处理器功耗。平均而言，lane 级门控可将动态功耗降低约 11.2%。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 25}, {"source": {"block_id": "50f5efe3ad29c44b9b3402f9fa75bc6e", "index": 26, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "In summary, our work makes the following contributions:  \n\n", "text": "In summary, our work makes the following contributions:\n", "alignment": "left", "unique_id": "50f5efe3ad29c44b9b3402f9fa75bc6e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In summary, our work makes the following contributions:"}], "lineHeight": 0}}, "target": {"markdown": "总之，我们的工作做出了以下贡献：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 26}, {"source": {"block_id": "d8aa2acecb2337b3d057014d1e02c951", "index": 27, "aliyun_index": 6, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "1. We propose a power model based on the bottom-up methodology for GPU architecture research that can enable performance per watt energy-efficiency studies.  \n\n", "text": "1. We propose a power model based on the bottom-up methodology for GPU architecture research that can enable performance per watt energy-efficiency studies.\n", "alignment": "left", "unique_id": "d8aa2acecb2337b3d057014d1e02c951", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1. We propose a power model based on the bottom-up methodology for GPU architecture research that can enable performance per watt energy-efficiency studies."}], "lineHeight": 0}}, "target": {"markdown": "1. 我们提出了一种基于自底向上方法、面向 GPU 架构研究的功耗模型，可用于支持每瓦性能相关的能效研究。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 27}, {"source": {"block_id": "4e71f14278b9623cd90293cfbe8d114a", "index": 28, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "2. We describe a systematic and rigorous methodology  \n\n", "text": "2. We describe a systematic and rigorous methodology\n", "alignment": "left", "unique_id": "4e71f14278b9623cd90293cfbe8d114a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2. We describe a systematic and rigorous methodology"}], "lineHeight": 0}}, "target": {"markdown": "2. 我们描述了一种系统且严谨的方法论", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "a8ed1ead41e368b9fd1b206ea10be0cb", "index": 29, "aliyun_index": 8, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "to develop and validate the power model using a large\nvariety of microbenchmarks that stress test the microarchitecture.  \n\n", "text": "to develop and validate the power model using a large\nvariety of microbenchmarks that stress test the microarchitecture.\n", "alignment": "left", "unique_id": "a8ed1ead41e368b9fd1b206ea10be0cb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "to develop and validate the power model using a large"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "variety of microbenchmarks that stress test the microarchitecture."}], "lineHeight": -74}}, "target": {"markdown": "以使用大量对微架构进行压力测试的微基准测试来开发并验证该功耗模型。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "a5085fa273948ce056fbb0c3cb9f95e2", "index": 30, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "3. We demonstrate the opportunities for improving the energy efficiency of GPUs using both traditional techniques (DVFS) and new techniques (lane gating).  \n\n", "text": "3. We demonstrate the opportunities for improving the energy efficiency of GPUs using both traditional techniques (DVFS) and new techniques (lane gating).\n", "alignment": "left", "unique_id": "a5085fa273948ce056fbb0c3cb9f95e2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3. We demonstrate the opportunities for improving the energy efficiency of GPUs using both traditional techniques (DVFS) and new techniques (lane gating)."}], "lineHeight": 0}}, "target": {"markdown": "3. 我们展示了通过使用传统技术（DVFS）和新技术（lane 级门控）来提升 GPU 能效的机会。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "5450d7f5ae29e482e9e20a89df8aa228", "index": 31, "aliyun_index": 10, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "We begin with an overview of our power modeling approach in Section 2. We explain how we model the various important microarchitectural structures. To assess and fix any discrepancies in the initial model, we describe our extensive microbenchmarking methodology in Section 3. Next, we validate the power model comprehensively using hardware measurements in Section 4. We then demonstrate the benefits of two hardware optimizations to save GPU power in Section 5. We compare our results with related work and conclude the paper in Section 6 and Section 7, respectively.  \n\n", "text": "We begin with an overview of our power modeling approach in Section 2. We explain how we model the various important microarchitectural structures. To assess and fix any discrepancies in the initial model, we describe our extensive microbenchmarking methodology in Section 3. Next, we validate the power model comprehensively using hardware measurements in Section 4. We then demonstrate the benefits of two hardware optimizations to save GPU power in Section 5. We compare our results with related work and conclude the paper in Section 6 and Section 7, respectively.\n", "alignment": "left", "unique_id": "5450d7f5ae29e482e9e20a89df8aa228", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We begin with an overview of our power modeling approach in Section 2. We explain how we model the various important microarchitectural structures. To assess and fix any discrepancies in the initial model, we describe our extensive microbenchmarking methodology in Section 3. Next, we validate the power model comprehensively using hardware measurements in Section 4. We then demonstrate the benefits of two hardware optimizations to save GPU power in Section 5. We compare our results with related work and conclude the paper in Section 6 and Section 7, respectively."}], "lineHeight": 0}}, "target": {"markdown": "我们在第 2 节首先概述我们的功耗建模方法，并解释如何对各种重要的微架构结构进行建模。为了评估并修正初始模型中的任何偏差，我们在第 3 节详细描述我们的微基准测试方法论。接下来，我们在第 4 节中使用硬件实测数据对功耗模型进行全面验证。随后，我们在第 5 节中展示两种硬件优化在节省 GPU 功耗方面所带来的收益。我们将在第 6 节中与相关工作进行比较，并在第 7 节中对全文进行总结。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "bbdb7d296d858c05e8168f025b272edc", "index": 32, "aliyun_index": 11, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2. GPU POWER MODELING\n", "text": "2. GPU POWER MODELING\n", "alignment": "left", "unique_id": "bbdb7d296d858c05e8168f025b272edc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2. GPU POWER MODELING"}], "lineHeight": 0}}, "target": {"markdown": "## 2. GPU 功耗建模\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "5b0e49c1ecf5b19b50094e0da34d6e48", "index": 33, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "We model GPU architectures similar to NVIDIA's GPUs. The main components shown in Table 2 include streaming multiprocessors (SMs), memory controllers, the interconnection network, and DRAM. Figure 2 shows the architecture of an SM in a GPU. The SM's major difference from a traditional CPU core is that it has a SIMD execution unit and also contains a texture cache, constant cache, and shared memory. GPUs also adopt GDDR instead of DDR memory for higher bandwidth [28]. Note that our initial modeling may differ from the real hardware's implementation. Therefore, during the refinement stage of the modeling methodology we update the initial model estimates to be more precise, as shown in Figure 1(a).  \n\n", "text": "We model GPU architectures similar to NVIDIA's GPUs. The main components shown in Table 2 include streaming multiprocessors (SMs), memory controllers, the interconnection network, and DRAM. Figure 2 shows the architecture of an SM in a GPU. The SM's major difference from a traditional CPU core is that it has a SIMD execution unit and also contains a texture cache, constant cache, and shared memory. GPUs also adopt GDDR instead of DDR memory for higher bandwidth [28]. Note that our initial modeling may differ from the real hardware's implementation. Therefore, during the refinement stage of the modeling methodology we update the initial model estimates to be more precise, as shown in Figure 1(a).\n", "alignment": "left", "unique_id": "5b0e49c1ecf5b19b50094e0da34d6e48", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We model GPU architectures similar to NVIDIA's GPUs. The main components shown in Table 2 include streaming multiprocessors (SMs), memory controllers, the interconnection network, and DRAM. Figure 2 shows the architecture of an SM in a GPU. The SM's major difference from a traditional CPU core is that it has a SIMD execution unit and also contains a texture cache, constant cache, and shared memory. GPUs also adopt GDDR instead of DDR memory for higher bandwidth [28]. Note that our initial modeling may differ from the real hardware's implementation. Therefore, during the refinement stage of the modeling methodology we update the initial model estimates to be more precise, as shown in Figure 1(a)."}], "lineHeight": 0}}, "target": {"markdown": "我们对类似于 NVIDIA GPU 的架构进行建模。表 2 中所示的主要组件包括流多处理器（SM）、内存控制器、互连网络和 DRAM。图 2 展示了 GPU 中 SM 的架构。SM 与传统 CPU 核的主要区别在于它具有 SIMD 执行单元，并且还包含纹理缓存、常量缓存以及共享存储器。GPU 还采用 GDDR 而非 DDR 内存以获得更高的带宽 [28]。需要注意的是，我们的初始模型可能与实际硬件的实现存在差异。因此，在建模方法的修正阶段，我们会更新初始模型估算值以使其更加精确，如图 1(a) 所示。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "9a083be4bacc40d7751c5c596ea20468", "index": 34, "aliyun_index": 13, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Equation (1) captures at a very high level all aspects of GPU power that we model, which consists of the leakage, idle SM, and all components' ($N$ in total) dynamic power. Each component's dynamic power is calculated as the activity factor ($\\alpha_i$) multiplied by the component's peak power ($P_{max_i}$).  \n\n", "text": "Equation (1) captures at a very high level all aspects of GPU power that we model, which consists of the leakage, idle SM, and all components' ($N$ in total) dynamic power. Each component's dynamic power is calculated as the activity factor ($\\alpha_i$) multiplied by the component's peak power ($P_{max_i}$).\n", "alignment": "left", "unique_id": "9a083be4bacc40d7751c5c596ea20468", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Equation (1) captures at a very high level all aspects of GPU power that we model, which consists of the leakage, idle SM, and all components' ($N$ in total) dynamic power. Each component's dynamic power is calculated as the activity factor ($\\alpha_i$) multiplied by the component's peak power ($P_{max_i}$)."}], "lineHeight": 0}}, "target": {"markdown": "式 (1) 在很高层面上概括了我们所建模的 GPU 功耗的所有方面，其中包括漏电功耗、空闲 SM 功耗以及所有组件（共计 $N$ 个）的动态功耗。每个组件的动态功耗通过该组件的活动因子（$\\alpha_i$）与其峰值功耗（$P_{max_i}$）相乘计算得到。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "1ada47d9c57dd94271e48c905a105f8d", "index": 35, "aliyun_index": 14, "page_num": 1, "type": "formula", "sub_type": "none", "markdown": "$$ \\begin{array}{r c l}{{P o w e r}}&{{=}}&{{\\displaystyle\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}})}}\\\\ {{}}&{{}}&{{\\displaystyle+I d l e S M p o w e r+L e a k a g e}}\\end{array} $$  \n\n", "text": "$$ \\begin{array}{r c l}{{P o w e r}}&{{=}}&{{\\displaystyle\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}})}}\\\\ {{}}&{{}}&{{\\displaystyle+I d l e S M p o w e r+L e a k a g e}}\\end{array} $$\n", "alignment": "left", "unique_id": "1ada47d9c57dd94271e48c905a105f8d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$$ \\begin{array}{r c l}{{P o w e r}}&{{=}}&{{\\displaystyle\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}})}}\\\\ {{}}&{{}}&{{\\displaystyle+I d l e S M p o w e r+L e a k a g e}}\\end{array} $$"}], "lineHeight": 0}}, "target": {"markdown": "$$ \\begin{array}{r c l}{{P o w e r}}&{{=}}&{{\\displaystyle\\sum_{1}^{N}(\\alpha_{i}*P_{m a x_{i}})}}\\\\ {{}}&{{}}&{{\\displaystyle+I d l e S M p o w e r+L e a k a g e}}\\end{array} $$  \n\n", "status": "skipped", "skip_reason": "deterministic:type:formula", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "eeb7b98f58acaea1199a489fa382e0aa", "index": 36, "aliyun_index": 15, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "(1)  \n\n", "text": "(1)\n", "alignment": "left", "unique_id": "eeb7b98f58acaea1199a489fa382e0aa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(1)"}], "lineHeight": 0}}, "target": {"markdown": "(1)", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "e6422cefffa1b4482ebbc1e3a98ec17a", "index": 37, "aliyun_index": 0, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![e6422cefffa1b4482ebbc1e3a98ec17a.jpeg](figures/e6422cefffa1b4482ebbc1e3a98ec17a_51371a16.png)  \n\n", "text": "# GPU 核心架构流程图\n\n## 顶层调度与取指阶段\n\n1. **Warp Scheduler**  \n   ↓  \n2. **Instruction Cache**  \n   ↓  \n3. **Fetch and Decode**\n\n## 寄存器访问阶段\n\n4. **Register File (16 Banks)**  \n   ↓  \n\n## 执行与存储单元（并行模块）\n\n5. **Execution Units**  \n6. **TEX $**  \n7. **Shared Memory**  \n8. **L1 $**  \n9. **Constant $**\n\n> 注：第5–9项为并列模块，位于同一层级，由 Register File 向下驱动。\n\n\n\n---\n\n### 结构说明：\n\n- 流程从上至下依次为：\n  - Warp Scheduler → Instruction Cache → Fetch and Decode → Register File\n- Register File 输出后进入一个包含多个功能单元的复合模块：\n  - Execution Units\n  - TEX $ （纹理缓存）\n  - Shared Memory\n  - L1 $ （一级数据缓存）\n  - Constant $ （常量缓存）\n\n该结构反映了典型 GPU SM（Streaming Multiprocessor）内部的数据流与控制流组织方式。\n\n--- \n\n✅ 此 Markdown 格式可直接用于文档、笔记或技术报告中，清晰呈现各组件及其连接关系。", "alignment": "left", "unique_id": "e6422cefffa1b4482ebbc1e3a98ec17a", "edited": false, "extra": {}}, "target": {"markdown": "![e6422cefffa1b4482ebbc1e3a98ec17a.jpeg](figures/e6422cefffa1b4482ebbc1e3a98ec17a_51371a16.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "0325908ca5382cfab7a3872a60507e15", "index": 38, "aliyun_index": 1, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 2: Streaming multiprocessor (SM) overview.  \n\n", "text": "Figure 2: Streaming multiprocessor (SM) overview.\n", "alignment": "left", "unique_id": "0325908ca5382cfab7a3872a60507e15", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2: Streaming multiprocessor (SM) overview."}], "lineHeight": 0}}, "target": {"markdown": "> 图 2：流多处理器（SM）概览。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "c8b7f033b89038dbb6d70381f611899a", "index": 39, "aliyun_index": 2, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 2.1 Infrastructure\n", "text": "2.1 Infrastructure\n", "alignment": "left", "unique_id": "c8b7f033b89038dbb6d70381f611899a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.1 Infrastructure"}], "lineHeight": 0}}, "target": {"markdown": "### 2.1 基础设施\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "28fbefb02d714f58ef66d91a690b78bb", "index": 40, "aliyun_index": 3, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "We use publicly available resources that describe the GPU microarchitecture and rely on McPAT [22] to model most microarchitectural blocks (refer to Table 2). Throughout, we stay consistent with the process of abstracting the microarchitectural parameters of each component and using them to model each component's circuit implementation in order to ensure configurability.  \n\n", "text": "We use publicly available resources that describe the GPU microarchitecture and rely on McPAT [22] to model most microarchitectural blocks (refer to Table 2). Throughout, we stay consistent with the process of abstracting the microarchitectural parameters of each component and using them to model each component's circuit implementation in order to ensure configurability.\n", "alignment": "left", "unique_id": "28fbefb02d714f58ef66d91a690b78bb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We use publicly available resources that describe the GPU microarchitecture and rely on McPAT [22] to model most microarchitectural blocks (refer to Table 2). Throughout, we stay consistent with the process of abstracting the microarchitectural parameters of each component and using them to model each component's circuit implementation in order to ensure configurability."}], "lineHeight": 0}}, "target": {"markdown": "我们使用公开可用的资源来描述 GPU 微架构，并依赖 McPAT [22] 来建模大多数微架构模块（参见表 2）。在整个过程中，我们始终遵循如下流程：抽象出每个组件的微架构参数，并利用这些参数对每个组件的电路实现进行建模，以确保模型的可配置性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "4180828e2f958afb6c2837b8d36baff3", "index": 41, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Although McPAT includes detailed models for several microarchitectural blocks, many components are either not present or are considerably different for GPUs as compared to general-purpose CPUs. Therefore, we added or adapted several important blocks in McPAT to more accurately represent the underlying GPU microarchitecture. We model SRAM array structures using CACTI [33].  \n\n", "text": "Although McPAT includes detailed models for several microarchitectural blocks, many components are either not present or are considerably different for GPUs as compared to general-purpose CPUs. Therefore, we added or adapted several important blocks in McPAT to more accurately represent the underlying GPU microarchitecture. We model SRAM array structures using CACTI [33].\n", "alignment": "left", "unique_id": "4180828e2f958afb6c2837b8d36baff3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Although McPAT includes detailed models for several microarchitectural blocks, many components are either not present or are considerably different for GPUs as compared to general-purpose CPUs. Therefore, we added or adapted several important blocks in McPAT to more accurately represent the underlying GPU microarchitecture. We model SRAM array structures using CACTI [33]."}], "lineHeight": 0}}, "target": {"markdown": "虽然 McPAT 包含了针对多个微架构模块的详细模型，但与通用 CPU 相比，许多组件在 GPU 中要么不存在，要么存在显著差异。因此，我们在 McPAT 中新增或改写了若干重要模块，以更准确地表示底层 GPU 微架构。我们使用 CACTI [33] 对 SRAM 阵列结构进行建模。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "ec1f9b46a646d32095c9721d62399bf3", "index": 42, "aliyun_index": 5, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "### 2.2 Register File\n", "text": "2.2 Register File\n", "alignment": "left", "unique_id": "ec1f9b46a646d32095c9721d62399bf3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.2 Register File"}], "lineHeight": 0}}, "target": {"markdown": "### 2.2 寄存器文件\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "6fe2dd41bbb7778d45247e6f9e8664c4", "index": 43, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Owing to the lack of resources for the NVIDIA GPU register file architecture, we adopt the architecture used in GPGPU-Sim version 3.2.1 (see Figure 3), which is inspired by NVIDIA patents [24,25]. Each SM has a large and unified register file that is shared across warps executing in the same SM. GPUs adopt a multibanked register file architecture to avoid the area and power overhead of a multiported register file. Crossbar networks and operand collectors are used to transport operands from different banks to the appropriate SIMD execution lane.  \n\n", "text": "Owing to the lack of resources for the NVIDIA GPU register file architecture, we adopt the architecture used in GPGPU-Sim version 3.2.1 (see Figure 3), which is inspired by NVIDIA patents [24,25]. Each SM has a large and unified register file that is shared across warps executing in the same SM. GPUs adopt a multibanked register file architecture to avoid the area and power overhead of a multiported register file. Crossbar networks and operand collectors are used to transport operands from different banks to the appropriate SIMD execution lane.\n", "alignment": "left", "unique_id": "6fe2dd41bbb7778d45247e6f9e8664c4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Owing to the lack of resources for the NVIDIA GPU register file architecture, we adopt the architecture used in GPGPU-Sim version 3.2.1 (see Figure 3), which is inspired by NVIDIA patents [24,25]. Each SM has a large and unified register file that is shared across warps executing in the same SM. GPUs adopt a multibanked register file architecture to avoid the area and power overhead of a multiported register file. Crossbar networks and operand collectors are used to transport operands from different banks to the appropriate SIMD execution lane."}], "lineHeight": 0}}, "target": {"markdown": "由于缺乏关于 NVIDIA GPU 寄存器文件架构的公开资料，我们采用了 GPGPU-Sim 3.2.1 版本中所使用的架构（见图 3），该架构的灵感来自 NVIDIA 的相关专利 [24, 25]。每个 SM 都拥有一个大型的统一寄存器文件，由同一 SM 中执行的所有 warp 共享。GPU 采用多体（multibanked）寄存器文件架构，以避免多端口寄存器文件带来的面积和功耗开销。跨bar 互连网络和操作数收集器（operand collector）用于将来自不同 bank 的操作数传送到相应的 SIMD 执行通道。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "e14c584b96a961ea42b86e497ad9d1ee", "index": 44, "aliyun_index": 7, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "The register file's bandwidth and size determines the number and size of banks. Fermi GPUs can perform a fused  \n\n", "text": "The register file's bandwidth and size determines the number and size of banks. Fermi GPUs can perform a fused\n", "alignment": "left", "unique_id": "e14c584b96a961ea42b86e497ad9d1ee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The register file's bandwidth and size determines the number and size of banks. Fermi GPUs can perform a fused"}], "lineHeight": 0}}, "target": {"markdown": "寄存器文件的带宽和大小决定了 bank 的数量和规模。Fermi GPU 可以执行融合", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "adfe5d02cb5fb62fe6351c6ead2b014f", "index": 45, "aliyun_index": 8, "page_num": 2, "type": "table", "sub_type": "none", "markdown": "| Description | Microarchitectural Components | Basic Structures |\n| --- | --- | --- |\n| SM Pipeline | Pipeline | In-order multithreaded pipeline with SIMD datapath |\n| Register Files | Register-file banks Operand collectors Collection network | 1024-bit wide, 64-entry SRAM 1024-bit wide SRAM 1024-bit wide 16 x 16 crossbar |\n| Shared Memory | Shared memory banks Shared memory network | Architecture dependent size 32 x 32 crossbar network |\n| Caches | L1, L2, texture, and constant caches | Architecture dependent size |\n| Caches | Memory-coalescing logic | Synthesis-based power model |\n| Execution Unit | Integer ALUs Floating-point units Special-function units | Synthesis-based power model |\n| Main Memory | GDDR5/GDDR3 | Empirical model |\n| Main Memory | Memory Controller Network-on-chip | McPAT model |\n\n", "text": "| Description|Microarchitectural Components|Basic Structures|\n| ---|---|---|\n| SM Pipeline|Pipeline|In-order multithreaded pipeline with SIMD datapath|\n| Register Files|Register-file banks Operand collectors Collection network|1024-bit wide, 64-entry SRAM 1024-bit wide SRAM 1024-bit wide 16 x 16 crossbar|\n| Shared Memory|Shared memory banks Shared memory network|Architecture dependent size 32 x 32 crossbar network|\n| Caches|L1, L2, texture, and constant caches|Architecture dependent size|\n| Caches|Memory-coalescing logic|Synthesis-based power model|\n| Execution Unit|Integer ALUs Floating-point units Special-function units|Synthesis-based power model|\n| Main Memory|GDDR5/GDDR3|Empirical model|\n| Main Memory|Memory Controller Network-on-chip|McPAT model|\n", "alignment": "left", "unique_id": "adfe5d02cb5fb62fe6351c6ead2b014f", "edited": false, "extra": {"numCol
