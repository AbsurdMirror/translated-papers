lock_id": "87d148a292c35684ef0b6980fc19692b", "index": 107, "aliyun_index": 15, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "4. A call to a routine that restores the state of the thread from the stack (i.e. inverse function of the save routine).  \n\n", "text": "4. A call to a routine that restores the state of the thread from the stack (i.e. inverse function of the save routine).\n", "alignment": "left", "unique_id": "87d148a292c35684ef0b6980fc19692b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "4. A call to a routine that restores the state of the thread from the stack (i.e. inverse function of the save routine)."}], "lineHeight": 0}}, "target": {"markdown": "4. 调用一个例程，从栈中恢复线程的状态（即保存例程的逆操作）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 107}, {"source": {"block_id": "8cd51e2e42b43bfca894e0bf7ba81936", "index": 108, "aliyun_index": 16, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "5. Execution of the “relocated” original instruction (STS [R15], R8). Critically, if this relocated instruction is a relative control flow instruction, the offset must be adjusted to account for the new position and the original target location.  \n\n", "text": "5. Execution of the “relocated” original instruction (STS [R15], R8). Critically, if this relocated instruction is a relative control flow instruction, the offset must be adjusted to account for the new position and the original target location.\n", "alignment": "left", "unique_id": "8cd51e2e42b43bfca894e0bf7ba81936", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5. Execution of the “relocated” original instruction (STS [R15], R8). Critically, if this relocated instruction is a relative control flow instruction, the offset must be adjusted to account for the new position and the original target location."}], "lineHeight": 0}}, "target": {"markdown": "5. 执行\"重定位\"后的原始指令（STS [R15], R8）。关键在于，如果该重定位指令是一条相对控制流指令，则必须调整其偏移量，以适应新的位置和原始的目标地址。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 108}, {"source": {"block_id": "9efb775d5800aa1396b906392a00bcb5", "index": 109, "aliyun_index": 17, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "6. Finally, a return to the *instrumented code* at the next program counter after the relocated instruction (JMP NPC).  \n\n", "text": "6. Finally, a return to the *instrumented code* at the next program counter after the relocated instruction (JMP NPC).\n", "alignment": "left", "unique_id": "9efb775d5800aa1396b906392a00bcb5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6. Finally, a return to the *instrumented code* at the next program counter after the relocated instruction (JMP NPC)."}], "lineHeight": 0}}, "target": {"markdown": "6. 最后，返回到重定位指令之后的下一条程序计数器处的 *插桩代码*（JMP NPC）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 109}, {"source": {"block_id": "d22f2211dc53112ff36c1004acf0fa2b", "index": 110, "aliyun_index": 18, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "There is one trampoline per instrumented instruction, however for efficiency purposes the allocation of space for these trampolines is handled in bulk using a custom memory allocator. The content of these trampolines can vary depending on how many injection functions are inserted before or after the same GPU instructions and if the injection happens before, after, or in both locations. If the function nvbit_remove_orig is used (Listing 5), the \"relocated\" original instruction must also be converted into a NOP.  \n\n", "text": "There is one trampoline per instrumented instruction, however for efficiency purposes the allocation of space for these trampolines is handled in bulk using a custom memory allocator. The content of these trampolines can vary depending on how many injection functions are inserted before or after the same GPU instructions and if the injection happens before, after, or in both locations. If the function nvbit_remove_orig is used (Listing 5), the \"relocated\" original instruction must also be converted into a NOP.\n", "alignment": "left", "unique_id": "d22f2211dc53112ff36c1004acf0fa2b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "There is one trampoline per instrumented instruction, however for efficiency purposes the allocation of space for these trampolines is handled in bulk using a custom memory allocator. The content of these trampolines can vary depending on how many injection functions are inserted before or after the same GPU instructions and if the injection happens before, after, or in both locations. If the function nvbit_remove_orig is used (Listing 5), the \"relocated\" original instruction must also be converted into a NOP."}], "lineHeight": 0}}, "target": {"markdown": "每个被插桩的指令都有一个跳板代码，但为了提高效率，这些跳板代码的空间分配由一个自定义内存分配器以批量方式处理。这些跳板代码的内容可能会有所不同，具体取决于在同一 GPU 指令之前或之后插入了多少个注入函数，以及注入发生在指令之前、之后还是两者皆有。如果使用了 `nvbit_remove_orig` 函数（见代码清单 5），那么\"重定位\"后的原始指令还必须被转换为 NOP。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 110}, {"source": {"block_id": "2cc6ab912e3ae69a985593611c2bba0f", "index": 111, "aliyun_index": 19, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Code Loader/Unloader:** At run-time, the user can decide to enable or disable instrumentation for a particular *CUfunction*. The *Code Loader/Unloader* swaps *original code* with *instrumented code* on demand, based on the values passed to the control API *nvbit_enable_instrumented*. The cost of this operation is identical to that of a *cudaMemcpy* from host to device with the number of  \n\n", "text": "**Code Loader/Unloader:** At run-time, the user can decide to enable or disable instrumentation for a particular *CUfunction*. The *Code Loader/Unloader* swaps *original code* with *instrumented code* on demand, based on the values passed to the control API *nvbit_enable_instrumented*. The cost of this operation is identical to that of a *cudaMemcpy* from host to device with the number of\n", "alignment": "left", "unique_id": "2cc6ab912e3ae69a985593611c2bba0f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Code Loader/Unloader:** At run-time, the user can decide to enable or disable instrumentation for a particular *CUfunction*. The *Code Loader/Unloader* swaps *original code* with *instrumented code* on demand, based on the values passed to the control API *nvbit_enable_instrumented*. The cost of this operation is identical to that of a *cudaMemcpy* from host to device with the number of"}], "lineHeight": 0}}, "target": {"markdown": "**代码加载器/卸载器（Code Loader/Unloader）：** 在运行时，用户可以决定对特定的 *CUfunction* 启用或禁用插桩。*代码加载器/卸载器* 根据传递给控制 API *nvbit_enable_instrumented* 的值，按需在 *原始代码* 和 *插桩代码* 之间进行切换。此操作的开销与一次从主机到设备的 *cudaMemcpy* 操作相同，所传输的字节数为", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 111}, {"source": {"block_id": "74e445b3d37aff44396e8d673972a428", "index": 112, "aliyun_index": 2, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "bytes equal to the size of the original code. To allow swapping, both original code and instrumented code must have the exact number of bytes and occupy the exact same location in GPU memory. Only in this way can NVBit guarantee that absolute jumps in the program targeting the CUFunction will continue to work regardless of which version (instrumented or not) is running. The trampolines, since they are only created in device memory, are always GPU resident and do not need to be removed unless the control API nvbit_reset_instrumented is used or the C Umodule for this particular CUFunction is unloaded. The Code Loader/Unloader also computes the stack and register requirements for the kernel launch, based on which version of the code will be executing.  \n\n", "text": "bytes equal to the size of the original code. To allow swapping, both original code and instrumented code must have the exact number of bytes and occupy the exact same location in GPU memory. Only in this way can NVBit guarantee that absolute jumps in the program targeting the CUFunction will continue to work regardless of which version (instrumented or not) is running. The trampolines, since they are only created in device memory, are always GPU resident and do not need to be removed unless the control API nvbit_reset_instrumented is used or the C Umodule for this particular CUFunction is unloaded. The Code Loader/Unloader also computes the stack and register requirements for the kernel launch, based on which version of the code will be executing.\n", "alignment": "left", "unique_id": "74e445b3d37aff44396e8d673972a428", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "bytes equal to the size of the original code. To allow swapping, both original code and instrumented code must have the exact number of bytes and occupy the exact same location in GPU memory. Only in this way can NVBit guarantee that absolute jumps in the program targeting the CUFunction will continue to work regardless of which version (instrumented or not) is running. The trampolines, since they are only created in device memory, are always GPU resident and do not need to be removed unless the control API nvbit_reset_instrumented is used or the C Umodule for this particular CUFunction is unloaded. The Code Loader/Unloader also computes the stack and register requirements for the kernel launch, based on which version of the code will be executing."}], "lineHeight": 0}}, "target": {"markdown": "字节数等于原始代码的大小。为了支持切换，原始代码和插桩代码必须具有完全相同的字节数，并占用 GPU 内存中的同一位置。只有这样，NVBit 才能保证程序中指向该 CUFunction 的绝对跳转无论在运行哪个版本（插桩版或非插桩版）时都能继续工作。由于跳板代码仅在设备内存中创建，因此它们始终驻留在 GPU 上，除非调用控制 API `nvbit_reset_instrumented` 或该特定 CUFunction 对应的 CUmodule 被卸载，否则无需移除。代码加载器/卸载器还会根据即将执行的代码版本，计算该 kernel 启动所需的栈和寄存器资源。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 112}, {"source": {"block_id": "f53bdeeb470a00db3e5e48a63fe57f71", "index": 113, "aliyun_index": 3, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "### 5.2 JIT-Compilation Overhead\n", "text": "5.2 JIT-Compilation Overhead\n", "alignment": "left", "unique_id": "f53bdeeb470a00db3e5e48a63fe57f71", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.2 JIT-Compilation Overhead"}], "lineHeight": 0}}, "target": {"markdown": "### 5.2 JIT-Compilation Overhead\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 113}, {"source": {"block_id": "a5c49c70ef35a0e1b041294b148482ef", "index": 114, "aliyun_index": 4, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Binary instrumentation intrinsically introduces overheads, resulting in execution slowdown. NVBit overheads stem from two aspects (a) the cost of generating the instrumentation code (i.e. JIT-compilation overhead), and (b) the cost of running the instrumentation code. JIT-compilation overhead is one drawback to binary instrumentation versus compiler-based instrumentation where code generation happens offline. However, as we later demonstrate NVBit allows us to perform tasks that cannot be achieved with compiler based instrumentation. This section focuses on quantifying the JIT-compilation overhead, but later in Section 6.2 we discuss the overhead of running a specific NVBit tool and exemplify the use of sampling as one technique for reducing it. The overhead of running the instrumentation code depends on what the user is trying to accomplish with it (i.e. the body of the instrumentation function) and for this reason are extremely difficult to broadly quantify.  \n\n", "text": "Binary instrumentation intrinsically introduces overheads, resulting in execution slowdown. NVBit overheads stem from two aspects (a) the cost of generating the instrumentation code (i.e. JIT-compilation overhead), and (b) the cost of running the instrumentation code. JIT-compilation overhead is one drawback to binary instrumentation versus compiler-based instrumentation where code generation happens offline. However, as we later demonstrate NVBit allows us to perform tasks that cannot be achieved with compiler based instrumentation. This section focuses on quantifying the JIT-compilation overhead, but later in Section 6.2 we discuss the overhead of running a specific NVBit tool and exemplify the use of sampling as one technique for reducing it. The overhead of running the instrumentation code depends on what the user is trying to accomplish with it (i.e. the body of the instrumentation function) and for this reason are extremely difficult to broadly quantify.\n", "alignment": "left", "unique_id": "a5c49c70ef35a0e1b041294b148482ef", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Binary instrumentation intrinsically introduces overheads, resulting in execution slowdown. NVBit overheads stem from two aspects (a) the cost of generating the instrumentation code (i.e. JIT-compilation overhead), and (b) the cost of running the instrumentation code. JIT-compilation overhead is one drawback to binary instrumentation versus compiler-based instrumentation where code generation happens offline. However, as we later demonstrate NVBit allows us to perform tasks that cannot be achieved with compiler based instrumentation. This section focuses on quantifying the JIT-compilation overhead, but later in Section 6.2 we discuss the overhead of running a specific NVBit tool and exemplify the use of sampling as one technique for reducing it. The overhead of running the instrumentation code depends on what the user is trying to accomplish with it (i.e. the body of the instrumentation function) and for this reason are extremely difficult to broadly quantify."}], "lineHeight": 0}}, "target": {"markdown": "二进制插桩本质上会引入额外开销，从而导致执行速度下降。NVBit 的开销来自两个方面：(a) 生成插桩代码的成本（即 JIT 编译开销），以及 (b) 运行插桩代码的成本。JIT 编译开销是基于二进制的插桩相对于基于编译器的插桩所具有的一个缺点，因为后者的代码生成是在离线完成的。然而，正如后文将展示的，NVBit 能够支持那些基于编译器的插桩无法完成的任务。本节重点量化 JIT 编译开销；后续第 6.2 节将讨论运行特定 NVBit 工具所产生的开销，并以采样作为降低该开销的一种技术进行说明。运行插桩代码的开销取决于用户试图通过该代码完成的任务（即插桩函数的主体内容），因此很难对其进行全面的量化。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 114}, {"source": {"block_id": "1bbb033b9a67532a7e8b3fc419943daa", "index": 115, "aliyun_index": 5, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Within the NVBit's core, the JIT-compilation overhead can be divided into six components: (1) retrieving the original GPU code, (2) disassembling the GPU program, (3) converting the binary into the format presented to the developer via the NVBit API, (4) executing the C/C++ user code to inject instrumentation functions and arguments, (5) running the Code Generator to produce the final instrumented code and (6) swapping the original code with the instrumented code. While the components (1), (2), (3) and (6) depend on the characteristics of the application, the components (4) and (5) depend on how much of the application is being instrumented. For this evaluation we assume each kernel is instrumented once, with each instruction also instrumented once, which approximates a rough upper bound on the JIT-compilation overhead an NVBit's user might observe. This upper bound is not theoretical, but an extrapolation from our most demanding use cases.  \n\n", "text": "Within the NVBit's core, the JIT-compilation overhead can be divided into six components: (1) retrieving the original GPU code, (2) disassembling the GPU program, (3) converting the binary into the format presented to the developer via the NVBit API, (4) executing the C/C++ user code to inject instrumentation functions and arguments, (5) running the Code Generator to produce the final instrumented code and (6) swapping the original code with the instrumented code. While the components (1), (2), (3) and (6) depend on the characteristics of the application, the components (4) and (5) depend on how much of the application is being instrumented. For this evaluation we assume each kernel is instrumented once, with each instruction also instrumented once, which approximates a rough upper bound on the JIT-compilation overhead an NVBit's user might observe. This upper bound is not theoretical, but an extrapolation from our most demanding use cases.\n", "alignment": "left", "unique_id": "1bbb033b9a67532a7e8b3fc419943daa", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Within the NVBit's core, the JIT-compilation overhead can be divided into six components: (1) retrieving the original GPU code, (2) disassembling the GPU program, (3) converting the binary into the format presented to the developer via the NVBit API, (4) executing the C/C++ user code to inject instrumentation functions and arguments, (5) running the Code Generator to produce the final instrumented code and (6) swapping the original code with the instrumented code. While the components (1), (2), (3) and (6) depend on the characteristics of the application, the components (4) and (5) depend on how much of the application is being instrumented. For this evaluation we assume each kernel is instrumented once, with each instruction also instrumented once, which approximates a rough upper bound on the JIT-compilation overhead an NVBit's user might observe. This upper bound is not theoretical, but an extrapolation from our most demanding use cases."}], "lineHeight": 0}}, "target": {"markdown": "在 NVBit 的核心中，JIT 编译开销可以分为六个部分：(1) 获取原始 GPU 代码，(2) 对 GPU 程序进行反汇编，(3) 将二进制代码转换为通过 NVBit API 呈现给开发者的格式，(4) 执行用户的 C/C++ 代码以注入插桩函数和参数，(5) 运行代码生成器以生成最终的插桩代码，以及 (6) 将原始代码替换为插桩代码。其中，(1)、(2)、(3) 和 (6) 这几个部分取决于应用程序本身的特性，而 (4) 和 (5) 这两个部分则取决于应用程序被插桩的范围。在本评估中，我们假设每个 kernel 都被插桩一次，且每条指令也仅被插桩一次，这一假设近似给出了 NVBit 用户所可能观察到的 JIT 编译开销的一个粗略上界。该上界并非纯理论推导，而是从我们最具挑战性的使用场景中通过外推得出的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 115}, {"source": {"block_id": "47d307153ea7a5c60ff99ac34fcedbbb", "index": 116, "aliyun_index": 6, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Figure 5 shows the breakdown of the JIT-compilation overhead in the six components previously listed when applying the NVBit tool described in Listing 1. The selection of this NVBit tool is arbitrary, since JIT-compilation overhead depends on the amount of newly generated code (due to trampolines, jumps and arguments passing instructions) rather than the body of the instrumentation function (which is compiled offline). Using another instrumentation function, would result in a similar JIT-compilation overhead.  \n\n", "text": "Figure 5 shows the breakdown of the JIT-compilation overhead in the six components previously listed when applying the NVBit tool described in Listing 1. The selection of this NVBit tool is arbitrary, since JIT-compilation overhead depends on the amount of newly generated code (due to trampolines, jumps and arguments passing instructions) rather than the body of the instrumentation function (which is compiled offline). Using another instrumentation function, would result in a similar JIT-compilation overhead.\n", "alignment": "left", "unique_id": "47d307153ea7a5c60ff99ac34fcedbbb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5 shows the breakdown of the JIT-compilation overhead in the six components previously listed when applying the NVBit tool described in Listing 1. The selection of this NVBit tool is arbitrary, since JIT-compilation overhead depends on the amount of newly generated code (due to trampolines, jumps and arguments passing instructions) rather than the body of the instrumentation function (which is compiled offline). Using another instrumentation function, would result in a similar JIT-compilation overhead."}], "lineHeight": 0}}, "target": {"markdown": "图 5 展示了在应用代码清单 1 中所述的 NVBit 工具时，JIT 编译开销在前面列出的六个组成部分中的分解情况。对该 NVBit 工具的选择是任意的，因为 JIT 编译开销取决于新生成代码的数量（由跳板代码、跳转指令和参数传递指令产生），而与插桩函数的主体（该主体是离线编译的）无关。使用其他的插桩函数，所产生的 JIT 编译开销也基本类似。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 116}, {"source": {"block_id": "243d17a2d0f0df407465983c30a10f4e", "index": 117, "aliyun_index": 7, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "We benchmark using the OpenACC SpecAccel suite [34] selecting medium problem sizes, where each benchmark can complete in under one minute on a NVIDIA TITAN V GPU [31]. Selecting relatively short executing benchmarks ensures that the JIT-compilation  \n\n", "text": "We benchmark using the OpenACC SpecAccel suite [34] selecting medium problem sizes, where each benchmark can complete in under one minute on a NVIDIA TITAN V GPU [31]. Selecting relatively short executing benchmarks ensures that the JIT-compilation\n", "alignment": "left", "unique_id": "243d17a2d0f0df407465983c30a10f4e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We benchmark using the OpenACC SpecAccel suite [34] selecting medium problem sizes, where each benchmark can complete in under one minute on a NVIDIA TITAN V GPU [31]. Selecting relatively short executing benchmarks ensures that the JIT-compilation"}], "lineHeight": 0}}, "target": {"markdown": "我们使用 OpenACC SpecAccel 测试套件 [34] 进行基准测试，选用中等规模的问题，使得每个基准测试在 NVIDIA TITAN V GPU [31] 上都能在一分钟内完成运行。选择执行时间相对较短的基准测试可以确保 JIT 编译", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 117}, {"source": {"block_id": "5f92fc04aa0084eacc0c5dabd897b84d", "index": 118, "aliyun_index": 8, "page_num": 6, "type": "figure", "sub_type": "none", "markdown": "![5f92fc04aa0084eacc0c5dabd897b84d.jpeg](figures/5f92fc04aa0084eacc0c5dabd897b84d_3f640898.png)  \n\n", "text": "以下是根据您提供的堆叠柱状图提取并整理的合法 Markdown 格式内容，准确保留所有步骤、细节和数据结构：\n\n---\n\n# 性能 slowdown 分析（按组件分解）\n\n## 图表说明\n\n- **Y轴**：`% of Slowdown` —— 表示各程序在不同阶段造成的性能下降百分比。\n- **X轴**：列出多个基准测试程序名称，包括 `ostencil`, `olbm`, `omriq`, `md`, `palm`, `ep`, `clvrleaf`, `cg`, `seismic`, `sp`, `csp`, `miniGhost`, `ilbdc`, `swim`, 以及最后的 `Average`（平均值）。\n- **图例**：共6个组件，分别用不同颜色表示：\n  - `(1) instrs retrieval` — 蓝色\n  - `(2) disassemble` — 橙色\n  - `(3) conversion` — 灰色\n  - `(4) user injection` — 黄色\n  - `(5) code gen` — 浅蓝色\n  - `(6) instrs swap` — 绿色\n\n> 注：每个柱子是上述6个组件的堆叠总和，代表该程序总的 slowdown 百分比。\n\n---\n\n## 数据概览（近似值，基于视觉估算）\n\n以下为各程序中各组件贡献的 slowdown 百分比（单位：%），按从上到下顺序对应图例 (1)~(6)，但实际堆叠顺序为从下到上：\n\n### 示例解析（以 `ilbdc` 为例）：\n\n| 组件             | 颜色   | 近似占比 |\n|------------------|--------|----------|\n| (1) instrs retrieval | 蓝     | ~1%      |\n| (2) disassemble    | 橙     | ~10%     |\n| (3) conversion     | 灰     | ~1.5%    |\n| (4) user injection | 黄     | ~5%      |\n| (5) code gen       | 浅蓝   | ~2%      |\n| (6) instrs swap    | 绿     | ~1%      |\n| **总计**           |        | **~20.5%** |\n\n> 注意：由于是堆叠柱状图，实际读取时应从底部向上累加。例如，`ilbdc` 最底层是蓝色（instrs retrieval），然后依次叠加橙色、灰色等。\n\n---\n\n## 各程序详细 breakdown（近似值）\n\n我们按 X 轴顺序逐个列出每个程序的各组件贡献（从底到顶）：\n\n### 1. ostencil\n- (1) instrs retrieval: ~0.5%\n- (2) disassemble: ~5.5%\n- (3) conversion: ~0.5%\n- (4) user injection: ~2.5%\n- (5) code gen: ~1.5%\n- (6) instrs swap: ~0.5%\n→ **Total ≈ 11%**\n\n### 2. olbm\n- (1): ~0.2%\n- (2): ~0.8%\n- (3): ~0.1%\n- (4): ~0.1%\n- (5): ~0.1%\n- (6): ~0.1%\n→ **Total ≈ 1.4%**\n\n### 3. omriq\n- (1): ~0.3%\n- (2): ~1.2%\n- (3): ~0.2%\n- (4): ~0.3%\n- (5): ~0.2%\n- (6): ~0.1%\n→ **Total ≈ 2.3%**\n\n### 4. md\n- (1): ~0.1%\n- (2): ~0.2%\n- (3): ~0.05%\n- (4): ~0.05%\n- (5): ~0.05%\n- (6): ~0.05%\n→ **Total ≈ 0.5%**\n\n### 5. palm\n- (1): ~0.5%\n- (2): ~1.5%\n- (3): ~0.3%\n- (4): ~0.7%\n- (5): ~0.3%\n- (6): ~0.2%\n→ **Total ≈ 3.5%**\n\n### 6. ep\n- (1): ~0.1%\n- (2): ~0.5%\n- (3): ~0.1%\n- (4): ~0.1%\n- (5): ~0.1%\n- (6): ~0.1%\n→ **Total ≈ 1.0%**\n\n### 7. clvrleaf\n- (1): ~0.05%\n- (2): ~0.1%\n- (3): ~0.05%\n- (4): ~0.05%\n- (5): ~0.05%\n- (6): ~0.05%\n→ **Total ≈ 0.4%**\n\n### 8. cg\n- (1): ~0.5%\n- (2): ~2.5%\n- (3): ~0.5%\n- (4): ~1.5%\n- (5): ~0.5%\n- (6): ~0.5%\n→ **Total ≈ 6.0%**\n\n### 9. seismic\n- (1): ~0.5%\n- (2): ~4.5%\n- (3): ~0.5%\n- (4): ~2.0%\n- (5): ~1.0%\n- (6): ~0.5%\n→ **Total ≈ 9.0%**\n\n### 10. sp\n- (1): ~0.3%\n- (2): ~1.0%\n- (3): ~0.2%\n- (4): ~0.3%\n- (5): ~0.2%\n- (6): ~0.1%\n→ **Total ≈ 2.1%**\n\n### 11. csp\n- (1): ~0.5%\n- (2): ~1.5%\n- (3): ~0.3%\n- (4): ~0.7%\n- (5): ~0.3%\n- (6): ~0.2%\n→ **Total ≈ 3.5%**\n\n### 12. miniGhost\n- (1): ~0.3%\n- (2): ~0.8%\n- (3): ~0.2%\n- (4): ~0.2%\n- (5): ~0.1%\n- (6): ~0.1%\n→ **Total ≈ 1.7%**\n\n### 13. ilbdc ← 最高 slowdown\n- (1): ~1.0%\n- (2): ~10.0%\n- (3): ~1.5%\n- (4): ~5.0%\n- (5): ~2.0%\n- (6): ~1.0%\n→ **Total ≈ 20.5%**\n\n### 14. swim\n- (1): ~0.5%\n- (2): ~1.5%\n- (3): ~0.3%\n- (4): ~0.7%\n- (5): ~0.3%\n- (6): ~0.2%\n→ **Total ≈ 3.5%**\n\n### 15. Average\n- (1): ~0.5%\n- (2): ~2.5%\n- (3): ~0.5%\n- (4): ~1.5%\n- (5): ~0.5%\n- (6): ~0.5%\n→ **Total ≈ 6.0%**\n\n---\n\n## 关键观察\n\n- **最大 slowdown 出现在 `ilbdc`**，约 20.5%，其中主要贡献来自 `(2) disassemble`（~10%）和 `(4) user injection`（~5%）。\n- **最小 slowdown 出现在 `clvrleaf` 和 `md`**，均低于 1%。\n- **平均 slowdown 约为 6%**，主要由 `disassemble` 和 `user injection` 主导。\n- **`disassemble` 是普遍最大的开销项**，尤其在 `ilbdc`, `seismic`, `ostencil` 中显著。\n- **`instrs swap` 和 `code gen` 通常贡献较小**，但在某些程序如 `ilbdc` 中也有一定影响。\n\n---\n\n## 建议后续分析方向\n\n1. 对 `ilbdc` 进行深度剖析，优化 `disassemble` 和 `user injection` 阶段。\n2. 检查 `ostencil` 和 `seismic` 是否存在类似瓶颈。\n3. 考虑对低开销程序（如 `clvrleaf`, `md`）作为基线参考。\n4. 可进一步计算各组件在所有程序中的平均贡献比例，用于资源分配优化。\n\n---\n\n✅ 此 Markdown 文档完整保留了原始图表的所有信息层级、数值估计、结构关系与分析逻辑，可用于报告、演示或进一步数据处理。\n\n--- \n\n如需导出为 CSV、JSON 或生成精确数值表，请告知，我可继续协助转换。", "alignment": "left", "unique_id": "5f92fc04aa0084eacc0c5dabd897b84d", "edited": false, "extra": {}}, "target": {"markdown": "![5f92fc04aa0084eacc0c5dabd897b84d.jpeg](figures/5f92fc04aa0084eacc0c5dabd897b84d_3f640898.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 118}, {"source": {"block_id": "4bcd4ccd975bd284f3a2490a8905a6c3", "index": 119, "aliyun_index": 9, "page_num": 6, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 5: JIT-compilation overhead with respect to a native execution for the OpenACC SpecAccel benchmarks.  \n\n", "text": "Figure 5: JIT-compilation overhead with respect to a native execution for the OpenACC SpecAccel benchmarks.\n", "alignment": "left", "unique_id": "4bcd4ccd975bd284f3a2490a8905a6c3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 5: JIT-compilation overhead with respect to a native execution for the OpenACC SpecAccel benchmarks."}], "lineHeight": 0}}, "target": {"markdown": "> 图 5：相较于原生执行，OpenACC SpecAccel 基准测试的 JIT 编译开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 119}, {"source": {"block_id": "37cf8f1a129e468ed29df1b668fab519", "index": 120, "aliyun_index": 10, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "overhead is not dwarfed by long execution time of the application,\nthough this will obviously vary per application. Also, while the\nSpecAccel benchmarks have a CUDA native implementation we\nopted to use the OpenACC implementation to highlight that NVBit\nis agnostic to the high-level language used since it instruments\nbinaries.  \n\n", "text": "overhead is not dwarfed by long execution time of the application,\nthough this will obviously vary per application. Also, while the\nSpecAccel benchmarks have a CUDA native implementation we\nopted to use the OpenACC implementation to highlight that NVBit\nis agnostic to the high-level language used since it instruments\nbinaries.\n", "alignment": "left", "unique_id": "37cf8f1a129e468ed29df1b668fab519", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "overhead is not dwarfed by long execution time of the application,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "though this will obviously vary per application. Also, while the"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SpecAccel benchmarks have a CUDA native implementation we"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "opted to use the OpenACC implementation to highlight that NVBit"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "is agnostic to the high-level language used since it instruments"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "binaries."}], "lineHeight": -153}}, "target": {"markdown": "开销不会被应用程序自身的较长执行时间所掩盖，尽管这显然会因应用程序而异。此外，虽然 SpecAccel 基准测试本身包含 CUDA 原生实现，我们仍选择使用其 OpenACC 实现，以突出 NVBit 对所使用的高级语言保持无关性，因为它直接对二进制代码进行插桩。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 120}, {"source": {"block_id": "c37d5537720f952ececfb6a511352088", "index": 121, "aliyun_index": 11, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "We see that, on average, the JIT-compilation overhead is below 5%, but in some cases can reach 20%. Because in this evaluation we instrumented each kernel once, the JIT-compilation overhead is higher when the application is composed of many unique kernels (which is the case for the ilbdc application). This is further exacerbated when these kernels execute only once and are short, for instance when launched with a small number of thread blocks. For all of these applications, the biggest contributor to the JIT-compilation overhead is the disassembly phase, which converts the GPU binary code into the intermediate representation used internally by NVBit.  \n\n", "text": "We see that, on average, the JIT-compilation overhead is below 5%, but in some cases can reach 20%. Because in this evaluation we instrumented each kernel once, the JIT-compilation overhead is higher when the application is composed of many unique kernels (which is the case for the ilbdc application). This is further exacerbated when these kernels execute only once and are short, for instance when launched with a small number of thread blocks. For all of these applications, the biggest contributor to the JIT-compilation overhead is the disassembly phase, which converts the GPU binary code into the intermediate representation used internally by NVBit.\n", "alignment": "left", "unique_id": "c37d5537720f952ececfb6a511352088", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We see that, on average, the JIT-compilation overhead is below 5%, but in some cases can reach 20%. Because in this evaluation we instrumented each kernel once, the JIT-compilation overhead is higher when the application is composed of many unique kernels (which is the case for the ilbdc application). This is further exacerbated when these kernels execute only once and are short, for instance when launched with a small number of thread blocks. For all of these applications, the biggest contributor to the JIT-compilation overhead is the disassembly phase, which converts the GPU binary code into the intermediate representation used internally by NVBit."}], "lineHeight": 0}}, "target": {"markdown": "我们看到，平均而言，JIT 编译开销低于 5%，但在某些情况下可能达到 20%。由于在本评估中我们对每个 kernel 只插桩一次，因此当应用程序由许多不同的 kernel 组成时（如 ilbdc 应用所示），JIT 编译开销会更高。当这些 kernel 仅执行一次且执行时间很短时（例如以较少数量的线程块启动），情况会进一步加剧。对于所有这些应用而言，JIT 编译开销的最大来源是反汇编阶段，它负责将 GPU 二进制代码转换为 NVBit 内部所使用的中间表示形式。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 121}, {"source": {"block_id": "8a763fd0b8bfdfc3cd087063751e8f32", "index": 122, "aliyun_index": 12, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "## 6 NVBIT TOOLS: USE CASE EXAMPLES\n", "text": "6 NVBIT TOOLS: USE CASE EXAMPLES\n", "alignment": "left", "unique_id": "8a763fd0b8bfdfc3cd087063751e8f32", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6 NVBIT TOOLS: USE CASE EXAMPLES"}], "lineHeight": 0}}, "target": {"markdown": "## 6 NVBIT 工具：使用案例示例\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 122}, {"source": {"block_id": "01ad124ca655eaf26865dfdfc40ff229", "index": 123, "aliyun_index": 13, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "This section presents three use-cases of NVBit, emphasizing its unique capabilities such as support of pre-compiled libraries, sampling and instruction emulation.  \n\n", "text": "This section presents three use-cases of NVBit, emphasizing its unique capabilities such as support of pre-compiled libraries, sampling and instruction emulation.\n", "alignment": "left", "unique_id": "01ad124ca655eaf26865dfdfc40ff229", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section presents three use-cases of NVBit, emphasizing its unique capabilities such as support of pre-compiled libraries, sampling and instruction emulation."}], "lineHeight": 0}}, "target": {"markdown": "本节将展示 NVBit 的三个使用案例，重点突出其独特的功能，例如对预编译库的支持、采样以及指令模拟。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 123}, {"source": {"block_id": "a86675053379c5fcf7542461c9d82acf", "index": 124, "aliyun_index": 14, "page_num": 6, "type": "title", "sub_type": "none", "markdown": "### 6.1 Memory Access Address Divergence\n", "text": "6.1 Memory Access Address Divergence\n", "alignment": "left", "unique_id": "a86675053379c5fcf7542461c9d82acf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6.1 Memory Access Address Divergence"}], "lineHeight": 0}}, "target": {"markdown": "### 6.1 内存访问地址发散\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 124}, {"source": {"block_id": "a049b0544d39bc21837e34cf02afb852", "index": 125, "aliyun_index": 15, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "Understanding memory access patterns is very important when optimizing applications or designing memory subsystems. NVBit allows one to easily extract this information by instrumenting every memory operation to collect reference addresses, which then can be analyzed directly on the GPU or sent to the CPU for further processing. Entire cache simulators can be built around these mechanisms. Listing 8 shows an NVBit tool that computes the number of unique cache lines requested for each warp-level global memory instruction. An application that requires many cache lines per warp-level memory instruction will perform less efficiently than one which only requires one line.  \n\n", "text": "Understanding memory access patterns is very important when optimizing applications or designing memory subsystems. NVBit allows one to easily extract this information by instrumenting every memory operation to collect reference addresses, which then can be analyzed directly on the GPU or sent to the CPU for further processing. Entire cache simulators can be built around these mechanisms. Listing 8 shows an NVBit tool that computes the number of unique cache lines requested for each warp-level global memory instruction. An application that requires many cache lines per warp-level memory instruction will perform less efficiently than one which only requires one line.\n", "alignment": "left", "unique_id": "a049b0544d39bc21837e34cf02afb852", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Understanding memory access patterns is very important when optimizing applications or designing memory subsystems. NVBit allows one to easily extract this information by instrumenting every memory operation to collect reference addresses, which then can be analyzed directly on the GPU or sent to the CPU for further processing. Entire cache simulators can be built around these mechanisms. Listing 8 shows an NVBit tool that computes the number of unique cache lines requested for each warp-level global memory instruction. An application that requires many cache lines per warp-level memory instruction will perform less efficiently than one which only requires one line."}], "lineHeight": 0}}, "target": {"markdown": "理解内存访问模式对于优化应用程序或设计内存子系统而言至关重要。NVBit 使我们能够通过为每一条内存操作进行插桩来轻松地提取相关信息，收集所访问的引用地址，然后可以直接在 GPU 上进行分析，或将其送回 CPU 进行进一步处理。基于这些机制可以构建出完整的缓存模拟器。代码清单 8 展示了一个 NVBit 工具，该工具能够针对每个 warp 级别的全局内存指令，计算其所请求的不同 cache line 的数量。对于每个 warp 级别内存指令而言，若其需要访问的 cache line 数量较多，则该应用程序的运行效率将明显低于那些每条指令仅需访问一条 cache line 的应用程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 125}, {"source": {"block_id": "12c0f99553c730d3bf32aef3568fe8eb", "index": 126, "aliyun_index": 16, "page_num": 6, "type": "text", "sub_type": "none", "markdown": "In Line 7, the instrumentation function ifunc takes four arguments: a predicate value, two register values, and one immediate. The values for these arguments will be set at run-time on each instrumented memory instruction. A false predicate value means that the instrumented instruction is not actually executing so the  \n\n", "text": "In Line 7, the instrumentation function ifunc takes four arguments: a predicate value, two register values, and one immediate. The values for these arguments will be set at run-time on each instrumented memory instruction. A false predicate value means that the instrumented instruction is not actually executing so the\n", "alignment": "left", "unique_id": "12c0f99553c730d3bf32aef3568fe8eb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In Line 7, the instrumentation function ifunc takes four arguments: a predicate value, two register values, and one immediate. The values for these arguments will be set at run-time on each instrumented memory instruction. A false predicate value means that the instrumented instruction is not actually executing so the"}], "lineHeight": 0}}, "target": {"markdown": "在第 7 行中，插桩函数 ifunc 接收四个参数：一个谓词值、两个寄存器值和一个立即数。这些参数的值将在每条被插桩的内存指令运行时动态设置。谓词值为假意味着该被插桩的指令实际上并未执行，因此", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 126}, {"source": {"block_id": "187714b55a56c816d23cfc1d7fb3ff7c", "index": 127, "aliyun_index": 2, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "```c\n/* counters for unique cache lines accessed and for\nthe number of memory instructions executed */\n__managed __float __uniq_lines = 0;\n__managed __long mem_instrs = 0;\n\nextern \"C\" __device __noinline\nvoid ifunc(int pred, int r1, int r2, int imm) {\n    /* Return if predicate is false */\n    if (!pred) return;\n\n    /* Construct address */\n    long addr = ((long)r1) | ((long)r2 << 32)) + imm;\n\n    /* Compute active mask of the warp */\n    int mask = __ballot(1);\n\n    /* Only the first active thread in the warp\n    increments the memory instruction counter */\n    if (get_lane_id() == __ffs(mask) - 1)\n        atomicAdd(&mem_instrs, 1);\n\n    /* Count how many threads in the warp access\n    the same cache line */\n    long cache_addr = addr >> LOG2_CACHE_LINE_SIZE;\n    int cnt = __popc(__match_any_sync(mask, cache_addr));\n\n    /* Each thread contributes proportionally to the\n    cache line counter */\n    atomicAdd(&uniq_lines, 1.0f / cnt);\n} NVBIT_EXPORT_DEV_FUNC(ifunc);\n\nvoid nvbit_at_cuda_driver_call(CUcontext ctx,\n                                int is_exit, cbid_t cbid, const char *name,\n                                void *params, CUresult *pStatus) {\n\n    /* OMITTING CODE: same as Listing 1, Lines 20-30 */\n    /* Iterate over kernel's instructions */\n    for (auto &i: nvbit_get_instrs(ctx, p->func)) {\n        /* If instr isn't global memory operation skip */\n        if (i->getMemOpType() != Instr::GLOBAL) continue;\n        /* Iterate on operands of instruction */\n        for (int n = 0; n < i->getNumOperands(); n++) {\n            operand_t *op = i->getOperand(n);\n            /* If operand isn't a memory reference skip */\n            if (op->type != Instr::MREF) continue;\n            /* Inject instrumentation and its arguments */\n            nvbit_insert_call(i, \"ifunc\", IPOINT_BEFORE);\n            nvbit_add_call_arg(PRED_VAL);\n            nvbit_add_call_arg(REG_VAL, op->val[0]);\n            nvbit_add_call_arg(REG_VAL, op->val[0] + 1);\n            nvbit_add_call_arg(imm32, op->val[1]);\n        }}\n    }\n\n    void nvbit_at_term() {\n        printf(\"Average cache lines requests per memory \"\n               \"instruction %f\\n\", uniq_lines/mem_instrs);\n    }\n}\n```\n", "text": "/* counters for unique cache lines accessed and for\nthe number of memory instructions executed */\n__managed __float __uniq_lines = 0;\n__managed __long mem_instrs = 0;\n\nextern \"C\" __device __noinline\nvoid ifunc(int pred, int r1, int r2, int imm) {\n    /* Return if predicate is false */\n    if (!pred) return;\n\n    /* Construct address */\n    long addr = ((long)r1) | ((long)r2 << 32)) + imm;\n\n    /* Compute active mask of the warp */\n    int mask = __ballot(1);\n\n    /* Only the first active thread in the warp\n    increments the memory instruction counter */\n    if (get_lane_id() == __ffs(mask) - 1)\n        atomicAdd(&mem_instrs, 1);\n\n    /* Count how many threads in the warp access\n    the same cache line */\n    long cache_addr = addr >> LOG2_CACHE_LINE_SIZE;\n    int cnt = __popc(__match_any_sync(mask, m_instrs);\n    }\n}\n```", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 127}, {"source": {"block_id": "fa681a818f303f876499581a4f9b9de4", "index": 128, "aliyun_index": 3, "page_num": 7, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 8: Memory access address divergence. It computes the average number of cache lines requested per warp-level memory instruction.  \n\n", "text": "Listing 8: Memory access address divergence. It computes the average number of cache lines requested per warp-level memory instruction.\n", "alignment": "left", "unique_id": "fa681a818f303f876499581a4f9b9de4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 8: Memory access address divergence. It computes the average number of cache lines requested per warp-level memory instruction."}], "lineHeight": 0}}, "target": {"markdown": "> 代码清单 8：内存访问地址发散。该工具计算每条 warp 级别内存指令所请求的平均 cache line 数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 128}, {"source": {"block_id": "d6db6029612113d60e0aaf2a29675d49", "index": 129, "aliyun_index": 4, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "ifunc returns immediately (Line 9). In Line 12, the memory reference address is constructed by combining the two register values and the immediate. A mask of all the active threads in the warp is computed (Line 15), and is then used to select a single leader thread that atomically increments the global memory reference counter (line 20). Each thread computes the cache line address it accesses (Line 24) and it \"reduces\" it to a single value using special warp-level CUDA intrinsics (Lin
