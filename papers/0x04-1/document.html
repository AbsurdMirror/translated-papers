PI: functions used to retrieve instructions and related CUfunctions.\n", "alignment": "left", "unique_id": "d832f2a347891e7c642b1667fe3585be", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 3: Inspection API: functions used to retrieve instructions and related CUfunctions."}], "lineHeight": 0}}, "target": {"markdown": "### 清单 3：检查 API：用于获取指令及相关 CUfunctions 的函数。\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 69}, {"source": {"block_id": "237b48ba33898ee195b0c682cd81b52c", "index": 70, "aliyun_index": 6, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "APIs in detail. The user can inspect and instrument the CUDA functions of the current running application using the CUDA driver callbacks. For instance, when a kernel is launched, a callback to nvbit_at_cuda_driver_call occurs with one of the parameters being the CUDA function launched (i.e. kernel). NVBit's callback interface uses similar event enumerations as CUPTI [28] which should make NVBit easy to use for current GPU programmers.  \n\n", "text": "APIs in detail. The user can inspect and instrument the CUDA functions of the current running application using the CUDA driver callbacks. For instance, when a kernel is launched, a callback to nvbit_at_cuda_driver_call occurs with one of the parameters being the CUDA function launched (i.e. kernel). NVBit's callback interface uses similar event enumerations as CUPTI [28] which should make NVBit easy to use for current GPU programmers.\n", "alignment": "left", "unique_id": "237b48ba33898ee195b0c682cd81b52c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "APIs in detail. The user can inspect and instrument the CUDA functions of the current running application using the CUDA driver callbacks. For instance, when a kernel is launched, a callback to nvbit_at_cuda_driver_call occurs with one of the parameters being the CUDA function launched (i.e. kernel). NVBit's callback interface uses similar event enumerations as CUPTI [28] which should make NVBit easy to use for current GPU programmers."}], "lineHeight": 0}}, "target": {"markdown": "API 的详细信息。用户可以使用 CUDA 驱动回调来检查和插桩当前正在运行的应用程序的 CUDA 函数。例如，当某个内核被启动时，会触发一次对 `nvbit_at_cuda_driver_call` 的回调，其中一个参数为所启动的 CUDA 函数（即内核）。NVBit 的回调接口使用了与 CUPTI [28] 类似的事件枚举，这应当能使现有 GPU 程序员易于上手使用 NVBit。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 70}, {"source": {"block_id": "14fefe634aef9599671195aeac965717", "index": 71, "aliyun_index": 7, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "**Inspection API:** Listing 3 shows the main Inspection API which allows users to retrieve and inspect the instructions composing a CUfunction. The inspection API provides two different views of CUfunction bodies. One view presents the body as a flat vector of the CUfunction's instructions, in program order. In the absence of indirect control flow (ICF) instructions, this API can alternatively return the body as a vector of vectors of instructions, where each sub-vector represents a basic block. A basic block is an uninterrupted sequence of instructions, including predicated instructions, that each thread will execute without change in control flow. Basic blocks are generated from the static instructions of a kernel by grouping consecutive (program counters) PCs up to (a) the PC before a control flow instruction (b) the PC which is target of a control flow instruction. ICF instructions are the exception where this is not possible because they use register values to compute the final target address (which can only be discovered when the instruction is executed). In this case the basic block will also return the simpler flat view of the CUfunction, but we find the use of ICF instructions is uncommon and this condition is rarely encountered. Since a CUfunction can also call other CUfunctions, the Inspection API provides a call to retrieve them (nvbit_get_related_funcs). Once the function instructions have been retrieved, the instrumentation function can inspect them to understand their properties. NVBit provides a class Instr that abstracts the actual machine level SASS instruction (which can vary across GPU families) by disassembling and transforming the instructions using a higher level user-friendly intermediate representation. Listing 4 shows the main methods  \n\n", "text": "**Inspection API:** Listing 3 shows the main Inspection API which allows users to retrieve and inspect the instructions composing a CUfunction. The inspection API provides two different views of CUfunction bodies. One view presents the body as a flat vector of the CUfunction's instructions, in program order. In the absence of indirect control flow (ICF) instructions, this API can alternatively return the body as a vector of vectors of instructions, where each sub-vector represents a basic block. A basic block is an uninterrupted sequence of instructions, including predicated instructions, that each thread will execute without change in control flow. Basic blocks are generated from the static instructions of a kernel by grouping consecutive (program counters) PCs up to (a) the PC before a control flow instruction (b) the PC which is target of a control flow instruction. ICF instructions are the exception where this is not possible because they use register values to compute the final target address (which can only be discovered when the instruction is executed). In this case the basic block will also return the simpler flat view of the CUfunction, but we find the use of ICF instructions is uncommon and this condition is rarely encountered. Since a CUfunction can also call other CUfunctions, the Inspection API provides a call to retrieve them (nvbit_get_related_funcs). Once the function instructions have been retrieved, the instrumentation function can inspect them to understand their properties. NVBit provides a class Instr that abstracts the actual machine level SASS instruction (which can vary across GPU families) by disassembling and transforming the instructions using a higher level user-friendly intermediate representation. Listing 4 shows the main methods\n", "alignment": "left", "unique_id": "14fefe634aef9599671195aeac965717", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Inspection API:** Listing 3 shows the main Inspection API which allows users to retrieve and inspect the instructions composing a CUfunction. The inspection API provides two different views of CUfunction bodies. One view presents the body as a flat vector of the CUfunction's instructions, in program order. In the absence of indirect control flow (ICF) instructions, this API can alternatively return the body as a vector of vectors of instructions, where each sub-vector represents a basic block. A basic block is an uninterrupted sequence of instructions, including predicated instructions, that each thread will execute without change in control flow. Basic blocks are generated from the static instructions of a kernel by grouping consecutive (program counters) PCs up to (a) the PC before a control flow instruction (b) the PC which is target of a control flow instruction. ICF instructions are the exception where this is not possible because they use register values to compute the final target address (which can only be discovered when the instruction is executed). In this case the basic block will also return the simpler flat view of the CUfunction, but we find the use of ICF instructions is uncommon and this condition is rarely encountered. Since a CUfunction can also call other CUfunctions, the Inspection API provides a call to retrieve them (nvbit_get_related_funcs). Once the function instructions have been retrieved, the instrumentation function can inspect them to understand their properties. NVBit provides a class Instr that abstracts the actual machine level SASS instruction (which can vary across GPU families) by disassembling and transforming the instructions using a higher level user-friendly intermediate representation. Listing 4 shows the main methods"}], "lineHeight": 0}}, "target": {"markdown": "**检查 API：** 清单 3 展示了主要的检查 API，它允许用户检索并检查构成一个 CUfunction 的指令。检查 API 提供了两种不同的视图来呈现 CUfunction 的函数体。其中一种视图将函数体表示为该 CUfunction 指令的扁平向量，按程序顺序排列。在不存在间接控制流（ICF）指令的情况下，该 API 还可以将函数体作为指令向量的向量返回，其中每个子向量代表一个基本块。基本块是一段连续不断的指令序列（包括谓词执行指令），每个线程将在不改变控制流的情况下执行这些指令。基本块由内核的静态指令通过将连续的（程序计数器）PC 分组来生成，分组依据为：(a) 控制流指令前一条 PC；(b) 作为控制流指令目标的 PC。ICF 指令是例外情况，由于它们使用寄存器值来计算最终的目标地址（该地址只能在指令执行时才能确定），因此无法按上述方式生成基本块。在这种情况下，基本块视图同样会回退为该 CUfunction 的扁平视图，但我们发现 ICF 指令的使用并不常见，因此很少遇到这种情形。由于一个 CUfunction 还可以调用其他 CUfunctions，检查 API 提供了一个调用来检索它们（即 `nvbit_get_related_funcs`）。一旦获取了函数的指令，插桩函数便可对这些指令进行检查，以了解其属性。NVBit 提供了一个 `Instr` 类，该类通过反汇编并使用更高级别、更易于用户理解的中间表示来转换指令，从而将实际的机器级 SASS 指令（可能因 GPU 系列而异）抽象出来。清单 4 展示了主要的方法", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 71}, {"source": {"block_id": "0388390bcecf47290adbb91d61dbd6d8", "index": 72, "aliyun_index": 8, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "```c\ncpp\nclass Instr {\npublic:\n    /* memory operation type */\n    enum memOpType { NONE, LOCAL, GENERIC, GLOBAL,\n                    SHARED, TEXTURE, CONSTANT};\n\n    /* operand type */\n    enum operandType {\n        IMM,   // val[0] = immediate\n        REG,   // val[0] = register number\n        PRED, // val[0] = predicate register number\n        CBANK, // val[0] = constant bank id\n        // val[1] = constant bank offset\n        SREG,  // val[0] = special register number\n        MREF,  // val[0] = ra (register base)\n        // val[1] = imm (immediate)\n        // Addr [Rval[ra]](Rval[ra+1]&<32)] + imm\n    };\n\n    /* operand structure */\n    typedef struct {\n        operandType type; /* operand type */\n        bool is_neg;      /* is negative */\n        bool is_abs;      /* is absolute */\n        long val[2];      /* value */\n    } operand_t;\n\n    /* returns the \"string\" containing the SASS\n        (i.e. IMAD.WIDE R8, R8, R9) */\n    const char* getSass();\n\n    /* returns the offset in bytes of this instruction\n        within the function */\n    uint32_t getOffset();\n\n    /* returns the id of this instruction within the function */\n    uint32_t getID();\n\n    /* returns true if instruction uses a predicate */\n    bool hasPred();\n\n    /* returns the predicate number,\n        only valid if hasPred() == true */\n    int getPredNum();\n\n    /* returns true if predicate is negated (i.e. @!P0),\n        only valid if hasPred() == true */\n    bool isPredNeg();\n\n    /* returns the full opcode (i.e. IMAD.WIDE) */\n    const char* getOpcode();\n\n    /* returns type of memory operation memOpType_t */\n    memOpType getMemOpType();\n\n    /* returns true if memory operation is a load */\n    bool isLoad();\n\n    /* returns true if memory operation is a store */\n    bool isStore();\n\n    /* returns the #bytes of the memory operation */\n    int getMemOpBytes();\n\n    /* returns the number of operands */\n    int getNumOperands();\n\n    /* gets a specific operand */\n    const operand_t* getOperand(int num_operand);\n\n    /* gets line info, binary must be compiled with\n        option (-generate-line-info/-lineinfo) */\n    void getLineInfo(char** file, uint32_t* line);\n}\n```\n", "text": "cpp\nclass Instr {\npublic:\n    /* memory operation type */\n    enum memOpType { NONE, LOCAL, GENERIC, GLOBAL,\n                    SHARED, TEXTURE, CONSTANT};\n\n    /* operand type */\n    enum operandType {\n        IMM,   // val[0] = immediate\n        REG,   // val[0] = register number\n        PRED, // val[0] = predicate register number\n        CBANK, // val[0] = constant bank id\n        // val[1] = constant bank offset\n        SREG,  // val[0] = special register number\n        MREF,  // val[0] = ra (register base)\n        // val[1] = imm (immediate)\n        // Addr [Rval[ra]](Rval[ra+1]&<32)] + imm\n    };\n\n    /* operand structure */\n    typedef struct {\n        operandType type; /* operand type */\n        bool is_neg;      /* is negative */\n        bool is_abs;      /* is absolute */\n        long val[2];      /* value */\n    } operand_t;\n\n    /* returns the \"string\" containing the SASS\n        (i.e. IMAD.WIDE R8, R8, R9) */\n    const char* getSass();\n\n    /* returns the offset in bytes of this instruction\n        within the function */\n    uint32_t getOffset();\n\n    /* returns the id of this instruction within the function */\n    uint32_t getID();\n\n    /* returns true if instruction uses a predicate */\n    bool hasPred();\n\n    /* returns the predicate number,\n        only valid if hasPred() == true */\n    int getPredNum();\n\n    /* returns true if predicate is negated (i.e. @!P0),\n        only valid if hasPred() == true */\n    bool isPredNeg();\n\n    /* returns the full opcode (i.e. IMAD.WIDE) */\n    const char* getOpcode();\n\n    /* returns type of memory operation memOpType_t */\n    memOpType getMemOpType();\n\n    /* returns true if memory operation is a load */\n    bool isLoad();\n\n    /* returns true if memory operation is a store */\n    bool isStore();\n\n    /* returns the #bytes of the memory operation */\n    int getMemOpBytes();\n\n    /* returns the number of operands */\n    int getNumOperands();\n\n    /* gets a specific operand */\n    const operand_t* getOperand(int num_operand);\n\n    /* gets line info, binary must be compiled with\n        option (-generate-line-info/-lineinfo) */\n    void getLineInfo(char** file, uint32_t* line);\n}\n", "alignment": "left", "unique_id": "0388390bcecf47290adbb91d61dbd6d8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "cpp"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "class Instr {"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "public:"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* memory operation type */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    enum memOpType { NONE, LOCAL, GENERIC, GLOBAL,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "                    SHARED, TEXTURE, CONSTANT};"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* operand type */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    enum operandType {"}, {"style lor": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    int getPredNum();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns true if predicate is negated (i.e. @!P0),"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "        only valid if hasPred() == true */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    bool isPredNeg();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns the full opcode (i.e. IMAD.WIDE) */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    const char* getOpcode();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns type of memory operation memOpType_t */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    memOpType getMemOpType();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns true if memory operation is a load */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    bool isLoad();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns true if memory operation is a store */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    bool isStore();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns the #bytes of the memory operation */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    int getMemOpBytes();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* returns the number of operands */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    int getNumOperands();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* gets a specific operand */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    const operand_t* getOperand(int num_operand);"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    /* gets line info, binary must be compiled with"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "        option (-generate-line-info/-lineinfo) */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "    void getLineInfo(char** file, uint32_t* line);"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "}"}], "lineHeight": -1014}}, "target": {"markdown": "```cpp\nclass Instr {\npublic:\n    /* 内存操作类型 */\n    enum memOpType { NONE, LOCAL, GENERIC, GLOBAL,\n                    SHARED, TEXTURE, CONSTANT};\n\n    /* 操作数类型 */\n    enum operandType {\n        IMM,   // val[0] = 立即数\n        REG,   // val[0] = 寄存器编号\n        PRED, // val[0] = 谓词寄存器编号\n        CBANK, // val[0] = 常量库 id\n        // val[1] = 常量库偏移量\n        SREG,  // val[0] = 特殊寄存器编号\n        MREF,  // val[0] = ra（寄存器基址）\n        // val[1] = imm（立即数）\n        // Addr [Rval[ra]](Rval[ra+1]&<32)] + imm\n    };\n\n    /* 操作数结构 */\n    typedef struct {\n        operandType type; /* 操作数类型 */\n        bool is_neg;      /* 是否为负 */\n        bool is_abs;      /* 是否取绝对值 */\n        long val[2];      /* 值 */\n    } operand_t;\n\n    /* 返回包含 SASS 的\"字符串\"\n        （例如 IMAD.WIDE R8, R8, R9） */\n    const char* getSass();\n\n    /* 返回该指令在函数内的偏移量（字节为单位） */\n    uint32_t getOffset();\n\n    /* 返回该指令在函数内的 id */\n    uint32_t getID();\n\n    /* 如果指令使用了谓词，则返回 true */\n    bool hasPred();\n\n    /* 返回谓词编号，\n        仅当 hasPred() == true 时有效 */\n    int getPredNum();\n\n    /* 如果谓词被取反（例如 @!P0），则返回 true，\n        仅当 hasPred() == true 时有效 */\n    bool isPredNeg();\n\n    /* 返回完整操作码（例如 IMAD.WIDE） */\n    const char* getOpcode();\n\n    /* 返回内存操作的类型 memOpType_t */\n    memOpType getMemOpType();\n\n    /* 如果内存操作为加载操作，则返回 true */\n    bool isLoad();\n\n    /* 如果内存操作为存储操作，则返回 true */\n    bool isStore();\n\n    /* 返回内存操作的字节数 */\n    int getMemOpBytes();\n\n    /* 返回操作数的数量 */\n    int getNumOperands();\n\n    /* 获取特定操作数 */\n    const operand_t* getOperand(int num_operand);\n\n    /* 获取行号信息，编译二进制时必须使用\n        选项（-generate-line-info/-lineinfo） */\n    void getLineInfo(char** file, uint32_t* line);\n}\n```", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 72}, {"source": {"block_id": "c33c43ce1d35f03a568eab3e6107c7cf", "index": 73, "aliyun_index": 9, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### Listing 4: Inspection API: Class Instr used to abstract machine level SASS instruction.\n", "text": "Listing 4: Inspection API: Class Instr used to abstract machine level SASS instruction.\n", "alignment": "left", "unique_id": "c33c43ce1d35f03a568eab3e6107c7cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 4: Inspection API: Class Instr used to abstract machine level SASS instruction."}], "lineHeight": 0}}, "target": {"markdown": "### 清单 4：检查 API：用于对机器级 SASS 指令进行抽象的 Instr 类。\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 73}, {"source": {"block_id": "4f8bdedc43380a1565a0d1557a53d909", "index": 74, "aliyun_index": 10, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "(but not all) of the Instrs class. NVBite ensures a one-to-one mapping between SASS instructions and high level Instrs. An Instr can be correlated to the application source code using the method Instr::getLineInfo, which provides file name and line number, provided this information has not been stripped from the application's binary.  \n\n", "text": "(but not all) of the Instrs class. NVBite ensures a one-to-one mapping between SASS instructions and high level Instrs. An Instr can be correlated to the application source code using the method Instr::getLineInfo, which provides file name and line number, provided this information has not been stripped from the application's binary.\n", "alignment": "left", "unique_id": "4f8bdedc43380a1565a0d1557a53d909", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(but not all) of the Instrs class. NVBite ensures a one-to-one mapping between SASS instructions and high level Instrs. An Instr can be correlated to the application source code using the method Instr::getLineInfo, which provides file name and line number, provided this information has not been stripped from the application's binary."}], "lineHeight": 0}}, "target": {"markdown": "中 `Instr` 类的部分（但并非全部）方法。NVBit 确保了 SASS 指令与高层 `Instr` 之间的一一映射关系。可以通过 `Instr::getLineInfo` 方法将一个 `Instr` 与应用程序源码相关联，该方法会提供文件名和行号，前提是相关信息尚未从应用程序的二进制文件中被剥离。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 74}, {"source": {"block_id": "df26f1241ce3d626800eb1be0273a21b", "index": 75, "aliyun_index": 11, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "**Instrumentation API:** An instrumentation tool can use the Instrumentation API (Listing 5) to inject multiple device functions before or after, any or all of a *CUfunction*’s instructions. To inject a function, we use the *nvbit_insert_call*, and we specify the location (i.e. before or after an *Instr*) and the name of the function to inject. Instrumentation functions are injected by name because their code location (i.e. program counter) is unknown until run-time. We can add arguments to the just-injected function such as register values, predicate values, and immediate values using *nvbit_add_call_arg*. Argument passing is positional and it must match the signature of  \n\n", "text": "**Instrumentation API:** An instrumentation tool can use the Instrumentation API (Listing 5) to inject multiple device functions before or after, any or all of a *CUfunction*’s instructions. To inject a function, we use the *nvbit_insert_call*, and we specify the location (i.e. before or after an *Instr*) and the name of the function to inject. Instrumentation functions are injected by name because their code location (i.e. program counter) is unknown until run-time. We can add arguments to the just-injected function such as register values, predicate values, and immediate values using *nvbit_add_call_arg*. Argument passing is positional and it must match the signature of\n", "alignment": "left", "unique_id": "df26f1241ce3d626800eb1be0273a21b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Instrumentation API:** An instrumentation tool can use the Instrumentation API (Listing 5) to inject multiple device functions before or after, any or all of a *CUfunction*’s instructions. To inject a function, we use the *nvbit_insert_call*, and we specify the location (i.e. before or after an *Instr*) and the name of the function to inject. Instrumentation functions are injected by name because their code location (i.e. program counter) is unknown until run-time. We can add arguments to the just-injected function such as register values, predicate values, and immediate values using *nvbit_add_call_arg*. Argument passing is positional and it must match the signature of"}], "lineHeight": 0}}, "target": {"markdown": "**插桩 API：** 插桩工具可以使用插桩 API（清单 5）在一个 *CUfunction* 的指令之前或之后注入多个设备函数，可以针对任意指令或所有指令进行注入。为了注入一个函数，我们使用 *nvbit_insert_call*，并指定位置（即在某条 *Instr* 之前或之后）以及要注入的函数名称。插桩函数通过名称进行注入，因为其代码位置（即程序计数器）在运行时才能确定。我们可以使用 *nvbit_add_call_arg* 向刚刚注入的函数添加参数，例如寄存器值、谓词值和立即数。参数传递是按位置的，并且必须与被注入函数的签名相匹配", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 75}, {"source": {"block_id": "d89b884464449ef0ed6d9b453f596946", "index": 76, "aliyun_index": 2, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![d89b884464449ef0ed6d9b453f596946.jpeg](figures/d89b884464449ef0ed6d9b453f596946_5162aeab.png)  \n\n", "text": "以下是图片中内容的合法 Markdown 格式提取，准确保留所有注释、代码结构和细节：\n\n```c\n/* Enumeration used by nvbit_insert_call to specify where\n   we want to insert the device function for a given Instr,\n   if before or after */\ntypedef enum { IPOINT_BEFORE, IPOINT_AFTER } ipoint_t;\n\n/* This function inserts a device function call named\n   \"dev_func_name\", before or after an instruction \"Instr\".\n   Device functions are identified by name (as opposed to\n   function pointers) and need to be exported with the\n   macro NVBIT_EXPORT_DEV_FUNC() */\nvoid nvbit_insert_call(const Instr* instr,\n                       const char * dev_func_name, ipoint_t point);\n\n/* Parameters passable to the last injected call */\ntypedef enum {\n    PRED_VAL,     // predicate value of the instruction\n    PRED_REG,     // predicate register of the thread\n    IMM32,        // immediate value 32-bit (val0=imm32)\n    IMM64,        // immediate value 64-bit (val0=imm64)\n    REG_VAL,      // register value          (val0=reg_num)\n    CBANK_VAL     // value of constant bank  // (val0=bank_id val1=bank_offset)\n} arg_t;\n\n/* Add parameters to the last injected call */\nvoid nvbit_add_call_arg(arg_t arg, long val0, long val1);\n\n/* Remove the original instruction */\nvoid nvbit_remove_orig(const Instr* instr);\n```\n\n✅ 说明：\n- 所有注释（包括多行注释 `/* ... */` 和单行注释 `//`）均原样保留。\n- 枚举类型定义、函数声明、参数列表等语法结构完整保留。\n- 缩进与换行尽量贴近原始排版，确保可读性。\n- 未添加任何额外解释或修改，仅做格式转换。\n\n此 Markdown 代码块可直接嵌入支持 C 语言高亮的文档系统中使用。", "alignment": "left", "unique_id": "d89b884464449ef0ed6d9b453f596946", "edited": false, "extra": {}}, "target": {"markdown": "![d89b884464449ef0ed6d9b453f596946.jpeg](figures/d89b884464449ef0ed6d9b453f596946_5162aeab.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 76}, {"source": {"block_id": "478185bc703190f78753ea6d9c201802", "index": 77, "aliyun_index": 3, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 5: Instrumentation API: function injection and arguments passing.  \n\n", "text": "Listing 5: Instrumentation API: function injection and arguments passing.\n", "alignment": "left", "unique_id": "478185bc703190f78753ea6d9c201802", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 5: Instrumentation API: function injection and arguments passing."}], "lineHeight": 0}}, "target": {"markdown": "## 清单 5：插桩 API：函数注入与参数传递。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 77}, {"source": {"block_id": "46b591f959ddea4003fba1a653a7a5c1", "index": 78, "aliyun_index": 4, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![46b591f959ddea4003fba1a653a7a5c1.jpeg](figures/46b591f959ddea4003fba1a653a7a5c1_7c7d7429.png)  \n\n", "text": "/* Run instrumented or original code for this function\n   based on flag value */\nvoid nvbit_enable_instrumented(CUcontext ctx,\n                               CUfunction func, bool flag);\n\n/* Reset instrumentation of a function, allowing to\n   reapply instrumentation */\nvoid nvbit_reset_instrumentation(CUcontext ctx, CUfunction func);\n\n", "alignment": "left", "unique_id": "46b591f959ddea4003fba1a653a7a5c1", "edited": false, "extra": {}}, "target": {"markdown": "![46b591f959ddea4003fba1a653a7a5c1.jpeg](figures/46b591f959ddea4003fba1a653a7a5c1_7c7d7429.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 78}, {"source": {"block_id": "5bedde28cc3398524d3166e24a09eea2", "index": 79, "aliyun_index": 5, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 6: Control API: enable/disable running of the instrumented function and reset instrumentation.  \n\n", "text": "Listing 6: Control API: enable/disable running of the instrumented function and reset instrumentation.\n", "alignment": "left", "unique_id": "5bedde28cc3398524d3166e24a09eea2", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 6: Control API: enable/disable running of the instrumented function and reset instrumentation."}], "lineHeight": 0}}, "target": {"markdown": "## 清单 6：控制 API：启用/禁用插桩后函数的运行以及重置插桩。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 79}, {"source": {"block_id": "40b15cbbc2148fbfe0da8eacca9bbee2", "index": 80, "aliyun_index": 6, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![40b15cbbc2148fbfe0da8eacca9bbee2.jpeg](figures/40b15cbbc2148fbfe0da8eacca9bbee2_e3a36035.png)  \n\n", "text": "/* device function used to read/write register values.\n   Writes are permanent into application state */\n__device__ int nvbit_read_reg32(int reg);\n__device__ long nvbit_read_reg64(int reg);\n__device__ void nvbit_write_reg32(int reg, int val);\n__device__ void nvbit_write_reg64(int reg, long val);\n\n", "alignment": "left", "unique_id": "40b15cbbc2148fbfe0da8eacca9bbee2", "edited": false, "extra": {}}, "target": {"markdown": "![40b15cbbc2148fbfe0da8eacca9bbee2.jpeg](figures/40b15cbbc2148fbfe0da8eacca9bbee2_e3a36035.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 80}, {"source": {"block_id": "84f15bd1efc77fea7b5e3b50006a1e4b", "index": 81, "aliyun_index": 7, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Listing 7: Device API: read or write any register from injected functions.  \n\n", "text": "Listing 7: Device API: read or write any register from injected functions.\n", "alignment": "left", "unique_id": "84f15bd1efc77fea7b5e3b50006a1e4b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 7: Device API: read or write any register from injected functions."}], "lineHeight": 0}}, "target": {"markdown": "## 清单 7：设备 API：在已注入的函数中读写任意寄存器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 81}, {"source": {"block_id": "b1419c4c0135982125186796165f0062", "index": 82, "aliyun_index": 8, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "the injected function. For instance, if the injected function requires two arguments, there must be two calls to nubit_add_call_arg after the function is injected. It is also possible to remove or replace an original instruction using nubit_remove_orig, for instance when replacing it with a functionally equivalent injected function (shown later in Section 6.3). When replacing instructions, NVBit cannot guarantee the application will continue to work as expected, unless the injected functionality is identical to the replaced instructions.  \n\n", "text": "the injected function. For instance, if the injected function requires two arguments, there must be two calls to nubit_add_call_arg after the function is injected. It is also possible to remove or replace an original instruction using nubit_remove_orig, for instance when replacing it with a functionally equivalent injected function (shown later in Section 6.3). When replacing instructions, NVBit cannot guarantee the application will continue to work as expected, unless the injected functionality is identical to the replaced instructions.\n", "alignment": "left", "unique_id": "b1419c4c0135982125186796165f0062", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the injected function. For instance, if the injected function requires two arguments, there must be two calls to nubit_add_call_arg after the function is injected. It is also possible to remove or replace an original instruction using nubit_remove_orig, for instance when replacing it with a functionally equivalent injected function (shown later in Section 6.3). When replacing instructions, NVBit cannot guarantee the application will continue to work as expected, unless the injected functionality is identical to the replaced instructions."}], "lineHeight": 0}}, "target": {"markdown": "被注入的函数。例如，如果被注入的函数需要两个参数，那么在该函数被注入之后必须进行两次 `nvbit_add_call_arg` 调用。也可以使用 `nvbit_remove_orig` 来移除或替换原始指令，例如在用一个功能等价的注入函数替换某条原始指令时（将在第 6.3 节中展示）。在替换指令时，NVBit 无法保证应用程序能继续按预期工作，除非所注入的功能与被替换的指令完全相同。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 82}, {"source": {"block_id": "065fc1a643b2daf663faa067f1d07b41", "index": 83, "aliyun_index": 9, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Control API:** NVBit provides the ability to control instrumentation at application run-time, for example, to dynamically select the execution of an instrumented or non-instrumented version of a function. At run-time the NVBit framework will select one version or the other, based on the last value set by the user with the call `nvbit_enable_instrumented`, shown in Listing 6. The user can reset applied instrumentation at any time, so a new instrumentation selection can be applied. This operation may be performed at any point inside the callback `nvbit_at_cuda_driver_call`, even while the  \n\n", "text": "**Control API:** NVBit provides the ability to control instrumentation at application run-time, for example, to dynamically select the execution of an instrumented or non-instrumented version of a function. At run-time the NVBit framework will select one version or the other, based on the last value set by the user with the call `nvbit_enable_instrumented`, shown in Listing 6. The user can reset applied instrumentation at any time, so a new instrumentation selection can be applied. This operation may be performed at any point inside the callback `nvbit_at_cuda_driver_call`, even while the\n", "alignment": "left", "unique_id": "065fc1a643b2daf663faa067f1d07b41", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Control API:** NVBit provides the ability to control instrumentation at application run-time, for example, to dynamically select the execution of an instrumented or non-instrumented version of a function. At run-time the NVBit framework will select one version or the other, based on the last value set by the user with the call `nvbit_enable_instrumented`, shown in Listing 6. The user can reset applied instrumentation at any time, so a new instrumentation selection can be applied. This operation may be performed at any point inside the callback `nvbit_at_cuda_driver_call`, even while the"}], "lineHeight": 0}}, "target": {"markdown": "**控制 API：** NVBit 提供了在应用程序运行时控制插桩的能力，例如可以动态选择某个函数的插桩版本或非插桩版本加以执行。在运行时，NVBit 框架会根据用户通过调用 `nvbit_enable_instrumented`（如清单 6 所示）所设置的最新值，在两个版本之间选择其一执行。用户可以随时重置已应用的插桩，从而应用新的插桩选择。该操作可以在回调 `nvbit_at_cuda_driver_call` 内部的任意时刻执行，即使在", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 83}, {"source": {"block_id": "a1458e7f2b71aa038bf6c8e5bf74f782", "index": 84, "aliyun_index": 10, "page_num": 4, "type": "figure", "sub_type": "none", "markdown": "![a1458e7f2b71aa038bf6c8e5bf74f782.jpeg](figures/a1458e7f2b71aa038bf6c8e5bf74f782_cb2ea679.png)  \n\n", "text": "NVBIT TOOL\n│\n├─ NVBit User Level API\n│   ├─ Callback API\n│   ├─ Instrumentation API\n│   ├─ Inspection API\n│   ├─ Control API\n│   └─ Device API\n│\n├─ NVBit Core\n│   ├─ Code Loader/Unloader\n│   ├─ Code Generator\n│   ├─ Instruction Lifter\n│   ├─ Tool Functions Loader\n│   ├─ Driver Interposer\n│   └─ Hardware Abstraction Layer (HAL)\n│       └─ Assembler/Disassembler\n│\n├─ CUDA DRIVER APIs (i.e. cuMemAlloc, cuLaunchKernel, etc.)\n│\n├─ CUDA DRIVER\n│\n└─ GPU HW\n\n\n\n---\n\n✅ 此结构完整反映了原图中各组件的归属关系与堆叠顺序，适用于文档化、技术报告或系统架构描述场景。", "alignment": "left", "unique_id": "a1458e7f2b71aa038bf6c8e5bf74f782", "edited": false, "extra": {}}, "target": {"markdown": "![a1458e7f2b71aa038bf6c8e5bf74f782.jpeg](figures/a1458e7f2b71aa038bf6c8e5bf74f782_cb2ea679.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 84}, {"source": {"block_id": "72d439dcee2484ec370d529cab683824", "index": 85, "aliyun_index": 11, "page_num": 4, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 3: NVBit core components and user-level API.  \n\n", "text": "Figure 3: NVBit core components and user-level API.\n", "alignment": "left", "unique_id": "72d439dcee2484ec370d529cab683824", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3: NVBit core components and user-level API."}], "lineHeight": 0}}, "target": {"markdown": "## 图 3：NVBit 核心组件与用户级 API。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 85}, {"source": {"block_id": "92405769e2e7eef9a1ddd837b90a92ac", "index": 86, "aliyun_index": 12, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "application is executing. This allows instrumented functions to\nbe rewritten on the fly depending on the dynamic conditions of\nthe application's execution, a significant advancement over static\ncompiler-based GPU instrumentation.  \n\n", "text": "application is executing. This allows instrumented functions to\nbe rewritten on the fly depending on the dynamic conditions of\nthe application's execution, a significant advancement over static\ncompiler-based GPU instrumentation.\n", "alignment": "left", "unique_id": "92405769e2e7eef9a1ddd837b90a92ac", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "application is executing. This allows instrumented functions to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "be rewritten on the fly depending on the dynamic conditions of"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the application's execution, a significant advancement over static"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "compiler-based GPU instrumentation."}], "lineHeight": -105}}, "target": {"markdown": "应用程序正在执行的过程中进行。这使得插桩后的函数可以根据应用程序执行的动态条件进行即时重写，相比于基于静态编译器的 GPU 插桩，这是一个重要的进步。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 86}, {"source": {"block_id": "2151d39d55fd7b56ba23abcb8dfa8ad3", "index": 87, "aliyun_index": 13, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Device API:** Finally, NVBit provides a device level API that can be used within the instrumentation (i.e. injected) functions. Most importantly, it is possible to read and write any register used by the application kernels or device functions using this API. While arbitrary writes of register values may cause catastrophic application level errors, the ability to modify GPU state is a requirement for use cases such as fault injection or instruction emulation. Listing 7 describes NVBit's Device API.  \n\n", "text": "**Device API:** Finally, NVBit provides a device level API that can be used within the instrumentation (i.e. injected) functions. Most importantly, it is possible to read and write any register used by the application kernels or device functions using this API. While arbitrary writes of register values may cause catastrophic application level errors, the ability to modify GPU state is a requirement for use cases such as fault injection or instruction emulation. Listing 7 describes NVBit's Device API.\n", "alignment": "left", "unique_id": "2151d39d55fd7b56ba23abcb8dfa8ad3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Device API:** Finally, NVBit provides a device level API that can be used within the instrumentation (i.e. injected) functions. Most importantly, it is possible to read and write any register used by the application kernels or device functions using this API. While arbitrary writes of register values may cause catastrophic application level errors, the ability to modify GPU state is a requirement for use cases such as fault injection or instruction emulation. Listing 7 describes NVBit's Device API."}], "lineHeight": 0}}, "target": {"markdown": "**设备 API：** 最后，NVBit 提供了一个设备级 API，可在插桩（即注入的）函数内部使用。最重要的是，借助该 API 可以读写应用程序核函数或设备函数所使用的任何寄存器。虽然对寄存器值进行任意写入可能导致灾难性的应用程序级错误，但修改 GPU 状态的能力对于故障注入或指令仿真等用例而言是必需的。清单 7 描述了 NVBit 的设备 API。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 87}, {"source": {"block_id": "85564e3ba4655374846eac49e85ea883", "index": 88, "aliyun_index": 14, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "## 5 NVBIT: IMPLEMENTATION\n", "text": "5 NVBIT: IMPLEMENTATION\n", "alignment": "left", "unique_id": "85564e3ba4655374846eac49e85ea883", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5 NVBIT: IMPLEMENTATION"}], "lineHeight": 0}}, "target": {"markdown": "## 5 NVBIT：实现\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 88}, {"source": {"block_id": "d9148a42ff408957f27f02eedbd503f0", "index": 89, "aliyun_index": 15, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "The NVBit core is responsible for interacting with the CUDA driver and providing the user facing functionality described in Section 4. This section describes the internal implementation details of the NVBit core and discusses the overheads related to the JIT-compilation.  \n\n", "text": "The NVBit core is responsible for interacting with the CUDA driver and providing the user facing functionality described in Section 4. This section describes the internal implementation details of the NVBit core and discusses the overheads related to the JIT-compilation.\n", "alignment": "left", "unique_id": "d9148a42ff408957f27f02eedbd503f0", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The NVBit core is responsible for interacting with the CUDA driver and providing the user facing functionality described in Section 4. This section describes the internal implementation details of the NVBit core and discusses the overheads related to the JIT-compilation."}], "lineHeight": 0}}, "target": {"markdown": "NVBit 核心负责与 CUDA 驱动进行交互，并提供第 4 节中描述的用户面功能。本节将介绍 NVBit 核心的内部实现细节，并讨论与 JIT 编译相关的开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 89}, {"source": {"block_id": "ce6704563dec845feec30707c7463e3c", "index": 90, "aliyun_index": 16, "page_num": 4, "type": "title", "sub_type": "none", "markdown": "### 5.1 Software Components Details\n", "text": "5.1 Software Components Details\n", "alignment": "left", "unique_id": "ce6704563dec845feec30707c7463e3c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "5.1 Software Components Details"}], "lineHeight": 0}}, "target": {"markdown": "### 5.1 软件组件细节\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 90}, {"source": {"block_id": "bce02a0b7e1158790c26f6addbf0e23f", "index": 91, "aliyun_index": 17, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "Figure 3 shows the high level components of the NVBit core that we now describe in more detail.  \n\n", "text": "Figure 3 shows the high level components of the NVBit core that we now describe in more detail.\n", "alignment": "left", "unique_id": "bce02a0b7e1158790c26f6addbf0e23f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 3 shows the high level components of the NVBit core that we now describe in more detail."}], "lineHeight": 0}}, "target": {"markdown": "图 3 展示了 NVBit 核心的高层组件，下面我们将对其进行更详细的介绍。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 91}, {"source": {"block_id": "df62cadb5caf41199669b328987cd90f", "index": 92, "aliyun_index": 18, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Driver Interposer:** A *Driver Interposer*, located at the bottom of the NVBit core layer in Figure 3, intercepts the CUDA driver APIs using the function overloading mechanisms provided by *LD_PRELOAD* [18]. When the CUDA driver loads an application function (*CUfunction*), the Driver Interposer records its properties. This includes, maximum register usage, maximum stack usage, dependent functions (i.e. functions that can be called by the current function) and the memory location where the instructions have been loaded. These required properties are consumed by other components within the NVBit core library. For instance, the maximum register consumption is used when computing the correct amount of registers to save before jumping into an instrumentation function. The Driver Interposer is also responsible for propagating the CUDA driver callback API to the NVBit user level callback API.  \n\n", "text": "**Driver Interposer:** A *Driver Interposer*, located at the bottom of the NVBit core layer in Figure 3, intercepts the CUDA driver APIs using the function overloading mechanisms provided by *LD_PRELOAD* [18]. When the CUDA driver loads an application function (*CUfunction*), the Driver Interposer records its properties. This includes, maximum register usage, maximum stack usage, dependent functions (i.e. functions that can be called by the current function) and the memory location where the instructions have been loaded. These required properties are consumed by other components within the NVBit core library. For instance, the maximum register consumption is used when computing the correct amount of registers to save before jumping into an instrumentation function. The Driver Interposer is also responsible for propagating the CUDA driver callback API to the NVBit user level callback API.\n", "alignment": "left", "unique_id": "df62cadb5caf41199669b328987cd90f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Driver Interposer:** A *Driver Interposer*, located at the bottom of the NVBit core layer in Figure 3, intercepts the CUDA driver APIs using the function overloading mechanisms provided by *LD_PRELOAD* [18]. When the CUDA driver loads an application function (*CUfunction*), the Driver Interposer records its properties. This includes, maximum register usage, maximum stack usage, dependent functions (i.e. functions that can be called by the current function) and the memory location where the instructions have been loaded. These required properties are consumed by other components within the NVBit core library. For instance, the maximum register consumption is used when computing the correct amount of registers to save before jumping into an instrumentation function. The Driver Interposer is also responsible for propagating the CUDA driver callback API to the NVBit user level callback API."}], "lineHeight": 0}}, "target": {"markdown": "**驱动拦截器（Driver Interposer）：** 位于图 3 中 NVBit 核心层底部的*驱动拦截器*利用 *LD_PRELOAD* [18] 提供的函数重载机制来拦截 CUDA 驱动 API。当 CUDA 驱动程序加载应用程序函数（*CUfunction*）时，驱动拦截器会记录其相关属性。这些属性包括：最大寄存器使用量、最大栈使用量、依赖函数（即可以被当前函数调用的函数）以及指令已加载到的内存位置。这些所需的属性将由 NVBit 核心库中的其他组件使用。例如，在计算跳转到插桩函数之前需要保存的寄存器数量时，会用到最大寄存器使用量。驱动拦截器还负责将 CUDA 驱动的回调 API 传递给 NVBit 的用户级回调 API。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 92}, {"source": {"block_id": "70ed19a8bbe0c688ecc8b740f1b5dafd", "index": 93, "aliyun_index": 19, "page_num": 4, "type": "text", "sub_type": "none", "markdown": "**Tool Functions Loader:** The *Tool Functions Loader* is responsible for loading all the device functions within the dynamic library of the NVBit tool itself. This process does not happen automatically when the application starts because the CUDA driver is unaware of device and global functions contained in the NVBit tool library.  \n\n", "text": "**Tool Functions Loader:** The *Tool Functions Loader* is responsible for loading all the device functions within the dynamic library of the NVBit tool itself. This process does not happen automatically when the application starts because the CUDA driver is unaware of device and global functions contained in the NVBit tool library.\n", "alignment": "left", "unique_id": "70ed19a8bbe0c688ecc8b740f1b5dafd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Tool Functions Loader:** The *Tool Functions Loader* is responsible for loading all the device functions within the dynamic library of the NVBit tool itself. This process does not happen automatically when the application starts because the CUDA driver is unaware of device and global functions contained in the NVBit tool library."}], "lineHeight": 0}}, "target": {"markdown": "**工具函数加载器（Tool Functions Loader）：** *工具函数加载器* 负责加载 NVBit 工具自身动态库内的所有设备函数。该过程不会在应用程序启动时自动发生，因为 CUDA 驱动程序并不知晓 NVBit 工具库中所包含的设备和全局函数。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 93}, {"source": {"block_id": "38b282c964af6f76f7b99ef5f3e2399f", "index": 94, "aliyun_index": 2, "page_num": 5, "type": "figure", "sub_type": "none", "markdown": "![38b282c964af6f76f7b99ef5f3e2399f.jpeg](figures/38b282c964af6f76f7b99ef5f3e2399f_f31327c3.png)  \n\n", "text": "> The `STS [R15], R8` instruction is targeted for instrumentation. A dashed green arrow points from this line to the **Instrumentation Function**.\n\n---\n\n## Instrumentation Function\n\n\n> This function is called during instrumentation to perform custom logic (e.g., logging, profiling). It receives an argument passed via register `R4`.\n\n---\n\n## Instrumented Code\n\n\n> The original `STS` instruction is replaced with a `JMP L1`, redirecting control flow to the trampoline code block.\n\n---\n\n## Trampoline\n\nLabel: `L1:`\n\n\nassembly\n// 1. Call save state\nJCAL    save_thread_state\n\n// 2. Pass argument\nMOV32I  R4, arg          ← load argument value into R4 for calling 'foo'\n\n// 3. Call instrumentation\nJCAL    \"foo\"            ← invoke user-defined instrumentation function\n\n// 4. Call restore state\nJCAL    restore_thread_state\n\n// 5. Relocated original instr.\nSTS     [R15], R8        ← execute the originally intercepted instruction\n\n// 6. Jump back\nJMP     NPC              ← return to next program counter (continue normal execution)\n```\n\n### Step-by-step Breakdown:\n\n1. **Save Thread State**  \n   → Preserve registers/context before modifying them for instrumentation.\n\n2. **Pass Argument**  \n   → Load the required argument (`arg`) into register `R4` so it can be passed to `foo()`.\n\n3. **Call Instrumentation Function**  \n   → Execute `__device__ void foo(int arg)` — performs desired side effect (logging, tracing, etc.).\n\n4. **Restore Thread State**  \n   → Restore saved context to ensure correctness after instrumentation call.\n\n5. **Execute Original Instruction**  \n   → Perform the actual memory store operation that was originally at this location: `STS [R15], R8`.\n\n6. **Return to Normal Flow**  \n   → Jump to `NPC` (Next Program Counter), resuming execution as if no instrumentation occurred.\n\n---\n\n## Control Flow Summary\n\n- Original code’s `STS [R15], R8` → replaced by `JMP L1`\n- `L1` (trampoline) handles:\n  - Saving/restoring thread state\n  - Calling instrumentation function `foo(arg)`\n  - Executing original `STS` instruction\n  - Returning to continuation point (`NPC`)\n- After trampoline completes, execution continues with `LDG [R15 + 0x8], R12` in instrumented code.\n\n---\n\n## Visual Relationships (from diagram)\n\n- Dashed green arrow: From original `STS` → `Instrumentation Function` (indicates which instruction triggers instrumentation).\n- Solid black arrows:\n  - From `Instrumented code JMP L1` → `Trampoline L1`\n  - From `Trampoline step 5 (STS)` → back to `Instrumented code LDG ...` (via `JMP NPC`)\n  - From `Trampoline step 3 (JCAL \"foo\")` → `Instrumentation Function`\n\n---\n\nThis structure enables dynamic insertion of monitoring or analysis logic without altering the semantic behavior of the original program beyond the added overhead of the trampoline.\n\n--- \n\n✅ All elements from the image have been extracted and formatted accurately in Markdown.", "alignment": "left", "unique_id": "38b282c964af6f76f7b99ef5f3e2399f", "edited": false, "extra": {}}, "target": {"markdown": "![38b282c964af6f76f7b99ef5f3e2399f.jpeg](figures/38b282c964af6f76f7b99ef5f3e2399f_f31327c3.png)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 94}, {"source": {"block_id": "70fdad38fb65bd7b29c62113c5af3130", "index": 95, "aliyun_index": 3, "page_num": 5, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 4: Instrumented code generation process.  \n\n", "text": "Figure 4: Instrumented code generation process.\n", "alignment": "left", "unique_id": "70fdad38fb65bd7b29c62113c5af3130", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 4: Instrumented code generation process."}], "lineHeight": 0}}, "target": {"markdown": "## 图 4：插桩代码生成过程。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 95}, {"source": {"block_id": "9c7661e7b0ee283989adbb8d63dabde1", "index": 96, "aliyun_index": 4, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "Some of the loaded device functions (those exported with the macro\nNVBIT_EXPORT_DEV_FUNCTION) are recorded in a map associating\nthe function name with a structure containing the function at-\ntributes such as the number of registers used, the requested stack\nsize, and the location where the code is loaded in GPU memory.\nThis information is used by the Code Generator when creating code\nnecessary to jump to the instrumentation functions. The Tool Func-\ntions Loader is also responsible for loading other pre-built device\nfunctions (embedded in libnvbit.a) such as those used to save and\nrestore registers before jumping into the user injected functions.\nFor efficiency NVBit implements a fixed set of save and restore\nfunctions, each targeting a specific number of general purpose\nregisters.  \n\n", "text": "Some of the loaded device functions (those exported with the macro\nNVBIT_EXPORT_DEV_FUNCTION) are recorded in a map associating\nthe function name with a structure containing the function at-\ntributes such as the number of registers used, the requested stack\nsize, and the location where the code is loaded in GPU memory.\nThis information is used by the Code Generator when creating code\nnecessary to jump to the instrumentation functions. The Tool Func-\ntions Loader is also responsible for loading other pre-built device\nfunctions (embedded in libnvbit.a) such as those used to save and\nrestore registers before jumping into the user injected functions.\nFor efficiency NVBit implements a fixed set of save and restore\nfunctions, each targeting a specific number of general purpose\nregisters.\n", "alignment": "left", "unique_id": "9c7661e7b0ee283989adbb8d63dabde1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Some of the loaded device functions (those exported with the macro"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVBIT_EXPORT_DEV_FUNCTION) are recorded in a map associating"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the function name with a structure containing the function at-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tributes such as the number of registers used, the requested stack"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "size, and the location where the code is loaded in GPU memory."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This information is used by the Code Generator when creating code"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "necessary to jump to the instrumentation functions. The Tool Func-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "tions Loader is also responsible for loading other pre-built device"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "functions (embedded in libnvbit.a) such as those used to save and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "restore registers before jumping into the user injected functions."}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "For efficiency NVBit implements a fixed set of save and restore"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "functions, each targeting a specific number of general purpose"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "registers."}], "lineHeight": -344}}, "target": {"markdown": "加载的设备函数中，有一部分（通过宏 `NVBIT_EXPORT_DEV_FUNCTION` 导出的那些）会被记录在一个映射表中，该映射表将函数名与一个结构体相关联，该结构体包含函数的属性，例如所使用的寄存器数量、请求的栈大小以及代码在 GPU 内存中的加载位置。代码生成器（Code Generator）在创建跳转到插桩函数所需的代码时会使用这些信息。工具函数加载器还负责加载其他预构建的设备函数（嵌入在 libnvbit.a 中），例如在跳转到用户注入函数之前用于保存和恢复寄存器的那些函数。为了提高效率，NVBit 实现了一组固定的保存和恢复函数，每一组针对特定数量的通用寄存器。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 96}, {"source": {"block_id": "f6f91f02ea8b65abfb13d6ee9ee8d6f7", "index": 97, "aliyun_index": 5, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Hardware Abstraction Layer (HAL):** The *Hardware Abstraction Layer (HAL)* is initialized when a *CUcontext* is started on a specific device. During HAL's initialization, device specific information is recorded, such as the size of each instruction in bytes, alignment requirements, number of registers available per thread, and ABI version. Within a GPU family, the instruction size is unique and fixed. Kepler, Maxwell, and Pascal have 64-bit-wide encodings, while Volta has 128-bit-wide encodings. The ABI version specifies which registers and special registers (such as those holding the convergence barrier state in Volta) must be saved and restored before entering and exiting an instrumentation function. The HAL also initializes device specific assembly/disassembly functions. These functions are used to assemble code in the *Code Generator* or to disassemble code in the *Instruction Lifter*. While this component is not strictly required, using a HAL improves the portability of NVBit across GPU generations, where the SASS ISA is not guaranteed to remain constant.  \n\n", "text": "**Hardware Abstraction Layer (HAL):** The *Hardware Abstraction Layer (HAL)* is initialized when a *CUcontext* is started on a specific device. During HAL's initialization, device specific information is recorded, such as the size of each instruction in bytes, alignment requirements, number of registers available per thread, and ABI version. Within a GPU family, the instruction size is unique and fixed. Kepler, Maxwell, and Pascal have 64-bit-wide encodings, while Volta has 128-bit-wide encodings. The ABI version specifies which registers and special registers (such as those holding the convergence barrier state in Volta) must be saved and restored before entering and exiting an instrumentation function. The HAL also initializes device specific assembly/disassembly functions. These functions are used to assemble code in the *Code Generator* or to disassemble code in the *Instruction Lifter*. While this component is not strictly required, using a HAL improves the portability of NVBit across GPU generations, where the SASS ISA is not guaranteed to remain constant.\n", "alignment": "left", "unique_id": "f6f91f02ea8b65abfb13d6ee9ee8d6f7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Hardware Abstraction Layer (HAL):** The *Hardware Abstraction Layer (HAL)* is initialized when a *CUcontext* is started on a specific device. During HAL's initialization, device specific information is recorded, such as the size of each instruction in bytes, alignment requirements, number of registers available per thread, and ABI version. Within a GPU family, the instruction size is unique and fixed. Kepler, Maxwell, and Pascal have 64-bit-wide encodings, while Volta has 128-bit-wide encodings. The ABI version specifies which registers and special registers (such as those holding the convergence barrier state in Volta) must be saved and restored before entering and exiting an instrumentation function. The HAL also initializes device specific assembly/disassembly functions. These functions are used to assemble code in the *Code Generator* or to disassemble code in the *Instruction Lifter*. While this component is not strictly required, using a HAL improves the portability of NVBit across GPU generations, where the SASS ISA is not guaranteed to remain constant."}], "lineHeight": 0}}, "target": {"markdown": "**硬件抽象层（HAL）：** *硬件抽象层（HAL）* 在特定设备上启动 *CUcontext* 时进行初始化。在 HAL 初始化期间，会记录设备特定的信息，例如每条指令的大小（以字节为单位）、对齐要求、每个线程可用的寄存器数量以及 ABI 版本。在同一 GPU 家族内，指令大小是唯一且固定的。Kepler、Maxwell 和 Pascal 采用 64 位宽编码，而 Volta 采用 128 位宽编码。ABI 版本规定了哪些寄存器和特殊寄存器（例如 Volta 中保存收敛屏障状态的那些寄存器）必须在进入和退出插桩函数之前进行保存和恢复。HAL 还会初始化设备特定的汇编/反汇编函数。这些函数用于在 *代码生成器* 中汇编代码，或在 *指令提升器* 中反汇编代码。虽然该组件并非绝对必需，但使用 HAL 能够提高 NVBit 在不同 GPU 代际间的可移植性，因为 SASS ISA 不能保证始终保持不变。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 97}, {"source": {"block_id": "224754d3e83740d4875eaf7ec6f3200b", "index": 98, "aliyun_index": 6, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Instruction Lifter:** The *Instruction Lifter* is responsible for retrieving the \"raw\" buffer of SASS instructions for each application level *CUfunction*. When the user requests to inspect the instructions of a *CUfunction* (using *nvbit_get_instrs* or *nvbit_get_basic_blocks*) the *Instruction Lifter* converts each one to an object of class *Instr* as shown in Listing 4. Explained previously, the *Instr* class is machine independent and represents a single SASS instructions. Disassembled instructions (i.e. *Instr*) can be arranged in a vector or subdivided in vectors (representing basic blocks) depending on the user's API usage.  \n\n", "text": "**Instruction Lifter:** The *Instruction Lifter* is responsible for retrieving the \"raw\" buffer of SASS instructions for each application level *CUfunction*. When the user requests to inspect the instructions of a *CUfunction* (using *nvbit_get_instrs* or *nvbit_get_basic_blocks*) the *Instruction Lifter* converts each one to an object of class *Instr* as shown in Listing 4. Explained previously, the *Instr* class is machine independent and represents a single SASS instructions. Disassembled instructions (i.e. *Instr*) can be arranged in a vector or subdivided in vectors (representing basic blocks) depending on the user's API usage.\n", "alignment": "left", "unique_id": "224754d3e83740d4875eaf7ec6f3200b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Instruction Lifter:** The *Instruction Lifter* is responsible for retrieving the \"raw\" buffer of SASS instructions for each application level *CUfunction*. When the user requests to inspect the instructions of a *CUfunction* (using *nvbit_get_instrs* or *nvbit_get_basic_blocks*) the *Instruction Lifter* converts each one to an object of class *Instr* as shown in Listing 4. Explained previously, the *Instr* class is machine independent and represents a single SASS instructions. Disassembled instructions (i.e. *Instr*) can be arranged in a vector or subdivided in vectors (representing basic blocks) depending on the user's API usage."}], "lineHeight": 0}}, "target": {"markdown": "**指令提升器（Instruction Lifter）：** *指令提升器* 负责检索每个应用程序级 *CUfunction* 的\"原始\" SASS 指令缓冲区。当用户请求检查某个 *CUfunction* 的指令时（使用 *nvbit_get_instrs* 或 *nvbit_get_basic_blocks*），*指令提升器* 会将每条指令转换为如清单 4 所示的 *Instr* 类的对象。如前所述，*Instr* 类是与机器无关的，用于表示一条 SASS 指令。反汇编后的指令（即 *Instr*）可以根据用户的 API 使用方式排列在一个向量中，或进一步细分为多个向量（表示各个基本块）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 98}, {"source": {"block_id": "0313a4537a9486897f2b7711aa21a2bc", "index": 99, "aliyun_index": 7, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "**Code Generator:** At the exit o 指令（绿色箭头）之前注入的*插桩函数*（名为 *foo*）。*代码生成器* 执行以下步骤：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 99}, {"source": {"block_id": "ae7f7bf0c2967fab92458258d46a3ed1", "index": 100, "aliyun_index": 8, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "• Makes a copy of the original code in system memory (we refer to this copy as instrumented code).  \n\n", "text": "• Makes a copy of the original code in system memory (we refer to this copy as instrumented code).\n", "alignment": "left", "unique_id": "ae7f7bf0c2967fab92458258d46a3ed1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Makes a copy of the original code in system memory (we refer to this copy as instrumented code)."}], "lineHeight": 0}}, "target": {"markdown": "• 在系统内存中复制一份原始代码（我们将这份副本称为插桩代码）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 100}, {"source": {"block_id": "74cef4e9192e8641a3504144f3767d46", "index": 101, "aliyun_index": 9, "page_num": 5, "type": "text", "sub_type": "none", "markdown": "• Generates a new region of code allocated in GPU memory, named\ntrampoline.  \n\n", "text": "• Generates a new region of code allocated in GPU memory, named\ntrampoline.\n", "alignment": "left", "unique_id": "74cef4e9192e8641a3504144f3767d46", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• Generates a new region of code allocated in GPU memory, named"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": fa
