cal WFFT32.  \n\n", "text": "Listing 10: Example of FFT kernel using the “proxy” PTX instruction representing the hypothetical WFFT32.\n", "alignment": "left", "unique_id": "9861016fe1bd0c6ce59375156ea37e8a", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 10: Example of FFT kernel using the “proxy” PTX instruction representing the hypothetical WFFT32."}], "lineHeight": 0}}, "target": {"markdown": "代码清单 10：使用表示假想 WFFT32 指令的“代理”PTX 指令的 FFT kernel 示例。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 158}, {"source": {"block_id": "5bb6e9fd5a2a4315a118a8b9f542d8cf", "index": 159, "aliyun_index": 8, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "When instrumenting the kernel in Listing 10 with the NVBit tool in Listing 9, the inline assembly PTX instruction will be replaced with the `wfft32_emu` function. We can use NVBit to combine instruction emulation and instruction tracing to trace instruction sets that do not exist, potentially enabling future trace-based GPU simulators. For illustrative purposes, we combined the FFT instruction emulation tool with the instruction count tool in Listing 1. Executing the kernel in Listing 10, which computes one 32-point FFT per warp using `WFFT32`, we find that each warp executes 21 instructions. If however, we replace the `WFFT32` instruction with CUDA code that performs the warp-wide FFT, we find instead that each warp executes 150 instructions. This simple example shows how NVBit can help us gauge the impact of ISA changes.  \n\n", "text": "When instrumenting the kernel in Listing 10 with the NVBit tool in Listing 9, the inline assembly PTX instruction will be replaced with the `wfft32_emu` function. We can use NVBit to combine instruction emulation and instruction tracing to trace instruction sets that do not exist, potentially enabling future trace-based GPU simulators. For illustrative purposes, we combined the FFT instruction emulation tool with the instruction count tool in Listing 1. Executing the kernel in Listing 10, which computes one 32-point FFT per warp using `WFFT32`, we find that each warp executes 21 instructions. If however, we replace the `WFFT32` instruction with CUDA code that performs the warp-wide FFT, we find instead that each warp executes 150 instructions. This simple example shows how NVBit can help us gauge the impact of ISA changes.\n", "alignment": "left", "unique_id": "5bb6e9fd5a2a4315a118a8b9f542d8cf", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When instrumenting the kernel in Listing 10 with the NVBit tool in Listing 9, the inline assembly PTX instruction will be replaced with the `wfft32_emu` function. We can use NVBit to combine instruction emulation and instruction tracing to trace instruction sets that do not exist, potentially enabling future trace-based GPU simulators. For illustrative purposes, we combined the FFT instruction emulation tool with the instruction count tool in Listing 1. Executing the kernel in Listing 10, which computes one 32-point FFT per warp using `WFFT32`, we find that each warp executes 21 instructions. If however, we replace the `WFFT32` instruction with CUDA code that performs the warp-wide FFT, we find instead that each warp executes 150 instructions. This simple example shows how NVBit can help us gauge the impact of ISA changes."}], "lineHeight": 0}}, "target": {"markdown": "当使用代码清单 9 中的 NVBit 工具对代码清单 10 中的 kernel 进行插桩时，其中的内联汇编 PTX 指令将被替换为 `wfft32_emu` 函数。我们可以利用 NVBit 将指令模拟与指令追踪相结合，从而追踪那些尚不存在的指令集，这有望为未来基于追踪的 GPU 模拟器提供支持。为了演示，我们把 FFT 指令模拟工具与代码清单 1 中的指令计数工具结合使用。在执行代码清单 10 中的 kernel（该 kernel 通过 `WFFT32` 计算每个 warp 的一个 32 点 FFT）时，我们发现每个 warp 执行了 21 条指令。然而，若将 `WFFT32` 指令替换为执行 warp 级 FFT 的 CUDA 代码，则每个 warp 将执行 150 条指令。这一简单的示例展示了 NVBit 如何帮助我们评估 ISA 变更所带来的影响。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 159}, {"source": {"block_id": "01c772206ce899a7ccd7e6ff5bd32129", "index": 160, "aliyun_index": 9, "page_num": 9, "type": "title", "sub_type": "none", "markdown": "## 7 LIMITATIONS AND DISCUSSION\n", "text": "7 LIMITATIONS AND DISCUSSION\n", "alignment": "left", "unique_id": "01c772206ce899a7ccd7e6ff5bd32129", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "7 LIMITATIONS AND DISCUSSION"}], "lineHeight": 0}}, "target": {"markdown": "## 7 局限性与讨论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 160}, {"source": {"block_id": "0a4d678aeddb61fe2dde6203df5a7f93", "index": 161, "aliyun_index": 10, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "While NVBit is designed for generality, allowing arbitrary injection\nof any CUDA device function, it does have some limitations.  \n\n", "text": "While NVBit is designed for generality, allowing arbitrary injection\nof any CUDA device function, it does have some limitations.\n", "alignment": "left", "unique_id": "0a4d678aeddb61fe2dde6203df5a7f93", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While NVBit is designed for generality, allowing arbitrary injection"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "of any CUDA device function, it does have some limitations."}], "lineHeight": -52}}, "target": {"markdown": "虽然 NVBit 的设计目标是通用性，允许任意注入任何 CUDA 设备函数，但它仍然存在一些局限性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 161}, {"source": {"block_id": "1fa6c604bf0eee65e1bba59aff306c44", "index": 162, "aliyun_index": 11, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Shared and constant memory usage:** Injected functions may not use *shared* and *constant* memory because that memory can be used by the application itself. Using it in an instrumentation tool could cause the instrumented programs to fail. In practice, programs commonly use all of the shared memory capacity, leaving nothing for the instrumentation library itself regardless.  \n\n", "text": "**Shared and constant memory usage:** Injected functions may not use *shared* and *constant* memory because that memory can be used by the application itself. Using it in an instrumentation tool could cause the instrumented programs to fail. In practice, programs commonly use all of the shared memory capacity, leaving nothing for the instrumentation library itself regardless.\n", "alignment": "left", "unique_id": "1fa6c604bf0eee65e1bba59aff306c44", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Shared and constant memory usage:** Injected functions may not use *shared* and *constant* memory because that memory can be used by the application itself. Using it in an instrumentation tool could cause the instrumented programs to fail. In practice, programs commonly use all of the shared memory capacity, leaving nothing for the instrumentation library itself regardless."}], "lineHeight": 0}}, "target": {"markdown": "**共享内存与常量内存的使用：** 注入函数不能使用**共享内存**（*shared* memory）和**常量内存**（*constant* memory），因为这两类内存可能被应用程序自身使用。插桩工具若使用它们，将导致被插桩的程序运行失败。在实践中，程序通常会耗尽全部共享内存容量，无论如何也难以留出空间供插桩库自身使用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 162}, {"source": {"block_id": "b5c198df97deec99946118481f685832", "index": 163, "aliyun_index": 12, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Use of libraries in instrumentation functions:** Instrumentation functions cannot use accelerated libraries used by the targeted application. Doing so could create “recursion” of instrumentation in which an instrumented function becomes itself instrumented.  \n\n", "text": "**Use of libraries in instrumentation functions:** Instrumentation functions cannot use accelerated libraries used by the targeted application. Doing so could create “recursion” of instrumentation in which an instrumented function becomes itself instrumented.\n", "alignment": "left", "unique_id": "b5c198df97deec99946118481f685832", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Use of libraries in instrumentation functions:** Instrumentation functions cannot use accelerated libraries used by the targeted application. Doing so could create “recursion” of instrumentation in which an instrumented function becomes itself instrumented."}], "lineHeight": 0}}, "target": {"markdown": "**插桩函数中库函数的使用：** 插桩函数不能使用被目标应用程序所使用的加速库函数。否则可能引发插桩“递归”，即被插桩的函数自身也会被进一步插桩。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 163}, {"source": {"block_id": "d398f42f83df2b114bff5c3fad18041b", "index": 164, "aliyun_index": 13, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**Non-deterministic applications:** While NVBit is architected to be minimally invasive, additional instructions, register pressure, and cache effects from user level instrumentation and the NVBit framework itself can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions for correct behavior. In other words, if an application is already susceptible to non-deterministic behavior, instrumenting with NVBit will likely exacerbate this non-determinism. For instance, collecting memory addresses (with the NVBit tool in Section 6.1) on an application that uses in-memory synchronization via spin-loops, can result in a very different number of memory instructions being executed if the application is run multiple times. While worth noting, this limitation is common to all the instrumentation approaches (static or dynamic) and not specific to NVBit.  \n\n", "text": "**Non-deterministic applications:** While NVBit is architected to be minimally invasive, additional instructions, register pressure, and cache effects from user level instrumentation and the NVBit framework itself can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions for correct behavior. In other words, if an application is already susceptible to non-deterministic behavior, instrumenting with NVBit will likely exacerbate this non-determinism. For instance, collecting memory addresses (with the NVBit tool in Section 6.1) on an application that uses in-memory synchronization via spin-loops, can result in a very different number of memory instructions being executed if the application is run multiple times. While worth noting, this limitation is common to all the instrumentation approaches (static or dynamic) and not specific to NVBit.\n", "alignment": "left", "unique_id": "d398f42f83df2b114bff5c3fad18041b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Non-deterministic applications:** While NVBit is architected to be minimally invasive, additional instructions, register pressure, and cache effects from user level instrumentation and the NVBit framework itself can alter the behavior of applications that contain race-conditions or rely on specific scheduling or timing assumptions for correct behavior. In other words, if an application is already susceptible to non-deterministic behavior, instrumenting with NVBit will likely exacerbate this non-determinism. For instance, collecting memory addresses (with the NVBit tool in Section 6.1) on an application that uses in-memory synchronization via spin-loops, can result in a very different number of memory instructions being executed if the application is run multiple times. While worth noting, this limitation is common to all the instrumentation approaches (static or dynamic) and not specific to NVBit."}], "lineHeight": 0}}, "target": {"markdown": "**非确定性应用：** 尽管 NVBit 在架构设计上力求尽可能小地侵入程序，但来自用户级插桩以及 NVBit 框架自身的额外指令、寄存器压力和缓存效应，仍然可能改变那些包含竞态条件、或依赖特定调度与时序假设才能正确运行的应用程序的行为。换言之，如果一个应用程序本身已经容易受到非确定性行为的影响，那么使用 NVBit 进行插桩很可能会进一步加剧这种非确定性。例如，对于一个通过自旋循环（spin-loop）实现内存同步的应用程序，如果使用第 6.1 节中的 NVBit 工具采集其内存地址，那么在多次运行该应用程序时，所执行的内存指令数量可能会出现显著差异。尽管值得指出的是，这一局限性是所有插桩方法（无论是静态的还是动态的）所共有的，并非 NVBit 所独有。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 164}, {"source": {"block_id": "c88445391e9cc4daa58eecfa9a59b576", "index": 165, "aliyun_index": 14, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "**More on execution overheads:** In NVBit every active thread enters, then leaves, the instrumentation function, thus the overhead must be paid by all of them. Within the instrumentation function, however, it is possible to implement thread specialization based on thread identifier, for instance having a subset of threads return immediately. We are planning to explore some form of predicate  \n\n", "text": "**More on execution overheads:** In NVBit every active thread enters, then leaves, the instrumentation function, thus the overhead must be paid by all of them. Within the instrumentation function, however, it is possible to implement thread specialization based on thread identifier, for instance having a subset of threads return immediately. We are planning to explore some form of predicate\n", "alignment": "left", "unique_id": "c88445391e9cc4daa58eecfa9a59b576", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**More on execution overheads:** In NVBit every active thread enters, then leaves, the instrumentation function, thus the overhead must be paid by all of them. Within the instrumentation function, however, it is possible to implement thread specialization based on thread identifier, for instance having a subset of threads return immediately. We are planning to explore some form of predicate"}], "lineHeight": 0}}, "target": {"markdown": "**关于执行开销的更多说明：** 在 NVBit 中，每个活跃线程都会进入并随后离开插桩函数，因此相关开销必须由所有线程共同承担。然而，在插桩函数内部，可以根据线程标识符实现线程特化（thread specialization），例如让一部分线程立即返回。我们计划进一步探索某种形式的谓词化机制", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 165}, {"source": {"block_id": "1715956d63b78e81b58225f0b6ba090e", "index": 166, "aliyun_index": 15, "page_num": 9, "type": "corner_note", "sub_type": "none", "markdown": ">$^{1}$See [6, 38] for implementations of warp-wide FFTs using warp shuffle operations.  \n\n", "text": "$^{1}$See [6, 38] for implementations of warp-wide FFTs using warp shuffle operations.\n", "alignment": "left", "unique_id": "1715956d63b78e81b58225f0b6ba090e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "$^{1}$See [6, 38] for implementations of warp-wide FFTs using warp shuffle operations."}], "lineHeight": 0}}, "target": {"markdown": ">$^{1}$ 有关使用 warp shuffle 操作实现 warp 级 FFT 的内容，可参见文献 [6, 38]。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 166}, {"source": {"block_id": "1559bf960be01d81c3501d639be13d64", "index": 167, "aliyun_index": 2, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "matching before jumping to the instrumentation function allowing\na finer gain selection of the threads. Also, as explained, before\njumping to an instrumentation function, specific registers are saved\nin memory for every thread. Although fully parallelized, it takes\nmany cycles and can destroy cache locality. We examined carving\nout instrumentation registers, to limit the state that needs to be\nsaved, however this poses new challenges, including decreased\noccupancy and requiring a new ad-hoc (unsupported) ABI.  \n\n", "text": "matching before jumping to the instrumentation function allowing\na finer gain selection of the threads. Also, as explained, before\njumping to an instrumentation function, specific registers are saved\nin memory for every thread. Although fully parallelized, it takes\nmany cycles and can destroy cache locality. We examined carving\nout instrumentation registers, to limit the state that needs to be\nsaved, however this poses new challenges, including decreased\noccupancy and requiring a new ad-hoc (unsupported) ABI.\n", "alignment": "left", "unique_id": "1559bf960be01d81c3501d639be13d64", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "matching before jumping to the instrumentation function allowing"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a finer gain selection of the threads. Also, as explained, before"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "jumping to an instrumentation function, specific registers are saved"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "in memory for every thread. Although fully parallelized, it takes"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "many cycles and can destroy cache locality. We examined carving"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "out instrumentation registers, to limit the state that needs to be"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "saved, however this poses new challenges, including decreased"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "occupancy and requiring a new ad-hoc (unsupported) ABI."}], "lineHeight": -209}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 167}, {"source": {"block_id": "7b3c6170d81ad6bed4e312f273dac50c", "index": 168, "aliyun_index": 3, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "**Information accessible with NVBit:** The information that can be obtained via the NVBit *Inspection APIs* is comparable to what can be observed with NVIDIA's tools such as *nvdisasm*[23] and *cuda-gdb*[27]. For instance, developers can use *nvdisasm* to observe the SASS code of any GPU binary (if the SASS is present), and use *cuda-gdb* to observe the translation and mapping of any embedded PTX code to SASS. Furthermore, one can use *cuda-gdb* to read values from memory and registers, allowing manual inspection of the entire ISA visible machine state (as with NVBit). The primary advantage of NVBit over these specific tools is that this information can be analyzed at run-time with high performance C/C++ code, many orders of magnitude faster that what the user can do interactively with *nvdisasm* and *cuda-gdb*. Additionally, the dynamic instrumentation aspect of NVBit, where the user can inject generic CUDA functions into a running application, is not possible with any other tool today.  \n\n", "text": "**Information accessible with NVBit:** The information that can be obtained via the NVBit *Inspection APIs* is comparable to what can be observed with NVIDIA's tools such as *nvdisasm*[23] and *cuda-gdb*[27]. For instance, developers can use *nvdisasm* to observe the SASS code of any GPU binary (if the SASS is present), and use *cuda-gdb* to observe the translation and mapping of any embedded PTX code to SASS. Furthermore, one can use *cuda-gdb* to read values from memory and registers, allowing manual inspection of the entire ISA visible machine state (as with NVBit). The primary advantage of NVBit over these specific tools is that this information can be analyzed at run-time with high performance C/C++ code, many orders of magnitude faster that what the user can do interactively with *nvdisasm* and *cuda-gdb*. Additionally, the dynamic instrumentation aspect of NVBit, where the user can inject generic CUDA functions into a running application, is not possible with any other tool today.\n", "alignment": "left", "unique_id": "7b3c6170d81ad6bed4e312f273dac50c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "**Information accessible with NVBit:** The information that can be obtained via the NVBit *Inspection APIs* is comparable to what can be observed with NVIDIA's tools such as *nvdisasm*[23] and *cuda-gdb*[27]. For instance, developers can use *nvdisasm* to observe the SASS code of any GPU binary (if the SASS is present), and use *cuda-gdb* to observe the translation and mapping of any embedded PTX code to SASS. Furthermore, one can use *cuda-gdb* to read values from memory and registers, allowing manual inspection of the entire ISA visible machine state (as with NVBit). The primary advantage of NVBit over these specific tools is that this information can be analyzed at run-time with high performance C/C++ code, many orders of magnitude faster that what the user can do interactively with *nvdisasm* and *cuda-gdb*. Additionally, the dynamic instrumentation aspect of NVBit, where the user can inject generic CUDA functions into a running application, is not possible with any other tool today."}], "lineHeight": 0}}, "target": {"markdown": "**NVBit 可获取的信息：** 通过 NVBit *检测 API*（*Inspection APIs*）所能获取的信息，大致与使用 NVIDIA 的工具所能观察到的内容相当，例如 *nvdisasm*[23] 和 *cuda-gdb*[27]。例如，开发者可以使用 *nvdisasm* 观察任意 GPU 二进制文件的 SASS 代码（前提是 SASS 存在），并使用 *cuda-gdb* 观察任意内嵌 PTX 代码到 SASS 的翻译与映射。此外，用户还可以使用 *cuda-gdb* 读取内存和寄存器中的值，从而手动检查整个 ISA 可见的机器状态（这与 NVBit 类似）。NVBit 相对于这些特定工具的主要优势在于，这些信息可以借助高性能的 C/C++ 代码在运行时进行分析，其速度比用户使用 *nvdisasm* 和 *cuda-gdb* 进行交互式操作要快上许多个数量级。此外，NVBit 所具备的动态插桩特性，即允许用户将通用的 CUDA 函数注入到正在运行的应用程序中，目前是任何其他工具都无法实现的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 168}, {"source": {"block_id": "5003dc4873f122b3772b35bdf6f9f3fb", "index": 169, "aliyun_index": 4, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "On the fly dynamic instrumentation: As explained in Section 4, NVBit allows instrumentation before a kernel is launched. However, once the kernel is executing, the code cannot be further changed (until the next launch). This is in contrast with the existing approaches on CPU that have the ability to breakpoint at any time and modify the code on the fly. While worth mentioning, this is not a limitation of NVBit but rather of the GPUs that cannot self-compile their code but must rely on the CPU to drive execution.  \n\n", "text": "On the fly dynamic instrumentation: As explained in Section 4, NVBit allows instrumentation before a kernel is launched. However, once the kernel is executing, the code cannot be further changed (until the next launch). This is in contrast with the existing approaches on CPU that have the ability to breakpoint at any time and modify the code on the fly. While worth mentioning, this is not a limitation of NVBit but rather of the GPUs that cannot self-compile their code but must rely on the CPU to drive execution.\n", "alignment": "left", "unique_id": "5003dc4873f122b3772b35bdf6f9f3fb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "On the fly dynamic instrumentation: As explained in Section 4, NVBit allows instrumentation before a kernel is launched. However, once the kernel is executing, the code cannot be further changed (until the next launch). This is in contrast with the existing approaches on CPU that have the ability to breakpoint at any time and modify the code on the fly. While worth mentioning, this is not a limitation of NVBit but rather of the GPUs that cannot self-compile their code but must rely on the CPU to drive execution."}], "lineHeight": 0}}, "target": {"markdown": "**动态插桩的实时性（On the fly dynamic instrumentation）：** 如第 4 节所述，NVBit 允许在内核启动之前对其进行插桩。然而，一旦内核开始执行，其代码便无法再被进一步修改（直到下一次启动为止）。这与现有的 CPU 方法有所不同，后者能够在任意时刻设置断点并动态修改代码。值得一提的是，这并非 NVBit 本身的局限性，而是 GPU 自身固有的限制——GPU 无法自行编译其代码，必须依赖 CPU 来驱动执行。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 169}, {"source": {"block_id": "fce3ba82b489197d470a57a4891509b3", "index": 170, "aliyun_index": 5, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 8 RELATED WORK\n", "text": "8 RELATED WORK\n", "alignment": "left", "unique_id": "fce3ba82b489197d470a57a4891509b3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "8 RELATED WORK"}], "lineHeight": 0}}, "target": {"markdown": "## 8 相关工作\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 170}, {"source": {"block_id": "24c2882b4740b98244b67a678a7f0879", "index": 171, "aliyun_index": 6, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "This paper is the first to introduce dynamic binary instrumentation on NVIDIA GPUs. On CPUs, this capability is available in many frameworks such as ATOM [35], HP Caliper [13], DynamoRIO [2] and Intel Pin [12, 19]. ATOM [35] was introduced more than 25 years ago targeting the Alpha processor [21] and it is perhaps the first dynamic binary instrumentation framework proposed. It was followed by HP Caliper [13] whose initial implementation targeted the IA-64 Itanium processor and later by DynamoRIO [2] first released on Intel x86 and later on ARM and IBM Power architectures. Finally, Intel PIN [19], targeting the entire Intel x86 family, is arguably the most widely used dynamic binary instrumentation framework. With Intel Pin the developer writes instrumentation tools, or “Pintools” that specify where and how the program will be instrumented. Pin and Pintools work together to instrument the target program. While Pin performs the JIT-compilation and instrumentation, the Pintool directs how/where to instrument. Inside a Pintool, the developer can inspect basic blocks or plain instructions of any application’s function and decide to inject arbitrary functions before or after each one of them. In NVBit the separation of concerns between “NVBit core” and “NVBit tools” is inspired by Intel Pin (i.e. Pin and Pintools) but NVBit goes beyond Pin in  \n\n", "text": "This paper is the first to introduce dynamic binary instrumentation on NVIDIA GPUs. On CPUs, this capability is available in many frameworks such as ATOM [35], HP Caliper [13], DynamoRIO [2] and Intel Pin [12, 19]. ATOM [35] was introduced more than 25 years ago targeting the Alpha processor [21] and it is perhaps the first dynamic binary instrumentation framework proposed. It was followed by HP Caliper [13] whose initial implementation targeted the IA-64 Itanium processor and later by DynamoRIO [2] first released on Intel x86 and later on ARM and IBM Power architectures. Finally, Intel PIN [19], targeting the entire Intel x86 family, is arguably the most widely used dynamic binary instrumentation framework. With Intel Pin the developer writes instrumentation tools, or “Pintools” that specify where and how the program will be instrumented. Pin and Pintools work together to instrument the target program. While Pin performs the JIT-compilation and instrumentation, the Pintool directs how/where to instrument. Inside a Pintool, the developer can inspect basic blocks or plain instructions of any application’s function and decide to inject arbitrary functions before or after each one of them. In NVBit the separation of concerns between “NVBit core” and “NVBit tools” is inspired by Intel Pin (i.e. Pin and Pintools) but NVBit goes beyond Pin in\n", "alignment": "left", "unique_id": "24c2882b4740b98244b67a678a7f0879", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper is the first to introduce dynamic binary instrumentation on NVIDIA GPUs. On CPUs, this capability is available in many frameworks such as ATOM [35], HP Caliper [13], DynamoRIO [2] and Intel Pin [12, 19]. ATOM [35] was introduced more than 25 years ago targeting the Alpha processor [21] and it is perhaps the first dynamic binary instrumentation framework proposed. It was followed by HP Caliper [13] whose initial implementation targeted the IA-64 Itanium processor and later by DynamoRIO [2] first released on Intel x86 and later on ARM and IBM Power architectures. Finally, Intel PIN [19], targeting the entire Intel x86 family, is arguably the most widely used dynamic binary instrumentation framework. With Intel Pin the developer writes instrumentation tools, or “Pintools” that specify where and how the program will be instrumented. Pin and Pintools work together to instrument the target program. While Pin performs the JIT-compilation and instrumentation, the Pintool directs how/where to instrument. Inside a Pintool, the developer can inspect basic blocks or plain instructions of any application’s function and decide to inject arbitrary functions before or after each one of them. In NVBit the separation of concerns between “NVBit core” and “NVBit tools” is inspired by Intel Pin (i.e. Pin and Pintools) but NVBit goes beyond Pin in"}], "lineHeight": 0}}, "target": {"markdown": "本文首次在 NVIDIA GPU 上引入了动态二进制插桩技术。在 CPU 上，这一能力已经在诸多框架中得到支持，例如 ATOM [35]、HP Caliper [13]、DynamoRIO [2] 以及 Intel Pin [12, 19]。ATOM [35] 早在 25 年多以前就被提出，其最初目标是 Alpha 处理器 [21]，它或许是最早提出的动态二进制插桩框架。随后出现了 HP Caliper [13]，其最初实现针对 IA-64 Itanium 处理器；之后又出现了 DynamoRIO [2]，它最早发布于 Intel x86 平台，后来又扩展到 ARM 和 IBM Power 架构。最后，Intel Pin [19] 面向整个 Intel x86 处理器系列，可以说是目前使用最为广泛的动态二进制插桩框架。使用 Intel Pin 时，开发者需要编写插桩工具（即 “Pintools”），用以指定对程序进行插桩的位置和方式。Pin 与 Pintools 协同工作，共同完成对目标程序的插桩。其中 Pin 负责 JIT 编译与插桩的执行，而 Pintool 则负责指导以何种方式、在何处进行插桩。在 Pintool 内部，开发者可以检查任意应用程序函数中的基本块或普通指令，并决定在其中的每一个之前或之后注入任意函数。NVBit 中“NVBit 核心”与“NVBit 工具”之间的关注点分离（separation of concerns）设计受到了 Intel Pin（即 Pin 与 Pintools）的启发，但 NVBit 在以下方面超越了 Pin：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 171}, {"source": {"block_id": "2b3ff65a7115ff0e9c123a460ae367fd", "index": 172, "aliyun_index": 7, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "functionality because it must also handle runtime API interposition,\nthe complications of translating and mapping C/C++, PTXAS and\nSASS, as well as unique ISA features of modern GPUs through a\nhardware abstraction layer.  \n\n", "text": "functionality because it must also handle runtime API interposition,\nthe complications of translating and mapping C/C++, PTXAS and\nSASS, as well as unique ISA features of modern GPUs through a\nhardware abstraction layer.\n", "alignment": "left", "unique_id": "2b3ff65a7115ff0e9c123a460ae367fd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "functionality because it must also handle runtime API interposition,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the complications of translating and mapping C/C++, PTXAS and"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "SASS, as well as unique ISA features of modern GPUs through a"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "hardware abstraction layer."}], "lineHeight": -103}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 172}, {"source": {"block_id": "a9d4fcae2065456133ef4b10b11c7f3e", "index": 173, "aliyun_index": 8, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "To the best of our knowledge, all prior instrumentation approaches for GPUs have focused on compile-time instrumentation. Ocelot [7] operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [30], but has also been used to perform instrumentation of GPU programs [8] and to implement GPU simulators [15]. While Ocelot is a useful tool, it is limited in functionality because it operates at the PTX level which does not exactly correspond to the binary code executed by the GPU. Consequently, Ocelot interferes with the back-end compiler optimizations and is more invasive and less precise in its ability to instrument a program than NVBit. SASSI [32] solved this problem by enabling compile-time instrumentation directly on the low level SASS, leveraging the NVIDIA production back-end compiler, but still has the same compile-time restrictions that can limit its usefulness. Hayes et al. [11] demonstrated a similar approach to our decoding/encoding strategy used by Hardware Abstraction Layer (HAL) to support different NVIDIA GPU families.  \n\n", "text": "To the best of our knowledge, all prior instrumentation approaches for GPUs have focused on compile-time instrumentation. Ocelot [7] operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [30], but has also been used to perform instrumentation of GPU programs [8] and to implement GPU simulators [15]. While Ocelot is a useful tool, it is limited in functionality because it operates at the PTX level which does not exactly correspond to the binary code executed by the GPU. Consequently, Ocelot interferes with the back-end compiler optimizations and is more invasive and less precise in its ability to instrument a program than NVBit. SASSI [32] solved this problem by enabling compile-time instrumentation directly on the low level SASS, leveraging the NVIDIA production back-end compiler, but still has the same compile-time restrictions that can limit its usefulness. Hayes et al. [11] demonstrated a similar approach to our decoding/encoding strategy used by Hardware Abstraction Layer (HAL) to support different NVIDIA GPU families.\n", "alignment": "left", "unique_id": "a9d4fcae2065456133ef4b10b11c7f3e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To the best of our knowledge, all prior instrumentation approaches for GPUs have focused on compile-time instrumentation. Ocelot [7] operates on PTX code, ingesting PTX emitted by a front-end compiler, modifying it in its own compilation passes, and then emitting PTX for GPUs or assembly code for CPUs. Ocelot was originally designed to allow architectures other than NVIDIA GPUs to leverage the parallelism in PTX programs [30], but has also been used to perform instrumentation of GPU programs [8] and to implement GPU simulators [15]. While Ocelot is a useful tool, it is limited in functionality because it operates at the PTX level which does not exactly correspond to the binary code executed by the GPU. Consequently, Ocelot interferes with the back-end compiler optimizations and is more invasive and less precise in its ability to instrument a program than NVBit. SASSI [32] solved this problem by enabling compile-time instrumentation directly on the low level SASS, leveraging the NVIDIA production back-end compiler, but still has the same compile-time restrictions that can limit its usefulness. Hayes et al. [11] demonstrated a similar approach to our decoding/encoding strategy used by Hardware Abstraction Layer (HAL) to support different NVIDIA GPU families."}], "lineHeight": 0}}, "target": {"markdown": "就我们所知，现有的所有 GPU 插桩方法都聚焦于编译期插桩。Ocelot [7] 操作的是 PTX 代码，它接收由前端编译器生成的 PTX，在自身的编译过程中对其进行修改，然后输出适用于 GPU 的 PTX 或适用于 CPU 的汇编代码。Ocelot 最初的设计目的是允许 NVIDIA GPU 以外的其他架构也能利用 PTX 程序中的并行性 [30]，但它也被用于对 GPU 程序进行插桩 [8] 以及实现 GPU 模拟器 [15]。尽管 Ocelot 是一个有用的工具，但它的功能存在局限性，因为它工作在 PTX 层面，而该层面与 GPU 实际执行的二进制代码并不完全对应。因此，与 NVBit 相比，Ocelot 会干扰后端编译器的优化，并且在对程序进行插桩时侵入性更强、精度更低。SASSI [32] 通过直接在底层 SASS 上实现编译期插桩、利用 NVIDIA 的生产级后端编译器解决了这一问题，但仍然存在相同的编译期限制，从而影响其实用性。Hayes 等人 [11] 展示了一种与我们解码/编码策略相类似的方法，该方法由硬件抽象层（Hardware Abstraction Layer, HAL）所采用，以支持不同的 NVIDIA GPU 系列。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 173}, {"source": {"block_id": "6f3e08b8596acc80e2c4f289f635050e", "index": 174, "aliyun_index": 9, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## 9 CONCLUSION\n", "text": "9 CONCLUSION\n", "alignment": "left", "unique_id": "6f3e08b8596acc80e2c4f289f635050e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "9 CONCLUSION"}], "lineHeight": 0}}, "target": {"markdown": "## 9 结论\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 174}, {"source": {"block_id": "fb1c00a46a25c66248ccecb6aac4c5e9", "index": 175, "aliyun_index": 10, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "This work introduces NVBit, a new dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit improves upon prior compiler-based instrumentation tools by enabling fast and efficient instrumentation of GPU code regardless of application source code availability. By working directly at the SASS level, NVBit can instrument applications that have been produced by users with NVCC, via JIT compilation of PTX, or through the inclusion of pre-compiled shared libraries such as cuDNN, cuBLAS, and cuSolver. As the number of GPU accelerated libraries proliferates the likelihood of applications relying on these highly optimized libraries increases, evidenced by most machine learning frameworks providing direct support for GPU acceleration via cuDNN. NVBit overcomes prior portability limitations by operating directly on SASS, but utilizes a hardware abstraction layer that enables it to seamlessly work across recent generations of NVIDIA GPUs without being tied to specific compilers. This same HAL enables NVBit users to obtain information from the GPU hardware without having to reverse engineer SASS assembly that is not guaranteed to remain constant from GPU generation to generation. The development of NVBit will enable a new class of performance analysis, optimization, and architectural exploration for GPUs that has not been possible using existing tools which only contain subsets of NVBit's broad functionality.  \n\n", "text": "This work introduces NVBit, a new dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit improves upon prior compiler-based instrumentation tools by enabling fast and efficient instrumentation of GPU code regardless of application source code availability. By working directly at the SASS level, NVBit can instrument applications that have been produced by users with NVCC, via JIT compilation of PTX, or through the inclusion of pre-compiled shared libraries such as cuDNN, cuBLAS, and cuSolver. As the number of GPU accelerated libraries proliferates the likelihood of applications relying on these highly optimized libraries increases, evidenced by most machine learning frameworks providing direct support for GPU acceleration via cuDNN. NVBit overcomes prior portability limitations by operating directly on SASS, but utilizes a hardware abstraction layer that enables it to seamlessly work across recent generations of NVIDIA GPUs without being tied to specific compilers. This same HAL enables NVBit users to obtain information from the GPU hardware without having to reverse engineer SASS assembly that is not guaranteed to remain constant from GPU generation to generation. The development of NVBit will enable a new class of performance analysis, optimization, and architectural exploration for GPUs that has not been possible using existing tools which only contain subsets of NVBit's broad functionality.\n", "alignment": "left", "unique_id": "fb1c00a46a25c66248ccecb6aac4c5e9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This work introduces NVBit, a new dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit improves upon prior compiler-based instrumentation tools by enabling fast and efficient instrumentation of GPU code regardless of application source code availability. By working directly at the SASS level, NVBit can instrument applications that have been produced by users with NVCC, via JIT compilation of PTX, or through the inclusion of pre-compiled shared libraries such as cuDNN, cuBLAS, and cuSolver. As the number of GPU accelerated libraries proliferates the likelihood of applications relying on these highly optimized libraries increases, evidenced by most machine learning frameworks providing direct support for GPU acceleration via cuDNN. NVBit overcomes prior portability limitations by operating directly on SASS, but utilizes a hardware abstraction layer that enables it to seamlessly work across recent generations of NVIDIA GPUs without being tied to specific compilers. This same HAL enables NVBit users to obtain information from the GPU hardware without having to reverse engineer SASS assembly that is not guaranteed to remain constant from GPU generation to generation. The development of NVBit will enable a new class of performance analysis, optimization, and architectural exploration for GPUs that has not been possible using existing tools which only contain subsets of NVBit's broad functionality."}], "lineHeight": 0}}, "target": {"markdown": "本文介绍了 NVBit，一种针对 NVIDIA GPU 的新型动态二进制插桩框架。NVBit 通过实现对 GPU 代码的快速高效插桩，改进了以往基于编译器的插桩工具，且不依赖于应用程序源代码的可用性。通过直接在 SASS 层面工作，NVBit 能够对通过 NVCC 编译、经 PTX JIT 编译，或通过包含预编译共享库（如 cuDNN、cuBLAS 和 cuSolver）所产生的应用程序进行插桩。随着 GPU 加速库数量的不断增多，应用程序依赖这些高度优化库的可能性也随之增加——大多数机器学习框架都通过 cuDNN 直接提供 GPU 加速支持即是明证。NVBit 通过直接在 SASS 上操作克服了以往的移植性限制，并借助硬件抽象层（HAL），使其能够在近几代 NVIDIA GPU 上无缝工作，而无需绑定特定的编译器。同样的 HAL 还使得 NVBit 用户能够从 GPU 硬件获取信息，而无需对 SASS 汇编进行逆向工程——这些汇编在不同代际的 GPU 之间并不保证保持不变。NVBit 的开发将为 GPU 开启一类全新的性能分析、优化和架构探索工作，而这是使用现有工具（仅包含 NVBit 广泛功能中的一部分子集）所无法实现的。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 175}, {"source": {"block_id": "37bc59626b6151d8311afa19ebed65ce", "index": 176, "aliyun_index": 11, "page_num": 10, "type": "title", "sub_type": "none", "markdown": "## ACKNOWLEDGMENTS\n", "text": "ACKNOWLEDGMENTS\n", "alignment": "left", "unique_id": "37bc59626b6151d8311afa19ebed65ce", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ACKNOWLEDGMENTS"}], "lineHeight": 0}}, "target": {"markdown": "## 致谢\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 176}, {"source": {"block_id": "190e5e9a328b55a3ad30dccd62c49f41", "index": 177, "aliyun_index": 12, "page_num": 10, "type": "text", "sub_type": "none", "markdown": "This research was, in part, funded by the U.S. Government under the DoE PathForward program. The views and conclusions contained in this document are those of the authors and should not be interpreted as representing the official policies, either expressed or implied, of the U.S. Government.  \n\n", "text": "This research was, in part, funded by the U.S. Government under the DoE PathForward program. The views and conclusions contained in this document are those of the authors and should not be interpreted as representing the official policies, either expressed or implied, of the U.S. Government.\n", "alignment": "left", "unique_id": "190e5e9a328b55a3ad30dccd62c49f41", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This research was, in part, funded by the U.S. Governmen function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function isSepRow(line){
  const cells = line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
  return cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.trim()) || c.trim()==='');
}
function isPipeRow(line){ return /\|/.test(line); }
function rowCells(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());

function tableHtml(rows){
  if (!rows.length) return '';
  let html = '<table><thead><tr>';
  for (const c of rowCells(rows[0])) html += `<th>${inlineMd(c)}</th>`;
  html += '</tr></thead><tbody>';
  const start = (rows.length>1 && isSepRow(rows[1])) ? 2 : 1;
  for (let i=start;i<rows.length;i++){
    if (isSepRow(rows[i])) continue;
    html += '<tr>';
    for (const c of rowCells(rows[i])) html += `<td>${inlineMd(c)}</td>`;
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function latexToHtml(src){
  const SYM = {
    times:'×', cdot:'·', ge:'≥', geq:'≥', le:'≤', leq:'≤', neq:'≠', ne:'≠',
    approx:'≈', infty:'∞', pm:'±', ldots:'…', dots:'…', cdots:'⋯',
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', mu:'μ', pi:'π', sigma:'σ', omega:'ω',
    ell:'ℓ', left:'', right:''
  };
  let s = esc(String(src||''));
  s = s.replace(/\\_/g, '\uE000');
  s = s.replace(/\\text\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathrm\{([^}]*)\}/g, (_,t) => `<span class="mathrm">${esc(t)}</span>`);
  s = s.replace(/\\mathcal\{([^}]*)\}/g, (_,t) => `<span class="mathcal">${esc(t)}</span>`);
  s = s.replace(/\\([A-Za-z]+)/g, (m, name) => SYM[name] !== undefined ? SYM[name] : m);
  s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
  s = s.replace(/\^\{([^}]+)\}/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/\^(\w)/g, (_,t) => `<sup>${t}</sup>`);
  s = s.replace(/_\{([^}]+)\}/g, (_,t) => `<sub>${t}</sub>`);
  s = s.replace(/\uE000/g, '_');
  return s;
}
function inlineMd(t){
  const slots = [];
  let raw = String(t||'');
  raw = raw.replace(/\$\$([\s\S]+?)\$\$/g, (_,m) => {
    slots.push(`<span class="math display">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  raw = raw.replace(/\$([^$\n]+)\$/g, (_,m) => {
    slots.push(`<span class="math">${latexToHtml(m)}</span>`);
    return `\uE001${slots.length-1}\uE001`;
  });
  let html = esc(raw);
  html = html.replace(/\uE001(\d+)\uE001/g, (_,i) => slots[+i]);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_,a,u) => `<img alt="${a}" src="${u}">`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}
function mdToHtml(src, headingPrefix){
  let text = String(src||'').replace(/\r\n/g,'\n');
  text = text.replace(/^``([A-Za-z0-9_+-]+)\s*$/gm, '```$1');
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    const fence = line.trim().match(/^```([\w+-]*)\s*$/);
    if (fence){
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i].trim())){
        buf.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (isPipeRow(line)){
      const rows = [];
      while (i < lines.length && (isPipeRow(lines[i]) || lines[i].trim()==='')){
        if (lines[i].trim()!=='') rows.push(lines[i]);
        else if (rows.length>=2) break;
        i++;
      }
      if (rows.length>=2){ out.push(tableHtml(rows)); continue; }
      out.push(lines[i-1] || line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      const lv = hm[1].length;
      const id = headingPrefix ? `${headingPrefix}${slug(hm[2])}` : slug(hm[2]);
      out.push(`<h${lv} id="${esc(id)}">${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*[-*•]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>');
        i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if (line.trim()===''){ out.push(''); i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim()!=='' && !isPipeRow(lines[i]) && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('```')){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('\n'))+'</p>');
  }
  return out.join('\n');
}
function slug(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,48);

  const root = [];
  const stack = [];
  (list||[]).forEach(e => {
    const node = {block_id:e.block_id, level:e.level||1, title:e.title||e.source_title||'', children:[]};
    while (stack.length && stack[stack.length-1].level >= node.level) stack.pop();
    if (!stack.length) root.push(node); else stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root;
}
function tocNodeHtml(node){
  const kids = node.children||[];
  const leaf = kids.length===0;
  const folded = foldedIds.has(node.block_id);
  return `<div class="toc-node lv${node.level}${folded?' folded':''}" data-bid="${esc(node.block_id)}">
    <div class="toc-row">
      <button type="button" class="toc-twist${leaf?' leaf':''}" data-fold="${esc(node.block_id)}" aria-expanded="${leaf? 'true': String(!folded)}">${leaf?'•':'▾'}</button>
      <a href="#${headingId(node.block_id)}" data-bid="${esc(node.block_id)}">${esc(node.title)}</a>
    </div>
    ${leaf?'':`<div class="toc-kids">${kids.map(tocNodeHtml).join('')}</div>`}
  </div>`;
}
function renderToc(){
  const box = document.getElementById('toc');
  const outline = DATA.outline || [];
  if (!outline.length){ box.innerHTML = '<div style="padding:8px 18px;color:#78716c">暂无目录</div>'; return; }
  box.innerHTML = outlineTree(outline).map(tocNodeHtml).join('');
}
function setNavFolded(on){
  document.body.classList.toggle('nav-folded', on);
  try { localStorage.setItem('pat-nav-folded', on ? '1' : '0'); } catch (e) {}
  const btn = document.getElementById('nav-toggle');
  if (btn) btn.title = on ? '展开目录' : '收起目录';
}
function pairRoles(){
  const first = compareFirst==='source' ? 'source' : 'target';
  return [first, first==='source' ? 'target' : 'source'];
}
function isListMd(md){
  const lines = String(md||'').split('\n').map(s => s.trim()).filter(Boolean);
  return lines.length>0 && lines.every(ln => /^[-*•]\s+/.test(ln));
}
function isCaptionType(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  return t==='figure_name' || t==='figure_note' || t==='table_name' || t==='table_note';
}
function isFigureType(p){ return ((p.source && p.source.type) || '')==='figure'; }
function isFencedCode(md){
  const lines = String(md||'').trim().split('\n');
  if (lines.length<2 || !lines[0].trim().startsWith('```')) return false;
  return lines.slice(1).some(ln => ln.trim().startsWith('```'));
}
function isImageOnlyMd(md){
  return String(md||'').replace(/!\[[^\]]*?\]\([^)]*?\)/g,'').replace(/<img\b[^>]*>/gi,'').trim()==='';
}
function isFormulaOnlyMd(md){
  const raw = String(md||'');
  const stripped = raw.replace(/\$\$[\s\S]*?\$\$/g,'').replace(/\\\[[\s\S]*?\\\]/g,'').trim();
  return raw.trim()!=='' && stripped==='';
}
function isSharedVisual(p){
  const t = ((p.source && p.source.type) || '').toLowerCase();
  if (['figure','formula','equation','math','latex','code','codes'].includes(t)) return true;
  if ((p.target && p.target.status)==='skipped') return true;
  const src = ((p.source && p.source.markdown)||'').trim();
  const tgt = ((p.target && p.target.markdown)||'').trim();
  if (!tgt || src===tgt) return true;
  if (src && isImageOnlyMd(src)) return true;
  if (tgt && isImageOnlyMd(tgt)) return true;
  if (src && isFormulaOnlyMd(src)) return true;
  if (isFencedCode(src) || isFencedCode(tgt)) return true;
  return false;
}
function unitKindClass(p, md){
  if (isFigureType(p)) return ' is-figure';
  if (isCaptionType(p)) return ' is-caption';
  if (isListMd(md)) return ' is-list';
  return '';
}
function captionMd(md){
  return String(md||'').replace(/^\s*>\s?/gm, '').trim();
}
function markCaptionLabel(html){
  return html.replace(
    /(<p>)((?:图|表|Fig\.?|Figure|TABLE|Table|Listing|Listings|代码清单)\s*[0-9IVXLCDM]+[.:：]?\s*)/i,
    '$1<span class="cap-label">$2</span>'
  );
}
function chunkHtml(p, i, which, shared){
  const role = shared ? 'shared-line' : (which==='source' ? 'src-line' : 'tgt-line');
  let md = pickMd(p, which);
  let extra = shared ? ' is-shared' : '';
  if (isCaptionType(p)){
    extra += ' fig-caption';
    md = captionMd(md);
  } else if (isFigureType(p)){
    extra += ' fig-image';
  }
  let inner = mdToHtml(md);
  if (isCaptionType(p)) inner = markCaptionLabel(inner);
  return `<div class="pair-chunk ${role}${extra}" data-pair="${i}">${inner}</div>`;
}
function sharedWhich(){
  return compareFirst==='source' ? 'source' : 'target';
}
function editBtnHtml(i){
  return `<button type="button" class="unit-edit" data-edit="${i}" title="编辑此块">编辑</button>`;
}
function headingLevelOf(md){
  const m = String(md||'').trim().match(/^(#{1,6})\s+/);
  return m ? m[1].length : 2;
}
function stripHeadingMarks(md){
  const line = String(md||'').trim().split('\n')[0] || '';
  return line.replace(/^#{1,6}\s+/, '').trim();
}
function applyHeadingLevel(md, level){
  const lv = Math.max(1, Math.min(6, +level || 2));
  const lines = String(md||'').split('\n');
  const first = (lines[0] || '').replace(/^#{1,6}\s+/, '');
  const rest = lines.slice(1).join('\n');
  return '#'.repeat(lv) + ' ' + first + (rest ? '\n' + rest : '');
}
function rebuildOutline(){
  DATA.outline = DATA.pairs.map((p, idx) => {
    if ((p.source.type || '') !== 'title') return null;
    const src = stripHeadingMarks(p.source.markdown);
    const tgtMd = p.target.markdown || p.source.markdown;
    const tgt = stripHeadingMarks(tgtMd);
    return {
      block_id: p.source.block_id,
      level: Math.max(1, Math.min(4, headingLevelOf(tgtMd || p.source.markdown))),
      title: tgt || src,
      source_title: src,
      pair_index: idx
    };
  }).filter(Boolean);
}
function bindPairHover(root){
  root.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-pair]');
    if (!el) return;
    const id = el.getAttribute('data-pair');
    root.querySelectorAll('[data-pair]').forEach(n => {
      n.classList.toggle('pair-hot', n.getAttribute('data-pair')===id);
    });
  });
  root.addEventListener('mouseleave', () => {
    root.querySelectorAll('.pair-hot').forEach(n => n.classList.remove('pair-hot'));
  });
}
function renderArticle(){
  const list = document.getElementById('list');
  list.className = 'content';
  const wrap = document.createElement('div');
  if (viewMode!=='compare'){
    wrap.className = 'article';
    const which = viewMode==='parse' ? 'source' : 'target';
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p, which));
      return `<div class="pair-unit${kind}"${hid} data-pair="${i}">${editBtnHtml(i)}${chunkHtml(p,i,which)}</div>`;
    }).join('');
  } else if (compareLayout==='side'){
    wrap.className = 'article compare-side';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,'target')) || unitKindClass(p, pickMd(p,'source'));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit side-pair${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  } else {
    // 豆包/沉浸式翻译式：一段原文，紧跟一段译文。相同的图/代码只显示一份。
    wrap.className = 'article compare-stack';
    const [a,b] = pairRoles();
    wrap.innerHTML = DATA.pairs.map((p,i) => {
      const hid = p.source.type==='title' ? ` id="${headingId(p.source.block_id)}"` : '';
      const kind = unitKindClass(p, pickMd(p,a)) || unitKindClass(p, pickMd(p,b));
      if (isSharedVisual(p)){
        return `<div class="pair-unit is-shared${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,sharedWhich(),true)}</div>`;
      }
      return `<div class="pair-unit${kind}" data-pair="${i}"${hid}>${editBtnHtml(i)}${chunkHtml(p,i,a)}${chunkHtml(p,i,b)}</div>`;
    }).join('');
  }
  list.innerHTML = '';
  list.appendChild(wrap);
  bindPairHover(wrap);
}
function render(){
  document.body.classList.toggle('show-edit', showEdit);
  const c = counts();
  document.getElementById('counts').textContent =
    `translated ${c.translated} · skipped ${c.skipped} · failed ${c.failed} · pending ${c.pending} · edited ${c.edited}`;
  document.getElementById('cmp').disabled = viewMode!=='compare';
  document.getElementById('layout').disabled = viewMode!=='compare';
  renderArticle();
}
function fillTypeSelect(current){
  const sel = document.getElementById('edit-type');
  const types = BLOCK_TYPES.slice();
  if (current && types.indexOf(current)<0) types.push(current);
  sel.innerHTML = types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = current || 'text';
}
function editorStateFromForm(){
  return {
    type: document.getElementById('edit-type').value,
    isTitle: document.getElementById('edit-is-title').checked,
    level: +document.getElementById('edit-level').value || 2,
    translate: document.getElementById('edit-translate').checked,
    source: document.getElementById('edit-src').value,
    target: document.getElementById('edit-tgt').value
  };
}
function syncTitleFields(){
  const isTitle = document.getElementById('edit-is-title').checked;
  document.getElementById('edit-level-wrap').hidden = !isTitle;
  if (isTitle) document.getElementById('edit-type').value = 'title';
}
function updateEditorPreview(){
  const st = editorStateFromForm();
  const fake = {source:{type: st.isTitle ? 'title' : st.type}};
  let src = st.source, tgt = st.target;
  if (isCaptionType(fake)){
    src = captionMd(src);
    tgt = captionMd(tgt);
  }
  let srcHtml = mdToHtml(src);
  let tgtHtml = mdToHtml(tgt);
  if (isCaptionType(fake)){
    srcHtml = markCaptionLabel(srcHtml);
    tgtHtml = markCaptionLabel(tgtHtml);
  }
  document.getElementById('edit-src-preview').innerHTML = srcHtml || '<p>（空）</p>';
  document.getElementById('edit-tgt-preview').innerHTML = tgtHtml || '<p>（空）</p>';
}
function openEditor(i){
  const p = DATA.pairs[i];
  if (!p) return;
  editingIndex = i;
  const src = p.source, tgt = p.target;
  const page = (src.page_num==null) ? '-' : (src.page_num + 1);
  document.getElementById('edit-title').textContent = '编辑块 ' + (src.block_id || ('#'+i));
  document.getElementById('edit-meta').textContent =
    `第 ${page} 页 · index ${src.index} · ${esc(tgt.status)}` +
    (tgt.skip_reason ? (' · ' + tgt.skip_reason) : '');
  fillTypeSelect(src.type || 'text');
  const isTitle = (src.type || '') === 'title';
  document.getElementById('edit-is-title').checked = isTitle;
  document.getElementById('edit-level').value = String(headingLevelOf(src.markdown || tgt.markdown));
  document.getElementById('edit-translate').checked = tgt.status !== 'skipped';
  document.getElementById('edit-src').value = src.markdown || '';
  document.getElementById('edit-tgt').value = tgt.markdown || '';
  document.getElementById('edit-propose').hidden = !(corpusRepo() && paperSlug());
  syncTitleFields();
  updateEditorPreview();
  editSnapshot = JSON.stringify(editorStateFromForm());
  document.getElementById('edit-modal').hidden = false;
  document.body.classList.add('modal-open');
  document.getElementById('edit-tgt').focus();
}
function closeEditor(){
  document.getElementById('edit-modal').hidden = true;
  document.body.classList.remove('modal-open');
  editingIndex = -1;
}
function editorDirty(){
  return JSON.stringify(editorStateFromForm()) !== editSnapshot;
}
function requestCloseEditor(){
  if (editorDirty() && !confirm('放弃未保存的修改？')) return;
  closeEditor();
}
function applyEditor(){
  if (editingIndex < 0) return;
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  const prevType = p.source.type || 'text';
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  let srcMd = st.source;
  let tgtMd = st.target;
  if (type === 'title'){
    srcMd = applyHeadingLevel(srcMd, st.level);
    if (String(tgtMd).trim()) tgtMd = applyHeadingLevel(tgtMd, st.level);
  }
  const srcChanged = srcMd !== (p.source.markdown || '');
  const tgtChanged = tgtMd !== (p.target.markdown || '');
  p.source.type = type;
  p.source.markdown = srcMd;
  if (srcChanged || type !== prevType) p.source.edited = true;
  p.target.markdown = tgtMd;
  if (!st.translate){
    p.target.status = 'skipped';
    if (!p.target.skip_reason) p.target.skip_reason = 'user';
  } else {
    if (p.target.status === 'skipped'){
      p.target.skip_reason = null;
      p.target.skip_kind = null;
      p.target.status = tgtMd.trim() ? (tgtChanged ? 'edited' : 'translated') : 'pending';
    }
    if (tgtChanged){
      p.target.edited = true;
      p.target.status = 'edited';
    }
  }
  rebuildOutline();
  closeEditor();
  const y = window.scrollY;
  render();
  renderToc();
  window.scrollTo(0, y);
  showToast('已改内存中的文档，请下载 JSON/HTML 保存');
}
function corpusRepo(){ return (DATA.corpus_repo || BOOT.corpus_repo || '').trim(); }
function paperSlug(){ return (DATA.paper_slug || BOOT.paper_slug || '').trim(); }
function patchFromEditor(){
  const p = DATA.pairs[editingIndex];
  const st = editorStateFromForm();
  let type = st.type;
  if (st.isTitle) type = 'title';
  else if (type === 'title') type = 'text';
  const source = { markdown: st.source, type: type };
  const target = { markdown: st.target };
  const patch = {
    schema: 'pdf-agent-edit/v1',
    paper: paperSlug(),
    block_id: p.source.block_id,
    pair_index: editingIndex,
    action: st.translate ? 'replace' : 'skip',
    source: source,
    target: target,
    translate: st.translate,
    heading_level: st.isTitle ? st.level : null,
    before: {
      source: { markdown: p.source.markdown || '' },
      target: { markdown: p.target.markdown || '' }
    }
  };
  return patch;
}
function proposeEditor(){
  const repo = corpusRepo();
  const slug = paperSlug();
  if (!repo || !slug){
    showToast('未绑定语料仓，请下载 JSON 或手开 Issue');
    return;
  }
  const patch = patchFromEditor();
  const title = '[edit] ' + slug + ' ' + patch.block_id;
  const yaml = [
    '---',
    'schema: pdf-agent-edit/v1',
    'paper: ' + slug,
    'block_id: ' + patch.block_id,
    'pair_index: ' + String(patch.pair_index),
    'action: ' + patch.action,
    '---',
    '',
    '```json',
    JSON.stringify(patch, null, 2),
    '```',
    ''
  ].join('\n');
  const url = 'https://github.com/' + repo + '/issues/new?' + new URLSearchParams({
    title: title,
    body: yaml,
    labels: 'edit'
  }).toString();
  if (url.length > 7000){
    download((slug + '-' + patch.block_id + '.edit.json'),
      new Blob([JSON.stringify(patch, null, 2)], {type:'application/json'}));
    showToast('补丁太长，已下载 JSON，请新建 Issue 并粘贴');
    return;
  }
  window.open(url, '_blank', 'noopener');
}
document.getElementById('list').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-edit]');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  openEditor(+btn.getAttribute('data-edit'));
});
document.getElementById('toc').addEventListener('click', ev => {
  const twist = ev.target.closest('[data-fold]');
  if (twist && !twist.classList.contains('leaf')){
    ev.preventDefault();
    const id = twist.getAttribute('data-fold');
    if (foldedIds.has(id)) foldedIds.delete(id); else foldedIds.add(id);
    const node = twist.closest('.toc-node');
    if (node){
      node.classList.toggle('folded', foldedIds.has(id));
      twist.setAttribute('aria-expanded', String(!foldedIds.has(id)));
    }
    return;
  }
  const a = ev.target.closest('a');
  if (!a) return;
  ev.preventDefault();
  const el = document.getElementById(a.getAttribute('href').slice(1));
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.toc a').forEach(x => x.classList.toggle('active', x===a));
});
document.getElementById('nav-toggle').addEventListener('click', () => {
  setNavFolded(!document.body.classList.contains('nav-folded'));
});
document.getElementById('nav-reopen').addEventListener('click', () => setNavFolded(false));
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
document.getElementById('mode').addEventListener('change', e => { viewMode = e.target.value; render(); });
document.getElementById('cmp').addEventListener('change', e => { compareFirst = e.target.value; render(); });
document.getElementById('layout').addEventListener('change', e => { compareLayout = e.target.value; render(); });
document.getElementById('show-edit').addEventListener('change', e => {
  showEdit = e.target.checked;
  document.body.classList.toggle('show-edit', showEdit);
});
['edit-src','edit-tgt','edit-type','edit-level','edit-is-title','edit-translate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditorPreview);
  document.getElementById(id).addEventListener('change', updateEditorPreview);
});
document.getElementById('edit-type').addEventListener('change', () => {
  document.getElementById('edit-is-title').checked = document.getElementById('edit-type').value === 'title';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-is-title').addEventListener('change', () => {
  if (document.getElementById('edit-is-title').checked) document.getElementById('edit-type').value = 'title';
  else if (document.getElementById('edit-type').value === 'title') document.getElementById('edit-type').value = 'text';
  syncTitleFields();
  updateEditorPreview();
});
document.getElementById('edit-save').addEventListener('click', applyEditor);
document.getElementById('edit-propose').addEventListener('click', proposeEditor);
document.getElementById('edit-cancel').addEventListener('click', requestCloseEditor);
document.getElementById('edit-close').addEventListener('click', requestCloseEditor);
document.getElementById('edit-backdrop').addEventListener('click', requestCloseEditor);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('edit-modal').hidden) return;
  ev.preventDefault();
  requestCloseEditor();
});
document.getElementById('dl-json').addEventListener('click', () => {
  download((DATA.source_pdf_name||'document')+'.translated.json',
    new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'}));
});
document.getElementById('dl-html').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  const script = clone.querySelector('#doc-data');
  if (script) script.textContent = JSON.stringify(DATA);
  download((DATA.source_pdf_name||'document')+'.html',
    new Blob(['<!DOCTYPE html>\n'+clone.outerHTML], {type:'text/html'}));
});
(function initPdfLink(){
  const a = document.getElementById('dl-pdf');
  if (!a) return;
  if (BOOT.has_source_pdf){
    a.hidden = false;
    a.setAttribute('href', BOOT.source_pdf_href || 'source.pdf');
    a.setAttribute('download', BOOT.source_pdf_name || 'source.pdf');
  } else {
    a.remove();
  }
})();
try { if (localStorage.getItem('pat-nav-folded')==='1') setNavFolded(true); } catch (e) {}
renderToc();
render();
</script>
