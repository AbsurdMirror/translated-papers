ine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Mark Stephenson"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "mstephenson@nvidia.com"}], "lineHeight": -80}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 3}, {"source": {"block_id": "78a3ae0e579b78c3cdd15adeb381f5fe", "index": 4, "aliyun_index": 4, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Stephen W. Keckler\nNVIDIA\nskeckler@nvidia.com  \n\n", "text": "Stephen W. Keckler\nNVIDIA\nskeckler@nvidia.com\n", "alignment": "left", "unique_id": "78a3ae0e579b78c3cdd15adeb381f5fe", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Stephen W. Keckler"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVIDIA"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "skeckler@nvidia.com"}], "lineHeight": -86}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 4}, {"source": {"block_id": "4071f3bcb289745b9057ee0db3a03b7f", "index": 5, "aliyun_index": 5, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## ABSTRACT\n", "text": "ABSTRACT\n", "alignment": "left", "unique_id": "4071f3bcb289745b9057ee0db3a03b7f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ABSTRACT"}], "lineHeight": 0}}, "target": {"markdown": "## 摘要\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 5}, {"source": {"block_id": "dc44c67fc80cc0872769ebb63f80db6b", "index": 6, "aliyun_index": 6, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Binary instrumentation frameworks are widely used to implement profilers, performance evaluation, error checking, and bug detection tools. While dynamic binary instrumentation tools such as PIN and DynamoRio are supported on CPUs, GPU architectures currently only have limited support for similar capabilities through static compile-time tools, which prohibits instrumentation of dynamically loaded libraries that are foundations for modern high-performance applications. This work presents NVBit, a fast, dynamic, and portable, binary instrumentation framework, that allows users to write instrumentation tools in CUDA/C/C++ and selectively apply that functionality to pre-compiled binaries and libraries executing on NVIDIA GPUs. Using dynamic recompilation at the SASS level, NVBit analyzes GPU kernel register requirements to generate efficient ABI compliant instrumented code without requiring the tool developer to have detailed knowledge of the underlying GPU architecture. NVBit allows basic-block instrumentation, multiple function injections to the same location, inspection of all ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, source code correlation, and instruction removal. NVBit supports all recent NVIDIA GPU architecture families including Kepler, Maxwell, Pascal and Volta and works on any pre-compiled CUDA, OpenACC, OpenCL, or CUDA-Fortran application.  \n\n", "text": "Binary instrumentation frameworks are widely used to implement profilers, performance evaluation, error checking, and bug detection tools. While dynamic binary instrumentation tools such as PIN and DynamoRio are supported on CPUs, GPU architectures currently only have limited support for similar capabilities through static compile-time tools, which prohibits instrumentation of dynamically loaded libraries that are foundations for modern high-performance applications. This work presents NVBit, a fast, dynamic, and portable, binary instrumentation framework, that allows users to write instrumentation tools in CUDA/C/C++ and selectively apply that functionality to pre-compiled binaries and libraries executing on NVIDIA GPUs. Using dynamic recompilation at the SASS level, NVBit analyzes GPU kernel register requirements to generate efficient ABI compliant instrumented code without requiring the tool developer to have detailed knowledge of the underlying GPU architecture. NVBit allows basic-block instrumentation, multiple function injections to the same location, inspection of all ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, source code correlation, and instruction removal. NVBit supports all recent NVIDIA GPU architecture families including Kepler, Maxwell, Pascal and Volta and works on any pre-compiled CUDA, OpenACC, OpenCL, or CUDA-Fortran application.\n", "alignment": "left", "unique_id": "dc44c67fc80cc0872769ebb63f80db6b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Binary instrumentation frameworks are widely used to implement profilers, performance evaluation, error checking, and bug detection tools. While dynamic binary instrumentation tools such as PIN and DynamoRio are supported on CPUs, GPU architectures currently only have limited support for similar capabilities through static compile-time tools, which prohibits instrumentation of dynamically loaded libraries that are foundations for modern high-performance applications. This work presents NVBit, a fast, dynamic, and portable, binary instrumentation framework, that allows users to write instrumentation tools in CUDA/C/C++ and selectively apply that functionality to pre-compiled binaries and libraries executing on NVIDIA GPUs. Using dynamic recompilation at the SASS level, NVBit analyzes GPU kernel register requirements to generate efficient ABI compliant instrumented code without requiring the tool developer to have detailed knowledge of the underlying GPU architecture. NVBit allows basic-block instrumentation, multiple function injections to the same location, inspection of all ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, source code correlation, and instruction removal. NVBit supports all recent NVIDIA GPU architecture families including Kepler, Maxwell, Pascal and Volta and works on any pre-compiled CUDA, OpenACC, OpenCL, or CUDA-Fortran application."}], "lineHeight": 0}}, "target": {"markdown": "二进制插桩框架被广泛用于实现性能分析器、性能评估、错误检查和缺陷检测工具。虽然 CPU 上支持 PIN 和 DynamoRio 等动态二进制插桩工具，但 GPU 架构目前只能通过静态编译期工具获得有限的支持，这阻碍了对动态加载库的插桩，而动态加载库是现代高性能应用的基础。本文提出了 NVBit，一个快速、动态且可移植的二进制插桩框架，允许用户使用 CUDA/C/C++ 编写插桩工具，并有选择地将其功能应用于在 NVIDIA GPU 上执行的预编译二进制文件和库。通过在 SASS 层面进行动态重编译，NVBit 分析 GPU 内核的寄存器需求，以生成符合 ABI 的高效插桩代码，而无需工具开发者深入了解底层 GPU 架构。NVBit 支持基本块插桩、向同一位置注入多个函数、检查所有 ISA 可见状态、动态选择插桩或未插桩代码、永久修改寄存器状态、源代码关联以及指令移除。NVBit 支持所有近期的 NVIDIA GPU 架构家族，包括 Kepler、Maxwell、Pascal 和 Volta，并且可作用于任何预编译的 CUDA、OpenACC、OpenCL 或 CUDA-Fortran 应用程序。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited":  12 pages. https://doi.org/10.1145/3352460.3358307  \n\n", "text": "In The 52nd Annual IEEE/ACM International Symposium on Microarchitecture (MICRO-52), October 12–16, 2019, Columbus, OH, USA. ACM, New York, NY, USA, 12 pages. https://doi.org/10.1145/3352460.3358307\n", "alignment": "left", "unique_id": "ecc92491a16111bcc2f84ed47c707127", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In The 52nd Annual IEEE/ACM International Symposium on Microarchitecture (MICRO-52), October 12–16, 2019, Columbus, OH, USA. ACM, New York, NY, USA, 12 pages. https://doi.org/10.1145/3352460.3358307"}], "lineHeight": 0}}, "target": {"markdown": "发表于第 52 届 IEEE/ACM 国际微架构研讨会（MICRO-52），2019 年 10 月 12–16 日，美国 俄亥俄州 哥伦布市。ACM，美国 纽约州 纽约市，共 12 页。https://doi.org/10.1145/3352460.3358307", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 13}, {"source": {"block_id": "4f3815a8aae67eee693f9fa6ca7737e1", "index": 14, "aliyun_index": 14, "page_num": 0, "type": "title", "sub_type": "none", "markdown": "## 1 INTRODUCTION\n", "text": "1 INTRODUCTION\n", "alignment": "left", "unique_id": "4f3815a8aae67eee693f9fa6ca7737e1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "1 INTRODUCTION"}], "lineHeight": 0}}, "target": {"markdown": "## 1 引言\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 14}, {"source": {"block_id": "ed91b5c9a4894fa9bb8225eb46628b6f", "index": 15, "aliyun_index": 15, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "Binary instrumentation is a powerful technique that allows transformation of application binaries for a variety of purposes, including application profiling, performance modeling, error checking, and fault injection. Binary instrumentation is also one of the backbones of modern computer architecture research and education [33]. Binary instrumentation frameworks are used to develop custom instrumentation tools which apply specific transformations to application binaries that are then used for unique studies. Notable examples of binary instrumentation frameworks that target CPU architectures include ATOM [35], Intel Pin [12, 19], DynamoRIO [2], and HP Caliper [13]. All these frameworks employ some form of dynamic binary rewriting without needing application source code.  \n\n", "text": "Binary instrumentation is a powerful technique that allows transformation of application binaries for a variety of purposes, including application profiling, performance modeling, error checking, and fault injection. Binary instrumentation is also one of the backbones of modern computer architecture research and education [33]. Binary instrumentation frameworks are used to develop custom instrumentation tools which apply specific transformations to application binaries that are then used for unique studies. Notable examples of binary instrumentation frameworks that target CPU architectures include ATOM [35], Intel Pin [12, 19], DynamoRIO [2], and HP Caliper [13]. All these frameworks employ some form of dynamic binary rewriting without needing application source code.\n", "alignment": "left", "unique_id": "ed91b5c9a4894fa9bb8225eb46628b6f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Binary instrumentation is a powerful technique that allows transformation of application binaries for a variety of purposes, including application profiling, performance modeling, error checking, and fault injection. Binary instrumentation is also one of the backbones of modern computer architecture research and education [33]. Binary instrumentation frameworks are used to develop custom instrumentation tools which apply specific transformations to application binaries that are then used for unique studies. Notable examples of binary instrumentation frameworks that target CPU architectures include ATOM [35], Intel Pin [12, 19], DynamoRIO [2], and HP Caliper [13]. All these frameworks employ some form of dynamic binary rewriting without needing application source code."}], "lineHeight": 0}}, "target": {"markdown": "二进制插桩是一种强大的技术，可用于多种目的的应用程序二进制转换，包括应用程序性能分析、性能建模、错误检查和故障注入。二进制插桩也是现代计算机架构研究与教学的支柱之一[33]。二进制插桩框架用于开发定制的插桩工具，这些工具对应用程序二进制应用特定的转换，然后用于独特的研究。面向 CPU 架构的著名二进制插桩框架包括 ATOM [35]、Intel Pin [12, 19]、DynamoRIO [2] 和 HP Caliper [13]。所有这些框架都采用了某种形式的动态二进制重写，无需应用程序源代码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 15}, {"source": {"block_id": "8b37d2564ddf71ebb4b9aa6f8635847b", "index": 16, "aliyun_index": 16, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "With the advent of GPU computing, equivalent frameworks are desirable to target GPU architectures. Compiler-based instrumentation tools, such as SASSI [36] [32] and Ocelot [8], have helped fill this void for NVIDIA GPUs and the CUDA programming model [5]. For example, SASSI exposes a rich API for ease of use, allowing end users to write custom instrumentation tools that can be used to characterize applications and explore the GPU's architectural design space [9]. However compiler-based instrumentation tools can have significant practical limitations:  \n\n", "text": "With the advent of GPU computing, equivalent frameworks are desirable to target GPU architectures. Compiler-based instrumentation tools, such as SASSI [36] [32] and Ocelot [8], have helped fill this void for NVIDIA GPUs and the CUDA programming model [5]. For example, SASSI exposes a rich API for ease of use, allowing end users to write custom instrumentation tools that can be used to characterize applications and explore the GPU's architectural design space [9]. However compiler-based instrumentation tools can have significant practical limitations:\n", "alignment": "left", "unique_id": "8b37d2564ddf71ebb4b9aa6f8635847b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "With the advent of GPU computing, equivalent frameworks are desirable to target GPU architectures. Compiler-based instrumentation tools, such as SASSI [36] [32] and Ocelot [8], have helped fill this void for NVIDIA GPUs and the CUDA programming model [5]. For example, SASSI exposes a rich API for ease of use, allowing end users to write custom instrumentation tools that can be used to characterize applications and explore the GPU's architectural design space [9]. However compiler-based instrumentation tools can have significant practical limitations:"}], "lineHeight": 0}}, "target": {"markdown": "随着 GPU 计算的出现，人们期望有等效的框架以面向 GPU 架构。基于编译器的插桩工具（如 SASSI [36][32] 和 Ocelot [8]）在一定程度上填补了 NVIDIA GPU 和 CUDA 编程模型 [5] 在这方面的空白。例如，SASSI 提供了丰富的易用 API，允许终端用户编写定制的插桩工具，用于刻画应用程序并探索 GPU 的架构设计空间 [9]。然而，基于编译器的插桩工具存在显著的实际局限性：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 16}, {"source": {"block_id": "899d98f3b9f2547537f8fe076e559c02", "index": 17, "aliyun_index": 17, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• They require source code recompilation which is problematic if applications are large or the source code is not available.  \n\n", "text": "• They require source code recompilation which is problematic if applications are large or the source code is not available.\n", "alignment": "left", "unique_id": "899d98f3b9f2547537f8fe076e559c02", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• They require source code recompilation which is problematic if applications are large or the source code is not available."}], "lineHeight": 0}}, "target": {"markdown": "• 它们需要重新编译源代码，如果应用程序规模庞大或源代码不可用，则会带来问题。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 17}, {"source": {"block_id": "96dd5c2c6bbf76a0d9cdd7a48154fb7e", "index": 18, "aliyun_index": 18, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• They are tied to a specific compiler (or compiler version) precluding the use of alternative toolchains for the target application.  \n\n", "text": "• They are tied to a specific compiler (or compiler version) precluding the use of alternative toolchains for the target application.\n", "alignment": "left", "unique_id": "96dd5c2c6bbf76a0d9cdd7a48154fb7e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• They are tied to a specific compiler (or compiler version) precluding the use of alternative toolchains for the target application."}], "lineHeight": 0}}, "target": {"markdown": "• 它们与特定的编译器（或编译器版本）绑定，无法为目标应用程序使用替代的工具链。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 18}, {"source": {"block_id": "284244a63b48e7b5c4cf6752b3f28c32", "index": 19, "aliyun_index ER, and cuDNN [29] for which the source code is not publicly available. Popular machine learning frameworks such as Caffe [14] and Torch7 [4] make heavy use of cuBLAS and cuDNN."}], "lineHeight": 0}}, "target": {"markdown": "• 它们无法对 cuBLAS、cuFFT、cuSOLVER 和 cuDNN [29] 等专有加速库进行插桩，因为这些库的源代码并不公开。Caffe [14] 和 Torch7 [4] 等流行的机器学习框架大量使用 cuBLAS 和 cuDNN。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 20}, {"source": {"block_id": "4280bb05b8bec4b29dff4af0211622ff", "index": 21, "aliyun_index": 21, "page_num": 0, "type": "text", "sub_type": "none", "markdown": "• They require compile time selection of the instrumentation sites,\nfunctions, and parameter types; and therefore they cannot adapt\nthe instrumentation based on dynamic application behavior.  \n\n", "text": "• They require compile time selection of the instrumentation sites,\nfunctions, and parameter types; and therefore they cannot adapt\nthe instrumentation based on dynamic application behavior.\n", "alignment": "left", "unique_id": "4280bb05b8bec4b29dff4af0211622ff", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• They require compile time selection of the instrumentation sites,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "functions, and parameter types; and therefore they cannot adapt"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the instrumentation based on dynamic application behavior."}], "lineHeight": -77}}, "target": {"markdown": "• 它们需要在编译时选择插桩位置、函数和参数类型；因此无法根据应用程序的动态行为调整插桩。", "status s publicly available today.  \n\n", "text": "our knowledge, no general purpose binary instrumentation tool for\nGPUs is publicly available today.\n", "alignment": "left", "unique_id": "ed1093127a285663234be86315d9671e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "our knowledge, no general purpose binary instrumentation tool for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs is publicly available today."}], "lineHeight": -50}}, "target": {"markdown": "据我们所知，目前尚无公开可用的通用 GPU 二进制插桩工具。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 28}, {"source": {"block_id": "bbd54546f5c909cb80a501f17d224de8", "index": 29, "aliyun_index": 3, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "This paper presents NVBit a dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit provides a rich set of high level APIs that allows instruction inspection, callbacks to CUDA driver APIs, and injection of arbitrary CUDA functions into any application before kernel launch. Operating at the SASS [23] level and using dynamic recompilation, NVBit analyzes GPU kernel register requirements to generate ABI compliant instrumented code without requiring tool developers to have architectural-level knowledge of the underlying GPU implementation. NVBit enables basic-block instrumentation, multi-function injection to the same location, inspection of ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, correlation with source code, and instruction removal. NVBit supports the NVIDIA GPU architecture families of Kepler, Maxwell, Pascal, and Volta and works on pre-compiled CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26] application binaries that can make use of embedded PTX and/or GPU accelerated libraries. This work makes the following primary contributions:  \n\n", "text": "This paper presents NVBit a dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit provides a rich set of high level APIs that allows instruction inspection, callbacks to CUDA driver APIs, and injection of arbitrary CUDA functions into any application before kernel launch. Operating at the SASS [23] level and using dynamic recompilation, NVBit analyzes GPU kernel register requirements to generate ABI compliant instrumented code without requiring tool developers to have architectural-level knowledge of the underlying GPU implementation. NVBit enables basic-block instrumentation, multi-function injection to the same location, inspection of ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, correlation with source code, and instruction removal. NVBit supports the NVIDIA GPU architecture families of Kepler, Maxwell, Pascal, and Volta and works on pre-compiled CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26] application binaries that can make use of embedded PTX and/or GPU accelerated libraries. This work makes the following primary contributions:\n", "alignment": "left", "unique_id": "bbd54546f5c909cb80a501f17d224de8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This paper presents NVBit a dynamic binary instrumentation framework targeting NVIDIA GPUs. NVBit provides a rich set of high level APIs that allows instruction inspection, callbacks to CUDA driver APIs, and injection of arbitrary CUDA functions into any application before kernel launch. Operating at the SASS [23] level and using dynamic recompilation, NVBit analyzes GPU kernel register requirements to generate ABI compliant instrumented code without requiring tool developers to have architectural-level knowledge of the underlying GPU implementation. NVBit enables basic-block instrumentation, multi-function injection to the same location, inspection of ISA visible state, dynamic selection of instrumented or uninstrumented code, permanent modification of register state, correlation with source code, and instruction removal. NVBit supports the NVIDIA GPU architecture families of Kepler, Maxwell, Pascal, and Volta and works on pre-compiled CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26] application binaries that can make use of embedded PTX and/or GPU accelerated libraries. This work makes the following primary contributions:"}], "lineHeight": 0}}, "target": {"markdown": "本文介绍了 NVBit，这是一个面向 NVIDIA GPU 的动态二进制插桩框架。NVBit 提供了一组丰富的高级 API，允许在 CUDA 内核启动前进行指令检查、CUDA 驱动 API 回调以及注入任意 CUDA 函数。NVBit 在 SASS [23] 层级运行并使用动态重编译技术，通过分析 GPU 内核的寄存器需求来生成符合 ABI 的插桩代码，而无需工具开发者具备底层 GPU 实现的体系结构级知识。NVBit 支持基本块插桩、同位置多功能注入、ISA 可见状态检查、插桩与非插桩代码的动态选择、寄存器状态的永久修改、与源代码的关联以及指令移除。NVBit 支持 Kepler、Maxwell、Pascal 和 Volta 等 NVIDIA GPU 架构系列，并可作用于预编译的 CUDA [5]、OpenCL [37]、OpenACC [39] 和 CUDA-Fortran [26] 应用程序二进制文件，这些二进制文件可以使用嵌入式 PTX 和/或 GPU 加速库。本工作的主要贡献如下：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 29}, {"source": {"block_id": "98ab197e8c852639239a1f9ee723e872", "index": 30, "aliyun_index": 4, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• We develop and present the NVBit user-level API, which can be used to inspect/instrument instructions and to intercept CUDA driver API calls.  \n\n", "text": "• We develop and present the NVBit user-level API, which can be used to inspect/instrument instructions and to intercept CUDA driver API calls.\n", "alignment": "left", "unique_id": "98ab197e8c852639239a1f9ee723e872", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We develop and present the NVBit user-level API, which can be used to inspect/instrument instructions and to intercept CUDA driver API calls."}], "lineHeight": 0}}, "target": {"markdown": "• 我们开发并提出了 NVBit 用户级 API，可用于检查/插桩指令以及拦截 CUDA 驱动 API 调用。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 30}, {"source": {"block_id": "ab931e7f9aef14c1761a32037405d833", "index": 31, "aliyun_index": 5, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• We describe NBit's underlying working principles, mechanisms and implementation details.  \n\n", "text": "• We describe NBit's underlying working principles, mechanisms and implementation details.\n", "alignment": "left", "unique_id": "ab931e7f9aef14c1761a32037405d833", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We describe NBit's underlying working principles, mechanisms and implementation details."}], "lineHeight": 0}}, "target": {"markdown": "• 我们描述了 NVBit 的底层工作原理、机制及实现细节。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 31}, {"source": {"block_id": "91d595c6103e1414f42e7ebcfe17b69b", "index": 32, "aliyun_index": 6, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "• We provide several examples of instrumentation tools that highlight the unique features of NVBit, including the ability to support proprietary libraries, sampling to reduce instrumentation overhead, and instruction emulation that allows architects to systematically reason about ISA extensions.  \n\n", "text": "• We provide several examples of instrumentation tools that highlight the unique features of NVBit, including the ability to support proprietary libraries, sampling to reduce instrumentation overhead, and instruction emulation that allows architects to systematically reason about ISA extensions.\n", "alignment": "left", "unique_id": "91d595c6103e1414f42e7ebcfe17b69b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We provide several examples of instrumentation tools that highlight the unique features of NVBit, including the ability to support proprietary libraries, sampling to reduce instrumentation overhead, and instruction emulation that allows architects to systematically reason about ISA extensions."}], "lineHeight": 0}}, "target": {"markdown": "• 我们提供了若干插桩工具的案例，展示了 NVBit 的独特特性，包括支持专有库、采用采样以降低插桩开销，以及允许架构师系统性地推理 ISA 扩展的指令模拟能力。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 32}, {"source": {"block_id": "73b52dca0c6d61ffe5ccbe090915e4b4", "index": 33, "aliyun_index": 7, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "NVBit enables the development of GPU instrumentation tools that are now on par with its CPU counterparts. We believe NVBit will be immediately applicable to numerous use cases in the architecture and high performance computing communities, ranging from GPU architectural simulators (similar to CMP$im [1] and FM-SIM [20]) and error checkers such as Valgrind [22], to debuggers [40] and fault injection frameworks [9, 17].  \n\n", "text": "NVBit enables the development of GPU instrumentation tools that are now on par with its CPU counterparts. We believe NVBit will be immediately applicable to numerous use cases in the architecture and high performance computing communities, ranging from GPU architectural simulators (similar to CMP$im [1] and FM-SIM [20]) and error checkers such as Valgrind [22], to debuggers [40] and fault injection frameworks [9, 17].\n", "alignment": "left", "unique_id": "73b52dca0c6d61ffe5ccbe090915e4b4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVBit enables the development of GPU instrumentation tools that are now on par with its CPU counterparts. We believe NVBit will be immediately applicable to numerous use cases in the architecture and high performance computing communities, ranging from GPU architectural simulators (similar to CMP$im [1] and FM-SIM [20]) and error checkers such as Valgrind [22], to debuggers [40] and fault injection frameworks [9, 17]."}], "lineHeight": 0}}, "target": {"markdown": "NVBit 使得开发与 CPU 同等水平的 GPU 插桩工具成为可能。我们相信 NVBit 将能够立即应用于架构和高性能计算领域的众多用例，涵盖 GPU 架构模拟器（类似于 CMP$im [1] 和 FM-SIM [20]）、类似 Valgrind [22] 的错误检查器，以及调试器 [40] 和故障注入框架 [9, 17] 等。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 33}, {"source": {"block_id": "b57df0d93c12eb4b29aa9628809e8f77", "index": 34, "aliyun_index": 8, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "## 2 BACKGROUND\n", "text": "2 BACKGROUND\n", "alignment": "left", "unique_id": "b57df0d93c12eb4b29aa9628809e8f77", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2 BACKGROUND"}], "lineHeight": 0}}, "target": {"markdown": "## 2 背景\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 34}, {"source": {"block_id": "772cf1c13d824a6d2b407a186d1768e7", "index": 35, "aliyun_index": 9, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Before describing NVBit's design we briefly review NVIDIA's GPU architecture and software stack design, along with terminology that relates to the capabilities provided by NVBit.  \n\n", "text": "Before describing NVBit's design we briefly review NVIDIA's GPU architecture and software stack design, along with terminology that relates to the capabilities provided by NVBit.\n", "alignment": "left", "unique_id": "772cf1c13d824a6d2b407a186d1768e7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Before describing NVBit's design we briefly review NVIDIA's GPU architecture and software stack design, along with terminology that relates to the capabilities provided by NVBit."}], "lineHeight": 0}}, "target": {"markdown": "在介绍 NVBit 的设计之前，我们先简要回顾一下 NVIDIA 的 GPU 架构和软件栈设计，并介绍与 NVBit 所提供功能相关的术语。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 35}, {"source": {"block_id": "e5dac4cd7e3c837275f20ee29cc4345f", "index": 36, "aliyun_index": 10, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "### 2.1 GPU Architecture\n", "text": "2.1 GPU Architecture\n", "alignment": "left", "unique_id": "e5dac4cd7e3c837275f20ee29cc4345f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.1 GPU Architecture"}], "lineHeight": 0}}, "target": {"markdown": "### 2.1 GPU 架构\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 36}, {"source": {"block_id": "0283de7ce0657d429007b0c1a07e02ca", "index": 37, "aliyun_index": 11, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "GPUs are highly multi-threaded accelerators that execute parallel sections of the target applications. To improve efficiency, GPU threads are grouped in warps. A warp is a set of 32 GPU threads sharing the same program counter which execute in a single instruction, multiple thread (SIMT) fashion. Each GPU thread owns a set of general purpose registers (up to 255) and can perform accesses to global, local and constant memory via load/store semantics. Divergence of control flow is handled via predication or a per-warp active mask that enables/disables threads from following a specific control flow path.  \n\n", "text": "GPUs are highly multi-threaded accelerators that execute parallel sections of the target applications. To improve efficiency, GPU threads are grouped in warps. A warp is a set of 32 GPU threads sharing the same program counter which execute in a single instruction, multiple thread (SIMT) fashion. Each GPU thread owns a set of general purpose registers (up to 255) and can perform accesses to global, local and constant memory via load/store semantics. Divergence of control flow is handled via predication or a per-warp active mask that enables/disables threads from following a specific control flow path.\n", "alignment": "left", "unique_id": "0283de7ce0657d429007b0c1a07e02ca", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPUs are highly multi-threaded accelerators that execute parallel sections of the target applications. To improve efficiency, GPU threads are grouped in warps. A warp is a set of 32 GPU threads sharing the same program counter which execute in a single instruction, multiple thread (SIMT) fashion. Each GPU thread owns a set of general purpose registers (up to 255) and can perform accesses to global, local and constant memory via load/store semantics. Divergence of control flow is handled via predication or a per-warp active mask that enables/disables threads from following a specific control flow path."}], "lineHeight": 0}}, "target": {"markdown": "GPU 是高度多线程的加速器，用于执行目标应用程序中的并行代码段。为提高执行效率，GPU 线程被组织为 warp（线程束）。一个 warp 由 32 个共享同一程序计数器的 GPU 线程组成，它们以单指令多线程（SIMT）的方式执行。每个 GPU 线程拥有自己的一组通用寄存器（最多 255 个），并可通过加载/存储语义访问全局内存、本地内存和常量内存。控制流分歧通过谓词机制或每个 warp 的活跃掩码来处理，该掩码用于启用/禁用某些线程使其跟随特定的控制流路径。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 37}, {"source": {"block_id": "dd16ef7bc08f25138f39af69bac30d16", "index": 38, "aliyun_index": 12, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "Many warps are then assigned to execute concurrently on a single GPU core called a streaming multiprocessor (SM) in a unit called  \n\n", "text": "Many warps are then assigned to execute concurrently on a single GPU core called a streaming multiprocessor (SM) in a unit called\n", "alignment": "left", "unique_id": "dd16ef7bc08f25138f39af69bac30d16", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Many warps are then assigned to execute concurrently on a single GPU core called a streaming multiprocessor (SM) in a unit called"}], "lineHeight": 0}}, "target": {"markdown": "许多 warp 被分配到单个 GPU 核心（即流式多处理器，SM）上并发执行，该执行单元称为", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 38}, {"source": {"block_id": "f6d88d9157d0028b1b6805474b2db0c9", "index": 39, "aliyun_index": 13, "page_num": 1, "type": "figure", "sub_type": "none", "markdown": "![f6d88d9157d0028b1b6805474b2db0c9.jpg](figures/f6d88d9157d0028b1b6805474b2db0c9_08f9437a.jpeg)  \n\n", "text": "┌───────────────────────────────────────────────┐\n│                 Applications                  │\n├───────────┬────────────┬─────────────────┬───────────┤\n│ CUDA      │ OpenACC    │ CUDA Fortran    │ OpenCL    │\n│ runtime   │ runtime    │ runtime         │ runtime   │\n└───────────┴─────────────────────────────┴───────────┘\n                      ↑ User Space\n───────────────────────────────────────────────────────\n                      ↓ Kernel Space\n┌───────────────────────────────────────────────┐\n│           CUDA DRIVER APIs                    │\n│     (i.e. cuMemAlloc, cuLaunchKernel, etc.)   │\n├───────────────────────────────────────────────┤\n│              CUDA DRIVER                      │\n└───────────────────────────────────────────────┘\n                      ↓\n┌───────────────────────────────────────────────┐\n│                GPU HW                         │\n───────────────────────────────────────────────┘\n\n\n\n---\n\n✅ 此结构完整反映了图中从应用层到硬件层的软件栈分层模型，包括各运行时环境、驱动接口及底层硬件，并保留了原始注释说明。\n\n--- \n\n如需进一步扩展为表格或添加技术说明，可在此基础上继续深化。", "alignment": "left", "unique_id": "f6d88d9157d0028b1b6805474b2db0c9", "edited": false, "extra": {}}, "target": {"markdown": "![f6d88d9157d0028b1b6805474b2db0c9.jpg](figures/f6d88d9157d0028b1b6805474b2db0c9_08f9437a.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 39}, {"source": {"block_id": "cd41eef44b9aebf8d750413be852f15e", "index": 40, "aliyun_index": 14, "page_num": 1, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 1: CUDA driver software stack.  \n\n", "text": "Figure 1: CUDA driver software stack.\n", "alignment": "left", "unique_id": "cd41eef44b9aebf8d750413be852f15e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 1: CUDA driver software stack."}], "lineHeight": 0}}, "target": {"markdown": ">图 1：CUDA 驱动软件栈。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 40}, {"source": {"block_id": "b3ef4e214325369f0b3b487b09d6fb0c", "index": 41, "aliyun_index": 15, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "a thread block or cooperative thread array (CTA). A GPU then consists of multiple SM building blocks, along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers of these units. NVBit allows passing numerous parameters to instrumentation functions that will affect program execution including register values, predicates, active masks, and constant bank values.  \n\n", "text": "a thread block or cooperative thread array (CTA). A GPU then consists of multiple SM building blocks, along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers of these units. NVBit allows passing numerous parameters to instrumentation functions that will affect program execution including register values, predicates, active masks, and constant bank values.\n", "alignment": "left", "unique_id": "b3ef4e214325369f0b3b487b09d6fb0c", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "a thread block or cooperative thread array (CTA). A GPU then consists of multiple SM building blocks, along with a memory hierarchy including SM-local scratchpad memories and L1 caches, a shared L2 cache, and multiple memory controllers. Different GPUs deploy differing numbers of these units. NVBit allows passing numerous parameters to instrumentation functions that will affect program execution including register values, predicates, active masks, and constant bank values."}], "lineHeight": 0}}, "target": {"markdown": "a 线程块（thread block），也称为协作线程数组（cooperative thread array，CTA）。一块 GPU 由多个 SM 构建块以及一个内存层次结构组成，其中包括 SM 本地的便笺存储器和 L1 缓存、一个共享的 L2 缓存以及多个内存控制器。不同的 GPU 部署这些单元的数量各不相同。NVBit 允许将众多参数传递给插桩函数，这些参数会影响程序的执行，包括寄存器值、谓词、活跃掩码以及常量 bank 值。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 41}, {"source": {"block_id": "21eb2a8040da827fb39dbd9eb1515866", "index": 42, "aliyun_index": 16, "page_num": 1, "type": "title", "sub_type": "none", "markdown": "### 2.2 GPU Software Stack\n", "text": "2.2 GPU Software Stack\n", "alignment": "left", "unique_id": "21eb2a8040da827fb39dbd9eb1515866", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "2.2 GPU Software Stack"}], "lineHeight": 0}}, "target": {"markdown": "### 2.2 GPU 软件栈\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 42}, {"source": {"block_id": "adcfb95b6060a6244b724b39e0f814f5", "index": 43, "aliyun_index": 17, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "NVBit targets the CUDA compute stack. A user can write parallel programs using CUDA [5] and use a front-end compiler, such as NVIDIA's NVCC [24], to generate intermediate code in a virtual ISA called parallel thread execution (PTX [30]). PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A backend compiler optimizes and translates PTX instructions into SASS machine code [23] that runs on a specific device. This backend compiler can be invoked in two ways: (1) ahead-of-time via a ptxas PTX assembler [30] or (2) at run-time with a just in time (JIT) compiler embedded in the GPU driver. NVBit interacts directly with the CUDA driver and handles machine code after it has already been compiled into SASS.  \n\n", "text": "NVBit targets the CUDA compute stack. A user can write parallel programs using CUDA [5] and use a front-end compiler, such as NVIDIA's NVCC [24], to generate intermediate code in a virtual ISA called parallel thread execution (PTX [30]). PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A backend compiler optimizes and translates PTX instructions into SASS machine code [23] that runs on a specific device. This backend compiler can be invoked in two ways: (1) ahead-of-time via a ptxas PTX assembler [30] or (2) at run-time with a just in time (JIT) compiler embedded in the GPU driver. NVBit interacts directly with the CUDA driver and handles machine code after it has already been compiled into SASS.\n", "alignment": "left", "unique_id": "adcfb95b6060a6244b724b39e0f814f5", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "NVBit targets the CUDA compute stack. A user can write parallel programs using CUDA [5] and use a front-end compiler, such as NVIDIA's NVCC [24], to generate intermediate code in a virtual ISA called parallel thread execution (PTX [30]). PTX exposes the GPU as a data-parallel computing device by providing a stable programming model and instruction set for general purpose parallel programming, but PTX does not run directly on the GPU. A backend compiler optimizes and translates PTX instructions into SASS machine code [23] that runs on a specific device. This backend compiler can be invoked in two ways: (1) ahead-of-time via a ptxas PTX assembler [30] or (2) at run-time with a just in time (JIT) compiler embedded in the GPU driver. NVBit interacts directly with the CUDA driver and handles machine code after it has already been compiled into SASS."}], "lineHeight": 0}}, "target": {"markdown": "NVBit 面向 CUDA 计算栈。用户可以使用 CUDA [5] 编写并行程序，并使用前端编译器（例如 NVIDIA 的 NVCC [24]）生成一种称为并行线程执行（PTX [30]）的虚拟 ISA 中间代码。PTX 通过提供稳定的编程模型和通用并行编程指令集，将 GPU 展现为一种数据并行计算设备，但 PTX 并不能直接在 GPU 上运行。后端编译器对 PTX 指令进行优化，并将其翻译为可在特定设备上运行的 SASS 机器码 [23]。该后端编译器可以通过两种方式调用：（1）通过 ptxas PTX 汇编器 [30] 进行提前编译；（2）在运行时使用嵌入在 GPU 驱动中的即时（JIT）编译器进行编译。NVBit 直接与 CUDA 驱动交互，并在代码已被编译为 SASS 之后处理机器码。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 43}, {"source": {"block_id": "6afbcf704af1a98d053d60727de51f1f", "index": 44, "aliyun_index": 18, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "GPU compute programs adhere to a well-defined application binary interface or ABI, which defines the interface properties between caller and callee. Examples include what registers are caller-saved versus callee-saved, which are used to pass parameters, and how many registers can be used before resorting to passing parameters on the stack. NVBit uses a dynamic assembler to generate ABI compliant code in order to inject generic CUDA device functions into any application.  \n\n", "text": "GPU compute programs adhere to a well-defined application binary interface or ABI, which defines the interface properties between caller and callee. Examples include what registers are caller-saved versus callee-saved, which are used to pass parameters, and how many registers can be used before resorting to passing parameters on the stack. NVBit uses a dynamic assembler to generate ABI compliant code in order to inject generic CUDA device functions into any application.\n", "alignment": "left", "unique_id": "6afbcf704af1a98d053d60727de51f1f", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "GPU compute programs adhere to a well-defined application binary interface or ABI, which defines the interface properties between caller and callee. Examples include what registers are caller-saved versus callee-saved, which are used to pass parameters, and how many registers can be used before resorting to passing parameters on the stack. NVBit uses a dynamic assembler to generate ABI compliant code in order to inject generic CUDA device functions into any application."}], "lineHeight": 0}}, "target": {"markdown": "GPU 计算程序遵循明确定义的应用二进制接口（ABI），该接口定义了调用者与被调用者之间的接口属性。其示例包括哪些寄存器是由调用者保存、哪些是由被调用者保存、哪些用于传递参数，以及在不得不通过栈传递参数之前可以使用多少个寄存器。NVBit 使用动态汇编器生成符合 ABI 的代码，以便将通用的 CUDA 设备函数注入到任何应用程序中。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 44}, {"source": {"block_id": "632f5f02d3e008a6d35eac255e1032a1", "index": 45, "aliyun_index": 19, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "As shown in Figure 1, compute programs running on NVIDIA GPUs interface with the GPU driver using a well-defined set of CUDA APIs [25]. The CUDA driver API can be accessed by runtimes (such as those for CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26]) or directly by the user. NVBit interfaces directly with the CUDA driver, thus seamlessly interposing between software stacks that exist above it.  \n\n", "text": "As shown in Figure 1, compute programs running on NVIDIA GPUs interface with the GPU driver using a well-defined set of CUDA APIs [25]. The CUDA driver API can be accessed by runtimes (such as those for CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26]) or directly by the user. NVBit interfaces directly with the CUDA driver, thus seamlessly interposing between software stacks that exist above it.\n", "alignment": "left", "unique_id": "632f5f02d3e008a6d35eac255e1032a1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "As shown in Figure 1, compute programs running on NVIDIA GPUs interface with the GPU driver using a well-defined set of CUDA APIs [25]. The CUDA driver API can be accessed by runtimes (such as those for CUDA [5], OpenCL [37], OpenACC [39] and CUDA-Fortran [26]) or directly by the user. NVBit interfaces directly with the CUDA driver, thus seamlessly interposing between software stacks that exist above it."}], "lineHeight": 0}}, "target": {"markdown": "如图 1 所示，在 NVIDIA GPU 上运行的计算程序通过一套明确定义的 CUDA API [25] 与 GPU 驱动进行交互。CUDA 驱动 API 可以被各种运行时（例如 CUDA [5]、OpenCL [37]、OpenACC [39] 以及 CUDA-Fortran [26] 的运行时）调用，也可以被用户直接调用。NVBit 直接与 CUDA 驱动对接，从而能够透明地介入运行在其之上的各类软件栈之间。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 45}, {"source": {"block_id": "093f468ae375a728ffca0e5c93ab06bb", "index": 46, "aliyun_index": 20, "page_num": 1, "type": "text", "sub_type": "none", "markdown": "When an application starts, contexts (CU contexts) are created by the CUDA driver to maintain the state of the used GPU devices. Modules (C_modules) containing functions (CUfunctions) are loaded on demand before a kernel and its dependent functions are launched. NVBit provides callbacks for all CUDA driver APIs, plus specific callbacks when the application is started or terminated. The additional driver level callbacks provided by NVBit are similar to  \n\n", "text": "When an application starts, contexts (CU contexts) are created by the CUDA driver to maintain the state of the used GPU devices. Modules (C_modules) containing functions (CUfunctions) are loaded on demand before a kernel and its dependent functions are launched. NVBit provides callbacks for all CUDA driver APIs, plus specific callbacks when the application is started or terminated. The additional driver level callbacks provided by NVBit are similar to\n", "alignment": "left", "unique_id": "093f468ae375a728ffca0e5c93ab06bb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "When an application starts, contexts (CU contexts) are created by the CUDA driver to maintain the state of the used GPU devices. Modules (C_modules) containing functions (CUfunctions) are loaded on demand before a kernel and its dependent functions are launched. NVBit provides callbacks for all CUDA driver APIs, plus specific callbacks when the application is started or terminated. The additional driver level callbacks provided by NVBit are similar to"}], "lineHeight": 0}}, "target": {"markdown": "当应用程序启动时，CUDA 驱动会创建上下文（CUcontext），以维护所使用的 GPU 设备的状态。包含函数（CUfunction）的模块（CUmodule）会在内核及其依赖函数启动之前按需加载。NVBit 为所有 CUDA 驱动 API 提供了回调函数，并在应用程序启动或终止时提供特定的回调。NVBit 所提供的额外驱动级回调类似于", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 46}, {"source": {"block_id": "5570993830cfac405f8d443e822da088", "index": 47, "aliyun_index": 2, "page_num": 2, "type": "figure", "sub_type": "none", "markdown": "![5570993830cfac405f8d443e822da088.jpg](figures/5570993830cfac405f8d443e822da088_ed1715b8.jpeg)  \n\n", "text": "+---------------------+\n|     NVBit Core      |\n| +-----------+-------+ |\n| | Libnvbit.a | Nvbit.h | |\n| +-----------+-------+ |\n+---------------------+\n          ↓\n   +------------------+\n   | nvbit_tool.cu    |\n   +------------------+\n          ↓\n   +----------------------------------+\n   | nvcc -shared                     |\n   | nvbit_tool.cu -lnvbit            |\n   +----------------------------------+\n          ↓\n   +------------------+\n   | nvbit_tool.so    |\n   +------------------+\n\n+--------------------------------------------------+\n| Pre-compiled Application                         |\n| (CUDA, openACC, OpenCL and CUDA Fortran)         |\n+--------------------------------------------------+\n          ↓\n+--------------------------------------------------+\n| LD_PRELOAD=nvbit_tool.so                         |\n+--------------------------------------------------+\n          ↓\n+--------------------------------------------------+\n| CUDA DRIVER APIs                                 |\n| (i.e. cuMemAlloc, cuLaunchKernel, etc.)          |\n+--------------------------------------------------+\n          ↓\n+--------------------------------------------------+\n| CUDA DRIVER                                      |\n+--------------------------------------------------+\n          ↓\n+--------------------------------------------------+\n| GPU HW                                           |\n+--------------------------------------------------+\n\n\n\n> **说明**：  \n> - 应用程序是预编译的二进制程序（支持 CUDA、openACC、OpenCL、CUDA Fortran）。  \n> - 通过环境变量 `LD_PRELOAD=nvbit_tool.so` 在运行时注入 NVBit 工具。  \n> - NVBit 拦截底层 CUDA Driver API 调用（如 `cuMemAlloc`, `cuLaunchKernel` 等）。  \n> - 所有调用最终经由 CUDA Driver 层下发至 GPU 硬件执行。  \n> - 此架构允许在不重新编译应用的前提下，对任意 CUDA 应用进行 instrumentation 或分析。\n\n---\n\n✅ 以上结构完整保留了图中所示的编译流程与运行时堆栈关系，符合信息抽取要求。", "alignment": "left", "unique_id": "5570993830cfac405f8d443e822da088", "edited": false, "extra": {}}, "target": {"markdown": "![5570993830cfac405f8d443e822da088.jpg](figures/5570993830cfac405f8d443e822da088_ed1715b8.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 47}, {"source": {"block_id": "8147a545404b80d3074803baa268a2d7", "index": 48, "aliyun_index": 3, "page_num": 2, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 2: NVBit framework overview. An NVBit tool is first compiled as a shared library and then injected (preloaded) at run-time using LD_PRELOAD.  \n\n", "text": "Figure 2: NVBit framework overview. An NVBit tool is first compiled as a shared library and then injected (preloaded) at run-time using LD_PRELOAD.\n", "alignment": "left", "unique_id": "8147a545404b80d3074803baa268a2d7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 2: NVBit framework overview. An NVBit tool is first compiled as a shared library and then injected (preloaded) at run-time using LD_PRELOAD."}], "lineHeight": 0}}, "target": {"markdown": ">图 2：NVBit 框架概览。NVBit 工具首先被编译为共享库，然后在运行时通过 LD_PRELOAD 注入（预加载）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 48}, {"source": {"block_id": "313d09b2a1123a2d4ea90360a68daf5b", "index": 49, "aliyun_index": 4, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "those provided by CUPTI [28], with regard to interfaces, function\nenumeration, and parameters.  \n\n", "text": "those provided by CUPTI [28], with regard to interfaces, function\nenumeration, and parameters.\n", "alignment": "left", "unique_id": "313d09b2a1123a2d4ea90360a68daf5b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "those provided by CUPTI [28], with regard to interfaces, function"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "enumeration, and parameters."}], "lineHeight": -54}}, "target": {"markdown": "CUPTI [28] 所提供的回调；两者在接口、函数枚举和参数方面较为相似。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 49}, {"source": {"block_id": "6c077ab9aeeb4f546086f76ebd37f73b", "index": 50, "aliyun_index": 5, "page_num": 2, "type": "title", "sub_type": "none", "markdown": "## 3 NBIT: HIGH LEVEL VIEW\n", "text": "3 NBIT: HIGH LEVEL VIEW\n", "alignment": "left", "unique_id": "6c077ab9aeeb4f546086f76ebd37f73b", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "3 NBIT: HIGH LEVEL VIEW"}], "lineHeight": 0}}, "target": {"markdown": "## 3 NBIT：高层视图\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 50}, {"source": {"block_id": "e33486f638ac49f967693c1a5716feee", "index": 51, "aliyun_index": 6, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Viewed from above, the NVBit framework (i.e. NVBit core) is composed of a single static library (libnvbit.a) and header file (nvbit.h) that provides all the APIs required to implement an NVBit tool. An NVBit tool is the pseudonym for any instrumentation tool developed with NVBit. An NVBit tool is created by: (1) developing a .cu file using the NVBit API; (2) compiling it with NVIDIA NVCC; (3) linking it with the static library libnvbit.a. This process generates a shared library, which in Linux is typically a file with the .so extension. Many shared libraries can be created, corresponding to many NVBit tools, but only a single library can be injected on a target application at run-time.  \n\n", "text": "Viewed from above, the NVBit framework (i.e. NVBit core) is composed of a single static library (libnvbit.a) and header file (nvbit.h) that provides all the APIs required to implement an NVBit tool. An NVBit tool is the pseudonym for any instrumentation tool developed with NVBit. An NVBit tool is created by: (1) developing a .cu file using the NVBit API; (2) compiling it with NVIDIA NVCC; (3) linking it with the static library libnvbit.a. This process generates a shared library, which in Linux is typically a file with the .so extension. Many shared libraries can be created, corresponding to many NVBit tools, but only a single library can be injected on a target application at run-time.\n", "alignment": "left", "unique_id": "e33486f638ac49f967693c1a5716feee", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Viewed from above, the NVBit framework (i.e. NVBit core) is composed of a single static library (libnvbit.a) and header file (nvbit.h) that provides all the APIs required to implement an NVBit tool. An NVBit tool is the pseudonym for any instrumentation tool developed with NVBit. An NVBit tool is created by: (1) developing a .cu file using the NVBit API; (2) compiling it with NVIDIA NVCC; (3) linking it with the static library libnvbit.a. This process generates a shared library, which in Linux is typically a file with the .so extension. Many shared libraries can be created, corresponding to many NVBit tools, but only a single library can be injected on a target application at run-time."}], "lineHeight": 0}}, "target": {"markdown": "从整体上看，NVBit 框架（即 NVBit 核心）由一个静态库（libnvbit.a）和一个头文件（nvbit.h）组成，它们提供了实现 NVBit 工具所需的全部 API。NVBit 工具是使用 NVBit 开发的任何插桩工具的统称。创建 NVBit 工具的过程如下：（1）使用 NVBit API 开发一个 .cu 文件；（2）使用 NVIDIA NVCC 对其进行编译；（3）将其与静态库 libnvbit.a 进行链接。该过程会生成一个共享库，在 Linux 上通常是扩展名为 .so 的文件。可以创建多个共享库，对应多个 NVBit 工具，但在运行时只能向目标应用程序注入一个共享库。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 51}, {"source": {"block_id": "b76719a12f04165ab975b8e526f5f161", "index": 52, "aliyun_index": 7, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "To use an NVBit tool (i.e. shared library) developers inject the library's functionality at run-time into applications that use the CUDA driver. The injection mechanism is based on the standard $LD\\_PRELOAD$ [18], an optional environment variable under Linux that contains one or more paths to shared libraries, indicating that the loader should load this shared object before any other library. Figure 2 shows the flow for NVBit tool compilation and run-time preloading. From the user's perspective, the typical NVBit tool will implement one or more GPU device functions which are injected in an application's GPU kernels according to user defined injection points. The dynamic instrumentation of a binary is typically done when the kernel is launched for the first time, although it can be done at other times within the CUDA driver callbacks.  \n\n", "text": "To use an NVBit tool (i.e. shared library) developers inject the library's functionality at run-time into applications that use the CUDA driver. The injection mechanism is based on the standard $LD\\ false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 1 shows a simple example of an NVBit tool that counts every thread level instruction executed, then prints the counter at the end of the application. Line 11 of Listing 1 shows the implementation of the injection function which atomically increments a CUDA managed variable (counter) each time it is executed. The macro NVBIT_EXPORT_DEV_FUNCTION (defined inside nvbit.h) is necessary to prevent the compiler from performing dead code elimination, since the injection function appears unused to the compiler in most cases. At Line 18 a callback is triggered every time a target application executes a CUDA driver call. In this callback:"}], "lineHeight": 0}}, "target": {"markdown": "清单 1 展示了一个简单的 NVBit 工具示例，该工具对每一条线程级指令的执行进行计数，并在应用程序结束时打印该计数值。清单 1 的第 11 行展示了注入函数的实现，该函数在每次执行时以原子方式递增一个 CUDA 托管变量（counter）。宏 NVBIT_EXPORT_DEV_FUNCTION（在 nvbit.h 内定义）是必要的，它可以防止编译器进行死代码消除，因为在大多数情况下，编译器会认为该注入函数未被使用。第 18 行注册了一个回调，每当目标应用程序执行 CUDA 驱动调用时都会触发该回调。在此回调中：", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 53}, {"source": {"block_id": "57b1ec87a685bf5eed9acede1a479aa1", "index": 54, "aliyun_index": 9, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "• We return immediately if we are not at the entry of a kernel\nlaunch CUDA driver call (Line 21).  \n\n", "text": "• We return immediately if we are not at the entry of a kernel\nlaunch CUDA driver call (Line 21).\n", "alignment": "left", "unique_id": "57b1ec87a685bf5eed9acede1a479aa1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "• We return immediately if we are not at the entry of a kernel"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false Scale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "}"}], "lineHeight": -691}}, "target": {"markdown": "```cpp\n/* NVBit 包含头文件，任何工具都必须包含它 */\n#include \"nvbit.h\"\n\n/* 用于对指令进行计数的计数器变量 */\n__managed__ long counter = 0;\n\n/* 用于跟踪已被插桩的内核 */\nstd::set<CUfunction> instrumented_kernels;\n\n/* 插桩函数的实现 */\nextern \"C\" __device__ __noinline__ void incr_counter() {\n    atomicAdd(&counter, 1);\n} NVBIT_EXPORT_DEV_FUNC(incr_counter);\n\n/* 在 CUDA 驱动调用时触发的回调 */\nvoid nvbit_at CUDA_driver_call(CUcontext ctx,\n                                    int is_exit, cbid_t cbid, const char *name,\n                                    void *params, CUresult *pStatus) {\n\n    /* 如果并非处于内核启动的入口处则直接返回 */\n    if (cbid != API_CUDA_cudaKernel || is_exit)\n        return;\n\n    /* 获取内核启动的参数 */\n    cuLaunchKernel_params *p = (cuLaunchKernel_params *) params;\n\n    /* 如果内核已经被插桩过则直接返回 */\n    if (!instrumented_kernels.insert(p->func).second)\n        return;\n\n    /* 对内核中的所有指令进行插桩 */\n    for (auto &i: nvbit_get_instrs(ctx, p->func)) {\n        nvbit_insert_call(i, \"incr_counter\", IPOINT_BEFORE);\n    }\n}\n\n/* 在应用程序终止时触发的回调 */\nvoid nvbit_at_term() {\n    cout << \"Total thread instructions \" << counter << \"\\n\";\n}\n```", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 55}, {"source": {"block_id": "dcf738b43d939b20641c2402c9349bf3", "index": 56, "aliyun_index": 11, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Listing 1: Simple example of an NVBit tool that counts every thread level instruction and prints the total when the application terminates.  \n\n", "text": "Listing 1: Simple example of an NVBit tool that counts every thread level instruction and prints the total when the application terminates.\n", "alignment": "left", "unique_id": "dcf738b43d939b20641c2402c9349bf3", "edited a96062715a2e8dca07", "index": 62, "aliyun_index": 17, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "This is a pedagogical, though fully functional example. NVBit allows users to write arbitrarily complicated tools. A skilled CUDA programmer could optimize this example using a variety of techniques, including instrumenting basic blocks, reducing a radix-tree of counters (perhaps one per thread block) or using warp-level reductions to improve the overhead of the instrumented binary.  \n\n", "text": "This is a pedagogical, though fully functional example. NVBit allows users to write arbitrarily complicated tools. A skilled CUDA programmer could optimize this example using a variety of techniques, including instrumenting basic blocks, reducing a radix-tree of counters (perhaps one per thread block) or using warp-level reductions to improve the overhead of the instrumented binary.\n", "alignment": "left", "unique_id": "8562594b75a00ba96062715a2e8dca07", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This is a pedagogical, though fully functional example. NVBit allows users to write arbitrarily complicated tools. A skilled CUDA programmer could optimize this example using a variety of techniques, including instrumenting basic blocks, reducing a radix-tree of counters (perhaps one per thread block) or using warp-level reductions to improve the overhead of the instrumented binary."}], "lineHeight": 0}}, "target": {"markdown": "这是一个用于教学的示例，尽管它功能完备。NVBit 允许用户编写任意复杂的工具。熟练的 CUDA 程序员可以使用多种技术来优化此示例，包括对基本块进行插桩、使用基数计数器树（例如每个线程块一个计数器）或使用 warp 级归约来降低插桩后二进制文件的开销。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 62}, {"source": {"block_id": "f65e09204d1628778c36e855f39b7a3c", "index": er": 64}, {"source": {"block_id": "bf42fe7ed443c71972587a9c5eab6ea9", "index": 65, "aliyun_index": 20, "page_num": 2, "type": "text", "sub_type": "none", "markdown": "Callback API: The Callback APIs are triggered by the NVBit core when a particular event in the target application is encountered. These events are application start or termination, and entry/exit of any CUDA driver API call. Listing 2 shows the callback  \n\n", "text": "Callback API: The Callback APIs are triggered by the NVBit core when a particular event in the target application is encountered. These events are application start or termination, and entry/exit of any CUDA driver API call. Listing 2 shows the callback\n", "alignment": "left", "unique_id": "bf42fe7ed443c71972587a9c5eab6ea9", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Callback API: The Callback APIs are triggered by the NVBit core when a particular event in the target application is encountered. These events are application start or termination, and entry/exit of any CUDA driver API call. Listing 2 shows the callback"}], "lineHeight": 0}}, "target": {"markdown": "回调 API：当目标应用程序中出现特定事件时，回调 API 会被 NVBit 核心触发。这些事件包括应用程序的启动或终止，以及任何 CUDA 驱动 API 调用的进入/退出。清单 2 展示了回调", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 65}, {"source": {"block_id": "4613d6b8b7250aab6e1e2f8a898a7cc4", "index": 66, "aliyun_index": 2, "page_num": 3, "type": "text", "sub_type": "none", "markdown": "c\n/* Triggered when the application starts/ends */\nvoid nvbit_at_init();\nvoid nvbit_at_term();\n/* Triggered at entry (is_exit=0) or exit (is_exit=1) of a CUDA\ndriver call named \"name\" (i.e. cuMemAlloc). The \"cbid\"\nidentifies the CUDA driver call (following the same\nenumeration used by CUPTI). \"Params\" is a pointer to the\nstructure of parameters used by the driver call, which needs\nto be casted to the correct struct for the specific \"cbid\".\n\"pStatus\" points to the return status value of the CUDA\ndriver call (valid only at exit) */\nvoid nvbit_at_cuda_driver_call(CUcontext ctx,\n        int is_exit, cbid_t cbid, const char* name,\n        void* params, CUresult* pStatus);  \n\n", "text": "c\n/* Triggered when the application starts/ends */\nvoid nvbit_at_init();\nvoid nvbit_at_term();\n/* Triggered at entry (is_exit=0) or exit (is_exit=1) of a CUDA\ndriver call named \"name\" (i.e. cuMemAlloc). The \"cbid\"\nidentifies the CUDA driver call (following the same\nenumeration used by CUPTI). \"Params\" is a pointer to the\nstructure of parameters used by the driver call, which needs\nto be casted to the correct struct for the specific \"cbid\".\n\"pStatus\" points to the return status value of the CUDA\ndriver call (valid only at exit) */\nvoid nvbit_at_cuda_driver_call(CUcontext ctx,\n        int is_exit, cbid_t cbid, const char* name,\n        void* params, CUresult* pStatus);\n", "alignment": "left", "unique_id": "4613d6b8b7250aab6e1e2f8a898a7cc4", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "c"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "/* Triggered when the application starts/ends */"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "void nvbit_at_init();"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "v _call(CUcontext ctx,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "        int is_exit, cbid_t cbid, const char* name,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "        void* params, CUresult* pStatus);"}], "lineHeight": -255}}, "target": {"markdown": "```c\n/* 在应用程序启动/结束时被触发 */\nvoid nvbit_at_init();\nvoid nvbit_at_term();\n/* 在名为 \"name\" 的 CUDA 驱动调用（即 cuMemAlloc）的入口\n（is_exit=0）或出口（is_exit=1）处被触发。\"cbid\" 用于标识\nCUDA 驱动调用（沿用 CUPTI 所使用的相同枚举）。\"params\" 是\n指向该驱动调用所使用参数结构的指针，需要根据具体的 \"cbid\"\n转换（cast）为对应的结构体。\"pStatus\" 指向 CUDA 驱动调用\n的返回状态值（仅在出口处有效） */\nvoid nvbit_at_cuda_driver_call(CUcontext ctx,\n        int is_exit, cbid_t cbid, const char* name,\n        void* params, CUresult* pStatus);\n```", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 66}, {"source": {"block_id": "f322b05990d6c4c4eb576a19d825e4ea", "index": 67, "aliyun_index": 3, "page_num": 3, "type": "title", "sub_type": "none", "markdown": "### Listing 2: Callback API: triggered at particular events.\n", "text": "Listing 2: Callback API: triggered at particular events.\n", "alignment": "left", "unique_id": "f322b05990d6c4c4eb576a19d825e4ea", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Listing 2: Callback API: triggered at particular events."}], "lineHeight": 0}}, "target": {"markdown": "### 清单 2：回调 API：在特定事件发生时被触发。\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 67
