ut instrumenting pre-compiled libraries.  \n\n", "text": "Figure 6: Address divergence analysis on ML workloads, with and without instrumenting pre-compiled libraries.\n", "alignment": "left", "unique_id": "41bb73a90d4b088979f82c71caf03466", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 6: Address divergence analysis on ML workloads, with and without instrumenting pre-compiled libraries."}], "lineHeight": 0}}, "target": {"markdown": "> 图 6：在 ML 工作负载上针对地址发散进行的分析，分别对比使用与不使用预编译库插桩时的结果。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 131}, {"source": {"block_id": "1c2e571dea4acbaa5255541b11892457", "index": 132, "aliyun_index": 7, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "type is global (Instr::GLOBAL). For those instructions and for each\nmemory reference operand (Instr::MREF) we inject the function\nifunc (Line 48) followed by the passing of the four arguments\n(Lines 49 to 52). Finally, at program termination we print the ratio\nbetween unique cache lines requested and total warp-level memory\ninstructions executed (Line 57). Listing 8 could have been imple-\nmented more efficiently by injecting, at most, one trampoline for\neach instruction and passing multiple references as arguments to\nthe function. However, for ease of implementation and discussion,\nwe opted for the simpler approach.  \n\n", "text": "type is global (Instr::GLOBAL). For those instructions and for each\nmemory reference operand (Instr::MREF) we inject the function\nifunc (Line 48) followed by the passing of the four arguments\n(Lines 49 to 52). Finally, at program termination we print the ratio\nbetween unique cache lines requested and total warp-level memory\ninstructions executed (Line 57). Listing 8 could have been imple-\nmented more efficiently by injecting, at most, one trampoline for\neach instruction and passing multiple references as arguments to\nthe function. However, for ease of implementation and discussion,\nwe opted for the simpler approach.\n", "alignment": "left", "unique_id": "1c2e571dea4acbaa5255541b11892457", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "type is global (Instr::GLOBAL). For those instructions and for each"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "memory reference operand (Instr::MREF) we inject the function"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "ifunc (Line 48) followed by the passing of the four arguments"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "(Lines 49 to 52). Finally, at program termination we print the ratio"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "between unique cache lines requested and total warp-level memory"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "instructions executed (Line 57). Listing 8 could have been imple-"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "mented more efficiently by injecting, at most, one trampoline for"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "each instruction and passing multiple references as arguments to"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "the function. However, for ease of implementation and discussion,"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "we opted for the simpler approach."}], "lineHeight": -267}}, "target": {"markdown": "type 为全局内存（Instr::GLOBAL）。对于这些指令，以及每个内存引用操作数（Instr::MREF），我们注入函数 ifunc（第 48 行），紧接着传入四个参数（第 49 至 52 行）。最后，在程序结束时，我们打印所请求的不同 cache line 数量与已执行的 warp 级别内存指令总数之比（第 57 行）。代码清单 8 本可以通过更高效的方式来实现，即对每条指令最多只插入一个跳板（trampoline），并将多个引用作为参数传递给函数。然而，为了便于实现和讨论，我们选择了相对简单的方法。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 132}, {"source": {"block_id": "b81a9bba431ee8f8c3b3fab0aa6e64dc", "index": 133, "aliyun_index": 8, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "We run the instrumentation tool in Listing 8 on a variety of Machine Learning (ML) workloads implemented in Torch7 [4] including AlexNet, ENet, GoogLeNet, ResNet and VGG on the ImageNet dataset[3]. These ML workloads use pre-compiled libraries developed by NVIDIA such as cuBLAS and cuDNN [29]. A compiler-based approach would not be able to capture the memory references emitted within those libraries, resulting in an incomplete analysis.  \n\n", "text": "We run the instrumentation tool in Listing 8 on a variety of Machine Learning (ML) workloads implemented in Torch7 [4] including AlexNet, ENet, GoogLeNet, ResNet and VGG on the ImageNet dataset[3]. These ML workloads use pre-compiled libraries developed by NVIDIA such as cuBLAS and cuDNN [29]. A compiler-based approach would not be able to capture the memory references emitted within those libraries, resulting in an incomplete analysis.\n", "alignment": "left", "unique_id": "b81a9bba431ee8f8c3b3fab0aa6e64dc", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "We run the instrumentation tool in Listing 8 on a variety of Machine Learning (ML) workloads implemented in Torch7 [4] including AlexNet, ENet, GoogLeNet, ResNet and VGG on the ImageNet dataset[3]. These ML workloads use pre-compiled libraries developed by NVIDIA such as cuBLAS and cuDNN [29]. A compiler-based approach would not be able to capture the memory references emitted within those libraries, resulting in an incomplete analysis."}], "lineHeight": 0}}, "target": {"markdown": "我们在代码清单 8 中的插桩工具上运行了多种机器学习（ML）工作负载，这些工作负载基于 Torch7 [4] 实现，包括 AlexNet、ENet、GoogLeNet、ResNet 和 VGG，运行的数据集为 ImageNet [3]。这些 ML 工作负载使用了由 NVIDIA 开发的预编译库，例如 cuBLAS 和 cuDNN [29]。基于编译器的方法无法捕获这些库内部发出的内存引用，从而导致分析结果不完整。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 133}, {"source": {"block_id": "dce06acd11ad846a21006afa6e2d8acd", "index": 134, "aliyun_index": 9, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "Figure 6 shows the results of our analysis in which we have first enabled and then disabled instrumentation of all the pre-compiled libraries. In our tool, by disabling instrumentation of the pre-compiled libraries we are reproducing the behavior of a possible compiler-based approach which does not have access to the libraries' source code. Excluding those libraries distorts reality and considerably overestimates the memory divergence of the applications.  \n\n", "text": "Figure 6 shows the results of our analysis in which we have first enabled and then disabled instrumentation of all the pre-compiled libraries. In our tool, by disabling instrumentation of the pre-compiled libraries we are reproducing the behavior of a possible compiler-based approach which does not have access to the libraries' source code. Excluding those libraries distorts reality and considerably overestimates the memory divergence of the applications.\n", "alignment": "left", "unique_id": "dce06acd11ad846a21006afa6e2d8acd", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 6 shows the results of our analysis in which we have first enabled and then disabled instrumentation of all the pre-compiled libraries. In our tool, by disabling instrumentation of the pre-compiled libraries we are reproducing the behavior of a possible compiler-based approach which does not have access to the libraries' source code. Excluding those libraries distorts reality and considerably overestimates the memory divergence of the applications."}], "lineHeight": 0}}, "target": {"markdown": "图 6 展示了我们的分析结果，其中我们首先启用，然后禁用了对所有预编译库的插桩。在我们的工具中，通过禁用对预编译库的插桩，我们复现了一种可能的基于编译器的方法的行为——该方法无法访问这些库的源代码。将这些库排除在外会扭曲实际情况，并显著高估应用程序的内存发散程度。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 134}, {"source": {"block_id": "c6fba6be388a458f8108653fd0bb00a8", "index": 135, "aliyun_index": 10, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "To understand the extent of this problem we have also applied an optimized version of the instruction count tool in Listing 1 and measured the percentage of instructions executed by these workloads inside pre-compiled libraries. This percentage ranges from 74% to 96%, and averages 88% of the total executed instructions across the various ML workloads. These accelerated libraries contain several hundreds of distinct kernels. For instance, cuBLAS has dozens of similar kernels with different precision levels and transpositions. Even having access to the libraries' source code it would require a significant amount of time to compile them. NVBit instead does not require source code and it works on any application binary that makes use of these libraries, applying instrumentation at run-time only on the kernels that are actually invoked.  \n\n", "text": "To understand the extent of this problem we have also applied an optimized version of the instruction count tool in Listing 1 and measured the percentage of instructions executed by these workloads inside pre-compiled libraries. This percentage ranges from 74% to 96%, and averages 88% of the total executed instructions across the various ML workloads. These accelerated libraries contain several hundreds of distinct kernels. For instance, cuBLAS has dozens of similar kernels with different precision levels and transpositions. Even having access to the libraries' source code it would require a significant amount of time to compile them. NVBit instead does not require source code and it works on any application binary that makes use of these libraries, applying instrumentation at run-time only on the kernels that are actually invoked.\n", "alignment": "left", "unique_id": "c6fba6be388a458f8108653fd0bb00a8", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To understand the extent of this problem we have also applied an optimized version of the instruction count tool in Listing 1 and measured the percentage of instructions executed by these workloads inside pre-compiled libraries. This percentage ranges from 74% to 96%, and averages 88% of the total executed instructions across the various ML workloads. These accelerated libraries contain several hundreds of distinct kernels. For instance, cuBLAS has dozens of similar kernels with different precision levels and transpositions. Even having access to the libraries' source code it would require a significant amount of time to compile them. NVBit instead does not require source code and it works on any application binary that makes use of these libraries, applying instrumentation at run-time only on the kernels that are actually invoked."}], "lineHeight": 0}}, "target": {"markdown": "为了深入理解这一问题的严重程度，我们还对代码清单 1 中的指令计数工具进行了优化，并基于该工具测量了这些工作负载在预编译库中所执行指令的占比。该比例介于 74% 到 96% 之间，在各种 ML 工作负载中平均占已执行指令总数的 88%。这些加速库中包含数百个不同的 kernel。例如，cuBLAS 拥有数十个针对不同精度和转置形式的相似 kernel。即使能够获得这些库的源代码，对其进行编译也需要耗费大量时间。而 NVBit 则无需源代码，它可以作用于任何使用这些库的应用程序二进制文件，并在运行时仅对实际被调用的那些 kernel 进行插桩。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 135}, {"source": {"block_id": "1d961c55480160088b7cf457efb06c1e", "index": 136, "aliyun_index": 11, "page_num": 7, "type": "title", "sub_type": "none", "markdown": "### 6.2 Kernel Sampling: Instruction Histogram\n", "text": "6.2 Kernel Sampling: Instruction Histogram\n", "alignment": "left", "unique_id": "1d961c55480160088b7cf457efb06c1e", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6.2 Kernel Sampling: Instruction Histogram"}], "lineHeight": 0}}, "target": {"markdown": "### 6.2 Kernel 采样：指令直方图\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 136}, {"source": {"block_id": "0c6c7577439732cbd2401c528e373558", "index": 137, "aliyun_index": 12, "page_num": 7, "type": "text", "sub_type": "none", "markdown": "While Section 5.2 showed the JIT-compilation overhead, additional overheads incur due to the execution of instrumented code. These overheads are not due to the NVBit framework itself, but instead  \n\n", "text": "While Section 5.2 showed the JIT-compilation overhead, additional overheads incur due to the execution of instrumented code. These overheads are not due to the NVBit framework itself, but instead\n", "alignment": "left", "unique_id": "0c6c7577439732cbd2401c528e373558", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While Section 5.2 showed the JIT-compilation overhead, additional overheads incur due to the execution of instrumented code. These overheads are not due to the NVBit framework itself, but instead"}], "lineHeight": 0}}, "target": {"markdown": "虽然第 5.2 节展示了 JIT 编译所带来的开销，但由于插桩后代码的执行，还会产生额外的开销。这些开销并非源自 NVBit 框架本身，而是", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 137}, {"source": {"block_id": "c23b1cbb9e5cf70cd62d3ea403759616", "index": 138, "aliyun_index": 2, "page_num": 8, "type": "figure", "sub_type": "none", "markdown": "![c23b1cbb9e5cf70cd62d3ea403759616.jpg](figures/c23b1cbb9e5cf70cd62d3ea403759616_7d12c10c.jpeg)  \n\n", "text": "# Instruction Type Distribution (% of Total Executed Instructions)\n\n| Instruction Type | % of total executed Instructions |\n|------------------|----------------------------------|\n| FFMA             | ~75%                             |\n| IADD3            | ~10%                             |\n| STS              | ~6%                              |\n| BRA.U            | ~1%                              |\n| R2P              | <1% (negligible)                 |\n\n## Chart Description\n\n- **X-axis**: `% of total executed Instructions` — ranges from 0% to 80%, with gridlines at every 10%.\n- **Y-axis**: `Instruction Type` — lists five instruction types in descending order of execution frequency.\n- **Bars**:\n  - **FFMA**: Longest bar, extending to approximately 75%.\n  - **IADD3**: Second longest, reaching about 10%.\n  - **STS**: Third, around 6%.\n  - **BRA.U**: Very short, near 1%.\n  - **R2P**: Shortest, barely visible (<1%).\n\n## Notes\n\n- The chart is a horizontal bar chart.\n- All percentages are approximate based on visual estimation from the axis scale.\n- “R2P” appears to represent a negligible fraction of total instructions.\n- No legend or additional annotations are present beyond axis labels and category names.\n\n\n\n此 Markdown 输出完整还原了图像中的数据结构、坐标轴含义、各指令类型及其对应百分比（估算值），并以表格+描述形式清晰呈现，符合信息抽取专家对结构化数据提取的要求。", "alignment": "left", "unique_id": "c23b1cbb9e5cf70cd62d3ea403759616", "edited": false, "extra": {}}, "target": {"markdown": "![c23b1cbb9e5cf70cd62d3ea403759616.jpg](figures/c23b1cbb9e5cf70cd62d3ea403759616_7d12c10c.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 138}, {"source": {"block_id": "a6288abb2c2889bdaee50d16fb375b10", "index": 139, "aliyun_index": 3, "page_num": 8, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 7: Top-5 instruction type executed on the SpecAccel:clvrleaf application, extracted with an NVBit tool.  \n\n", "text": "Figure 7: Top-5 instruction type executed on the SpecAccel:clvrleaf application, extracted with an NVBit tool.\n", "alignment": "left", "unique_id": "a6288abb2c2889bdaee50d16fb375b10", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 7: Top-5 instruction type executed on the SpecAccel:clvrleaf application, extracted with an NVBit tool."}], "lineHeight": 0}}, "target": {"markdown": "> 图 7：在 SpecAccel:clvrleaf 应用上所执行的前 5 类指令，由一个 NVBit 工具提取得出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 139}, {"source": {"block_id": "b438d5979364b70f6229096d238d0cc6", "index": 140, "aliyun_index": 4, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "are determined solely by how often the instrumented code is executed and by how complex each instrumented call is. Naturally, instrumentation that is more invasive or computationally intensive at each instrumentation site will slow down the application more. One way to reduce the execution overhead, is to write highly optimized instrumentation functions by following the same optimization rules that apply to any CUDA program. NVBit can also mitigate this overhead by using standard techniques such as sampling to reduce the frequency of instrumentation callbacks. This section shows how NVBit can implement sampling by allowing a user to select (at run-time) whether a kernel runs its instrumented or uninstrumented version.  \n\n", "text": "are determined solely by how often the instrumented code is executed and by how complex each instrumented call is. Naturally, instrumentation that is more invasive or computationally intensive at each instrumentation site will slow down the application more. One way to reduce the execution overhead, is to write highly optimized instrumentation functions by following the same optimization rules that apply to any CUDA program. NVBit can also mitigate this overhead by using standard techniques such as sampling to reduce the frequency of instrumentation callbacks. This section shows how NVBit can implement sampling by allowing a user to select (at run-time) whether a kernel runs its instrumented or uninstrumented version.\n", "alignment": "left", "unique_id": "b438d5979364b70f6229096d238d0cc6", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "are determined solely by how often the instrumented code is executed and by how complex each instrumented call is. Naturally, instrumentation that is more invasive or computationally intensive at each instrumentation site will slow down the application more. One way to reduce the execution overhead, is to write highly optimized instrumentation functions by following the same optimization rules that apply to any CUDA program. NVBit can also mitigate this overhead by using standard techniques such as sampling to reduce the frequency of instrumentation callbacks. This section shows how NVBit can implement sampling by allowing a user to select (at run-time) whether a kernel runs its instrumented or uninstrumented version."}], "lineHeight": 0}}, "target": {"markdown": "", "status": "failed", "skip_reason": null, "skip_kind": null, "model_name": null, "error": "译文为空", "edited": false}, "comments": [], "display_order": 140}, {"source": {"block_id": "2054053e84230cabf06eb42888e0a0c3", "index": 141, "aliyun_index": 5, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "In this example we use sampling as follows. We instrument all the kernels, but we launch the instrumented version only once for each set of unique grid dimension values. For instance, if a kernel foo is launched 100 times with grid dimensions  $ \\{128,128,1\\} $  and 50 times with grid dimensions  $ \\{64,64,64\\} $  we run the instrumented version of foo only twice, once for each unique grid dimension. For the remaining 148 times we run foo uninstrumented. We perform this selection by using the NVBit API nvbit_enable_instrumented within our instrumentation tool before a kernel is launched. We then use the information collected during the instrumented kernel execution to approximate the information not collected during the uninstrumented execution.  \n\n", "text": "In this example we use sampling as follows. We instrument all the kernels, but we launch the instrumented version only once for each set of unique grid dimension values. For instance, if a kernel foo is launched 100 times with grid dimensions  $ \\{128,128,1\\} $  and 50 times with grid dimensions  $ \\{64,64,64\\} $  we run the instrumented version of foo only twice, once for each unique grid dimension. For the remaining 148 times we run foo uninstrumented. We perform this selection by using the NVBit API nvbit_enable_instrumented within our instrumentation tool before a kernel is launched. We then use the information collected during the instrumented kernel execution to approximate the information not collected during the uninstrumented execution.\n", "alignment": "left", "unique_id": "2054053e84230cabf06eb42888e0a0c3", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "In this example we use sampling as follows. We instrument all the kernels, but we launch the instrumented version only once for each set of unique grid dimension values. For instance, if a kernel foo is launched 100 times with grid dimensions  $ \\{128,128,1\\} $  and 50 times with grid dimensions  $ \\{64,64,64\\} $  we run the instrumented version of foo only twice, once for each unique grid dimension. For the remaining 148 times we run foo uninstrumented. We perform this selection by using the NVBit API nvbit_enable_instrumented within our instrumentation tool before a kernel is launched. We then use the information collected during the instrumented kernel execution to approximate the information not collected during the uninstrumented execution."}], "lineHeight": 0}}, "target": {"markdown": "在本例中，我们按如下方式进行采样。我们对所有 kernel 进行插桩，但针对每一组唯一的网格维度（grid dimension）值，插桩后的版本仅启动一次。例如，若 kernel foo 以网格维度  $ \\{128,128,1\\} $  被启动 100 次，并以网格维度  $ \\{64,64,64\\} $  被启动 50 次，则我们针对每组唯一的网格维度仅运行一次插桩后的 foo 版本。对于其余 148 次启动，则以非插桩方式运行 foo。我们在插桩工具中，于 kernel 启动之前通过调用 NVBit API `nvbit_enable_instrumented` 来进行这种选择。随后，我们利用在插桩 kernel 执行过程中所收集的信息，来近似估计在非插桩执行中未被收集到的信息。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 141}, {"source": {"block_id": "1075731a1b0ca4afe09b9103ab400ffb", "index": 142, "aliyun_index": 6, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "To highlight this approach, we used an instrumentation tool that performs an analysis of all the instructions executed to construct a histogram of the Top-5 instructions executed like the one in Figure 7. We used the OpenACC SpeccAccel benchmarks [34] selecting large problem sizes, requiring several minutes of execution time for each benchmark on a NVIDIA TITAN V GPU [31]. Running full instrumentation for the entire application could result in very long execution time, yielding up to 112× slowdown and approaching 24 hours for the longest benchmark in this test.  \n\n", "text": "To highlight this approach, we used an instrumentation tool that performs an analysis of all the instructions executed to construct a histogram of the Top-5 instructions executed like the one in Figure 7. We used the OpenACC SpeccAccel benchmarks [34] selecting large problem sizes, requiring several minutes of execution time for each benchmark on a NVIDIA TITAN V GPU [31]. Running full instrumentation for the entire application could result in very long execution time, yielding up to 112× slowdown and approaching 24 hours for the longest benchmark in this test.\n", "alignment": "left", "unique_id": "1075731a1b0ca4afe09b9103ab400ffb", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "To highlight this approach, we used an instrumentation tool that performs an analysis of all the instructions executed to construct a histogram of the Top-5 instructions executed like the one in Figure 7. We used the OpenACC SpeccAccel benchmarks [34] selecting large problem sizes, requiring several minutes of execution time for each benchmark on a NVIDIA TITAN V GPU [31]. Running full instrumentation for the entire application could result in very long execution time, yielding up to 112× slowdown and approaching 24 hours for the longest benchmark in this test."}], "lineHeight": 0}}, "target": {"markdown": "为了突出展示这种做法，我们使用了一个插桩工具，对所有已执行的指令进行分析，以构建如图 7 所示的、按执行次数排序的前 5 类指令直方图。我们采用了 OpenACC SpeccAccel 基准测试集 [34]，并选用较大的问题规模，使得每个基准测试在 NVIDIA TITAN V GPU [31] 上都需要数分钟的运行时间。对整个应用程序进行完整的插桩可能导致非常长的执行时间，最坏情况下会出现高达 112 倍的减速，并且在本次测试中最长的基准测试运行时间将近 24 小时。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 142}, {"source": {"block_id": "32958fcc2531c3234f4e302e4832d3e1", "index": 143, "aliyun_index": 7, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Figure 8 shows the slowdown of both the full instrumentation approach and the sampling approach with respect to native execution. On average the full instrumentation approach is 36.4× slower than native execution, while the sampling approach incurs in only 2.3× slowdown. Although targeting the same applications, Figure 8 and Figure 5 cannot be directly compared because Figure 5 represents only the JIT-compilation overhead (cost of generating the instrumented code). As explained in Section 5.2, JIT-compilation overhead is independent of the content of the injected functions, and depend primarily on how many jumps and trampolines are generated.  \n\n", "text": "Figure 8 shows the slowdown of both the full instrumentation approach and the sampling approach with respect to native execution. On average the full instrumentation approach is 36.4× slower than native execution, while the sampling approach incurs in only 2.3× slowdown. Although targeting the same applications, Figure 8 and Figure 5 cannot be directly compared because Figure 5 represents only the JIT-compilation overhead (cost of generating the instrumented code). As explained in Section 5.2, JIT-compilation overhead is independent of the content of the injected functions, and depend primarily on how many jumps and trampolines are generated.\n", "alignment": "left", "unique_id": "32958fcc2531c3234f4e302e4832d3e1", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 8 shows the slowdown of both the full instrumentation approach and the sampling approach with respect to native execution. On average the full instrumentation approach is 36.4× slower than native execution, while the sampling approach incurs in only 2.3× slowdown. Although targeting the same applications, Figure 8 and Figure 5 cannot be directly compared because Figure 5 represents only the JIT-compilation overhead (cost of generating the instrumented code). As explained in Section 5.2, JIT-compilation overhead is independent of the content of the injected functions, and depend primarily on how many jumps and trampolines are generated."}], "lineHeight": 0}}, "target": {"markdown": "图 8 展示了完整插桩方法与采样方法相对于原生执行的减速情况。平均而言，完整插桩方法相比原生执行慢了 36.4 倍，而采样方法仅产生 2.3 倍的减速。尽管图 8 与图 5 针对的是同一组应用程序，但二者无法直接进行比较，因为图 5 仅表示 JIT 编译所带来的开销（即生成插桩代码的成本）。正如第 5.2 节所解释的，JIT 编译开销与所注入函数的内容无关，而主要取决于所生成的跳转和跳板（trampoline）的数量。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 143}, {"source": {"block_id": "2ce9e45656e779b7e7903ab2fdcec1d4", "index": 144, "aliyun_index": 8, "page_num": 8, "type": "figure", "sub_type": "none", "markdown": "![2ce9e45656e779b7e7903ab2fdcec1d4.jpg](figures/2ce9e45656e779b7e7903ab2fdcec1d4_4241746c.jpeg)  \n\n", "text": "以下是根据您提供的柱状图内容提取并整理成的合法 Markdown 格式，准确保留所有标签、数据系列、坐标轴信息和视觉细节：\n\n---\n\n# Performance Slowdown Comparison: Instrumented vs Sampled Runs\n\n## Chart Description\n\nThis bar chart compares the **slowdown** (in arbitrary units, up to 120) across multiple benchmarks when running two different instrumentation modes:\n\n- **Blue bars**: `run all instrumented`\n- **Orange bars**: `run only sample`\n\nThe x-axis lists benchmark names. The y-axis represents “Slowdown” from 0 to 120.\n\n---\n\n## Data Extraction (Approximate Values from Visual Inspection)\n\n| Benchmark     | run all instrumented (blue) | run only sample (orange) |\n|---------------|-----------------------------|--------------------------|\n| ostencil      | ~45                         | ~0                       |\n| olbm          | ~1                          | ~0                       |\n| omriq         | ~8                          | ~0                       |\n| md            | ~110                        | ~0                       |\n| palm          | ~27                         | ~6                       |\n| ep            | ~26                         | ~0                       |\n| clvleaf       | ~45                         | ~5                       |\n| cg            | ~95                         | ~0                       |\n| seismic       | ~33                         | ~6                       |\n| sp            | ~8                          | ~0                       |\n| csp           | ~12                         | ~0                       |\n| miniGhost     | ~53                         | ~0                       |\n| ilbdc         | ~2                          | ~0                       |\n| swim          | ~40                         | ~0                       |\n| average       | ~37                         | ~2                       |\n\n> ️ Note: All values are estimated visually from the chart. Orange bars are generally near zero except for `palm`, `clvleaf`, `seismic`, and `average`.\n\n---\n\n## Legend\n\n- 🟦 Blue: `run all instrumented`\n- 🟧 Orange: `run only sample`\n\n---\n\n## Observations\n\n- The highest slowdown occurs in benchmark `md` under full instrumentation (~110).\n- Most benchmarks show negligible or zero slowdown under “run only sample”.\n- A few benchmarks (`palm`, `clvleaf`, `seismic`) exhibit small but measurable slowdowns under sampling mode.\n- The “average” row shows a moderate slowdown under full instrumentation (~37) and minimal under sampling (~2).\n\n---\n\n## Axis Labels\n\n- **Y-axis**: “Slowdown” — scale from 0 to 120, with gridlines at intervals of 20.\n- **X-axis**: List of 15 benchmark identifiers + “average”.\n\n---\n\n## Formatting Notes\n\n- Bars are grouped by benchmark; blue always on left, orange on right within each group.\n- No error bars or confidence intervals shown.\n- Font is sans-serif; legend positioned top-right.\n\n---\n\n✅ This Markdown representation preserves structure, semantics, and approximate quantitative data as visible in the original image. Suitable for documentation, reporting, or further analysis.\n\n--- \n\nLet me know if you’d like this exported as CSV, JSON, or rendered as an actual plot using Python/Matplotlib!", "alignment": "left", "unique_id": "2ce9e45656e779b7e7903ab2fdcec1d4", "edited": false, "extra": {}}, "target": {"markdown": "![2ce9e45656e779b7e7903ab2fdcec1d4.jpg](figures/2ce9e45656e779b7e7903ab2fdcec1d4_4241746c.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 144}, {"source": {"block_id": "03c6937f05ccf08e816bca3 tencil`, `olbm`, ..., `swim`，以及最后的 `average`。\n- 纵轴标题为 “Error”，单位是百分比（%）。\n- 所有柱子均为橙色，高度对应错误率数值。\n- 多个基准（如 `ostencil`, `omriq`, `md`, `cg`, `sp`, `csp`, `miniGhost`, `ilbdc`, `swim`）错误率为 0.0%，即无误差。\n- 最高错误率出现在 `seismic`（2.7%）和 `olbm`（2.6%）。\n- 平均值 `average = 0.56%` 可能是对所有 14 个基准（不含 average 自身）的算术平均，或对非零项加权平均 —— 但图中未明确计算方式，仅作为汇总展示。\n\n此 Markdown 表格可直接用于文档、报告或网页渲染，完整还原原始图表信息。", "alignment": "left", "unique_id": "a4e892ff3f63f4da333cb47cc417a3ce", "edited": false, "extra": {}}, "target": {"markdown": "![a4e892ff3f63f4da333cb47cc417a3ce.jpg](figures/a4e892ff3f63f4da333cb47cc417a3ce_ed5ba7eb.jpeg)  \n\n", "status": "skipped", "skip_reason": "deterministic:type:figure", "skip_kind": "deterministic", "model_name": null, "error": null, "edited": false}, "comments": [], "display_order": 146}, {"source": {"block_id": "a3a9c3832cc2f00476fa1cfab7e65191", "index": 147, "aliyun_index": 11, "page_num": 8, "type": "figure_name", "sub_type": "none", "markdown": ">Figure 9: Error for kernel sampling with respect to full instrumentation, reported as a single number for each benchmark averaged across instruction categories.  \n\n", "text": "Figure 9: Error for kernel sampling with respect to full instrumentation, reported as a single number for each benchmark averaged across instruction categories.\n", "alignment": "left", "unique_id": "a3a9c3832cc2f00476fa1cfab7e65191", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Figure 9: Error for kernel sampling with respect to full instrumentation, reported as a single number for each benchmark averaged across instruction categories."}], "lineHeight": 0}}, "target": {"markdown": "> 图 9：kernel 采样相对于完整插桩的误差，以每个基准测试在各指令类别上的平均值作为一个数值给出。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 147}, {"source": {"block_id": "e80f1976facc50e47a81cc08d9410b67", "index": 148, "aliyun_index": 12, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "The speedup of the sampling approach comes with a possible decrease of accuracy. Figure 9 shows the error for the kernel sampling approach, reported as a single number for each benchmark averaged across instruction categories. The error is computed comparing with the results collected without sampling which are by definition exact. Using this sampling technique results in an average error less than 0.6%. For this particular combination of sampling approach and instrumentation tool the sampling error depends on the control flow characteristics of the kernels executed. If the control flow of a kernel does not change based on the values computed, but it is only a function of the grid dimensions, the sampling error is 0%. Many applications have this property because they operate on grids or meshes in which the computed values do not alter the control flow properties of the algorithms.  \n\n", "text": "The speedup of the sampling approach comes with a possible decrease of accuracy. Figure 9 shows the error for the kernel sampling approach, reported as a single number for each benchmark averaged across instruction categories. The error is computed comparing with the results collected without sampling which are by definition exact. Using this sampling technique results in an average error less than 0.6%. For this particular combination of sampling approach and instrumentation tool the sampling error depends on the control flow characteristics of the kernels executed. If the control flow of a kernel does not change based on the values computed, but it is only a function of the grid dimensions, the sampling error is 0%. Many applications have this property because they operate on grids or meshes in which the computed values do not alter the control flow properties of the algorithms.\n", "alignment": "left", "unique_id": "e80f1976facc50e47a81cc08d9410b67", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "The speedup of the sampling approach comes with a possible decrease of accuracy. Figure 9 shows the error for the kernel sampling approach, reported as a single number for each benchmark averaged across instruction categories. The error is computed comparing with the results collected without sampling which are by definition exact. Using this sampling technique results in an average error less than 0.6%. For this particular combination of sampling approach and instrumentation tool the sampling error depends on the control flow characteristics of the kernels executed. If the control flow of a kernel does not change based on the values computed, but it is only a function of the grid dimensions, the sampling error is 0%. Many applications have this property because they operate on grids or meshes in which the computed values do not alter the control flow properties of the algorithms."}], "lineHeight": 0}}, "target": {"markdown": "采样方法带来的加速可能伴随着精度的下降。图 9 展示了 kernel 采样方法的误差，以每个基准测试在各指令类别上的平均值作为一个数值给出。该误差是通过与未采用采样时所收集的结果（其结果在定义上是精确的）进行比较而计算得出的。使用这种采样技术所产生的平均误差小于 0.6%。对于这种采样方法与插桩工具的特定组合而言，采样误差取决于所执行 kernel 的控制流特性。如果一个 kernel 的控制流并不随计算所得的值而变化，而仅由网格维度决定，那么其采样误差为 0%。许多应用程序都具有这一特性，因为它们作用于网格或网格划分（mesh）之上，其中计算所得的值并不会改变算法的控制流特性。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 148}, {"source": {"block_id": "9c8a23ce354d1e0aa77681210c5f7f5d", "index": 149, "aliyun_index": 13, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "Depending on the target applications and instrumentation tool, more advanced sampling techniques such as adaptive statistical profiling [10, 41] can be implemented using the underlying mechanisms presented in this section.  \n\n", "text": "Depending on the target applications and instrumentation tool, more advanced sampling techniques such as adaptive statistical profiling [10, 41] can be implemented using the underlying mechanisms presented in this section.\n", "alignment": "left", "unique_id": "9c8a23ce354d1e0aa77681210c5f7f5d", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "Depending on the target applications and instrumentation tool, more advanced sampling techniques such as adaptive statistical profiling [10, 41] can be implemented using the underlying mechanisms presented in this section."}], "lineHeight": 0}}, "target": {"markdown": "根据目标应用程序与插桩工具的不同，可以使用诸如自适应统计剖析（adaptive statistical profiling）[10, 41] 等更为高级的采样技术，并通过本节所介绍的基本机制加以实现。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 149}, {"source": {"block_id": "ba1fdc5ae00b4a3a6a120caf85b0bc50", "index": 150, "aliyun_index": 14, "page_num": 8, "type": "title", "sub_type": "none", "markdown": "### 6.3 Instruction Emulation: Warp-wide FFT\n", "text": "6.3 Instruction Emulation: Warp-wide FFT\n", "alignment": "left", "unique_id": "ba1fdc5ae00b4a3a6a120caf85b0bc50", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "6.3 Instruction Emulation: Warp-wide FFT"}], "lineHeight": 0}}, "target": {"markdown": "### 6.3 指令模拟：Warp 级 FFT\n", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 150}, {"source": {"block_id": "5c016acdce263be42ca24e243cb027a7", "index": 151, "aliyun_index": 15, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "While NVBit's instrumentation is semantic-preserving by default, we now demonstrate how to use NVBit's Device API (Listing 7) to modify ISA-visible state. Prior art has used similar functionality to study fault injection [9] and automatic type conversion [16]. This section discusses instruction emulation, typically employed for architectural exploration and pre-silicon compiler testing.  \n\n", "text": "While NVBit's instrumentation is semantic-preserving by default, we now demonstrate how to use NVBit's Device API (Listing 7) to modify ISA-visible state. Prior art has used similar functionality to study fault injection [9] and automatic type conversion [16]. This section discusses instruction emulation, typically employed for architectural exploration and pre-silicon compiler testing.\n", "alignment": "left", "unique_id": "5c016acdce263be42ca24e243cb027a7", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "While NVBit's instrumentation is semantic-preserving by default, we now demonstrate how to use NVBit's Device API (Listing 7) to modify ISA-visible state. Prior art has used similar functionality to study fault injection [9] and automatic type conversion [16]. This section discusses instruction emulation, typically employed for architectural exploration and pre-silicon compiler testing."}], "lineHeight": 0}}, "target": {"markdown": "虽然 NVBit 的插桩在默认情况下是保持语义的（semantic-preserving），但我们现在演示如何利用 NVBit 的设备端 API（Device API）（见代码清单 7）来修改 ISA 可见的状态。此前已有研究使用类似功能来研究故障注入（fault injection）[9] 和自动类型转换（automatic type conversion）[16]。本节将讨论指令模拟（instruction emulation），该方法通常用于架构探索（architectural exploration）以及硅前编译器测试（pre-silicon compiler testing）。", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 151}, {"source": {"block_id": "47cd22575cb85a46dd630ca340f3d538", "index": 152, "aliyun_index": 16, "page_num": 8, "type": "text", "sub_type": "none", "markdown": "This section demonstrates a hypothetical warp-wide (32-point)\nFFT instruction named WFFT32. Listing 9 shows an NVBit tool that  \n\n", "text": "This section demonstrates a hypothetical warp-wide (32-point)\nFFT instruction named WFFT32. Listing 9 shows an NVBit tool that\n", "alignment": "left", "unique_id": "47cd22575cb85a46dd630ca340f3d538", "edited": false, "extra": {"firstLinesChars": 0, "blocks": [{"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "This section demonstrates a hypothetical warp-wide (32-point)"}, {"style": {"fontName": "宋体", "charScale": 1.0, "color": "000000", "underline": false, "deleteLine": false, "fontSize": 0, "bold": false, "italic": false}, "text": "FFT instruction named WFFT32. Listing 9 shows an NVBit tool that"}], "lineHeight": -52}}, "target": {"markdown": "本节演示一个假设的 warp 级（32 点）FFT 指令，命名为 WFFT32。代码清单 9 展示了一个 NVBit 工具，该工具", "status": "translated", "skip_reason": null, "skip_kind": null, "model_name": "MiniMax-M3", "error": null, "edited": false}, "comments": [], "display_order": 152}, {"source": {"block_id": "a2f5d545839fa2008924b4a2be7b8500", "index": 153, "aliyun_index": 2, "page_num": 9, "type": "text", "sub_type": "none", "markdown": "```c\n/* Compute a 32-point warp-wide FFT (across lanes) */\nextern \"C\" __device__ noinline_\nvoid wfft32_emu(int reg_dst_num, int reg_src_num) {\n    /* Read input register */\n    long in = nvbit_read_reg64(reg_src_num),\n    /* Implementation of the warp-wide FFT function */\n    shuffle_fft_warp(in, out);\n    /* Write value in destination registers */\n    nvbit_write_reg64(reg_dst_num, out);\n}
